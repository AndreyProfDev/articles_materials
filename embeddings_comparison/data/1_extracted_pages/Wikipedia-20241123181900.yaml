      \ międzykulturowa]] – [[bariera kulturowa]] – [[dostęp do kultury]]\n* [[akulturacja]]\
      \ – [[kontrakulturacja]] – [[transkulturacja]] – [[rekulturacja]] – [[synkretyzm]]\n\
