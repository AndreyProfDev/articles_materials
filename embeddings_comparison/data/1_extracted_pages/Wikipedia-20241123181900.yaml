- sections:
  - content: "{{dopracować|źródła=2021-11}}\n'''Retro''' – termin używany do określania\
      \ elementów współczesnej kultury, które pochodzą lub są świadomą imitacją trendów\
      \ w modzie, światopoglądzie, zachowaniu z niedalekiej przeszłości, a które są\
      \ obecnie uznawane za niemodne<ref>{{Cytuj |tytuł = retro – Słownik języka polskiego\
      \ PWN |data dostępu = 2022-04-24 |opublikowany = sjp.pwn.pl |url = https://sjp.pwn.pl/sjp/retro;2574143.html\
      \ |język = pl}}</ref>.\n{{Wikicytaty|na temat kultury retro}}\n\n== Pochodzenie\
      \ ==\nSłowo ''retro'' pochodzi od [[łacina|łacińskiego]] [[Przedrostek|przedrostka]]\
      \ retro-, który dosłownie oznacza ''wstecz'' lub ''w przeszłości'', zwłaszcza\
      \ w takich słowach jak ''retrospektywny''<ref>{{Cytuj |tytuł = retrospekcja\
      \ – Słownik języka polskiego PWN |data dostępu = 2022-04-24 |opublikowany =\
      \ sjp.pwn.pl |url = https://sjp.pwn.pl/sjp/retrospekcja;2574149.html |język\
      \ = pl}}</ref>, czyli odnoszący się do nostalgicznego lub krytycznego spojrzenia\
      \ w przeszłość.\n\nW okresie powojennym słowo to nabrało nowego znaczenia z\
      \ chwilą pojawienia się określenia ''[[retrorocket]]'' oznaczającego rakietę\
      \ hamującą (skrót od ''retrograde rocket'', czyli rakiety, która jest wystrzeliwana\
      \ w kierunku przeciwnym do ruchu [[Statek kosmiczny|statku kosmicznego]]), używaną\
      \ w latach 60. XX wieku w [[Stany Zjednoczone|amerykańskim]] programie kosmicznym.\
      \ We [[Francja|Francji]] słowo ''rétro'', to skrót od francuskiego ''rétrospectif'',\
      \ weszło do obiegu i osiągnęło popularność, gdy zaczęto powtórnie oceniać postać\
      \ [[Charles de Gaulle|Charles'a de Gaulle’a]] i rolę Francji w [[II wojna światowa|II\
      \ wojnie światowej]]. Francuska [[Moda (styl)|moda]] retro z lat 70. XX wieku\
      \ w filmach i opowiadaniach poddała ocenie postępowanie francuskich cywili w\
      \ czasie okupacji hitlerowskiej. Wkrótce potem terminu retro zaczęto używać\
      \ w odniesieniu do francuskiej mody, która odwoływała się do tego okresu.\n\n\
      Zaraz potem termin ten został wprowadzony do [[Język angielski|języka angielskiego]]\
      \ za pośrednictwem mody i kultury popularnej, gdzie kojarzy się raczej z cynicznym\
      \ powrotem starszych trendów. (Elizabeth E. Guffey, ''Retro: The Culture of\
      \ Revival'', s. 9-22). [[Jean Baudrillard]], francuski myśliciel, w swojej książce\
      \ ''Symulakry i symulacja'' określa słowo ''retro'' jako demitologizację [[Przeszłość|przeszłości]],\
      \ oddalanie [[Teraźniejszość|teraźniejszości]] od istotnych poglądów, które\
      \ kierowały erą nowożytną (Jean Baudrillard, ''Symulakry i symulacja'', s. 43.).\n\
      \n== Użycie słowa ==\nSłowo ''retro'' używane jest często w znaczeniu pozytywnym,\
      \ w odniesieniu do: \n\n* współczesnego światopoglądu np. [[konserwatyzm]]u\
      \ społecznego, stosunku do nauczania domowego, podziału ról między [[Kobieta|kobietą]]\
      \ i [[Mężczyzna|mężczyzną]], czy też ''campowej'' estetyki, która reprezentuje\
      \ ironiczne podejście do rzeczywistości przejawiające się otwartym i celowym\
      \ wprowadzaniem przestarzałych elementów zarówno do stylu ubierania, jak i sposobu\
      \ bycia;\n* współczesnych przedmiotów cechujących się [[design]]em lub [[Funkcjonalność|funkcjonalnością]],\
      \ która bezpośrednio odnosi się do przedmiotów produkowanych dawniej, a także\
      \ niektóre nurty w sztuce, np. muzyka retro, moda retro.\n\nSłowo ''retro''\
      \ często używane jest błędnie w odniesieniu do oryginalnych, starszych przedmiotów\
      \ (np. ubiorów), które same w sobie nie są przedmiotami ''retro'', choć aktywność\
      \ związana z korzystaniem z nich obecnie jest ''retro-aktywnością''. W szczególności\
      \ błędnym jest używanie słowa ''retro'' jako synonimu słowa ''stary'', ''klasyczny'',\
      \ ''antyczny'' czy ''[[vintage]]''. \n\nWyjątkowe umiłowanie do stylu retro\
      \ jest nazywane ''retrofilią''. \n\n== Odmiany Retro ==\n[[Plik:Retro Jokers\
      \ Melodka 2.jpg|mały|Grupa Retro Jockers, stylizowana na The Beatles]]\n\n===\
      \ Muzyka retro ===\nW latach 80. XX wieku, retro odnosiło się do nowego gatunku\
      \ muzyki, a w szczególności do muzyki [[dance]], popularnej w owym czasie w\
      \ [[Stany Zjednoczone|Stanach Zjednoczonych]]. Początkowo określano ją mianem\
      \ [[Nowa fala (muzyka)|nowej fali]], która częściowo wywodziła się z gatunku\
      \ [[punk rock]]a z późnych lat 70. i wczesnych lat 80. XX wieku oraz gatunku\
      \ psychedelic trance z późnych lat 60. i 70. Wiele spośród piosenek oraz albumów\
      \ określanych w tamtym czasie mianem retro pojawiło się przy okazji wielkiego\
      \ postępu w rozwoju elektronicznego tworzenia muzyki, czyli za pomocą komputera,\
      \ sprzętu elektronicznego bądź za pomocą instrumentów elektromechanicznych.\
      \ Poglądy na to, jak obszerna jest kategoria muzyki retro, są zróżnicowane.\
      \ Jednak ani cała muzyka, ani nawet cała muzyka dance z lat 80., nie była uważana\
      \ za muzykę retro. Obecnie era retro jest umieszczana w ramach czasowych pomiędzy\
      \ rokiem 1966, kiedy to [[The Beatles]] wydali piosenki ''Rain'' oraz ''Tomorrow\
      \ Never Knows'', i 1997, kiedy to [[Kalifornia]] jako ostatni stan zdelegalizowała\
      \ [[Dietyloamid kwasu lizergowego|LSD]].\n\nPo 2000 roku zaczęły powstawać gatunki\
      \ stylizowane na retro, tj.:\n\n* retro-metal, kiedy to wzrosła popularność\
      \ muzyki [[Hard rock|hardrockowej]] łączącej w sobie elementy muzyki poważnej,\
      \ psychedelia trance, [[heavy metal]]u oraz nowoczesnego hard rocka. Zyskały\
      \ szczególny rozgłos wśród pokoleń X i Y (osób, które urodziły się między 1965\
      \ a 1995 rokiem). Najważniejszymi zespołami tworzącymi w tym nurcie są Wolfmother,\
      \ The Sword, Jet i Buckcherry, które osiągnęły sukces, stosując styl i metody\
      \ dawnych zespołów, takich jak Led Zeppelin, Black Sabbath, The Jimi Hendrix\
      \ Experience, [[The Beatles]] oraz [[Pink Floyd]]. Podczas gdy siła tego ''nurtu''\
      \ była podważana przez niektórych krytyków muzycznych, ''retro''- lub ''heritage\
      \ metal'' stało się powszechnym terminem na określenie modnego [[hard rock]]a.\
      \ ''Retro'' to również siódmy album duńskiego zespołu [[Death metal|deathmetalowego]]\
      \ [[Illdisposed]], wydany w [[2000 w muzyce|2000]] roku. Zawiera 11 utworów,\
      \ wszystkie są [[cover]]ami. Zespół wykonuje tu piosenki takich zespołów jak\
      \ [[AC/DC]], [[Motörhead|Motorhead]], [[Death (zespół deathmetalowy)|Death]]\
      \ i innych;\n* [[synthwave]], który czerpie inspirację z muzyki elektronicznej,\
      \ oraz muzyki z gier i filmów lat 80.;\n* psychedelic trance;\n* vaporwave.\n\
      \n[[Plik:Gramofon 2 ubt.jpeg|mały|Gramofon]]\n''Retro'' w muzyce obejmuje również\
      \ używanie starego [[Sygnał analogowy|analogowego]] oraz [[Sygnał cyfrowy|cyfrowego]]\
      \ sprzętu audio, tj. [[gramofon]]y, [[Magnetofon szpulowy|magnetofony szpulowe]]\
      \ i [[Magnetofon kasetowy|kasetowe]], [[Odtwarzacz CD|odtwarzacze CD]] oraz\
      \ przestarzałych nośników dźwięku, np. [[Płyta gramofonowa|płyt winylowych]],\
      \ [[Taśma magnetyczna|taśm]] i [[Kaseta magnetofonowa|kaset magnetofonowych]],\
      \ [[Płyta kompaktowa|płyt CD]]. Przyczyn powrotu do dawnych metod odtwarzania\
      \ dźwięku upatruje się w [[Wydawnictwo muzyczne|wytwórniach płytowych]], walczących\
      \ z [[Piractwo medialne|piractwem w Internecie]]. Wydawanie [[Album (wydawnictwo\
      \ muzyczne)|albumów]] na przestarzałych nośnikach, głównie na płytach winylowych,\
      \ ma za zadanie utrudnić nieautoryzowanie kopiowanie zawartych na nich treści.\
      \ Inną przyczyną może być chęć osiągnięcia najlepszej jakości dźwięku, tzw.\
      \ ''[[Hi-fi|high fidelity]]''; która to wraz z popularyzacją serwisów streamingowych,\
      \ tj. [[Spotify]] lub [[iTunes]], przestała być priorytetem dla firm udostępniających\
      \ muzykę w Internecie<ref>{{Cytuj odcinek|tytuł=Loudness Wars - Odc.24 [Reduktor\
      \ Szumu]|url=https://www.youtube.com/watch?v=ydg-ajN1u9o|data dostępu=2022-04-24}}</ref>.\n\
      \n=== Retrogaming ===\n[[Plik:NCM Konsole mit Controller.jpg|mały|220x220px|Konsola\
      \ [[NES Mini Classic]]]]\nTo [[hobby]], które staje się coraz bardziej popularne\
      \ i polega na graniu w stare gry video<ref>{{Cytuj odcinek|tytuł=Mój RetroPC\
      \ (Voodoo3, 256MB RAM, Celeron 1,7Ghz)|url=https://www.youtube.com/watch?v=B2zRTA4V7OQ|data\
      \ dostępu=2022-04-24}}</ref>, naprawianiu starszych sprzętów do grania oraz\
      \ tworzenie i udostępnianie programów wykorzystujących 100% możliwości danej\
      \ platformy. Wydawanie nowych gier, nawiązujących oprawą graficzną ([[sprite]],\
      \ [[Pixel art|pixel-art]]), muzyczną i dźwiękową ([[chiptune]], AdLib, [[MIDI]],\
      \ [[CD-Audio|CD Audio]]) wraz z mechanikami ze starych gier z lat 80. i 90.\
      \ Przykładowe retro-gry to: Shovel Knight, Attack of PETSCII Robots, Super Phantom\
      \ Cat, seria [[Hotline Miami]], Xeno Crisis, itp. \n\nMożna wyróżnić kilka typów\
      \ sprzętu, jaki do tego celu jest wykorzystywany: \n\n* stare komputery (np.\
      \ [[ZX Spectrum]], [[Commodore 64]], [[Amiga 600|Amiga]], [[MS-DOS|PC MS-DOS]],\
      \ [[Microsoft Windows|PC Windows 95/98]]) oraz stare konsole do gier (np. [[Atari\
      \ 2600]], [[Nintendo Entertainment System|NES]], [[Super Nintendo Entertainment\
      \ System|SNES]], [[Nintendo 64|N64]], [[Sega Mega Drive]], [[PlayStation|PSX]]).\
      \ Mówimy wtedy też o '''retrocomputingu''';\n* [[emulator]]y instalowane na\
      \ współczesnym sprzęcie (np. [[WinUAE]], [[DOSBox]], PC-Em, Vice);\n* retro-komputery\
      \ i retro-konsole, które są nowoczesną rewizją starszych sprzętów, odsługujące\
      \ aktualne standardy, często umieszczane w mniejszych obudowach, stylem przypominające\
      \ te oryginalne. Mogą przy tym opierać się na uniwersalnych współczesnych procesorach\
      \ (np. [[ARM (architektura)|ARM]]), mikrokontrolerach (np. [[STM32]]), używać\
      \ [[Emulacja|emulacji]] sprzętowej (np. w oparciu o układy [[FPGA]]) lub programowej\
      \ (RetroArch) lub czasami wykorzystywać oryginalne, stare podzespoły elektroniczne.\
      \ Przykładowymi retro-komputerami są: C64 Maxi, MiSTer FPGA, Commander X16,\
      \ [[Raspberry Pi]] z oprogramowaniem Amibian; natomiast retro-konsolami są np.:\
      \  A500 Mini, Atari VCS, [[NES Mini Classic]], C64 Mini, SEGA Genesis Mini,\
      \ [[Raspberry Pi]] z oprogramowaniem RetroPie.\n\nOdnogą retrogamingu jest [[speedrun]],\
      \ czyli przechodzenie starszych gier w jak najkrótszym czasie, nierzadko wykorzystując\
      \ błędy (ang. glitch) tj. przechodzenie przez ściany, bardzo długie skoki, moment\
      \ ładowania kolejnego etapu. Do takich gier można zaliczyć: [[Doom (gra komputerowa\
      \ 1993)|Doom]], [[Quake]], [[Duke Nukem 3D]], [[Half-Life]], [[Super Mario Bros.]],\
      \ starsze odsłony [[The Legend of Zelda (seria)|The Legend of Zelda]], [[GoldenEye\
      \ 007]], Time Splitters. Organizowane są turnieje oraz [[Live streaming|livestreamy]],\
      \ podczas których najlepsi gracze rywalizują o uzyskanie jak najkrótszych czasów\
      \ ukończenia danego tytułu<ref>{{Cytuj odcinek|tytuł=Running A Tightrope: DOOM's\
      \ Most Precarious Speedrun|url=https://www.youtube.com/watch?v=xMX0uQpDsYU|data\
      \ dostępu=2021-05-04}}</ref>.\n=== Moda retro ===\n[[Plik:Fernando Rosa - BAIXO.jpg|mały|Nowoczesny\
      \ styl ''retro'', nawiązujący do lat 70.]]Moda retro to styl ubierania polegający\
      \ na noszeniu ubrań z minionych lat, głównie z lat 50., 60. i 70. Ten sposób\
      \ ubierania się często zawiera odzież i dodatki charakterystyczne dla mody z\
      \ danego okresu. Wielu projektantów wykorzystuje takie elementy w sposób przesadzony.\
      \ Określenie ''elegancja w stylu retro'' odnosić się może do: \n\n* spodnie\
      \ ''dzwony'', kurtki, bluzy i buty w stylu funky, chociażby z linii [[Adidas]]\
      \ Classics;\n* popularne w USA tzw. ''poodle skirts'' (spódnice z motywem pudla)\
      \ z lat 50., spódnice ''bananówy'' modne w Polsce w latach 70.;\n* duże okulary\
      \ przeciwsłoneczne, tzw. ''muchy'';\n* jaskrawe hawajskie koszule, cienkie krawaty\
      \ lub ręcznie farbowane koszule rodem z lat 60.;\n* skórzane torebki i plecaki.\n\
      === Retro Sport ===\nOdzież sportowa stylizowana na lata 70. i 80. XX wieku\
      \ jest charakterystycznym i wyraźnym przykładem tego trendu. Dużą popularnością\
      \ cieszą się kurtki piłkarskie, koszulki i T-shirty z emblematami kiedyś istniejących\
      \ klubów [[Piłka nożna|piłki nożnej]]. Zazwyczaj ubrania te przypominają swoim\
      \ wyglądem dawne czasy dzięki zastosowaniu linii po bokach oraz połączeniu kolorów\
      \ typowych dla tamtego okresu. Charakterystycznym przykładem są [[Mistrzostwa\
      \ świata w piłce nożnej|Mistrzostwa Świata w Piłce Nożnej]] z 1970 roku, które\
      \ odbyły się w [[Meksyk]]u. Logo oraz typ czcionki z tego okresu są stosowane\
      \ na różnego rodzaju strojach typu retro sport. Ponadto takie marki jak [[Adidas]],\
      \ [[Puma SE|Puma]] czy [[Nike (przedsiębiorstwo)|Nike]] mają własne działy,\
      \ które specjalizują się w produktach typu ''retro''. Również niektóre kluby\
      \ [[Piłka nożna|piłki nożnej]], [[baseball]]a i [[Koszykówka|koszykówki]] ponownie\
      \ wypuściły swoje dawne stroje sportowe, aby zwiększyć ich sprzedaż.\n=== Samochody\
      \ retro ===\nSamochody retro to nowo zaprojektowane pojazdy, których stylistyka\
      \ jest oparta na samochodach z dawnych epok, jednak nie zostały w nich wykorzystane\
      \ żadne elementy oryginalnych konstrukcji, np.: \n{| class=\"wikitable\"\n|+\n\
      !MARKA\n!W STYLU RETRO\n!WZOROWANY NA\n|-\n|[[Toyota|TOYOTA]]\n|[[Plik:2008\
      \ Toyota FJ Cruiser.jpg|bezramki|143x143px]] [[Toyota FJ Cruiser|FJ CRUISER]]\
      \ (2008)\n|[[Plik:Toyota Land Cruiser FJ40 (Hardtop).JPG|bezramki]] LAND CRUISER\
      \ FJ40 (1960) \n|-\n|[[Chrysler|CHRYSLER]]\n|[[Plik:2001-2005 Chrysler PT Cruiser.jpg|bezramki]]\
      \ [[Chrysler PT Cruiser|PT CRUISER]] (2001)\n|[[Plik:1934ChryslerAirflow.jpg|bezramki|188x188px]]\
      \ [[Chrysler Airflow|AIRFLOW]] (1934)\n|-\n|[[Plymouth (marka samochodów)|PLYMOUTH]]\n\
      |[[Plik:Purple Plymouth Prowler.jpg|bezramki]] [[Plymouth Prowler|PROWLER]]\
      \ (1997)\n|[[Plik:1928 Model A Ford.jpg|bezramki|178x178px]] [[Ford Model A\
      \ (1927)|FORD T i A]] (1928)\n|-\n| rowspan=\"2\" |[[Chevrolet|CHEVROLET]]\n\
      |[[Plik:Chevrolet-HHR.jpg|bezramki]] [[Chevrolet HHR|HHR]] (2006)\n|[[Plik:Chevrolet\
      \ Suburban (1941) (48616828462).jpg|bezramki|197x197px]] [[Chevrolet Suburban|SUBURBAN]]\
      \ (1934)\n|-\n|[[Plik:Chevrolet SSR yellow.jpg|bezramki|213x213px]] [[Chevrolet\
      \ SSR|SSR]] (1999)\n|[[Plik:Chevrolet Advance Design red.jpg|bezramki]] [[Chevrolet\
      \ Advance Design|PICKUP ADVANCE DESIGN]] (1947)\n|-\n|[[Volkswagen|VOLKSWAGEN]]\n\
      |[[Plik:VW-New-Beetle.jpg|bezramki]] [[Volkswagen New Beetle|NEW BEETLE]] (1997)\n\
      |[[Plik:Volkswagen Beetle 1302 LIM.jpg|bezramki|188x188px]] [[Volkswagen Beetle|BEETLE]]\
      \ (GARBUS) (1971)\n|-\n|[[Ford Motor Company|FORD]]\n|[[Plik:Ford Mustang GT500.jpg|bezramki]]\
      \ [[Ford Mustang|MUSTANG]] (2006)\n|[[Plik:Ford-Mustang-Coupe.jpg|bezramki|213x213px]]\
      \ MUSTANG (1965)\n|-\n|[[BMW]]\n|[[Plik:Mini cooper photographed by jonas m\
      \ luster 2005-05-14.jpg|bezramki|207x207px]] [[Mini Hatch|MINI COOPER]] (2001)\n\
      |[[Plik:Morris Mini-Minor 1959 (621 AOK).jpg|bezramki]] [[Mini (1959)|AUSTIN\
      \ MINI]] (1959)\n|}\nNurtem silnie spokrewnionym z estetyką ''retro'' w motoryzacji\
      \ jest [[Neoklasycyzm (motoryzacja)|neoklasycyzm]], który w bardziej bezpośredni\
      \ i kontrastowy sposób nawiązuje do estetyki z epoki przedwojennej i pierwszej\
      \ połowy XX wieku<ref>{{Cytuj stronę | url = https://automotyw.com/japonia-wlodarza-dziwne-auta-z-japonii-tego-nie-odzobaczysz/\
      \ | tytuł = Japonia Włodarza. Dziwne auta z Japonii. Tego nie “odzobaczysz”\
      \ | język = pl | data dostępu = 2021-12-14}}</ref>. \n\n== Przypisy ==\n{{Commonscat|Retro\
      \ style}}\n{{Przypisy}}\n\n== Bibliografia ==\n* Elizabeth E. Guffey, 2006:\
      \ ''Retro: The Culture of Revival'', London: Reaktion. {{lang|en}}\n* [[Jean\
      \ Baudrillard]], 1995: ''Simulacra and Simulation'', Ann Arbor: University of\
      \ Michigan Press. {{lang|en}}\n* Raphael Samuel, 1994: ''Theatres of Memory'',\
      \ London: Verso. {{lang|en}}\n* James C. Collins, 1989: ''Uncommon Cultures.\
      \ Popular Culture and Post-Modernism'', New York/London: Routledge. {{lang|en}}\n\
      * [[Umberto Eco]], 1986: ''Travels in Hyperreality'', New York: Harcourt. {{lang|en}}\n\
      * Umberto Eco, 1988 (1964, 1978): ''The Structure of Bad Taste'', Amsterdam:\
      \ Bert Bakker. {{lang|en}}\n* Clem Robyns, 1991: ''\"Beyond the first dimension:\
      \ recent tendencies in popular culture studies\", in Joris Vlasselaers (Ed.)\
      \ The Prince and the Frog'', Leuven: ALW, 14-32. {{lang|en}}\n* Andrew Ross,\
      \ 1989: ''No Respect. Intellectuals and Popular Culture'', New York/London:\
      \ Routledge. {{lang|en}}\n\n[[Kategoria:Kultura]]\n[[Kategoria:Samochody według\
      \ stylizacji]]\n[[Kategoria:Nostalgia]]"
