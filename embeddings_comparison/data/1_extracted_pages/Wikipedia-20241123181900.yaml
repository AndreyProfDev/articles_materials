- sections:
  - content: "{{Inne znaczenia|podstawowego pojęcia kultury|[[Kultura (ujednoznacznienie)|inne\
      \ znaczenia tego słowa]]}}\n'''Kultura''' (z {{łac.|colere}}, 'uprawa, dbać,\
      \ pielęgnować, kształcenie’) – wieloznaczny termin pochodzący od ({{łac.|cultus\
      \ agri}} „[[uprawa roli]]”), interpretowany w wieloraki sposób przez przedstawicieli\
      \ różnych [[Nauka|nauk]]. Najczęściej jest rozumiana jako całokształt duchowego\
      \ i materialnego dorobku [[Społeczeństwo|społeczeństwa]]. Kulturę można określić\
      \ jako ogół wytworów [[Człowiek rozumny|ludzi]], zarówno materialnych, jak i\
      \ niematerialnych: duchowych, [[symbol]]icznych, takich jak wzory myślenia i\
      \ zachowania.\n\nBywa utożsamiana z [[Cywilizacja|cywilizacją]] i z wzorami\
      \ postępowania charakterystycznymi dla danego społeczeństwa; także z tym, co\
      \ w [[Zachowanie|zachowaniu]] ludzkim jest wyuczone, w odróżnieniu od tego,\
      \ co jest biologicznie odziedziczone.\n\nCałością wiedzy na temat kultury zajmuje\
      \ się dziedzina nauki, jaką jest [[kulturoznawstwo]], jednak w różnych aspektach\
      \ kultury badania są też realizowane przez: [[filozofia kultury|filozofię kultury]],\
      \ [[historia kultury materialnej|historię kultury materialnej]], [[antropologia\
      \ kulturowa|antropologię kulturową]], [[socjologia kultury|socjologię kultury]],\
      \ [[etnografia|etnografię]] i [[memetyka|memetykę]].\n\nW kontekście naukowym\
      \ termin ''kultura'' nie przyjmuje charakteru wartościującego.\n\n== Główne\
      \ dziedziny kultury ==\n* [[kultura materialna]]: wytwory człowieka, [[technika]]\
      \ i umiejętności praktyczne.\n* [[Kultura symboliczna|kultura duchowa]]: [[wierzenia]],\
      \ [[wiedza]], [[literatura]] i wszelkiego rodzaju [[piśmiennictwo]], [[sztuka]],\
      \ w tym: [[sztuki plastyczne]], [[teatr]], [[muzyka]], [[film]], [[Moda (styl)|moda]],\
      \ a także wszystko co należy do wytworów umysłu, na przykład [[filozofia]];\n\
      * [[kultura społeczna]]: [[Moralność|normy moralne]], [[ideologia]], uczestnictwo\
      \ w życiu kulturalnym, normy społeczne i kulturowe;\n* [[kultura języka]] /\
      \ kultura słowa: umiejętność sprawnego posługiwania się językiem i operowania\
      \ nim zgodnie z [[norma językowa|normami]] obowiązującymi w danej [[społeczność\
      \ językowa|społeczności]] i wymaganiami danej sytuacji komunikacyjnej;\n* [[kultura\
      \ polityczna]]: systemy wartości i wzorce zachowań ([[polityk]]ów, [[Partia\
      \ polityczna|partii]]) biorących udział w wykonywaniu władzy państwowej lub\
      \ aspirujących do tej roli;\n\n== Różnorodność pojmowania kultury ==\nPierwotnie\
      \ termin ''cultura'' wiązał się z uprawą roli, bądź hodowlą zwierząt i oznaczał\
      \ przekształcanie naturalnego stanu zjawisk przyrody w stan bardziej użyteczny\
      \ i przydatny człowiekowi. Obecnie w języku [[agronomia|agronomii]] używa się\
      \ wyrażeń takich jak: ''kultura rolna'', ''kultura bakterii'', bądź ''monokultura'',\
      \ co wiąże się bezpośrednio z pierwotnym znaczeniem tego słowa. Pierwszy raz\
      \ w nowym znaczeniu termin został użyty przez [[Cyceron]]a, który w dziele ''[[Tuskulanki|Disputationes\
      \ Tusculanae]]'' użył sformułowania ''cultura animi'' (''uprawa umysłu'') w\
      \ celu określenia pierwszej w [[Literatura|literaturze]] koncepcji [[filozofia|filozofii]]:\n\
      \n{{Cytat\n |treść = Czymże bez ciebie bylibyśmy nie tylko my, ale czym byłoby\
      \ w ogóle ludzkie życie? Tyś pozakładała miasta, ty rozproszonych ludzi powołałaś\
      \ do życia społecznego, ty zespoliłaś ich między sobą najpierw przez wspólne\
      \ osiedla, później przez małżeństwa, a wreszcie przez wspólnotę mowy i pisma.\
      \ Tyś wynalazczynią praw, nauczycielką dobrych obyczajów i ładu.\n |styl = środek\n\
      |autor=Cyceron|źródło=''Rozmowy tuskulańskie''}}\n\nOd tamtego czasu termin\
      \ „kultura” zaczęto wiązać z czynnościami ludzkimi, które miały na celu doskonalenie,\
      \ pielęgnowanie czy kształcenie. Po raz pierwszy nowoczesne zastosowanie pojęcia\
      \ „kultura” pojawiło się w 1688 roku, użyte przez [[Samuel von Pufendorf|Samuela\
      \ von Pufendorfa]] w pracy ''De iure naturae et gentium'', gdzie zamieścił słowa\
      \ takie jak: ''cultura'' czy ''cultura animi'' na oznaczenie wszelkich wynalazków\
      \ wprowadzonych przez człowieka (takich jak instytucje społeczne, ubranie, język,\
      \ moralność kierowaną przez rozum i obyczaje).\n\nW ciągu wieków słowo to było\
      \ coraz częściej używane przez filozofów, a potem i uczonych zajmujących się\
      \ [[nauki społeczne|naukami społecznymi]]. Rezultatem tego oto procesu stała\
      \ się jego wieloznaczność. Zasadnicze różnice pojawiają się, po przyjrzeniu\
      \ się co oznacza termin „kultura” dla reprezentantów różnych nauk:\n* dla [[Archeologia|archeologa]]\
      \ – „zbiór rzeczy materialnych znalezionych na miejscu wykopalisk, wykonanych\
      \ z kamienia, metalu, kości bądź drewna”,\n* dla [[Etnografia|etnografa]] –\
      \ „nie tylko przedmioty materialne, lecz również zachowania ludzkie, takie jak\
      \ [[Pieśń (gatunek literacki)|pieśni]], [[Przysłowie|przysłowia]], [[Baśń|baśnie]],\
      \ [[mit]]y, [[Legenda|legendy]], [[Moda (styl)|mody]], [[obyczaj]]e, [[zwyczaj]]e\
      \ czy [[obrzęd]]y, występujące w danym regionie”,\n* dla [[Antropologia kulturowa|antropologa]]\
      \ – „sfera przedmiotów materialnych, zachowań ludzkich, a także [[Instytucja\
      \ (antropologia)|instytucje]], działalność gospodarczą, zabawę, [[Język (mowa)|język]]\
      \ i [[Religia|religię]]”,\n* dla [[Psychologia|psychologa]] – „zbiór, do którego\
      \ wchodzą przede wszystkim zachowania jednostki, jej myśli, uczucia i reakcje;\
      \ kultura przejawia się poprzez zbiór reguł i motywów postępowania, form ekspresji,\
      \ nakazów i zakazów, ocen i sądów” (np. [[kultura indywidualistyczna]], [[kultura\
      \ kolektywistyczna]]),\n* dla [[Socjologia|socjologa]] – „wydzielony obszar\
      \ życia i działalności grup ludzkich”,\n* dla [[Kulturoznawstwo|kulturoznawcy]]\
      \ – „respektowane przez daną zbiorowość przekonania normatywne i przekonania\
      \ dyrektywalne, które w trybie subiektywno-racjonalnym regulują praktykę społeczną”\
      \ (definicja według [[Jerzy Kmita|Jerzego Kmity]]). Bądź „sposób życia podług\
      \ wartości” (definicja [[Stanisław Pietraszko|Stanisława Pietraszki]]). Bądź\
      \ [[sztuka]] i działalność [[Artysta|artystyczna]], czyli dzieła będące efektem\
      \ działań intelektualnych, więc muzyka, literatura, malarstwo, rzeźba, teatr\
      \ i film ([[Raymond Williams]]) ''lub'' proces rozwojowy rozumiany jako [[Proces\
      \ społeczny|proces społeczno-historyczny]] ''lub'' pielęgnowane cechy określonego\
      \ sposobu życia związane z tworzeniem i używaniem [[symbol]]i{{Odn|Baldwin|5=2007|Longhurst|McCracken|Ogborn}}.\n\
      \n== Sposoby badania zjawiska kultury ==\n=== Pierwszy sposób ===\nSposoby badania\
      \ kultury dzieli się na dwie zasadniczo odmienne grupy i wiążące się z nimi\
      \ dwa różne sposoby badania zjawiska kultury. W pierwszym wypadku pojmuje się\
      \ kulturę jako pewną własność ludzkich zbiorowości. Obejmuje ona cechy odróżniające\
      \ ludzi od innych organizmów, które nie są społecznie ukształtowane.\n\n[[Stanisław\
      \ Ossowski (socjolog)|Stanisław Ossowski]] wyróżnił dwie warstwy zjawisk kulturowych:\n\
      * kulturę we właściwym sensie tego słowa, obejmującą jedynie wzory zachowania\
      \ i myślenia,\n* przedmioty materialne, powiązane z tymi wzorami, jako warstwę\
      \ skorelowaną z kulturą, będącą jej namacalnym odpowiednikiem ([[Korelat kultury|korelatem\
      \ kultury]]).\n\n[[Ward Goodenough]] również wyróżnił dwa poziomy kultury, jednak\
      \ rozumiał je inaczej:\n* poziom zjawiskowy w kulturze, w obrębie którego mieszczą\
      \ się instytucje oraz zewnętrzne cechy charakteryzujące zbiorowości ludzkie,\n\
      * poziom ideacyjny, na który składają się reguły działania i wyuczone elementy\
      \ wiedzy. \n\n[[Claude Lévi-Strauss]] uważał z kolei, że w kulturze najważniejsze\
      \ są struktury, a nie to co wiąże się ze sferą psychologiczną kultury. Istotna\
      \ dla kultury płaszczyzna zjawisk kulturowych znajduje się na poziomie ładu\
      \ czy porządku nieuświadomionego. Inni uczeni ([[Stefan Czarnowski]], [[Jan\
      \ Szczepański (socjolog)|Jan Szczepański]]) włączali do kultury nie tylko wzory\
      \ myślenia i zachowania, ale także przedmioty materialne związane z tymi wzorami\
      \ systemem grupowych znaczeń{{Odn|Czarnowski|s=13–20|5=1956}}. Egzemplarz książki\
      \ ''[[Władca Pierścieni]]'', samochód marki [[Fiat 126|Polski Fiat 126p]] czy\
      \ komputer [[Odra (komputer)|Odra]] będzie więc dla jednych uczonych elementem\
      \ kultury (Czarnowski, Szczepański), a dla innych jedynie korelatem pewnych\
      \ ludzkich dyspozycji (Ossowski).\n\n=== Drugi sposób ===\nW tym wypadku badacze\
      \ kultury interesują się przede wszystkim treścią kultury, nie jej „ludzkim\
      \ podłożem”. Badacz [[Kodeks Napoleona|Kodeksu Napoleona]] interesuje się w\
      \ tym przypadku stosunkami logicznymi występującymi między [[Norma społeczna|normami]]\
      \ w nim zawartymi (normy w tym wypadku oznaczają wypowiedź o określonej treści,\
      \ a nie pożądany wzorzec zachowania). Nie interesuje go ani stopień skuteczności\
      \ tego kodeksu, ani to jaka była jego ocena w oczach jego użytkowników.\n\n\
      Inny badacz, w którego centrum zainteresowania znajdzie się [[Palestyński Islamski\
      \ Dżihad]], będzie analizował ugrupowania wchodzące w jego skład i opisywał\
      \ stosunki między nimi, a nie zajmował się zasadnością powstania tej organizacji\
      \ czy rozważaniem słuszności metod przez nią stosowanych (badaniem [[Moralność|moralności]]\
      \ zajmuje się [[etyka]]).\n\n== Definicje kultury ==\n=== Problem nieokreśloności\
      \ ===\nIstnieje wiele definicji kultury, często rozbieżnych, a nawet sprzecznych.\
      \ Znaczące są więc słowa [[Niemcy|niemieckiego]] [[Filozofia|filozofa]] [[Johann\
      \ Gottfried Herder|Johanna Herdera]], który już w XVIII wieku napisał w przedmowie\
      \ do ''Myśli o filozofii dziejów'':\n\n{{Cytat\n |treść = Nie ma nic bardziej\
      \ nieokreślonego niż słowo ''kultura''.\n |styl = środek\n|autor=Johann Gottfried\
      \ Herder|źródło=''Myśli o filozofii dziejów''}}\n\nBadacze kultury tworzyli\
      \ nowe definicje, za każdym razem uwzględniając jakiś wycinkowy, konkretny punkt\
      \ widzenia na kulturę. [[Antropologia kulturowa|Antropolog kultury]], [[Ralph\
      \ Linton]], tak podsumował te starania:\n\n{{Cytat\n |treść = Istotą wszelkiej\
      \ definicji kultury jest bowiem to, że wybiera pewne aspekty całego pojęcia\
      \ oznaczanego owym terminem i kładzie nacisk na nie kosztem innych aspektów.\
      \ Nacisk ten, a w konsekwencji także wartość definicji, będą zależały od tego,\
      \ jaki szczególny cel definiujący miał na uwadze. Istnieje wiele możliwości\
      \ definiowania kultury, a każda jest użyteczna w powiązaniu z dociekaniami określonego\
      \ rodzaju.\n |styl = środek\n|autor=Ralph Linton|źródło=''Kulturowe podstawy\
      \ osobowości''}}\n\nOn sam definiuje ją w ten sposób: „Kultura to konfiguracja\
      \ wyuczonych zachowań i ich rezultatów, których elementy składowe są podzielane\
      \ i przekazywane przez członków danego społeczeństwa”{{Odn|Linton|5=2000}}.\n\
      \n=== Sposoby definiowania ===\nRóżne sposoby definiowania kultury zawarte są\
      \ w pracy [[Alfred Kroeber|A. Kroebera]] i [[Clyde Kluckhohn|C. Kluckhohna]]\
      \ ''Culture. A Critical Review of Concepts and Definitions''{{Odn|Kroeber|5=1952|Kluckhohn}}.\
      \ Autorzy w swojej analizie pojęcia kultura wyróżnili 164 pseudodefinicje na\
      \ podstawie korpusu tekstowego liczącego ok. 300 pozycji. Korpus ten obejmował\
      \ zasadniczo pozycje anglojęzyczne{{Odn|Boroch|5=2013}}.\n\nPolskie opracowania\
      \ definicji kultury, na podstawie systematyki Kroebera-Kluckhohna przedstawili:\
      \ Antonina Kłoskowska w książce pt. ''Kultura masowa. Krytyka i obrona'' (1964){{Odn|Kłoskowska|s=|5=2011}}\
      \ oraz Robert Boroch ''w'' książce pt. ''Kultura w systematyce Alfreda L. Kroebera\
      \ i Clyde’a Kluckhohna.''\n\nGrupy definicyjne:\n\n; Grupa A: Definicje opisowe\n\
      : Zamieszczone zostały tu definicje prezentujące klasyczną postać wczesnych\
      \ definicji [[Etnologia|etnologicznych]]. Najbardziej znaną z nich, jest popularna\
      \ i użyteczna definicja [[Edward Burnett Tylor|Edwarda Tylora]]: „Kultura, czyli\
      \ cywilizacja, jest to złożona całość, która obejmuje wiedzę, wierzenia, sztukę,\
      \ moralność, prawa, obyczaje oraz inne zdolności i nawyki nabyte przez ludzi\
      \ jako członków społeczeństwa”. Tylor traktował zamiennie pojęcia „kultura”\
      \ i „[[cywilizacja]]”. Inni badacze, którzy zajmowali się kulturą (szczególnie\
      \ [[Archeologia|archeologowie]], [[Etnografia|etnografowie]] i [[Antropologia\
      \ kulturowa|antropologowie kultury]]) chętnie się odwoływali do tej definicji,\
      \ bądź ją modyfikowali. [[Ruth Benedict]] określiła ją jako: „Kultura jest to\
      \ złożona całość zawierająca nawyki nabyte przez człowieka jako członka społeczeństwa”.\
      \ Definicja antropologa [[Bronisław Malinowski (antropolog)|Bronisława Malinowskiego]]:\
      \ „Kultura jest integralną całością składającą się z narzędzi i dóbr konsumpcyjnych,\
      \ twórczych zasad różnych grup społecznych, ludzkich idei i umiejętności, wierzeń\
      \ i obyczajów”.\n; Grupa B: Definicje historyczne\n: Definicje tu umieszczone\
      \ kładą nacisk na czynnik [[Tradycja|tradycji]] jako mechanizm przekazywania\
      \ dziedzictwa kulturowego. Definicja [[Stefan Czarnowski|Stefana Czarnowskiego]]:\
      \ „Kultura jest dobrem zbiorowym i zbiorowym dorobkiem, owocem twórczego i przetwórczego\
      \ wysiłku niezliczonych pokoleń. [...] Jest nią całokształt zobiektywizowanych\
      \ elementów dorobku społecznego, wspólnych szeregowi grup i z racji swej obiektywności\
      \ ustalonych i zdolnych rozszerzać się przestrzennie”{{Odn|Czarnowski|s=13,\
      \ 20|5=1956}}.\n; Grupa C: Definicje normatywne\n: Definicje te akcentują podporządkowanie\
      \ się zachowań ludzi normom, wzorom, wartościom i modelom. Temu typowi definicji\
      \ odpowiada ujęcie kultury, zaproponowane przez [[Alfred Kroeber|Alfreda Kroebera]]\
      \ i [[Talcott Parsons|Talcotta Parsonsa]]: „Kultura to przekazane i wytworzone\
      \ treści i wzory wartości, idei i innych symbolicznie znaczących systemów, będące\
      \ czynnikami kształtującymi ludzkie zachowania oraz wytwory stanowiące produkt\
      \ zachowania”. Również w tym duchu kulturę definiuje [[Ralph Linton]]: „konfiguracja\
      \ wyuczonych zachowań i ich rezultatów, których elementy składowe są podzielane\
      \ i przekazywane przez członków danego społeczeństwa”.\n; Grupa D: Definicje\
      \ psychologiczne\n: Definicje psychologiczne skupiają uwagę na psychicznych\
      \ mechanizmach kształtowania się kultury. Analizują one mechanizmy uczenia się,\
      \ formowania [[nawyk]]ów kulturowych, [[Internalizacja|internalizacji]] norm\
      \ obowiązujących w danej zbiorowości i wartości uznawanych przez tę zbiorowość,\
      \ jak również wpływ kultury na kształtowanie [[Osobowość|osobowości]] jednostek.\
      \ Główny nacisk kładziony jest na uczenie się i naśladownictwo jako procesy\
      \ przyswajania kultury. Definicje dla tego typu sformułował [[Stanisław Ossowski\
      \ (socjolog)|Stanisław Ossowski]]: „Kultura jest pewnym zespołem dyspozycji\
      \ psychicznych przekazywanych w łonie danej zbiorowości przez kontakt społeczny\
      \ i uzależniony od całego systemu stosunków międzyludzkich”.\n; Grupa E: Definicje\
      \ strukturalne\n: Definicje zebrane dla tego typu interesują się głównie strukturą\
      \ konkretnej kultury, a więc jej zasadniczymi elementami oraz ich wewnętrznymi\
      \ powiązaniami. Wyróżnia się cztery kategorie elementów kultury: materialno-techniczne,\
      \ społeczne, ideologiczne oraz psychiczne (dotyczące uczuć i postaw).\n; Grupa\
      \ F: Definicje genetyczne\n: Definicje te skupiają się na problemie genezy kultury,\
      \ wyjaśniają jej pochodzenie. Definicje te dzieli się na dwie grupy: dotyczące\
      \ wewnętrznego rozwoju kultury, wyłaniania się jednych (wyższych) form z form\
      \ innych wcześniejszych (uważanych za niższe) oraz dotyczące problemu wyłaniania\
      \ się kultury z natury oraz związków, różnic i przeciwieństw między tymi definicjami.\n\
      '''Grupa G: Definicje niekompletne'''\n\nDo grupy tej zaliczono definicje niepasujące\
      \ do w/w.\n\n'''Notacja szczegółowa Systematyki Kroebera-Kluckhohna{{Odn|Boroch|5=2013}}:'''\n\
      \n'''Grupa A: Definicje opisowe'''\n\nGłówne kryteria klasyfikacyjne: w definicjach\
      \ grupy A znajdują się sformułowania: „całość”, „suma”, „wszystko”.\n\na) kultura\
      \ jako „złożona całość”;\n\nb) wyliczenie cech kultury.\n\n'''Grupa B: Definicje\
      \ historyczne'''\n\nGłówne kryteria klasyfikacyjne grupy B:\n\na) dziedzictwo\
      \ społeczne;\n\nb) tradycja społeczna.\n\n'''Grupa C: Definicje normatywne'''\n\
      \n'''''Podgrupa C1:''''' Nacisk na reguły:\n\na) powszechne (lub współdzielone)\
      \ i utrwalone sposoby wykonywania czegoś;\n\nb) sankcje grożące za odstępstwa\
      \ od reguł;\n\nc) maniery, czyli sposób zachowania się w konkretnej sytuacji;\n\
      \nd) „społeczny algorytm” określający, co i w jaki sposób może być osiągnięte\
      \ oraz jakie może to przynieść korzyści lub ich braki.\n\n'''''Podgrupa C2:'''''\
      \ Nacisk na wartości i idee plus zachowanie\n\nKryterium klasyfikujące do podgrupy\
      \ C2 to komplementarne odnoszenie się kultury do: zachowania, jawnych działań,\
      \ idei oraz wartości.\n\n'''Grupa D: Definicje psychologiczne'''\n\n'''''Podgrupa\
      \ D1:''''' nacisk na modyfikację kultury jako „urządzenia” rozwiązującego problemy.\n\
      \n'''''Podgrupa D2:''''' nacisk na uczenie się.\n\n'''''Podgrupa D3:''''' nacisk\
      \ na przyzwyczajenia.\n\n'''''Podgrupa D4:''''' ''definicje w pełni psychologiczne.''\n\
      \n'''Grupa E: Definicje strukturalne'''\n\n'''Grupa F: Definicje genetyczne'''\n\
      \nElementem porządkującym w grupie F jest:\n\na) co kulturą się staje;\n\nb)\
      \ jakie czynniki powodują, że kultura jest w ogóle możliwa;\n\nc) jakie elementy\
      \ składają się na kulturę.\n\n'''''Podgrupa F1:''''' nacisk na kulturę jako\
      \ produkt albo artefakt.\n\n'''''Podgrupa F2:''''' nacisk na idee.\n\n'''''Podgrupa\
      \ F3:''''' nacisk na symbole.\n\n'''''Podgrupa F4:''''' pozostałe definicje\
      \ genetyczne, które koncentrują się na pochodzeniu kultury i wyliczaniu, czym\
      \ jest kultura.\n\n'''Grupa G: Definicje niekompletne'''\n\nGrupa G zawiera\
      \ definicje, które ze względu na metaforyczne ujmowanie problemu są trudne do\
      \ sklasyfikowania według przyjętej w '''Systematyce Kroebera-Kluckhohna''' metodologii.\n\
      \n== Podstawowe pojęcia związane z kulturą ==\nKulturę można opisywać w rozumieniu\
      \ wartościującym albo opisowym. To pierwsze rozumienie odwołuje się do kultur\
      \ „lepszych” i „gorszych”, „wyższych” i „niższych”, bardziej lub mniej „cywilizowanych”,\
      \ drugie zaś nie wartościuje zjawisk i tym samym nie używa tych pojęć.\n\nZ\
      \ powyższymi dwoma rodzajami rozumienia kultury związane są dwa przymiotniki:\
      \ kulturalny (odwołujące się do pierwszego rozumienia) i kulturowy (odwołujące\
      \ się do drugiego). Różnicę pomiędzy nimi można wyjaśnić na przykładzie ulicznego\
      \ [[graffiti]]. Zachowanie młodych grafficiarzy, malujących na murach czy wagonach\
      \ kolejowych, trudno nazwać zachowaniem kulturalnym (często określa się je jako\
      \ akt wandalizmu), lecz na pewno jest ono zjawiskiem kulturowym. Nie zawsze\
      \ pojęcia te są ze sobą sprzeczne, np. o obrazach [[Vincent van Gogh|Vincenta\
      \ van Gogha]] powiemy, że są zarówno zjawiskiem kulturalnym, jak i kulturowym.\n\
      \nWedług atrybutywnego rozumienia kultury jest ona cechą stałą i atrybutem ludzkości\
      \ jako całości (ujęcie globalne) lub poszczególnego człowieka jako przedstawiciela\
      \ gatunku ''homo sapiens'' (ujęcie jednostkowe). Można mówić o kulturze tylko\
      \ w liczbie pojedynczej, nigdy w liczbie mnogiej (o kulturach). Według dystrybutywnego\
      \ rozumienia kultury jest ona rozumiana jako zbiór cech kultury określonej zbiorowości,\
      \ np.: Polaków, rowerzystów, uczniów gimnazjum czy górników. W tym wypadku można\
      \ używać pojęcia „kultury”, gdyż jest ich wiele, podobnie jak wiele jest różnych\
      \ zbiorowości.\n\n== Kultura a natura ==\nGatunek ludzki jako jedyny gatunek\
      \ na [[Ziemia|Ziemi]] wytworzył kulturę (zależnie od definicji wskazuje się\
      \ też na kulturopodobne zachowania niektórych ssaków, ptaków i owadów). W tym\
      \ sensie kultura nie jest przeciwieństwem natury, lecz stanowi jej rozwinięcie.\
      \ Dzięki rozwojowi na drodze [[Antropogeneza|ewolucji]] ''homo sapiens'' jest\
      \ w stanie w sposób świadomy przeobrażać świat rzeczywisty znajdujący się wokół\
      \ niego. Dlatego nazywa się często człowieka „zwierzęciem tworzącym kulturę”.\n\
      \nIzolowana jednostka ludzka nie jest w stanie samodzielnie wytworzyć kultury.\
      \ Potrzeba do tego zbiorowości ludzkiej, przekazującej swe doświadczenia z pokolenia\
      \ na pokolenie. Nawet najbardziej inteligentny człowiek pozbawiony kontaktów\
      \ ze skumulowanym na drodze przekazu pokoleniowego dziedzictwem nie będzie w\
      \ stanie wytworzyć jakiejkolwiek złożonej „całości kulturowej” jedynie w oparciu\
      \ o swe umiejętności i dostępne mu zasoby naturalne.\n\nW klasycznych definicjach\
      \ kultury uznawano, że kultura wynika z natury (w sensie [[Filogeneza|filogenetycznym]]),\
      \ lecz jest przeciwstawna naturze (w sensie [[Ontogeneza|ontogenetycznym]]).\n\
      \nNa temat związku kultury z naturą powstało wiele różnorodnych teorii, przy\
      \ czym wiele z nich podchodzi do tego zagadnienia w odmienny sposób. Odległe\
      \ od siebie pojęciowo rozróżnienia proponują na przykład [[Funkcjonalizm (antropologia)|funkcjonalizm\
      \ Bronisława Malinowskiego]] oraz pierwotna wersja [[Psychoanaliza|psychoanalizy]]\
      \ [[Sigmund Freud|Zygmunta Freuda]].\n\n[[Bronisław Malinowski (antropolog)|Bronisław\
      \ Malinowski]] traktował kulturę jako formę zaspokajania ludzkich potrzeb, jest\
      \ ona „środkiem do celu”. Zygmunt Freud również sądził, że kultura jest odpowiedzią\
      \ na ludzkie potrzeby (zwłaszcza formą radzenia sobie z [[Libido|popędem seksualnym]]).\
      \ Jednak uznał, że potrzeby te są represjonowane poprzez system kontroli moralnej\
      \ i prawnej oraz dostarczanie:\n\n{{Cytat\n |treść = (...) zastępczego, częściowego\
      \ i niedoskonałego zaspokojenia w sztuce, nauce, religii. Kultura jest siłą\
      \ tamującą raczej niż realizującą pierwotne i autentyczne popędy natury.\n |styl\
      \ = środek\n}}\n\nSocjobiolog [[Edward Osborne Wilson]] natomiast przeciwstawiając\
      \ się podejściu Freuda przyjmuje tezę, że kultura nie przeciwstawia się naturze,\
      \ lecz sprzyja ona adaptatywnym wzorcom, jak chociażby unikanie [[Kojarzenie\
      \ krewniacze|chowu wsobnego]], co byłoby niekorzystne dla gatunku. [[Kazirodztwo]]\
      \ w jego ujęciu, przeciwstawnym wobec Freuda, nie jest więc hamowanym przez\
      \ kulturę instynktem, lecz poprzez to, że kultura we wszystkich społeczeństwach\
      \ sprzeciwia się kazirodztwu, argumentuje że jest to genetycznie wdrukowany\
      \ wzorzec, na bazie którego powstało wiele motywów rozwijających kulturę.\n\n\
      Dekonstrukcja binarnego i opozycyjnego podziału na naturę i kulturę, zasygnalizowana\
      \ wcześniej przez ruch [[New Age]] i teorie krytyczne, została w ostatnich latach\
      \ podjęta przez nurty filozoficzne określające się jako posthumanistyczne. Wypowiadali\
      \ się na ten temat zwłaszcza [[Bruno Latour]], [[Donna Haraway]], [[Rosi Braidotii]],\
      \ a w Polsce m.in. [[Monika Bakke]]{{Odn|Bakke|5=2012|s=270}}{{Odn|Domańska|5=2013|s=13–32}}.\n\
      \nWedług [[Jan Paweł II|Jana Pawła II]] kultura to „uszlachetniająca afirmacja\
      \ tego co ludzkie”{{odn|Jan Paweł II|s=196|5=2011}}. Analiza kultury tego autora\
      \ jest częścią jego [[Antropologia filozoficzna|antropologii]] adekwatnej, to\
      \ znaczy takiej, która ukazuje jednoznaczną różnicę między człowiekiem jako\
      \ [[Osoba|osobą]], a światem zwierzęcym („animalia”) – czyli „wy-osobnienie\
      \ się” człowieka ze świata, jego [[Personalizm chrześcijański|personalizacja]]{{odn|Jan\
      \ Paweł II|s=24–25|5=2011}}.\n\n== Kultura a cywilizacja ==\nCzęść badaczy,\
      \ np. [[Edward Burnett Tylor|Edward Tylor]] stosuje te pojęcia zamiennie{{Odn|Tylor|5=1997}}.\
      \ Inni zaś podają różnice pomiędzy nimi. Według [[Alfred Weber|Alfreda Webera]]\
      \ [[cywilizacja]] to efekt dążenia do racjonalizacji życia ludzkiego i adaptacji\
      \ do zewnętrznych warunków (elementami cywilizacji są wszelkie wynalazki i udoskonalenia\
      \ techniczne), podczas gdy:\n\n{{Cytat\n |treść = kultura sytuuje się poza sferą\
      \ wymogów adaptacyjnych, tam, gdzie zaczyna się kształtowanie naszego życia\
      \ przez wyznaczanie mu celów, których nie da się wyprowadzić z potrzeby dalszej\
      \ egzystencji albo lepszego zaspokajania naturalnych potrzeb życiowych.\n |styl\
      \ = środek\n}}\n\n[[Lewis Morgan]] określał jako cywilizację najwyższe stadium\
      \ rozwoju ogólnie rozumianej kultury (stadium to następowało po etapie dzikości\
      \ i barbarzyństwa).\n\n== Różnorodność kultur ==\nMimo że kultura jest atrybutem\
      \ człowieka i co za tym idzie wszystkich społeczności tworzonych przez gatunek\
      \ [[Człowiek rozumny|homo sapiens]] nie jest ona jednolita i w różnych okresach\
      \ historycznych, jak również w różnych obszarach geograficznych wytwory ludzkie,\
      \ systemy norm i wartości były i są od siebie odbiegające w dużym stopniu. Przedstawiciele\
      \ nauk społecznych starają się klasyfikować pewne typy kultur, czy też opisywać\
      \ szczególne przypadki istniejących obecnie lub w przeszłości, nadając im nazwy\
      \ specyficzne ze względu na miejsce, czas bądź ogólny typ opisywanej kultury.\n\
      \n=== Wybrane ogólne typy kultur ===\n* [[kultura darów]]\n* [[Kultura symboliczna|kultura\
      \ duchowa]]\n* [[kultura języka]]\n* [[kultura ludowa]]\n* [[Kultura popularna|kultura\
      \ masowa]]\n* [[kultura materialna]]\n* [[kultura narodowa]]\n* [[kultura polityczna]]\n\
      * [[kultura elitarna]]\n* [[kultura oficjalna]]\n* [[kultura regionalna]]\n\
      * [[kultura lokalna]]\n* [[kultura organizacyjna]]\n\n=== Systemy kultury ===\n\
      * [[kultura oralna]] i [[Kultura piśmienna|piśmienna]]\n* [[kultura elektroniczna]]\n\
      * [[kultura druku]]\n\n=== Niektóre szczególne typy kultur ===\n* [[kultura\
      \ aszelska]]\n* [[kultura badaryjska]]\n* [[kultura cykladzka]]\n* [[kultura\
      \ esperanta]]\n* [[kultura halsztacka]]\n* [[Hawajczycy|kultura hawajska]]\n\
      * [[kultura Islandii]]\n* [[kultura Kanady]]\n* [[kultura łużycka]]\n* [[kultura\
      \ magdaleńska]]\n* [[kultura minojska]]\n* [[kultura mustierska]]\n* [[kultura\
      \ mykeńska]]\n* [[Kultura olduwajska|kultura Olduvai]]\n* [[kultura Olmeków]]\n\
      * [[kultura świderska]]\n* [[kultura azylska]]\n\n== Istotne cechy kultury i\
      \ płaszczyzny zjawisk kulturowych ==\nKultura związana jest z człowiekiem. Jest\
      \ zjawiskiem społecznym i powtarzalnym (naukowiec, który nie ujawni swego wynalazku\
      \ szerszemu gronu, nie włączy go tym samym do elementów kultury, lecz po jakimś\
      \ czasie zrobić to może inny uczony, który niezależnie od niego doszedł do tych\
      \ samych wniosków). Kultura jest zbiorem zjawisk wyuczonych (czyli przekazywanych\
      \ nie za pośrednictwem genów, lecz na drodze wychowania i uczenia się).\n\n\
      Kultura ma charakter czasowy i przestrzenny. Kultura jest [[system]]em, a więc\
      \ dana kultura ma własną wewnętrzną logikę. Kultura jest też mechanizmem adaptacyjnym\
      \ człowieka, jest pośrednikiem między człowiekiem a środowiskiem, które on zamieszkuje.\n\
      \n=== Płaszczyzny zjawisk kulturowych ===\n* materialna – każde zjawisko kulturowe\
      \ ma jakiś wymiar materialny;\n* behawioralna – zjawiska kulturalne są związane\
      \ nierozerwalnie z zachowaniami motorycznymi (zewnętrznymi, czyli czynnościami\
      \ związanymi z tworzeniem i odbiorem dzieła kulturowego lub wewnętrznymi, czyli\
      \ przeżyciami, odczuciami, bądź wypowiedziami);\n* psychologiczna – dla niektórych\
      \ badaczy ważne są: wartościowanie, oceny, postawy, motywy i znaczenia nadawane\
      \ przez człowieka przedmiotom materialnym i zachowaniom;\n* aksjonormatywna\
      \ – w kulturze można też wyróżnić normy i wartości.\n\n=== Inne ważne pojęcia\
      \ związane z kulturą ===\n* [[dobra kultury]] – [[wartości kultury]] – [[relatywizm\
      \ kulturowy]] – [[wzór kulturowy]] ([[kod kulturowy]])\n* [[dziedzictwo kulturowe]]\
      \ – [[lista światowego dziedzictwa UNESCO|lista światowego dziedzictwa kulturalnego\
      \ i przyrodniczego UNESCO]]\n* [[finansowanie kultury]] – [[mecenat]] – [[sponsoring]]\n\
