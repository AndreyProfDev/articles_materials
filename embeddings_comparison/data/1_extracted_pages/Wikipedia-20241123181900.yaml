- sections:
  - content: "[[Plik:Herzensschatzikomm.jpg|Listy schizofreniczki [[Emma Hauck|Emmy\
      \ Hauck]] do męża znajdujące się w kolekcji Prinzhorna bywają oceniane w kategoriach\
      \ sztuki|thumb]]\n[[Plik:Vincent van Gogh (1853-1890) - Wheat Field with Crows\
      \ (1890).jpg|thumb|[[Karl Jaspers]] analizował dzieła [[Vincent van Gogh|Vincenta\
      \ van Gogha]] pod kątem objawów schizofrenii]]\n'''Twórczość chorych psychicznie'''\
      \ – pojęcie określające całokształt dzieł tworzonych przez osoby zdradzające\
      \ trwałe lub przejściowe zaburzenia psychicznie, przede wszystkim pacjentów\
      \ ze [[schizofrenia|schizofrenią]]. Twórczość ta jest przedmiotem zainteresowania\
      \ lekarzy psychiatrów i psychologów, traktujących ją jako cenne uzupełnienie\
      \ dokumentacji stanu psychopatologicznego pacjenta, a także historyków sztuki\
      \ i artystów, doszukujących się w niej wartości artystycznych i nowych form\
      \ ekspresji artystycznej<ref>{{Cytuj pismo | autor=Esman AH| tytuł=Ernst Kris\
      \ and the art of the mentally ill. | rok=2004 | czasopismo=The International\
      \ journal of psycho-analysis | doi=10.1516/0020757041557520 | wydanie=85 | wolumin=Pt\
      \ 4 | miesiąc=sierpień | pmid= 15310428 | strony=923–33}}</ref>. Inne określenia\
      \ tej sztuki to „sztuka schizofreniczna”, „sztuka psychopatologiczna”, ang.\
      \ ''artistic self-expression'', niem. ''schizophrenische Bildnerei'' (Prinzhorn),\
      \ ''zustandsgebundene Kunst'' ([[Leo Navratil|Navratil]]). [[Antoni Kępiński]]\
      \ proponował stosowanie szerokiego, niewartościującego określenia „schizofreniczna\
      \ ekspresja plastyczna”, obejmującego różnorodne formy ekspresji pacjentów,\
      \ w tym zarówno te bezwartościowe jak i cenne pod względem wartości artystycznych.\n\
      \nZainteresowanie sztuką chorych psychicznie rozpoczęło się równolegle z powstaniem\
      \ nowoczesnej psychiatrii, w pierwszych latach XX wieku. [[Ernst Kretschmer]]\
      \ pisał, że chcąc poznać „pełnię wewnętrznego życia w schizofrenii, należy studiować\
      \ nie żywoty wieśniaków, lecz poetów i królów cierpiących na tę chorobę”<ref>E.\
      \ Kretschmer: Psychologia lekarska. PZWL, Warszawa 1958. Cytat za: Kępiński</ref>.\
      \ Kępiński pisze o schizofrenii artystycznej, określając tym pojęciem obraz\
      \ choroby u osób w okresie przedchorobowym wyróżniających się wybitną inteligencją,\
      \ wyobraźnią i uzdolnieniami artystycznymi<ref>{{Cytuj książkę |nazwisko = Kępiński\
      \ |imię = Antoni  |tytuł = Schizofrenia |rozdział = Twórczość plastyczna w schizofrenii\
      \ |rok = 2001 |wydawca = Wydawnictwo Literackie | miejsce = Kraków |isbn = 83-08-03106-4\
      \ |strony = 78–90}}</ref>. \n\nCenną kolekcję dzieł pacjentów hospitalizowanych\
      \ w szpitalach psychiatrycznych Europy i Japonii zebrał [[Hans Prinzhorn]].\
      \ Kolekcję Prinzhorna odkrył po II wojnie światowej [[Jean Dubuffet]], który\
      \ stworzył pojęcie ''[[Art Brut]]''. W 2002 roku w Heidelbergu powstało Muzeum\
      \ Prinzhorna.\n\nW kazuistyce psychiatrycznej przywołuje się zarówno dzieła\
      \ nieznanych pacjentów, czasem odkrytych po ich śmierci, jak większość z wystawianych\
      \ w Muzeum Prinzhorna dzieł; z drugiej strony, analizuje się dzieła wybitnych\
      \ artystów, u których stwierdzono lub podejrzewano zaburzenia psychiczne. Przykładem\
      \ może być twórczość [[Vincent van Gogh|Vincenta van Gogha]], w której [[Karl\
      \ Jaspers]] doszukiwał się cech zdradzających objawy schizofrenii. Odrębnym\
      \ zagadnieniem jest twórczość niespontaniczna, powstająca w ośrodkach opieki\
      \ zdrowotnej w ramach terapii zajęciowej. Rzadko jest ona wysoko oceniana w\
      \ kategoriach sztuki, natomiast odgrywa dużą rolę w leczeniu pacjentów i pomaga\
      \ im powrócić do funkcjonowania w społeczeństwie.\n\n== Artyści ==\n* [[Adolf\
      \ Wölfli]]\n* [[Anton Heinrich Müller]]\n* [[Louis Wain]]\n* [[Bryan Chamley]]\n\
      * [[Oswald Tschirtner]]\n* [[August Walla]]\n* [[Edmund Monsiel]]\n* [[Emma\
      \ Hauck]]\n\n== Przypisy ==\n{{Przypisy}}\n\n== Bibliografia ==\n* Pałuba M.\
      \ 5.3.2. Twórczość chorych psychicznie. [w:] : Bilikiewicz A, Pużyński S, Rybakowski\
      \ J, Wciórka J (red.) Psychiatria. Tom III. Terapia. Zagadnienia etyczne, prawne,\
      \ organizacyjne i społeczne. Wydawnictwo Medyczne Urban & Partner Wrocław 2002\
      \ {{ISBN|83-87944-72-6}}. s. 567–569\n* {{Cytuj książkę | nazwisko=Kępiński\
      \ | imię=Antoni  | autor= | autor link= | inni= | tytuł=\nSchizofrenia | data=2001\
      \ | wydawca=Wydaw. Literackie | miejsce=Kraków | isbn=83-08-03106-4 | strony=}}\n\
      * Martin Stefan, Mike Travis, Robin M. Murray: An Atlas of Schizophrenia. The\
      \ Parthenon Publishing Group 2002 {{ISBN|1859799745}}\n\n== Linki zewnętrzne\
