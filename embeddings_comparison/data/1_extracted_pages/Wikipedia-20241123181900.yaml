  - content: "{{Święto infobox\n |Nazwa      = Światowy Dzień Różnorodności Kulturowej\
      \ dla Dialogu i Rozwoju\n |Grafika    = DN-ST-85-08495.jpg\n |Opis       = Afrykańska\
      \ kobieta podczas ''West Africa Training Cruise 1983''\n |Dzień      = [[21\
      \ maja]]\n |Kraje      = {{państwo|ONZ}}\n |Typ święta = [[stosunki międzynarodowe|międzynarodowe]]\n\
      \ |Religie    = \n |Zwyczaje   = \n |Upamiętnia = \n |Znaczenie  = \n |Symbole\
      \    = \n |Inne nazwy = Światowy Dzień Różnorodności Kulturowej – w Trosce o\
      \ Dialog i Rozwój\n |Podobne    = [[Międzynarodowy Dzień Ludności Tubylczej\
      \ na Świecie]]\n}}\n[[Plik:Kutti chattan main.JPG|thumb|240px|Rytualny taniec\
      \ (ang. thirra) w Północnym Malabarze ([[Wybrzeże Malabarskie]], 2008)]]\n'''Światowy\
      \ Dzień Różnorodności Kulturowej''', właśc. '''Światowy Dzień Różnorodności\
      \ Kulturowej dla Dialogu i Rozwoju''' ([[język angielski|ang.]] ''World Day\
      \ for Cultural Diversity for Dialogue and Development'') – [[święto]] obchodzone\
      \ corocznie [[21 maja]], ustanowione przez [[Zgromadzenie Ogólne Organizacji\
      \ Narodów Zjednoczonych|Zgromadzenie Ogólne ONZ]] rezolucją 57/249 z 22 grudnia\
      \ 2002 w myśl Powszechnej Deklaracji o Różnorodności Kulturowej uchwalonej na\
      \ 31 Sesji Konferencji Generalnej [[UNESCO]] w dniu 2 listopada 2001 roku<ref>{{cytuj\
      \ stronę |url = http://www.unesco.pl/kultura/roznorodnosc-kulturowa/deklaracja-unesco\
      \ |tytuł = ''Powszechna Deklaracja o Różnorodności Kulturowej'' |autor = Polski\
      \ Komitet ds. UNESCO |opublikowany = www.unesco.pl |data dostępu = 2012-05-27}}</ref>.\n\
      \nRezolucja odnosi się do zasady „tolerancji i poszanowania dla różnorodności\
      \ kulturowej oraz promocji i ochrony praw człowieka, w tym prawa do rozwoju”.\n\
      \nCelem obchodów jest promocja [[kultura|kultury]], różnorodności kulturowej,\
      \ [[dziedzictwo kulturowe|dziedzictwa kulturowego]] – zarówno [[kultura materialna|materialnego]],\
      \ jak i [[kultura symboliczna|niematerialnego]], produktów przemysłu artystycznego,\
      \ [[dobra (ekonomia)|dóbr]] oraz [[Usługi|usług]] związanych z kulturą.\n\n\
      To również okazja, jak podkreśla UNESCO, do uświadomienia rządów, polityków,\
      \ instytucji kultury i uczestników życia społecznego, o konieczności szczególnej\
      \ ochrony kultury [[Kraj rozwijający się|krajów rozwijających się]], w których\
      \ zasadnicze znaczenie ma kształtowanie właściwej polityki kulturalnej i wypracowanie\
      \ mechanizmów strukturalnych ochrony lokalnych kultur, w tym ich szczególnie\
      \ istotnego elementu – języka.\n\n== Zobacz też ==\n* [[Lista światowego dziedzictwa\
      \ UNESCO]]\n* [[Międzynarodowe Dni i Tygodnie ONZ]]\n* [[Światowy Dzień Informacji\
      \ na temat Rozwoju]]\n\n== Przypisy ==\n{{Przypisy}}\n\n== Bibliografia ==\n\
      * {{cytuj stronę |url = http://www.unesco.pl/article/1/21-maja-swiatowy-dzien-roznorodnosci-kulturowej-2\
      \ |tytuł = ''21 maja: Światowy Dzień Różnorodności Kulturowej'' |autor = Polski\
      \ Komitet ds. UNESCO |opublikowany = www.unesco.pl |data dostępu = 2012-05-21}}\n\
      \n== Linki zewnętrzne ==\n* Polski Komitet ds. UNESCO: [http://www.unesco.pl/kultura/roznorodnosc-kulturowa\
      \ ''Różnorodność kulturowa''], www.unesco.pl {{lang|pl}}\n* ''Konwencja UNESCO\
      \ w sprawie ochrony i promowania różnorodności form wyrazu kulturowego, sporządzona\
      \ w Paryżu dnia 20 października 2005 r.'' ({{Dziennik Ustaw|2007|215|1585}})\n\
      \n[[Kategoria:Konferencje i obchody ONZ|Różnorodności]]\n[[Kategoria:Kultura]]"
