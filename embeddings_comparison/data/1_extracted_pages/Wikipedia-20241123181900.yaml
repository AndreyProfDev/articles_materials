- sections:
  - content: '''''''Polityka kulturalna'''''' stanowi obszar [[polityka społeczna|polityki
      społecznej]] obejmujący działania władz publicznych czy [[Organizacja pozarządowa|organizacji
      pozarządowych]] w zakresie [[sztuka|sztuki]] i [[kultura|kultury]]. Sprzyja
      ona procesom, instytucjom i [[Prawne formy działania administracji|działaniom
      prawnym]], które promują różnorodność i [[dostępność kultury]] czy upowszechniają
      artystyczną, etniczną, socjolingwistyczną czy literacką ekspresję osobom reprezentującym
      [[dziedzictwo kulturowe]] danego kraju. Na szczeblu państwowym polityka kulturalna
      obejmuje różnorodne działania od organizowania lekcji tańca przez wystawy sztuki
      po ustanawianie odpowiednich przepisów prawnych (uregulowania dot. przekazania
      podatku na [[Organizacja non-profit|organizacje non-profit]]) czy instytucji
      politycznych (ministerstwa kultury – polskie [[Ministerstwo Kultury i Dziedzictwa
      Narodowego]], amerykańskie National Endowment for the Humanities i [[National
      Endowment for the Arts]], brytyjskie Department for Culture, Media and Sport
      (DCMS) i Arts Council England).


      Termin “polityka kulturalna” nie odnosi się jedynie do działań w obrębie sztuki,
      ale i [[Tożsamość kulturowa|tożsamości kulturowej]], [[Tożsamość społeczna|społecznej]],
      analizie historycznych zagadnień takich jak [[kolonializm]]<ref>Mulcahy, Kevin
      V. 2006. „What is Cultural Policy?”.</ref>.


      Polityka kulturalna w wielu krajach monitorowana jest przez organizacje lub
      sieci badawcze zwane [[Obserwatorium kultury]].


      == Teoretyczne podstawy ==

      Polityka kulturalna stanowi sektor o ogromnej złożoności, mimo to przeznacza
      się na nią niewielkie środki finansowe, nawet w bardzo zamożnych państwach.
      Obejmuje wielki, heterogeniczny zbiór osób i organizacji zaangażowanych w tworzenie,
      wypracowanie, prezentację, rozpowszechnienie i zachowanie dziedzictwa kulturowego,
      edukacji na jego temat, jak również szeroko pojętych działań i artefaktów w
      obszarze rozrywki”<ref>Wyszomirski, Margaret J. 2002. “Arts and Culture.” in
      <u>The State of Nonprofit America</u>. ed. Lester M. Salamon. Washington D.C.:
      Brookings University Press.</ref>.


      Polityka kulturalna obejmuje i promuje szereg działań w zakresie:

      * [[dziedzictwo kulturowe]], pola bitewne, miejsca historyczne

      * [[Ogród zoologiczny|ogrody zoologiczne]], [[ogród botaniczny|botaniczne]],
      [[ogród dendrologiczny|dendrologiczne]], [[park]]i, [[akwarium|akwaria]]

      * [[biblioteka|biblioteki]] i [[muzeum|muzea]] (historyczne, naukowe, sztuk
      pięknych)

      * [[sztuki wizualne]] ([[malarstwo]], [[rzeźba]], [[garncarstwo]], [[architektura]])

      * sztuka widowiskowa (muzyka symfoniczna, chóralna, kameralna, jazzowa, hiphopowa,
      balet, taniec towarzyski i nowoczesny, opera, teatry muzyczne, cyrk, rodeo,
      orkiestry dęte)

      * programy humanistyczne ([[telewizja publiczna]], kreatywne pisanie, poezja)


      Z uwagi na swoją wartość kultura nie powinna być uznawana za dobro ekskluzywne
      czy wyłączną domenę danej klasy społecznej czy miasta. Zgodnie z ideami [[egalitaryzm]]u
      dobra kultury powinny być dostępne dla wszystkich bez względu na przynależność
      klasową, wykształcenie czy miejsce zamieszkania. Demokratyczna polityka kulturalna
      służąca interesowi społecznemu doprowadza do [[demokratyzacja|demokratyzacji]]
      [[kultura|kultury]].


      Celem [[demokratyzacja|demokratyzacji]] [[kultura|kultury]] jest promowanie
      sztuki, edukacyjny rozwój i podniesienie godności ogółu społeczeństwa. „Szerzenie
      polityki kulturalnej stwarza wszystkim obywatelkom i obywatelom równe szanse
      w uczestniczeniu w wydarzeniach kulturalnych organizowanych i finansowanych
      przez państwo”<ref>Duelund, Peter. 2001. “Cultural Policy in Danemark.” ''''The
      Journal of Arts Management, Law and Society''''. 31: 34-57.</ref>. Sprzyjają
      jej niskie ceny biletów na przedstawienia czy wystawy, organizowanie przez instytucje
      państwowe przedstawień/spotkań w miejscach pracy, domach późnej starości, na
      osiedlach.


      „Problem z polityką kulturalną polega na tym, że z założenia dąży ona do stworzenia
      szerokiego grona odbiorców dla sztuki, która bazuje na doświadczeniach uprzywilejowanych
      grup danej społeczności. Uznaje się za pewnik, że kulturalne potrzeby wszystkich
      obywatelek i obywateli są podobne”<ref>Langsted, Jorn, ed. 1990. <u>Strategies:
      Studies in Modern Polityka kulturalna</u>. Aarhus University Press.</ref>. Celem
      demokracji kulturalnej jest jednak uwzględnienie bardziej demokratycznego (populistycznego)
      podejścia w definiowaniu i zapewnianiu możliwości kulturalnych.

      Polityka kulturalna przyczynia się do budowy [[Kapitał kulturowy|kapitału kulturowego]],
      który przejawiają się w językowych i [[Kompetencje kulturowe|kulturowych kompetencjach]]
      jednostek i może być konwertowany w [[kapitał społeczny]] i [[kapitał ekonomiczny]].

      Ważne, by instytucje państwowe angażowały się w patronowanie kulturze, gdyż
      prywatni sponsorzy pozwalają sobie na dowolność i subiektywizm, podczas gdy
      państwowi mecenasowie mogą zostać pociągnięci do odpowiedzialności przed elektoratem
      za podjęte decyzje.


      Cele polityki kulturalnej wiążą się z debatą nad dwoma sprzecznymi koncepcjami
      sztuki, mianowicie [[elityzm]]em i [[populizm]]em. Według zwolenników pierwszego
      podejścia (ważnych instytucji kulturalnych, krytyków, artystów i dobrze wykształconych
      warstw społeczeństwa) jakość estetyczna powinna być kryterium przy przyznawaniu
      subwencji państwowej<ref>Dworkin, Ronald. 1985. “Can a Liberal State Support
      Art?” in <u>A Matter of Principle</u>. Cambridge: Harvard University Press.
      221-233.</ref>.

      Przedstawiciele drugiej strony dyskusji opowiadają się za szerszą definicją
      sztuki, mniej tradycyjnym i bardziej pluralistycznym pojęciem wartości artystycznej
      i dążą do polityki różnorodności kulturalnej. Tym samym dają szansę nieprofesjonalistom
      i osobom spoza mainstreamu. Ponadto wspierają oni mało popularne sztuki, twórczość
      folkową, etniczną, kontrkulturę<ref>Wyszomirski, Margaret J. 1982. “Controversies
      in Arts Policymaking.” in <u>Public Policy and the Arts</u>. eds. Kevin V. Mulcahy
      and C. Richard Swaim. Boulder: Westview Press.</ref>.

      Debata nad polityką kulturalną dotyczy kwestii, czy sztuki powinna być doskonała
      czy dostępna oraz czy rolą państwa jest pomaganie kulturze czy ją tworzenie<ref>Craik,
      Jennifer; McAllister, Libby; and Davis, Glyn. 2003. “Paradoxes and Contradictions
      in Government Approaches to Contemporary Cultural Policy: An Australian Perspective.”
      ''''The International Journal of Cultural Policy''''. 9: 17-34.</ref>.


      Powyższe koncepcje uznaje się zwykle za wzajemnie się wykluczające, nie zaś
      uzupełniające. Syntezę stanowi tzw. „szerokie podejście” (“latitudinarian approach”)
      do kultury publicznej – estetycznie inkluzywnej i powszechnie dostępnej<ref>[[Kevin
      V. Mulcahy|Mulcahy, Kevin V.]] 1995b. “The NEA and the Reauthorization Process:
      Congress and Arts Policy Issues.” in Mulcahy and Wyszomirski, <u>America’s Commitment
      to Culture</u>. Boulder: Westview Press.</ref><ref>Mulcahy, Kevin V. 1995c.
      “The Public Interest and Arts Policy.” in Mulcahy and Wyszomirski, <u>America’s
      Commitment to Culture</u>. Boulder: Westview Press.</ref>.


      Tak rozumiana polityka kulturalna pozostałaby wierna najwyższym standardom doskonałości
      spośród różnorodnych metod ekspresji, a jednocześnie byłaby dostępna dla ludzi
      o innych korzeniach geograficznych, socjoekonomicznych i edukacyjnych<ref>Mulcahy,
      Kevin V. 1991. “The Public Interest in Public Culture.” ''''Journal of Arts
      Management, Law and Society''''. 21: 5-25.</ref>.


      Sponsorowanie kultury przez podmioty prywatne jest korzystne dla władz państwowych,
      które mogą wtedy ograniczać wysokość subwencji. Jednak to mieszane finansowanie
      przyczynia się do prawidłowego i niezależnego rozwoju kultury. Polityka kulturalna
      jest tym samym niezbędna do stworzenia [[społeczeństwo obywatelskie|społeczeństwa
      obywatelskiego]] i pluralizmu socjoekonomicznego.


      == Zakres polityki kulturalnej ==

      Na szczeblu międzynarodowym za politykę kulturalną odpowiada [[UNESCO]]. Ministerstwa
      kultury i państwowe instytucje kulturalne mogą znaleźć odpowiednie informacje
      na stronie International Federation of Arts Councils and Culture Agencies. Na
      szczeblu lokalnym miasta i władze samorządowe mogą promować kulturę w oparciu
      o Agenda 21 for Culture.

      [[Badania polityki kulturalnej]] (lub {{link-interwiki|studia nad polityką kulturalną|Q=Q22956166}})
      stanowią obszar badań akademickich, wyrosłych z [[kulturoznawstwo|kulturoznawstwa]]
      w 1990 roku.


