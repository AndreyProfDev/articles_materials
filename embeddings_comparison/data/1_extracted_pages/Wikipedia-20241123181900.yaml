- sections:
  - content: '''''''Kultura śródziemnomorska'''''' – [[kultura]] powstała w basenie
      [[Morze Śródziemne|Morza Śródziemnego]] w pierwszym tysiącleciu przed naszą
      erą na fundamentach [[starożytny Egipt|starożytnego Egiptu]] i [[Mezopotamia|Mezopotamii]].
      Największy wpływ na jej powstanie mieli [[starożytna Grecja|starożytni Grecy]],
      [[starożytny Rzym|Rzymianie]] i [[Żydzi]]. Jest podstawą tożsamości narodów
      współczesnej [[Europa|Europy]], a powstałe w latach jej świetności dzieła stanowią
      [[dziedzictwo kulturowe]] dzisiejszej [[cywilizacja zachodnia|cywilizacji Zachodu]].
      W szerszym znaczeniu kultura śródziemnomorska rozumiana jest także jako kultura
      wyrosła z kultury starożytnej Grecji i Rzymu oraz tradycji judeochrześcijańskiej,
      które to z kolei rozwijały się, czerpiąc z dokonań starożytnego Egiptu i Mezopotamii.
      W takim rozumieniu pojęcia zakres jej wpływów oprócz Europy będzie obejmował
      [[Ameryka Północna|Amerykę Północną]] i [[Ameryka Południowa|Południową]], [[Australia|Australię]]
      i [[Afryka Południowa|południową Afrykę]].


      == Rys historyczny i charakterystyka ==

      Obszar Morza Śródziemnego stanowił teren jednolity geograficznie. Choć narody
      starożytne tego kręgu znacznie różniły się od siebie, zarówno pochodzeniem,
      jak i organizacją państwowości czy religią, to wzajemne wpływy i powiązania
      pozwalają określić ich przynależność do wspólnej kultury. Powstawała [[sztuka]]
      i [[literatura]], [[Filozofia starożytna|filozofia]], kodeksy prawa, prace o
      charakterze [[nauka|naukowym]] (w tym pierwsze dzieła [[historia|historyczne]]),
      rozwijały się religie [[politeizm|poli-]] i [[monoteizm|monoteistyczne]]. Najważniejsze
      języki, w których spisano dorobek starożytności, to [[Język hebrajski|hebrajski]],
      [[Język grecki klasyczny|greka]] i [[łacina]].

      Za najistotniejsze elementy starożytnej kultury śródziemnomorskiej uznaje się
      mitologie [[Mitologia grecka|grecką]] i [[Mitologia rzymska|rzymską]], [[Filozofia
      starożytna|grecką filozofię]], [[Prawo rzymskie|rzymskie prawo]] oraz [[Biblia|Biblię]].


      == Bibliografia ==

      * John M. Roberts, ''''Azja wschodnia i Grecja klasyczna''''. Warszawa 1999.


