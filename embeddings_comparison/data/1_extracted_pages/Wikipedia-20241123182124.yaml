  - content: '''''''Karto-Teka Gdańska'''''' – półrocznik naukowy wydawany przez [[Pomorskie
      Towarzystwo Filozoficzno-Teologiczne]] oraz [[Wydział Filologiczny Uniwersytetu
      Gdańskiego]]. Pismo wychodzi od 2017 roku<ref name=":0">[https://gdansk.gedanopedia.pl/gdansk/?title=KARTO-TEKA_GDA%C5%83SKA,_pismo
      gedanopedia.pl]

      </ref>. Problematyka podejmowana na łamach półrocznika obejmuje zagadnienia
      z obszaru filozofii, religioznawstwa, antropologii kulturowej, historii i teologii.Każdy
      numer pisma zawiera stałe działy: Artykuły (temat przewodni numeru), Varia,
      Archiwum humanistyki, Recenzje i polemiki oraz sprawozdania<ref name=":1">http://karto-teka.ptft.pl/numer-7/numer-7-artykul-13.html


      </ref>. Każdy artykuł półrocznika podlega procedurze recenzowania. Podstawową
      wersją pisma jest wersja internetowa<ref>{{Cytuj |tytuł = Karto-Teka |data dostępu
      = 2024-09-26 |opublikowany = karto-teka.ptft.pl |url = http://karto-teka.ptft.pl/}}</ref>.
      Informacja o ilości pobrań i wejść na stronę czasopisma jest ogólnie dostępna<ref>{{Cytuj
      |tytuł = Uniweryteckie Czasopisma Naukowe |data dostępu = 2024-09-26 |opublikowany
      = czasopisma.bg.ug.edu.pl |url = https://czasopisma.bg.ug.edu.pl/index.php/karto-teka}}</ref>.
      Czasopismo znajduje się na liście czasopism punktowanych przez MEiN<ref>[https://arianta.pl/#/czasopismo/50421
      Arianta - Naukowe i branżowe polskie czasopisma elektroniczne]</ref>.


      == Historia ==

      Półrocznik powstał z inicjatywy naukowców o interdyscyplinarnych zainteresowaniach,
      związanych z pomorskimi środowiskami naukowymi i działających w ramach [[Pomorskie
      Towarzystwo Filozoficzno-Teologiczne|Pomorskiego Towarzystwa Filozoficzno-Teologicznego]]<ref
      name=":2">https://www.ptft.pl/</ref>. Bezpośrednimi założycielami byli Zbyszek
      Dymarski i Maria Urbańska-Bożek, która kieruje pismem od chwili jego powstania.


      == Cele i zadania ==

      Pismo ma charakter interdyscyplinarny. Publikowane są w nim artykuły z zakresu
      szeroko pojętych nauk humanistycznych i społecznych, ze szczególnym nachyleniem
      ku filozofii, teologii, religioznawstwu oraz antropologii kulturowej. Nad utrzymaniem
      linii programowej czuwa Rada Naukowa, w skład której wchodzą uczeni z Polski
      i innych krajów<ref name=":3">http://karto-teka.ptft.pl/pismo/rada-naukowa.html</ref>.
      Rada Redakcji<ref name=":4">http://karto-teka.ptft.pl/pismo/redakcja.html</ref>
      podejmuje starania, by każdy numer półrocznika miał temat przewodni.


