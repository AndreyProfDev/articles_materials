- sections:
  - content: "{{Inne znaczenia}}\n[[Plik:Gerson-TZSP-Nauka.jpg|mały|[[Wojciech Gerson]]\
      \ (1831–1901), ''Nauka'' (1870)]]\n[[Plik:Lupa.na.encyklopedii.jpg|mały|[[Lupa]]\
      \ – [[narzędzie]] m.in. badań naukowych, wynalezione w XVII-wiecznej [[Europa|Europie]]]]\n\
      [[Plik:Science and Mechanics Nov 1931 cover.jpg|mały|Okładka ''[[Everyday Science\
      \ and Mechanics]]'' z 1931 roku]]\n\n'''Nauka''' – różnie [[Definicja|definiowany]]\
      \ element [[Kultura|kultury]], odznaczający się dążeniem do [[Wiedza|wiedzy]]<ref\
      \ name=\"epwn\">{{Encyklopedia PWN | id = 3946164 | tytuł = nauka | data dostępu\
      \ = 2023-03-18}}</ref>. Wieloznaczność pojęcia nauki ma kilka przyczyn:\n* brak\
      \ powszechnie uznanej definicji wiedzy; te najczęstsze odwołują się do [[Prawda|prawdy]],\
      \ która również jest rozumiana różnie;\n* nie wszystkie dążenia do wiedzy są\
      \ nazywane nauką – zjawiska o spornym statusie to np. [[filozofia]] czy [[teologia]];\
      \ występują też zjawiska [[Pseudonauka|pseudonauk]], [[Paranauka|paranauk]]\
      \ i [[Protonauka|protonauk]], których dążenia do wiedzy są uznawane za niepoprawne;\n\
      * wielopoziomowość terminu – nauka to zarówno:\n** ogół różnych [[Badania naukowe|badań]]\
      \ i odkryć;\n** część tego zjawiska ([[meronim]]): bardziej szczegółowa [[Dyscyplina\
      \ naukowa|dyscyplina]], co nadaje sens [[Liczba mnoga|liczbie mnogiej]] tego\
      \ słowa; przykładowo mówi się o [[Nauki ścisłe|naukach ścisłych]], [[Nauki humanistyczne|humanistycznych]]\
      \ czy [[Nauki empiryczne|empirycznych]];\n* inne użycia tego słowa w [[Język\
      \ polski|języku polskim]], np. nazywa się tak [[uczenie się]] lub [[nauczanie]],\
      \ niekoniecznie treści naukowych – przykładem jest tu [[Kazanie|kaznodziejstwo]]<ref>{{Sjp\
      \ PWN|nauka|2487587|2023-09-16}}</ref>.\n\nPróba definicji nauki to jeden z\
      \ celów [[Filozofia nauki|filozofii nauki]], konkretniej jej [[Epistemologia|epistemologicznej]]\
      \ części. Przykładowym zagadnieniem jest tu [[problem demarkacji]] – próba identyfikacji\
      \ pseudonauk i paranauk przez ogólne kryterium, czyli ścisłe określenie [[Metoda\
      \ naukowa|metody naukowej]]. Przez to epistemologia nauki przenika się z [[Metodologia|metodologią]]\
      \ – innym działem [[Naukoznawstwo|naukoznawstwa]].\n\nPod względem poznawczym\
      \ nauka wydaje się być wiedzą najlepszą, najbardziej adekwatnie opisującą [[rzeczywistość]].\
      \ Ten wysoki status poznawczy nauka zawdzięcza [[metoda naukowa|metodom]], jakie\
      \ stosuje, oraz [[Styl naukowy|językowi]], jakim się posługuje. „Ważnymi elementami\
      \ «naukowości» są język i metoda. Zdaniem wielu, zarówno naukowców jak i filozofów,\
      \ to właśnie te dwa elementy decydują o tym, czy coś jest naukowe, czy nie”<ref>[[Michał\
      \ Heller|M. Heller]], ''Filozofia nauki'', Wyd. Naukowe Papieskiej Akademii\
      \ Teologicznej w Krakowie, Kraków 1992, s. 11.</ref>. Nauka formułuje [[Prawo\
      \ nauki|prawa]] i [[Teoria naukowa|teorie]]. Wymagają one uzasadnienia; w przypadku\
      \ nauk empirycznych polega ono na konfrontacji przewidywań na nich opartych\
      \ z rezultatami doświadczenia, czyli z wynikami obserwacji, pomiarów i eksperymentów.\
      \ „Nauka rodzi się z dążenia do uzyskania wyjaśnień systematycznych, a równocześnie\
      \ podlegających kontroli w oparciu o dane (...)”<ref name=\"PWN 1961\">[[Ernest\
      \ Nagel|E. Nagel]], ''Struktura nauki'', PWN, Warszawa 1961, s. 13.</ref>.\n\
      \n[[Historia nauki]] sięga [[Prehistoria|prehistorii]] – ludzie [[paleolit]]yczni\
      \ gromadzili podstawowe informacje o otaczającym ich [[Środowisko|środowisku]],\
      \ o [[Arytmetyka elementarna|działaniach arytmetycznych]] i rachubie [[czas]]u,\
      \ np. cykliczności zjawisk [[Astronomia|astronomicznych]] jak [[Faza Księżyca|fazy\
      \ Księżyca]]. [[Starożytność]] to początki nauki rozumianej ściślej – utrwalania\
      \ wiedzy przez [[pismo]]. Wtedy też pojawili się ściśle rozumiani [[Naukowiec|naukowcy]]\
      \ jak [[Archimedes]] z [[Syrakuzy|Syrakuz]]. Zręby nauk powstały zarówno w [[Stary\
      \ Świat|Starym Świecie]], jak i [[Nowy Świat|Nowym]]; przykładowo [[Majowie]]\
      \ wytworzyli [[Kalendarz Majów|własny kalendarz]].\n\nNauka jest uprawiana w\
      \ różnych językach; część tych używanych w tym celu nie zawiera jednak pojęcia\
      \ nauki w polskim rozumieniu. Przykładowo w tradycjach [[Język angielski|angielskiej]]\
      \ i [[Język francuski|francuskiej]] najbliższym znaczeniowo terminem jest ''science'';\
      \ obejmuje on głównie matematykę i [[Nauki przyrodnicze|przyrodoznawstwo]],\
      \ bez humanistyki<ref name=\"epwn\" />. Pojęcie nauki nie jest jednak typowo\
      \ polskie; podobne znaczenie ma [[Język niemiecki|niemieckie]] ''Wissenschaft''<ref\
      \ name=\"epwn\" />.\n\n== Płaszczyzny ujmowania nauki ==\nNauka nie jest jedynie\
      \ wiedzą naukową, dlatego pełne zrozumienie, czym jest nauka, wymaga uwzględnienia\
      \ aż siedmiu jej aspektów, w których może być ujmowana<ref>[[Jan Such (filozof)|J.\
      \ Such]], M. Szcześniak, ''Filozofia nauki'', Wyd. Naukowe UAM (wyd. V), Poznań\
      \ 2006, s. 9-10.</ref><ref>Por. [[Michał Heller|M. Heller]], ''Filozofia nauki'',\
      \ Wyd. Naukowe Papieskiej Akademii Teologicznej w Krakowie, Kraków 1992, s.\
      \ 10-11.</ref>. Nauka to:\n* Pewien gatunek wiedzy, to znaczy „wiedza naukowa”,\
      \ różniąca się od wiedzy potocznej i innych gatunków wiedzy ludzkiej.\n* Pewien\
      \ rodzaj działalności: „działalność naukowo-badawcza”. Działalność ta nazywana\
      \ jest często „praktyką naukową”, której rezultatem jest właśnie wiedza naukowa.\n\
      * Określony sposób badania rzeczywistości, czyli „[[Metoda naukowa|metoda]]\
      \ naukowo-badawcza”.\n* Zespół uczonych i naukowców, którzy zawodowo poznają\
      \ świat, inaczej mówiąc, „społeczność naukowa”.\n* Zespół instytucji naukowych,\
      \ to znaczy „instytucja naukowa” złożona z akademii nauk, szkół wyższych oraz\
      \ rozmaitych instytutów naukowo-badawczych, wdrażających osiągnięcia naukowe\
      \ do różnych dziedzin życia społecznego.\n* „Świadomość naukowa” istniejąca\
      \ obok takich form świadomości społecznej, jak świadomość polityczna, prawna,\
      \ religijna, filozoficzna, etyczna czy estetyczna.\n* Składnik siły wytwórczej\
      \ nowoczesnego społeczeństwa, „naukowa siła wytwórcza”. Poczynając od połowy\
      \ XIX w., nauka zaczyna bezpośrednio uczestniczyć w wytwarzaniu najnowocześniejszych\
      \ urządzeń technicznych, takich jak samoloty, rakiety, lasery, elektrownie atomowe,\
      \ maszyny liczące, urządzenia telekomunikacyjne itp., stając się tym samym siłą\
      \ wytwórczą społeczeństwa.\n\nPowyższe aspekty nauki są przedmiotem badania\
      \ przede wszystkim [[filozofia nauki|filozofii nauki]], zwanej też teorią nauki\
      \ (niekiedy metodologią nauk) lub nauką o nauce<ref>[[Stanisław Ossowski (socjolog)|M.\
      \ i S. Ossowscy]], ''Nauka o nauce'', w: S. Ossowski, ''O nauce'', PWN, Warszawa\
      \ 1967, s. 91-102.</ref>, czyli [[Naukoznawstwo|metanauką]]. „Naukami pokrewnymi\
      \ lub pomocniczymi w stosunku do filozofii nauki są m.in. [[historia nauki]],\
      \ [[socjologia nauki]], [[psychologia nauki]], [[logika]] i oczywiście [[filozofia]]”<ref>[[Michał\
      \ Heller|M. Heller]], ''Filozofia nauki'', Wyd. Naukowe Papieskiej Akademii\
      \ Teologicznej w Krakowie, Kraków 1992, s. 12.</ref>.\n\n== Gatunki wiedzy ludzkiej\
      \ ==\n[[Plik:Schemat, Gatunki wiedzy ludzkiej.svg|thumb|250px]]\n\n{{zobacz\
      \ też|Problem demarkacji}}\nOgólnie wiedzę ludzką można podzielić na pięć gatunków<ref>[[Jan\
      \ Such (filozof)|J. Such]], M. Szcześniak, ''Filozofia nauki'', Wyd. Naukowe\
      \ UAM (wyd. V), Poznań 2006, s. 37-44.</ref><ref>[[Jan Such (filozof)|J. Such]],\
      \ ''Wstęp do metodologii ogólnej nauk'', Wyd. Naukowe UAM, Poznań 1973, s. 15.</ref>:\n\
      # w. potoczna,\n# w. naukowa,\n# w. artystyczno-literacka,\n# w. spekulatywna,\n\
      # w. irracjonalna.\n\n'''1.''' Wiedza potoczna, powszechna, zdroworozsądkowa\
      \ jest najstarszym gatunkiem wiedzy ludzkiej. Pojawiła się wraz z człowiekiem\
      \ – [[człowiek rozumny|homo sapiens]]. Dotyczy rzeczywistości bezpośrednio związanej\
      \ z człowiekiem, koncentrując się na tym, co jest dla niego użyteczne. Wyrażana\
      \ jest w nieprecyzyjnym, wieloznacznym, języku potocznym. O niższym stopniu\
      \ racjonalności wiedzy potocznej w stosunku do wiedzy naukowej świadczy fakt,\
      \ że nie spełnia ona mocnej zasady racjonalności (zwanej zasadą racjonalnego\
      \ uznawania przekonań) [Czytaj: Rozdz. 3 Wiedza naukowa, kryterium 1.]. Wiedza\
      \ potoczna stwierdza fakty, ale ich nie wyjaśnia. Zasadniczym kryterium wiedzy\
      \ potocznej jest zdrowy rozsądek.\n\nWiedza potoczna nie jest wynikiem świadomego\
      \ stosowania jakiejś metody badań, lecz stanowi produkt uboczny praktycznej\
      \ działalności ludzi. Dotyczy ona zjawisk i przedmiotów dostępnych bezpośredniej\
      \ obserwacji, co istotnie ogranicza jej zasięg, zwłaszcza w porównaniu z wiedzą\
      \ naukową, penetrującą coraz to głębsze poziomy budowy materii i coraz to większe\
      \ obszary świata<ref>J. [[Jan Such (filozof)|Such]], ''Wiedza naukowa a wiedza\
      \ potoczna'', w: B. Kotowa, J. Such, (red.), ''Kulturowe konteksty poznania'',\
      \ Wyd Naukowe Instytutu UAM, Poznań 1995, s. 23-31.</ref>.\n\n'''2.''' [[Ernest\
      \ Nagel]] (filozof nauki) twierdzi, że wiedza naukowa, „to po prostu «uporządkowana»\
      \ lub «zorganizowana» wiedza zdroworozsądkowa”<ref>[[Ernest Nagel|E. Nagel]],\
      \ ''Struktura nauki'', PWN, Warszawa 1961, s. 12.</ref>. W [[Europa|Europie]]\
      \ powstała około 2 500 lat temu. Nauka poddaje wszystkie swoje twierdzenia metodycznej\
      \ kontroli (stosuje określone [[metoda naukowa|metody naukowe]]) poprzez wielokrotne\
      \ sprawdzanie ustalonych wyników, podczas gdy wiedza potoczna jest oparta na\
      \ zdrowym rozsądku, który składa się zarówno z sądów prawdziwych, dobrze potwierdzonych,\
      \ jak też z przesądów utrwalonych przez lata. Wiedza naukowa zarówno opisuje,\
      \ jak też dąży do wyjaśniania zjawisk. Ma charakter teoretyczny: bada nie tylko\
      \ obserwowalne cechy rzeczy, zjawisk, lecz dociera do głębszych mechanizmów,\
      \ przyczyn zjawisk i praw nimi rządzących. Z uwagi na swoją precyzję [[twierdzenie\
      \ naukowe|twierdzenia naukowe]] łatwiej jest [[falsyfikacja|sfalsyfikować]],\
      \ wykazać ich fałszywość. Twierdzenia naukowe można wszechstronnie sprawdzać\
      \ i potwierdzać. Wiedza naukowa jest wiedzą znacznie pewniejszą niż wiedza potoczna\
      \ i prawdziwszą od pozostałych gatunków wiedzy ludzkiej<ref group=\"uwaga\"\
      >Bardziej szczegółowego porównania wiedzy zdroworozsądkowej i naukowej dokonuje\
      \ [[Ernest Nagel|E. Nagel]] w pracy ''Struktura nauki'', PWN, Warszawa 1961,\
      \ s. 11-22. Praca ta niemal w całości jest poświęcona problematyce \"natury\
      \ wyjaśnień naukowych, ich logicznej struktury, wzajemnych relacji, funkcji,\
      \ jakie spełniają w badaniu i ich roli w systematyzacji wiedzy\", s. 8.</ref>.\n\
      \n'''3.''' Wiedza artystyczno-literacka związana jest z literaturą i sztuką.\
      \ Obejmuje zakres działalności teoretycznej i praktycznej w [[sztuka|sztuce]]\
      \ i [[literatura|literaturze]] ([[epika]], [[liryka]] i [[dramat]]). Wiedza\
      \ ta dostarcza pewnych informacji o świecie, zwłaszcza o psychice i osobowości\
      \ ludzkiej. Literatura i sztuka docierają także do tych warstw i wymiarów złożonego\
      \ życia ludzkiego, które nie poddają się jak dotąd dokładnej analizie naukowej,\
      \ opartej na ściśle ustalonych faktach. Ze względu na swój obrazowo-[[zmysł]]owy\
      \ sposób wyrazu są one na ogół łatwo dostępne – podobnie zresztą jak wiedza\
      \ potoczna – szerokim rzeszom społeczeństwa, niezależnie od poziomu wykształcenia.\n\
      [[Plik:Skierniewice dwrzec-2.jpg|thumb|280px|Postać [[Stanisław Wokulski|Stanisława\
      \ Wokulskiego]], bohatera [[Lalka (powieść)|''Lalki'']] [[Bolesław Prus|Bolesława\
      \ Prusa]], na dworcu w [[Skierniewice|Skierniewicach]]]]\n\n'''4.''' Wiedza\
      \ spekulatywna zawarta jest głównie w [[mitologia|mitologii]] oraz systemach\
      \ spekulatywnych filozofii i [[religia|religii]]. Sposób myślenia charakterystyczny\
      \ dla wiedzy spekulatywnej miał miejsce np. w VI w. p.n.e. w społeczności greckiej,\
      \ w okresie tzw. jedności filozofii i nauki. Filozofia określana była jako „wszechnauka”,\
      \ a to pociągało za sobą ogólnikowość i spekulatywność rozważań o rzeczywistości.\
      \ Były to rozważania oparte na myśleniu [[Abstrakcja (filozofia)|abstrakcyjnym]],\
      \ oderwane od doświadczenia, nieliczące się z rzeczywistością. Dopiero później\
      \ (około IV w. p.n.e. - [[Arystoteles]]) pojawiła się wiedza oparta na logice\
      \ i doświadczeniu. Spowodowało to powstawanie pierwszych nauk szczegółowych:\
      \ astronomii, geometrii, [[statyka|statyki]], logiki, medycyny i innych nauk<ref>Zob.\
      \ [[Michał Heller|M. Heller]], ''Filozofia nauki'', Wyd. Naukowe Papieskiej\
      \ Akademii Teologicznej w Krakowie, Kraków 1992, s. 14.</ref>.\n\nCztery wymienione\
      \ gatunki wiedzy ludzkiej: potoczna, naukowa, artystyczno-literacka, spekulatywna\
      \ – tworzą wiedzę racjonalną. Wiedza racjonalna jest wiedzą intersubiektywną,\
      \ tzn. intersubiektywnie komunikowalną oraz intersubiektywnie sprawdzalną.\n\
      Wiedza intersubiektywnie komunikowalna to wiedza dostępna dla każdego normalnego\
      \ odpowiednio przygotowanego podmiotu (człowieka) poznającego.\nZ kolei wiedza\
      \ intersubiektywnie sprawdzalna to wiedza podlegająca publicznej kontroli przez\
      \ podmioty (ludzi) dysponujące odpowiednimi kwalifikacjami.\n\n'''5.''' Wiedza\
      \ irracjonalna jest nieuchwytna dla rozumu lub czasem sprzeczna z rozumem. Nie\
      \ spełnia ona nie tylko mocnej, lecz także słabej zasady racjonalności. Droga\
      \ jej poznania pozbawiona jest intersubiektywności. Jest trudna do [[komunikacja\
      \ werbalna|zwerbalizowania]] i przekazywania innym (nie jest intersubiektywnie\
      \ komunikowalna) i w konsekwencji nie podlega publicznej kontroli. Zalicza się\
      \ tu [[ezoteryka|wiedzę ezoteryczną]], poznanie [[Mistycyzm|mistyczne]], które\
      \ uzyskuje się na drodze bezpośredniego kontaktu z rzeczywistością nadprzyrodzoną,\
      \ oraz poznanie oparte na irracjonalnej [[intuicja|intuicji]] (w ujęciu [[Henri\
      \ Bergson|Bergsona]]).\n\nTakże niektóre rodzaje pseudonauki stanowią fragmenty\
      \ wiedzy irracjonalnej, które pozorują wiedzę naukową, przybierając odpowiednią\
      \ postać językową, naśladującą sformułowania naukowe<ref>[[Karl Popper|K. Popper]],\
      \ ''Problem demarkacji'', \"Zagadnienia filozoficzne w nauce\", XVII, 1995,\
      \ s. 27-33.</ref>.\n\nNatomiast paranauka to pewna otoczka wiedzy naukowej,\
      \ tzn. wiedza, która nie spełnia wszystkich kryteriów wiedzy naukowej. Z paranauki\
      \ często uczeni czerpią pomysły i [[hipoteza|hipotezy]]. W tym sensie stanowi\
      \ ona „przedsionek” wiedzy naukowej. Paranauka tak rozumiana spełnia słabą zasadę\
      \ racjonalności (zasadę intersubiektywności) i tym różni się od pseudonauki.\
      \ Paranauka nie spełnia jednak mocnej zasady racjonalności (zasady racjonalnego\
      \ uznawania przekonań)<ref>[[Jan Such (filozof)|J. Such]], M. Szcześniak, ''Filozofia\
      \ nauki'', Wyd. Naukowe UAM (wyd. V), Poznań 2006, s. 43-44.</ref>.\n\n== Wiedza\
      \ naukowa (kryteria naukowości wiedzy) ==\nJednym z zadań metanauki jest wyodrębnienie\
      \ wiedzy naukowej spośród pozostałych gatunków wiedzy ludzkiej. W tym celu formułuje\
      \ się wyróżniki wiedzy naukowej zwane zwykle kryteriami naukowości wiedzy. Ponieważ\
      \ wiedza naukowa genetycznie wywodzi się z wiedzy potocznej, zatem ustalając\
      \ kryteria wiedzy naukowej, ma się na uwadze przede wszystkim to, co różni ją\
      \ od wiedzy potocznej.\n\nDo kryteriów naukowości wiedzy należą<ref>[[Jan Such\
      \ (filozof)|J. Such]], ''O rodzajach wiedzy'', s. 5-19, „Człowiek i Społeczeństwo”\
      \ nr 2, 1986, s. 5-19.</ref>:\n\n'''1.''' Mocna (lub mocniejsza) zasada racjonalności:\
      \ zasada racjonalnego uznawania przekonań. Stwierdza ona, że stopień przekonania,\
      \ z jakim głoszony jest dany pogląd ([[twierdzenie]], [[hipoteza]], [[prawo\
      \ nauki|prawo]], teoria), powinien odpowiadać stopniowi jego (jej) uzasadnienia.\
      \ Stopień przekonania nie powinien być większy od stopnia uzasadnienia, gdyż\
      \ inaczej popada się w [[dogmatyzm]]. Nie powinien też być mniejszy, gdyż wtedy\
      \ wpada się w przesadny [[sceptycyzm]]. Mocna zasada racjonalności, spełniana\
      \ jedynie w nauce, ma zatem dwa ostrza: jedno skierowane przeciwko dogmatyzmowi,\
      \ drugie – przeciwko przesadnemu sceptycyzmowi. Zasada ta pozwala uczonemu formułować\
      \ wszelkie teorie, także mało prawdopodobne, nie wolno mu jednak przedstawiać\
      \ wstępnych hipotez roboczych jako teorie dojrzałe i dobrze uzasadnione (dogmatyzm),\
      \ ale także nie wolno poglądu dobrze uzasadnionego przedstawiać jako wstępnej\
      \ hipotezy roboczej (przesadny sceptycyzm). Inaczej uczony nie mógłby formułować\
      \ nowych śmiałych hipotez, gdyż przynajmniej początkowo są one słabo uzasadnione,\
      \ a zatem mało pewne.\n[[Plik:Prof. Kazimierz Ajdukiewicz.jpg|thumb|Prof. [[Kazimierz\
      \ Ajdukiewicz]] (1890–1963), [[Filozofia|filozof]] i logik]]\n\n[[Kazimierz\
      \ Ajdukiewicz]] (filozof i logik), który zasadę tę wyraźnie sformułował, pisze:\n\
      \n{{Cytat\n |treść = Otóż racjonalna postawa wobec przyjmowanych twierdzeń wymaga\
      \ tego, aby stanowczość, z jaką je głosimy, stanowczość dająca się mierzyć wielkością\
      \ ryzyka, które w imię tych twierdzeń gotowi jesteśmy wziąć na siebie, była\
      \ proporcjonalna do stopnia ich uzasadnienia. Znaczy to, że im bardziej surowe\
      \ i bezlitosne były próby, którym dane twierdzenie poddawaliśmy i wobec których\
      \ się ono ostało, tym bardziej stanowczo wolno nam je przyjmować. (…) Racjonalna\
      \ postawa wobec głoszonych twierdzeń nie wymaga więc tego, by twierdzenia te\
      \ były dobrze uzasadnione. Wymaga tylko tego, aby je podawać ze skromnością\
      \ odpowiadającą stopniowi ich uzasadnienia. Takiej racjonalnej postawy wymaga\
      \ naukowa cenzura od wygłaszania twierdzeń, aby je uznać za godne opublikowania,\
      \ niekoniecznie zaś tego, by były one bardzo dobrze uzasadnione”<ref>[[Kazimierz\
      \ Ajdukiewicz|K. Ajdukiewicz]], ''Język i poznanie'', t. II, PWN, Warszawa 1965,\
      \ s. 269.</ref>.\n}}\n\nObok mocnej zasady racjonalności wyróżnia się słabą\
      \ zasadę racjonalności, zwaną zasadą intersubiektywności, na którą składają\
      \ się intersubiektywna komunikowalność oraz intersubiektywna sprawdzalność.\
      \ Zasada ta nie stanowi wyraźnego wyróżnika wiedzy naukowej, gdyż jest spełniona\
      \ w pewnej mierze przez wszystkie gatunki wiedzy racjonalnej, tzn. odróżnia\
      \ wiedzę racjonalną od wiedzy irracjonalnej<ref>[[Kazimierz Ajdukiewicz|K. Ajdukiewicz]],\
      \ ''Zagadnienia i kierunki filozofii'', Wyd. Czytelnik, 1949, s. 49-50.</ref>.\n\
      \n'''2.''' Uporządkowanie logiczne wiedzy naukowej. Polega ono na systematyzacji\
      \ twierdzeń za pomocą relacji wynikania (konsekwencji): z założeń wyjściowych\
      \ wyprowadza się [[Rozumowanie dedukcyjne|dedukcyjnie]] (czyli na mocy praw\
      \ logiki) twierdzenia pochodne, które z tych pierwszych wynikają. W ten sposób\
      \ nauka buduje teorie naukowe w postaci systemów dedukcyjnych, złożonych z zasad\
      \ wyjściowych ([[aksjomat]]ów, postulatów) oraz twierdzeń z nich wynikających.\
      \ Wiedza potoczna nie odznacza się takim uporządkowaniem logicznym. Może w niej\
      \ natomiast występować uporządkowanie innego rodzaju, np. alfabetyczne, gdzie\
      \ dobrym przykładem jest książka telefoniczna, zawierająca spisy telefonów instytucji\
      \ publicznych i osób prywatnych, uszeregowane alfabetycznie.\n\n'''3.''' Zdolność\
      \ do samokrytycyzmu i samokontroli. Europejska wiedza naukowa powstała wówczas,\
      \ gdy pierwsi filozofowie greccy ([[Tales z Miletu]] i jego uczniowie ze [[Jońska\
      \ filozofia przyrody|Szkoły Jońskiej]]) zaczęli krytycznie odnosić się do wiedzy\
      \ zdobytej przez ich przodków i nauczycieli, a także do wiedzy uzyskiwanej przez\
      \ nich samych. Krytycyzm i samokrytycyzm postawy naukowej sprawia, że nauka\
      \ nie jest nigdy zadowolona z uzyskanych wyników i nieustannie dąży do nowych\
      \ lepszych rezultatów poznawczych, co sprawia, iż żaden wynik wiedzy naukowej\
      \ nie jest wiecznotrwały i każdy wchodzi do skarbnicy wiedzy naukowej tylko\
      \ na tak długo, dopóki nauka nie uzyska lepszego wyniku. W nauce jest zatem\
      \ tak jak w [[technika|technice]], gdzie urządzenia techniczne są stale zastępowane\
      \ przez urządzenia coraz lepsze, to znaczy coraz bardziej wydajne i coraz bardziej\
      \ oszczędne pod względem ekonomicznym. W tym kontekście wiedza potoczna i pozostałe\
      \ gatunki wiedzy pozanaukowej mają charakter bardziej [[apologia|apologetyczny]]:\
      \ w większym stopniu ufają swoim dotychczasowym ustaleniom i są raczej zadowolone\
      \ z osiągniętych wyników.\nNie wszystkich uczonych i nie zawsze stać na odpowiedni\
      \ krytycyzm i dystans wobec swoich poglądów. Ale krytyka, której nie jest w\
      \ stanie przeprowadzić sam inicjator nowych pomysłów, jest realizowana w ramach\
      \ szerszej społeczności naukowej, która dokonuje (powinna dokonywać) bezlitosnej\
      \ selekcji nowo formułowanych hipotez i przypuszczeń.\n\n'''4.''' Wysoka moc\
      \ eksplanacyjna, tzn. wyjaśniająca. Nauka nie tylko opisuje zjawiska, czyli\
      \ odpowiada na pytanie „jak” zjawiska przebiegają, lecz także wyjaśnia przebieg\
      \ zjawisk, czyli odpowiada na pytanie „dlaczego” zjawiska zachodzą tak a nie\
      \ inaczej. Wyjaśnianie zjawisk (a także praw rządzących zjawiskami) wymaga sięgnięcia\
      \ do głębszych warstw rzeczywistości, wymaga poznania przyczyn zjawisk, praw\
      \ nimi rządzących oraz mechanizmów wewnętrznych ich przebiegu. Dlatego wiedza\
      \ potoczna, ślizgająca się jakby po powierzchni [[zjawisko|zjawisk]], ma – w\
      \ odróżnieniu od nauki – niską moc wyjaśniającą. „[I] właśnie specyficznym celem\
      \ nauki jest organizacja i klasyfikacja wiedzy w oparciu o zasady wyjaśniające”<ref\
      \ name=\"PWN 1961\" />.\n\nWedług Karla R. [[Karl Popper|Poppera]] wielka moc\
      \ wyjaśniająca wiedzy naukowej wynika z faktu, że nauka buduje teorie i prawa\
      \ naukowe o coraz większej zawartości informacyjnej (logicznej i [[empiryzm|empirycznej]]).\
      \ Wyznaczona jest ona przez ogólność i ścisłość twierdzeń: im twierdzenie jest\
      \ bardziej ogólne i bardziej ścisłe, tym ma większą zawartość informacyjną,\
      \ co pociąga coraz większą moc wyjaśniania. „Uważam, że celem nauki jest poszukiwanie\
      \ dobrych wyjaśnień dla wszystkiego, co według nas potrzebuje wyjaśnienia”<ref>[[Karl\
      \ Popper|K. Popper]], ''Wiedza obiektywna. Ewolucyjna teoria epistemologiczna'',\
      \ PWN, Warszawa 1992, s. 249.</ref>.\n\n'''5.''' Wysoki stopień uteoretycznienia\
      \ (teoretyczności) wiedzy naukowej (kryterium ściśle związane z poprzednim).\
      \ Teorie naukowe – w odróżnieniu od wiedzy potocznej – nie opisują bezpośrednio\
      \ zjawisk rzeczywistych obserwowalnych [[zmysł]]owo, z którymi stykamy się na\
      \ co dzień, lecz opisują ich uproszczone modele zwane niekiedy typami idealnymi.\
      \ Tak na przykład [[mechanika klasyczna]] w swym najbardziej ogólnym sformułowaniu\
      \ nie jest mechaniką ciał fizycznych, lecz „mechaniką punktów materialnych”,\
      \ czyli konstruktów teoretycznych pozbawionych rozciągłości, aczkolwiek wszystkie\
      \ obiekty rzeczywiste podstawiane za [[punkt materialny|punkty materialne]]\
      \ w konkretnych zastosowaniach mechaniki mają pewne rozmiary przestrzenne. Stąd\
      \ np. w [[fizyka|fizyce]] mamy tak wiele pojęć dotyczących bezpośrednio nie\
      \ obiektów rzeczywistych, lecz ich wyidealizowanych modeli, jak „punkt materialny”,\
      \ „[[ciało doskonale sztywne]]”, „[[ciało doskonale czarne]]”, „[[Swobodny spadek|spadek\
      \ swobodny]]”, „[[układ inercjalny]]”, „[[ciecz idealna]]”, „[[gaz doskonały]]”\
      \ itp. Właśnie dzięki temu, że wiedza naukowa ma charakter teoretyczny (i zarazem\
      \ idealizacyjny), może ona sięgać do głębszych poziomów rzeczywistości i opisywać\
      \ bardziej istotne czynniki przemian, pomijać zaś czynniki drugorzędne, uboczne,\
      \ przypadkowe, nieodgrywające istotnej roli w przebiegu opisywanych zjawisk.\n\
      \nNauka, stosując metody modelowania, [[Abstrakcja (filozofia)|abstrakcji]]\
      \ i [[Idealizacja (psychologia poznawcza)|idealizacji]], pomija w zjawiskach\
      \ aspekty mniej istotne, by docierać do wewnętrznych mechanizmów i prawidłowości,\
      \ ukrytych przed naszymi zmysłami.\n\n'''6.''' Wysoka moc przewidywania (moc\
      \ prognostyczna) wiedzy. Wiedza naukowa dostarcza znacznie lepszych, niż inne\
      \ gatunki wiedzy, środków służących celom niezawodnego oraz dokładnego przewidywania\
      \ w wielu dziedzinach. Przewidywanie natomiast jest nieodzownym warunkiem skutecznego\
      \ działania, stąd także wielkie znaczenie praktyczne wiedzy naukowej.\n\n'''7.'''\
      \ Wysoka moc [[Heurystyka (zarządzanie)|heurystyczna]] polega na płodności osiągniętej\
      \ wiedzy naukowej w procesie zdobywania nowej wiedzy<ref>[[Imre Lakatos|I. Lakatos]],\
      \ ''Pisma z filozoficznych nauk empirycznych'', PWN, Warszawa 1995, s. 110-113.</ref>.\
      \ Zgromadzona dotąd wiedza naukowa stanowi zawsze nieodzowny i potężny instrument\
      \ zdobywania nowej wiedzy. Większa niż w innych gatunkach użyteczność wiedzy\
      \ naukowej jest związana z takimi jej walorami, jak wysoki stopień usystematyzowania,\
      \ ogólności, ścisłości, uteoretycznienia oraz wysoka moc prognostyczna i eksplanacyjna.\n\
      [[Plik:Inside the CERN LHC tunnel.jpg|thumb|320px|Tunel we wnętrzu [[Wielki\
      \ Zderzacz Hadronów|Wielkiego Zderzacza Hadronów]] ([[akcelerator cząstek|akceleratora\
      \ cząstek]]), otwarty we wrześniu 2008 r. w [[CERN]].]]\n\nWymienione najważniejsze\
      \ kryteria naukowości wiedzy nie wyczerpują całej ich listy. Nie dają się też\
      \ one skonkretyzować ani uściślić (w drodze np. wskazania jak wysoki poziom\
      \ usystematyzowania, ogólności, ścisłości itp. powinny osiągnąć nowo formułowane\
      \ twierdzenia, aby mogły być włączone do nauki), dopóki mowa jest o nauce w\
      \ ogóle. Rozmaite bowiem działy nauk na różnych szczeblach ich rozwoju stawiają\
      \ formułowanym w ich ramach twierdzeniom niejednakowo surowe wymagania pod wskazanymi\
      \ wyżej (siedmioma) względami. Można to wytłumaczyć tym, że kryteria naukowości\
      \ wiedzy są, po pierwsze, historycznie zmienne, a po drugie, zrelatywizowane\
      \ do dyscypliny, wobec tego nie mają ponadczasowego (ponadhistorycznego, uniwersalnego)\
      \ znaczenia. Jeśli pragnie się je uściślić lub skonkretyzować, to trzeba przejść\
      \ na grunt rozważań dotyczących poszczególnych działów nauk lub nawet pojedynczych\
      \ dyscyplin naukowych. W miarę rozwoju nauki, rosną też wymagania stawiane kryteriom\
      \ naukowości wiedzy.\n\n'''Kryteria naukowości, odróżniające wiedzę naukową\
      \ od pozostałych rodzajów wiedzy, mogą być ujmowane zarazem jako cele poznania\
      \ naukowego.'''\n\n== Cele poznania naukowego oraz funkcje społeczne nauki ==\n\
      Wiedza naukowa zawdzięcza swój wysoki status poznawczy temu, że nauka jest nastawiona\
      \ na zdobywanie prawdy niebanalnej, do której trudno jest dotrzeć, ale która\
      \ jest zarazem interesująca teoretycznie oraz użyteczna praktycznie. Jest interesująca\
      \ teoretycznie, gdyż służy wypełnianiu przez naukę jej funkcji teoretycznej:\
      \ wyjaśnianiu i zrozumieniu zjawisk i procesów zachodzących w świecie. Jest\
      \ użyteczna praktycznie, gdyż służy pełnieniu przez naukę jej drugiej ważnej\
      \ funkcji społecznej – funkcji praktycznej: przewidywaniu zachodzenia i przebiegu\
      \ zjawisk. Przewidywanie jest określane mianem funkcji praktycznej nauki z uwagi\
      \ na to, że bez przewidywania tego, co ma zajść nie ma skutecznego działania,\
      \ czyli przekształcania rzeczywistości zgodnie z potrzebami człowieka<ref>Por.\
      \ [[Władysław Krajewski (filozof)|W. Krajewski]], ''Współczesna filozofia naukowa'',\
      \ rozdz. 5/E. ''Aksjologia (cele) nauki'', Wyd. Uniwersytet Warszawski, Wydział\
      \ Filozofii i Socjologii, Warszawa 2005. s. 90-95.</ref>. Specyficzna funkcja\
      \ praktyczna nauki polega zatem na dostarczaniu pozostałym układom społecznym,\
      \ z układem gospodarczym (czyli produkcyjnym) na czele, wiedzy oraz umiejętności,\
      \ zapewniających im efektywne funkcjonowanie. Jest to przede wszystkim wiedza\
      \ technicznoużytkowa o charakterze [[predykcja|predykcyjnym]], gdyż bez przewidywania\
      \ nie ma skutecznego działania<ref>[[Jerzy Kmita|J. Kmita]], ''Szkice z teorii\
      \ poznania naukowego'', PWN, Warszawa 1976, s. 93-98.</ref>.\nWyjaśnianie i\
      \ zrozumienie zjawisk jest niemożliwe bez założenia, że celem osiągalnym nauki\
      \ jest poznanie prawdziwe, do którego nauka zmierza. Celem dążeń naukowych jest\
      \ prawda<ref group=\"uwaga\">U Karla Poppera prawda przybiera postać prawdoupodobnienia.\
      \ Zob. [[Karl Popper|K. Popper]], ''Wiedza obiektywna. Ewolucyjna teoria epistemologiczna'',\
      \ PWN, Warszawa 1992, rozdz. 2, §§ 6-11, s. 65-86. Zobacz też A. Motycka, s.\
      \ 12-22.</ref>. Według rekonstrukcji stanowisk Einsteina i Poppera, przeprowadzonej\
      \ przez [[Jan Such (filozof)|Jana Sucha]], prawda naukowa powinna spełniać co\
      \ najmniej pięć ważnych walorów poznawczych<ref>[[Jan Such (filozof)|J. Such]],\
      \ ''Problemy weryfikacji wiedzy'', PWN, Warszawa 1975, s. 7-8.</ref>.\n\nSą\
      \ nimi:\n# ogólność (wysoki stopień ogólności),\n# dokładność, ścisłość, precyzja\
      \ (wysoki stopień ścisłości, dokładności),\n# wysoka informacyjna zawartość,\n\
      # wysoka prostota logiczna,\n# pewność [[epistemologia|epistemologiczna]].\n\
      \n'''1.''' Twierdzenie jest tym ogólniejsze, im szerszy jest jego [[Podmiot\
      \ (filozofia)|podmiot]]. Na przykład twierdzenie „wszystkie kruki są czarne”\
      \ jest ogólniejsze, niż twierdzenie „wszystkie kruki żyjące w Polsce są czarne”.\
      \ Uczeni nie poprzestają nigdy na formułowaniu twierdzeń jednostkowych, tzn.\
      \ dotyczących pojedynczych zjawisk. Twierdzenia jednostkowe (oraz szczegółowe,\
      \ zwane też egzystencjalnymi) służą w nauce przeważnie jako przesłanki do uogólnień\
      \ ([[Rozumowanie indukcyjne|indukcyjnych]] i innych), w których wyniku uzyskuje\
      \ się twierdzenia o dużym szczeblu ogólności, niekiedy twierdzenia uniwersalne,\
      \ dotyczące (przynajmniej w domniemaniu) wszystkich zjawisk zachodzących w świecie.\
      \ Na przykład uczony, mając solidne podstawy do przypuszczenia, że „wszystkie\
      \ ciała się przyciągają”, nie będzie formułować twierdzeń w rodzaju: „wszystkie\
      \ planety się przyciągają” lub „wszystkie cygara się przyciągają”, lecz sformułuje\
      \ – jak to uczynił [[Isaac Newton|Newton]] – „prawo powszechnej grawitacji”.\
      \ Nawet tzw. nauki idiograficzno-nomologiczne (zwane dawniej [[idiografizm|idiograficznymi]]),\
      \ jak historia, nie ograniczają się do formułowania twierdzeń jednostkowych,\
      \ lecz poszukują prawdziwych twierdzeń ogólnych: praw lub generalizacji historycznych<ref>[[Jan\
      \ Such (filozof)|J. Such]], ''Problemy weryfikacji wiedzy'', PWN, Warszawa 1975,\
      \ s. 38-42.</ref>.\n\n'''2.''' Z kolei dokładność (ścisłość) twierdzenia zależy\
      \ od jego orzecznika: im [[orzecznik]] jest węższy, tym twierdzenie jest dokładniejsze.\
      \ Na przykład z dwóch twierdzeń: „wszystkie kruki są czarne” oraz „wszystkie\
      \ kruki są czarne lub białe”, dokładniejsze jest to pierwsze, gdyż ma węższy\
      \ orzecznik: jednoznacznie stwierdza, że wszystkie kruki są czarne. Podobnie,\
      \ z dwu twierdzeń, z których jedno głosi, że „wszystkie ciała grawitują” (tzw.\
      \ jakościowe prawo grawitacji, znane np. [[Mikołaj Kopernik|Kopernikowi]]),\
      \ drugie zaś, że „wszystkie ciała grawitują z siłą wyznaczoną przez wzór F =\
      \ m<sup>1</sup> x m<sup>2</sup><big>/</big>r<sup>2</sup> (ilościowe [[Prawo\
      \ powszechnego ciążenia|prawo grawitacji]] sformułowane przez Newtona), znacznie\
      \ bardziej precyzyjne jest to drugie, gdyż dokładnie wyznacza wielkość siły\
      \ grawitacyjnej działającej między masami. Na tym przykładzie widać, że matematyka\
      \ stanowi potężny środek zawężania orzecznika i tym samym uściślania twierdzeń,\
      \ dzięki temu że przekształca twierdzenia (w tym prawa) jakościowe w twierdzenia\
      \ (prawa) ilościowe, dlatego też wszędzie tam, gdzie jest to możliwe, nauka\
      \ nadaje swoim twierdzeniom ścisłą postać matematyczną.\n\n'''3.''' Informacyjna\
      \ zawartość [[empiryzm|empiryczna]] (treść empiryczna w ujęciu Poppera)<ref>[[Karl\
      \ Popper|K. Popper]], ''Logika odkrycia naukowego'', PWN, Warszawa 1977, rozdz.\
      \ VI § 35, s. 101-102.</ref>. Treść empiryczna teorii wyznaczona jest przez\
      \ klasę jej potencjalnych falsyfikatorów. Twierdzenia naukowe (w tym prawa)\
      \ oraz ich [[zbiór|zbiory]] (w tym teorie) wiele i dokładnie mówią o rzeczywistości.\
      \ Informacyjna zawartość twierdzenia zależy zarówno od ogólności, jak też od\
      \ ścisłości twierdzenia: im twierdzenie jest bardziej ogólne i bardziej ścisłe,\
      \ tym wyższa jest jego informacyjna zawartość. Z kolei informacyjna zawartość\
      \ twierdzenia czy teorii wyznacza stopień jego (jej) sprawdzalności, zwłaszcza\
      \ sprawdzalności negatywnej czyli falsyfikowalności. Z tego powodu Popper uznał\
      \ wysoką informacyjną zawartość (logiczną i empiryczną treść) twierdzeń (w tym\
      \ praw i teorii naukowych) za podstawowy cel poznawczy nauki<ref>[[Karl Popper|K.\
      \ Popper]], ''Logika odkrycia naukowego'', PWN, Warszawa 1977, s. 112.</ref>.\n\
      Rekonstrukcję stanowiska Poppera w kwestii celów poznania naukowego reprezentuje\
      \ poniższy schemat<ref group=\"uwaga\">Schemat opracowany na podstawie: [[Jan\
      \ Such (filozof)|J. Such]], M. Szcześniak, 2006, s. 46.</ref>:\n\n[[Plik:Schemat\
      \ Poppera.svg|500px|central]]\n\nNauka zatem – według niego – buduje teorie\
      \ o coraz większej informacyjnej zawartości, czyli o coraz większej empirycznej\
      \ treści, a to znaczy takie, które mówią coraz więcej o świecie<ref>[[Karl Popper|K.\
      \ Popper]], ''Logika odkrycia naukowego'', PWN, Warszawa 1977, s. 101-112.</ref>.\
      \ Dlatego też teorie naukowe mają olbrzymią ilość zastosowań w różnych dziedzinach.\
      \ Klasycznym przykładem jest [[mechanika klasyczna|mechanika Newtona]], która\
      \ wraz z teorią grawitacji wyjaśnia takie zjawiska, jak ruchy [[ciało niebieskie|ciał\
      \ niebieskich]] (w tym [[planeta|planet]]), ''Logika odkrycia naukowego'' (PWN,\
      \ Warszawa 1977), [[pływy morskie|pływy]] (tzn. przypływy i odpływy) mórz i\
      \ oceanów, spadanie ciał, ruch wahadła, stabilność mostów, prace maszyn itd.\n\
      \n'''4.''' Prostota logiczna teorii jest wyznaczona przez ilość założeń wyjściowych\
      \ ([[aksjomat]]ów, postulatów, zasad) teorii oraz ilość jej twierdzeń pochodnych\
      \ (wyznaczających informacyjną zawartość teorii): im mniejsza jest liczba założeń\
      \ wyjściowych teorii i większa liczba twierdzeń pochodnych, tym teoria jest\
      \ bardziej prosta (i zwarta) logicznie, w związku z czym, odznacza się także\
      \ większą doskonałością wewnętrzną<ref>[[Jan Such (filozof)|J. Such]], ''Multiformity\
      \ of Science'', Wyd. Rodopi, Amsterdam – New York, NY 2004, s. 106.</ref><ref>[[Gottfried\
      \ Wilhelm Leibniz|G. W. Leibniz]], ''New Essays on Human Understanding'', Cambridge\
      \ University Press, Cambridge 1981, s. 285.</ref>.\n\n{{Cytat\n |treść = Naukowe\
      \ tworzenie pojęć i metoda naukowa różnią się od wiedzy potocznej jedynie większą\
      \ ścisłością pojęć i wnioskowań, staranniejszym i bardziej systematycznym doborem\
      \ materiału doświadczalnego, a także oszczędnością w sensie logicznym. Należy\
      \ przez to rozumieć dążenie do ufundowania wszystkich pojęć i relacji na możliwie\
      \ najmniejszej liczbie niezależnych od siebie logicznie podstawowych pojęć i\
      \ aksjomatów<ref>[[Albert Einstein|A. Einstein]], ''Pisma filozoficzne'', De\
      \ Agostini Altaya, Warszawa 2001, s. 232.</ref>.\n}}\n\nProstota logiczna teorii\
      \ uznawana jest przez [[Albert Einstein|Alberta Einsteina]] za główny cel wewnętrzny\
      \ (poznawczy), do którego zmierza nauka. Stawia ona uporządkowaniu logicznemu\
      \ wiedzy naukowej [Czytaj: rozdz. 3, kryterium 2] formułowanej w teoriach naukowych\
      \ dwa mocne postulaty dotyczące uporządkowania logicznego teorii naukowych:\
      \ nowa teoria zastępująca dotychczasową w danej dziedzinie powinna być od niej\
      \ po pierwsze, teorią o większej ilości twierdzeń pochodnych (wyznaczających\
      \ zawartość informacyjną teorii) oraz, po drugie, teorią zawierającą mniej twierdzeń\
      \ wyjściowych (zasad, aksjomatów). Wyraża to schemat<ref>[[Jan Such (filozof)|J.\
      \ Such]], ''Na czym polega piękno ogólnej teorii względności'', s. 45-62, \"\
      Studia Metodologiczne\" nr 33, 2014, s. 47.</ref>:\n\n[[Plik:Schemat, Prostota\
      \ logiczna.svg|600px|central]]\nSpełnienie obydwu podanych postulatów jest możliwe\
      \ jedynie pod warunkiem, że twierdzenia wyjściowe nowej teorii są logicznie\
      \ mocniejsze (tzn. zawierają więcej konsekwencji logicznych, czyli twierdzeń\
      \ z niej wynikających), niż twierdzenia wyjściowe wcześniejszej teorii. Na przykład\
      \ [[ogólna teoria względności]], która zastąpiła mechanikę klasyczną oraz teorię\
      \ grawitacji Newtona, spełnia oba postulaty.\n\n{{Cytat\n |treść = Celem nauki\
      \ jest, po pierwsze, możliwie najbardziej pełne uchwycenie doznań zmysłowych\
      \ w całej ich różnorodności, po drugie jednak osiągnięcie tego celu przy zastosowaniu\
      \ minimum pierwotnych pojęć i relacji (dążenie do możliwie największej logicznej\
      \ jednolitości obrazu świata względnie logicznej prostoty jego podstaw)<ref>[[Albert\
      \ Einstein|A. Einstein]], ''Pisma filozoficzne'', De Agostini Altaya, Warszawa\
      \ 2001, s. 199-200.</ref>.\n}}\n\nProstota logiczna – obok dwu walorów, uwzględnianych\
      \ przez informacyjną zawartość (ogólność i ścisłość) – bierze pod uwagę także\
      \ ilość założeń wyjściowych teorii, które łącznie składają się na „doskonałość\
      \ wewnętrzną teorii” (wyrażenie Einsteina). Schemat hierarchii celów poznawczych\
      \ Einsteina<ref group=\"uwaga\">Schemat opracowany na podstawie: [[Jan Such\
      \ (filozof)|J. Such]], M. Szcześniak, 2006, s. 47.</ref> ma zatem postać:\n\n\
      [[Plik:Schemat Einsteina.svg|500px|central]]\n\nWzrastająca prostota logiczna\
      \ kolejno budowanych w nauce teorii pociąga za sobą niestety wzrastającą złożoność\
      \ matematyczną teorii, co utrudnia zrozumienie wiedzy naukowej przez laika.\n\
      \n{{Cytat\n |treść = Rozwój [nauki<ref group=\"uwaga\">Einstein, rozwój nauki\
      \ przedstawia na przykładzie ewolucji fizyki, jako najbardziej rozwiniętej nauki:\
      \ „Fizyka jest rozwijającym się logicznym systemem myślowym, którego podstawy\
      \ nie mogą być metodą indukcyjną wydestylowane z doznań, można je uzyskać jedynie\
      \ jako swobodny twór myśli.” [[Albert Einstein|A. Einstein]], s. 230.</ref>]\
      \ zachodzi w kierunku rosnącej prostoty podstaw logicznych. Aby przybliżyć się\
      \ do tego celu, musimy pogodzić się z tym, że podstawy logiczne będą coraz dalsze\
      \ od doznań, a droga logiczna od podstaw do tych konsekwencji, które znajdują\
      \ korelat w doznaniach zmysłowych, będzie coraz trudniejsza i dłuższa<ref>[[Albert\
      \ Einstein|A. Einstein]], ''Pisma filozoficzne'', De Agostini Altaya, Warszawa\
      \ 2001, s. 230.</ref>.\n}}\n\nStąd słynne powiedzenie (przypisywane Einsteinowi),\
      \ które brzmi paradoksalnie, gdy się nie uwzględni dwóch rozważanych rodzajów\
      \ prostoty, logicznej i matematycznej: „Nauka dlatego jest tak złożona, że jest\
      \ tak prosta”. Paradoksalność powyższej wypowiedzi znika przy prostym uzupełnieniu:\
      \ „Nauka dlatego jest tak złożona matematycznie, że jest tak prosta logicznie”<ref>[[Jan\
      \ Such (filozof)|J. Such]], ''Na czym polega piękno ogólnej teorii względności'',\
      \ s. 45-62, \"Studia Metodologiczne\" nr 33, 2014, s. 51.</ref>.\n\n'''5.'''\
      \ Pewność epistemologiczna (z gr. ''epistēmē'' – wiedza) twierdzeń i teorii\
      \ naukowych. Kolejne teorie naukowe następujące po sobie w danej dziedzinie\
      \ mają coraz lepsze uzasadnienie w doświadczeniu, są coraz lepiej ugruntowane\
      \ w faktach. Uczeni (różnych specjalności) w zasadzie godzą się na takie stwierdzenie\
      \ w przekonaniu, że rozwój wiedzy naukowej prowadzi do teorii o coraz większym\
      \ stopniu prawdziwości oraz coraz większym stopniu pewności. Natomiast wśród\
      \ filozofów nauki, metodologów toczą się ostre spory na ten temat<ref group=\"\
      uwaga\">Najczęściej jest tak, że zwolennicy zasady korespondencji (tacy jak\
      \ A. [[Albert Einstein|Einstein]], N. [[Niels Bohr|Bohr]], K. [[Karl Popper|Popper]],\
      \ [[Imre Lakatos|I. Lakatos]], J. [[Giedymin]], J. [[Jerzy Kmita|Kmita]], W.\
      \ [[Władysław Krajewski (filozof)|Krajewski]], L. [[Nowak]], [[Jan Such (filozof)|J.\
      \ Such]]) są przekonani, że nauka realizuje postęp poznawczy, natomiast przeciwnicy\
      \ tej zasady (tacy jak [[Pierre Duhem|P. Duhem]], T. [[Thomas Kuhn|Kuhn]], [[Paul\
      \ Feyerabend|P. Feyerabend]], N. Hanson, [[Stephen Toulmin|S. Toulmin]], [[Stefan\
      \ Amsterdamski|S. Amsterdamski]]) wyrażają w tej kwestii rozmaite wątpliwości.\
      \ Główny kłopot polega na tym, że nikomu (tzn. żadnej szkole metodologicznej)\
      \ nie udało się wprowadzić ilościowego pojęcia stopnia potwierdzenia ([[Sprawdzanie|konfirmacji]])\
      \ teorii przez doświadczenie. W związku z powyższym w ocenie teorii naukowych\
      \ można jedynie w sposób zasadny i rozsądny posługiwać się „stopniem porównawczym”\
      \ w ocenie przybliżenia teorii naukowej do prawdy oraz ustaleniem stopnia jej\
      \ pewności. Wynika stąd, że także zwolennik [[Zasada odpowiedniości|zasady korespondencji]]\
      \ czuje się uprawniony co najwyżej do orzekania, że dana teoria (np. znajdująca\
      \ się w relacji korespondencji do swej poprzedniczki) jest od niej prawdziwsza\
      \ i pewniejsza, przynajmniej pod pewnymi względami, bez próby określenia absolutnego\
      \ stopnia jej przybliżenia do prawdy.</ref>.\n\nPięć wymienionych celów poznawczych\
      \ sprawia, że nauka, osiągając je, dochodzi do prawdy niebanalnej, tzn. interesującej\
      \ teoretycznie i zarazem użytecznej praktycznie, co pozwala nauce pełnić dwie\
      \ ważne funkcje społeczne: funkcję teoretyczną polegającą na coraz lepszym rozumieniu\
      \ świata oraz funkcję praktyczną polegającą na dostarczaniu ludziom coraz lepszych,\
      \ tzn. coraz dokładniejszych i bardziej pewnych, przewidywań służących skutecznemu\
      \ działaniu.\n\nKarl R. Popper główny cel nauki określa różnie w zależności\
      \ od kontekstu rozważań. W jednym miejscu celem nauki jest poszukiwanie prawdy\
      \ (prawdoupodobnienie)<ref>Zob. [[Karl Popper|K. Popper]], ''Wiedza obiektywna.\
      \ Ewolucyjna teoria epistemologiczna'', PWN, Warszawa 1992, rozdz. 2, §§ 6-11,\
      \ s. 65-86.</ref><ref>[[Imre Lakatos|I. Lakatos]], ''Pisma z filozoficznych\
      \ nauk empirycznych'', PWN, Warszawa 1995, s. 243-244, 261-269.</ref>, w innym\
      \ – poszukiwanie dobrych wyjaśnień<ref>Zob. [[Karl Popper|K. Popper]], ''Wiedza\
      \ obiektywna. Ewolucyjna teoria epistemologiczna'', PWN, Warszawa 1992, s. 248-264.</ref>,\
      \ w jeszcze innym – budowanie twierdzeń o wysokiej informacyjnej zawartości\
      \ (z tym, że najczęściej Popper używa w tym sensie określenia „treść teorii\"\
      )<ref>[[Karl Popper|K. Popper]], ''Logika odkrycia naukowego'', PWN, Warszawa\
      \ 1977, s. 112, 305, 318 (przypis 8), 322, i inne.</ref>.\n\n== Klasyfikacja\
      \ nauk ==\n{{zobacz też|Klasyfikacja nauk|Dziedzina nauki}}\n\n[[Klasyfikacja\
      \ nauk]] wyróżnia m.in. [[Dychotomia|dychotomię]]:\n* [[nauki formalne]], inaczej\
      \ [[A priori|aprioryczne]] lub [[Dedukcja|dedukcyjne]];\n* [[nauki empiryczne]],\
      \ inaczej [[A posteriori|aposterioryczne]] lub [[Obserwacja (metoda badawcza)|obserwacyjne]];\
      \ bywały też nazywane [[Rozumowanie indukcyjne|indukcyjnymi]], choć [[Albert\
      \ Einstein]] i [[Karl Popper]] podkreślali, że korzystają one też z [[Metoda\
      \ hipotetyczno-dedukcyjna|metody hipotetyczno-dedukcyjnej]]{{fakt|data=2023-09}}.\n\
      \nIstnieją przy tym dyscypliny z pogranicza jak [[fizyka matematyczna]] czy\
      \ [[informatyka]], do której zalicza się zarówno rozważania abstrakcyjne ([[teoria\
      \ obliczeń]]), jak i [[Eksperyment|doświadczenia]] z użyciem [[komputer]]ów.\
      \ Inna para [[Zbiór|zbiorów]] nauk, zwykle uznawanych za rozłączne, to:\n* [[nauki\
      \ ścisłe]] – część nauk formalnych i empirycznych obejmująca [[Matematyka|matematykę]]\
      \ i nauki oparte na niej, np. na [[Metody ilościowe|metodach ilościowych]];\n\
      * [[nauki humanistyczne]] – przede wszystkim jest to część badań empirycznych\
      \ poświęcona działalności [[Człowiek (rodzaj)|człowieka]] ([[Kultura|kulturze]]);\
      \ włącza się też do nich rozważania bardziej formalne, nad [[Implikacja logiczna|konsekwencjami]]\
      \ pewnych treści – przykłady to [[dogmatyka prawa]] czy [[teologia dogmatyczna]]{{fakt|data=2023-09}}.\n\
      \nTa [[typologia]] nie jest już dychotomią, ponieważ nie jest wyczerpująca –\
      \ nie jest [[Pokrycie zbioru|pokryciem]] zbioru nauk; [[psychologia]] obejmuje\
      \ badania, które nie są ani ścisłe, ani humanistyczne, przynajmniej ''sensu\
      \ stricto'', np. niektóre [[Metody jakościowe|analizy jakościowe]]{{fakt|data=2023-09}}.\
      \ Teologia również nie jest nauką ścisłą, przy czym bywa włączana do nauk, ale\
      \ nie do humanistycznych, np. w zestawieniu [[Dziedzina nauki|dziedzin nauki]]\
      \ używanym w polskich przepisach. Inne szerokie kategorie to [[nauki podstawowe]]\
      \ – inaczej teoretyczne lub czyste – i [[nauki stosowane]]. Podane kategoryzacje\
      \ bywają mieszane; przykładowo:\n* we wspomnianym zestawieniu dziedzin nauki\
      \ figurują równorzędnie obok siebie nauki humanistyczne i [[Nauki społeczne|społeczne]]\
      \ uważane za część empirycznych;\n* jedna z kategorii [[Nagroda Fundacji na\
      \ rzecz Nauki Polskiej|Nagrody Fundacji na rzecz Nauki Polskiej]] jest przyznawana\
      \ za badania [[Suma zbiorów|z obu tych obszarów]]; w latach 1992–2010 rozdzielano\
      \ też nagrody dla przedstawicieli nauk ścisłych i [[Nauki przyrodnicze|przyrodniczych]],\
      \ uważanych za część empirycznych.\n\n[[Klasyfikacja naukowa|Klasyfikacja]]\
      \ nauk polega na wyodrębnianiu – na podstawie określonych kryteriów – głównych\
      \ działów nauki, a następnie na ich podziale na dyscypliny szczegółowe. Najczęściej\
      \ stosowane są kryteria przedmiotowe (różnice w przedmiocie badania) oraz metodologiczne\
      \ (różnice w metodach badawczych). Ważne są również rodzaj stawianych problemów\
      \ i formułowanych twierdzeń oraz sposób uzasadniania twierdzeń, a także typ\
      \ wyjaśniania, zadania i cele. Klasyfikacja jest zawsze podporządkowana określonym\
      \ celom, takim jak funkcje pełnione przez naukę w społeczeństwie, potrzeby dydaktyki,\
      \ bibliotekoznawstwa itd. Poszukuje się klasyfikacji naturalnych, to znaczy\
      \ takich, które grupują nauki podobne pod wieloma względami, ważnymi z określonego\
      \ punktu widzenia<ref>[[Jan Such (filozof)|J. Such]], ''Problemy klasyfikacji\
      \ nauk'', w: E. Zielonacka-Lis (red.), ''Nauki pogranicza'', Wyd. Naukowe Instytutu\
      \ Filozofii UAM, Poznań 1998, s. 37-50.</ref><ref>Por. [[Adam Grobler|A. Grobler]],\
      \ Rozdz. III. ''Typy nauk i ich odmienności metodologiczne'', s. 209-251.</ref><ref>Zob.\
      \ też [[Michał Heller|M. Heller]], ''Filozofia nauki'', Wyd. Naukowe Papieskiej\
      \ Akademii Teologicznej w Krakowie, Kraków 1992, s. 13, 18-20.</ref>.\n[[Plik:Schemat,\
      \ Klasyfikacja nauk.svg|thumb|center|500px]]\n\nOgólna klasyfikacja nauk<ref\
      \ group=\"uwaga\">Schemat opracowany na podstawie: [[Jan Such (filozof)|J. Such]],\
      \ ''Problemy klasyfikacji nauk'', w: E. Zielonacka-Lis (red.), ''Nauki pogranicza'',\
      \ Wyd. Naukowe Instytutu Filozofii UAM, Poznań 1998, s. 41.</ref>.\n\nSchemat\
      \ ma charakter [[dychotomia|dychotomiczny]] (z wyjątkiem podziału nauk stosowanych).\
      \ Na każdym poziomie podziału zastosowano kilka [[Kryterium klasyfikacyjne|kryteriów]].\
      \ Na przykład przy podziale nauk na matematyczne i empiryczne brano pod uwagę\
      \ nie tylko przedmiot i metodę, lecz również rodzaj formułowanych twierdzeń\
      \ i sposób ich uzasadniania.\n\n* Nauki teoretyczne prowadzą badania podstawowe,\
      \ czysto poznawcze. Ich głównym celem jest cel teoretyczny. Nastawione są na\
      \ poszukiwanie prawdy. Jednocześnie dostarczają naukom stosowanym (technicznym,\
      \ rolniczym, ekonomicznym, medycznym, pedagogicznym, naukom o sporcie i rekreacji)\
      \ wiedzy wdrażanej do praktyki przemysłowej, rolniczej, medycznej itp.\n* '''I'''\
      \ Nauki matematyczne (formalne, dedukcyjne, aprioryczne) zajmują się ogólnymi\
      \ strukturami, które umożliwiają ścisły ilościowy i jakościowy opis rzeczywistości.\
      \ Należą do nich matematyka i logika z jej głównym działem – logiką matematyczną,\
      \ teoria mnogości, algebra, geometria i inne.\n* Nauki empiryczne (indukcyjne,\
      \ realne, aposterioryczne) odwołują się do doświadczenia, tzn. obserwacji, eksperymentu\
      \ i pomiaru.\n* Nauki przyrodnicze – nauki o przyrodzie nieożywionej i ożywionej.\n\
      * '''IV''' Nauki społeczno-humanistyczne, to nauki o człowieku jako istocie\
      \ społecznej oraz o społeczeństwie ludzkim. Należą tu np.: psychologia, socjologia,\
      \ historia, nauki o kulturze, nauki polityczne, nauki prawnicze (prawoznawstwo),\
      \ językoznawstwo. Niekiedy ten rodzaj nauk nazywany jest zamiennie: „nauki społeczne”\
      \ lub „nauki humanistyczne”. Zazwyczaj jednak dokonuje się rozróżnienia na „nauki\
      \ humanistyczne”, czyli nauki o człowieku ustalające fakty oraz „nauki społeczne”\
      \ odkrywające prawa w społeczności ludzkiej.\n* '''II''' Nauki fizyczne zajmują\
      \ się materią nieożywioną. Należą do nich: fizyka eksperymentalna i teoretyczna\
      \ (m.in. mechanika klasyczna i relatywistyczna, elektrodynamika klasyczna i\
      \ kwantowa, fizyka atomowa i jądrowa, astronomia, kosmologia), chemia doświadczalna\
      \ i teoretyczna (m.in. chemia ogólna, chemia organiczna, chemia nieorganiczna,\
      \ chemia analityczna) oraz nauki o Ziemi (np. geografia, geologia, geofizyka,\
      \ mineralogia, oceanologia).\n* '''III''' Nauki biologiczne w szerokim sensie\
      \ badają materię ożywioną. Są to: biologia doświadczalna (np. biochemia, biofizyka,\
      \ biotechnologia, biologia systematyczna, mikrobiologia, ekologia), teoretyczna\
      \ i ewolucyjna.\n\nNauki '''I - IV''', to klasyczne nauki teoretyczne (cztery\
      \ wielkie działy nauk teoretycznych), a współcześnie należy wymienić jeszcze\
      \ '''V''' nauki stykowe oraz '''VI''' nauki integracyjne (ponieważ nauki stykowe\
      \ oraz kompleksowe powstają zazwyczaj na styku nauk teoretycznych, to także\
      \ one same mają charakter raczej teoretyczny).\n\n* '''V''' Nauki stykowe, to\
      \ nauki pograniczne, np.: biofizyka, chemia fizyczna, biochemia, biogeografia,\
      \ geofizyka, geochemia. Powstają one na pograniczu dwóch lub więcej nauk klasycznych,\
      \ zazwyczaj pokrewnych i łączą w badaniach rozmaite aspekty z tych odrębnych\
      \ dziedzin.\n* '''VI''' Nauki integracyjne (kompleksowe) można by również nazwać\
      \ naukami stykowymi, ale w pewnym ogólniejszym znaczeniu. Należą do nich np.:\
      \ [[cybernetyka]], [[synergetyka]], [[Chaos (matematyka)|teoria chaosu]], [[teoria\
      \ informacji]], teoria komunikacji, ogólna teoria układów. Nauki te łączą różne\
      \ strony zjawisk badanych dotąd nawet przez bardzo odległe od siebie dyscypliny.\
      \ Cybernetyka, to nauka o sterowaniu i łączności w żywych organizmach i maszynach,\
      \ we wszelkiego rodzaju układach. To nauka na styku teorii i praktyki po części\
      \ matematyczna, po części empiryczna, zarówno biologiczna, jak i fizyczna. Z\
      \ kolei synergetyka, to nauka o procesach samoorganizacji nie tylko w układach\
      \ żywych, ale też w mechanizmach fizycznych i chemicznych.\n\nIstnieją dwie\
      \ przeciwstawne tendencje w rozwoju nauki: tendencja do integracji i dyferencjacji.\
      \ Dyferencjacja nauk jest procesem dominującym ze względu na nieustannie rozrastające\
      \ się dziedziny badań i powstające wciąż nowe specjalności.\n\nNauki stosowane\
      \ (praktyczne, aplikatywne) prowadzą badania wdrożeniowe, rozwojowe. Nastawione\
      \ są na cel praktyczny. Należą tu:\n* '''VII''' – N. techniczne, inżynieryjne\
      \ (np. teoria o zmęczeniu materiału).\n* '''VIII''' – N. rolnicze, w szerokim\
      \ sensie: nauki ogrodnicze, leśne, rolne.\n* '''IX''' – N. ekonomiczne: część\
      \ nauk ekonomicznych należy do nauk społecznych, np. ekonomia polityczna, ekonometria.\
      \ W tym dziale natomiast mieszczą się nauki ekonomiczne mające bezpośrednie\
      \ zastosowanie praktyczne, np. ekonomia przemysłu, rolnictwa, handlu.\n* '''X'''\
      \ – N. medyczne: należą tu m.in. podstawowe nauki medyczne, np. anatomia, fizjologia,\
      \ nauki o zdrowiu, farmacja, a także wiedza fizyczna, biologiczna, psychologiczna,\
      \ służąca medycynie.\n* '''XI''' – N. pedagogiczne – nauki o wychowaniu, np.\
      \ dydaktyka, teoria wychowania, oświata dorosłych.\n* '''XII''' – N. rekreacyjne\
      \ – nauki o sporcie, wypoczynku, rekreacji.\n\nW XVIII i XIX w. nauki stosowane\
      \ były uważane za gorszy rodzaj nauk, gdyż nauce przypisywano wtedy cele czysto\
      \ poznawcze, natomiast praktykę, produkcję, technikę „traktowano z góry”.\n\n\
      Na temat klasyfikowania nauk toczą się dyskusje i spory, jednak każda z propozycji\
      \ klasyfikacji zawiera jakieś mankamenty. Najczęściej dotyczy to nauk z pogranicza\
      \ różnych dyscyplin. Dynamiczny rozwój nauki sprawia, że każda istniejąca klasyfikacja\
      \ wymaga modyfikacji i dostosowania do przemian zachodzących w nauce<ref group=\"\
      uwaga\">Na temat wcześniejszych klasyfikacji nauk zob. W. Krajewski, ''Jedność\
      \ i wielopoziomowość przyrody'', w: W. Krajewski i W. Strawiński (red.), ''O\
      \ uniwersalności i jedności nauki'', Wyd. Centrum Uniwersalizmu, Uniwersytet\
      \ Warszawski, Warszawa 1993, rozdz. 2. ''Klasyfikacja nauk i rodzaje procesów\
      \ w przyrodzie (Rys historyczny)'', s. 23-29.</ref>.\n\n== Zobacz też ==\n{{Siostrzane\
      \ projekty\n |commons = Category:Science\n |cytaty = Nauka\n |słownik = nauka\n\
      }}\n* [[rodzaje twierdzeń naukowych]]\n* [[uzasadnianie twierdzeń naukowych]]\n\
      * [[humanizm]]\n\n== Uwagi ==\n{{Uwagi}}\n\n== Przypisy ==\n{{Przypisy}}\n\n\
