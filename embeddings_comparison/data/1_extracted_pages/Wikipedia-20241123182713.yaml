  - content: '{{Dopracować|źródła=2010-11}}

      [[Plik:Gauß-Denkmal - Braunschweig, Germany - DSC04436.JPG|mały|[[Carl Friedrich
      Gauss]] (XVIII–XIX w.) – przykład wybitnego ścisłowca i [[Nauki przyrodnicze|przyrodoznawcy]]
      jako wpływowy [[matematyk]], [[fizyk]], [[astronom]], [[geodeta]] i wynalazca,
      zwany „księciem matematyków”.]]

      [[Plik:Albert Einstein Head.jpg|mały|[[Albert Einstein]] (XIX–XX w.) – przykład
      ścisłowca wyjątkowo znanego dzięki swojemu [[Geniusz (człowiek wybitny)|geniuszowi]]
      i wpływowi na [[społeczeństwo]], np. na pojawienie się [[Broń jądrowa|broni
      jądrowej]], [[Energetyka jądrowa|energetyki jądrowej]] i modelu [[Wielki Wybuch|Wielkiego
      Wybuchu]]; tygodnik „[[Time (tygodnik)|Time]]” uznał go za [[Time 100: Najważniejsi
      ludzie stulecia|najważniejszego człowieka XX wieku]]]][[Plik:John Forbes Nash,
      Jr. by Peter Badge cropped.jpg|mały|[[John Forbes Nash]] (XX–XXI w.) – przykład
      [[Naukowiec|uczonego]], który zastosował [[Matematyka|matematykę]] w [[Nauki
      społeczne|naukach społecznych]], co przyniosło mu [[Laureaci Nagrody Banku Szwecji
      im. Alfreda Nobla w dziedzinie ekonomii|Nagrodę Nobla w dziedzinie ekonomii]]
      za rok 1994]]


      ''''''Nauki ścisłe'''''' – [[Nauka|nauki]] oparte na ścisłych, jednoznacznych
      rozumowaniach jak [[dedukcja]] i [[metody ilościowe]]. Obejmują:

      * przynajmniej część [[Nauki formalne|nauk formalnych]] jak [[matematyka]] i
      jej pogranicze: [[logika]], [[statystyka]], [[kryptologia]] czy [[informatyka]]
      teoretyczna ([[teoria obliczeń]]);

      * część [[Nauki empiryczne|nauk empirycznych]], zarówno [[Nauki przyrodnicze|przyrodniczych]],
      jak i [[Nauki społeczne|społecznych]]; przyrodoznawstwo bywa włączane do nauk
      ścisłych całkowicie<ref>{{Sjp PWN|nauki ścisłe|2487599}}</ref>, jednak nie zawsze,
      np. w:

      ** dawnej kategoryzacji [[Nagroda Fundacji na rzecz Nauki Polskiej|Nagród FNP]]
      („polskich Nobli”);

      ** [[Klasyfikacja dziedzin i dyscyplin naukowych w Polsce|klasyfikacji dziedzin
      i dyscyplin naukowych w Polsce]];

      ** nazewnictwie niektórych instytucji opisanych dalej, podobnie wymieniających
      nauki przyrodnicze lub [[nauki o Ziemi]] obok tych ścisłych, co sugeruje brak
      pełnej [[Podzbiór|inkluzji]].

      : Przykładem ścisłej nauki społecznej może być [[ekonomia matematyczna]], np.
      [[ekonometria]]<ref>{{otwarty dostęp}} [https://www.superprof.pl/blog/ekonomia-w-jednej-lekcji/
      Ekonomia. Nauka ścisła czy społeczna?], superprof.pl, 9 września 2020 [dostęp
      2023-09-19].</ref>;

      * przynajmniej część [[Nauki techniczne|nauk technicznych]], choć wspomniana
      wyżej klasyfikacja [[państwo]]wa traktuje je odrębnie.


      == Występowanie terminu ==

      Kategoria nauk ścisłych bywa używana w różnych kontekstach jak na przykład:

      * określenie zajęć pewnych [[Towarzystwo naukowe|towarzystw naukowych]] jak
      [[Towarzystwo Nauk Ścisłych w Paryżu]]<ref name="epwn">{{Encyklopedia PWN |
      id = 3988423 | tytuł = Towarzystwo Nauk Ścisłych | data dostępu = 2023-09-18
      }}</ref>;

      * przyznawanie niektórych [[Nagroda|nagród]]:

      ** [[Nagroda Fundacji na rzecz Nauki Polskiej]] (FNP) w początkowej fazie, w
      latach 1992–2010, miała kategorię nauk ścisłych;

      ** Nagroda [[Narodowe Centrum Nauki|Narodowego Centrum Nauki]] (NCN) ma kategorię
      nauk ścisłych i technicznych;

      * grupowanie artykułów [[Encyklopedia PWN (internetowa)|Encyklopedii PWN]]<ref>{{otwarty
      dostęp}} [https://encyklopedia.pwn.pl/kategorie/Nauki-scisle;152523.html Nauki
      ścisłe], encyklopedia.pwn.pl [dostęp 2023-09-19].</ref>;

      * definiowanie tematyki pewnych [[Kurs (kształcenie)|kursów]] akademickich<ref>{{otwarty
      dostęp}} [http://informatorects.uw.edu.pl/pl/courses/view?prz_kod=1000-00FN1-OG
      Filozofia nauk ścisłych i matematyki do XIX w.], [[Uniwersytet Warszawski]],
      informatorects.uw.edu.pl [dostęp 2023-09-19].</ref>.


      W Polsce co najmniej kilka [[Uczelnia|uczelni]] utworzyło [[wydział]]y z naukami
      ścisłymi w nazwie:

      * [[Wydział Nauk Ścisłych i Nauk o Zdrowiu Katolickiego Uniwersytetu Lubelskiego
      Jana Pawła II]] (KUL);

      * [[Wydział Nauk Ścisłych i Przyrodniczych Uniwersytetu Jana Kochanowskiego
      w Kielcach]] (UJK);

      * Wydział Nauk Ścisłych i Przyrodniczych [[Uniwersytet Komisji Edukacji Narodowej
      w Krakowie|Uniwersytetu Komisji Edukacji Narodowej w Krakowie]]<ref>{{otwarty
      dostęp}} [https://wnsip.uken.krakow.pl/ Wydział Nauk Ścisłych i Przyrodniczych],
      wnsip.uken.krakow.pl [dostęp 2023-12-21].</ref> (UKEN);

      * [[Wydział Nauk Ścisłych i Przyrodniczych Uniwersytetu w Siedlcach]] (UWS);

      * [[Wydział Nauk Ścisłych i Przyrodniczych Uniwersytetu Szczecińskiego]] (USz);

      * [[Wydział Nauk Ścisłych i Technicznych Uniwersytetu Śląskiego]] (UŚ);

      * [[Wydział Nauk Ścisłych, Przyrodniczych i Technicznych Uniwersytetu Jana Długosza
      w Częstochowie]] (UJD).


      Oprócz tego:

      * [[Uniwersytet Kardynała Stefana Wyszyńskiego w Warszawie]] prowadzi [[Szkoła
      Nauk Ścisłych|Szkołę Nauk Ścisłych]], początkowo działającą jako samodzielna
      szkoła wyższa;

      * [[Polska Akademia Nauk]] zawiera Wydział III – Nauk Ścisłych i [[Nauki o Ziemi|Nauk
      o Ziemi]]<ref>{{otwarty dostęp}} [https://pan.pl/wydzial3/ Wydział III Nauk
      Ścisłych i Nauk o Ziemi], pan.pl [dostęp 2023-09-19].</ref>.


      Pojęcie nauk ścisłych nie występuje jednak w [[Klasyfikacja dziedzin i dyscyplin
      naukowych według OECD|klasyfikacji OECD]] z 2004 roku.


      == Charakterystyka ścisłowców ==

      Większość przedstawicieli tych nauk jest [[Samiec|płci męskiej]], co skutkowało
      kampaniami na rzecz feminizacji tego środowiska<ref>{{otwarty dostęp}} [https://dziewczynydoscislych.uj.edu.pl/wydarzenie/o-akcji
      O akcji "Dziewczyny do ścisłych!"], [[Uniwersytet Jagielloński]], dziewczynydoscislych.uj.edu.pl
      [dostęp 2023-09-19].</ref>. Przykładem takich działań w [[Stany Zjednoczone|USA]]
      są osobne nagrody dla kobiet w:

      * [[Matematyka|matematyce]] – [[Nagroda Ruth Lyttle Satter Prize w Matematyce|Ruth
      Lyttle Satter Prize]];

      * [[Fizyka|fizyce]] – [[Maria Goeppert-Mayer Award]];

      * [[Astronomia|astronomii]] – [[Annie J. Cannon Award in Astronomy]].


      Mimo to zdarzały się kobiety wybitnie zasłużone tym naukom jak [[Maria Skłodowska
      Curie]], dwukrotna [[Nagroda Nobla|noblistka]] – z fizyki i chemii. Nagrody
      Nobla w tych dziedzinach zdobywało też kilka innych pań<ref group="uwaga">z
      fizyki: [[Maria Goeppert-Mayer]], [[Donna Strickland]] i [[Andrea Ghez]]; z
      chemii: [[Irène Joliot-Curie]], [[Dorothy Crowfoot Hodgkin]], [[Ada Jonath]],
      [[Frances Arnold]], [[Emmanuelle Charpentier]], [[Jennifer Doudna]] i [[Carolyn
      Bertozzi]]</ref>. Kobiety zdobywały też najwyższe wyróżnienia matematyczne jak:

      * [[Medal Fieldsa]] – [[Marjam Mirzachani]], [[Maryna Wiazowska]];

      * [[Nagroda Abela]] – [[Karen Uhlenbeck]].


      Kobiety bywały pionierkami niektórych dyscyplin, np. [[Ada Lovelace]] jest nazywana
      pierwszą [[Programista|programistką]] i osobą programującą ogółem, nie tylko
      wśród kobiet.


      Dysproporcja płci bywa wiązana z [[Dyskryminacja (psychologia społeczna)|dyskryminacją]]
      lub innym [[seksizm]]em jak [[zjawisko Matyldy]].


      == Nauki ścisłe a humanistyka ==

      Nauki ścisłe są uznawane za [[Zbiory rozłączne|rozłączne]] z [[Nauki humanistyczne|humanistyką]];
      przykładowo przedstawiciel tych pierwszych, czyli ''''''ścisłowiec'''''', bywa
      nazywany [[antonim]]em humanisty<ref>{{otwarty dostęp}} [https://wsjp.pl/haslo/podglad/12387/scislowiec
      ścisłowiec], [[Wielki słownik języka polskiego PAN]], wsjp.pl [dostęp 2023-09-18].</ref>.
      Mimo to humanistyka obejmuje pewną działalność bliską naukom ścisłym, np. przez
      badanie ich. Przykłady to część [[Naukoznawstwo|naukoznawstwa]] jak obszary
      [[Historia nauki|historii nauki]] i [[Filozofia nauki|filozofii nauki]], np.
      [[filozofia matematyki]] czy [[Filozofia fizyki|fizyki]]. Między naukami ścisłymi
      a humanistyką zachodzi też wpływ:

      * rozwój [[Technika|techniki]] umożliwił pewne kierunki [[Sztuka|sztuki]] jak
      [[architektura]], [[fotografia artystyczna]], [[film artystyczny]] czy pewne
      formy [[Gra komputerowa|gier wideo]]; zjawiska te są badane przez humanistów
      jak [[Historia sztuki|historycy sztuki]] czy [[Estetyka|estetycy]];

      * nauki ścisłe inspirują [[Fantastyka naukowa|fantastykę naukową]], badaną przez
      [[Kulturoznawstwo|kulturoznawców]] jak [[literaturoznawstwo]], [[filmoznawstwo]]
      czy [[Ludologia|groznawstwo]].


      Podejmowano też próby upodobnienia [[Filozofia|filozofii]] do nauk ścisłych<ref>[[Edmund
      Husserl]], ''''Filozofia jako ścisła nauka'''', tłum. W. Galewicz, [[Wydawnictwo
      Aletheia|Aletheia]], Warszawa 1992.</ref>.


