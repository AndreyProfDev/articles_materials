- sections:
  - content: '{{Dopracować|źródła=2011-03}}


      ''''''Nauki przyrodnicze'''''' – część [[Nauki empiryczne|nauk empirycznych]]
      badająca [[Natura|przyrodę]]<ref name="epwn">{{Encyklopedia PWN | id = 3963933
      | tytuł = nauki przyrodnicze | data dostępu = 2023-09-18}}</ref>, z wyłączeniem
      [[Społeczeństwo|społeczeństwa]]. Badają one różne aspekty świata materialnego,
      ożywionego i nieożywionego, zwykle z zastosowaniem aparatu matematycznego, jak
      również właściwej sobie metodologii.


      Starszym określeniem nauk przyrodniczych jest ''''przyrodoznawstwo'''', które
      w najprostszym podejściu dzieli się na [[przyrodoznawstwo matematyczne]] i [[przyrodoznawstwo
      opisowe]]. Ze względu na to, że znaczna część tego, co tradycyjnie nazywane
      jest „przyrodoznawstwem opisowym”, coraz częściej korzysta z aparatu matematycznego,
      taki [[Dychotomia|dychotomiczny]] podział przyrodoznawstwa obecnie zastępowany
      jest innymi podziałami.


      Do nauk przyrodniczych w całości należą:

      * [[nauki fizyczne]] jak [[fizyka]], [[astronomia]] czy [[planetologia]];

      * [[chemia]]; szerzej rozumiane [[nauki chemiczne]] obejmują też [[Technologia
      chemiczna i inżynieria procesowa|inżynierię chemiczną]] zaliczaną do [[Nauki
      techniczne|nauk technicznych]];

      * [[biologia]]; inne [[nauki biologiczne]] to np. [[biotechnologia]] wykraczająca
      poza ściśle rozumiane przyrodoznawstwo;

      * część [[Nauki o Ziemi|nauk o Ziemi]] jak [[geologia]], [[oceanografia]] czy
      [[meteorologia]].


      Istnieją nauki, które należą do tej kategorii tylko częściowo, w pewnych obszarach;
      przykłady to:

      * [[geografia]] – część jej działów należy do [[Nauki społeczne|nauk społecznych]],
      choćby [[demografia]];

      * [[antropologia]] – [[Antropologia fizyczna|część fizyczna]] jest nauką przyrodniczą,
      ale [[antropologia kulturowa]] to nauka społeczna lub [[nauki humanistyczne|humanistyczna]].


      [[Ekonomia]] jest nauką społeczną, jednak zawiera działy jak [[ekonometria]],
      podobne do nauk przyrodniczych w używaniu metod [[Nauki ścisłe|ścisłych]], konkretniej
      [[Metody ilościowe|ilościowych]].


      Pojęcie nauk przyrodniczych bywa używane w przyznawaniu [[Nagroda|nagród]];
      przykładowo [[Nagroda Fundacji na rzecz Nauki Polskiej]] w początkowej fazie,
      w latach 1992–2010, miała kategorię nauk przyrodniczych i medycznych.


