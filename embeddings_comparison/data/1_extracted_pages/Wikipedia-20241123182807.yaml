      == Wszechświat ==

      {{Osobny artykuł|Wszechświat}}

      ''''''Wszechświat'''''' w [[kosmologia|kosmologii]] to nazwa oznaczająca [[czasoprzestrzeń]],
      która zawiera wszystkie obiekty materialne i energię, dostępne do obserwacji
      metodami bezpośrednimi lub pośrednimi poprzez [[teleskop]]y i inne przyrządy
      obserwacyjne. Według stanu wiedzy na 2008 słowo wszechświat jest dla naukowców
      dwuznaczne. Zgodnie z ogólnie przyjętą teorią względności i opartej na niej
      teorii [[Wielki Wybuch|Wielkiego Wybuchu]] wiek Wszechświata szacuje się na
      13,7 mld lat. Dla niektórych [[kosmologia obserwacyjna|kosmologów obserwacyjnych]],
      jest to [[sfera]] o promieniu około 4 × 10<sup>26</sup> m (50 mld [[rok świetlny|lat
      świetlnych]]), z nami w centrum, a pojęcie ogólnej czasoprzestrzeni nie ma sensu.
      Dla niektórych [[fizyka teoretyczna|fizyków teoretycznych]], Wszechświat jest
      czasoprzestrzenią według modelu Wielkiego Wybuchu w małej skali (8 × 10<sup>26</sup>
      m). Obecne pomiary jednorodności [[Mikrofalowe promieniowanie tła|promieniowania
      tła]] wskazują, że Wszechświat jest prawdopodobnie płaski i będzie rozprzestrzeniał
      się w [[nieskończoność]].

      Powszechnie dziś przyjętym modelem powstania i ewolucji Wszechświata jest model
      [[Wielki Wybuch|Wielkiego Wybuchu]].


      == Ziemia ==

      {{Osobny artykuł|Ziemia}}

      ''''''Ziemia'''''' – trzecia w kolejności, licząc od [[Słońce|Słońca]], piąta
      co do wielkości [[planeta]] [[Układ Słoneczny|Układu Słonecznego]]. Jest największą
      z [[planeta skalista|planet skalistych]] w Układzie Słonecznym, a także jak
      dotychczas jedynym znanym miejscem występowania [[życie|życia]]. Wokół Ziemi
      krąży jeden [[naturalny satelita]] – [[Księżyc]] oraz prawdopodobnie dwa [[Księżyce
      Kordylewskiego|księżyce pyłowe]] ([[księżyce Kordylewskiego]]) i znaczna liczba
      [[sztuczny satelita|sztucznych satelitów]]. Stałą, stabilną orbitę posiada także
      planetoida [[(3753) Cruithne]], która pozostając w rezonansie z orbitą Ziemi
      przez niektórych jest uważana za drugi księżyc Ziemi.


      Ziemia posiada [[masa (fizyka)|masę]] i grawitację odpowiednią dla utrzymania
      [[Atmosfera|atmosfery]], chroniącej przed [[Promieniowanie jonizujące|promieniowaniem
      jonizującym]] oraz własne [[pole magnetyczne]] chroniące przed [[wiatr słoneczny|wiatrem
      słonecznym]]. Oddalenie od Słońca jest właściwe dla utrzymania odpowiedniej
      temperatury. Uważa się, że czynniki te sprzyjały [[pochodzenie życia|powstaniu
      życia na ziemi]].


