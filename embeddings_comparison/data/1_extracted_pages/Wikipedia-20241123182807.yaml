- sections:
  - content: '{{Inne znaczenia|pojęcia|''''[[Historia naturalna (encyklopedia)|Historia
      naturalna]]'''' – encyklopedia Pliniusza Starszego}}

      [[Plik:Table of Natural History, Cyclopaedia, Volume 2.jpg|thumb|300px|Tablica
      historii naturalnej, 1728 ''''[[Cyclopaedia]]'''']]


      ''''''Historia naturalna'''''' – termin dwuznaczny:

      * zmiany zachodzące w [[Natura|przyrodzie]];

      * [[nauki przyrodnicze]], badające zarówno przyrodę ożywioną, jak i nieożywioną
      (np. [[Skała|skały]], [[minerał]]y).


      W polszczyźnie XXI wieku określenie to jest rzadziej używane niż [[przyrodoznawstwo]]{{fakt|data=2022-12}}.


      ==Historia==

      W przeszłości do dziedzin historii naturalnej włączano także obserwacje [[fizyka|fizyczne]],
      [[chemia|chemiczne]] i [[astronomia|astronomiczne]]. Współcześnie termin ten
      stosuje się najczęściej do określania prac o przyrodzie ożywionej. Jednakże
      obecnie traktowany jest on w świecie nauki jako [[archaizm|archaiczny]], zbyt
      ogólny i rzadko stosowany w pracach naukowych<ref>[http://wordnetweb.princeton.edu/perl/webwn?s=natural+history
      Natural History] WordNet Search, princeton.edu.</ref>.


      Termin „historia naturalna” był już stosowany przez [[Arystoteles]]a i innych
      starożytnych filozofów greckich, które określali tak swoje badania nad światem
      przyrody. [[Pliniusz Starszy]] nazwał tak swoje główne dzieło. Średniowieczni
      [[chrześcijaństwo|chrześcijańscy]] filozofowie stosowali go głównie do określenia
      studiów nad ''''scala naturae'''' ([[wielki łańcuch Bytu]]), natomiast nurt
      arystotelesowski kontynuowali niektórzy badacze arabscy.


      Przyrodniczy aspekt terminu powrócił do nauk w Europie w czasie [[renesans]]u.
      W Polsce w XVII wieku zagadnienie to popularyzował [[Jan Jonston]] przyrodoznawca
      i autor wielu prac wydawanych w Niemczech, Anglii i Niderlandach. Jednak upowszechnienie
      przyrodniczego sensu terminu było zasługą [[Karol Linneusz|Linneusza]]. Od tej
      pory w XVIII i XIX w. często używano w literaturze naukowej terminu „historia
      naturalna” na określenie wszelkich badań przyrodniczych. Również muzea gromadzące
      zbiory przyrodnicze przyjmowały wtedy często nazwę ''''muzeum historii naturalnej'''',
      utrzymaną przeważnie do dziś (np. [[Muzeum Historii Naturalnej w Londynie]],
      [[Muzeum Historii Naturalnej w Paryżu]]).


      W drugiej połowie XIX w. miała miejsce debata, której celem miało być wytyczenie
      pojęciowej granicy między historią naturalną jako całokształtem zmian zachodzących
      w [[Natura|przyrodzie]] a [[Dzieje (pojęcie)|dziejami]], czyli całokształtem
      zmian zachodzących w [[kultura|kulturze]]. Znaczącym uczestnikiem tej debaty
      był [[Thomas Henry Huxley]] (1825 – 1895), który najpierw uważał, że badając
      historię naturalną zdobywamy także wiedzę na temat społeczeństwa i kultury ([[Darwinizm
      społeczny|ujęcie ewolucjonizmu społecznego]]), lecz od opublikowania pracy ''''Evolution
      and Ethics'''' (1893) wskazywał na odmienność praw obowiązujących w przyrodzie
      i w historii człowieka<ref>Wiktor Werner, ''''Historyczność kultury. W poszukiwaniu
      myślowego fundamentu współczesnej historiografii'''', Wydawnictwo Naukowe UAM,
      Poznań 2009, s. 163 – 174</ref>.

      Przykładem niedostrzegania różnicy między historią naturalną a historią człowieka
      jest stanowisko krytyka teorii ewolucji i [[Kreacjonizm (pseudonauka)|kreacjonisty]]
      [[Charles Hodge|Charlesa Hodge''a]], który bronił idei celowości ([[teleologia|teleologii]])
      zmian zachodzących w przyrodzie<ref>Wiktor Werner, ''''Historyczność kultury...'''',
      s. 174–190</ref>.


      Od przełomu XIX/XX w. w związku z rozwojem nauk i ich specjalizacją, termin
      „historia naturalna”, odnoszony do wszystkich zmian zachodzących w Naturze,
      zaczął być zbyt ogólnikowy. Utrzymał się on jednak wówczas w takich dziedzinach
      jak [[ekologia]], [[etologia]] i [[biologia ewolucyjna]]


      W XX wieku termin jest nieostry i bywa używany na określenie zmian zachodzących
      w przyrodzie (w sensie [[filogeneza|filogenetycznym]] i [[Ontogeneza|ontogenetycznym]])<ref>{{cytuj
      stronę|url=http://stareaneksy.pwn.pl/biologia/1.php?id=1471042|tytuł=Historia
      naturalna w aneksy.pwn.pl/biologia|opublikowany=PWN|data dostępu=2012-02-21}}</ref><ref>{{cytuj
      książkę|autor=pod redakcją Czesława Jury i Haliny Krzanowskiej|tytuł=Leksykon
      biologiczny|wydawca=Wiedza powszechna|miejsce=Warszawa|rok=1992|strony=253|isbn=83-214-0375-1}}</ref>,
      jak również na określenie nauki<ref>{{cytuj stronę|url=http://sjp.pwn.pl/slownik/2464785/historia_naturalna|tytuł=historia
      naturalna w sjp.pwn|opublikowany=PWN|data dostępu=2012-02-21}}</ref>.


