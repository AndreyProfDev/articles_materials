- sections:
  - content: '''''''Przyrodoznawstwo opisowe'''''' jest to:

      # odmiana [[przyrodoznawstwo|przyrodoznawstwa]];

      # (wywodząca się z czasów [[Oświecenie (epoka)|Oświecenia]]) nazwa dla zbioru
      dyscyplin biologicznych, geograficznych, geologicznych i innych takich, w których  prawa
      i hipotezy wyrażające związki między zjawiskami nie są ujmowane w zależności
      matematyczne, lub zależności owe mają znaczenie drugorzędne.


      Przyrodoznawstwu opisowemu przeciwstawiane jest [[matematyczne przyrodoznawstwo]]
      traktowane jako zbiór dyscyplin przyrodniczych, w których prawa i hipotezy wyrażające
      związki między zjawiskami ujmowane są w zależności matematyczne.


      Granica między obydwiema dziedzinami przyrodoznawstwa nie jest [[nieostrość|ostra]].


      Ze względu na to, że znaczna część tego, co tradycyjnie nazywane jest „przyrodoznawstwem
      opisowym”, coraz częściej i chętniej korzysta z aparatu matematycznego, taki
      dychotomiczny [[podział logiczny|podział]] przyrodoznawstwa zastępowany jest
      innymi podziałami.


      [[kategoria:Nauki przyrodnicze]]'
    title: Main
  title: Przyrodoznawstwo opisowe
- sections:
  - content: '''''''Przyrodoznawstwo matematyczne'''''' – niejednoznaczne pojęcie,
      mogące oznaczać:

      * odmianę [[Nauki przyrodnicze|przyrodoznawstwa]]

      * nazwę dla zbioru dyscyplin określanych dziś mianem „nauk fizykalnych”, wywodząca
      się z czasów [[Oświecenie (epoka)|Oświecenia]]

      * taki zbiór dyscyplin przyrodniczych, w których prawa i hipotezy wyrażające
      związki między zjawiskami ujmowane są w zależności matematyczne.


      Nazwa bierze się stąd, że w Odrodzeniu za sprawą [[Galileusz]]a popularność
      zyskała [[Platon|platońska]] w swym pochodzeniu idea matematyzacji przyrody
      – ''''księga natury pisana jest językiem matematyki'''' – i prowadzenia nad
      nią badań w określony sposób.


      Przyrodoznawstwu matematycznemu przeciwstawiane jest [[przyrodoznawstwo opisowe]],
      traktowane jako zbiór dyscyplin biologicznych, geograficznych, geologicznych,
      takich, w których  prawa i hipotezy wyrażające związki między zjawiskami nie
      są ujmowane w zależności matematyczne, lub zależności owe mają znaczenie drugorzędne.


      Granica między obydwiema dziedzinami przyrodoznawstwa nie jest [[nieostrość|ostra]].


      Ze względu na to, że znaczna część tego, co tradycyjnie nazywane jest „przyrodoznawstwem
      opisowym”, coraz częściej i chętniej korzysta z aparatu matematycznego, taki
      [[Dychotomia|dychotomiczny]] podział przyrodoznawstwa zastępowany jest innymi
      podziałami.


