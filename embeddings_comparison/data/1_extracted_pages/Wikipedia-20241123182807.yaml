- sections:
  - content: "{{wikisłownik|antropologia|antropolog}}\n'''Antropologia''' (gr. ἄνθρωπος\
      \ ''anthropos'' „człowiek”, λόγος ''logos'' „nauka”) – [[Interdyscyplinarność|interdyscyplinarna]]\
      \ dziedzina nauki na pograniczu [[nauki humanistyczne|nauk humanistycznych]],\
      \ [[nauki społeczne|społecznych]] i [[nauki przyrodnicze|przyrodniczych]]. Zajmuje\
      \ się badaniem człowieka jako jednostki w społeczeństwie w kontekście historycznej\
      \ zmienności, biorąc pod uwagę warunki socjalno-ekonomiczne oraz kulturowe;\
      \ poszukuje zrozumienia roli kultury i struktur władzy w życiu człowieka<ref\
      \ name=\"uniwersytet wisconsin\">{{cytuj stronę | url = http://www.anthropology.wisc.edu/about.php\
      \ | tytuł = About Anthropology | autor = Department of Anthropology, University\
      \ of Wisconsin-Madison | język = en | data dostępu = 2013-06-14 | archiwum =\
      \ https://web.archive.org/web/20150222114958/http://www.anthropology.wisc.edu/about.php\
      \ | zarchiwizowano = 2015-02-22}}</ref>. Ma dwa podstawowe nurty:\n* [[antropologia\
      \ fizyczna|antropologię fizyczną]] zajmującą się zmiennością biologiczną i fizjologiczną\
      \ człowieka;\n* [[antropologia kulturowa|antropologię kulturową]] (antropologia\
      \ społeczna) zajmującą się człowiekiem w społeczności (zbliżony do [[socjologia|socjologii]])<ref>{{cytuj\
      \ stronę | url = http://portalwiedzy.onet.pl/18658,,,,antropologia_kulturowa,haslo.html\
      \ | tytuł = Antropologia kulturowa | opublikowany = Onet.pl | język = pl | data\
      \ dostępu = 2013-06-14 | archiwum = https://web.archive.org/web/20131217015710/http://portalwiedzy.onet.pl/18658,,,,antropologia_kulturowa,haslo.html\
      \ | zarchiwizowano = 2013-12-17}}</ref>.\n\nIstnieją też inne podziały antropologii,\
      \ np. w USA jest rozpowszechniony podział nauk antropologicznych na cztery nurty:\n\
      * [[antropologia fizyczna]]\n* [[archeologia|antropologia historyczna, czyli\
      \ archeologia]]\n* [[antropolingwistyka|antropologia lingwistyczna]]\n* [[antropologia\
      \ kulturowa|antropologia kulturowa lub społeczna]].\n\nPoza tak rozumianym podziałem\
      \ pozostają następujące nauki czy dziedziny wiedzy mające w nazwie słowo \"\
      antropologia\":\n* [[antropologia filozoficzna]]\n* [[antropologia religijna]]\
      \ (nie mylić z [[antropologia religii|antropologią religii]]).\n\n== Działy\
      \ antropologii ==\n[[Plik:Bernardino de Sahagún (2).jpg|thumb|[[Bernardino de\
      \ Sahagún]], jeden z pionierów [[Etnografia|etnografii]]]]\nZ uwagi na pole\
      \ zastosowań lub zasadniczy przedmiot uwagi wyróżnia się między innymi następujące\
      \ działy antropologii:\n* [[antropolingwistyka]]\n** [[antropologia słowa]]<ref>{{cytuj\
      \ stronę | url = http://ikp.uw.edu.pl/zaklad-antropologii-slowa | tytuł = Zakład\
      \ Antropologii Słowa | opublikowany = Instytut Kultury Polskiej, Uniwersytet\
      \ Warszawski | data dostępu = 2013-06-14}}</ref>\n* [[antropologia religii]]\
      \ (nie mylić z [[antropologia religijna|antropologią religijną]])\n* [[antropologia\
      \ ciała]]\n* [[antropologia polityczna]]\n* [[antropologia organizacji]]\n*\
      \ [[antropologia sportu]]\n* [[antropologia tańca]]\n* [[antropologia edukacji]]\n\
      * [[antropologia jedzenia]]\n* [[antropologia płci i seksualności]] \n* [[antropologia\
      \ sztuki]]\n** antropologia wizualności<ref name=\"wizualność ikp\">{{cytuj\
