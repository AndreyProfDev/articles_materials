  - content: '[[Plik:Fintech Meetup of the Asia-Pacific Executives Forum at Hilton
      Colombo.jpg|thumb|Spotkanie Fintech na [[Sri Lanka|Sri Lance]]]]

      ''''''Technologie finansowe'''''' określane jako ''''''Fintech'''''' lub ''''''FinTech''''''
      ({{ang.|financial technology}}) – wszelkiego typu [[Innowacja biznesowa|innowacje]]
      technologiczne w sektorze finansów. Tego samego określenia używa się również
      jako nazwy firm, które oferują rozwiązania innowacyjne dla sektora finansowego
      dotyczące instrumentów finansowych oraz usług{{r|bundesbank}}.


      Użycie analogicznego określenia angielskiego InsurTech dla opisu innowacyjnych
      rozwiązań dla sektora [[Ubezpieczenie (umowa)|ubezpieczeniowego]] nie przyjęło
      się jeszcze w języku polskim. W tym obszarze używa się opisowego określenia
      typu: „innowacyjne technologie w branży ubezpieczeniowej” lub podobne{{r|equinum}}.
      Podobne określenia powstały dla rozwiązań innowacyjnych w innych branżach, jak
      WealthTech z dziedziny [[Zarządzanie aktywami|zarządzania aktywami]]{{r|what-is-wealthtech}}
      czy PayTech dla płatności{{r|planetcompliance}}.


      Firmy FinTech działające na rynku finansowym postrzegane są jako szczególna
      kategoria parabanków{{r|bankier}}.


      == Miejsce Fintech w gospodarce ==

      Polska jest jednym z krajów, w których w ostatnich latach odnotowano najwyższe
      przyrosty w zakresie rozwoju i wzrostu gospodarczego<ref>{{Cytuj |tytuł = Fintech
      Kategoria |data dostępu = 2019-10-02 |opublikowany = MIT Sloan Management Review
      Polska |url = https://mitsmr.pl/trendy/fintech/ |język = pl |archiwum = https://web.archive.org/web/20190528074048/https://mitsmr.pl/trendy/fintech/
      |zarchiwizowano = 2019-05-28}}</ref>. Co prawda zastosowanie innowacyjności,
      jak i tempo wdrażania nowoczesnych technologicznie rozwiązań różni się w zależności
      od sektora to branża finansowa charakteryzuje się raczej wysokim jej poziomem.
      Innowacyjność w tym zakresie nabrała dużego rozpędu a segment rynku nazywany
      powszechnie Fintech bez wątpienia ma ogromną szansę zaistnieć. Przewiduje się,
      że w kolejnych latach sektor ten zajmie ważne miejsce w gospodarce jako całości,
      przyczyniając się tym samym do jej zrównoważonego rozwoju<ref>{{Cytuj |tytuł
      = Zrównoważony rozwój Kategoria |data dostępu = 2019-10-02 |opublikowany = MIT
      Sloan Management Review Polska |url = https://mitsmr.pl/elektromobilnosc/zrownowazony-rozwoj/
      |język = pl |archiwum = https://web.archive.org/web/20190528074104/https://mitsmr.pl/elektromobilnosc/zrownowazony-rozwoj/
      |zarchiwizowano = 2019-05-28}}</ref>.


      == Przypisy ==

      <references>

      <ref name="bankier">[https://www.bankier.pl/wiadomosc/Nowe-technologie-a-sektor-finansowy-FinTech-jako-szansa-i-zagrozenie-7507368.html
      ''''Nowe technologie a sektor finansowy. FinTech jako szansa i zagrożenie''''],
      bankier.pl.</ref>

      <ref name="bundesbank">[https://www.bundesbank.de/de/aufgaben/bankenaufsicht/einzelaspekte/finanztechnologie-unternehmen/fintechs---finanztechnologie-unternehmen-598228
      ''''FinTechs – Finanztechnologie Unternehmen''''], bundesbank.de.</ref>

      <ref name="equinum">[http://www.equinum.pl/2018/06/28/innowacyjne-technologie-branzy-ubezpieczeniowej/
      ''''Innowacyjne technologie w branży ubezpieczeniowej''''], equinum.pl.</ref>

      <ref name="planetcompliance">[https://www.planetcompliance.com/2018/03/21/what-the-heck-is-paytech/
      ''''What the heck is PayTech''''], planetcompliance.com.</ref>

      <ref name="what-is-wealthtech">[https://www.bbva.com/en/what-is-wealthtech/
      ''''What is wealthtech?''''], bbva.com.</ref>

      </references>


