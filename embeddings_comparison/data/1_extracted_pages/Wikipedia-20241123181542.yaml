      ''''''Technika informatyczna''''''{{r|PN|PNpl|JSB|PM}}, ''''''technika informacyjna''''''{{r|PM|MK}},
      ''''''technologia{{#tag:ref|W tym przypadku ten odpowiednik angielskiego słowa
      ''''technology'''' jest [[kalka (językoznawstwo)|kalką językową]]<ref>{{Cytuj
      pismo |autor = Zbigniew Łucki |tytuł = Proszę... nie mówmy „technologia” na
      technikę! |url = http://www.uci.agh.edu.pl/bip/63/11_63.htm |czasopismo = Biuletyn
      Informacyjny Pracowników Akademii Górniczo-Hutniczej |wydanie = 63 |wydawca
      = AGH |data = |data dostępu = 2015-03-15}}</ref>.|group = uwaga | name = uwaga}}
      informatyczna''''''{{r|EZ}}, ''''''technologia{{u|uwaga}} informacyjna''''''{{r|EZ|GUS}},
      ''''''TI'''''' (od [[język angielski|ang.]] ''''information technology, IT''''<ref>{{Cytuj
      stronę |url = https://www.axelos.com/corporate/media/files/glossaries/itil_2011_glossary_pl-v1-0.pdf
      |tytuł = Glosariusz ITIL wraz ze skrótami |strony = 69 |data dostępu = 2020-04-01}}</ref>)
      – dyscyplina [[Informatyka|informatyczna]] i branża na rynku pracy zajmująca
      się stosowaniem technologii obliczeniowych ([[oprogramowanie]] i [[sprzęt komputerowy]])
      w biznesie, instytucjach państwowych, opiece zdrowotnej, szkołach i innych typach
      organizacji. W szerszym znaczeniu (jako [[informatyka techniczna]]), obejmuje
      ona [[Inżynieria oprogramowania|inżynierię oprogramowania]], [[Inżynieria komputerowa|inżynierię
      komputerową]], [[System informacyjny|systemy informacyjne]], [[cyberbezpieczeństwo]]
      i [[Danologia|danologię]]. Jest ona także powiązana z [[Sektor teleinformatyczny|sektorem
      teleinformatycznym]].


