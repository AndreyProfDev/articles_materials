- sections:
  - content: "'''Informatyka śledcza''' ([[język angielski|ang.]] ''computer forensics'')\
      \ – obszar [[Informatyka|informatyki]] powiązany z [[Nauki o bezpieczeństwie|naukami\
      \ o bezpieczeństwie]] i [[Nauki prawne|naukami prawnymi]], którego celem jest\
      \ dostarczanie cyfrowych środków dowodowych. Często w sprawach popełnionych\
      \ [[przestępstwo|przestępstw]] lub nadużyć, ale także w celu odtworzenia stanu\
      \ pierwotnego przy  ustalaniu motywów działania sprawcy lub ofiary. Jej zadaniami\
      \ są: zbieranie, [[odzyskiwanie danych|odzyskiwanie]], analiza i prezentacja\
      \ (w formie specjalistycznego raportu) cyfrowych danych, znajdujących się na\
      \ różnego rodzaju nośnikach ([[Dysk twardy|dyski twarde]] [[komputer]]ów, [[dyskietka|dyskietki]],\
      \ [[płyta kompaktowa|płyty CD]], [[pamięć komputerowa|pamięci]] przenośne, [[serwer]]y,\
      \ [[telefon komórkowy|telefony komórkowe]] itp.), oraz w coraz popularniejszych\
      \ ostatnio systemach i serwisach zdalnego gromadzenia, przechowywania i przetwarzania\
      \ danych, takich jak: ([[Serwis społecznościowy|serwisy społecznościowe]], [[Chmura\
      \ obliczeniowa|przestrzeń dyskowa w chmurze]] czy [[Wyszukiwarka internetowa|wyszukiwarki\
      \ internetowe]])<ref>[http://soep.ue.poznan.pl/jdownloads/Wszystkie%20numery/Rok%202013/2-12.pdf\
      \ Jakub Dzikowski, Uniwersytet Ekonomiczny w Poznaniu: Wyszukiwanie danych osobowych\
      \ w Internecie dla celów Informatyki Śledczej]</ref>. Efektem działań informatyków\
      \ śledczych są cyfrowe materiały dowodowe, przygotowane zgodnie z duchem dochodzeniowo-śledczym\
      \ ([[język angielski|ang.]] ''forensically sound'')<ref>{{Cytuj | autor=Rodney\
      \ McKemmish | url=https://link.springer.com/content/pdf/10.1007%2F978-0-387-84927-0_1.pdf\
      \ | tytuł=When is Digital Evidence Forencically Sound? | czasopismo=Advances\
      \ in digital forensics IV. Selected papers based on the presentations at the\
      \ 4th annual IFIP WG 11.9 conference on digital forensics | miejsce=Kyoto, Japonia\
      \ | data=(28-30 stycznia) 2008 }}</ref>.\n\n== Zastosowanie ==\nDo najczęstszych\
      \ przypadków zastosowania informatyki śledczej w Polsce należą:\n# W sferze\
      \ '''biznesowej''' – kradzież danych przez zwalnianych lub nielojalnych pracowników\
      \ oraz [[sabotaż]] (usuwanie lub kradzież danych firm lub instytucji publicznych\
      \ mające na celu m.in. osłabienie ich pozycji konkurencyjnej lub pozyskanie\
      \ [[know-how]]),\n# W sferze '''prywatnej''' – ustalanie motywów ucieczek nieletnich,\
      \ zaginięć osób a także niewyjaśnionych zgonów (ustalenie czy osobę nakłaniano\
      \ do samobójstwa lub czy dokonano morderstwa)<ref>[http://wpolityce.pl/polityka/149578-informatyka-sledcza-w-rozkwicie-liczba-analiz-przestepstw-przeciw-dzialalnosci-instytucji-panstwowych-wzrosla-w-2012-r-az-o-22-proc\
      \ W Polityce - Informatyka Śledcza w rozkwicie]</ref>.\n\n== Dowód elektroniczny\
      \ i przestępstwa komputerowe ==\nDowód elektroniczny ([[język angielski|ang.]]\
      \ ''digital evidence'') jest dopuszczalny zarówno w [[Postępowanie cywilne w\
      \ Polsce|procesie cywilnym]] jak i [[Postępowanie karne|karnym]]. Jest to typ\
      \ dowodu naukowego, spełniającego bardzo rygorystyczne wymagania amerykańskiego\
      \ standardu Dauberta, zgodnie z którym metoda lub teoria naukowa, aby stać się\
      \ dowodem, musi:\n# Sama w sobie być sprawdzalna i zostać już poddana kontroli;\n\
      # Być opisana i oceniona w literaturze fachowej;\n# Mieć znany lub przewidywany\
      \ poziom błędów uzyskiwanych przy stosowaniu tej metody;\n# Uzyskać powszechną\
      \ akceptację (ang. ''general acceptance'') specjalistów w danej dziedzinie.\n\
      \nWymóg powszechnej akceptacji jest ważnym czynnikiem decydującym o dopuszczeniu\
      \ konkretnego dowodu, jednak nie stanowi warunku koniecznego. Polskie prawo\
      \ również – co do zasady – przyjmuje, że dowody elektroniczne mogą być wykorzystane\
      \ w postępowaniu przed [[sąd]]em. Dowód elektroniczny musi być pozyskany, potwierdzony\
      \ (poddany procesowi [[uwierzytelnianie|uwierzytelniania]]), zabezpieczony i\
      \ zanalizowany w sposób, który uniemożliwi obronie podniesienie zarzutu manipulacji\
      \ dowodem czy fałszerstwa.\n\nPrzestępstwa komputerowe definiuje konwencja [http://conventions.coe.int/Treaty/EN/Treaties/Html/185.htm\
      \ Rady Europy ETS 185], gdzie wskazuje się następujące ich grupy:\n# Przestępstwa\
      \ przeciw poufności (ang. ''confidentiality''), integralności (ang. ''integrity'')\
      \ i dostępności (ang. ''availability'') danych (tzw. przestępstwa CIA). Obejmują\
      \ one między innymi: nielegalny dostęp do systemów przez [[haker (bezpieczeństwo\
      \ komputerowe)|hacking]], [[Pluskwa (podsłuch)|podsłuch]] czy oszukiwanie uprawnionych\
      \ użytkowników (powszechnie znany „[[phishing]]”), szpiegostwo komputerowe (włączając\
      \ [[koń trojański (informatyka)|trojany]] i inne techniki), sabotaż i wymuszenia\
      \ komputerowe ([[wirus komputerowy|wirusy]], [[Blokada usług|ataki DDoS]], [[spam]])\
      \ .\n# Powiązane z komputerami (sieciami) przestępstwa tradycyjne, zaczynając\
      \ od oszustw (od klasycznych, czyli manipulacji fakturami czy kontami firmowymi,\
      \ do manipulacji on-line – oszukańczych aukcji czy nielegalnego używania kart\
      \ kredytowych), poprzez komputerowe podróbki, aż do ataków na ludzkie życie\
      \ przez np. manipulowanie systemami szpitalnymi czy systemami kontroli ruchu\
      \ powietrznego.\n# Przestępstwa dotyczące zawartości (treści). Ta kategoria\
      \ obejmuje na przykład [[Wykorzystywanie seksualne dzieci|dziecięcą pornografię]],\
      \ dostarczanie instrukcji przestępczych, a także samo oferowanie popełniania\
      \ przestępstw. Ta kategoria obejmuje także [[molestowanie]] i [[mobbing]] poprzez\
      \ sieć, rozpowszechnianie fałszywych informacji (np. [[czarny PR]], schematy\
      \ „[[pump and dump]]”) oraz internetowy [[hazard]].\n# Przestępstwa powiązane\
      \ z naruszeniem [[prawo autorskie|prawa autorskiego]] i praw pokrewnych, takie\
      \ jak nieautoryzowane kopiowane i rozpowszechnianie [[program komputerowy|programów\
      \ komputerowych]]. Do tej kategorii zalicza się także nieautoryzowane użycie\
      \ [[baza danych|baz danych]].\n\nNależy podkreślić, że dziedzina dostarczania\
      \ elektronicznych środków dowodowych wybiega znacznie poza przestępstwa komputerowe\
      \ i ma zastosowanie przy każdym przestępstwie czy nadużyciu, gdzie urządzenia\
      \ elektroniczne miały zastosowanie jako nośnik danych. Podsumowanie [[Przestępczość\
      \ komputerowa|przestępczości komputerowej]] w USA zawiera doroczny „''Computer\
      \ Crime Survey''” dostępny na [http://www.gocsi.com www.gocsi.com]. Ponadto,\
      \ co warto zauważyć, zebrany materiał niekwalifikujący się dowodowo potrafi\
      \ często naprowadzić śledczych na właściwy tor postępowania lub ewidentnie wskazać,\
      \ wobec sprzecznego materiału dowodowego, prawdopodobny przebieg zdarzeń<ref>[http://www.fakt.pl/Sprawa-Madzi-z-Sosnowca-Co-jeszcze-ukrywaja-rodzice-Madzi-Co-ukrywaja-Wasniewscy-Ktos-zczyscil-dane-z-komputera-rodzicow-Madzi,artykuly,152470,1.html\
      \ Fakt.pl Co jeszcze ukrywają rodzice Madzi? Ktoś sczyścił dane z komputera\
      \ rodziców Madzi]</ref>.\n\n== Procedura analizy dochodzeniowo-śledczej nośników\
      \ danych ==\n# Sprawdzenie poprawności zabezpieczenia materiału dowodowego -\
      \ na przykład poprzez sprawdzenie plomb na obudowie komputera jak i [[Port (sprzęt\
      \ komputerowy)|portów]].\n#Utworzenie protokołu dostarczenia nośników danych\
      \ oraz potwierdzenie zabezpieczonych dowodów najlepiej wartością [[Funkcja skrótu|funkcji\
      \ skrótu]]. Sprawdzenie zgodności opisu ich marki, modelu, pojemności i numerów\
      \ seryjnych. W razie nieprzestrzegania procedury przy zabezpieczaniu urządzenia\
      \ dowód takowy traci na wiarygodności w postępowaniu sądowym.\n# Wykonanie kopii\
      \ binarnej lub obrazu dysku z użyciem blokera zapisów. Bloker chroni zabezpieczany\
      \ dysk przed zapisaniem na nim jakichkolwiek danych. Gdyby po dacie zabezpieczenia\
      \ dysku twardego, doszło do zapisania na nim jakichkolwiek danych (np. daty\
      \ zmiany metadanych w systemie plików), spowoduje to utratę jego wartości dowodowej\
      \ w postępowaniu sądowym. Należy pamiętać, że każde uruchomienie [[System operacyjny|systemu\
      \ operacyjnego]] na komputerze powoduje modyfikacje na jego dysku twardym.\n\
      # Przeprowadzenie na kopii danych szczegółowej analizy zgodnie z zapytaniem\
      \ zleceniodawcy stosując w tym celu specjalistyczne urządzenia i programy, które\
      \ uniemożliwiają modyfikację wykonanej kopii. [[Analiza danych]] musi zostać\
      \ przeprowadzona z dużą rzetelnością, starannością przy zachowaniu zasad, procedur\
      \ stosowanych zgodnie z zasadami informatyki śledczej oraz łańcuchem dowodowym,\
      \ który ma swój początek w momencie zabezpieczania urządzenia, a kończy się\
      \ w chwili gdy biegły obroni swoją opinię na rozprawie sądowej.\n# Opisanie\
      \ z wysoką starannością całej procedury wykonania i analizy kopii danych z zabezpieczonego\
      \ urządzenia.\n# Sporządzenie rzetelnej [[ekspertyza|ekspertyzy]] wraz z pełnym\
      \ opisem jej przebiegu i wyniku wyeksportowanego do danej postaci pliku oraz\
      \ z przedstawieniem pełnych raportów analizy nośników danych z naznaczeniem\
      \ pozycji i ujawnionych informacji z nośnika danych, które stanowią materiał\
      \ dowodowy do wydania opinii służącej w procesie sądowym. Oznaczenie dat utworzenia,\
      \ modyfikacji jak i ostatniego dostępu do danych stanowiących materiał dowodowy\
      \ (tam, gdzie możliwe jest ich odczytanie). Należy wyszczególnić dane, które\
      \ zostały odzyskane po skasowaniu czy sformatowaniu dysku twardego komputera.\n\
      # Wystawienie opinii zgodnej z zapytaniem zlecającego z przytoczeniem metody\
      \ i sposobu przeprowadzenia analizy kopii komputerowego, cyfrowego czy elektronicznego\
      \ nośnika danych.\n\n== Zadania specjalistów informatyki śledczej ==\n*ustalanie\
      \ zakresu analizy dowodów elektronicznych oraz przedmiotu poszukiwania\n* właściwe\
      \ zabezpieczenie kopii danych\n* szczegółowa analiza śladów elektronicznych\n\
      * sporządzenie raportu dotyczącego analizowanych danych\n\n== Praca informatyków\
      \ śledczych wykorzystywana jest najczęściej w przypadkach ==\n* [[defraudacja|defraudacji]]\
      \ [[pieniądz|środków finansowych]]\n* łamania prawa pracy\n* kradzieży danych\n\
      * szpiegostwa przemysłowego\n* łamania [[prawo autorskie|praw autorskich]]\n\
      * ujawnienia [[tajemnica handlowa|tajemnicy handlowej]]\n* kradzieży i użycia\
      \ [[dane osobowe|danych osobowych]]\n* spraw kryminalnych (handel [[narkotyk]]ami,\
      \ [[terroryzm]], [[Zabójstwo#Rodzaje zabójstw|morderstwa]], [[samobójstwo|samobójstwa]],\
      \ [[przestępczość zorganizowana]], [[pedofilia]]).\n\n== Gdzie specjaliści informatyki\
      \ śledczej szukają informacji? ==\n {| align=center border=0|\n | width=187|\
      \ ''Dane zawarte w systemie''<br />\n | width=187| ''Dane ukryte''<br />\n |\
      \ width=187| ''Otoczenie komputera''<br />\n | width=188| ''Zasoby internetowe''<br\
      \ />\n |-\n | valign=top|\n* [[poczta elektroniczna]]\n* [[dokument elektroniczny|dokumenty\
      \ elektroniczne]]\n* [[plik tymczasowy|pliki tymczasowe]]\n* [[partycja wymiany|partycje]]/[[plik\
      \ wymiany|pliki wymiany]]\n* pliki [[Kopiowanie (informatyka)|kopii]]\n* [[log\
      \ (informatyka)|logi]] i [[Rejestr (Windows)|rejestry]]\n* dane [[Przeglądarka\
      \ internetowa|przeglądarki]]\n* pliki kolejkowania wydruku\n* [[HTTP cookie|ciasteczka]]\n\
      \ | valign=top|\n* [[Metadane]]\n* Dane skasowane\n* [[Slack space]]\n* RAM-slack\n\
      \ | valign=top|\n* [[sieć komputerowa|Sieci]] z którymi się łączył\n* Dane z\
      \ [[kopia bezpieczeństwa|kopii bezpieczeństwa]]\n* Powiązania z innymi [[nośnik\
      \ danych|nośnikami]]\n | valign=top|\n* [[Serwis społecznościowy|portale społecznościowe]]\
      \ znalezione w danych przeglądarki interntowej\n* [[Chmura obliczeniowa|Dyski\
      \ w chmurze]] z którymi dany komputer się łączył\n* [[Wyszukiwarka internetowa|wyszukiwarkach\
      \ internetowych]] powiązanych z historią przeglądania\n |}\n\n== Uwarunkowania\
      \ prawne w Polsce dotyczące dowodów w postaci elektronicznej ==\n* ''Kodeks\
      \ pracy'': Art.52.§1-3 Art.114 Art.115 Art.116 Art.119 Art.114. Art.122 Art.267.§1-4\
      \ Art.268.§1-4 Art.268a.§1-3 Art.287.§1-3\n* ''Ustawa o zwalczaniu nieuczciwej\
      \ konkurencji''\n* ''Kodeks postępowania cywilnego'':  Art.227 Art.278 Art.305\
      \ Art.227 Art.307.§1-3 Art.308.§1-2 Art.309.\n\n== Przypisy ==\n{{Przypisy}}\n\
      \n== Linki zewnętrzne ==\n* [https://adamziaja.com/book/ „Praktyczna analiza\
      \ powłamaniowa. Aplikacja webowa w środowisku Linux”] książka poświęcona informatyce\
      \ śledczej\n* [http://www.computerforensicsworld.com Computer Forensics World]\
      \ {{lang|en}}\n* [http://www.iacis.com/ The International Association of Computer\
      \ Investigative Specialists]\n\n{{Kontrola autorytatywna}}\n\n[[Kategoria:Informatyka]]\n\
      [[Kategoria:Rozliczalność]]\n[[Kategoria:Odzyskiwanie danych]]\n[[Kategoria:Technika\
      \ śledcza]]"
