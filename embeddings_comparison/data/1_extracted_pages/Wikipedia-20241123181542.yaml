  - content: '''''''Informatyka przemysłowa''''''<ref>{{Cytuj |tytuł = Informatyka
      Przemysłowa |data dostępu = 2020-05-04 |opublikowany = rekrutacja.pwr.edu.pl
      |url = http://rekrutacja.pwr.edu.pl/wyszukiwarka-kierunkow-studiow/informatyka-przemyslowa-w14-i-st-6634.html
      |język = pl |archiwum = https://web.archive.org/web/20200211164205/http://rekrutacja.pwr.edu.pl/wyszukiwarka-kierunkow-studiow/informatyka-przemyslowa-w14-i-st-6634.html
      |zarchiwizowano = 2020-02-11 }}</ref> (z ang. ''''industrial computing''''),
      także ''''''informatyka procesowa''''''<ref>{{Cytuj |tytuł = Informatyka procesowa
      |data dostępu = 2020-05-04 |opublikowany = iichipos.zut.edu.pl |url = http://iichipos.zut.edu.pl/index.php?id=10879
      |archiwum = https://web.archive.org/web/20201023024147/http://iichipos.zut.edu.pl/index.php?id=10879
      |zarchiwizowano = 2020-10-23 }}</ref> (z niem. ''''prozessinformatik'''') –
      dziedzina wiedzy znajdująca się na pograniczu nauk informatycznych oraz nauk
      o technologiach przemysłowych. Koncentruje się na zastosowaniu [[komputer]]ów
      i [[oprogramowanie|oprogramowania]] w [[przemysł|przemyśle]]. Do jej głównych
      zainteresowań należą informatyczne aspekty w następujących zastosowaniach:

      * komputerowe monitorowanie i [[Przepływ sterowania|sterowanie]] produkcją;

      * komputerowe modelowanie, [[Symulacja komputerowa|symulacja]] i optymalizacja
      [[proces technologiczny|procesów technologicznych]];

      * [[eksploracja danych|eksploracja]] i [[big data|analiza]] danych przemysłowych;

      * projektowanie przemysłowych [[System informatyczny|systemów informatycznych]],
      m.in. [[System czasu rzeczywistego|systemy czasu rzeczywistego]], [[System wbudowany|systemy
      wbudowane]];

      * zastosowanie [[Sztuczna inteligencja|sztucznej inteligencji]] w przemyśle,
      m.in. [[System ekspertowy|systemy ekspertowe]];

      * projektowanie urządzeń wykorzystywanych w przemyśle, m.in. [[oprogramowanie
      sprzętowe]].


