- sections:
  - content: "'''Informatyka techniczna''' – dawniej dział [[Informatyka|informatyki]]\
      \ związany z obliczeniami inżynieryjno-technicznymi  (ang. ''technical computing''<ref>{{Cytuj\
      \ |tytuł = Technical computing - HandWiki |data dostępu = 2021-05-01 |opublikowany\
      \ = handwiki.org |url = https://handwiki.org/wiki/Technical_computing}}</ref><ref>{{Cytuj\
      \ |tytuł = Introduction to Scientific and Technical Computing |data dostępu\
      \ = 2021-05-01 |opublikowany = Routledge & CRC Press |url = https://www.routledge.com/Introduction-to-Scientific-and-Technical-Computing/Willmore-Jankowski-Colina/p/book/9781498745048\
      \ |język = en}}</ref>), obecnie po zmianach wprowadzonych przez nową [[Klasyfikacja\
      \ dziedzin i dyscyplin naukowych w Polsce|klasyfikację dziedzin i dyscyplin]]\
      \ w roku 2018<ref>Rozporządzenie Ministra Nauki i Szkolnictwa Wyższego z dnia\
      \ 20 września 2018 r. w sprawie dziedzin nauki i dyscyplin naukowych oraz dyscyplin\
      \ artystycznych ({{Dziennik Ustaw|2018|1818}}) zastąpione przez rozporządzenie\
      \ Ministra Edukacji i Nauki z dnia 11 października 2022 r. w sprawie dziedzin\
      \ nauki i dyscyplin naukowych oraz dyscyplin artystycznych ({{Dziennik Ustaw|2022|2202}}).</ref>,\
      \ znacznie szersze pojęcie, wykraczające poza termin angielski, jako składowa\
      \ dyscypliny \"informatyka techniczna i telekomunikacja\" z dziedziny nauk inżynieryjno-technicznych.\
      \ Dyscyplina \"informatyka techniczna i telekomunikacja\" jest powiązana z szeregiem\
      \ kierunków studiów technicznych, w tym z kierunkami bezpośrednio kształcącymi\
      \ w informatyce technicznej<ref>{{Cytuj |tytuł = INFORMATYKA TECHNICZNA studia\
      \ {{!}} Kraków 19 uczelni - rekrutacja 2021 {{!}} wymagania i opinie |data dostępu\
      \ = 2021-05-01 |opublikowany = otouczelnie.pl |url = https://www.otouczelnie.pl/miasto_dzial/1923/Informatyka-techniczna-Krakow\
      \ |język = pl}}</ref>. Po poszerzeniu zakresu pojęciowego informatyki technicznej,\
      \ przy braku polskiej tradycji stosowania tego określenia, pojawiły się propozycje\
      \ utożsamienia jej z dziedziną [[Technika informatyczna|technologii informatycznych]]\
      \ (lub [[Technika informatyczna|technologii informacyjnych]], ang. [[Information\
      \ Technology Infrastructure Library|information technology]]).\n\n== Etymologia\
      \ == \nW sierpniu 2005 grupa organizacji wokól [[Association for Computing Machinery|ACM]]\
      \ zaproponowała nazwę ogólnego programu nauczania ''computing'', w którym wyróżniono\
      \ pięć podstawowych specjalności{{r|ACMfive}}: ''computer engineering'' (CE),\
      \ ''computer science'' (CS), ''information systems'' (IS), ''information technology''\
      \ (IT), ''software engineering'' (SE). W grudniu 2017 podobna grupa organizacji{{r|ACMseven}}\
      \ zdefiniowała zakres specjalizacji ''information technology'' jako:  \n{{Cytat\n\
      \ |treść = naukę o systematycznym podejściu do wybierania, rozwijania, stosowania,\
      \ integrowania i bezpiecznym administrowaniu technikami informatycznymi w celu\
      \ umożliwienia użytkownikom  realizacji ich celów osobistych, organizacyjnych\
      \ i społecznych.\n}}\n\nW 2018 w Polsce zmieniono [[Klasyfikacja dziedzin i\
      \ dyscyplin naukowych w Polsce|klasyfikację dziedzin i dyscyplin]]. Ustalono\
      \ dyscyplinę w dziedzinie nauk inżynieryjno-technicznych – ''informatyka techniczna\
      \ i telekomunikacja''. Celem zmiany było wprowadzenie dyscypliny informatycznej\
      \ w dziedzinie nauk inżynieryjno-technicznych, w odróżnieniu od dyscypliny ''Informatyka'',\
      \ która została przyporządkowana dziedzinie nauk ścisłych i przyrodniczych,\
      \ oraz połączenie jej z telekomunikacją. Powstała w efekcie dyscyplina obejmuje\
      \ bardzo szeroki zakres, łączący w sobie praktycznie wszystkie z pięciu specjalności\
      \ informatycznych wymienionych we wzmiankowanym wyżej dokumencie [[Association\
      \ for Computing Machinery|ACM]]: od ''inżynierii komputerowej (CE),'' poprzez\
      \ ''inżynierię oprogramowania (SE),'' aż do nauk dotyczących ''technologii informacyjnych\
      \ (IT) oraz systemów informacyjnych (IS),'' z relatywnie najmniejszym udziałem\
      \ zorientowanej na teorię ''informatyki (czystej) (CS).'' Do dyscypliny ''informatyka\
      \ techniczna i telekomunikacja'' przyporządkowane zostały wszystkie kierunki\
      \ informatyczne kształcące inżynierów, a więc w większości kierunki prowadzone\
      \ na uczelniach technicznych. W efekcie tych zmian dyscyplina ''informatyka\
      \ techniczna'' została powiązana z szeregiem kierunków studiów, od klasycznych:\
      \ ''Informatyki'' i ''Informatyki Stosowanej,'' poprzez wiele innych związanych\
      \ z różnymi specjalnościami informatycznymi, aż do kierunków bezpośrednio związanych\
      \ z telekomunikacją, takich jak np. ''[[Teleinformatyka]]''.\n\n== Badania i\
      \ przedmioty informatyki technicznej ==\nZakres badań oraz zakres nauczania\
      \ informatyki technicznej jest znacznie szerszy niż zawarty w specjalizacji\
      \ technologii informacyjnych (''information technology)'', obejmując całość\
      \ obecnych osiągnięć praktycznych informatyki z uzupełnieniem podstaw teoretycznych.\
      \ Tym samym konieczne jest wybranie podzbioru tej wiedzy w określonej specjalności,\
      \ dowolnie sformułowanych. Pośród znajdujących się poza obszarem technologii\
      \ informacyjnych, wyróżniane są  trzy podstawowe{{r|ACMseven}}:\n\n* [[Inżynieria\
      \ komputerowa]] (ang. ''computer engineering'') – specjalność informatyki technicznej,\
      \ zajmująca się [[Architektura komputera|architekturą]], projektowaniem i działaniem\
      \ [[System komputerowy|systemów komputerowych]], w tym projektowaniem, wytwarzaniem,\
      \ integracją i eksploatacją sprzętu cyfrowego w sieciach  komputerowych oraz\
      \ internetowych. Również projektowanie sprzętu [[sterownik]]ów dla [[system\
      \ wbudowany|systemów wbudowanych]] do automatyzacji procesów oraz zarządzanych\
      \ przez internet ([[internet rzeczy]] IoT) wraz z odpowiednim [[oprogramowanie\
      \ podstawowe|oprogramowaniem podstawowym]].\n\n* [[Inżynieria oprogramowania]]\
      \ (ang. ''software engineering'') – specjalność informatyki technicznej stosująca\
      \ podejście inżynierskie do tworzenia [[Oprogramowanie|oprogramowania]]: od\
      \ analizy i określenia wymagań, przez projektowanie i wdrożenie, aż do ewolucji\
      \ gotowego oprogramowania.\n\n* [[Systemy informacyjne]] (ang. ''information\
      \ systems'') – specjalność informatyki technicznej ukierunkowana na przetwarzanie,\
      \ za pomocą procedur i modeli, informacji wejściowych w wyjściowe, w tym projektowanie,\
      \ realizację i eksploatację baz danych z przetwarzaniem informacji. Obecnie\
      \ również przetwarzanie i analiza gigadanych ([[Big Data]]) oraz nauka o danych\
      \ ([[danologia]]).\n\n== Przypisy ==\n<references responsive>\n<ref name=ACMfive>{{cytuj\
      \ | tytuł= Computing Curricula 2005 | autor= The Joint Task Force for Computing\
