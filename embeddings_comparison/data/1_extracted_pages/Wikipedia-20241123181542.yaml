      |}\n\n==== Systemy operacyjne ====\n{{Osobny artykuł|System operacyjny}}\nSystemy\
      \ operacyjny pełnią szczególną rolę w informatyce. Jest to [[oprogramowanie]]\
      \ zarządzające [[System komputerowy|systemem komputerowym]], tworzące [[środowisko]]\
      \ do uruchamiania i kontroli [[Zadanie (informatyka)|zadań]]. Najważniejszym\
      \ elementem systemu operacyjnych jest jego [[Jądro systemu operacyjnego|jądro]]\
      \ wykonujące i kontrolujące zadania m.in. [[Dyspozytor|planisty]] czasu procesora,\
      \ ustalającego które zadanie i jak długo będzie wykonywane czy przełącznika\
      \ zadań, odpowiedzialnego za przełączanie pomiędzy uruchomionymi zadaniami.\
      \ System operacyjny posiada także swoją [[Powłoka systemowa|powłokę]], czyli\
      \ specjalny [[Oprogramowanie|program]] komunikujący użytkownika z systemem operacyjnym\
      \ oraz [[system plików]] – sposób ustrukturyzowanego zapisu danych na [[Nośnik\
      \ danych|nośniku]]. Osoby administrujące systemami nazwa się [[Administrator\
      \ systemów komputerowych|administratorami]] (pot. adminami). Współcześnie najważniejszą\
      \ rodziną systemów operacyjnych jest [[GNU/Linux]] oraz [[Microsoft Windows|Windows]].\n\
      \n{| style=\"border:1px solid #ccc; text-align:center; margin:auto;\" cellspacing=\"\
      15\"\n|\n|\n|\n|\n| rowspan=\"3\" |[[Plik:FSV-OSX-screenshot.png|96px]]\n|-\n\
      | [[Plik:Device-driver-pl.svg|96px]]\n| [[Plik:Thread pool.svg|96px]]\n| [[Plik:System\
      \ operacyjny schemat ogolny.svg|96px]]\n| [[Plik:Dir command in Windows Command\
      \ Prompt.png|96px]]\n|-\n| [[Sterownik urządzenia|Sterowniki]]\n| [[Dyspozytor|Planista]]\n\
      | [[Jądro systemu operacyjnego]]\n| [[Powłoka systemowa]]\n|}\n\n=== Informatyka\
      \ praktyczna ===\n{{Osobny artykuł|Programowanie komputerów|Kategoria:Konstrukcje\
      \ programistyczne}}\nProgramowanie komputerów to proces projektowania, tworzenia,\
      \ testowania i utrzymywania [[Kod źródłowy|kodu źródłowego]] [[Program komputerowy|programów\
      \ komputerowych]] w tym dla urządzeń [[mikroprocesor]]owych ([[mikrokontroler]]y).\
      \ Programowanie pod różnymi postaciami jest obecne w większości działów informatyki.\
      \ Kod źródłowy jest napisany w [[Język programowania|języku programowania]],\
      \ z użyciem określonych reguł, może on być modyfikacją istniejącego programu\
      \ lub czymś zupełnie nowym. Programowanie wymaga wiedzy i doświadczenia w wielu\
      \ dziedzinach, jak projektowanie aplikacji, [[algorytmika]], [[Struktura danych|struktury\
      \ danych]], [[Język programowania|języki programowania]] i narzędzia programistyczne,\
      \ [[kompilator]]y, czy sposób działania podzespołów komputera. Między programistami\
      \ trwają debaty, czy programowanie komputerów jest sztuką, rzemiosłem czy procesem\
      \ inżynieryjnym. Bezpośrednią formą sztuki w tej dziedzinie jest [[demoscena]].\
      \ Programowanie komputerów integruje ze sobą większość gałęzi informatyki. Istnieje\
      \ wiele gałęzi rozwoju technik programowania, jednak wszystkie z nich bazują\
      \ na wspólnych podstawach. Niezależnie czy to będzie aplikacja webowa w [[JavaScript|Javascript]],\
      \ gra komputerowa w [[C++]] czy program mikrokontrolera w [[C (język programowania)|C]],\
      \ używają one podstawowych konstrukcji programistycznych. Podstawymi pojęciami\
      \ od których zaczyna się naukę programowania są między innymi [[Zmienna (informatyka)|zmienne]],\
      \ [[Tablica (informatyka)|tablice]], [[Instrukcja warunkowa|instrukcje warunkowe]],\
      \ [[Pętla (informatyka)|pętle]], [[Wskaźnik (typ danych)|wskaźniki]], [[Tekstowy\
      \ typ danych|łańcuchy]], [[Podprogram|funkcje]], [[debugowanie]], [[Biblioteka\
      \ programistyczna|biblioteki]] oraz [[zarządzanie pamięcią]]. Języki dzieli\
      \ się na generacje: [[2GL]], [[3GL]], [[4GL]], [[5GL]]. Wyróżnia się między\
      \ innymi [[Język akcji|języki akcji]], [[Język algorytmiczny|języki algorytmiczne]],\
      \ [[Język dziedzinowy|języki dziedzinowe]], [[Język interpretowany|języki interpretowane]],\
      \ [[Język kompilowany|języki kompilowane]], [[Język mnemoniczny|języki mnemoniczne]],\
      \ [[Język nieproceduralny|języki nieproceduralne]], [[Język niezależny komputerowo|języki\
      \ niezależne komputerowo]], [[Język niskiego poziomu|języki niskiego poziomu]],\
      \ [[Język opisu zadań|języki opisu zadań]], {{fakt|[[Język problemowy|języki\
      \ problemowe]]|data=2024-04}}, [[Język proceduralny|języki proceduralne]], [[Język\
      \ symulacyjny|języki symulacyjne]], [[Język uniwersalny|języki uniwersalne]]\
      \ i [[Język wysokiego poziomu|języki wysokiego poziomu]]. Do najpopularniejszych\
      \ języków programowania zalicza się: [[Java]], C, [[Python]], C++, [[Visual\
      \ Basic .NET]], [[C Sharp|C#]], [[JavaScript]], [[PHP]], [[SQL]], [[Asembler#Język\
      \ asemblera|Język Asemblera]], [[Swift (język programowania LLVM)|Swift]], [[Objective-C]],\
      \ [[Ruby (język programowania)|Ruby]], [[Groovy]], [[Go (język programowania)|Go]],\
      \ [[Perl]], [[MATLAB]], [[Visual Basic]], [[Object Pascal]].\n\n{| style=\"\
      border:1px solid #ccc; text-align:center; margin:auto;\" cellspacing=\"15\"\n\
      |-\n| [[Plik:Programmiersprache Umfeld.png|96px]]\n| [[Plik:For loop.png|96px]]\n\
      | [[Plik:Mapa conceptual del software libre.png|96px]]\n| [[Plik:C Hello World\
      \ Program.png|96px]]\n| [[Plik:Quellcodebeispiel C++.png|96px]]\n|-\n| [[Język\
      \ wysokiego poziomu|Języki wysokiego poziomu]]\n| [[Przepływ sterowania]]\n\
      | [[Biblioteka programistyczna|Biblioteki programistyczne]]\n| [[Programowanie\
      \ obiektowe]]\n| [[Programowanie strukturalne]]\n|}\n\n==== Grafika komputerowa\
      \ ====\n{{Osobny artykuł|Grafika komputerowa}}\nGrafika komputerowa to dział\
      \ informatyki zajmujący się cyfrową syntezą i manipulacją treści wizualnych.\
      \ Ze względu na reprezentację danych dzieli się na [[Grafika rastrowa|grafikę\
      \ rastrową]] i [[Grafika wektorowa|wektorową]], a ze względu na charakter danych\
      \ na [[Grafika dwuwymiarowa|grafikę dwuwymiarową]], [[Grafika 3D|trójwymiarową]]\
      \ i [[Animacja komputerowa|ruchomą]]. Obejmuje także obecnie szybko rozwijające\
      \ się [[Cyfrowe przetwarzanie obrazów|przetwarzenie obrazów]]. Grafikę komputerową\
      \ można także podzielić na teoretyczną skupiającą się algorytmach graficznych\
      \ i praktyczną, skupiającą się [[Retusz|manipulacji obrazem]] czy modelowaniu\
      \ 3D np. w programie [[Blender (program)|Blender]]. Grafika komputerowa stanowi\
      \ podstawę współczesnych [[Gra komputerowa|gier]], [[Animacja komputerowa|animacji]],\
      \ [[Symulacja komputerowa|symulacji]] czy [[Wizualizacja (informatyka)|wizualizacji]]\
      \ komputerowych. Renderowanie polega na analizie stworzonego wcześniej modelu\
      \ danej sceny oraz utworzenie na jej podstawie dwuwymiarowego obrazu wyjściowego\
      \ w formie statycznej lub animacji. Podczas renderowania rozpatrywane są m.in.\
      \ odbicia, cienie, załamania światła, wpływy atmosfery (w tym mgła), efekty\
      \ wolumetryczne itp.\n\n{| style=\"border:1px solid #ccc; text-align:center;\
      \ margin:auto;\" cellspacing=\"15\"\n|-\n| [[Plik:Raster graphic fish 20x23squares\
      \ sdtv-example.png|96px]]\n| [[Plik:DeCasteljau-evaluate point.svg|96px]]\n\
      | [[Plik:Texture mapping demonstration animation.gif|96px]]\n| [[Plik:Raytracing-schemat.png|96px]]\n\
      | [[Plik:Pavlovsk Railing of bridge Yellow palace Winter bw threshold.jpg|96px]]\n\
      |-\n| [[Grafika rastrowa]]\n| [[Grafika wektorowa]]\n| [[Grafika trójwymiarowa]]\n\
      | [[Renderowanie]] i [[Animacja komputerowa|animacja]]\n| [[Cyfrowe przetwarzanie\
      \ obrazów]]\n|}\n\n==== Inżynieria oprogramowania ====\n{{Osobny artykuł|Inżynieria\
      \ oprogramowania}}\nInżynieria oprogramowania, także ''inżynieria systemów informatycznych''\
      \ – zajmuje się procesem i metodykami tworzenia [[System informatyczny|systemów\
      \ informatycznych]]: od analizy i określenia wymagań, przez projektowanie i\
      \ wdrożenie, aż do ewolucji gotowego oprogramowania. Termin ''inżynieria oprogramowania''\
      \ po raz pierwszy został użyty w przełomie lat 1950/60 (ale oficjalnie za narodziny\
      \ tej dyscypliny podaje się lata 1968 i 1969, w których miały miejsce dwie konferencje\
      \ sponsorowane przez [[NATO]], odpowiednio w [[Garmisch-Partenkirchen|Garmisch]]\
      \ i [[Rzym]]ie). Wyróżnia [[Fazy produkcji oprogramowania|fazy produkcji oprogramwania]]:\
      \ specyfikacji, projektowania, [[Implementacja (informatyka)|implementacji]],\
      \ integracji i ewoluacji, a także dostarcza systematycznych [[Metodyka|metodyk]]\
      \ jego tworzenia, jak m.in. [[model kaskadowy]], [[Model prototypowy|prototypowy]]\
      \ czy [[Programowanie zwinne|zwinny]], w tym [[scrum]]. Wprowadza takie pojęcia\
      \ jak np. [[cykl życia programu]] czy [[metryka oprogramowania]]. Wyróżnia się\
      \ także jej specjalizacje np. inżynieria systemów mobilnych, inżynieria systemów\
      \ baz danych, inżynieria systemów wbudowanych czy inżynieria gier komputerowych.\
      \ Wzorcem projektowym ([[Język angielski|ang.]] design pattern) nazywa się uniwersalne,\
      \ sprawdzone w praktyce rozwiązanie często pojawiających się, powtarzalnych\
      \ problemów projektowych. Pokazuje powiązania i zależności pomiędzy klasami\
      \ oraz obiektami i ułatwia tworzenie, modyfikację oraz utrzymanie kodu źródłowego.\
      \ Jest opisem rozwiązania, a nie jego implementacją. Architekturą oprogramowania\
      \ nazwywa podstawową organizację systemu wraz z jego komponentami, wzajemnymi\
      \ powiązaniami, środowiskiem pracy i regułami ustanawiającymi sposób jego budowy\
      \ i rozwoju. Metody formalne – tworzenie specyfikacji, projektowania i weryfikacji\
      \ [[Oprogramowanie|oprogramowania]] lub systemów informatycznych w języku formalnym.\
      \ Metody formalne najlepiej opisać jako zastosowanie dość szerokiej gamy podstaw\
      \ teoretycznych informatyki, w szczególności [[Rachunek zdaniowy|rachunku logicznego]],\
      \ [[Język formalny|języków formalnych]], teorii automatów, systemu dynamiki\
      \ zdarzeń dyskretnych i semantyki programów, a także systemów typów i [[Typ\
      \ danych|typów danych]] algebraicznych do specyfikacji i weryfikacji problemów\
      \ w oprogramowaniu i sprzęcie.\n\n{| style=\"border:1px solid #ccc; text-align:center;\
      \ margin:auto;\" cellspacing=\"15\"\n|-\n| [[Plik:UML Diagrams.jpg|96px]]\n\
      | [[Plik:Prototyp.svg|96px]]\n| [[Plik:Wikimedia Server Architecture (simplified).svg|96px]]\n\
      | [[Plik:SoftwareDevelopmentLifeCycle.jpg|96px]]\n| [[Plik:CodeCmmt002.svg|96px]]\n\
      |-\n| [[UML|Diagramy UML]]\n| [[Wzorzec projektowy (informatyka)|Wzorce projektowe]]\n\
      | [[Architektura oprogramowania]]\n| [[Programowanie zwinne|Metodyki wytwarzania\
      \ oprogramowania]]\n| [[Metody formalne]]\n|}\n\n==== Cyberbezpieczeństwo i\
      \ kryptologia ====\n{{Osobny artykuł|Bezpieczeństwo komputerowe|Kryptologia}}\n\
      Kryptologia dzieli się na [[kryptografia|kryptografię]], czyli gałąź wiedzy\
      \ o utajnianiu wiadomości oraz [[Kryptoanaliza|kryptoanalizę]], czyli gałąź\
      \ wiedzy o przełamywaniu zabezpieczeń oraz o deszyfrowaniu wiadomości przy braku\
      \ klucza lub innego wymaganego elementu schematu szyfrowania ([[szyfr]]u). Przykładowe\
      \ metody to [[atak brute force]] czy [[kryptoanaliza liniowa]]. Bezpieczeństwo\
      \ komputerowe (ang. ''computer security'''', pot. ''cybersecurity, hacking'')\
      \ zajmuje się zapewnianiem [[Poufność|poufności]] i [[Bezpieczeństwo teleinformatyczne|bezpieczeństwa\
      \ danych]]. Osoby posiadające szeroką i zaawansowaną wiedzę informatyczną, lecz\
      \ nieetycznie z niej korzystający nazywani są [[Haker (bezpieczeństwo komputerowe)|cracker]].\
      \ Ich szczególnym zainteresowaniem jest wyszukiwanie luk (dziur) w systemach\
      \ operacyjnych, programach, sieciach komputerowych czy urządzeniach do niej\
      \ podłączonych w celu przejęcia nad nimi zdalnej kontroli. Wyróżnia się wiele\
      \ klasycznych [[Atak komputerowy|ataków komputerowych]] takich jak na przykład\
      \ [[DDoS]], [[HTTP Flood]], [[UDP flood]], [[smurf attack]], [[session hijacking]],\
      \ a także wiele rodzajów [[Wirus komputerowy|wirusów komputerowych]], [[Koń\
      \ trojański (informatyka)|trojanów]], [[sniffer]]ów czy [[rootkit]]ów. W odpowiedzi\
      \ powstało wiele technik obrony systemów informatycznych, np. [[Obrona w głąb\
      \ (informatyka)|obrona w głąb]], [[security through obscurity]] czy [[głębokie\
      \ ukrycie]]<ref>{{Cytuj |autor = Daniel Schatz, Rabih Bashroush, Julie Wall\
      \ |tytuł = Towards a More Representative Definition of Cyber Security |czasopismo\
      \ = Journal of Digital Forensics, Security and Law |data = 2017-06-30 |data\
      \ dostępu = 2020-03-28 |issn = 1558-7215 |wolumin = 12 |numer = 2 |doi = 10.15394/jdfsl.2017.1476\
      \ |url = https://commons.erau.edu/jdfsl/vol12/iss2/8}}</ref><ref>{{Cytuj |autor\
      \ = Nikola Zlatanov |tytuł = Computer Security and Mobile Security Challenges\
      \ |data = December 2015 |url = https://www.researchgate.net/publication/298807979_Computer_Security_and_Mobile_Security_Challenges}}</ref>.\n\
      \n{| style=\"border:1px solid #ccc; text-align:center; margin:auto;\" cellspacing=\"\
      15\"\n|-\n| [[Plik:Virus Blaster.jpg|96px]]\n| [[Plik:Rkhunter on Mac OS X.png|96px]]\n\
      | [[Plik:Circle of spam.svg|96px]]\n| [[Plik:SHA-1.svg|96px]]\n| [[Plik:CPU\
      \ ring scheme.svg|96px]]\n|-\n| [[Wirus komputerowy|Wirusy komputerowe]]\n|\
      \ [[Sniffer]]y i [[Rootkit]]y\n| [[Botnet (bezpieczeństwo komputerowe)|Botnet]]\n\
      | [[Funkcja skrótu|Funkcje skrótu]]\n| [[Obrona w głąb (informatyka)|Obrona\
      \ w głąb]]\n|}\n\n==== Bazy danych, eksploracja danych, danologia ====\n[[Danologia]]\
      \ (ang. ''Data science'') wykorzystuje metody naukowe, procesy, algorytmy, narzędzia\
      \ i systemy informatyczne do wydobywania wiedzy i spostrzeżeń z wielu danych\
      \ strukturalnych i nieustrukturyzowanych, tzw. [[Big data]]. Eksploracją danych\
      \ (ang. ''data mining'') nazywa się jeden z procesów uzyskiwania wiedzy z [[Baza\
      \ danych|baz danych]]. Idea eksploracji danych polega na wykorzystaniu szybkości\
      \ komputera do znajdowania ukrytych dla człowieka (właśnie z uwagi na ograniczone\
      \ możliwości czasowe) prawidłowości w [[Dane|danych]] zgromadzonych w [[Hurtownia\
      \ danych|hurtowniach danych]]. Big data to termin odnoszący się do dużych, zmiennych\
      \ i różnorodnych [[Zbiór danych|zbiorów danych]], których przetwarzanie i analiza\
      \ jest trudna, ale jednocześnie wartościowa. Obecne użycie terminu ''big data''\
      \ zwykle odnosi się do użycia analizy predykcyjnej, analizy zachowania użytkownika\
      \ lub niektórych innych zaawansowanych metod analizy danych, które wydobywają\
      \ wartość z danych, a rzadko do określonego rozmiaru zestawu danych. Baza danych\
      \ to zorganizowany [[zbiór danych]], ogólnie przechowywanych i dostępnych z\
      \ systemu komputerowego. Tam, gdzie bazy danych są bardziej złożone, często\
      \ są opracowywane przy użyciu formalnych technik projektowania i modelowania.\
      \ [[System zarządzania bazą danych]] (DBMS) to oprogramowanie, które współdziała\
      \ z użytkownikami końcowymi, aplikacjami i samą bazą danych w celu przechwytywania\
      \ i analizy danych. Oprogramowanie DBMS obejmuje dodatkowo podstawowe narzędzia\
      \ do zarządzania bazą danych.\n\n=== Systemy i technologie komputerowe ===\n\
      {{Osobny artykuł|System komputerowy|System informatyczny|Technika informatyczna}}Systemy\
      \ informatyczne (ang. information processing systems) może opisać jako zbiór\
      \ powiązanych ze sobą elementów, które przetwarzają informacje, najczęściej\
      \ z wykorzystaniem sprzętu i oprogramowania komputerowego.\n\n==== Sztuczna\
      \ inteligencja ====\n{{Osobny artykuł|Sztuczna inteligencja}}\nSztuczna inteligencja\
      \ (SI, ang. ''Artificial intelligence, AI'') to obszar informatyki zajmujący\
      \ się komputerowym symulowaniem [[Inteligencja|inteligencji]] – tworzeniem modeli\
      \ zachowań inteligentnych oraz systemów komputerowych symulujących te zachowania<ref>{{Cytuj\
      \ |autor = Katalog Niemieckiej Biblioteki Narodowej |tytuł = Kontrola Autorytatywna\
      \ |data dostępu = 2020-03-31 |opublikowany = portal.dnb.de |url = https://portal.dnb.de/opac.htm?method=simpleSearch&cqlMode=true&query=nid=4033447-8}}</ref><ref>{{Cytuj\
      \ |autor = University of British Columbia, Faculty of Computer Science |tytuł\
      \ = Computational Intelligence and Knowledge |url = https://www.cs.ubc.ca/~poole/ci/ch1.pdf}}</ref>.\
      \ Szczególnym zainteresowaniem darzy się problemy które nie są bezpośrednio\
      \ algorytmizowalne, jak [[rozpoznawanie obrazów]], [[Tłumaczenie automatyczne|tłumaczenie\
      \ maszynowe]] czy [[rozpoznawanie mowy]]. Sztuczna inteligencja jest związana\
      \ z [[Logika rozmyta|logiką rozmytą]], [[Algorytm ewolucyjny|algorytmami ewolucyjnymi]],\
      \ [[Sieć neuronowa|sieciami neuronowymi]], [[robot]]yką i [[sztuczne życie|sztucznym\
      \ życiem]]. SI bywa nazywane także inteligencją obliczeniową (ang. ''Computational\
      \ Intelligence'', ''CI''). Uczeniem maszynowym (ang. ''Machine learning'', ''ML'')\
      \ nazwa się analizę procesów uczenia się oraz tworzeniem systemów, które doskonalą\
      \ swoje działanie na podstawie doświadczeń z przeszłości. Jedną z wiodących\
      \ technologii jest [[TensorFlow]]<ref>{{Cytuj |autor = Bharath Ramsundar, Reza\
      \ Bosagh Zadeh |tytuł = Głębokie uczenie z TensorFlow |data = 2019 |isbn = 978-83-283-5705-1\
      \ |url = https://helion.pl/ksiazki/glebokie-uczenie-z-tensorflow-od-regresji-liniowej-po-uczenie-przez-wzmacnianie-bharath-ramsundar-reza-bosagh-zadeh,glutef.htm}}</ref>.\
      \ Systemy te posiadają zdolność do samouczenia się i nazywa się je systemami\
      \ samouczącymi. Podstawowymi metodami ML są symboliczne uczenie się (nazywane\
      \ także indukcyjnym, ang. ''symbolic/inductive learning'') oraz [[Sieć neuronowa|sztuczne\
      \ sieci neuronowe]] (ang. ''artificial neural networks'')<ref>{{Cytuj |autor\
      \ = Jerzy Stefanowski |tytuł = Wprowadzenie do maszynowego uczenia się |miejsce\
      \ = Instytut Informatyki, Politechnika Poznańska |url = http://www.cs.put.poznan.pl/jstefanowski/ml/NEWML_W1lastr.pdf}}</ref>.\
      \ Nazywa się tak połączone grupy węzłów, podobne do rozległej sieci neuronów\
      \ w ludzkim mózgu. Głębokie sieci neuronowe (także głębokie uczenie maszynowe,\
      \ ang. ''deep learning'' lub ''differential programming'') to podkategoria uczenia\
      \ maszynowego – nazywa się tak metody oparte na sztucznych sieciach neuronowych\
      \ z uczeniem reprezentatywnym (ang. feature learning lub representation learning).\
      \ Uczenie się może być [[Uczenie nadzorowane|nadzorowane]], [[Uczenie częściowo\
      \ nadzorowane|częściowo nadzorowane]] lub [[Uczenie nienadzorowane|nienadzorowane]]<ref>{{Cytuj\
      \ |tytuł = Machine learning i deep learning – samouczące systemy. Leksykon 2017\
      \ {{!}} |data dostępu = 2020-03-29 |url = http://it-filolog.pl/machine-learning-i-deep-learning-samouczace-systemy-leksykon-2017/\
      \ |język = pl}}</ref>. Sztuczne życie (ang. ''artificial life, AL,'' niem''.\
      \ Künstliches Leben, KL'') to kierunek badań, zorientowany na zrozumienie i\
      \ wykorzystanie istoty życia. Pomysłodawcą i ojcem chrzestnym tego podejścia\
      \ był amerykański matematyk i informatyk [[Christopher Langton]], który zaproponował\
      \ je w 1986 roku. Dziedzina obejmuje między innymi: tworzenie różnorodnych modeli\
      \ życia oraz prowadzenie symulacji w środowisku programowym, sprzętowym i biochemicznym,\
      \ symulacje ewolucji biologicznej oraz innych procesów biologicznych za pomocą\
      \ metod informatycznych, badania i symulacje układów niebiologicznych, zachowujących\
      \ się podobnie jak układy biologiczne (np. [[Automat komórkowy|automatów komórkowych]]),\
      \ [[Algorytm ewolucyjny|algorytmy ewolucyjne]] i ewolucję programów komputerowych.\n\
      \n{| style=\"border:1px solid #ccc; text-align:center; margin:auto;\" cellspacing=\"\
      15\"\n|-\n| [[Plik:Artificial neural network.svg|96px]]\n| [[Plik:Kernel Machine.svg|96px]]\n\
      | [[Plik:Tensorflow logo.svg|96px]]\n| [[Plik:Dnaconformations.png|96px]]\n\
      | [[Plik:Rule alignment.gif|96px]]\n|-\n| [[Sieć neuronowa]]\n| [[Uczenie maszynowe]]\n\
      | [[TensorFlow]]\n| [[Algorytmy ewolucyjne]]\n| [[Inteligencja rozproszona]]\n\
      |}\n\n==== Systemy wbudowane i obliczenia czasu rzeczywistego ====\n{{Osobny\
      \ artykuł|System wbudowany|System czasu rzeczywistego}}\nSystemy wbudowane to\
      \ systemy komputerowe specjalnego przeznaczenia, który staje się integralną\
      \ częścią obsługiwanego przez niego [[Sprzęt komputerowy|sprzętu komputerowego]]\
      \ (''hardware''). System wbudowany musi spełniać określone wymagania ściśle\
      \ zdefiniowane pod kątem zadań, które ma wykonywać. Każdy system wbudowany oparty\
      \ jest na [[mikroprocesor]]ze (lub [[mikrokontroler]]ze) zaprogramowanym do\
      \ wykonywania ograniczonej liczby zadań lub nawet wyłącznie do jednego zadania.\
      \ W systemach wbudowanych najpopularniejszymi [[Model programowy procesora|modelami\
      \ programowymi]] procesorów są [[RISC]] oparte na zasadach [[Architektura harwardzka|architektury\
      \ harvardzkiej]] lub [[ARM (architektura)|ARM]]. W systemach czasu rzeczywistego\
      \ wynik i efekt działania jest zależny od chwili wypracowania tego wyniku. Systemy\
      \ wbudowane współcześnie znajdują zastosowania np. w autonomicznych pojazdach,\
      \ w internecie rzeczy czy w urządzeniach rozrywkowych.\n\n==== Widzenie komputerowe\
      \ i rozpoznawanie wzorców ====\n{{Osobny artykuł|Rozpoznawanie wzorców}}\nRozpoznawanie\
      \ wzorców (ang. ''pattern recognition'') to pole badawcze w obrębie uczenia\
      \ maszynowego. Może być definiowane jako działanie polegające na pobieraniu\
      \ surowych [[Dane|danych]] i podejmowaniu dalszych czynności zależnych od kategorii\
      \ do której należą te dane. W rozpoznawaniu wzorców dąży się do klasyfikacji\
      \ danych (wzorców) w oparciu o wiedzę aprioryczną lub o informacje uzyskane\
      \ na drodze statystycznej analizy danych służącej wydobywaniu cech obiektów.\
      \ Klasyfikowane wzorce to zazwyczaj grupy wyników pomiaru lub obserwacji definiujące\
      \ położenie odpowiadających im punktów w wielowymiarowej przestrzeni cech.\n\
      \n{| style=\"border:1px solid #ccc; text-align:center; margin:auto;\" cellspacing=\"\
      15\"\n|-\n| [[Plik:Intersection over Union - object detection bounding boxes.jpg|96px]]\n\
      | [[Plik:Cosine Series Plus Noise TFM.png|96px]]\n| [[Plik:OpenCV Logo with\
      \ text svg version.svg|96px]]\n| [[Plik:Corner.png|96px]]\n| [[Plik:Cluster-2.svg|96px]]\n\
      |-\n| [[Rozpoznawanie obrazów|Computer Vision]]\n| [[Rozpoznawanie mowy]]\n\
      | [[OpenCV]]\n| [[Przetwarzanie języka naturalnego]]\n| [[Analiza skupień]]\n\
      |}\n\n==== Przetwarzanie obrazów i mowy ====\nSygnały cyfrowe to strumienie\
      \ bitów informacji, ich przetwarzanie polega na wykonaniu na nich pewnych operacji\
      \ oraz ich interpretacja. Do głównych zastosowań należy przetwarzanie dźwięku,\
      \ kompresja dźwięku, segmentacja obrazów, kodowanie wideo, przetwarzanie mowy,\
      \ rozpoznawanie mowy oraz telekomunikacja cyfrowa.\n\n==== Gry komputerowe i\
      \ symulatory ====\n{{Osobny artykuł|Gra komputerowa|Symulacja komputerowa|Programista\
      \ gier komputerowych}}\nGry komputerowe to rodzaj [[Program komputerowy|oprogramowania\
      \ komputerowego]] przeznaczonego do celów rozrywkowych lub edukacyjnych, wymagające\
      \ od użytkownika ([[gracz]]a) rozwiązywania zadań logicznych lub zręcznościowych.\
      \ Gry komputerowe mogą być uruchamiane na komputerach osobistych, [[Automat\
      \ do gry|specjalnych automatach]], [[Konsola gier wideo|konsolach do gry]],\
      \ [[telewizor]]ach, telefonach komórkowych oraz innych urządzeniach mobilnych.\
      \ Gry, podobnie jak [[Symulacja komputerowa|symulacje komputerowe]] mają wirtualizować\
      \ pewien fragment rzeczywistości. Zaawansowane gry i symulacje są pisane w czystych\
      \ językach programowania, najczęściej obiektowych – jak [[Simula]] czy [[C++]]\
      \ lub są oparte na silnikach jak [[Unity (silnik gry)|Unity]]. Dla mniej wymagających\
      \ symulacji powstały także uniwersalne programy.\n\n{| style=\"border:1px solid\
      \ #ccc; text-align:center; margin:auto;\" cellspacing=\"15\"\n|-\n| [[Plik:Osmosis\
      \ computer simulation.jpg|96px]]\n| [[Plik:Screenshot phun.PNG|96px]]\n| [[Plik:Battle\
      \ for Mandicor 0.0.5.png|96px]]\n| [[Plik:Raytracing reflection.png|96px]]\n\
      | [[Plik:Activemarker2.PNG|96px]]\n|-\n| [[Silnik graficzny|Silniki graficzne]]\n\
      | [[Komputerowa gra symulacyjna|Gra symulacyjna]]\n| [[Tworzenie gry komputerowej]]\n\
      | [[Renderowanie]]\n| [[Modelowanie (3D)|Modelowanie trójwymiarowe]]\n|}\n\n\
      ==== Interfejsy i interakcje człowiek-komputer ====\n{{Osobny artykuł|Interakcja\
      \ człowiek–komputer}}\nInterakcją człowiek–komputer nazywa się wzajemne [[oddziaływanie]]\
      \ między człowiekiem a komputerem zachodzące poprzez [[interfejs użytkownika]],\
      \ czyli część sprzętu i oprogramowania zajmującą się obsługą urządzeń wejścia-wyjścia\
      \ przeznaczonych dla interakcji z użytkownikiem. Istnieje wiele rodzajów interfejsów,\
      \ są to m.in. [[wiersz poleceń]], [[interfejs tekstowy]] czy [[Graficzny interfejs\
      \ użytkownika|interfejs graficzny]]. Obecnie prowadzone są intensywne badania\
      \ nad [[Rzeczywistość wirtualna|wirtualną rzeczywistością]], a także [[Interfejs\
      \ mózg–komputer|interfejsami mózg-komputer]].\n\n{| style=\"border:1px solid\
      \ #ccc; text-align:center; margin:auto;\" cellspacing=\"15\"\n|-\n| [[Plik:Linux\
      \ command-line. Bash. GNOME Terminal. screenshot.png|96px]]\n| [[Plik:Head-mounted\
      \ display and wired gloves, Ames Research Center.jpg|96px]]\n| [[Plik:Image-AR\
      \ TD0.jpg|96px]]\n| [[Plik:The.Matrix.glmatrix.2.png|96px]]\n| [[Plik:Reactable\
      \ Multitouch.jpg|96px]]\n|-\n| [[Wiersz poleceń]]\n| [[Rzeczywistość wirtualna]]\n\
      | [[Rzeczywistość rozszerzona]]\n| [[Interfejs mózg–komputer]]\n| [[User experience]]\n\
      |}\n\n==== Technologie webowe, mobilne i multimedia ====\nAplikacja internetowa\
      \ (ang. web application), zwana również aplikacją webową – program komputerowy,\
      \ który pracuje na serwerze i komunikuje się poprzez sieć komputerową z hostem\
      \ użytkownika komputera z wykorzystaniem przeglądarki internetowej użytkownika,\
      \ będącego w takim przypadku interaktywnym klientem aplikacji internetowej.\
      \ Od komputerów mobilnych (np. [[smartfon]]y, [[Tablet (komputer)|tablety]])\
      \ oczekuje się, że mogą być swobodnie transportowane podczas normalnego użytkowania,\
      \ oraz pozwalają na przesyłanie danych, głosu i wideo. System mobilny, także\
      \ [[przetwarzanie mobilne]] (ang. ''mobile computing'') obejmuje komunikację\
      \ mobilną oraz [[Urządzenie mobilne|sprzęt i oprogramowanie mobilne]]. Kwestie\
      \ komunikacyjne obejmują [[Sieć ad hoc|sieci ad hoc]], infrastrukturę sieci,\
      \ a także właściwości komunikacyjne, [[Protokół komunikacyjny|protokoły]], formaty\
      \ danych i konkretne technologie. Typowy sprzęt mobilny zawiera często różne\
      \ [[Czujnik|sensory]], np. [[Przyspieszeniomierz|akcelerometry]], które są w\
      \ stanie wykrywać i odbierać sygnały. Najważniejsze mobilne systemy operacyjne\
      \ to [[iOS]] oraz [[Android (system operacyjny)|Android Linux]], gdzie dominują\
      \ języki [[Java]] i [[Kotlin (język programowania)|Kotlin]]<ref>{{Cytuj |autor\
      \ = Łukasz Majchrzyk |tytuł = Najpopularniejsze języki programowania (styczeń\
      \ 2019 r.) |data = 2019-01-10 |data dostępu = 2020-04-16 |opublikowany = mobiRANK.pl\
      \ |url = https://mobirank.pl/2019/01/10/najpopularniejsze-jezyki-programowania-styczen-2019-r/}}</ref>.\n\
      \n=== Informatyka stosowana ===\n\n==== Informatyka w inżynierii kosmicznej\
      \ i satelitarnej, astronomii, nawigacji, geodezji i geografii ====\n\n* [[Geoinformatyka]]\
      \ – zajmuje się numerycznym przetwarzaniem i analizowaniem [[Informacja geograficzna|informacji\
      \ geograficznej]] ([[Geoinformacja|geoinformacji]]). Geoinformatyka jest opisywana\
      \ jako nauka i technika zajmująca się strukturą i charakterem [[Dane geograficzne|danych\
      \ geograficznych]], ich przechwytywaniem, klasyfikacją, przetwarzaniem i wizualizacją<ref>{{Cytuj\
      \ |autor = P.L.N. Raju |tytuł = Fundamentals of Geographic Information Systems}}</ref>.\
      \ Do zastosowań geoinformatyki zalicza się [[Kartografia|kartografię]], [[Geodezja|geodezję]],\
      \ [[Global Positioning System|GPS]], [[Fotogrametria|fotogrametrię]], [[Teledetekcja|teledetekcję]],\
      \ [[Analiza danych przestrzennych|analizę danych przestrzennych]], [[Mapowanie\
      \ normalnych|mapowanie]] i [[Nawigacja|nawigację]].\n* [[Astroinformatyka]]\
      \ – zastosowania informatyki w astronomii<ref>{{Cytuj pismo | nazwisko = Borne\
      \ | imię = Kirk D. | tytuł = Astroinformatics: data-oriented astronomy research\
      \ and education | czasopismo = Earth Science Informatics | wolumin = 3 | wydanie\
      \ = 1–2 | strony = 5–17 | data = 2010-05-12 | doi = 10.1007/s12145-010-0055-2\
      \ | język = en}}</ref>.\n\n==== Informatyka w biologii, chemii, medycynie i\
      \ kognitywistyce ====\n* [[Bioinformatyka]] (z niem''. Bioinformatik'') – interdyscyplinarna\
      \ dziedzina obejmujmująca rozwój metod obliczeniowych służących do badania struktury,\
      \ funkcji i ewolucji [[gen]]ów, [[genom]]ów i [[Białka|białek]]. Ponadto odpowiada\
      \ za rozwój metod wykorzystywanych do zarządzania i analizy informacji biologicznej\
      \ gromadzonej w toku badań genomicznych oraz badań prowadzonych z zastosowaniem\
      \ wysokoprzepustowych technik eksperymentalnych<ref>{{Cytuj |autor = prof. dr\
      \ hab. inż. Jacek Błażewicz |tytuł = Bioinformatyka i jej perspektywy |data\
      \ = 2011 |url = http://www2.cs.put.poznan.pl/wp-content/uploads/2011/11/wyklad_inauguracyjny_2011.pdf}}</ref>.\n\
      \n* [[Chemioinformatyka]] (z niem''. Chemoinformatik)'', także [[informatyka\
      \ chemiczna]] to nauka zajmująca się wykorzystaniem informatyki do rozwiązywania\
      \ różnorodnych problemów chemicznych jak np. teoria grafów chemicznych czy badania\
      \ przestrzeni chemicznej<ref>{{Cytuj |autor = Gasteiger J.(Editor), Engel T.(Editor)\
      \ |tytuł = Chemoinformatics: A Textbook |data = 2004 |isbn = 3-527-30681-1}}</ref><ref>{{Cytuj\
      \ |autor = A.R. Leach, V.J. Gillet |tytuł = An Introduction to Chemoinformatics\
      \ |data = |isbn = 1-4020-1347-7}}</ref>. Te techniki, nazywane często metodami\
      \ ''in silico'', wykorzystywane są do przeprowadzania obliczeń w blisko związanej\
      \ z nią chemii obliczeniowej oraz w chemii kwantowej i procesie projektowania\
      \ leków. Nauka ta znajduje zastosowanie w wielu gałęziach przemysłu chemicznego\
      \ do analizy i przetwarzania danych chemicznych.\n\n* [[Informatyka medyczna]]\
      \ – zajmuje się zbieraniem, przetwarzaniem, przechowywaniem, udostępnianiem\
      \ i przesyłaniem danych medycznych oraz metodami tworzenia urządzeń i systemów\
      \ informatycznych wykorzystywanych w [[Medycyna|medycynie]]. Informatyka medyczna\
      \ znajduje zastosowania między innymi w systemach wspomagania diagnostyki (np.\
      \ ''IBM Watson for Oncology'')<ref>{{Cytuj |tytuł = IBM Watson for Oncology\
      \ |data dostępu = 2020-04-18 |url = https://www.ibm.com/products/clinical-decision-support-oncology}}</ref>,\
      \ oprogramowaniu robotów medycznych, systemach rejestracji, przetwarzania i\
      \ analizy sygnałów i obrazów medycznych oraz systemach teleinformatycznych dla\
      \ telemedycyny<ref>{{Cytuj |tytuł = Informatyka medyczna to przyszłość – WSIiZ\
      \ wykształci potrzebnych specjalistów! |data dostępu = 2020-04-19 |opublikowany\
      \ = WSIiZ w Rzeszowie |url = https://wsiz.rzeszow.pl/aktualnosci/informatyka-medyczna-to-przyszlosc-wsiiz-wyksztalci-potrzebnych-specjalistow/}}</ref>.\n\
      * [[Neuroinformatyka]] (z niem. ''Neuroinformatik'') znajduje zastosowania w\
      \ [[Kognitywistyka|kognitywistyce]], przy badaniu przetwarzania informacji przez\
      \ systemy nerwowe w celu zastosowania ich w systemach technicznych, m.in. w\
      \ tworzeniu [[Symulacja komputerowa|modeli obliczeniowych]], narzędzi analitycznych\
      \ i baz danych do udostępniania, integracji i analizy danych eksperymentalnych\
      \ oraz rozwoju teorii na temat funkcji układu nerwowego. W kontekście INCF neuroinformatyka\
      \ odnosi się do informacji naukowych na temat podstawowych danych eksperymentalnych,\
      \ ontologii, metadanych, narzędzi analitycznych i modeli obliczeniowych układu\
      \ nerwowego. [[Informatyka kognitywna]] także odnosi się do zastosowań w kognitywistyce<ref>{{Cytuj\
      \ |autor = |tytuł = Wydawnictwo AGH – Podstawy informatyki kognitywnej |data\
      \ = |data dostępu = 2020-08-22 |opublikowany = www.wydawnictwoagh.pl |url =\
      \ https://www.wydawnictwoagh.pl/PODSTAWY-INFORMATYKI-KOGNITYWNEJ;s,karta,id,672}}</ref>.\
      \ Jednym z najbardziej znanych specjalistów kognitywstyki w Polsce jest [[Włodzisław\
      \ Duch]]. Kolejnym powiązanym obszarem jest [[informatyka afektywna]].\n\n{|\
      \ style=\"border:1px solid #ccc; text-align:center; margin:auto;\" cellspacing=\"\
      15\"\n|-\n| [[Plik:Genome viewer screenshot small.png|96px]]\n| [[Plik:Evolution\
      \ fate duplicate genes - vector.svg|96px]]\n| [[Plik:TE-Nervous system diagram.svg|96px]]\n\
      | [[Plik:The protein interaction network of Treponema pallidum.png|96px]]\n\
      | [[Plik:Svm separating hyperplanes.png|96px]]\n|-\n| [[Bioinformatyka]]\n|\
      \ {{link-interwiki|Genoinformatyka|Q=Q96379173}}\n| [[Neuroinformatyka]]\n|\
      \ [[Chemioinformatyka]]\n| [[Informatyka afektywna]]\n|}\n\n==== Informatyka\
      \ w przemyśle, mechanice i inżynierii materiałowej ====\n\n* [[Informatyka przemysłowa]]\
      \ – zastosowania informatyki w przemyśle.\n* [[Informatyka mechaniczna]], także\
      \ mechainformatyka (z niem. ''Maschinenbauinformatik'') – zastosowania informatyki\
      \ w mechanice. Zajmuje się m.in. informatycznymi aspektami druku 3D, programowania\
      \ CNC, mechaniki komputerowej, oraz oprogramowaniem do projektowania CAD.\n\
      * [[Informatyka materiałowa]] – zastosowania informatyki w materiałoznawstwie\
      \ i inżynierii materiałowej.\n\n==== Dalsze zastosowania ====\n* [[Informatyka\
      \ społeczna]] odnosi się do szeroko rozumianego związku pomiędzy [[Technika\
      \ informatyczna|technologiami informatycznymi]] i [[Społeczeństwo|światem społecznym]].\
      \ Obejmuje między innymi [[web mining]], [[reality mining]], [[Symulacja społeczeństw|symulacje\
      \ społeczeństw]] i [[Bot społeczny (program)|boty społeczne]]. Przedmiotem zainteresowania\
      \ badaczy jest także z jednej strony wpływ informatycznych technologii komunikacyjnych\
      \ na zmiany społeczne i psychologiczne wśród osób, które z nich korzystają.\
      \ Z drugiej strony badany jest wpływ zjawisk społecznych na [[System informatyczny|systemy\
      \ informatyczne]], między innymi [[Komunikator internetowy|komunikatory]], [[Serwis\
      \ społecznościowy|serwisy społecznościowe]].\n\n* [[Informatyka śledcza]] –\
      \ dostarcza cyfrowych środków dowodowych dotyczących przestępstw popełnionych\
      \ cyfrowo lub przy użyciu systemów teleinformatycznych. Jej zadaniami są: zbieranie,\
      \ [[Odzyskiwanie danych|odzyskiwanie]], analiza i prezentacja cyfrowych danych,\
      \ znajdujących się na różnego rodzaju nośnikach ([[Dysk twardy|dyski twarde]]\
      \ [[komputer]]ów, [[Dyskietka|dyskietki]], [[Płyta kompaktowa|płyty CD]], [[Pamięć\
      \ komputerowa|pamięci]] przenośne, [[serwer]]y, [[Telefon komórkowy|telefony\
      \ komórkowe]] itp.), oraz w coraz popularniejszych ostatnio systemach i serwisach\
      \ zdalnego gromadzenia, przechowywania i przetwarzania danych, takich jak [[Serwis\
      \ społecznościowy|serwisy społecznościowe]], [[Chmura obliczeniowa|przestrzeń\
      \ dyskowa w chmurze]] czy [[Wyszukiwarka internetowa|wyszukiwarki internetowe]].\n\
      \n*[[Informatyka ekonomiczna]] (czasem określana również jako informatyka gospodarcza\
      \ lub informatyka zarządcza) – jej przedmiotem zainteresowania są systemy informatyczne\
      \ w [[organizacja]]ch (szczególnie w [[Przedsiębiorstwo|przedsiębiorstwach]]).\n\
      \n== Edukacja ==\n=== Szkoła podstawowa, liceum i technikum ===\nW ramach I\
      \ etapu edukacji (klasy I-III) uczniowie mają zajęcia z ''edukacji informatycznej''\
      \ w ramach edukacji wczesnoszkolnej. Klasy IV-VIII (II etap edukacyjny) realizują\
      \ przedmiot ''informatyka''<ref>{{Cytuj |tytuł = Edukcja informatyki w szkole\
      \ podstawowej – Portal Oświatowy |data dostępu = 2020-04-03 |opublikowany =\
      \ www.portaloswiatowy.pl |url = https://www.portaloswiatowy.pl/organizacja-zajec-szkolnych/nazewnictwo-zajec-informatycznych-w-poszczegolnych-klasach-szkoly-podstawowej-15887.html}}</ref>.\
      \ Najważniejszym celem kształcenia informatycznego uczniów jest rozwój umiejętności\
      \ myślenia obliczeniowego (z ang. ''computational thinking''), skupionego na\
      \ kreatywnym rozwiązywaniu problemów z różnych dziedzin ze świadomym i bezpiecznym\
      \ wykorzystaniem przy tym metod i narzędzi wywodzących się z informatyki<ref\
      \ name=\":1\">{{Cytuj |tytuł = Podstawa programowa – Informatyka – Liceum/technikum\
      \ |data dostępu = 2020-04-19 |opublikowany = podstawaprogramowa.pl |url = https://podstawaprogramowa.pl/Liceum-technikum/Informatyka}}</ref>.\
      \ Takie podejście, rozpoczęte w szkole podstawowej, jest kontynuowane w liceum\
      \ ogólnokształcącym i technikum zarówno w zakresie podstawowym, jak i rozszerzonym.\
      \ Przedmiot informatyka jest realizowany przez wszystkich uczniów w każdej klasie,\
      \ począwszy od klasy I szkoły podstawowej i jest kontynuowany w liceum ogólnokształcącym\
      \ i technikum<ref name=\":1\" />.\n\n=== Studia wyższe ===\nInformatyka jest\
      \ wykładana na [[uniwersytet]]ach oraz na [[politechnika]]ch. Na politechnikach\
      \ programy studiów są nastawione na zagadnienia inżynierskie, a na uniwersytetach\
      \ na zagadnienia naukowe. Istnieją także programy studiów nastawione na praktyczne\
      \ zastosowania. Z uwagi na ograniczoną liczbę miejsc oraz fakt że informatyka\
      \ jest chętnie wybieranym kierunkiem studiów, obowiązują na nią stosunkowo wysokie\
      \ progi punktowe. W roku akademickim 2018/2019 zgłosiło się 42759 chętnych<ref>{{Cytuj\
      \ |autor = Wojciech Martyński |tytuł = Kierunki studiów 2020 (Najlepsze i najbardziej\
      \ przyszłościowe) |data = 2015-08-11 |data dostępu = 2020-04-03 |opublikowany\
      \ = InterviewMe |url = https://interviewme.pl/blog/kierunki-studiow}}</ref>.\
      \ W najlepszych uczelniach w kraju w pierwszej kolejności są przyjmowani finaliści\
      \ [[Olimpiada informatyczna|Olimpiady Informatycznej]]. Spośród najlepszych\
      \ jest wyłaniana reprezentacja Polski na różne międzynarodowe konkursy informatyczne\
      \ np. [[Akademickie mistrzostwa świata w programowaniu zespołowym]]<ref>{{Cytuj\
      \ |autor = Stefan Jackowski |tytuł = Jak zmieniał się Wydział Matematyki, Informatyki\
      \ i Mechaniki Uniwersytetu Warszawskiego w latach 1991–2016}}</ref>.\n\n== Zobacz\
      \ też ==\n* [[informatyk]]\n* [[informatyka stosowana]]\n\n{{Siostrzane projekty\n\
      \ |commons = Category:Computing\n |słownik = informatyka\n |źródła = Kategoria:Informatyka\n\
      \ |cytaty = Informatyka\n |news = Portal:Informatyka\n |books = Kategoria:Informatyka\n\
      \ |species =\n}}\n\n== Przypisy ==\n{{Przypisy}}\n\n== Linki zewnętrzne ==\n\
      * {{paywall}} ''[https://www.rep.routledge.com/articles/thematic/computer-science/v-1\
      \ Computer science]'' {{lang|en}}, [[Routledge Encyclopedia of Philosophy]],\
      \ rep.routledge.com [dostęp 2023-05-10].\n\n{{Nauki przyrodnicze i ścisłe}}\n\
      {{Nauki inżynieryjne i techniczne}}\n{{Klasyfikacja dziedzin i dyscyplin naukowych\
      \ w Polsce}}\n\n{{Kontrola autorytatywna}}\n\n[[Kategoria:Informatyka| ]]"
