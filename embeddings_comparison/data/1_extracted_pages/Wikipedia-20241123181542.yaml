- sections:
  - content: '''''''Rozszerzenie znaku'''''' – w arytmetyce komputerowej operacja
      zwiększenia liczby [[Bit|bitów]] liczby [[Dwójkowy system liczbowy|binarnej]]
      przy jednoczesnym zachowaniu znaku tej liczby i jej wartości. Odbywa się to
      poprzez dołączanie cyfr binarnych na lewo od [[Najbardziej znaczący bit|najbardziej
      znaczącego bitu]].


      Na przykład, jeśli sześć bitów jest używanych do przedstawienia liczby „<code>00
      1010</code>” (w [[Dziesiętny system liczbowy|systemie dziesiętnym]] dodatnia
      liczba 10), a operacja przedłużenia znaku zwiększa [[Słowo maszynowe|długość
      słowa]] do 16 bitów, wówczas nowa reprezentacja tej liczby w słowie 16-bitowym
      to „<code>0000 0000 0000 1010</code>”. Wyraźnie widać, że zarówno wartość, jak
      i [[znak liczby]] są takie same jak przed operacją.


      Jeśli dziesięć bitów jest używanych do przedstawienia wartości „<code>11 1111
      0001</code>” (−15 w systemie dziesiętnym) przy użyciu [[Kod uzupełnień do dwóch|kodu
      uzupełnień do dwóch]], a znak jest rozszerzany tak, aby słowo miało długość
      16 bitów. Nowa reprezentacja tej liczby to „<code>1111 1111 1111 0001</code>”.
      W ten sposób, wypełniając lewą stronę cyfrą „1”, zarówno znak ujemny, jak i
      wartość oryginalnej liczby są zachowywane.


