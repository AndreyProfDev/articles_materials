- sections:
  - content: "'''Informatyka afektywna''' – dział [[informatyka|informatyki]], zajmuje\
      \ się metodami i narzędziami rozpoznawania, analizy, interpretacji i symulacji\
      \ stanów emocjonalnych użytkowników komputerów<ref  name=\"Landowska2013\">Landowska\
      \ A.: Przetwarzanie emocjonalne i scenariusze jego zastosowania w edukacji i\
      \ e-edukacji, w: Postępy e-edukacji, red. Lech Banachowski, Wydawnictwo PJWSTK,\
      \ 2013, pp. 25-38</ref>. \n\nDziedzina ta została wyodrębniona w 1995 roku przez\
      \ [[Rosalind Picard]] i nazwana ''affective computing''<ref>Picard R.; „Affective\
      \ computing”, http://affect.media.mit.edu/, 1995, accessed: 29.04.2013</ref>.\
      \ Ponieważ istnieje bogata literatura w języku angielskim i raczej znikoma w\
      \ języku polskim, brak jest odpowiedników pojęć używanych w tej dyscyplinie\
      \ leżącej na styku informatyki i psychologii. Zgodnie ze słownikiem angielskie\
      \ słowo ''affective'' można przetłumaczyć jako ''afektywny'' lub ''emocjonalny'',\
      \ natomiast ''computing'' tłumaczy się jako ''przetwarzanie'', ''komputyka''\
      \ lub ''informatyka''. W związku z wątpliwościami dotyczącymi prawidłowości\
      \ tłumaczenia nazwy dziedziny zasięgnięto opinii Rady Języka Polskiego. W dniu\
      \ 5 września 2013 roku [[Zespół Terminologii Informatycznej Rady Języka Polskiego]]\
      \ wydał opinię, zgodnie z którą polskim odpowiednikiem nazwy dziedziny ''affective\
      \ computing'' jest określenie ''przetwarzanie emocjonalne''<ref name=\"Landowska2013\"\
      />.  Zaproponowana nazwa budzi jednak wiele wątpliwości, ponieważ kojarzy się\
      \ raczej z działem psychologii niż informatyki.\n\nInformatyka afektywna obejmuje:\n\
      * metody rozpoznawania stanów emocjonalnych użytkowników komputerów i [[Urządzenie\
      \ mobilne|urządzeń mobilnych]] na podstawie różnorodnych charakterystyk (mimika\
      \ twarzy, postawa ciała, parametry fizjologiczne, głos, tekst, wzorce behawioralne);\n\
      * metody reprezentacji stanów emocjonalnych na potrzeby przetwarzania komputerowego;\n\
      * tworzenie [[Aplikacje afektywne|aplikacji afektywnych]] (ang. affective) i\
      \ [[Aplikacje postrzegające emocje|postrzegających emocje]] (ang. affect-aware);\n\
      * modele [[Interwencja afektywna|interwencji afektywnych]];\n* analizę ładunku\
      \ emocjonalnego tekstu (ang. sentiment analysis);\n* symulacje stanów emocjonalnych\
      \ na potrzeby wirtualnych postaci.\n\n== Przypisy ==\n{{Przypisy}}\n\n[[Kategoria:Informatyka]]"
