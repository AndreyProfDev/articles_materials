- sections:
  - content: '''''''Wymagania systemowe'''''' ({{ang.|system requirements}}, także
      ''''''wymagania sprzętowe'''''') – minimalne możliwe właściwości [[system komputerowy|systemu
      komputerowego]] lub [[Sprzęt komputerowy|sprzętu]] niezbędne do uruchomienia
      danego [[program komputerowy|programu]]. Najczęściej dotyczą minimalnej prędkości
      [[procesor]]a, minimalnej wielkości pamięci [[RAM]], pojemności [[Dysk twardy|dysku
      twardego]] oraz wersji [[system operacyjny|systemu operacyjnego]]. Często dotyczą
      także parametrów [[karta graficzna|karty graficznej]].


      Informacje o wymaganiach systemowych danego programu najczęściej znajdują się
      w [[Instrukcja obsługi|instrukcji obsługi]], na [[strona internetowa|stronie
      internetowej]] producenta lub w karcie informacyjnej, często także na pudełku
      od programu (jeżeli został on zakupiony w wydaniu pudełkowym).


