- sections:
  - content: "{{Inne znaczenia|2=czasopismo [[Informatyka (czasopismo)|„Informatyka”]]}}\n\
      <div class=\"thumb tright\">\n<div class=\"thumbinner\" style=\"width:300px;\"\
      >\n{| style=\"border:1px solid #ccc;\"\n|-\n| [[Plik:Lambda calculus-Church\
      \ numerals.png|144px|alt=Expression for Church numerals in lambda calculus|Programowanie\
      \ komputerów|link=Programowanie komputerów]]\n| [[Plik:Sorting quicksort anim.gif|144px|alt=Plot\
      \ of a quicksort algorithm|Algorytmika|link=Algorytmika]]\n|-\n| [[Plik:Activemarker2.PNG|144px|alt=Example\
      \ of Computer animation produced using Motion capture|Sztuczna inteligencja|link=Sztuczna\
      \ inteligencja]]\n| [[Plik:Half Adder.svg|144px|alt=Half-adder circuit|Architektura\
      \ komputera|link=Architektura komputera]]\n|}\n<div class=\"thumbcaption\">Informatyka\
      \ zajmuje się teoretycznymi podstawami informacji, algorytmami i architekturami\
      \ układów ją przetwarzających oraz praktycznymi technikami ich stosowania.</div>\n\
      </div>\n</div>\n'''Informatyka''' ({{Niem.|Informatik}}, {{Ang.|computer science,\
      \ computing, computer engineering, IT, ICT}})<ref>{{Cytuj |autor = |tytuł =\
      \ Informatics Europe – Informatics Job Platform |data = |opublikowany = www.informatics-europe.org\
      \ |url = https://www.informatics-europe.org/services/informatics-job-platform.html}}</ref>\
      \ – [[Nauki ścisłe|nauka ścisła]] oraz [[Technika|techniczna]] zajmująca się\
      \ przetwarzaniem informacji, w tym również [[technologia]]mi przetwarzania informacji\
      \ oraz technologiami wytwarzania [[system]]ów przetwarzających informacje<ref\
      \ name=\":2\">{{Cytuj |tytuł = What is informatics? |url = https://www.ed.ac.uk/files/atoms/files/what20is20informatics.pdf}}</ref>.\
      \ Zajmuje się rozwiązywaniem problemów obliczeniowych, opisem procesów [[algorytm]]icznych\
      \ oraz tworzeniem [[Program komputerowy|programów]] komputerowych i częściowo\
      \ sprzętu komputerowego (z wyłączeniem zagadnień materialnych i energetycznych)<ref\
      \ name=\":4\" /><ref name=\":5\" /><ref name=\":6\">{{Cytuj |autor = |tytuł\
      \ = Computer Science or Informatics? Wstęp do informatyki |data = |url = https://fulmanski.pl/zajecia/ics/pres_en_history.pdf}}</ref>.\
      \ Informatyka początkowo stanowiła część [[matematyka|matematyki]], z czasem\
      \ wyodrębniła się do oddzielnej dyscypliny. W języku polskim termin „informatyka”\
      \ zaproponował w październiku 1968 r. [[Romuald Marczyński]] (w Zakopanem, na\
      \ ogólnopolskiej konferencji podczas wykładu zatytułowanego ''„Informatyka,\
      \ czyli maszyny matematyczne i przetwarzanie informacji”'')<ref>{{Cytuj książkę\
      \ |nazwisko = Wasielewska |imię = Karolina |tytuł = Cyfrodziewczyny |rok = 2020\
      \ |wydawca = Wydawnictwo Krytyki Politycznej |isbn = 9788366232877}}</ref>,\
      \ na wzór francuskiego ''informatique'' i niemieckiego ''Informatik''.\n{{Spis\
      \ treści}}\n\n== Etymologia ==\nTermin ''informatics'' nie mógł zostać wprowadzony\
      \ do słownictwa amerykańskiego z uwagi na problemy prawne – istniało tam przedsiębiorstwo\
      \ o nazwie {{link-interwiki|Informatics General|tekst=Informatics Inc|Q=Q30642918}},\
      \ co zablokowało chęć zmiany nazwy [[Association for Computing Machinery|ACM]]\
      \ na ''Society for Informatics''. Wówczas popularny był już tam termin ''computer\
      \ science'' – dosłownie: „nauka o komputerze” – co może być mylące, stąd spotykał\
      \ się często z krytyką środowisk akademickich<ref>{{cytuj stronę |url = http://miesiecznik.uz.zgora.pl/wydawnictwo/miesiecznik11-2002/17.pdf\
      \ |tytuł = Informatyka – nauka, sztuka, czy rzemiosło? |autor = Marian Adamski\
      \ |data = 2002-09-30 |opublikowany = „Uniwersytet Zielonogórski” – Miesięcznik\
      \ Społeczności Akademickiej | język = |data dostępu = 2017-07-15}}</ref>. Proponowano\
      \ wiele alternatywnych nazw, m.in. ''Computer Studies, Computics, Computing\
      \ Science, Computation Science, Information engineering, Information Technology''.\
      \ Association for Computing Machinery będące najważniejszą organizacją branżową\
      \ przyjął termin ''computing'' na nazwę ogólnej dyscypliny. Częściowo powrócono\
      \ jednak później do ''computer science'' ze względu na to, że termin ten się\
      \ silnie zakorzenił. Współcześnie określenie ''computing'' odnosi się do całej\
      \ dyscypliny, a ''computer science'' to jej część w której obowiązuje rygor\
      \ naukowy, podczas gdy [[informatyka techniczna]] skupia się na aspektach praktycznych\
      \ i traktowana jest jako nauka inżynierska. W informatyce technicznej można\
      \ wyróżnić szereg specjalności, takich jak [[inżynieria komputerowa]] (''computer\
      \ engineering, technische Informatik<ref>{{Cytuj |tytuł = Technische Informatik\
      \ Studium |data dostępu = 2020-03-31 |opublikowany = www.ingenieurwesen-studieren.de\
      \ |url = https://www.ingenieurwesen-studieren.de/studiengaenge/technische-informatik/}}</ref>'')\
      \ związana z tworzeniem sprzętu komputerowego i oprogramowania wbudowanego,\
      \ [[Technika informatyczna|technologia informacyjna]] (''information technology''),\
      \ współcześnie najczęściej spotykana w tworzeniu oprogramowania dla zastosowań\
      \ biznesowych, [[inżynieria oprogramowania]] (''software engineering''), odnosząca\
      \ się ogólnie do programowania, lecz ściśle związana z zarządzaniem procesem\
      \ wytwarzania oprogramowania. SE i IT są czasem na wzór niemiecki zbiorczo nazywane\
      \ informatyką praktyczną (niem. ''praktische Informatik'')<ref>{{Cytuj |tytuł\
      \ = Informatyka o profilu praktycznym {{!}} Uniwersytet Gdański – University\
      \ of Gdańsk |data dostępu = 2020-03-31 |opublikowany = ug.edu.pl |url = https://ug.edu.pl/86372/informatyka_o_profilu_praktycznym,%20/86372/informatyka_o_profilu_praktycznym}}</ref><ref>{{Cytuj\
      \ |tytuł = Praktische Informatik Master of Science (M.Sc.) – FernUniversität\
      \ in Hagen |data dostępu = 2020-03-31 |opublikowany = www.fernuni-hagen.de |url\
      \ = https://www.fernuni-hagen.de/mi/studium/msc_prinformatik/}}</ref>.\n\nPrzetwarzanie\
      \ informacji jest różnie interpretowane, przez co istnieją różne definicje informatyki.\
      \ [[Uniwersytet Edynburski]] definiuje ją jako naukę o systemach obliczeniowych,\
      \ w której centralną notacją jest transformacja informacji<ref name=\":2\" />.\
      \ Według [[Peter J. Denning|Petera J. Denninga]] podstawowym pytaniem leżącym\
      \ u podstaw informatyki jest: ''„Co można zautomatyzować?”''<ref>{{Cytuj |tytuł\
      \ = Wayback Machine |data = 2006-05-25 |data dostępu = 2020-01-15 |opublikowany\
      \ = web.archive.org |url = https://web.archive.org/web/20060525195404/http://www.idi.ntnu.no/emner/dif8916/denning.pdf}}</ref>.\
      \ Według teorii Stuarta C. Shapiro, informatyka jest nauką przyrodniczą, która\
      \ bada procedury. Adam Olszewski wyróżnił pięć rodzajów obiektów, które są przedmiotem\
      \ zainteresowania informatyki: funkcje efektywnie obliczalne, [[algorytm]]y,\
      \ [[Program komputerowy|programy komputerowe]], realizacje i maszyny<ref>{{Cytuj\
      \ |tytuł = 46. spotkanie – Granice informatyki |data = 2017-11-22 |data dostępu\
      \ = 2020-04-19 |opublikowany = Filozofia w informatyce |url = https://filozofiainformatyki.wordpress.com/2017/11/22/46-spotkanie-granice-informatyki/}}</ref>.\
      \ W roku 2005, w [[Association for Computing Machinery|ACM]] ''Computing Curricula''<ref>{{Cytuj\
      \ |autor = The Joint Task Force for Computing Curricula 2005 |tytuł = Computing\
      \ Curricula 2005 |url = https://web.archive.org/web/20141021153204/http://www.acm.org/education/curric_vols/CC2005-March06Final.pdf}}</ref>\
      \ przedstawiono następujący opis:\n{{Cytat\n |treść = Ogólnie rzecz biorąc,\
      \ możemy zdefiniować informatykę (computing) jako jakąkolwiek zorientowaną na\
      \ cel działalność wymagającą, korzystającą z lub tworzącą maszyny obliczeniowe.\
      \ W związku z tym informatyka obejmuje projektowanie i budowanie systemów sprzętu\
      \ i oprogramowania do szerokiego zakresu celów; przetwarzanie, strukturyzację\
      \ i zarządzanie różnymi rodzajami informacji; obliczeniowe badania naukowe;\
      \ sprawianie, by systemy komputerowe zachowywały się inteligentnie; (...) Lista\
      \ jest praktycznie nieskończona, a możliwości są ogromne.\n |styl = środek\n\
      }}\n\n== Przegląd dyscyplin informatycznych ==\n{{Cytat\n |treść = Informatyka\
      \ jest tylko o komputerach, tak jak astronomia tylko o teleskopach.\n |autor\
      \ = [[Edsger Dijkstra]]\n |źródło =\n |styl = środek\n}}\nJako dyscyplina informatyka\
      \ obejmuje szereg tematów, od teoretycznych badań nad [[algorytm]]ami i [[Teoria\
      \ obliczalności|teorią obliczalności]] po praktyczne zagadnienia związane z\
      \ implementowaniem systemów obliczeniowych zarówno w [[Sprzęt komputerowy|warstwie\
      \ sprzętowej]], jak i [[Oprogramowanie|oprogramowaniu]]<ref name=\":4\">{{Cytuj\
      \ |tytuł = Computer Science as a Profession |data = 2008-06-17 |data dostępu\
      \ = 2020-01-14 |opublikowany = web.archive.org |url = https://web.archive.org/web/20080617030847/http://www.csab.org/comp_sci_profession.html}}</ref><ref\
      \ name=\":5\">{{Cytuj |autor = National Research Council |tytuł = Computer Science:\
      \ Reflections on the Field, Reflections from the Field |data = 2004-10-04 |data\
      \ dostępu = 2020-01-14 |isbn = 978-0-309-09301-9 |url = https://www.nap.edu/catalog/11106/computer-science-reflections-on-the-field-reflections-from-the-field\
      \ | język = en}}</ref>. CSAB, dawniej zwana ''Computing Sciences Accreditation\
      \ Board'' – w skład której wchodzą przedstawiciele ''[[Association for Computing\
      \ Machinery]]'' (ACM) oraz ''IEEE Computer Society'' (IEEE CS)<ref>{{Cytuj |tytuł\
      \ = CSAB, Inc. |data dostępu = 2020-01-14 |opublikowany = www.csab.org |url\
      \ = http://www.csab.org/}}</ref> – identyfikuje cztery obszary, które uważa\
      \ za kluczowe dla informatyki: [[teoria obliczeń]], [[Algorytmika|algorytmy]]\
      \ i [[Struktura danych|struktury danych]], [[Język programowania|języki]] i\
      \ metodologia [[Programowanie komputerów|programowania]] oraz [[Inżynieria komputerowa|budowa]]\
      \ i [[Architektura komputera|architektura komputerów]]. Oprócz tych czterech\
      \ podstawowych obszarów, CSAB identyfikuje również takie dziedziny, jak [[inżynieria\
      \ oprogramowania]], [[sztuczna inteligencja]], [[Sieć komputerowa|sieci komputerowe]]\
      \ i komunikacja, [[Baza danych|systemy baz danych]], [[obliczenia równoległe]],\
      \ [[obliczenia rozproszone]], [[interakcja człowiek–komputer]], [[grafika komputerowa]],\
      \ [[System operacyjny|systemy operacyjne]] oraz [[Metoda numeryczna|metody numeryczne]]\
      \ i [[Obliczenia symboliczne|symboliczne]] jako będące ważnymi dziedzinami informatyki<ref\
      \ name=\":4\" />.\n\nPoczątkowo towarzystwa ACM i IEEE CS publikowały własne\
      \ oddzielne zalecenia dotyczące programów studiów. Z czasem postanowiono utworzyć\
      \ wspólną dyscyplinę oraz wspólne zalecenia dotyczące programów kształcenia.\
      \ W pracach nad ujednoliceniem programów studiów uczestniczyły organizacje:\
      \ ACM, IEEE Computer Society, Association for Information Systems, ACM SIG Information\
      \ Technology Education, British Computer Society, International Federation for\
      \ Information Processing, ABET and CSAB. Wyróżniono 5 głównych specjalizacji<ref>{{Cytuj\
      \ |autor = The Joint Task Force for Computing Curricula |tytuł = A volume of\
      \ the Computing Curricula Series |data = 2015 |data dostępu = 2020-04-17 |opublikowany\
      \ = web.archive.org |url = https://web.archive.org/web/20141021153204/http://www.acm.org/education/curric_vols/CC2005-March06Final.pdf}}</ref>:\
      \ [[inżynieria komputerowa]] (ang. ''computer engineering'', CE), informatyka\
      \ naukowa (ang. ''computer science'', CS), [[System informacyjny|systemy informacyjne]]\
      \ (ang. ''information systems'', IS), [[Technika informatyczna|technologia informacji]]\
      \ (ang. ''information technology'', IT), [[inżynieria oprogramowania]] (ang.\
      \ ''software engineering'', SE). W 2020 podobna grupa organizacji przygotowała\
      \ programy studiów dla kolejnych 2 specjalizacji: [[cyberbezpieczeństwo]] (ang.\
      \ ''cybersecurity)'' oraz [[Danologia|danologię]] (ang. ''data Science)''. W\
      \ Niemczech zwyczajowo dzieli się natomiast na informatykę teoretyczną, techniczną,\
      \ praktyczną oraz realizacje i stosowaną.\n[[Plik:Architektur-der-informatik.png|center|Architektur\
      \ der Informatik]]\nPeter J. Denning z kolei w swoim artykule o informatyce<ref\
      \ name=\":3\">{{Cytuj |autor = Peter J. Denning |tytuł = Computer Science: The\
      \ Discipline |url = http://denninginstitute.com/pjd/PUBS/ENC/cs99.pdf}}</ref>\
      \ pogrupował treści w następujące działy: [[algorytm]]y i [[Struktura danych|struktury\
      \ danych]], [[Język programowania|języki oprogramowania]], architektura [[Architektura\
      \ komputera|komputerów]] i [[Architektura oprogramowania|oprogramowania]], [[System\
      \ operacyjny|systemy operacyjne]] i [[Sieć komputerowa|sieci]], [[inżynieria\
      \ oprogramowania]], [[Baza danych|bazy danych]] i [[wyszukiwanie informacji]],\
      \ [[sztuczna inteligencja]] i [[robotyka]], [[grafika komputerowa]], [[interakcja\
      \ człowiek–komputer]], [[symulacja komputerowa|symulacje komputerowe]] i [[metoda\
      \ numeryczna|obliczenia numeryczne]], [[informatyka ekonomiczna]], [[bioinformatyka]].\n\
      Jednocześnie dla każdego z tych obszarów zaproponował podział na trzy podejścia\
      \ dotyczące strony teoretycznej, abstrakcyjnej oraz twórczej.\n\n=== Informatyka\
      \ teoretyczna ===\nTeoretyczna informatyka (ang. theoretical computer science)\
      \ ma ducha matematycznego i abstrakcyjnego, ale motywację czerpie z praktycznych\
      \ i codziennych obliczeń. Jej celem jest zrozumienie natury obliczeń, w konsekwencji\
      \ czego wprowadza ich coraz bardziej efektywne metody. Jest ona częścią [[matematyka|matematyki]]\
      \ i informatyki, która grupuje matematyczne podstawy informatyki. Jej najważniejsze\
      \ obszary to teoria obliczeń, teoria informacji oraz algorytmika. Informatyka\
      \ teoretyczna stara się odpowiedzieć na fundamentalne pytania w informatyce\
      \ np. [[P versus NP problem]] i stanowi trzon dla bardziej praktycznych dziedzin.\n\
      {{Cytat\n |treść = Algorytmika to więcej niż dział informatyki. Tkwi ona w centrum\
      \ wszystkich działów informatyki.\n |autor =\n |źródło = [[David Harel]], Algorithmics.\
      \ The Spirit of Computing<ref>{{Cytuj |tytuł = prof.Krzysztof Diks, slajd z\
      \ wykładu, moment 12:28 |url = https://www.youtube.com/watch?v=Xmudle0HjWk?t=748}}</ref>\n\
      \ |styl = środek\n}}\n\n==== Algorytmika. Algorytmy i struktury danych ====\n\
      {{Osobny artykuł|Algorytmika|Algorytm|Struktura danych}}\nAlgorytmika zajmuje\
      \ się projektowaniem i analizą [[algorytm]]ów i [[Struktura danych|struktur\
      \ danych]]. Jest najstarszą i jedną z najważniejszych dziedzin informatyki.\
      \ Wśród jej podstawowych obszarów można wymienić projektowanie i [[Analiza algorytmów|analizę\
      \ algorytmów]], [[Geometria obliczeniowa|geometrię obliczeniową]], optymalizację\
      \ kombinatoryczną oraz [[Logika algorytmiczna|logikę algorytmiczną]]. Historycznie\
      \ podstawowymi zagadnieniami są algorytmy [[Sortowanie|sortowania]], [[Kompresja\
      \ (informatyka)|kompresji]], [[Przechodzenie drzewa|przeszukiwania]] czy [[Kryptologia|szyfrowania]]\
      \ oraz [[Metoda numeryczna|metody numeryczne]]. Algorytmy podlegają klasyfikacji,\
      \ wyróżniając np. [[Algorytm zachłanny|algorytmy zachłanne]] jak [[algorytm\
      \ Dijkstry]] czy [[algorytm Kruskala]], metody generowania liczb losowych, metody\
      \ optymalizacji itd. Do podstawowych struktur danych należą [[Struktura (programowanie)|rekord]],\
      \ [[Tablica (informatyka)|tablica]], [[Stos (informatyka)|stos]], [[lista]],\
      \ [[Kolejka (informatyka)|kolejka]], [[Drzewo (informatyka)|drzewa]] czy [[Teoria\
      \ grafów|grafy]]. Próbą połączenia idei struktur danych i algorytmów jest paradygmat\
      \ [[Programowanie obiektowe|programowania obiektowego]].\n{| style=\"border:1px\
      \ solid #ccc; text-align:center; margin:auto;\" cellspacing=\"15\"\n|-\n| [[Plik:Comparison\
      \ computational complexity.svg|96px]]\n| [[Plik:Sorting quicksort anim.gif|96px]]\n\
      | [[Plik:Tree (computer science).svg|96px]]\n| [[Plik:TSP Deutschland 3.png|96px]]\n\
      | [[Plik:SimplexRangeSearching.svg|96px]]\n| [[Plik:Contraction vertices.jpg|96px]]\n\
      |-\n| [[Analiza algorytmów]]\n| [[Algorytmika|Projektowanie algorytmów]]\n|\
      \ [[Struktury danych]]\n| [[Algorytm zachłanny|Algorytmy zachłanne]]\n| [[Geometria\
      \ obliczeniowa]]\n| [[Algorytm probabilistyczny|Algorytmy probabilistyczne]]\n\
      |}\n\n==== Teoria obliczeń. Języki, automaty, złożoność ====\n{{Osobny artykuł|Teoria\
      \ obliczeń|Teoria automatów}}\nTeoria obliczeń dzieli się na trzy główne części:\
      \ [[Teoria automatów|teorię automatów]], [[teoria obliczalności|teorię obliczalności]]\
      \ oraz [[złożoność obliczeniowa|teorię złożoności]]. Teoria automatów zajmuje\
      \ się definicjami i własnościami [[Model obliczeń|modeli obliczeń]], matematycznymi\
      \ modelami maszyn liczących. W uproszczeniu zajmuje się ona odpowiedzią na pytanie\
      \ czym jest komputer, teoria obliczalności zajmuje się odpowiedzią na pytanie,\
      \ które problemy dają się rozwiązać przy pomocy [[komputer]]a, a teoria złożoności\
      \ – odpowiedzią na pytanie jak szybko da się to zrobić<ref>{{Cytuj |autor =\
      \ Michael Sipser |tytuł = Wprowadzenie do teorii obliczeń}}</ref><ref>{{Cytuj\
      \ |tytuł = Computational Complexity: A Modern Approach / Sanjeev Arora and Boaz\
      \ Barak |data dostępu = 2020-03-27 |opublikowany = theory.cs.princeton.edu |url\
      \ = http://theory.cs.princeton.edu/complexity/}}</ref>. Przykładowymi zagadnieniami\
      \ są [[Maszyna Turinga]] czy [[Hipoteza Churcha-Turinga]]. [[Język formalny|Języki\
      \ formalne]] stanowią podstawę badań nad językami komputerowymi, jak i naturalnymi\
      \ w [[lingwistyka|lingwistyce]]. [[System formalny|Systemy formalne]] są tworzone\
      \ i badane zarówno jako samodzielne abstrakcyjne twory, jak i systemy opisu\
      \ rzeczywistości.\n{| style=\"border:1px solid #ccc; text-align:center; margin:auto;\"\
      \ cellspacing=\"15\"\n|-\n| [[Plik:DFAexample.svg|130px]]\n| [[Plik:Syntax tree.svg|96px]]\n\
      | <math>M= \\{ X : X \\notin X \\}</math>\n| [[Plik:Complexity classes.svg|120px]]\n\
      | [[Plik:Kellerautomat.svg|96px]]\n|-\n| [[Teoria automatów]]\n| [[Język formalny]]\n\
      | [[Teoria obliczalności]]\n| [[Teoria złożoności obliczeniowej]]\n| [[Automat\
      \ komórkowy]]\n|}\n\n==== Teoria informacji i kodowania ====\n{{Osobny artykuł|Teoria\
      \ informacji}}\nMatematyczna teoria informacji zajmuje się problematyką informacji,\
      \ w tym podstawami teoretycznymi dla przetwarzania i przesyłania informacji,\
      \ np. w celu ich [[Transmisja|transmisji]] lub [[Kompresja (informatyka)|kompresji]].\
      \ Przykładowo wprowadza takie pojęcia jak [[komunikat]], [[Entropia (teoria\
      \ informacji)|entropia]], [[ciało skończone]] czy [[bit]] będący podstawową\
      \ jednostką w informatyce. [[Teoria kodowania]] zajmuje się tworzeniem i analizą\
      \ reprezentacji danych w komputerze. Wyróżnia się m.in. [[Zestaw znaków|kodowanie\
      \ znaków]] czy [[kodowanie transportowe]], do których należą np. [[kod stałopozycyjny]].\n\
      \n==== Informatyka kwantowa ====\n{{Osobny artykuł|Informatyka kwantowa}}\n\
      Informatyka kwantowa to gałąź informatyki łącząca ją z [[Mechanika kwantowa|mechaniką\
      \ kwantową]], w której do przetwarzania informacji wykorzystywane są własności\
      \ [[Układ kwantowy|układów kwantowych]]<ref>{{Cytuj |autor = Nielsen, Michael\
      \ A.; Chuang, Isaac L. |tytuł = Quantum Computation and Quantum Information\
      \ (10th anniversary ed.) |data = June 2012 |isbn = 9780511992773}}</ref>. Elementarnym\
      \ nośnikiem [[Informacja kwantowa|informacji kwantowej]] jest [[kubit]], kwantowy\
      \ odpowiednik bitu. Stan kubitu opisany jest przez dowolną [[Kombinacja liniowa|kombinację\
      \ liniową]] stanów bazowych. W najbardziej popularnym modelu kwantowego przetwarzania\
      \ informacji, operacje na kubitach są reprezentowane za pomocą [[Bramka kwantowa|bramek\
      \ kwantowych]]. Najbardziej spektakularny sukces informatyki kwantowej to [[Kryptologia\
      \ kwantowa|kwantowa kryptografia]]. Natomiast najbardziej obiecującym kierunkiem\
      \ badań są prace dotyczące idei [[Komputer kwantowy|kwantowego komputera]].\
      \ Dynamiczny rozwój technologii w ostatnich latach spowodował, że gałąź ta wyłamuje\
      \ się poza czysto-teoryczne rozważania. Stworzono pewne realizacje bramek kwantowych,\
      \ a na targach CES w 2018 roku amerykańskie przedsiębiorstwo informatyczne [[IBM]]\
      \ zaprezentowała swój działający, 50-kubitowy komputer kwantowy<ref>{{Cytuj\
      \ |tytuł = IBM zaprezentuje najpotężniejszy na świecie 53-kubitowy komputer\
      \ kwantowy – NeeWS – GeekWeek.pl |data dostępu = 2020-03-27 |opublikowany =\
      \ www.geekweek.pl |url = https://www.geekweek.pl/news/2019-09-21/ibm-zaprezentuje-najpotezniejszy-na-swiecie-53-kubitowy-komputer-kwantowy/}}</ref>.\n\
      \n==== Teoria języków programowania, typów, kompilacji ====\n{{Osobny artykuł|Teoria\
      \ języków programowania}}\nTeoria języków programowania (ang. ''Programming\
      \ language theory, PLT'') to dziedzina informatyki zajmująca się projektowaniem,\
      \ wdrażaniem, analizą, charakteryzacją i klasyfikacją [[Język programowania|języków\
      \ programowania]] oraz ich indywidualnymi cechami<ref>{{Cytuj |autor = List\
      \ |tytuł = Classic Papers in Programming Languages and Logic |data = |url =\
      \ https://www.cs.cmu.edu/~crary/819-f09/}}</ref>. Przykładowymi obszarami PLT\
      \ są semantyki formalne (ang. ''formal semantics''), [[teoria typów]] (ang.\
      \ ''type theory'')<ref>{{Cytuj |autor = Robert L. Constable |tytuł = Naïve Computational\
      \ Type Theory |data = 2002 |data dostępu = 2020-03-27 |isbn = 978-1-4020-0608-1\
      \ |miejsce = Dordrecht |wydawca = Springer Netherlands |s = 213–259 |doi = 10.1007/978-94-010-0413-8_7}}</ref>\
      \ czy [[metaprogramowanie]]. Na języki programowania składa się składnia, semantyka\
      \ i [[Biblioteka standardowa|biblioteki standardowe]], zazwyczaj posiadają co\
      \ najmniej obsługę [[Urządzenie wejścia-wyjścia|wejścia-wyjścia]], obsługę [[Plik\
      \ danych|plików]], obsługę [[Wielowątkowość|wielowątkowości]], zarządzanie [[Pamięć\
      \ operacyjna|pamięcią operacyjną]], podstawowe typy danych, funkcje do zarządzania\
      \ nimi np. operacje na ciągach znaków. Ważnym obszarem PLT jest też [[Kompilator|teoria\
      \ kompilacji]], na której proces składa się wykonanie poleceń [[preprocesor]]a,\
      \ [[analiza leksykalna]], [[analiza składniowa]], [[analiza semantyczna]], [[optymalizacja\
      \ kodu wynikowego]] i [[generacja kodu]]. Języki klasyfikuje się według poziomu\
      \ abstrakcji na którym operują na [[Język niskiego poziomu|języki niskiego poziomu]]\
      \ oraz [[Język wysokiego poziomu|języki wysokiego poziomu]], wyróżnia się także\
      \ wiele [[Paradygmat programowania|paradygmatów programowania]]<ref>{{Cytuj\
      \ |tytuł = Overview of the four main programming paradigms |data dostępu = 2020-03-27\
      \ |opublikowany = people.cs.aau.dk |url = http://people.cs.aau.dk/~normark/prog3-03/html/notes/paradigms_themes-paradigm-overview-section.html}}</ref><ref>{{Cytuj\
      \ |autor = KrishnamurthiShriram |tytuł = Teaching programming languages in a\
      \ post-linnaean age |czasopismo = ACM SIGPLAN Notices |data = 2008-11-30 |data\
      \ dostępu = 2020-03-27 |doi = 10.1145/1480828.1480846 |url = https://dl.acm.org/doi/abs/10.1145/1480828.1480846\
      \ | język = en}}</ref>.\n{| style=\"border:1px solid #ccc; text-align:center;\
      \ margin:auto;\" cellspacing=\"15\"\n|-\n| [[Plik:Logic.svg|96px]]\n| [[Plik:Compiler.svg|96px]]\n\
      | [[Plik:Lambda lc.svg|96px]]\n| [[Plik:Python add5 syntax.svg|96px]]\n| [[Plik:Programming\
      \ paradigms.svg|96px]]\n|-\n| [[Teoria typów]]\n| [[Kompilator|Teoria kompilacji]]\n\
      | [[Teoria języków programowania]]\n| [[Język programowania|Języki programowania]]\n\
      | [[Paradygmat programowania|Paradygmaty programowania]]\n|}\n\n=== Inżynieria\
      \ komputerowa ===\n{{Osobny artykuł|Inżynieria komputerowa}}\nInżynieria komputerowa\
      \ (ang. ''computer engineering'', niem. Technishe Informatik) – zajmuje się\
      \ tworzeniem systemów komputerowych. Do jej zadań należy projektowanie, wytwarzanie,\
      \ integracja i eksploatacja sprzętu cyfrowego, w tym urządzeń sieciowych. Początkowo\
      \ zajmowała się głównie tworzeniem procesorów, a współcześnie ważną jej rolę\
      \ stanowi także tworzenie sprzętu i sterowników dla systemów wbudowanych, które\
      \ wraz z pojawieniem się koncepcji [[IoT]] mają coraz większe znaczenie<ref>{{Cytuj\
      \ |tytuł = definicje |data dostępu = 2020-05-18 |opublikowany = www.iszkowski.eu\
      \ |url = https://www.iszkowski.eu/definicje}}</ref>. Do jej zagadnień należy\
      \ [[Architektura komputera|architekturą]] i organizacją [[System komputerowy|systemów\
      \ komputerowych]] na [[Sprzęt komputerowy|poziomie sprzętowym]] oraz [[Oprogramowanie\
      \ sprzętowe|oprogramowania sprzętowego]].\n\n==== Logika obliczeniowa i technika\
      \ cyfrowa ====\n{{Osobny artykuł|Technika cyfrowa}}\nTechnika cyfrowa zajmuje\
      \ się projektowaniem i analizą [[Układ cyfrowy|układów cyfrowych]]. Do jej elementarnych\
      \ zagadnień należą [[Bramka logiczna|bramki logiczne]], [[Rejestr procesora|rejestry]],\
      \ [[Układ sekwencyjny|układy sekwencyjne]] i [[Układ kombinacyjny|układy kombinacyjne]].\
      \ Obejmuje syntezę logiczną i odwzorowanie technologiczne<ref name=\":0\">{{Cytuj\
      \ |tytuł = TC Moduł 1 – Studia Informatyczne |data dostępu = 2020-01-15 |opublikowany\
      \ = wazniak.mimuw.edu.pl |url = http://wazniak.mimuw.edu.pl/index.php?title=TC_Modu%C5%82_1}}</ref>.\
      \ Współcześnie jej zagadnienia są kształtowane z jednej strony przez [[Hardware\
      \ Description Language|języki opisu sprzętu]], a z drugiej przez [[Bezpośrednio\
      \ programowalna macierz bramek|bezpośrednio programowalne macierze bramek]]<ref\
      \ name=\":0\" /><ref name=\"TC Moduł 12 - Studia Informatyczne\">{{Cytuj |tytuł\
      \ = TC Moduł 12 – Studia Informatyczne |data dostępu = 2020-03-28 |opublikowany\
      \ = wazniak.mimuw.edu.pl |url = http://wazniak.mimuw.edu.pl/index.php?title=TC_Modu%C5%82_12}}</ref>.\
      \ Układy logiczne początkowo implementowano jako układy mechaniczne, następnie\
      \ jako elektromechaniczne i dominujące współcześnie układy elektroniczne.\n\n\
      ==== Architektura i organizacja komputerów ====\n{{Osobny artykuł|Architektura\
      \ komputera}}\nArchitektura komputerów ('''AK''') to główny obszar [[Inżynieria\
      \ komputerowa|inżynierii komputerowej]] zajmujący się projektowaniem i podstawową\
      \ strukturą systemów komputerowych oraz budową i organizacją ich podzespołów.\
      \ Główny obszar AK stanowi [[Architektura procesora|architektura procesorów]]\
      \ na którą składa się [[model programowy procesora]] oraz [[mikroarchitektura\
      \ procesora]]<ref>{{Cytuj |autor = |tytuł = Architektura komputerów, wykłady\
      \ |data = |url = https://www.wsti.pl/files/przedmioty/ARH.pdf}}</ref>. Procesory\
      \ są głównym elementem systemów komputerowych. Szczególna uwaga jest poświęcona\
      \ na sposobie, w jaki [[procesor]] wykonuje instrukcje i uzyskuje dostęp do\
      \ adresów w [[Pamięć komputerowa|pamięci]]. Przykładowe zagadnienia to [[Direct\
      \ Memory Access|DMA]] czy [[Kontroler (informatyka)|kontroler]]<ref>{{Cytuj\
      \ |autor = P. Metzger, A. Jełowiecki |tytuł = Anatomia PC |data = 2000 |wydawca\
      \ = Helion}}</ref><ref>{{Cytuj |autor = J. Biernat |tytuł = Architektura komputerów\
      \ |data = 2002 |wydawca = Wydawnictwo Politechniki Wrocławskiej}}</ref>. Ważnymi\
      \ obszarami AK są także [[Magistrala komunikacyjna|magistrale]] oraz [[Pamięć\
      \ komputerowa|pamięci komputerowe]]. Pamięcią komputerową nazywa się różnego\
      \ rodzaju urządzenia i bloki funkcjonalne komputera, służące do przechowywania\
      \ [[Dane|danych]] i programów ([[System operacyjny|systemu operacyjnego]] oraz\
      \ [[Oprogramowanie użytkowe|aplikacji]]). Istnieje jej wiele rodzajów, m.in.\
      \ [[Rejestr procesora|rejestry procesora]], [[pamięć podręczna procesora]],\
      \ [[RAM|pamięć RAM]], [[Napęd SSD|dyski półprzewodnikowe]] (SSD), [[Dysk twardy|dyski\
      \ twarde]] (HDD). Wyróżnia się [[Pamięć zewnętrzna|pamięci zewnętrzne]] i wewnętrzne.\
      \ Magistralę komunikacyjną (ang. ''bus'') definiuje się jako zespół linii przenoszących\
      \ [[sygnał]]y oraz [[Układ wejścia-wyjścia|układy wejścia-wyjścia]] służące\
      \ do przesyłania sygnałów między połączonymi urządzeniami w systemach mikroprocesorowych<ref>{{Cytuj\
      \ |tytuł = Wykład II. Pamięci półprzewodnikowe. Studia stacjonarne inżynierskie,\
      \ kierunek INFORMATYKA Architektura systemów komputerowych – PDF Darmowe pobieranie\
      \ |data dostępu = 2020-03-31 |opublikowany = docplayer.pl |url = https://docplayer.pl/19566429-Wyklad-ii-pamieci-polprzewodnikowe-studia-stacjonarne-inzynierskie-kierunek-informatyka-architektura-systemow-komputerowych.html}}</ref>.\n\
      \n{| style=\"border:1px solid #ccc; text-align:center; margin:auto;\" cellspacing=\"\
      15\"\n|-\n| [[Plik:ABasicComputer.gif|96px]]\n| [[Plik:Z80 arch.svg|96px]]\n\
      | [[Plik:Intel Nehalem arch.svg|96px]]\n| [[Plik:Computer system bus(fixed).svg|96px]]\n\
      | [[Plik:Intel Core2 arch.svg|96px]]\n| [[Plik:Uarm metal wiki2.jpg|96px]]\n\
      |-\n| [[Architektura procesora|Architektura procesorów]]\n| [[Pamięć komputerowa|Architektura\
      \ pamięci]]\n| [[Magistrala komunikacyjna|Magistrale]]\n| [[Mikroarchitektura\
      \ procesora|Mikroarchitektura procesorów]]\n| [[Pamięć komputerowa]]\n| [[Urządzenie\
      \ wejścia-wyjścia|Urządzenia wejścia-wyjścia]]\n|}\n\n==== Przetwarzanie równoległe\
      \ i rozproszone ====\n{{Osobny artykuł|Przetwarzanie współbieżne|Obliczenia\
      \ równoległe|Obliczenia rozproszone}}\nObliczenia równoległe to obszar badający\
      \ możliwość [[Obliczenia|obliczeń]], w której wiele [[Rozkaz (informatyka)|instrukcji]]\
      \ jest wykonywanych jednocześnie. Taka forma przetwarzania danych była wykorzystywana\
      \ przez wiele lat, głównie przy wykorzystaniu [[superkomputer]]ów, a szczególne\
      \ zainteresowanie zyskała w ostatnich latach, z uwagi na fizyczne ograniczenia\
      \ uniemożliwiające dalsze zwiększanie [[Taktowanie|częstotliwości taktowania]]\
      \ procesorów. Obliczenia równoległe stały się dominującym wzorcem w [[Architektura\
      \ komputera|architekturze komputerowej]], głównie za sprawą upowszechnienia\
      \ [[Procesor wielordzeniowy|procesorów wielordzeniowych]]. Ze względu na skalę\
      \ można wyróżnić obliczenia równoległe na poziomie: bitów, instrukcji, danych\
      \ i zadań. [[Przetwarzanie współbieżne|Współbieżność]] jest właściwością systemów,\
      \ w których obliczenia wykonuje się jednocześnie i potencjalnie korzystają ze\
      \ wspólnych zasobów i/lub wchodzą w interakcje ze sobą. Opracowano wiele modeli\
      \ obliczeń równoległych, w tym [[Sieć Petriego|sieci Petriego]], [[rachunek\
      \ procesowy]] (ang.'' process calculus'') i [[model maszyny dostępu równoległego]]\
      \ (ang. ''parallel random-access machine, PRAM''). Kiedy wiele komputerów jest\
      \ podłączonych do sieci podczas korzystania ze współbieżności, jest to nazywane\
      \ [[System rozproszony|systemem rozproszonym]]. w którym to komputery mają własną\
      \ pamięć, a informacje są wymieniane, by osiągnąć wspólne cele.\n\n{| style=\"\
      border:1px solid #ccc; text-align:center; margin:auto;\" cellspacing=\"15\"\n\
      |-\n| [[Plik:SIMD cpu diagram1.svg|96px]]\n| [[Plik:Distributed-parallel.svg|96px]]\n\
      | [[Plik:MIMD.svg|96px]]\n| [[Plik:Superscalarpipeline.png|96px]]\n| [[Plik:An\
      \ illustration of the dining philosophers problem.png|96px]]\n|-\n| [[Przetwarzanie\
      \ współbieżne]]\n| [[Obliczenia rozproszone|Przetwarzanie rozproszone]]\n| [[Obliczenia\
      \ równoległe|Przetwarzanie równoległe]]\n| [[Potokowość]]\n| [[Problem ucztujących\
      \ filozofów|Problem 5 filozofów]]\n|}\n\n==== Programowanie niskopoziomowe ====\n\
      Oprogramowanie niskopoziomowe pisze się w [[Język niskiego poziomu|językach\
      \ niskiego poziomu]]. Są to głównie języki [[asembler]]a, stanowią symboliczny\
      \ zapis [[Instrukcja (informatyka)|instrukcji]] procesora i danych, który w\
      \ prosty sposób odpowiada zapisowi binarnemu. Języki asemblerowe wprowadzone\
      \ w celu czytelnej dla człowieka reprezentacji [[Język maszynowy|języków maszynowych]]\
      \ komputerów. W przeciwieństwie do języków wysokiego poziomu, typowe języki\
      \ asemblerowe charakteryzują się strukturą liniową (wierszową). Każdy wiersz\
      \ tekstu może zawierać pojedynczą instrukcję procesora lub [[Dyrektywa (informatyka)|dyrektywę\
      \ asemblera]]<ref>{{Cytuj |autor = Studia informatyczne MIMUW |tytuł = Programowanie\
      \ niskopoziomowe – Moduł 1 |url = http://wazniak.mimuw.edu.pl/index.php?title=Programowanie_niskopoziomowe_/_Modu%C5%82_1:_Wiadomo%C5%9Bci_podstawowe}}</ref>.\n\
