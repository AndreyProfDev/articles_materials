  - content: "'''Pojęcie składu informatycznych nośników danych'''<br />\nZgodnie\
      \ z rozporządzeniem Prezesa Rady Ministrów z dnia 18 stycznia 2011 r. w sprawie\
      \ instrukcji kancelaryjnej, jednolitych rzeczowych wykazów akt oraz instrukcji\
      \ w sprawie organizacji i zakresu działania archiwów zakładowych pod pojęciem\
      \ składu informatycznych nośników danych rozumiany jest uporządkowany zbiór\
      \ informatycznych nośników danych zawierających dokumentację w postaci elektronicznej.\
      \ Przez informatyczny [[nośnik danych]] rozumie się materiał lub urządzenie\
      \ służące do zapisywania, przechowywania i odczytywania danych w postaci cyfrowej.\
      \ Podmiot publiczny, który organizuje przetwarzanie danych w systemie teleinformatycznym,\
      \ musi stworzyć możliwość przekazywania danych także w postaci elektronicznej\
      \ z wykorzystaniem informatycznych nośników danych lub środków komunikacji elektronicznej<ref>Ustawa\
      \ z dnia 17 lutego 2005 r. o informatyzacji działalności podmiotów realizujących\
      \ zadania publiczne</ref>.<br />\n<br />\n''' Przesyłki przekazywane na informatycznym\
      \ nośniku danych w systemie EZD (Elektroniczne Zarządzanie Dokumentacją) '''<br\
      \ />\nPrzesyłki przekazywane na informatycznych nośnikach danych dzieli się\
      \ na:\n\na) przesyłki przekazane bezpośrednio na informatycznym nośniku danych,\
      \ gdzie podczas rejestracji do metadanych opisujących te przesyłki dołączane\
      \ są [[dokumenty elektroniczne]] przekazane na informatycznym nośniku danych\
      \ oraz UPO (czyli Urzędowe Poświadczenie Odbioru), o ile zostało wydane;\n\n\
      b) przesyłki stanowiące załącznik do pisma przekazanego na nośniku papierowym.\
      \ Pisma w formie papierowej zawierające załącznik w postaci informatycznego\
      \ nośnika danych rejestruje się tak jak pozostałe przesyłki w postaci papierowej,\
      \ dołączając do metadanych odwzorowanie cyfrowe pisma, a także załącznik w postaci\
      \ elektronicznej zapisany na informatycznym nośniku danych.\n\nKierownik podmiotu\
      \ ustala maksymalną wielkość przesyłki przekazywanej na informatycznym nośniku\
      \ danych, którą włącza się bezpośrednio do systemu EZD. W przypadku kiedy ze\
      \ względu na rozmiar przesyłki przekazanej na informatycznym nośniku danych\
      \ nie jest możliwe lub zasadne dołączenie takiej przesyłki do systemu EZD, należy\
      \ odnotować ten fakt w rejestrze przesyłek wpływających, a także przechowywać\
      \ taki nośnik w składzie informatycznych nośników danych, odrębnie od pozostałych\
      \ przesyłek. [[System EZD]] pozwala wyszukać i sporządzić listę przesyłek, które\
      \ nie zostały włączone bezpośrednio do systemu EZD – odbywa się to w szczególności\
      \ ze wskazaniem nośników, na których się one aktualnie znajdują.\n\nPo zakończeniu\
      \ sprawy przesyłki przekazywane na informatycznych nośnikach danych są przekazywane\
      \ do składu informatycznych nośników danych. Podmiot może prowadzić kilka składów\
      \ informatycznych nośników danych, jeżeli jest to uzasadnione strukturą organizacyjną\
      \ lub lokalizacją komórek organizacyjnych. Jeżeli następuje potrzeba wyjęcia\
      \ dokumentacji ze składu informatycznych nośników danych, to należy to udokumentować\
      \ w jeden z dwóch przewidzianych sposobów:\n\n1) włożyć w ich miejsce kartę\
      \ zastępczą, która zawiera [[znak sprawy]], jej tytuł, nazwę komórki organizacyjnej\
      \ lub nazwisko pracownika wypożyczającego dokumentację bądź nazwę i adres jednostki\
      \ organizacyjnej, do której dokumentację wysłano, oraz termin zwrotu\n\n2) odnotować\
      \ te informacje w systemie EZD w sytuacji, gdy zapewnia on powiązanie informacji\
      \ o wyjęciu dokumentacji z odpowiadającymi jej aktami sprawy.<br />\n[[Instrukcja\
      \ kancelaryjna]] przewiduje również możliwość wykonania kopii wyjmowanej dokumentacji.<br\
      \ />\n\n\n'''Przesyłki przekazywane na informatycznym nośniku danych w systemie\
      \ tradycyjnym'''\n\nW systemie tradycyjnym przesyłki przekazane na informatycznym\
      \ nośniku danych można podzielić na: przekazywane bezpośrednio na informatycznym\
      \ nośniku danych lub stanowiące załącznik do pisma przekazanego na nośniku papierowym.\
      \ Przesyłki przekazywane bezpośrednio na informatycznym nośniku danych, rejestruje\
      \ się, drukuje, nanosi i wypełnia pieczęć wpływu na pierwszej stronie wydruku.\
      \ W przypadku pism w postaci papierowej, do których załącznikiem jest przesyłka\
      \ przekazana na informatycznym nośniku danych, przesyłki te podlegają rejestracji\
      \ zgodnie z zasadami rejestracji przesyłek na nośniku papierowym. Należy przy\
      \ tym odnotować w rejestrze przesyłek wpływających informację o załączniku zapisanym\
      \ na informatycznym nośniku danych.\n\nJeżeli ze względu na typ dokumentu elektronicznego\
      \ lub objętość dokumentu elektronicznego nie jest możliwe lub zasadne wydrukowanie\
      \ pełnej treści przesyłki w postaci elektronicznej lub załącznika do niej, należy\
      \ najpierw wydrukować tylko część przesyłki albo sporządzić i wydrukować notatkę\
      \ o przyjętej przesyłce oraz nanieść i wypełnić pieczęć wpływu na pierwszej\
      \ stronie wydruku. Podobnie w przypadku, gdy niemożliwe jest wydrukowanie nawet\
      \ części przesyłki. Następnie informatyczny nośnik danych z zapisaną przesyłką\
      \ dołącza się do wydruku aż do momentu zakończenia sprawy. Po zakończeniu sprawy\
      \ jest on przekazywany do składu informatycznych nośników danych (dany podmiot\
      \ może prowadzić kilka składów informatycznych nośników danych, jeżeli jest\
      \ to uzasadnione strukturą organizacyjną lub lokalizacją komórek organizacyjnych).\
      \ Informację o załączniku zapisanym na informatycznym nośniku danych odnotowuje\
      \ się w rejestrze przesyłek wpływających.<br />\n<br />\n'''Przechowywanie przesyłek\
      \ przekazywanych na informatycznym nośniku danych do archiwum'''\n\nDokumentacja\
      \ elektroniczna na informatycznych nośnikach danych, zgromadzonych w składzie\
      \ informatycznych nośników danych, których zawartość skopiowano do systemu EZD,\
      \ jest kwalifikowana do kategorii Bc i brakowana w trybie i na zasadach określonych\
      \ w przepisach wydanych na podstawie art. 5 ust. 2b ustawy z dnia 14 lipca 1983\
      \ r. o narodowym zasobie archiwalnym i archiwach.\n\nDokumentacja elektroniczna\
      \ na informatycznych nośnikach danych, zgromadzona w składzie informatycznych\
      \ nośników danych, których zawartości nie skopiowano do systemu EZD, po upływie\
      \ pełnych dwóch lat kalendarzowych, licząc od pierwszego stycznia roku następującego\
      \ po roku, dla którego powstał zbiór przesyłek w składzie, jest przekazywana\
      \ do archiwum zakładowego.\n\nW systemie tradycyjnym przejmowanie dokumentacji\
      \ polega na jej przekazaniu do [[archiwum]] zakładowego na podstawie spisu zdawczo-odbiorczego.\
      \ Natomiast w systemie EZD, przekazując do właściwego archiwum państwowego materiały\
      \ archiwalne w postaci elektronicznej lub ich [[metadane]], przekazuje się równolegle\
      \ ich odpowiedniki ze składu chronologicznego lub ze składu informatycznych\
      \ nośników danych i sporządza się ich spisy. W archiwum, aby zapewnić ochronę\
      \ przed uszkodzeniem, zniszczeniem lub utratą, przechowuję się odrębnie od dokumentacji\
      \ w postaci nieelektronicznej informatyczne nośniki danych ze składu tych nośników.\n\
      \n[[Archiwum zakładowe]] ma za zadanie przejmować między innymi dokumentację\
      \ elektroniczną na informatycznych nośnikach danych, zgromadzonych w składzie\
      \ informatycznych nośników danych, których zawartości nie skopiowano do systemu\
      \ EZD. Każdy informatyczny nośnik danych, który został przekazywany ze składu\
      \ informatycznych nośników danych do archiwum zakładowego powinien być trwale\
      \ oznakowany w sposób pozwalający na jego jednoznaczną identyfikację (tworzy\
      \ się spis zdawczo-odbiorczy).\t\n\nInformatyczny nośnik danych, zgodnie z rozporządzeniem\
      \ Ministra Spraw Wewnętrznych i Administracji z dnia 2 listopada 2006 r. w sprawie\
      \ wymagań technicznych formatów zapisu i informatycznych nośników danych, na\
      \ których utrwalono materiały archiwalne przekazywane do archiwów państwowych,\
      \ powinien być:\n# oznakowany w sposób pozwalający na jednoznaczną identyfikację;\n\
      # przystosowany do przenoszenia pomiędzy urządzeniami odczytującymi;\n# dostosowany\
      \ do przechowywania w temperaturze 18-22°C przy wilgotności względnej 40-50%.\n\
      \nPonadto taki nośnik powinien zapewniać możliwość wiernego odczytywania danych\
      \ w urządzeniach produkowanych przez różnych producentów, właściwych dla danego\
      \ typu nośnika. Informatyczny nośnik danych, który przekazuje się do archiwum\
      \ musi być opatrzony informacją przyporządkowaną do oznaczenia nośnika w sposób\
      \ niebudzący wątpliwości, która zawiera:\n# nazwę podmiotu przekazującego;\n\
      # tytuł zwięźle określający zawartość nośnika;\n# datę wykonania zapisu na nośniku;\n\
      # informację o tym, czy dane stanowią informacje chronione ustawą, a w szczególności\
      \ klauzulę tajności;\n# wskazanie oprogramowania i urządzeń użytych do wykonania\
      \ zapisu.\n\n== Przypisy ==\n{{Przypisy}}\n== Linki zewnętrzne ==\n* Ustawa\
      \ z dnia 17 lutego 2005 r. o informatyzacji działalności podmiotów realizujących\
      \ zadania publiczne (https://isap.sejm.gov.pl/isap.nsf/DocDetails.xsp?id=WDU20050640565)\n\
      * Rozporządzenie Ministra Spraw Wewnętrznych i Administracji z dnia 2 listopada\
      \ 2006 r. w sprawie wymagań technicznych formatów zapisu i informatycznych nośników\
      \ danych, na których utrwalono materiały archiwalne przekazywane do archiwów\
      \ państwowych (https://isap.sejm.gov.pl/isap.nsf/DocDetails.xsp?id=WDU20062061519)\n\
      * Ustawa z dnia 14 lipca 1983 roku o narodowym zasobie archiwalnym i archiwach\
      \ (https://isap.sejm.gov.pl/isap.nsf/DocDetails.xsp?id=WDU19830380173)\n* Rozporządzenie\
      \ Prezesa Rady Ministrów z dnia 18 stycznia 2011 r. w sprawie instrukcji kancelaryjnej,\
      \ jednolitych rzeczowych wykazów akt oraz instrukcji w sprawie organizacji i\
      \ zakresu działania archiwów zakładowych (https://isap.sejm.gov.pl/isap.nsf/DocDetails.xsp?id=WDU20110140067)\n\
      \n[[Kategoria:Informatyka]]\n[[Kategoria:Prawo administracyjne]]"
