- sections:
  - content: "{{dopracować|źródła=2016-07}}\n'''Teoria systemów''' – interdyscyplinarna\
      \ nauka o [[system]]ach. Pierwotnie była teorią [[biologia|biologiczną]], następnie\
      \ została rozwinięta i poszerzona przez [[Matematyka|matematyków]], [[Informatyka|informatyków]],\
      \ [[Socjologia|socjologów]], [[Psychologia|psychologów]], [[filozofia|filozofów]],\
      \ [[Cybernetyka|cybernetyków]], [[Ekonomia|ekonomistów]] i [[Inżynieria|inżynierów]].\
      \ Ostatnio staje się też punktem odniesienia w [[kognitywistyka|kognitywistyce]].\
      \ Dąży do coraz to szerszych uogólnień jako „systemika” (ang. systemics) lub\
      \ „ogólna teoria systemów”.\n\nObecnie teoria ta aspiruje do całościowego tłumaczenia\
      \ funkcjonowania [[organizm]]ów żywych, [[społeczeństwo|społeczeństw]] i urządzeń/systemów\
      \ sztucznych, co z jednej strony czyni ją uniwersalną, z drugiej jest przedmiotem\
      \ krytyki za jej zbytnią ogólność i abstrakcyjność.\n\nPotrzeba jednolitego\
      \ ujęcia [[system]]owego zrodziła się w latach 30. XX wieku. Istotny wkład w\
      \ powstanie i rozwój ujęcia systemowego mieli m.in. [[matematyka|matematyk]]\
      \ [[Norbert Wiener]] (twórca cybernetyki), [[Claude E. Shannon|Shannon]] oraz\
      \ [[Warren Weaver]] oraz biolog [[Walter Cannon]]. Za twórcę teorii systemów\
      \ uznaje się [[Ludwig von Bertalanffy|Ludwiga von Bertalanffy'ego]]{{odn|Heller|Pabjan|2014|s=216–217}}.\
      \ W 1954 roku Bertalanffy założył ''Society for General Systems Theory''.\n\n\
      Pod koniec lat 30. XX wieku w socjologii rozwijana była teoria systemów przez\
      \ [[Pitirim Sorokin|Pitrima Sorokina]], a następnie przez [[Talcott Parsons|Talcotta\
      \ Parsonsa]]. W latach 60. i 70. XX wieku nastąpiło odejście od koncepcji systemowych\
      \ ze względu na silne wpływy filozofii antypozytywistycznej, w szczególności\
      \ [[Postmodernizm (filozofia)|postmodernizmu]] i koncepcji humanistycznych.\
      \ Obecnie teoria systemów w socjologii rozwijana była m.in. przez [[Niklas Luhmann|Niklasa\
      \ Luhmanna]].\n\nW [[psychologia|psychologii]] w latach 60. rozwinął się nurt\
      \ [[psychologia systemowa|psychologii systemowej]], służący głównie [[psychoterapia|terapii]]\
      \ [[Psychoterapia systemowa|systemowej rodzin]].\n\nPomimo swoich uniwersalistycznych\
      \ celów, jak do tej pory, nie istnieje jedna jednolita i ogólnie uznana teoria\
      \ systemów ale wiele, mniej lub bardziej podobnych podejść do jej generalizacji,\
      \ poczynając od filozofii na inżynierii kończąc. Najbliższe do takiej teorii\
      \ lub [[Metateoria|metateorii]] są: teoria samoorganizujących się systemów,\
      \ ''Autopoiesis'' – [[system autopoietyczny]] ([[Francisco Varela]], [[Humberto\
      \ Maturana]], [[Niklas Luhmann]]) i metateoria uporządkowania [[wiedza|wiedzy]]\
      \ bazująca na pojęciu [[inteligencja|inteligencji]], [https://archive.is/20120709151610/http://erg4146.casaccia.enea.it/wwwerg26701/Gad-toga.htm\
      \ TOGA (ang)] (Adam Maria Gadomski).\n\nWedług opracowania Świętochowskiego,\
      \ podejście systemowe wyraża się na kilku poziomach ogólności<ref>{{Cytuj |autor\
      \ =  |autor r = Waldemar Świętochowski |redaktor = Iwona Janicka, Hanna Liberska\
      \ |rozdział = Rodzina w ujęciu systemowym |tytuł = Psychologia rodziny |data\
      \ = 2014 |data dostępu = 2019-06-13 |isbn = 9788301180027 |miejsce = Warszawa\
      \ |wydawca = Wydawnictwo Naukowe PWN |oclc = 894983657}}</ref>:\n\n# abstrakcyjna\
      \ filozofia systemów, na którą składa się: \n#* idea całościowości, która zastępuje\
      \ proste mechanistyczne i analityczne modele nauki pozytywistycznej, \n#* idea\
      \ przyczynowości cyrkularnej, która zastępuje proste modele jednokierunkowej,\
      \ liniowej przyczynowości,\n# stosowana perspektywa systemowa, występująca w\
      \ specyficznych postaciach na gruncie konkretnych nauk (np. ogólna zasada systemowa:\
      \ sprzężenia zwrotne, zasada ta na gruncie psychologii – wzmocnienie),\n# technologia\
      \ systemów – praktyczne zastosowania teorii systemowej, np. systemowa terapia\
      \ rodzin w dziedzinie psychologii rodziny.\n\n== Przypisy ==\n{{Przypisy}}\n\
      \n== Bibliografia ==\n* {{cytuj książkę | nazwisko = Heller | imię = Michał\
      \ | autor link = Michał Heller | nazwisko2 = Pabjan | imię2 = Tadeusz | autor\
      \ link2 = Tadeusz Pabjan | tytuł = Elementy filozofii przyrody | wydawca = Copernicus\
      \ Center Press | miejsce = Kraków | rok = 2014 | isbn=978-83-7886-065-5 | odn=tak}}\n\
      \n{{Kontrola autorytatywna}}\n\n[[Kategoria:Informatyka]]\n[[Kategoria:Psychologia\
      \ systemowa]]\n[[Kategoria:Teorie biologiczne]]\n[[Kategoria:Zarządzanie]]\n\
      [[Kategoria:Teorie systemów społecznych]]"
