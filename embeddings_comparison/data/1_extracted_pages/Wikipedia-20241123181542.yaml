- sections:
  - content: "'''Teleinformatyka''' – równoważna ściśle powiązanym: [[informatyka\
      \ techniczna|informatyce technicznej]] z [[telekomunikacja|telekomunikacją]],\
      \ jako specjalność w dyscyplinie nauk inżynieryjno-technicznych oraz kierunek\
      \ studiów, obejmująca inżynierię komputerów i oprogramowania w projektowaniu\
      \ i eksploatacji [[system teleinformatyczny|systemów teleinformatycznych]] funkcjonujących\
      \ z wykorzystaniem sieci internetowej.\n\n== Etymologia ==\nW latach 78/79 dyskutowano\
      \ w Polsce o dwóch rozumieniach pojęcia ''teleinformatyka'' (nazwa pochodząca\
      \ ze złożenia nazwy ''telekomunikacja'' i ''informatyka'') stwierdzając<ref>[https://delibra.bg.polsl.pl/dlibra/publication/3194\
      \ Informatyka Nr 4/81].</ref>:\n{{Cytat\n |treść = Przez teleinformatykę rozumiemy\
      \ dział informatyki, w którym przynajmniej niektóre zadania elementarne są wykonywane\
      \ zdalnie za pomocą środków telekomunikacyjnych{{r|WNow}} oraz dział telekomunikacji\
      \ zajmujący się problematyką szeroko rozumianego zdalnego dostępu komputerów\
      \ nosi nazwę teleinformatyka{{r|WMaj}}.\n}}\na było to jeszcze w czasach mechanicznych\
      \ i elektronicznych central [[Publiczna komutowana sieć telefoniczna|PSTN]].\n\
      \nTermin '''teleinformatyka''' istniał nieco w zapomnieniu przez następne lata.\
      \ Jednakże w tych latach coraz więcej urządzeń [[Sieć telekomunikacyjna|sieci\
      \ telekomunikacyjnych]] było projektowanych w technice cyfrowej, aż do opracowania\
      \ infrastruktury sieciowej całkowicie zarządzanej przez [[System informatyczny|systemy\
      \ informatyczne]]. Równocześnie w tych latach, systemy informatyczne w znaczącym\
      \ stopniu uzależniły swoje działania od stałego dostępu do publicznej sieci\
      \ teleinformatycznej – internetu, stając się systemami teleinformatycznymi{{r|DzU}}.\
      \ Pojawiły się też nowe wymagania na zapewnienie bezpieczeństwa systemów i sieci\
      \ – [[Bezpieczeństwo teleinformatyczne|bezpieczeństwa teleinformatycznego]].\
      \ Symbioza informatyki i telekomunikacji stała się faktem{{r|orange}}.\n\nCoraz\
      \ więcej uczelni wprowadza kierunki studiów dziennych oraz podyplomowych: „informatyka\
      \ techniczna i telekomunikacja oraz studiów „teleinformatyka”{{r|uczelnie}}.\
      \ Istnieje też zawód „[[technik teleinformatyk]]”.\n\nObecnie termin '''teleinformatyka'''\
      \ oraz ''teleinformatyczny'' jest już powszechnie używany i dobrze rozumiany.\
      \ Występuje też w szerszym znaczeniu opisu produktów i usług teleinformatycznych\
      \ społeczeństwa cyfrowego.\n\nW ramach obowiązującej od 2018 w Polsce [[Klasyfikacja\
      \ dziedzin i dyscyplin naukowych|Klasyfikacji dziedzin i dyscyplin naukowych]]\
      \ '''teleinformatyka''' jest specjalnością w ramach szerokiej dyscypliny ''informatyka\
      \ techniczna i telekomunikacja'' w dziedzinie nauk inżynieryjno-technicznych.\n\
      \n== Badania i program kierunku teleinformatyka ==\nZakres badań i przedmioty\
      \ programu obejmują praktycznie cały obszar wiedzy informatycznej i telekomunikacyjnej,\
      \ stąd konieczne jest formowanie specjalności i specjalizacji. W tym obszarze\
      \ znajdują się działy:\n* [[teoria informacji|podstawy teorii informacji i transmisji\
      \ sygnałów cyfrowych]]\n* [[inżynieria komputerowa]] z ukierunkowaniem na projektowanie\
      \ cyfrowych urządzeń sieciowych oraz systemów mikroprocesorowych.\n* [[inżynieria\
      \ oprogramowania]] z ukierunkowaniem na integrację systemów informatycznych\
      \ działających w sieci z gwarancjami bezpieczeństwa teleinformatycznego.\n*\
      \ inżynieria sieci przewodowych i bezprzewodowych z zarządzaniem ruchem i usługami\
      \ teleinformatycznymi.\n* [[multimedia]] szeroko rozumiane.\n\n== Zobacz też\
      \ ==\n* [[Sektor teleinformatyczny|Teleinformatyka jako sektor gospodarczy]]\n\
      \n== Przypisy ==\n<references>\n<ref name=WMaj>{{Cytuj |autor = Władysław Majewski\
      \ |tytuł = O teleinformatyce |czasopismo = Przegląd Telekomunikacyjny |wolumin\
      \ = 4 |data = 1979}}</ref>\n<ref name=WNow>{{Cytuj |autor = Władysław Nowicki\
      \ |tytuł = O ścisłość pojęć i kulturę słowa w technice |wydawca = Wydawnictwa\
      \ Komunikacji i Łączności |miejsce = Warszawa |data = 1978}}</ref>\n<ref name=orange>{{Cytuj\
      \ |url = http://www.geoland.pl/dodatki/lacznosc_vi/artykul_32.html |tytuł =\
      \ Teleinformatyka to nowe możliwości |archiwum = https://web.archive.org/web/20080618010711/http://www.geoland.pl/dodatki/lacznosc_vi/artykul_32.html\
      \ |data dostępu = 2011-02-19 |zarchiwizowano = 2008-06-18}}</ref>\n<ref name=DzU>{{Dziennik\
      \ Ustaw|2005|64|565}} Ustawa z dnia 17 lutego 2005 r. o informatyzacji działalności\
      \ podmiotów realizujących zadania publiczne.</ref>\n<ref name=uczelnie>[https://www.otouczelnie.pl/artykul/1481/Teleinformatyka\
      \ Teleinformatyka studia – kierunek studiów].</ref>\n</references>\n\n== Linki\
      \ zewnętrzne ==\n* {{Cytuj stronę |url = http://delibra.bg.polsl.pl/dlibra/publication/3112?tab=1\
      \ |tytuł = Roczniki Informatyki 1971–2000 w Bibliotece Cyfrowej Politechniki\
      \ Śląskiej |autor = Biblioteka |rok = 1970 |język = pl}}\n\n{{Kontrola autorytatywna}}\n\
      \n[[Kategoria:Telekomunikacja]]\n[[Kategoria:Informatyka]]"
