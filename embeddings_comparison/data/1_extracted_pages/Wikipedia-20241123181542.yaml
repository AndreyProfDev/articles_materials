  - content: '''''''Informatyka materiałowa'''''' (ang. material informatics) to stosunkowo
      nowa interdyscyplinarna dziedzina badań, która łączy [[Informatyka|informatykę]]
      z [[Inżynieria materiałowa|inżynierią materiałowej]] i [[Materiałoznawstwo|materiałoznawstwem]]
      w celu poprawy zrozumienia, wykorzystania, wyboru, rozwoju i odkrywania [[Materiał|materiałów]].
      Stawia sobie za cel szybkie i niezawodne pozyskiwanie, zarządzanie, analizę
      i rozpowszechnianie różnorodnych danych materiałowych w celu znacznego skrócenia
      czasu i ryzyka potrzebnego do opracowania, wyprodukowania i wdrożenia nowych
      materiałów, co zwykle trwa dłużej niż 20 lat<ref>{{Cytuj |autor = Mulholland,
      Gregory; Paradiso, Sean |tytuł = Perspective: Materials informatics across the
      product lifecycle: Selection, manufacturing, and certification |czasopismo =
      APL Materials |data = 23 March 2016 |doi = 10.1063/1.4945422}}</ref><ref>{{Cytuj
      |autor = Rickman, J.M.; Lookman, T.; Kalinin |tytuł = Materials informatics:
      From the atomic-level to the continuum". Acta Materialia |czasopismo = Acta
      Materialia |data = 15 April 2019 |doi = 10.1016/j.actamat.2019.01.051}}</ref>.


