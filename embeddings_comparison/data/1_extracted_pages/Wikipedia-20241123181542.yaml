- sections:
  - content: '''''''Extensible resource identifier (XRI)'''''' – system identyfikatorów,
      kompatybilny z [[Uniform Resource Identifier|URI]]. Został stworzony w ramach
      organizacji OASIS. Jest to także [[protokół]] określający sposób pobierania
      tych identyfikatorów.


      [[Identyfikator]]y XRI dopuszczają stosowanie pełnego [[Unicode]].


      Jednym z najważniejszych z punktu widzenia [[Identity 2.0]] zastosowań XRI są
      [[i-names]].


      XRI towarzyszy także inny protokół, [[XDI]], służący do wymiany [[Dane|danych]].


      == Linki zewnętrzne ==

      * [http://www.oasis-open.org/committees/tc_home.php?wg_abbrev=xri Informacje
      o XRI]


