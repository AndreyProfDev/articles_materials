- sections:
  - content: '''''''Astroinformatyka'''''' – interdyscyplinarna dziedzina nauki, będąca
      połączeniem [[Astronomia|astronomii]] z [[informatyka|informatyką]] oraz [[teleinformatyka|technologiami
      komunikacyjnymi]]<ref>http://www.math.bas.bg/~nkirov/zip/SEEDI_astro_presentation.pdf.</ref>.


      Astroinformatyka polega na wykorzystaniu nowoczesnych technologii w celu zachowania
      i analizy historycznych obserwacji astronomicznych. Ma na celu również [[Technologia
      cyfrowa|zapisanie cyfrowo]] historycznych oraz najnowszych obserwacji astronomicznych
      i obrazów w dużej [[Baza danych|bazie danych]] dla efektywniejszego wyszukiwania
      materiałów poprzez ogólnodostępny [[interfejs]]<ref>{{Cytuj | url=http://www.casca.ca/lrp2010/Docs/LRPReports/astroinformatics_lrp.pdf
      | tytuł=astroinformatics_lrp.dvi<!-- Tytuł wygenerowany przez bota --> | opublikowany=casca.ca
      | data dostępu=2024-04-27}}</ref>.


