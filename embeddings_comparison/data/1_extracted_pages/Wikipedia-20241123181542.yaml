      ''''''Modulo''''''<ref group="uwaga">Etym. w [[moduł]].</ref> – operacja wyznaczania
      [[twierdzenie o dzieleniu z resztą|reszty z dzielenia]] jednego typu liczbowego
      przez drugi. W dalszym ciągu napis <math>a\ \bmod\ d = r</math> będzie oznaczał,
      iż <math>r</math> jest resztą z dzielenia <math>a</math> przez <math>d.</math><ref
      name="knuth_mk148-151">{{Cytuj książkę|autor=Ronald L. Graham, Donald E. Knuth,
      Oren Patashnik|tytuł=Matematyka konkretna|wydawca=PWN|data=2001|strony=148-151|isbn=8301121246}}</ref>


      Są różne sposoby określania reszty, a komputery i kalkulatory mają różne sposoby
      przechowywania i reprezentowania liczb, więc wynik operacji modulo zależy od
      [[Język programowania|języka programowania]] i/lub sprzętu.


      W niemal każdym systemie komputerowym współczynnik wynikający z dzielenia jest
      ograniczany do zbioru [[Liczby całkowite|liczb całkowitych]], a reszta <math>r</math>
      jest zwykle ograniczona przez <math>0 \leqslant r < |d|</math> albo <math>-|d|
      < r \leqslant 0.</math> Wybór między dwiema możliwymi resztami zależy od znaku
      <math>a</math> lub <math>d</math> oraz użytego języka programowania. Niektóre
      języki programowania, jak na przykład C89, nawet nie definiują wyniku jeśli
      zarówno <math>d,</math> jak i <math>a</math> jest ujemne – patrz tabela.


      <math>a</math> modulo 0 jest nieokreślone w większości systemów, choć niektóre
      określają je jako <math>a.</math> Jeśli definicja jest spójna z algorytmem dzielenia,
      wtedy <math>d = 0</math> implikuje <math>0 \leqslant r < 0,</math> co jest sprzeczne
      (tzn. zwykła reszta w tym wypadku nie istnieje).


      Reszta może być wyznaczana równaniami, które korzystają z innych funkcji. Jednym
      z takich użytecznych równań wyznaczania reszty <math>r</math> jest

      : <math>r = a - d \left\lfloor\frac{a}{d}\right\rfloor,</math>


      gdzie <math>\lfloor x\rfloor</math> oznacza [[Podłoga i sufit|zaokrąglenie w
      dół]] liczby <math>x.</math>


      Dzielenie modulo jest powszechnie używane przy obliczaniu cyfry kontrolnej w
      identyfikatorach. W [[Algorytm Luhna|algorytmie Luhna]], numerach [[PESEL]],
      [[REGON]], [[Numer identyfikacji podatkowej|NIP]], [[Dowód osobisty w Polsce|numerach
      dowodów osobistych]], [[Paszporty w Polsce|paszportów]], numerach towarów EAN,
      numerach banknotów EURO, numerach kont bankowych IBAN, [[Numer CAS|numerach
      substancji chemicznych CAS]], [[Międzynarodowy znormalizowany numer książki|ISBN]],
      [[ISMN]], [[International Standard Serial Number|ISSN]], [[ISTC]], [[EVN-UIC]],
      numerach recept, prawa wykonywania zawodu lekarza, numerach kontenera i wielu
      innych<ref>{{Cytuj|tytuł=Weryfikacja cyfry kontrolnej|url=https://romek.info/ut/kody.html|data=2007-07|data
      dostępu=2018-10-25}}</ref>. Podstawowym celem użycia cyfry lub znaku kontrolnego
      jest wykrywanie pomyłek przy ręcznym wprowadzaniu numeru do systemu informatycznego.
      Wszystkie te metody zapewniają wykrycie zamiany pojedynczego znaku oraz w znacznej
      większości zamiany sąsiednich znaków, tzw. [[Czeski błąd|czeskiego błędu]].


