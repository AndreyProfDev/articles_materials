      15\"\n|-\n| [[Plik:CPU block diagram.svg|96px]]\n| [[Plik:Apple II Monitor.png|96px]]\n\
      | [[Plik:Wikipedia in binary.gif|96px]]\n| [[Plik:X86 Paging 4K.svg|96px]]\n\
      | [[Plik:IF-THEN-ELSE-END flowchart.svg|96px]]\n|-\n| [[Rozkaz (informatyka)|Rozkazy]]\n\
      | [[Język maszynowy|Kod maszynowy]]\n| [[Dwójkowy system liczbowy|Kod binarny]]\n\
      | [[Rejestr stanu|Rejestry]]\n| [[Instrukcja (informatyka)|Instrukcje]]\n|}\n\
      \n==== Sieci komputerowe ====\n{{Osobny artykuł|Sieć komputerowa}}\nSieci komputerowe\
      \ to gałąź informatyki mająca na celu tworzenie sieci między komputerami nazywanych\
      \ węzłami, umożliwiając im współdzielenie zasobów. W sieciach komputerowych\
      \ urządzenia komputerowe wymieniają się danymi za pomocą [[Model OSI#Warstwy\
      \ wyższe|warstw sieciowych]]. W [[Model OSI|modelu OSI]] wyróżnia się warstwę\
      \ aplikacji, prezentacji, sesji, transportową, sieciową, [[Warstwa łącza danych|łącza\
      \ danych]] i fizyczną, a w [[Model TCP/IP|modelu TCP/IP]] – będącym podstawą\
      \ struktury [[internet]]u – wyróżnia się warstwy aplikacji, transportową, internetową\
      \ i dostępu do sieci. Te łącza danych są ustanawiane za pomocą mediów kablowych,\
      \ takich jak [[skrętka]] lub [[Kabel światłowodowy|kable światłowodowe]], oraz\
      \ mediów bezprzewodowych, takich jak np. [[Wi-fi|Wi-Fi]]<ref>{{Cytuj |tytuł\
      \ = Sieci komputerowe – Studia Informatyczne |data dostępu = 2020-03-29 |opublikowany\
      \ = wazniak.mimuw.edu.pl |url = http://wazniak.mimuw.edu.pl/index.php?title=Sieci_komputerowe}}</ref>.\
      \ Jednymi z podstawowych zagadnień sieci są protokoły oraz urządzenia sieciowe.\
      \ Do najpopularniejszych urządzeń sieciowych należy [[karta sieciowa]], [[router]],\
      \ [[Koncentrator sieciowy|koncentrator]], [[Przełącznik sieciowy|przełącznik]],\
      \ [[Punkt dostępu|punkt dostępowy]], most, ekspander zasięgu Wi-Fi (repeater\
      \ Wi-Fi), adaptery PowerLine, [[Serwer wydruku|serwery wydruku]], kamery IP,\
      \ bramki VoIP orazy telefony IP<ref>{{Cytuj |tytuł = Popularne urządzenia sieciowe\
      \ |data dostępu = 2020-03-29 |opublikowany = miroslawzelent.pl |url = https://miroslawzelent.pl/informatyka/urzadzenia-sieciowe/}}</ref>.\
      \ Protokołem komunikacyjnym nazywa się zbiór ścisłych reguł i kroków postępowania,\
      \ które są automatycznie wykonywane przez urządzenia sieciowe w celu nawiązania\
      \ łączności i wymiany danych. Definiują one syntaksę, semantykę, synchronizację\
      \ komunikacji oraz możliwe metody naprawiania błędów. Protokoły te mogą zostać\
      \ wdrożone za pomocą hardware'u, oprogramowania lub obu jednocześnie<ref>{{Cytuj\
      \ |tytuł = Zestawienie protokołów |data dostępu = 2020-03-29 |opublikowany =\
      \ pasja-informatyki.pl |url = https://pasja-informatyki.pl/sieci-komputerowe/protokoly-zestawienie/}}</ref>.\n\
