- sections:
  - content: 'Program ''''''Brite'''''' ([[Język angielski|ang.]] ''''Basic Resarch
      in Information Technologies for Europe'''') - ''''''Badania Podstawowe w Zakresie
      Technologii Informatycznych dla Europy'''''' - program [[Unia Europejska|Unii
      Europejskiej]] zainicjowany w 1985 r. celem wspierania badań naukowych w zakresie
      nowych technologii i ich wspierania. Został zaplanowany na 4 lata i zakończył
      się w 1989 r. Miał on stymulować współpracę pomiędzy różnymi gałęziami [[przemysł]]u
      w państwach [[Wspólnoty europejskie|Wspólnot Europejskich]]. ''''Brite'''' to
      [[Skrótowiec|akronim]] od pełnej angielskiej nazwy programu.


      Program łączył przedsiębiorstwa, szkoły wyższe oraz instytuty badawcze i podejmował
      współpracę w następujących dziedzinach nowych technologii:

      * [[polimery]],

      * technologia [[laser]]owa,

      * modele [[matematyka|matematyczne]],

      * nowe surowca,

      * [[katalizator]]y,

      * technologie [[Membrana półprzepuszczalna|membranowe]].


      Jako pierwsze z tego programu skorzystały małe i średnie przedsiębiorstwa. Program
      obejmował 12 krajów członkowskich [[Unia Europejska|Unii Europejskiej]]: [[Belgia]],
      [[Dania]], [[Francja]], [[Grecja]], [[Hiszpania]], [[Holandia]], [[Irlandia]],
      [[Luksemburg]], [[Niemcy]], [[Portugalia]], [[Włochy]], [[Wielka Brytania]]
      i kraje [[Europejskie Stowarzyszenie Wolnego Handlu|EFTA]]: [[Islandia]], [[Liechtenstein]],
      [[Norwegia]].


      == Bibliografia ==

      * [http://eur-lex.europa.eu/pl/index.htm ''''Dzienniki Urzędowe Unii Europejskiej'''']
      {{lang|pl}}


