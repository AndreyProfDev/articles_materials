      \ London NW1 2DB\n |kod mapy                  = Londyn\n |współrzędne      \
      \         = 51°31′46″N 0°07′37″W\n |commons                   = \n |www    \
      \                   = https://www.turing.ac.uk/\n}}\n'''Instytut Alana Turinga'''\
      \ ([[Język angielski|ang.]] ''The Alan Turing Institute'') – [[Wielka Brytania|brytyjski]]\
      \ narodowy instytut zajmujący się naukową [[Danologia|analizą danych]] i [[Sztuczna\
      \ inteligencja|sztuczną inteligencją]], założony w 2015 roku i finansowany głównie\
      \ przez rząd [[Wielka Brytania|Wielkiej Brytanii]]. Jego nazwa pochodzi od [[Alan\
      \ Turing|Alana Turinga]]<ref name=\"alan\">{{Cytuj pismo |nazwisko = Newman\
      \ |imię = Maxwell Herman Alexander |tytuł = Alan Mathison Turing, 1912-1954\
      \ |czasopismo = Biographical Memoirs of Fellows of the Royal Society |wolumin\
      \ = 1 |strony = 253–263 |język = en |data = 1955 |doi = 10.1098/rsbm.1955.0019\
      \ |jstor = 769256}}</ref>, brytyjskiego [[matematyk]]a i pioniera [[informatyk]]i.\n\
      \n== Zarządzanie ==\nInstytut Alana Turinga jest niezależną organizacją pozarządową,\
      \ działającą na zasadzie non-profit. Jest to wspólne przedsięwzięcie pięciu\
      \ [[uniwersytet]]ów założycielskich [[University of Cambridge|Uniwersytetu Cambridge]],\
      \ [[Uniwersytet Edynburski|Uniwersytetu w Edynburgu]], [[Uniwersytet Oksfordzki|Uniwersytetu\
      \ Oksfordzkiego]], [[University College London|University College London (UCL)]]\
      \ i [[University of Warwick|Uniwersytetu w Warwick]], wybranych na podstawie\
      \ międzynarodowej [[Recenzja naukowa|oceny wzajemnej]]<ref>{{Cytuj stronę |url\
      \ = http://www.epsrc.ac.uk/newsevents/news/alanturinginstitute/ |tytuł = Business\
      \ Secretary Cable announces partners in the Alan Turing Institute |zarchiwizowano\
      \ = 9 April 2016 |archiwum = https://web.archive.org/web/20160409142902/https://www.epsrc.ac.uk/newsevents/news/alanturinginstitute/\
      \ |data dostępu = 2016-05-13}}</ref>. W 2018 roku do instytutu dołączyło ośmiu\
      \ dodatkowych partnerów uniwersyteckich: Queen Mary University of London, [[University\
      \ of Leeds]], [[The University of Manchester|University of Manchester]], [[Uniwersytet\
      \ w Newcastle (Wielka Brytania)|University of Newcastle]], [[University of Southampton]],\
      \ [[University of Birmingham]], [[University of Exeter]] i [[Uniwersytet Bristolski|University\
      \ of Bristol]]<ref name=\":0\">{{Cytuj stronę |url = https://www.turing.ac.uk/about-us\
      \ |tytuł = About us |opublikowany = The Alan Turing Institute |język = en |data\
      \ dostępu = 2024-01-31}}</ref>.\n\n{{link-interwiki|Engineering and Physical\
      \ Sciences Research Council|Q=Q5377871|tekst=Rada ds. Badań nad Inżynierią i\
      \ Naukami Fizycznymi (EPSRC)}}, główny fundator instytutu, jest również członkiem\
      \ wspólnego przedsięwzięcia. Prezesem Instytutu Alana Turinga, powołaną w lipcu\
      \ 2023 roku, jest Jean Innes.\n\n== Finansowanie ==\nFundusze na utworzenie\
      \ instytutu pochodziły z inwestycji o wartości 600 milionów funtów w „Osiem\
      \ wielkich technologii”<ref>{{Cytuj stronę |url = https://www.gov.uk/government/publications/eight-great-technologies-infographics\
      \ |tytuł = Eight great technologies: infographics |data dostępu = 2016-05-13}}</ref>,\
      \ a konkretnie w tzw. „[[big data]]”, wyasygnowane przez rząd Wielkiej Brytanii\
      \ w 2013 roku i ogłoszonej przez [[George Osborne (kanclerz skarbu)|George’a\
      \ Osborne’a]], Kanclerz Skarbu, w budżecie na 2014 rok. Większość inwestycji\
      \ w „big data” została skierowana na infrastrukturę obliczeniową. Każdy z pięciu\
      \ uniwersytetów założycielskich przekazał instytutowi po 5 milionów funtów<ref\
      \ name=\":1\">{{Cytuj stronę |url = https://www.ed.ac.uk/news/2015/turing-050815\
      \ |tytuł = Alan Turing Institute operations begin |data = 2016-03-28 |opublikowany\
      \ = The University of Edinburgh |język = en |data dostępu = 2023-02-14}}</ref>.\
      \ Dalsze finansowanie pochodziło głównie z dotacji od rad ds. badań naukowych,\
      \ partnerów uniwersyteckich oraz partnerstw strategicznych i innych<ref name=\"\
      :0\" />.\n\nW czerwcu 2021 roku EPSRC przyznało instytutowi w imieniu brytyjskiego\
      \ stowarzyszenia Research and Innovation 10 mln funtów na rok 2021/2022<ref>{{Cytuj\
      \ stronę |url = https://www.turing.ac.uk/news/alan-turing-institute-has-secured-ps10-million-new-funding-epsrc-behalf-ukri\
      \ |tytuł = The Alan Turing Institute has secured £10 million new funding from\
      \ EPSRC, on behalf of UKRI |opublikowany = The Alan Turing Institute |język\
      \ = en |data dostępu = 2024-01-31}}</ref>.\n[[Plik:Alan Turing az 1930-as években.jpg|alt=|mały|Instytut\
      \ został nazwany na cześć [[Alan Turing|Alana Turinga]]<ref name=\"alan\" />,\
      \ często uważanego za ojca [[Informatyka|informatyki]]]]\n\n== Historia ==\n\
      W 2015 roku [[Lloyd’s Register of Shipping|fundacja Lloyd’s Register]] została\
      \ pierwszym partnerem strategicznym instytutu, przekazując w ciągu pięciu lat\
      \ grant w wysokości 10 milionów funtów na wsparcie badań nad inżynieryjnymi\
      \ zastosowaniami [[Big data|dużych zbiorów danych]]<ref name=\":1\" /><ref>{{Cytuj\
      \ stronę |url = https://www.computerweekly.com/news/2240236674/Lloyds-Register-Foundation-apportions-Alan-Turing-Institute-10m\
      \ |tytuł = Lloyd’s Register Foundation grants £10m to Alan Turing Institute\
      \ {{!}} Computer Weekly |nazwisko = McKenna |imię = Brian |data = 2014-12-15\
      \ |opublikowany = ComputerWeekly.com |język = en |data dostępu = 2023-02-14}}</ref>.\n\
      \n* Howard Covington, przewodniczący 2015–2022.\n* Doug Gurr, przewodniczący\
      \ od 2022.\n* Sir Adrian Smith, prezes ([[CEO]]) w latach 2018–2023.\n* Jean\
      \ Innes, prezes ([[CEO]]) od lipca 2023 roku<ref>{{Cytuj stronę |url = https://www.turing.ac.uk/news/jean-innes-appointed-lead-alan-turing-institute\
      \ |tytuł = Jean Innes appointed to lead The Alan Turing Institute &#124; The\
      \ Alan Turing Institute}}</ref>.\n\nRolą instytutu jest dostarczanie wiedzy\
      \ specjalistycznej i badań podstawowych z zakresu analityki danych i sztucznej\
      \ inteligencji potrzebnych do rozwiązywania problemów w świecie rzeczywistym<ref\
      \ name=\":0\" />. W wykładach i dyskusjach organizowanych przez instytut uczestniczą\
      \ m.in. profesorowie polskiego pochodzenia: [[Aleksander Mądry]], [[Marta Kwiatkowska]]<ref\
      \ name=\"Instytut-Madry-Kwiatkowska\">{{Cytuj stronę |url = https://www.turing.ac.uk/people/guest-speakers/aleksander-madry\
      \ |tytuł = Professor Aleksander Madry |opublikowany = The Alan Turing Institute\
      \ |język = en |data dostępu = 2024-01-31}}</ref>.\n\nOd 2021 roku Instytut Alana\
      \ Turinga organizuje coroczne wydarzenie o nazwie AI UK<ref>{{Cytuj stronę |url\
      \ = https://ai-uk.turing.ac.uk/ |tytuł = The Alan Turing Institute – AI UK}}</ref>,\
      \ które określa się jako krajową wizytówkę nauki o danych i sztucznej inteligencji.\n\
      \n== Zobacz też ==\n* [[Test Turinga]]\n* [[Nagroda Turinga]]\n\n== Przypisy\
      \ ==\n{{Przypisy}}\n\n== Linki zewnętrzne ==\n* [https://turing-seminar.github.io\
      \ Theory and Algorithms in Data Science Seminar] – cykl dyskusji organizowanych\
      \ przez Instytut Alana Turinga.\n\n{{Kontrola autorytatywna}}\n\n[[Kategoria:Instytuty\
      \ według państw]]\n[[Kategoria:Informatyka]]\n[[Kategoria:Sztuczna inteligencja]]"
