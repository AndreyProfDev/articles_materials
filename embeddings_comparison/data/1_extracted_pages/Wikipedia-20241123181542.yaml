- sections:
  - content: '''''''Projektowanie eksperymentów'''''' (''''''planowanie doświadczeń'''''',
      ''''''teoria eksperymentu''''''; ang. ''''design of experiments'''', w skrócie
      DOE) – interdyscyplinarna dziedzina nauki znajdująca się na pograniczu [[Statystyka|statystyki]],
      [[Metrologia|metrologii]], [[Matematyka stosowana|matematyki stosowanej]] oraz
      [[Informatyka|informatyki]], mająca na celu dostarczenie odpowiedzi na pytanie
      o możliwość takiego zaplanowania doświadczenia ([[Eksperyment|eksperymentu]]
      lub [[Quasi-eksperyment|quasi-eksperymentu]]), aby uzyskać możliwie najwięcej
      użytecznych [[Informacja|informacji]] przy najmniejszych koniecznych do tego
      kosztach<ref>[https://media.statsoft.pl/_old_dnn/downloads/doe.pdf] J. Pietraszek,
      Planowanie doświadczeń - możliwość czy konieczność. StatSoft Polska, 2004.</ref>.


      Rozwój teorii eksperymentu związany był z założoną przez [[John Bennet Lawes|Johna
      Benneta Lawesa]] słynną rolniczą [[Rothamsted Research|Stację Eksperymentalną
      Rothamsted]] w [[Harpenden]]. W czasie kiedy jej dyrektorem był [[Edward John
      Russell]], w stacji zatrudniony został [[Ronald Fisher]] (autor pracy ''''The
      design of experiments'''' z 1935 r.) – kluczowa postać dla rozwoju zarówno statystyki,
      jak i dziedziny projektowania eksperymentów<ref>[https://mathshistory.st-andrews.ac.uk/Biographies/Fisher/]
      Ronald Fisher w MacTutor History of Mathematics Archive.</ref>. Od tego czasu
      stacja stała się instytucją w której pracowali badacze mający znaczny wpływ
      na rozwój planowania doświadczeń: [[Frank Yates]], [[Joseph Oscar Irwin]], [[John
      Wishart]], [[William Gemmell Cochran]] (współautor, wspólnie z [[Gertrude Mary
      Cox]], książki pt. ''''Experimental Designs'''' z 1950 r.) i [[John Nelder]].


