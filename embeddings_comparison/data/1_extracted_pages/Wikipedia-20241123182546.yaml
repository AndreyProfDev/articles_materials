- sections:
  - content: "'''Społeczeństwo''' – podstawowe pojęcie [[socjologia|socjologiczne]],\
      \ jednakże niejednoznacznie definiowane. Terminem tym tradycyjnie ujmuje się\
      \ dużą [[zbiorowość społeczna|zbiorowość społeczną]], zamieszkującą dane terytorium,\
      \ posiadające wspólną [[kultura|kulturę]], wspólną [[Tożsamość kulturowa|tożsamość]]\
      \ oraz sieć wzajemnych [[stosunek społeczny|stosunków społecznych]]. Społeczeństwo\
      \ ponadto posiada własne [[instytucja (socjologia)|instytucje]] pozwalające\
      \ mu na funkcjonowanie oraz formę organizacyjną w postaci [[państwo|państwa]],\
      \ [[naród|narodu]] lub [[plemię|plemienia]].\n\nTermin ten w mowie potocznej\
      \ często stosuje się dość swobodnie określając różne kategorie czy [[warstwa\
      \ społeczna|warstwy społeczne]] np. „społeczeństwo górników”, „społeczeństwo\
      \ nauczycieli”. Używa się go też na określenie całej żyjącej ludzkości, wówczas\
      \ używa się określenia [[społeczeństwo globalne]].\n\n== Typologia społeczeństw\
      \ ==\nZe względu na duże różnice pomiędzy współczesnymi i historycznymi społeczeństwami\
      \ wyróżnia się ze względu na stopień rozwoju społeczeństwa:\n* [[społeczeństwo\
      \ tradycyjne|tradycyjne]] \n* [[społeczeństwo przemysłowe|przemysłowe]] \n*\
      \ [[społeczeństwo postindustrialne|poprzemysłowe]]\n\nW przypadku społeczeństw\
      \ tradycyjnych, terminem tym określa się formy społeczeństw przedindustrialnych\
      \ i wyróżnia się różne formy ich rozwoju:\n* [[społeczeństwo acefaliczne]]\n\
      * [[społeczeństwo zbieracko-myśliwskie]]\n* [[społeczeństwo rolnicze]]\n* [[społeczeństwo\
      \ pierwotne]].\n\n[[Karol Marks]] wyróżniał dla tego okresu trzy następujące\
      \ po sobie formacje społeczne: formację ''wspólnoty pierwotnej'', formację [[niewolnictwo|niewolniczą]]\
      \ (formacja antyczna i [[azjatycki sposób produkcji|azjatycka]]) oraz formację\
      \ [[feudalizm|feudalną]].\n\nW okresie formowania się społeczeństw przemysłowych\
      \ powstawały takie jego określenia jak:\n* [[społeczeństwo masowe]]\n* [[społeczeństwo\
      \ obywatelskie]]\n* [[społeczeństwo otwarte]]\n* [[społeczeństwo nowoczesne]]\
      \ i [[społeczeństwo ponowoczesne|ponowoczesne]]\n* [[społeczeństwo pluralistyczne]]\n\
      * [[społeczeństwo wielokulturowe]]\n* [[społeczeństwo demokratyczne]]\n* [[społeczeństwo\
      \ komunistyczne]]\n* [[społeczeństwo totalitarne]]\n* [[Klasa społeczna|społeczeństwo\
      \ klasowe]]\n* [[społeczeństwo kapitalistyczne]]\n* [[społeczeństwo produkcyjne]]\n\
      * [[społeczeństwo miejskie]]\n* [[społeczeństwo wiejskie]].\n\nW przypadku społeczeństwa\
      \ poprzemysłowego, które powstawać zaczęło w drugiej połowie [[XX wiek]]u, używa\
      \ się też alternatywnych pojęć: \n* [[globalna wioska]] \n* [[społeczeństwo\
      \ informacyjne]] \n* [[społeczeństwo wiedzy]]\n* [[społeczeństwo mądrości]]\n\
      * [[społeczeństwo innowacyjne]]\n* [[społeczeństwo transgresyjne]]\n* [[społeczeństwo\
      \ ponowoczesne]]\n* [[społeczeństwo konsumpcyjne]]\n* [[społeczeństwo permisywne]]\n\
      * [[społeczeństwo ryzyka]]\n* [[społeczeństwo sieciowe]].\n\nW literaturze pojawia\
      \ się również określenie [[społeczeństwo zwierzęce|społeczeństwa zwierzęcego]]\
      \ na odróżnienie uspołecznionych zbiorowości ludzkich od nieuspołecznionych\
      \ zbiorowości tworzonych przez inne gatunki w ujęciu biologicznym.\n\n== Społeczeństwo\
      \ a technika ==\nIstnieją trzy sposoby pojmowania stosunków techniki ze społeczeństwem.\
      \ Pierwszy sposób polega na ukazaniu życia społecznego jako odbicia techniki\
      \ lub nawet mieszania mechanizmów instrumentalnych i ludzkości. Drugi sposób\
      \ jest rozwiązaniem idealizmu lub spirytualizmu, czyli totalnego oderwania ducha\
      \ od materii. Technika jawi się jako byt autonomiczny i złowróżbny lub jako\
      \ zwykła siła w służbie człowieka. Trzeci sposób polega na uznaniu stopnia zależności\
      \ lub obojętności świata ludzkiego względem techniki. Rozwiązanie to otwiera\
      \ drogę do nauk społecznych. Technika jawi się tutaj jako sposób bycia, tryb\
      \ istnienia<ref>{{Cytuj |autor = Eric Maigret |tytuł = Socjologia komunikacji\
      \ i mediów |data = 2012}}</ref>.\n\n== Zobacz też ==\n{{Siostrzane projekty\n\
      \ |news=Portal:Społeczeństwo\n |cytaty=Społeczeństwo\n |commons=Category:Society\n\
      \ |słownik=społeczeństwo\n}}\n* [[grupa społeczna]]\n* [[społeczność]]\n\n==\
      \ Przypisy ==\n{{Przypisy}}\n\n== Bibliografia ==\n* {{cytuj książkę |autor\
      \ = Jan Turowski | tytuł = Socjologia. Wielkie struktury społeczne| wydawca\
      \ = Towarzystwo Naukowe KUL | miejsce = Lublin | rok = 1994 }}\n* {{cytuj książkę\
      \ |autor = [[Jerzy Szacki (socjolog)|Jerzy Szacki]] | tytuł = Historia myśli\
      \ socjologicznej | wydawca = PWN | miejsce = Warszawa | rok = 2004 }}\n\n==\
      \ Linki zewnętrzne ==\n* {{SEP | url = social-ontology/ | autor = Brian Epstein\
      \ | tytuł = Social Ontology | data = 2018-03-21 | data dostępu = 2018-08-07\
      \ | tytuł polski = (Ontologia społeczna) }}\n\n{{Typy społeczeństw}}\n\n{{Kontrola\
      \ autorytatywna}}\n\n[[Kategoria:Społeczeństwo| ]]\n[[Kategoria:Podstawowe pojęcia\
      \ socjologiczne]]\n[[Kategoria:Typologia społeczeństw]]"
