- sections:
  - content: '[[Plik:Reach Toronto.jpg|thumb|Pomnik ku czci wielokulturowości ({{W
      języku|en|Monument to Multiculturalism}}) w [[Toronto]], [[Kanada]]]]

      ''''''Wielokulturowość'''''' ([[język angielski|ang.]] ''''multiculturalism'''')
      – obecność wielu różnorodnych [[kultura|kultur]] w obrębie jednego państwa lub
      polityka państwa wobec [[różnorodność kulturowa|różnorodności kulturowej]].
      Termin ma z jednej strony charakter opisowy, odnosi się do stanu faktycznego
      w wielu państwach, np. w Kanadzie, polegającego na istnieniu wielu różnych grup
      kulturowych, narodowych i religijnych w obrębie jednego państwa. Z drugiej strony
      wielokulturowość odnosi się do polityk prowadzonych przez państwa w celu wspierania
      i integrowania różnorodnych kultur funkcjonujących w obrębie jednego państwa
      (sens normatywny){{odn|Song|2016}}.


      Zwolennicy wielokulturowości w sensie normatywnym odrzucają ideał [[Tygiel narodów|tygla
      narodów]] ({{W języku|en|melting pot}}), w którym członkowie kultur mniejszościowych
      mają obowiązek asymilować się do jednej dominującej kultury. W jego miejsce
      postulują model, w którym wszystkie kultury, w tym te mniejszościowe mają prawo
      zachowywać swoją tożsamość i tradycje. Zwolennicy multikulturalizmu uznają,
      że tolerancja i akceptacja tożsamości kulturowej mniejszości nie wyklucza integracji
      imigrantów ze społeczeństwem, a wręcz umożliwia lepszą integrację, ponieważ
      gwarantuje równe i bardziej sprawiedliwe traktowanie każdego, niezależnie od
      pochodzenia{{odn|Song|2016}}.


      Politykę opartą na zasadzie oficjalnego uznania i wspierania wielokulturowości
      prowadzi od 1988 roku [[Kanada]]. W Europie można zaobserwować proces tworzenia
      się wielokulturowości od II połowy XX wieku w takich społeczeństwach jak [[Brytyjczycy|brytyjska]],
      [[Francuzi|francuska]] czy [[Niemcy (naród)|niemiecka]].


      == Geneza pojęcia ==

      [[Plik:Multiculturalismo.jpg|thumb|left|Dom z elementami ludzi z różnych państw,
      w tym Rosjan i Niemców, w [[Carambeí]] na [[Region Południowy (Brazylia)|południu
      Brazylii]], miasto o większości pochodzenia holenderskiego]]

      Pojęcie wielokulturowości stało się elementem debaty publicznej pod koniec lat
      60. i na początku lat 70. XX wieku, gdy dwa państwa, [[Australia]] i [[Kanada]],
      zadeklarowały poparcie dla tej idei{{odn|Rattansi|2011|s=7}}. Do tego czasu
      Australia dopuszczała jedynie imigracje osób rasy białej, w 1971 uznano konieczność
      stworzenia społeczeństwa wielokulturowego, a w 1973 roku zniesiono rasowe kryteria
      dla imigrantów{{odn|Rattansi|2011|s=8}}. Imigrantów zachęcano do integracji,
      a nie do asymilacji, co miało oznaczać, że przyjmują oni wzorce kultury australijskiej,
      ale zachowują elementy kultury pochodzenia{{odn|Rattansi|2011|s=8}}. W Kanadzie
      polityka wielokulturowości wynikała z konfliktów pomiędzy społecznością francuskojęzyczną
      i anglojęzyczną. W 1969 roku uznano, że w kraju będą obowiązywać dwa języki
      oficjalne i dwie kultury: francuska i angielska. Pojawiła się wówczas kwestia
      innych społeczności żyjących w Kanadzie, zwłaszcza ludności rodzimej ([[Metysi
      kanadyjscy]] i [[Inuici]]){{odn|Kijewska-Trembecka|2019}}. W 1988 oficjalnie
      uznano prawa innych kultur, uchwalono tzw. ustawę o wielokulturowości ({{W języku|en|Canadian
      Multiculturalism Act}}), Kanada została uznana za państwo wielu kultur{{odn|Rattansi|2011|s=8}}{{odn|Kijewska-Trembecka|2019}}.


      W Europie idea wielokulturowości pojawia się po raz pierwszy w polityce ramowej
      dotyczącej integracji imigrantów uchwalonej w Wielkiej Brytanii w 1966 roku.
      Dokument ten był odpowiedzią na napływ imigrantów spoza Europy. Definiuje on
      integrację imigrantów jako „kulturową różnorodność połączoną z równością szans
      i atmosferą wzajemnej tolerancji”{{odn|Rattansi|2011|s=9}}.


      == Rodzaje polityk wielokulturowych ==

      [[Plik:Chinatown.london.700px.jpg|mały|Chińska dzielnica w Londynie]]

      Badacze zarysowali 8 punktów, które pozwalają na identyfikację danej polityki
      państwowej jako polityki wielokulturowej i stopnia w jakim dana polityka stosuje
      zasadę wielokulturowości{{odn|Kymlicka|2006|s=56}}{{odn|Rattansi|2011|s=16}}.


      # Konstytucyjna, prawna lub parlamentarna afirmacja wielokulturowości na poziomie
      władzy centralnej i/lub lokalnej.

      # Zastosowanie wielokulturowości na poziomie programów szkolnych.

      # Uwzględnienie reprezentacji różnych kultur i narodowości w mediach publicznych
      lub w instytucjach licencjonujących media.

      # Wyjątki prawne dotyczące sposobu ubioru lub obchodzenia świąt (np. dotyczące
      pracy w niedzielę).

      # Zezwolenie na podwójne obywatelstwo.

      # Wsparcie finansowe państwa dla organizacji kulturalnych i narodowych innych
      nie-dominujących kultur.

      # Wsparcie dla edukacji dwujęzycznej lub edukacji w języku macierzystym.

      # [[Akcja afirmatywna]] dla grup dyskryminowanych.


      Jeśli dane państwo stosuje przynajmniej 6 z 8 polityk uznaje się, że jest to
      „mocny” multikulturalizm, te, które stosują od 3 do 5 punktów (gdzie ocena połowiczna
      oznacza stosowanie pewnych elementów danej polityki) oceniane są jako multikulturalizm
      „umiarkowany”. Te, które stosują mniej niż 3 punkty, są uznane za „słaby” multikulturalizm.
      Przyjmując te kryteria uznaje się, że następujące państwa reprezentują różne
      typy multikulturalizmu{{odn|Rattansi|2011|s=17}}.


