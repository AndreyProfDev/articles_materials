- sections:
  - content: "'''Interes publiczny''' – jest jedną z najważniejszych [[Klauzula generalna|klauzul\
      \ generalnych]] w [[System prawny Polski|prawodawstwie polskim]], ma bowiem\
      \ charakter konstytucyjny<ref>{{Cytuj |autor = Artur Żurawik |tytuł = „Interes\
      \ publiczny’’, ,,interes społeczny’’ i ,,interes społecznie uzasadniony’’. Pro´ba\
      \ dookres´- lenia poje˛c´ |czasopismo = Ruch Prawniczy, Ekonomiczny i Socjologiczny\
      \ |data = 2013 |data dostępu = 2024-05-12 |issn = 2543-9170 |wolumin = 75 |numer\
      \ = 2 |s = 57–69 |doi = 10.14746/rpeis.2013.75.2.5 |url = https://pressto.amu.edu.pl/index.php/rpeis/article/view/15901\
      \ |język = pl}}</ref>. Jako klauzula generalna jest pojęciem niedookreślonym,\
      \ nieposiadającym zwartej, zapisanej formuły na gruncie obowiązującego prawa<ref>{{Cytuj\
      \ |tytuł = II SA/Wa 488/10 - Wyrok WSA w Warszawie z 2010-07-13 |data dostępu\
      \ = 2024-05-12 |opublikowany = www.orzeczenia-nsa.pl |url = https://www.orzeczenia-nsa.pl/wyrok/ii-sa-wa-488-10/sprawy_z_zakresu_informacji_publicznej_i_prawa_prasowego_dostep_do/24ec1ab/3.html?q=&_haslo=Dostęp+do+informacji+publicznej&_sad=Wojewódzki+Sąd+Administracyjny+w+Warszawie&_skarzony=Prezes+Instytutu+Pamięci+Narodowej&_okres=2010_07}}</ref><ref\
      \ name=\":3\">{{Cytuj |tytuł = I OSK 2111/13 - Wyrok NSA z 2014-01-10 |data\
      \ dostępu = 2024-01-14 |opublikowany = www.orzeczenia-nsa.pl |url = https://www.orzeczenia-nsa.pl/wyrok/i-osk-2111-13/sprawy_z_zakresu_informacji_publicznej_i_prawa_prasowego_dostep_do/1383d50/24.html?_haslo=Dost%C4%99p+do+informacji+publicznej}}</ref>.\
      \ Pojęcie utożsamiane jest często z pojęciem „dobro wspólne”<ref name=\":1\"\
      \ />. W kontekście [[Interes|interesu]] definiowany jako potrzeby lub wartości\
      \ dotyczące społeczeństwa jako ogółu<ref name=\":4\">{{Cytuj |autor = Justyna\
      \ Michalska |tytuł = Znaczenie interesu publicznego w zakresie realizacji prawa\
      \ petycji |data = 2015 |data dostępu = 2024-05-12 |url = https://repozytorium.uni.wroc.pl/dlibra/publication/75124/edition/73258/znaczenie-interesu-publicznego-w-zakresie-realizacji-prawa-petycji-michalska-justyna}}</ref>\
      \ — jako przeciwieństwo interesu indywidualnego / prywatnego<ref name=\":2\"\
      >{{Cytuj |autor = Marta Tużnik |tytuł = Interes publiczny czy interes prywatny\
      \ w zasadzie in dubio pro tributario? |czasopismo = Studia Prawnoustrojowe |data\
      \ = 2017 |data dostępu = 2024-01-14 |issn = 1644-0412 |numer = 35 |s = 91–102\
      \ |opublikowany = Wydawnictwo Uniwersytetu Warmińsko-Mazurskiego w Olsztynie\
      \ |url = https://wpia.uwm.edu.pl/czasopisma/sites/default/files/uploads/Studia_Prawno_Ustrojowe/2017/35/91-102.pdf\
      \ |język = pl}}</ref><ref name=\":3\" /> – taki, który nie jest ograniczony\
      \ do pojedynczej jednostki czy grupy, ale ma na celu dobro / korzyść ogółu ludności<ref\
      \ name=\":0\">{{Cytuj |tytuł = Interes Publiczny: Wprowadzenie do Pojęcia {{!}}\
      \ Magazyn Moja Firma |data = 2023-07-10 |data dostępu = 2024-01-14 |url = https://magazynmojafirma.pl/interes-publiczny-wprowadzenie-do-pojecia\
      \ |język = pl-PL}}</ref><ref name=\":3\" />. Odnosi się do wartości, które są\
      \ wspólne i ważne dla całego [[Społeczeństwo|społeczeństwa]] takie jak [[sprawiedliwość]],\
      \ [[wolność]], [[bezpieczeństwo]], pokój, [[niepodległość]] i [[suwerenność]]\
      \ państwa, [[zdrowie publiczne]], utrzymanie równowagi finansowej systemu zabezpieczenia\
      \ społecznego, ochrona konsumentów, usługobiorców i pracowników, uczciwość w\
      \ transakcjach handlowych, zwalczanie nadużyć, [[Ochrona środowiska|ochrona\
      \ środowiska naturalnego]] i miejskiego, zdrowie zwierząt, [[własność intelektualna]],\
      \ cele [[Polityka społeczna|polityki społecznej]] i [[Polityka kulturalna|kulturalnej]]\
      \ oraz ochrona narodowego dziedzictwa historycznego i artystycznego, zaufanie\
      \ obywateli do organów władzy, [[prawa człowieka]] i [[Prawa obywatelskie|obywatela]]<ref\
      \ name=\":1\">{{Cytuj |tytuł = Interes publiczny – Encyklopedia Administracji\
      \ Publicznej |data dostępu = 2024-01-14 |opublikowany = encyklopediaap.uw.edu.pl\
      \ |url = http://encyklopediaap.uw.edu.pl/index.php/Interes_publiczny}}</ref>.\
      \ Jest to cel, który służy dobrobytowi i harmonijnemu funkcjonowaniu społeczeństwa<ref\
      \ name=\":0\" />. Jest to kategoria normatywna określania przesłanek w hipotezach\
      \ lub dyspozycjach wielu przepisów z różnych dziedzin życia społeczno–gospodarczego.\
      \    \n\nTermin jest wykorzystywany w [[Akt prawny|aktach prawnych]]<ref name=\"\
      :4\" /><ref>{{Cytuj |redaktor = Ryszard Balicki, Mariusz Jabłoński |tytuł =\
      \ Teoretyczne i praktyczne aspekty realizacji prawa petycji |data = 2015 |data\
      \ dostępu = 2024-05-13 |isbn = 978-83-61370-63-5 |opis = e-Monografie |miejsce\
      \ = Wrocław |wydawca = E-Wydawnictwo. Prawnicza i Ekonomiczna Biblioteka Cyfrowa.\
      \ Wydział Prawa, Administracji i Ekonomii Uniwersytetu Wrocławskiego}}</ref><ref>{{Cytuj\
      \ |tytuł = Interes publiczny - Słownik pojęć - mikroPorady.pl - Biznesowe wsparcie\
      \ z najlepszej strony |data dostępu = 2024-01-14 |opublikowany = mikroporady.pl\
      \ |url = https://mikroporady.pl/slownik-pojec/interes-publiczny |język = pl}}</ref>\
      \ — wyrażony między innymi w [[Konstytucja Rzeczypospolitej Polskiej|Konstytucji\
      \ Rzeczypospolitej Polskiej]] (art. 17 ust. 1, 22, 63, 213 ust. 1)<ref name=\"\
      :2\" />. Wprost do pojęcia interesu publicznego odwołuje się także art. 3 pkt\
      \ 1 ustawa z 6 września 2001 r. o dostępie do informacji publicznej (Dz.U z\
      \ 2018 r. Nr 1330), czy w art. 3 ust. 2 ustawy o zagospodarowaniu przestrzennym\
      \ (Dz.U z 2018 r. Nr 1945 ze zm.). W ostatnio wskazanym akcie zawarta jest także\
      \ definicja  interesu publicznego. Zgodnie z nią przez interes publiczny należy\
      \ rozumieć uogólniony cel dążeń i działań, uwzględniających zobiektywizowane\
      \ potrzeby ogółu społeczeństwa lub lokalnych społeczności, związanych z zagospodarowaniem\
      \ przestrzennym (art. 2 pkt 4)<ref>{{Cytuj |tytuł = Interes publiczny/społeczny\
      \ (encyklopedyczny) – Wiedza i Edukacja Obywatelska |data dostępu = 2024-05-13\
      \ |url = http://wiep.pl/interes-publiczny-spoleczny-encyklopedyczny/ |język\
      \ = pl-PL}}</ref>.    \n\nOchronę interesu publicznego zapewniają przepisy [[Kodeks\
      \ karny|kodeksu karnego]] w art. 231, wspominając obowiązki ochrony interesu\
      \ publicznego przez [[Funkcjonariusz publiczny|funkcjonariuszy publicznych]],\
      \ między innymi posłów, senatorów, radnych. Według tego artykułu funkcjonariusz\
      \ publiczny, który, przekraczając swoje uprawnienia lub nie dopełniając obowiązków,\
      \ działa na szkodę interesu publicznego, podlega karze<ref>{{Cytuj |tytuł =\
      \ Nadużycie uprawnień przez funkcjonariusza publicznego |data dostępu = 2024-05-13\
      \ |opublikowany = www.adwokat-skoczylas.pl |url = https://www.adwokat-skoczylas.pl/blog/naduzycie-uprawnien-przez-funkcjonariusza-publicznego\
      \ |język = pl}}</ref>. \n\n== Przypisy ==\n{{Przypisy}}\n\n{{Kontrola autorytatywna}}\n\
      \n[[Kategoria:Społeczeństwo]]"
