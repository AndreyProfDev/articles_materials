- sections:
  - content: "'''Koszty społeczne''' – [[Koszt (ekonomia)|koszt]] ponoszony przez\
      \ całe [[społeczeństwo]]<ref>{{encyklopedia PWN |id = 3926347 |tytuł = koszt\
      \ społeczny |data dostępu = 2023-03-15}}</ref>. [[Termin]] ten jest różnie interpretowany\
      \ przez samych zajmujących się tym tematem<ref name=\":0\">{{Cytuj |tytuł =\
      \ Koszt społeczny |data dostępu = 2023-03-15 |opublikowany = Encyklopedia Zarządzania\
      \ |url = https://mfiles.pl/pl/index.php/Koszt_spo%C5%82eczny |język = pl}}</ref>.\
      \ W literaturze z obszaru [[Rachunkowość|rachunkowości]] używa się różnych terminów\
      \ na opisanie kosztów o charakterze społecznym i środowiskowym: koszty zewnętrzne<ref\
      \ name=\":1\">{{Cytuj |autor = Dominik Jasinski, James Meredith, Kerry Kirwan\
      \ |tytuł = A comprehensive review of full cost accounting methods and their\
      \ applicability to the automotive industry |czasopismo = Journal of Cleaner\
      \ Production |data = 2015-12 |data dostępu = 2023-03-15 |wolumin = 108 |s =\
      \ 1123–1139 |doi = 10.1016/j.jclepro.2015.06.040 |url = https://linkinghub.elsevier.com/retrieve/pii/S0959652615007696\
      \ |język = en}}</ref><ref name=\":2\">{{Cytuj |autor = Cornelia Dascalu, Chirata\
      \ Caraiani, Camelia Iuliana Lungu, Florian Colceag, Gina Raluca Guse |tytuł\
      \ = The externalities in social environmental accounting |czasopismo = International\
      \ Journal of Accounting & Information Management |data = 2010-01-01 |data dostępu\
      \ = 2023-03-15 |issn = 1834-7649 |wolumin = 18 |numer = 1 |s = 19–30 |doi =\
      \ 10.1108/18347641011023252 |url = https://www.researchgate.net/publication/46545238_The_externalities_in_social_environmental_accounting\
      \ |język = en}}</ref><ref name=\":0\" />, n''egatywne efekty zewnętrzne''<ref>{{Cytuj\
      \ |autor = Fredrik Hartwig, Jonas Kågström, Arne Fagerström |tytuł = Sustainability\
      \ Accounting for Externalities |czasopismo = Sustainability: The Journal of\
      \ Record |data = 2019-06 |data dostępu = 2023-12-22 |issn = 1937-0695 |wolumin\
      \ = 12 |numer = 3 |s = s. 159 |doi = 10.1089/sus.2019.0009 |url = https://www.researchgate.net/publication/335383302_Sustainability_Accounting_for_Externalities\
      \ |język = en}}</ref><ref name=\":4\">{{Cytuj |autor = Jeffrey Unerman, Jan\
      \ Bebbington, Brendan O’dwyer |tytuł = Corporate reporting and accounting for\
      \ externalities |czasopismo = Accounting and Business Research |data = 2018-07-29\
      \ |data dostępu = 2023-12-22 |issn = 0001-4788 |wolumin = 48 |numer = 5 |s =\
      \ s. 500 |doi = 10.1080/00014788.2018.1470155 |url = https://www.researchgate.net/publication/325565534_Corporate_reporting_and_accounting_for_externalities\
      \ |język = en}}</ref>, ''negatywne społeczne efekty zewnętrzne''<ref name=\"\
      :4\" /> lub po prostu ''koszty społeczne''<ref name=\":2\" /><ref name=\":3\"\
      >{{Cytuj |autor = Ewelina Kuberska |tytuł = Koszt społeczny w rachunkowości\
      \ |czasopismo = Zeszyty Naukowe Uniwersytetu Ekonomicznego w Krakowie / Cracow\
      \ Review of Economics and Management |data = 2021-03-30 |data dostępu = 2023-03-15\
      \ |issn = 1898-6447 |numer = 4(988) |s = 7–24 |doi = 10.15678/ZNUEK.2020.0988.0401\
      \ |url = https://zeszyty-naukowe.uek.krakow.pl/article/view/2079 |język = pl}}</ref>.\
      \ Inna definicja opisuje je jako szkody bądź negatywne efekty wynikające z działań\
      \ bądź podejmowanych decyzji jednostki gospodarczej ponoszone przez jednostki\
      \ z tym niezwiązane<ref>{{Cytuj |autor = Dominik Jasinski, James Meredith, Kerry\
      \ Kirwan |tytuł = A comprehensive review of full cost accounting methods and\
      \ their applicability to the automotive industry |czasopismo = Journal of Cleaner\
      \ Production |data = 2015-12 |data dostępu = 2023-12-22 |wolumin = 108 |s =\
      \ s. 1124 |doi = 10.1016/j.jclepro.2015.06.040 |url = https://www.researchgate.net/publication/278795450_A_Comprehensive_Review_of_Full_Cost_Accounting_Methods_and_their_Applicability_to_the_Automotive_Industry\
      \ |język = en}}</ref><ref name=\":1\" />. Według definicji {{link-interwiki\
      \ |William Kapp |tekst=Williama Kappa |Q=Q89061}} termin \"'koszty społeczne\
      \ ''odnosi się do wszystkich szkodliwych następstw i uszczerbków, które ponoszą\
      \ osoby trzecie lub społeczeństwo w rezultacie procesów produkcji i za które\
      \ nie jest łatwo obarczyć odpowiedzialnością poszczególne podmioty prawna i\
      \ fizyczne''”<ref>{{Cytuj |autor = Emma Coolen |tytuł = Book Review: The Slave\
      \ Trade Debate: Contemporary Writings For and Against; introduction by John\
      \ Pinfold. Oxford: Bodleian Library, 2007. 398 pp. ISBN 978-1-85124-316-7. £12.99.\
      \ - The Memoirs of Captain Hugh Crow: the Life and Times of a Slave Trade Captain;\
      \ introduction by John Pinfold. Oxford: Bodleian Library, 2007. xxiv, 198 pp.\
      \ ISBN 978-1-85124-321-1. £15.99. |czasopismo = African Research &amp; Documentation\
      \ |data = 2007 |data dostępu = 2023-03-15 |isbn = 978-1-85124-316-7 |issn =\
      \ 0305-862X |wolumin = 105 |s = 82–83 |opublikowany = Cambridge University Library\
      \ |doi = 10.1017/s0305862x0002375x |url = https://www.researchgate.net/publication/326305272_The_Social_Costs_of_Neoliberalism_-_Essays_on_the_Economics_of_K_William_Kapp\
      \ |język = en}}</ref>. \n\nZalicza się do nich: degradację środowiska, hałas\
      \ i skutki estetyczne, resztkowe emisje do powietrza i wody, długoterminowe\
      \ usuwanie odpadów, za które firmy nie ponoszą odpowiedzialności prawnej, oraz\
      \ niekorzystny wpływ na ludzi, ich własność i dobrobyt, nieskompensowane skutki\
      \ zdrowotne, zmianę lokalnej jakości życia, którą nie zawsze można zrównoważyć\
      \ za pomocą systemów prawnych<ref name=\":2\" /><ref name=\":3\" />.   \n\n\
      Określenie w ekonomii obejmuje wszystkie bezpośrednie i pośrednie straty poniesione\
      \ przez osoby trzecie lub całe społeczeństwo w rezultacie [[Działalność gospodarcza|działalności\
      \ ekonomicznej]] poszczególnych przedsiębiorstw<ref name=\":0\" />.\n\n== Przykład\
      \ kosztów społecznych ==\n=== Społeczne koszty stosowania kary pozbawienia wolności\
      \ ===\nDo społecznych kosztów stosowania wobec przestępców kary pozbawienia\
      \ wolności należą:\n\n* bezpośrednie koszty budowy oraz utrzymania więzienia,\n\
      * koszty personelu,\n* koszty alternatywy utraconej wydajności uwięzionych ludzi<ref>{{Cytuj\
      \ |autor = Robert Cooter |tytuł = Ekonomiczna analiza prawa |data = 2011 |data\
      \ dostępu = 2023-03-15 |isbn = 978-83-255-2726-6 |wydanie = Wyd. 2, popr |miejsce\
      \ = Warszawa |wydawca = Wydawnictwo C. H. Beck |s = s. 165-166 |oclc = 802690114\
      \ |url = https://wydawnictwo.ue.poznan.pl/books/978-83-8211-112-5/978-83-8211-112-5.pdf}}</ref>.\n\
      \n=== Społeczne koszty wstrzymania budowy obwodnicy Augustrowa ===\nPoliczono\
      \ także koszty społeczne, a więc te, które poniesie określona grupa ludzi, głównie\
      \ użytkowników tych dróg oraz mieszkańców Wasilkowa i Augustowa. Liczono je\
      \ jako utratę korzyści związanych z korzystaniem z obwodnicy, wynikających ze\
      \ zmniejszenia kosztów eksploatacji pojazdów, czasu przejazdu, emisji zanieczyszczeń\
      \ i hałasu na terenie zabudowanym, wypadków drogowych i ofiar, a także z obniżenia\
      \ wartości nieruchomości. Tak rozumiane koszty społeczne wstrzymania na jeden\
      \ rok budowy obwodnicy Wasilkowa wynoszą co najmniej 48 mln zł, zaś obwodnicy\
      \ Augustowa – 98 mln zł. Koszty społeczne związane ze zmianą przebiegu drogi\
      \ – opracowanie dokumentacji, wywłaszczenie i budowa drogi – szacowane dla obwodnicy\
      \ Wasilkowa, przy pięciu latach opóźnienia, wyniosą 188,5 mln zł, a dla obwodnicy\
      \ Augustowa, przy siedmiu latach opóźnienia (inna skala wywłaszczeń) – 2208\
      \ mln zł. Tyle społeczeństwo kosztuje wąskie, obiektowo-konserwatorskie, a nie\
      \ procesowe podejście do ochrony środowiska<ref>{{Cytuj |autor = pk_admin_4niTZf8\
      \ |tytuł = Koszty społeczne |data dostępu = 2023-03-15 |opublikowany = PortalKomunalny.pl\
      \ |url = https://portalkomunalny.pl/plus/artykul/koszty-spoleczne/ |język =\
      \ pl-PL}}</ref>.\n\n=== Koszty społeczne nadużywania alkoholu w Polsce ===\n\
      Państwowa Agencja Rozwiązywania Problemów Alkoholowych wyceniła koszty społeczno-ekonomiczne\
      \ wynikające z nadużycia alkoholu przez Polaków aż na 30,9 mln zł rocznie. przedwczesna\
      \ śmiertelność. Według PARPA, tylko w tym wypadku koszty wynoszą 25,8 mld zł.\
      \ Dla żadnej innej kategorii skutków nie przekraczają one 1 mld zł.<ref>{{Cytuj\
      \ |tytuł = Ponad 30 mld zł wynoszą koszty społeczne nadużywania alkoholu w Polsce\
      \ |data dostępu = 2023-03-15 |opublikowany = Wiadomości Handlowe |url = https://www.wiadomoscihandlowe.pl/artykul/ponad-30-mld-zl-wynosza-koszty-spoleczne-naduzywania-alkoholu-w-polsce\
      \ |język = en}}</ref>\n\n=== Społeczny koszt węgla ===\nSpołeczny koszt węgla\
      \ (SCC) to krańcowy koszt skutków spowodowanych emisją jednej dodatkowej tony\
      \ gazu cieplarnianego (ekwiwalent dwutlenku węgla) w dowolnym momencie, obejmujący\
      \ \"nierynkowe\" skutki dla środowiska i zdrowia ludzkiego<ref>{{Cytuj |tytuł\
      \ = AR4 WGII Chapter 20: Perspectives on Climate Change and Sustainability -\
      \ 20.6 Global and aggregate impacts |data = 2011-11-07 |data dostępu = 2023-03-15\
      \ |opublikowany = web.archive.org |url = https://web.archive.org/web/20111107145417/http://www.ipcc.ch/publications_and_data/ar4/wg2/en/ch20s20-6.html}}</ref>.\
      \  Celem ustalenia ceny za tonę emitowanego CO2 jest pomoc decydentom lub innym\
      \ ustawodawcom w ocenie, czy polityka mająca na celu ograniczenie zmian klimatu\
      \ jest uzasadniona. Społeczny koszt emisji dwutlenku węgla to kalkulacja skoncentrowana\
      \ na podejmowaniu działań naprawczych w zakresie zmian klimatu, które można\
      \ uznać za formę zawodności rynku<ref>{{Cytuj |tytuł = Social Cost of Carbon\
      \ 101 |data dostępu = 2023-03-15 |opublikowany = Resources for the Future |url\
      \ = https://www.rff.org/publications/explainers/social-cost-carbon-101/ |język\
      \ = en-US}}</ref>.  Najnowsze badania szacują koszty ponad 300 USD za tonę CO\
      \ 2 (/tCO2)<ref>{{Cytuj |autor = Jarmo S Kikstra, Paul Waidelich, James Rising,\
      \ Dmitry Yumashev, Chris Hope, Chris M Brierley |tytuł = The social cost of\
      \ carbon dioxide under climate-economy feedbacks and temperature variability\
      \ |czasopismo = Environmental Research Letters |data = 2021-09-01 |data dostępu\
      \ = 2023-03-15 |issn = 1748-9326 |wolumin = 16 |numer = 9 |s = 094037 |doi =\
      \ 10.1088/1748-9326/ac1d0b |url = https://iopscience.iop.org/article/10.1088/1748-9326/ac1d0b}}</ref>.\
      \  Międzyrządowy Zespół ds. Zmian Klimatu zasugerował, że cena emisji dwutlenku\
      \ węgla ze 135 USD do 5 500 USD / tCO2 w 2030 r. i z 245 USD do 13 000 USD w\
      \ 2050 r. (2010 USD) byłaby potrzebna, aby doprowadzić do emisji dwutlenku węgla,\
      \ aby utrzymać się poniżej limitu 1,5 ° C. \n\n== Przypisy ==\n{{Przypisy}}\n\
      \n== Zobacz także ==\n\n* [[Efekty zewnętrzne]]\n* [[Problem kosztów społecznych]]\n\
      \n{{Kontrola autorytatywna}}\n\n[[Kategoria:Teoria ekonomii]]\n[[Kategoria:Koszty]]\n\
      [[Kategoria:Społeczeństwo]]\n[[Kategoria:Rachunkowość]]"
