      == Wielokulturowość w różnych państwach ==

      === USA ===

      [[Stany Zjednoczone]] są jednym z przykładów krajów wielokulturowych. Napływ
      [[imigrant]]ów z różnych stron świata spowodował powstanie mieszanki etnicznej,
      jak i mieszanki poglądów np. w USA zrodziło się [[chrześcijaństwo]] liberalne,
      jak i fundamentalne o skrajnie konserwatywnych poglądach (popierających [[chrześcijański
      rekonstrukcjonizm]]).


      === Kanada ===

      [[Plik:Chinatown toronto spadina avenue.JPG|thumb|left|Chinatown w [[Toronto]]]]

      [[Kanada]] jest postrzegana jako wzorcowy kraj wielokulturowy. Wielokulturowość
      to oficjalna polityka rządu federalnego od 1988 roku (uchwalenie ustawy o wielokulturowości){{odn|Rattansi|2011|s=8}}.
      W 2016 roku wg oficjalnych danych w kraju mieszkali przedstawiciele 250 grup
      etnicznych, którzy mówili ok. 200 różnymi językami{{odn|Kijewska-Trembecka|2019}}.
      Kraj stał się wielokulturowy w XX wieku. W 1871 roku 84% imigrantów w Kanadzie
      pochodziło z Wysp Brytyjskich{{odn|Kijewska-Trembecka|2019}}. Do 1967 roku Kanada
      zezwalała na przyjazd jedynie osobom z USA i Europy. Imigracja spoza Europy
      i USA pojawiła się w latach 70{{odn|Kijewska-Trembecka|2019}}.


      Grupy etniczne otrzymują szeroką pomoc finansową i merytoryczną od władz federalnych
      i często prowincjonalnych. W ramach gabinetu rządowego istnieje osobna teka
      ministerialna ds. wielokulturowości. Popierane jest prywatne szkolnictwo w językach
      innych niż oficjalne i istnieje możliwość zakwalifikowania programów takich
      szkół w ramach prowincjonalnych systemów szkół podstawowych i średnich. Przykładem
      tego może być polonijna szkoła im. Henryka Sienkiewicza w [[Edmonton]]ie, w
      prowincji [[Alberta]]<ref>Andrzej M. Kobos, ''''[http://www.abheritage.ca/albertans/articles/maria_chrzanowska.html
      Maria Chrzanowska: Polish Education Takes Root in Edmonton]'''' [on-line], [w:]
      Alberta Online Encyclopedia [dostęp 2009-10-14].</ref>. Organizowane są tzw.
      festiwale etniczne, podczas których różne grupy prezentują swoje kultury i tradycje{{odn|Kijewska-Trembecka|2019}}.
      W mediach promowane są różne kultury, rząd troszczy się o równą obecność przedstawicieli
      różnych kultur w mediach{{odn|Kijewska-Trembecka|2019}}. W latach 80. uchwalono
      prawo zakazujące dyskryminacji w miejscu pracy{{odn|Kijewska-Trembecka|2019}}.


      {{Zobacz też|Kultura Kanady|Kanadyjska Karta Praw i Swobód}}


      === Niemcy ===

      [[Plik:Bundesarchiv Bild 183-01986-09083, Schwarza, kubanische Gastarbeiterin.jpg|thumb|upright=0.7|Pracowniczka
      gościnna (''''[[Gastarbeiter]]'''') z [[Kuba|Kuby]] pracująca w Fabryce w [[Niemiecka
      Republika Demokratyczna|NRD]]]]

      Multikulturalizm nigdy nie był oficjalną polityką rządu niemieckiego i nie budził
      uznania społeczeństwa niemieckiego. Nie był popierany przez niemieckie partie
      polityczne, z wyjątkiem [[Sojusz 90/Zieloni|Zielonych]], którzy w swoim programie
      jako jedyni pozytywnie odnoszą się do różnorodności kulturowej{{odn|Rattansi|2011|s=36}}.
      Na skutek imigracji zarobkowej do Niemiec kraj stał się jednak de facto wielokulturowy{{odn|Kraus|Schönwälder|2006|s=210}}.
      W 2017 roku w Niemczech zamieszkiwało ponad 19 mln osób z tłem migracyjnym,
      co stanowi 23% ludności Niemiec<ref>{{Cytuj stronę |url=https://www.destatis.de/DE/Themen/Gesellschaft-Umwelt/Bevoelkerung/Migration-Integration/Tabellen/liste-migrationshintergrund-geschlecht.html
      |tytuł=Bevölkerung nach Migrationshintergrund und Geschlecht |język=de |opublikowany=destatis.de
      |data dostępu=2019-04-22}}</ref>. Największe grupy z tłem migracyjnym to osoby
      pochodzące z Turcji (2,7 mln), Polski (2,1 mln) i Rosji (1,3 mln)<ref>{{Cytuj
      stronę |url=https://www.destatis.de/DE/Themen/Gesellschaft-Umwelt/Bevoelkerung/Migration-Integration/Tabellen/migrationshintergrund-staatsangehoerigkeit-staaten.html
      |tytuł=Bevölkerung in Privathaushalten 2017 nach Migrationshintergrund |język=de
      |opublikowany=destatis.de |data dostępu=2019-04-22}}</ref>.


      Tradycja niemiecka na początku XX wieku i po II wojnie uznawała, że przynależność
      do narodu niemieckiego jest dostępna tylko dla osób, których rodzice są Niemcami.
      Z tego względu imigranci spoza Europy, którzy przybywali do Niemiec po II wojnie
      światowej nie mieli szans na uzyskanie obywatelstwa. Po drugiej wojnie światowej
      do Niemiec na masową skalę przybywali imigranci ze wschodu ([[Niemiecka Republika
      Demokratyczna|NRD]], Europa Wschodnia). Byli oni jednak uznawani za Niemców,
      ponieważ mieli niemieckie korzenie{{odn|Jarausch|2013|s=425}}. Emigracja ze
      wschodnich Niemiec została zatrzymana przez budowę [[Mur Berliński|muru]]{{odn|Jarausch|2013|s=425}}.


      Ze względu na brak rąk do pracy rząd niemiecki został zmuszony do zawarcia umów
      z innymi państwami, w których regulował zasady rekrutacji zagranicznych pracowników
      (umowa z Włochami 1955, Grecją 1960, Turcją 1961){{odn|Jarausch|2013|s=425}}.
      Przybywający pracownicy byli traktowani jako [[Gastarbeiter]]zy, a więc osoby
      przybywające tymczasowo, nie wymagające integracji z niemiecką społecznością{{odn|Rattansi|2011|s=36}}.
      Większość pracowników była rekrutowana do prac nie wymagających wykształcenia,
      do których najtrudniej było znaleźć pracowników w Niemczech, po zakończeniu
      kontraktów mieli oni wrócić do krajów pochodzenia. Pracownicy osiadali na ogół
      w specjalnych hotelach robotniczych{{odn|Jarausch|2013|s=425}}. W 1973 roku
      w Niemczech było już 14 milionów imigrantów, 11 mln wyjechało z kraju w latach
      70. na skutek kryzysu gospodarczego, 3 mln Turków pozostało jednak w kraju{{odn|Rattansi|2011|s=36}}.
      W kolejnych latach liczba imigrantów rosła i w 2011 roku liczba osób urodzonych
      za granicą wynosiła 9% populacji{{odn|Rattansi|2011|s=36}}. Pierwsze zmiany
      w prawie dotyczącym obywatelstwa uznające, że Niemcy są krajem imigrantów poczyniono
      w latach 90. XX wieku, a następnie w 2005 roku{{odn|Rattansi|2011|s=36}}.


      Imigracja tymczasowych pracowników osiadała głównie w dużych w miastach, imigranci
      osiadali na ogół w wybranych dzielnicach, co było wymuszone nieznajomością niemieckiego.
      W 1981 roku we [[Frankfurt nad Menem|Frankfurcie]] na 1000 mieszkańców przypadało
      232 cudzoziemców, w [[Stuttgart|Stutttgarcie]] 181 cudzoziemców na 1000 mieszkańców,
      a w [[Monachium]] 173 na 1000{{odn|Jarausch|2013|s=427}}. Imigranci z [[Jugosławia|Jugosławii]],
      [[Włochy|Włoch]] i innych państw europejskich byli na ogół akceptowani, imigranci
      z [[Turcja|Turcji]] uznawani za „niezdolnych do integracji”{{odn|Jarausch|2013|s=427}}.
      W latach 80. XX wieku imigracja budziła niezadowolenie społeczne, w badaniach
      społecznych ustalono, że 4/5 mieszkańców RFN zgadzało się ze stwierdzeniem:
      „mamy obecnie zbyt wielu cudzoziemców” i domagało się ograniczenia imigracji{{odn|Jarausch|2013|s=428}}.
      Z drugiej strony dzieci imigrantów spotykały się z dyskryminacją i licznymi
      problemami wynikającymi m.in. z niedostatecznej znajomości [[Język niemiecki|języka
      niemieckiego]], 2/3 dzieci pracowników tymczasowych (Gastarbeiterów) nie kończyło
      szkoły{{odn|Jarausch|2013|s=429}}.


      Pod wpływem niechęci do imigracji konserwatywny rząd [[Helmut Kohl|Helmuta Kohla]]
      propagował hasło: „łódź jest pełna” i oferował cudzoziemcom specjalne talony
      w wysokości 10 500 marek na podróż powrotną do kraju pochodzenia. Około 140
      tys. cudzoziemców wyjechało także w ramach programu wcześniejszych emerytur
      dla imigrantów. Wprowadzono także ograniczenia w programie łączenia rodzin i
      w prawie do [[azyl]]u{{odn|Jarausch|2013|s=430}}. Na krótko obniżyło to nieco
      liczbę cudzoziemców, ale wzrost gospodarczy i brak pracowników w latach 80.
      spowodował, że firmy ponownie zaczęły sprowadzać cudzoziemców{{odn|Jarausch|2013|s=430}}.


      W połowie października 2010 roku kanclerz Niemiec, [[Angela Merkel]] na spotkaniu
      z młodymi działaczami CDU stwierdziła, że ''''polityka multikulti poniosła kompletną
      klęskę''''. Kanclerz Niemiec powiedziała, że ''''w praktyce teoria społeczeństwa
      wielokulturowego nie sprawdziła się''''. Dotyczyć to ma szczególnie mniejszości
      muzułmańskiej. Również [[Horst Seehofer]], lider bawarskiej CSU powiedział,
      że ''''imigranci z krajów arabskich i Turcji nie chcą się integrować''''. ''''Mulikulti
      nie żyje'''' – stwierdził Seehofer<ref>{{Cytuj |url=http://www.bbc.co.uk/news/world-europe-11559451
      |tytuł=Merkel says German multicultural society has failed – BBC News<!-- Tytuł
      wygenerowany przez bota --> |opublikowany=www.bbc.co.uk |język=en |data dostępu=2017-11-27}}</ref>.


      Wypowiedzi niemieckich polityków można odczytywać jako wyraz braku poparcia
      dla polityki multikulturalizmu.


      === Francja ===

      [[Plik:Isabelle Adjani Cannes 2018.jpg|thumb|left|[[Isabelle Adjani]], córka
      imigranta z [[Algieria|Algierii]]]]

      Po 1945 roku do Francji zaczęli przybywać imigranci z dawnych kolonii francuskich
      w Afryce Północnej. Odróżniali się oni od poprzednich fal imigrantów m.in. Polski,
      Rosji czy Hiszpanii ze względu na kolor skóry i wyznanie (islam){{odn|Rattansi|2011|s=32}}.
      W 1969 komisja ekspertów uznała, że robotnicy z [[Maghreb]]u mają być traktowani
      wyłącznie jako pracownicy tymczasowi, a ich przybycie do Francji i pobyt w tym
      kraju mają być ściśle kontrolowane przez państwo na podstawie umów międzynarodowych
      z państwami pochodzenia imigrantów{{odn|Rattansi|2011|s=32}}. Zarówno prawica,
      jak i lewica (partia komunistyczna) uznawała, że imigranci powinni powrócić
      do krajów pochodzenia po zakończeniu czasowego pobytu. W tym celu dzieci imigrantów
      były uczone arabskiego w szkołach{{odn|Rattansi|2011|s=33}}. W 1974 uchwalono
      ustawę zakazującą jakiejkolwiek imigracji do Francji spoza Europy{{odn|Rattansi|2011|s=33}}.
      W 1981 roku zakaz został zniesiony, przyznano także imigrantom z Afryki Północnej
      prawo do tworzenia własnych stowarzyszeń kulturalnych (prawa takie od dawna
      posiadali imigranci z Europy, np. z Polski){{odn|Rattansi|2011|s=34}}.


      W latach 70. Francja wrogo odnosiła się do idei wielokulturowości polegającej
      na afirmacji różnorodności kulturowej i narodowej{{odn|Rattansi|2011|s=31}}.
      Postawę wobec różnorodności kulturowej determinuje idea [[Laicyzm|laickości]].
      We Francji istnieją dwa rozumienia laickości. Jedno z nich wyklucza afirmacje
      różnorodności kulturowej, oznacza bowiem, że przedstawiciele mniejszości religijnych
      nie powinni mieć prawa do publicznych modłów, noszenia określonych, religijnie
      umotywowanych, nakryć głowy, odmawiania konsumpcji niektórych rodzajów żywności
      w szkolnych restauracjach itd{{odn|Rattansi|2011|s=31}}. Z drugiej strony zwolennicy
      wielokulturowości interpretują laickość w bardziej łagodny sposób. Twierdzą,
      że laickość oznacza wolność do wyrażania własnej tożsamości w szkole i sferze
      publicznej w takim stopniu, w jakim nie stanowi to zagrożenia dla innych{{odn|Rattansi|2011|s=32}}.


      Wielokulturowość jest we Francji przedmiotem krytyki. W 2011 Prezydent Francji
      [[Nicolas Sarkozy]] stwierdził, że „za bardzo koncentrowaliśmy się na tożsamości
      osoby, która do nas przyjeżdża, zamiast na tożsamości kraju, który udziela jej
      gościny. Należy szanować różnice kulturowe, ale nie można doprowadzać do tego,
      by różne społeczności się od siebie separowały”<ref>{{Cytuj stronę |url=http://wyborcza.pl/1,75968,9108135,Nie_kleska__lecz_korekta_wielokulturowosci.html|tytuł=Nie
      klęska, lecz korekta wielokulturowości |nazwisko=Wojciechowski |imię=Marcin
      |data=2011-02-15 |opublikowany=wyborcza.pl |rok=2011 |data dostępu=2019-04-22
      |odn=tak}}</ref>.


