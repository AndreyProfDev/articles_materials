- sections:
  - content: "[[Plik:Denar rys chrobry1.png|mały|360px|[[Denar Princes Polonie]] z\
      \ XI w. z łacińskim określeniem Polski bity przez [[mennica|mennicę]] książęcą\
      \ [[Bolesław I Chrobry|Bolesława Chrobrego]]{{r|Kalkowski}}<ref name=\"eps.gda.pl\"\
      >Tomasz Panfil, ''[http://www.eps.gda.pl/ptn/10.html Orzeł na denarze Bolesława\
      \ Chrobrego – pochodzenie i znaczenie symbolu]'' oraz inne artykuły na ten temat,\
      \ strona www „Kwartalnika Numizmatycznego”.</ref>.]]\nPochodzenie nazwy [[Polska]]\
      \ nie jest jednoznaczne.\n\n== Gramatyka ==\n{{Osobny artykuł|-sk|-ski (formant)|-ski\
      \ (nazwisko)}}\n[[Plik:Book of Henryków.PNG|mały|340px|Najstarsze zdanie zapisane\
      \ w 1270 roku w [[Język polski|języku polskim]] w łacińskiej [[Księga henrykowska|Księdze\
      \ henrykowskiej]] – ''Hoc est in polonico: Day, ut ia pobrusa, a ti poziwai''.]]\n\
      Gramatycznie nazwa ''Polska'' wywodzi się od nazwy ''pola'' – otwartej przestrzeni\
      \ znajdującej się na danym terytorium. Składa się z dwóch części: nazwy „Pol”\
      \ – „pole” oznaczającej otwartą przestrzeń lub uprawne pole oraz przyrostkowego\
      \ formantu przymiotnikowego „-ska”. Nazwa „Polska” to gramatycznie [[przymiotnik]]\
      \ utworzony od [[rzeczownik]]a „pole” za pomocą przyrostka „[[-sk]]”, który\
      \ jest [[Formant (morfologia)|formantem]] przymiotnikowym, kontynuantem z [[Język\
      \ prasłowiański|języka prasłowiańskiego]] ''-ьskъ-'' określającym przynależność\
      \ do czegoś<ref>Stanisław Rospond, ''Gramatyka historyczna języka polskiego\
      \ z ćwiczeniami'', Wydawnictwo Naukowe PWN, Warszawa 2009, s. 114, {{ISBN|978-83-01-13992-6}}.</ref>.\n\
      \nPierwotna forma „-sk” jest bezosobowa jednak występują jej [[Rodzaj gramatyczny|odmiany\
      \ rodzajowe]] – rodzaju nijakiego „-sko”, męskiego „[[-ski (formant)|-ski]]”\
      \ oraz żeńskiego „-ska”. Dodawane jako końcówka [[rzeczownik]]ów tworzą w [[Język\
      \ polski|języku polskim]] [[przymiotnik]]i czyli słowa określające przymioty\
      \ oraz cechy przedmiotów, pojęć oraz zjawisk np. „[[Modelarstwo|modelar]]-ski”,\
      \ „[[Zioła|zielar]]-ski”, „[[len|lniar]]-ski”. Słowo „niebieski” w XIV wieku\
      \ oznaczało „przynależny do [[niebo|nieba]]” zanim stało się również nazwą [[Barwa\
      \ niebieska|koloru niebieskiego]]. Formant ten jest również charakterystyczną\
      \ cechą [[Polskie nazwiska|polskich nazwisk]] z końcówką „-ski” jak np. „Tarnowski”,\
      \ „[[Zamoyscy herbu Jelita|Zamojski]]”, „[[Sobiescy herbu Janina|Sobieski]]”,\
      \ „[[Leszczyńscy herbu Wieniawa|Leszczyński]]” czyli osób wywodzących się z\
      \ [[Tarnów|Tarnowa]], [[Zamość|Zamościa]], [[Sobieszyn (województwo lubelskie)|Sobieszyna]],\
      \ [[Leszno|Leszna]]{{odn|Klemensiewicz|1981|s=213–227}}<ref>{{Cytuj|autor =\
      \ [[Zenon Klemensiewicz]]; |tytuł = Historia języka polskiego |data = 1985 |isbn\
      \ = 83-01-06443-9 |wolumin = II |miejsce = Warszawa |wydawca = PWN |s = 318\
      \ |oclc = 830193302}}</ref>.\n\nW nazewnictwie polskim oraz ogólnosłowiańskim\
      \ jest to również formant produktywny dla nazw [[Topografia (geografia)|topograficznych]]\
      \ i [[Sufiks dzierżawczy|dzierżawczych]], stanowiąc charakterystyczną cechę\
      \ polskich geograficznych nazw miejscowych i przestrzennych{{odn|Klemensiewicz|1981|s=213–227}}.\
      \ Oboczności tego formantu jak „-sk”, „-sko”, „-ck”, „-cko” oraz „-zk”, „-zko”\
      \ charakterystyczne są dla bardzo dawnych nazw miejscowych nadawanych miejscowościom\
      \ na terenie Polski, jak ok. 1000 roku – „[[Gdańsk]]”{{odn|Klemensiewicz|1981|s=213–227}},\
      \ a także „Bużesk”, „[[Łańsk]]”, „[[Płońsk]]”, „[[Płock]]”, „[[Wąchock]]”, „Rajsko”,\
      \ „[[Bielsko]]”, „[[Kłodzko]]”, „[[Radomsko]]”, „[[Sławsko (grodzisko)|Sławsko]]”,\
      \ „[[Słupsk]]” itp{{odn|Klemensiewicz|1981|s=213–227}}.\n\nAnalogiczne nazwy\
      \ z końcówką -sk występują także w innych rodzimych nazwach krajów [[Słowianie|słowiańskich]]\
      \ np. w czeskiej i słowackiej nazwie „[[Czechy|Czech]]” i „[[Słowacja|Słowacji]]”\
      \ – „Česko”, „Slovensko” oraz w nazwie „[[Chorwacja|Chorwacji]]” – „Hrvatska”.\n\
      \nDo wieku XIX funkcjonowała także [[Archaizm|archaiczna]] odmiana nazwy Polska\
      \ według wzorów [[Deklinacja (językoznawstwo)|deklinacji]] rzeczownikowej „w\
      \ Polszcze” zamiast „w Polsce”{{r|Staniewska}}. Jest to wynik procesu językowego,\
      \ który nastąpił w wyniku wymiany prasłowiańskiej grupy „[[-sk]]” na „-sc”{{odn|Klemensiewicz|1981|s=145}}.\n\
      \n== Źródła ==\n[[Plik:Dokument fundacyjny klasztoru w Łeknie.jpg|mały|Dokument\
      \ z 1154 notujący, że Zbilut (z rodu [[Pałukowie|Pałuków]]) obywatel Polski\
      \ (“Poloniae civis”) zakłada [[Opactwo Cystersów w Łeknie|klasztor cystersów\
      \ w Łeknie]].]]\nNazwa Polski zanotowana została w wielu źródłach [[Średniowiecze|średniowiecznych]]\
      \ spisanych po [[łacina|łacinie]] i występuje w [[Annały|annałach]], dziełach\
      \ geograficznych, żywotach świętych oraz wielu kronikach z gatunku [[gesta]]\
      \ opisujących historie poszczególnych europejskich państw, narodów i władców.\
      \ Polska od 1000 roku wymieniona jest również w wielu listach, dokumentach oraz\
      \ [[bulla]]ch papieskich wydawanych przez [[papież]]y w [[Rzym]]ie zarchiwizowanych\
      \ w tzw. [[Elementa ad Fontium Editiones]], które zredagowane zostały przez\
      \ [[Stanisław Kuraś|Stanisława Kurasia]] i [[Irena Sułkowska-Kurasiowa|Irenę\
      \ Sułkowską-Kurasiową]] oraz opublikowane w siedmiu tomach w latach 1982–2006\
      \ pod nazwą [[Bullarium Poloniae]]{{odn|Kuraś|1982}}.\n\nNazwa Polski pojawia\
      \ się także w wielu średniowiecznych dokumentach spisanych po łacinie takich\
      \ jak roczniki, akty lokacyjne, prawne i erekcyjne, nadania [[przywilej]]ów,\
      \ noty i listy dyplomatyczne. Opublikowane zostały one w wielu zbiorach, z których\
      \ najbardziej istotne dla historiografii polskiej są [[Monumenta Germaniae Historica]]\
      \ wydawane od 1826 początkowo pod redakcją [[Georg Heinrich Pertz|Georga Pertza]]\
      \ oraz [[Monumenta Poloniae Historica]] wydawane w latach 1864–1893 we [[Lwów|Lwowie]]\
      \ pod redakcją [[August Bielowski|Augusta Bielowskiego]].\n\nKolejną grupę źródeł\
      \ stanowią regionalne źródła dokumentów historycznych dotyczących różnych regionów\
      \ obecnej Polski jak [[Kodeks dyplomatyczny Wielkopolski]], [[Kodeks dyplomatyczny\
      \ klasztoru tynieckiego]] czy [[Dokumenty Kujawskie i Mazowieckie przeważnie\
      \ z XIII wieku|Dokumenty Kujawskie i Mazowieckie]].\n\nOsobną grupę źródeł,\
      \ w których wymienione są tereny Polski, zamieszkane przez [[Słowianie|Słowian]]\
      \ stanowią dzieła geograficzne spisywane po [[Język perski|persku]] oraz [[Język\
      \ arabski|arabsku]] przez podróżników, oraz kupców arabskich, które zostały\
      \ zebrane w serii materiałów pt. [[Źródła arabskie do dziejów Słowiańszczyzny]]\
      \ przetłumaczone przez [[Tadeusz Lewicki (profesor)|Tadeusza Lewickiego]] oraz\
      \ wydane w czterech tomach w latach 1956–1988 przez [[Polska Akademia Nauk|Polską\
      \ Akademię Nauk]].\n\n=== Pierwsze użycie słowa „Polska” ===\n[[Plik:Annales\
      \ Quedlinburgenses Polonia.jpg|mały|300px|Nazwa ''Polonia'' w XI wiecznych [[Roczniki\
      \ Kwedlinburskie|Annales Quedlinburgenses]] w odpisie z 1550 roku.]]\n[[Plik:Gesta\
      \ Hamburgensis trans oddara st polanos.jpg|mały|300px|Fragment XI wiecznego\
      \ „''[[Gesta Hammaburgensis ecclesiae pontificum]]''” [[Adam z Bremy|Adama z\
      \ Bremy]] wymieniający [[Polanie|Polan]] żyjących wzdłuż [[Odra|Odry]] „trans\
      \ Oddaram sunt Polanos”.]]\n[[Plik:Ms zanoyskich intro.jpg|mały|300px|Początek\
      \ [[Kronika Galla Anonima|Kroniki Galla Anonima]] z łacińską nazwą „Polonie”\
      \ w Rękopisie Zamoyskich odpis z XIV wieku.]]\nNazwa Polski jako krainy pojawia\
      \ się po raz pierwszy w [[Łacina|języku łacińskim]] zanim jeszcze [[Kodyfikacja|skodyfikowany]]\
      \ został [[język polski]]. W średniowiecznych źródłach spisanych po łacinie\
      \ zachowało się wiele wzmianek zawierających nazwę kraju Polska w zlatynizowanych\
      \ formach ''Polania'', ''Palania'', ''Polenia'', ''Bulania'' i innych:\n[[Plik:Brakteat01.jpg|mały|200px|prawo|Brakteat\
      \ [[Mieszko III Stary|Mieszka III Starego]] z napisem '''mšk⊃ krl plsk'''.]]\n\
      * W latach 997–1003 jedna z pierwszych wzmianek o Polsce wyszła spod pióra [[Jan\
      \ Kanapariusz|Jana Canapariusa]], opata rzymskiego klasztoru św. Bonifacego\
      \ i Aleksego, wspominająca o [[Sobiesław Sławnikowic|Sobiesławie (Sobieborze)\
      \ Sławnikowicu]], który zbrojnie wyruszył „cum Bolizlauo Palaniorum duce” (pol.\
      \ „z Bolesławem księciem polskim”) zamieszczona w [[Żywot pierwszy św. Wojciecha|Żywocie\
      \ pierwszym św. Wojciecha]]{{odn|Bielowski|1864|s=179}}<ref>Jan Kanapariusz,\
      \ „Świętego Wojciecha żywot pierwszy”, Tekst łaciński Jadwiga Karasińska, przełożył\
      \ Kazimierz Abgarowicz, komentarze Jadwiga Karasińska, Biblioteka Gdańska 2009,\
      \ {{ISBN|9788374538695}}</ref>.\n* W 1001 r. jedna ze zwrotek tzw. sekwencji\
      \ św. Wojciecha liście hymnów spisanej w [[Reichenau (Badenia-Wirtembergia)|Reichanau]]\
      \ głosi, że: „Polania ergo tanti sepeliens floret martyryii pignora”<ref>''Cantica\
      \ medii aevi polono-latina'' t. I ''Sequentiae'', wyd. H. Kow alewicz, Warszawa\
      \ 1964, s.13</ref>.\n* W 1003 roku nazwę Polska notują łacińskie [[annały]]\
      \ ''Annales Hildesheimenses'' (będące częścią [[Dzieje Sasów|Dziejów Sasów]]).\
      \ Czynią to we fragmencie „Heinricus Berthaldi comitis filius, et Bruno frater\
      \ regis, et ambo Bolizavones, Polianicus vide licet ac Boemicus, a rege infideliter\
      \ maiestatis rei deficient.” czyli w tłumaczeniu „Henryk, syn Bertholda i Bruno\
      \ brat króla i obu Bolesławów polski i czeski są w kręgu przyjaciół cesarza.”{{odn|Waitz|1878}}.\n\
      * Spisane w latach 1008–1030 [[Roczniki Kwedlinburskie]] notują wielokrotnie\
      \ Polskę. Opisując [[Wojna polsko-niemiecka (1002–1005)|wojnę polsko-niemiecką]]\
      \ od roku 1002 wymieniają [[Bolesław I Chrobry|Bolesława Chrobrego]] we fragmentach:\
      \ „Bolizlauonem Poloniae ducem”, „Bolitzlauus Polinensis” oraz „Bolitzlauua\
      \ dux Poloniae” wymieniają także nazwę kraju „Polonia”, „Poloniam Sclauonia”{{odn|Winkelmann|1862}}.\n\
      * W latach 1012–1018 łacińskie nazwy Polski wielokrotnie zamieścił w swojej\
      \ kronice ''[[Kronika Thietmara|Thietmari merseburgiensis episcopi chronicon]]''\
      \ [[biskup]] [[Merseburg|merseburski]] oraz kronikarz [[Thietmar z Merseburga|Thietmar]]<ref>{{Cytuj\
      \ | url=http://web.archive.org/web/20170503050717/http://www.mgh-bibliothek.de:80/thietmar/edition/vorrede.html\
      \ | tytuł=Thietmarus Merseburgensis, Chronicon<!-- Tytuł wygenerowany przez\
      \ bota --> | opublikowany=www.mgh-bibliothek.de | data dostępu=2017-11-23}}</ref>.\
      \ Uczynił to zarówno w odniesieniu do polskich władców jak [[Mieszko I]] – „Miseconis\
      \ Poleniorum”<ref>„Thietmari meseburgensis episcopi chronicon”, Fridericus Kurze,\
      \ Hannoverae, Impensis Bibliopolii Hahniani, 1889, str.123.</ref> oraz [[Bolesław\
      \ I Chrobry|Bolesław Chrobry]] we fragmencie „Bolizlavus Poleniorum”<ref>„Thietmari\
      \ meseburgensis episcopi chronicon”, Fridericus Kurze, Hannoverae, Impensis\
      \ Bibliopolii Hahniani, 1889, str.94.</ref> jak również wobec kraju ''Polenia''<ref>„Thietmari\
      \ meseburgensis episcopi chronicon”, Fridericus Kurze, Hannoverae, Impensis\
      \ Bibliopolii Hahniani, 1889, str.207.</ref> oraz ludności zamieszkującej Polskę\
      \ – ''Poleni'', ''Polenii''<ref>„Thietmari meseburgensis episcopi chronicon”,\
      \ Fridericus Kurze, Hannoverae, Impensis Bibliopolii Hahniani, 1889, str.276.</ref>.\n\
      * W 1046 roku szwabski kronikarz [[Wipo]] w kronice [[Gesta Chuonradi II Imperatoris]]\
      \ (pol. ''Chwalebne czyny cesarza Konrada II'') opisując [[Bolesław I Chrobry|Bolesława\
      \ Chrobrego]] notuje „Bolizlaus Sclavigena, dux Bolanorum”<ref>Georg Heinrich\
      \ Pertz, „Monumenta Germaniae Historica”, Tomus X, Hannover MDCCCLII, str 264.</ref><ref>Wipo,\
      \ ''[http://www.hs-augsburg.de/~harsch/Chronologia/Lspost11/Wipo/wip_vit4.html\
      \ Gesta Chuonradi II imperatoris]'', {{lang|la}}</ref> czyli po polsku „Słowianin\
      \ Bolesław, książę Polaków”{{odn|Sochacki|2005}}.\n* Spisane w latach 708–1073\
      \ ''[[Annales Altahenses|Roczniki altajskie większe]]'' (łac. Annales Altahenses\
      \ maiorum) obok innych słowiańskich władców wymieniły także jako księcia polskiego\
      \ [[Kazimierz I Odnowiciel|Kazimierza I Odnowiciela]] pod określeniem „Kazmir\
      \ Bolaniorum” w roku 1046{{odn|Giesebrecht|1891}}.\n* W liście z 1074 roku księcia\
      \ czeskiego [[Wratysław II|Wratysława II]] adresowanym do [[Bolesław II Szczodry|Bolesława\
      \ Śmiałego]] nadawca tytułuje adresata tytułem „''Glorioso Boloniorum regi Boleslao''”{{odn|Bielowski|1864|s=364}}.\n\
      * W liście z 1075 roku papieża [[Grzegorz VII (papież)|Grzegorza VII]] adresowanym\
      \ do [[Bolesław II Szczodry|Bolesława Śmiałego]] nadawca tytułuje adresata tytułem\
      \ „''Boleslao duci Polonorum''”{{odn|Bielowski|1864|s=367}}.\n* W latach 1075–1080\
      \ [[Adam z Bremy]], niemiecki kronikarz i geograf, wymienia Polan w [[średniowiecze|historycznym]]\
      \ [[Traktat (nauka)|traktacie]] „''[[Gesta Hammaburgensis ecclesiae pontificum]]''”,\
      \ gdzie za strefę graniczną pomiędzy [[Słowianie połabscy|Słowianami połabskimi]]\
      \ z plemion [[Wieleci|wieleckich]] oraz [[Wieleci|lucickich]] a [[Pomorzanie|Pomorzanami]]\
      \ i [[Polanie|Polanami]] uznaje rzekę [[Odra|Odrę]]. Według jego relacji ziemia\
      \ Polan graniczy z ziemiami pomorskimi, pruskimi, czeskimi i rozciąga się aż\
      \ po granice państwa ruskiego: „''Trans Oddoram fluvium primi habitant Pomerani,\
      \ deinde Polani, qui a latere habent hinc Pruzzos, inde Behemos, ab oriente\
      \ Ruzzos''”{{odn|Pertz|1846|s=59}}{{odn|Łowmiański|1967|s=171–172}}. W tekście\
      \ wymienia również kilkukrotnie Polskę w różnych odmianach „Polonia”, „rege\
      \ Polanorum Bolizlao” itp.{{odn|Pertz|1846|s=73}}\n* W roku [[1154]] [[Arabowie|arabski]]\
      \ geograf [[Al-Idrisi]] zamieścił w [[Księga Rogera|Księdze Rogera]] również\
      \ informacje o Polsce, którą nazwał „Buluniia”, wymieniając jej ważniejsze miasta,\
      \ m.in. [[Kraków]], [[Gniezno]], [[Wrocław]], [[Sieradz]], [[Łęczyca|Łęczycę]]\
      \ oraz [[Santok]]<ref>[[Tadeusz Lewicki (profesor)|Tadeusz Lewicki]], ''Polska\
      \ i kraje sąsiednie w świetle „Księgi Rogera” geografa arabskiego z XII w. Al\
      \ Indrisi`ego'', cz.I, Polska Akademia Nauk. Komitet Orientalistyczny, PWN,\
      \ Kraków 1945.</ref>:\n<blockquote>\n„Co się tyczy ziemi B(u)luniia, która jest\
      \ krajem wiedzy i mędrców rumijskich (ar-Rum)<ref group=uwaga>„Rumijskich” znaczy\
      \ romańskich – rzymskich tj. chrześcijańskich.</ref>, wspomnieliśmy ją już poprzednio.\
      \ Jest to kraj o pięknej ziemi, urodzajny, obfitujący w źródła i w rzeki, o\
      \ ciągnących się bez przerwy prowincjach i dużych miastach, bogaty we wsie i\
      \ domostwa... Posiada on winnice, oliwki i mnogie drzewa różnych gatunków owoców.\
      \ Do miast jego należą: [[Kraków|Ikraku]], [[Gniezno|G(i)nazna]], [[Wrocław|-r(a)t(i)-slaba]],\
      \ [[Sieradz|S(i)rad(i)ja]], [[Łęczyca|N(u)grada]], [[Santok|S(i)tnu]]<ref group=uwaga>Kraków,\
      \ Gniezno, Wrocław, Sieradz, Łęczyca (jako Nowy Gród) oraz Santok.</ref><ref>[[Aleksander\
      \ Gieysztor]], Chapter VII: Trade and Industry in Eastern Europe before 1200\
      \ [w:] Michael Moïssey Postan, Edward Miller (red.), [http://books.google.pl/books?id=cHRvtwTLcMAC&pg=PA502&lpg=PA502&dq=Santok++Al+Idrisi&source=bl&ots=PmoJQop0fr&sig=SRb6DOqQAA4FIRAnkx4N2LUK8ak&hl=pl&sa=X&ei=OsnRT55Jxem1BqPl2L4P&sqi=2&ved=0CEsQ6AEwAQ#v=onepage&q=Santok%20%20Al%20Idrisi&f=false\
      \ ''The Cambridge Economic History of Europe: Trade and industry in the Middle\
      \ Ages''], Cambridge University Press, 1987, s. 502 {{lang|en}}</ref> Wszystkie\
      \ one są sławnymi stolicami i silnymi centrami, w których zebrane są dostatki\
      \ rozmaitych krajów. Prócz tego zażywają one szacunku, ponieważ przebywają w\
      \ nich uczeni wykształceni w dziedzinach nauk i zaznajomieni ze swymi zawodami.\
      \ Co się tyczy miasta (I)kraku, miasta G(i)nazna i reszty jej (Bulunji) wspomnianych\
      \ miast, są to miejscowości o blisko siebie stojących budowlach... Ze wszystkich\
      \ stron otaczają ją góry ciągnące się nieprzerwanie i oddzielające ją od kraju\
      \ S(a)sun(i)ja ([[Saksonia]]), kraju B(u)amija (Bohemia – [[Czechy]]) i kraju\
      \ ar-Rusija ([[Ruś Kijowska|Ruś]])<ref>„Dzieje Wielkopolski w wypisach”, PZWS,\
      \ Warszawa 1963, str. 41–43</ref><ref>Tadeusz Lewicki, ''Polska i kraje sąsiednie\
      \ w świetle „Księgi Rogera” geografa arabskiego z XII w. Al Indrisi`ego'', cz.I,\
      \ Kraków 1945, s. 142–143</ref>. – [[Al-Idrisi]] (1100–1166) – ''[[Księga Rogera]]''.\n\
      </blockquote>\n\nNazwa występuje również w źródłach spisanych po łacinie na\
      \ terenie Polski:\n* Za najwcześniejszy lokalny zabytek z nazwą Polski napisaną\
      \ po łacinie uznaje się wybity w okresie rządów [[Bolesław I Chrobry|Bolesława\
      \ Chrobrego]] w latach 992–1025 przez [[mennica|mennicę]] książęcą [[Denar Princes\
      \ Polonie]]{{r|Kalkowski}}<ref name=\"eps.gda.pl\"/>.\n* Łacińskie określenie\
      \ Polski zapisane zostało w średniowiecznym utworze [[Żywot Pięciu Braci Męczenników]]<ref>{{Cytuj\
      \ stronę | url = http://www.dmgh.de/de/fs1/object/goToPage/bsb00000889.html?pageNo=709&sortIndex=010%3A050%3A0015%3A010%3A02%3A00\
      \ | tytuł = Tekst łaciński utworu | opublikowany = dmgh.de | archiwum = https://web.archive.org/web/20140109143318/http://www.dmgh.de/de/fs1/object/goToPage/bsb00000889.html?pageNo=709&sortIndex=010%3A050%3A0015%3A010%3A02%3A00\
      \ | zarchiwizowano = 2014-01-09}} w wydaniu Reinharda Kade w zbiorze [[Monumenta\
      \ Germaniae Historica]] (Scriptores 15,2:1888)]</ref> autorstwa [[Bruno z Kwerfurtu|Brunona\
      \ z Kwerfurtu]]. Gościł on na przełomie 1005 i 1006 roku na dworze [[Bolesław\
      \ I Chrobry|Bolesława Chrobrego]] i z imienia wymienia swojego gospodarza we\
      \ fragmencie „(...) ignotae linguae Polanorum, invento serniore cui nomen Bolizlao”<ref>Monvmenta\
      \ Germaniae Historica, scriptorum, TOMI XV pars II, „Brunonis vita quinque fratrum”,\
      \ str. 722, Hannoverae 1888.</ref>. Używa on również łacińskiego określenia\
      \ „terra Polonia”, „Polanicis terris” wobec całości ziem znajdujących się pod\
      \ jego władaniem<ref>Monvmenta Germaniae Historica, scriptorum, TOMI XV pars\
      \ II, „Brunonis vita quinque fratrum”, str. 727, Hannoverae 1888.</ref>. Brunon\
      \ w kolejnym swoim utworze zatytułowanym ''[[Żywot drugi św. Wojciecha|Żywot\
      \ św. Wojciecha]]'' notuje również dwukrotnie Polskę we fragmencie poświęconym\
      \ Bolesławowi Chrobremu – '„ducem Polanorum Bolizlavum” oraz państwa pod jego\
      \ panowaniem „De terra Polanorum”{{odn|Bielowski|1864|s=210–213}}.\n* Łacińską\
      \ nazwę Polski – „Polonia” zawiera najstarsza pisana sekwencja powstała na ziemiach\
      \ polskich, która została napisana przez anonimowego autora po 1090 roku we\
      \ fragmencie „[[Hac festa die|Hac festa die tota Gratuletur Polonia]]”<ref>Teresa\
      \ Michałowska: Średniowiecze. Warszawa: Wydawnictwo Naukowe PWN, 1995, s. 228–229,\
      \ seria: Wielka Historia Literatury Polskiej. {{ISBN|83-01-11452-5}}.</ref>.\n\
      * W latach [[1112]]–[[1116]] [[Kronika Galla Anonima|Kronika polska]] spisana\
      \ przez [[Gall Anonim|Galla Anonima]] wymienia ją w tytule ''Cronicae et gesta\
      \ ducum sive principum Polonorum''{{odn|Bielowski|1864|s=379–484}}.\n* W 1136\
      \ nazwę Polski jako „Poloniorum regio” (pol. kraj Polaków) odnotowuje także\
      \ spisana po łacinie tzw. [[Bulla gnieźnieńska]] uznawana za pierwszy zabytek\
      \ mowy polskiej<ref name=autonazwa1>Jerzy Starnawski „Średniowiecze”, Wydawnictwa\
      \ Szkolne i Pedagogiczne, Warszawa 1989.</ref>. Pośród listy ponad 400 nazw\
      \ w języku polskim, tj. prowincji, grodów, wsi wymienionych w łacińskiej bulli\
      \ papieża Innocentego II, jest także fraza „Mesco dux Poloniae baptisatur” odnotowująca\
      \ pod rokiem (966) chrzest [[Mieszko I|Mieszka I]]<ref name=autonazwa1 />{{odn|Wydra|1984|s=17}}.\n\
      * Za pierwszą wzmiankę o Polsce (w tym dosłownym brzmieniu) uchodzą monety [[Mieszko\
      \ III Stary|Mieszka Starego]] (1173~1202) wybite przez [[Historia Żydów w Polsce|Żydów]]\
      \ zawiadujących [[Mennica|mennicą]] w [[Kalisz]]u, którzy posłużyli się literami\
      \ [[Alfabet hebrajski|hebrajskimi]] w języku [[Język knaan|knaan]]. Napis משקא\
      \ קרל פלסק – mšk⊃ krl plsk na [[brakteat]]ach [[Transliteracja|transliterowany]]\
      \ jest na ''mszka krol polski''<ref>Janusz Karaczewski: [http://www.rp.pl/artykul/120753-Blogoslawienstwo-Mieszkowi.html\
      \ ''Błogosławieństwo Mieszkowi.''] „Rzeczpospolita” 14-04-2008.</ref>\n\nWedług\
      \ [[Krystyna Długosz-Kurczabowa|Krystyny Długosz-Kurczabowej]] ziemie Polan\
      \ od XIV wieku nazywano Staropolską, a później [[Wielkopolska|Wielkopolską]],\
      \ a dla kontrastu ziemie południowe – [[Małopolska|Małopolską]]<ref name=\"\
      etymologia1\"/>. [[Witold Mańczak]], analizując występowanie w polskiej [[Toponimia|toponomastyce]]\
      \ od najdawniejszych czasów określeń ''magnus'' i ''maior'', i wobec tego, że\
      \ w 99% wypadków występowania w nazwach miejscowych znaczyły one po prostu „wielki”,\
      \ prawdopodobieństwo, że ''Polonia maior'' oznaczała „Starą Polskę” zredukował\
      \ do minimum (gdyby tak było to Wielkopolska nazywałaby się najprawdopodobniej\
      \ ''Polonia antiqua'' lub ''Polonia vetus''). W średniowieczu Wielkopolska obiektywnie\
      \ przewyższała zarówno obszarem, ale przede wszystkim liczbą ludności, każdą\
      \ z pozostałych dzielnic<ref>Witold Mańczak, ''Znaczenie nazwy Polonia Maior''\
      \ [w:] Zeszyty Naukowe Uniwersytetu Jagiellońskiego, nr 9, Filologia, z. 2,\
      \ Kraków 1956, s. 95.</ref>.\n\n== Źródłosłów ==\nIstnieją dwie wersje na temat\
      \ tego jakie słowo jest źródłosłowem nazwy „Polska”. Według jednej z nich nazwa\
      \ wywodzi się od „pola” – nazwy mającej w języku polskim zarówno znaczenie przestrzenne,\
      \ jak też rolnicze. Druga z nich za źródło upatruje nazwę słowiańskiego plemienia\
      \ „Polan”, którego nazwa również wywodzi się od wcześniej przytoczonej nazwy\
      \ „pole”.\n\n=== Polanie ===\n[[Plik:Konrad I Głowgowski seal 1253.PNG|mały|Pieczęć\
      \ piesza [[Konrad I głogowski|Konrada I głogowskiego]] z [[1253]] z łacińskim\
      \ napisem „Conradus Dei Gracia Dux Zlesie et Polonie”.]]\nWedług jednej z teorii\
      \ nazwa ta wywodzi się od [[Plemię|plemienia]] [[Polanie|Polan]], zamieszkującego\
      \ tereny obecnej [[Wielkopolska|Wielkopolski]]. Słowo ''Polanie'' zaś przeważnie\
      \ wywodzone jest od słowa ''pole'', w związku albo z [[rolnictwo|rolnictwem]]\
      \ jako głównym zajęciem plemienia, albo zamieszkiwaniem przez nich równinnych\
      \ terenów (w odróżnieniu od innych plemion, np. [[Wiślanie|Wiślan]] czy [[Mazowszanie|Mazowszan]])<ref\
      \ name=\"etymologia1\">{{cytuj |tytuł=Jaka jest etymologia słowa Polska (nazwa\
      \ kraju)?|opublikowany=Poradnia językowa PWN |autor=Krystyna Długosz-Kurczabowa\
      \ |url=https://sjp.pwn.pl/poradnia/haslo/;2783 |data dostępu=2008-12-06}}</ref>.\n\
      \nNiektórzy historycy (np. [[Przemysław Urbańczyk]] i [[Zofia Hilczer-Kurnatowska]])\
      \ kwestionują samo istnienie Polan, którzy w źródłach piśmienniczych pojawiają\
      \ się dopiero w XII wieku w spisanej przez [[Nestor (kronikarz)|Nestora]] (który\
      \ często wymyślał nazwy etnonimów, od znanych mu choronimów, i te nie występują\
      \ w żadnych innych źródłach) w roku 1113 kronice „[[Powieść minionych lat]]”\
      \ (''Повѣсть времяньныхъ лѣтъ'')<ref>Franciszek Sielicki, „Kroniki staroruskie”,\
      \ PWN, Warszawa 1987, {{ISBN|8306014235}}</ref><ref>Лутичи (Лютици) [http://www.lrc-lib.ru/rus_letopisi/Ipatius/geogrfrm.htm\
      \ Indeks geograficzny ruskich] [[latopis]]ów {{lang|ru}}</ref>: {{lang|ru}}\
      \ ''а от тѣхъ Лѧховъ прозвашасѧ Полѧне, Лѧховѣ друзии – Лютицѣ, инии Мазовшане,\
      \ а нии Поморѧне'' (od tych Lęchów przezwali się jedni '''Polanami''', drudzy\
      \ Lęchowie [[Wieleci|Lutycami]], inni [[Mazowszanie|Mazowszanami]], inni [[Pomorzanie|Pomorzanami]]),\
      \ a w wersji łacińskiej ok. roku 1000 (ale w wersji choronimu, czyli nazwy krainy:\
      \ ''Polania, Polonie'', czy ''Bolizlauo Palaniorum [[Dux (wódz)|duce]], Bolizlavonem\
      \ Poloniae, Bolizlavo Polianicus''), wcześniej używana w stosunku do Polski\
      \ jest nazwa ogólnoetniczna; ''in Sclaviam, duce Sclavonica Bilizlavone susceptus,\
      \ in Sclavania, Sclavonia'', co mogło powodować mylenie Polski z Czechami, które\
      \ były określane podobnie (zwłaszcza, że obydwa kraje rządzone były przez Bolesławów)<ref>{{cytuj\
      \ pismo|imię=Przemysław|nazwisko=Urbańczyk|tytuł=Nie było żadnych Polan|czasopismo=Gazeta\
      \ Wyborcza|data=2008-05-24}}; podobny pogląd wyraziła [[Zofia Hilczer-Kurnatowska|Zofia\
      \ Kurnatowska]] w pracy zbiorowej {{cytuj książkę|tytuł=U źródeł Polski – do\
      \ roku 1038|strony=141 i 146|wydawca=Wydawnictwo Dolnośląskie|rok=2002}}</ref>.\
      \ Jednak niezależnie od kontrowersyjnych Polan (Przemysław Urbańczyk zarzuca\
      \ historykom sprzeczność logiczną: wywodzenie Polan od nazwy kraju, a następnie\
      \ nazwy kraju od Polan, oraz zadziwiający fakt, że sami „Polanie” zapisaliby\
      \ własną nazwę z błędem; ''Polonia, Polonie, Polonus'' i konsekwentnie przy\
      \ tym zapisie trwali, podczas gdy obcy autorzy w późniejszych zapisach np. [[Bruno\
      \ z Kwerfurtu]]; ''Bolezlavo Polanorum duce, terra Polanorum, Polanis'' z 1005\
      \ r., ''provincia Polanorum, Polianici terra'' z 1008 r., czy [[Thietmar z Merseburga|Thietmar]];\
      \ ''Polenia, Poleni'' od 1012 r., używaliby nazwy bardziej etymologicznie poprawnej<ref>Przemysław\
      \ Urbańczyk: ''Trudne początki Polski.'' Wrocław 2008, s. 320–324.</ref>) autorzy\
      \ ci nie kwestionują, że źródłosłów tkwi w ogólnosłowiańskim wyrazie ''pole''.\n\
      [[Plik:TabulaRogeriana upside-down.jpg|mały|400px|''[[Księga Rogera|Tabula Rogeriana]]''\
      \ z 1154 roku arabskiego geografa [[Al-Idrisi]]iego z opisem kraju Bulaniia\
      \ wymieniającej miasta: [[Kraków]], [[Gniezno]], [[Wrocław]], [[Sieradz]], [[Łęczyca|Łęczycę]]\
      \ oraz [[Santok]].]]\n<!--DO UŹRÓDŁOWIENIA: Niektórzy lingwiści twierdzą, że\
      \ takie nazewnictwo związane jest z pierwotną formą organizacji plemiennej –\
      \ [[Opole (średniowiecze)|opola]], będącego odmianą [[demokracja|ludowładztwa]]\
      \ z obieralnym władcą, wspólną własnością ziemi i [[Ród|rodem]] jako podstawą\
      \ społeczną. Według innej teorii, nazwa ''Polanie'' wywodzi się od słowa ''plemię''\
      \ – współplemiennik, człowiek związany [[Pokrewieństwo|więzami krwi]].\n-->\n\
      === Ogólnosłowiańskie „pole” ===\n[[Plik:Grosi cracoviensess obverse.jpg|mały|''Dei\
      \ gratia rex Polonie'' na srebrnym [[Grosz krakowski|groszu krakowskim]] wprowadzonym\
      \ przez [[Kazimierz III Wielki|Kazimierza III Wielkiego]] w 1367]]\nNiezależnie\
      \ od istnienia Polan nazwę Polski wywodzi się od ogólnosłowiańskiego wyrazu\
      \ ''pole'' – oznaczającego pierwotnie równinę zdatną pod uprawę<ref>[[Tadeusz\
      \ Lehr-Spławiński]]: ''Język polski.'' Warszawa 1978, s. 64.</ref> ([[Język\
      \ prasłowiański|prasłowiańskie]] ''polje'', [[Język czeski|czeskie]] ''pole'',\
      \ [[Język słowacki|słowackie]] ''pole'', [[Język ukraiński|ukraińskie]] поле\
      \ (''połe''), [[Język białoruski|białoruskie]] поле (''pole''), [[Język rosyjski|rosyjskie]]\
      \ поле (''pole''), [[Język chorwacki|chorwackie]] ''polje'', [[Język serbski|serbskie]]\
      \ поље (polje), [[Język macedoński|macedońskie]] поле (''pole''), [[Język bułgarski|bułgarskie]]\
      \ поле (''pole''), [[Język dolnołużycki|dolnołużyckie]] ''pólo'').\nJeszcze\
      \ w XIV wieku przymiotnik ''polski'' znaczył tyle co ''polny'': ''Bóg udziałał\
      \ niebo i ziemię i wszelką roślinę polską pirzwej niż wyszła na ziemię'' ([[Biblia\
      \ królowej Zofii|''Biblia Szaroszpatacka'']]), ''droga polska'' – w gwarach\
      \ dawnej Małopolski wraz z ruskim pograniczem „droga przechodząca przez pole,\
      \ boczna, nie szosa”<ref>Krystyna Długosz-Kurczabowa: ''Wielki słownik etymologiczno-historyczny\
      \ języka polskiego.'' Warszawa 2008, s. 499.</ref>. Zresztą taki przymiotnik\
      \ od ''pola'' jest naturalny (porównaj przymiotniki od ''góry'': ''górny'' i\
      \ ''górski'') co można zauważyć w XV-wiecznych nazwach roślin zamiennie nazywanych\
      \ ''polskimi'' lub ''polnymi'' np. ''polny'' / ''polski czosnek'' ([[Czosnek|Allium\
      \ oleraceum L.]]), ''polna'' / ''polska dryjakiew'' ([[Driakiew gołębia|Scabiosa\
      \ columbaria L.]], [[Chaber|Centaurea scabiosa L.]]), ''polna'' / ''polska marchew''\
      \ ([[Marchew zwyczajna|Daucus carota L.]]) itd.<ref>Maria Karpluk, ''[http://mbc.malopolska.pl/dlibra/docmetadata?id=29257&from=&dirids=1&ver_id=685619&lp=1&QI=!02B74F04EB26435C58F09B747E2DBEF5-4\
      \ Skąd nazwa Polski i jak brzmi ona w językach naszych słowiańskich sąsiadów]'',\
      \ „Język Polski”, 1992, nr 1 (styczeń/luty), wymaga [[DjVu]].</ref>\nW ten sposób\
      \ powstała nazwa ''Polska''<ref>{{cytuj stronę|url=http://www.fil.us.edu.pl/ijp/poradnia/baza_archiwum.php?POZYCJA=100&AKCJA=&TEMAT=Etymologia&NZP=&WYRAZ=|tytuł=Jaka\
      \ jest etymologia słowa Polska?|autor=Katarzyna Wyrwas|data dostępu=2008-12-06|archiwum=https://web.archive.org/web/20080507153205/http://www.fil.us.edu.pl/ijp/poradnia/baza_archiwum.php?POZYCJA=100&AKCJA=&TEMAT=Etymologia&NZP=&WYRAZ=|zarchiwizowano=7\
      \ maja 2008}}</ref>. Ta etymologia nie jest niczym nowym, to pochodzenie nazwy\
      \ od „campi plani/równinnych pól” podawał już w swojej ''Kronice czeskiej''\
      \ do roku 1330, [[Pulkava z Radenína|Přibik z Radenina zwany Pulkawą]], a zaczerpnął\
      \ zapewne od [[Gerwazy z Tilbury|Gerwazego z Tilbury]], który podawał je w ''Otia\
      \ imperialia''<ref>Marie Makariusová: [http://www.iliteratura.cz/clanek.asp?polozkaID=26551\
      \ ''Metodické problémy moderní biografistiky.''] {{lang|cs}}</ref>\n\n{{Cytat\n\
      \ |treść =\nČechův bratr nebo druh jménem Lech, který přišel s ním, přešel pak\
      \ zasněžené hory, které dělí Čechy a Polsko. A když uviděl převelikou rovinu,\
      \ táhnoucí se až k mořským břehům, usadil se tam a zalidnil ji svým rodem. Je\
      \ totiž třeba vědět, že se ve slovanském jazyce campi plani [rovná pole] nazývají\
      \ pole. A proto se nazývá Polsko, jakoby rovinatá pláň.<br />\n([[Czech]]a brat\
      \ lub druh imieniem [[Lech (postać legendarna)|Lech]]<ref group=\"uwaga\">Přibík\
      \ Pulkava, który niewątpliwie korzystał z wcześniejszej pracy tj. [[Kronika\
      \ Dalimila|Kroniki Dalimila]], przerobił występującego tam [[Czech]]a będącego\
      \ lechem w Czecha i [[Lech (postać legendarna)|Lecha]].</ref>, który przyszedł\
      \ z nim, przekroczył ośnieżone góry, które oddzielają Czechy i Polskę. A kiedy\
      \ ujrzał wielką równinę, rozciągającą się aż do brzegu morza, osiedlił się tam\
      \ i zaludnił ją swoją rodziną. Ważne jest, aby wiedzieć, że w językach słowiańskich\
      \ terminem „campi plani” [równinne pola] nazywa się pola. I stąd się bierze\
      \ imię Polska, od płaskiej równiny.)<ref>Přibík Pulkava z Radenína, ''Kronika\
      \ Česká'', [http://www.moraviamagna.cz/povesti/p_pu_2pc.htm Rozdział II ''Jak\
      \ postupovali a jak přišliI do zemí (O tom, jak Slované vedení Čechem a Lechem,\
      \ zabrali střední a severní Evropu)''] {{lang|cs}}</ref>\n}}\n\nW przeszłości\
      \ używano [[łacina|łacińskich]] określeń ''terra Poloniæ'' – ziemia Polska lub\
      \ ''Regnum Poloniæ'' – Królestwo Polskie. Nazwa ''Polska'' zaczęła być używana\
      \ w odniesieniu do całego [[Państwo|państwa]] w XI wieku. Formacje tego typu\
      \ poświadczone są już w IX wieku w tekstach [[Język staro-cerkiewno-słowiański|s-c-s]]\
      \ np. w [[Oficjum]] ku czci [[Cyryl i Metody|św. Metodego]] np.\n\n{{Cytat\n\
      \ |treść = Tę ima o(t')če země morawskaa stěną tvr’dą.\n}}\n\n=== Inne etymologie\
      \ ===\n==== Etymologie teoretyczne ====\nUważany za krytyka istnienia Polan\
      \ Przemysław Urbańczyk podaje dodatkową ewentualną możliwość interpretacyjną,\
      \ znalezioną w [[Słowo o wyprawie Igora|Słowie o pułku Igora]]:\n\n{{Cytat\n\
      \ |treść = Zagorodite poliu vorota svoimi ostrymi strelami/Загородите полю ворота\
      \ своими острыми стрелами<br />(Zagrodźcie [ludziom] stepu wrota swoimi ostrymi\
      \ strzałami)\n}}\n\ngdzie pole oznacza „ludzi otwartych przestrzeni/stepów”<ref>Pełny\
      \ tekst i przekład na współczesny rosyjski: ''[http://www.vehi.net/oldrussian/opolku.html\
      \ СЛОВО О ПОЛКУ ИГОРЕВЕ, ИГОРЯ СЫНА СВЯТОСЛАВЛЯ, ВНУКА ОЛЬГОВА]'' {{lang|ru}}</ref><ref>Przemysław\
      \ Urbańczyk: ''Trudne początki Polski.'' Wrocław 2008, s. 338.</ref>.\n\nW nauce\
      \ rosyjskiej istnieje też wywodzenie nazwy rodzimych [[Polanie (plemię wschodniosłowiańskie)|Poljan]]\
      \ nie od „pola”, a od określenia związanego z męstwem i wiązania tej nazwy z\
      \ nazwą etniczną [[Antowie|Antów]]. Historyk rosyjski [[Lew Gumilow]] tak tłumaczy\
      \ ten etnonim:\n: ''Słowianie rozprzestrzenili się na północ, gdzie zwano ich\
      \ Wenedami (słowo to do dziś zachowało się w języku estońskim). Na południu\
      \ nazywano ich Sklawinami, na wschodzie – Antami. Historyk ukraiński M. Brajczewski<ref>Михаил\
      \ Юлианович Брайчевский (1924–2001) ukraiński historyk i archeolog.</ref> ustalił,\
      \ że greckie słowo „Antowie” znaczy to samo co słowiańskie „Polanie”. Zachowało\
      \ się słowo rodzaju żeńskiego „polanka” (поляница<ref>Лев Николаевич Гумилёв:\
      \ [http://www.razumei.ru/files/others/pdf/Gumilev_otRusi_doRossii.pdf ''От Руси\
      \ к России. Очерки этнической истории.''] wersja elektroniczna w pdf, s. 12\
      \ {{Lang|ru}}</ref>) w znaczeniu „bohaterka”<ref>богатырша/богатырка, ibidem.</ref>.\
      \ Ale słowa „polanie” w analogicznym znaczeniu dziś się nie używa, gdyż wyparło\
      \ je z użycia tureckie słowo „bagadyr”<ref>Lew Gumilow: ''Od Rusi do Rosji.''\
      \ Warszawa 2004, s. 26.</ref>''.\n\n==== Etymologie ludowe ====\n[[Benedykt\
      \ Chmielowski]] w ''Nowych Atenach'' z 1745 r. podawał kilka (często wręcz bajkowych)\
      \ etymologii:\n''W SARMACJI jako Perła kosztowna wydaje się POLSKIE KRÓLESTWO,\
      \ z Słowieńskich Narodów najsławniejsze, o którym tu essencyalne tylko rzeczy\
      \ enarro, żebym nie był, Polskę Ojczyznę swoję opuściwszy censurowany, że jestem\
      \ foris Lynx, Domi talpa. POLSKA ta nazwała się od Pola, na którym żyć i umierać\
      \ lubili Polacy; albo też a Polo Arctico, to jest od Północnej gwiazdy<ref group=\"\
      uwaga\">W języku angielskim ''pole/poles'' oznacza ''biegun/bieguny''; prawdopodobnie\
      \ od greckiego πόλος/''pólos'' – ''polarny''; natomiast ''Pole/Poles'' – ''Polak/Polacy''.</ref>\
      \ ku której, nadało się Królestwo Polskie, jako Hiszpania nazwana Hesperia od\
      \ gwiazdy zachodniej Hesperus. Innym się zda, że imię to nadano Polakom od Zamku\
      \ Pole olim na granicach Pomorskich będącego. Inni rozumieją, że od Miasta Kolchickiego\
      \ Pola, skąd originem prowadził Lechus, Monarcha Polski. Może też być, że Poloni\
      \ per corruptionem kilku liter ciż są, co i Bulanes Nacja w Sarmacji nad Wisłą,\
      \ według Ptolemeusza, mieszkając. Jest i to zdanie Autorów, że Polacy niby Polachy,\
      \ to jest po Lechu potomkowie zwać się powinni, jako dotychczas Lachami nas\
      \ Ruś zowie. Paprocki zaś ingeniose racjocynuje, że za Mieczysława I Xiążęcia\
      \ Polskiego, gdy Polacy Wiarę Ś. przyjmowali i wielkiemi do Chrztu Ś. kupami\
      \ przystępowali, tedy Kapłani z Czechów na to wokowani, kupy od kup distinguendo,\
      \ pytali się: Czy jesteście polani? id est już ochrzczeni? tedy ci co byli ochrzczeni,\
      \ odpowiadali: Jesteśmy polani, stąd Polani, czyli Poloni poszło Polakom in\
      \ nomen gloriosum.''<ref>Benedykt Chmielowski: [http://literat.ug.edu.pl/ateny/0030.htm\
      \ ''Nowe Ateny.''] wersja elektroniczna dostępna w Wirtualnej Bibliotece Literatury\
      \ Polskiej.</ref>\n\nWarto wiedzieć, że „etymologia wodna”, czyli wywodzenie\
      \ nazwy Polska od polewania wodą podczas chrztu pojawiła się po raz pierwszy\
      \ w ''Kronice czeskiej''<ref>{{Cytuj stronę | url = http://knihovna.phil.muni.cz/dl/oldbooks/kronyka-ceska-hajek-z-libocan-1819\
      \ | tytuł = ''Kronika česká.'' | opublikowany = knihovna.phil.muni.cz | archiwum\
      \ = https://web.archive.org/web/20100112221132/http://knihovna.phil.muni.cz/dl/oldbooks/kronyka-ceska-hajek-z-libocan-1819\
      \ | zarchiwizowano = 2010-01-12}} albo inaczej ''Hájkova kronika'' skan wydania\
      \ z 1819 r.</ref> Václava Hájka z Libočan z 1541, a współcześnie wraca do niej\
      \ historyk niemiecki Johannes Fried w książce ''Otton III i Bolesław Chrobry''\n\
      \n== Inne nazwy Polski ==\nInne nazwy Polski (''Lechia'', [[Język perski|perskie]]\
      \ ''Lachistan'', [[Język litewski|litewskie]] ''Lenkija'') i Polaków ([[Język\
      \ turecki|tureckie]] ''Lehce'', [[Język ruski|ruskie]] ''Lach'', [[Język węgierski|węgierskie]]\
      \ ''Lengyel'') wywodzi się najprawdopodobniej od nazwy plemienia [[Lędzianie|Lędzian]]\
      \ ([[Język prasłowiański|prasłowiańskie]] ''*Lęd-jan-e''), które, jak się przypuszcza,\
      \ zamieszkiwało w południowo-wschodniej części dzisiejszej Polski<ref>Jerzy\
      \ Nalepa: [http://mbc.malopolska.pl/dlibra/docmetadata?id=30087&from=&dirids=1&ver_id=693928&lp=1&QI=!9ABA8B4A841FF961307FCA0C3156BD0A-3\
      \ ''Polska – pochodzenie i wiek nazwy'' (cz. II).] [w:] [Język Polski. 1994,\
      \ nr 4/5 (LXXIV 4-5) (wrzesień/grudzień), s. 241 i n.</ref>.\n\nSłowo „Polacy”\
      \ (XV wiek), wcześniej „Polanie” w łacińskiej formie Polani, Poleni, Poloni\
      \ pojawiło się po raz pierwszy na przełomie X i XI wieku w żywocie starszym\
      \ [[Święty Wojciech|św. Wojciecha]], prawdopodobnie spisanym w [[Rzym]]ie między\
      \ 999 a 1001<ref>{{cytuj stronę |url=http://www.focus.pl/historia/artykuly/zobacz/publikacje/poczatki-polski-do-poprawki/\
      \ |tytuł=Początki Polski do poprawki |opublikowany=2008-08-29 |autor=Michał\
      \ Wójcik, Przemysław Urbańczyk |data dostępu=2010-11-10 |archiwum=https://web.archive.org/web/20100118052958/http://www.focus.pl/historia/artykuly/zobacz/publikacje/poczatki-polski-do-poprawki/\
      \ |zarchiwizowano=2010-01-18 }}</ref>. Nazwę ''Polak'' przez długi czas stosowano\
      \ tylko do warstw wyższych ([[szlachta]]), bez względu na przynależność etniczną.\n\
      \nPierwszy państwo polskie nazwał Rzecząpospolitą [[Wincenty Kadłubek]] (zm.\
      \ 1223). Słowo ''rzeczpospolita'' oznacza rzecz publiczną (wspólną dla wszystkich)\
      \ lub [[Republika|republikę]] i jest [[kalka (językoznawstwo)|kalką]] łacińskiego\
      \ wyrażenia ''res publica''<ref>{{Cytuj |autor =  |tytuł = Souvislosti |data\
      \ = 1996 |wydanie = 1-4 |wydawca = Zvon |s = 208 |url = https://books.google.com/books?id=jTDzAAAAMAAJ\
      \ |język = cs}}</ref>. Słowo ''republika'', będące bezpośrednim zapożyczeniem,\
      \ nie jest używane w języku polskim w odniesieniu do Polski. Zgodnie z obowiązującym\
      \ porządkiem [[Prawo|prawnym]], jedyną urzędową nazwą kraju jest Rzeczpospolita\
      \ Polska, a nazwa „Polska” nie pojawia się w żadnym obecnie obowiązującym polskim\
      \ akcie prawnym. W kontekście [[poprawność językowa|poprawności językowej]]\
      \ słowo ''Polska'' w nazwie oficjalnej jest przymiotnikiem, a nie rzeczownikiem\
      \ (łac. ''Respublica Polona'', a nie: ''Respublica Polonia''), stąd prawidłowa\
      \ forma [[Dopełniacz (przypadek)|dopełniacza]] to Rzeczypospolitej (Rzeczpospolitej)\
      \ ''Polskiej'' (a nie: ''Polski'')<ref>{{cytuj książkę|autor link=Jan Miodek|imię=Jan|nazwisko=Miodek\
      \ |tytuł=Słownik ojczyzny polszczyzny|wydawca=Wydawnictwo EUROPA|miejsce=Wrocław|rok=2002|isbn=83-87977-92-6}}</ref>.\n\
      \n: Przed [[XIX wiek]]iem odmieniano wciąż ''polska ziemia – polski ziemi –\
      \ w polszcze ziemi''. Potem skrócono nazwę do „polska” i zaczęto przymiotnik\
      \ traktować jako rzeczownik, a także pisać wielką literą jako nazwę własną.\n\
      :* węg. '''Lengyelország''', lit. '''Lenkija''', tur. '''Lehistan''' (Polska\
      \ przedrozbiorowa), pers. '''لهستان''' (Lahestân), orm. '''Լեհաստան''' (Lehastan)\
      \ – od plemienia [[Lędzianie|Lędzian/Lędziców]], to z kolei od staroruskiego\
      \ lub staropolskiego etnonimu ''lęděnin'' i jego zgrubienia ''lęch'', być może\
      \ od [[język prasłowiański|prasłow.]] *''lędo'' – „pole”. Nazwa ''Lędzianin''\
      \ w języku ruskim została skrócona do ''Lach'' – taka forma upowszechniła się\
      \ na wschodzie i została przyjęta przez Turków. Z drugiej strony Polacy od czasów\
      \ [[Wincenty Kadłubek|Wincentego Kadłubka]] nazywali siebie Lechitami, wierząc,\
      \ że pochodzą od legendarnego [[Lech (postać legendarna)|Lecha]].\n:* łac.,\
      \ wł., hiszp., bask., rum., bretoński '''Polonia''', port. '''Polónia''', '''Polônia'''\
      \ (Braz.) katal. '''Polònia''', gr. '''Πολωνία''' (Polonía)\n:* fr. '''Pologne'''\n\
      :* niem., duń., szw., norw., hol. '''Polen'''\n:* fryzyjski '''Pollen'''\n:*\
      \ ang. '''Poland''', isl. '''Pólland'''\n:* fiń. '''Puola''', est. '''Poola'''\n\
      :* cz. '''Polsko''', słow. '''Poľsko'''\n:* ros. '''Польша''' (Polsza), białorus.\
      \ '''Польшча''' (Polszcza), ukr. '''Польща''' (Polszcza), bułg. '''Полша'''\
      \ (Polsza) – według [[Max Vasmer|Maksa Vasmera]] rosyjska nazwa, znana już od\
      \ XVII wieku, jest zapożyczeniem od form ukraińskiej i białoruskiej, te zaś\
      \ pochodzą od staropolskiego [[miejscownik]]a [[Liczba pojedyncza|l. pojedynczej]]\
      \ ''w Polszcze'' od ''Polska'' (ta z kolei od ''Polska ziemia''/ *Роlьskа(jа)\
      \ zemia = pole, ziemia równinna)<ref>Max Vasmer, ''[http://vasmer.narod.ru/p3/d321.htm\
      \ Этимологический словарь русского языка]'', tom 3, s. 321, {{lang|ru}}</ref>\n\
      :* serb.-chorw. '''Poljska'''/'''Пољска''', słoweń. '''Poljska'''\n:* łot. '''Polija'''\n\
      :* tur. '''Polonya''' (Polska okresu rozbiorów i współczesna)\n:* arab. '''بولندا'''\
      \ (Bulanda)\n:* hebr. '''פולין''' (Polin), '''פולניה''' (Polania)\n:* jidysz\
      \ '''פּױלן''' (Poyln)\n:* afr. '''Pole'''\n:* chiń. '''波兰''' (Bōlán)\n:* szkocki\
      \ gaelicki '''a' Phòlainn'''\n:* walijski '''Gwlad Pwyl'''\n:* japoński '''ポーランド'''\
      \ (Pōrando)\n:* koreański: w Korei Południowej: 폴란드 (Phollandu), w Korei Północnej:\
      \ 뽈스까 (Ppolsukka)\n:* wietnamski '''Ba Lan'''\n:* indonezyjski '''Polandia'''\n\
      :* esperanto '''Polio''', '''Polujo''', '''Pollando'''\n\n== Przypisy ==\n{{Przypisy|\n\
      * <ref name=Kalkowski>{{Cytuj książkę | autor = [[Tadeusz Kałkowski]] | tytuł\
      \ = Tysiąc lat monety polskiej | strony = 40–41 | miejsce = Kraków | wydawca\
      \ = Wydawnictwo Literackie | data = 1974 | isbn =}}</ref>\n* <ref name=Staniewska>{{Cytuj\
      \ pismo | autor = [[Katarzyna Staniewska]] | tytuł = Jak powstała Polska | czasopismo\
      \ = Wiedza i Życie nr 4 | strony = | wydanie = | miejsce = Warszawa | rok =\
      \ 2000}}</ref>\n}}\n\n== Uwagi ==\n{{Uwagi}}\n\n== Bibliografia ==\n* {{cytuj\
      \ książkę |nazwisko = Kuraś | imię = Stanisław | tytuł = Bullarium Poloniae\
      \ t. 1 1000–1342 | wydawca = Żcole Francais de Rome, PAN. Inst. Hist.; Katol.\
      \ Uniw. Lubelski | miejsce = Romae | rok = 1982 | strony = | isbn = |odn= tak}}\n\
      * {{cytuj książkę |nazwisko = Klemensiewicz | imię = Zenon | tytuł = Gramatyka\
      \ historyczna języka polskiego | wydawca = Państwowe Wydawnictwo Naukowe | miejsce\
      \ = Warszawa | rok = 1981 | strony = | isbn = 83-01-00995-0 |odn= tak}}\n* {{cytuj\
      \ książkę | nazwisko = Wydra | imię = Wiesław | tytuł = Chrestomatia staropolska.\
      \ Teksty do roku 1543 | wydawca = Ossolineum | miejsce = Wrocław | rok = 1984\
      \ | isbn = 83-04-01568-4 | odn = tak}}\n* {{cytuj książkę |nazwisko = Łowmiański\
      \ | imię = Henryk | tytuł = Początki Polski | wydawca = Polskie Wydawnictwo\
      \ Naukowe | miejsce = Warszawa | rok = 1967 | strony = | isbn = |odn= tak}}\n\
      * {{cytuj książkę |nazwisko = Pertz | imię = Georgius Heinricus | tytuł = Adami\
      \ Gesta Hammaburgensis Ecclesiae Pontificum | wydawca = Impensis Bibliopolii\
      \ Hahniani  | miejsce = Hannoverae | rok = 1846 | strony = | isbn = |odn= tak}}\n\
      * {{cytuj książkę |imię = August |nazwisko=Bielowski | tytuł = Monumenta Poloniae\
