      \ Warszawie]] – największej giełdy w Europie Środkowo-Wschodniej]]\n\nStruktura\
      \ zatrudnienia w polskiej gospodarce odbiega od europejskich standardów, gdyż\
      \ 12,6% ludności pracuje w rolnictwie (przy średniej unijnej 5,0%), w przemyśle\
      \ pracuje 30,4% ludności (średnia UE to 24,9%), natomiast w sektorze usług pracuje\
      \ 57% ludności Polski (średnia UE to 70,1%)<ref name=\"labour\">{{Cytuj stronę\
      \ |url = http://ec.europa.eu/eurostat/statistics-explained/index.php/Archive:Labour_force_survey_overview_2012\
      \ |tytuł = Labour market and labour force statistics |autor = Eurostat |archiwum\
      \ = https://web.archive.org/web/20160309095246/http://ec.europa.eu/eurostat/statistics-explained/index.php/Archive:Labour_force_survey_overview_2012\
      \ |zarchiwizowano = 2016-03-09 |data dostępu = 2016-03-08}}</ref>. [[Wskaźnik\
      \ zatrudnienia]] osób w wieku 15–64 lat wynosi w Polsce 59,7%, podczas gdy średnia\
      \ UE to 64,2%<ref name=\"labour\"/>. Według OECD w 2012 r. Polacy byli piątym\
      \ (spośród państw UE drugim po [[Grecja|Grekach]]) najdłużej pracującym narodem\
      \ na świecie – przeciętna roczna liczba przepracowanych godzin na 1 pracownika\
      \ wyniosła 1929<ref>{{Cytuj stronę |url = http://stats.oecd.org/Index.aspx?DatasetCode=ANHRS\
      \ |tytuł = Average annual hours actually worked per worker |autor = OECD |opublikowany\
      \ = |archiwum = https://web.archive.org/web/20150605114606/http://stats.oecd.org/Index.aspx?DataSetCode=ANHRS\
      \ |zarchiwizowano = 2015-06-05 |data dostępu = 2013-12-03}}</ref>.\n\nW związku\
      \ z lepszą mechanizacją pracy wzrosła także [[wydajność pracy]] w Polsce<ref>{{Cytuj\
      \ stronę |url = http://praca.gazeta.pl/gazetapraca/1,73343,2567421.html |tytuł\
      \ = Dlaczego Polacy pracują wydajniej niż Niemcy? |autor = Aneta Borowiec, Marek\
      \ Ratajczak |archiwum = https://web.archive.org/web/20080425230246/http://praca.gazeta.pl/gazetapraca/1,73343,2567421.html\
      \ |zarchiwizowano = 2008-04-25 |data dostępu = 2008-12-04}}</ref>. Polska ma\
      \ także jeden z najniższych w Europie współczynników przynależności do [[Związek\
      \ zawodowy|związków zawodowych]], wynoszący 14% z przewagą w sektorze państwowym<ref>{{Cytuj\
      \ stronę |url = https://web.archive.org/web/*/http://www.geocities.com/lbc_1917/2073mrozowicki.htm\
      \ |tytuł = Dlaczego robotnicy nie protestują? |autor = Adam Mrozowski |opublikowany\
      \ = Bez Dogmatu nr 70 |data dostępu = 2008-12-04}}</ref>, w [[Irlandia|Irlandii]]\
      \ wynosi on 45%<ref>{{Cytuj stronę |url = http://www.lewica.pl/index.php?id=15083\
      \ |tytuł = Czego liberałowie nie mówią o Irlandii |autor = Bartosz Machalica\
      \ |opublikowany = Krytyka Polityczna |archiwum = https://web.archive.org/web/20120119010905/http://www.lewica.pl/index.php?id=15083\
      \ |zarchiwizowano = 2012-01-19 |data dostępu = 2008-12-04}}</ref>, a w Szwecji\
      \ 80%. Słabe związki są wskazywane jako jedna z przyczyn niskich płac w stosunku\
      \ do [[Produkt krajowy brutto|PKB]], które w 2016 wyniosły 47,5% PKB, 8 punktów\
      \ procentowych poniżej średniej UE, co dało 6 najniższy wskaźnik w UE<ref>{{Cytuj\
      \ stronę |url = http://finanse.wp.pl/kat,1033745,title,Ekspert-place-sa-niskie-bo-pracownicy-maja-slaba-pozycje-Strategia-o-tym-milczy,wid,18705831,wiadomosc.html\
      \ |tytuł = Ekspert: płace są niskie, bo pracownicy mają słabą pozycję; Strategia\
      \ o tym milczy |autor = Sonia Sobczyk |data = 2017-02-19 |opublikowany = PAP\
      \ w Finanse – WP.PL |archiwum = https://web.archive.org/web/20170221072212/http://finanse.wp.pl/kat,1033745,title,Ekspert-place-sa-niskie-bo-pracownicy-maja-slaba-pozycje-Strategia-o-tym-milczy,wid,18705831,wiadomosc.html\
      \ |zarchiwizowano = 2017-02-21 |data dostępu = 2017-02-21}}</ref>.\n\nW 2012\
      \ roku Polska zajmowała pierwsze miejsce spośród państw Unii Europejskiej pod\
      \ względem liczby osób pracujących na [[Umowa na czas określony|umowę na czas\
      \ określony]] – 26,9%, podczas gdy w Unii Europejskiej jest to średnio 13,7%<ref\
      \ name=\"labour\" />.\n\n[[Płaca minimalna|Minimalne wynagrodzenie brutto]]\
      \ w 2017 roku: 2000 zł<ref name=\"zus-minimalne-wynagrodzenie\">{{Cytuj stronę\
      \ |url = http://www.zus.pl/default.asp?p=1&id=1019 |tytuł = Minimalne wynagrodzenie\
      \ za pracę od 2003 r. |autor = Zakład Ubezpieczeń Społecznych |archiwum = https://web.archive.org/web/20140404040444/http://zus.pl/default.asp?p=1&id=1019\
      \ |zarchiwizowano = 2014-04-04 |data dostępu = 2014-02-09}}</ref>, a przeciętna\
      \ płaca brutto w sektorze przedsiębiorstw wynosi 4221,50 zł<ref name=\"przecietnaplaca\"\
      >{{Cytuj stronę |url = http://stat.gov.pl/obszary-tematyczne/rynek-pracy/pracujacy-zatrudnieni-wynagrodzenia-koszty-pracy/przecietne-zatrudnienie-i-wynagrodzenie-w-sektorze-przedsiebiorstw-w-kwietniu-2014-r-,3,25.html\
      \ |tytuł = Przeciętne zatrudnienie i wynagrodzenie w sektorze przedsiębiorstw\
      \ w grudniu 2013 |archiwum = https://web.archive.org/web/20160331164018/http://stat.gov.pl/obszary-tematyczne/rynek-pracy/pracujacy-zatrudnieni-wynagrodzenia-koszty-pracy/przecietne-zatrudnienie-i-wynagrodzenie-w-sektorze-przedsiebiorstw-w-kwietniu-2014-r-,3,25.html\
      \ |zarchiwizowano = 2016-03-31 |data dostępu = 2016-03-08}}</ref>.\n\nZgodnie\
      \ z danymi [[Główny Urząd Statystyczny|GUS]], stopa bezrobocia w grudniu 2016\
      \ wynosiła 8,3%<ref>{{Cytuj stronę |url = http://stat.gov.pl/obszary-tematyczne/rynek-pracy/bezrobocie-rejestrowane/miesieczna-informacja-o-bezrobociu-rejestrowanym-w-polsce-w-grudniu-2013-r-,1,22.html\
      \ |tytuł = Miesięczna informacja o bezrobociu rejestrowanym w Polsce w grudniu\
      \ 2013 |archiwum = https://web.archive.org/web/20160323044410/http://stat.gov.pl/obszary-tematyczne/rynek-pracy/bezrobocie-rejestrowane/miesieczna-informacja-o-bezrobociu-rejestrowanym-w-polsce-w-grudniu-2013-r-,1,22.html\
      \ |zarchiwizowano = 2016-03-23 |data dostępu = 2016-03-08}}</ref>. Została zrewidowana\
      \ do 8,2%<ref name=\"gus2020\">{{Cytuj |autor = GUS |tytuł = Stopa bezrobocia\
      \ rejestrowanego w latach 1990–2019 |data dostępu = 2020-02-04 |opublikowany\
      \ = stat.gov.pl |url = https://stat.gov.pl/obszary-tematyczne/rynek-pracy/bezrobocie-rejestrowane/stopa-bezrobocia-rejestrowanego-w-latach-1990-2019,4,1.html\
      \ |archiwum = https://web.archive.org/web/20191014015912/https://stat.gov.pl/obszary-tematyczne/rynek-pracy/bezrobocie-rejestrowane/stopa-bezrobocia-rejestrowanego-w-latach-1990-2019,4,1.html\
      \ |zarchiwizowano = 2019-10-14 |język = pl}}</ref>.\n\n=== Handel zagraniczny\
      \ ===\n[[Eksport]] w 2015 był szacowany na 200 mld dolarów<ref name=\"obroty\"\
      >{{Cytuj |url = http://stat.gov.pl/obszary-tematyczne/ceny-handel/handel/obroty-towarowe-handlu-zagranicznego-ogolem-i-wedlug-krajow-w-2015-r-,2,8.html\
      \ |tytuł = Główny Urząd Statystyczny / Obszary tematyczne / Ceny. Handel / Handel\
      \ / Ruch graniczny oraz przepływy towarów i usług na zewnętrznej granicy Unii\
      \ Europejskiej na terenie Polski |opublikowany = stat.gov.pl |język = pl |data\
      \ dostępu = 2020-07-09 |archiwum = https://web.archive.org/web/20190201171907/http://stat.gov.pl/obszary-tematyczne/ceny-handel/handel/obroty-towarowe-handlu-zagranicznego-ogolem-i-wedlug-krajow-w-2015-r-,2,8.html\
      \ |zarchiwizowano = 2019-02-01}}</ref>, co daje ósme miejsce wśród państw Unii\
      \ Europejskiej oraz 26. miejsce w świecie<ref>{{Cytuj stronę |url = https://www.cia.gov/library/publications/the-world-factbook/rankorder/2078rank.html\
      \ |tytuł = CIA – The World Factbook |język = en |archiwum = https://web.archive.org/web/20151106055148/https://www.cia.gov/library/publications/the-world-factbook/rankorder/2078rank.html\
      \ |zarchiwizowano = 2015-11-06 |data dostępu = 2013-12-03}}</ref>. Najważniejszymi\
      \ partnerami handlowymi pod względem eksportu są [[Niemcy]] (25,1% obrotu),\
      \ [[Wielka Brytania]] (6,8%) i [[Czechy]] (6,3%)<ref name=\"handel\">{{Cytuj\
      \ stronę |url = http://www.stat.gov.pl/cps/rde/xbcr/gus/RS_rocznik_statystyczny_handlu_zagranicznego_2013.pdf\
      \ |tytuł = Rocznik Statystyczny Handlu Zagranicznego 2013 |autor = GUS |opublikowany\
      \ = 2013-10-28 |archiwum = https://web.archive.org/web/20131126020932/http://www.stat.gov.pl/cps/rde/xbcr/gus/RS_rocznik_statystyczny_handlu_zagranicznego_2013.pdf\
      \ |zarchiwizowano = 2013-11-26 |data dostępu = 2013-12-03}}</ref>.\n<!-- [[WP:WER|Potrzebne\
      \ źródła]]\nW danych GUS Polski eksport za 2016 r. wzrósł o 2,3%, import 0,9%\n\
      \nEksport Polski za rok 2017 wyniósł 203,7 mld euro to o 10,2% więcej, niż w\
      \ 2016 r.\n\nZa 2018 r. handel Polski po raz pierwszy był warty bilion PLN.\
      \ Wciąż najważniejszym partnerem Polski są Niemcy.\n\nW 2019 Polska miała nadwyżke\
      \ w handlu zagranicznym na poziomie 7,9 mld zł (równowartość 1,8 mld euro) –\
      \ dane GUS.\n\nW 2020 r. Polska odnotowała wzrost eksportu o 2,8%, który wyniósł\
      \ 1059,9 mld zł jednocześnie import spadł o 2% i wyniósł 998,3 mld PLN. Największy\
      \ udział w eksporcie Polska niezmiennie osiąga z krajami rozwiniętymi 86,2%\
      \ (w tym UE 73,8%), a w imporcie wynosło to odpowiednio 64,7% (w tym UE 55%).\
      \ Najmniejszt udział odnotowano z krajami środko-wschodnimi 6% w eksporcie i\
      \ 6,2% w imporcie.\n\nW 2021 eksport wzrósł o 20,1% do 288,1 mld euro a import\
      \ o 26,3% – 289,6 mld euro\n\nW 2022 eksport wyniósł 348,8 mld euro i zwiększył\
      \ sie w porównaniu z poprzednim rokiem o 19,3%\n\nW 2023 za ostatnie pół roku\
      \ polski eksport wzrósl w porównaniu z ubiegłym rokiem o 4,9% -->\n\nImport\
      \ w 2015 szacowany był na 197 mld dolarów<ref name=\"obroty\" /> i dał 25. miejsce\
      \ na świecie (ósme miejsce wśród państw unijnych)<ref>{{Cytuj stronę |url =\
      \ https://www.cia.gov/library/publications/the-world-factbook/rankorder/2087rank.html?countryName=Poland&countryCode=pl&regionCode=eu&rank=23#pl\
      \ |tytuł = CIA – The World Factbook |język = en |archiwum = https://web.archive.org/web/20131022220321/https://www.cia.gov/library/publications/the-world-factbook/rankorder/2087rank.html?countryName=Poland&countryCode=pl&regionCode=eu&rank=23#pl\
      \ |zarchiwizowano = 2013-10-22 |data dostępu = 2013-12-03}}</ref>. Najważniejszymi\
      \ partnerami handlowymi pod względem importu są Niemcy (21,3% obrotu), [[Rosja]]\
      \ (14%) i [[Chiny (region)|Chiny]] (8,9%)<ref name=\"handel\"/>.\n\n[[Bilans\
      \ handlowy]] był w 2015 dodatni, nadwyżka obrotów towarowych wyniosła ponad\
      \ 2,6 mld dolarów<ref>{{Cytuj |autor = ideo – www.ideo.pl |tytuł = Obroty towarowe\
      \ handlu zagranicznego ogółem i według krajów w 2015 |czasopismo = stat.gov.pl\
      \ |data dostępu = 2017-01-30 |url = http://stat.gov.pl/obszary-tematyczne/ceny-handel/handel/obroty-towarowe-handlu-zagranicznego-ogolem-i-wedlug-krajow-w-2015-r-,2,8.html\
      \ |archiwum = https://web.archive.org/web/20170202064317/http://stat.gov.pl/obszary-tematyczne/ceny-handel/handel/obroty-towarowe-handlu-zagranicznego-ogolem-i-wedlug-krajow-w-2015-r-,2,8.html\
      \ |zarchiwizowano = 2017-02-02}}</ref>.\n\n=== Największe przedsiębiorstwa w\
      \ Polsce ===\n{{Osobna sekcja|Gospodarka Polski|Największe przedsiębiorstwa\
      \ w Polsce}}\nW 2020 r. na dorocznej liście ''dwóch tysięcy największych [[Spółka\
      \ publiczna|spółek publicznych]] na świecie'' magazynu [[Forbes]] znajdowało\
      \ się sześć polskich przedsiębiorstw. Za największe z nich uznano [[Powszechny\
      \ Zakład Ubezpieczeń|Grupę PZU]] (731. miejsce w rankingu), [[Orlen|PKN Orlen]]\
      \ (775. miejsce w rankingu) oraz [[Powszechna Kasa Oszczędności Bank Polski|PKO\
      \ Bank Polski]] (958. miejsce w rankingu)<ref>{{Cytuj |tytuł = Global 2000 –\
      \ The World’s Largest Public Companies 2020 |data dostępu = 2020-12-26 |opublikowany\
      \ = Forbes |url = https://www.forbes.com/global2000/ |język = en}}</ref>. Większość\
      \ polskiego PKB wytwarzają jednak małe i średnie przedsiębiorstwa.\n\nW 2020\
      \ r. na liście ''100 największych polskich firm prywatnych'' magazynu [[Forbes]]\
      \ w czołowej dziesiątce znalazły się: [[CD Projekt]], [[Cyfrowy Polsat]], [[Dino\
      \ Polska]], [[LPP]], [[Zakłady Farmaceutyczne Polpharma|Polpharma]], [[Maspex|Grupa\
      \ Maspex]], [[Asseco Poland]], [[Synthos]], [[Toruńskie Zakłady Materiałów Opatrunkowych|TZMO]],\
      \ [[CCC (przedsiębiorstwo)|CCC]]<ref>{{Cytuj |tytuł = 100 Największych Polskich\
      \ Firm Prywatnych. Nowy lider rankingu „Forbesa” |data dostępu = 2020-12-26\
      \ |opublikowany = Forbes.pl |url = https://www.forbes.pl/biznes/najwieksze-polskie-firmy-prywatne-2020-ranking-forbesa/2mlh0tf\
      \ |język = pl}}</ref>.\n\n{{Zobacz też|Lista banków działających w Polsce}}\n\
      \n=== Turystyka ===\n[[Plik:Śnieżka z zachodu.jpg|mały|[[Śnieżka]] – jedna z\
      \ pierwszych gór europejskich odwiedzanych przez turystów]]\n{{Osobny artykuł|Turystyka\
      \ w Polsce}}\nTurystyka w Polsce ma wpływ na gospodarkę całego kraju poprzez\
      \ rynek usług turystycznych. Do najbardziej atrakcyjnych dla turystów miast\
      \ należą [[Kraków]], [[Warszawa]], [[Wrocław]], [[Gdańsk]], [[Poznań]], [[Szczecin]],\
      \ [[Lublin]], [[Toruń]] i [[Zakopane]]. Bogatą ofertę turystyczną posiadają\
      \ także [[Krynica-Zdrój]], [[Zielona Góra]], [[Karpacz]], [[Szklarska Poręba]],\
      \ [[Biecz]], [[Zamość]], [[Sandomierz]], [[Kazimierz Dolny]], [[Lwówek Śląski]],\
      \ [[Częstochowa]], [[Świebodzin]], [[Gniezno]], [[Frombork]], [[Malbork]], [[Kartuzy]],\
      \ [[Gdynia]], [[Koszalin]], [[Jelenia Góra]], [[Sopot]], [[Słupsk]], [[Kołobrzeg]],\
      \ [[Świnoujście]] i [[Międzyzdroje]]. Licznie odwiedzane są: [[Kopalnia Soli\
      \ „Wieliczka”]], muzeum [[Dom Urodzenia Fryderyka Chopina]] w [[Żelazowa Wola|Żelazowej\
      \ Woli]] koło [[Sochaczew]]a, [[Obozy niemieckie (1933–1945)|niemiecki obóz\
      \ koncentracyjny]] [[Auschwitz-Birkenau]], wybrzeże [[Morze Bałtyckie|Morza\
      \ Bałtyckiego]], [[Pojezierze Mazurskie]] oraz [[Tatry]], w których znajduje\
      \ się najwyższy szczyt Polski oraz słynna [[Orla Perć]]. Popularnymi terenami\
      \ wypoczynku są również [[Góry Świętokrzyskie]], [[Sudety]], [[Beskidy]], [[Pieniny]],\
      \ [[Wyżyna Krakowsko-Częstochowska|Jura Krakowsko-Częstochowska]] i [[Roztocze\
      \ (kraina)|Roztocze]], a także pojezierza ([[Pojezierze Suwalskie|Suwalskie]],\
      \ [[Pojezierze Wielkopolskie|Wielkopolskie]], [[Pojezierze Lubuskie|Lubuskie]]\
      \ i [[Pojezierze Pomorskie|Pomorskie]]) oraz okolice zalewów – [[Zalew Szczeciński|Szczecińskiego]]\
      \ i [[Zalew Wiślany|Wiślanego]]. Niektóre małe miasta Polski zrzeszone w międzynarodowym\
      \ stowarzyszeniu [[Cittàslow]] dążą do poprawy jakości życia poprzez ochronę\
      \ środowiska naturalnego i popieranie różnorodności kulturalnej (w tym promocję\
      \ tradycyjnych lokalnych produktów) i dzięki temu stają się atrakcyjne dla turystów<ref>{{Cytuj\
      \ |url = http://cittaslowpolska.pl/index.php/pl/ |tytuł = Cittaslow |opublikowany\
      \ = cittaslowpolska.pl |data dostępu = 2017-11-26 |archiwum = https://web.archive.org/web/20171129035459/http://cittaslowpolska.pl/index.php/pl/\
      \ |zarchiwizowano = 2017-11-29}}</ref>. Wraz z rozwojem infrastruktury drogowej\
      \ rozwija się [[turystyka rowerowa]] (np. [[Wschodni Szlak Rowerowy Green Velo]])<ref>{{Cytuj\
      \ stronę |url = http://greenvelo.pl/ |tytuł = Szlak Green Velo |opublikowany\
      \ = greenvelo.pl |archiwum = https://web.archive.org/web/20170831140155/http://greenvelo.pl/\
      \ |zarchiwizowano = 2017-08-31}}</ref>, natomiast na naturalnych ciekach i zbiornikach\
      \ sztucznych są wytyczone [[Szlak kajakowy|szlaki kajakowe]], np. Szlak wodny\
      \ [[Pilica|Pilicy]]<ref>{{Cytuj stronę |url = http://kajak.org.pl/splywww/szlak96\
      \ |tytuł = Pilica |opublikowany = kajak.org.pl |archiwum = https://web.archive.org/web/20170816010424/http://kajak.org.pl/splywww/szlak96\
      \ |zarchiwizowano = 2017-08-16}}</ref>. Wiele miast posiada specjalnie przygotowane\
      \ oferty do zwiedzania ich z dziećmi, m.in. Wrocław z [[Wrocławskie krasnale|wrocławskimi\
      \ krasnalami]], Warszawa, [[Kielce]], Gdańsk i Szczecin<ref>{{Cytuj stronę |url\
      \ = http://www.warsawtour.pl/warszawa-dla-dzieci.html |tytuł = Warszawa dla\
      \ Dzieci |opublikowany = warsawtour.pl |archiwum = https://web.archive.org/web/20180106115524/http://www.warsawtour.pl/warszawa-dla-dzieci.html\
      \ |zarchiwizowano = 2018-01-06}}</ref><ref>{{Cytuj stronę |url = http://www.dzieckowpodrozy.pl/kielce-atrakcje-dla-dzieci/\
      \ |tytuł = Kielce – atrakcje dla dzieci |opublikowany = dzieckowpodrozy.pl |archiwum\
      \ = https://web.archive.org/web/20170903033820/http://www.dzieckowpodrozy.pl/kielce-atrakcje-dla-dzieci/\
      \ |zarchiwizowano = 2017-09-03}}</ref><ref>{{Cytuj stronę |url = http://www.dzieckowpodrozy.pl/gdansk-atrakcje-dla-dzieci-turystyczne-weekend/\
      \ |tytuł = Gdańsk z dzieckiem – 21 atrakcji nie tylko na weekend! |archiwum\
      \ = https://web.archive.org/web/20170822001630/http://www.dzieckowpodrozy.pl/gdansk-atrakcje-dla-dzieci-turystyczne-weekend/\
      \ |zarchiwizowano = 2017-08-22 |data dostępu = 2017-09-02}}</ref><ref>{{Cytuj\
      \ stronę |url = http://www.dzieckowpodrozy.pl/szczecin-atrakcje-dla-dzieci-arkonka-aquapark-opinie/\
      \ |tytuł = Szczecin – atrakcje dla dzieci |opublikowany = dzieckowpodrozy.pl\
      \ |archiwum = https://web.archive.org/web/20170906173422/http://www.dzieckowpodrozy.pl/szczecin-atrakcje-dla-dzieci-arkonka-aquapark-opinie/\
      \ |zarchiwizowano = 2017-09-06}}</ref>. Popularne są także miejscowości [[uzdrowisko]]we,\
      \ takie jak [[Połczyn-Zdrój]] czy [[Ciechocinek]].\n\nPolska jest częścią światowego\
      \ rynku turystycznego i przeżywa obecnie wzrostową tendencję liczby odwiedzających.\
      \ W 2015 roku Polskę odwiedziło 16,728 mln turystów (4,6% więcej niż w roku\
      \ poprzednim), generując dla niej przychody na poziomie 9,728 mld [[Dolar amerykański|dolarów]]<ref>{{Cytuj\
      \ stronę |url = https://www.unwto.org/archive/global/publication/unwto-tourism-highlights-2016-edition\
      \ |tytuł = UNWTO Tourism Highlights, 2016 Edition |autor = |rok = 2016 |opublikowany\
      \ = [[Światowa Organizacja Turystyki|UNWTO]] |strony = 8 |język = en |archiwum\
      \ = https://web.archive.org/web/20200614090850/https://www.unwto.org/archive/global/publication/unwto-tourism-highlights-2016-edition\
      \ |zarchiwizowano = 2020-06-14 |data dostępu = 2016-10-04}}</ref>. W 2016 liczba\
      \ przyjazdów do Polski wyniosła 80,5 mln, z czego 17,5 mln z tej liczby to przyjazdy\
      \ uznawane za turystyczne (z przynajmniej jednym noclegiem)<ref>{{Cytuj stronę\
      \ |url = http://biznes.onet.pl/wiadomosci/turystyka/turysci-zagraniczni-w-polsce-dane-za-2016-r/m23e0l\
      \ |tytuł = Cudzoziemcy w Polsce |opublikowany = biznes.onet.pl |archiwum = https://web.archive.org/web/20170903030209/http://biznes.onet.pl/wiadomosci/turystyka/turysci-zagraniczni-w-polsce-dane-za-2016-r/m23e0l\
      \ |zarchiwizowano = 2017-09-03}}</ref>.\n\nW listopadzie 2018 Polska zajęła\
      \ 7 miejsce w Rankingu Turystyki Międzynarodowej „Tourism Rank”<ref>{{Cytuj\
      \ stronę |url = https://www.tourismrank.com/ |tytuł = The Tourism Rank |opublikowany\
      \ = tourismrank.com |archiwum = https://web.archive.org/web/20201107144527/https://www.tourismrank.com/\
      \ |zarchiwizowano = 2020-11-07}}</ref>.\n\n=== Polska w rankingach ===\n{{Osobny\
      \ artykuł|Polska w rankingach 1987-2013}}\n\n* Polska jest 4. na świecie producentem\
      \ mebli<ref>{{Cytuj stronę |url = http://wiadomosci.gazeta.pl/wiadomosci/51,114871,13240615.html?i=4\
      \ |tytuł = Producent mebli |archiwum = https://web.archive.org/web/20130520081644/http://wiadomosci.gazeta.pl/wiadomosci/51,114871,13240615.html?i=4\
      \ |zarchiwizowano = 2013-05-20 |data dostępu = 2013-01-26}}</ref>.\n* Polska\
      \ jest 3. na świecie producentem jabłek<ref>{{Cytuj stronę |url = http://www.portalspozywczy.pl/owoce-warzywa/wiadomosci/polska-drugim-na-swiecie-producentem-jablek,79887.html\
      \ |tytuł = Producent jabłek |archiwum = https://web.archive.org/web/20130101151543/http://www.portalspozywczy.pl/owoce-warzywa/wiadomosci/polska-drugim-na-swiecie-producentem-jablek,79887.html\
      \ |zarchiwizowano = 2013-01-01 |data dostępu = 2013-01-26}}</ref>.\n* Polska\
      \ jest 3. producentem autobusów w Unii Europejskiej<ref>{{Cytuj stronę |url\
      \ = http://wyborcza.biz/biznes/1,101562,6605080,Polska_trzecim_producentem_autobusow_w_UE.html\
      \ |tytuł = Producent autobusów |archiwum = https://web.archive.org/web/20130622073536/http://wyborcza.biz/biznes/1,101562,6605080,Polska_trzecim_producentem_autobusow_w_UE.html\
      \ |zarchiwizowano = 2013-06-22 |data dostępu = 2013-01-26}}</ref>.\n* Polska\
      \ jest 4. producentem rowerów w Unii Europejskiej<ref>{{Cytuj |tytuł = Polska\
      \ jest czwartym producentem rowerów w UE |data = 2021-04-10 |data dostępu =\
      \ 2021-04-11 |opublikowany = forsal.pl |url = https://forsal.pl/biznes/przemysl/artykuly/8137407,polska-jest-czwartym-producentem-rowerow-w-ue.html\
      \ |język = pl}}</ref>.\n* [[Wskaźnik jakości życia|Wskaźnik Jakości Życia]]\
      \ 2020 (''Quality of Life Index''): 36 miejsce na 80 wyprzedzając m.in. Włochy,\
      \ Koreę Południową i Białoruś<ref>{{Cytuj |tytuł = Quality of Life Index by\
      \ Country 2020 |data dostępu = 2020-12-26 |opublikowany = numbeo.com |url =\
      \ https://www.numbeo.com/quality-of-life/rankings_by_country.jsp?title=2020&displayColumn=0}}</ref>.\n\
      * ''World Investment Report 2011'' ([[Konferencja Narodów Zjednoczonych ds.\
      \ Handlu i Rozwoju]] – UNCTAD): Polska 6. najbardziej atrakcyjnym do inwestowania\
      \ krajem świata. Kraków został natomiast uznany za najbardziej perspektywiczne\
      \ miasto dla działalności innowacyjnej na świecie<ref>{{Cytuj stronę |url =\
      \ http://biznes.newsweek.pl/pawlak--polska-jest-bardzo-atrakcyjnym-krajem-dla-inwestorow,79961,1,1.html\
      \ |tytuł = Pawlak: Polska jest bardzo atrakcyjnym krajem dla inwestorów |nazwisko\
      \ = |imię = |opublikowany = Newsweek.pl |data = 2011-07-25 |archiwum = https://web.archive.org/web/20130421055024/http://biznes.newsweek.pl/pawlak--polska-jest-bardzo-atrakcyjnym-krajem-dla-inwestorow,79961,1,1.html\
      \ |zarchiwizowano = 2013-04-21 |data dostępu = 2012-04-01}}</ref>.\n* Wskaźnik\
      \ Zaufania Inwestorów Zagranicznych 2013 (''Foreign Direct Investment Confidence\
      \ Index'' według przedsiębiorstwa konsultingowego A.T. Kearney): 19. miejsce<ref>{{Cytuj\
      \ stronę |url = http://www.atkearney.com/index.php/Publications/foreign-direct-investment-confidence-index.html\
      \ |tytuł = 2010 Foreign Direct Investment Confidence Index |język = en |archiwum\
      \ = https://web.archive.org/web/20100414210405/http://www.atkearney.com/index.php/Publications/foreign-direct-investment-confidence-index.html\
      \ |zarchiwizowano = 2010-04-14 |data dostępu = 2013-12-03}}</ref>.\n\n== Infrastruktura\
      \ i transport ==\n=== Transport drogowy ===\n{{Osobny artykuł|Autostrady i drogi\
      \ ekspresowe w Polsce|Drogi krajowe w Polsce|Drogi wojewódzkie w Polsce}}\n\
      [[Plik:NowaMapaStan.svg|mały|upright=1.3|Stan autostrad i dróg ekspresowych\
      \ w Polsce\n{{legenda|green|istniejące}}\n{{legenda|red|w budowie}}\n{{legenda|#B07419|na\
      \ etapie przetargu}}\n{{legenda|gray|planowane}}]]\n\n[[Transport drogowy]]\
      \ odgrywa w Polsce duże znaczenie, ponieważ ponad 85% ładunków przewożonych\
      \ jest ciężarówkami. Oprócz tego przez Polskę porusza się wiele pojazdów w ruchu\
      \ tranzytowym między Europą Zachodnią i Południową oraz państwami wschodniej\
      \ części kontynentu – [[Estonia|Estonią]], [[Białoruś|Białorusią]], [[Litwa|Litwą]],\
      \ [[Łotwa|Łotwą]], [[Rosja|Rosją]], [[Ukraina|Ukrainą]] i innymi państwami.\n\
      \nW 2011 r. długość sieci drogowej wynosiła 412 tys.&nbsp;km, w tym 280 tys.&nbsp;km\
      \ dróg o nawierzchni twardej. Tym samym wskaźnik gęstości dróg o nawierzchni\
      \ twardej wyniósł w 2011 r. 89,7&nbsp;km na 100&nbsp;km². Najwyższą wartość\
      \ wskaźnika odnotowano w województwie śląskim (180,1&nbsp;km na 100&nbsp;km²),\
      \ najniższą zaś w warmińsko-mazurskim (53,2&nbsp;km na 100&nbsp;km²)<ref>{{cytuj\
      \ pismo |url = http://stat.gov.pl/cps/rde/xbcr/gus/TL_transport_drogowy_2010-2011.pdf\
      \ |czasopismo = Transport drogowy w Polsce w latach 2010, 2011 |wydawca = Główny\
      \ Urząd Statystyczny |strony = 44–45 |rok = 2013 |issn = 2083-4438}}</ref>.\n\
      \nObecnie w Polsce istnieją następujące autostrady:\n\n* [[Autostrada A1 (Polska)|A1]],\n\
      * [[Autostrada A2 (Polska)|A2]],\n* [[Autostrada A4 (Polska)|A4]],\n* [[Autostrada\
      \ A6 (Polska)|A6]],\n* [[Autostrada A8 (Polska)|A8]],\n* [[Autostrada A18 (Polska)|A18]].\n\
      \nPonadto w planach jest wybudowanie autostrady [[Autostrada A50 (Polska)|A50]],\
      \ dodana rozporządzeniem z dnia 24 września 2019<ref>{{Cytuj |autor = Paweł\
      \ Marek Woroniecki |tytuł = Główne obowiązki przedsiębiorcy na gruncie Ustawy\
      \ z dnia 16 września 2011 r. o timeshare |czasopismo = Przedsiębiorczość – Edukacja\
      \ |data = 2019-12-28 |data dostępu = 2020-11-13 |issn = 2449-9048 |wolumin =\
      \ 15 |numer = 2 |doi = 10.24917/20833296.152.15}}</ref> (zobacz również: [[Tranzytowa\
      \ obwodnica Warszawy]]).\n\n{{Zobacz też|Klasy i kategorie dróg publicznych\
      \ w Polsce|Droga powiatowa|Droga gminna|Prawo jazdy w Polsce}}\n\n=== Transport\
      \ kolejowy ===\n{{Osobny artykuł|Transport kolejowy w Polsce|Historia kolei\
      \ na ziemiach polskich}}\n[[Plik:Poland rail map.svg|mały|upright=1.3|Sieć linii\
      \ kolejowych w Polsce]]\n\nNajwiększym przedsiębiorstwem zajmującym się przewozami\
      \ kolejowymi jest grupa [[Polskie Koleje Państwowe|PKP]] S.A., w skład której\
      \ wchodzi wiele spółek, m.in.:\n* [[PKP Polskie Linie Kolejowe]] S.A. – odpowiedzialna\
      \ za infrastrukturę kolejową,\n* [[PKP Cargo]] S.A. – odpowiedzialna za przewóz\
      \ towarów,\n* [[PKP Intercity]] Sp. z o.o. – obsługująca połączenia „kwalifikowane”,\
      \ tj. pociągi [[EuroCity|EC]], [[PKP Intercity|EIC]], [[Express InterCity Premium|EIP]]\
      \ oraz pasażerskie przewozy międzyregionalne dotowane z budżetu państwa ([[Twoje\
      \ Linie Kolejowe|TLK]]<ref name=\"PKP_Intercity\" group=\"uwaga\">Do 1 grudnia\
      \ 2008 międzywojewódzkie pociągi pospieszne obsługiwane były przez PKP Przewozy\
      \ Regionalne.</ref>, [[InterCity|IC]]).\n\nZ grupy PKP S.A. wydzielono i przekazano\
      \ [[Samorząd województwa|samorządom województw]] spółkę [[Polregio]] sp. z o.o.,\
      \ obsługującą głównie pasażerski ruch regionalny i w mniejszym stopniu ruch\
      \ międzyregionalny. Polregio jest aktualnie największym przewoźnikiem pasażerskim\
      \ w Polsce<ref>{{Cytuj stronę |url = http://forsal.pl/artykuly/446093,liczba_pasazerow_polskiej_kolei_systematycznie_spada.html\
      \ |tytuł = Liczba pasażerów polskiej kolei systematycznie spada |archiwum =\
      \ https://web.archive.org/web/20110917022434/http://forsal.pl/artykuly/446093,liczba_pasazerow_polskiej_kolei_systematycznie_spada.html\
      \ |zarchiwizowano = 2011-09-17 |data dostępu = 2010-09-21}}</ref>.\n\nW [[Województwo\
      \ mazowieckie|województwie mazowieckim]] pasażerski ruch regionalny realizują\
      \ [[Koleje Mazowieckie]], [[Warszawska Kolej Dojazdowa]] i [[Szybka Kolej Miejska\
      \ w Warszawie|warszawska Szybka Kolej Miejska]], w [[Trójmiasto|Trójmieście]]\
      \ [[PKP Szybka Kolej Miejska w Trójmieście|trójmiejska SKM]], w [[Województwo\
      \ dolnośląskie|województwie dolnośląskim]] – [[Koleje Dolnośląskie]], w [[Województwo\
      \ wielkopolskie|województwie wielkopolskim]] – [[Koleje Wielkopolskie]], w [[Województwo\
      \ śląskie|województwie śląskim]] – [[Koleje Śląskie]], w [[Województwo małopolskie|województwie\
      \ małopolskim]] – [[Koleje Małopolskie]] i [[Województwo łódzkie|województwie\
      \ łódzkim]] – [[Łódzka Kolej Aglomeracyjna]]. W przeciwieństwie do spółek grupy\
      \ PKP są one własnością samorządów. W [[Województwo kujawsko-pomorskie|województwie\
      \ kujawsko-pomorskim]] przewozy wykonuje przedsiębiorstwo [[Arriva RP]].\n\n\
      Istnieje także wielu przewoźników niepowiązanych z grupą PKP (w tym wielu prywatnych),\
      \ obsługujących głównie transport towarowy. Kilku przewoźników posiada także\
      \ licencję na przewóz osób<ref name=\"lista przewoźników kolejowych\">{{Cytuj\
      \ stronę |url = http://www.utk.gov.pl/portal/pl/27/245/WYKAZ_LICENCJONOWANYCH_PRZEWOZNIKOW_KOLEJOWYCH.html\
      \ |tytuł = Pełna lista licencjonowanych przewoźników kolejowych na www.utk.gov.pl\
      \ |archiwum = https://web.archive.org/web/20081026121701/http://www.utk.gov.pl/portal/pl/27/245/WYKAZ_LICENCJONOWANYCH_PRZEWOZNIKOW_KOLEJOWYCH.html\
      \ |zarchiwizowano = 2008-10-26 |data dostępu = 2008-12-04}}</ref>.\n\nZdecydowana\
      \ większość [[Infrastruktura kolejowa|infrastruktury kolejowej]] w Polsce znajduje\
      \ się pod zarządem PLK S.A. Za dostęp do niej pobierane są od poszczególnych\
      \ przewoźników opłaty.\n\nŁączna długość [[Linia kolejowa|linii kolejowych]]\
      \ wynosi 20&nbsp;665&nbsp;km<ref name=\"gestosc linii kolejowych\">{{Cytuj stronę\
      \ |url = http://www.paiz.gov.pl/poland_in_figures/transport |tytuł = Transport\
      \ |autor = PAIiIZ |język = en |archiwum = https://web.archive.org/web/20110101172453/http://www.paiz.gov.pl/poland_in_figures/transport\
      \ |zarchiwizowano = 2011-01-01 |data dostępu = 2010-09-27}}</ref>.\n\n{{Zobacz\
      \ też|Przewoźnicy kolejowi w Polsce|Zarządcy infrastruktury kolejowej w Polsce|Lista\
      \ linii kolejowych w Polsce|Dworce kolejowe w Polsce|Zakłady Naprawcze Taboru\
      \ Kolejowego|Polskie Koleje Linowe|Koleje wąskotorowe w Polsce}}\n\n=== Transport\
      \ lotniczy ===\n{{Osobny artykuł|Porty lotnicze w Polsce|Lotniska w Polsce}}\n\
      [[Plik:Airports in Poland - status since 2014.svg|thumb|upright=1.3|Porty lotnicze\
      \ w Polsce i liczba pasażerów odprawionych w 2016]]\n\nCywilny [[transport lotniczy]]\
      \ w Polsce zapoczątkowany został w 1919 pierwszym przelotem z pasażerami na\
      \ trasie z Poznania do Warszawy. W 1923 r. uruchomiono regularne linie lotnicze\
      \ z Warszawy do Gdańska i Lwowa, a w 1929 powstało przedsiębiorstwo [[Polskie\
      \ Linie Lotnicze LOT]].\n\nPolskie [[Linia lotnicza|linie lotnicze]] to [[Polskie\
      \ Linie Lotnicze LOT|PLL LOT]], [[Enter Air]] i [[Buzz (linie lotnicze)|Buzz]].\
      \ W 2021 największy udział w przewozach pasażerów w Polsce miały: [[Ryanair]],\
      \ PLL LOT oraz [[Wizz Air]]<ref>{{Cytuj stronę |url = https://www.ulc.gov.pl/_download/statystyki/wg_przew_regularne_4kw2021.pdf\
      \ |tytuł = Liczba pasażerów według przewoźników obsłużonych w polskich portach\
      \ lotniczych w krajowym i międzynarodowym ruchu regularnym w czwartym kwartale\
      \ 2020 i 2021 roku |data = marzec 2022 |praca = Urząd Lotnictwa Cywilnego |data\
      \ dostępu = 2022-07-05}}</ref>.\n\nCywilne lotniska transportowe użytku publicznego\
      \ (posiadające betonową drogę startową), według liczby operacji lotniczych (2021),\
      \ to: [[Lotnisko Chopina w Warszawie]], [[Port lotniczy Kraków-Balice|Kraków\
      \ (Balice)]], [[Port lotniczy Katowice-Pyrzowice|Katowice (Pyrzowice)]], [[Port\
      \ Lotniczy Gdańsk im. Lecha Wałęsy|Gdańsk (Rębiechowo)]], [[Port lotniczy Warszawa-Modlin|Warszawa-Modlin]],\
      \ [[Port lotniczy Wrocław-Strachowice|Wrocław (Strachowice)]], [[Port lotniczy\
      \ Poznań-Ławica|Poznań (Ławica)]], [[Port lotniczy Rzeszów-Jasionka|Rzeszów\
      \ (Jasionka)]], [[Port lotniczy Szczecin-Goleniów|Szczecin (Goleniów)]], [[Port\
      \ lotniczy Lublin|Lublin (Świdnik)]], [[Port lotniczy Bydgoszcz-Szwederowo|Bydgoszcz\
      \ (Szwederowo)]], [[Port lotniczy Łódź-Lublinek|Łódź (im. Władysława Reymonta)]],\
      \ [[Port lotniczy Olsztyn-Mazury|Olsztyn (Szymany)]], [[Port lotniczy Zielona\
      \ Góra-Babimost|Zielona Góra (Babimost)]]. [[Port lotniczy Warszawa-Radom|Radom\
      \ (Sadków)]] jest nieczynny z powodu przebudowy. Oprócz nich istnieje wiele\
      \ innych lotnisk należących do [[aeroklub]]ów. Największym polskim portem lotniczym\
      \ jest stołeczne Lotnisko Chopina<ref>{{Cytuj stronę |url = https://www.ulc.gov.pl/_download/statystyki/wg_portow_lotniczych_4kw2021.pdf\
      \ |tytuł = Liczba obsłużonych pasażerów oraz wykonanych operacji w ruchu krajowym\
      \ i międzynarodowym – regularnym i czarterowym w latach 2019–2021 |data = marzec\
      \ 2022 |praca = Urząd Lotnictwa Cywilnego |data dostępu = 2022-07-05}}</ref>.\n\
      \n{{Zobacz też|Przemysł lotniczy w Polsce|Agrolotnictwo w Polsce}}\n\n=== Transport\
      \ wodny ===\n[[Plik:Vistula Spit canal aerial 5.jpg|mały|[[Kanał przez Mierzeję\
      \ Wiślaną]]]]\n\n[[Żegluga]] morska i przybrzeżna jest w Polsce stosunkowo dobrze\
      \ rozwinięta, żegluga śródlądowa stosunkowo słabo. Korzystne warunki przyrodnicze\
      \ i dostęp do wielu zbiorników wodnych ([[Morze Bałtyckie]], żeglowne rzeki\
      \ [[Wisła]], [[Odra]], [[Warta]] i [[Noteć]], [[Zalew Szczeciński]], [[Zalew\
      \ Wiślany]] i in.) umożliwiają dalszy rozwój żeglugi i żeglarstwa.\n\nGłówne\
      \ porty morskie to [[Port morski Gdańsk|port Gdańsk]], [[Port morski Gdynia|port\
      \ Gdynia]], [[Port morski Szczecin|port Szczecin]], [[Port morski Świnoujście|port\
      \ Świnoujście]] i [[Port morski Police|port Police]].\n\nW Polsce utrzymywane\
      \ są połączenia promowe między [[Terminal Promowy Świnoujście|Świnoujściem]]\
      \ a [[Ystad]] i [[Trelleborg]]iem w [[Szwecja|Szwecji]] oraz między [[Kołobrzeg]]iem\
      \ a [[Nexø]] w [[Dania|Danii]], między [[Gdańsk]]iem a [[Nynäshamn]] ([[Szwecja]])\
      \ i między [[Gdynia|Gdynią]] a [[Karlskrona|Karlskroną]]. Dodatkowo latem istnieje\
      \ połączenie promowe między [[Świnoujście]]m a [[Rønne]] ([[Dania]]).\n\nŚródlądowe\
      \ połączenia promowe to m.in. przeprawa [[Karsibór (wyspa)|karsiborska]] w [[Świnoujście|Świnoujściu]]\
      \ oraz prom [[Kazimierz Dolny]] – [[Janowiec (województwo lubelskie)|Janowiec]].\
      \ Ponadto między [[Szczecin]]em, [[Trzebież]]ą a [[Świnoujście]]m kursował [[wodolot]]\
      \ (rejsy zostały wstrzymane w 2014 roku).\n\n{{Zobacz też|Polska Marynarka Handlowa|Polska\
      \ Żegluga Morska|Biała flota w Polsce|Kanały wodne Polski}}\n\n=== Transport\
      \ miejski ===\n[[Transport miejski]] w Polsce składa się głównie z [[autobus]]ów\
      \ i [[tramwaj]]ów. W Warszawie funkcjonuje jedyna w kraju sieć [[Metro w Warszawie|metra]]\
      \ (2 linie), w Trójmieście natomiast [[PKP Szybka Kolej Miejska w Trójmieście|SKM]].\
      \ [[Szybki tramwaj]] funkcjonuje w Szczecinie ([[Szczeciński Szybki Tramwaj]]),\
      \ w Poznaniu ([[Poznański Szybki Tramwaj]]), w Krakowie ([[Krakowski Szybki\
      \ Tramwaj]]) i w Łodzi ([[Łódzki Tramwaj Regionalny]] – część [[Tramwaje w Łodzi|najdłuższej\
      \ w Europie linii tramwajowej]]); także Wrocław posiada dużą [[Tramwaje we Wrocławiu|sieć\
      \ tramwajową]]. Ponadto w [[Lublin]]ie, [[Gdynia|Gdyni]], [[Tychy|Tychach]]\
      \ i [[Sopot|Sopocie]] jeżdżą [[trolejbus]]y.\n\n{{Zobacz też|Państwowa Komunikacja\
      \ Samochodowa|Tramwaje w Polsce}}\n\n=== Telekomunikacja ===\n{{Osobny artykuł|Telekomunikacja\
      \ w Polsce}}\n\n* Liczba aktywnych telefonów komórkowych: 54,9 mln (GUS, marzec\
      \ 2013)<ref>{{Cytuj stronę |url = http://www.telepolis.pl/wiadomosci/gus-o-liczbie-kart-sim-po-1q2013,2,3,28013.html\
      \ |tytuł = GUS o liczbie kart SIM po 1Q2013 |opublikowany = telepolis.pl |archiwum\
      \ = https://web.archive.org/web/20130426021617/http://www.telepolis.pl/wiadomosci/gus-o-liczbie-kart-sim-po-1q2013,2,3,28013.html\
      \ |zarchiwizowano = 2013-04-26}}</ref>\n* Liczba telefonów stacjonarnych: 5,8\
      \ mln (GUS, marzec 2013)\n\n== Oświata i nauka ==\n[[Plik:PL-uczelnie.png|mały|upright=1.1|Ośrodki\
      \ akademickie w Polsce]]\n[[Plik:Kraków - Collegium Maius - Dziedziniec 02.jpg|mały|[[Uniwersytet\
      \ Jagielloński]] – Collegium Maius]]\n=== Szkoły i uczelnie ===\n{{Osobny artykuł|System\
      \ oświaty w Polsce|Uczelnie w Polsce|Nauka w Polsce}}\n\nW Polsce po raz pierwszy\
      \ [[obowiązek szkolny]] wprowadziła w [[Księstwo Warszawskie|Księstwie Warszawskim]]\
      \ [[Izba Edukacji Publicznej]] w 1808<ref>{{cytuj książkę |autor = Wincenty\
      \ Okoń |tytuł = Nowy słownik pedagogiczny |wydawca = Wydawnictwo Akademickie\
      \ „Żak” |miejsce = Warszawa |rok = 2001 |strony = 149 |isbn = 83-88149-41-5}}</ref>.\
      \ W 1961 w szkole podstawowej wprowadzono ośmioletni [[program nauczania]]<ref>Ustawa\
      \ z dnia 15 lipca 1961 o rozwoju systemu oświaty i wychowania ({{Dziennik Ustaw|1961|32|160}}).</ref>.\n\
      \nEdukacja w szkołach publicznych w Polsce jest bezpłatna. Płatne są jedynie\
      \ [[studia wyższe]] niestacjonarne. Zgodnie z wyrokiem Trybunału Konstytucyjnego\
      \ studia na drugim kierunku studiów stacjonarnych od roku akademickiego 2015/2016\
      \ stały się bezpłatne. W roku akademickim 2012/2013 istniały 453 uczelnie (publiczne\
      \ i niepubliczne), na których kształciło się 1,7 mln osób. Na uczelniach pracowało\
      \ 100,7 tys. nauczycieli akademickich<ref name=\"edu\">{{Cytuj stronę |url =\
      \ http://www.stat.gov.pl/cps/rde/xbcr/gus/E_szkoly_wyzsze_2012.pdf |tytuł =\
      \ Szkoły wyższe i ich finanse w 2012 r. |autor = GUS |data = 2013-11-13 |strony\
      \ = 30, 37, 43, 117 |archiwum = https://web.archive.org/web/20140725064925/http://stat.gov.pl/cps/rde/xbcr/gus/E_szkoly_wyzsze_2012.pdf\
      \ |zarchiwizowano = 2014-07-25 |data dostępu = 2014-02-09}}</ref>. Wydatki na\
      \ szkolnictwo wyższe ze źródeł publicznych i prywatnych stanowiły w 2010 roku\
      \ w sumie 1,5% PKB. Dla porównania na [[Słowacja|Słowacji]] wynosiły one 0,9%,\
      \ w [[Wielka Brytania|Wielkiej Brytanii]] 1,4%, a w [[Dania|Danii]] i [[Finlandia|Finlandii]]\
      \ 1,9% PKB<ref name=\"edu\"/>. Całkowite wydatki na edukację w 2009 roku osiągnęły\
      \ 5,1% PKB<ref>{{Cytuj stronę |url = https://www.cia.gov/library/publications/the-world-factbook/rankorder/2206rank.html?countryName=Poland&countryCode=pl&regionCode=eu&rank=49#pl\
      \ |tytuł = World Factbook-Education expenditures |autor = CIA |archiwum = https://web.archive.org/web/20140221165001/https://www.cia.gov/library/publications/the-world-factbook/rankorder/2206rank.html?countryName=Poland&countryCode=pl&regionCode=eu&rank=49#pl\
      \ |zarchiwizowano = 2014-02-21 |data dostępu = 2014-02-09}}</ref>.\n\nW Polsce\
      \ powstała jedna z najstarszych uczelni w Europie, [[Uniwersytet Jagielloński|Akademia\
      \ Krakowska]]. Po kilku wojnach w XVII w. i na początku XVIII polska nauka znajdowała\
      \ się w stagnacji, do czasów [[Stanisław August Poniatowski|Stanisława Augusta\
      \ Poniatowskiego]]. Powołano wówczas [[Komisja Edukacji Narodowej|Komisję Edukacji\
      \ Narodowej]], pierwsze ministerstwo edukacji na świecie. W tym czasie odradzało\
      \ się także polskie piśmiennictwo, przemysł i handel. Dalszy rozwój został stłumiony\
      \ przez państwa ościenne w wyniku [[Rozbiory Polski|rozbiorów Polski]]. W XIX\
      \ i XX wieku wielu polskich naukowców pracowało za granicą. Jednym z nich była\
      \ [[Maria Skłodowska-Curie]], która studiowała i pracowała we Francji. Skłodowska-Curie\
      \ otrzymała dwie [[Nagroda Nobla|Nagrody Nobla]], pierwszą w [[Laureaci Nagrody\
      \ Nobla w dziedzinie fizyki|dziedzinie fizyki]], a drugą w [[Laureaci Nagrody\
      \ Nobla w dziedzinie chemii|dziedzinie chemii]]. Odkryła ona dwa nowe [[Pierwiastek\
      \ chemiczny|pierwiastki]] [[Radioaktywność|promieniotwórcze]], z których jeden\
      \ nazwała „[[polon]]” ([[Łacina|łac.]] ''polonium'') na cześć Polski będącej\
      \ w owym czasie pod [[Rozbiory Polski|zaborami]]. W pierwszej połowie XX wieku\
      \ Polska była rozwijającym się centrum matematycznym. Polscy matematycy tworzyli\
      \ [[Lwowska szkoła matematyczna|lwowską szkołę matematyczną]] oraz [[Warszawska\
      \ szkoła matematyczna|warszawską szkołę matematyczną]]. Jednym z efektów ich\
      \ prac było rozszyfrowanie kodu [[Enigma|Enigmy]] w 1932 r.\n\nW rankingu 500\
      \ najlepszych uniwersytetów świata ARWU 2013, z Polski zakwalifikowały się dwa:\
      \ [[Uniwersytet Jagielloński]] oraz [[Uniwersytet Warszawski]], obydwa w czwartej\
      \ setce<ref>{{Cytuj stronę |url = http://www.shanghairanking.com/World-University-Rankings-2013/Poland.html\
      \ |tytuł = Poland Universities in Top 500 universities |język = en |archiwum\
      \ = https://web.archive.org/web/20130921160951/http://www.shanghairanking.com/World-University-Rankings-2013/Poland.html\
      \ |zarchiwizowano = 2013-09-21 |data dostępu = 2014-02-09}}</ref>.\n\nW roku\
      \ akademickim 2012/2013 na różnego typu uczelniach w Polsce studiowało 29,2\
      \ tys. cudzoziemców, z czego większość stanowili studenci z Europy, głównie\
      \ Ukrainy (9,7 tys. osób) i Białorusi (3,4 tys. osób). Spośród cudzoziemców\
      \ studiujących w Polsce 17,7% było osobami polskiego pochodzenia<ref name=\"\
      edu\"/>.\n\n=== Towarzystwa naukowe ===\nOprócz uczelni organizacją życia naukowego\
      \ w Polsce zajmują się towarzystwa naukowe. Do najstarszych wciąż działających\
      \ należą:\n* [[Towarzystwo Naukowe Krakowskie]], znane od 1872 roku pod nazwą\
      \ [[Akademia Umiejętności]];\n* [[Towarzystwo Naukowe Płockie]];\n* [[Poznańskie\
      \ Towarzystwo Przyjaciół Nauk]];\n* [[Towarzystwo Naukowe w Toruniu]];\n* [[Towarzystwo\
      \ Naukowe Warszawskie]].\n\nTowarzystwa zrzeszające uczonych poszczególnych\
      \ dziedzin nauki to m.in.:\n* [[Polskie Towarzystwo Botaniczne]];\n* [[Polskie\
      \ Towarzystwo Ekonomiczne]];\n* [[Polskie Towarzystwo Filozoficzne]];\n* [[Polskie\
      \ Towarzystwo Historyczne]];\n* [[Polskie Towarzystwo Lekarskie]];\n* [[Polskie\
      \ Towarzystwo Matematyczne]];\n* [[Polskie Towarzystwo Przyrodników im. Kopernika]];\n\
      * [[Polskie Towarzystwo Pielęgniarskie]];\n* [[Polskie Towarzystwo Promieniowania\
      \ Synchrotronowego]].\n\nPoza granicami kraju działa [[Polskie Towarzystwo Naukowe\
      \ na Obczyźnie]].\n\n== Bezpieczeństwo publiczne ==\nW Polsce działa system\
      \ siedemnastu [[Centrum powiadamiania ratunkowego|centrów powiadamiania ratunkowego]],\
      \ które obsługują zgłoszenia alarmowe kierowane do [[Numer alarmowy|numerów\
      \ alarmowych]] [[112 (numer alarmowy)|112]], [[Policja (Polska)|997]], [[Państwowa\
      \ Straż Pożarna|998]] i [[Państwowe Ratownictwo Medyczne|999]]<ref>{{Cytuj stronę\
      \ |url = http://web.archive.org/web/20180215143519/https://bip.uke.gov.pl/download/gfx/bip/pl/defaultaktualnosci/38/4/1/aus__al_112_tab_2_ed_36.pdf\
      \ |tytuł = Wykaz NKA dla lokalizacji Ab. Służb Alarmowych 112 |opublikowany\
      \ = uke.gov.pl |data dostępu = 2014-12-27}}</ref>.\n\n=== Opieka zdrowotna ===\n\
      {{Osobny artykuł|System opieki zdrowotnej w Polsce}}\nZgodnie z artykułem 68\
      \ [[Konstytucja Rzeczypospolitej Polskiej|Konstytucji Rzeczypospolitej Polskiej]],\
      \ każdy obywatel Polski ma prawo do ochrony zdrowia. Obywatelom, niezależnie\
      \ od ich sytuacji materialnej, władze publiczne zapewniają równy dostęp do świadczeń\
      \ opieki zdrowotnej finansowanej ze środków publicznych.\n\n== Architektura\
      \ i sztuki piękne ==\n[[Plik:Plac Zamkowy w Warszawie widziany z wieży kościoła\
      \ św. Anny.JPG|mały|[[Plac Zamkowy w Warszawie]] z [[Kolumna Zygmunta III Wazy|kolumną\
      \ Zygmunta III Wazy]] i [[Zamek Królewski w Warszawie|Zamkiem Królewskim]],\
      \ w głębi [[Stare Miasto w Warszawie|Stare Miasto]] z [[Bazylika archikatedralna\
      \ św. Jana Chrzciciela w Warszawie|archikatedrą św. Jana Chrzciciela]] i [[Kościół\
      \ św. Marcina w Warszawie|kościołem św. Marcina]]]]\n=== Ogólny zarys ===\n\
      {{Osobny artykuł|Sztuka Polski}}\n\nGeneza sztuki Polski sięga pradziejów ([[neolit]]).\
      \ Po [[Chrzest Polski|chrzcie Polski]] (966) Polska wchodzi w obszar [[Cywilizacja\
      \ zachodnia|cywilizacji zachodniej]] i powstają pierwsze dzieła [[Sztuka przedromańska|sztuki\
      \ przedromańskiej]] i [[Sztuka romańska|romańskiej]]. Ze względu na zmiany terytorialne\
      \ trwająca od połowy XIII – do II połowy XVI wieku [[Gotyk|sztuka gotycka]]\
      \ rozwija się nierównomiernie. Od XV wieku zauważa się relacje z kulturami wschodnimi.\
      \ Od początku XVI stulecia zauważa się zainteresowanie włoskim [[renesans]]em,\
      \ a stulecie później [[barok]]iem, który trwa do lat 60. XVIII w. Od XIX wieku\
      \ w dobie zaborów wzrasta rola artystów pochodzenia krajowego, zarówno okresie\
      \ [[Oświecenie (epoka)|Oświecenia]], [[romantyzm]]u, [[pozytywizm]]u, jak i\
      \ [[Modernizm (literatura)|modernizmu]]. W dwudziestoleciu międzywojennym upowszechniły\
      \ się między innymi tendencje awangardowe i idea [[Styl narodowy|stylu narodowego]].\
      \ Po ostatniej wojnie, która przyniosła w sztuce dotkliwe straty (w tym zbiorów\
      \ i kolekcji zarówno sakralnych, jak i świeckich, które zostały planowo zrabowane,\
      \ lub niszczone przez okupantów) większość zniszczonych dzieł odbudowano i zrekonstruowano.\
      \ Znaczną część zrabowanych zabytków odzyskano.\n\n{{Zobacz też|Lista światowego\
      \ dziedzictwa UNESCO w Polsce|Ochrona zabytków w Polsce}}\n\n=== Średniowiecze\
      \ ===\n[[Plik:Collegiate Church in Tum.jpg|mały|[[Sztuka romańska|Romańska]]\
      \ [[archikolegiata w Tumie]]]]\n[[Plik:Kościół św. Jakuba, Toruń.JPG|mały|upright|Gotycki\
      \ [[Kościół św. Jakuba w Toruniu|kościół św. Jakuba]] w [[Toruń|Toruniu]]]]\n\
      [[Plik:Oplakiwanie z Chomranic.jpg|mały|upright|[[Opłakiwanie z Chomranic]],\
      \ ok. 1450 r., [[Muzeum Diecezjalne w Tarnowie]]]]\n[[Plik:20061006-03-032-Altar-12\
      \ corrected.JPG|mały|[[Wit Stwosz]], ''Zesłanie Ducha Świętego'', fragment [[Ołtarz\
      \ Wita Stwosza w Krakowie|Ołtarza Mariackiego]]]]\n\nPo [[Chrzest Polski|chrystianizacji]]\
      \ kraju rozpowszechnia się na terenie całej Polski [[sztuka przedromańska]],\
      \ a następnie od początku XII w. [[Sztuka romańska|romańska]], która trwa do\
      \ połowy XIII stulecia. Przykładem sztuki przedromańskiej są relikty katedr\
      \ w Gnieźnie, Poznaniu i Krakowie, palatia i kaplice centralne: między innymi\
      \ na [[Ostrów Lednicki|Ostrowie Lednickim]]. Cennym dziełem rzemiosła artystycznego\
      \ są wyroby złotnicze, np. [[czara włocławska]]. Najstarsze manuskrypty są dziełami\
      \ importowanymi, przykładami są [[sakramentarz tyniecki]], [[ewangeliarz emmeramski]]\
      \ i [[ewangeliarz kruszwicki]]. Dziełami architektury dojrzałego romanizmu są\
      \ fragmenty katedry krakowskiej zwanej hermanowską z [[Krypta św. Leonarda na\
      \ Wawelu|kryptą Świętego Leonarda]], pobliski [[Kościół św. Andrzeja w Krakowie|kościół\
      \ Świętego Andrzeja]] oraz kolegiaty w [[Archikolegiata w Tumie|Tumie]] i [[Kruszwica|Kruszwicy]].\
      \ Rozwinęła się rzeźba architektoniczna m.in. w [[Strzelno|Strzelnie]] (zespół\
      \ tympanonów fundacyjnych, kolumn z figuralnymi przedstawieniami cnót i przywar),\
      \ zespół portali i tympanonów z [[Opactwo św. Wincentego na Ołbinie|opactwa\
      \ na Ołbinie]]. Malarstwo książkowe XII wieku egzemplifikuje m.in. [[Biblia\
      \ Czerwińska]]. Rzadkim przykładem plastyki jest rytowana [[Płyta wiślicka|posadzka\
      \ z Wiślicy]]. Wysoki poziom prezentuje metaloplastyka, w tym wyroby złotnicze\
      \ (kielichy i pateny z Trzemeszna, Gniezna, Płocka i Kalisza) oraz z brązu ([[Drzwi\
      \ Gnieźnieńskie]] i [[Drzwi płockie|Drzwi Płockie]]). Z XIII stulecia pochodzą\
      \ najstarsze insygnia władzy takie jak [[Szczerbiec]] miecz sprawiedliwości,\
      \ a następnie koronacyjny królów Polski. Znajdujący się w skarbcu katedry krakowskiej\
      \ krzyż jest wykonany w XV w. ze starszych o dwa stulecia diademów książęcych.\
      \ Na szeroką skalę rozwija się sztuka i architektura [[Cystersi|cysterska]]\
      \ (klasztory w [[Opactwo Cystersów w Sulejowie|Sulejowie]], Wąchocku i Koprzywnicy)\
      \ oraz zakonów mendykanckich ([[Kościół św. Jakuba w Sandomierzu|kościół Świętego\
      \ Jakuba]] w [[Sandomierz]]u).\n\n[[Gotyk|Sztukę gotycka]] na ziemiach polskich\
      \ cechuje w pewnym sensie brak spójności chronologicznej jak artystycznej, podyktowane\
      \ było konsekwencjami [[Polska w okresie rozbicia dzielnicowego|rozbicia dzielnicowego]]\
      \ i niezależności [[Śląsk]]a i [[Pomorze|Pomorza]] od Królestwa Polskiego, gdzie\
      \ gotyk pojawił się najwcześniej (formy przejściowe romańsko-gotyckie reprezentuje\
      \ [[Konkatedra św. Jana Chrzciciela w Kamieniu Pomorskim|katedra św. Jana Chrzciciela\
      \ w Kamieniu Pomorskim]]). W architekturze dominuje recepcja gotyku redukcyjnego\
      \ i północnego [[Gotyk ceglany|gotyku ceglanego]]. Rzadko budowano w całości\
      \ z kamienia, tenże materiał służył często wyłącznie do dekoracji rzeźbiarskiej.\
      \ Na wielką skalę rozwija się budownictwo sakralne. Przykładami są kościoły\
      \ na wrocławskim [[Ostrów Tumski we Wrocławiu|Ostrowie Tumskim]] ([[Archikatedra\
      \ św. Jana Chrzciciela we Wrocławiu|katedra]] i [[Kolegiata Świętego Krzyża\
      \ i św. Bartłomieja we Wrocławiu|kolegiata Świętego Krzyża]]) [[Kościół archiprezbiterialny\
      \ Wniebowzięcia Najświętszej Marii Panny w Krakowie|kościoły Marii Panny]] i\
      \ [[Kościół św. Katarzyny Aleksandryjskiej i św. Małgorzaty w Krakowie|Świętej\
      \ Katarzyny]] w Krakowie, [[Bazylika konkatedralna Wniebowzięcia Najświętszej\
      \ Maryi Panny w Gdańsku|Najświętszej Marii Panny]], [[Kościół św. Katarzyny\
      \ w Gdańsku|Świętej Katarzyny]] i [[Kościół Świętej Trójcy w Gdańsku|Trójcy\
      \ Świętej]] w Gdańsku, [[Kościół św. Jakuba w Toruniu|kościół Świętego Jakuba]],\
      \ [[Bazylika katedralna Wniebowzięcia Najświętszej Maryi Panny w Pelplinie|katedra\
      \ w Pelplinie]], [[Bazylika kolegiacka Narodzenia Najświętszej Marii Panny w\
      \ Wiślicy|kolegiata w Wiślicy]], ponadto kościoły w [[Bazylika kolegiacka św.\
      \ Andrzeja Apostoła w Olkuszu|Olkuszu]], [[Kościół św. Andrzeja Apostoła w Koninie|Gosławicach]],\
      \ Kamionnej, [[Kościół św. Stanisława w Bielsku-Białej|Starym Bielsku]] i wiele\
      \ innych. Na szeroką skalę wznosi się we wszystkich regionach Polski zamki.\
      \ Prym wiedzie architektura krzyżacka w Prusach, na Pomorzu i w Warmii (zamki\
      \ w [[Zamek w Malborku|Malborku]], [[Zamek Biskupów Warmińskich w Lidzbarku\
      \ Warmińskim|Lidzbarku Warmińskim]]). Przykładami z innych ziem są zamki w [[Zamek\
      \ Dunajec|Niedzicy]] [[Zamek książąt mazowieckich w Czersku|Czersku]], [[Zamek\
      \ w Dębnie|Dębnie]]. Architekturę municypalną reprezentuje [[ratusz we Wrocławiu]],\
      \ natomiast mieszkalną zespół kamienic w Toruniu, Krakowie i [[Stargard]]zie.\
      \ W różnym stopniu zachowały się mury miejskie z bramami i basztami. Dobrze\
      \ zachowanie obwarowania posiadają między innymi [[Szydłów]], [[Byczyna]], [[Paczków]],\
      \ [[Pyrzyce]], Stargard ([[Brama Młyńska w Stargardzie|Brama Młyńska]]) oraz\
      \ Kraków ([[Barbakan w Krakowie|Barbakan]] i [[Brama Floriańska w Krakowie|Brama\
      \ Floriańska]]).\n\nWraz z architekturą występują dzieła rzeźby architektonicznej\
      \ (portale, wsporniki, zworniki sklepień itp.). Do najcenniejszych przykładów\
      \ zalicza się dekorację zamku malborskiego, krakowskiego kościoła Mariackiego\
      \ i pobliskiego [[Kamienica Hetmańska w Krakowie|pałacu]] przy [[Rynek Główny\
      \ w Krakowie|Rynku Głównym]] czy [[Bazylika Świętych Apostołów Piotra i Pawła\
      \ w Strzegomiu|kościoła w Strzegomiu]]. Dziełami rzeźby sepulkralnej są nagrobki\
      \ Piastów Śląskich we Wrocławiu, Opolu, Krzeszowie, Henrykowie, Lwówku Śląskim\
      \ oraz królów Polski w katedrze wawelskiej. Świadectwem XIV-wiecznej [[Mistyka\
      \ chrześcijańska|mistyki]] są [[Pietà z Lubiąża]], krucyfiksy z kościoła [[Krucyfiks\
      \ z kościoła Bożego Ciała we Wrocławiu|Bożego Ciała we Wrocławiu]], [[Konkatedra\
      \ św. Jana Chrzciciela w Kamieniu Pomorskim|katedry w Kamieniu Pomorskim]] czy\
      \ fary w Wągrowcu, figurki jasełkowe klasztoru Klarysek w Krakowie. Powstają\
      \ liczne figury Madonny z Dzieciątkiem (w tym Madonny na Lwach – ze Skarbimierza,\
      \ Lubiszewa, kościoła Świętego Marcina we Wrocławiu, Madonna z klasztoru Karmelitanek\
      \ w Krakowie). [[Gotyk międzynarodowy|Styl piękny]] egzemplifikują [[Piękna\
      \ Madonna]] z Wrocławia, [[Madonna z Krużlowej]], wrocławski relikwiarz świętej\
      \ Doroty. Coraz częściej wykonuje się retabula ołtarzowe, najcenniejszymi przykładami\
      \ są [[Ołtarz Wita Stwosza w Krakowie|Ołtarz Mariacki w Krakowie]] dłuta [[Wit\
      \ Stwosz|Wita Stwosza]], poliptyk w [[Katedra św. Stanisława i św. Wacława w\
      \ Świdnicy|kościele Świętych Stanisława i Wacława]] w [[Świdnica|Świdnicy]],\
      \ tryptyk w kościele w Książnicach Wielkich, [[Tryptyk z Pławna]].\n\nMalarstwo\
      \ gotyckie na ziemiach polskich dzieli się na ścienne (polichromie w Małujowicach,\
      \ Sielęcinie, kościele Świętego Jana w Gnieźnie, kapitularza klasztoru w Lądzie,\
      \ ruskie malowidła m.in. w [[Kaplica Trójcy Świętej w Lublinie|kaplicy zamku\
      \ lubelskiego]]), witrażowe (Toruń, Chełmno, Włocławek, Kraków) książkowe (Legenda\
      \ Świętej Jadwigi) i tablicowe. Przykładami są [[Święta Anna Samotrzecia (obraz\
      \ ze Strzegomia)|Święta Anna Samotrzecia ze Strzegomia]], [[Opłakiwanie z Chomranic]]\
      \ [[Epitafium Wierzbięty z Branic]] krakowskie poliptyki Dominikański i [[Poliptyk\
      \ augustiański|Augustiański]], dzieła [[Jan Wielki|Jana Wielkiego]], [[Poliptyk\
      \ św. Jana Jałmużnika]] ponadto m.in. wrocławski [[Ołtarz Świętej Barbary]],\
      \ ołtarz z Legendą Świętej Jadwigi, dzieła malarstwa gdańskiego jak [[Dyptyk\
      \ Winterfeldów]], Duży i Mały Ołtarz Ferberów, Ołtarz Jerozolimski i wiele innych.\n\
      \nWśród dzieł rzemiosła artystycznego wyróżniają się dzieła złotnicze fundacji\
      \ [[Kazimierz III Wielki|Kazimierza Wielkiego]], drewniane stalle w kościele\
      \ Franciszkanów w Toruniu, katedrze w Pelplinie i kościele Trójcy Świętej w\
      \ Gdańsku, monstrancje ze [[Opactwo Benedyktynek w Staniątkach|Staniątek]],\
      \ Wieliczki, Niepołomic, wyroby [[Marcin Marciniec|Marcina Marcińca]], w tym\
      \ relikwiarz świętego Stanisława i berło Akademii Krakowskiej.\n\n=== Nowożytność\
      \ ===\n[[Plik:Ratusz Zamosc.jpg|mały|[[Rynek Wielki (Zamość)|Rynek Wielki]]\
      \ z [[Ratusz w Zamościu|ratuszem]] w [[Zamość|Zamościu]]]]\n[[Plik:Wilanów Palace.jpg|mały|[[Pałac\
      \ w Wilanowie|Pałac]] [[Jan III Sobieski|Jana III Sobieskiego]] w [[Wilanów|Wilanowie]]]]\n\
      \nZa panowania Jagiellonów Polska przeżywa „złoty wiek”. Ostatni władcy tej\
      \ dynastii [[Zygmunt I Stary]] i [[Zygmunt II August]] rozpowszechniają w Polsce\
      \ idee humanistycznego [[renesans]]u. Gruntownie został przebudowany [[Zamek\
      \ Królewski na Wawelu]], który otrzymał bogaty wystrój wnętrz m.in. z [[Tapiseria|arrasami]],\
      \ malowane fryzami i dekoracją stropów ([[głowy wawelskie]]). Przy katedrze\
      \ krakowskiej wzniesiono [[Kaplica Zygmuntowska na Wawelu|kaplicę Zygmuntowską]].\
      \ Zmieniła się częściowo zabudowa mieszkalna m.in. przy [[Ulica Kanonicza w\
      \ Krakowie|ul. Kanoniczej]]. Renesans upowszechnił się także na terenie Małopolski\
      \ ([[Kasztel w Szymbarku|dwór obronny w Szymbarku]], pałac w [[Książ Wielki|Książu\
      \ Wielkim]]) i Wielkopolski ([[Ratusz w Poznaniu]]). Przykładem renesansowego\
      \ „miasta idealnego” jest [[Zamość]]. Powstają kamienice z podcieniami i attykami\
      \ ([[Kazimierz Dolny]]). Formy renesansowe w mniejszym stopniu są powszechne\
      \ na Śląsku ([[Zamek Piastów Śląskich w Brzegu|zamek w Brzegu]]) i Pomorzu ([[Zamek\
      \ Książąt Pomorskich w Szczecinie]]). W renesansowej rzeźbie zdominowały dzieła\
      \ sepulkralnej (nagrobki [[Jan Michałowicz z Urzędowa|Jana Michałowicza z Urzędowa]]).\
      \ Powstają także retabula ołtarzowe (m.in. ołtarza głównego katedry krakowskiej,\
      \ obecnie w kolegiacie w [[Bodzentyn]]ie). W malarstwie książkowym utrwaliły\
      \ się formy gotyckie ([[Kodeks Baltazara Behema]], dzieła [[Stanisław Samostrzelnik|Stanisława\
      \ Samostrzelnika]]), a w malarstwie sztalugowym zdominował portret (twórczość\
      \ [[Marcin Kober|Marcina Kobera]]). Intensywnie rozwinęło się rzemiosło artystyczne\
      \ – dzieła snycerskie, płatnerskie, złotnicze czego przykładem jest [[srebrny\
      \ kur Bractwa Kurkowego]].\n\nOd II połowy XVI stulecia powszechny staje się\
      \ [[manieryzm]], przede wszystkim na Śląsku i Pomorzu, gdzie przejmowano formy\
      \ charakterystyczne dla architektury Niderlandów. Przykładami są zabytki w Gdańsku\
      \ takie jak [[Wielka Zbrojownia w Gdańsku|Wielka Zbrojownia]], [[Brama Zielona]],\
      \ [[Dom Steffensów w Gdańsku|Złota Kamienica]], [[Lwi Zamek w Gdańsku|Lwi Zamek]].\
      \ ''Exemplum gratia'' wrocławskiego manieryzmu jest [[Kamienica Pod Gryfami\
      \ we Wrocławiu|kamienica Pod Gryfami]] przy [[Rynek we Wrocławiu|Rynku]]. Innymi\
      \ dziełami architektury śląskiego manieryzmu są [[ratusz w Głogówku]] oraz [[dom\
      \ Wagi Miejskiej w Nysie]]. Świadectwem sztuki [[Reformacja|reformacji]] są\
      \ ambony w tym kazalnica w [[Katedra św. Marii Magdaleny we Wrocławiu|kościele\
      \ św. Marii Magdaleny]]. W Małopolsce niderlandzki manieryzm egzemplifikuje\
      \ ołtarz główny fary w [[Biecz]]u, na Rusi zaś [[Kościół św. Andrzeja i klasztor\
      \ Bernardynów we Lwowie|kościół Bernardynów we Lwowie]]. Włoską odmianę manieryzmu\
      \ reprezentują dzieła rzeźbiarskie [[Santi Gucci]]ego. Przykładami architektury\
      \ Małopolski i Rusi są [[Krzyżtopór|zamek Krzyżtopór]], [[Krasiczyn#Zamek w\
      \ Krasiczynie|zamek w Krasiczynie]], [[cerkiew Wołoska we Lwowie]] itp.\n\n\
      [[Barok]] w Polsce sięga początku XVII stulecia, jego wczesna faza jest ściśle\
      \ związana z [[Kontrreformacja|kontrreformacją]] i panowaniem [[Wazowie|Wazów]].\
      \ Wzrosła potęga i autorytet duchowieństwa, w miejsce humanizmu lansowano myśli\
      \ o przemijalności i kruchości ludzkiego życia. Nowym centrum artystycznym staje\
      \ się nowa stolica, [[Warszawa]], gdzie przed [[Zamek Królewski w Warszawie|zamkiem\
      \ Królewskim]] postawiono [[Kolumna Zygmunta III Wazy|kolumnę]] oznaczającą\
      \ potęgę władzy króla. Świadectwem działalności [[Jezuici|jezuitów]] jest m.in.\
      \ [[Kościół Świętych Apostołów Piotra i Pawła w Krakowie|kościół św. Piotra\
      \ i Pawła w Krakowie]]. Poza ośrodkami miejskimi powstają monumentalne klasztory\
      \ (m.in. na [[Kościół Wniebowzięcia Najświętszej Maryi Panny w Krakowie (Bielany)|Bielanach]],\
      \ w [[Sanktuarium pasyjno-maryjne w Kalwarii Zebrzydowskiej|Kalwarii Zebrzydowskiej]],\
      \ [[klasztor karmelitów bosych w Czernej|Czernej]]). Powstają liczne rezydencje\
      \ obronne, czego przykładem jest [[pałac Biskupów Krakowskich w Kielcach]].\
      \ W malarstwie wczesnego baroku oprócz obrazów o tematyce religijnej i tradycyjnego\
      \ portretu staropolskiego upowszechnił się tzw. [[portret trumienny]]. Wnętrza\
      \ kościołów otrzymują bogaty wystrój (m.in. ołtarze w kazimierskich świątyniach\
      \ św. Katarzyny i Bożego Ciała, stalle w tymże kościele).\n\nPo potopie szwedzkim,\
      \ który zahamował ruch budowlany, nastąpił dalszy rozwój sztuki barokowej. Apogeum\
      \ sztuki przypada na okres panowania Jana III Sobieskiego, dla którego wzniesiono\
      \ [[Pałac w Wilanowie]]. Liczne kościoły powstały na terenie całej Rzeczypospolitej\
      \ (przebudowa kościoła i klasztoru na [[Jasna Góra|Jasnej Górze]], [[Kościół\
      \ św. Anny w Krakowie]], [[Bazylika katedralna Wniebowzięcia Najświętszej Maryi\
      \ Panny i św. Mikołaja w Łowiczu|kościół farny w Łowiczu]], kościół farny w\
      \ Poznaniu, [[Bazylika na Świętej Górze|kościół Filipinów]] w [[Gostyń|Gostyniu]],\
      \ kościół i klasztor Misjonarzy w [[Siemiatycze|Siemiatyczach]]) oraz na Śląsku\
      \ (kościoły w [[Nysa|Nysie]]) i Warmii ([[Święta Lipka]]). Powstają także synagogi\
      \ ([[Wielka Synagoga we Włodawie]]) i cerkwie. Budownictwo świeckie reprezentują\
      \ pałace ([[Zamek w Rydzynie|Rydzyna]], [[Pałac w Nieborowie|Nieborów]]), [[Polski\
      \ dwór szlachecki|dwory szlacheckie]] ([[Czyżew]], [[Świdnik]], [[Osówiec (powiat\
      \ słupecki)|Osówiec]]), liczne kamienice. Na dworze Jana III Sobieskiego działał\
      \ malarz [[Jerzy Siemiginowski-Eleuter]], w Wielkopolsce tworzył m.in. [[Szymon\
      \ Czechowicz]], Małopolsce [[Franciszek Lekszycki]], na Pomorzu m.in. [[Daniel\
      \ Schultz]], [[Anton Möller]], a na Śląsku [[Michael Willmann]].\n\nNa XVIII\
      \ stulecie przypada w Polsce okres późnego baroku i rokoka. Centrum artystycznym\
      \ rezydujących w Polsce i Saksonii Wettynów była Warszawa, gdzie przebudowano\
      \ zamek królewski, założono [[Oś Saska|Oś Saską]] ozdobioną rzeźbami [[Jan Jerzy\
      \ Plersch|Jana Jerzego Plerscha]], kościoły przy [[Ulica Krakowskie Przedmieście\
      \ w Warszawie|Krakowskim Przedmieściu]]. Powstały rezydencje magnackie m.in.\
      \ w [[Pałac Branickich w Białymstoku|Białymstoku]], [[Pałac w Radzyniu Podlaskim|Radzyniu\
      \ Podlaskim]], [[Pałac Dembińskich w Szczekocinach|Szczekocinach]]. Intensywnie\
      \ budowano budowle sakralne ([[Kościół Rozesłania św. Apostołów w Chełmie|Kościół\
      \ Pijarów w Chełmie]], kościoły w [[Kalisz]]u, [[Wieluń|Wieluniu]], [[Leszno|Lesznie]],\
      \ [[Krotoszyn]]ie itp.) z bogatym wystrojem wnętrz ([[Zespół kościoła i klasztoru\
      \ Bernardynów w Leżajsku|kościół Bernardynów w Leżajsku]], [[Bazylika archikatedralna\
      \ w Gdańsku-Oliwie|katedra w Gdańsku-Oliwie]] itp.). „[[Dama z gronostajem]]”,\
      \ renesansowy obraz autorstwa [[Leonardo da Vinci|Leonarda da Vinci]] przedstawiający\
      \ mediolańską arystokratkę Cecylię Gallerani został zakupiony przez księcia\
      \ Adama Jerzego Czartoryskiego i sprowadzony z Włoch do Polski pod koniec XVIII\
      \ w.\n\nNajcenniejszymi dziełami późnego baroku na Śląsku są [[Uniwersytet Wrocławski]]\
      \ z [[Aula Leopoldina|Aulą Leopoldina]], [[Pocysterskie opactwo w Krzeszowie|opactwo\
      \ Cystersów w Krzeszowie]] i kościół św. Jadwigi w [[Legnickie Pole|Legnickim\
      \ Polu]]. Niedługo później również na Śląsku pojawiły się pierwsze budowle o\
      \ cechach klasycystycznych, czego najstarszym przykładem w Polsce jest [[Pałac\
      \ w Wodzisławiu Śląskim|Pałac Dietrichsteinów]] w Wodzisławiu Śląskim. Na Wileńszczyźnie\
      \ działa architekt [[Jan Krzysztof Glaubitz]], na Rusi m.in. [[Bernard Meretyn]]\
      \ i rzeźbiarz [[Johann Georg Pinsel|Jan Jerzy Pinzel]].\n\n=== XIX–XXI w. ===\n\
      [[Plik:Jan Matejko, Stańczyk.jpg|mały|lewo|[[Jan Matejko]], ''[[Stańczyk (obraz\
      \ Jana Matejki)|Stańczyk]]'']]\n\n[[Styl Stanisława Augusta]] łączy późne rokoko\
      \ z [[klasycyzm]]em. Warszawski zamek został rozbudowany o kilka reprezentacyjnych\
      \ sal. [[Dominik Merlini]] wzniósł m.in. [[Łazienki Królewskie w Warszawie|Łazienki\
      \ Królewskie]] i [[Królikarnia|Królikarnię]]. Na dworze ostatniego króla Polski\
      \ działa wedutysta [[Bernardo Bellotto]] i preferujący tematykę historyczną\
      \ [[Marcello Bacciarelli]]. Malarstwo późnego rokoka reprezentuje [[Jan Piotr\
      \ Norblin]]. Do ok. 1830 r. powstawały dzieła o formach w pełni klasycyzujących,\
      \ takie jak np. [[Teatr Wielki w Warszawie|Teatr Wielki]] zabudowa [[Plac Bankowy\
      \ w Warszawie|Placu Bankowego]] w Warszawie ([[Antonio Corazzi]]), powstają\
      \ nowe miasta ([[Kock]]) i założenia parkowe ([[Arkadia (powiat łowicki)|Arkadia]]).\
      \ Rzeźbę reprezentują dzieła [[Bertel Thorvaldsen|Bertela Thorvaldsena]]. Działali\
      \ także artyści krajowi, m.in. architekci [[Jakub Kubicki]] ([[Belweder w Warszawie]])\
      \ i [[Palladianizm|palladianista]] [[Stanisław Zawadzki (architekt)|Stanisław\
      \ Zawadzki]] ([[pałac w Śmiełowie]]). Malarstwo przełomu XVIII i XIX w. reprezentuje\
      \ m.in. [[Zygmunt Vogel]].\n\n[[Romantyzm]] w Polsce reprezentują malarze [[Piotr\
      \ Michałowski]] [[Artur Grottger]] [[Henryk Rodakowski]] poruszający wątek narodowowyzwoleńczy.\
      \ W architekturze dominuje [[Historyzm (architektura)|historyzm]] i [[Eklektyzm\
      \ (architektura)|eklektyzm]]. Na terenie ziem polskich działał m.in. [[Karl\
      \ Friedrich Schinkel]], lansujący historyzm wznosząc swoje dzieła w Antoninie,\
      \ [[Ratusz w Kołobrzegu|Kołobrzegu]] czy [[Kościół św. Marcina w Krzeszowicach|Krzeszowicach]].\
      \ W II połowie XIX stulecia malarstwo zdominował [[Realizm (malarstwo)|realizm]]\
      \ i realizm historyczny. Codzienność stała się tematem płócien [[Aleksander\
      \ Gierymski|Aleksandra Gierymskiego]], wiejski krajobraz i widoki małych miasteczek\
      \ malował [[Józef Szermentowski]]. Czołowym polskim akademistą był [[Henryk\
      \ Siemiradzki]]. W Krakowie i Paryżu działał [[Jan Matejko]]. Gros jego ''[[Œuvre|oeuvre]]''\
      \ zajmowała historia Polski; artysta podjął [[Filozofia historii|historiozoficzną]]\
      \ percepcję przeszłości kraju. Rzeźbę II połowy XIX wieku reprezentują [[Cyprian\
      \ Godebski (rzeźbiarz)|Cyprian Godebski]], [[Teodor Rygier]], [[Pius Weloński]],\
      \ a architekturę m.in. [[Feliks Księżarski]]. Na Śląsku działał neogotycysta\
      \ [[Alexis Langer]], lansujący nawrót do średniowiecznej pobożności. [[Industrializacja]]\
      \ sprzyja rozwojowi miast (Łódź, Katowice, Żyrardów) i osiedli robotniczych\
      \ ([[Nikiszowiec]] na Śląsku). Powstają liczne wille i rezydencje fabrykantów.\
      \ Na przełomie stuleci działa neogotycysta [[Józef Pius Dziekoński]]. Motywy\
      \ francuskiego impresjonizmu przyjęli m.in. [[Władysław Podkowiński]] i [[Józef\
      \ Pankiewicz]].\n[[Plik:Jacek Malczewski, Hamlet Polski - Portret Aleksandra\
      \ Wielopolskiego.jpg|mały|[[Jacek Malczewski]], ''[[Hamlet polski. Portret Aleksandra\
      \ Wielopolskiego]]'']]\nOkres [[Młoda Polska|Młodej Polski]] wiąże się z nie\
      \ tylko symbolizmem, lecz także z poszukiwaniem indywidualnego podejścia do\
      \ sztuki. Działali malarze [[Stanisław Wyspiański]], [[Józef Mehoffer]], [[Olga\
      \ Boznańska]], [[Jan Stanisławski (malarz)|Jan Stanisławski]], [[Jacek Malczewski]];\
      \ rzeźbiarz [[Wacław Szymanowski (rzeźbiarz)|Wacław Szymanowski]], architekci\
      \ [[Teodor Talowski]], [[Franciszek Mączyński]] i [[Stanisław Witkiewicz]],\
      \ który preferował [[styl zakopiański]]. W architekturze przeważają formy secesyjne\
      \ (zabudowa [[Ulica Piotrkowska w Łodzi|ul. Piotrkowskiej w Łodzi]]), które\
      \ wykorzystywano do aranżacji wnętrz (m.in. [[Dom Lekarski]] z dekoracją i witrażami\
      \ Stanisława Wyspiańskiego, Kawiarnia [[Jama Michalika]] w Krakowie projektu\
      \ [[Karol Frycz|Karola Frycza]]). Na szeroką skalę rozwinęło się wzornictwo\
      \ przemysłowe, sztuka użytkowa preferowana m.in. przez [[Jan Szczepkowski|Jana\
      \ Szczepkowskiego]].\n\nPo odzyskaniu przez Polskę niepodległości w sztuce pojawiły\
      \ się tendencje awangardowe. Kubizm swobodnie interpretowali w swoich dziełach\
      \ malarze [[Zbigniew Pronaszko]], [[Władysław Strzemiński]], [[Henryk Stażewski]],\
      \ rzeźbiarz [[Xawery Dunikowski]], nie rezygnując z figuratywności. Malarz i\
      \ filozof [[Stanisław Ignacy Witkiewicz]] wyróżniał się oryginalnością. Działalność\
      \ podjęły grupy artystyczne, m.in. [[Stowarzyszenie Artystów Polskich „Rytm”]]\
      \ (1922), [[Stowarzyszenie Polskich Artystów Grafików „Ryt”]] (1925) i Spółdzielnia\
      \ Artystów Plastyków „Ład” (1926). Malarka epoki [[art déco]] [[Tamara Łempicka]]\
      \ żyła i tworzyła w [[Paryż]]u. Architektura charakteryzowała się swobodną,\
      \ często uproszczoną redakcją form dawnych (dzieła [[Adolf Szyszko-Bohusz|Adolfa\
      \ Szyszko-Bohusza]], [[Oskar Sosnowski|Oskara Sosnowskiego]]) zaś pod koniec\
      \ lat 20. zdominowały formy czyste, pozbawione dekoracji, sprzyjające [[Modernizm\
      \ w Polsce|funkcjonalizmowi]]. Wielkim przedsięwzięciem była budowa [[Gdynia|Gdyni]]\
      \ (1926) i Stalowej Woli (1938) w stylu modernizmu, który wyróżniał się nowatorstwem\
      \ formy wynikającej z funkcji. Architektoniczna awangarda międzywojenna w tradycyjnie\
      \ profrancuskiej Polsce była bardziej pod wpływem [[Le Corbusier]]a niż niemieckiego\
      \ [[Bauhaus]]u<ref>Wojciech Kosiński, ''Mega pionierzy – mega nadzieje, sukcesy\
      \ i kontrowersje'', Kraków 2010.</ref>. Na Śląsku preferowana jest niemiecka\
      \ awangarda. Wśród dzieł wyróżnia się [[Hala Stulecia we Wrocławiu|Hala Stulecia]]\
      \ we Wrocławiu, dzieło [[Max Berg|Maxa Berga]].\n\n[[Plik:Monte Cassino Denkmal\
      \ Warschau 2023-05-13 1.jpg|mały|lewo|[[Gustaw Zemła]], marmurowy [[Pomnik Bitwy\
      \ o Monte Cassino w Warszawie]] (1999) został zainspirowany starożytną rzeźbą\
      \ [[Nike z Samotraki]]]]\n\nPo zakończeniu [[II wojna światowa|II wojny światowej]]\
      \ ma miejsce odbudowa zabytków i miast. Wielkimi przedsięwzięciami była odbudowa\
      \ Poznania, Gdańska i Warszawy ukoronowana wierną rekonstrukcją [[Zamek Królewski\
      \ w Warszawie|Zamku Królewskiego]] (1971–1984). W sztukach plastycznych [[Realizm\
      \ socjalistyczny|socrealizm]] został zdominowany przez kierunki awangardowe.\
      \ W latach 50. działała grupa [[Kapizm|kolorystów]] ([[Jan Cybis]], [[Hanna\
      \ Rudzka-Cybis]]owa, [[Jan Szancenbach (malarz)|Jan Szancenbach]]). Z późniejszych\
      \ ugrupowań m.in. [[Grupa Krakowska]] na czele z [[Tadeusz Kantor|Tadeuszem\
      \ Kantorem]], [[Łódź Kaliska (grupa)|Łódź Kaliska]] i wiele innych. Indywidualistami\
      \ malarstwa są m.in. [[Andrzej Wróblewski (malarz)|Andrzej Wróblewski]] oraz\
      \ [[Bronisław Wojciech Linke|Bronisław Linke]], którzy w sposób nowatorski oddali\
      \ hołd ofiarom [[II wojna światowa|II wojny światowej]]<ref>Bronisław Linke:\
      \ „Kamienie krzyczą”. Robotnicza Spółdzielnia Wydawnicza „Prasa” 1959.</ref>,\
      \ [[Piotr Potworowski]], [[Jan Tarasin]], [[Jerzy Nowosielski]], [[Ludwik Konarzewski\
      \ (junior)|Ludwik Konarzewski]], [[Jerzy Duda-Gracz]], [[Zdzisław Beksiński]].\
      \ [[Wojciech Fangor]] zasłynął jako światowej sławy artysta malarz [[Op-art|wizualizmu]]<ref>[https://www.moma.org/collection/works/78613\
      \ Wojciech Fangor, Number 17, 1963, MoMA].</ref>. Wzrosło znaczenie polskiej\
      \ grafiki ([[Mieczysław Wejman]]) i plakatu (założenie [[Muzeum Plakatu w Wilanowie]],\
      \ twórczość m.in. [[Henryk Tomaszewski (grafik)|Henryka Tomaszewskiego]], [[Waldemar\
      \ Świerzy|Waldemara Świerzego]], [[Jan Młodożeniec|Jana Młodożeńca]]). Przedstawicielami\
      \ rzeźby są m.in. [[Magdalena Abakanowicz]], [[Gustaw Zemła]] i [[Władysław\
      \ Hasior]]. Do upadku komunizmu w architekturze dominowało oszczędnościowe budownictwo\
      \ [[Technologia wielkopłytowa|wielkopłytowe]], które jeszcze za swojej epoki\
      \ spotkało się z otwartą krytyką polskiej inteligencji na niekorzyść ówczesnej\
      \ władzy<ref>{{Cytuj |autor = Helena Syrkus |tytuł = Architekt sam musi być\
      \ optymistą. „Polityka” 1980 nr 32 |url = http://bazhum.muzhp.pl/media//files/Kwartalnik_Historii_Nauki_i_Techniki/Kwartalnik_Historii_Nauki_i_Techniki-r2009-t54-n3_4/Kwartalnik_Historii_Nauki_i_Techniki-r2009-t54-n3_4-s123-164/Kwartalnik_Historii_Nauki_i_Techniki-r2009-t54-n3_4-s123-164.pdf}}</ref>.\
      \ Wśród oryginalnych dzieł architektury polskiej odrzucających narzucony socrealizm\
      \ wyróżnia się całkowicie przeszklony i unoszący się w powietrzu nad ziemią\
      \ na słupach z [[żelbet|żelazobetonu]] (fr. ''[[pilotis]]'') oraz wyposażony\
      \ w taras dachowy rekompensujący miejsce zajęte na ziemi przez fundamenty [[Centralny\
      \ Dom Towarowy w Warszawie]] zbudowany w 1951, który jako dzieło [[Modernizm\
      \ w Polsce|modernizmu]] został zainspirowany formą i funkcją transatlantyku\
      \ i który zrealizował w pełni pięć zasad architektury nowoczesnej [[Le Corbusier]]a<ref>„Sztuka\
      \ polska 1918–2000” Wojciech Włodarczyk Arkady 2000.</ref>. Powstały także pomysłowe\
      \ dzieła jak [[Kościół Matki Bożej Królowej Polski w Krakowie (Arka Pana)|Arka\
      \ Pana]] w krakowskich [[Bieńczyce (Kraków)|Bieńczycach]], katowicki [[Spodek\
      \ (hala widowiskowa)|Spodek]] oraz [[Osiedle Tysiąclecia (Katowice)|Osiedle\
      \ Tysiąclecia]] z charakterystycznymi „[[Kukurydze (wieżowce)|Kukurydzami]]”\
      \ i wiele innych.\n\n[[Plik:Szczecin filharmonia (2).jpg|mały|[[Filharmonia\
      \ im. Mieczysława Karłowicza w Szczecinie|Filharmonia Szczecińska]]]]\n\nPo\
      \ 1989 oprócz krajowych architektów (np. [[Stanisław Niemczyk]]), swoje dzieła\
      \ w Polsce wznieśli m.in. [[Arata Isozaki]], [[Daniel Libeskind]] i [[Norman\
      \ Foster]]. Spośród najnowszych siedzib instytucji kultury na uwagę zasługują\
      \ m.in. [[Biblioteka Uniwersytecka w Warszawie]], [[Centrum Nauki Kopernik w\
      \ Warszawie]], [[Opera i Filharmonia Podlaska]] – Europejskie Centrum Sztuki\
      \ w Białymstoku, [[Centrum Dialogu „Przełomy”]] i [[Filharmonia im. Mieczysława\
      \ Karłowicza w Szczecinie]], [[Brama Poznania ICHOT]] i ‘Aula Nova’ [[Akademia\
      \ Muzyczna im. Ignacego Jana Paderewskiego w Poznaniu|Akademii Muzycznej im.\
      \ Ignacego Jana Paderewskiego w Poznaniu]], [[Kieleckie Centrum Kultury]] oraz\
      \ [[Centrum Edukacyjne Szklany Dom w Ciekotach]], a także budynki odrestaurowane,\
      \ o funkcjach kulturalnych, komercyjnych lub mieszkalnych, np. stołeczne [[Muzeum\
      \ Powstania Warszawskiego]], [[Filharmonia Bałtycka|Polska Filharmonia Bałtycka\
      \ im. Fryderyka Chopina w Gdańsku]], [[Stara Rzeźnia w Szczecinie|Centrum Kultury\
      \ Euroregionu Stara Rzeźnia]] w [[Szczecin]]ie, [[Manufaktura (Łódź)|Manufaktura]]\
      \ w Łodzi i [[loft]]y w miastach o długich tradycjach przemysłowych, jak Warszawa,\
      \ Łódź lub [[Żyrardów]].\n\n== Kultura ==\n{{Osobny artykuł|Kultura polska}}\n\
      \n=== Język ===\n{{Osobny artykuł|Język polski|Dialekty języka polskiego|Gramatyka\
      \ języka polskiego|Historia języka polskiego}}\n[[Plik:Book of Henryków.PNG|thumb|Najstarsze\
      \ zdanie zapisane w 1270 roku w języku polskim w [[Księga henrykowska|Księdze\
      \ henrykowskiej]]]]\n\n=== Literatura ===\n{{Osobny artykuł|Literatura polska}}\n\
      {{Commons|Portrety polskich pisarzy i poetów|Portrety polskich pisarzy i poetów}}\n\
      \n[[Literatura polska – średniowiecze|Literatura średniowieczna w Polsce]] powstawała\
      \ pod wpływem krajów zachodnich i [[Chrześcijaństwo|chrześcijaństwa]]. W pierwszym\
      \ okresie jej rozwoju (do końca XII wieku) na terenie kraju literatura rozwijała\
      \ się wyłącznie w języku łacińskim, była też zazwyczaj anonimowa. Na prozę składały\
      \ się utwory [[Hagiografia|hagiograficzne]] (np. żywot [[Wojciech Sławnikowic|św.\
      \ Wojciecha]] [[Bruno z Kwerfurtu|Brunona z Kwerfurtu]]), [[Epistolografia|epistolograficzne]],\
      \ modlitewne i [[Historiografia|dziejopisarskie]] (''[[Kronika Galla Anonima]]'',\
      \ ''Chronica Polonorum'' [[Wincenty Kadłubek|Kadłubka]]). Poezja miała charakter\
      \ okolicznościowy, [[Panegiryk|panegiryczny]], [[Liturgia|liturgiczny]] ([[Sekwencja\
      \ (pieśń)|sekwencje]] i [[Trop (pieśń)|tropy]]) i żałobny. W okresie drugim\
      \ (XII-XIV w.) w piśmiennictwie rozwijały się [[Kazanie|kazania]] (''[[Kazania\
      \ świętokrzyskie]]''). Pojawiły się pierwsze utwory w języku narodowym (''[[Psałterz\
      \ floriański]]'', ''[[Bogurodzica (pieśń)|Bogurodzica]]''), język polski wykorzystywany\
      \ był również w twórczości ustnej. Równouprawnienie zyskał dopiero w okresie\
      \ trzecim (XIV–XVI w.), w którym powstały takie utwory jak tzw. ''[[Lament świętokrzyski]]''\
      \ i ''[[Rozmyślanie przemyskie]]''. Tworzono również [[polskie przekłady Biblii]]<ref>{{Cytuj\
      \ książkę |nazwisko = Michałowska |imię = Teresa |nazwisko2 = Otwinowska |imię2\
      \ = Barbara |nazwisko3 = Sarnowska-Temeriusz |imię3 = Elżbieta |tytuł = Słownik\
      \ literatury staropolskiej. Średniowiecze, renesans, barok |data = 2002 |wydawca\
      \ = Zakład Narodowy im. Ossolińskich – Wydawnictwo |miejsce = Wrocław |isbn\
      \ = 83-04-04621-0 |strony = 954–957 |rozdział = Teresa Michałowska ''Średniowiecze''}}</ref>.\n\
      \n[[Plik:Czarnolas.Dwór 02.JPG|mały|lewo|[[Muzeum Jana Kochanowskiego w Czarnolesie]]]]\n\
      \nPoczątkowo [[Literatura polska – renesans|literatura renesansowa]] powstawała\
      \ w Polsce po łacinie za sprawą zarówno obcokrajowców ([[Filip Kallimach]],\
      \ [[Konrad Celtis]]), jak i Polaków ([[Mikołaj Hussowczyk]], [[Andrzej Krzycki]]).\
      \ Utwory literackie pisane po polsku pojawiały się coraz częściej od około 1543\
      \ roku, kiedy to większe uznanie zaczęli zdobywać tacy pisarze jak: [[Mikołaj\
      \ Rej]], [[Andrzej Frycz Modrzewski]], [[Stanisław Hozjusz]]. W tym okresie\
      \ wzrosła również popularność literatury o tematyce obywatelskiej. Apogeum rozwoju\
      \ literatury [[renesans]]owej przypadało na lata 1565–1590. Najważniejszymi\
      \ pisarzami byli wtedy: [[Łukasz Górnicki]], [[Andrzej Patrycy Nidecki|A.P.\
      \ Nidecki]] i [[Jan Kochanowski]]. Ten ostatni, tworząc [[Pieśń (gatunek literacki)|pieśni]],\
      \ [[Fraszka|fraszki]] i [[Tragedia|tragedie]] stał się ojcem polskiego języka\
      \ literackiego. Od 1590 do początków XVII w. nastąpił zmierzch renesansu w literaturze\
      \ polskiej<ref>{{Cytuj książkę |nazwisko = Michałowska |imię = Teresa |nazwisko2\
      \ = Otwinowska |imię2 = Barbara |nazwisko3 = Sarnowska-Temeriusz |imię3 = Elżbieta\
      \ |tytuł = Słownik literatury staropolskiej. Średniowiecze, renesans, barok\
      \ |data = 2002 |wydawca = Zakład Narodowy im. Ossolińskich – Wydawnictwo |miejsce\
      \ = Wrocław |isbn = 83-04-04621-0 |strony = 800–810 |rozdział = Janusz Pelc\
      \ ''Renesans''}}</ref>.\n\nNa [[Literatura polska – barok|polską literaturę\
      \ barokową]] (XVII w.) składa się kilka nurtów, m.in. nurt religijny, rozwijający\
      \ się pod wpływem [[Kontrreformacja|kontrreformacji]] ([[Elegia|elegie]], [[emblemat]]y,\
      \ [[Kazanie|kazania]], [[Pieśń (gatunek literacki)|pieśni]], utwory [[Hagiografia|hagiograficzne]],\
      \ [[Parafraza|parafrazy]] [[Biblia|ksiąg biblijnych]], teksty o charakterze\
      \ indywidualnym i medytacyjnym, np. [[Mikołaj Sęp Szarzyński|Sępa Szarzyńskiego]]).\
      \ Drugim nurtem literatury [[barok]]u była twórczość [[Jezuici|jezuitów]] (głównie\
      \ [[Łacina|łacińska]] – [[epigramat]]y, [[Oda (literatura)|ody]], pieśni, ale\
      \ także przekłady, np. [[Biblia]] [[Jakub Wujek|Jakuba Wujka]]). Powstawały\
      \ również w obrębie tego nurtu traktaty religijne i polityczne ([[Piotr Skarga|Skarga]]),\
      \ [[Modlitewnik (książka)|modlitewniki]], teksty dramaturgiczne dla szkół. Innym\
      \ nurtem była twórczość [[Sarmatyzm|sarmacka]] (formy tradycyjne, nawiązujące\
      \ do średniowiecza, rozwój poezji [[Ziemiaństwo|ziemiańskiej]] i rycerskiej,\
      \ popularność zdobywały [[Sylwa|sylwy]] domowe i [[pamiętnik]]i). Poezja wyrażała\
      \ poczucie marności dóbr doczesnych oraz przemijania miłości i szczęścia (''[[Roksolanki,\
      \ to jest ruskie panny|Roksolanki]]'' [[Szymon Zimorowic|Zimorowica]]). Powstawały\
      \ także erotyki ([[Jan Andrzej Morsztyn|J.A. Morsztyn]]). W literaturze baroku\
      \ wyodrębnia się również twórczość [[Literatura sowizdrzalska|sowizdrzalską]]\
      \ (głównie anonimową), w której dominowała [[parodia]], [[satyra]], [[groteska]]\
      \ i [[nonsens]]<ref>{{Cytuj książkę |nazwisko = Michałowska |imię = Teresa |nazwisko2\
      \ = Otwinowska |imię2 = Barbara |nazwisko3 = Sarnowska-Temeriusz |imię3 = Elżbieta\
      \ |tytuł = Słownik literatury staropolskiej. Średniowiecze, renesans, barok\
      \ |data = 2002 |wydawca = Zakład Narodowy im. Ossolińskich – Wydawnictwo |miejsce\
      \ = Wrocław |isbn = 83-04-04621-0 |strony = 95–99 |rozdział = Jadwiga Sokołowska,\
      \ Alina Nowicka-Jeżowa ''Barok''}}</ref>.\n\nEpoka Oświecenia w Polsce rozpoczęła\
      \ się w pierwszej połowie XVIII w. i związana była z kryzysem [[Demokracja szlachecka|demokracji\
      \ szlacheckiej]] i zagrożeniem niezależnego bytu państwowego, stąd duża część\
      \ literatury zajmowała się sprawami obywatelskimi i politycznymi. Twórczość\
      \ taką uprawiali m.in. [[Ignacy Krasicki]] i [[Adam Naruszewicz]]. Pisarze ci\
      \ (podobnie jak [[Franciszek Bohomolec]], [[Julian Ursyn Niemcewicz]] i [[Franciszek\
      \ Zabłocki]]) związani byli z [[klasycyzm]]em, nawiązującym do twórczości [[Starożytność|antycznej]].\
      \ Nurt ten stanowił ówcześnie oficjalny i popierany przez [[Stanisław August\
      \ Poniatowski|króla]] program literacki Polski. Obok niego funkcjonował nurt\
      \ [[Sentymentalizm|sentymentalny]], propagowany przez ośrodek [[Czartoryscy\
      \ herbu własnego|Czartoryskich]] w [[Pałac Czartoryskich w Puławach|Puławach]].\
      \ W ramach tego nurtu tworzyli m.in. [[Franciszek Karpiński]] i [[Franciszek\
      \ Dionizy Kniaźnin]]. Najpopularniejszymi gatunkami epoki były: [[Oda (literatura)|oda]],\
      \ [[sielanka]], [[bajka]] i [[satyra]]. Tworzono również [[Poemat heroikomiczny|poematy\
      \ heroikomiczne]] oraz pierwsze polskie [[Powieść|powieści]]<ref>{{Cytuj książkę\
      \ |nazwisko = Kostkiewiczowa |imię = Teresa |nazwisko2 = Aleksandrowicz-Ulrich\
      \ |imię2 = Alina |tytuł = Słownik literatury polskiego oświecenia |data = 2002\
      \ |wydawca = Zakład Narodowy im. Ossolińskich – Wydawnictwo |miejsce = Wrocław\
      \ |isbn = 83-04-04620-2 |strony = rozdział= Janusz Maciejewski ''Oświecenie''}}</ref>.\n\
      \n[[Plik:Pan Tadeusz - title page 1834 (93691847) (cropped).jpg|mały|upright|[[Adam\
      \ Mickiewicz]], ''[[Pan Tadeusz]]'', 1834, strona tytułowa, tom II]]\n[[Plik:Fragment\
      \ ekspozycji dot. stroju ludowego w Muzeum Regionalnym im. Wł. St. Reymonta\
      \ - Lipce Reymontowskie - 001071c.jpg|mały|upright|[[Muzeum Regionalne im. Władysława\
      \ St. Reymonta w Lipcach Reymontowskich]] upamiętniające powieść „[[Chłopi (powieść)|Chłopi]]”]]\n\
      \nSytuacja [[III rozbiór Polski|utraty niepodległości]] w 1795 roku wpłynęła\
      \ w znaczny sposób na [[Literatura polska – romantyzm|literaturę polską]], która\
      \ pełniła odtąd funkcję utrzymywania świadomości narodowej. Pod wpływem [[romantyzm]]u\
      \ niemieckiego i angielskiego wykształcił się i rozwinął nurt polskiego romantyzmu,\
      \ początkowo rywalizujący z [[klasycyzm]]em i [[sentymentalizm]]em postanisławowskim,\
      \ później zaś dominujący aż do [[Powstanie styczniowe|1863]] roku. W okresie\
      \ porozbiorowym gromadzono [[Podanie (literatura)|podania]], [[Legenda|legendy]]\
      \ i [[Lud (monografia)|pieśni ludowe]] ([[Oskar Kolberg]]). Sytuację literacką\
      \ zmienił upadek [[Powstanie listopadowe|powstania listopadowego]]: piśmiennictwo\
      \ od tamtego momentu podzieliło się na literaturę krajową ([[Powieść historyczna|powieści\
      \ historyczne]] [[Józef Ignacy Kraszewski|Kraszewskiego]], [[Gawęda szlachecka|gawędy\
      \ szlacheckie]] [[Henryk Rzewuski|Rzewuskiego]], [[Komedia obyczajowa|komedie\
      \ obyczajowe]] [[Aleksander Fredro|Fredry]]) oraz [[Wielka Emigracja|emigracyjną]],\
      \ gdzie powstały ważne dzieła dla polskiej literatury: [[Adam Mickiewicz|Mickiewicza]]\
      \ ''[[Dziady (dramat)|Dziady]]'' i ''[[Pan Tadeusz]]'' (który został uznany\
      \ za [[Epos narodowy|epopeję narodową]]), [[Juliusz Słowacki|Słowackiego]] ''[[Kordian\
      \ (dramat)|Kordian]]'', [[Zygmunt Krasiński|Krasińskiego]] ''[[Nie-Boska komedia]]'',\
      \ a także wiele utworów [[Cyprian Kamil Norwid|Norwida]], prekursora polskiego\
      \ [[parnasizm]]u. Nastąpił gwałtowny rozwój [[Liryka|liryki]], w tym [[Poezja|poezji]]\
      \ mistycznej, pojawiły się takie [[Gatunek literacki|gatunki]], jak [[dramat\
      \ romantyczny]], [[poemat dygresyjny]] i szereg innych. Do dzieł powstałych\
      \ w tamtym okresie odnosiły się wszystkie późniejsze [[Epoka literacka|epoki\
      \ literackie]]<ref>{{cytuj książkę |nazwisko = Witkowska |imię = Alina |autor\
      \ link = Alina Witkowska |tytuł = Literatura romantyzmu |wydawca = PWN |miejsce\
      \ = Warszawa |rok = 1987 |strony = 5–23 |isbn = 83-01-05357-7}}</ref><ref>{{Cytuj\
      \ książkę |autor = |tytuł = Słownik terminów literackich |data = 1998 |wydawca\
      \ = Zakład Narodowy im. Ossolińskich |miejsce = Wrocław |isbn = 83-04-04417-X\
      \ |strony = 482–483}}</ref>.\n\nRok 1864 (upadek [[Powstanie styczniowe|powstania\
      \ styczniowego]]) uznaje się zazwyczaj<ref>{{Cytuj książkę |nazwisko = Markiewicz\
      \ |imię = Henryk |autor link = Henryk Markiewicz |tytuł = Literatura pozytywizmu\
      \ |data = 2000 |wydawca = Wydawnictwo Naukowe PWN |miejsce = Warszawa |isbn\
      \ = 83-01-12277-3 |strony = 5}}</ref> za początek [[pozytywizm]]u w Polsce.\
      \ Sytuacja [[Rozbiory Polski|polityczna kraju]], niewiara w odzyskanie niepodległości\
      \ metodą zbrojnego oporu oraz zainteresowanie odkryciami naukowymi, zmieniły\
      \ rolę przypisywaną literaturze. Miała być ona przede wszystkim użyteczna i\
      \ reagować na aktualne wydarzenia i problemy społeczne. Zmniejszyło się znaczenie\
      \ poezji (choć wciąż powstawała, tworzyli m.in. [[Maria Konopnicka]], [[Adam\
      \ Asnyk]]), a najwyżej cenionym [[Gatunek literacki|gatunkiem literackim]] stała\
      \ się [[powieść realistyczna]] (m.in. ''[[Meir Ezofowicz]]'' i ''[[Nad Niemnem]]''\
      \ [[Eliza Orzeszkowa|Elizy Orzeszkowej]] oraz ''[[Lalka (powieść)|Lalka]]''\
      \ [[Bolesław Prus|Bolesława Prusa]]) lub [[Powieść tendencyjna|tendencyjna]]\
      \ (m.in. [[Józef Ignacy Kraszewski|Kraszewski]] ''{{link-interwiki |Dziadunio\
      \ |Q=Q105520950}}'', Orzeszkowa ''{{link-interwiki |Pan Graba |Q=Q18673024}}'',\
      \ ''{{link-interwiki |Pamiętnik Wacławy |Q=Q15727172}}''). Tworzono również\
      \ liczną [[Nowela|nowelistykę]] ([[Maria Konopnicka|Konopnicka]], [[Henryk Sienkiewicz|Sienkiewicz]],\
      \ Prus), a także [[Powieść historyczna|powieści historyczne]], takie jak: ''[[Faraon\
      \ (powieść)|Faraon]]'' Prusa oraz ''[[Ogniem i mieczem]]'', ''[[Potop (powieść)|Potop]]'',\
      \ ''[[Pan Wołodyjowski]]'', ''[[Krzyżacy (powieść)|Krzyżacy]]'', ''[[Quo vadis]]''\
      \ Henryka Sienkiewicza<ref>{{Cytuj książkę |nazwisko = Markiewicz |imię = Henryk\
      \ |autor link = Henryk Markiewicz |tytuł = Pozytywizm |data = 2004 |wydawca\
      \ = Wydawnictwo Naukowe PWN |miejsce = Warszawa |isbn = 83-01-13849-1}}</ref>.\n\
      \n[[Literatura polska – Młoda Polska|Młoda Polska]] jest samookreśleniem grupy\
      \ artystów z lat 1890–1918 i pochodzi z manifestu programowego [[Artur Górski\
      \ (krytyk literacki)|Artura Górskiego]], w którym skrytykował on [[Pozytywizm|pozytywistów]]\
      \ i przedstawił program literacki młodych twórców. W programie zwrócono uwagę\
      \ na ponadprzeciętność artysty, podniesiono go do rangi wieszcza, zwykłego człowieka\
      \ zaś nazwano „filistrem”, czyli osobą ograniczoną. Żądano wolności oraz oddzielenia\
      \ sztuki od dziedzictwa kulturowego. Powstaje hasło „sztuka dla sztuki” oznaczające\
      \ rezygnację z obywatelskich powinności piśmiennictwa, a położenie nacisku na\
      \ [[indywidualizm]] i jednostkowe przeżycie. Jednocześnie niektórzy twórcy kontynuowali\
      \ problematykę wyzwoleńczą. Wtedy tworzyli [[Jan Kasprowicz]], [[Tadeusz Miciński]],\
      \ [[Leopold Staff]], [[Stanisław Wyspiański]], [[Stefan Żeromski]]. Ważną postacią\
      \ okresu Młodej Polski był [[Stanisław Przybyszewski]], z którego dorobku na\
      \ uwagę zasługują powieść ''[[Il Regno Doloroso]]'' oraz autobiografia ''[[Moi\
      \ współcześni]]''.\n\nPolska miała w XX wieku czterech noblistów w dziedzinie\
      \ literatury: [[Henryk Sienkiewicz|Henryka Sienkiewicza]], [[Władysław Reymont|Władysława\
      \ Reymonta]], [[Czesław Miłosz|Czesława Miłosza]] i [[Wisława Szymborska|Wisławę\
      \ Szymborską]]. Inni ważni pisarze to [[Stanisław Ignacy Witkiewicz|Witkacy]],\
      \ [[Bruno Schulz]] i [[Witold Gombrowicz]], których zalicza się do awangardy;\
      \ twórca fantastyki naukowej [[Stanisław Lem]], który przewidział w swoich dziełach\
      \ ogromną liczbę odkryć naukowych, które stały się faktem: [[biotechnologia]],\
      \ [[Internet|sieć]], rzeczywistość wirtualna; [[reportaż]]ysta [[Ryszard Kapuściński]],\
      \ którego portrety innych kultur i nacji są szeroko cenione i przekładane na\
      \ inne języki. Inni ważni pisarze to: [[Zbigniew Herbert]], [[Sławomir Mrożek]],\
      \ [[Jarosław Iwaszkiewicz]], [[Leopold Tyrmand]], [[Stefan Chwin]], [[Jerzy\
      \ Prokopiuk]], [[Andrzej Waligórski]], [[Maria Pawlikowska-Jasnorzewska]], [[Julian\
      \ Tuwim]], [[Ferdynand Goetel]], [[Piotr Kuncewicz]], [[Paweł Jasienica]], [[Stanisław\
      \ Jerzy Lec]], [[Tadeusz Boy-Żeleński]], [[Tadeusz Różewicz]], [[Józef Mackiewicz]],\
      \ [[Andrzej Bobkowski]], [[Zofia Nałkowska]], [[Krzysztof Kamil Baczyński]],\
      \ [[Stanisław Barańczak]], [[Adam Zagajewski]], [[Tadeusz Konwicki]], [[Stefan\
      \ Wiechecki]], [[Marcin Świetlicki]], [[Andrzej Stasiuk]], [[Eustachy Rylski\
      \ (pisarz)|Eustachy Rylski]] i [[Jerzy Sosnowski (pisarz)|Jerzy Sosnowski]].\n\
      \n{{Zobacz też|Literatura polska – dwudziestolecie międzywojenne|Literatura\
      \ polska w okresie II wojny światowej|Polska literatura współczesna}}\n\n===\
      \ Filozofia ===\n{{Osobny artykuł|Filozofia polska}}\n[[Plik:Grzegorz z Sanoka\
      \ 1.JPG|mały|upright|[[Grzegorz z Sanoka]]]]\n\nPierwszym znanym filozofem polskim\
      \ był [[Witelon]], właściwy rozwój filozofii polskiej wiąże się jednak dopiero\
      \ z założeniem Akademii Krakowskiej – jak inne uniwersytety środkowoeuropejskie,\
      \ uczelnia ta powstała w czasach stopniowego zmierzchu myśli scholastycznej.\
      \ Najszerzej znani polscy filozofowie średniowieczni uprawiali przede wszystkim\
      \ filozofię praktyczną, zwłaszcza powiązaną z [[koncyliaryzm]]em myśl społeczną\
      \ i polityczno-religijną: czynił tak już [[Mateusz z Krakowa]], do innych kluczowych\
      \ reprezentantów tego nurtu należeli [[Paweł Włodkowic]], [[Jan z Ludziska]]\
      \ i [[Jan Ostroróg (1436–1501)|Jan Ostroróg]]. Na gruncie filozofii spekulatywnej\
      \ uprawiane były wszystkie główne kierunki filozoficzne późnej scholastyki,\
      \ tj. [[tomizm]], [[albertyzm]] i [[Skotyzm|szkotyzm]] (''via antiqua''; główni\
      \ reprezentanci: [[Jan z Głogowa]], [[Jakub z Gostynina]], [[Jan ze Stobnicy]])\
      \ i [[nominalizm]] (''via moderna'', główni reprezentanci: [[Jakub z Paradyża]],\
      \ [[Benedykt Hesse]]).\n\nNajwybitniejszym reprezentantem [[Humanizm renesansowy|humanizmu]]\
      \ był w XV wieku [[Grzegorz z Sanoka]], do wczesnej recepcji humanizmu w Polsce\
      \ przyczynił się także Włoch [[Filip Kallimach]]. Głównymi reprezentantami myśli\
      \ humanistycznej, często o raczej publicystyczno-politycznym niż czysto filozoficznym\
      \ charakterze, byli w Polsce [[Sebastian Petrycy]], [[Adam Burski]], [[Stanisław\
      \ Orzechowski (pisarz)|Stanisław Orzechowski]], [[Łukasz Górnicki]], [[Andrzej\
      \ Frycz Modrzewski]]. Szeroko znana była myśl ariańska: prace [[Faust Socyn|Faustyna\
      \ Socyna]] i [[Szymon Budny|Szymona Budnego]]. Znaczące elementy filozoficzne,\
      \ zwłaszcza w dziedzinie metodologii nauk przyrodniczych, zawierają dzieła [[Mikołaj\
      \ Kopernik|Mikołaja Kopernika]].\n\nW XVI wieku na uniwersytetach kontynuowano\
      \ filozofię szkolną, która odrodziła się wraz z przybyciem do Polski [[Jezuici|jezuitów]].\
      \ Głównym ośrodkiem filozofii jezuickiej była [[Uniwersytet Wileński|Akademia\
      \ Wileńska]] – dużą popularność w Europie zyskał podręcznik logiki [[Marcin\
      \ Śmiglecki|Marcina Śmigleckiego]], a także dzieło {{link-interwiki |Jan Szydłowski\
      \ |tekst=Jana Szydłowskiego |Q=Q118206874}}. W XVII-wiecznej Polsce rozwijała\
      \ się także filozofia innowiercza, a zwłaszcza ariańska. Jej przedstawicielami\
      \ byli krytyk Kartezjusza [[Jan Ludwik Wolzogen|Johann Ludwig von Wolzogen]]\
      \ oraz [[Samuel Przypkowski]] i [[Andrzej Wiszowaty]]. Pisma filozoficzne pozostawił\
      \ też poeta i prozaik [[barok]]owy [[Stanisław Herakliusz Lubomirski]].\n\n\
      Od XVII wieku docierały do Polski nowe, antyscholastyczne idee filozoficzne\
      \ (nazywane ''philosophia recentiorum''), a w czasach saskich pierwsze idee\
      \ oświeceniowe ([[Wawrzyniec Mitzler de Kolof|Wawrzyniec Krzysztof Mitzler de\
      \ Kolof]], [[Daniel Kazimierz Narbutt]], [[Antoni Wiśniewski (pijar)|Antoni\
      \ Wiśniewski]]). W czasach stanisławowskich upowszechniła się kultura oświeceniowa\
      \ na wzór francuski – wśród filozofów najwybitniejszymi byli [[Jan Śniadecki]],\
      \ [[Jędrzej Śniadecki]], [[Hugo Kołłątaj]] i [[Stanisław Staszic]]. Filozofia\
      \ typu oświeceniowego rozwijała się nadal w pierwszych dekadach wieku XIX, zwłaszcza\
      \ w Wilnie. Do recepcji [[Immanuel Kant|kantyzmu]] przyczynił się natomiast\
      \ zwłaszcza [[Józef Kalasanty Szaniawski]].\n\nFilozofia pierwszej połowy XIX\
      \ wieku rozwijała się pod przemożnym wpływem idealizmu niemieckiego: głównymi\
      \ reprezentantami idealizmu w Polsce byli [[Józef Maria Hoene-Wroński|Józef\
      \ Hoene-Wroński]], [[Bronisław Ferdynand Trentowski|Bronisław Trentowski]],\
      \ [[August Cieszkowski]] i [[Karol Libelt]]. Istotne elementy filozoficzne zawierają\
      \ także utwory [[Juliusz Słowacki|Juliusza Słowackiego]] i [[Adam Mickiewicz|Adama\
      \ Mickiewicza]]. Główną ideą filozofii polskiej tego okresu był tzw. [[mesjanizm\
      \ polski]]. Druga połowa XIX wieku ma mniejsze znaczenie filozoficzne: tendencje\
      \ pozytywistyczne reprezentowali [[Aleksander Świętochowski]] i [[Julian Ochorowicz]],\
      \ ważnym myślicielem socjalistycznym był [[Edward Abramowski]]. Przełom XIX\
      \ i XX wieku to recepcja filozofii życia (Nietzschego i Schopenhauera) – reprezentantem\
      \ aktywizmu i ważnym teoretykiem kultury był w tym okresie [[Stanisław Brzozowski\
      \ (pisarz)|Stanisław Brzozowski]].\n\nWiek XX to okres największego rozkwitu\
      \ filozofii polskiej, szczególnie logiki. Wiązało się to z działalnością [[Szkoła\
      \ lwowsko-warszawska|szkoły lwowsko-warszawskiej]], założonej przez [[Kazimierz\
      \ Twardowski|Kazimierza Twardowskiego]]. Jej reprezentantami byli m.in. [[Alfred\
      \ Tarski]], [[Stanisław Leśniewski (1886–1939)|Stanisław Leśniewski]], [[Jan\
      \ Łukasiewicz]], [[Kazimierz Ajdukiewicz]], [[Tadeusz Kotarbiński]], [[Leon\
      \ Chwistek]], [[Tadeusz Czeżowski]], [[Izydora Dąmbska]]. Tarski należy do najwybitniejszych\
      \ logików współczesnych<ref>{{Cytuj książkę |nazwisko = Feferman |imię = Anita\
      \ B. |nazwisko2 = Feferman |imię2 = Solomon |tytuł = Alfred Tarski: Life and\
      \ Logic |wydawca = Cambridge University Press |rok = 2004 |isbn = 978-0-521-80240-6\
      \ |oclc = OCLC 54691904}}</ref>, do jego najważniejszych osiągnięć należą: definicja\
      \ prawdy, pojęcie definiowalności, konsekwencji i ω-zupełności. Do głównych\
      \ osiągnięć Leśniewskiego należą tzw. systemy Leśniewskiego, Łukasiewicza –\
      \ logiki wielowartościowe, Ajdukiewicza – teoria kategorii semantycznych i inne\
      \ badania semantyczne, Kotarbińskiego – koncepcja reizmu i rozwój prakseologii.\
      \ Bliscy szkole lwowsko-warszawskiej byli także socjolog [[Stanisław Ossowski\
      \ (socjolog)|Stanisław Ossowski]], współtwórca psychologii polskiej [[Władysław\
      \ Witwicki]], historyk filozofii i estetyk [[Władysław Tatarkiewicz]], etyk\
      \ [[Maria Ossowska]]. Głównym reprezentantem [[Fenomenologia|fenomenologii]]\
      \ w Polsce i jednym z czołowych fenomenologów w ogóle był [[Roman Ingarden]].\
      \ Własny system [[Ontologia|ontologiczny]] wypracował [[Stanisław Ignacy Witkiewicz]].\
      \ Ważnymi filozofami kultury byli [[Henryk Elzenberg (filozof)|Henryk Elzenberg]]\
      \ i [[Marian Zdziechowski]]. Tomizm i osiągnięcia logiki współczesnej łączyło\
      \ [[Koło Krakowskie]] ([[Jan Salamucha]], [[Józef Maria Bocheński]]).\n\nPo\
      \ II wojnie światowej, mimo trudności politycznych związanych z dominacją filozofii\
      \ marksistowskiej, filozofia polska nadal się rozwijała, kontynuowali działalność\
      \ Kotarbiński, Ajdukiewicz, Ingarden i Ossowscy. Do tradycji szkoły lwowsko-warszawskiej\
      \ nawiązują filozofowie analityczni ([[Bogusław Wolniewicz]], [[Jan Woleński]],\
      \ [[Wacław Mejbaum (filozof)|Wacław Mejbaum]], logik [[Roman Suszko (logik)|Roman\
      \ Suszko]]), rozwija się filozofia katolicka, w tym zwłaszcza neotomizm i personalizm\
      \ ([[Mieczysław Albert Krąpiec|Mieczysław Krąpiec]], [[Mieczysław Gogacz]],\
      \ [[Jan Paweł II|Karol Wojtyła]], [[Józef Tischner]]) oraz wszystkie nurty filozofii\
      \ XX-wiecznej ([[Ija Lazari-Pawłowska]], [[Tadeusz Kroński]], [[Leszek Kołakowski]],\
      \ [[Bronisław Baczko]], [[Marek Siemek]], [[Leszek Nowak (filozof)|Leszek Nowak]],\
      \ [[Adam Schaff]], [[Zygmunt Bauman]], historyk filozofii [[Adam Krokiewicz]]).\n\
      \n=== Muzyka ===\n{{Commons|Portrety polskich kompozytorów|Portrety polskich\
      \ kompozytorów}}\n{{Osobny artykuł|Muzyka polska}}\n[[Plik:Eugène Ferdinand\
      \ Victor Delacroix 043.jpg|mały|upright|[[Fryderyk Chopin]], (obraz [[Eugène\
      \ Delacroix|Eugène’a Delacroix]])]] \n\nNajczęściej wymieniani polscy kompozytorzy\
      \ muzyki poważnej to<ref>{{Cytuj stronę |url = http://www.mytopdozen.com/Best_Polish_Composers.html\
      \ |tytuł = Lista polskich kompozytorów najczęściej wymienianych w internecie\
      \ |język = en |archiwum = https://web.archive.org/web/20101017105617/http://www.mytopdozen.com/Best_Polish_Composers.html\
      \ |zarchiwizowano = 2010-10-17 |data dostępu = 2008-12-03}}</ref>: [[Fryderyk\
      \ Chopin]], [[Karol Szymanowski]], [[Krzysztof Penderecki]], [[Zbigniew Preisner]],\
      \ [[Wojciech Kilar]], [[Ignacy Jan Paderewski]], [[Henryk Wieniawski]], [[Krzysztof\
      \ Komeda]], [[Andrzej Panufnik]], [[Stanisław Moniuszko]], [[Jan A.P. Kaczmarek]],\
      \ [[Witold Lutosławski]], [[Henryk Mikołaj Górecki|Henryk Górecki]]. Jednym\
      \ z najbardziej rozpoznawalnych współczesnych kompozytorów muzyki poważnej i\
      \ filmowej był Wojciech Kilar, który m.in. skomponował muzykę do takich filmów\
      \ jak [[Pan Tadeusz (film 1999)|''Pan Tadeusz'']], ''Dracula'', ''Ziemia obiecana''\
      \ i ''Pianista''.\n\nTradycje muzyki ludowej są kultywowane m.in. przez [[Państwowy\
      \ Zespół Ludowy Pieśni i Tańca „Mazowsze”]] oraz [[Zespół Pieśni i Tańca „Śląsk”]].\
      \ W Polsce odbywa się wiele cyklicznych koncertów muzyki klasycznej, m.in. [[Międzynarodowy\
      \ Konkurs Pianistyczny im. Fryderyka Chopina]] w Warszawie, [[Międzynarodowy\
      \ Konkurs Pianistyczny im. Ignacego Jana Paderewskiego]] w [[Bydgoszcz]]y, [[Festiwal\
      \ Pianistyki Polskiej w Słupsku]] i [[Polickie Dni Muzyki „Cecyliada”]] w [[Police|Policach]].\n\
      \n{{Zobacz też|Polska muzyka rozrywkowa}}\n\n=== Film ===\n{{Osobny artykuł|Kinematografia\
      \ polska|Polska szkoła filmowa|Kino moralnego niepokoju}}\n\n[[Reżyser]]zy polscy,\
      \ których filmy zgłoszone zostały do rywalizacji o [[Nagroda Akademii Filmowej|Oscara]]\
      \ w kategorii filmu nieanglojęzycznego: [[Jerzy Antczak]], [[Sławomir Fabicki]],\
      \ [[Feliks Falk]] (2 razy), [[Robert Gliński]], [[Jerzy Hoffman]], [[Andrzej\
      \ Jakimowski]], [[Jerzy Kawalerowicz]] (3 razy), [[Dorota Kędzierzawska]], [[Krzysztof\
      \ Kieślowski]] (3 razy), [[Agnieszka Holland]], [[Jerzy Skolimowski]] (1 raz),\
      \ [[Jan Jakub Kolski]], [[Andrzej Kotkowski]], [[Kazimierz Kutz]] (2 razy),\
      \ [[Witold Leszczyński]], [[Juliusz Machulski]], [[Czesław Petelski]], [[Magdalena\
      \ Piekorz]], [[Radosław Piwowarski]], [[Roman Polański]], [[Jerzy Stuhr]], [[Piotr\
      \ Trzaskalski]], [[Andrzej Wajda]] (7 razy), [[Leszek Wosiewicz]], [[Krzysztof\
      \ Zanussi]] (4 razy).\n\nW Polsce odbywa się szereg festiwali filmowych o wieloletniej\
      \ tradycji, m.in. [[Krakowski Festiwal Filmowy]], [[Ińskie Lato Filmowe]], [[Festiwal\
      \ Polskich Filmów Fabularnych|Festiwal Filmowy w Gdyni]] i [[Festiwal Filmów\
      \ Kultowych]] w [[Katowice|Katowicach]].\n\n{{Zobacz też|Polskie filmy zgłoszone\
      \ do rywalizacji o Oscara w kategorii filmu nieanglojęzycznego}}\n\n=== Teatr\
      \ ===\n{{Osobny artykuł|Historia teatru w Polsce}}\n\n=== Środki masowego przekazu\
      \ ===\n==== Stacje telewizyjne ====\n{{Osobny artykuł|Polskojęzyczne stacje\
      \ telewizyjne|Polskie platformy cyfrowe|Polskie sieci kablowe}}\n\n===== Telewizja\
      \ publiczna =====\n[[Plik:Siedziba Telewizji Polskiej w Warszawie 2017.jpg|mały|Siedziba\
      \ TVP w Warszawie]]\n\nHistoria telewizji w Polsce sięga roku 1937, kiedy w\
      \ Warszawie uruchomiona została pierwsza doświadczalna stacja telewizyjna. W\
      \ 1959 emisję regularnego programu rozpoczął nadawca publiczny – [[Telewizja\
      \ Polska]]. Od 1970 nadawany jest program 2 telewizji publicznej, a od 1992\
      \ – program satelitarny dla Polonii zagranicznej. W Polsce działają następujące\
      \ kanały publicznej TVP: [[TVP1]], [[TVP2]], [[TVP3]], [[TVP Info]], [[TVP Polonia]],\
      \ [[TVP Kultura]], [[TVP Historia]], [[TVP Sport]], [[TVP ABC]], [[TVP Kobieta]],\
      \ [[Biełsat TV]], [[TVP HD]], [[TVP Seriale]], [[TVP Rozrywka]], [[TVP Dokument]],\
      \ [[TVP1|TVP1 HD]] i [[TVP2|TVP2 HD]]. Poza tym istnieje 16 ośrodków regionalnych\
      \ TVP.\n\n===== Telewizje prywatne =====\nPierwszą prywatną polską telewizją\
      \ o zasięgu lokalnym była [[PTV Echo]], założona w roku 1990, która z czasem\
      \ wraz z innymi prywatnymi telewizjami lokalnymi utworzyła ogólnopolską sieć\
      \ o nazwie [[Polonia 1]]. W 1992 roku powstała kolejna telewizja prywatna, ale\
      \ nie lokalna o nazwie [[Polsat]], która w 1993 roku dostała koncesję na nadawanie\
      \ naziemne. Obecnie w Polsce działają prywatne telewizje: [[TVN]], Polsat, Polonia\
      \ 1, [[Tele 5]], [[Canal+ Premium|Canal+ Polska]], [[Telewizja Trwam]], [[Telewizja\
      \ Republika]], [[TV4 (polska stacja telewizyjna)|TV4]], [[TV Puls]], [[Superstacja]],\
      \ [[MTV Polska]], [[4fun.tv]], [[Discovery Channel]] i [[TVS]].\n\n===== Platformy\
      \ satelitarne i telewizje kablowe =====\nNa terenie Polski działają platformy\
      \ satelitarne: [[Cyfrowy Polsat|Polsat Box]], [[Canal+ (polska platforma cyfrowa)|Canal+\
      \ Platforma]], [[Telewizja na kartę|N na kartę]], [[Orange TV (IPTV)|Orange\
      \ TV]]. Największe sieci kablowe to: [[UPC Polska]], [[Multimedia Polska]] i\
      \ [[Vectra]].\n\n==== Stacje radiowe ====\n{{Osobny artykuł|Polskie i polskojęzyczne\
      \ stacje radiowe odbierane w Polsce}}\n\nW domenie przekazu radiowego, działa\
      \ publiczne [[Polskie Radio]]: [[Polskie Radio Program I|Jedynka]], [[Polskie\
      \ Radio Program II|Dwójka]], [[Polskie Radio Program III|Trójka]], [[Czwórka\
      \ (stacja radiowa)|Czwórka]]. Poza publicznym Polskim Radiem, działa radio prywatne:\
      \ [[Radio Zet]], [[RMF FM]], [[Radio Złote Przeboje]], [[Radio Maryja]], [[Radio\
      \ Eska]], [[Meloradio]], [[RMF Maxx]], [[Antyradio]], [[Rock Radio]] i inne,\
      \ a także wiele stacji lokalnych i internetowych.\n\n==== Prasa ====\nWedług\
      \ danych [[Związek Kontroli Dystrybucji Prasy|Związku Kontroli Dystrybucji Prasy]],\
      \ największą sprzedaż wśród dzienników płatnych, które poddały się kontroli\
      \ nakładu, mają (dane za grudzień 2017, w kolejności od największego): „[[Fakt\
      \ (gazeta)|Fakt]]”, „[[Super Express]]”, „[[Gazeta Wyborcza]]”, „[[Rzeczpospolita\
      \ (gazeta)|Rzeczpospolita]]”, „[[Dziennik Gazeta Prawna]]”, [[Przegląd Sportowy]],\
      \ „[[Gazeta Polska Codziennie]]”<ref>{{Cytuj stronę |url = https://www.wirtualnemedia.pl/artykul/sprzedaz-gazet-codziennych-grudzien-2017\
      \ |tytuł = Tylko „Puls Biznesu” na plusie w grudniu 2017, „Gazeta Wyborcza”\
      \ z największym spadkiem |opublikowany = wirtualnemedia.pl |archiwum = https://web.archive.org/web/20181226211938/https://www.wirtualnemedia.pl/artykul/sprzedaz-gazet-codziennych-grudzien-2017\
      \ |zarchiwizowano = 2018-12-26}}</ref>.\n\nNajchętniej kupowanymi tygodnikami\
      \ opinii w roku 2017 były: „[[Tygodnik Angora]]”, „[[Gość Niedzielny]]”, „[[Polityka\
      \ (tygodnik)|Polityka]]”, „[[Newsweek Polska]]”, „[[Sieci|W Sieci]]”, „[[Do\
      \ Rzeczy]]”, „[[Gazeta Polska (tygodnik)|Gazeta Polska]]”<ref>{{Cytuj stronę\
      \ |url = https://www.wirtualnemedia.pl/artykul/sprzedaz-tygodnikow-opinii-w-2017-roku-tygodnik-powszechny-wprost\
      \ |tytuł = Tylko „Tygodnik Powszechny” ze wzrostem sprzedaży w 2017 roku, „Wprost”\
      \ o 21 proc. w dół |opublikowany = wirtualnemedia.pl |archiwum = https://web.archive.org/web/20181226211858/https://www.wirtualnemedia.pl/artykul/sprzedaz-tygodnikow-opinii-w-2017-roku-tygodnik-powszechny-wprost\
      \ |zarchiwizowano = 2018-12-26}}</ref>.\n\n==== Portale internetowe ====\nNajwiększymi\
      \ polskimi [[Portal internetowy|portalami]] są: [[Wirtualna Polska]] (WP), [[Onet.pl]],\
      \ [[Gazeta.pl]], [[Interia]], które oferują m.in. darmową pocztę elektroniczną,\
      \ [[czat]], a niektóre również [[blog]]i.\n\nNajpopularniejszymi [[Serwis społecznościowy|portalami\
      \ społecznościowymi]] są polskojęzyczny [[Facebook]], [[X (serwis społecznościowy)|Twitter]],\
      \ [[Instagram]] i [[Snapchat]].\n\n{{Zobacz też|Kategoria:Polskie portale internetowe}}\n\
      \n=== Kuchnia ===\n{{Osobny artykuł|Kuchnia polska|Kuchnia polska w dawnych\
      \ czasach}}\n{{Grafika rozwinięta\n| położenie = right\n| kierunek  = vertical\n\
      | tytuł     =\n| szerokość = 120\n\n| grafika1  = Wigilia potrawy 554.jpg\n\
      | alt1      =\n| opis1     = Tradycyjny wigilijny stół\n\n| grafika2  = Bigos\
      \ polonia.jpg\n| alt2      =\n| opis2     = [[Bigos]]\n\n| grafika3  = Pierogi\
      \ frying.jpg\n| alt3      =\n| opis3     = [[Pierogi]]\n}}\n\nNa kształtowanie\
      \ się swoistych cech kuchni polskiej miały wpływ przemiany historyczne. Na przestrzeni\
      \ dziejów kuchnia polska ulegała wpływom i zmianom regionalnym, zwłaszcza że\
      \ tereny Rzeczypospolitej Polskiej historycznie zamieszkiwała zmieniająca się\
      \ mozaika narodów. W efekcie silne są kulinarne wpływy wschodnie (tatarsko-tureckie,\
      \ wcześniej mongolskie), rusińskie, niemieckie, francuskie, włoskie i żydowskie.\n\
      \nPopularnym napojem jest [[herbata]] pita często z dodatkiem plasterka cytryny\
      \ i słodzona [[Cukier buraczany|cukrem]]. Herbata przybyła do Polski z Anglii\
      \ wkrótce po jej ukazaniu się w Zachodniej Europie (za sprawą kupców holenderskich).\
      \ Jednak jej rozpowszechnienie przypisywane jest zaborcom rosyjskim w XIX wieku.\
      \ Wówczas do polskich domów w tzw. Kongresówce trafiły [[samowar]]y z Rosji,\
      \ gdzie herbata niezależnie pojawiła się w postaci daru z Chin na dworze carskim,\
      \ na ok. 50 lat przed jej rozpowszechnieniem w Holandii. Popularna jest także\
      \ [[kawa]], powszechnie pita w Polsce od XVIII wieku, także przez niższe warstwy\
      \ społeczne, jak rzemieślnicy czy zamożne chłopstwo<ref>{{Cytuj stronę |url\
      \ = https://alpha.bn.org.pl/search~S5*pol?/tOpis+obyczaj{u00F3}w+za+panowania+Augusta+III/topis+obyczajo~aw+za+panowania+augusta+iii/1%2C3%2C9%2CB/frameset&FF=topis+obyczajo~aw+za+panowania+augusta+iii&1%2C%2C5/indexsort=-\
      \ |tytuł = Jędrzej Kitowicz: Opis obyczajów za panowania Augusta III Wrocław:\
      \ Zakład Narodowy im. Ossolińskich, 1970, s. 453–456}}</ref><ref>{{Cytuj książkę\
      \ |autor = Prosper MontaLarousse Librarie, Prosper Montagné, Larousse, Comité\
      \ gastronomique, Joel Robuchon |tytuł = Larousse Gastronomique |url = https://books.google.com/books?id=KaK5AAAACAAJ\
      \ |wydawca = Clarkson Potter / Larousse |miejsce = Paris / Nowy Jork |data =\
      \ 2001 (oryg. wydanie 1938) |isbn = 0609609718 |oclc = 46872358 |język = en\
      \ |data dostępu = 2009-01-10}}</ref>.\n\nWiele potraw zostało uznanych za [[Produkt\
      \ tradycyjny|produkty tradycyjne]] i wpisanych na [[Lista produktów tradycyjnych|Listę\
      \ Produktów Tradycyjnych]]. Są one wizytówkami poszczególnych regionów (np.\
      \ [[jagnięcina podhalańska]]) lub pojedynczych miejscowości (jak [[pasztecik\
      \ szczeciński]]).\n\n=== Sport ===\n{{Osobny artykuł|Sport w Polsce|Reprezentacja\
      \ Polski|Polscy olimpijczycy}}\n{{Grafika rozwinięta\n| położenie = right\n\
      | kierunek  = vertical\n| tytuł     = Polskie stadiony,<br>na których rozgrywano<br>[[Mistrzostwa\
      \ Europy w Piłce Nożnej 2012|Mistrzostwa Europy<br>w Piłce Nożnej 2012]]\n|\
      \ szerokość = 170\n\n| grafika1  = PGE Arena.jpeg\n| alt1      =\n| opis1  \
      \   = [[Stadion w Gdańsku|Stadion Energa Gdańsk]]\n\n| grafika2  = Stadion Narodowy\
      \ w Warszawie 20120422.jpg\n| alt2      =\n| opis2     = [[Stadion Narodowy\
      \ im. Kazimierza Górskiego w Warszawie|Stadion Narodowy w Warszawie]]\n\n| grafika3\
      \  = Stadiopoznan.jpg\n| alt3      =\n| opis3     = [[Stadion Poznań|Stadion\
      \ Miejski w Poznaniu]]\n\n| grafika4  = Stadion Wroclaw z lotu ptaka.jpg\n|\
      \ alt4      =\n| opis4     = [[Stadion Miejski we Wrocławiu]]\n}}\n\nNajpopularniejszym\
      \ sportem w Polsce jest [[piłka nożna]]<ref>{{Cytuj stronę |url = http://www.sport.pl/Rajd/1,131934,6260399,Spadlo_zainteresowanie_sportem__Malysz_wciaz_najpopularniejszy.html\
      \ |tytuł = Spadło zainteresowanie sportem |opublikowany = Sport.pl |archiwum\
      \ = https://web.archive.org/web/20160921013313/http://www.sport.pl/Rajd/1,131934,6260399,Spadlo_zainteresowanie_sportem__Malysz_wciaz_najpopularniejszy.html\
      \ |data dostępu = 2010-09-29}}</ref>. Największe sukcesy w tej dyscyplinie [[Reprezentacja\
      \ Polski w piłce nożnej mężczyzn|reprezentacja Polski w piłce nożnej]] odnosiła\
      \ w latach 70. do początku lat 80., kiedy to na [[Mistrzostwa świata w piłce\
      \ nożnej mężczyzn|Mistrzostwach Świata w Piłce Nożnej]] zajęła 3. miejsca w\
      \ [[Mistrzostwa Świata w Piłce Nożnej 1974|1974]] i [[Mistrzostwa Świata w Piłce\
      \ Nożnej 1982|1982]]. Drużyna narodowa zdobyła również złoty medal na [[Letnie\
      \ Igrzyska Olimpijskie 1972|Letnich Igrzyskach Olimpijskich w 1972 roku]], a\
      \ także dwa srebrne medale w [[Letnie Igrzyska Olimpijskie 1976|1976]] oraz\
      \ w [[Letnie Igrzyska Olimpijskie 1992|1992]]. 18 kwietnia 2007 prezydent [[UEFA]]\
      \ [[Michel Platini]] ogłosił, że [[Mistrzostwa Europy w Piłce Nożnej 2012|Mistrzostwa\
      \ Europy w Piłce Nożnej w 2012 roku]] odbędą się w Polsce i na [[Ukraina|Ukrainie]].\
      \ Polskie miasta-gospodarze meczów tej imprezy to [[Warszawa]], [[Gdańsk]],\
      \ [[Poznań]] i [[Wrocław]].\n\nNajwyższa liga piłki nożnej w Polsce mężczyzn\
      \ nazywa się [[Ekstraklasa w piłce nożnej|Ekstraklasa]] (do 2008 roku I liga),\
      \ natomiast kobiet nazywa się [[Ekstraliga polska w piłce nożnej kobiet|Ekstraliga]]\
      \ (do 2006 roku I liga kobiet). W Ekstraklasie występuje obecnie 18 zespołów<ref>{{Cytuj\
      \ |autor = |tytuł = Rewolucja w polskiej lidze od sezonu 2021/22! Ekstraklasa\
      \ w nowym wydaniu – Polsat Sport |data dostępu = 2020-10-30 |opublikowany =\
      \ polsatsport.pl |url = https://www.polsatsport.pl/wiadomosc/2020-02-21/rewolucja-w-polskiej-lidze-od-sezonu-202122-ekstraklasa-w-nowym-wydaniu/\
      \ |język = pl |archiwum = https://web.archive.org/web/20201208235247/https://www.polsatsport.pl/wiadomosc/2020-02-21/rewolucja-w-polskiej-lidze-od-sezonu-202122-ekstraklasa-w-nowym-wydaniu/\
      \ |zarchiwizowano = 2020-12-08}}</ref><ref>{{Cytuj |tytuł = Kalendarz sezonu\
      \ 2021/22 oraz zmiany w regulaminie rozgrywek Ekstraklasy |opublikowany = ekstraklasa.org\
      \ |url = https://www.ekstraklasa.org/aktualnosci/2262}}</ref>, natomiast w Ekstralidze\
      \ 12<ref>{{Cytuj |tytuł = Fakty i mity o reformie piłki kobiecej w Polsce |data\
      \ dostępu = 2024-05-10 |opublikowany = www2.laczynaspilka.pl |url = https://www2.laczynaspilka.pl/aktualnosci/ekstraliga-kobiet/fakty-i-mity-o-reformie-pilki-kobiecej-w-polsce}}</ref>.\n\
      \nMimo że w Polsce znacznie popularniejsza jest piłka nożna, Polacy znacznie\
      \ większe sukcesy odnieśli w [[Piłka siatkowa|siatkówce]], w której są obok\
      \ [[Reprezentacja Brazylii w piłce siatkowej mężczyzn|Brazylijczyków]] aktualnie\
      \ największą potęgą na świecie i jedną z najsilniejszych reprezentacji w historii.\
      \ [[Reprezentacja Polski w piłce siatkowej mężczyzn|Mężczyźni]] trzykrotnie\
      \ zdobyli [[Mistrzostwa świata w piłce siatkowej mężczyzn|mistrzostwo świata]]\
      \ w latach 1974, [[Mistrzostwa Świata w Piłce Siatkowej Mężczyzn 2014|2014]]\
      \ oraz [[Mistrzostwa Świata w Piłce Siatkowej Mężczyzn 2018|2018]].\n\nDyscypliną\
      \ sportową, której przedstawiciele odnieśli najwięcej sukcesów, jest [[lekkoatletyka]].\
      \ W okresie międzywojennym medale olimpijskie zdobywali: [[Halina Konopacka]],\
      \ [[Janusz Kusociński]], [[Stanisława Walasiewicz]], [[Jadwiga Wajsówna]], [[Maria\
      \ Kwaśniewska]].\n\nPo II wojnie światowej, od połowy lat 50. do 1966, w okresie\
      \ tzw. ''[[Wunderteam (lekkoatletyka)|Wunderteamu]]'', polscy lekkoatleci staczali\
      \ wyrównane pojedynki z lekkoatletami [[Stany Zjednoczone|USA]] i [[Związek\
      \ Socjalistycznych Republik Radzieckich|ZSRS]]. Do najwybitniejszych zawodników\
      \ w tym okresie należeli: [[Janusz Sidło]], [[Elżbieta Krzesińska|Elżbieta Duńska-Krzesińska]],\
      \ [[Zdzisław Krzyszkowiak]], [[Józef Szmidt]], [[Teresa Ciepły]], [[Irena Szewińska|Irena\
      \ Kirszenstein-Szewińska]], [[Ewa Kłobukowska]]. Wysoki międzynarodowy poziom\
      \ prezentowali lekkoatleci lat 70. (m.in. [[Władysław Komar]], [[Tadeusz Ślusarski]],\
      \ [[Władysław Kozakiewicz]], [[Jacek Wszoła]]).\n\nPo okresie znacznego obniżenia\
      \ poziomu w połowie lat 80., polska lekkoatletyka powróciła do światowej elity\
      \ w okresie III Rzeczypospolitej. Cztery złote medale olimpijskie w [[Chód sportowy|chodzie\
      \ sportowym]] zdobył [[Robert Korzeniowski]]. Jedną z najwybitniejszych polskich\
      \ sportsmenek jest wielokrotna rekordzistka świata, [[Rzut młotem|młociarka]]\
      \ [[Anita Włodarczyk]], dwa złote medale olimpijskie w [[Pchnięcie kulą|pchnięciu\
      \ kulą]] wywalczył [[Tomasz Majewski]].\n\nObok lekkiej atletyki tradycyjnie\
      \ mocnymi dyscyplinami olimpijskimi były na przestrzeni dziesięcioleci również\
      \ [[boks]], [[podnoszenie ciężarów]], [[szermierka]], [[zapasy]], [[kolarstwo]],\
      \ [[wioślarstwo]] i [[kajakarstwo]]. Szereg sukcesów odnosili przedstawiciele\
      \ [[Strzelectwo|strzelectwa]], [[Jeździectwo|jeździectwa]], [[Pięciobój nowoczesny|pięcioboju\
      \ nowoczesnego]] i [[Żeglarstwo|żeglarstwa]].\n\nDużym zainteresowaniem cieszy\
      \ się w Polsce również [[sport żużlowy]]. Najwyższa liga żużlowa w Polsce to\
      \ [[Ekstraliga na żużlu|Speedway Ekstraliga]]. Jest to również najlepsza liga\
      \ żużlowa na świecie. W przeszłości indywidualne tytuły mistrza świata zdobywali\
      \ [[Jerzy Szczakiel]] i [[Tomasz Gollob]]. Dziś sukcesy na arenie międzynarodowej\
      \ odnosi m.in. [[Bartosz Zmarzlik]], który jest wielokrotnym mistrzem świata.\
      \ Najbardziej utytułowane kluby żużlowe w Polsce to [[Unia Leszno]], [[ROW Rybnik\
      \ (żużel)|ROW Rybnik]] i [[Stal Gorzów Wielkopolski (żużel)|Stal Gorzów Wielkopolski]].\n\
      \nInnym chętnie oglądanym sportem jest [[koszykówka]], choć polskie ligi i reprezentacje\
      \ w tej dyscyplinie nie stoją na wysokim poziomie.\n\nW ostatnim okresie na\
      \ znaczeniu zyskały [[skoki narciarskie]] dzięki sukcesom [[Adam Małysz|Adama\
      \ Małysza]] i [[Kamil Stoch|Kamila Stocha]], [[Formuła 1]] za sprawą [[Robert\
      \ Kubica|Roberta Kubicy]], [[piłka ręczna]] ze względu na sukcesy [[Reprezentacja\
      \ Polski w piłce ręcznej mężczyzn|reprezentacji Polski]] na dwóch kolejnych\
      \ [[Mistrzostwa świata w piłce ręcznej mężczyzn|mistrzostwach świata]] w roku\
      \ [[Mistrzostwa Świata w Piłce Ręcznej Mężczyzn 2007|2007]] i [[Mistrzostwa\
      \ Świata w Piłce Ręcznej Mężczyzn 2009|2009]] oraz w [[Mistrzostwa Świata w\
      \ Piłce Ręcznej Mężczyzn 2015|2015]], a także [[Pływanie (sport)|pływanie]]\
      \ dzięki sukcesom m.in. [[Otylia Jędrzejczak|Otylii Jędrzejczak]] i [[Paweł\
      \ Korzeniowski|Pawła Korzeniowskiego]], również [[tenis]] za sprawą sukcesów\
      \ [[Iga Świątek|Igi Świątek]]. Szerokim echem odbiły się sukcesy [[Biegi narciarskie|biegaczy\
      \ narciarskich]] (pięć medali olimpijskich [[Justyna Kowalczyk|Justyny Kowalczyk]]),\
      \ [[biathlon]]istów, [[Łyżwiarstwo szybkie|łyżwiarzy szybkich]]. Warto również\
      \ podkreślić osiągnięcia przedstawicieli dyscyplin nieolimpijskich: [[Sport\
      \ samolotowy|sportu samolotowego]], [[Szybownictwo|szybownictwa]], [[Sport motorowodny|sportów\
      \ motorowodnych]], [[Żeglarstwo lodowe|bojerów]], [[alpinizm]]u.\n\n{{Zobacz\
      \ też|Polscy medaliści letnich igrzysk olimpijskich|Polscy medaliści zimowych\
      \ igrzysk olimpijskich}}\n\n== Święta ==\n{{Osobny artykuł|Święta państwowe\
      \ w Polsce}}\n\n=== Dni ustawowo wolne od pracy ===\n{{Osobny artykuł|Dni wolne\
      \ od pracy w Polsce}}\n\nNa obszarze Polski, zgodnie z ustawą z dnia 18 stycznia\
      \ 1951 o dniach wolnych od pracy<ref>{{Dziennik Ustaw|2020|1920}}.</ref>, dniami\
      \ wolnymi od pracy są wszystkie niedziele oraz 13 dni będących świętami: trzy\
      \ państwowe, dziewięć [[święta katolickie w Polsce|katolickich]] oraz [[Nowy\
      \ Rok]] (z tego dwa święta wypadają zawsze w niedzielę).\n\n== Uwagi ==\n{{Uwagi|\n\
      <ref name=\"966r\">Data umowna będąca datą przyjęcia przez [[Mieszko I|Mieszka\
