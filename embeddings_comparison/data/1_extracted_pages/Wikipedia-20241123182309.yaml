  - content: '{{Inne znaczenia|państwa polskiego|2=[[Rzeczpospolita Polska (miesięcznik)|czasopismo
      „Rzeczpospolita Polska”]] i [[Rzeczpospolita]], [[RP]]}}

      ''''''Rzeczpospolita Polska'''''' (RP) – oficjalna nazwa [[Państwo|państwa]]
      [[Polska|polskiego]] od drugiej połowy XVII wieku do 1795 (jedna z wielu stosowanych
      wówczas)<ref>[[Pacta conventa]] zawierały różne warianty. Np. [[Michał Korybut
      Wiśniowiecki|Michała Korybuta]] z 1669 ([http://www.wbc.poznan.pl/dlibra/docmetadata?id=65094
      ''''Volumina Legum'''' t. 5] s.13 punkt 61) „''''Rzeplitej oboyga narodow Polskiego
      y Litewskiego''''”, [[August II Mocny|Augusta II]] z 1697 ([http://www.wbc.poznan.pl/dlibra/docmetadata?id=65263
      t.6] s.11) „''''Rzeczypospolitey Korony Polskiej y W. X. Lit.''''”, [[Stanisław
      August Poniatowski|Stanisława Augusta]] z 1764 „''''Rzeczypospolitey oboyga
      narodow Polskiego y Litewskiego''''” ([[s:Volumina Legum. Tom VII/Articuli pactorum
      Conventorum|''''Articuli pactorum Conventorum'''']]). Przy ratyfikacji [[Traktat
      Grzymułtowskiego|traktatu Grzymułtowskiego]] w 1710 nazwę państwa określono
      jako „''''cała Rzeplita obojga narodów Korony Polskiej i WXL''''” (VL, t. 6,
      s.76).</ref> oraz od 14 marca 1919<ref>[http://buwcd.buw.uw.edu.pl/e_zbiory/ckcp/monitor_pl/1919-03/numer060/index.htm
      M.P. z 1919 r., nr 60]</ref> do 22 lipca 1952 i ponownie od 31 grudnia 1989.


      Słowo ''''rzeczpospolita'''' oznacza to samo co słowo ''''[[republika]]'''',
      jednak współcześnie jest stosowane wyłącznie w odniesieniu do Polski, [[Republika
      rzymska|Republiki Rzymskiej]], [[Republika Wenecka|Republiki Weneckiej]] lub
      [[Republika Nowogrodzka|Republiki Nowogrodzkiej]]. Historyczne połączenie Polski
      i Litwy nazwano [[Rzeczpospolita Obojga Narodów|Rzecząpospolitą Obojga Narodów]]
      ze względu na status republikański państwa, a nie dlatego, że to było połączenie
      Polski z innym krajem. Do czasów II wojny światowej w nomenklaturze polityczno-prasowej
      słowem ''''rzeczpospolita'''' określano również inne państwa o ustroju republikańskim
      np. Rzeczpospolita Francuska.


      Wzorem [[Francja|Francji]] w [[Historiografia|historiografii]] i [[Publicystyka|publicystyce]]
      polskiej stosuje się numerację RP<ref>Numerację RP zastosowano również w preambule
      Konstytucji RP z 1997 roku (''''{{Dziennik Ustaw|1997|78|483}}''''), powołując
      się na tradycje I i II Rzeczypospolitej wzywa się, aby w III opierano się na
      poszanowaniu zasad w niej zapisanych.</ref>, przy czym inaczej niż we Francji
      zmiany kolejnego numeru Rzeczypospolitej nie następowały po każdej zmianie ustrojowej
      (np. po wprowadzeniu [[Konstytucja kwietniowa|Konstytucji kwietniowej]] w 1935
      roku), ale po odzyskaniu przez [[Polska|Polskę]] [[Niepodległość|niepodległości]]
      w 1918 i 1989 roku. W [[historia Polski|historii Polski]] wyróżnia się trzy
      Rzeczypospolite (nie licząc okresu 1944–1952 i [[Polska Rzeczpospolita Ludowa|PRL]]).


      == I Rzeczpospolita ==

      [[Plik:Map of the Polish–Lithuanian Commonwealth (1619–1621).png|thumb|200px|Rzeczpospolita
      Obojga Narodów w największych granicach]]

      {{Osobny artykuł|I Rzeczpospolita|Rzeczpospolita Obojga Narodów}}


      I Rzeczpospolita zwana jest również Rzecząpospolitą szlachecką lub [[Rzeczpospolita
      Obojga Narodów|Rzecząpospolitą Obojga Narodów]]. Nazwa Rzeczpospolita Polska
      była używana jako oficjalna nazwa państwa polsko-litewskiego od drugiej połowy
      XVII wieku<ref>Przykłady użycia nazwy ''''Rzeczpospolita Polska'''' w dokumentach
      państwowych: [https://web.archive.org/web/20131110050649/http://www.ieg-mainz.de/likecms/likecms.php?site=comment.htm&dir=&ieg2sess=qrbdu7qp5esfkg95sajvkl54s6&treaty=113&comment=296&notrans=1].</ref>.
      Forma ustroju I Rzeczypospolitej jest określana jako demokracja szlachecka{{fakt|data=2012-06}}.
      Prawa polityczne przysługiwały około 10% mieszkańców, co w ówczesnej Europie
      stanowiło ją jednym z nielicznych przykładów państwa, w którym znacząca liczba
      obywateli miała wpływ na politykę władzy. Trudno wyznaczyć początek I Rzeczypospolitej.
      Za symboliczne daty jej powstania uważa się rok 1454 (wydanie [[Przywilej cerekwicki|przywilejów
      cerekwicko]]-[[Statuty nieszawskie|nieszawskich]]), 1505 (konstytucja ''''[[Nihil
      novi]]'''') lub 1569 (zawarcie [[Unia lubelska|unii lubelskiej]] i powstanie
      [[Rzeczpospolita Obojga Narodów|Rzeczypospolitej Obojga Narodów]]). Końcem zaś
      I Rzeczypospolitej jest jej [[rozbiory Polski|III rozbiór]] w 1795 r.


      == II Rzeczpospolita ==

      [[Plik:Poland 1930.svg|thumb|200px|II RP na mapie Europy w czasie dwudziestolecia
      międzywojennego]]

      {{Osobny artykuł|II Rzeczpospolita}}


      II Rzeczpospolita istniała od odzyskania niepodległości przez Polskę i przekazania
      przez [[Rada Regencyjna|Radę Regencyjną]] pełni władzy cywilnej i wojskowej
      w Królestwie Polskim [[Józef Piłsudski|Józefowi Piłsudskiemu]] 14 listopada
      1918 r.<ref>11 listopada Rada Regencyjna przekazała Piłsudskiemu władzę wojskową,
      12 listopada upoważniła go do tworzenia rządu, 14 listopada rozwiązała się przenosząc
      pełnię władzy regenta na Józefa Piłsudskiego. W tym dniu też po raz pierwszy
      użyto oficjalnie określenia ''''Republika Polska'''', co oznaczało zniesienie
      ustroju monarchistycznego w Polsce.</ref> Za jej koniec uznaje się 5 lipca 1945,
      gdy w konsekwencji ustaleń [[konferencja jałtańska|konferencji jałtańskiej]]
      [[Rząd Rzeczypospolitej Polskiej na uchodźstwie|Rząd RP na uchodźstwie]] utracił
      uznanie [[Wielka Brytania|Wielkiej Brytanii]] i [[Stany Zjednoczone|Stanów Zjednoczonych]],
      a w konsekwencji pozostałych państw tworzonej wówczas [[Organizacja Narodów
      Zjednoczonych|Organizacji Narodów Zjednoczonych]]. Oznaczało to przejęcie majątku
      i reprezentacji Polski na arenie międzynarodowej przez podporządkowany komunistom
      [[Tymczasowy Rząd Jedności Narodowej]] w Warszawie. [[Prezydent Rzeczypospolitej
      Polskiej|Prezydent]] i Rząd RP na uchodźstwie utracili w konsekwencji status
      [[Podmioty prawa międzynarodowego|podmiotu prawa międzynarodowego]], choć kontynuowali
      swą działalność aż do [[Wybory prezydenckie w Polsce w 1990 roku|pierwszych
      powszechnych wyborów prezydenckich w Polsce w 1990 r.]] 22 grudnia 1990 ostatni
      prezydent RP na uchodźstwie [[Ryszard Kaczorowski]] przekazał [[Insygnia Prezydenta
      Rzeczypospolitej Polskiej|insygnia prezydenckie II Rzeczypospolitej]] i rękopis
      [[Konstytucja kwietniowa|konstytucji kwietniowej]] pierwszemu wybranemu w wolnych
      wyborach prezydentowi III Rzeczypospolitej – [[Lech Wałęsa|Lechowi Wałęsie]].


      == Polska Ludowa ==

      {{Osobny artykuł|Polska Ludowa}}


      === Rzeczpospolita Polska ===

      22 lipca 1944 roku [[Józef Stalin]], powołując [[Polski Komitet Wyzwolenia Narodowego]],
      rozpoczął tworzenie administracji państwowej w Polsce na terenach zajętych przez
      [[Armia Czerwona|Armię Czerwoną]]. Administracja ta zastąpiła siłą (przy użyciu
      aparatu represji [[NKWD]]) struktury [[Polskie Państwo Podziemne|Polskiego Państwa
      Podziemnego]] będące kontynuacją [[II Rzeczpospolita|II Rzeczypospolitej]] w
      kraju i podporządkowane [[Rząd Rzeczypospolitej Polskiej na uchodźstwie|rządowi
      RP na uchodźstwie]]. W konsekwencji decyzji [[konferencja jałtańska|konferencji
      jałtańskiej]], w lutym 1945 roku [[Wielka Brytania]] i [[Stany Zjednoczone|USA]]<ref>Uznające
      [[Rząd Rzeczypospolitej Polskiej na uchodźstwie|Rząd RP na uchodźstwie]].</ref>
      w porozumieniu z ZSRR uznały [[Rząd Tymczasowy Rzeczypospolitej Polskiej]] (w
      który 31 grudnia 1944 roku został przemianowany PKWN) za podstawę do utworzenia
      w trybie konsultacji trzech mocarstw [[Tymczasowy Rząd Jedności Narodowej|Tymczasowego
      Rządu Jedności Narodowej]]. Po konferencji moskiewskiej, która odbywała się
      w czerwcu 1945 roku, równolegle do [[proces pokazowy|pokazowego]] [[Proces szesnastu|procesu
      szesnastu]] przywódców Polskiego Państwa Podziemnego (aresztowanych w prowokacji
      NKWD 19 marca 1945 roku), rządy Wielkiej Brytanii i Stanów Zjednoczonych wycofały
      5 lipca 1945 roku uznanie dla rządu RP na uchodźstwie i uznały Tymczasowy Rząd
      Jedności Narodowej w Warszawie za prawnego reprezentanta państwa polskiego –
      Rzeczypospolitej Polskiej. Podobnie jak w [[Republika Czechosłowacka (1948–1960)|powojennej
      Czechosłowacji]], w Polsce nie określano istniejącej w latach 1944–1952 Rzeczypospolitej
      kolejnym numerem porządkowym, choć z formalnego punktu widzenia RP (bez numeracji)
      była [[Sukcesja (prawo)|następcą prawnym]] II RP.


      === Polska Rzeczpospolita Ludowa ===

      [[Plik:Poland 1956-1990.svg|thumb|200px|PRL w Europie w czasach zimnej wojny]]

      {{Osobny artykuł|Polska Rzeczpospolita Ludowa}}


      Po pełnym przejęciu władzy w Polsce przez [[Polska Partia Robotnicza|PPR]] i
      następnie stalinizacji życia publicznego (rezygnacji z fasady rządów wielopartyjnych
      na rzecz tzw. kierowniczej roli [[Polska Zjednoczona Partia Robotnicza|partii
      komunistycznej (PZPR)]] – [[dyktatura]] [[System jednopartyjny|monopartyjna]]),
      w 1952 r. nazwę państwa (równolegle do zmian nazw podporządkowanych ZSRR: [[Węgry|Węgier]]
      ([[Węgierska Republika Ludowa (1949–1989)|Węgierska Republika Ludowa]]), [[Rumunia|Rumunii]]
      ([[Rumunia w epoce komunizmu|Rumuńska Republika Ludowa]]) i [[Bułgaria|Bułgarii]]
      ([[Ludowa Republika Bułgarii]])) zmieniono w nowej, współredagowanej<ref>{{Cytuj
      stronę | url = http://dziedzictwo.polska.pl/katalog/skarb,Konstitucija_Polskoj_Narodnoj_Respubliki_projekt_konstytucji_PRL_z_poprawkami_Jozefa_Stalina_z_roku_1951,gid,116376,cid,183.htm
      | tytuł = Poprawki J. Stalina na projekcie Konstytucji, dostępne w internecie,
      dostęp 2007-03-10, 18.20 | opublikowany = dziedzictwo.polska.pl | archiwum =
      https://web.archive.org/web/20070828190925/http://dziedzictwo.polska.pl/katalog/skarb,Konstitucija_Polskoj_Narodnoj_Respubliki_projekt_konstytucji_PRL_z_poprawkami_Jozefa_Stalina_z_roku_1951,gid,116376,cid,183.htm
      | zarchiwizowano = 2007-08-28}}.</ref> przez [[Józef Stalin|Stalina]] [[Konstytucja
      Polskiej Rzeczypospolitej Ludowej|konstytucji]]<ref>Która zastąpiła obowiązującą
      formalnie w latach 1944–1952 [[Konstytucja marcowa|konstytucję marcową]] (z
      poprawkami z 1947 r.).</ref> na [[Polska Rzeczpospolita Ludowa]]. Ostateczną
      wersję polskojęzyczną Konstytucji PRL opracował [[Bolesław Bierut]]<ref>[http://niezniknelo.pl/OK2//publicystyka/konstytucja-ludu-pracujacego-miast-i-wsi-propagandowe-wykorzystanie-konstytucji-prl/
      Konstytucja ludu pracującego miast i wsi – propagandowe wykorzystanie Konstytucji
      PRL].</ref>. Po przemianach demokratycznych roku 1989 ustawą Sejmu PRL przywrócono
      z dniem 31 grudnia 1989 historyczną nazwę państwa polskiego – Rzeczpospolita
      Polska. Okres od upadku PRL, zapoczątkowanego [[Okrągły Stół (Polska)|umową
      Okrągłego Stołu]] i wyborami 4 czerwca 1989 należy już do historii [[Polska|III
      Rzeczypospolitej]].


      == III Rzeczpospolita ==

      [[Plik:LocationPoland.svg|thumb|300px|III Rzeczpospolita na mapie Europy]]

      {{Osobny artykuł|III Rzeczpospolita}}


      III Rzeczpospolita, demokratyczna i suwerenna republika parlamentarna. Za jej
      początek uważa się: 4 czerwca 1989 (zwycięstwo [[Niezależny Samorządny Związek
      Zawodowy „Solidarność”|„Solidarności”]] w [[Sejm Polskiej Rzeczypospolitej Ludowej
      X kadencji|wyborach kontraktowych]]), 24 sierpnia 1989 (powołanie przez Sejm
      [[Tadeusz Mazowiecki|Tadeusza Mazowieckiego]] na stanowisko [[premier]]a), 29
      grudnia 1989 (nowelizacja konstytucji m.in. zmieniająca oficjalną nazwę kraju
      na Rzeczpospolita Polska z dniem 31 grudnia 1989<ref>{{Dziennik Ustaw|1989|75|444}}.</ref>)
      lub też 22 grudnia 1990 r. (przekazanie insygniów władzy przez prezydenta [[Ryszard
      Kaczorowski|Ryszarda Kaczorowskiego]] podczas zaprzysiężenia prezydenta [[Lech
      Wałęsa|Lecha Wałęsy]]). Podczas tego ostatniego wydarzenia Wałęsa powiedział,
      że „z tą chwilą zaczyna się uroczyście III Rzeczpospolita Polska”<ref>{{encyklopedia
      PWN|id = 4575051|tytuł=Polska. Historia. Trzecia Rzeczpospolita|data dostępu=2007-11-25}}</ref>.


      Czasami wymieniane są też późniejsze daty, na przykład [[Wybory parlamentarne
      w Polsce w 1991 roku|pierwsze w pełni wolne wybory parlamentarne 27 października
      1991 r]].


