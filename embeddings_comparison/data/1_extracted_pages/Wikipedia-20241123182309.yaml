      \ Polski|R}}}}\n| \n| \n|}\n\n== Biografie ==\n{{osobny artykuł|Wikiprojekt:Polski\
      \ kanon Wikipedii/Biografie}}\n{{kategoria główna|Biografie kanonu polskiej\
      \ Wikipedii}}\nTo największy dział Kanonu, zawiera łącznie '''763''' artykuły\
      \ biograficzne: aktorów i tancerzy, reżyserów i scenarzystów, socjologów, etnografów,\
      \ artystów, architektów, pisarzy, dramaturgów, poetów, publicystów, tłumaczy,\
      \ osób zw. z literaturą, historyków, archeologów, krytyków sztuki, kompozytorów\
      \ i muzyków, odkrywców, wynalazców i naukowców, filozofów, ekonomistów, myślicieli,\
      \ polityków, wojskowych, osób zw. z religią, prawników i kodyfikatorów prawa,\
      \ przywódców Polski, aktywistów i działaczy społecznych, postaci zw. ze sportem\
      \ oraz lekarzy.\n\n== Historia ==\n{{osobny artykuł|Wikiprojekt:Polski kanon\
      \ Wikipedii/Historia}}\nDział historyczny to '''70''' artykułów opisujących\
      \ okoliczności powstania państwa polskiego oraz ważne wydarzenia, które miały\
      \ miejsce na przestrzeni wieków w dziejach Polski.\n\n== Geografia i przyroda\
      \ ==\n{{osobny artykuł|Wikiprojekt:Polski kanon Wikipedii/Geografia i przyroda}}\n\
      \n=== Geografia ===\nKanon artykułów związanych z Polską zawiera '''61''' artykułów\
      \ geograficznych dotyczących podziału terytorialnego, krain, miast, rzek, zbiorników\
      \ wodnych i geomorfologii Polski.\n\n=== Przyroda ===\nTo '''25''' artykułów\
      \ o środowisku naturalnym Polski: ochronie przyrody, jej osobliwościach oraz\
      \ o charakterystycznych gatunkach roślin i zwierząt.\n\n== Społeczeństwo ==\n\
      {{osobny artykuł|Wikiprojekt:Polski kanon Wikipedii/Społeczeństwo}}\nZgromadzono\
      \ tu '''131''' artykułów poruszających ważne zagadnienia społeczne, m.in.: rodzina\
      \ i pokrewieństwo, mniejszości narodowe i etniczne, myślenie, zachowania i emocje,\
      \ polityka i partie polityczne, biznes i ekonomia, prawo, organizacje i ruchy\
      \ społeczne, wojna i siły zbrojne, cmentarze, ordery i odznaczenia, edukacja.\n\
      \n== Kultura ==\n{{osobny artykuł|Wikiprojekt:Polski kanon Wikipedii/Kultura}}\n\
      Drugi pod względem wielkości dział Kanonu zawiera '''322''' artykułów z zakresu\
      \ szeroko pojętej kultury. Dotyczą one m.in.: utworów literackich, literatury\
      \ non-fiction, zagadnień językoznawczych, sztuki, architektury, budownictwa,\
