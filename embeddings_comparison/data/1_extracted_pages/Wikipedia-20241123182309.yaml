      \ miast w Polsce]]\n\nWedług danych [[Główny Urząd Statystyczny|GUS]], w Polsce\
      \ jest '''1013''' miast (według stanu na 1 stycznia 2024)<ref name=\"PopulacjaPowierzchnia\"\
      \ />. Najmniej zaludnionym miastem Polski jest [[Opatowiec]] liczący 308 mieszkańców,\
      \ najludniejsza zaś [[Warszawa]] ma około 6044 razy więcej mieszkańców (1 861\
      \ 599 – wg stanu na rok 2024<ref name=\"PopulacjaPowierzchnia\" />).\n\nNajmniejszą\
      \ powierzchnię ma [[Stawiszyn]] (0,99&nbsp;km²) a największą [[Gdańsk]] (683&nbsp;km²).\
      \ Najmniejszą gęstością zaludnienia charakteryzuje się [[Krynica Morska]] (10\
      \ osób/km²) a największą [[Ząbki]] (4130 osób/km²)<ref name=\"PopulacjaPowierzchnia\"\
      \ />.\n\nWedług większości niezależnych źródeł, największą [[Aglomeracja|aglomeracją]],\
      \ [[Obszar metropolitalny|obszarem metropolitalnym]], jak i [[Zespół miejski|zespołem\
      \ miejskim]] w Polsce jest [[Konurbacja górnośląska|aglomeracja katowicka]]\
      \ (w zależności od źródła 2,7 do 5,3 mln mieszkańców), następnie [[Aglomeracja\
      \ warszawska|warszawska]] (2,1 do 2,8 mln mieszkańców), [[Aglomeracja krakowska|krakowska]]\
      \ (0,8 do 1,3 mln mieszkańców) oraz [[Aglomeracja trójmiejska|gdańska]] (ok.\
      \ 1,2 mln mieszkańców) i [[Aglomeracja łódzka|łódzka]] (0,9 do 1,2 mln mieszkańców)<ref>{{Cytuj\
