      \ |zarchiwizowano = 2012-01-31 |data dostępu = 2010-07-08}}</ref> || 2018 ||\
      \ 5,3%<ref name=\":0\" />\n|\n|\n|}\n\nPod względem wielkości [[Produkt krajowy\
      \ brutto|PKB]], Polska jest szóstą gospodarką [[Unia Europejska|Unii Europejskiej]]\
      \ i 25. gospodarką świata (w 2016)<ref>{{Cytuj stronę |url = https://www.cia.gov/library/publications/the-world-factbook/rankorder/2001rank.html\
      \ |tytuł = Country Comparison: GDP (purchasing power parity) |autor = CIA |opublikowany\
      \ = [[The World Factbook]] |język = en |archiwum = https://web.archive.org/web/20110604195034/https://www.cia.gov/library/publications/the-world-factbook/rankorder/2001rank.html\
      \ |zarchiwizowano = 2011-06-04 |data dostępu = 2014-04-28}}</ref>.\n\n[[Produkt\
      \ krajowy brutto|Produkt krajowy na głowę mieszkańca]] wynosił według obliczeń\
      \ [[Międzynarodowy Fundusz Walutowy|MFW]] w roku 2014 nominalnie 14 378 dolarów,\
      \ a po zmierzeniu [[Parytet siły nabywczej|parytetem siły nabywczej]] 25 105\
      \ dolarów, co plasuje Polskę na 23 miejscu wśród 28 krajów Unii Europejskiej.\n\
      \nTempo wzrostu gospodarczego stawia Polskę wśród najszybciej rozwijających\
      \ się państw [[Europa|Europy]] – w 2009 PKB wzrósł o 1,7%, co było jedynym dodatnim\
      \ wynikiem w UE (średnia -4,1%)<ref name=\"imf2\">{{Cytuj stronę |url = http://www.imf.org/external/pubs/ft/weo/2010/01/pdf/c2.pdf\
      \ |tytuł = World Economic Outlook |autor = MFW (International Monetary Fund)\
      \ |język = en |archiwum = https://web.archive.org/web/20100602013607/http://www.imf.org/external/pubs/ft/weo/2010/01/pdf/c2.pdf\
      \ |zarchiwizowano = 2010-06-02 |data dostępu = 2022-06-08}}</ref>. Tempo wzrostu\
      \ PKB per capita w Polsce w latach 1992–2002 należało według OECD do najwyższych\
      \ na świecie i wyniosło 116%, z poziomu 4994 dolarów w 1992 do 10 800 dolarów\
      \ według w 2002 r.<ref>{{Cytuj stronę |url = https://web.archive.org/web/20080321015054/http://www.csioz.gov.pl/60/iii31.htm\
      \ |tytuł = 3.1. Produkt Krajowy Brutto |autor = Alicja Sobczak |opublikowany\
      \ = Centrum Ochrony Systemów Informacyjnych Ochrony Zdrowia |data dostępu =\
      \ 2008-12-03}}</ref> według parytetu siły nabywczej. Sektor usług odpowiada\
      \ za wytworzenie 62,7% całego PKB, przemysł 33,3%, rolnictwo 4%<ref name=\"\
      cia.gov\">{{Cytuj stronę |url = https://www.cia.gov/library/publications/the-world-factbook/geos/pl.html\
      \ |tytuł = Poland Overview |autor = [[Centralna Agencja Wywiadowcza|CIA]] |opublikowany\
      \ = [[The World Factbook]] |język = en |archiwum = https://web.archive.org/web/20150918224315/https://www.cia.gov/library/publications//the-world-factbook/geos/pl.html\
      \ |zarchiwizowano = 2015-09-18 |data dostępu = 2014-04-28}}</ref>.\n\nPolska\
      \ uznawana jest przez [[Organizacja Narodów Zjednoczonych|ONZ]] za kraj bardzo\
      \ wysoko rozwinięty ze względu na [[wskaźnik rozwoju społecznego]] (HDI), który\
      \ bierze pod uwagę takie czynniki jak długość życia, średnią długość edukacji\
      \ odbytej przez 25-latków i oczekiwany czas edukacji dzieci w wieku szkolnym,\
      \ jak również PKB ''per capita'' po zmierzeniu [[Parytet siły nabywczej|parytetem\
      \ siły nabywczej]]<ref>{{Cytuj stronę |url = http://hdr.undp.org/en/statistics/hdi/\
      \ |tytuł = The Human Development Index (HDI) |opublikowany = Human Development\
      \ Reports |język = en |archiwum = https://web.archive.org/web/20101104042210/http://hdr.undp.org/en/statistics/hdi/\
      \ |zarchiwizowano = 2010-11-04 |data dostępu = 2010-11-04}}</ref>. Wskaźnik\
      \ HDI wynosił w 2012 r. 0,821, dając Polsce 39. miejsce na świecie na 187 uwzględnionych\
      \ państw<ref>{{Cytuj stronę |url = http://hdr.undp.org/en/media/HDR_2011_EN_Tables.pdf\
      \ |tytuł = Human development statistical annex |opublikowany = Human development\
      \ statistical annex |język = en |archiwum = https://web.archive.org/web/20190513065800/http://hdr.undp.org/en/media/HDR_2011_EN_Tables.pdf\
      \ |zarchiwizowano = 2019-05-13 |data dostępu = 2013-03-17}}</ref>. Według danych\
      \ [[Europejski Urząd Statystyczny|Eurostatu]] w 2013 roku polskie [[Dług publiczny|zadłużenie]]\
      \ wynosiło 57,0% PKB, przy średniej unijnej wynoszącej 87,1%<ref>{{Cytuj stronę\
      \ |url = http://epp.eurostat.ec.europa.eu/portal/page/portal/government_finance_statistics/data/main_tables\
      \ |tytuł = General government consolidated gross debt as a percentage of GDP\
      \ |autor = Eurostat |język = en |archiwum = https://web.archive.org/web/20110520040533/http://epp.eurostat.ec.europa.eu/portal/page/portal/government_finance_statistics/data/main_tables\
      \ |zarchiwizowano = 2011-05-20 |data dostępu = 2014-04-28}}</ref>.\n\nPolska\
      \ gospodarka jest [[Gospodarka mieszana|gospodarką mieszaną]]. Sektor państwowy\
      \ wytwarza obecnie około 25% PKB (Skarb Państwa kontroluje m.in. [[Polskie Koleje\
      \ Państwowe|PKP]], [[KGHM Polska Miedź|KGHM]], [[Orlen]], [[Polskie Górnictwo\
      \ Naftowe i Gazownictwo|PGNiG]] i [[Powszechny Zakład Ubezpieczeń|PZU]]) i jest\
      \ to poziom porównywalny do takich państw, jak [[Francja]] czy [[Norwegia]].\n\
      \nPo wejściu w 2004 do [[Unia Europejska|Unii Europejskiej]] dzięki m.in. uczestnictwu\
      \ w [[Unia celna Unii Europejskiej|unii celnej]] i [[Jednolity rynek|jednolitym\
      \ rynku]] oraz transferom z [[Budżet Unii Europejskiej|unijnego budżetu]] w\
      \ latach 2004–2016 PKB Polski rósł szybciej niż średnia w UE, a polska gospodarka\
      \ stała się bardziej otwarta i silniej powiązana z gospodarką europejską i światową\
      \ (m.in. nastąpił ponadtrzykrotny wzrost eksportu i wzrost ponaddwuipółkrotny\
      \ importu towarów i usług, a także dwukrotny wzrost napływu [[Bezpośrednie inwestycje\
      \ zagraniczne|bezpośrednich inwestycji zagranicznych]])<ref>{{Cytuj stronę |url\
      \ = http://orka.sejm.gov.pl/wydbas.nsf/0/06EED08BF358EEB4C12581B60038F894/%24File/4%20Adrian%20Grycuk%20Piotr%20Russel%20Cz%C5%82onkostwo%20w%20Unii%20Europejskiej%20a%20rozw%C3%B3j%20gospodarczy%20Polski%20Studia%20BAS%20nr%203%202017.pdf\
      \ |tytuł = Członkostwo w Unii Europejskiej a rozwój gospodarczy Polski |nazwisko\
      \ = Grycuk |imię = Adrian |nazwisko2 = Russel |imię2 = Piotr |data = 2017 |praca\
      \ = Studia BAS |opublikowany = Biuro Analiz Sejmowych |strony = 110 |archiwum\
      \ = https://web.archive.org/web/20181226211903/http://orka.sejm.gov.pl/wydbas.nsf/0/06EED08BF358EEB4C12581B60038F894/%24File/4%20Adrian%20Grycuk%20Piotr%20Russel%20Cz%C5%82onkostwo%20w%20Unii%20Europejskiej%20a%20rozw%C3%B3j%20gospodarczy%20Polski%20Studia%20BAS%20nr%203%202017.pdf\
      \ |zarchiwizowano = 2018-12-26 |data dostępu = 2017-10-15}}</ref>.\n\nGłównym\
      \ partnerem handlowym Polski są państwa Unii Europejskiej i Rosja: na Niemcy\
      \ przypada ok. 25% polskiego eksportu i 21% importu<ref name=\"handel\"/>.\n\
