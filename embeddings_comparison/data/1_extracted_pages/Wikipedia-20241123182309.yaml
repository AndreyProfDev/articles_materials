      \         = Polska\n}}\n'''Polska''', '''Rzeczpospolita Polska''' ('''RP''')\
      \ – [[państwo unitarne]]<ref>{{Cytuj |tytuł = Art. 3 Konstytucji Rzeczypospolitej\
      \ Polskiej |url = https://www.sejm.gov.pl/prawo/konst/polski/1.htm}}</ref> w\
      \ [[Europa Środkowa|Europie Środkowej]]<ref>{{Cytuj |autor = Lonnie Johnson\
      \ |tytuł = Central Europe. Enemies, neighbors, friends |data = 1996 |data dostępu\
      \ = 2021-09-14 |isbn = 978-0-19-510071-6 |wydawca = New York: Oxford University\
      \ Press |s = [https://archive.org/details/isbn_9780195100716/page/3 3] |url\
      \ = http://archive.org/details/isbn_9780195100716}}</ref>, położone między [[Morze\
      \ Bałtyckie|Morzem Bałtyckim]] na północy a [[Sudety|Sudetami]] i [[Karpaty|Karpatami]]\
      \ na południu, w przeważającej części w [[Dorzecze|dorzeczu]] [[Wisła|Wisły]]\
      \ i&nbsp;[[Odra|Odry]]. Od północy Polska graniczy z [[Rosja|Rosją]] (z jej\
      \ [[Obwód królewiecki|obwodem królewieckim]]) i [[Litwa|Litwą]], od wschodu\
      \ z [[Białoruś|Białorusią]] i [[Ukraina|Ukrainą]], od&nbsp;południa ze [[Słowacja|Słowacją]]\
      \ i [[Czechy|Czechami]], od zachodu z [[Niemcy|Niemcami]]<ref>{{Cytuj |tytuł\
      \ = Poland |data dostępu = 2021-09-15 |opublikowany = GeoHistory |url = https://geohistory.today/poland/\
      \ |język = en}}</ref>. Większość północnej granicy Polski wyznacza wybrzeże\
      \ Morza Bałtyckiego. [[Polska Wyłączna Strefa Ekonomiczna]] na Bałtyku graniczy\
      \ ze strefami [[Dania|Danii]] i [[Szwecja|Szwecji]]. Granice z Ukrainą, Białorusią\
      \ i Rosją stanowią równocześnie granicę zewnętrzną [[NATO]], [[Unia Europejska|Unii\
      \ Europejskiej]] i [[Strefa Schengen|strefy Schengen]].\n\nPowierzchnia administracyjna\
      \ Polski wynosi 312&nbsp;696&nbsp;km²<ref name=\"powierzchnia\" group=\"uwaga\"\
      \ /><ref name=\"CSO_2008\"/>, co daje jej 69. miejsce na świecie<ref group=\"\
      uwaga\">Poza 68 państwami od Polski większe są także dwa terytoria niebędące\
      \ niepodległymi państwami, [[Antarktyda]] i [[Grenlandia]].</ref><ref>{{cytuj\
      \ stronę |url = https://www.cia.gov/library/publications/resources/the-world-factbook/rankorder/2147rank.html#pl\
      \ |tytuł = Country comparison: Area |praca = The World Factbook |opublikowany\
      \ = [[Centralna Agencja Wywiadowcza|Central Intelligence Agency]] |język = en\
      \ |archiwum = https://web.archive.org/web/20181226211750/https://www.cia.gov/library/publications/resources/the-world-factbook/rankorder/2147rank.html#pl\
      \ |zarchiwizowano = 2018-12-26 |data dostępu = 2017-11-29}}</ref> i 9. w [[Europa|Europie]].\
      \ Zamieszkana przez 37 636 508 osób (31 XII 2023 r.)<ref name=\"GUS2023XII\"\
      \ />, zajmuje pod względem liczby ludności 38. miejsce na świecie (wg danych\
      \ za 2020 rok)<ref>{{Cytuj stronę |url = https://www.worldometers.info/world-population/population-by-country/\
      \ |tytuł = Population – Population by Country |opublikowany = Worldometers.info\
      \ |data dostępu = 2023-02-26}}</ref>, a 5. w Unii Europejskiej. Polska podzielona\
      \ jest na 16 [[Województwo|województw]]. Jej [[Miasto|miastem]] z największą\
      \ ludnością i jednocześnie [[Stolica|stolicą]] jest [[Warszawa]]. Inne [[Obszar\
      \ metropolitalny|metropolie]] to [[Kraków]], [[Wrocław]], [[Łódź]], [[Poznań]],\
      \ [[Gdańsk]], [[Szczecin]]. Największą polską [[Aglomeracja policentryczna|aglomeracją\
      \ policentryczną]] jest [[konurbacja górnośląska]]. Polska jest krajem jednolitym\
      \ etnicznie – 97% ludności deklaruje [[narodowość]] [[Polacy|polską]].\n\nPierwszą\
      \ historycznie potwierdzoną datą opisującą dzieje Polski jest rok 966, gdy książę\
      \ [[Mieszko I]], władca obszarów mieszczących się współcześnie w większości\
      \ w granicach Polski, [[Chrzest Polski|przyjął chrzest]]. W 1025 powstało [[Polska\
      \ wczesnopiastowska|Królestwo Polskie]], którego pierwszym królem był syn Mieszka\
      \ I, [[Bolesław I Chrobry]]. W 1385 Polska zawarła [[Unia polsko-litewska|porozumienie\
      \ z Wielkim Księstwem Litewskim]], podpisując [[Unia w Krewie|akt unii w Krewie]];\
      \ związek ten zacieśniła [[unia lubelska]] z 1569, w wyniku czego powstała [[Rzeczpospolita\
      \ Obojga Narodów]], jedno z największych i najludniejszych państw na mapie szesnasto-\
      \ i siedemnastowiecznej Europy<ref>Norman Davies, ''Europe: A History'', Pimlico\
      \ 1997, p. 554: ''Poland-Lithuania was another country which experienced its\
      \ ‘Golden Age’ during the sixteenth and early seventeenth centuries. The realm\
      \ of the last Jagiellons was absolutely the largest state in Europe''.</ref><ref\
      \ name=\"Wandycz2001-66\">{{Cytuj książkę |autor = [[Piotr Wandycz]] |tytuł\
      \ = The price of freedom: a history of East Central Europe from the Middle Ages\
      \ to the present |url = https://books.google.com/books?id=m5plR3x6jLAC&pg=PA66\
      \ |wydawca = Psychology Press |rok = 2001 |strony = 66 |isbn = 978-0-415-25491-5\
      \ |język = en}}</ref>, które w latach 1618–1621, po [[Rozejm w Dywilinie|rozejmie\
      \ w Dywilinie]], miało powierzchnię około 1 mln&nbsp;km². Jej ustrój wewnętrzny\
      \ określany jest jako [[demokracja szlachecka]], zaś monarchę wybierano w systemie\
      \ tak zwanej [[Wolna elekcja|wolnej elekcji]]. Rzeczpospolita przestała istnieć\
      \ w wyniku [[III rozbiór Polski|III rozbioru]], w 1795, kiedy to jej terytorium\
      \ podzielone zostało między [[Królestwo Prus|Prusy]], [[Imperium Rosyjskie|Rosję]]\
      \ i [[Monarchia Habsburgów|Austrię]].\n\nPo 123 latach, pod koniec [[I wojna\
      \ światowa|I wojny światowej]], w 1918, Polska [[Historia Polski (1918–1939)|odzyskała\
      \ niepodległość]] (odrodzona wówczas państwowość nazywana jest [[II Rzeczpospolita|II\
      \ Rzecząpospolitą]]). 1 września 1939 [[Kampania wrześniowa|atakiem Niemiec\
      \ na Polskę]] rozpoczęła się [[II wojna światowa]], zaś 17 września 1939 nastąpiła\
      \ [[Agresja ZSRR na Polskę|agresja ZSRR]]; wobec tego w październiku 1939 całe\
      \ terytorium kraju znalazło się pod [[Okupacja niemiecka ziem polskich (1939–1945)|okupacją\
      \ niemiecką]] i [[Okupacja sowiecka ziem polskich (1939–1941)|sowiecką]]. W\
      \ wyniku II wojny światowej życie straciło ponad sześć milionów obywateli Polski<ref\
      \ name=\"posterum0\">Project in Posterum, [https://web.archive.org/web/20070418175341/http://projectinposterum.org/docs/poland_WWII_casualties.htm\
      \ Poland World War II casualties.] Retrieved 20 September 2013.</ref><ref name=\"\
      szma\">[[Tomasz Szarota]] & Wojciech Materski, ''Polska 1939–1945. Straty osobowe\
      \ i ofiary represji pod dwiema okupacjami'', Warsaw, IPN 2009, {{ISBN|978-83-7629-067-6}}\
      \ ([https://web.archive.org/web/20181014004156/http://niniwa22.cba.pl/polska_1939_1945.htm\
      \ Introduction online.]).</ref>. [[Konferencja jałtańska]] w lutym 1945 umieściła\
      \ Polskę w strefie wpływów [[Związek Socjalistycznych Republik Radzieckich|ZSRR]].\
      \ W lipcu 1945 postanowieniami [[Konferencja poczdamska|konferencji poczdamskiej]]\
      \ granice Polski przesunięto na zachód (między [[Granica na Odrze i Nysie Łużyckiej|linię\
      \ Odry i Nysy Łużyckiej]], a [[Linia Curzona|linię Curzona]]), przyłączając\
      \ [[Ziemie Odzyskane]] w miejsce [[Kresy Wschodnie|Kresów Wschodnich]]. [[Polska\
      \ Rzeczpospolita Ludowa]] (nazwa państwa przyjęta w 1952) była [[Państwo satelickie|państwem\
      \ satelickim]] ZSRR w formule tzw. [[Demokracja ludowa|demokracji ludowej]].\
      \ Rządy w [[System jednopartyjny|systemie monopartyjnym]] sprawowała komunistyczna\
      \ [[Polska Partia Robotnicza]], a następnie [[Polska Zjednoczona Partia Robotnicza]]\
      \ (przy formalnym istnieniu ugrupowań satelickich). W okresie [[Zimna wojna|zimnej\
      \ wojny]] PRL należała do [[Układ Warszawski|Układu Warszawskiego]], stanowiła\
      \ zatem część tzw. [[Blok wschodni|bloku wschodniego]].\n\nPo przemianach politycznych\
      \ zapoczątkowanych w konsekwencji [[Okrągły Stół (Polska)|Okrągłego Stołu]]\
      \ i [[Wybory parlamentarne w Polsce w 1989 roku|częściowo demokratycznych wyborów\
      \ parlamentarnych w czerwcu 1989]] został powołany [[Rząd Tadeusza Mazowieckiego|pierwszy\
      \ rząd z premierem spoza partii komunistycznej]]. Polska zmodyfikowała konstytucję,\
      \ zmieniając 31 grudnia 1989 nazwę państwa na ''Rzeczpospolita Polska'' i stając\
      \ się krajem [[Demokracja|demokratycznym]].\n\nMimo olbrzymich strat w ludziach\
      \ oraz znacznego [[Straty materialne Polski w czasie II wojny światowej|zniszczenia\
      \ kraju w wyniku II wojny światowej]] w Polsce udało się zachować wiele [[Kultura\
      \ polska|bogactwa kulturowego]]. Znajduje się tu 17 miejsc wpisanych na [[Lista\
      \ światowego dziedzictwa UNESCO|listę światowego dziedzictwa UNESCO]] (15 obiektów\
      \ dziedzictwa kulturowego i 2 o charakterze przyrodniczym)<ref>{{Cytuj |autor\
      \ = UNESCO World Heritage Centre |tytuł = Poland – UNESCO World Heritage Convention\
      \ |data dostępu = 2023-07-17 |opublikowany = UNESCO World Heritage Centre |url\
      \ = https://whc.unesco.org/en/statesparties/pl |język = en}}</ref>, 123 [[Pomnik\
      \ historii|pomniki historii]]<ref>{{Cytuj |tytuł = Lista Pomników Historii |praca\
      \ = Prezydent.pl |url = https://www.prezydent.pl/aktualnosci/polityka-historyczna/pomniki-historii/obiekty-wpisane-na-liste-pomnikow-historii}}</ref><ref>{{Cytuj\
      \ |tytuł = Mamy już 123 Pomniki Historii |data = 2023-02-03 |data dostępu =\
      \ 2023-07-17 |opublikowany = NID |url = https://nid.pl/2023/02/03/mamy-juz-123-pomniki-historii/\
      \ |język = pl}}</ref> oraz duża liczba [[Ochrona zabytków w Polsce|zarejestrowanych\
      \ zabytków]].\n\nOd początku [[Transformacja systemowa w Polsce|transformacji\
      \ ustrojowej]] w [[Gospodarka rynkowa|gospodarkę rynkową]], Polska utrzymuje\
      \ bardzo wysoki [[wskaźnik rozwoju społecznego]] (HDI). W kraju stopniowo zwiększa\
      \ się wolność ekonomiczna<ref>{{Cytuj stronę |url = http://www.heritage.org/research/reports/2015/01/asia-pacific\
      \ |tytuł = Hong Kong Declines, but Remains the World’s Freest Economy, 2015\
      \ Index of Economic Freedom Shows |data = 27 stycznia 2015 |język = en |archiwum\
      \ = https://web.archive.org/web/20150924051510/http://www.heritage.org/research/reports/2015/01/asia-pacific\
      \ |zarchiwizowano = 2015-09-24 |data dostępu = 2016-11-10}}</ref>. Polska jest\
      \ demokratycznym państwem z rozwiniętą, wysokodochodową gospodarką i wysokim\
      \ [[Wskaźnik jakości życia|wskaźnikiem jakości życia]]<ref>{{Cytuj stronę |url\
      \ = http://www.numbeo.com/quality-of-life/rankings_by_country.jsp |tytuł = Numbeo\
      \ Quality of Life Index 2015 Mid Year. |archiwum = https://web.archive.org/web/20140915101303/http://www.numbeo.com/quality-of-life/rankings_by_country.jsp\
      \ |zarchiwizowano = 2014-09-15 |data dostępu = 2016-11-10}}</ref>; większość\
      \ Polaków (57%) pracuje w sektorze usług. Ponadto rocznie Polskę odwiedza około\
      \ 17,5 mln turystów (2016), dzięki czemu jest jednym z najczęściej odwiedzanych\
      \ krajów świata<ref>{{Cytuj stronę |url = http://biznes.onet.pl/wiadomosci/turystyka/turysci-zagraniczni-w-polsce-dane-za-2016-r/m23e0l\
      \ |tytuł = Cudzoziemcy w Polsce |data = 2017 |archiwum = https://web.archive.org/web/20170903030209/http://biznes.onet.pl/wiadomosci/turystyka/turysci-zagraniczni-w-polsce-dane-za-2016-r/m23e0l\
      \ |zarchiwizowano = 2017-09-03 |data dostępu = 2017-09-02}}</ref>. Polska jest\
      \ siódmą co do wielkości [[Gospodarka Unii Europejskiej|gospodarką w Unii Europejskiej]]<ref>{{Cytuj\
      \ stronę |url = https://appsso.eurostat.ec.europa.eu/nui/submitViewTableAction.do\
      \ |tytuł = GDP and main components (output, expenditure and income) |opublikowany\
      \ = Eurostat |język = en |archiwum = https://web.archive.org/web/20200412190426/https://appsso.eurostat.ec.europa.eu/nui/submitViewTableAction.do\
      \ |zarchiwizowano = 2020-04-12 |data dostępu = 2019-09-02}}</ref> i jedną z\
      \ najszybciej rozwijających się gospodarek europejskich<ref>{{Cytuj stronę |url\
      \ = https://www.weforum.org/agenda/2016/02/europe-s-10-fastest-growing-economies/\
      \ |tytuł = Europe’s 10 fastest growing economies |nazwisko = Myers |imię = Joe\
      \ |data = 18 lutego 2016 |opublikowany = World Economic Forum |język = en |archiwum\
      \ = https://web.archive.org/web/20161126074238/https://www.weforum.org/agenda/2016/02/europe-s-10-fastest-growing-economies/\
      \ |zarchiwizowano = 2016-11-26 |data dostępu = 2016-09-13}}</ref>. W badaniu\
      \ [[Wskaźnik demokracji|wskaźnika demokracji]], przeprowadzanym przez zespół\
      \ związany z tygodnikiem ''[[The Economist]]'', Polska zajęła w 2023 roku 41.\
      \ miejsce (na 167 przebadanych państw i terytoriów), co oznacza wzrost od poprzedniego\
      \ roku o pięć miejsc, a demokracja kraju jest określana jako wadliwa<ref>{{Cytuj\
      \ |tytuł = The Economist Intelligence Unit |data dostępu = 2022-02-11 |opublikowany\
      \ = Economist Intelligence Unit |url = https://www.eiu.com/n/ |język = en}}</ref><ref>{{Cytuj\
      \ stronę | url = https://www.protothema.gr/files/2024-02-15/Democracy-Index-2023-Final-report.pdf\
      \ | tytuł = Democracy Index 2023 | język = en | data dostępu = 2024-05-04}}</ref>.\
      \ Według wskaźnika [[Global Peace Index]] z 2017 roku Polska zajmuje 33. miejsce\
      \ na świecie (22. w Europie) pod względem poziomu bezpieczeństwa, natomiast\
      \ wg raportu firmy Underwriters Laboratories z 2018 roku, Polska pod względem\
      \ bezpieczeństwa zajmuje miejsce 35. (27. w Europie)<ref name=\"SzefsBielawska\"\
      >{{Cytuj książkę |tytuł = Global Peace Index 2017 |url = http://visionofhumanity.org/app/uploads/2017/06/GPI17-Report.pdf\
      \ |rok = 2017 |wydawca = Institute for Economics and Peace |język = en |isbn\
      \ = 978-0-648-06441-1 |strony = 10, 15 |miejsce = Sydney}}</ref><ref>{{Cytuj\
      \ stronę |url = https://ulsafetyindex.org/country/Poland |tytuł = Poland |opublikowany\
      \ = UL Safety Index |język = en |archiwum = https://web.archive.org/web/20180912165725/https://ulsafetyindex.org/country/Poland\
      \ |zarchiwizowano = 2018-09-12 |data dostępu = 2018-09-12}}</ref>. [[Wskaźnik\
      \ wolności prasy]] klasyfikuje Polskę na 47. pozycji w świecie w 2024 roku (wolność\
      \ prasy gwarantuje art. 14 [[Konstytucja Rzeczypospolitej Polskiej|Konstytucji]])<ref>{{Cytuj\
      \ stronę |url = https://rsf.org/en/poland |tytuł = Poland |opublikowany = Reporters\
      \ Without Borders |język = en |data dostępu = 2021-09-23}}</ref>.\n\nPolska\
      \ należy m.in. do [[Unia Europejska|UE]], [[Organizacja Narodów Zjednoczonych|ONZ]],\
      \ [[NATO]], [[Organizacja Bezpieczeństwa i Współpracy w Europie|OBWE]], [[Światowa\
      \ Organizacja Handlu|WTO]], [[Organizacja Współpracy Gospodarczej i Rozwoju|OECD]]\
      \ i [[Rada Europy|Rady Europy]], zaś Warszawa stanowi siedzibę [[Frontex]]u.\n\
      \n== Etymologia ==\n{{Osobny artykuł|Etymologia nazwy Polska}}\n[[Plik:Gesta\
      \ Hamburgensis trans oddara st polanos.jpg|mały|lewo|Fragment [[Gesta Hammaburgensis\
      \ ecclesiae pontificum|traktatu]] z XI wieku wymieniającego [[Polanie|Polan]]\
      \ żyjących wzdłuż [[Odra|Odry]]: ''trans Oddaram sunt Polanos'']]\n\n[[Etymologia|Źródłosłów]]\
      \ wyrazu „Polska” nie został udokumentowany w świadectwach historycznych. Najprawdopodobniej\
      \ jest nim nazwa [[Słowianie zachodni|zachodniosłowiańskiego]] plemienia [[Polanie|Polan]]<ref\
      \ group=\"uwaga\">Lub nazwy pole oznaczającej otwartą przestrzeń znajdującej\
      \ się na danym terytorium. W ''[[Żywot pierwszy św. Wojciecha|Żywocie pierwszym\
      \ św. Wojciecha]]'' (ok. 1000) występuje łacińska forma ''Polani'', w ''Kronice''\
      \ [[Thietmar z Merseburga|Thietmara z Merseburga]] (1002) – Poleni.</ref>. Nazwa\
      \ Polan z kolei pochodzi od indoeuropejskiego wyrazu ''pole'', oznaczającego\
      \ ''[[Pole (rolnictwo)|pole uprawne]]'' lub [[Pole powierzchni|otwartą przestrzeń]].\
      \ Nazwy ''Polska'' zaczęto używać w odniesieniu do całego [[Państwo|państwa]]\
      \ w XI wieku i funkcjonowała pierwotnie jako forma określenia „ziemia polska”\
      \ (łac. ''terra Poloniæ''). Zarówno własne nazwy Polski i Polaków ([[endonim]]y),\
      \ jak i większość nazw nadawanych im w innych językach ([[egzonim]]y) wywodzą\
      \ się z tego źródła.\n\nGramatycznie nazwa ''Polska'' składa się z dwóch części:\
      \ [[Rdzeń (językoznawstwo)|rdzenia]] ''pol'' (od „pole”), oznaczającego otwartą\
      \ przestrzeń lub pole uprawne, oraz przyrostkowego formantu przymiotnikowego\
      \ ''-ska''. Nazwa ''Polska'' to gramatycznie przymiotnik utworzony od rzeczownika\
      \ ''pole'' za pomocą przyrostka ''[[-sk]]'', który jest [[Formant (morfologia)|formantem]]\
      \ przymiotnikowym, kontynuantem z [[Język prasłowiański|języka prasłowiańskiego]]\
      \ ''*-ьskъ-jь'', określającym przynależność do czegoś<ref>Stanisław Rospond,\
      \ ''Gramatyka historyczna języka polskiego z ćwiczeniami'', Wydawnictwo Naukowe\
      \ PWN, Warszawa 2009, s. 114, {{ISBN|978-83-01-13992-6}}.</ref><ref>{{Cytuj\
      \ |autor = [[Zenon Klemensiewicz]];; Tadeusz Lehr-Spławiński; Stanisław Urbańczyk\
      \ |tytuł = Gramatyka historyczna języka polskiego |data = 1981 |isbn = 83-01-00995-0\
      \ |miejsce = Warszawa |wydawca = Państwowe Wydawnictwo Naukowe |s = 145 |oclc\
      \ = 830212208}}</ref>. Formant ten jest charakterystycznym elementem słowiańskich\
      \ oraz polskich nazw przestrzennych i miejscowych, przy zastosowaniu którego\
      \ tworzy się nazwy geograficzne<ref>{{Cytuj |autor = [[Zenon Klemensiewicz]];;\
      \ Tadeusz Lehr-Spławiński; Stanisław Urbańczyk |tytuł = Gramatyka historyczna\
      \ języka polskiego |data = 1981 |isbn = 83-01-00995-0 |miejsce = Warszawa |wydawca\
      \ = Państwowe Wydawnictwo Naukowe |s = 227 |oclc = 830212208}}</ref>. Końcówka\
      \ ta występuje także w rodzimych nazwach innych krajów słowiańskich, na przykład\
      \ w czeskiej i słowackiej nazwie Czech i Słowacji, czyli ''Česko'' i ''Slovensko'',\
      \ oraz w nazwie [[Chorwacja|Chorwacji]] – ''Hrvatska''.\n\n== Historia ==\n\
      [[Plik:Christianization A.D. 965 by Jan Matejko (1889).png|mały|''[[Zaprowadzenie\
      \ chrześcijaństwa]]'' (obraz [[Jan Matejko|Jana Matejki]])]]\n{{Osobny artykuł|Historia\
      \ Polski|Kalendarium historii Polski}}\n\nWydarzeniem, które stanowiło pierwszy\
      \ krok na drodze ku powstaniu państwa polskiego, było objęcie władzy nad plemieniem\
      \ [[Polanie|Polan]] przez ród [[Piastowie|Piastów]]. Nastąpiło to w nieznanych\
      \ okolicznościach i czasie, najprawdopodobniej jednak w drugiej połowie IX wieku.\
      \ Główny ośrodek państwa Polan stanowiło [[Gniezno]]. Pierwszym historycznym\
      \ władcą piastowskim był natomiast książę [[Mieszko I]], chociaż późniejszy\
      \ (XII w.) kronikarz [[Gall Anonim]] podaje także imiona jego przodków.\n\n\
      Mieszko I objął rządy w państwie Polan przed 963 i panował do 992. W 965 zawarł\
      \ on sojusz z księciem [[Chrześcijaństwo|chrześcijańskich]] już wówczas [[Księstwo\
      \ Czech|Czech]], [[Bolesław I Srogi|Bolesławem I Srogim]], i poślubił jego córkę\
      \ [[Dobrawa Przemyślidka|Dobrawę]]. Najważniejszym efektem tego aliansu było\
      \ przyjęcie przez Mieszka w 966 [[Chrzest Polski|chrztu]] (za pośrednictwem\
      \ Czech) i narzucenie [[Chrześcijaństwo|religii chrześcijańskiej]] jego państwu\
      \ (nazywanemu Polską), co umieściło je w kręgu [[Cywilizacja zachodnia|cywilizacji\
      \ zachodniej]]. Doraźnymi konsekwencjami decyzji Mieszka było przybycie do Polski\
      \ duchowieństwa, wraz z którym upowszechniła się nowa koncepcja władzy książęcej\
      \ (później królewskiej), doświadczenie administracyjne oraz słowo pisane. Syn\
      \ Mieszka I, [[Bolesław I Chrobry|Bolesław]], jako władca Polski uzyskał w 1025\
      \ roku tytuł królewski. Od końca XIII wieku na tron polski często wybierano\
      \ władców krajów sąsiednich. W 1569, po wygaśnięciu trwającej od 1386 unii dynastycznej\
      \ z [[Wielkie Księstwo Litewskie|Litwą]], oba kraje zdecydowały się na [[Unia\
      \ lubelska|unię realną]]. Nowe państwo nosiło nazwę [[Rzeczpospolita Obojga\
      \ Narodów]].\n\nW latach 1772–1795 ziemie Rzeczypospolitej zostały [[Rozbiory\
      \ Polski|rozdzielone przez sprzymierzonych zaborców]]: [[Królestwo Prus|Prusy]],\
      \ [[Imperium Rosyjskie|Rosję]] i [[Monarchia Habsburgów|Austrię]]. W 1918 Polska\
      \ odzyskała niepodległość jako [[II Rzeczpospolita]], w 1939 została [[Kampania\
      \ wrześniowa|zaatakowana]] przez [[III Rzesza|III Rzeszę]] i [[Związek Socjalistycznych\
      \ Republik Radzieckich|ZSRR]] i [[Pakt Ribbentrop-Mołotow|podzielona]] między\
      \ III Rzeszę, ZSRR, [[Republika Litewska (1918–1940)|Litwę kowieńską]]<ref name=\"\
      autonazwa2\">{{Cytuj książkę |autor = Stanisław Mackiewicz |tytuł = Historia\
      \ Polski od 17 września 1939 do 5 lipca 1945 r |wydawca = Puls Publications\
      \ |miejsce = London |rok = 1993 |strony = 60 |isbn = 1-85917-007-2}}</ref><ref\
      \ name=\"autonazwa3\">{{Cytuj książkę |autor = Jerzy Ochmański |tytuł = Historia\
      \ Litwy |wydawca = Zakład Narodowy im. Ossolińskich |miejsce = Wrocław |rok\
      \ = 1990 |strony = 324–325 |isbn = 83-04-03107-8}}</ref> i [[Atak słowacki na\
      \ Polskę|Słowację]], co było początkiem [[II wojna światowa|II wojny światowej]].\
      \ W następstwie wojny życie utraciło ponad 6 milionów obywateli Polski, a państwo\
      \ stało się [[Polska Rzeczpospolita Ludowa|republiką socjalistyczną]], [[Blok\
      \ wschodni|uzależnioną]] od ZSRR.\n\nW efekcie [[Jesień Ludów|przemian w 1989\
      \ roku]] obalono władzę komunistyczną i niedługo potem Polska przyjęła [[Demokracja\
      \ parlamentarna|ustrój demokratyczny]], określany jako [[III Rzeczpospolita]].\
      \ [[Plan Balcerowicza|Zreformowano gospodarkę]] i powrócono do [[Gospodarka\
      \ rynkowa|modelu rynkowego]]. 12 marca 1999 roku Polska przystąpiła do [[NATO|Paktu\
      \ Północnoatlantyckiego]], a 1 maja 2004 roku została członkiem [[Unia Europejska|Unii\
      \ Europejskiej]].\n\n=== Prehistoria ziem polskich ===\n{{Osobny artykuł|Prehistoria\
      \ ziem polskich}}\n[[Plik:Zachodni34567Słowianie.png|mały|upright=1.1|[[Słowianie\
      \ zachodni]] w IX-X wieku]]\n\nPierwsi ludzie z [[Epoka kamienia|epoki kamienia]]\
      \ i typ [[homo erectus]] osiedlili się na terenach, które miały stać się Polską,\
      \ około 800 000 lat temu, chociaż panujący wtedy [[klimat]] uniemożliwił wczesnym\
      \ ludziom zakładanie trwalszych obozowisk<ref>{{Cytuj książkę |nazwisko = Kasza\
      \ |imię = Ryszard |tytuł = Ulicami Prudnika z historią i fotografią w tle |inni\
      \ = Przemysław Birna, Franciszek Dendewicz, Piotr Kulczyk |rok = 2020 |wydawca\
      \ = Powiat Prudnicki |miejsce = Prudnik |isbn = 978-83-954314-5-6 |strony =\
      \ 7}}</ref>. Przybycie [[Człowiek rozumny|homo sapiens]] zbiegło się ze zmianą\
      \ klimatyczną pod koniec [[Zlodowacenie północnopolskie|ostatniego zlodowacenia]]\
      \ (10 000 lat p.n.e.), wówczas tereny ziem polskich nadawały się do zamieszkania<ref>{{Cytuj\
      \ książkę |nazwisko = Jurek |imię = Krzysztof |autor link = |tytuł = Poznać\
      \ przeszłość 1. Karty pracy ucznia. Poziom podstawowy |wydawca = Nowa Era |miejsce\
      \ = Warszawa |rok = 2019 |strony = 93 |isbn = 978-83-267-3653-7}}</ref>. Okres\
      \ obejmujący [[Epoka brązu|epokę brązu]] i wczesną [[Epoka żelaza|epokę żelaza]]\
      \ (1300–500 p.n.e.) na ziemiach polskich charakteryzował się wzrostem gęstości\
      \ zaludnienia, powstawaniem osad palisadowych ([[Gród|grodów]]) i ekspansją\
      \ [[Kultura łużycka|kultury łużyckiej]]<ref>{{Cytuj |autor = Andrzej Żaki |url\
      \ = https://bazhum.muzhp.pl/media//files/Annales_Universitatis_Mariae_Curie_Sklodowska_Lublin_Polonia_Sectio_F/Annales_Universitatis_Mariae_Curie_Sklodowska_Lublin_Polonia_Sectio_F-r1948-t3-n1/Annales_Universitatis_Mariae_Curie_Sklodowska_Lublin_Polonia_Sectio_F-r1948-t3-n1-s1-214/Annales_Universitatis_Mariae_Curie_Sklodowska_Lublin_Polonia_Sectio_F-r1948-t3-n1-s1-214.pdf\
      \ |tytuł = Początki rozwoju kultury łużyckiej w dorzeczu górnej Wisły |czasopismo\
      \ = Annales Universitatis Mariae Curie-Skłodowska Lublin-Polonia. Sectio F |wolumin\
      \ = 3 |numer = 1 |data = 1948}}</ref>.\n\nW okresie [[Starożytność|starożytności]]\
      \ tereny współczesnej Polski zamieszkiwało wiele różnych społeczeństw [[Plemię|plemiennych]].\
      \ Przynależności [[Etniczność|etniczne]] i lingwistyczne tych grup pozostają\
      \ niepewne. Pierwsi [[Słowianie]] ze wschodu dotarli na tereny współczesnych\
      \ ziem polskich w drugiej połowie V wieku naszej ery<ref>{{Cytuj książkę |nazwisko\
      \ = Chwalba |imię = Andrzej |autor link = Andrzej Chwalba |tytuł = Kalendarium\
      \ dziejów Polski |wydawca = Wydawnictwo Literackie |miejsce = Kraków |rok =\
      \ 1999 |strony = 20–21 |isbn = 83-08-02855-1}}</ref>. W X wieku [[Polanie]]\
      \ zdominowali inne plemiona [[Języki lechickie|lechickie]] w regionie, tworząc\
      \ początkowo [[państwo plemienne]], a później scentralizowaną monarchię.\n\n\
      {{Zobacz też|Słowianie|Słowianie zachodni}}\n\n=== Monarchia wczesnopiastowska\
      \ i Królestwo Polskie ===\n==== Dynastia Piastów ====\n[[Plik:Polska 960 - 992.svg|mały|upright=1.1|Polska\
      \ za panowania Mieszka I (ok. 960–992)]]\n[[Plik:Mieszko I (274939) (cropped).jpg|mały|upright|[[Mieszko\
      \ I]], władca [[Polanie|Polan]] z dynastii [[Piastowie|Piastów]], uważany zarazem\
      \ za faktycznego twórcę państwowości polskiej]]\n[[Plik:Casimir the Great by\
      \ Leopold Löffler.PNG|mały|upright|[[Kazimierz III Wielki]], [[król Polski]]\
      \ w latach 1333–1370, ostatni monarcha z dynastii [[Piastowie|Piastów]]. W historiografii\
      \ jest uważany za jednego z najwybitniejszych władców Polski.]]\n{{Osobny artykuł|Polska\
      \ wczesnopiastowska|Historia Polski (do 1138)|Polska w okresie rozbicia dzielnicowego|Zjednoczone\
      \ Królestwo Polskie}}\n\nPolska uformowała się w jednolicie zarządzane terytorium\
      \ w połowie X wieku. Pierwszym potwierdzonym historycznie [[Władcy Polski|władcą\
      \ Polski]] był [[Mieszko I]] z dynastii [[Piastowie|Piastów]], który [[Chrzest\
      \ Polski|w 966 roku przyjął chrzest]] poprzez [[Kościół katolicki|Kościół rzymski]],\
      \ co zapoczątkowało koniec słowiańskich [[Religia Słowian|wierzeń pogańskich]]\
      \ i [[Chrześcijaństwo|chrystianizację]] społeczeństwa. Przyjęcie [[Chrzest|chrztu]]\
      \ miało w owym czasie także duże znaczenie polityczne. [[Incipit]] zatytułowany\
      \ [[Dagome iudex]] jako pierwszy określił granice geograficzne Polski, oraz\
      \ potwierdził, że jej monarchia znajduje się pod opieką [[Stolica Apostolska|Stolicy\
      \ Apostolskiej]]. Pierwszym władcą, który został koronowany na [[Król Polski|króla\
      \ Polski]] w 1025 był syn Mieszka I – [[Bolesław I Chrobry]]. Kontynuując politykę\
      \ ojca, Bolesław I rozszerzył granice państwa Polskiego, zajmując części niemieckich\
      \ [[Łużyce|Łużyc]], czeskich [[Morawy|Moraw]], górnych Węgier (dziś [[Słowacja]])\
      \ i południowo-zachodnich regionów [[Ruś Kijowska|Rusi]]. Także w 1000 roku\
      \ zorganizował on [[Zjazd gnieźnieński|zjazd w Gnieźnie]], na którym utworzono\
      \ [[Metropolia gnieźnieńska|metropolię gnieźnieńską]] oraz [[Diecezja|diecezje]]\
      \ w [[Kołobrzeg]]u, Krakowie i Wrocławiu<ref>{{Cytuj książkę |nazwisko = Kumor\
      \ |imię = Bolesław |nazwisko2 = Obertyński |imię2 = Zdzisław |autor link = |tytuł\
      \ = Historia Kościoła w Polsce |wydawca = Nowa Era |miejsce = Poznań |rok =\
      \ 974 |strony = 12 |oclc = 174416485}}</ref>.\n\nZe względu na złą sytuację\
      \ wewnętrzną w kraju, w 1031 [[Mieszko II Lambert]] utracił tytuł króla, a następnie\
      \ w 1034 wybuchł bunt przeciw władzy kościelnej, tzw. [[Reakcja pogańska w Polsce|reakcja\
      \ pogańska]], natomiast w 1038 w Polsce wybuchło [[Powstanie ludowe w Polsce|powstanie\
      \ ludowe]] przeciwko zwierzchnictwu [[Możnowładztwo|możnowładców]]. Seria tych\
      \ buntów doprowadziła do przeniesienia przez [[Kazimierz I Odnowiciel|Kazimierza\
      \ I Odnowiciela]] stolicy z Gniezna do Krakowa, co miało miejsce w roku 1038.\
      \ [[Bolesław II Szczodry]] ponownie ustanowił urząd króla w 1076, ale został\
      \ wygnany za zamordowanie swojego przeciwnika, biskupa [[Stanisław ze Szczepanowa|Stanisława]].\
      \ W 1138 roku, Polska została podzielona między potomkami [[Bolesław III Krzywousty|Bolesława\
      \ III Krzywoustego]], co zapoczątkowało trwające prawie 200 lat [[Polska w okresie\
      \ rozbicia dzielnicowego|rozbicie dzielnicowe]]. W XIII wieku Henrykowie Śląscy\
      \ ([[Henryk I Brodaty]] i [[Henryk II Pobożny]]) zjednoczyli dwie dzielnice\
      \ – Śląsk i [[ziemia krakowska|ziemię krakowską]], lecz po najazdach [[Mongołowie|Mongołów]],\
      \ zakończonych klęskami w [[Bitwa pod Chmielnikiem|bitwie pod Chmielnikiem]]\
      \ oraz w [[Bitwa pod Legnicą|bitwie pod Legnicą]] w 1241 roku, ich państwo ponownie\
      \ się rozpadło.\n\nZjednoczenia kraju (Wielkopolski i Małopolski) dokonał [[Władysław\
      \ I Łokietek|Władysław Łokietek]], który w 1320 koronował się na [[król]]a Polski.\
      \ Jego syn, [[Kazimierz III Wielki]], skutecznie umocnił i rozszerzył pozycję\
      \ Polski w regionie – poszerzył terytorium Polski, zawarł kompromisowe sojusze\
      \ i przeprowadził liczne reformy wewnętrzne, w szczególności w budownictwie,\
      \ administracji i gospodarce. Po jego bezpotomnej śmierci, 5 listopada 1370,\
      \ zakończyło się panowanie dynastii Piastów jako władców Polski.\n\n==== Dynastia\
      \ Jagiellonów ====\n{{Osobny artykuł|Historia Polski (1386–1492)|Historia Polski\
      \ (1492–1572)}}\n[[Plik:Jadwiga by Bacciarelli.jpg|mały|upright=0.5|lewo|Królowa\
      \ [[Jadwiga Andegaweńska|Jadwiga]] (obraz [[Marcello Bacciarelli|Marcella Bacciarelliniego]])]]\n\
      \nTron polski przejął [[Ludwik Węgierski]] z rodu [[Andegawenowie|Andegawenów]],\
      \ 17 listopada 1370. Okres jego przejściowych rządów to zarazem początek supremacji\
      \ szlachty w życiu politycznym kraju, obdarzonej w 1374 w [[Koszyce|Koszycach]]\
      \ pierwszym [[Przywilej koszycki|przywilejem generalnym]]. Kiedy również Ludwik\
      \ zmarł w 1382, w Polsce nastąpił okres najdłuższego w jej historii [[Bezkrólewie|bezkrólewia]],\
      \ zakończony objęciem królestwa 16 października 1384 przez córkę Ludwika, [[Jadwiga\
      \ Andegaweńska|Jadwigę Andegaweńską]]. W 1386 weszła ona w związek małżeński\
      \ z księciem [[Wielkie Księstwo Litewskie|litewskim]] [[Władysław II Jagiełło|Jagiełłą]],\
      \ który 4 marca 1386 został koronowany na władcę Polski, co zapoczątkowało w\
      \ Polsce panowanie [[Jagiellonowie|dynastii Jagiellonów]].\n\nPod panowaniem\
      \ Jagiellonów Polska zawarła w 1385 [[Unia polsko-litewska|unię z Wielkim Księstwem\
      \ Litewskim]], wzmocnioną w roku [[1569]] przez [[Unia lubelska|unię lubelską]].\
      \ W 1410 w [[Bitwa pod Grunwaldem|bitwie pod Grunwaldem]] zjednoczona armia\
      \ polsko-litewska odniosła zdecydowane zwycięstwo nad zagrażającym obu [[państwo]]m\
      \ [[Zakon krzyżacki|zakonem krzyżackim]]. Po [[Wojna trzynastoletnia|wojnie\
      \ trzynastoletniej]] zakon został z[[wasal]]izowany przez Polskę. W wyniku [[Drugi\
      \ pokój toruński|II pokoju toruńskiego]] zawartego w 1466 roku do Polski wróciły\
      \ [[Pomorze Gdańskie]] z [[Gdańsk]]iem, [[Powiśle (region)|Powiśle]] z [[Żuławy|Żuławami\
      \ Wiślanymi]], [[Warmia]], [[ziemia chełmińska]] i [[ziemia michałowska]].\n\
      \n[[Plik:Wawel (crop).jpg|mały|[[Zamek Królewski na Wawelu]] w [[Kraków|Krakowie]]\
      \ był siedzibą królów polskich od 1038 aż do przeniesienia stolicy do [[Warszawa|Warszawy]]\
      \ w 1596.]]\n\nNastępował rozwój polskiej kultury, nauki i ekonomii; pojawiły\
      \ się takie osobowości, jak [[Mikołaj Kopernik]], [[Jan Kochanowski]] czy [[Andrzej\
      \ Frycz Modrzewski]]. W dobie Odrodzenia polska nauka przyniosła [[przewrót\
      \ kopernikański]] (1543)<ref>{{cytuj książkę |autor = Maciej Iłowiecki |tytuł\
      \ = Dzieje nauki polskiej |wydawca = Wydawnictwo „Interpress” |miejsce = Warszawa\
      \ |rok = 1981 |strony = 43 |isbn = 83-223-1876-6}}</ref>, zmieniający [[paradygmat]]\
      \ nauki, nowe koncepcje człowieka i świata. Panowała tolerancja religijna. Na\
      \ początku XVI wieku sformowano pierwsze oddziały [[Husaria|husarii]] – zwycięskiej\
      \ w wielu późniejszych bitwach formacji kawalerii polskiej armii. Polska i Litwa\
      \ w latach 1474–1569 były też celem 75 najazdów [[Tatarzy|tatarskich]]<ref name=\"\
      Davies\">{{Cytuj książkę |nazwisko = Davies |imię = Brian |tytuł = Warfare,\
      \ State and Society on the Black Sea Steppe,1500–1700 |rok = 2007}}</ref>.\n\
      \n=== Rzeczpospolita Obojga Narodów ===\n{{Osobny artykuł|Historia Polski (1572–1697)|Historia\
      \ Polski (1697–1763)|Historia Polski (1764–1795)|Rzeczpospolita Obojga Narodów}}\n\
      [[Plik:Polish-Lithuanian Commonwealth (1619) compared with today's borders PL.png|thumb|upright=1.3|Największy\
      \ zasięg terytorialny [[Rzeczpospolita Obojga Narodów|Rzeczypospolitej Obojga\
      \ Narodów]] w latach 1619–1622 (990 000 km²), po [[Rozejm w Dywilinie|rozejmie\
      \ w Dywilinie]] na tle granic państw współczesnych.\n<br>'''Legenda''':\n{{Legenda|#ffaec9|[[Korona\
      \ Królestwa Polskiego]]}}\n{{Legenda|#ffc90e|[[Prusy Książęce]] – lenno Królestwa\
      \ Polskiego}}\n{{Legenda|#dab9f4|[[Wielkie Księstwo Litewskie]]}}\n{{Legenda|#bccacb|[[Księstwo\
      \ Zadźwińskie]] – posiadłość Korony i Litwy}}\n{{Legenda|#efe4b0|[[Księstwo\
      \ Kurlandii i Semigalii]] – lenno Rzeczypospolitej}}]]\n[[Plik:Jan III Schultz.jpg|mały|upright|lewo|Król\
      \ [[Jan III Sobieski]] (obraz [[Daniel Schultz|Daniela Schultza]])]]\n\nW 1569\
      \ [[Korona Królestwa Polskiego]] i [[Wielkie Księstwo Litewskie]] zawarły [[Unia\
      \ lubelska|unię lubelską]], tak powstała [[Rzeczpospolita Obojga Narodów]];\
      \ od zawarcia unii każdy nowo koronowany [[król Polski]] zostawał [[Władcy Wielkiego\
      \ Księstwa Litewskiego|władcą Litwy]] z urzędu i nigdy nie był podnoszony na\
      \ Wielkie Księstwo Litewskie<ref>{{Cytuj książkę |autor = Jerzy Ochmański |tytuł\
      \ = Historia Litwy |wydawca = Zakład Narodowy im. Ossolińskich |miejsce = Wrocław\
      \ |rok = 1990 |strony = 128 |isbn = 83-04-03107-8}}</ref>. Po bezpotomnej śmierci\
      \ [[Zygmunt II August|Zygmunta II Augusta]], ostatniego króla z dynastii Jagiellonów,\
      \ w 1573 wprowadzono [[Wolna elekcja|wolną elekcję]]. Ówczesna Rzeczpospolita,\
      \ szczególnie po uchwaleniu wolności religijnej na [[Konfederacja warszawska\
      \ (1573)|konfederacji warszawskiej w 1573 roku]], była nazywana „azylem heretyków”;\
      \ ściągali do niej prześladowani w zachodniej Europie [[Mennonici w Polsce|mennonici]],\
      \ [[Antytrynitaryzm|antytrynitarze]], wypędzani z Hiszpanii przez [[Inkwizycja|inkwizycję]]\
      \ Żydzi i [[hugenoci]] z Francji. [[Szlachta w Polsce]], znacznie liczniejsza\
      \ niż na zachodzie Europy, korzystała z przywilejów [[Złota wolność|złotej wolności]].\
      \ W okresie tym, nazywanym [[Złoty wiek Polski|złotym wiekiem Polski]], Rzeczpospolita\
      \ powiększała swoje terytorium, stając się największym [[Państwo|państwem]]\
      \ w Europie. W 1596 roku, [[Zygmunt III Waza]] przeniósł stolicę państwa z Krakowa\
      \ do Warszawy.\n\n4 lipca 1610 wojska pod dowództwem hetmana [[Stanisław Żółkiewski|Stanisława\
      \ Żółkiewskiego]] pokonały w [[Bitwa pod Kłuszynem|bitwie pod Kłuszynem]] wojska\
      \ rosyjskie, a następnie zajęły Moskwę. W XVII wieku Rzeczpospolita uwikłana\
      \ była w konflikty ze Szwecją („[[Potop szwedzki|potop]]”), Kozakami ([[powstanie\
      \ Chmielnickiego]]) i Rosją ([[wojna polsko-rosyjska (1654–1667)]]). 12 września\
      \ 1683 [[Jan III Sobieski]] rozbił w [[Bitwa pod Wiedniem|bitwie pod Wiedniem]]\
      \ armię [[Imperium Osmańskie|imperium osmańskiego]]. Zrywanie sejmów wskutek\
      \ stosowania zasady ''[[liberum veto]]'', liczne [[rokosz]]e oraz ograniczenie\
      \ władzy królewskiej prowadziły jednak do stopniowego osłabienia pozycji politycznej\
      \ i militarnej państwa oraz wzrostu zależności wobec sąsiadów. Pod koniec XVIII\
      \ wieku podjęto próby reformy kraju, m.in. ostatni król Polski [[Stanisław August\
      \ Poniatowski]] powołał w 1773 [[Komisja Edukacji Narodowej|Komisję Edukacji\
      \ Narodowej]], a w 1791 [[Sejm Czteroletni]] uchwalił [[Konstytucja 3 maja|Konstytucję\
      \ 3 maja]].\n\n=== Rozbiory i okres pod zaborami ===\n{{Osobny artykuł|Ziemie\
      \ Rzeczypospolitej pod zaborami|Historia Polski (1795–1831)|Historia Polski\
      \ (1831–1914)|Królestwo Polskie (kongresowe)}}\n[[Plik:Rzeczpospolita Rozbiory\
      \ 3.png|thumb|upright=1.3|[[Rozbiory Polski]] w latach [[I rozbiór Polski|1772]],\
      \ [[II rozbiór Polski|1793]] i [[III rozbiór Polski|1795]]]]\n[[Plik:Tadeusz\
      \ Kościuszko.PNG|mały|upright=0.5|lewo|[[Tadeusz Kościuszko]] (obraz [[Kazimierz\
      \ Wojniakowski|Kazimierza Wojniakowskiego]])]]\n\nOd czasów panowania [[Wettynowie|Wettynów]]\
      \ [[August II Mocny|Augusta II Mocnego]] i [[August III Sas|Augusta III Sasa]],\
      \ pozbawiona skutecznej władzy Polska dostawała się stopniowo pod wpływy [[Imperium\
      \ Rosyjskie]]go. Obaj królowie z dynastii saskiej oraz ich następca, [[Stanisław\
      \ August Poniatowski]], wybierani byli przy współudziale Rosji. W połączeniu\
      \ z upadkiem [[Sejm walny I Rzeczypospolitej|centralnego prawodawstwa]] i skarbu\
      \ państwa oraz szkodliwymi dla państwa działaniami wpływowych kręgów [[Szlachta\
      \ w Polsce|szlacheckich]] i [[Magnateria w Polsce|arystokratycznych]] przyczyniło\
      \ się to do całkowitego upadku Rzeczypospolitej. Działania króla wymierzone\
      \ w naprawę państwa były niekonsekwentne i nieskuteczne, podobnie spóźnione\
      \ były reformy inicjowane przez część [[Szlachta|szlachty]]. W 1772 roku Imperium\
      \ Rosyjskie, [[Królestwo Prus]] i [[Monarchia Habsburgów]] uzgodniły [[I rozbiór\
      \ Polski|I rozbiór]] części terytorium Polski, który został następnie zatwierdzony\
      \ przez szlachtę na [[Sejm Rozbiorowy (1773–1775)|Sejmie Rozbiorowym]]. 20 lat\
      \ później, w trakcie [[II rozbiór Polski|II]] i [[III rozbiór Polski|III rozbioru]]\
      \ (1793, 1795) dokonano całkowitego podziału kraju. W geście sprzeciwu wobec\
      \ zaborów, w 1794 wybuchło [[Insurekcja kościuszkowska|powstanie Kościuszki]].\
      \ Podzielone pomiędzy trzy państwa zaborcze polskie społeczeństwo stało się\
      \ częścią trzech różnych krajów, w których obowiązywały odrębne prawa, zasady\
      \ życia społecznego i politycznego oraz różne ograniczenia swobód<ref name=\"\
      igrzysko1\">{{Cytuj książkę |nazwisko = Davies |imię = Norman |tytuł = Boże\
      \ igrzysko. Historia Polski. Część 1 |url = https://books.google.co.uk/books?id=b912JnKpYTkC&printsec=frontcover&dq=gods+playground&hl=pl&sa=X&ei=5FwNUdqLL6-q0AX2k4DgCA&ved=0CDUQ6AEwAQ\
      \ |wydanie = 5 |wydawca = Znak |miejsce = Kraków |rok = 2006 |isbn = 978-83-2400-654-0\
      \ |język = en |data dostępu = 2010-08-18}}</ref>.\n\n==== Zabór rosyjski ====\n\
      {{Osobny artykuł|Zabór rosyjski|}}\n[[Plik:Starcie belwederczykow z kirasjerami\
      \ rosyjskimi na moscie w Lazienkach.png|mały|[[Powstanie listopadowe]], starcie\
      \ belwederczyków z kirasjerami rosyjskimi na moście w Łazienkach, 1830]]\n[[Plik:Tadeusz\
      \ Ajdukiewicz, scène de l'insurrection de 1863.jpg|mały|[[Powstanie styczniowe]]\
      \ w 1863 roku (obraz [[Tadeusz Ajdukiewicz|Tadeusza Ajdukiewicza]])]]\n\nWładcy\
      \ [[Imperium Rosyjskie]]go, rządzący terenami dawnej Rzeczypospolitej, prowadzili\
      \ rządy [[Samodzierżawie|autokratyczne i absolutne]]. Wobec Polaków stosowali\
      \ najczęściej politykę [[Asymilacja narodowa|asymilacji]], mającą z nich uczynić\
      \ „prawdziwych chrześcijan, lojalnych obywateli i dobrych Rosjan”, działając\
      \ w tym celu metodami [[Perswazja|perswazji]] i przymusu. Władze carskie zlikwidowały\
      \ dotychczasowe instytucje [[Demokracja szlachecka|szlacheckiej demokracji]],\
      \ wprowadzono [[Branka|obowiązek służby wojskowej]] w stałej armii, [[Województwo|województwa]]\
      \ zastąpiono [[gubernia]]mi, wprowadzono scentralizowaną i opartą na hierarchii\
      \ [[Administracja państwowa|administrację państwową]], która miała uczyć i wymagać\
      \ posłuszeństwa wobec władcy. W 1815 na części terytorium [[Księstwo Warszawskie|Księstwa\
      \ Warszawskiego]] utworzono [[Królestwo Polskie (kongresowe)|Królestwo Polskie]]\
      \ ze stolicą w Warszawie, które połączone było z Rosją [[Unia personalna|unią\
      \ personalną]], z [[car]]em jako tytularnym królem; jednak w 1831 Sejm [[Uchwała\
      \ Sejmu o detronizacji Mikołaja I|zdetronizował]] króla [[Mikołaj I Romanow|Mikołaja\
      \ I Romanowa]] i odsunął dynastię Romanowów od tronu polskiego<ref>{{Cytuj pismo\
      \ |autor = Lech Mażewski |tytuł = Królestwo Polskie 1815–1874. Powstanie i upadek\
      \ państwa |czasopismo = Przegląd Sejmowy |wolumin = 2 |wydanie = 139 |strony\
      \ = 51–73 |data = |issn =}}</ref>. Wprowadzono cenzurę i politykę [[Rusyfikacja\
      \ Polaków w okresie zaborów|rusyfikacji]] szkół, urzędów i życia publicznego.\
      \ Mimo że Polaków traktowano z podejrzliwością jako potencjalnych buntowników,\
      \ polityka przymusu i egzekwowania posłuszeństwa wymierzona była w tym samym\
      \ stopniu we wszystkich poddanych cara, niezależnie od narodowości.\n\nSpołeczeństwo\
      \ zaboru rosyjskiego upatrywało szansy na wyzwolenie w [[I Cesarstwo Francuskie|napoleońskiej\
      \ Francji]], w armii [[Napoleon Bonaparte|Napoleona]] utworzono dwa [[Legia\
      \ Polsko-Włoska|legiony polskie]]. Nadzieje te zostały jednak rozwiane, gdyż\
      \ Napoleon nie zamierzał wykorzystać legionów do walki o niepodległość Polski.\
      \ Dopiero po klęsce Rosji i Prus z Francją w 1805 i 1806 roku utworzono kontrolowane\
      \ przez Francję [[Księstwo Warszawskie]]. Księstwo przywracało częściową autonomię\
      \ władz polskich, nie przetrwało jednak długo. Po upadku Napoleona, w 1815 roku\
      \ zwycięskie państwa zadecydowały o jego kolejnym podziale.\n\nCarska polityka\
      \ asymilacji Polaków w rosyjskim społeczeństwie nie przynosiła zamierzonych\
      \ skutków. W życiu społecznym i towarzyskim Polacy funkcjonowali osobno wobec\
      \ Rosjan, a państwowy przymus rodził w nich uczucia frustracji i odizolowania.\
      \ Jednocześnie postępował [[Rewolucja przemysłowa|proces industrializacji]]\
      \ i rozwoju technologicznego, czego społecznym skutkiem był nagły rozwój miast,\
      \ głównie przemysłowej [[Łódź|Łodzi]] i handlowo-finansowej Warszawy, które\
      \ wielokrotnie zwiększyły swoje populacje. W miastach powstawały [[Klasa społeczna|społeczne\
      \ klasy]] [[Proletariat|robotników]] i [[Burżuazja|przemysłowców]], podczas\
      \ gdy wieś pozostawała zacofana – obowiązek [[Pańszczyzna w Polsce|pańszczyzny]]\
      \ trwał w Kongresówce aż do 1864, o wiele dłużej niż w pozostałych zaborach.\
      \ Znaczną częścią miejskich klas społecznych stawali się [[Żydzi]], zarówno\
      \ migrujący do miast za pracą [[Historia Żydów w Polsce|Żydzi polscy]], jak\
      \ i przesiedlani z Rosji tzw. [[Litwacy]].\n\nW 1825 na tron wstąpił autorytarny\
      \ car [[Mikołaj I Romanow|Mikołaj I]], który wkrótce objął represjami powstałe\
      \ w Polsce [[Narodowe Towarzystwo Patriotyczne|tajne stowarzyszenia narodowe]].\
      \ Działania te nałożyły się na falę rewolucji w Europie w kolejnych latach.\
      \ W roku 1830 grupa polskich spiskowców w carskiej armii, po otrzymaniu wieści\
      \ o mobilizacji wojska rosyjskiego w celu rozbicia [[Rewolucja belgijska|rewolucji\
      \ w Belgii]] [[Rewolucja lipcowa we Francji|i Francji]], postanowiła podjąć\
      \ akcję zbrojną. 29 listopada 1830 wybuchło [[powstanie listopadowe]]. W lutym\
      \ 1831 do Królestwa wkroczyły wojska rosyjskie, które zostały przez powstańców\
      \ wyparte, jednak podzielony politycznie sztab powstańczy nie wykorzystał początkowego\
      \ zwycięstwa. Wojska rosyjskie nadrobiły straty w lipcu 1831 i wspomagane przez\
      \ Prusy rozbiły powstanie dwa miesiące później. Uczestników powstania skazywano\
      \ na [[Zesłanie|zsyłkę]] lub kary więzienia, zawieszono funkcjonowanie sejmu\
      \ i większości instytucji publicznych. Około 10 tys. osób opuściło Królestwo,\
      \ tworząc we Francji środowisko tzw. [[Wielka Emigracja|Wielkiej Emigracji]].\
      \ Represje w Królestwie Polskim utrzymano do śmierci Mikołaja I<ref name=\"\
      igrzysko1\" />.\n\nPanowanie [[Mikołaj II Romanow|Mikołaja II]] przyniosło odwilż\
      \ polityczną, amnestię dla zesłańców i częściowe przywrócenie praw obywatelskich.\
      \ Równocześnie odrodziły się jednak tajne związki, głoszące hasła „rewolucji\
      \ moralnej”, która wkrótce opanowała społeczeństwo. Aby powstrzymać tendencje\
      \ rewolucyjne, ugodowy polityk [[Aleksander Wielopolski]] w styczniu 1863 zarządził\
      \ rozpoczęcie poboru do wojska, który spiskowcy odebrali jako akt agresji i\
      \ zaatakowali rosyjskie garnizony, rozpoczynając [[powstanie styczniowe]]. Powstańcy\
      \ podzieleni na polityczne frakcje „białych” i „czerwonych” i pozbawieni spójnego\
      \ dowództwa, prowadzili walki partyzanckie. Powstanie stłumione zostało w sierpniu\
      \ 1864. Po jego upadku nastąpiła kolejna fala brutalnych represji, formalnie\
      \ zlikwidowano również Królestwo Polskie jako oddzielną prowincję.\n\nOstatnie\
      \ dziesięciolecia XIX wieku były dla zaboru rosyjskiego okresem umiarkowanego\
      \ rozwoju, w którym społeczne i polityczne straty wywołane upadkiem powstania\
      \ styczniowego równoważone były postępującym procesem industrializacji miast\
      \ oraz kształtowaniem się polskiej sceny politycznej, która w pełni zaistnieć\
      \ miała w początkach XX wieku<ref name=\"igrzysko1\" />.\n\n==== Zabór pruski\
      \ ====\n{{Osobny artykuł|Zabór pruski}}\n\nPo upadku Księstwa Warszawskiego\
      \ w roku 1815, na terenie przejętym przez Królestwo Pruskie powstało mające\
      \ zaspokoić narodowe ambicje Polaków [[Wielkie Księstwo Poznańskie]], które\
      \ po\n[[Powstanie wielkopolskie (ujednoznacznienie)|powstaniach wielkopolskich]]\
      \ w latach [[Powstanie wielkopolskie (1846)|1846]] i [[Powstanie wielkopolskie\
      \ (1848)|1848]] zlikwidowano. Pruska polityka [[Germanizacja Polaków w okresie\
      \ zaborów|germanizacji]] na ziemiach polskich w ramach [[Kulturkampf]]u nasiliła\
      \ się po upadku powstania. Objęcie stanowiska kanclerza [[Cesarstwo Niemieckie|Rzeszy]]\
      \ przez [[Otto von Bismarck|Ottona von Bismarcka]] spowodowało kolejne zaostrzenie\
      \ polityki germanizacyjnej<ref name=\"EPWN\">{{encyklopedia PWN|id=3905080|tytuł=germanizacja\
      \ na ziemiach polskich w XIX w.|data dostępu=2023-05-26}}</ref>.\n\nTereny dawnego\
      \ zaboru pruskiego charakteryzowały się zdecydowanie większym poziomem rozwoju\
      \ gospodarczego i szkolnego niż obszary zaborów austriackiego i rosyjskiego.\
      \ Przemysł i rolnictwo były o wiele bardziej rozwinięte, a odsetek analfabetów\
      \ był niższy. I tak oto na ziemiach, które przed 1914 należały do [[Cesarstwo\
      \ Niemieckie|Cesarstwa Niemieckiego]], a w latach 1918–1921 znalazły się w granicach\
      \ odrodzonej Polski można zauważyć, że były zdecydowanie lepiej rozwinięte niż\
      \ ziemie, które przed 1914 należały do Imperium Rosyjskiego i Austro-Węgier.\
      \ Tereny Wielkopolski, Górnego Śląska i Pomorza Gdańskiego, w tym [[Ziemia chełmińska|ziemi\
      \ chełmińskiej]], oraz zachodnich Kujaw miały wysoko rozwinięte rolnictwo czy\
      \ przemysł, a poziom analfabetyzmu nie przekraczał kilku procent. I choć na\
      \ niektórych terenach dawnego zaboru rosyjskiego znajdowały się dość dobrze\
      \ rozwinięte miejsca związane z rolnictwem i przemysłem, m.in. wschodnie Kujawy,\
      \ Lubelszczyzna, Wołyń, przemysłowe okręgi [[Łódzki Okręg Przemysłowy|łódzki]],\
      \ [[Warszawski Okręg Przemysłowy|warszawski]], [[Białostocki Okręg Przemysłowy|białostocki]]\
      \ czy [[Staropolski Okręg Przemysłowy|staropolski]], to nie było to aż na taką\
      \ dużą skalę jak na terenach, które należały do Niemiec przed 1914, gdyż pozostała\
      \ część terenów należących przed 1914 do Rosji była słabo rozwinięta i dość\
      \ powszechny był analfabetyzm, któremu sprzyjał brak obowiązku szkolnictwa w\
      \ zaborze rosyjskim, zaś rolnictwo było związane raczej z miejscami, gdzie występowały\
      \ gleby dobrej jakości, a tereny wiejskie były biedne, mimo miejsc z rolnictwem\
      \ i przemysłem.\n\nTeren zaboru austriackiego był jeszcze gorszy dla rolnictwa,\
      \ ze względu na wyżynno-rolnicze tereny i występował tylko przemysł naftowy.\
      \ Jedynie w zaborze austriackim analfabetyzm był niższy niż na terenie zaboru\
      \ rosyjskiego, ze względu na obowiązek szkolny. Dodatkowo na terenach należących\
      \ do Niemiec przed 1914 rokiem na terenach wiejskich zdecydowanie dominowały\
      \ domy murowane, w przeciwieństwie do terenów należących przed 1914 do Rosji\
      \ i Austro-Węgier, gdzie dominowały domy drewniane na terenach wiejskich. Oświetlenie\
      \ i elektryfikacja miast w zaborze pruskim były także lepsze niż w pozostałych,\
      \ dużo większy procent mieszkań i domostw miał dostęp do kanalizacji i bieżącej\
      \ wody<ref name=\"Talarowski\">{{Cytuj |tytuł = Adam Talarowski: O różnicach\
      \ między zaborami |data dostępu = 2022-12-27 |opublikowany = teologiapolityczna.pl\
      \ |url = https://teologiapolityczna.pl/adam-talarowski-o-roznicach-miedzy-zaborami\
      \ |język = pl}}</ref>. Pod względem rozwoju polskości i języka polskiego najlepsza\
      \ sytuacja była w zaborze austriackim, zaś pod względem rozwoju gospodarczego\
      \ w pruskim<ref name=\"Talarowski\" />.\n\n[[Plik:Przyjazd Ignacego Jana Paderewskiego\
      \ do Poznania (1-H-319-2).jpg|mały|Przyjazd [[Ignacy Jan Paderewski|Ignacego\
      \ Jana Paderewskiego]] do [[Poznań|Poznania]] 27 grudnia 1918 zapoczątkował\
      \ wybuch [[Powstanie wielkopolskie|powstania wielkopolskiego]]]]\n\n[[Powstanie\
      \ wielkopolskie]] wybuchło po zakończeniu I wojny światowej w 1918 roku, podczas\
      \ wizyty powracającego do już niepodległej Polski [[Ignacy Jan Paderewski|Ignacego\
      \ Jana Paderewskiego]], który będąc w drodze do Warszawy, przybył do Poznania\
      \ 27 grudnia. Powstańcy w krótkim czasie opanowali całą tak zwaną Prowincję\
      \ Poznańską z wyjątkiem jej północnych i południowo-zachodnich obrzeży. Powstanie\
      \ zakończyło się zwycięstwem 16 lutego 1919 roku.\n\n==== Zabór austriacki ====\n\
      {{Osobny artykuł|Zabór austriacki}}\n\nRządzona przez dynastię Habsburgów Austria\
      \ była politycznie najsłabsza – i od 1867, po klęsce w [[Wojna prusko-austriacka|wojnie\
      \ z Prusami]] zarazem najbardziej liberalna – z trzech państw zaborczych. Z\
      \ włączonych do Austrii ziem polskich zostało utworzone [[Królestwo Galicji\
      \ i Lodomerii]]. Nazwa ta miała wywodzić się od średniowiecznych księstw [[Ruś\
      \ Kijowska|ruskich]], [[Księstwo halicko-wołyńskie|Halicza]] i [[Księstwo włodzimierskie|Włodzimierza]].\
      \ Galicja była prowincją odległą od Wiednia, najmniej rozwiniętą przemysłowo\
      \ i ekonomicznie. W przeciwieństwie do zaboru rosyjskiego, w Galicji nie rozwinął\
      \ się nigdy [[Rewolucja przemysłowa|wielki przemysł]], nie powstała [[Proletariat|klasa\
      \ robotników]] ani miejska [[klasa średnia]]. Poza [[Kopalnia Soli „Wieliczka”|kopalnią\
      \ soli w Wieliczce]] i [[Borysławsko-Drohobyckie Zagłębie Naftowe|polami naftowymi\
      \ w Borysławiu]] Galicja nie przynosiła wielkiego dochodu. Klasę wpływową stanowiło\
      \ kilka bogatych polskich rodzin arystokratycznych, średnia szlachta utrzymywała\
      \ się z nierentownych [[folwark]]ów i była w większości zadłużona, natomiast\
      \ wieś była poważnie przeludniona i bytowała na granicy nędzy. Jakość i długość\
      \ życia na wsi były najniższe ze wszystkich zaborów, często jedynym wyjściem\
      \ dla galicyjskich chłopów był wyjazd z kraju – tylko w ostatnich 25 latach\
      \ XIX wieku Galicję opuściły 2 miliony osób.\n\nStolicą prowincji stał się [[Lwów]],\
      \ po 1846 roku do Galicji włączono też [[Wolne Miasto Kraków]], dotąd formalnie\
      \ autonomiczne. [[Polacy]] stanowili 45% ludności; podobną część (41%) stanowili\
      \ [[Ukraińcy]], wcześniej określający się jako [[Rusini]]. Do połowy XIX wieku\
      \ Austria była scentralizowaną monarchią absolutną, w której ziemie polskie\
      \ nie odgrywały większej roli. W roku 1846 wybuchło zorganizowane przez szlachtę\
      \ [[powstanie krakowskie]] – niewielka niepodległościowa akcja zbrojna, która\
      \ zbiegła się z wybuchem antyszlacheckiego powstania chłopskiego, znanego jako\
      \ [[rabacja galicyjska]]. Wybuch rabacji został częściowo sprowokowany przez\
      \ Austriaków w celu zatrzymania działań szlachty i wewnętrznego skłócenia społeczeństwa.\
      \ Powstanie krakowskie zostało stłumione, natomiast rabacja przekształciła się\
      \ w obejmujące całą Galicję brutalne rozruchy wymierzone w dwory. Ostatecznym\
      \ skutkiem rebelii było powiększenie międzyklasowych podziałów, ale też początek\
      \ upadku feudalizmu i zniesienie [[Pańszczyzna|pańszczyzny]].\n\n[[Plik:Pierwsza\
      \ Kompania Kadrowa w Oleandrach (1914).jpg|mały|[[Pierwsza Kompania Kadrowa]]\
      \ utworzona 3 sierpnia 1914 w Krakowie przez Józefa Piłsudskiego]]\n\nOd lat\
      \ 60. XIX wieku grupa konserwatywnych polityków pod przywództwem [[Agenor Romuald\
      \ Gołuchowski|Agenora Gołuchowskiego]] dążyła do [[Autonomia galicyjska|przyznania\
      \ Galicji autonomii]] wewnątrz cesarstwa. W wyniku [[ugoda austriacko-polska|ich\
      \ starań]] w latach 1867–1872 Galicja otrzymała szereg praw – ustanowiono [[Sejm\
      \ Krajowy (Galicja)|Sejm Krajowy]] decydujący o sprawach prowincji, przywrócono\
      \ urzędowy język polski oraz polskojęzyczne wykłady na uniwersytetach, zakładano\
      \ [[Akademia Umiejętności|nowe instytucje nauki]]. Mimo że sejm został zdominowany\
      \ przez arystokrację, Galicja była jedynym zaborem, w którym Polacy uczestniczyli\
      \ w rządach. Rozwój naukowy przyczynił się do wykształcenia pokolenia wybitnych\
      \ naukowców i artystów, a Kraków i Lwów stały się centrami kultury. Druga połowa\
      \ XIX wieku stała się w Galicji również czasem formowania narodowego ruchu niepodległościowego\
      \ zarówno dla Polaków, jak i dla Ukraińców. W Krakowie rozpoczęły swoją działalność\
      \ [[Legiony Polskie (1914–1918)|Legiony Piłsudskiego]]<ref name=\"igrzysko\"\
      />.\n\n=== II Rzeczpospolita ===\n==== Dwudziestolecie międzywojenne ====\n\
      [[Plik:Jozef Pilsudski.jpg|mały|upright|[[Józef Piłsudski]], naczelnik państwa\
      \ w latach 1918–1922]]\n[[Plik:Narcyz Witczak-Witaczyński - Belweder w Warszawie\
      \ (107-993-1).jpg|mały|upright=0.9|[[Belweder w Warszawie|Belweder]], siedziba\
      \ Naczelnika Państwa, następnie Prezydenta RP]]\n{{Osobny artykuł|Historia Polski\
      \ (1918–1939)|II Rzeczpospolita|Bitwa o Lwów (1918–1919)|Walki o Przemyśl w\
      \ 1918 roku|Bitwa Warszawska|Umowa warszawska 1920|Traktat ryski (1921)|Operacja\
      \ polska NKWD (1937–1938)}}\n\nZa symboliczny początek [[II Rzeczpospolita|II\
      \ Rzeczypospolitej]] uznaje się 11 listopada 1918, w którym to dniu władzę wojskową\
      \ w Warszawie objął [[Józef Piłsudski]]. W wyniku jego działań wojska niemieckie\
      \ wycofały się z miasta, po czym 22 listopada przyjął on dla siebie tytuł Tymczasowego\
      \ Naczelnika Państwa<ref>Dekret Józefa Piłsudskiego o najwyższej władzy reprezentacyjnej\
      \ Republiki Polskiej ({{Dziennik Ustaw|1918|17|41}}).</ref>. Po zakończeniu\
      \ [[I wojna światowa|I wojny światowej]] zwycięskie państwa [[Ententa|Ententy]]\
      \ zaaprobowały plan utworzenia niepodległego państwa polskiego.\n\nPierwsze\
      \ lata po ogłoszeniu niepodległości były okresem niepokojów społecznych i konfliktów.\
      \ W latach 1918–1921 Polska prowadziła równocześnie sześć wojen ze swoimi sąsiadami.\
      \ Toczyły się [[Konflikt polsko-litewski|konflikty z Litwą]] i [[Wojna polsko-ukraińska|Ukrainą]]\
      \ dotyczące wschodniej granicy kraju, wybuchły trzy [[Powstania śląskie|powstania\
      \ na Śląsku]] i [[Powstanie wielkopolskie|powstanie w Wielkopolsce]] przeciwko\
      \ niemieckim władzom na tych terenach, dochodziło do [[Polsko-czechosłowackie\
      \ konflikty graniczne|konfliktów z Czechosłowacją]] o sporne tereny graniczne.\
      \ Najpoważniejszym konfliktem tego okresu była wygrana przez Polskę [[wojna\
      \ polsko-bolszewicka]] w 1919. W 1922 w granice RP włączono [[Litwa Środkowa|Litwę\
      \ Środkową]]<ref>Ustawa z dnia 6 kwietnia 1922 o objęciu władzy państwowej nad\
      \ Ziemią Wileńską ({{Dziennik Ustaw|1922|26|213}}).</ref>.\n\nPodstawowym problemem\
      \ II Rzeczypospolitej był brak spójności w ramach samego społeczeństwa polskiego.\
      \ Ludność wywodziła się z terenów trzech zaborów, które przez ponad stulecie\
      \ stanowiły tereny różnych krajów. Trudnością były też różnice pomiędzy mniejszościami\
      \ narodowymi, które stanowiły liczną część społeczeństwa. Osób określających\
      \ się jako Polacy było około 68,9%, Ukraińców było 13,9%, Żydów 8,7%, Białorusinów\
      \ 3,1% a Niemców 2,3%. Około 75% ludności Polski mieszkało na wsi, której największymi\
      \ problemami było ubóstwo i duże przeludnienie. Polska scena polityczna również\
      \ była miejscem silnych konfliktów. Czołowe partie polityczne – [[Polska Partia\
      \ Socjalistyczna]], [[Polskie Stronnictwo Ludowe (1895–1913)|Polskie Stronnictwo\
      \ Ludowe]] i [[Narodowa Demokracja]] prezentowały diametralnie różne wizje państwa\
      \ polskiego. Tragicznym rezultatem tych napięć było, w grudniu 1922, [[Zamach\
      \ na Gabriela Narutowicza|zabójstwo prezydenta Gabriela Narutowicza]], związanego\
      \ z PSL.\n\nW pierwszych latach istnienia Polska przyjęła ustrój [[Demokracja\
      \ parlamentarna|demokracji parlamentarnej]] – w styczniu 1919 odbyły się pierwsze\
      \ [[Sejm Ustawodawczy (1919–1922)|wybory do Sejmu]], a 17 marca 1921 uchwalono\
      \ [[Konstytucja marcowa|tekst konstytucji]]. W roku 1924 w ramach kształtowania\
      \ gospodarki państwa i walki z rosnącą inflacją przeprowadzono [[Reforma walutowa\
      \ Władysława Grabskiego|pakiet reform]] premiera [[Władysław Grabski|Władysława\
      \ Grabskiego]], wprowadzono nową walutę – [[Złoty|złotego]] oraz założono [[Bank\
      \ Polski Spółka Akcyjna|Bank Polski]]. Prowadzono duże inwestycje w przemysł\
      \ wydobywczy na Śląsku, rozbudowywano infrastrukturę elektryczną i kolejową,\
      \ zbudowano [[Centralny Okręg Przemysłowy]] i nowy [[Port morski Gdynia|port\
      \ morski w Gdyni]]. Okres międzywojenny był czasem intensywnego rozwoju kultury\
      \ polskiej – powstawały ważne dzieła literackie i malarskie, a również prace\
      \ naukowe. Państwo skutecznie inwestowało w edukację, szczególnie w nauczanie\
      \ początkowe na terenach wiejskich.\n\nW 1926 roku, w sytuacji kryzysu politycznego\
      \ Józef Piłsudski doprowadził do wojskowego [[Zamach stanu|zamachu stanu]],\
      \ znanego jako [[przewrót majowy]]. W wyniku przewrotu system demokracji parlamentarnej\
      \ został przekształcony w [[Autorytaryzm (ustrój)|system autorytarny]], w którym\
      \ większość władzy obejmował prezydent, natomiast wolność działania opozycji\
      \ oraz [[wolność prasy]] i [[Wolność słowa|słowa]] została poważnie ograniczona.\
      \ Władzę przejął Piłsudski oraz jego współpracownicy, tworzący środowisko znane\
      \ jako ''[[sanacja]]''. Autorytarny sposób sprawowania władzy przez „pułkowników”\
      \ przyczynił się do dalszego rozszerzenia napięć społecznych i radykalnych postaw\
      \ w czasie lat 30.<ref name=\"igrzysko\"/>\n\n==== II wojna światowa ====\n\
      [[Plik:Granica-zrywanie godła.jpg|mały|wrzesień 1939 – niszczenie polskiego\
      \ szlabanu granicznego<ref>{{Cytuj stronę |url = http://fototekst.pl/ikony-wrzesnia/\
      \ |tytuł = Ikony września |autor = Tomasz Stempowski |archiwum = https://web.archive.org/web/20180323032006/http://fototekst.pl/ikony-wrzesnia/\
      \ |zarchiwizowano = 2018-03-23 |data dostępu = 2018-03-22}}</ref>]]\n[[Plik:Polishborder17091939.jpg|mały|Kolumny\
      \ piechoty sowieckiej wkraczające do Polski 17 września 1939]]\n{{Osobny artykuł|Historia\
      \ Polski (1939–1945)|Kampania wrześniowa|Agresja ZSRR na Polskę|Okupacja niemiecka\
      \ ziem polskich (1939–1945)|Okupacja sowiecka ziem polskich (1939–1941)}}\n\n\
      1 września 1939 [[Wehrmacht|wojska hitlerowskich Niemiec]] uderzyły na Polskę.\
      \ W pierwszych tygodniach po inwazji rozegrało się [[Kampania wrześniowa|kilka\
      \ ważniejszych bitew]], z których największą była przegrana przez [[Wojsko Polskie\
      \ (II RP)|polskie wojsko]] [[bitwa nad Bzurą]]. 14 września wojska niemieckie\
      \ rozpoczęły [[Obrona Warszawy (1939)|oblężenie Warszawy]]. Równocześnie z oblężeniem\
      \ miasta rozpoczęła się ewakuacja urzędów centralnych, rządu i prezydenta przez\
      \ granicę południową do [[Królestwo Rumunii|Rumunii]].\n\n17 września 1939 Polska\
      \ zaatakowana została również przez [[Armia Czerwona|Armię Czerwoną]], której\
      \ natarcie było skutkiem [[Pakt Ribbentrop-Mołotow|tajnego porozumienia pomiędzy]]\
      \ [[III Rzesza|III Rzeszą]] a [[Związek Socjalistycznych Republik Radzieckich|ZSRR]].\
      \ Walki trwały do początków października 1939 – 28 września skapitulowali obrońcy\
      \ Warszawy, a 6 października zakończyła się [[Bitwa pod Kockiem (1939)|bitwa\
      \ pod Kockiem]] – ostatnia, przegrana przez Polaków bitwa kampanii wrześniowej.\n\
      \nW czasie II wojny światowej II Rzeczpospolita zachowała [[Podmiot prawa międzynarodowego|podmiotowość]]<ref\
      \ name=\"Osmańczyk\">{{Cytuj książkę |autor = Edmund Jan Osmańczyk |tytuł =\
      \ Encyklopedia ONZ i stosunków międzynarodowych |wydawca = Wiedza Powszechna\
      \ |miejsce = Warszawa |rok = 1982 |strony = 408, 471 |isbn = 83-214-0092-2}}</ref>,\
      \ w [[Stosunki dyplomatyczne|stosunkach dyplomatycznych]] do końca wojny reprezentowana\
      \ była przez [[rząd Rzeczypospolitej Polskiej na uchodźstwie]], który uzyskał\
      \ schronienie w Paryżu (do 1940), a następnie w Londynie<ref name=\"Osmańczyk\"\
      />.\n\nTerytorium Polski zostało podzielone pomiędzy III Rzeszę i Związek Radziecki\
      \ na podstawie dwustronnego [[Traktat o granicach i przyjaźni III Rzesza – ZSRR\
      \ (1939)|traktatu o granicach i przyjaźni]] zawartego 28 września 1939. Terytorium\
      \ okupowane przez Związek Radziecki zostało [[Terytoria Polski anektowane przez\
      \ III Rzeszę|wcielone do ZSRR]]; zachodnia część terytorium okupowanego przez\
      \ Niemcy została wcielona do III Rzeszy, na pozostałej części utworzono tzw.\
      \ [[Generalne Gubernatorstwo]]. Związek Radziecki przekazał 26 października\
      \ 1939 Wilno i część [[Województwo wileńskie (II Rzeczpospolita)|województwa\
      \ wileńskiego]] pod okupację Litwy<ref name=\"autonazwa3\"/><ref name=\"autonazwa2\"\
      />. Także na rzecz Słowacji Polska utraciła ziemie tworzące tzw. [[Polski Spisz]]\
      \ i polską część [[Orawa (region)|Orawy]]<ref>Andrzej Olejko, ''Niedoszły sojusznik\
      \ czy trzeci agresor? Wojskowo-polityczne aspekty trudnego sąsiedztwa Polski\
      \ i Słowacji 1918–1939'', Wydawnictwo Uniwersytetu Rzeszowskiego i Wydawnictwo\
      \ Arkadiusz Wingert, Kraków-Rzeszów 2012, {{ISBN|978-83-60682-35-7}}.</ref>.\
      \ Równocześnie z wprowadzeniem władzy okupacyjnej rozpoczęły się [[Zbrodnie\
      \ niemieckie w Polsce (1939–1945)|represje wymierzone w społeczeństwo polskie]].\
      \ Na terenach okupowanych przez Niemcy i ZSRR prowadzono masowe aresztowania\
      \ i egzekucje osób pełniących wcześniej funkcje państwowe lub zaangażowanych\
      \ w ruch oporu. W roku 1940 miała miejsce [[zbrodnia katyńska]]. Szczególny\
      \ rodzaj prześladowań wymierzony został przez Niemców w [[Historia Żydów w Polsce|żydowską\
      \ ludność Polski]] – [[Żydzi|osoby pochodzenia żydowskiego]] zmuszone zostały\
      \ do zamieszkania w zamkniętych dzielnicach – [[Getto|gettach]], stopniowo odebrane\
      \ zostały im wszelkie prawa. W 1943 wybuchło [[powstanie w getcie warszawskim]].\
      \ Od 1941 w [[Obozy niemieckie (1933–1945)|niemieckich obozach zagłady]] [[Zagłada\
      \ Żydów|zginęło około 90% Żydów]] będących obywatelami Polski. Hitlerowcy prowadzili\
      \ również [[Wysiedlenia Polaków podczas II wojny światowej dokonane przez Niemców|masowe\
      \ wysiedlenia ludności polskiej]], w których wyniku wiele osób pozbawionych\
      \ zostało miejsca zamieszkania i zmuszonych do [[Roboty przymusowe w III Rzeszy|przymusowej\
      \ pracy]] na terenie Niemiec.\nOdpowiedzią na represje i aresztowania była zbrojna\
      \ działalność [[Polskie Państwo Podziemne|Państwa Podziemnego]] i organizacji\
      \ [[Ruch oporu|ruchu oporu]]. Kulminacją tych działań była [[akcja „Burza”]]\
      \ i [[powstanie warszawskie]] w 1944.\n\nNa wschodnich terenach II RP w czasie\
      \ okupacji niemieckiej, [[Ukraińska Powstańcza Armia|ukraińscy nacjonaliści]]\
      \ dokonali [[Rzeź wołyńska|rzezi wołyńskiej]] i [[Czystka etniczna w województwach\
      \ lwowskim, tarnopolskim i stanisławowskim|galicyjskich czystek etnicznych]],\
      \ w wyniku tych działań zamordowano 60–100 tysięcy Polaków<ref>{{Cytuj książkę\
      \ |tytuł = Kto tego nie widział, nigdy w to nie uwierzy... Zbrodnia wołyńska.\
      \ Historia i pamięć. Materiały edukacyjne |url = https://edukacja.ipn.gov.pl/download/210/403644/ZbrodniaWolynska.pdf\
      \ |strony = 15 |rok = 2013 |wydawca = Instytut Pamięci Narodowej |miejsce =\
      \ Warszawa |isbn = 978-83-7629-468-1}}</ref>, a ponad 1000 polskich miejscowości\
      \ zostało kompletnie zniszczonych<ref>[[Czesław Piotrowski (1926–2005)|Czesław\
      \ Piotrowski]], ''Zniszczone i zapomniane osiedla polskie oraz kościoły na Wołyniu'',\
      \ Warszawa 2002, s. 5.</ref><ref>{{cytuj książkę |autor = [[Grzegorz Motyka\
      \ (historyk)|Grzegorz Motyka]] |tytuł = Od rzezi wołyńskiej do akcji „Wisła”.\
      \ Konflikt polsko-ukraiński 1943–1947 |wydawca = Wydawnictwo Literackie |miejsce\
      \ = Kraków |rok = 2011 |strony = 447 |isbn = 978-83-08-04576-3}}</ref>.\n\n\
      Polska wśród wszystkich państw, które walczyły przeciwko Rzeszy Niemieckiej\
      \ poniosła najwyższe straty osobowe w przeliczeniu na 1000 mieszkańców: 220\
      \ osób. Prócz strat biologicznych poniosła ogromne straty materialne, których\
      \ wysokość wynosiła 48 688,9 mld dolarów według wartości z 1938 roku. Zniszczenia\
      \ wojenne miały katastrofalny wpływ na [[dochód narodowy]], którego wartość\
      \ spadła w 1945 roku do 38, 2% wartości dochodu przedwojennego. Równie wielkie\
      \ były straty Polski w zakresie kultury, oświaty i nauki. Hitlerowcy zniszczyli\
      \ lub zrabowali 43% dorobku kulturalnego Polski. Niemal doszczętnie zniszczono\
      \ instytuty badawcze, towarzystwa naukowe i fundacje<ref>Obozy hitlerowskie\
      \ na ziemiach polskich 1939–1945. Informator encyklopedyczny, Warszawa 1979,\
      \ s. 13.</ref>.\n\nW wyniku działań [[II wojna światowa|II wojny światowej]]\
      \ i w czasie okupacji zginęło około 16% obywateli Polski<ref>{{Cytuj stronę\
      \ |url = http://www.muzhp.pl/artykuly/239/polska-w-ii-wojnie-swiatowej |tytuł\
      \ = Polska w II wojnie światowej |autor = Łukasz Wojtach |opublikowany = Muzeum\
      \ Historii Polski |archiwum = https://web.archive.org/web/20110603181531/http://www.muzhp.pl/artykuly/239/polska-w-ii-wojnie-swiatowej\
      \ |zarchiwizowano = 2011-06-03 |data dostępu = 2010-11-13}}</ref>, zniszczonych\
      \ zostało wiele miast, w tym niemal całkowicie Warszawa<ref name=\"igrzysko\"\
      /><ref name=\"Polska. Losy państwa i narodu 1939-1989\"/><ref name=\"Najnowsza\
      \ historia Polski 1914–1945\">{{Cytuj książkę |nazwisko = Roszkowski |imię =\
      \ Wojciech |tytuł = Najnowsza historia Polski 1914–1945 |wydawca = Świat Książki\
      \ |miejsce = Warszawa |rok = 2003 |isbn = 83-7311-991-4}}</ref>.\n\n{{Zobacz\
      \ też|Polski wkład w II wojnę światową|Polski ruch oporu w czasie II wojny światowej|Polskie\
      \ Siły Zbrojne|Armia Polska na Wschodzie}}\n\n=== Polska Rzeczpospolita Ludowa\
      \ ===\n{{Osobny artykuł|Historia Polski (1945–1989)|Polska Rzeczpospolita Ludowa}}\n\
      [[Plik:Curzon line pl.svg|mały|upright=1.3|Obszar [[II Rzeczpospolita|II RP]]\
      \ we współczesnych granicach Polski ustalonych na początku istnienia [[Polska\
      \ Rzeczpospolita Ludowa|PRL]]]]\n\nW styczniu 1944 nacierająca na [[Wehrmacht]]\
      \ [[Armia Czerwona]] przekroczyła [[Granica polsko-radziecka|granicę polsko-radziecką]]\
      \ sprzed 1939. 21 lipca 1944 w Moskwie utworzono [[Polski Komitet Wyzwolenia\
      \ Narodowego]] (PKWN), który sprawował władzę na terytorium Polski zajmowanym\
      \ przez Armię Czerwoną; w skład PKWN weszli wyznaczeni przez [[Józef Stalin|Józefa\
      \ Stalina]] polscy działacze [[Komunizm|komunistyczni]]. PKWN został przekształcony\
      \ kolejno w [[Rząd Tymczasowy Rzeczypospolitej Polskiej|Rząd Tymczasowy]] (31\
      \ lipca 1944) i [[Tymczasowy Rząd Jedności Narodowej]] (28 czerwca 1945). W\
      \ konsekwencji Stany Zjednoczone i Wielka Brytania wycofały [[uznanie międzynarodowe]]\
      \ dla [[Rząd Rzeczypospolitej Polskiej na uchodźstwie|rządu RP na uchodźstwie]]\
      \ (ZSRR i Francja uznały już PKWN w 1944). Władze komunistyczne w Polsce wyeliminowały\
      \ z życia publicznego wszystkie partie opozycyjne, wprowadziły terror policyjny\
      \ i masowe aresztowania politycznych przeciwników, głównie działaczy [[Polskie\
      \ Państwo Podziemne|organizacji konspiracyjnych]] z czasów okupacji. W wyniku\
      \ sfałszowanych [[Wybory parlamentarne w Polsce w 1947 roku|wyborów parlamentarnych]]\
      \ (1947) zdecydowaną większość mandatów w [[Sejm Ustawodawczy (1947–1952)|Sejmie\
      \ Ustawodawczym]] objął [[Blok Demokratyczny]] (PPR, PPS, SD, SL).\n\nW pierwszych\
      \ latach po zakończeniu II wojny światowej przeprowadzono wiele zmian społecznych\
      \ i politycznych – m.in. zasiedlenie [[Ziemie Odzyskane|Ziem Odzyskanych]],\
      \ [[Nacjonalizacja w Polsce|nacjonalizację przemysłu]] oraz [[Reforma rolna\
      \ w Polsce (1944)|reformę rolną]]. Rozpoczęto odbudowę kraju ze zniszczeń wojennych,\
      \ w tym odbudowę [[Zburzenie Warszawy|zburzonej Warszawy]]. W 1948 powstała\
      \ [[Polska Zjednoczona Partia Robotnicza]], co spowodowało faktyczne wprowadzenie\
      \ w Polsce systemu jednopartyjnego. W 1952 państwo polskie zmieniło nazwę na\
      \ Polska Rzeczpospolita Ludowa, uchwalono również [[Konstytucja Polskiej Rzeczypospolitej\
      \ Ludowej|Konstytucję Polskiej Rzeczypospolitej Ludowej]]. Jednocześnie zwiększono\
      \ terror policyjny oraz prześladowania opozycji, Kościoła katolickiego i przedwojennych\
      \ działaczy publicznych, które trwały aż do śmierci Stalina (1953). W 1956 odbył\
      \ się pierwszy w PRL strajk generalny oraz krwawo stłumione przez wojsko i milicję\
      \ [[Poznański Czerwiec|demonstracje w Poznaniu]].\n\nW wyniku zmian w Związku\
      \ Radzieckim przeprowadzonych po śmierci Stalina również w Polsce [[Polski październik\
      \ 1956|zmniejszono represje wymierzone w obywateli]] i powołano nowe władze,\
      \ których przywódcą został [[I sekretarze KC PZPR|I sekretarz PZPR]] [[Władysław\
      \ Gomułka]]. Nowy rząd podjął próbę zmiany relacji ze społeczeństwem i reformy\
      \ gospodarki, których jednak zaprzestano już po kilku latach. W latach 1960–1966\
      \ w całym kraju uroczyście obchodzono [[Tysiąclecie Państwa Polskiego]]<ref>{{Cytuj\
      \ książkę |tytuł = Polska: zarys encyklopedyczny |inni = Włodzimierz Kryszewski\
      \ (red. prowadzący) |wydawca = Państwowe Wydawnictwo Naukowe |miejsce = Warszawa\
      \ |rok = 1974 |strony = 135–136}}</ref>. W 1968 władze rozbiły demonstracje\
      \ studentów w Warszawie i Krakowie, co stało się pretekstem do [[Marzec 1968|antysemickiej\
      \ i antyinteligenckiej kampanii]], w której wyniku wiele osób zmuszonych zostało\
      \ do emigracji. Po kolejnej fali brutalnie stłumionych [[Grudzień 1970|strajków\
      \ robotniczych w 1970 roku]] Władysław Gomułka zrezygnował ze stanowiska I sekretarza,\
      \ a jego miejsce zajął [[Edward Gierek]].\n\nNowa ekipa rządowa podjęła próbę\
      \ reformy gospodarki i przyspieszania wzrostu gospodarczego kraju. W wyniku\
      \ reform wprowadzonych przez ekipę Gierka, które finansowano głównie z pożyczek\
      \ zagranicznych, rozpoczęto budowę wielu nowych zakładów przemysłowych, zmechanizowano\
      \ rolnictwo, budowano masowo osiedla mieszkaniowe. Podniósł się też poziom życia\
      \ społeczeństwa, wzrosła dostępność wielu produktów oraz wysokość zarobków.\
      \ Z powodu błędów ekonomicznych wynikających ze stosowania [[Gospodarka planowa|centralnie\
      \ planowanej gospodarki]] już w roku 1975 doprowadzono do załamania gospodarki\
      \ i dużego zwiększenia [[Zadłużenie zagraniczne PRL|zadłużenia zagranicznego\
      \ Polski]]. Zmusiło to rząd do wprowadzenia dużych podwyżek cen żywności, na\
      \ co społeczeństwo zareagowało falą strajków i protestów, które wybuchły w [[Czerwiec\
      \ 1976|czerwcu 1976]]. Strajki te zostały brutalnie stłumione przez milicję,\
      \ a ich uczestnicy objęci represjami. Protesty w 1976 doprowadziły do powstania\
      \ pierwszych organizacji [[Opozycja polityczna w PRL|opozycji antykomunistycznej]].\n\
      \n[[Plik:Solidarity August 1980 gate of Gdańsk Shipyard.jpg|mały|upright|[[Sierpień\
      \ 1980|Strajk w Stoczni Gdańskiej]] (sierpień 1980)]]\n\nKolejne strajki wybuchły\
      \ w [[Sierpień 1980|lipcu i sierpniu 1980]]. Władze podjęły z protestującymi\
      \ rozmowy, w których wyniku podpisano [[porozumienia sierpniowe]]. Porozumienia\
      \ te gwarantowały m.in. powstanie legalnego związku zawodowego – [[Niezależny\
      \ Samorządny Związek Zawodowy „Solidarność”|NSZZ „Solidarność”]]. We wrześniu\
      \ 1980 Edward Gierek został odsunięty od władzy, a jego miejsce zajął [[Stanisław\
      \ Kania]], który jednak zrezygnował ze stanowiska w październiku 1981, zastąpił\
      \ go [[Wojciech Jaruzelski]]. Po ponad rocznym okresie względnej swobody politycznej,\
      \ 13 grudnia 1981 [[Rada Państwa (Polska)|Rada Państwa]] wprowadziła na obszarze\
      \ całego kraju [[Stan wojenny w Polsce (1981–1983)|stan wojenny]]; władzę ''de\
      \ facto'' przejęła [[Wojskowa Rada Ocalenia Narodowego]], ograniczono [[prawa\
      \ obywatelskie]], [[Internowanie|internowano]] liderów opozycji i in. Stan wojenny\
      \ zniesiono w 1983<ref name=\"igrzysko\">{{Cytuj książkę |nazwisko = Davies\
      \ |imię = Norman |tytuł = Boże igrzysko. Historia Polski |url = https://books.google.com/books?id=9Tbed6iMNLEC&printsec=frontcover&hl=pl&source=gbs_similarbooks_s&cad=1#v=onepage&q&f=true\
      \ |wydanie = 5 |wydawca = Znak |miejsce = Kraków |rok = 2006 |isbn = 83-2400-654-0\
      \ |język = en |data dostępu = 2010-08-18}}</ref><ref name=\"Polska. Losy państwa\
      \ i narodu 1939-1989\">{{Cytuj książkę |nazwisko = Friszke |imię = Andrzej |tytuł\
      \ = Polska. Losy państwa i narodu 1939–1945 |wydawca = Wydawnictwo Iskry |miejsce\
      \ = Warszawa |rok = 2003 |isbn = 83-207-1711-6 |strony = 91}}</ref><ref name=\"\
      Najnowsza historia Polski 1945–1980\">{{Cytuj książkę |nazwisko = Roszkowski\
      \ |imię = Wojciech |tytuł = Najnowsza historia Polski 1945–1980 |wydawca = Świat\
      \ Książki |miejsce = Warszawa |rok = 2003 |isbn = 83-7311-992-2 |strony = 634–648}}</ref>.\
      \ Od 1983 zaczął się wzrost [[PKB realny|PKB]], ale do końca dekady nie osiągnął\
      \ on poziomu z 1978<ref name=\"Dudek 19\"/>.\n\nW drugiej połowie dekady lat\
      \ 80. władze państwowe rozpoczęły proces demokratyzacji i liberalizacji życia\
      \ społeczno-politycznego; w 1988 m.in. utworzono urząd [[Rzecznik Praw Obywatelskich|Rzecznika\
      \ Praw Obywatelskich]], zaniechano zagłuszania audycji [[Radio Wolna Europa|Radia\
      \ Wolna Europa]], rozpoczęto [[II etap reformy gospodarczej]], Sejm przyjął\
      \ [[Ustawa Wilczka|ustawę Wilczka]], podjęto [[rozmowy w Magdalence]], premierem\
      \ został [[Mieczysław Rakowski]], odbyła się telewizyjna [[debata pomiędzy Alfredem\
      \ Miodowiczem i Lechem Wałęsą]], zawiązano [[Komitet Obywatelski „Solidarność”]].\
      \ W 1989 odbyły się obrady [[Okrągły Stół (Polska)|Okrągłego Stołu]], w wyniku\
      \ ustaleń których ponownie zarejestrowano NSZZ „Solidarność” i NSZZ RI „Solidarność”\
      \ oraz rozpoczęto przygotowania do „kontraktowych” [[Wybory parlamentarne w\
      \ Polsce w 1989 roku|wyborów parlamentarnych]], które uważa się za cezurę między\
      \ PRL i III RP.\n\n{{Zobacz też|Umowa graniczna pomiędzy Polską a ZSRR z 16\
      \ sierpnia 1945 roku|Gospodarka Polski Ludowej|Ludowe Wojsko Polskie|Partie\
      \ polityczne w Polsce Ludowej|Cenzura w Polskiej Rzeczypospolitej Ludowej|Propaganda\
      \ w Polskiej Rzeczypospolitej Ludowej}}\n\n=== III Rzeczpospolita ===\n{{Osobny\
      \ artykuł|Transformacja systemowa w Polsce|III Rzeczpospolita}}\n[[Plik:Podpisanie\
      \ traktatu UE.jpg|mały|Podpisanie przez prezydenta [[Aleksander Kwaśniewski|Aleksandra\
      \ Kwaśniewskiego]] traktatu dotyczącego przystąpienia Polski do [[Unia Europejska|Unii\
      \ Europejskiej]]]]\n\nW trakcie obrad [[Okrągły Stół (Polska)|Okrągłego Stołu]]\
      \ ustalono, że w wyborach parlamentarnych kandydaci opozycji będą mogli otrzymać\
      \ maksymalnie 35% miejsc w Sejmie oraz dowolną liczbę miejsc w Senacie. Władze\
      \ państwowe zobowiązały się również do dopuszczenia do utworzenia wolnych mediów\
      \ oraz do zakończenia represji wobec opozycjonistów. [[Wybory parlamentarne\
      \ w Polsce w 1989 roku|Pierwsze częściowo wolne wybory]] odbyły się 4 i 18 czerwca\
      \ 1989, w ich wyniku [[Komitet Obywatelski „Solidarność”]] otrzymał maksymalną\
      \ liczbę miejsc w Sejmie. 19 lipca 1989 gen. [[Wojciech Jaruzelski]] został\
      \ prezydentem wybranym przez Sejm. 24 sierpnia 1989 powstał pierwszy demokratyczny\
      \ [[rząd Tadeusza Mazowieckiego]].\n\nDemokratyczne władze Polski przeprowadziły\
      \ w czasie pierwszych lat III Rzeczypospolitej wiele istotnych zmian i reform.\
      \ Zmieniono nazwę państwa na Rzeczpospolita Polska i przywrócono do [[Godło\
      \ Polski|godła]] orła w koronie.\n\nRównocześnie pogarszała się sytuacja gospodarcza.\
      \ W wyniku ograniczenia inwestycji w latach 80. w 1989 zużycie maszyn i urządzeń\
      \ w przemyśle osiągnęło 64%. W okresie rządów Jaruzelskiego kupiono za granicą\
      \ 26 licencji, w latach 70. ponad 400. W pierwszym półroczu 1989 ponad połowę\
      \ wydatków państwa sfinansowano kredytem z NBP, czyli drukowaniem pieniędzy.\
      \ Rezerwy walutowe banków były bliskie zera. W wyniku porozumień Okrągłego Stołu\
      \ w lipcu 1989 wprowadzono ustawową [[Indeksacja płac|indeksację płac]] równoważącą\
      \ inflację. W sierpniu uwolniono ceny żywności – dotacje do nich osiągnęły prawie\
      \ 40% dochodów państwa. Uwolnione ceny żywności wzrosły gwałtownie, a za nimi\
      \ indeksowane płace, co umożliwiało dalszy wzrost cen i płac w warunkach niedoboru\
      \ towarów. [[Inflacja]] w okresie sierpień – październik osiągnęła 189% i ponad\
      \ 600% w całym 1989<ref name=\"Dudek 19\">{{Cytuj stronę |url = http://wyborcza.pl/alehistoria/7,121681,25260438,zniknelo-pare-miliardow-dolarow-zostaly-tylko-zapisy-w-1989.html\
      \ |tytuł = Fragment książki „Od Mazowieckiego do Suchockiej. Pierwsze rządy\
      \ wolnej Polski” |autor = [[Antoni Dudek]] |archiwum = https://web.archive.org/web/20191004034901/http://wyborcza.pl/alehistoria/7,121681,25260438,zniknelo-pare-miliardow-dolarow-zostaly-tylko-zapisy-w-1989.html\
      \ |zarchiwizowano = 2019-10-04 |data dostępu = 2019-10-17}}</ref>.\n\nW 1990\
      \ wprowadzono pakiet reform gospodarczych znanych jako [[plan Balcerowicza]],\
      \ w którym znacznie obniżono indeksację płac w celu obniżeniu inflacji (więcej\
      \ w [[Podatek od ponadnormatywnych wypłat wynagrodzeń|popiwek]]), wprowadzono\
      \ [[wolny rynek]] i obniżono [[deficyt budżetowy]].\n\n[[Wybory prezydenckie\
      \ w Polsce w 1990 roku|Wybory prezydenckich w 1990 roku]] wygrał Lech Wałęsa.\
      \ W 1990 zawarto [[polsko-niemiecki traktat graniczny]], potwierdzający [[Granica\
      \ na Odrze i Nysie Łużyckiej|granicę na Odrze i Nysie Łużyckiej]]. W tym samym\
      \ roku wybuchła [[Fundusz Obsługi Zadłużenia Zagranicznego|afera FOZZ]].\n\n\
      W 1997 przyjęto nową [[Konstytucja Rzeczypospolitej Polskiej|Konstytucję RP]]\
      \ określającą zasady działania państwa.\n\nKolejnymi prezydentami III Rzeczypospolitej\
      \ byli [[Aleksander Kwaśniewski]] (1995–2005), [[Lech Kaczyński]] (2005–2010),\
      \ który zginął w [[Katastrofa polskiego Tu-154 w Smoleńsku|katastrofie smoleńskiej]]\
      \ wraz z 95 innymi osobami<ref>{{Cytuj |url = https://web.archive.org/web/20100419212457/http://wiadomosci.gazeta.pl:80/Wiadomosci/1,80277,7780156,Prokuratura__zakonczono_sledztwo_w_miejscu_katastrofy.html\
      \ |autor = |tytuł = Prokuratura: zakończono śledztwo w miejscu katastrofy Tu-154M\
      \ |opublikowany = Gazeta.pl |data = 2010-04-16}}</ref>, [[Bronisław Komorowski]]\
      \ (2010–2015) i [[Andrzej Duda]] (od 2015). Od ukształtowania III RP w 1989\
      \ w kraju istniało [[Składy rządów polskich#Rządy III Rzeczypospolitej (od 1989)|18\
      \ ekip rządowych]], których działania doprowadziły do znacznego rozwoju państwa\
      \ i wzrostu poziomu życia jego mieszkańców. Strategicznym celem rządów pierwszego\
      \ dwudziestolecia III RP było wejście do [[NATO]] i [[Unia Europejska|Unii Europejskiej]],\
      \ co zostało osiągnięte odpowiednio w 1999 i 2004 roku. Polska odgrywa istotną\
      \ rolę w rozszerzonej Unii Europejskiej, czego znakiem było m.in. pełnienie\
      \ przez [[Jerzy Buzek|Jerzego Buzka]] w latach 2009–2012 funkcji [[Przewodniczący\
      \ Parlamentu Europejskiego|przewodniczącego Parlamentu Europejskiego]]<ref name=\"\
      igrzysko\"/> oraz pełnienie przez [[Donald Tusk|Donalda Tuska]] funkcji [[Przewodniczący\
      \ Rady Europejskiej|przewodniczącego Rady Europejskiej]] w latach 2014–2019.\n\
      \n== Miasta ==\n{{Związana kategoria|Miasta w Polsce}}\n\n== Ustrój polityczny\
      \ ==\n{{Osobny artykuł|Ustrój polityczny Polski}}\n\nNa podstawie [[Konstytucja\
      \ Rzeczypospolitej Polskiej|Konstytucji Rzeczypospolitej Polskiej]] z 1997 Polska\
      \ jest [[Demokracja parlamentarna|republiką parlamentarną]] z [[System parlamentarno-gabinetowy|systemem\
      \ parlamentarno-gabinetowym]], opierającą się na [[Podział władz|trójpodziale\
      \ władzy]].\n\n=== Konstytucja ===\n{{Osobny artykuł|Konstytucja Rzeczypospolitej\
      \ Polskiej}}\n\nKonstytucja Rzeczypospolitej Polskiej to najważniejszy [[akt\
      \ prawny]] w Polsce, uchwalony 2 kwietnia 1997 przez [[Zgromadzenie Narodowe\
      \ (Polska)|Zgromadzenie Narodowe]] i zatwierdzony w ogólnonarodowym [[Referendum\
      \ w Polsce w 1997 roku|referendum 25 maja 1997]]. Został ogłoszony w [[Dziennik\
      \ Ustaw|Dzienniku Ustaw]]: {{Dziennik Ustaw|1997|78|483}}, wszedł w życie 17\
      \ października 1997. Konstytucja złożona jest z [[Preambuła|preambuły]] i 13\
      \ rozdziałów, w tym 243 [[Artykuł (prawo)|artykuły]]. [[Konstytucja]] określa\
      \ charakter ustroju państwowego. Ukazuje sposób zorganizowania i działania głównych\
      \ organów państwa. Definiuje status prawny [[Obywatelstwo|obywateli]] i sposób\
      \ ich wpływania na politykę państwa.\n\n=== Władza ustawodawcza ===\n{{Osobny\
      \ artykuł|Sejm Rzeczypospolitej Polskiej|Senat Rzeczypospolitej Polskiej}}\n\
      [[Plik:Zgromadzenie posłów i senatorów 22 grudnia 2015 01.JPG|mały|[[Sala Posiedzeń\
      \ Sejmu]]]]\n[[Plik:I posiedzenie Senatu IX kadencji 01.JPG|mały|Sala Posiedzeń\
      \ [[Senat Rzeczypospolitej Polskiej|Senatu]]]]\n\n[[Władza ustawodawcza|Władzę\
      \ ustawodawczą]] stanowi dwuizbowy [[Parlament Rzeczypospolitej Polskiej|parlament]]\
      \ (Sejm – 460 posłów, Senat – 100 senatorów) wybierany w bezpośrednich, powszechnych\
      \ i tajnych [[Wybory parlamentarne w Polsce|wyborach parlamentarnych]] na 4-letnią\
      \ kadencję od dnia pierwszego posiedzenia. Jego głównym zadaniem jest stanowienie\
      \ prawa poprzez uchwalanie ustaw konstytucyjnych i zwykłych, w tym budżetowej,\
      \ a także ratyfikowanie umów międzynarodowych. W wyjątkowych przypadkach opisanych\
      \ w Konstytucji możliwe jest rozwiązanie Sejmu (a jednocześnie Senatu) przed\
      \ upływem końca kadencji przez głowę państwa lub uchwałę przyjętą większością\
      \ 2/3 głosów. Jego przedłużenie możliwe jest jedynie w czasie [[Stan wyjątkowy|stanu\
      \ wyjątkowego]] lub do 3 miesięcy po zakończeniu kadencji.\n\nOrganizację Sejmu\
      \ i Senatu, porządek prac oraz sposób powoływania i działalności ich organów\
      \ określają regulaminy uchwalone przez każdą z izb.\n\nSejm i Senat ze swego\
      \ grona wybierają marszałka i wicemarszałków, którzy tworzą [[prezydium]]. [[Marszałek\
      \ Sejmu Rzeczypospolitej Polskiej|Marszałek Sejmu]] jest najwyższym przedstawicielem\
      \ izby niższej parlamentu, przewodniczy obradom Sejmu oraz reprezentuje go na\
      \ zewnątrz. Sejm i Senat powołują również [[Komisja parlamentarna|komisje parlamentarne]]:\
      \ stałe, które mają za zadanie przygotowywanie projektów w dziedzinie ustawodawstwa\
      \ i kontroli (obecnie działa ich 39: 25 w Sejmie i 14 w Senacie) oraz nadzwyczajne,\
      \ powoływane w celu rozpatrzenia konkretnych spraw izby i ulegające rozwiązaniu\
      \ po wykonaniu zadania. Specjalnym rodzajem komisji nadzwyczajnej jest [[sejmowa\
      \ komisja śledcza]].\n\nPosłowie i senatorowie mogą tworzyć [[Klub (parlament)|kluby\
      \ parlamentarne]] składające się z co najmniej 15 parlamentarzystów, a posłowie\
      \ ponadto [[Koło (parlament)|koła poselskie]], dla utworzenia których potrzeba\
      \ 3 posłów.\n\nPrzewodniczący klubów parlamentarnych wraz z członkami prezydium\
      \ tworzą [[Konwent Seniorów]], organ zapewniający współdziałanie klubów poselskich\
      \ w sprawach związanych z działalnością i tokiem prac izb w polskim parlamencie.\
      \ Posłom i senatorom w okresie sprawowania przez nich mandatu przysługuje [[immunitet]].\n\
      \n{{Zobacz też|Zgromadzenie Narodowe (Polska)}}\n\n==== Proces legislacyjny\
      \ ====\n{{Osobny artykuł|Proces legislacyjny w Polsce}}\n\nPrawo [[Prawo inicjatywy\
      \ ustawodawczej|inicjatywy ustawodawczej]], na mocy art. 118 Konstytucji RP\
      \ i art. 32 [[Regulamin Sejmu Rzeczypospolitej Polskiej|Regulaminu Sejmu]],\
      \ przysługuje prezydentowi, rządowi, Senatowi, grupie 15 posłów lub komisji\
      \ sejmowej, a także grupie 100 tys. obywateli<ref name=\"konst rozdz 4\">{{Cytuj\
      \ stronę |url = http://www.sejm.gov.pl/prawo/konst/polski/4.htm |tytuł = Konstytucja\
      \ Rzeczypospolitej Polskiej |archiwum = https://web.archive.org/web/20100726070204/http://www.sejm.gov.pl/prawo/konst/polski/4.htm\
      \ |zarchiwizowano = 2010-07-26 |data dostępu = 2010-07-28}}</ref>. Projekt ustawy\
      \ trafia do tzw. [[Laska marszałkowska (Polska)|laski marszałkowskiej]]. Następnie\
      \ odbywają się trzy czytania w Sejmie. Ustawę przyjętą przez Sejm rozpatruje\
      \ Senat, który ma prawo zgłosić do niej poprawki lub ustawę odrzucić (po odrzuceniu\
      \ ustawa wraca do Sejmu, gdzie bezwzględną większością głosów w obecności co\
      \ najmniej 230 posłów można odrzucić sprzeciw Senatu). Uchwalona przez Sejm\
      \ i Senat ustawa trafia następnie do [[Prezydent Rzeczypospolitej Polskiej|Prezydenta\
      \ RP]], który może ją w ciągu 21 dni przyjąć i podpisać bądź zgłosić [[weto]]\
      \ i przekazać do ponownego rozpatrzenia Sejmowi (weto prezydenckie może być\
      \ odrzucone przez izbę niższą parlamentu większością 3/5 głosów w obecności\
      \ co najmniej 230 posłów) lub wystąpić do [[Trybunał Konstytucyjny (Polska)|Trybunału\
      \ Konstytucyjnego]] z wnioskiem o zbadanie jej zgodności z [[Konstytucja Rzeczypospolitej\
      \ Polskiej|Konstytucją]]. Podpisaną ustawę publikuje się w [[Dziennik Ustaw|Dzienniku\
      \ Ustaw Rzeczypospolitej Polskiej]].\n\n==== System prawny ====\n{{Osobny artykuł|System\
      \ prawny Polski}}\n\nSystem prawny w Polsce ma charakter tzw. prawa stanowionego,\
      \ tzn. nie wykorzystuje w procesie stosowania prawa zjawiska [[precedens]]u,\
      \ powszechnie występującego w [[Kraje anglosaskie|krajach anglosaskich]].\n\n\
      {{Zobacz też|Prawa człowieka w Polsce}}\n\n=== Władza wykonawcza ===\n{{Osobny\
      \ artykuł|Prezydent Rzeczypospolitej Polskiej|Rada Ministrów w Polsce}}\n[[Plik:Warszawa\
      \ Pałac Prezydencki 2011.jpg|mały|[[Pałac Prezydencki w Warszawie]]]]\n[[Plik:Gmach\
      \ Kancelarii Prezesa Rady Ministrów kwiecień 2017.jpg|mały|[[Gmach Kancelarii\
      \ Prezesa Rady Ministrów]]]]\n\nOrganami [[Władza wykonawcza|władzy wykonawczej]]\
      \ w Polsce są: Prezydent RP oraz Rada Ministrów<ref name=\"konst rozdz 1\">{{Cytuj\
      \ stronę |url = http://www.sejm.gov.pl/prawo/konst/polski/1.htm |tytuł = Konstytucja\
      \ Rzeczypospolitej Polskiej |archiwum = https://web.archive.org/web/20100717235413/http://www.sejm.gov.pl/prawo/konst/polski/1.htm\
      \ |zarchiwizowano = 2010-07-17 |data dostępu = 2010-07-28}}</ref>. Prezydent\
      \ jest wybierany w powszechnych [[Wybory prezydenckie w Polsce|wyborach prezydenckich]]\
      \ na 5-letnią kadencję (wygrywa ten kandydat, który otrzyma bezwzględną większość\
      \ głosów). Może on sprawować tę funkcję maksymalnie przez dwie kadencje. Według\
      \ Konstytucji Prezydent jest najwyższym przedstawicielem państwa w stosunkach\
      \ wewnętrznych i międzynarodowych, pełni funkcję zwierzchnika [[Siły Zbrojne\
      \ Rzeczypospolitej Polskiej|Sił Zbrojnych Rzeczypospolitej Polskiej]], stoi\
      \ na straży nienaruszalności i niepodzielności terytorium kraju oraz czuwa nad\
      \ przestrzeganiem Konstytucji. Do jego uprawnień należy, m.in. podpisywanie\
      \ ustaw przyjętych przez Sejm i Senat, ratyfikowanie umów międzynarodowych,\
      \ powoływanie sędziów, nadawanie [[Obywatelstwo polskie|obywatelstwa]] czy stosowanie\
      \ prawa łaski<ref name=\"Dz. U. z 2000 r. nr 47; poz. 544\">{{Cytuj stronę |url\
      \ = http://infor.pl/skany/spis.php?rodzaj=dzu&rok=2000&num=47&poz=544&str=0001\
      \ |tytuł = Dziennik Ustaw Rzeczypospolitej Polskiej nr 47 z roku 2000 |data\
      \ = 2000-06-12 |strony = 23 |archiwum = https://web.archive.org/web/20120121171628/http://infor.pl/skany/spis.php?rodzaj=dzu&rok=2000&num=47&poz=544&str=0001\
      \ |zarchiwizowano = 2012-01-21 |data dostępu = 2010-07-28}}</ref>.\n\nOrganem\
      \ doradczym Prezydenta RP w sprawach bezpieczeństwa państwa jest [[Rada Bezpieczeństwa\
      \ Narodowego]]. W sprawach szczególnie ważnych dla interesu państwa prezydent\
      \ może zwołać [[Rada Gabinetowa|Radę Gabinetową]] – wspólne posiedzenie głowy\
      \ państwa wraz z Radą Ministrów. W pełnieniu funkcji i wykonywaniu obowiązków\
      \ prezydentowi pomaga [[Kancelaria Prezydenta Rzeczypospolitej Polskiej|Kancelaria\
      \ Prezydenta RP]].\n\nRada Ministrów, czyli rząd, jest kolegialnym organem władzy\
      \ wykonawczej. W jego skład wchodzą: [[prezes Rady Ministrów]] (premier), [[Wiceprezes\
      \ Rady Ministrów|wicepremierzy]], [[Minister|ministrowie]] oraz przewodniczący\
      \ komitetów.\n\nTryb tworzenia rządu określony jest w Konstytucji RP, w myśl\
      \ której, prezydent desygnuje Radę Ministrów wraz z prezesem Rady Ministrów.\
      \ Premier w terminie 14 dni przedstawia Sejmowi program działania rządu ([[exposé]])\
      \ z wnioskiem o udzielenie [[wotum zaufania]] (poparcia). Sejm uchwala wotum\
      \ zaufania bezwzględną większością głosów w obecności co najmniej połowy ustawowej\
      \ liczby posłów. W przypadku, gdyby rządowi nie udzielono wotum zaufania, Sejm\
      \ w ciągu kolejnych 14 dni wybiera premiera oraz proponowanych przez niego członków\
      \ Rady Ministrów według takich samych reguł głosowania. Prezydent RP powołuje\
      \ tak wybrany rząd i odbiera przysięgę od jego członków. Na wypadek, gdyby w\
      \ takim trybie rząd nie został powołany, Konstytucja RP przewiduje inne rozwiązanie.\
      \ Prezydent w terminie 14 dni powołuje Prezesa RM i na jego wniosek członków\
      \ RM. Sejm w ciągu następnych 14 dni udziela jej wotum zaufania, tym razem większością\
      \ głosów. W razie nieudzielenia w takim trybie rządowi wotum zaufania, Prezydent\
      \ RP skraca kadencję Sejmu i zarządza nowe wybory.\n\n{{Zobacz też|Lista prezydentów\
      \ Polski|Prezes Rady Ministrów|Premierzy Polski|Składy rządów polskich|Administracja\
      \ rządowa w Polsce}}\n\n=== Władza sądownicza ===\n{{Osobny artykuł|Wymiar sprawiedliwości\
      \ w Polsce}}\n[[Plik:Warszawa 9471.jpg|mały|[[Kompleks Urbanistyczny Wymiaru\
      \ Sprawiedliwości]]]]\n\nOrganami wymiaru sprawiedliwości w Polsce są: [[Sąd\
      \ Najwyższy (Polska)|Sąd Najwyższy]], [[Sąd powszechny|sądy powszechne]] ([[Sąd\
      \ rejonowy|rejonowe]], [[Sąd okręgowy|okręgowe]] i [[Sąd apelacyjny|apelacyjne]])\
      \ oraz [[sądy szczególne]] ([[Sądy wojskowe (Polska)|sądy wojskowe]] i [[Sąd\
      \ administracyjny|administracyjne]] – wojewódzkie sądy administracyjne i [[Naczelny\
      \ Sąd Administracyjny]]). Wespół z [[Trybunał Stanu|Trybunałem Stanu]] i [[Trybunał\
      \ Konstytucyjny (Polska)|Trybunałem Konstytucyjnym]] tworzą niezawisłą [[Sąd|władzę\
      \ sądowniczą]].\n\nPodstawą władzy sądowniczej jest wyłącznie [[prawo]], niezależne\
      \ od innych organów państwowych. [[Sąd]]y i [[trybunał]]y wydają wyroki w imieniu\
      \ Rzeczypospolitej Polskiej, wszyscy sędziowie i członkowie trybunałów podlegają\
      \ wyłącznie Konstytucji RP i ustawom (a w wypadku Trybunału Konstytucyjnego\
      \ – wyłącznie Konstytucji). Sędziowie nie mogą należeć do żadnej partii politycznej\
      \ ani związków zawodowych (apolityczność). Nie wolno im również prowadzić działalności\
      \ publicznej sprzecznej z zasadami niezależności sądów i niezawisłości sędziów.\n\
      \nDo kompetencji wymiaru sprawiedliwości należy orzekanie w rozpoznawanych sprawach\
      \ z zakresu [[Prawo karne|prawa karnego]], [[Prawo cywilne|prawa cywilnego]]\
      \ i [[Prawo administracyjne|prawa administracyjnego]].\n\n{{Zobacz też|Sądy\
      \ wojskowe (Polska)}}\n\n=== Partie polityczne ===\n{{Osobny artykuł|Partie\
      \ polityczne w Polsce}}\n\nStatus prawny polskich partii politycznych określają:\
      \ [[Konstytucja Rzeczypospolitej Polskiej]] oraz ustawa z 27 czerwca 1997, w\
      \ której zapisana jest pełna definicja partii politycznej, brzmiąca następująco:\n\
      \n: ''Partia polityczna jest dobrowolną organizacją występującą pod określoną\
      \ nazwą, stawiającą sobie za cel udział w życiu publicznym poprzez wywieranie\
      \ metodami demokratycznymi wpływu na kształtowanie polityki państwa lub sprawowanie\
      \ władzy publicznej.''\n\nArtykuł 13 Konstytucji RP zakazuje istnienia partii\
      \ odwołujących się w swoich programach do [[Totalitaryzm|totalitarnych]] metod\
      \ i praktyk działania [[nazizm]]u, [[faszyzm]]u i [[komunizm]]u, a także tych,\
      \ których program lub działalność zakłada lub dopuszcza nienawiść rasową i narodowościową,\
      \ stosowanie przemocy w celu zdobycia władzy lub wpływu na politykę państwa\
      \ albo przewiduje utajnienie struktur lub członkostwa.\n\nKażda partia, która\
      \ nie łamie art. 13 Konstytucji, podlega wpisaniu do ewidencji partii politycznych\
      \ prowadzonej przez Sąd Okręgowy w Warszawie (wniosek musi być poparty przez\
      \ co najmniej tysiąc pełnoletnich obywateli). Ewidencja partii politycznych\
      \ jest jawna i dostępna dla każdego. Po wpisaniu do ewidencji partia ma moc\
      \ prawną i jest objęta ochroną prawną przewidzianą dla dóbr osobistych.\n\n\
      Według danych z 2020 roku zarejestrowanych jest 87 partii politycznych<ref name=\"\
      :2\">{{Cytuj |url = https://pkw.gov.pl/finansowanie-polityki/wykaz-partii-politycznych\
      \ |tytuł = Państwowa Komisja Wyborcza |opublikowany = pkw.gov.pl |data dostępu\
      \ = 2020-12-18 |archiwum = https://web.archive.org/web/20231202140955/https://pkw.gov.pl/finansowanie-polityki/wykaz-partii-politycznych\
      \ |zarchiwizowano = 2023-12-02}}</ref>.\n\n==== Partie w Sejmie od 2023 ====\n\
      Po [[Wybory parlamentarne w Polsce w 2023 roku|wyborach parlamentarnych w 2023\
      \ r]]. mandaty rozkładają się następująco w Sejmie<ref>{{Cytuj |tytuł = Wybory\
      \ do Sejmu i Senatu Rzeczypospolitej Polskiej w 2023 r. |data dostępu = 2024-04-01\
      \ |opublikowany = sejmsenat2023.pkw.gov.pl |url = https://sejmsenat2023.pkw.gov.pl/sejmsenat2023/pl/sejm/wynik/pl\
      \ |język = pl}}</ref><ref>{{Cytuj stronę | url = https://sejmsenat2023.pkw.gov.pl/sejmsenat2023/statics/PKW_AKTUALNOSCI/uploaded_files/1697617008_obwieszczenie-sejm.pdf\
      \ | tytuł = Obwieszczenie Państwowej Komisji Wyborczej z dnia 17 października\
      \ 2023 r. o wynikach wyborów do Sejmu Rzeczypospolitej Polskiej przeprowadzonych\
      \ w dniu 15 października 2023 r.  | data = 17 października 2023 | opublikowany\
      \ = wybory.gov.pl | data dostępu = 2023-12-12}}</ref>:\n* [[Prawo i Sprawiedliwość]]\
      \ (35,38%, 194 mandaty),\n* [[Koalicja Obywatelska]] (30,70%, 157 mandatów),\n\
      * [[Trzecia Droga (Polska)|Trzecia Droga]] (14,40%, 65 mandatów),\n* [[Nowa\
      \ Lewica]] (8,61%, 26 mandatów),\n* [[Konfederacja Wolność i Niepodległość]]\
      \ (7,16%, 18 mandatów)\n\n==== Komitety wyborcze w Senacie od 2023 ====\nPo\
      \ wyborach parlamentarnych w 2023 r. mandaty rozkładają się następująco w Senacie<ref>{{Cytuj\
      \ stronę | url = https://sejmsenat2023.pkw.gov.pl/sejmsenat2023/statics/PKW_AKTUALNOSCI/uploaded_files/1697634760_obwieszczenie-senat.pdf\
      \ | tytuł = Obwieszczenie Państwowej Komisji Wyborczej z dnia 17 października\
      \ 2023 r. o wynikach wyborów do Senatu Rzeczypospolitej Polskiej przeprowadzonych\
      \ w dniu 15 października 2023 r.  | data = 17 października 2023 | opublikowany\
      \ = wybory.gov.pl | data dostępu = 2023-12-12}}</ref><ref>{{Cytuj |tytuł = Rozkład\
      \ miejsc w sali posiedzeń listopad 2023 r. |data dostępu = 2023-12-12 |opublikowany\
      \ = Senat Rzeczypospolitej Polskiej |url = http://www.senat.gov.pl/gfx/senat/userfiles/_public/senatrp/211123.pdf}}</ref>:\n\
      * [[Koalicja Obywatelska]] – 41 senatorów\n* [[Prawo i Sprawiedliwość]] – 34\
      \ senatorowie\n* [[Trzecia Droga (Polska)|Trzecia Droga]] – 11 senatorów\n*\
      \ [[Nowa Lewica]] – 9 senatorów\n* [[Andrzej Dziuba (samorządowiec)|KWW Andrzej\
      \ Dziuba - pakt senacki]] - 1 senator\n* [[Zygmunt Frankiewicz|KWW Zygmunt Frankiewicz\
      \ - pakt senacki]] – 1 senator\n* [[Krzysztof Kwiatkowski (polityk)|KWW Krzysztof\
      \ Kwiatkowski - pakt senacki]] – 1 senator\n* [[Wadim Tyszkiewicz|KWW Wadim\
      \ Tyszkiewicz - pakt senacki]] – 1 senator\n* [[Józef Zając (matematyk)|KWW\
      \ Józefa Zająca]] - 1 senator\n\n== Polityka zagraniczna ==\n{{Osobny artykuł|Polityka\
      \ zagraniczna Polski}}\n\n=== Członkostwo w organizacjach międzynarodowych ===\n\
      {{Osobny artykuł|Polska w organizacjach międzynarodowych}}\n\n[[III Rzeczpospolita]]\
      \ jest członkiem wielu organizacji międzynarodowych. Polska jest jednym z członków\
      \ założycieli organizacji takich jak: [[Organizacja Narodów Zjednoczonych|ONZ]],\
      \ [[Środkowoeuropejskie Porozumienie o Wolnym Handlu]] (opuszczone w 2004 r.),\
      \ [[Rada Państw Morza Bałtyckiego]], [[Grupa Wyszehradzka]], [[Trójkąt Weimarski]]\
      \ czy [[Trójkąt Kaliningradzki]]. Polska należy do [[Unia Europejska|Unii Europejskiej]],\
      \ [[NATO]], [[Światowa Organizacja Handlu|Światowej Organizacji Handlu]], [[Organizacja\
      \ Współpracy Gospodarczej i Rozwoju|Organizacji Współpracy Gospodarczej i Rozwoju]],\
      \ [[Europejski Obszar Gospodarczy|Europejskiego Obszaru Gospodarczego]], [[Międzynarodowa\
      \ Agencja Energetyczna|Międzynarodowej Agencji Energetycznej]], [[Rada Europy|Rady\
      \ Europy]], [[Organizacja Bezpieczeństwa i Współpracy w Europie|Organizacji\
      \ Bezpieczeństwa i Współpracy w Europie]], [[Międzynarodowa Agencja Energii\
      \ Atomowej|Międzynarodowej Agencji Energii Atomowej]], [[Europejska Agencja\
      \ Kosmiczna|Europejskiej Agencji Kosmicznej]], [[Europejskie Obserwatorium Południowe]],\
      \ [[G6]], [[Wspólnota Demokracji|Wspólnoty Demokracji]], [[Inicjatywa Środkowoeuropejska|Inicjatywy\
      \ Środkowoeuropejskiej]], [[Trójmorze|Inicjatywy Trójmorza]], [[Komisja Ochrony\
      \ Środowiska Morskiego Bałtyku|Komisji Ochrony Środowiska Morskiego Bałtyku]]\
      \ oraz wszystkich [[Organizacje wyspecjalizowane ONZ|organizacji wyspecjalizowanych\
      \ ONZ]]. Polska jest też obserwatorem przy [[Rada Arktyczna|Radzie Arktycznej]],\
      \ [[Międzynarodowa Organizacja Frankofonii|Międzynarodowej Organizacji Frankofonii]].\
      \ Ponadto w związku z członkostwem w Unii Europejskiej należy do [[Układ z Schengen|układu\
      \ z Schengen]] i rozważa integrację ze [[Strefa euro|strefą euro]].\n\n=== Cele\
      \ polityki zagranicznej Polski ===\n[[Plik:Ministerstwo Spraw Zagraniczych al.\
      \ Szucha 23.JPG|mały|[[Ministerstwo Spraw Zagranicznych (Polska)|Ministerstwo\
      \ Spraw Zagranicznych]]]]\n\nPodstawowe cele polityki zagranicznej w latach\
      \ 90. XX wieku pozostawały niezmienne mimo zmian politycznych w parlamencie\
      \ i rządzie. Były to: członkostwo w [[NATO]] oraz [[Unia Europejska|Unii Europejskiej]],\
      \ współtworzenie stabilnego systemu bezpieczeństwa europejskiego opartego na\
      \ współdziałaniu NATO, [[Unia Zachodnioeuropejska|UZE]], [[Organizacja Bezpieczeństwa\
      \ i Współpracy w Europie|OBWE]] oraz [[Organizacja Narodów Zjednoczonych|ONZ]],\
      \ utrzymywanie dobrosąsiedzkich stosunków z państwami regionu, działanie na\
      \ rzecz współpracy regionalnej, zrównoważona polityka wobec Zachodu i Wschodu,\
      \ popieranie procesów rozbrojeniowych, ochrona tożsamości narodowej i dziedzictwa\
      \ kulturowego, rozwinięte kontakty z [[Polonia|Polonią]]<ref>{{Cytuj książkę\
      \ |autor = Kuźniar |autor2 = Szczepanik |tytuł = Polityka zagraniczna RP 1989–2002\
      \ |isbn = 83-8754-560-0}}</ref>.\n\nW początkach XXI wieku polityka zagraniczna\
      \ Polski koncentrowała się na czterech priorytetach: osiągnięciu członkostwa\
      \ w UE, umacnianiu bezpieczeństwa państwa, poprawie stosunków ekonomicznych\
      \ z zagranicą oraz umacnianie stabilności regionalnej i pozycji Polski w Europie\
      \ Środkowo-Wschodniej<ref>Exposé ministra [[Bronisław Geremek|Bronisława Geremka]]\
      \ z maja 2000, według {{Cytuj stronę |url = http://www.opracowania.info/readarticle.php?article_id=1566\
      \ |tytuł = Główne założenia polskiej polityki zagranicznej po 1989 r. |archiwum\
      \ = https://web.archive.org/web/20201208235245/http://www.opracowania.info/readarticle.php?article_id=1566\
      \ |zarchiwizowano = 2020-12-08 |data dostępu = 2008-12-07}}</ref>.\n\nMinister\
      \ [[Radosław Sikorski]] w exposé 7 maja 2008 sformułował kierunki polskiej polityki\
      \ zagranicznej w pięciu obszarach<ref>{{Cytuj stronę |url = http://www.psz.pl/index.php?option=com_content&task=view&id=10851\
      \ |tytuł = Polska/ Expose Sikorskiego nt. polskiej polityki zagranicznej |archiwum\
      \ = https://web.archive.org/web/20120515070839/http://www.psz.pl/index.php?option=com_content&task=view&id=10851\
      \ |zarchiwizowano = 2012-05-15 |data dostępu = 2008-12-07}}</ref>:\n* „Polska\
      \ silna mocą solidarnej Unii Europejskiej” (pełniejsze wykorzystywanie możliwości\
      \ wynikających z uczestnictwa w UE)\n* „rola Polski w światowym systemie bezpieczeństwa”\
      \ ([[bezpieczeństwo energetyczne]], dywersyfikacja źródeł i szlaków dostaw surowców,\
      \ zaangażowanie w działania stabilizacyjne NATO, modernizacja NATO, ulokowanie\
      \ elementów infrastruktury wojskowej Sojuszu w Polsce, rozszerzenie NATO o [[Ukraina|Ukrainę]]\
      \ i [[Gruzja|Gruzję]]);\n* „wzmocnienie wizerunku Polski na świecie”;\n* „Polonia”\
      \ (zwiększenie liczby urzędów konsularnych, reforma polskiego systemu edukacyjnego,\
      \ która pozwoli obywatelom na stałe mieszkającym za granicą na kontynuację nauki\
      \ w języku polskim oraz reedukację tych, którzy będą chcieli wrócić, głosowanie\
      \ korespondencyjne bądź przez Internet);\n* „nowoczesna służba dyplomatyczna”.\n\
      \n{{Zobacz też|Polska w Unii Europejskiej}}\n\n== Siły zbrojne ==\n[[Plik:K2\
      \ Tank Joins the Fight with eFP Battle Group Poland - 1.jpg|mały|Polski [[K2\
      \ Black Panther]]]]\n[[Plik:B-52 works with Polish F-16s.jpg|mały|Jeden z 48\
      \ polskich [[General Dynamics F-16 Fighting Falcon|F-16]]]]\n[[Plik:Próby morskie\
      \ ORP „Kormoran”.jpg|mały|[[ORP Kormoran (2015)|ORP Kormoran (601)]] – [[niszczyciel\
      \ min]] typu ''[[Niszczyciele min projektu 258|Kormoran II]]'']]\n{{Osobny artykuł|Siły\
      \ Zbrojne Rzeczypospolitej Polskiej}}\n\nSiły Zbrojne Rzeczypospolitej Polskiej\
      \ to główne określenie wojska polskiego, dzielącego się na: [[Wojska Lądowe]],\
      \ [[Siły Powietrzne]], [[Wojska Specjalne]], [[Marynarka Wojenna|Marynarkę Wojenną]]\
      \ oraz [[Wojska Obrony Terytorialnej]]. Ich głównym zadaniem jest obrona granic\
      \ Polski przed atakami z zewnątrz oraz współpraca z [[NATO]]. Polskie siły zbrojne\
      \ liczą około 164 000 żołnierzy w służbie czynnej (stan na rok 2023)<ref>{{Cytuj\
      \ stronę |url = https://www.gov.pl/web/obrona-narodowa/nowoczesne-wojsko--bezpieczna-ojczyzna\
      \ |tytuł = Nowoczesne wojsko – bezpieczna ojczyzna |autor = |opublikowany =\
      \ |data = 2023-03-09 |język = pl |data dostępu = 2023-06-03}}</ref>.\n\nWedług\
      \ rankingu ''Global Firepower'' (2020)<ref>{{Cytuj |tytuł = 2020 Poland Military\
      \ Strength |data dostępu = 2020-12-26 |opublikowany = globalfirepower.com |url\
      \ = https://www.globalfirepower.com/country-military-strength-detail.asp?country_id=poland}}</ref>\
      \ polskie siły zbrojne stanowią 21. siłę militarną na świecie i 6. w Europie\
      \ z rocznym budżetem na cele obronne w wysokości 12 mld dolarów (USD)<ref>{{Cytuj\
      \ |tytuł = European Military Strength (2020) |data dostępu = 2020-12-26 |opublikowany\
      \ = globalfirepower.com |url = https://www.globalfirepower.com/countries-listing-europe.asp}}</ref>.\n\
      \nGłównym zadaniem Sił Powietrznych jest prowadzenie operacji mających na celu\
      \ uzyskanie przewagi w powietrzu i wspieranie oddziałów innych Rodzajów Sił\
      \ Zbrojnych. Składają się z [[Wojska lotnicze|Wojsk Lotniczych]], [[Wojska Obrony\
      \ Powietrznej Kraju|Wojsk Obrony Przeciwlotniczej]] i [[Wojska radiotechniczne|Wojsk\
      \ Radiotechnicznych]]. Ich prekursorem były siły powietrzne [[Armia Polska we\
      \ Francji|Błękitnej Armii]] podczas I wojny światowej. Do 2004 nosiły nazwę:\
      \ Wojska Lotnicze i Obrony Powietrznej Rzeczypospolitej Polskiej.\n\nMarynarka\
      \ Wojenna odpowiada za obronę wybrzeża i [[Morze terytorialne|wód terytorialnych]].\
      \ Pod względem [[Jednostki organizacyjne Marynarki Wojennej|organizacyjnym]]\
      \ jest związkiem operacyjnym – [[Flota|flotą]]. Początek wojenno-morskiej obecności\
      \ Polski na Bałtyku datuje się na XV wiek, natomiast współczesne polskie siły\
      \ morskie powstały w 1918 po odzyskaniu niepodległości.\n\nW ramach sojuszu\
      \ NATO wojska [[Stany Zjednoczone|USA]] stacjonują w Polsce w [[Garnizon Orzysz|Orzyszu]],\
      \ [[Powidz (województwo wielkopolskie)|Powidzu]], [[Poznań|Poznaniu]], [[Świętoszów|Świętoszowie]],\
      \ [[Garnizon Żagań|Żaganiu]]<ref>{{Cytuj stronę |url = http://www.mon.gov.pl/aktualnosci/artykul/najnowsze/rozmieszczenie-sil-zbrojnych-usa-w-polsce-62016-11-05/\
      \ |tytuł = Rozmieszczenie Sił Zbrojnych USA w Polsce |opublikowany = mon.gov.pl\
      \ |archiwum = https://web.archive.org/web/20190128162822/http://www.mon.gov.pl/aktualnosci/artykul/najnowsze/rozmieszczenie-sil-zbrojnych-usa-w-polsce-62016-11-05/\
      \ |zarchiwizowano = 2019-01-28}}</ref><ref>{{Cytuj stronę |url = https://forsal.pl/artykuly/1055976,gdzie-stacjonuja-wojska-usa-w-europie-mapa.html\
      \ |tytuł = Wojsko USA w Europie. Tu stacjonują Amerykanie |opublikowany = forsal.pl\
      \ |archiwum = https://web.archive.org/web/20190209124232/https://forsal.pl/artykuly/1055976,gdzie-stacjonuja-wojska-usa-w-europie-mapa.html\
      \ |zarchiwizowano = 2019-02-09}}</ref>.\n\n{{Zobacz też|Polska w NATO|Współpraca\
      \ wojskowa Polski i Stanów Zjednoczonych|Wojsko Polskie w operacjach pokojowych}}\n\
      \n== Podział administracyjny ==\n{{Osobny artykuł|Podział administracyjny Polski}}\n\
      [[Plik:POLSKA mapa woj z powiatami.png|mały|upright=1.4|Mapa [[podział administracyjny\
      \ Polski|administracyjna Polski]]|alt=Mapa administracyjna Polski; zaznaczone\
      \ granice powiatów zgodnie ze stanem z dnia 1 stycznia 2007 roku. Kolorami wydzielone\
      \ szesnaście województw: dolnośląskie, kujawsko-pomorskie, lubelskie, lubuskie,\
      \ łódzkie, małopolskie, mazowieckie, opolskie, podkarpackie, podlaskie, pomorskie,\
      \ śląskie, świętokrzyskie, warmińsko-mazurskie, wielkopolskie i zachodniopomorskie]]\n\
      \nPolska jest państwem unitarnym<ref>Art. 3 Konstytucji.</ref>, a ustrój jej\
      \ władzy lokalnej opiera się na dualizmie, gdyż poza agendami administracji\
      \ rządowej istnieje [[samorząd terytorialny]]<ref>{{Cytuj książkę |nazwisko\
      \ = Garlicki |imię = Leszek |autor link = Lech Garlicki |tytuł = Polskie prawo\
      \ konstytucyjne |wydanie = 11 |wydawca = Liber |miejsce = Warszawa |rok = 2007\
      \ |strony = 299 |isbn = 978-83-7206-142-3}}</ref>, powołany do zadań publicznych\
      \ niezastrzeżonych dla innych organów władzy<ref>Art. 163 Konstytucji.</ref>.\
      \ Jego podstawową jednostkę stanowi [[Gmina (Polska)|gmina]]<ref>Art. 164 ust.\
      \ 1 Konstytucji.</ref>.\n\n{{Polska województwa 2|float=right}}\nOd 1 stycznia\
      \ 1999 obowiązuje trzystopniowy podział administracyjny kraju na\n\n* jednostki\
      \ I stopnia – 16 [[Województwo|województw]]\n* jednostki II stopnia – 380 ''[[Powiat\
      \ (Polska)|powiatów]]'', w tym:\n** 66 [[Miasto na prawach powiatu|miast na\
      \ prawach powiatu]] – gminy o statusie [[Miasto#Polska|miasta]], wykonujące\
      \ zadania powiatu, potocznie zwane „[[Powiat grodzki|powiatami grodzkimi]]”,\n\
      ** 314 [[Powiat (Polska)|powiatów]] – skupiają od kilku do kilkunastu sąsiadujących\
      \ ze sobą [[Gmina|gmin]], potocznie zwane „powiatami ziemskimi”; mogą mieć siedzibę\
      \ w mieście na prawach powiatu, które nie leży na ich obszarze\n* jednostki\
      \ III stopnia – 2477 [[Lista gmin w Polsce|gmin]], w tym:\n** 302 [[Gmina miejska|miejskie]]\
      \ – gminy, które zawierają się w administracyjnych granicach miasta (w tym 66\
      \ gmin będących jednocześnie miastami na prawach powiatu),\n** 711 [[Gmina miejsko-wiejska|miejsko-wiejskich]]\
      \ – gminy, w skład których wchodzi miasto oraz kilka wsi,\n** 1464 [[Gmina wiejska|wiejskich]]\
      \ – gminy, które na swoim terytorium nie zawierają miasta (z tego 158 takich\
      \ gmin ma siedzibę w [[Miasto|mieście]] poza swoim obszarem, tzw. [[gmina obwarzankowa]]).\n\
      \n(według stanu z 1 stycznia 2024<ref>{{Cytuj |tytuł = Raport: Liczba jednostek\
      \ podziału terytorialnego |data dostępu = 2023-10-01 |opublikowany = eteryt.stat.gov.pl\
      \ |url = https://eteryt.stat.gov.pl/eteryt/raporty/WebRaportZestawienie.aspx}}</ref>)\n\
      \n{{Zobacz też|Największe i najmniejsze jednostki terytorialne w Polsce}}\n\n\
      === Samorząd terytorialny ===\n{{Osobny artykuł|Samorząd terytorialny w Polsce}}\n\
      \nW Polsce wyróżnia się trójszczeblowy samorząd<ref name=\"G301\">{{Cytuj książkę\
      \ |autor = [[Lech Garlicki]] |tytuł = Polskie prawo konstytucyjne |wydanie =\
      \ 11 |wydawca = Liber |miejsce = Warszawa |rok = 2007 |strony = 301 |isbn =\
      \ 978-83-7206-142-3}}</ref>:\n* [[samorząd gminny]]\n* [[samorząd powiatowy]]\n\
      * [[samorząd województwa]].\nJednostki samorządu terytorialnego (gminy, powiaty\
      \ i województwa) mają osobowość prawną<ref>Art. 165 ust. 1 Konstytucji.</ref>\
      \ i zapewniony udział w dochodach publicznych<ref>Art. 167 Konstytucji.</ref>.\
      \ [[Wybory samorządowe w Polsce|Wybory do organów stanowiących]] są powszechne,\
      \ równe, bezpośrednie i przeprowadzane w głosowaniu tajnym<ref>Art. 169 ust.\
      \ 1 Konstytucji.</ref>.\n\n== Geografia ==\n{{Osobny artykuł|Geografia Polski}}\n\
      {{Polska mapa|float=right}}\n[[Plik:Physico-Geographical Regionalization of\
      \ Poland.png|mały|upright=1.1|Mapa [[Regionalizacja fizycznogeograficzna Polski|regionów\
      \ fizycznogeograficznych Polski]]]]\n[[Plik:Poland topo.jpg|mały|upright=1.1|Mapa\
      \ hipsometryczna Polski]]\n\nPolska zajmuje 9. miejsce w Europie pod względem\
      \ powierzchni oraz 8. pod względem liczby ludności. Na świecie Polska zajmuje\
      \ 70. miejsce pod względem powierzchni i 35. miejsce pod względem liczby ludności<ref>{{Cytuj\
      \ stronę |url = https://www.cia.gov/library/publications/the-world-factbook/rankorder/2147rank.html#pl\
      \ |tytuł = Miejsce Polski na świecie pod względem powierzchni |autor = CIA |opublikowany\
      \ = |język = en |archiwum = https://web.archive.org/web/20140209041128/https://www.cia.gov/library/publications/the-world-factbook/rankorder/2147rank.html#pl\
      \ |zarchiwizowano = 2014-02-09 |data dostępu =}}</ref><ref>{{Cytuj stronę |url\
      \ = https://www.cia.gov/library/publications/the-world-factbook/rankorder/2119rank.html#pl\
      \ |tytuł = Miejsce Polski na świecie pod względem ludności |autor = CIA |opublikowany\
      \ = |język = en |archiwum = https://web.archive.org/web/20181225082919/https://www.cia.gov/library/publications/the-world-factbook/rankorder/2119rank.html%20#pl\
      \ |zarchiwizowano = 2018-12-25 |data dostępu =}}</ref>. Długość [[Granice Polski|granic\
      \ Polski]] wynosi 3511&nbsp;km, w tym 440&nbsp;km przypada na granicę morską\
      \ (linia [[Wybrzeże|wybrzeża]] [[Morze Bałtyckie|Morza Bałtyckiego]], która\
      \ nie jest linią granicy państwa, wynosi 770&nbsp;km). Do obszaru kraju wlicza\
      \ się także [[morze terytorialne]], a specjalne prawa przysługują Polsce w tzw.\
      \ [[Strefa przyległa|strefie przyległej]]<ref>{{Cytuj stronę |url = http://wiadomosci.onet.pl/kraj/polska-bedzie-miala-nowe-granice-na-baltyku/b2b8hq\
      \ |tytuł = Polska będzie miała nowe granice na Bałtyku |opublikowany = wiadomosci.onet.pl\
      \ |archiwum = https://web.archive.org/web/20150715160209/http://wiadomosci.onet.pl/kraj/polska-bedzie-miala-nowe-granice-na-baltyku/b2b8hq\
      \ |zarchiwizowano = 2015-07-15}}</ref>.\n\nGraniczy z następującymi państwami<ref>{{Cytuj\
      \ pismo |nazwisko = Dmochowska (red.) |imię = Halina |tytuł = Warunki naturalne\
      \ i ochrona środowiska |url = http://stat.gov.pl/cps/rde/xbcr/gus/oz_maly_rocznik_statystyczny_2011.pdf\
      \ |czasopismo = Mały Rocznik Statystyczny Polski 2011 |strony = 26 |data = 2011-07-21\
      \ |wydawca = [[Główny Urząd Statystyczny]] |miejsce = Warszawa |issn = 1640-3630\
      \ |data dostępu = 2011-10-29}}</ref>:\n* od zachodu:\n** {{Państwo|Niemcy}}\
      \ (467&nbsp;km)\n* od południa:\n** {{Państwo|CZE}} (796&nbsp;km)\n** {{Państwo|SVK}}\
      \ (541&nbsp;km)\n* od wschodu:\n** {{Państwo|UKR}} (535&nbsp;km)\n** {{Państwo|BLR}}\
      \ (418&nbsp;km)\n* od północy:\n** {{Państwo|LTU}} (104&nbsp;km)\n** {{Państwo|RUS}}\
      \ (z {{flaga|RU-KGD}} [[Obwód królewiecki|obwodem królewieckim]], 210&nbsp;km).\n\
      Po roku 1945 dokonano drobnych [[Korekty granic Polski od 1945 roku|korekt granic\
      \ Polski]]. [[Granica polsko-słowacka#Korekta granicy w 2005 roku|Ostatnia korekta\
      \ granic]] miała miejsce w 2005 roku, ze Słowacją.\n\nW wymiarze północ-południe\
      \ Polska rozciąga się na długości 649&nbsp;km, to jest 5°50′. Powoduje to różnicę\
      \ w długości trwania dnia między północną i południową częścią Polski. Latem\
      \ na północy dzień jest dłuższy o ponad godzinę niż na południu, zimą – odwrotnie.\
      \ W wymiarze wschód-zachód rozpiętość Polski wynosi 689&nbsp;km, co w mierze\
      \ kątowej daje 10°02′. Powoduje to, że w dniach [[równonoc]]y na zachodnim krańcu\
      \ Polski Słońce zachodzi o 40 minut później niż na wschodnim.\n\nPolska leży\
      \ w strefie [[Czas środkowoeuropejski|czasu środkowoeuropejskiego]], jest to\
      \ czas słoneczny [[południk]]a 15° przebiegającego m.in. na zachód od [[Jelenia\
      \ Góra|Jeleniej Góry]], [[Zielona Góra|Zielonej Góry]] i [[Gorzów Wielkopolski|Gorzowa\
      \ Wielkopolskiego]] oraz na wschód od [[Szczecin]]a. Zimą obowiązuje czas środkowoeuropejski\
      \ ([[UTC+01:00]]), natomiast latem (od ostatniej niedzieli marca do ostatniej\
      \ niedzieli października) – [[czas środkowoeuropejski letni]] ([[UTC+02:00]]).\n\
      \n[[Geometryczny środek Polski]] znajduje się w [[Piątek (miasto)|Piątku]] koło\
      \ [[Łęczyca|Łęczycy]]. Najstarszy (1775) obliczony [[Środek Europy|geometryczny\
      \ środek Europy]] znajduje się w [[Suchowola|Suchowoli]] koło [[Sokółka|Sokółki]],\
      \ w województwie podlaskim. Przez Polskę przebiega również granica pomiędzy\
      \ kontynentalnym blokiem Europy Wschodniej a rozczłonkowaną przez morza wewnętrzne\
      \ Europą Zachodnią.\n\nWspółrzędne geograficzne skrajnych punktów Polski:\n\
      * 49°00′ [[Szerokość geograficzna|szer. geogr. N]] – szczyt [[Opołonek]],\n\
      * 54°50′ [[Szerokość geograficzna|szer. geogr. N]] – [[Jastrzębia Góra]]<ref\
      \ group=\"uwaga\">Najbardziej na północ wysuniętą latarnią morską w Polsce jest\
      \ latarnia na przylądku [[Rozewie]], położona niedaleko [[Władysławowo|Władysławowa]]\
      \ i czasem to Rozewiu przypisuje się – błędnie – skrajnie północne położenie\
      \ w Polsce; jest ona jednak o ok. 600 metrów mniej wysunięta w morze niż plaże\
      \ Jastrzębiej Góry.</ref> w [[Władysławowo (gmina)|gminie Władysławowo]],\n\
      * 14°07′ [[Długość geograficzna|dług. geogr. E]] – zakole [[Odra|Odry]] koło\
      \ [[Osinów Dolny|Osinowa Dolnego]],\n* 24°09′ [[Długość geograficzna|dług. geogr.\
      \ E]] – zakole [[Bug]]u koło [[Zosin (powiat hrubieszowski)|Zosina]].\n\n===\
      \ Ukształtowanie powierzchni ===\n{{Osobny artykuł|Krainy geograficzne w Polsce|Góry\
      \ w Polsce|Lista najwyższych szczytów górskich w Polsce}}\n[[Plik:Mezoregiony\
      \ Kondrackiego.png|mały|upright=1.1|[[Regionalizacja fizycznogeograficzna Polski|Mezoregiony\
      \ fizycznogeograficzne]] na tle podziału administracyjnego]]\n\nPrzeważającą\
      \ część obszaru kraju zajmują tereny [[Nizina|nizinne]] wschodniej części [[Nizina\
      \ Środkowoeuropejska|Niżu Środkowoeuropejskiego]], a średnia wysokość wynosi\
      \ 173 m [[n.p.m.]], [[mediana]] wysokości 149 m n.p.m. Krainy geograficzne w\
      \ Polsce ułożone są równoleżnikowo (pasowo), przechodząc od terenów nizinnych\
      \ na północy i w Polsce centralnej do terenów [[Wyżyna|wyżynnych]] i [[Góra|górskich]]\
      \ na południu. Polska ma 70 szczytów powyżej 2000 metrów wysokości, wszystkie\
      \ w [[Tatry|Tatrach]]. Najwyższym punktem kraju jest północno-zachodni wierzchołek\
      \ [[Rysy|Rysów]] w [[Tatry Wysokie|Tatrach Wysokich]] (2499,1 m n.p.m.), najniżej\
      \ położonym punktem jest [[Depresja (geografia)|depresja]] we wsi [[Marzęcino]]\
      \ na [[Żuławy Wiślane|Żuławach Wiślanych]] (–2,2 m n.p.m.)<ref>{{Cytuj |autor\
      \ = DC |tytuł = W najniższym punkcie Polski stanęła wieża triangulacyjna |data\
      \ dostępu = 2023-11-19 |opublikowany = geoforum.pl |url = https://geoforum.pl/news/34064/w-najnizszym-punkcie-polski-stanela-wieza-triangulacyjna\
      \ |język = pl}}</ref>.\n\nDominujący w krajobrazie [[Niż Polski]] zawiera następujące\
      \ części [[Nizina Środkowoeuropejska|Niżu Środkowoeuropejskiego]]: [[Pobrzeża\
      \ Południowobałtyckie]], [[Pojezierza Południowobałtyckie]], [[Niziny Sasko-Łużyckie]]\
      \ i [[Niziny Środkowopolskie]]. Północno-wschodnia część kraju zajmuje [[Pobrzeża\
      \ Wschodniobałtyckie]], [[Pojezierza Wschodniobałtyckie]] oraz [[Wysoczyzny\
      \ Podlasko-Białoruskie]]. [[Bug|Nadbużańskie]] krańce wschodnie znajdują się\
      \ na terenie [[Polesie|Polesia]] i [[Wyżyna Wołyńsko-Podolska|Wyżyny Wołyńsko-Podolskiej]].\
      \ [[Polesie]] wchodzi w skład [[Niż Wschodniobałtycko-Białoruski|Niżu Wschodniobałtycko-Białoruskiego]]\
      \ a [[Wyżyna Wołyńsko-Podolska]] stanowi zachodnią część [[Wyżyny Ukraińskie|Wyżyn\
      \ Ukraińskich]]. Pas wyżyn, starych gór i towarzyszących im obniżeń tworzą [[Masyw\
      \ Czeski]], tj. polska część [[Sudety|Sudetów]] z [[Przedgórze Sudeckie|Przedgórzem\
      \ Sudeckim]], oraz [[Wyżyny Polskie]], na które składają się [[Wyżyna Śląsko-Krakowska]],\
      \ [[Wyżyna Małopolska]] i [[Wyżyna Lubelsko-Lwowska]]. Podział [[Karpaty|Karpat]]\
      \ na terenie Polski obejmuje [[Karpaty Zachodnie]] z [[Podkarpacie Zachodnie|Podkarpaciem\
      \ Zachodnim]] i [[Podkarpacie Północne|Północnym]] ([[Kotlina Ostrawska]], [[Kotlina\
      \ Oświęcimska]], [[Brama Krakowska (makroregion)|Brama Krakowska]] i [[Kotlina\
      \ Sandomierska]]) oraz [[Karpaty Wschodnie]] z [[Podkarpacie Wschodnie|Podkarpaciem\
      \ Wschodnim]] ([[Płaskowyż Sańsko-Dniestrzański]]). Karpaty Zachodnie dzielą\
      \ się na [[Zewnętrzne Karpaty Zachodnie]] i [[Centralne Karpaty Zachodnie]]\
      \ a Karpaty Wschodnie to [[Zewnętrzne Karpaty Wschodnie]] nazywane również [[Beskidy\
      \ Wschodnie|Beskidami Wschodnimi]] ([[regionalizacja fizycznogeograficzna Polski]]\
      \ wg [[Jerzy Kondracki|Jerzego Kondrackiego]]).\n\n=== Wody śródlądowe ===\n\
      {{Osobny artykuł|Wody śródlądowe|Rzeki w Polsce|Jeziora w Polsce}}\n[[Plik:Polska\
      \ hydrografia2.jpg|mały|upright=1.1|Sieć hydrograficzna Polski]]\n[[Plik:Zlewiska-Zlewnie\
      \ Polski.png|mały|upright=1.1|Zlewiska Polski]]\n\nTerytorium Polski prawie\
      \ w całości znajduje się w zlewisku [[Morze Bałtyckie|Morza Bałtyckiego]] (99,7%),\
      \ z czego zdecydowana większość przypada na dorzecza [[Wisła|Wisły]] i [[Odra|Odry]].\
      \ Tylko z niewielkich terenów wody powierzchniowe odprowadzane są do [[Morze\
      \ Czarne|Morza Czarnego]] (górny bieg [[Czarna Orawa|Orawy]] i [[Strwiąż]]a\
      \ w [[Karpaty|Karpatach]]) oraz do [[Morze Północne|Morza Północnego]] (krótkie\
      \ odcinki [[Izera|Izery]] i [[Dzika Orlica|Dzikiej Orlicy]] oraz potok [[Szkło\
      \ (Petříkovický potok)|Szkło]] w tzw. Worku [[Okrzeszyn (województwo dolnośląskie)|Okrzeszyna]]\
      \ w [[Sudety|Sudetach]])<ref>{{Cytuj stronę |url = http://www.wiking.edu.pl/article.php?id=283\
      \ |tytuł = Wody śródlądowe w Polsce |opublikowany = Wydawnictwo Edukacyjne WIKING\
      \ |data dostępu = 2022-10-15}}</ref>. Najdłuższe rzeki w Polsce to [[Wisła]]\
      \ (o długości 1047&nbsp;km), [[Odra]] (854&nbsp;km, w granicach Polski 742&nbsp;km),\
      \ [[Warta]] (808&nbsp;km), [[Bug]] (772&nbsp;km; w granicach Polski 224&nbsp;km\
      \ plus odcinek graniczny 363&nbsp;km), [[Narew]] (484&nbsp;km; w granicach Polski\
      \ 448&nbsp;km; odcinek graniczny 1&nbsp;km) i [[San]] (443&nbsp;km, w tym odcinek\
      \ graniczny 55&nbsp;km).\n\nNajwiększe [[Jezioro|jeziora]] w Polsce to [[Śniardwy]]\
      \ (113,8&nbsp;km²) i [[Mamry]] (104&nbsp;km²) na [[Mazury|Mazurach]]. Są to\
      \ stosunkowo płytkie jeziora morenowe. Najgłębszym polskim jeziorem jest jezioro\
      \ [[Hańcza (jezioro)|Hańcza]] (108,5 m), nieco bardziej na wschód, na [[Suwalszczyzna|Pojezierzu\
      \ Wschodniosuwalskim]]. Są to głównie jeziora pochodzenia [[Lodowiec|lodowcowego]]\
      \ i są położone przede wszystkim w północnej części kraju, zgrupowane na obszarach\
      \ zwanych pojezierzami. Na terenie Polski występuje 7081 jezior o powierzchni\
      \ większej niż 1 ha<ref name=\"jeziora\">{{Cytuj książkę |nazwisko = Mordawski\
      \ |imię = Jan |tytuł = Geografia 3: geografia Polski: podręcznik dla liceum\
      \ ogólnokształcącego, liceum profilowanego i technikum: zakres podstawowy |rok\
      \ = 2003 |wydawca = Operon |isbn = 83-7390-004-7 |strony = 45}}</ref> (ich łączna\
      \ powierzchnia to 281 377 ha). W stosunku do roku 1954 liczba jezior zmniejszyła\
      \ się aż o 2215, czyli ponad 11%. Spowodowane to było szybkim zanikaniem najmniejszych\
      \ jezior. [[Jeziorność]] Polski wynosi tylko 0,9% powierzchni kraju<ref name=\"\
      jeziora2\">{{Cytuj książkę |nazwisko = Mordawski |imię = Jan |tytuł = Geografia\
      \ 3: geografia Polski: podręcznik dla liceum ogólnokształcącego, liceum profilowanego\
      \ i technikum: zakres podstawowy |rok = 2003 |wydawca = Operon |isbn = 83-7390-004-7\
      \ |strony = 43}}</ref>. Dla porównania w [[Szwecja|Szwecji]] jeziora zajmują\
      \ ponad 8,5% powierzchni, a jezior o powierzchni powyżej 2 akrów (ok. 0,81 ha)\
      \ jest tam ponad 97,5 tysiąca<ref name=\"szwecja\">{{Cytuj stronę |url = http://www.sverigeturism.se/smorgasbord/smorgasbord/natrecspo/nature/lakes.html\
      \ |tytuł = Lakes, Streams and Rivers |opublikowany = Smorgasbord |język = en\
      \ |archiwum = https://web.archive.org/web/20130801123417/http://www.sverigeturism.se/smorgasbord/smorgasbord/natrecspo/nature/lakes.html\
      \ |data dostępu = 2009-10-30}}</ref>.\n\n=== Gleby ===\nPokrywa [[Gleba|glebowa]]\
      \ w Polsce, podobnie jak niektóre inne elementy środowiska, ma cechy przejściowe\
      \ pomiędzy glebami charakterystycznymi dla Europy Zachodniej i Wschodniej. Powierzchniowo\
      \ dominują [[gleby strefowe]] (powstałe pod wpływem klimatu), jednak tworzą\
      \ one na terenie kraju mozaikę zależną głównie od podłoża geologicznego ([[Skała\
      \ macierzysta|skały macierzystej]]) oraz ukształtowania powierzchni. Około 52%\
      \ powierzchni zajmują [[gleby płowe]] oraz [[gleby brunatnoziemne]], zaś ok.\
      \ 26% powierzchni zajmują, powstałe na utworach piaszczystych, [[gleby rdzawe]],\
      \ [[Gleby bielicowe|bielicowe]] i [[Bielica|bielice]]. W dolinach rzecznych\
      \ dominują [[mady]] (ok. 5% powierzchni), w miejscach podmokłych lub wilgotnych\
      \ zaś można spotkać [[gleby organiczne]] ([[Gleby torfowe|torfowe]], [[Gleby\
      \ murszowe|murszowe]]), [[gleby glejowe]] i [[czarne ziemie]]. Wyraźne obszary\
      \ zajmują również, powstające na skałach węglanowych – [[Rędzina|rędziny]],\
      \ najbardziej [[Urodzajność gleby|urodzajne]] na obszarze Polski – [[czarnoziemy]],\
      \ charakterystyczne dla obszarów górskich – [[gleby inicjalne]] i [[Gleby słabo\
      \ ukształtowane|słabo ukształtowane]], a także powstałe pod dominującym wpływem\
      \ człowieka – [[gleby antropogeniczne]]<ref>{{Cytuj książkę |nazwisko = Mocek\
      \ (red.) |imię = Andrzej |tytuł = Gleboznawstwo |url = |wydanie = I |wydawca\
      \ = Wydawnictwo Naukowe PWN |miejsce = Warszawa |rok = 2015 |strony = 411–418\
      \ |rozdział = Geografia gleb Polski |nazwisko r = Bednarek |imię r = Renata\
      \ |nazwisko2 r = Skiba |imię2 r = Stefan |isbn = 978-83-01-17994-6}}</ref>.\n\
      \nW Polsce grunty rolne i leśne [[Klasyfikacja gruntów ornych w Polsce|klasyfikuje\
      \ się]] również pod kątem użytkowym. Według [[Bonitacja (gleboznawstwo)|bonitacyjnej\
      \ klasyfikacji gleb]] ornych i użytków zielonych w kraju powierzchniowo dominują\
      \ gleby średnie (klasa IIIa-IVb – 63% gruntów ornych i klasa III i IV – 51,2%\
      \ użytków zielonych), zaś najmniej jest gleb najlepszych (klasa I i II – 3,7%\
      \ gruntów ornych i 1,7% użytków zielonych)<ref>{{Cytuj książkę |nazwisko = Uziak\
      \ |imię = Stanisław |nazwisko2 = Klimowicz |imię2 = Zbigniew |tytuł = Elementy\
      \ geografii gleb i gleboznawstwa |wydawca = Wydawnictwo UMCS |miejsce = Lublin\
      \ |rok = 2002 |strony = 175–176 |isbn = 83-227-1671-0}}</ref>.\n\n=== Klimat\
      \ ===\n[[Plik:Temperatura-roczna-Polski.png|thumb|upright=1.1|Średnia roczna\
      \ temperatura powietrza]]\n[[Plik:Roczna suma opadów.png|thumb|upright=1.1|Roczna\
      \ suma opadów]]\n\nWedług klasyfikacji klimatów [[Wincenty Okołowicz|Wincentego\
      \ Okołowicza]] Polska leży w strefie [[Klimat umiarkowany|klimatu umiarkowanego]]\
      \ ciepłego przejściowego. W wyższych partiach [[Sudety|Sudetów]] i [[Karpaty|Karpat]]\
      \ występuje [[klimat górski]]. Natomiast zgodnie z [[Klasyfikacja klimatów Köppena|klasyfikacją\
      \ Köppena]], obszar Polski leży w strefie wilgotnego klimatu kontynentalnego\
      \ (''Dfb'')<ref name=\"updatedmap\">{{otwarty dostęp}} {{cytuj pismo |autor\
      \ = Peel, M.C. |autor2 = Finlayson, B.L. |autor3 = McMahon, T.A. |tytuł = Updated\
      \ world map of the Köppen-Geiger climate classification |czasopismo = Hydrol.\
      \ Earth Syst. Sci. |wolumin = 11 |wydanie = 5 |strony = 1633–1644 |rok = 2007\
      \ |doi = 10.5194/hess-11-1633-2007 |język = en| wydawca=Copernicus Publications\
      \ |issn = 1027-5606}}</ref>.\n\nŚrednia roczna temperatura waha się (okres referencyjny\
      \ 1991–2020) od około +7&nbsp;°C na Suwalszczyźnie ([[Suwałki]]: +7,2&nbsp;°C<ref\
      \ name=\"mm_Suwałki\">{{Cytuj stronę |url = http://meteomodel.pl/dane/srednie-miesieczne/?imgwid=354220195&par=tm&max_empty=2\
      \ |tytuł = Średnie i sumy miesięczne. Suwałki |praca = meteomodel.pl na podstawie\
      \ danych IMGW |język = pl |data dostępu = 2023-01-28}}</ref>) do blisko +10&nbsp;°C\
      \ na [[Nizina Śląska|Nizinie Śląskiej]] i [[Ziemia lubuska|ziemi lubuskiej]]\
      \ ([[Wrocław]]: +9,7&nbsp;°C<ref name=\"mm_Wrocław\">{{Cytuj stronę |url = http://meteomodel.pl/dane/srednie-miesieczne/?imgwid=351160424&par=tm&max_empty=2\
      \ |tytuł = Średnie i sumy miesięczne. Wrocław |praca = meteomodel.pl na podstawie\
      \ danych IMGW |język = pl |data dostępu = 2023-01-28}}</ref>, [[Legnica]], [[Zielona\
      \ Góra]], [[Opole]]: +9,6&nbsp;°C<ref name=\"mm_Opole\">{{Cytuj stronę |url\
      \ = http://meteomodel.pl/dane/srednie-miesieczne/?imgwid=350170530&par=tm&max_empty=2\
      \ |tytuł = Średnie i sumy miesięczne. Opole |praca = meteomodel.pl na podstawie\
      \ danych IMGW |język = pl |data dostępu = 2023-01-28}}</ref>).\n\nLatem temperatury\
      \ są zróżnicowane [[południk]]owo, choć amplituda nie jest tak duża jak zimą.\
      \ W lipcu średnie temperatury na nizinach wahają się od +17,9&nbsp;°C na północy\
      \ ([[Łeba]]<ref name=\"mm_Łeba\">{{Cytuj stronę |url = http://meteomodel.pl/dane/srednie-miesieczne/?imgwid=354170120&par=tm&max_empty=2\
      \ |tytuł = Średnie i sumy miesięczne. Łeba |praca = meteomodel.pl na podstawie\
      \ danych IMGW |język = pl |data dostępu = 2023-01-28}}</ref>) do +20,1&nbsp;°C\
      \ na południu (Wrocław<ref name=\"mm_Wrocław\" />, [[Tarnów]]<ref name=\"mm_Tarnów\"\
      >{{Cytuj stronę |url = http://meteomodel.pl/dane/srednie-miesieczne/?imgwid=350200575&par=tx25&max_empty=2\
      \ |tytuł = Średnie i sumy miesięczne. Tarnów |praca = meteomodel.pl na podstawie\
      \ danych IMGW |język = pl |data dostępu = 2023-01-28}}</ref>). Dużo chłodniej\
      \ jest w górach: obserwatorium na [[Śnieżka|Śnieżce]] w najcieplejszym miesiącu\
      \ notuje +9,9&nbsp;°C<ref name=\"mm_Śnieżka\">{{Cytuj stronę |url = http://meteomodel.pl/dane/srednie-miesieczne/?imgwid=350150510&par=tm&max_empty=2\
      \ |tytuł = Średnie i sumy miesięczne. Śnieżka |praca = meteomodel.pl na podstawie\
      \ danych IMGW |język = pl |data dostępu = 2023-01-28}}</ref>, a na [[Kasprowy\
      \ Wierch|Kasprowym Wierchu]] +8,9&nbsp;°C<ref name=\"mm_Kasprowy\">{{Cytuj stronę\
      \ |url = http://meteomodel.pl/dane/srednie-miesieczne/?imgwid=349190650&par=tm&max_empty=2\
      \ |tytuł = Średnie i sumy miesięczne. Kasprowy Wierch |praca = meteomodel.pl\
      \ na podstawie danych IMGW |język = pl |data dostępu = 2023-01-28}}</ref>. Zimą\
      \ różnice w temperaturach przybierają charakter [[równoleżnik]]owy z cieplejszym\
      \ zachodem i zimniejszym wschodem kraju, co ma związek z wpływem [[Ocean Atlantycki|Atlantyku]]\
      \ od zachodu i kontynentalnych mas powietrza ze wschodu. Do najcieplejszych\
      \ regionów w styczniu należą wybrzeża Bałtyku, którego wody łagodzą spadki temperatury.\
      \ W styczniu średnie temperatury kształtują się na nizinach od około –3,3&nbsp;°C\
      \ w Suwałkach<ref name=\"mm_Suwałki\" />, które uważane są za polski [[biegun\
      \ zimna]], przez –1,5&nbsp;°C w centrum kraju do nieco powyżej 0&nbsp;°C od\
      \ środkowej [[Odra|Odry]], przez [[Województwo lubuskie|lubuskie]] po pas wybrzeża\
      \ (z maksimum w [[Świnoujście|Świnoujściu]]: +0,8&nbsp;°C<ref name=\"mm_Świnoujście\"\
      >{{Cytuj stronę |url = http://meteomodel.pl/dane/srednie-miesieczne/?imgwid=353140200&par=tm&max_empty=2\
      \ |tytuł = Średnie i sumy miesięczne. Świnoujście |praca = meteomodel.pl na\
      \ podstawie danych IMGW |język = pl |data dostępu = 2023-01-28}}</ref>). W górach\
      \ najmroźniejszy zazwyczaj jest luty, gdzie na Kasprowym Wierchu notuje się\
      \ średnio –7,8&nbsp;°C<ref name=\"mm_Kasprowy\" />, a na Śnieżce –6,2&nbsp;°C<ref\
      \ name=\"mm_Śnieżka\" />.\n\nOpady roczne wynoszą około 600&nbsp;mm. Najniższe\
      \ – poniżej 550&nbsp;mm – notuje się w centrum kraju: w południowej i wschodniej\
      \ [[Wielkopolska|Wielkopolsce]], na [[Kujawy|Kujawach]] czy w dolinie środkowej\
      \ i dolnej [[Wisła|Wisły]], co związane jest z położeniem tych obszarów w [[Cień\
      \ opadowy|cieniu opadowym]] pojezierzy i wysoczyzn. Najwyższe – z wyjątkiem\
      \ gór – notuje się na środkowej części wybrzeża i na [[Wyżyna Śląska|Wyżynie\
      \ Śląskiej]] (około 750–800&nbsp;mm rocznie). W górach sumy opadów są znacznie\
      \ wyższe, osiągając maksimum w [[Tatry|Tatrach]] – nawet 1700&nbsp;mm rocznie<ref\
      \ name=\"mm_Kasprowy\" />.\n\nLiczba dni z pokrywą śnieżną jest zróżnicowana\
      \ i wzrasta w miarę przesuwania się na wschód. Na [[Nizina Szczecińska|Nizinie\
      \ Szczecińskiej]] pokrywa śnieżna zalega najkrócej, przez mniej niż 25 dni w\
      \ roku<ref name=\"mm_Szczecin\">{{Cytuj stronę |url = http://meteomodel.pl/dane/srednie-miesieczne/?imgwid=353140205&par=sndp&max_empty=2\
      \ |tytuł = Średnie i sumy miesięczne. Szczecin |praca = meteomodel.pl na podstawie\
      \ danych IMGW |język = pl |data dostępu = 2023-01-28}}</ref>, w centrum Polski\
      \ około 50 dni<ref name=\"mm_Warszawa\">{{Cytuj stronę |url = http://meteomodel.pl/dane/srednie-miesieczne/?imgwid=352200375&par=sndp&max_empty=2\
      \ |tytuł = Średnie i sumy miesięczne. Warszawa |praca = meteomodel.pl na podstawie\
      \ danych IMGW |język = pl |data dostępu = 2023-01-28}}</ref>, a na Suwalszczyźnie\
      \ przez ponad 75 dni<ref name=\"mm_Suwałki\" />. W najwyższych partiach gór\
      \ dni z pełną pokrywą śnieżną jest średnio nawet 180-220<ref name=\"mm_Śnieżka\"\
      \ /><ref name=\"mm_Kasprowy\" />.\n\n[[Okres wegetacyjny]] (dni ze średnią dobową\
      \ temperaturą powyżej +5&nbsp;°C) trwa przeciętnie od około 210 dni na północnym\
      \ wschodzie kraju (Suwalszczyzna)<ref name=\"mm_Suwałki\" /> do ponad 250 dni\
      \ w dolinie Odry i wzdłuż granicy z [[Niemcy|Niemcami]] (Wrocław<ref name=\"\
      mm_Wrocław\" />, [[Słubice]]<ref name=\"mm_Słubice\">{{Cytuj stronę |url = http://meteomodel.pl/dane/srednie-miesieczne/?imgwid=352140310&par=tm5&max_empty=2\
      \ |tytuł = Średnie i sumy miesięczne. Słubice |praca = meteomodel.pl na podstawie\
      \ danych IMGW |język = pl |data dostępu = 2023-01-28}}</ref>, [[Szczecin]]<ref\
      \ name=\"mm_Szczecin\" />).\n\nDni gorące, z temperaturą maksymalną powyżej\
      \ +25&nbsp;°C, występują od kwietnia do września, czasem także w październiku.\
      \ Jest ich od około 14-21 na wybrzeżu<ref name=\"mm_Łeba\" /><ref name=\"mm_Świnoujście\"\
      \ /> do ponad 50 na [[Podkarpacie|Podkarpaciu]]<ref name=\"mm_Tarnów\" />, [[Nizina\
      \ Śląska|Nizinie Śląskiej]]<ref name=\"mm_Wrocław\" /> i ziemi lubuskiej<ref\
      \ name=\"mm_Słubice\" />. Dni upalnych, z temperaturą maksymalną powyżej +30&nbsp;°C\
      \ notuje się od 2–3 na północy<ref name=\"mm_Łeba\" /><ref name=\"mm_Świnoujście\"\
      \ /> do 12–13 w okolicach Wrocławia<ref name=\"mm_Wrocław\" />, Opola<ref name=\"\
      mm_Opole\" />, Tarnowa<ref name=\"mm_Tarnów\" /> i Słubic<ref name=\"mm_Słubice\"\
      \ />. Wyjątkiem jest [[Mierzeja Helska|Półwysep Helski]], gdzie średnia z ostatnich\
      \ 30 lat wynosi zaledwie 0,7 dnia<ref name=\"mm_Hel\">{{Cytuj stronę |url =\
      \ http://meteomodel.pl/dane/srednie-miesieczne/?imgwid=354180135&par=tx30&max_empty=2\
      \ |tytuł = Średnie i sumy miesięczne. Hel |praca = meteomodel.pl na podstawie\
      \ danych IMGW |język = pl |data dostępu = 2023-01-28}}</ref>.\n\nRekordowe temperatury\
      \ powietrza zanotowane na terytorium Polski<ref name=\"mm_rekordy\">{{Cytuj\
      \ stronę |url = https://meteomodel.pl/rekordy-temperatury/ |tytuł = Rekordy\
      \ temperatury |praca = meteomodel.pl na podstawie danych IMGW |język = pl |data\
      \ dostępu = 2023-01-28}}</ref>:\n\nTemperatury maksymalne:\n* +40,2&nbsp;°C\
      \ ([[Prószków]] k. Opola, 29 lipca 1921),\n* +40,0&nbsp;°C ([[Zbiersk]], 29\
      \ lipca 1921),\n* +39,6&nbsp;°C ([[Kończewice (województwo kujawsko-pomorskie)|Kończewice]],\
      \ 11 lipca 1959),\n* +39,5&nbsp;°C ([[Słubice]], 30 lipca 1994),\n* +39,0&nbsp;°C\
      \ ([[Ceber (województwo dolnośląskie)|Ceber]], 8 sierpnia 2015),\n* +38,9&nbsp;°C\
      \ ([[Silniczka]], 8 sierpnia 2013),\n* +38,3&nbsp;°C ([[Słubice]], 19 czerwca\
      \ 2022).\n\nTemperatury minimalne:\n* –40,6&nbsp;°C ([[Żywiec]], 11 lutego 1929),\n\
      * –40,4&nbsp;°C ([[Olkusz]], 11 lutego 1929),\n* –40,1&nbsp;°C ([[Sianki (Polska)|Sianki]],\
      \ 11 lutego 1929),\n* –39,3&nbsp;°C ([[Sanok]], 28 lutego 1963),\n* –38,7&nbsp;°C\
      \ ([[Białowieża]], 11 stycznia 1950),\n* –38,6&nbsp;°C ([[Lubaczów]], 28 lutego\
      \ 1963),\n* –38,3&nbsp;°C ([[Maniowy]], 28 lutego 1963).\n{{Zobacz też|Rekordy\
      \ klimatyczne w Polsce}}\n\n== Budowa geologiczna ==\n[[Plik:Sudety-1-38.jpg|mały|[[Błędne\
      \ Skały]] w [[Góry Stołowe|Górach Stołowych]] – zróżnicowane morfologicznie\
      \ odsłonięcia [[Piaskowiec|piaskowców]], jedna z ciekawszych formacji geologicznych\
      \ Polski]]\n\nNa obszarze Polski stykają się trzy wielkie jednostki tektoniczne:\n\
      # [[Platforma wschodnioeuropejska|platforma prekambryjska]] wschodniej Europy\
      \ (wschodnia i północno-wschodnia Polska);\n# [[platforma zachodnioeuropejska]]\
      \ (patrz [[Pozaalpejska Europa Środkowa]]). Spod pokrywy osadowej tej platformy\
      \ wyłaniają się części [[Górotwory kaledońskie|górotworów kaledońskich]] i [[Górotwory\
      \ hercyńskie|hercyńskich]] ([[Sudety]] i [[Góry Świętokrzyskie]]); oddziela\
      \ ją od platformy prekambryjskiej szeroka [[Szew transeuropejski|strefa szwu\
      \ transeuropejskiego]] (TESZ);\n# [[alpidy]] ([[Karpaty]] z [[Podkarpacie]]m)\
      \ – częściowo nasunięte na obszar platformy zachodnioeuropejskiej.\nNiemal cały\
      \ [[Niż Polski]] przykryty jest grubą warstwą osadów polodowcowych – glin i\
      \ żwirów na obszarach [[Morena|morenowych]], piasków na terenach [[sandr]]ów.\
      \ Dna dolin rzecznych i obszary ich delt zbudowane są z [[Aluwium|aluwiów]],\
      \ na niektórych terenach występują też złoża [[torf]]owe. Odsłonięcia [[Skała|skał\
      \ litych]], wyłącznie [[Skały osadowe|osadowych]], liczniej pojawiają się w\
      \ pasie wyżyn. Na [[Wyżyna Śląsko-Krakowska|Wyżynie Śląsko-Krakowskiej]] są\
      \ to głównie [[Wapień|wapienie]], zaś w [[Niecka Nidziańska|Niecce Nidziańskiej]]\
      \ – [[gips]]y, dzięki czemu w obu tych regionach intensywnie rozwijają się zjawiska\
      \ [[Kras (geologia)|krasowe]], w tym jaskinie. Wyjątkowo zróżnicowaną budową\
      \ geologiczną cechuje się najwyższa część polskich wyżyn – [[Góry Świętokrzyskie]].\
      \ Znaczna część z nich zbudowana jest z [[Piaskowiec kwarcytowy|piaskowców kwarcytowych]],\
      \ ale pojawiają się tu również wapienie, [[Zlepieniec|zlepieńce]], [[Dolomit\
      \ (skała)|dolomity]] i [[Łupek|łupki]]. We wschodniej i południowo-wschodniej\
      \ części Wyżyn Polskich wapienie, łupki i piaskowce przykryte są często grubymi\
      \ warstwami lessów i niewiele jest naturalnych odsłonięć skał litych. Najbardziej\
      \ zróżnicowaną budową geologiczną charakteryzują się Sudety, gdzie obok masywów\
      \ zbudowanych ze [[Skały krystaliczne|skał krystalicznych]], zwłaszcza [[granit]]ów,\
      \ występują też ślady zjawisk wulkanicznych ([[bazalt]]y i [[porfir]]y), liczne\
      \ odsłonięcia skał piaskowcowych i soczewki wapieni. Zwłaszcza sudeckie granity\
      \ i piaskowce tworzą liczne formy geomorfologiczne w postaci skałek o zróżnicowanych\
      \ kształtach. O wiele mniej zróżnicowaną budową geologiczną cechują się polskie\
      \ Karpaty, w większości zbudowane z miękkich skał osadowych, wchodzących w skład\
      \ [[Flisz karpacki|fliszu]] – piaskowców i łupków. Na ich tle wyróżniają się\
      \ dwa odmiennie litologiczne pasma – Pieniny, zbudowane z wapieni, oraz najwyższe\
      \ góry Polski, Tatry, których wschodnia część zbudowana jest z granitów, zaś\
      \ zachodnia głównie ze skał osadowych – silnie skrasowiałych wapieni (wykształciły\
      \ się w nich najgłębsze i najdłuższe jaskinie Polski), lokalnie przykrytych\
      \ czapami skał krystalicznych.\n\n== Środowisko naturalne ==\nŚrodowisko przyrodnicze\
      \ Polski jest urozmaicone. Większą część północnej granicy Polski oblewa [[Morze\
      \ Bałtyckie]], dalej zaś w kierunku południowym rozciągają się: pojezierza i\
      \ rozległe niziny. Na południu z kolei występują obszary wyżynne i dwa łańcuchy\
      \ górskie: [[Karpaty]] i [[Sudety]], zamykające południową granicę Polski<ref>Elżbieta\
      \ Kobojek, Sławomir Kobojek, Zbigniew Rdzany, Maciej Ziułkiewicz: Polska Środowisko\
      \ Przyrodnicze, Wydawnictwo Pascal, {{ISBN|83-7304-377-2}}.</ref>. W 2014 w\
      \ rankingu ''Environmental Performance Index'' (EPI) dotyczącym czystości i\
      \ jakości środowiska naturalnego na świecie Polska zajęła 30 miejsce<ref>{{Cytuj\
      \ |tytuł = Environmental Performance Index (EPI) 2014: Szwajcaria najczystszym\
      \ krajem, Polska na 30. miejscu |url = http://podroze.onet.pl/aktualnosci/environmental-performance-index-epi-2014-szwajcaria-najczystszym-krajem-polska-na-30/wc3w7\
      \ |opublikowany = Onet.pl |data = 2014-02-11 |archiwum = https://archive.is/20140212102510/http://podroze.onet.pl/aktualnosci/environmental-performance-index-epi-2014-szwajcaria-najczystszym-krajem-polska-na-30/wc3w7\
      \ |zarchiwizowano = 2014-02-12 |data dostępu = 2014-02-12}}</ref>, a 10 lat\
      \ później 19 miejsce<ref>{{Cytuj |tytuł =Environmental Performance Index 2024\
      \  |url = https://epi.yale.edu/measure/2024/EPI |opublikowany = EPI |data dostępu\
      \ = 2024-09-27}}</ref>.\n\n=== Flora ===\n{{Osobny artykuł|Szata roślinna Polski}}\n\
      [[Plik:Słowiński PN-wydmy.jpg|mały|Ruchome wydmy w [[Słowiński Park Narodowy|Słowińskim\
      \ Parku Narodowym]]]]\n\nW Polsce lasy zajmują powierzchnię ponad 9,2 mln ha,\
      \ czyli 29,7% powierzchni kraju. Lasów w Polsce cały czas przybywa. Odpowiada\
      \ za to ''„Krajowy program zwiększania lesistości”'', zakładający wzrost [[Lesistość|lesistości]]\
      \ do 33% w 2050<ref>{{Cytuj stronę |url = http://www.lasy.gov.pl/nasze-lasy/polskie-lasy\
      \ |tytuł = Polskie lasy |opublikowany = lasy.gov.pl |data = 2024-09-02 |archiwum\
      \ = https://web.archive.org/web/20160320074628/http://www.lasy.gov.pl/nasze-lasy/polskie-lasy\
      \ |zarchiwizowano = 2016-03-20 | data dostępu = 2024-09-27}}</ref>. Największym\
      \ kompleksem leśnym w Polsce są [[Bory Dolnośląskie]]. Na tle innych krajów\
      \ Europy Środkowej, w Polsce zachowały się rozległe obszary bagien, mokradeł\
      \ i torfowisk. Należą do nich m.in. chronione prawnie [[Bagna Biebrzańskie]]\
      \ – siedliska hydrogeniczne zajmują ponad 40% powierzchni [[Biebrzański Park\
      \ Narodowy|Biebrzańskiego Parku Narodowego]]<ref>{{Cytuj stronę |url = http://www.biebrza.org.pl/48,roslinnosc.html\
      \ |tytuł = Biebrzański Park Narodowy. Roślinność |opublikowany = biebrza.org.pl\
      \ |archiwum = https://web.archive.org/web/20161116093637/http://www.biebrza.org.pl/48,roslinnosc.html\
      \ |zarchiwizowano = 2016-11-16}}</ref>.\n\nW Polsce występuje blisko 3000 rodzimych\
      \ i trwale zadomowionych [[takson]]ów w randze [[Gatunek (biologia)|gatunku]]\
      \ i podgatunku roślin [[Okrytonasienne|okrytonasiennych]] (''Magnoliophyta'')<ref>{{Cytuj\
      \ książkę |nazwisko = Mirek |imię = Z. |nazwisko2 = Piekos-Mirkowa |imię2 =\
      \ H. |nazwisko3 = Zając |imię3 = A i M. |tytuł = Flowering plants and Pteridophytes\
      \ of Poland – a checklist. Krytyczna lista roślin naczyniowych Polski |rok =\
      \ 2002 |wydawca = IB PAN |miejsce = Kraków |isbn = 83-85444-83-1}}</ref>. Poza\
      \ tym występuje 67 gatunków [[Paprotniki|paprotników]] (''Pteridophyta''), 910\
      \ gatunków [[Mszaki|mszaków]] (''Bryophyta''), 2000 gatunków [[Zielenice|zielenic]]\
      \ (''Chlorophyta''), 25 gatunków [[Ramienicowce|ramienic]] i 39 gatunków [[Krasnorosty|krasnorostów]]\
      \ (''Rhodophyta'')<ref>{{Cytuj książkę |nazwisko = Andrzejewski |imię = R. |nazwisko2\
      \ = Weigle |imię2 = A. |tytuł = Polskie studium różnorodności biologicznej |rok\
      \ = 1992 |wydawca = Narodowa Fundacja Ochrony Środowiska |isbn = 83-85908-01-3}}</ref>.\
      \ Z uwagi na krótką historię ewolucyjną ziem polskich, wynikającą z [[Zlodowacenia\
      \ na terenie Polski|plejstoceńskich zlodowaceń]], krajowa flora uboga jest w\
      \ endemity. Należą do nich [[wiechlina granitowa]], [[mniszek pieniński]], [[przytulia\
      \ krakowska]] i [[warzucha polska]].\n\n=== Fauna ===\n{{Osobny artykuł|Fauna\
      \ Polski}}\n[[Plik:Wisent.jpg|mały|[[Żubr europejski|Żubr]] w [[Puszcza Białowieska|Puszczy\
      \ Białowieskiej]]]]\n\n[[Fauna]] Polski należy do [[Prowincja europejsko-zachodniosyberyjska|prowincji\
      \ europejsko-zachodniosyberyjskiej]], wchodzącej w skład [[Kraina palearktyczna|Palearktyki]].\
      \ Należy ona do średnio zróżnicowanych pod względem gatunkowym i reprezentowana\
      \ jest przez ok. 33 tys. gatunków zwierząt (są szacunki, które mówią, iż po\
      \ dokładnej analizie będzie to liczba znacznie wyższa, dochodząca do 47 tys.).\
      \ Znaczna część spośród tych gatunków występuje (lub występowała – jak [[Żubr\
      \ europejski|żubr]]) nie tylko w Polsce, ale też innych obszarach Europy.\n\n\
      Na terenie kraju występuje ponad 90 gatunków [[Ssaki|ssaków]]<ref name=\"ssaki\"\
      >W różnych źródłach podawane są odmienne liczby gatunków ssaków żyjących na\
      \ terenie Polski: od 89 do 107.</ref>, 444 gatunki [[Ptaki|ptaków]] (z czego\
      \ ok. 220 lęgowych), 9 gatunków [[Gady|gadów]], 18 – [[Płazy|płazów]], 119 gatunków\
      \ [[Ryby|ryb]] (w tym 55 słodkowodnych), 5 gatunków [[Bezżuchwowce|bezżuchwowców]],\
      \ ok. 260 gatunków [[Mięczaki|mięczaków]], 25–30 tysięcy gatunków [[Owady|owadów]],\
      \ ok. 1400 gatunków [[Pajęczaki|pajęczaków]], ok. 240 gatunków [[Pierścienice|pierścienic]],\
      \ 5 – [[Jamochłony|jamochłonów]], 8 – [[Gąbki|gąbek]] oraz ok. 4 tysięcy gatunków\
      \ [[Pierwotniaki|pierwotniaków]].\n\nPod względem występowania gatunków zwierząt\
      \ Polska dzieli się na 7 [[Krainy zoogeograficzne|krain zoogeograficznych]]:\
      \ [[Kraina południowobałtycka|południowobałtycką]], [[Kraina śląska|śląską]],\
      \ [[Kraina opolska|opolską]], [[Kraina kielecka|kielecką]], [[Kraina karpacko-sudecka|karpacko-sudecką]],\
      \ [[Kraina Jury polskiej|krainę Jury polskiej]] i [[Kraina podalpejska|podalpejską]].\n\
      \n[[Plik:Male Moose.jpg|mały|W Polsce [[Alceini|Łosie]] licznie występują na\
      \ [[Podlasie|Podlasiu]]]]\n[[Plik:White Stork (Ciconia ciconia) (8079450901).jpg|mały|[[Bocian\
      \ biały]] – największa na świecie populacja gniazduje w Polsce (według danych\
      \ z 2004 roku)<ref>{{Cytuj stronę |url = http://bocian.org.pl/programy/bocian-bialy.\
      \ |tytuł = Bocian – Programy |opublikowany = bocian.org.pl |archiwum = https://web.archive.org/web/20140731144346/http://bocian.org.pl/programy/bocian-bialy.\
      \ |zarchiwizowano = 2014-07-31}}</ref>]]\n\nSkład gatunkowy polskiej fauny ukształtował\
      \ się dopiero po ostatnim [[Zlodowacenie|zlodowaceniu]], kiedy to po ustąpieniu\
      \ [[Lodowiec|lodowców]] z terenów południowych napłynęły nowe gatunki zwierząt.\
      \ Dlatego polska fauna uboga jest w [[endemit]]y – ich przykładami są, występujące\
      \ tylko w Tatrach, chruścik ''[[Allogamus starmachi|Allogammus starmachi]]'',\
      \ a także chrząszcz [[goroń tatrzański]]. Także w czasach historycznych zmieniała\
      \ się lista zwierząt żyjących na terenie kraju: niektóre gatunki zostały wytępione\
      \ przez człowieka (np. [[Tur leśny|tury]], [[Tarpan dziki (podgatunek)|tarpany]])\
      \ lub ustąpiły na skutek jego działalności, m.in. niszczenia siedlisk ([[drop]],\
      \ [[perłoródka rzeczna]], [[Kulon (zwyczajny)|kulon]], [[Jesiotr ostronosy|jesiotr]],\
      \ [[skrzelopływka bagienna]]), inne zaś dołączyły do krajowych gatunków na skutek\
      \ naturalnej ekspansji ([[dzięcioł białoszyi]], [[pliszka cytrynowa]], [[szakal\
      \ złocisty]], [[karlik średni]]). Teren Polski został również skolonizowany\
      \ przez gatunki obce, zawleczone przez człowieka, czy to na drodze świadomej\
      \ introdukcji (np. [[bażant]]y, [[Muflon śródziemnomorski|muflony]], [[Daniel\
      \ zwyczajny|daniele]], [[amur biały]]), czy to w wyniku przypadku ([[Jenot azjatycki|jenoty]],\
      \ [[Piżmak amerykański|piżmaki]], [[Wizon amerykański|norki amerykańskie]],\
      \ ostatnio też [[Szop pracz|szopy pracze]], z [[Owady|owadów]] m.in. [[Stonka\
      \ ziemniaczana|stonki]]). Obecnie obserwuje się rekolonizację Polski przez zwierzęta\
      \ znajdujące się uprzednio na skraju wytępienia w granicach kraju, dotyczy to\
      \ zwłaszcza dużych ssaków ([[Wilk szary|wilk]], [[Bóbr europejski|bóbr]]), kraj\
      \ ten jest również ostoją wyjątkowo dużych populacji gatunków ginących w wielu\
      \ innych krajach Europy ([[bocian biały]], [[Wodniczka (ptak)|wodniczka]]).\
      \ Polska jest również krajem, w którym [[Żubr europejski|żubr]] został uratowany\
      \ przed całkowitym wymarciem w skali globalnej – tutaj rozpoczęto hodowlę ostatnich\
      \ osobników, odnalezionych w ogrodach zoologicznych i zwierzyńcach po I Wojnie\
      \ Światowej i tutaj [[Reintrodukcja|reintrodukowano]] po raz pierwszy gatunek\
      \ do naturalnych siedlisk. Niektóre gatunki w polskiej faunie są jednak nadal\
      \ na skraju wymarcia (np. [[Kraska (ptak)|kraska]], [[dzierzba czarnoczelna]],\
      \ [[wąż Eskulapa]]).\n\nWiększość gatunków obecnie występujących w Polsce stanowią\
      \ zwierzęta [[Las|leśne]] strefy lasów liściastych (jak [[Jeleń szlachetny|jelenie]],\
      \ [[Sarna|sarny]], [[Dzik euroazjatycki|dziki]]). W północno-wschodniej części\
      \ Polski żyją też gatunki typowe dla strefy [[Tajga|tajgi]], a nawet [[Tundra|tundry]]\
      \ (np. [[Mszarnik jutta|mszarniki jutta]], [[Puszczyk mszarny|puszczyki mszarne]],\
      \ [[Alceini|łosie]], [[Zając bielak|zające bielaki]]), a w południowo-wschodniej\
      \ także gatunki [[step]]owe ([[Suseł|susły]], [[Żołna|żołny]], [[siodlarka stepowa]],\
      \ [[poskocz krasny]]). Nieco odmienny od reszty kraju skład gatunkowy ma fauna\
      \ obszarów górskich ([[Karpaty]], [[Sudety]]). Poza gatunkami typowymi dla tego\
      \ typu środowiska ([[kozica]], [[świstak tatrzański]], [[płochacz halny]]) żyją\
      \ tam też zwierzęta wytępione na pozostałym obszarze kraju ([[Ryś|rysie]], [[Żbik\
      \ europejski|żbiki]] i [[Niedźwiedź brunatny|niedźwiedzie]]). Niektóre z gatunków\
      \ polskiej fauny są typowymi zwierzętami [[Gatunek synantropijny|synantropijnymi]]\
      \ (np. [[szczur]]y i [[Wróbel (ptak)|wróble]]).\n\nFauna polskiej strefy Bałtyku\
      \ jest relatywnie uboga z powodu niskiego zasolenia tego akwenu. Brak jest w\
      \ ogóle [[Głowonogi|głowonogów]], zaś pojedyncze [[szkarłupnie]] i [[ukwiały]]\
      \ pojawiają się jedynie sporadycznie w skrajnie zachodniej części polskiego\
      \ wybrzeża. Tworzy ją zgrupowanie gatunków typowo morskich (np. [[Dorsz atlantycki|dorsz]],\
      \ [[Śledź oceaniczny|śledź]], [[kur diabeł]], [[omułek jadalny]]), często osiągających\
      \ mniejsze rozmiary ciała, niż w sąsiednim Morzu Północnym, oraz – przynajmniej\
      \ w zatokach i zalewach – gatunków słodkowodnych (np. [[Szczupak pospolity|szczupak]],\
      \ [[Okoń pospolity|okoń]], [[Sieja pospolita|sieja]]). Z zaledwie trzech płetwonogich\
      \ najczęstsza jest [[Szarytka morska|foka szara]], zaś jednym, stale występującym\
      \ waleniem – znajdujący się na skraju wyginięcia [[Morświn zwyczajny|morświn]].\
      \ Niektóre, zimnolubne gatunki zwierząt w Bałtyku stanowią [[relikt]] z okresu\
      \ [[Morze Yoldiowe|Morza Yoldiowego]] (np. [[Nerpa obrączkowana|foka obrączkowana]],\
      \ [[podwój wielki]], [[kur rogacz]]). Również w faunie polskiego Bałtyku pojawiły\
      \ się obce gatunki inwazyjne (np. [[krabik amerykański]], [[Babka śniadogłowa|babka\
      \ bycza]]).\n\n=== Ochrona przyrody ===\n{{Osobny artykuł|Ochrona przyrody w\
      \ Polsce|Rezerwaty biosfery w Polsce}}\n[[Plik:Morskie Oko o poranku.jpg|mały|[[Tatrzański\
      \ Park Narodowy (Polska)|Tatrzański Park Narodowy]] – [[Morskie Oko]] – jedno\
      \ z 5 najpiękniejszych jezior świata według „[[The Wall Street Journal]]”<ref>{{Cytuj\
      \ stronę |url = http://online.wsj.com/articles/great-lakes-around-the-world-1405509454?mod=trending_now_1\
      \ |tytuł = „The Wall Street Journal”. Great Lakes Around the World |opublikowany\
      \ = online.wsj.com |archiwum = https://web.archive.org/web/20140928004224/http://online.wsj.com/articles/great-lakes-around-the-world-1405509454?mod=trending_now_1\
      \ |zarchiwizowano = 2014-09-28}}</ref>]]\n\nW Polsce prowadzi się aktywne działania\
      \ mające na celu ochronę przyrody. Chociaż pewne działania w zakresie ochrony\
      \ przyrody można spotkać już w średniowieczu i wiekach późniejszych, to przemyślane\
      \ i planowe działania oparte na naukowych podstawach podjęto na szerszą skalę\
      \ dopiero w 2. połowie XX wieku. Najcenniejsze obszary chroni sieć [[Park narodowy|parków\
      \ narodowych]] i [[Rezerwat przyrody|rezerwatów przyrody]].\n\nPo akcesji do\
      \ Unii Europejskiej w Polsce wprowadzono także sieć obszarów [[Natura 2000]],\
      \ na których chroni się elementy przyrody zagrożone w skali Europy. Poza obszarowymi\
      \ formami ochrony obowiązuje prawna [[gatunkowa ochrona zwierząt]], [[Ochrona\
      \ gatunkowa grzybów|grzybów]] i [[Ochrona gatunkowa roślin|roślin]].\n\nNa terenie\
      \ kraju znajduje się 10 [[Rezerwat biosfery|rezerwatów biosfery]]<ref>{{Cytuj\
      \ stronę |url = http://www.unesco.org/new/fileadmin/MULTIMEDIA/HQ/SC/pdf/sc_mab_WNBR_BR2012.pdf\
      \ |tytuł = UNESCO – Lista rezerwatów biosfery, stan na wrzesień 2012, s. 9 |archiwum\
      \ = https://web.archive.org/web/20130309110716/http://www.unesco.org/new/fileadmin/MULTIMEDIA/HQ/SC/pdf/sc_mab_WNBR_BR2012.pdf\
      \ |zarchiwizowano = 2013-03-09 |data dostępu = 2013-01-30}}</ref> oraz 13 obszarów\
      \ wodno-błotnych wpisanych na [[Konwencja ramsarska|listę ramsarską]]<ref>{{Cytuj\
      \ stronę |url = http://www.ramsar.org/sites/default/files/documents/library/sitelist_0.pdf\
      \ |tytuł = Lista Ramsarska, stan na 30 stycznia 2013, s. 33 |archiwum = https://web.archive.org/web/20160304054519/http://www.ramsar.org/sites/default/files/documents/library/sitelist_0.pdf\
      \ |data dostępu = 2016-03-08}}</ref>.\n\n{{Zobacz też|Rezerwaty przyrody w Polsce|Parki\
      \ narodowe w Polsce|Parki krajobrazowe w Polsce|Ogrody zoologiczne w Polsce}}\n\
      \n== Demografia ==\n{{Osobny artykuł|Demografia Polski|Polacy}}\n{| class=\"\
      wikitable\" style=\"float:right; margin: 0 1em 0 0; width:40%\"\n!colspan=4|\
      \ Ludność Polski\n|-\n! Rok !! Ludność\n! Rok !! Ludność\n|-\n! 1846\n| 11 107\
      \ 000\n! 1978\n| 35 061 000\n|-\n! 1911\n| 22 110 000\n! 1988\n| 37 879 000\n\
      |-\n! 1921\n| 27 177 000\n! 1990\n| 38 183 000\n|-\n! 1931\n| 32 107 000\n!\
      \ 1995\n| 38 610 000\n|-\n! 1938\n| 34 849 000\n! 2000\n| 38 654 000\n|-\n!\
      \ 1946\n| 23 930 000\n! 2005\n| 38 191 000\n|-\n! 1950\n| 25 008 000\n! 2010\n\
      | 37 774 078\n\n|-\n! 1960\n| 29 776 000\n! 2015\n| 38 437 239\n|-\n! 1970\n\
      | 32 642 000\n! 2020\n| 38 088 564\n|-\n|colspan=4| [[Plik:Poland-demography\
      \ 1946-2008.png|thumb|upright=2.1|centruj|Wykres liczby ludności Polski w latach\
      \ 1946–2008 (w tysiącach)]]\n|-\n!colspan=4| Liczba ludności Polski w latach\
      \ 1946–2008<ref>{{Cytuj stronę |url = http://www.stat.gov.pl/cps/rde/xbcr/gus/PUBL_rocznik_demograficzny_2009.pdf\
      \ |tytuł = ''GUS: Rocznik Demograficzny 2009.'' |opublikowany = stat.gov.pl\
      \ |archiwum = https://web.archive.org/web/20091122074303/http://www.stat.gov.pl/cps/rde/xbcr/gus/PUBL_rocznik_demograficzny_2009.pdf\
      \ |zarchiwizowano = 2009-11-22}}</ref> (w tysiącach)\n|}\n[[Plik:Kartogram ludnosci\
      \ Polski.svg|mały|upright=1.1|Liczba mieszkańców powiatów. Wielkość powiatu\
      \ pokazuje liczbę jego mieszkańców, z pewnym przybliżeniem. Każdy kolor to 1/5\
      \ całkowitej liczby powiatów.]]\n\nW okresie kształtowania się państwowości\
      \ Polska obejmowała swym zasięgiem ziemie o powierzchni ponad ćwierć miliona&nbsp;km²\
      \ z przeszło milionem mieszkańców. Za czasów [[Kazimierz III Wielki|Kazimierza\
      \ Wielkiego]] obszar państwa (około 270 tys.&nbsp;km²) zamieszkiwało ponad 2,5\
      \ mln osób. Unia z Litwą przyniosła radykalny przyrost demograficzny i terytorialny.\
      \ Za czasów [[Stefan Batory|Batorego]] obszar państwa zbliżył się do 1 mln&nbsp;km²,\
      \ a ludność w końcu XVI wieku prawdopodobnie osiągnęła 9 milionów. W chwili\
      \ utraty niepodległości wielonarodowościowe państwo liczyło co najmniej 13–14\
      \ mln mieszkańców, przy czym przez cały okres wspólnej państwowości z [[Litwa|Litwą]]\
      \ znaczną część ludności stanowiły osoby posługujące się innym językiem niż\
      \ polski (w końcu XVIII wieku było ich ok. 60%). Po odzyskaniu niepodległości\
      \ w granicach Polski znalazło się kilka milionów osób o innej niż polska narodowości,\
      \ tak więc Polska przed [[II wojna światowa|II wojną światową]] była krajem\
      \ wielonarodowościowym, gdzie mniejszości stanowiły powyżej 30% ludności. W\
      \ okresie między 1921, a wybuchem II wojny światowej liczba ludności wzrosła\
      \ z 27,2 mln do 35,2 mln. Jednak zmiany granic Polski po wojnie oraz przesiedlenia\
      \ sprawiły, że obecnie Polska jest krajem nieomalże jednolitym etnicznie. Wszystkie\
      \ mniejszości narodowe łącznie nie przekraczają 3% ludności.\n\nPo II wojnie\
      \ światowej w Polsce zanotowano niespotykany nigdzie indziej (poza ZSRR) przyrost\
      \ naturalny. W latach 50. XX wieku w Polsce przybywało ponad 500 tys. mieszkańców\
      \ rocznie (tyle osób zamieszkiwało wówczas w Krakowie). Przyczyną tak dużego\
      \ przyrostu naturalnego był ogromny ubytek ludności w czasie wojny (według różnych\
      \ źródeł od 6 do 10 mln). Kolejny wyż demograficzny przyszedł z początkiem lat\
      \ 70. oraz na początku lat 80. (zbliżenie się członków rodzin w czasie stanu\
      \ wojennego). Od końca lat 80. przyrost naturalny drastycznie spadł, by na początku\
      \ XXI wieku zejść poniżej zera. Obecnie znów notuje się nieznacznie większą\
      \ liczbę urodzeń, gdyż w okres prokreacji wchodzi wyż demograficzny lat 70.\
      \ Ponadto od kilku lat obserwuje się prorodzinną politykę państwa („becikowe”,\
      \ ulgi podatkowe), a także kobiety, które odłożyły rodzicielstwo w latach 90.\
      \ na rzecz kariery rodzą dzieci. Niemniej jednak z Polski do krajów UE wyemigrowało\
      \ (według różnych szacunków) od 500 tysięcy do ponad 2 milionów młodych ludzi,\
      \ którzy pragną założyć rodziny w nowym miejscu zamieszkania. W ostatnich latach\
      \ ludność Polski ustabilizowała się na poziomie 38,1 mln osób (w okresie od\
      \ X 2006 do III 2009 liczba ta wahała się w wąskim przedziale 38,11–38,14 mln<ref\
      \ name=\"stat.gov.pl\">{{Cytuj stronę |url = http://stat.gov.pl/obszary-tematyczne/inne-opracowania/informacje-o-sytuacji-spoleczno-gospodarczej/biuletyn-statystyczny-styczen-grudzien-2009-r-,4,7.html\
      \ |tytuł = Biuletyn Statystyczny nr 4 rok 2009 |archiwum = https://web.archive.org/web/20090612023846/http://www.stat.gov.pl/cps/rde/xbcr/gus/PUBL_oz_biuletyn_statystyczny_04m_2009.pdf\
      \ |zarchiwizowano = 2009-06-12 |data dostępu = 2009-06-05}}</ref>). Według prognoz\
      \ GUS z 2010 roku, liczba ludności w Polsce w 2030 miała wynieść ok. 36,8 mln<ref\
      \ name=\"GUSMRS2010\">{{Cytuj stronę |url = http://stat.gov.pl/cps/rde/xbcr/gus/oz_maly_rocznik_statystyczny_2010.pdf\
      \ |tytuł = Mały rocznik statystyczny 2010 |archiwum = https://web.archive.org/web/20160705051626/http://stat.gov.pl/cps/rde/xbcr/gus/oz_maly_rocznik_statystyczny_2010.pdf\
      \ |zarchiwizowano = 2016-07-05 |data dostępu = 2016-03-08}}</ref>. W 2008 i\
      \ 2009 r. nastąpił wzrost liczby urodzeń. W 2008 r. w Polsce urodziło się 414\
      \ tys. dzieci, a w 2009 r. 418 tys.<ref name=\"GUSMRS2010\"/> Po chwilowym wzroście\
      \ kolejne lata przyniosły dalszy głęboki spadek urodzeń. Kilkanście lat później\
      \ (2023 r.) liczba nowonarodzonych dzieci spadła do 272,5 tys.<ref name=\"GUS2023XII\"\
      \ />\n\nPrzyrost naturalny jest zróżnicowany regionalnie. Przyczyniają się do\
      \ tego konteksty historyczne i społeczne – np. na [[Górny Śląsk|Górnym Śląsku]]\
      \ występuje jedna z najwyższych w kraju dzietność na kobietę, a mimo to ludność\
      \ tego województwa się zmniejsza. Spowodowane jest to znacznymi migracjami,\
      \ głównie starszych osób, które w latach 70. przybyły tu do pracy w przemyśle,\
      \ a teraz na emeryturze wracają w swoje rodzinne strony. Z kolei Warszawa jest\
      \ miastem w Polsce, o ujemnym przyroście naturalnym, a mimo to z powodu migracji\
      \ liczba ludności miasta rośnie. Obszarami o najwyższym przyroście naturalnym\
      \ pozostają [[Małopolska]], województwa północne i wschodnie (wyjątkiem jest\
      \ tutaj [[województwo podlaskie]]), a najniższy i ujemny przyrost naturalny\
      \ odnotowuje się w województwach zachodnich (z wyjątkiem [[Wielkopolska|Wielkopolski]]\
      \ i [[Województwo zachodniopomorskie|Pomorza Zachodniego]], gdzie przyrost jest\
      \ dodatni) i centralnych, w szczególności w [[Województwo łódzkie|łódzkim]].\
      \ Największą gęstością zaludnienia charakteryzują się gminy miejskie (np. [[Legionowo]]).\
      \ W skali regionów gęstość zaludnienia jest najwyższa w [[Województwo śląskie|województwie\
      \ śląskim]] a najniższa w [[Województwo podlaskie|województwie podlaskim]] (6,3\
      \ raza mniejsza niż w śląskim) ([[Gęstość zaludnienia|Stan zaludnienia województw\
      \ w 2014 roku]]).\n\nNiespełna 10 lat później (2023 r.) wszystkie województwa\
      \ odnotowały ujemny przyrost naturalny, od –3,77 tys. w województwie podlaskim\
      \ do –24,08 tys. w województwie śląskim<ref name=\"GUS2023XII\" />.\n\n=== Narodowości\
