      \ || {{zmiana|spadek}}194\n|}\n\n[[Plik:Tatarian Cemetery Kruszyniany Poland.jpg|mały|upright|lewo|Cmentarz\
      \ tatarski w [[Kruszyniany|Kruszynianach]]. Tatarzy osiedlili się w 18 wioskach\
      \ na polskich ziemiach królewskich, z łaski [[Jan III Sobieski|Jana III Sobieskiego]],\
      \ otrzymując tytuły szlacheckie bez wymogu przejścia na katolicyzm, co było\
      \ niespotykane w Europie w owych czasach]]\n\n[[Polacy]] posługują się [[Język\
      \ polski|językiem polskim]] zaliczanym do [[Rodzina językowa|rodziny]] [[Języki\
      \ słowiańskie|języków słowiańskich]]. Dla pewnej części Polaków [[Język ojczysty|językiem\
      \ ojczystym]] jest blisko z nim spokrewniony [[język kaszubski]]. Język polski\
      \ jest [[Język urzędowy|językiem urzędowym]] Rzeczypospolitej, jakkolwiek prawo\
      \ gwarantuje [[Mniejszość narodowa|mniejszościom narodowym]] używanie ich własnych\
      \ [[Język (mowa)|języków]], zwłaszcza na obszarach, gdzie występują ich większe\
      \ skupiska. W 21 gminach<ref>Na podstawie [https://web.archive.org/web/20090329113047/http://bip.mswia.gov.pl/portal/bip/13/71/Rejestry.html\
      \ ''Urzędowego Rejestru Gmin, w których używany jest język pomocniczy.''] umieszczonego\
      \ na stronach BIP MSWiA.</ref> jako pomocnicze języki urzędowe stosowane są\
      \ [[język niemiecki]], język kaszubski, [[język litewski]] oraz [[język białoruski]]\
      \ (tzw. [[Gminy w Polsce z językiem pomocniczym|gminy dwujęzyczne]]).\n\nW [[Narodowy\
      \ Spis Powszechny Ludności i Mieszkań 2011|Narodowym Spisie Powszechnym z 2011\
      \ roku]] narodowość polską zadeklarowało 97,10% ankietowanych (wliczając osoby\
      \ deklarujące również drugą narodowość). 887 tys. osób (2,26%) zadeklarowało\
      \ dwie narodowości – polską i niepolską, 597 tys. osób (1,55%) zadeklarowało\
      \ wyłącznie niepolską narodowość, z czego 46 tys. osób zadeklarowało dwie niepolskie\
      \ narodowości. Najbardziej liczne [[Mniejszości narodowe i etniczne w Polsce|mniejszości\
      \ narodowe i etniczne]] stanowią [[Ślązacy]]<ref name=\"śl\" group=\"uwaga\"\
      \ /> (847 tys.), [[Kaszubi]] (233 tys.), [[Niemcy]] (148 tys.), [[Ukraińcy]]\
      \ (51 tys.), [[Białorusini]] (47 tys.), [[Romowie]] (17 tys.), [[Rosjanie]]\
      \ (13 tys.), [[Łemkowie]] (11 tys.), [[Litwini w Polsce|Litwini]] (8 tys.) i\
      \ [[Żydzi w Polsce|Żydzi]] (8 tys.)<ref name=\"GUS2013\">{{Cytuj stronę |url\
      \ = http://www.stat.gov.pl/cps/rde/xbcr/gus/Przynaleznosc_narodowo-etniczna_w_2011_NSP.pdf\
      \ |tytuł = Przynależność narodowo-etniczna ludności – wyniki spisu ludności\
      \ i mieszkań 2011 |data = 2013-01-29 |opublikowany = Główny Urząd Statystyczny\
      \ |archiwum = https://web.archive.org/web/20130512145523/http://www.stat.gov.pl/cps/rde/xbcr/gus/Przynaleznosc_narodowo-etniczna_w_2011_NSP.pdf\
      \ |zarchiwizowano = 2013-05-12}}</ref>.\n\nIstnieją próby wyodrębnienia nowej\
      \ grupy etnicznej Śląskiej – osobny artykuł [[Narodowość śląska]].\n\nW Polsce\
      \ nie obserwuje się masowego napływu imigrantów jak w krajach zachodnich. Niemniej\
      \ jednak coraz więcej przedsiębiorstw sprowadza pracowników z zagranicy, szczególnie\
      \ z Ukrainy, Białorusi oraz Dalekiego Wschodu (Chiny, Wietnam). Zajmują oni\
      \ lukę na rynku pracy powstałą z powodu nasilonej w ostatnich latach emigracji\
      \ zarobkowej młodych Polaków. <!-- Źródła UE((kto|data=2014-03)) wskazują, że\
      \ w ciągu najbliższych lat i do Polski ściągać będą imigranci, głównie ze wschodniej\
      \ Europy. --> Pojawiają się też, wraz z zagranicznymi przedsiębiorstwami otwierającymi\
      \ fabryki w Polsce, zagraniczni pracownicy średniego i wyższego szczebla kierowniczego\
      \ wraz z rodzinami, w tym oprócz pochodzących z Europy Zachodniej i Ameryki,\
      \ także z Azji: Korei Południowej i Japonii.\n\nWedług oficjalnych danych na\
      \ terytorium Polski legalnie mieszkało w 2012 roku około 5 tysięcy imigrantów\
      \ z Afryki (posiadacze ważnych kart pobytu). Głównymi krajami pochodzenia imigrantów\
      \ z Afryki są kolejno: [[Nigeria]], [[Tunezja]], [[Egipt]], [[Algieria]], [[Maroko]],\
      \ [[Kamerun]] i [[Południowa Afryka|RPA]]<ref>{{Cytuj |autor = Marta Danecka,\
      \ Emilia Jaroszewska |tytuł = Imigranci z Afryki w Polsce przyczynek do analizy\
      \ czynników blokujących ich napływ i integrację |data = 2013 |data dostępu =\
      \ 2018-07-01 |wydawca = Kultura i Społeczeństwo |url = http://journals.pan.pl/dlibra/publication/100783/edition/86802/content\
