      \n=== Polonia i Polacy za granicą ===\n{{Osobny artykuł|Polonia|Diaspora polska}}\n\
      [[Plik:Parada.JPG|mały|[[Parady 3-majowe w Chicago|Parada 3-majowa]] w [[Chicago]],\
      \ 1985]]\n\nOprócz populacji krajowej jest to szeroko rozumiana Polonia oraz\
      \ rdzenni mieszkańcy terytoriów niegdyś w granicach Rzeczypospolitej Polskiej,\
      \ a znajdujących się obecnie poza granicami kraju. Polacy żyją w dużych liczbach\
      \ na [[Białoruś|Białorusi]], [[Litwa|Litwie]], [[Ukraina|Ukrainie]], w [[Czechy|Czechach]],\
      \ [[Rosja|Rosji]] (są tam m.in. historycznie rozproszeni po [[Syberia|Syberii]],\
      \ z koncentracją w [[Jakucja|Jakucji]]), w [[Kazachstan]]ie (z powodu radzieckich\
      \ zesłań), [[Niemcy|Niemczech]] (468 tys. w roku 2011), [[Francja|Francji]],\
      \ [[Wielka Brytania|Wielkiej Brytanii]] (916 tys. na koniec roku 2015<ref>{{Cytuj\
      \ stronę |url = http://biznes.onet.pl/wiadomosci/ue/liczba-polakow-w-wielkiej-brytanii-rekordowa/gghk7g\
      \ |tytuł = Rekordowa liczba Polaków w Wielkiej Brytanii |opublikowany = biznes.onet.pl\
      \ |archiwum = https://web.archive.org/web/20160826173623/http://biznes.onet.pl/wiadomosci/ue/liczba-polakow-w-wielkiej-brytanii-rekordowa/gghk7g\
      \ |zarchiwizowano = 2016-08-26}}</ref>) i w większości państw [[Europa Zachodnia|Europy\
      \ Zachodniej]] oraz w [[Skandynawia|Skandynawii]] (Polacy są najliczniejszą\
      \ grupą obcokrajowców na [[Islandia|Islandii]]), w [[Stany Zjednoczone|Stanach\
      \ Zjednoczonych]] i [[Kanada|Kanadzie]], w [[Ameryka Południowa|Ameryce Południowej]]\
      \ (szczególnie w [[Brazylia|Brazylii]] i [[Argentyna|Argentynie]]), a także\
      \ w [[Australia|Australii]].\n\nPrzez wiele dekad, Polacy emigrowali przeważnie\
      \ do Stanów Zjednoczonych, Kanady, oraz Australii. W dużej mierze są zintegrowani\
      \ tamże, nadając w odczuwalnej mierze polskość miejscowej mozaice społecznościowej,\
      \ podobnie jak kiedyś Polska była mozaiką ludów.\n\nPolacy na świecie to również\
      \ liczna grupa pracujących zarobkowo, w XXI wieku głównie w Wielkiej Brytanii,\
      \ Niemczech, [[Irlandia|Irlandii]] i [[Holandia|Holandii]].\n\n=== Wyznania\
      \ religijne ===\n{{Osobny artykuł|Kościoły i inne związki wyznaniowe w Polsce}}\n\
      [[Plik:Cęstochowa, klasztor - panoramio.jpg|mały|Klasztor o. Paulinów na [[Jasna\
      \ Góra|Jasnej Górze]] w [[Częstochowa|Częstochowie]] – centrum pielgrzymek w\
      \ Polsce]]\n<!--NIE DODAWAJ WIĘCEJ ZDJĘĆ KOŚCIOŁÓW. PSUJE TO UKŁAD TEKSTU A\
      \ WIKIPEDIA NIE JEST GALERIĄ GRAFIK.-->\n\nZa członków poszczególnych Kościołów\
      \ i związków religijnych przyjmuje się zazwyczaj osoby, które w stosunek członkostwa\
      \ weszły (np. poddane [[Chrzest|obrzędowi chrztu]]), nawet jeżeli w okresie\
      \ późniejszym straciły związek z Kościołem (związkiem wyznaniowym) i religią.\
      \ Dane statystyczne sporządzone są wyłącznie na podstawie oficjalnej dokumentacji\
      \ [[Kościół (organizacja)|Kościołów]] i zarejestrowanych organizacji religijnych,\
      \ które to dane zbierane są przez [[Główny Urząd Statystyczny]] (GUS). Weryfikacją\
      \ tego obrazu są dane zbierane podczas [[Spisy statystyczne w Polsce|powszechnych\
      \ spisów statystycznych]] oraz badań spójności społecznej opartych na deklaracjach\
      \ reprezentatywnej grupy osób prowadzone również przez GUS<ref name=\"BSS\"\
      >{{Cytuj stronę |url = https://stat.gov.pl/obszary-tematyczne/inne-opracowania/wyznania-religijne/zycie-religijne-w-polsce-wyniki-badania-spojnosci-spolecznej-2018,8,1.html\
      \ |tytuł = Życie religijne w Polsce. Wyniki badania spójności społecznej 2018\
      \ |data = 2018-12-18 |opublikowany = [[Główny Urząd Statystyczny]] |archiwum\
      \ = https://web.archive.org/web/20200513053956/https://stat.gov.pl/obszary-tematyczne/inne-opracowania/wyznania-religijne/zycie-religijne-w-polsce-wyniki-badania-spojnosci-spolecznej-2018,8,1.html\
      \ |zarchiwizowano = 2020-05-13 |data dostępu = 2020-11-08}}</ref>. Podczas [[Narodowy\
      \ Spis Powszechny Ludności i Mieszkań 2021|spisu ludności w 2021]] zadano pytanie\
      \ o wyznanie, na które odpowiedziało 79,43% respondentów<ref name=\":1\">{{Cytuj\
      \ |autor = GUS |tytuł = Tablice z ostatecznymi danymi w zakresie przynależności\
      \ narodowo-etnicznej, języka używanego w domu oraz przynależności do wyznania\
      \ religijnego |data dostępu = 2023-10-01 |opublikowany = stat.gov.pl |url =\
      \ https://stat.gov.pl/spisy-powszechne/nsp-2021/nsp-2021-wyniki-ostateczne/tablice-z-ostatecznymi-danymi-w-zakresie-przynaleznosci-narodowo-etnicznej-jezyka-uzywanego-w-domu-oraz-przynaleznosci-do-wyznania-religijnego,10,1.html\
      \ |język = pl}}</ref>.\n\nNajwiększą wspólnotę religijną stanowi [[Kościół katolicki]],\
      \ do którego należy około 27,1 mln wiernych (2021)<ref name=\":1\" />, co oznacza,\
      \ że z kościołem w obrządku [[Kościół łaciński|rzymskokatolickim]] identyfikuje\
      \ się 71,3% mieszkańców Polski. Według autodeklaracji respondentów GUS w 2018\
      \ roku za katolików uważa się około 93,5% populacji<ref name=\"BSS\"/>, a światopogląd\
      \ 45% Polaków w pełni pokrywa się z doktryną Kościoła katolickiego<ref name=\"\
      CBOS\">{{Cytuj stronę |url = https://www.cbos.pl/SPISKOM.POL/2018/K_147_18.PDF\
      \ |tytuł = Religijność Polaków i ocena sytuacji Kościoła katolickiego |autor\
      \ = CBOS |archiwum = https://web.archive.org/web/20201020214654/https://www.cbos.pl/SPISKOM.POL/2018/K_147_18.PDF\
      \ |zarchiwizowano = 2020-10-20 |data dostępu = 2020-11-08}}</ref>. W Polsce\
      \ regularnie praktykuje około 50% wszystkich wierzących<ref name=\"BSS\"/><ref\
      \ name=\"CBOS\"/>. Najbardziej religijnymi diecezjami są diecezje: [[diecezja\
      \ tarnowska]] (71,3%), [[diecezja rzeszowska]] (64,3%) i [[Archidiecezja przemyska|diecezja\
      \ przemyska]] (60,4%) natomiast najmniej religijnymi są [[Archidiecezja szczecińsko-kamieńska|diecezja\
      \ szczecińsko-kamieńska]] (24,1%), [[Archidiecezja łódzka|diecezja łódzka]]\
      \ (24,5%) i [[diecezja koszalińsko-kołobrzeska]] (25,0%)<ref>{{Cytuj książkę\
      \ |tytuł = Annuarium Statisticum Ecclesiae in Polonia AD 2020 |url = http://www.iskk.pl/badania/roczniki-statystyczne/313-annuarium-statisticum-ecclesiae-in-polonia-ad-2020\
      \ |wydawca = Instytut Statystyki Kościoła Katolickiego SAC im. Witolda Zdaniewicza\
      \ |miejsce = Warszawa |data = 2020 |isbn = 978-83-85945-35-2 |data dostępu =\
      \ 2020-11-08}}</ref>. [[Kościół greckokatolicki w Polsce|Kościół greckokatolicki]]\
      \ liczy 55 tys. wiernych, [[Kościół katolicki obrządku ormiańskiego|Kościół\
      \ ormiańskokatolicki]] 670, [[Kościół katolicki obrządku bizantyjsko-słowiańskiego\
      \ w Polsce|Kościół neounicki]] 124 osoby<ref name=\"MRS2018\">{{Cytuj stronę\
      \ |url = https://stat.gov.pl/obszary-tematyczne/roczniki-statystyczne/roczniki-statystyczne/maly-rocznik-statystyczny-polski-2018,1,19.html\
      \ |tytuł = Mały rocznik statystyczny 2018 |autor = Główny Urząd Statystyczny,\
      \ 2018 |archiwum = https://web.archive.org/web/20200922104538/https://stat.gov.pl/obszary-tematyczne/roczniki-statystyczne/roczniki-statystyczne/maly-rocznik-statystyczny-polski-2018,1,19.html\
      \ |zarchiwizowano = 2020-09-22 |data dostępu = 2020-11-08}}</ref>. Z tradycji\
      \ [[Katolicyzm|katolickiej]] wywodzi się [[starokatolicyzm]], do którego należy\
      \ 44 tys. wiernych<ref name=\"MRS2018\"/> ([[Kościół Starokatolicki Mariawitów\
      \ w RP|Kościół Starokatolicki Mariawitów]] – 22,8 tys. wiernych, [[Kościół Polskokatolicki\
      \ w Rzeczypospolitej Polskiej|Kościół Polskokatolicki]] – 18,1 tys. wiernych,\
      \ [[Kościół Katolicki Mariawitów w RP|Kościół Katolicki Mariawitów]] – 1,8 tys.\
      \ wiernych, [[Polski Narodowy Katolicki Kościół w RP|Polski Narodowy Katolicki\
      \ Kościół]] – 1,2 tys. wiernych, [[Kościół Starokatolicki w Rzeczypospolitej\
      \ Polskiej|Kościół Starokatolicki w RP]] – 254 wiernych w 2017 roku)<ref name=\"\
      MRS2018\"/>. Obok starokatolików działalność prowadzą grupy [[Tradycjonalizm\
      \ katolicki|tradycjonalistów katolickich]] ([[Bractwo Kapłańskie Świętego Piusa\
      \ X]] i [[Sedewakantyzm|sedewakantyści]]).\n\nWspólnoty tradycji [[Prawosławie|prawosławnej]]\
      \ liczą 506.1 tys. wiernych ([[Polski Autokefaliczny Kościół Prawosławny]] –\
      \ 504,4 tys., [[Wschodni Kościół Staroobrzędowy|Wschodni Kościół Staroobrzędowców\
      \ w RP]] – 1006 osób, [[Staroprawosławna Cerkiew Staroobrzędowców]] – 624 osób)<ref\
      \ name=\"MRS2018\"/>. W Polsce mieszkają także przedstawiciele [[Kościoły orientalne|przedchalcedońskich\
      \ Kościołów wschodnich]] ([[Apostolski Kościół Ormiański]] – 335 wiernych, [[Koptyjski\
      \ Kościół Ortodoksyjny]])<ref name=\"NSP2011\"/>.\n\nKościoły [[Protestantyzm|protestanckie]]\
      \ liczą 130,1 tys. wiernych: [[Kościół Ewangelicko-Augsburski w Rzeczypospolitej\
      \ Polskiej|Kościół Ewangelicko-Augsburski]] – 61,3 tys., [[Kościół Zielonoświątkowy\
      \ w RP|Kościół Zielonoświątkowy]] – 23,9 tys., [[Kościół Adwentystów Dnia Siódmego]]\
      \ – 9,7 tys., [[Kościół Chrystusowy w RP]] – 5,9 tys., [[Kościół Nowoapostolski]]\
      \ w Polsce – 5,6 tys., [[Kościół Chrześcijan Baptystów w RP|Kościół Chrześcijan\
      \ Baptystów]] – 5,2 tys., [[Kościół Boży w Chrystusie (Polska)|Kościół Boży\
      \ w Chrystusie]] – 4,9 tys., [[Kościół Ewangelicko-Metodystyczny w RP|Kościół\
      \ Ewangelicko-Metodystyczny]] – 4,4 tys., [[Kościół Ewangelicko-Reformowany\
      \ w RP|Kościół Ewangelicko-Reformowany]] – 3,4 tys., [[Kościół Wolnych Chrześcijan\
      \ w RP|Kościół Wolnych Chrześcijan]] – 3,1 tys., [[Kościół Ewangelicznych Chrześcijan\
      \ w RP|Kościół Ewangelicznych Chrześcijan]] – 2,2 tys., [[Kościół Chrześcijan\
      \ Wiary Ewangelicznej w RP|Kościół Chrześcijan Wiary Ewangelicznej]] – 1,5 tys.<ref\
      \ name=\"MRS2018\"/>, [[Chrześcijańska Wspólnota Zielonoświątkowa]] i wiele\
      \ innych. Według danych z 2021 roku było zarejestrowanych 101 protestanckich\
      \ denominacji, co stanowiło prawie połowę wszystkich związków wyznaniowych<ref>{{Cytuj\
      \ |tytuł = W Polsce jest 207 wyznań religijnych i Kościołów. Które mają najwięcej\
      \ wiernych? |data = 2022-12-22 |data dostępu = 2023-12-10 |opublikowany = DEON.pl\
      \ |url = https://deon.pl/kosciol/w-polsce-jest-207-wyznan-religijnych-i-kosciolow-ktore-maja-najwiecej-wiernych-,2370203\
      \ |język = pl}}</ref>.  \n\nWyznania [[Restoracjonizm|restoracjonistyczne]]\
      \ obejmują: [[Świadkowie Jehowy|Związek Wyznania Świadków Jehowy]] (118,8 tys.\
      \ wiernych), [[Zrzeszenie Wolnych Badaczy Pisma Świętego]] – 1,8 tys., [[Świecki\
      \ Ruch Misyjny „Epifania”]] – 1,3 tys. wiernych oraz [[Kościół Jezusa Chrystusa\
      \ Świętych w Dniach Ostatnich]] ([[Mormonizm|Mormoni]]) – 1,7 tys. wiernych<ref\
      \ name=\"MRS2018\"/>.\n\nInne grupy wyznaniowe liczą łącznie 17,9 tys. członków;\
      \ należą do nich: m.in. [[Islamskie Zgromadzenie Ahl-ul-Bayt]] 6,0 tys. wiernych,\
      \ [[Muzułmański Związek Religijny w Rzeczypospolitej Polskiej|Muzułmański Związek\
      \ Religijny]] – 0,7 tys. wiernych, [[Międzynarodowe Towarzystwo Świadomości\
      \ Kryszny]] – 2,3 tys. wiernych<ref name=\"MRS2018\"/>, [[Związek Gmin Wyznaniowych\
      \ Żydowskich w Rzeczypospolitej Polskiej]] – 430 członków<ref name=\"NSP2011\"\
      >{{Cytuj książkę |tytuł = Struktura narodowo-etniczna, językowa i wyznaniowa\
      \ ludności Polski. Narodowy Spis Powszechny Ludności i Mieszkań 2011 |url =\
      \ https://prosvita.org.pl/rys/dok/99_struktura_narodowo_etniczna.pdf |wydawca\
      \ = Główny Urząd Statystyczny |miejsce = Warszawa |data = 2015 |isbn = 978-83-7027-597-6\
      \ |data dostępu = 2020-11-08}}</ref>.\n\nKilka prawnie zarejestrowanych w [[Ministerstwo\
      \ Spraw Wewnętrznych i Administracji|MSWiA]] związków wyznaniowych liczących\
      \ w sumie ok. 900 członków (jak [[Rodzimy Kościół Polski]] lub [[Rodzima Wiara]])\
      \ ma źródła w etnicznych, przedchrześcijańskich [[Religia Słowian|wierzeniach\
      \ Słowian]]<ref name=\"NSP2011\"/>. Grupy praktykujących [[Buddyzm w Polsce|buddyzm]]\
      \ liczą 5,9 tys. członków<ref name=\"NSP2011\"/>.\n\nNajwiększe w Polsce międzywyznaniowe\
      \ organizacje chrześcijańskie to: [[Polska Rada Ekumeniczna]] zrzeszająca Kościoły\
      \ [[Protestantyzm|protestanckie]], [[Starokatolicyzm|starokatolickie]] i [[Prawosławie|prawosławne]]\
      \ oraz [[Alians Ewangeliczny w RP|Alians Ewangeliczny]] zrzeszający Kościoły,\
      \ [[Zbór|Zbory]] i organizacje związane z [[Ewangelikalizm|protestantyzmem ewangelikalnym]].\n\
      \nPodczas spisu powszechnego w 2011 roku bezwyznaniowość zadeklarowało 2,4%\
      \ ludności<ref name=\"NSP2011\"/>.\n\n{{Zobacz też|Dominicantes i communicantes\
      \ w Polsce}}\n\n== Gospodarka ==\n=== Charakterystyka polskiej gospodarki ===\n\
