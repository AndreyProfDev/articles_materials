    title: Edycje
  - content: W ramach I Europejskiego Kongresu Małych i Średnich Przedsiębiorstw odbyło
      się 12 sesji tematycznych i 30 paneli dyskusyjnych w ciągu dwóch dni eksperckich
      debat, w których wzięło udział 100 panelistów, 2,5 tys. uczestników z Polski
      i zagranicy, a w tym dwadzieścia trzy delegacje zagraniczne.
    title: I Europejski Kongres Małych i Średnich Przedsiębiorstw
  - content: W II Europejskim Kongresie Małych i Średnich Przedsiębiorstw wzięło udział
      blisko 3 tys. uczestników i 250 ekspertów. Podczas 4 dni debat odwiedziło 27
      delegacji zagranicznych z 21 krajów m.in. z Rosji, Ukrainy, Białorusi, Portugalii,
      Azerbejdżanu. W dniach 24–27 września 2012 r. w 8 lokalizacjach Katowic (w Akademii
      Muzycznej; na Wydziale Prawa i Administracji, Rektoracie i Centrum Informacji
      Naukowej i Bibliotece Akademickiej Uniwersytetu Śląskiego; Śląskim Urzędzie
      Wojewódzkim, Biurze Centrum, Regionalnej Izbie Gospodarczej, Euro Centrum) odbyło
      się 68 paneli dyskusyjnych.
    title: II Europejski Kongres Małych i Średnich Przedsiębiorstw
  - content: III Europejski Kongres Małych i Średnich Przedsiębiorstw odbył się w
      dniach od 16 do 18 września w Katowicach. Najważniejsze wydarzenie sektora MŚP
      w ciągu trzech dni zgromadziło najbardziej wpływowe osoby z kraju i z zagranicy.
      Wśród gości honorowych znaleźli się Prezydent RP – Bronisław Komorowski, Antonio
      Tajani – Wiceprzewodniczący Komisji Europejskiej, Komisarz ds. Przemysłu i Przedsiębiorczości,
      Janusz Piechociński – Wicepremier, Minister Gospodarki oraz Jerzy Buzek – Premier
      Rządu RP w latach 1997–2001, Przewodniczący Parlamentu Europejskiego w latach
      2009–2012. W ramach Kongresu odbyło się 56 wydarzeń, w których wzięło udział
      190 panelistów, 170 gości zagranicznych z 35 krajów i łącznie ponad 3000 uczestników!
    title: III Europejski Kongres Małych i Średnich Przedsiębiorstw
  - content: IV Europejski Kongres Małych i Średnich Przedsiębiorstw odbył się w Katowicach
      w dniach 22–25 września 2014 r. Hasłem przewodnim Kongresu było „10 lat przedsiębiorczości
      bez granic”. Wydarzenie Honorowym Patronatem objął Prezydent Rzeczypospolitej
      Polskiej Bronisław Komorowski, Przewodniczący Komisji Europejskiej José Manuel
      Barroso oraz Parlament Europejski.
    title: IV Europejski Kongres Małych i Średnich Przedsiębiorstw
  - content: V Europejski Kongres Małych i Średnich Przedsiębiorstw odbędzie się w
      Katowicach w dniach 12–14 października 2015 r. Hasłem przewodnim Kongresu jest
      „Nauka - Biznes - Samorząd - Razem dla gospodarki”. Wydarzenie Honorowym Patronatem
      objął Prezydent Rzeczypospolitej Polskiej Bronisław Komorowski, Przewodniczący
      Komisji Europejskiej José Manuel Barroso oraz Parlament Europejski.
