  - content: 'Europejski Kongres Małych i Średnich Przedsiębiorstw – coroczne spotkania
      biznesowe sektora MŚP odbywające się w Katowicach. Organizatorem Kongresu jest
      Regionalna Izba Gospodarcza w Katowicach. Stał się płaszczyzną wielu debat i
      dyskusji skupiających przedstawicieli sektora MŚP i dużych firm, świata nauki,
      instytucji otoczenia biznesu, samorządów terytorialnych oraz władz rządowych.
      Wydarzenie jest kontynuacją idei spotkania biznesowego sektora MŚP zainaugurowanego
      w 2011 roku, a dotychczasowe edycje dowiodły, że jest on najważniejszym w Europie
      wydarzeniem gospodarczym dedykowanym sektorowi małych i średnich przedsiębiorstw.

      Przewodniczącym Komitetu Honorowego Europejskiego Kongresu Małych i Średnich
      Przedsiębiorstw jest Jerzy Buzek, współprzewodniczącym Jarosław Gowin, a Radzie
      Programowej przewodzi Tadeusz Donocik.'
    title: Main
  - content: 'Europejski Kongres Małych i Średnich Przedsiębiorstw w Katowicach stanowi
      okazję do refleksji na temat zaangażowania firm z sektora MŚP w budowę modelu
      polskiej gospodarki opartego na wiedzy oraz rozwoju innowacyjności. Podczas
      prowadzonych paneli eksperci oraz praktycy – doświadczeni menedżerowie polskich
      i europejskich firm – przedstawiają aktualne trendy i kierunki w wielu obszarach.

      Dyskusje podczas Kongresu dotykają tematów, które od wielu lat uznawane są przez
      przedsiębiorców jako najbardziej newralgiczne, a mianowicie: współpraca nauki
      z biznesem, dostęp do kapitału, kształcenie kadr dla gospodarki, system stanowienia
      stabilnego i przyjaznego prawa i wiele innych.'
    title: Obszary dyskusji
  - content: Uczestnicy Kongresu to przede wszystkim przedstawiciele małych i średnich
      przedsiębiorstw, samorządu terytorialnego, instytucji otoczenia biznesu, uczelni
      wyższych oraz instytucji naukowo-badawczych, parlamentarzystów, władz rządowych
      i innych.
    title: Uczestnicy
  - content: Efektem końcowym debat prowadzonych w ramach każdej edycji Europejskiego
      Kongresu Małych i Średnich Przedsiębiorstw są zgłaszane postulaty uczestników
      dyskusji, opracowywane w formie Rekomendacji. Zbiór ten to wskazówki niezwykle
      przydatne podczas tworzenia lepszych warunków rozwoju największego sektora gospodarki
      i zniwelowania barier uniemożliwiających wejście MŚP na zagraniczne rynki. Corocznie
      rekomendacje są przekazywane Przedstawicielom Komisji Europejskiej, Parlamentu
      Europejskiego, Parlamentowi RP, Rządowi RP, samorządu terytorialnego, środowisk
      naukowo-twórczych, samorządu gospodarczego oraz przedsiębiorcom.
