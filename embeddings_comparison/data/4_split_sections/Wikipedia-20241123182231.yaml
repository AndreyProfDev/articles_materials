      zatrudnienia czy majątku trwałego, ale także jej efektywność.
    title: Main
  - content: '- Przedmiotowy – charakteryzuje działowo-gałęziową strukturę gospodarki,

      - Terytorialny – rozmieszczenie elementów gospodarki narodowej,

      - Instytucjonalny – kształtowanie się stosunków ekonomicznych w kraju oraz stosowanie
      rozwiązań regulacyjnych,

      - Podział pracy i specjalizacja międzynarodowa – struktura zasobów naturalnych
      i produkcji. Decyduje to o przewadze komparatywnej i konkurencyjności podobnych
      towarów wytwarzanych za granicą.'
