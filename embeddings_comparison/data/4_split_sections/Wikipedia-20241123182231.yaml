    title: Main
  - content: 'Nie ma powszechnie przyjętego kryterium uznania danego kraju za rozwinięty
      lub nie, ale głównymi wyznacznikami są PKB per capita oraz wskaźnik rozwoju
      społecznego (WRS).

      Co roku publikowana jest lista państw ułożonych według poziomu rozwoju i podzielonych
      między cztery grupy rozwojowe: kraje bardzo wysoko rozwinięte (wśród nich Polska),
      kraje wysoko rozwinięte, kraje średnio rozwinięte i kraje słabo rozwinięte.
      Oceny kraju dokonuje się na podstawie analizy ogólnej państwa, przy czym najważniejszymi
      czynnikami branymi pod uwagę przy klasyfikacji państw do rankingu WRS są: edukacja,
      służba zdrowia, jakość życia i dochód per capita.

      Istnieją także inne indeksy poza wskaźnikiem rozwoju społecznego, lecz ten jest
      najbardziej znany.'
