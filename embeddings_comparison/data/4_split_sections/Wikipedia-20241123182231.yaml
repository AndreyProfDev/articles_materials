  - content: 'Gospodarka towarowo-pieniężna – w ekonomii wytwarzanie produktów przeznaczonych
      do wymiany przez różnego typu transakcje kupna-sprzedaży. Jest ona związana
      ze społecznym podziałem pracy i wyodrębnieniem się producentów. Gospodarka towarowo-pieniężna
      jest przeciwieństwem gospodarki naturalnejJ. Barburski, Ocena poziomu wynagradzania
      oraz zarządzania przedsiębiorstw na podstawie nieparametrycznej funkcji produkcji,
      „Проблеми теорії та методології бухгалтерського обліку, контролю і аналізу”,
      2 (8), 2007, s. 11..

      Praktycznie wszystkie współczesne gospodarki są gospodarkami towarowo-pieniężnymi.'
