- sections:
  - content: 'Gospodarka narodowa – całokształt zjawisk gospodarczych na terytorium
      danego państwa.

      Dzieli się na działy, do których zaliczamy: przemysł, rolnictwo, budownictwo,
      transport, łączność, handel itp. Niektóre działy dzielą się na gałęzie, w których
      skład wchodzą różne przedsiębiorstwa.'
    title: Main
  - content: 'Gospodarka narodowa dzieli się na pięć sektorów:

      - Sektor pierwszy – zalicza się do niego: rolnictwo, leśnictwo, rybołówstwo.

      - Sektor drugi – zalicza się do niego: przemysł wydobywczy, górnictwo i przetwórczy
      oraz budownictwo.

      - Sektor trzeci – zalicza się do niego: transport, łączność, gospodarkę komunalną
      i mieszkaniową oraz handel.

      - Sektor czwarty – zalicza się do niego: finanse, ubezpieczenia, marketing i
      reklamę oraz obrót nieruchomościami.

      - Sektor piąty – obejmuje: ochronę zdrowia, opiekę społeczną, edukację, badania
      naukowe, turystykę i rekreację, administrację państwową, wymiar sprawiedliwości,
      policję i wojsko.'
    title: Podział na sektory
  - content: '- gospodarka

      - gospodarka ekstensywna

      - gospodarka rynkowa

      - gospodarka wojenna'
    title: Zobacz też
  - content: ''
    title: Przypisy
  title: Gospodarka narodowa
- sections:
  - content: 'System gospodarczy – jeden z podstawowych elementów systemu społecznego,
      wynikający z pierwotnej konieczności wytwarzania dóbrJ. Gardawski, L. Gilejko,
      J. Siewierski, R. Towalski, Socjologia Gospodarki, Difin, Warszawa 2006, s.
      40–46.. W dzisiejszych czasach budowany jest poprzez system prawny, który reguluje
      i kształtuje rzeczywistość gospodarczą.

      Podstawowym i ostatecznym celem działalności gospodarczej jest zaspokajanie
      potrzeb, a te mogą być zaspokojone poprzez wytwarzanie produktów, czyli towarów
      i usług. Do produkcji wspomnianych niezbędne są zasoby gospodarcze, które zasadniczo
      możemy podzielić na: ziemię, kapitał i pracę (czasem dodaje się także technologię)K.A.
      Wojtaszczyk, W. Jakubowski (red.), Społeczeństwo i polityka, Oficyna Wydawnicza
      Aspra-JR, Warszawa 2003, s. 487–490..

      Dla współczesnych gospodarek najważniejszymi rodzajami podmiotów są: przedsiębiorstwa,
      gospodarstwa domowe oraz państwo. W przypadku roli sektora publicznego czynione
      jest zastrzeżenie, że jego obecność w niektórych modelach gospodarczych (np.
      w gospodarce rynkowej) nie jest koniecznaT. Włudyka (red.), Polityka gospodarcza,
      Wolters Kluwer, Warszawa 2007, s. 56–57..

      Systemy gospodarcze obejmują produkcję, dystrybucję i konsumpcję dóbr. Głównymi
      modelami systemów gospodarczych są: kapitalizm, system socjalistyczny oraz gospodarki
      mieszane.'
    title: Main
  - content: 'Struktura decyzyjna danej gospodarki determinuje sposób alokacji zasobów
      (środków produkcji), redystrybucję, stopień centralizacji tego procesu oraz
      kwestię, kto podejmuje decyzje. Decyzje mogą być podejmowane przez demokrację
      gospodarczą, rząd, lub prywatnych przedsiębiorców. Wybrane aspekty struktury
      decyzyjnej, to:

      - mechanizm koordynacji: odnosi się do sposobu zdobywania informacji i jej wykorzystania
      w działalności ekonomicznej. Występują dwie dominujące formy koordynowania tej
      działalności – poprzez planowanie (które może być zarówno scentralizowane, jak
      i zdecentralizowane, oba modele nie wykluczają siebie wzajemnie) lub działalność
      rynkową.

      - własność środków produkcji: ściśle wiąże się z pojęciem własności (prawem
      do rozporządzania produktem) i kontrolą nad wykorzystaniem środków produkcji.
      Środki produkcji mogą być własnością prywatną, państwową, wspólnotową lub należeć
      do dóbr wspólnej puli.

      - system bodźców: mechanizm aktywizowania podmiotów i włączania ich w działalność
      produkcyjną. Może opierać się na rekompensacie materialnej (wynagrodzenie) i/lub
      na rekompensacie niematerialnej, np. prestiż społecznyComparing Economic Systems
      in the Twenty-First Century, 2003, by Gregory and Stuart. ..'
    title: Części składowe
  - content: 'Forma systemu gospodarczego jest determinowana przez konkretne rozwiązania
      instytucjonalne. Przykładowo, problem rzadkości wymaga odpowiedzi na pytania:
      „co produkować?”, „w jaki sposób produkować?” oraz „kto otrzymuje produkt?”.
      System gospodarczy jest sposobem wynajdywania odpowiedzi w tych kwestiach. Różne
      systemy gospodarcze mogą udzielać różnych odpowiedzi na te same pytania. Gospodarka
      może stawiać przed sobą różne cele, np. produktywność, wzrost gospodarczy, wolność
      czy równośćDavid W. Conklin (1991), Comparative Economic Systems, University
      of Calgary Press, s. 1..

      Systemy gospodarcze dzielą się ze względu na sposób alokowania zasobów (środki
      produkcji) i podejmowania decyzji. Zwyczajowo zestawia się dwa najbardziej znaczące
      modele gospodarcze – kapitalizm (gospodarka rynkowa) oraz socjalizm (gospodarka
      planowa).

      W gospodarce kapitalistycznej produkcja z założenia ma prowadzić do maksymalizowania
      zysków stając się w ten sposób elementem procesu akumulacji kapitału. Przedsiębiorstwa
      podejmując decyzje w zakresie inwestycji oraz wykorzystania środków produkcji
      działają w warunkach konkurencji rynkowej. Na rynkach kapitałowych wspomniane
      decyzje podejmowane są głównie przez właścicieli prywatnych środków produkcji.
      Kapitalistyczny model gospodarki posiada kilka odmian, począwszy od leseferyzmu
      (zakładającego minimum udziału państwa w gospodarce), a skończywszy na regulowanej,
      społecznej gospodarce rynkowej, która zakłada udział państwa na poziomie pozwalającym
      na zapewnienie sprawiedliwości społecznej, możliwie sprawiedliwego podziału
      bogactwa (patrz: państwo opiekuńcze) lub naprawy niewydolności rynku (patrz:
      interwencjonizm).

      Charakter produkcji w gospodarkach socjalistycznych był przedmiotem dyskusji.
      Spór podzielił teoretyków marksizmu zasadniczo na dwa obozy. Pierwszy zakładał,
      że produkcja jest nastawiona na zaspokojenie potrzeb poprzez wytwarzanie tzw.
      produktów bezpośrednich (tj. takich, które zaspokajają potrzebę bezpośrednio,
      a nie przez akt kupna-sprzedaży), a inwestycje (regulowanie wartości dodanej)
      są wynikiem kolektywnych decyzji. Krytycy tego podejścia starali się wykazać
      jego sprzeczności, które jednocześnie obrazowały poglądy drugiego obozu. Jak
      pisał Bronisław Minc: B. Minc argumentując przeciw tezie o produkcji bezpośrednio
      zaspokajającej potrzeby zauważa, że nie można by wówczas mówić o płacach, kosztach,
      rynku oraz popycie i podaży. Wydaje się, że pogląd o towarowym charakterze produkcji
      w gospodarkach socjalistycznych przeważył, jednak pewne elementy wcześniej wspomnianego
      modelu były obecne, np. popularne talony (asygnata) na dobra deficytowe.

      Własność nad środkami produkcji może przybrać formę państwowej, albo spółdzielczej.
      Gospodarki socjalistyczne, które bazują na procesie akumulacji kapitału, ale
      jednocześnie kontrolują lub kierują tym procesem (poprzez wspomniane formy własności)
      w celu zapewnienia stabilności, równości i rozszerzenia swej władzy decyzyjnej
      nazywane są systemami rynkowego socjalizmu.'
    title: Typy
  - content: '- Gospodarka rynkowa – decyzje dotyczące zakresu i sposobu produkcji
      podejmowane są przez podmioty gospodarcze; jednym ze współczesnych przykładów
      gospodarki rynkowej jest kapitalizm, który wywodzi się z gospodarki towarowo-pieniężnej.

      - Socjalizm rynkowy – system gospodarczy, w którym łączy się działalność sektora
      publicznego z mechanizmem rynkowym, a więc środki produkcji są albo własnością
      publiczną, albo są wspólnie posiadane i eksploatowane w celach zarobkowych w
      gospodarce rynkowej.

      - Korporacjonizm – dąży do ustanowienia reżimu opartego na korporacjach zorganizowanych
      pionowo, skupiających tak pracodawców, jak i pracobiorców różnych szczebli oraz
      inne jednostki działające w tym samym zawodzie, czy też branży, z zachowaniem
      ich hierarchii (np. wykonawca i podwykonawca).

      - Gospodarka mieszana – składa się ona zarówno z sektora publicznego, jak i
      prywatnego. Przykładami mogą być Społeczna gospodarka rynkowa i Trzecia Droga.

      - Gospodarka planowa – często utożsamiana z gospodarką nakazowo-rozdzielczą;
      gospodarka, opierająca się na założeniach planów kilkuletnich, określających
      najważniejsze cele rozwoju państwa; charakterystyczna dla okresu wojny, lub
      krajów tzw. bloku wschodniego.

      - Gospodarka tradycyjna – system historyczny; polegał na odtwarzaniu obyczajów
      przodków.

      - Gospodarka naturalna – typ gospodarki, która charakteryzuje się tym, że producent
      wytwarza produkty w celu bezpośredniego zaspokojenia swoich potrzeb, jednym
      z przykładów gospodarki naturalnej jest feudalizm.

      - Ekonomia uczestnicząca – system zakładający, że obywatele powinni mieć udział
      w decyzjach proporcjonalny do stopnia, w jakim te decyzje ich dotyczą.

      - Mutualizm – system oparty na wzajemności w przeciwstawności do walki konkurencyjnej.

      - Kultura darów – kultura, w której uczestniczący przekazują dobra posiadające
      wartość na poczet kształtowania dobrobytu swojej społeczności.

      - Barter – wymiana bezgotówkowa, czyli towar, bądź usługa, za towar.'
    title: Podstawowe typy systemów gospodarczych
  - content: 'Systemy socjalistyczne mogą być podzielone ze względu na mechanizm koordynacji
      (plany gospodarcze lub rynki). Wedle tego kryterium można wyróżnić gospodarkę
      planową oraz socjalizm rynkowy. Dodatkowo, gospodarkę socjalistyczną można podzielić
      ze względu na własność środków produkcji – własność państwową, spółdzielnie
      pracownicze i spożywcze oraz własność zbiorową. Hipotetyczną formą socjalizmu
      jest komunizm, który został określony przez Marksa w Krytyce programu gotajskiego
      drugą fazą socjalizmuKarol Marks „Uwagi na marginesie programu Niemieckiej Partii
      Robotniczej”.. W komunizmie dobra mają być rozdzielane wedle potrzeb, a nie
      tylko w oparciu o wkład w pracę.

      Głównym problemem gospodarek planowych jest koordynacja produkcji w sposób umożliwiający
      bezpośrednie zaspokojenie ludzkich potrzeb, względnie potrzeb gospodarczych
      (w przeciwieństwie do nastawienia na generowanie zysków, gdzie zaspokajanie
      potrzeb jest produktem ubocznym). Ma to się odbywać z korzyścią dla sił produkcyjnych
      w gospodarce, które dzięki temu staną się odporne na systemowe niewydolności
      i kryzysy nadprodukcji, które są charakterystyczne dla kapitalizmu. Produkcja
      służąca potrzebom społeczeństwa jest przeciwieństwem produkcji nastawionej na
      akumulację kapitałuSocialism: Still Impossible After All These Years, on Mises.org.
      Retrieved February 15, 2010, from Mises.org http://mises.org/journals/scholar/Boettke.pdf,
      What Socialism means: „The ultimate end of socialism was the ‘end of history’,
      in which perfect social harmony would permanently be established. Social harmony
      was to be achieved by the abolition of exploitation, the transcendence of alienation,
      and above all, the transformation of society from the ‘kingdom of necessity’
      to the ‘kingdom of freedom.’ How would such a world be achieved? The socialists
      informed us that by rationalizing production and thus advancing material production
      beyond the bounds reachable under capitalism, socialism would usher mankind
      into a post-scarcity world.”.Socialism and Calculation, on worldsocialism.org.
      Retrieved February 15, 2010, from worldsocialism.org: https://web.archive.org/web/20110607071929/http://www.worldsocialism.org/spgb/overview/calculation.pdf:
      „Although money, and so monetary calculation, will disappear in socialism this
      does not mean that there will no longer be any need to make choices, evaluations
      and calculations...Wealth will be produced and distributed in its natural form
      of useful things, of objects that can serve to satisfy some human need or other.
      Not being produced for sale on a market, items of wealth will not acquire an
      exchange-value in addition to their use-value. In socialism their value, in
      the normal non-economic sense of the word, will not be their selling price nor
      the time needed to produce them but their usefulness. It is for this that they
      will be appreciated, evaluated, wanted... and produced.”..'
    title: Typy systemów socjalistycznych
  - content: 'Gospodarka mieszana składa się zarówno z sektora państwowego, jak i
      prywatnego. Niekiedy występuje w niej również własność spółdzielcza. Gospodarki
      mieszane cechuje obecność samoregulacji rynkowej przy zachowaniu państwowej
      kontroli gospodarki. Zaangażowanie państwa w gospodarkę przejawiać się może
      w postaci: regulacji prawnych, lub dużego udziału spółek państwowych w rynku.'
    title: Typy gospodarek mieszanych
  - content: 'Teoria rozwoju gospodarczego autorstwa Karola Marksa była oparta na
      przesłance o ewoluowaniu systemów gospodarczych. W szczególności dotyczy to
      poglądu, iż lepsze systemy gospodarcze wypierają te gorsze. Problemem „gorszych”
      systemów były wewnętrzne sprzeczności i niewydajności, które czyniły niemożliwym
      ich przetrwanie w dłuższej perspektywie. W schemacie Marksa, feudalizm został
      zastąpiony przez kapitalizm, który z kolei może zostać zastąpiony przez socjalizm.
      Joseph Schumpeter również sformułował ewolucyjną koncepcję rozwoju gospodarczego,
      ale – w przeciwieństwie do Marksa – marginalizował rolę walki klasowej w zmianie
      jakościowej w sposobach produkcji. Jak pokazała historia, w państwach socjalistycznych,
      rządzonych wedle doktryny marksizmu-leninizmu, gospodarka centralnie planowana,
      albo się załamała, albo była stopniowo reformowana w kierunku gospodarki rynkowej,
      przykładowo: pierestrojka i rozpad ZSRR, chińskie reformy („socjalizm o chińskiej
      specyfice”) oraz reformy Doi Moi w Wietnamie.

      Ekonomia ewolucyjna głównego nurtu kontynuuje badania nad zmianami gospodarczymi
      w czasach współczesnych. Obecnie, na gruncie rozwijającej się ekonomii złożoności,
      obserwuje się także ponowne zainteresowanie w pojmowaniu systemów gospodarczych
      jako systemów ewoluujących.'
    title: Ekonomia ewolucyjna
  - content: 'System gospodarczy może być traktowany jako część systemu społecznego,
      równie istotnego co: system prawny, system polityczny, czy kultura. Często zachodzi
      silny związek pomiędzy danymi ideologiami, systemami politycznymi a konkretnym
      systemem gospodarczym. Wiele ustrojów gospodarczych „nakłada się na siebie”
      w różnych obszarach, np. termin gospodarka mieszana jest często postrzegany
      jako połączenie elementów różnych systemów. Inne z kolei mogą się wzajemnie
      wykluczać.

      Z socjologicznego punktu widzenia problem wzajemnego oddziaływania pomiędzy
      gospodarką a państwem jest równie istotny co rynek czy instytucje rynkowe. Pojawiają
      się różne koncepcje próbujące określić rolę państwa w gospodarce. Zasadniczo
      wszystkie te koncepcje poszukują odpowiedzi na pytanie: „ile państwa w gospodarce?”.

      W ujęciu modelowym przyjmuje się cztery główne typy ładu społeczno-ekonomicznegoJ.
      Gardawski, L. Gilejko, J. Siewierski, R. Towalski, Socjologia gospodarki, Difin,
      Warszawa 2006, s. 106–107.:

      - ład monocentryczny – gospodarka upaństwowiona, centralnie planowana,

      - modele pluralistyczne – bazują na demokracji i wolności rynkowej,

      - modele partycypacyjne – opierające się na idei społeczeństwa obywatelskiego,

      - modele etatystyczne – utożsamiana z interwencjonizmem państwowym, przedstawicielem
      tzw. nowego etatyzmu był John Maynard Keynes.'
