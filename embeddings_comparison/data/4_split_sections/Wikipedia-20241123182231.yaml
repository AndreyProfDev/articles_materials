- sections:
  - content: Działalność gospodarcza – forma aktywności przedsiębiorców działających
      na rynku.
    title: Main
  - content: 'W prawie Unii Europejskiej działalność gospodarcza obejmuje wszelką
      działalność producentów, handlowców lub usługodawców, włącznie z górnictwem,
      działalnością rolniczą i wykonywaniem wolnych zawodów lub uznanych za takie.
      Za działalność gospodarczą uznaje się w szczególności wykorzystywanie, w sposób
      ciągły, majątku rzeczowego lub wartości niematerialnych w celu uzyskania z tego
      tytułu dochoduDyrektywa Rady 2006/112/WE z dnia 28 listopada 2006 r. w sprawie
      wspólnego systemu podatku od wartości dodanej ()..

      W prawie polskim funkcjonuje kilka definicji działalności gospodarczej.

      W Prawie przedsiębiorców: zorganizowana działalność zarobkowa, wykonywana we
      własnym imieniu i w sposób ciągłyArt. 3 ustawy z dnia 6 marca 2018 r. – Prawo
      przedsiębiorców ().. W uchylonej ustawie o swobodzie działalności gospodarczejArt.
      2 ustawy z dnia 2 lipca 2004 r. o swobodzie działalności gospodarczej ().: zarobkowa
      działalność wytwórcza, budowlana, handlowa, usługowa oraz poszukiwanie, rozpoznawanie
      i wydobywanie kopalin ze złóż, a także działalność zawodowa, wykonywana w sposób
      zorganizowany i ciągły.

      Ustawa o podatku dochodowym od osób fizycznych: działalność zarobkowa (wytwórcza,
      budowlana, handlowa, usługowa; lub: polegająca na poszukiwaniu, rozpoznawaniu
      i wydobywaniu kopalin ze złóż; lub: polegająca na wykorzystywaniu rzeczy oraz
      wartości niematerialnych i prawnych), prowadzona we własnym imieniu bez względu
      na jej rezultat, w sposób zorganizowany i ciągły, z której uzyskane przychody
      nie są zaliczane do innych przychodów ze źródeł wymienionych w art. 10 ust.
      1 pkt 1, 2 i 4–9Ustawa z dnia 26 lipca 1991 r. o podatku dochodowym od osób
      fizycznych ()..

      W ustawie o VAT: działalność gospodarcza obejmuje wszelką działalność producentów,
      handlowców lub usługodawców, w tym podmiotów pozyskujących zasoby naturalne
      oraz rolników, a także działalność osób wykonujących wolne zawody, również wówczas,
      gdy czynność została wykonana jednorazowo w okolicznościach wskazujących na
      zamiar wykonywania czynności w sposób częstotliwy. Działalność gospodarcza obejmuje
      również czynności polegające na wykorzystywaniu towarów lub wartości niematerialnych
      i prawnych w sposób ciągły dla celów zarobkowychArt. 15 ust. 2 ustawy z dnia
      11 marca 2004 r. o podatku od towarów i usług ().

      Jeszcze inaczej definiuje działalność gospodarczą m.in. ustawa o systemie ubezpieczeń
      społecznych: za osobę prowadzącą pozarolniczą działalność uważa się osobę prowadzącą
      pozarolniczą działalność gospodarczą na podstawie przepisów o działalności gospodarczej
      lub innych przepisów szczególnych, twórcę i artystę, osobę prowadzącą działalność
      w zakresie wolnego zawodu, wspólnika jednoosobowej spółki z o.o., spółki jawnej,
      komandytowej lub partnerskiej, osobę prowadzącą publiczną lub niepubliczną szkołę,
      inną formę wychowania przedszkolnego, placówkę lub ich zespółArt. 8 ust. 6 ustawy
      z dnia 13 października 1998 r. o systemie ubezpieczeń społecznych ()..'
    title: Definicje prawne
  - content: ''
    title: Podział
  - content: '- nastawienie na przynoszenie dochodu – prowadzą ją przede wszystkim
      przedsiębiorstwa prywatne,

      - nastawienie na osiąganie innych korzyści ekonomicznych – prowadzą ją m.in.
      przedsiębiorstwa komunalne, których głównym celem jest jak najlepsze zaspokajanie
      potrzeb społeczności lokalnej,

      - nastawienie na osiąganie innych korzyści (działalność non-profit) – działalność,
      która ma przynosić korzyści takie jak rozwój przedsiębiorczości, nauka, szkolenie,
      pomoc chorym. Taka działalność nie może generować przychodu właścicielowi, dlatego
      jest prowadzona najczęściej w formie fundacji.'
    title: Dochodowość
  - content: 'Jednoosobową działalność gospodarczą prowadzą osoby fizyczne na własną
      rękę jako przedsiębiorcy. W celu rozpoczęcia działalności gospodarczej można
      wysłać elektronicznie wniosek o wpis do Centralnej Ewidencji i Informacji o
      Działalności Gospodarczej (CEIDG), tak zwanego spisu przedsiębiorców. Po złożeniu
      wniosku następuje wpis do ewidencji, nadanie numeru NIP, nadanie numeru REGON
      oraz zgłoszenie przedsiębiorcy jako płatnika składek do ZUS. Przedsiębiorca
      prowadzący działalność gospodarczą objęty jest obowiązkowo ubezpieczeniami:
      emerytalnym, rentowymi, wypadkowym i zdrowotnym. Ubezpieczenie chorobowe jest
      dobrowolneJednoosobowa działalność gospodarcza. Jak założyć jednoosobową firmę?
      Ile wynoszą składki ZUS dla osób rozpoczynających własną działalność?, strefabiznesu.pl..'
    title: Jednoosobowa działalność gospodarcza
  - content: '- działalność regulowana – której wykonywanie wymaga spełnienia warunków
      określonych szczególnymi przepisami prawaArt. 43 ust. 1 ustawy z dnia 6 marca
      2018 r. – Prawo przedsiębiorców., m.in. działalność w zakresiePor. art. 46 ust.
      1 uchylonej ustawy z dnia 2 lipca 2004 r. o swobodzie działalności gospodarczej.:

      -- poszukiwania i wydobywania kopalin ze złóż,

      -- wytwarzania i obrotu materiałami wybuchowymi, a także bronią i amunicją,

      -- wytwarzania i obrotu paliwami oraz energią,

      -- usług detektywistycznychArt. 3 ustawy z dnia 6 lipca 2001 r. o usługach detektywistycznych
      ().,

      -- ochrony osób i mienia,

      -- rozpowszechniania programów radiowych i telewizyjnych,

      -- przewozów lotniczych, drogowych i kolejowych,

      -- prowadzenia kasyna gry,

      -- kupna i sprzedaży wartości dewizowych oraz pośrednictwa w ich kupnie i sprzedażyArt.
      2 ust. 1 pkt 19 oraz art. 11 ust. 1 ustawy z dnia 27 lipca 2002 r. Prawo dewizowe
      ().,

      -- działalność w zakresie związku sportowegoArt. 11 ust. 1 ustawy z dnia 25
      czerwca 2010 r. o sporcie ().,

      -- prowadzenia indywidualnej praktyki lekarskiej; indywidualnej specjalistycznej
      praktyki lekarskiej albo grupowej praktyki lekarskiejArt. 49a ustawy z dnia
      5 grudnia 1996 r. o zawodach lekarza i lekarza dentysty ().,

      -- prowadzenia stacji kontroli pojazdówArt. 83 ust. 2 ustawy z dnia 20 czerwca
      1997 r. – Prawo o ruchu drogowym ()..

      - działalność nieregulowana – którą można prowadzić według przepisów ogólnych.'
