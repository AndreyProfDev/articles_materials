- sections:
  - content: 'Nowa gospodarka () – gospodarka oparta na coraz większym udziale wiedzy
      i informacji, co znajduje odzwierciedlenie w szczególności w rozwoju technologii
      informacyjnych i komunikacyjnych, przyczyniając się do postępującej globalizacjiNowa
      gospodarka: Mity i rzeczywistość. Od fascynacji do naukowego poznania..

      Termin używany jest do określenia rezultatów przekształceń gospodarki Stanów
      Zjednoczonych z gospodarki opartej na przemyśle na gospodarkę opartą na rozwoju
      technologii. Zdaniem wielu ekonomistów te zmiany wywołały wkroczenie kraju na
      ścieżkę trwałego rozwoju, niskiego bezrobocia oraz częściowej immunizacji wobec
      wahań koniunkturalnych.'
