  - content: 'Planowane postarzanie produktu, także planowane ograniczenie trwałości
      produktu, zaplanowana żywotność produktu (ang. planned obsolescence) – strategia
      producenta, mająca na celu takie projektowanie towarów, aby miały one ograniczony
      czas użytecznego życia, po tym zaś okresie stawały się niesprawne, a często
      nieopłacalne w naprawie.

      Planowe postarzanie produktu ma wymusić na konsumencie ponowne kupienie produktu
      i tym samym przyniesienie zysku producentowi. Co do zasady przedsiębiorstwa
      produkcyjne nie przyznają się do tej praktyki, a niekiedy otwarcie ją negują.'
    title: Main
  - content: 'Praktyka ta szkodzi środowisku naturalnemu:

      - Do produkcji nowych wyrobów są potrzebne nowe zasoby i energia, co nie sprzyja
      ekologii.

      - Przestarzałe produkty są kierowane na składowisko odpadów zwiększając zanieczyszczenie
      środowiska.

      - W przypadku recyklingu znów potrzebna energia i nowe materiały.

      W ten sposób planowane ograniczenie trwałości produktów sprzyja marnotrawstwu
      zasobów naturalnych i degradacji środowiska naturalnego jako całości.'
    title: Planowane postarzanie i ekologia
  - content: 'W 1924 przedsiębiorstwa Osram, Philips i General Electric rozpoczęły
      proces planowanego postarzania żarówek. Utworzyły tzw. kartel Phoebusa będący
      oficjalnie szwajcarską firmą Phoebus S.A. Compagnie Industrielle pour le Développement
      de l’Éclairage, kontrolujący ich produkcję i sprzedaż. Jego celem było obniżenie
      ich jakości, tak aby każda z nich pracowała maksymalnie 1000 godzin (zamiast
      około 2000)Hehkulampussa ja ledissä sama ongelma: lämpö, Suomen Kuvalehti 13.10.2011,
      an interview of research scientist, D.Sc. Eino Tetri, Leader of the Light Sources
      and Energy Group in Aalto University.. Działania te zakłócił początek II wojny
      światowejThey will know who they’re dealing with Anton Philips, 2004..

      Tygodnik „The Economist” jako przykład takiego postępowania producentów podaje
      nylonowe pończochy. Nieuniknione „puszczanie oczek” powodowało, że kobiety kupowały
      nowe pończochy, a to przez lata powstrzymywało szukanie włókna, które by nie
      miało tej cechy.

      Badania przeprowadzone w 2013 w Niemczech na zlecenie partii Związek 90/Zieloni
      wykazały, że uszkodzenia wynikłe z zaplanowanego starzenia się sprzętu AGD i
      elektroniki wynoszą w tym kraju kilka miliardów euro rocznie.

      Współczesnym widocznym przykładem są liczniki w drukarkach atramentowych. Nawet
      w pełni sprawna drukarka przestaje w pewnym momencie drukować, co wynika z ustawień
      producentahttp://cejsh.icm.edu.pl/cejsh/element/bwmeta1.element.desklight-864d0ca0-19ca-4da5-9f34-300f49f507ab/c/HW_6_2015.142-151.pdf.
      Dlatego zwiększa się zainteresowanie ruchem „open hardware” (analogicznego do
      ruchu oprogramowania otwartoźródłowego – open source) i są m.in. projekty drukarek
      atramentowych.

      Innym przykładem może być świat rozrywki wideo – np. konsola Playstation 4 nie
      umożliwia oficjalnie grania w legalnie posiadane płyty z grami na Playstation
      2, chociaż ma takie funkcje wbudowane w systemie i programistom udało się je
      odblokować.

      Bosch mimo deklarowanej na stronach internetowych 10-letniej dostępności części
      zamiennych, umieszcza w popularnych mikserach MaxoMixx łatwo łamiący się plastikowy
      zatrzask, odmawiając użytkownikom późniejszej jego sprzedaży i proponując wymianę
      całego napędu jako pojedynczej części, co jest niemal równoważne z zakupem nowego
      urządzenia.'
    title: Przykłady
  - content: Politycy i działacze w stanie Waszyngton rozważają wprowadzenie zakazu
      sprzedaży sprzętu elektronicznego z trudno wymienialnymi akumulatorami. W Substitute
      House Bill 2279 pomysłodawcy zauważają, że „producenci, utrudniając możliwość
      napraw i serwisowania sprzętu elektronicznego, działają na niekorzyść konsumenta.
      Wobec czego zamierzeniem ustawodawcy jest rozszerzenie dostępu do informacji
      oraz narzędzi niezbędnych do naprawy elektroniki użytkowej”. Jeden z wnioskodawców
      stwierdził (dla portalu Motherboard), że Apple przykleja baterię do obudowy
      w iPhone, tylko po to by zapobiec próbom napraw tych smartfonów.
