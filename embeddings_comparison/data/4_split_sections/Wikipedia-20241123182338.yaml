- sections:
  - content: Związek wyznaniowy – wspólnota powołana dla celów kultu religijnego,
      propagowania i nauczania określonej tradycji religijnej.
    title: Main
  - content: Polska ustawa o gwarancjach wolności sumienia i wyznania z 1989 definiuje
      związek wyznaniowy jako wspólnotę religijną, zakładaną w celu wyznawania i szerzenia
      wiary religijnej, posiadającą własny ustrój, doktrynę i obrzędy kultoweArt.
      2 pkt 1 ustawy. Może ona uzyskać regulację sytuacji prawnej poprzez rejestrację.
      Aby uzyskać wpis do rejestru kościołów i innych związków wyznaniowych prowadzonego
      przez ministra właściwego do spraw wyznań religijnych, ustawa o gwarancjach
      wolności sumienia i wyznania wymaga złożenia wniosku przez co najmniej 100 obywateli
      polskich posiadających pełną zdolność do czynności prawnych. Wnioskodawcy składają
      listę zawierającą ich notarialnie poświadczone podpisy potwierdzające treść
      wniosku i deklaracji o utworzeniu kościoła lub innego związku wyznaniowego,
      imię i nazwisko, datę urodzenia, miejsce zamieszkania oraz rodzaj, serię i numer
      dokumentu tożsamości oraz numer PESEL każdego z wnioskodawców. Wnioskodawcy
      mogą wybrać spośród siebie co najmniej pięcioosobowy komitet założycielski reprezentujący
      ich w postępowaniu w sprawie wpisu do rejestru. W świetle art. 25 Konstytucji
      RP wpis do rejestru nie jest koniecznym warunkiem legalnego działania związku
      wyznaniowegoJ. Cupriak, Związek wyznaniowy, [w:] Leksykon prawa wyznaniowego.
      100 podstawowych pojęć, red. Artur Mezglewski, Wydawnictwo C.H. Beck, Warszawa
      2014, , s. 586-588..
    title: Sytuacja w Polsce
  - content: 'Socjologowie religii dzielą organizacje religijne na trzy typy: kościoły,
      denominacje i sekty.

      - kościół – najczęściej największa spośród typów organizacji religijnych; hierarchiczna,
      rządzona najczęściej autokratycznie; duchowieństwo stanowi wydzieloną, wyspecjalizowaną
      grupę.

      - denominacja – struktura demokratyczna lub hierarchiczna; profesjonalne duchowieństwo;
      współpraca z innymi związkami wyznaniowymi.

      - sekta – najczęściej najmniejsza spośród typów organizacji religijnych; demokratyczna
      lub autokratyczna, zwarta; członkostwo nabywane przez wybór lub doświadczenie
      nawrócenia; mała różnica między duchowieństwem i pozostałymi członkami; funkcje
      duchowne często wykonywane dorywczo przez nieprofesjonalistów.'
    title: Definicje socjologiczne
