- sections:
  - content: 'Neofita (łac. neophytus – nowo nawrócony, z gr. νεόφυτος, neóphytos
      – na nowo zasadzony) – osoba, która niedawno przyjęła jakąś wiarę. Określenie
      stosowane najczęściej w odniesieniu do chrześcijaństwa. Do XV wieku neofita
      nie mógł przyjmować godności kościelnych, później jednak, początkowo w Hiszpanii,
      a następnie na gruncie całego Kościoła, zniesiono to ograniczenie.

      Określenie to stosuje się również do nowego wyznawcy danej ideologii lub do
      polityka zmieniającego przynależność partyjną. Ma ono wtedy charakter ironiczny
      i podkreśla jego przesadną gorliwość oraz niejednokrotnie ostentacyjne obnoszenie
      się z nowo przyjętymi zasadami.

      Określenia tego często używa się w ośrodkach terapeutycznych, rehabilitacyjno-readaptacyjnych.
      Mianem neofity określa się też osobę, która ukończyła proces terapii w walce
      z nałogiem (alkohol, narkotyki itp.), podkreśla ono pewnego rodzaju duchowe
      nawrócenie, zmianę poglądów i nowego spojrzenia na świat.'
    title: Main
  - content: '- prozelityzm

      - apostazja'
