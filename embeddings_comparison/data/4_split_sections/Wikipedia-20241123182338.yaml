  - content: Czas cykliczny – kategoria kulturowego oglądu czasu, opisuje postrzeganie
      czasu w kulturach tradycyjnych jako odradzalny lub powtarzalnyAndrzej Zajączkowski
      [red.], Czas w kulturze [wybór], Warszawa 1987. Wiara w cykliczność czasu była
      obecna również u Platona. Zanikła w kulturze europejskiej wraz z rozwojem chrześcijaństwa,
      wierzącego w czas linearny.
    title: Main
  - content: Najdalsza przeszłość jest jednocześnie najbliższą przyszłością. Wszystkie
      wydarzenie powracają, dosłownie lub w zmienionej postaci. Takie ujęcie czasu
      wyraża grecka, archaiczna koncepcja złotego wieku.
    title: Czas cykliczny powtarzalny
  - content: Koncepcja upływu czasu, w której czas starzeje się i rytualnie umiera
      a wraz z nim kończy się w wymiarze symbolicznym porządek świata i ład. Następuje
      przejściowy okres chaosu i rozprężenia obyczajowego, który kończy się wraz z
      inauguracją święta Nowego Roku, kiedy następuje recytacja mitu opisującego stworzenie
      Świata przez bogów i bohaterów. Ład zostaje przywrócony a społeczeństwo regeneruje
      się. Koncepcja czasu łączona przez Mirceę Eliadego ze społeczeństwem archaicznymWiktor
      Werner, Historyczność i mit. Między rozróżnieniem a samookreśleniem [w:] Bartosz
      Korzeniewski [red.] Narracje o Polsce, Wydawnictwo PTPN, Poznań 2008(2009),
      s. 85 – 96.
