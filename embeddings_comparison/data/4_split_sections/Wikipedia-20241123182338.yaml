    title: Post w chrześcijaństwie
  - content: 'Postrzegając osobę człowieka jako jedność ciała i duszy, Kościół prawosławny
      nalega na to, iż ciało musi być kształtowane i utrzymywane w dyscyplinie tak
      samo jak dusza. Stąd prawosławny kalendarz liturgiczny poprzetykany jest dłuższymi
      lub krótszymi okresami postu, występującymi zwłaszcza przed dużymi świętami.

      W ciągu roku liturgicznego pojawiają cztery główne okresy długiego postu:

      - Post Filipowy (przed świętem Bożego Narodzenia) – trwa czterdzieści dni, od
      14 listopada do 24 grudnia według kalendarza juliańskiego (27.11–06.01 według
      kalendarza gregoriańskiego).

      - Wielki post – rozpoczyna się w poniedziałek po Niedzieli przebaczenia win
      (Niedziela Seropustna), siedem tygodni przed świętem Paschy.

      - Post Piotrowy – rozpoczyna się w poniedziałek, osiem dni po święcie Pięćdziesiątnicy,
      a kończy się 28 czerwca (11.07), w wigilię święta apostołów Piotra i Pawła;
      w zależności od daty świętowania Paschy, czas jego trwania waha się od jednego
      do sześciu tygodni.

      - Post Uspieński (przed świętem Zaśnięcia Bogarodzicy) – trwa dwa tygodnie,
      od 1 do 14 sierpnia (14.08–27.08).

      Oprócz tych czterech głównych okresów dniami postnymi są wszystkie środy (na
      pamiątkę zdradzenia Chrystusa przez Judasza) i piątki (dzień męki i śmierci
      Chrystusa na Krzyżu), a w niektórych monasterach również poniedziałki, z wyjątkiem
      okresu pomiędzy Bożym Narodzeniem a Epifanią, tygodni: Paschalnego i po święcie
      Pięćdziesiątnicy.

      Dniami postu są również święta Podwyższenia Krzyża Świętego – 14 września (27.09
      według kalendarza gregoriańskiego), Ścięcia głowy św. Jana Chrzciciela – 29
      sierpnia (11.09) oraz wigilia Epifanii – 5 stycznia (18.01.) Wszystkie posty
      jednodniowe są postami ścisłymi, z wyjątkiem:

      - jeżeli święto Bożego Narodzenia i Chrztu Pańskiego przypada na środę lub piątek,
      to post w tych dniach nie jest przestrzegany;

      - jeżeli święto Spotkania Pańskiego – 2 lutego (15.02 według kalendarza gregoriańskiego),
      Przemienienia Pańskiego – 6 sierpnia (19.08), Zaśnięcia Bogarodzicy – 15 sierpnia
      (28.08), Narodzenia Bogarodzicy – 8 września (21.09), Opieki Bogarodzicy (Pokrowy)
      – 1 października (14.10), Wprowadzenia Bogarodzicy do Świątyni – 21 listopada
      (04.12), Narodziny św. Jana Chrzciciela – 24 czerwca (07.07), świętych apostołów
      Piotra i Pawła – 29 czerwca (12.07) i Jana Teologa – 8 maja (21.05) przypadają
      na środę bądź piątek, wówczas dozwolone jest spożywanie ryb;

      - w okresie od Paschy do Pięćdziesiątnicy (tj. 50 dni po święcie Zmartwychwstania)
      w środy i w piątki również można spożywać ryby.'
