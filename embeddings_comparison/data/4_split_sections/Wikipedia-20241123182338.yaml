    title: Synkretyzm w religiach
  - content: 'W starożytnych religiach politeistycznych zawsze istniał synkretyzm
      religijny, byli z niego znani szczególnie Grecy, którzy asymilowali obce, np.
      azjatyckie bóstwa, włączając je do swojego panteonu. Niektóre bóstwa rodzime
      próbowano utożsamiać z bóstwami obcej religii, a praktyki kultowe łączono ze
      sobą, nadając im nowy sens i znaczenie. Etruskowie postąpili tak samo z bogami
      greckimi, a po nich przejęli ten zwyczaj Rzymianie, w odniesieniu do wierzeń
      ludów podbitych, a więc zarówno wobec mitologii greckich, jak i wierzeń bliskowschodnich,
      celtyckich i germańskich.

      Epoka hellenistyczna charakteryzowała się znacznym synkretyzmem religijnym:
      powstawały nowe bóstwa, łączące cechy różnych kultów, np. egipsko-grecki Serapis
      i Hermanubis lub przyjmowano egipskie (np. Izyda) i bliskowschodnie bóstwa (np.
      Atargatis, Baal i Hadad) do panteonu greckiegoGraham Shipley, The Greek World
      After Alexander 323–30 BC, Routledge, 2014, s.167-168, .

      Szczytowe nasilenie zjawisko synkretyzmu religijnego osiągnęło w pierwszych
      wiekach naszej ery w Cesarstwie Rzymskim. Powszechny stawał się kult bóstw pochodzenia
      orientalnego. Za Kaliguli wzniesiono świątynię Izydy (Izis) na Polu Marsowym.
      Rozwijał się kult Wielkiej Matki Kybele oraz irańskiego Mitry – boga słońca.
      Do panteonu rzymskiego trafił też Baal, za sprawą Heliogabala (panował w latach
      218‒222 n.e.), który w młodości sam był jego kapłanem w Emesie.

      Założeniem cesarzy rzymskich było „adoptowanie” bóstw ludów podbitych do rzymskiego
      panteonu lub też utożsamianie ich z bogami już istniejącymi, o podobnych atrybutach
      i funkcjach.'
    title: Europa w starożytności
  - content: 'Synkretyzm religijny cechował również duchowość Chińczyków, którzy raczej
      zacierali niż podkreślali różnice między wyznaniami. Czołowym przykładem może
      być bogini Guanyin, czczona zarówno przez taoistów, jak i buddystów (jako Awalokiteśwara).
      Inne elementy chińskiego synkretyzmu to rytuały konfucjańskie oraz kult przodków.

      W Japonii od VI wieku do 1868 dominował synkretyzm shintō-buddyjski polegający
      na łączeniu sanktuariów i form kultu obu tych religii. To zjawisko występuje
      również obecnieEncyclopedia of Shinto, Satō Makoto: Shinto and Buddhism (ang.),
      dostęp 21.01.2021.

      Do stosunkowo dużego znaczenia doszła synkretyczna religia sikhizm łącząca elementy
      islamu i hinduizmu..

      Manicheizm był syntezą wielu religii: staroirańskiego zoroastryzmu, buddyzmu
      i chrześcijaństwa.

      Gnostycyzm to wierzenia dualistyczne i łączące elementy chrześcijaństwa z grecko-egipskim
      hermetyzmem. Istnieje tu podobieństwo do buddyzmu i wschodniego mistycyzmu.
      Gnostycy spisywali zazwyczaj swoje doktryny w formie mitu, przypominającego
      obrazowanie plotyńskiej emanacji hipostaz bytu z Jedni. Szeroko, lecz powierzchownie
      sięgali do chrześcijaństwa, judaizmu, pogańskich kultów, i mnóstwa innych wierzeń
      religijnych w ówczesnym świecie i dostosowywali je do swoich potrzebMarcel Simon,
      Cywilizacja wczesnego chrześcijaństwa, Warszawa: Państwowy Instytut Wydawniczy,
      1981, s. 163-165, .'
    title: Religie Wschodu
  - content: 'Synkretyzm religijny jest zjawiskiem obecnym również współcześnie. Jego
      przykładami są obecnie religie afroamerykańskie, takie jak: santeria, obeah
      czy voodoo, gdzie obrzędowość chrześcijańska (najczęściej katolicka) jest łączona
      z tradycyjnym, plemiennym kultem, a postacie Marii lub świętych katolickich
      są utożsamiane z plemiennymi bóstwami.

      Thelema jest mieszaniną wielu różnych szkół wiary i praktyk w tym hermetyzmu,
      wschodniego mistycyzmu, jogi, XIX-wiecznych filozofów (np. Nietzschego), okultyzmu,
      kabały, a także religii starożytnej Grecji i Egiptu. Lista świętych Thelemy
      ukazuje, jak wiele wątków i motywów religijnych Thelema łączy w sobie, wybierając
      z nich to, co uznaje za przydatne.'
