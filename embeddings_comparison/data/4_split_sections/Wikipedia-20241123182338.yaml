- sections:
  - content: Synkretyzm religijny (z gr. συγκρητισμός, synkrētismós 'sojusz miast
      kreteńskich')Słownik Wyrazów Obcych – łączenie dwóch lub więcej systemów wierzeń
      religijnych w nowy system lub włączenie do danej tradycji religijnej idei pochodzących
      z tradycji niepowiązanych. Nie jest to zjawisko tożsame z wieloraką przynależnością
      religijną i politeizmem Timothy Insoll (red.), The Oxford Handbook of the Archaeology
      of Ritual and Religion, OUP Oxford, 2011, s.227, . W starożytnej Grecji to określenie
      używane było jako nazwa procesu polegającego na włączaniu obcych bóstw do panteonu
      własnychCristian G. Parker, Współczesna Religia Ludowa. Złożony Obiekt badań
      dla socjologów, Wydaw. Znak, 2008.
    title: Main
  - content: 'Pojęcie synkretyzmu w religii jest kontrowersyjne i trudne do zdefiniowania,
      dlatego że wszystkie religie można określić jako w mniejszym lub większym stopniu
      synkretyczne, czyli złożone z licznych wcześniejszych lub współczesnych im wierzeń.
      Można też uważać je za koncepcje w znacznym stopniu niezależne od siebie. W
      wielu przypadkach trudno ustalić, czy dana idea religijna powstała samodzielnie,
      czy też została zapożyczona z innego źródła. Określenie wzajemnego pokrewieństwa
      różnych religii jest w licznych przypadkach trudne lub niemożliwe do ustalenia.
      Z tego względu wielu religioznawców odrzuca pojęcie synkretyzmu religijnego
      jako nieprecyzyjne i niemożliwe do zdefiniowania. Tym niemniej to pojęcie jest
      stosowane w religioznawstwie wobec braku alternatywnego rozwiązania Anita Maria
      Leopold, Jeppe Sinding Jensen (red.), Syncretism in Religion: A Reader, Routledge,
      2016, s.50-55, .'
    title: Czym jest synkretyzm religijny?
  - content: ''
    title: Synkretyzm w religiach abrahamowych
  - content: 'Z uwagi na fakt, że religie politeistyczne i niektóre religie dharmiczne
      (hinduizm, buddyzm i taoizm) mają znacznie większą stałą zdolność do przyswajania
      elementów synkretycznych (z tradycji niepowiązanych) niż religie abrahamowe,
      wśród wyznawców tych ostatnich (uznających swoje religie za objawione) istnieje
      silny sprzeciw wobec określania ich religii jako synkretycznych. Jest faktem,
      że religie abrahamowe z zasady nie akceptują nowych bóstw z niepowiązanych tradycji
      religijnych, co jest z kolei powszechnym zjawiskiem w politeizmie i wskazanych
      religiach dharmicznych. Inaczej mówiąc, włączenie nowych bóstw do religii abrahamowej
      lub zmiana ustalonej rangi bóstw, prowadzi do rozpadu i powstania nowej, odrębnej
      religii, gdy w pozostałych religiach jest to najczęściej tylko uzupełnieniem
      istniejącego panteonu.

      Ponadto w religiach abrahamowych jest obecna stała tendencja do odrzucania elementów
      uznawanych za obce ich pierwotnej tradycji religijnej. Takie dążenia były i
      są podstawą licznych ruchów odnowicielskich w religiach abrahamowych, np. protestantyzm
      wobec katolicyzmu, purytanizm wobec anglikanizmu, wahhabizm wobec islamu sunnickiego,
      karaimizm wobec judaizmu rabinicznego, itp.) W religiach politeistycznych i
      niektórych dharmicznych bardzo rzadko występują podobne działania odnowicielskie
      i oczyszczające. Nie ma też znaczącego oporu wobec synkretyzmu religijnego,
      który jest w tych religiach powszechnym zjawiskiem. Wyjątkiem jest np. administracyjna
      likwidacja synkretyzmu shintō-buddyjskiego w Japonii w 1868, która była jednym
      z przejawów okcydentalizacji tego kraju.

      Współczesna tendencja w religioznawstwie w większości postrzega jednak religie
      abrahamiczne jako wytwory synkretyzmu, czyli fuzji różnych form i poglądów religijnych.
      I tak np. Tora miała powstać pod wpływem mitologii Kananejczyków, egipskiej,
      babilońskiej i perskiej, a judaizm miał się rozwinąć od fetyszyzmu i animizmu
      do henoteizmu i w końcu do monoteizmu. W podobny sposób interpretuje się pochodzenie
      chrześcijaństwa jako kontynuację i rozwój idei judaistycznych oraz dodania do
      nich elementów braminizmu, buddyzmu, politeizmu grecko-rzymskiego i egipskiego,
      a także filozofii stoickiej i szczególnie neoplatońskiej. Również islam może
      być uznany za kontynuację niektórych idei judeo-chrześcijańskich oraz przedislamskiej,
      politeistycznej tradycji religijnej (np. kult Hadżaru, świętego Czarnego Kamienia
      w Kaabie, wiara w dżinny itp.) a w późniejszym czasie również silnego wpływu
      filozofii greckiej i neoplatonizmuI. M. N. Al-Jubouri, Islamic Thought: From
      Mohammed to September 11, 2001, Xlibris Corporation, 2010, s.233, .'
    title: Podobieństwa i różnice między religiami
  - content: 'Taka interpretacja synkretycznego pochodzenia religii abrahamowych spotyka
      się ze sprzeciwem. Wskazywane jest, że chociaż religie abrahamowe zgadzają się
      z innymi religiami w wielu ich zewnętrznych formach i że wiele idei religijnych
      jest wspólnych dla całej ludzkości, to nie oznacza to automatycznie synkretycznego
      pochodzenia religii abrahamowych. W wielu wypadkach podobieństwo dotyczy jedynie
      formy, a nie treści. Przykładem jest tu kult maryjny cechujący się zewnętrznym
      podobieństwem formy do niektórych aspektów kultów politeistycznych, przy jednoczesnej
      całkowitej odmienności teologicznych podstaw tego kultuKarl Barth: Church Dogmatics.
      T. I.2: The Doctrine of the Word of God. Peabody, MA: Hendrikson Publishers,
      2010, s. 139–146. . W innych przypadkach jest wątpliwe, która religia miała
      być źródłem, a która od niej zapożyczyła. Z tego punktu widzenia, synkretyzm
      religijny ma dotyczyć jedynie religii pogańskich, a nie abrahamowych.'
