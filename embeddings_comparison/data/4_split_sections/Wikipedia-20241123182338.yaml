    title: Chrześcijaństwo
  - content: 'Stary Testament na określenie cudu używa najczęściej wyrażeń: oth –
      empiryczne doświadczenie rzeczy nadzwyczajnej lub naturalnej, które upewnia
      o wiarygodności ingerencji Boga w danym fakcie; geburoth – czyny pełne mocy
      Bożej; mofeth – objawienie się Boga w znaku; pele – zdziwienie faktem związanym
      z ingerencją Boga.

      W teocentrycznej wizji świata ST nie akcentuje się różnicy między prawami naturalnymi
      a nadprzyrodzonym działaniem Boga; wszystko przypisuje się Jemu i do Niego odnosi.
      Dlatego za cuda uważa się nie tylko zdarzenia przekraczające prawa natury, ale
      także fakty naturalne czy opatrznościowe, w których dostrzega się zjawiska nadzwyczajne.

      Przykładowe zdarzenia przekraczające prawa natury:

      - wstrzymanie rytmu słońca i księżyca – Joz 10,12-13;

      - zakwitnięcie laski Aarona – Lb 17,16-25;

      - poczęcie u 90-letniej Sary – Rdz 17,17;

      - zesłanie ognia z nieba – 1 Krl 18,38;

      - wskrzeszenie zmarłych – 1 Krl 17,17-24; 2 Krl 4,33-37

      - niektóre plagi egipskie – Wj 7-12.

      Przykładowe fakty naturalne czy opatrznościowe, w których dostrzega się zjawiska
      nadzwyczajne:

      - nadzwyczajna płodność ziemi – Iz 55,13;

      - nagłe pojawienie się deszczu – Job 5,9-10;

      - nagłe pojawienie się burzy – Job 37-5.

      Za największe cuda Starego Testamentu uważa się:

      - stworzenie świata i człowieka;

      - cuda związane z wyjściem Narodu Wybranego z niewoli Egiptu oraz wędrówką do
      Kanaanu.

      Do tych cudów często odwoływali się prorocy, by przywracać lub umacniać wiarę
      Izraelitów w Jahwe.

      Ostatecznym sprawcą cudów ST był Bóg, który jednak posługiwał się wybranymi
      ludźmi: Mojżesz, Jozue, Eliasz, Elizeusz i inni prorocy, którzy mieli obwieszczać
      ludowi wolę Boga i interpretować Jego cudowne interwencje. Bóg obdarzał ich
      charyzmatyczną mocą czynienia cudów mających m.in. uwierzytelnić ich prorocze
      posłannictwo.'
    title: Stary Testament
  - content: "Cuda Jezusa – nadprzyrodzone czyny Jezusa, których według chrześcijan\
      \ dokonał w okresie swojej działalności w Ziemi Świętej, jak to zostało opisane\
      \ w Ewangeliach. Opisy cudów stanowią jedną trzecią materiału literackiego Ewangelii.\
      \ Nowy Testament na określenie cudów używa podobnych terminów jak ST: dynameis\
      \ (Mt 7,22; Mk 6,5; 9,39; Łk 19,37) – moc, dzieło mocy Bożej ukazane w fakcie\
      \ cudownym; semeion (Mt 12,38; Mk 16,17; Łk 21,11; J 2,11) – znak Jezusa, w\
      \ którym objawia się działanie i obecność Boga wzywająca człowieka do dialogu;\
      \ ergon (J 5,36; 7,3) – zbawczy czyn Boga; terata – zdziwienie niezwykłym faktem\
      \ (np. w odniesieniu do znaków fałszywych mesjaszy – Mk 13,22).\nWedług Biblii\
      \ Jezus Chrystus dokonał wielu cudów. W Ewangeliach znajduje się 36 opisów cudów\
      \ Jezusa i 12 wzmianek o Jego cudotwórczej działalności.\nEwangeliści te same\
      \ wydarzenia cudowne komentowali w różny sposób, np. Marek w opisie uzdrowienia\
      \ epileptyka ukazał triumf Pana życia nad śmiercią (Mk 9,14-29), Łukasz zaś\
      \ dobroć Jezusa (Łk 9,37-43). U Marka opisy cudów Jezusa mają zwykle charakter\
      \ epifanijny, u Mateusza – eklezjologiczny, a u Jana – eschatologiczny. Wśród\
      \ dokonanych przez Jezusa cudów są:\n- cuda nad naturą fizyczną (np. rozmnożenie\
      \ chleba, zamiana wody w wino);\n- uwolnienia opętanych od złych duchów – egzorcyzmy\
      \ (np. opętany w synagodze w Kafarnaum – Mk 1,21-28; Łk 4,31-37; opętany niewidomy\
      \ i niemy – Mt 12,22-23; Łk 11,14; opętany z Gerazy – Mt 8,28-34; Mk 5,1.20;\
      \ Łk 8,26-39; opętany niemy – Mt 9,32-34; córka Kananejki – Mk 7,21-30; Mt 15,21-28;\
      \ epileptyk – Mk 9,14-29; Mt 17,14-20; Łk 9,37-44; pochylona kobieta – Łk 13,10-17);\n\
      - uzdrowienia fizyczne (np. paralityków, epileptyków);\n- wskrzeszenia umarłych\
      \ (np. Łazarza).\nWedług Biblii największym cudem było zmartwychwstanie Jezusa,\
      \ (naczelny dogmat wiary chrześcijańskiej).\nHistoryczność cudów Jezusa Chrystusa\
      \ potwierdza Talmud żydowski (Sanhedrin 43a) oraz Testimonium Flavianum, jakkolwiek\
      \ część badaczy świadectwo Flawiusza traktuje jako późniejszą interpolację.\
      \ Zdaniem niektórych biblistów, arameizmy znajdujące się przy opisach cudów,\
      \ mają potwierdzać ich historyczność. \nJezus nie dokonywał cudów w sposób magiczny,\
      \ nie czynił ich na żądanie i dla poklasku. Jego cudom towarzyszyła atmosfera\
      \ religijna, a warunkiem dokonania się cudu była wiara (Mt 9,22; Mk 6,5-6; Łk\
      \ 8,50). W wielu przypadkach cud prowadził do wiary (J 2,11).\nWedług Biblii\
      \ Jezus przekazał swą moc czynienia cudów swoim uczniom i tym, którzy w Niego\
      \ uwierzą (Mk 16,17)."
    title: Nowy Testament
  - content: 'Matka Boska ukazała się Bernardowi, obnażyła pierś i nakarmiła go mlekiem
      w ramach Lactatio Bernardi.

      Miało miejsce też wiele cudów eucharystycznych.'
    title: Potestamentowe
  - content: Koran oraz hadisy również mówią o licznych cudach. Były one dokonywane
      przez Allaha, niekiedy wykonywał to przy pomocy swoich proroków.
    title: Islam
  - content: 'Według hadisów Mahomet dokonał wielu cudów takich jak: uzdrawianie,
      pomnożenie pokarmu, wymodlenie deszczu, czy też rozbicie księżyca.

      Sam jednak Mahomet za jedyny cud religijny uważał treść Koranu otrzymaną drogą
      objawienia Bożego. Twierdził, że Koran jest w stanie uwierzytelnić wystarczająco
      jego prorockie posłannictwo, jeżeli przeciwnicy nie potrafią mu przeciwstawić
      analogicznego dzieła.'
    title: Mahomet
  - content: Według islamu Jezus uzdrawiał trędowatych, przywracał wzrok ślepcom oraz
      wskrzeszał umarłych. Jego narodzenie odbyło się za ingerencją Boga, bez udziału
      ziemskiego ojca. Cudownie rozmnożył chleb i ryby. Przy Jego chrzcie słyszano
      głos Boga. Chodził po jeziorze i uspokajał burze. Czytał w myślach faryzeuszy.
      Po śmierci zmartwychwstał, a po czterdziestu dniach wstąpił do nieba.
    title: Jezus
  - content: 'Według hinduizmu cudów mogą dokonywać święci, którzy najczęściej są
      joginami lub ryszimi. Robią to swoją mocą jogiczną (ich moce nazywają się siddhi).
      Cuda spełniają się także za sprawą boga i aniołów. Do najczęstszych rodzajów
      cudów należą: uzdrawianie, wskrzeszanie, lewitacja, bilokacja, egzorcyzmy.'
    title: Hinduizm
  - content: 'Teologia fundamentalna powołuje się na cud jako znak wiarygodności objawienia
      chrześcijańskiego i współcześnie odchodzi od filozoficznego pojęcia cudu, tzn.
      cudu jako faktu, który przekracza siły całej natury, powracając do religijnego
      pojęcia cudu jako znaku Bożego, który interpretuje w kategoriach personalistycznych
      (akt osoby, która posługuje się znakiem materialnym jako narzędziem w celu nawiązania
      kontaktu z inną osobą).

      Rozpoznanie cudu dokonuje się na płaszczyźnie religijnej i naukowej. Religijne
      rozpoznanie cudu polega na stwierdzeniu faktu nadzwyczajnego i jego interpretacji,
      np. interpretacji nagłego uzdrowienia dokonuje się w kontekście religijnym,
      poszukując przyczyny cudu i zrozumienia jego sensu (np. wysłuchana modlitwa).

      Pewność cudu zwiększa zbieżność zeznań wielu świadków, którzy rozpoznali działanie
      Boga w cudownym zjawisku (np. uzdrowieniu). Ponieważ poznanie religijne cudu
      ma charakter przednaukowy, istnieje potrzeba naukowego rozpoznania. W procesie
      naukowego rozpoznania cudu bierze się pod uwagę m.in. nauki przyrodnicze, które
      badają, czy dane zjawisko niezwykłe jest wytłumaczalne w ramach znanych współczesnej
      nauce prawd przyrody. Proces naukowego rozpoznania cudu nie daje w efekcie oczywistego
      wniosku, ale dostarcza krytycznych podstaw rozumnego przyjęcia działania Boga.

      Obok cudów uznawanych przez Kościół istnieją i inne niezwykłe zjawiska, np.
      płaczące obrazy, poruszenia figur, krwawiące hostie, stygmaty, burzenie się
      krwi św. Januarego w relikwiarzu w rocznice jego męczeństwa itp., co do których
      Kościół nie wypowiada się oficjalnie w sposób pozytywny, ponieważ trudno jest
      zrozumieć ich sens, gdy brak w nich wyraźnego kontekstu religijnego. Poza tym
      np. cud nierozkładającego się ciała nie jest warunkiem beatyfikacji czy kanonizacji.

      W kwestii uznawania niezwykłych zjawisk za cuda Kościół zachowuje wyjątkową
      ostrożność, bowiem sprawa cudów dotyczy rzeczy zbawczych, a w tych Kościół nie
      może narażać siebie i wiernych na ryzyko błędu czy nawet niepewności.'
