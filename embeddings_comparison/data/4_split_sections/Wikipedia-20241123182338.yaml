    title: Religie wywodzące się z Indii
  - content: 'Hinduizm nie ma pojedynczego modelu wszechświata i akceptuje wiele już
      od pierwszego wedyjskiego źródła; Rygwedy. Świat według hinduizmu mógł zostać
      stworzony, podtrzymywany i niszczony cyklicznie, przez bogów, boginie, lub sam
      z siebie. Powstać ze złotego jajka lub łona, lub sam z siebie.

      Czas jest konceptualizowany jako cykliczna yuga trwająca biliony lat. W kosmologi
      nurtów hinduizmu świat jest dzielony na 3 do 12 światów które grają rolę w karmie
      i sansarze.'
    title: Hinduizm
  - content: Według Dźinizmu świat nie został stworzony. Dźinistowskie pisma opisują
      wszechświat w kształcie mężczyzny stojącym w rozkroku i z dłońmi na talii.
