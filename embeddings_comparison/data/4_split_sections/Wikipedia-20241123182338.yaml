    title: Vodun
  - content: 'Fetysze były powszechne w rdzennych religiach amerykańskich i praktykach
      z nimi związanych„Animals: fact and folklore”, New Mexico Magazine, August 2008,
      s. 56–63, zob. New Mexico magazine website.. Niedźwiedź reprezentował szamana,
      bizon opiekuna, lew górski był wojownikiem, a wilk tropicielem.

      Obiekty te przez wyznawców były uważane za posiadające nadprzyrodzoną energię.
      Plemię indiańskie Zuni uważało, że fetysze są prawdziwymi zwierzętami, które
      zostały zamienione w kamień przez Ojca-Słońce (zw. Awonawilona) i chociaż nie
      żyją, to że ich siła życiowa nadal jest wewnątrz kamieniahttps://web.archive.org/web/20160911101058/http://www.zunifetishstore.com/?view=zuni-fetish
      Zuni Fetish – What are Zuni Fetishes .'
    title: Rdzenne religie Ameryki
  - content: 'Tworzone i używane przez lud Bakongo zachodniego Zairu, nkisi (l. mn.
      minkisi) jest rzeźbą, która zapewnia lokalne miejsce zamieszkania dla bytu duchowego.
      Chociaż niektóre minkisi były od zawsze antropomorficzne, to przypuszcza się,
      iż przed przybyciem Europejczyków w dziewiętnastym wieku, były one mniej realistyczne.
      Figurki te są bardziej realistyczne w rejonach nadbrzeżnych niż śródlądowych.

      Europejczycy określali nkisi pojęciem „fetysze”, a czasami nazywali je również
      idolami, gdyż niektórym nadawana jest forma przypominająca ludzi.'
