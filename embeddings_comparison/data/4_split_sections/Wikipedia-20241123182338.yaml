  - content: "W islamie pokutę określa się słowem tawbah. Muzułmanie wierzą, że niezmiennie\
      \ i wiecznie miłosierny Allah jest gotów odpuścić im każdy każdą winę i przywrócić\
      \ ich życie do stanu bezgrzeszności, w którym przyszli na świat. \nAle żeby\
      \ tak się stało, trzeba czuć skruchę i żal za popełnione grzechy, natychmiast\
      \ je porzucić, nie brnąć w nich, żałować za to, co było w przeszłości, postanowić,\
      \ iż już nigdy się do niego nie powróci oraz naprawić szkody, które wyrządziło\
      \ się innym, i zadośćuczynić."
