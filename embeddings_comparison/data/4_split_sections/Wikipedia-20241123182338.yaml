- sections:
  - content: Nieczystość seksualna – termin używany w religiach, między innymi monoteistycznych
      jak judaizm i islam, na określenie stanu braku świętości rytualnej z powodu
      podjęcia pożycia seksualnego, a u kobiet także z powodu menstruacji. Drugie
      znaczenie tego terminu, również religijne, dotyczy postaw naruszających zasady
      etyczne – uznawane przez daną religię – w odniesieniu do pożycia seksualnego.
    title: Main
  - content: 'Nie ma zasadniczo jednoznacznie określonych i jednolitych wzorców międzykulturowych
      pojęcia nieczystości i oczyszczenia. Nieczystość seksualna należy do jednej
      z trzech wyodrębnianych dla celów poznawczych kategorii nieczystości religijnej
      – spowodowanej funkcjami ciała. Określa się ją jako nieczystość rytualną. Drugą
      kategorię stanowi nieczystość wspomagająca więzi społeczne (social bonding).
      Dotyczy ona etapów ludzkiego życia: narodzin, dorastania, małżeństwa i śmierci
      i jest określana jako nieczystość moralna. Trzecią kategorią jest nieczystość
      wyznaczająca granicę między sacrum i profanum. Nieczystość uznawana jest za
      stan sprawiający podatność na działanie złych duchówPor. James J. Preston, hasło
      Purification w: The Encyclopedia of Religion, Mircea Eliade (redaktor naczelny),
      tom. 12, Macmillan, Nowy Jork–Londyn 1987, s. 92–94, ..'
    title: Dwa podstawowe znaczenia
  - content: 'Ponieważ seksualne funkcje ciała są wrodzone, naturalne, nieczystość,
      którą powodują, nie ma na celu zapobiegania ich występowania, lecz wyznaczenie
      granic potrzebnych do kontroli i oczyszczenia. Menstruacja jest drugą po śmierci
      najpoważniejszą przyczyną religijnej nieczystości. Z tego powodu w niektórych
      religiach kobiety, ze względu na ich seksualność, bywają uznane za trwale nieczyste.
      Jako jedną z przyczyn wskazuje się ochronę męskiej dominacji i wyznaczenia czysto
      męskich sfer wpływów (Douglas 1975). W niektórych plemiennych społeczeństwach
      kobietom nie wolno wchodzić do pomieszczeń męskich, w których rzeźbione są sakralne
      maski i przechowywane są pamiątki po przodkach.

      Tak w judaizmie, jak i islamie sfera seksualna jest uważana za źródło nieczystości
      rytualnej, z której należy się oczyścić przez obmycie.

      Równocześnie wiele religii politeistycznych traktowało i traktuje pożycie seksualne
      jako sferę boską. Na przykład wykopaliska archeologiczne pokazały, że na terenie
      klasycznej Grecji istniały świątynie Afrodyty z przydomkiem Hetera (kurtyzana)Por.
      w: , co świadczy o swoistym kulcie nierządu. W wielu religiach znany był także
      kult płodności i, praktykowana w wielu świątyniach, prostytucja „sakralna”Por.
      Benedykt XVI, encyklika Deus caritas est, 4..'
    title: Nieczystość rytualna
  - content: ''
    title: Nieczystość moralna
  - content: Nauczanie o nieczystości seksualnej jest ważnym elementem tradycji judaizmu.
    title: W Izraelu i judaizmie
  - content: 'W Pismach Izraela przepis Tory (Pięcioksięgu) wymaga obmycia rytualnego
      w mykwie z powodu zaciągnięcia nieczystości po każdym akcie seksualnym: Jeżeli
      mężczyzna obcuje z kobietą wylewając nasienie, to oboje wykąpią się w wodzie
      i będą nieczyści aż do wieczora. (19) Jeżeli kobieta ma upławy, to jest krwawienie
      miesięczne ze swojego ciała, to pozostanie siedem dni w swojej nieczystości.
      Każdy, kto jej dotknie, będzie nieczysty aż do wieczora. (Kpł, 15,19–21 por.
      Kpł 21,3).

      W Pięcioksięgu znajdujemy także uwagi o nieczystości seksualnej w rozumieniu
      moralnym. Nieczystym staje się mężczyzna przez cudzołóstwo, obcowanie z żoną
      swego bliźniego (Kpł 16,20). Księga Liczb mówi również o żonie rozpustnej, zdradzającej
      męża cieleśnie za plecami męża, że dopuściła się nieczystości w ukryciu. W przypadku
      posądzenia przez męża niewinnej żony, kapłani mieli dać je do wypicia wodę gorzką,
      która w przypadku prawdziwej winy miała ściągnąć przekleństwo: łono jej spuchnie,
      a biodra zwiotczeją, i będzie owa kobieta przedmiotem przekleństwa pośród swego
      ludu. Jeśli jednak ta kobieta nie stała się nieczysta, lecz przeciwnie – jest
      czysta – pozostanie bez szkody i znowu będzie rodzić dzieci (Lb 5, 11–31). Również
      samo pożycie w małżeństwie może być niemoralne, jak w przypadku Onana tracącego
      nasienie przy współżyciu tak, by nie doszło do poczęcia dziecka (Rdz 38, 9–10).'
    title: Pięcioksiąg
  - content: 'W nauczaniu rabinów z okresu I i II w. n.e. istniało pojęcie dwóch impulsów
      w człowieku, dobrego (ha-yêtzer hâ-tôb) i złego (ha-yêtzer hâ-râ). Ten ostatni
      był kojarzony przede wszystkim, choć nie wyłącznie, z grzechami seksualnymi,
      namiętnością erotyczną, pożądaniem – siłą, która popycha człowieka do cudzołóstwa
      i bałwochwalstwaPor. ; Por. Mekilta Nezkin 17 na temat Wj 20,5. (J. Z. Lauterbach
      (wydawca), Philadelphia 1933-5).Por. . Niektórzy rabini umiejscawiali te dwa
      impulsy w człowieku po dwóch stronach człowieka: dobry po prawej, zły po lewejPor.
      ; Num. R. 22.9. Inni umiejscawiali je w nerkachPor. ; b. Ber. 61a.. Jednak przeważająca
      większość rabinów – od czasów co najmniej 4 Ezdr, ale nie wcześniej – uważała,
      że miejscem zmagania się tych dwóch impulsów jest sercePor. ; Sifre Deut. w
      6.5§32 i M. Ber. 9.5.. Ogólnie przyjmowano, że impulsy te wchodzą w człowieka
      poprzez zrodzenie. Przy czym ha-yêtzer hâ-râ (zły impuls) w życiu poszczególnego
      człowieka jest starszy od ha-yêtzer hâ-tôb (dobry impuls) o trzynaście lat.
      W ciągu pierwszych trzynastu lat życia, w których dziecko nie jest moralnie
      odpowiedzialne, zły impuls panuje samodzielnie. Po ich ukończeniu, kiedy dziecko
      dorasta na tyle, by być uznane za Bar micwa (syn przykazania) i by poznawać
      Torę, zaczyna się zmaganie między oboma impulsami. Tora jest głównym lekarstwem
      i pomocą w tym zmaganiuPor. ; Aboth. R.N.I פרק טז s. 63; por. Strack-Billerbeck
      o Rz 2,15, t. 3, s. 95.. Wierzono, że w erze mesjańskiej zły impuls nieczystości
      i bałwochwalstwa będzie zniszczonyPor. ; b.Sukk.52a..'
    title: Rabini
  - content: 'Chrześcijaństwo nie podjęło tradycji judaistycznej dotyczącej nieczystości
      seksualnej w znaczeniu rytualnym. Zwięźle sformułował to Tomasz z Akwinu, komentując
      przepis z Księgi Wyjścia dany Izraelitom w pobliżu góry Synaj, by przed uroczystym
      spotkaniem z Bogiem, mężczyźni nie zbliżali się do kobiet (Wj 19, 15):

      Spotyka się lokalnie wyjątki w historii Kościoła, wynikające z chęci prześcignięcia
      Żydów w religijnej sprawiedliwościPor. J. B. Bauer, Clean and unclean – hasło
      w: . Tendencje te nazywa się judaizowaniem. Natomiast chrześcijaństwo bardzo
      podkreśla wagę nieczystości w drugim znaczeniu: jako stanu grzechu, nieporządku
      moralnego.'
    title: W chrześcijaństwie
  - content: 'O nieczystości mówił sam Jezus, wskazując na serce jako podmiot wszelakiej
      nieczystości duchowej, także seksualnej: Co wychodzi z człowieka, to czyni go
      nieczystym. Z wnętrza bowiem, z serca ludzkiego pochodzą złe myśli, nierząd,
      kradzieże, zabójstwa, cudzołóstwa, chciwość, przewrotność, podstęp, wyuzdanie,
      zazdrość, obelgi, pycha, głupota (Mk 7,20–22).

      O swoich uczniach mówił, że zostali cali wykąpani (J 13,10), używając słowa
      λούω /luo /, oznaczającego kąpiel całego ciała, a nie jedynie poszczególnych
      jego częściPor.. Zdanie to wypowiedział Jezus w przeddzień swej Męki. Kąpielą,
      o której myślał, jest chrzest, będący sakramentem obmycia z grzechów, czerpiącym
      swą oczyszczającą moc z Tajemnicy Paschalnej. Wyraża to Księga Apokalipsy w
      słowach o Jezusie, który nas miłuje i który przez swą krew uwolnił nas od naszych
      grzechów, i uczynił nas królestwem – kapłanami Bogu i Ojcu swojemu (Ap 1,5).
      Tak więc w Chrystusie, poprzez Jego łaskę działającą w sakramentach, wszelka
      nieczystość seksualna zostaje usunięta. Mimo tego, uczeń Chrystusa w trakcie
      ziemskiego życia potrzebuje stałego oczyszczenia: wykąpany potrzebuje tylko
      nogi sobie umyć (J 13,10). Symbol zabrudzonych nóg – jako tych, które stąpają
      po ziemi – oznacza ducha w pewnym, niewielkim stopniu dotykanego przez grzechy
      nieczyste, które rodzą się w sercu w związku z ziemskimi namiętnościami. Cudzołóstwa
      dopuszcza się bowiem człowiek już w sercu – przez poddanie się pragnieniu skłaniającemu
      do spoglądania na kobietę w sposób cudzołożny, tzn. patrzeniu się z zamiarem
      wejścia w nieuporządkowaną moralnie relację seksualną (por. Mt 5,28). Namiętności
      prowadzące do takiego nieczystego spoglądania na drugą osobę są obecne w człowieku
      narodzonym z ciała, póki nie stanie się w pełni narodzonym z ducha (por. J 3,6).
      Te dwie kategorie ludzi Paweł nazwie później: człowiekiem ziemskim i człowiekiem
      duchowym (1 Kor 15,45–49)Por. katechezy Jana Pawła II z rozdz. 3. Przykazanie
      i Etos, B: Ktokolwiek patrzy pożądliwie... (pocz. 3 września 1980 r.) w: Mężczyzną
      i niewiastą stworzył ich. Odkupienie ciała a sakramentalność małżeństwa. Lublin:
      KUL 2008..'
    title: Nauczanie Jezusa
  - content: 'O nieczystości w znaczeniu moralnego nieporządku w sferze erotycznej
      nauczał apostoł Paweł z Tarsu: Dlatego wydał ich Bóg poprzez pożądania ich serc
      na łup nieczystości, tak iż dopuszczali się bezczeszczenia własnych ciał, (...)
      mianowicie kobiety ich przemieniły pożycie zgodne z naturą na przeciwne naturze.
      Podobnie też i mężczyźni, porzuciwszy normalne współżycie z kobietą, zapałali
      nawzajem żądzą ku sobie (Rz 1,24–27; por. 2 Kor 12,21, Ga 5,19; Ef 5,3; Kol,
      3,5; 1 Tes 4,3–7).

      Chrześcijanin, który przez Prawo Ducha został wyzwolony z niewoli grzechów nieczystych
      i dla którego nie ma już potępienia (Rz 8, 1-4), nosi w sobie pożądliwość (concupiscentia),
      która wywołuje nieporządek we władzach moralnych człowieka i nie będąc samą
      w sobie grzechem, skłania człowieka do popełniania grzechów (KKK 2515).'
    title: Nauczanie apostoła Pawła
  - content: Klemens Aleksandryjski nauczał, że przez obmycie chrztu chrześcijanie
      wstępujący w związek małżeński stają się czyści, tak że już więcej nie potrzebują
      żadnego obmycia rytualnego. Klemens w ten sposób bronił świętości małżeństwa
      przeciw gnostykomOpatrzność sprawowana przez Pana nie poleca jeszcze teraz,
      jak niegdyś, mycia się po akcie małżeńskiego spółkowania. Bo przecież Pan nie
      zmusza wiernych wyrzekać się poczynania dzieci, gdyż przez jeden chrzest oczyszcza
      ich na całe pożycie małżeńskie. On, który również liczne obmywania Mojżesza
      zawarł w jednym pojedynczym akcie chrztu (Kobierce III, rozdz. XII (82,6), t.
      1, Janina Niemirska-Pliszczyńska (przekład, wstęp, komentarz, indeksy) PAX ATK,
      Warszawa 1994, s. 277 .. Stwierdził wręcz, że nasienie tych, którzy zostali
      uświęceni, jest święte'Kobierce III, rozdz. VI (46,5), t. 1, Janina Niemirska-Pliszczyńska
      (przekład, wstęp, komentarz, indeksy) PAX ATK, Warszawa 1994, s. 256 .).
    title: Ojcowie Kościoła
  - content: 'W katolickiej etyce seksualnej podaje się następujące negatywne skutki
      nieczystości seksualnej:

      - Zaburza miłość osoby, przeżywanej w wolności i samoopanowaniu jako osobowy
      dar dla współmałżonka. Jest przeciwna cnocie umiarkowania, która wymaga by popędy
      i odruchy wynikające z płciowości poddane były panowaniu rozumnej woli, w oparciu
      o poznanie ludzkiego sensu płci i jej miejsca w integralnej wizji powołania
      osoby. Człowiek nieczysty seksualnie zgadza się na własną depersonalizację.

      - Powoduje depersonalizację i urzeczowienie drugiej osoby. Drugiego człowieka
      traktuje się jako element pewnego mechanizmu dla uzyskania określonego przeżycia.
      Prawdziwa więź ludzka może zaistnieć tylko na płaszczyźnie miłości.

      - Więź pseudomałżeńska oznacza ipso facto odrzucenie całej treści powołania
      małżeńskiego, obejmującego odpowiedzialność za godność osoby ludzkiej, za godność
      i świętość życia ludzkiego powoływanego na świat w kontekście miłości.

      - Jest uważana za profanację tego, co w człowieku i małżeństwie jest święte
      na mocy Stworzenia i Odkupienia. Dlatego nauczanie apostolskie w mocnych słowach
      piętnuje zło kryjące się w nieczystości seksualnej, ponieważ degraduje człowieka
      do poziomu nierozumnej przyrody oraz niweczy dzieło uświęcenia człowieka.

      - Prowadzi także do innych czynów uznawanych za grzeszne, np. do aborcji, antykoncepcjiPor.
      hasło Nieczystość seksualna w: Słownik małżeństwa i rodziny, Edward Ozorowski
      (redakcja), Łomianki 1999..'
    title: Katolicyzm
  - content: Świadkowie Jehowy uważają, że jeżeli ktoś dopuszcza się rozpusty, rozpasania
      lub jakiejś formy nieczystości seksualnej i nie okazuje skruchy, może zostać
      usunięty ze zboru, w celu zachowania jego czystości.
    title: Świadkowie Jehowy
  - content: 'Pożycie małżeńskie, w którym dochodzi do wytrysku nasienia, powoduje
      tzw. większą nieczystość rytualną – dżanāba. Osobę, która znajduje się w stanie
      takiej nieczystości nazywa się dżunub. Może ona powrócić do czystości rytualnej
      przez tzw. większe rytualne obmycie (ghusl). Zanim nie dokona obmycia nie może
      wykonywać obowiązku codziennej modlitwy – salat, nie może dokonać tawaf wokół
      Kaaby w Mekkce (Koran V,6), nie może też wchodzić do meczetu (z wyjątkiem konieczności),
      ani dotykać Koranu i czytać jego wersetów (Koran LVI, 77-9). Jest także mniejsza
      rytualna nieczystość zwana hadathZob. C. L. Geddes, hasło Djanāba w:The Encyclopaedia
      of Islam. New Edition. B. Lewis, P.CH. Pellat, J. Schacht (redaktorzy), t. 2
      (C-G), Lejda-Londyn 1965, s. 440..

      Z drugiej strony, seksualność zajmuje w islamie bardzo ważną rolę – co jest
      uznane za pewną niespójność. Uderzająca jest otwartość i bezpośredniość, z jaką
      Koran i hadisy omawiają delikatne zagadnienia pożycia seksualnego . Dwudziesta
      piąta wypowiedź proroka Mahometa, z XIII-o wiecznego zbioru Czterdzieści Hadisów
      zebranych przez imama an-Nawawiego (zm. 676 AH), mówi że pożycie seksualne jest
      uczynkiem miłosierdzia. Pewien towarzysz Proroka Mahometa spytał się go o los
      bogatych. Ten odpowiedział:'
