- sections:
  - content: 'Fetyszyzm – jedna z pierwotnych form religii, w której przyjmuje się,
      że pewne obiekty naturalne lub stworzone przez człowieka mają nadprzyrodzone
      moce i stanowią bóstwa, które są poprzez nie czczoneOnline Etymology Dictionary
      – fetish. Obiekty takie nazywa się fetyszami.

      Według czcicieli, fetysz jest obdarzony mocą magiczną, zawartą w obiekcie materialnym
      – nosicielu tej mocy. Moc, według takich wierzeń, można uwolnić poprzez rytuały
      okultystyczne – modlitwy i ofiary. Odróżnia się fetysze naturalne (np. kamienie,
      zęby) oraz zrobione przez człowieka (np. rzeźba). Ten drugi rodzaj fetyszu powinien
      przejść rytuał nadzielenia go mocą magiczną. Fetysze mogą być grupowe, indywidualne,
      apotropaiczne i chroniąceReligie świata. Encyklopedia, red. J. Rawicz i in.,
      s. 244–245..'
    title: Main
  - content: 'Określenie fetysz wywodzi się z fr. fétiche, które pochodzi od port.
      feitiço – „amulet” lub „czary”, a to z kolei z łac. facticius – „sztuczny” i
      facere – „tworzyć”. Termin fetysz stosowali portugalscy żeglarze na określenie
      amuletów i talizmanów, a upowszechnił go w religioznawstwie Charles de Brosses
      za pośrednictwem publikacji O kulcie fetyszów z 1760 roku.

      William Pietz, który przeprowadził rozległe badania etnograficzne, twierdzi
      że pojęcie to powstało u wybrzeży zachodniej Afryki w ciągu wieku szesnastego
      i siedemnastego. W swoich badaniach, Pietz rozróżnia, z jednej strony, stosowanie
      tego pojęcia na określenie właściwych obiektów afrykańskich, które mogą być
      nazywane fetyszami razem z rdzennymi teoriami o nich, a z drugiej strony stosowanie
      tego określenia do opisu idei – wyobrażenia rodzaju przedmiotu, do którego to
      wyobrażenia również ma zastosowanie ten termin. Według Pietza, postkolonialne
      pojęcie „fetyszu" wyłoniło się ze zderzenia kultur Europejczyków – społeczeństwa
      feudalnego z tradycją katolicką oraz Afrykańczyków – w specyficznym kontekście
      historycznym i w odpowiedzi na afrykańską kulturę materialną.

      Na to zderzenie kultur, strach przed obcym i odmiennym oraz wynikające z niego
      demonizowanie rytuałów afrykańskich zwraca uwagę Stallybrass, który podsumowuje
      prace Pietza następująco: „Pietz pokazuje, że fetysz, jako koncepcja, został
      stworzony w celu demonizowania pozornie arbitralnego przywiązania ludzi z zachodniej
      Afryki do obiektów materialnych. Europejski podmiot ukonstytuował się w opozycji
      do zdemonizowanego fetyszyzmu poprzez wyparcie przedmiotu.”ang. „Pietz shows
      that the fetish as a concept was elaborated to demonize the supposedly arbitrary
      attachment of West Africans to material objects. The European subject was constituted
      in opposition to a demonized fetishism, through the disavowal of the object.”
      –'
    title: Historiografia
  - content: 'Fetyszyzm uważa się za jedną z pierwotnych form religii. Przykładami
      praktyk, w których aspektem jest fetyszyzm, są:

      - rytualizm – wykorzystanie praktyk, rytuałów i ceremonii mających swe źródło
      w odległej przeszłościhttps://www.jstor.org/stable/1257856

      - totemizm – wierzenia związane z kultem pewnego obiektu – często elementu przyrody
      martwej (np. drzewo, pomnik) lub ożywionej (np. ptak lub inne zwierzę) – oraz
      traktowanie go jako emblematu rodziny, klanu czy plemienia. Totemizm obejmuje
      też system organizacji plemiennej na podstawie totemów, wiarę w pokrewieństwo
      ze wspólnym totemem oraz wiarę w mistyczne właściwości totemu, co wiązać się
      może, przykładowo, z zakazem polowań na dane zwierzę.

      - animizm – system wierzeń oparty na poglądzie, że wszystkie obiekty występujące
      we wszechświecie mają dusze lub że są siedzibą duchów albo związane z innymi
      mistycznymi właściwościami. Animiści mogą wierzyć, że ludzka dusza nie jest
      wyjątkowa oraz że posiadają analogiczną również zwierzęta, rośliny, skały, naturalne
      siły oraz zjawiska w przyrodzie takie jak deszcz, słońce czy księżyc. Pogląd,
      że siła życiowa jest we wszystkich zjawiskach i obiektach tworzy oś, wokół której
      koncentruje się animizm. Animizm może też obejmować wiarę, że poszczególne zjawiska
      są związane z odrębnymi bytami nadprzyrodzonymi.

      - szamanizm – obejmuje spektrum wierzeń związanych z komunikacją z odrębną rzeczywistością,
      przykładowo światem duchów czy innym wymiarem, za pomocą pośrednika – szamana,
      kapłana lub innego medium. Pośrednik taki odgrywa rolę religijnego przywódcy
      i kontaktuje się z zaświatami celem uzyskania odpowiedzi na nurtujące pytania
      lub znalezienia rozwiązań trudności napotykanych przez grupę.

      Fetyszyzm i totemizm były pierwszymi, prymitywnymi formami w ewolucji religii.
      Animizm uważa się za wyższe stadium rozwojuThe Great Soviet Encyclopedia, 3rd
      Edition (1970-1979).'
