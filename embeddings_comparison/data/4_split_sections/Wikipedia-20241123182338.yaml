- sections:
  - content: 'Misjologia ( – posłanie; – słowo, nauka) – nauka teologiczna, której
      przedmiotem jest systematyczne ujęcie wiedzy o rozkrzewianiu wiary: przepowiadaniu
      Ewangelii i zakładaniu Kościoła wśród ludów nieznających Chrystusa.

      Działalność taka uzasadniana jest teologicznie i pełni funkcję krytycznej oceny
      realizacji dzieła misyjnego w świecie (również w ujęciu historycznym).

      Aspekty krytycznej oceny:

      - ogólny – teologia misji,

      - aktualny – misjografia,

      - historyczny – historia misji,

      - normatywno-prawny – prawo misyjne, liturgika misyjna, katechetyka misyjna,
      metodyka misyjna,

      - praktyczny – kontekst misyjny.'
    title: Main
  - content: '- etnologia,

      - religioznawstwo,

      - etnografia,

      - lingwistyka,

      - higiena tropikalna.'
