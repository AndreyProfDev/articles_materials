- sections:
  - content: 'Termin „prorok” jest kalką greckiego προφήτης (prophḗtēs, „rzecznika”,
      „adwokata”) używanego w kontekście religijnym, które z kolei jest tłumaczeniem
      hebrajskiego słowa „nabi”, oznaczającego osobę przemawiającą w imieniu Boga.
      Wśród mów proroków pojawiały się m.in. zapowiedzi Sądu Ostatecznego, który poprzedzi
      seria wydarzeń. Z tego powodu słowo „prorok” zaczęło być z czasem utożsamiane
      z „przepowiadaczem przyszłości” i obecnie jest potocznie utożsamiane z „jasnowidzem”
      lub „wróżbitą”.

      W religiach abrahamowych prorokiem jest osoba będąca w kontakcie z Bogiem, której
      zadaniem jest przede wszystkim objawiać wolę Bożą wobec ludzi, również zapowiadać
      nadejście Mesjasza lub przewidywać przyszłe wydarzenia. Nierzadko prorok jest
      jednocześnie założycielem jakiejś religii. W każdej jednak jego rola i znaczenie
      są nieco inne.'
