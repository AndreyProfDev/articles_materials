- sections:
  - content: 'Libacja (łac. libatio) – ofiara dla bóstwa składana w formie wylewania
      na ziemię cennych płynów. Był to zwyczaj istniejący w wielu religiach antycznych
      polegający na wylewaniu, a także w judaizmie, hinduizmie i shintō. U starożytnych
      Greków i Rzymian jeden z najważniejszych obrzędów religijnych. W relacjach Herodota
      występował także u Persów, według Pliniusza Młodszego również u Celtów.

      Najczęściej stosowane płyny w aktach libacji to: wino, oliwa, kosztowne olejki
      eteryczne oraz, w tradycji hinduizm, ghi. W tradycji antyku i judaizmie do aktu
      libacji stosowano specjalne, płaskie naczynia z dzióbkiem, nazywane paterami.
      W religiach antycznych oddawano w ten sposób hołd głównie bóstwom podziemia,
      takim jak Hades, stąd ważne było wylewanie płynu bezpośrednio na gołą i spulchnioną
      ziemię, tak aby mógł on w nią szybko wsiąknąć.

      W religii shintō libacja jest nazywana Miki (神酒), dosłownie kami sake (boskie
      sake). W trakcie ceremonii w shintoistycznej świątyni stosuje się do libacji
      wino ryżowe – stąd pochodzi nazwa sake dla tego trunku. W warunkach domowych
      zamiast sake stosuje się często świeżą wodę, którą należy zmieniać każdego ranka.
      W shintō naczyniem liturgicznym stosowanym do libacji jest porcelanowy lub metalowy
      kubek bez żadnych ozdób.'
    title: Main
  - content: ''
    title: Przypisy
  title: Libacja (rytuał)
- sections:
  - content: 'Zoomorfizm – w sztuce plastycznej przedstawianie w kształcie zwierząt
      (realnych lub fantastycznych) bóstw, pojęć abstrakcyjnych, zjawisk przyrody
      itp.

      Starożytni Egipcjanie przedstawiali swoich bogów jako pół ludzi, pół zwierzęta
      (ciało człowieka i głowa zwierzęcia) lub stosowano atrybuty zwierzęce. Czczono
      także te zwierzęta, które symbolizowały bóstwa, np. jeżeli czczono Horusa, to
      także sokoły.

      Ornament zawierający motywy zoomorficzne popularny był w sztuce wikingów w IX-XI
      wieku.

      W okresie renesansu i klasycyzmu motywy zoomorficzne często były częścią składową
      groteski, arabeski.'
