- sections:
  - content: 'Kozioł ofiarny – jeden z kluczowych mechanizmów antropologicznych występujący
      prawdopodobnie we wszystkich kulturach. Mechanizm ten polega na tym, iż grupa
      społeczna w momencie kryzysu, dezintegracji czy zagrożenia, by powrócić do stanu
      utraconej równowagi, obiera sobie ofiarę, która staje się obiektem zbiorowej
      agresji całej grupy. Agresja ta grupy ma na celu uśmiercenie bądź różnego rodzaju
      wykluczenie ofiary (wypędzenie, wykluczenie symboliczne – np. opaski z „gwiazdą
      Dawida” lub przezwiska w grupie rówieśniczej). Grupa wmawia sobie bowiem, że
      ofiara ta ponosi winę za nieszczęście lub zagrożenie, które doprowadziło do
      kryzysu, dezintegracji grupy.

      Poszczególne kultury różnią się między sobą pod względem skłonności do stosowania
      mechanizmu kozła ofiarnego, niektóre stosują go bardzo często i na wielką skalę
      (są często monolityczne, a nawet podświadomie niepewne swojej tożsamości), inne
      posuwają się do niego niezwykle rzadko, unikają skrajnych form mechanizmu (są
      to zwykle kultury otwarte, pluralistyczne, które znajdują konstruktywne role
      społeczne dla różnego rodzaju odmieńców).'
    title: Main
  - content: ''
    title: Charakterystyka mechanizmu
  - content: 'Kozłem ofiarnym może być:

      - osoba pojedyncza (np. Sokrates i jego słynny proces)

      - cała grupa społeczna, etniczna, religijna (np. chrześcijanie w starożytnym
      Rzymie, Żydzi w Trzeciej Rzeszy)

      Cechy, które powodują, że wybór grupy pada na daną osobę (osoby):

      - obce pochodzenie (etniczne, klasowe itp.)

      - ekstremalna odmienność fizyczna (kolor skóry, niesłychana brzydota lub nadzwyczajna
      uroda, niepełnosprawność, niskorosłość lub przeciwnie – gigantyzm itp.)

      - szczególnie spektakularna choroba, której nie sposób ukryć (np. choroby psychiczne
      lub epilepsja)

      - ekstremalna pozycja społeczna (bardzo wysoka – np. wysokie urodzenie, bogactwo,
      sława; bardzo niska – np. żebracy; żyjąca osobno – np. gmina żydowska, mnich
      czy pustelnik)

      - złamanie tabu religijnego lub jakieś religijne odstępstwo (wyznawanie innej
      religii, niesumienne praktykowanie religii, itp.)

      - złamanie tabu seksualnego, związanego z prokreacją, lub choćby tylko przekonanie
      grupy o złamaniu takiego tabu przez jednostkę (czy więcej ludzi); dotyczy np.
      kazirodztwa, homoseksualizmu (w społecznościach, które nie akceptują takich
      praktyk), rozwiązłości seksualnej (kobieta jest tu w gorszej sytuacji, gdyż
      wiele kultur jako rozwiązłość traktuje takie ich zachowania, które u mężczyzn
      akceptuje, a nawet chwali, np. sukcesy w uwodzeniu); przekonanie o zabijaniu
      dzieci mieści się w tej orbicie;

      - odmienność seksualna (transpłciowość, interpłciowość, homoseksualizm), ale
      też niekiedy obrzezanie, dziewictwo lub wdowieństwo;

      Każda grupa jest w stanie znaleźć kozła ofiarnego, gdy czuje taką potrzebę,
      zarówno cała grupa etniczna, cały naród, jak też społeczności lokalne, mieszkańcy
      jednej wsi czy osiedla, lub też uczniowie w klasie. Im więcej jednak powyższych
      warunków spełnia osoba lub osoby, tym łatwiej i częściej staje się kozłem ofiarnym.
      Gdy jednak w pogrążonej w kryzysie grupie brakuje osób, które kumulowałyby kilka
      tych cech, wystarczyć może jedna z nich lub jakakolwiek cecha wyróżniająca.'
    title: Potencjalne ofiary
  - content: 'Grupa szuka kozła ofiarnego w momencie kryzysu, którego przyczyną mogą
      być np.:

      - Katastrofa naturalna (epidemia, klęska żywiołowa, etc.)

      - Katastrofa gospodarcza

      - Katastrofa polityczna (np. wojna, zagrożenie wojną, polityczna słabość struktur
      danej kultury)

      - Poczucie jakiegoś zagrożenia: albo którąś z powyższych katastrof, albo nadchodzącym
      końcem świata czy gniewem bogów, albo zagrożenia dla tożsamości grupy (np. przez
      kulturową dominację jakiejś grupy z zewnątrz), etc.'
    title: Występowanie mechanizmu
  - content: 'Mechanizm może mieć postać zinstytucjonalizowanego rytuału, zorganizowanych
      posunięć politycznych, ale też dokonywać się za sprawą spontanicznych wybuchów
      całej grupy. Przykłady w historii:

      - Ofiary z ludzi w niektórych kulturach starożytnych. Składano je np. w celu
      przebłagania zagniewanych bogów, np. z dziewic (ekstremalny stan seksualny)
      strącanych ze skały.

      - Pogromy Żydów. Żydzi spełniają kilka warunków, które wydawały ich na pastwę
      mechanizmu: podkreślali swoją odmienność religijną i etniczną; byli uważani
      za tych, którzy zabili Chrystusa czyli Boga (tabu religijne); obrzezanie to
      odmienność seksualna. Pogromy w średniowieczu zwykle wybuchały w okresach epidemii
      lub załamania gospodarki.

      - Procesy czarownic. Oskarżenia o czary łączyły się z przekonaniem o seksualnym
      wyuzdaniu tych kobiet, o kontaktach seksualnych z szatanem (złamane tabu zarówno
      w odniesieniu do religii, jak i do seksualności), argumentem były dziwne znamiona
      lub rude włosy (odmienność fizyczna), etc.

      - Noc św. Bartłomieja

      - Egzekucje rodziny królewskiej i arystokratów w czasie rewolucji angielskiej,
      rewolucji francuskiej i rewolucji październikowej.

      - Holocaust i obozy koncentracyjne. Niemcy, upokorzeni klęską w I wojnie światowej,
      którą w znacznym stopniu sami rozpętali, a następnie skutkami Wielkiego Kryzysu
      Gospodarczego, dokonali zbiorowej projekcji własnych win na Żydów i inne mniejszości.'
    title: Przykłady działania mechanizmu
  - content: 'Metaforyczna nazwa mechanizmu pochodzi z całkiem dosłownej starożytnej
      tradycji judaistycznej, w której społeczność projektowała swoje winy na przeznaczone
      na krwawą ofiarę zwierzę. Kapłan świątyni w Jerozolimie kropił kilkakrotnie
      różne miejsca w jej wnętrzu krwią złożonych w ofierze byka i kozła, a następnie
      kładł rękę na głowie specjalnie wybranego kolejnego kozła, na którego przenosił
      winy całego ludu, wypowiadając je. Wybierano też człowieka, który ma zabrać
      kozła na pustynię. Człowieka tego w tradycji judaistycznej nazywano isz iti.
      Według Talmudu, traktatu Joma 39a.67b, zabierał on kozła nad skalne urwisko,
      , a następnie spychał kozła tyłem w przepaść; praktyka ta nie jest opisana w
      samej Biblii. Działo się to w święto Jom Kipur; obecnie w ultraortodoksyjnych
      grupach zdarza się, że w dniach pomiędzy Rosz ha-Szana a Jom Kipur składa się
      ofiarę z koguta (kaparot), pełniącą podobną funkcję.

      Praktyka kozła ofiarnego nie była wyjątkowa dla religii Izraela, lecz podobne
      rytuały eliminacji istniały w religiach anatolijskich i mezopotamskich. Zdaniem
      Bernda Janowskiego i Gernota Wilhelma praktyka ta ma korzenie w południowej
      Anatolii lub północnej Syrii, a stamtąd rozprzestrzeniła się do Syropalestyny
      i obszaru jońsko-greckiego. Historycy starożytni informują o odprawianiu rytuału
      wypędzenia kozła ofiarnego w Atenach i obszarze jońsko-attyckim w czasie Targeliów,
      świąt poświęconych Apollinowi.'
    title: Ofiara z kozła w judaizmie i religiach starożytnych
