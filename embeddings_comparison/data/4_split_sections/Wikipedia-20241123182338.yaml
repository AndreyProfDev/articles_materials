      - znieważenie pomnika'
    title: Zobacz też
  title: Profanacja
- sections:
  - content: Wyznanie – określenie grupy religijnej opartej na jednym zestawie prawd
      wiary („wyznaniu”, „credo”). Pod względem organizacyjnym grupa taka może być
      skupiona w jednej strukturze organizacyjnej lub w wielu. Struktura taka na gruncie
      prawa polskiego określana jest nazwą związek wyznaniowy, a w religioznawstwie
      i prawie państw anglosaskich także mianem denominacji religijnej. Niekiedy,
      choć nieprecyzyjnie, mianem wyznania określa się związek wyznaniowy.
    title: Main
  - content: 'Pojedyncze wyznanie ma na ogół jedną obowiązującą doktrynę. Jednostki
      większe niż wyznanie są zróżnicowane doktrynalnie, a jednostki mniejsze stanowią
      jedynie podział administracyjny, bez różnic w wierze.

      Na przykład wewnątrz chrześcijaństwa wyznaniami są: katolicyzm, prawosławie,
      luteranizm, kalwinizm, mariawityzm i inne. W przypadku buddyzmu wyznaniami można
      określić szkoły: Therawada, Mahajana, Wadżrajana i inne. W przypadku rodzimowierstwa
      słowiańskiego: Rodzimy Kościół Polski, Rodzima Wiara i inne.

      Potocznie słowa określające różne grupy religijne bywają używane wymiennie,
      niemniej poszczególne terminy mają różne zakresy znaczeniowe, które można uporządkować
      hierarchicznie:

      - religia – najwyższy poziom hierarchii podziału;

      - wyznanie - grupa wewnątrz religii o wspólnych zasadach wiary (np. katolicyzm,
      prawosławie, luteranizm, kalwinizm, anglikanizm, baptyzm, metodyzm, adwentyzm,
      mariawityzm, pentekostalizm);

      - Kościół, związek wyznaniowy, denominacja - grupa (wspólnota) wewnątrz wyznania
      o odrębnej strukturze względnie określonym obrządku (np. Kościoły greckokatolickie,
      Kościół melchicki, Kościół Ewangelicko-Augsburski w RP, Kościół Starokatolicki
      Mariawitów w RP itp.);

      - Kościół partykularny (też kościół lokalny lub miejscowy) – w Kościele katolickim
      synonim diecezji/archidiecezji;

      - parafia, zbór, gmina wyznaniowa - jednostka administracyjna oraz tworząca
      ją wspólnota lokalna wewnątrz wyznania, najczęściej w ramach diecezji lub jej
      odpowiednika (np. okręgu, senioratu, kustodii).

      W języku polskim słowo „Kościół” (pisane dużą literą) oznacza wspólnotę określonego
      wyznania lub obrządku, zaś „kościół” (małą literą) – budynek przeznaczony dla
      celów kultu chrześcijańskiego.'
