- sections:
  - content: "Polskie Towarzystwo Religioznawcze (PTR) – założona w 1958 organizacja\
      \ skupiająca polskich naukowców zajmujących się religioznawstwem i naukami pokrewnymi.\
      \ Podstawowym celem stowarzyszenia jest szerzenie i pogłębianie wiedzy w dziedzinie\
      \ religioznawstwa. Towarzystwo swoją działalność finansuje ze składek członkowskich\
      \ oraz środków publicznych przeznaczonych na działalność wydawniczą i konferencyjną.\n\
      PTR realizuje swoje zadania m.in. poprzez: \n- wydawnictwa periodyczne, seryjne\
      \ i monograficzne z zakresu religioznawstwa, \n- współpracę z innymi instytucjami\
      \ naukowymi, \n- udostępnianie społeczeństwu wyników badań religioznawczych\
      \ przez wydawnictwa, wykłady, zebrania dyskusyjne."
    title: Main
  - content: "Inicjatywę zorganizowania Polskiego Towarzystwa Religioznawczego podjęto\
      \ 18 czerwca 1957 na zebraniu pracowników naukowych zajmujących się zagadnieniami\
      \ religioznawczymi. W zebraniu tym udział wzięli m.in.: Eugeniusz Kriegelewicz,\
      \ Jan Legowicz, Witold Łukaszewicz, Mirosław Nowaczyk, Andrzej Nowicki, Adam\
      \ Szelągowski, Henryk Świątkowski. Pierwszy statut PTR zatwierdzono 24 czerwca\
      \ 1958, a 26 września 1958 odbyło się w Warszawie I Walne Zebranie PTR. Towarzystwo\
      \ początkowo postawiło sobie za cel swojej działalności: rozwijanie wiedzy religioznawczej,\
      \ prowadzenie i organizowanie badań w zakresie religioznawstwa, rozwijanie działalności\
      \ wydawniczej, współdziałanie w przygotowaniu wykwalifikowanej kadry naukowo-dydaktycznej\
      \ oraz współpraca z instytucjami naukowymi podejmującymi w swoich badaniach\
      \ problematykę religioznawczą. \nW latach 1958–1965 Towarzystwo prowadziło działalność\
      \ naukową poprzez swój Ośrodek Badań Naukowych, w którego skład wchodziły pracownie:\
      \ Historii Filozofii i Krytyki Religii, Historii Kościoła, Historii Doktryn\
      \ Chrześcijańskich, Religioznawstwa Ogólnego oraz Punkt Dokumentacji i Bibliografii\
      \ Religioznawczej, a także funkcjonujący w latach 1958–60 w Lublinie Punkt Informacyjno-Dokumentacyjny\
      \ Religioznawstwa Porównawczego. W latach 1966–89 funkcjonowały prężne ośrodki\
      \ religioznawcze w instytucjonalnych strukturach naukowych i uniwersyteckich\
      \ takie jak: Zakład Filozofii i Socjologii Religii w IFiS PAN w Warszawie, Zakład\
      \ Religioznawstwa i Polityki Wyznaniowej w WSNS, przekształcony następnie w\
      \ Instytut Religioznawstwa ANS w Warszawie, Instytut Religioznawstwa UJ (utworzony\
      \ w 1974), Podyplomowe Studium Religioznawstwa UW, Katedra Religioznawstwa WAP\
      \ i wiele Zakładów Filozofii Religii, Socjologii Religii i Zakładów Religioznawstwa\
      \ w strukturach wyższych uczelni. Towarzystwo w tym okresie, zgodnie ze statutem,\
      \ koncentruje się na organizacji życia naukowego, upowszechnianiu badań i wiedzy\
      \ religioznawczej oraz na działalności wydawniczej.\nTowarzystwo do 1989 było\
      \ organizatorem i współorganizatorem wielu międzynarodowych i ogólnopolskich\
      \ konferencji, które były poświęcone m.in. problematyce: definicji religii (1958),\
      \ metodologicznej i filozoficznej krytyce religii (1958), religioznawstwa w\
      \ Polsce (1964), religioznawstwa radzieckiego (1967), religioznawstwa w kontekście\
      \ nauk społecznych (1989 – wspólnie z Międzynarodowym Stowarzyszeniem Historii\
      \ Religii).\nW tym czasie PTR opublikowało:\n- na łamach czasopisma \"Euhemer\"\
      :\n-- Słownik religioznawców, Euhemer 1967, nr 3\n-- Mała encyklopedia religioznawstwa\
      \ marksistowskiego, Euhemer 1970, nr 3–4\n-- Podręcznik religioznawstwa, Euhemer\
      \ 1986, nr 3–4\n-- Mała encyklopedia religioznawcza, Euhemer 1988 nr 1\n- w\
      \ ramach serii Rozprawy i materiały PTR\n-- A. Nowicki, Filozofowie o religii,\
      \ t. 1–2, Warszawa 1960–1963\n-- Z. Poniatowski, Problematyka nauki w piśmiennictwie\
      \ katolickim, Warszawa 1960\n-- A. Nowicki, Wykłady z historii krytyki religii,\
      \ Warszawa 1962\n-- S. Matuszewski, Filozofia Filona z Aleksandrii i jej wpływ\
      \ na wczesne chrześcijaństwo, Warszawa 1962\n-- W. Tyloch, Rękopisy z Qumran\
      \ nad Morzem Martwym, Warszawa 1963\n-- Michał Servet. Wybór pism, oprac. L.\
      \ Szczucki, Warszawa 1967"
    title: Historia
  - content: 'Od 1988, po przyjęciu nowego statutu, za czołowe zadanie towarzystwo
      uznaje szerzenie i pogłębianie wiedzy w dziedzinie religioznawstwa poprzez:
      prowadzenie działalności wydawniczej, współpracę z innymi instytucjami naukowymi
      oraz udostępnianie wyników badań naukowych. W 1995 XIV Walne Zebranie PTR wprowadziło
      do statutu drobne modyfikacje będące konsekwencją zmian systemowych zachodzących
      w Polsce. Na przełomie XX i XXI w. PTR znacznie zaktywizowało swoją działalność
      naukową. W latach 1990–2001 zorganizowało w wielu ośrodkach akademickich ponad
      trzydzieści konferencji o zasięgu ogólnopolskim i międzynarodowym, m.in. geografia
      i ekologia religii (Lublin 1991), mniejszości narodowe, etniczne i religijne
      w procesie transformacji (Wrocław 1992), małżeństwo i rodzina w religiach świata
      (Gdańsk 1993), wychowanie a religia (Zielona Góra 1993), religia a rynek (Warszawa
      1994), religia a ruchy ekofilozoficzne (Olsztyn 1995), idea narodu i państwa
      w religiach i kościołach narodów słowiańskich (Rzeszów 1996), nowe ruchy religijne
      (Zielona Góra 1997), religie i religijność Europy Wschodu i Zachodu (Poznań
      1998), tożsamość europejska (Rzeszów 1999), pamięć dla przyszłości (Tyczyn 2000),
      człowiek i kultury (Tyczyn 2001).'
    title: PTR współcześnie
