    title: Biblia a bluźnierstwo
  - content: '- w 1611 roku Iwan Tyszkiewicz, zamożny mieszczanin z Polski, (arianin)
      był w Warszawie torturowany; wyrwano mu język „za bluźnierstwo przeciw Bogu”,
      a za rzekome rzucenie krucyfiksu na ziemię ucięto mu dłoń i nogę. Następnie
      został ścięty i spalony (ścięty lub spalony),

      - w 1612 roku Bartholomew Legate, antytrynitarianin, socynianin, został spalony
      za bluźnierstwo w Londynie,

      - w 1644 roku Ferrante Pallavicino, satyryk i pisarz z Włoch został zwabiony
      do Awinionu, będącego wtedy częścią Państwa Kościelnego, uwięziony przez co
      najmniej czternaście miesięcy i mimo błagania o łaskęKopia w Biblioteka Watykanu,
      z zapiskami z procesu Pallavicino : MS Barberino Latino 6157, folios 12-13.
      (Coci 1983). został zabity przez ścięcie głowy za „bezbożność i bluźnierstwa
      przeciwko kościołowi katolickiemu”Muir, Culture Wars, pp. 94ff,

      - w 1689 roku Kazimierz Łyszczyński, filozof, urzędnik państwowy i polityk został
      ścięty na Rynku Starego Miasta w Warszawie za autorstwo nieopublikowanego traktatu
      O nieistnieniu Boga,

