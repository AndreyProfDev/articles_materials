- sections:
  - content: "Zaświaty – w wierzeniach religijnych oznacza świat (lub światy) istniejący\
      \ poza przestrzenią dostępną bezpośredniej percepcji wyznaczony najczęściej\
      \ poprzez konkretny model kosmosu dla różnych ludów lub obszarów świata. \n\
      Zaświaty mają charakter wieczny niezniszczalny (Raj) i zniszczalny (boskie lata\
      \ w mitologii indyjskiej). Krainy zaświatów mają swoje granice przestrzenne\
      \ i można je opisać i nadać konkretne cechy. Ich opis często jest symboliczny\
      \ jednakże bogaty w szczegóły topograficzne lub w opisy funkcjonalności krainy.\
      \ Zaświaty o cechach wzorowanych na realnych obszarach geograficznych określane\
      \ są jako krainy mityczne (np. miasta, ogrody, osady). Zaświaty, gdzie w opisie\
      \ kładzie się nacisk na funkcjonalność krainy, są pojmowane jako stan a nie\
      \ jako miejsce. \nW większości kultur zaświaty są związane ściśle z modelem\
      \ kosmosu. Modele takie mają najczęściej swoje centrum (pępek świata) przez\
      \ który przechodzą osie orientujące kierunki wszechświata. Poniżej linii poziomej\
      \ umieszczone są najczęściej krainy o cechach negatywnych (dolny świat) choć\
      \ niekiedy bywają wyjątki. Ważnymi elementami zaświatów jest drzewo i góra kosmiczna.\
      \ Wyznaczają one oś kosmiczną wokół której roztaczają się różne światy. Najczęściej\
      \ przedstawione są jako modele trzech, siedmiu lub dziewięciu pięterZaświaty\
      \ i krainy mityczne, s. 6–8."
    title: Main
