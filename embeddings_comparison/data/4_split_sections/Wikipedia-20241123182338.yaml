    title: W religii
  - content: 'We wschodnim chrześcijaństwie tajemnica używana jest jako określenie
      chrześcijańskiego sakramentu-mysterion. Szczególnie w pismach Ojców Kościoła
      „zbawcze wydarzenia życia Jezusa, były rozumiane jako wydarzenia, w których
      jedyna tajemnica Boga («mystērion tou Theou») się objawiła i urzeczywistniła”.
      Stąd w pierwszych wiekach chrześcijaństwa istniało wtajemniczenie chrześcijańskie,
      w którym stosowano sztukę tzw. mistagogii, odnowioną w wyniku Soboru watykańskiego
      II (1962–1965).

      O tajemnicy można mówić w kontekście konklawe i tajemnic fatimskich.'
