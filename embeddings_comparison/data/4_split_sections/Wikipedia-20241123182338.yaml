- sections:
  - content: 'Mord rytualny – umyślne zabicie człowieka w celach rytualnych.

      W europejskim kręgu kulturowym o mord rytualny oskarżano mniejszości narodowe,
      etniczne, wyznaniowe oraz inne zbiorowości lub osoby odróżniające się od większości
      społeczeństwa. Pomówienia te stanowiły próbę dyskredytowania konkurencyjnych
      kultur czy religii, określenia grupy mniejszościowej jako barbarzyńców nie respektujących
      najbardziej podstawowych zasad, a co za tym idzie wyłączenie ich ze społeczeństwaOskarżenia
      o dzieciobójstwo, wampiryzm i kanibalizm w kręgu kultur śródziemnomorskich należą
      do żelaznego repertuaru krytyki barbarzyńców, od renesansu wysuwano ją pod adresem
      ludów skolonizowanych. Zainicjowane przez Rzymian pod adresem chrześcijan, zostały
      następnie przez chrześcijan skierowane pod adresem Żydów, heretyków i czarownic.
      Legendy o krwi. Antropologia przesądu, Joanna Tokarska-Bakir, Warszawa 2008,
      s. 177–178.. Grupy oskarżane o mord rytualny były też często obwiniane o dzieciobójstwo,
      kanibalizm czy wampiryzm. Takie niesłuszne oskarżenia wysuwano najczęściej przeciwko
      Żydom. Inne grupy oskarżane niegdyś o mord rytualny to chrześcijanie (w starożytnym
      Rzymie), Romowie, heretycy czy czarownice.

      Zazwyczaj oskarżenia o mord rytualny były fałszywe, aczkolwiek istniały grupy,
      praktykujące tego rodzaju działania (np. thugowie w Indiach).'
    title: Main
  - content: 'Przez wiele wieków o popełnianie mordów rytualnych na chrześcijanach
      bezpodstawnie oskarżani byli w Europie wyznawcy judaizmu, co często stawało
      się pretekstem do dokonywania pogromów i wypędzeń Żydów. Żydzi zabijać mieli
      chrześcijan (najchętniej dzieci), gdyż ich krew miała być niezbędnym składnikiem
      macy spożywanej przez nich w czasie święta PaschyTora zabrania spożywania krwi
      Ktokolwiek spożywa jakąkolwiek krew, będzie wykluczony spośród swego ludu (Księga
      Kapłańska, 7,27). Uzasadnienie zakazu wynika z przekonania, że krew jest nośnikiem
      życia. Nie wolno wam tylko jeść mięsa z krwią życia (Księga Rodzaju 9,4); Ale
      się wystrzegaj spożywania krwi, bo we krwi jest życie (Księga Powtórzonego Prawa
      12,23). Zakazane są ofiary z ludzi (np. Księga Kapłańska 18,21). Kanibalizm
      uchodzi zaś za synonim przekleństwa i kary Bożej. Jeżeli i wtedy nie będziecie
      Mi posłuszni i będziecie Mi postępować na przekór, to i Ja z gniewem wystąpię
      przeciwko wam i ześlę na was siedmiokrotne kary za wasze grzechy. Będziecie
      jedli ciało synów i córek waszych. (Kpł 26,27 – 29).. Pierwsze w nowożytnej
      Europie udokumentowane oskarżenie Żydów o mord rytualny miało miejsce w 1144
      roku w Norwich. Zamordowany czeladnik został przez lokalnego biskupaThomas of
      Monmouth, The life and miracles of St William of Norwich, 1173 (jęz. angielski).
      ogłoszony świętym jako św. William, lecz kult tego świętego pozostał lokalny
      i po pewnym czasie wygasłwww.catholic.org: St. William of Norwich (jęz. angielski)..

      W Polsce w 1576 roku wnoszenia bezpodstawnych oskarżeń o mord rytualny zakazał
      pod karą śmierci król Stefan Batory„Ktoby o one rzeczy żydów pomawiał, karanym
      ma być jako potwarca, ktoby zaś skarżył przed sędzią i dla tej przyczyny skargę
      główną przeciw żydowi wynosił, ten poenta talionis, czyli na gardle karanym
      będzie.” Stefan Batory, dokument z 1576 r., za: Żydzi w Polsce. Obraz i słowo,
      część I, Warszawa 1993, s. 106, www.zydziwpolsce.edu.pl..

      Marcin ZarembaMarcin Zaręba, Psychoza we krwi, Polityka – nr 27 (2561)., podobnie
      jak inni badaczeWokół „Strachu”. Dyskusja o książce Jana T. Grossa, Znak, Kraków
      2008., uważa, że powojenne pogromy, np. pogrom kielecki,- inspirowany przez
      UB – były spowodowane m.in. wiarą w mord rytualny.

      W katedrze w Sandomierzu znajduje się obraz „Mord rytualny” autorstwa Karola
      de Prevot z XVIII wieku przedstawiający mord rytualny dokonywany przez Żydów.
      Obraz ten od 2006 do 2014 roku pozostawał zasłonięty i niedostępny dla zwiedzających
      z powodu swojej treści, budzącej sprzeciw w społeczności żydowskiej i pośród
      chrześcijan zaangażowanych w dialog międzyreligijnyStanisław Musiał SJ, Droga
      krzyżowa Żydów sandomierskich, Gazeta Wyborcza 5–6 sierpnia 2000.. Po ponownym
      odsłonięciu towarzyszy mu tablica wyjaśniająca, że Żydzi nie popełniali mordów
      rytualnych.

      Zanim chrześcijanie zaczęli oskarżać Żydów o mordy rytualne, sami byli o nie
      oskarżani. Podobnie jak w przypadku Żydów plotki o mordach rytualnych, których
      dopuszczali się chrześcijanie, były bezpodstawne. Minucjusz Feliks (Oktawius,
      9, 2-7) wspomina, że poganie oskarżają chrześcijan o rozwiązłość seksualną czy
      mordowanie dzieci:'
