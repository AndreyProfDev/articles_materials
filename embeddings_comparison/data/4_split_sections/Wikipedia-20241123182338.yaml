  - content: Świętokradztwo – termin religijny, który określa znieważenie miejsca,
      przedmiotu, osoby poświęconej Bogu lub innych rzeczy związanych z religią.
    title: Main
  - content: 'Świętokradztwo w rozumieniu teologii katolickiej definiuje Katechizm
      Kościoła Katolickiego w punkcie 2120: „Świętokradztwo polega na profanowaniu
      lub niegodnym traktowaniu sakramentów i innych czynności liturgicznych, jak
      również osób, rzeczy i miejsc poświęconych Bogu”.

      Kan. 916 KPK pozwala w szczególnym przypadku na przystąpienie do Komunii Świętej
      bez uprzedniego odpuszczenia grzechów ciężkich w sakramencie pokuty. Takie przyjęcie
      Eucharystii nie będzie uważane za świętokradzkieKan. 916. Kto ma świadomość
      grzechu ciężkiego, nie powinien bez sakramentalnej spowiedzi odprawiać Mszy
      świętej ani przyjmować Komunii świętej, chyba że istnieje poważna racja i nie
      ma sposobności wyspowiadania się. W takim jednak wypadku ma pamiętać o tym,
      że jest obowiązany wzbudzić akt żalu doskonałego, który zawiera w sobie zamiar
      wyspowiadania się jak najszybciej..

      Świętokradztwo popełnione przeciw Eucharystii jest grzechem ciężkim, ponieważ
      jest w niej obecny Chrystus.

      Zgodnie z kan. 1382 § 1 KPK znieważenie postaci eucharystycznych poprzez: porzucenie
      albo zabieranie lub też przechowywanie w celu świętokradczym wiąże się z ekskomuniką
      latae sententiaeKan. 1382. § 1. Kto porzuca albo w celu świętokradczym zabiera
      lub przetrzymuje postacie konsekrowane, zaciąga ekskomunikę latae sententiae,
      zarezerwowaną dla Stolicy Apostolskiej; duchowny może być ponadto ukarany inną
      karą, nie wyłączając wydalenia ze stanu duchownego.'
    title: Katolicyzm
  - content: 'Świętokradztwo może być czynem podlegającym karze także w świetle prawa
      świeckiego. Dla przykładu w polskim kodeksie karnym świętokradztwu odpowiada
      występek obrazy uczuć religijnych, który jest zagrożony karą grzywny, ograniczenia
      wolności albo pozbawienia wolności do 2 latArt. 196 KK.. Zobacz: obraza uczuć
      religijnych.'
    title: Prawo świeckie
