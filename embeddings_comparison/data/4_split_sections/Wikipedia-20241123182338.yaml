  title: Fundamentalizm religijny
- sections:
  - content: Historia religii – nauka o dziejach religii, część zespołu nauk zwanego
      religioznawstwem. Historię religii cechuje metodologia historyczna w badaniu
      genezy i rozwoju fenomenu religii.
    title: Main
  - content: Historia religii powstała wraz z pełniejszym zastosowaniem źródeł historycznych
      w analizach religioznawczych. Za pierwszego historyka religii uchodzi Edward
      Burnett Tylor, którego badania dotyczące genezy religii oraz jej rozwoju zapoczątkowały
      jedną z największych szkół religioznawczych – mianowicie szkołę ewolucjonistyczną.
      Założył on tezę o szablonowej, naturalnej ewolucji wierzeń religijnych, wraz
      z rozwojem społeczno-cywilizacyjnym człowieka. Za najdawniejsze, najbardziej
      pierwotne przyjął formy animistyczne, totemistyczne, magiczne, które według
      niego historycznie ewoluowały przez stadia prototeistyczne, panenteistyczne,
      politeistyczne, aż do monoteizmu. Mimo iż teza o determinizmie tak rozumianego
      kierunku rozwoju została przyćmiona dalszymi obserwacjami, pozwoliła ona na
      wprowadzenie całej metodologii historycznej do nauk o religii – w tym bardzo
      cennego krytycznego podejścia do źródeł.
    title: Ewolucjonistyczne ujęcia historii religii
  - content: Szkoła historii religii zakładająca wywodzenie się wszystkich zjawisk
      religijnych od jednej prareligii – w konfesyjnej frakcji tej szkoły od jednego
      praobjawienia. Twórcą koncepcji prareligii i założycielem wiedeńskiej szkoły
      etnologicznej był Wilhelm Schmidt. W jego ujęciu pierwotna religia miała charakter
      monoteistyczny, stąd bywa także nazywana pramonoteizmemHenryk Zimoń, Monoteizm
      pierwotny. Teoria Wilhelma Schmidta i jej krytyka w wiedeńskiej szkole etnologicznej,
      Katowice 1989..
    title: Historia religii wiedeńskiej szkoły etnologicznej
  - content: 'Cechą charakterystyczną tej historiografii było definiowanie religii
      w zgodzie z ujęciem Karola Marksa i Fryderyka Engelsa – jako fałszywej wiedzy
      na temat świata będącej efektem oddziaływania nierówności społeczno-ekonomicznych
      na ludzką świadomość. Stąd marksistowska historiografia religii nie interesowała
      się w założeniu doktrynalnym i rytualnym aspektem zjawisk religijnych, lecz
      ich aspektem społecznymWiktor Werner, Magia w historiografii. Magiczne pojmowanie
      problemu genezy w religioznawstwie i historiografii polskiej, Historyka T. XXXII,
      2002 (2003) s. 89-109..

      W przypadku marksistowskiej historii chrześcijaństwa podkreślano rolę wspólnoty
      wiernych a minimalizowano znaczenie postaci Jezusa z Nazaretu. Historiografia
      radziecka twierdziła nawet, że Jezus nie istniał naprawdę, lecz był projekcją
      zbiorowych marzeń o sprawiedliwości społecznej. W bardziej umiarkowanej wersji
      tej koncepcji uważano, że wprawdzie Jezus istniał, lecz jego życie i cechy charakteru
      zostały zmitologizowane przez wspólnotę wiernychWiktor Werner, Walki metafor,
      czyli dyskusja nad genezą chrześcijaństwa w powojennej polskiej humanistyce.
      „Kwartalnik Historii Nauki i Techniki”, R. 47:2002, nr 2, s. 7-45.. Takie stanowisko
      reprezentował między innymi polski przedstawiciel marksistowskiej historiografii
      religii: Zygmunt PoniatowskiZygmunt Poniatowski, Zarys dziejów religii, Warszawa
      1964..'
    title: Marksistowska historia religii
  - content: Wielki rozwój historii religii po II wojnie światowej wiąże się m.in.
      z osobą Mircei Eliadego, który wprowadził teoretyczne założenia fenomenologii
      religii (nazwane przez Eliadego morfologią sacrum) do praktyki historycznych
      badań nad religią. Ponieważ fenomenolodzy postulowali badanie istoty zjawiska
      a nie jego zmiennych przejawów – Eliade wskazał na konieczność refleksji nad
      istotą religii jako niezbędnego wstępu do badań historycznych. Stworzył w ten
      sposób nowy wzorzec badań historyczno-religioznawczych, w którym położył nacisk
      nie tylko na opis różnych religii świata, lecz badanie relacji człowieka z sacrum
      w kontekście różnych uwarunkowań historyczno-kulturowychWiktor Werner, Eliadego
      poszukiwania historii i znaczenia religii, Historyka, T. XXIX, 1999, s. 108-113..
