- sections:
  - content: "Dysydent ( – niezgadzający się) – pojęcie utożsamiane z innowiercą,\
      \ osoba wyznania chrześcijańskiego, innego od dominującego w danym miejscu i\
      \ czasie.\nOkreślenie dysydent powstało w 1573 w Polsce w czasie konfederacji\
      \ warszawskiej i oznaczało początkowo zwolennika reformacjiZygmunt Poniatowski,\
      \ Mały słownik religioznawczy, Wiedza Powszechna, Warszawa 1969, s. 115.. W\
      \ Rzeczypospolitej XVI–XVIII wieku dysydentami nazywano niekatolików, głównie\
      \ protestantów, gdyż wyznawców prawosławia nazywano dyzunitami. \nTermin dysydenci\
      \ (dyssenterzy) obejmuje w Anglii wszystkie wyznania protestanckie, które nie\
      \ należą do kościoła anglikańskiego (Kościoła Anglii), natomiast w Szkocji do\
      \ kościoła narodowego (Kościoła Szkocji) – np. baptystów, kongregacjonistów\
      \ i prezbiterianHervé Masson, Słownik herezji w Kościele katolickim, Wydawnictwo\
      \ „Książnica”, Katowice 1993, s. 114.."
