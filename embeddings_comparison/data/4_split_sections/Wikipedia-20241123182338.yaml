      - Unitarian Church of Transylvania\n- Nicolas Viel (zm 1625) misjonarz Kanady\n\
      - John W. Walley 1831-1928 mormon\n- Watykanistyka, :en:Vaticanology; na polskiej\
      \ Wikipedii słowo „watykanista” pada dziesiątki razy\n- Wingmakers – :en:Wingmakers\
      \ - religia\n- Wizerunki Jezusa - :en:Depiction of Jesus\n- Wolny Kościół Reformowany\n\
      - Wspólnota Jerozolima – Jerozolima – wspólnota Odnowy w Duchu Świętym w Poznaniu.\
      \ Spotyka się przy kościele OO. Dominikanów w Poznaniu od jesieni 1980 roku.\
      \ Wspólnotę tworzą ludzie różnych stanów i w różnym wieku (głównie młodzi).\
      \ Działania wspólnoty służą wszechstronnemu rozwojowi: duchowemu, psychicznemu\
      \ i społecznemu uczestników i mają przygotowywać do podejmowania służby innym\
      \ ludziom.\n- wstrzemiężchwość\n- Wu Xia mnich założyciel klasztoru w Baisui,\
      \ dożył 126 lat, żył w okresie panowania dynastii Ming. Przez okres 28 lat spisał\
      \ 82 sury.\n- Wyższe Seminarium Duchowne Paulinów w Krakowie\n- Wyższy anglikanizm\
