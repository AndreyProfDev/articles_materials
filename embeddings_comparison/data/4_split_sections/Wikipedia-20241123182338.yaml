    title: Działalność wydawnicza
  - content: PTR od 1957 wydawał Euhemer. Przegląd Religioznawczy, który od 1992 ukazuje
      się jako Przegląd Religioznawczy zachowując ciągłość poszczególnych numerów
      od 1957. Do końca 2007 wydano 226 numerów tego czasopisma. W latach 1959–1967
      wydano 5 numerów Euhemer. Przegląd Religioznawczy – Zeszyty Filozoficzne oraz
      1 numer Euhemer. Przegląd Religioznawczy – Zeszyty Filozoficzne przekształcony
      w nowe czasopismo PTR Studia z Dziejów Kościoła Katolickiego, ukazujące się
      w latach 1960–67, które – po ukazaniu się 7 numerów – przejęte zostało przez
      Zakład Religioznawstwa PAN i dalej ukazywało się do 1991 jako Studia Religioznawcze.
