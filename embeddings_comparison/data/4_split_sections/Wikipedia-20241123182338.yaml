- sections:
  - content: 'Cud (z prasłowiańskiego *čudo: dziwo) – religijne określenie zjawiska
      lub zdarzenia, którego nie da się racjonalnie wyjaśnić przez odwołanie do przyczyn
      naturalnych, a które będąc niepojętym i niewyjaśnionym przez znane człowiekowi
      prawa natury, uważane bywa za sprzeczne z tymi prawami i za wyraz ingerencji
      Boga lub sił nadprzyrodzonych.

      Pojęcie cudu występuje w różnych religiach (np. chrześcijaństwo, islam, judaizm,
      hinduizm, shintō, braminizm, taoizm). W buddyzmie i islamie brak jest cudów,
      którymi Budda i Mahomet urzeczywistnialiby swe posłannictwo religijne. Mahomet
      za jedyny cud uważał treść Koranu, a Budda – proces osiągania doskonałości na
      wskazanej przez siebie drodze do nirwany.

      W XIII w. św. Tomasz z Akwinu podaje następującą definicję cudu: „Mówi się,
      że coś jest cudem, kiedy dzieje się poza porządkiem wszelkiego stworzenia”.

      Za czasów Kartezjusza ludzie nie potrafili wyjaśnić, skąd się bierze zjawisko
      tęczy – stąd uważano je za cud, przejaw działalności Boga. W tym sensie sfera
      cudowności kurczy się w miarę postępu nauki: atomistyka wyjaśnia nawet przemianę
      jednych ciał w inne, ale z punktu widzenia religii prawdziwy cud nie jest zjawiskiem
      zewnętrznym, lecz dokonującym się wewnątrz człowieka cudem łaski, żalu za grzechy
      czy nawrócenia. W tym ścisłym znaczeniu zaistnienie albo niezaistnienie cudu
      nie musi mieć żadnego związku z postępami determinizmu w nauce.'
    title: Main
  - content: 'Potocznie mianem cudu określa się zwykle wszelkie niewytłumaczalne zjawiska
      (również zjawiska paranormalne), a przymiotnika cudowny używa się jako synonimu
      przymiotnika piękny w sensie niezwykle piękny.

      W naukach religioznawczych poddano cud analizie fenomenologicznej wraz z różnymi
      zjawiskami, którym wyznawcy przypisywali charakter boski (transcendentny) i
      wyróżniono:

      - cuda mityczne – wszelkie wydarzenia dokonane przed zaistnieniem kosmosu (np.
      pochodzenie i narodziny różnych bóstw, czy też wyrażone w mitach poglądy na
      sposób powstawania świata), które miały miejsce zanim zaistniał czas;

      - cuda magiczne – dokonywane przez osoby przypisujące wyłącznie sobie znajomość
      działających tajemniczo praw natury (biała magia, zabobon);

      - cuda religijne – wydarzenia nadzwyczajne, których jedynym celem nie jest stwarzanie
      czegoś, co uważa się za niemożliwe, lecz wywołanie u człowieka przeżycia spotkania
      z bogiem w celach zbawczych (przeżycie religijne, doświadczenie religijne);

      - cuda indeterminizmu – istnienie indeterminizmu jako takiego, jako wyraz działania
      wymiaru duchowego oraz wolnej woli (zwłaszcza ludzkiej), rozumiane jako cud
      sam w sobie, bądź wyraz obecności ducha – duszy(zwłaszcza ludzkiej), niemożność
      wyjaśnienia wszystkiego determinizmem dzisiejszej nauki i domniemaniu wskutek
      tego niemożności wyjaśnienia wszystkiego kiedykolwiek, skłaniające w wiarę w
      jakąś formę duchowości.

      Według Kościoła rzymskokatolickiego, wśród cudów religijnych wartość faktograficzną
      przyznaje się wydarzeniom nadzwyczajnym, którymi założyciele określonej religii
      lub jej reformatorzy osobiście uwierzytelniali swe religijne prerogatywy lub
      funkcje przed historycznymi świadkami, natomiast wydarzeniom nadzwyczajnym,
      za pomocą których dla celów religijnych stwarza się niezwykłe okoliczności gloryfikacyjne,
      towarzyszące narodzeniu, powołaniu, śmierci lub pogrzebowi założyciela lub reformatora
      religii (np. Budda, Mahomet, Mojżesz), zarówno w źródłach ustnych, jak też pisanych,
      przyznaje się w zasadzie jedynie wartość opowiadania literackiego (fikcja literacka),
      więc za cuda religijne nie powinno się więc uznawać wydarzeń nadzwyczajnych
      opisanych w mitach, legendach, hagadzie, apokryfach, fantastyce naukowej.'
    title: Rodzaje cudów
  - content: ''
    title: Cuda według religii
