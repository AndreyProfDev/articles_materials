  - content: 'Skandal, zgorszenie – działanie, które może prowadzić innych do grzechu
      czyli metaforycznie do moralnego potknięcia i upadku w pułapkę. Wywodzi się
      od greckiego σκάνδαλον (skandalon), którego dosłowne pierwotne znacznie: spust
      pułapki albo sidła zastawione na wrogaLiddell and Scott. An Intermediate Greek-English
      Lexicon. Oxford. Clarendon Press. 1889.Bible Hub (ang.), tłumaczone jest także
      m.in. jako zgorszenie, kamień/skała potknięcia bądź zawadaMirosław Rucki, Michael
      Abdalla, 2018 Kamień, o który wszyscy się potykają (Mt 16, 23) w: Wrocławski
      Przegląd Teologiczny 26 2, 61–76.'
    title: Main
  - content: 'Słowo skandal ma swoje źródło w starożytnym języku greckim, ma związek
      ze „skadzein” (kuleć), „skadzo” (kuleję), „skolon” (zawada, przeszkoda), początkowo
      „skandalon” był używany w sensie „pułapki” lub „zasadzki”Maciej Tramer (2000).
      Literatura i skandal. Na przykładzie okresu międzywojennego. Katowice: Wydawnictwo
      Uniwersytetu Śląskiego; Maciej Tramer (2007). Rzeczy wstydliwe, a nawet mniej
      ważne. Katowice : Wydawnictwo Uniwersytetu Śląskiego. Pochodzi od (zrekonstruowanego)
      praindoeuropejskiego *skand- (skakać, wspinać się)2001-2021, Douglas R. Harper,
      Online Etymology Dictionary, hasło: scandal (ang.).'
    title: Etymologia
  - content: 'Termin oznaczający kamień, skałę potknięcia w języku hebrajskim to mikhshol
      (מִכְשׁוֹל‎) lub makhshelah, co na grecki jest tłumaczone jako skandalon lub
      proskomma i odnosi się często do zbłądzenia, zejścia na złą drogę, np. z powodu
      bałwochwalstwa, idolatriiGeorge Rice Hovey, 1939, 2021 (wersja HTML), Stumbling-block;
      Stumbling-stone w: International Standard Bible Encyclopedia Online (ang.).
      Wywodzi się z metaforycznego zakazu z Księgi Kapłańskiej by nie kłaść przeszkód,
      zawad, kłód (w zależności od tłumaczenia) przed niewidomymBibliePolskie.pl 3.
      księga Mojżeszowa 19:4.'
    title: Biblia hebrajska
  - content: 'Według Konkordancji Stronga w formie rzeczownikowej skandalon użyty
      jest 15 razy w Nowym TestamencieBibleHub, Strong''s greek 4625. σκάνδαλον (skandalon).

      W formie derywatu czasownikowego (skandalizo) występuje 29 razyBibleHub, Strong''s
      greek 4624. σκανδαλίζω (skandalizó). Na język polski przekładany jest zwykle
      już w formie niedosłownej jako zgorszenie także dosłowniej jako zawada (to tłumaczenie
      wybierane jest często w Nowym Testamencie Szymona Budnego (z 1574), gdyż był
      on zwolennikiem dosłowności w tłumaczeniuRafał Zarębski, 2017, Indywidualizmy
      nazewnicze Szymona Budnego (na przykładzie nowotestamentowych nazw geograficznych
      w Biblii nieświeskiej); występuje także jednokrotnie w Biblii Tysiąclecia w
      Ewangelii Mateusza 16:23Mat 16:23) bądź skandal (np. w Biblii EIBwww.biblegateway.com,
      również w tłumaczeniach starosłowiańskich (w głagolicy: <big>ⱄⰽⰰⱀⰴⰰⰾⱏ</big>)Vatroslav
      Jagić, Leszek Moszyński. (1879, 1951). Kodeks Zografski, Ewangelia Mateusza
      18:7 (głagolica, cyrylica)) czy też jako kamień potknięcia (Biblia Tysiąclecia,
      List do Rzymian 11:9Rz 11:9) nakłanianie do odstępstwa (np. w Biblii EIB), nakłanianie
      do złego (Biblia poznańska) lub obraza (Szczepański) itp. Termin ten używany
      jest także paradoksalnie na określenie np. apostoła Piotra, krzyża, a także
      Chrystusa, którego życie było często bardzo odległe od ludzkich oczekiwań.'
    title: Nowy Testament
  - content: Skandalowi, zgorszeniu poświęcona jest w Katechizmie Kościoła Katolickiego
      sekcja II w artykule o piątym przykazaniuKatechizm Kościoła Katolickiego na
      opoka.org.pl. Zgorszenie to zachowanie czy postawa, która sprowadza drugiego
      człowieka na drogę grzechu. Gorszyciel może doprowadzić bliźniego do duchowej
      śmierci. Szczególnie ciężką przewiną jest skandal wywoływany przez osoby, które
      mają za zadanie np. z racji pełnionej funkcji, stanowić autorytet moralny dla
      innych. Zgorszenie może mieć swe źródło w prawodawstwie, w modzie, w instytucjach
      bądź w opinii publicznej, a także w szczególności w mechanizmach władzy. Zgorszenie
      jest działaniem zewnętrznym lub zaniedbaniem działania zewnętrznego, możemy
      je podzielić na zgorszenie czynne i bierne to z kolei na zgorszenie dane łac.
      scandalum datum i przyjęte łac. scandalum acceptumAchille Vander Heeren, 1912,
      Catholic Encyclopedia Scandal(ang.)
