- sections:
  - content: Profetyzm (gr. προφήτης, prophētēs „prorok, wieszcz”) – zjawisko spotykane
      w wielu religiach, polegające na występowaniu wśród członków danej grupy religijnej
      przekonania, że niektóre jednostki są powoływane przez bóstwo do głoszenia jego
      woli i przepowiadania przyszłości (prorokowania)Słownik wyrazów obcych, PWN,
      Warszawa 1980, s. 602, .. Profetyzm wiąże się również np. z etosem poety-wieszcza
      i jego wizjonerstwem w literaturze polskiego romantyzmu.
    title: Main
  - content: 'W religiach światowych profetyzm nabrał szczególnego znaczenia głównie
      u Izraelitów. Początki profetyzmu izraelskiego (biblijnego)Michał Peter, hasło:
      Profetyzm biblijny, w: Katolicyzm A–Z, red. ks. Zbigniew Pawlak, Poznań: Księgarnia
      Św. Wojciecha, 1997, s. 328. ., który odegrał ważną rolę w kształtowaniu się
      monoteistycznego judaizmu, sięgają IX w. p.n.e., a okres rozkwitu osiągnął on
      w VIII–VII w. p.n.e. Występuje również w innych religiach, m.in. w chrześcijaństwie.
      Często wiązał się z ruchami chiliastycznymi i mesjanistycznymiWielka Encyklopedia
      Powszechna, wyd. I, PWN, Warszawa 1967, s. 448..'
    title: Religia
  - content: 'W literaturze profetyzm znalazł się w dziełach pisarzy i poetów prorokujących
      przyszłość, wyobrażoną zgodnie z ideami i zasadami propagowanymi przez ich autorów.
      Pojawiał się najczęściej w przełomowych momentach dziejowych, pełnych napięć
      społecznych i oczekiwań na zmiany, pozwalał na formułowanie idei i poglądów
      w sposób pośredni, w formie pozbawionej publicystycznej dosłowności. Wizji proroczej
      służyła figuralna interpretacja wydarzeń przeszłości, przywoływanie przypowieści,
      stylizacja biblijna w zakresie języka.

      Dzieła o charakterze profetycznym powstawały w różnych okresach (np. twórczość
      J. Boehme’go w Niemczech w pocz. XVII w., twórczość F. de Lamennais’go, J. Micheleta,
      E. Quineta, J. de Maistre’a w poł. XIX w. we Francji).

      Profetyzm w XIX wiecznej literaturze rosyjskiej zajmował istotne miejsce, zwłaszcza
      u takich twórców, jak Puszkin, Lermontow, Dostojewski, Tołstoj, Leontjew, Sołowjow.
      Elementami profetyzmu nacechowane były także niektóre dzieła pisarzy i poetów
      w Niemczech i w Anglii zwłaszcza epoki Romantyzmu, jednak nurt nie rozwinął
      się tam w takim stopniu, jak w Rosji. Bojaźń przed niewiadomą przyszłością,
      nadchodząca katastrofa, kraj nad przepaścią, oczekiwanie końca świata oraz modlitwa
      i żal za grzechy padły na podatny grunt dla rozwoju religijnego profetyzmu rosyjskiego.'
    title: Literatura
  - content: 'W literaturze polskiej elementy profetyzmu wystąpiły w twórczości czasów
      konfederacji barskiej (m.in. tzw. Profecja księdza Marka prawdopodobnie autorstwa
      Marka Jandołowicza). Największe nasilenie tych tendencji znamionowało okres
      romantyzmu i pozostawało w związku z przyjmowanym przez twórców poetyckiej roli
      wieszcza oraz założeniami mesjanizmuSłownik terminów literackich, red. Janusz
      Sławiński, wyd. II, Ossolineum, Wrocław 1988, s. 399..

      Profetyczne refleksje dotyczące przyszłości narodu polskiego są obecne np. w
      twórczości Adama Mickiewicza (Widzenie księdza Piotra w III cz. Dziadów, Księgi
      narodu i pielgrzymstwa polskiego)Alina Witkowska, Literatura romantyzmu, PWN,
      Warszawa 1987, s. 114, 124, .. Wizyjny charakter ma również twórczość Juliusza
      Słowackiego (Anhelli, Król-Duch) oraz Zygmunta Krasińskiego (Nie-Boska komedia,
      Psalmy przyszłości).'
