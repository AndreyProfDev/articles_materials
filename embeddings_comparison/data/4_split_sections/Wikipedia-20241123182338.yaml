- sections:
  - content: 'Hierofania – objawienie się świętości, każde wtargnięcie sacrum w sferę
      profanum; kluczowy termin w teorii religii M. Eliadego.

      Przestrzeń człowieka Eliade podzielił na dwa typy: przestrzeń sacrum i profanum
      - zaznaczył, że sfery te mogą się pokrywać (gdyż sfera sacrum jest sferą, która
      jest konstytuowana przez nasz umysł). Prostym przykładem sfery sacrum jest np.
      kościół, który dla osoby konkretnego wyznania jest miejscem w którym objawia
      się świętość - dla ateisty zaś jest zwykłym budynkiem (sferą profanum).'
    title: Main
  - content: ''
    title: Przypisy
  title: Hierofania
- sections:
  - content: 'Anachoretyzm (z anachoreo – „oddalam się, odchodzę w górę” tzn. odchodzę
      z doliny Nilu na pustynię) – forma religijności znana w chrześcijaństwie, judaizmie,
      hinduizmie, buddyzmie oraz islamie. Anachoreta udaje się w odosobnienie, by
      pędzić ascetyczne życie w samotności, modląc się, umartwiając i kontemplując.

      Ruch anachorecki był szczególnie popularny we wczesnym i średniowiecznym chrześcijaństwie;
      zapoczątkował najstarszą formę życia zakonnego, pierwotną wobec cenobityzmu.'
    title: Main
  - content: '- eremita

      - monastycyzm'
