- sections:
  - content: Instytut Religioznawstwa Uniwersytetu Jagiellońskiego – jeden z instytutów
      działających w obrębie Wydziału Filozoficznego Uniwersytetu Jagiellońskiego,
      specjalizujący się w interdyscyplinarnych studiach nad religią, połączonych
      z porównawczymi studiami nad kulturą.
    title: Main
  - content: Instytut powstał w 1974 jako pierwszy taki ośrodek w Polsce w wyniku
      przekształcenia Podyplomowego Studium Filozoficzno-Religioznawczego, utworzonego
      dwa lata wcześniej w Instytucie Filozofii UJ. Na początku swojej działalności
      dydaktycznej Instytut obsługiwał trzysemestralne Podyplomowe Studium Filozoficzno-Religioznawcze,
      przekształcone w 1987 w czterosemestralne Studium Religioznawcze i ostatecznie
      zawieszone w 1992 roku, a także dwuletnie Studium Filozoficzno-Religioznawcze,
      funkcjonujące w latach 1975–1984 i przeznaczone dla studentów chcących studiować
      religioznawstwo równolegle z innym kierunkiem studiów. W 1980 rozpoczęto prowadzenie
      pięcioletnich, stacjonarnych studiów magisterskich z zakresu religioznawstwa,
      zaś w 1994 także studiów niestacjonarnych. Ostateczną postać studia w ramach
      IR UJ przybrały w 1992 w wyniku wyodrębnienia Wydziału Filozoficznego UJ z dawnego
      Wydziału Filozoficzno-Historycznego.
    title: Historia
