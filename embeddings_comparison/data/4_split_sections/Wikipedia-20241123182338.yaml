    title: Możliwe wyjaśnienia mechanizmu kozła ofiarnego
  - content: Z punktu widzenia psychoanalizy osoba lub grupa projektuje na kozła ofiarnego
      cechy, które wypiera, których nie akceptuje w sobie samym, lub wręcz własne
      winy, z którymi nie może się pogodzić. Chce je pokonać przez przeniesienie na
      kogoś innego. Następnie doprowadza do wypędzenia go, wykluczenia lub zabicia.
      Im większą zbrodnię popełnia się wobec kozła ofiarnego, tym większe zbrodnię,
      dla usprawiedliwienia, kozłowi się przypisuje.
    title: Podejście psychoanalizy
  - content: '; Pochodzenie religii z mordu kolektywnego

      Francuski antropolog filozoficzny, René Girard, jest zdania, że mechanizm ten
      jest źródłem wszelkich religii. Podejmuje tu wątek, który pierwszy zaproponował
      Zygmunt Freud (. Girard twierdzi, że każda religia wzięła się u zarania ze zbiorowego
      mordu dokonanego na koźle ofiarnym, wedle następującego modelu:

      - Po dokonaniu mordu społeczność jest w szoku, że go dokonała.

      - Kryzys, który doprowadził do zabicia kozła ofiarnego, w końcu, siłą rzeczy,
      przechodzi; tworzy się poczucie, że to zabicie jednak pomogło w rozwiązaniu
      kryzysu.

      - Skoro zabicie pomogło, to znaczy, że kryzys naprawdę był spowodowany winą
      kozła ofiarnego; kryzys przeszedł po zabiciu przyczyny zła;

      - Zabity kozioł ofiarny był przyczyną zła, ale z drugiej strony umierając uratował
      grupę; dlatego ulega sakralizacji i staje się bogiem;

      - Na tej podstawie tworzą się normy moralne religii, które zaczynają się od
      zakazania tego, czym rzekomo zawinił kozioł ofiarny;

      - Żeby jednak zachować stan społecznej i kulturowej równowagi, trzeba od czasu
      do czasu powtórzyć akt zabicia kozła ofiarnego. Stąd rytualne zabijanie ludzi
      w najstarszych religiach.

      - Normy moralne się jednak rozwijają i sublimują; kultura stopniowo tuszuje
      pamięć inicjalnego mordu kolektywnego będącego podstawą religii, zastępuje go
      konstrukcjami symbolicznymi; w rytuałach odchodzi się od ofiar z ludzi – na
      rzecz ofiar ze zwierząt, a następnie ofiar symbolicznych.

      ; Kozioł ofiarny a Ewangelie

      Chrześcijaństwo również zaczęło się od zbiorowego mordu dokonanego na Jezusie
      Chrystusie w okresie ogromnych niepokojów społecznych i poczucia zagrożenia.
      Dla Girarda najbardziej niezbitym dowodem, że chodziło o mechanizm kozła ofiarnego
      jest zdanie Kajfasza: Lepiej zabić jednego, niż żeby wszyscy zginęli.

      Różnica jednak polega na tym, że – zdaniem Girarda – inne religie i ich mity
      założycielskie są opowiedziane z punktu widzenia zabójców i wina kozła ofiarnego
      nie jest w nich podawana w wątpliwość. Ewangelie natomiast nie uwieczniają mechanizmu,
      tylko go demaskują: są napisane niejako ze strony ofiary, której brak winy jest
      podkreślany ustawicznie. Jego analiza wykazuje, że jest to podstawowa treść
      tych utworów. Dla Girarda jest to wyjaśnienie, dlaczego w cywilizacji Zachodu
      jako pierwszej mechanizm kozła ofiarnego został uznany za etycznie niedopuszczalny.'
    title: Podejście antropologii filozoficznej
  - content: Psychologia ewolucyjna przyjmuje, że psychika człowieka kształtowała
      się przez miliony lat ewolucji. Dziś człowiek żyje jednak w odmiennym środowisku,
      od tego w którym żył i do którego się przystosował. Wielu badaczy sądzi, że
      przez miliony lat ludzie żyli w niewielkich grupach na terenach o charakterze
      sawanny. Przemiany środowiska i kultury ludzkiej jakie nastąpiły w ostatnim
      okresie były, w skali milionów lat, zbyt „błyskawiczne” by psychika ludzka mogła
      się w tym czasie istotnie zmienić. W tym kontekście Barbara Ehrenreich w swojej
      publikacji Rytuały krwi stawia hipotezę, zgodnie z którą ludzie (bez względu
      w jakiej kulturze żyją) wykazują wrodzoną dyspozycję do rytualnego składania
      ofiar, w szczególności do składania ofiary z „kozła ofiarnego” (najlepiej z
      ludzi lub w postaci zwierzęcego substytutu zawsze jednak z pokarmu mięsnego).
      Zdaniem autorki wynika to z warunków życia w jakich człowiek żył na przestrzeni
      wielu milionów lat ewolucji. Prowadząc życie na dość otwartej przestrzeni narażony
      był (podobnie jak inne naczelne obserwowane współcześnie) na liczne niebezpieczeństwa
      z czego jednym z najistotniejszych zagrożeń były ataki zwierząt mięsożernych.
      Skłonność do poszukiwania ofiary w postaci „kozła ofiarnego” czy też do praktykowania
      rytuału składania ofiary wykształciła się więc na drodze przystosowania ewolucyjnego.
      Te grupy, społeczności ludzi, które w obliczu niebezpieczeństwa potrafiły zapobiec
      dalszemu rozlewowi krwi poprzez poświęcenie któregoś z członków swojej społeczności
      miały po prostu dużą większą szansę przetrwania w takich okolicznościach. Autorka
      przypuszcza, że ludzie byli wówczas stale narażeni na ataki groźnych drapieżników
      (na przykład tygrysów szablozębnych, lampartów, gepardów, przodków lwa i wielu
      innych zwierząt mięsożernych, których liczba była w okresie paleolitu znacząco
      większa niż kiedykolwiek później). Zgodnie z taką logiką skłonność do szukania
      „kozła ofiarnego” to swoisty mechanizm obronny, który nasila się najbardziej
      w sytuacji poczucia np. bliżej nieokreślonego zagrożenia i kieruje się na osoby
      najbardziej odmienne lub słabe (tak by pula „samolubnych” genów społeczności
      najbliżej spokrewnionych ucierpiała jak najmniej).
