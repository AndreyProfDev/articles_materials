  - content: 'Asceta (gr. asketes „ćwiczący się”) – wyznawca religijny zmierzający
      do zbawienia przez ascezę. W rozumieniu potocznym człowiek odmawiający sobie
      przyjemności życiowych z innych pobudek niż religijne.

      Wierzący usiłujący osiągnąć zbawienie lub dążący do doskonałości przez ascezę
      w braminizmie i buddyzmie to sannjasin, w chrześcijaństwie i judaizmie to anachoreta.
      Zorganizowana zbiorowość mnisza prowadząca ascetyczny tryb życia nazywana jest
      monastycyzmemZygmunt Poniatowski, Mały słownik religioznawczy, Warszawa:Wiedza
      Powszechna, 1969, s. 35..'
