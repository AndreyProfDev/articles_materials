  - content: 'Nauki ścisłe – nauki oparte na ścisłych, jednoznacznych rozumowaniach
      jak dedukcja i metody ilościowe. Obejmują:

      - przynajmniej część nauk formalnych jak matematyka i jej pogranicze: logika,
      statystyka, kryptologia czy informatyka teoretyczna (teoria obliczeń);

      - część nauk empirycznych, zarówno przyrodniczych, jak i społecznych; przyrodoznawstwo
      bywa włączane do nauk ścisłych całkowicie, jednak nie zawsze, np. w:

      -- dawnej kategoryzacji Nagród FNP („polskich Nobli”);

      -- klasyfikacji dziedzin i dyscyplin naukowych w Polsce;

      -- nazewnictwie niektórych instytucji opisanych dalej, podobnie wymieniających
      nauki przyrodnicze lub nauki o Ziemi obok tych ścisłych, co sugeruje brak pełnej
      inkluzji.

      : Przykładem ścisłej nauki społecznej może być ekonomia matematyczna, np. ekonometria
      Ekonomia. Nauka ścisła czy społeczna?, superprof.pl, 9 września 2020 [dostęp
      2023-09-19].;

      - przynajmniej część nauk technicznych, choć wspomniana wyżej klasyfikacja państwowa
      traktuje je odrębnie.'
    title: Main
  - content: 'Kategoria nauk ścisłych bywa używana w różnych kontekstach jak na przykład:

      - określenie zajęć pewnych towarzystw naukowych jak Towarzystwo Nauk Ścisłych
      w Paryżu;

      - przyznawanie niektórych nagród:

      -- Nagroda Fundacji na rzecz Nauki Polskiej (FNP) w początkowej fazie, w latach
      1992–2010, miała kategorię nauk ścisłych;

      -- Nagroda Narodowego Centrum Nauki (NCN) ma kategorię nauk ścisłych i technicznych;

      - grupowanie artykułów Encyklopedii PWN Nauki ścisłe, encyklopedia.pwn.pl [dostęp
      2023-09-19].;

      - definiowanie tematyki pewnych kursów akademickich Filozofia nauk ścisłych
      i matematyki do XIX w., Uniwersytet Warszawski, informatorects.uw.edu.pl [dostęp
      2023-09-19]..

      W Polsce co najmniej kilka uczelni utworzyło wydziały z naukami ścisłymi w nazwie:

      - Wydział Nauk Ścisłych i Nauk o Zdrowiu Katolickiego Uniwersytetu Lubelskiego
      Jana Pawła II (KUL);

      - Wydział Nauk Ścisłych i Przyrodniczych Uniwersytetu Jana Kochanowskiego w
      Kielcach (UJK);

      - Wydział Nauk Ścisłych i Przyrodniczych Uniwersytetu Komisji Edukacji Narodowej
      w Krakowie Wydział Nauk Ścisłych i Przyrodniczych, wnsip.uken.krakow.pl [dostęp
      2023-12-21]. (UKEN);

      - Wydział Nauk Ścisłych i Przyrodniczych Uniwersytetu w Siedlcach (UWS);

      - Wydział Nauk Ścisłych i Przyrodniczych Uniwersytetu Szczecińskiego (USz);

      - Wydział Nauk Ścisłych i Technicznych Uniwersytetu Śląskiego (UŚ);

      - Wydział Nauk Ścisłych, Przyrodniczych i Technicznych Uniwersytetu Jana Długosza
      w Częstochowie (UJD).

      Oprócz tego:

      - Uniwersytet Kardynała Stefana Wyszyńskiego w Warszawie prowadzi Szkołę Nauk
      Ścisłych, początkowo działającą jako samodzielna szkoła wyższa;

      - Polska Akademia Nauk zawiera Wydział III – Nauk Ścisłych i Nauk o Ziemi Wydział
      III Nauk Ścisłych i Nauk o Ziemi, pan.pl [dostęp 2023-09-19]..

      Pojęcie nauk ścisłych nie występuje jednak w klasyfikacji OECD z 2004 roku.'
    title: Występowanie terminu
  - content: 'Większość przedstawicieli tych nauk jest płci męskiej, co skutkowało
      kampaniami na rzecz feminizacji tego środowiska O akcji "Dziewczyny do ścisłych!",
      Uniwersytet Jagielloński, dziewczynydoscislych.uj.edu.pl [dostęp 2023-09-19]..
      Przykładem takich działań w USA są osobne nagrody dla kobiet w:

      - matematyce – Ruth Lyttle Satter Prize;

      - fizyce – Maria Goeppert-Mayer Award;

      - astronomii – Annie J. Cannon Award in Astronomy.

      Mimo to zdarzały się kobiety wybitnie zasłużone tym naukom jak Maria Skłodowska
      Curie, dwukrotna noblistka – z fizyki i chemii. Nagrody Nobla w tych dziedzinach
      zdobywało też kilka innych pańz fizyki: Maria Goeppert-Mayer, Donna Strickland
      i Andrea Ghez; z chemii: Irène Joliot-Curie, Dorothy Crowfoot Hodgkin, Ada Jonath,
      Frances Arnold, Emmanuelle Charpentier, Jennifer Doudna i Carolyn Bertozzi.
      Kobiety zdobywały też najwyższe wyróżnienia matematyczne jak:

      - Medal Fieldsa – Marjam Mirzachani, Maryna Wiazowska;

      - Nagroda Abela – Karen Uhlenbeck.

      Kobiety bywały pionierkami niektórych dyscyplin, np. Ada Lovelace jest nazywana
      pierwszą programistką i osobą programującą ogółem, nie tylko wśród kobiet.

      Dysproporcja płci bywa wiązana z dyskryminacją lub innym seksizmem jak zjawisko
      Matyldy.'
    title: Charakterystyka ścisłowców
  - content: 'Nauki ścisłe są uznawane za rozłączne z humanistyką; przykładowo przedstawiciel
      tych pierwszych, czyli ścisłowiec, bywa nazywany antonimem humanisty ścisłowiec,
      Wielki słownik języka polskiego PAN, wsjp.pl [dostęp 2023-09-18].. Mimo to humanistyka
      obejmuje pewną działalność bliską naukom ścisłym, np. przez badanie ich. Przykłady
      to część naukoznawstwa jak obszary historii nauki i filozofii nauki, np. filozofia
      matematyki czy fizyki. Między naukami ścisłymi a humanistyką zachodzi też wpływ:

      - rozwój techniki umożliwił pewne kierunki sztuki jak architektura, fotografia
      artystyczna, film artystyczny czy pewne formy gier wideo; zjawiska te są badane
      przez humanistów jak historycy sztuki czy estetycy;

      - nauki ścisłe inspirują fantastykę naukową, badaną przez kulturoznawców jak
      literaturoznawstwo, filmoznawstwo czy groznawstwo.

      Podejmowano też próby upodobnienia filozofii do nauk ścisłychEdmund Husserl,
      Filozofia jako ścisła nauka, tłum. W. Galewicz, Aletheia, Warszawa 1992..'
    title: Nauki ścisłe a humanistyka
