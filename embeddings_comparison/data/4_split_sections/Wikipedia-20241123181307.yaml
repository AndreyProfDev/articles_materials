  - content: "- Bacillus globigii → Bacillus atrophaeus (:en:Bacillus atrophaeus)\n\
      - Bacteroides vulgatus\n- badania doceniające (:en:Appreciative inquiry)\n-\
      \ balanitis\n- Barron → metoda Barrona / operacja Barrona / zabieg Barrona\n\
      - Barry, James Miranda Stuart – brytyjski chirurg\n- barwniki żółciowe\n- bdeliny:\
      \ bdelina B, bdelastazyna\n- Beckoj, Iwan – pediatra rosyjski, stworzył dom\
      \ dla podrzutków w Petersburgu, dzisiaj nazywa się to \"Okno życia\" (1704–1795)\n\
      - belinostat \n- Benninghoff, Alfred – niemiecki anatom (:de:Alfred Benninghoff)\n\
      - Bernier, François – francuski lekarz\n- Berry, Alexander – szkocki chirurg\
      \ (1781–1873)\n- bezdech afektywny – zatrzymanie oddechu, powstałe w wyniku\
      \ silnego przeżycia psychicznego, np. przy silnym stresie. Z reguły ustępuje\
      \ samoistnie, przechodząc często w hiperwentylację (gwałtowne przyspieszenie\
