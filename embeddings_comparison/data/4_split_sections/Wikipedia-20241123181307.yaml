    title: Nagrody
  - content: "2023\n- Medonet pierwszym i jedynym polskim serwisem, który zdobył prestiżowy\
      \ certyfikat @TRUST, przyznawany przez Accreditation Committee of the AACI America.\
      \ Otrzymują je czołowe serwisy zdrowotne na świecie tworzące rzetelne, poparte\
      \ nauką i godne zaufania treści.\n- Medonet uruchamia nowy serwis Medonet Dziecko\
      \ \n- Z początkiem roku każdy użytkownik może założyć darmowe konto “Mój Medonet”,\
      \ które po zalogowaniu pozwala m.in. stworzyć swój indywidualny profil zdrowia\n\
      2022\n- Medonet udostępnia nowe narzędzie, Shen.AI, które w 60 sekund oceni\
      \ ryzyko chorób serca i układu krążenia.\n- Medonet i Helfio uruchamiają pierwszą\
      \ w Polsce aplikację mobilną, która łączy w sobie dane o stanie zdrowia oraz\
      \ styl życia, Helfio.\n- Medonet i Onet wraz z UN Global Compact Network Poland\
      \ 14 lutego zainicjowały kampanię społeczną „Kochaj siebie. Dla zdrowia.” by\
      \ wspólnie namówić Polaków do dbania o siebie i to, co najcenniejsze, czyli\
      \ swoje zdrowie. Twarzami akcji: Katarzyna Zielińska, Vienio i Michał Figurski.\n\
      - Nowy podcast Medonetu - “Reset” - o tym, jak wspomóc i zadbać o sprawność\
      \ psychosomatyczną.\n2021\n- od 1 sierpnia Diana Żochowska przejmuje funkcję\
      \ head of Medonet.pl\n- ukazuje się pierwsze wydanie kwartalnika „Newsweek Zdrowie”\
      \ stworzone we współpracy z serwisem Medonet.pl\n- Medonet udostępnia narzędzie\
      \ do wstępnego rozpoznawania dolegliwości Symptom Checker (wyrób medyczny start-upu\
      \ Infermedica)\n- poszerzenie oferty portalu o bazę prywatnych klinik medycznych\
      \ i estetycznych Kliniki.pl\n- Narodowy Test Zdrowia Polaków 2021 został wyróżniony\
      \ nagrodą honorową w kategorii \"Najlepszy pomysł na zwiększenie zaangażowania\
      \ czytelników\" przez International News Media Association (INMA) w konkursie\
      \ Global Media Awards.\n2020\n- Medonet jest patronem medialnym filmu animowanego\
      \ \"Funky Casimir\" o Kazimierzu Funku – polskim naukowcu, odkrywcy pierwszej\
      \ witaminy.\n- właściciel Medonet, Ringier Axel Springer Polska został wyłącznym\
      \ partnerem platformy telemedycznej haloDoctor.pl, dzięki czemu jej funkcjonalności\
      \ będą dostępne w serwisach wydawcy, m.in. na Medonet.pl\n- Medonet wprowadza\
      \ dwustopniowy system weryfikacji treści nowy layout i narzędzia \n2019\n- Wprowadzono\
      \ nową politykę redakcyjną oraz formaty treści, za które odpowiada oddzielna\
      \ redakcja. 1 grudnia 2019 r. redaktorką naczelną została dr Anna Zimny-Zając.\n\
      2015\n- Medonet.pl dostępny w wersji responsywnej w mobile (RWD), cały serwis\
      \ gruntownie przebudowany.\n2012\n- rusza interaktywny program Medonetu „Gorący\
      \ dyżur”. Będzie on nadawany dwa razy w miesiącu na żywo.\n2010\n12 lutego 2010\
      \ Grupa Onet.pl uruchomiła serwis medyczny MedOnet.pl"
    title: Historia
  - content: 'Pomimo misji szerzenia „obiektywnych i godnych zaufania treści” z zakresu
      medycyny, portal publikuje również artykuły, w których opisywane są metody pseudonaukowe
      lub których efektywność jest słabo udokumentowana. Przykładem wspomnianych metod
      jest chiropraktyka, która w rzeczywistości badana była głównie w kontekście
      terapii przewlekłego lub ostrego bólu krzyża. Wyniki badań nie pozwoliły na
      wyciągnięcie jasnych wniosków na temat skuteczności techniki – w najlepszym
      razie jest efektywna w podobnym lub mniejszym stopniu jak inne metody, a być
      może za obserwowany efekt leczniczy odpowiada głównie działanie placebo, naturalna
      remisja lub zmniejszenie wrażliwości na ból. W wypadku innych dolegliwości,
      nie ma wystarczającej ilości badań, by określić czy chiropraktyka jest efektywna.
      Należy odnotować, że wskazany artykuł oznaczony został przez redakcję Medonet
      jako „sprawdzona treść” – a więc „zgodny z aktualną wiedzą medyczną”. W ten
      sam sposób oznaczony jest artykuł o klawiterapii (metoda przypominająca bezinwazyjną
      akupunkturę), nad którą nie przeprowadzono niemal żadnych badańSzukane frazy:
      „clavitherapy” lub „clavicle therapy” w GoogleScholar i MEDLINE (stan na 15.07.2021)..

      Na portalu znajduje się więcej artykułów, które w niemal bezkrytyczny sposób
      opisują niepotwierdzone naukowo metody (choć nie zawsze z oznaczeniem „sprawdzona
      treść”), jak irydologia, refleksologia, homeopatia czy program rozwoju relacji
      (RDI).'
