- sections:
  - content: "Medycyna pastoralna – nauka pomocnicza praktycznej teologii. Swe zasady\
      \ czerpie z wiedzy lekarskiej. Jest to zbiór przepisów i wskazówek medycznych,\
      \ których znajomość jest niezbędna duchownemu.\nNajstarsze polskie podręczniki\
      \ medycyny pastoralnej to:\n- wydana we Lwowie w r. 1900 książka „Medycyna pasterska”\
      \ Józefa Sebastiana Pelczara, polskiego świętego, w pierwszym wydaniu podpisana\
      \ pseudonimem „Stary Duszpasterz”, \n- wydana w 1905 r. w Gnieźnie „Medycyna\
      \ pastoralna” dr. Juliana Czarneckiego, która m.in. polecała chrzczenie obumierających\
      \ płodów przez wstrzykiwanie wody święconej do macicy kobietyJulian Czarnecki\
      \ „Medycyna pastoralna”, s. 236: Za pomocą strzykawki możemy zawsze przez mały\
      \ otwór, sztucznie zrobiony w błonach płodowych, polać wodą część ciała dziecka.\
      \ Przy tej sposobności zaleca się wprowadzenie strzykawki przy pomocy palca,\
      \ ażeby się tym sposobem przekonać, czy doprowadzona woda rzeczywiście w bezpośrednią\
      \ styczność przychodzi z odnośną częścią ciała dziecięcego. oraz tłumaczyła\
      \ schizmy kościelne i pozachrześcijańskie nurty filozoficzne chorobami umysłowymiibidem,\
      \ s. 370: W pierwszych dwóch wiekach chrześciaństwa panowały wzburzenia umysłowe,\
      \ których skutkiem tworzyły sią rozmaite sekty tak religijne jak filozoficzne,\
      \ n.p. sekty Manicheuszów, Gnostyków, nowej szkoły Platona itp.."
