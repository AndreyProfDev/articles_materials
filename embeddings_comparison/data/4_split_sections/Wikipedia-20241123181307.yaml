- sections:
  - content: "Medonet – ogólnopolski portal poświęcony zdrowiu, medycynie i zdrowemu\
      \ stylowi życia, którego założeniem jest edukowanie czytelników w kwestiach\
      \ zdrowotnych w oparciu o badania naukowe i wypowiedzi lekarzy oraz ekspertów\
      \ \nNajpopularniejszy serwis w Polsce w kategorii „Zdrowie i medycyna” – w lutym\
      \ 2023 serwis odwiedziło prawie 11 mln realnych użytkowników Należy do największych\
      \ na świecie komercyjnych serwisów zdrowotnych. Najbardziej opiniotwórczy portal\
      \ wśród mediów o tematyce zdrowotnej w Polsce według raportu Instytutu Monitorowania\
      \ Mediów.\nRedakcja portalu promuje zdrowy styl życia i profilaktykę medyczną,\
      \ inicjując i włączając się w akcje społeczne. Flagowym projektem serwisu jest\
      \ Narodowy Test Zdrowia Polaków, realizowany od 2020, którego głównym elementem\
      \ jest badanie mające na celu sprawdzić, jak bardzo Polacy dbają o swoje zdrowie.\n\
      Redaktorką naczelną portalu jest dr Anna Zimny Zając. Właścicielem portalu jest\
      \ Ringier Axel Springer Polska. Serwis korzysta z e-platformy wydawniczej Ring\
      \ Publishing."
    title: Main
  - content: "Misją redakcji jest wspieranie długiego i zdrowego życia Polaków poprzez\
      \ szerzenie wiedzy opartej na badaniach naukowych i dostarczanie najświeższych\
      \ informacji z zakresu medycyny i szeroko pojętego zdrowego stylu życia. W tym\
      \ celu portal: prezentuje porady od lekarzy i wiarygodnych ekspertów zdrowia,\
      \ opisuje największe współczesne problemy zdrowotne, uświadamia, jak ważna jest\
      \ profilaktyka zachorowań oraz daje rozwiązania technologiczne pozwalające na\
      \ monitorowanie swojego stanu zdrowia i ułatwiające dostęp do lekarzy i placówek\
      \ medycznych. Treści przygotowywane są przez dziennikarzy medycznych z długoletnim\
      \ doświadczeniem (zrzeszonych w Stowarzyszeniu Dziennikarze dla Zdrowia), lekarzy\
      \ oraz ekspertów medycznych. Serwis współpracuje z Polskimi Towarzystwami Medycznymi,\
      \ fundacjami oraz organizacjami pacjenckimi. \nZgodnie ze swoją misją dostarczania\
      \ treści najwyższej jakości, portal wprowadził oznaczenie „Sprawdzona treść”,\
      \ które wskazuje, że dany artykuł został napisany przez dziennikarza medycznego\
      \ i zweryfikowany przez lekarza lub napisany bezpośrednio przez lekarza. Stowarzyszenie\
      \ Dziennikarze dla Zdrowia nagrodziło za te działania redakcję portalu honorowym\
      \ tytułem Wielkiego Edukatora."
    title: Misja Medonetu
  - content: "Portal przedstawia informacje dotyczące chorób, ich profilaktyki, leczenia,\
      \ porad lekarzy, bazy placówek medycznych, uzależnień, kalkulatory oraz leksykony\
      \ chorób, badań i leków.\nMedonet współpracuje na wyłączność z serwisem telemedycznym\
      \ haloDoctor.pl, który pozwala uzyskać konsultację lekarską, otrzymać e-receptę\
      \ lub zwolnienie lekarskie, serwisem Kliniki.pl, dzięki któremu znajdziemy dostępny\
      \ termin i umówimy się na zabieg lub operację. W portalu znajdziemy także narzędzia\
      \ takie jak \"Symptom Checker\", który służy do wstępnego rozpoznawania dolegliwości.\
      \ \nSerwis opiera swoje artykuły na zasadzie Explanatory journalism. Ponadto\
      \ organizuje akcje prozdrowotne: Narodowy Test Zdrowia Polaków 2020, Narodowy\
      \ Test Zdrowia Polaków 2021, Uwaga! Cichy złodziej kości czy Podziel się życiem.\
      \ Testy zamieszczone w Medonecie dotyczą między innymi depresji i nerwicy. W\
      \ dziale wideo znajdują się programy: Sprawdzam, Gość Medonetu, Czas na zdrowie,\
      \ Gorący dyżur oraz we współpracy z Onet – Zdrowie Rano. Od lipca 2021 r. redakcja\
      \ Medonet.pl współpracuje przy wydawaniu kwartalnika \"Newsweek Zdrowie\"."
    title: Zawartość serwisu
  - content: 'Redakcja dba o to, aby jak największa liczba treści była tworzona lub
      weryfikowana przez osoby o wykształceniu medycznym lub specjalistów z dziedziny
      zdrowia. Proces tworzenia treści opiera się na Evidence Based Medicine oraz
      wytycznych towarzystw medycznych i naukowych. Wśród partnerów portalu znajdują
      się m.in.: Collegium Medicum Uniwersytetu Jagiellońskiego, Polskie Towarzystwo
      Kardiologiczne, Polskie Towarzystwo Diabetologiczne, Polskie Towarzystwo Onkologiczne,
      Polskie Towarzystwo Stomatologiczne oraz Polskie Towarzystwo Ginekologów i Położników.
      Serwis otrzymał certyfikat HONcode. Jest on przyznawany przez organizację Health
      On the Net dla serwisów zdrowotnych na całym świecie, które przekazują sprawdzone
      i wiarygodne informacje.

      Wysoką jakość publikowanych w portalu treści oraz obiektywną i transparentną
      informację medyczną dla użytkowników Internetu potwierdza certyfikat @TRUST,
      który został przyznany Medonet w 2023 przez American Accreditation Commission
      International (AACI), jedną z najbardziej doświadczonych na świecie organizacji
      w zakresie świadczenia usług akredytacji organizacji opieki zdrowotnej i certyfikacji
      klinicznej.'
    title: Partnerzy portalu
  - content: 'Hasło przewodnie serwisu to „Zdrowie w Twoich rękach”. Portal regularnie
      przeprowadza największe w polskim internecie badanie zwiększające świadomość
      na temat stanu zdrowia Polaków – Narodowy Test Zdrowia Polaków. Wyniki badań
      Medonetu publikowane są międzynarodowych punktowanych czasopismach, takich jak
      "Vaccines", "Nutrients" i "International Journal of Environmental Research and
      Public Health".

      W 2022 i 2023 zorganizował także Narodowy Test Żywienia Polaków, a w 2023 także
      Narodowy Test Zdrowej Skóry. Redakcja prowadzi też (we współpracy z Onet i UN
      Global Compact Network Poland) kampanię społeczną „Kochaj siebie. Dla zdrowia”,
      w której zachęca Polaków do zdrowych nawyków.'
