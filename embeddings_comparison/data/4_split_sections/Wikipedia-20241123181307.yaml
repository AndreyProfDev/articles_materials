  - content: "Odpady medyczne (ang. biomedical waste) – odpady powstałe wraz z udzielaniem\
      \ świadczeń zdrowotnych oraz prowadzeniem badań i doświadczeń naukowych w zakresie\
      \ medycyny. Odpady medyczne są traktowane jako materiał zakaźny. \nZakazane\
      \ jest składowanie tego typu odpadów w miejscu innym, niż to, w którym powstają.\
      \ Lekarz wrzuca je do czerwonych pojemników z napisem, że zawierają odpady medyczne.\
      \ Obowiązkiem placówki medycznej jest przekazać je do utylizacji firmie wyposażonej\
      \ w specjalne spalarnieUstawa z dnia 14 grudnia 2012 r. o odpadach ()..\nW Polsce\
      \ do odpadów medycznych zalicza się:\n- zużyte narzędzia chirurgiczne lub ich\
      \ zużyte resztki\n- części ciała, organy oraz pojemniki na krew\n- zużyte opatrunki\n\
      - substancje chemiczne uznane za niebezpieczne\n- inne przedmioty lub substancje,\
      \ które miały kontakt z np. krwią"
