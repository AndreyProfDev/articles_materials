  - content: 'Turystyka medyczna – turystyka połączona z leczeniem; rozumiana jest
      jako świadoma działalność człowieka, w której podróżny (turysta medyczny) ma
      na celu uzyskanie szeroko pojmowanej opieki zdrowotnej – zarówno we własnym
      kraju, jak i za granicą – polegającej przede wszystkim na zachowaniu (pozyskaniu
      lepszego) stanu zdrowia, i/lub estetycznego wyglądu własnego ciała, połączonego
      z wypoczynkiem, regeneracją sił fizycznych i psychicznych, zwiedzaniem atrakcji
      i walorów turystycznych oraz rozrywkąLubowiecki-Vikuk AP. Turystyka medyczna
      jako produkt eksportowy polskiej gospodarki. Ekonomiczne Problemy Usług 2011;79:125-36.Lubowiecki-Vikuk
      AP. Turystyka medyczna przejawem współczesnych trendów i tendencji w turystyce.
      Ekonomiczne Problemy Usług 2012;84:553-68..

      Turystyka medyczna tuż obok turystyki uzdrowiskowej i turystyki spa i wellness
      jest elementem turystyki zdrowotnej. Do Polski przyjeżdżają pacjenci z krajów
      wysoko rozwiniętych gospodarczo Europy, szczególnie Wielkiej Brytanii, Niemiec,
      Szwecji, Danii oraz NorwegiiLubowiecki-Vikuk AP, Rab-Przybyłowicz J. Wybrane
      aspekty funkcjonowania rynku turystyki medycznej w Polsce. Folia Turistica 2015;34..'
    title: Main
  - content: 'Głównymi determinantami uczestnictwa w turystyce medycznej są:

      - brak ubezpieczenia pokrywającego koszty leczenia we własnym kraju,

      - chęć zaoszczędzenia pieniędzy – dzięki skorzystaniu z identycznej, tańszej
      usługi medycznej w innym kraju,

      - większą dostępność informacji (Internet),

      - naśladowanie innych grup społecznych (rodziny, przyjaciół),

      - wykreowanie przez media, mody na poprawianie własnej urody, które wychodząc
      naprzeciw społecznemu zapotrzebowaniu na tego rodzaju tematykę za­częły dostarczać
      coraz więcej informacji z tej dziedziny,

      - rekomendacja znajomych,

      - potrzeba zmiany wizerunku połączona z potrzebą intymności (niechęć do dzielenia
      się informacją o zabiegu czy operacji z innymi; osoba publiczna, powszechnie
      znana chce uniknąć rozgłosu),

      - brak legalizacji niektórych zabiegów medycznych we własnym kraju (aborcja,
      In vitro).'
    title: Główne determinanty zjawiska
  - content: "Poza granicami kraju zamieszkania konsumenci poszukują głównie opieki\
      \ specjalistycznej: onkologicznej, skomplikowanych schorzeń sercowo naczyniowych,\
      \ wegetatywnych oraz chorób rzadkich i genetycznych. Jednak dla większości turystów\
      \ medycznych faktycznym powodem podjęcia tego rodzaju decyzji jest różnica w\
      \ kosztach usług medycznych między państwem, w którym danym konsument zamieszkuje\
      \ a kosztem zabiegu w państwie, do którego konsument się udaje.J. Rab-Przybyłowicz,\
      \ 2012, Determinanty popytowe wpływające na rozwój turystyki medycznej, Zeszyty\
      \ Naukowe Uniwersytetu Szczecińskiego nr 698, „Ekonomiczne Problemy Usług” 2012,\
      \ nr 83: 207-221.J. Rab-Przybyłowicz, 2010, Tworzenie produktu dla turystyki\
      \ medycznej w Szczecinie, Zeszyty Naukowe Uniwersytetu Szczecińskiego nr 591,\
      \ „Ekonomiczne Problemy Usług” 2010, nr 53: 695-706.. \nIndie i Tajlandia przodują\
      \ w światowej turystyce medycznej."
