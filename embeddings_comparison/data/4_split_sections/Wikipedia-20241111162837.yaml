  - content: "Health-Related Fitness – sprawność ukierunkowana na zdrowie.\nCelem\
      \ sprawności fizycznej jest pozytywne zdrowie fizyczne, które warunkuje niskie\
      \ ryzyko wystąpienia problemów zdrowotnych. Osiągnięcia zaś mają na celu zdolność\
      \ angażowania się w codzienne zadania z adekwatną energią oraz satysfakcjonujące\
      \ uczestnictwo w wybranych sportachHowley E. T., Franks B. D. (1997): Health\
      \ Fitness Instructors. Handbook. Champaign, Ill.: Human Kinetics.\nWedług autorów\
      \ sprawność fizyczna obejmuje:\nfunkcje krążeniowo-oddechowe, względną szczupłość\
      \ ciała, siłę mięśniową, wytrzymałość i gibkość.\nH-RF odnosi się do tych komponentów\
      \ sprawności, które są efektem korzystnego i niekorzystnego wpływu zwykłej aktywności\
      \ fizycznej oraz które mają związek z poziomem stanu zdrowia.\nKomponenty te\
      \ są określone:\n- zdolnością do podejmowania codziennej aktywności z wigorem\
      \ i żwawo,\n- takim stanem cech i zdolności, który wskazuje na niskie ryzyko\
      \ przedwczesnego rozwoju chorób i osłabienia sił w wyniku małej aktywności2.\
      \ Bouchard C., Shephard R. J. (1994): Physical activity, fitness and health:\
      \ the model and key concepts. [In:] Physical activity, fitness and health. Red.\
      \ C. Bouchard, R. J. Shephard, T. Stephens. Champaign, Ill.: Human Kinetics\
      \ Publishers, 77-88..\nDefinicja sprawności w ramach koncepcji H-RF obejmuje\
      \ następujące komponenty3.\tSkinner J. S., Oja P. (1994): Laboratory and field\
      \ tests for assessing health-related fitness. [In:] Physical activity, fitness\
      \ and health. Red. C. Bouchard, R. J. Shephard, T. Stephens. Champaign, Ill.:\
      \ Human Kinetics Publishers, 160-179.:\n1. Sprawność morfologiczna\n- BMI (Body\
      \ Mass Index),\n- dystrybucja tłuszczu,\n- mineralna gęstość kości\n2. Sprawność\
      \ mięśniowo-szkieletowa\n- siła i wytrzymałość mięśni ramion, nóg i tułowia,\n\
      - gibkość\n3. Sprawność motoryczna\n- kontrola postawy ciała jako kombinacja\
      \ równowagi, koordynacji, kontroli psychicznej i szybkości neuromięśniowej\n\
      4. Sprawność krążeniowo-oddechowa\n- submaksymalna zdolność wysiłkowa i wytrzymałość,\n\
      - system dostarczania tlenu,\n- resynteza ATP,\n- procesy termoregulacyjne,\n\
      - VO<sub>2</sub>max (maksymalny minutowy pobór tlenu)\n5. Sprawność przemian\
      \ metabolicznych\n- działanie hormonów (np. insulina),\n- gospodarka węglowodanowa\
      \ (krew, tkanki),\n- metabolizm lipidowy\nZ uwagi na brak możliwości dokładnego\
      \ przetłumaczenia z języka angielskiego terminu Health-Realted Fitness, zdecydowano\
      \ pozostawić go w formie niezmienionejOsiński W. (2003): Antropomotoryka. Podręczniki,\
      \ 49, Poznań, AWF.."
