- sections:
  - content: "Sport rekreacyjny, masowy – stanowi formę czynnego wypoczynku z zachowaniem\
      \ współzawodnictwa jako czynnika motywującego.\nJego zadaniem jest m.in. odprężenie\
      \ po pracy, regeneracja sił, utrzymanie sprawności fizycznej oraz dobrego stanu\
      \ zdrowia. Powoduje m.in. wzrost tolerancji wysiłku fizycznego oraz zwiększenie\
      \ siły mięśniowej stabilizującej stawy. Jest jednym z czynników przyczyniających\
      \ się do zapobiegania chorobom cywilizacyjnym. \nZalecany jest m.in. przy profilaktyce,\
      \ leczeniu i rehabilitacji chorób układu krążenia i narządu ruchu. Jako rodzaj\
      \ rehabilitacji można tu wymienić sport niepełnosprawnych. Znaczenie ma także\
      \ sport dzieci i młodzieży, który stanowi element wychowania oraz zapobiega\
      \ chorobom.\nDo dyscyplin tego sportu można zaliczyć m.in.: \n- gimnastykę rekreacyjną\
      \ (m.in. różne formy gimnastyczno-taneczne, gimnastyka aerobowa);\n- pływanie\
      \ (m.in. nurkowanie rekreacyjne);\n- bieg i chód kondycyjny;\n- sporty indywidualne\
      \ i zespołowe (m.in. tenis, tenis stołowy, softball, korfball, ringo, frisbee,\
      \ badminton, golf, kręgle, unihokej, wspinaczka sportowa); \n- zespołowe gry\
      \ sportowe (m.in. siatkówka, koszykówka, piłka nożna);\n- sporty wodne (m.in.\
      \ żeglarstwo, sporty motorowodne, kajakarstwo, surfing, windsurfing)\n- sporty\
      \ zimowe (m.in. narciarstwo zjazdowe i biegowe, saneczkarstwo, łyżwiarstwo,\
      \ curling);\n- lekkoatletykę (biegi, skoki, rzuty); \n- sporty walki (judo,\
      \ jujutsu, karate, taekwondo, aikido, kendo); \n- aerobik, aqua-aerobic, body\
      \ ballet, callanetics, fitness, joga, taijiquan;\n- jazdę konną;\n- gry terenowe\
      \ i wieloboje."
