    title: Dzieje filozofii
  - content: 'Najpopularniejszy sposób periodyzacji historii filozofii zachodniej
      opiera się na ogólnym podziale zachodniej historii na starożytność, średniowiecze
      i nowożytność. W historii filozofii zastosował go Wilhelm Gottlieb Tennemann,
      w oparciu o wcześniejszą periodyzację Johanna Jakoba Bruckera. Zgodnie z nim
      dzieje filozofii dzielą się na trzy etapy:

      - starożytny, obejmujący filozofię starożytnej Grecji i Rzymu;

      - średniowieczny;

      - nowożytny.

      Jest on luźno stosowany w niektórych pracach, jednak był krytykowany jako zbyt
      schematyczny i ogólny. Przez to część historyków nie wyróżnia tak szerokich
      epok, dzieląc dzieje filozofii na mniejsze jednostki chronologiczne i geograficzne,
      . Okres patrystyczny i renesans są często uważane za okresy przejściowe.

      Niektórzy polscy historycy filozofii przyjmują inną konwencję; . Etap nowożytny
      uznają za zamknięty w I połowie XIX wieku; datą graniczną jest często śmierć
      Hegla w 1831 roku. Poźniejszą filozofię nazywają współczesną.'
    title: Periodyzacja filozofii zachodniej
  - content: 'Istnieją nagrody przyznawane głównie za twórczość filozoficzną jak:

      - Nagroda Kioto w dziedzinie filozofii i etyki;

      - Nagroda Schocka w dziedzinie filozofii i logiki;

      - Nagroda Mistrza Eckharta;

      - Nagroda im. księdza Józefa Tischnera za pisarstwo religijne lub filozoficzne.

      Filozofowie bywają też wśród laureatów nagród:

      - literackich jak jedna dziedzin z Nagrody Nobla;

      - w dziedzinie nauk humanistycznych jak Nagroda Klugego czy jedna z kategorii
      Nagrody Fundacji na rzecz Nauki Polskiej (FNP);

      - za działalność umysłowo-duchową: Nagroda Templetona;

      - za ogólną działalność społeczno-kulturalną: Nagroda Sonninga i Nagroda Erazma.

      Zdarzają się laureaci więcej niż jednej z nich:

      - Jürgen Habermas – nagrody Kioto, Sonninga, Erazma i Klugego;

      - Charles Taylor – nagrody Kioto, Klugego i Templetona;

      - Bertrand Russell – nobel literacki i Nagroda Sonninga;

      - Karl Popper – nagrody Kioto i Sonninga;

      - Stefan Swieżawski – nagrody FNP i Tischnera;

      - Willard Van Orman Quine – nagrody Kioto i Schocka;

      - Claude Lévi-Strauss – nagrody Mistrza Eckharta i Erazma;

      - Carl Friedrich von Weizsäcker – nagrody Erazma i Templetona;

      - Leszek Kołakowski – nagrody Erazma i Klugego;

      - Jerzy Szacki – nagrody FNP i Tischnera;

      - Michał Heller – nagrody Templetona i Tischnera;

      - Tomáš Halík – nagrody Templetona i Tischnera.'
