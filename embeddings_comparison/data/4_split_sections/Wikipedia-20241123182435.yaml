  - content: Erazmianie – koło artystyczno-literackie w XVI w. odwołujące się do poglądów
      humanistycznych Erazma z RotterdamuErazm z Rotterdamu, Pochwała Głupoty, 1509
      r; silny wpływ na ich postawy wywarła także idea irenizmu, koncepcji teologicznej
      dążącej do zniesienia rozbicia wyznaniowego poprzez ustępstwa doktrynalne. Nazwa
      pochodzi od imienia niderlandzkiego filologa, reformatora - Erazma z Rotterdamu.
    title: Main
  - content: Tworzyli oni jedną z kilku grup odpowiedzialnych za propagowanie idei
      reformacyjnych. Jako członkowie elit intelektualnych recypowali zarówno traktaty
      reformacyjne, jak i polemiki antyreformacyjne, przyswajając ich treść i propagując
      argumenty. Jako członkowie elit politycznych współdecydowali także o pierwszych
      oficjalnych reakcjach na reformację, uczestnicząc w podejmowaniu strategicznych
      decyzji i przygotowując podstawowe dokumenty. Ostateczny kształt relacji między
      nowożytnym państwem a Kościołami protestanckimi został wytworzony także pod
      ich wpływem. Innymi słowy, erazmianie nie tylko przeżywali wydarzenia reformacyjne
      we własnym kręgu, lecz oddziaływali również na przebieg procesów obejmujących
      całe społeczeństwo, będąc zarazem ich uczestnikami.
    title: Twórczość
  - content: Erazmianie odcisnęli bardzo silne piętno na polityce prowadzonej przez
      dwór Zygmunta Starego. Na politykę tę wpłynęła w ogromnym stopniu decyzja o
      oficjalnym przyjęciu luteranizmu przez wielkiego mistrza zakonu krzyżackiego
      Albrechta Hohenzollerna, kryzys polityczny na Węgrzech oraz przemiany polityczne
      wywołane przez reformację w RzeszyJ.T. Dybowski, Hołd Pruski, 1964. Polscy erazmianie
      brali udział nie tylko w przygotowaniu konwersji Albrechta, lecz także w licznych
      misjach dyplomatycznych w obronie pruskiego księcia. Równocześnie idee reformacyjne
      trafiały do szlachty, wśród której znajdowały podatny grunt ze względu na jej
      silny antyklerykalizm oraz konflikty stanowe wokół kwestii podatkowych i jurysdykcji.
