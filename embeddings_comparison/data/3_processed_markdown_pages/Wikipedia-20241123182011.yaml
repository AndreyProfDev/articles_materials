- sections:
  - content: 'Sprezzatura – naturalność, swoista nonszalancja dzieła sztuki. Termin
      stosowany w epoce manieryzmu i baroku, często zamiennie z pojęciem gracji.

      == Muzyka ==

      W muzyce termin oznaczający swobodę 1) w traktowaniu zapisanego rytmu przy wykonywaniu
      utworu 2) w stosowaniu dysonansów przejściowych podczas komponowania utworu.
      Słowo sprezzatura było używane już w XV wieku. Pierwszym kompozytorem, który
      na zjawisko położył nacisk w swoich komentarzach do utworów był Giulio Caccini.
      Nigdy jednak sprezzatura nie została ściśle zdefiniowana, określona. Dla muzyków,
      kompozytorów i teoretyków miała szersze lub węższe znaczenie. Przede wszystkim
      jako sprezzaturę rozumiano troskę o ekspresję linii melodycznejE. Careri Le
      techniche vocali del canto italiano d’arte tra il XVI e il XVII secolo. „Nuova
      Rivista Musicale Italiana” 1984 nr 3 s. 359–375., jej lekkość, wrażenie naturalności
      i wykonywania jakby bez wysiłku, od niechcenia. Termin wykorzystał jako pojęcie
      estetyczne Baltassare Castiglione w 1528: przeciwstawienie się nadmiernej poprawności
      potrzebne jest w muzyce, w której jest bardzo wielkim błędem zrobienie jednego
      po drugim dwóch konsonansów doskonałych, czego nie znosi sam nasz zmysł słuchu.
      Szczególne znaczenie sprezzatura nabrała w kręgu Cameraty Florenckiej. Dysonansowość,
      swoboda wykonawcza była wpisana w XVII-wieczną seconda pratica i system barokowej
      retoryki muzycznej.

      == Moda ==

      Termin ten używany jest także w modzie. Oznacza naturalność i nonszalancję w
      noszeniu klasycznych ubrań. Może oznaczać też świadome łamanie niektórych zasad
      męskiej elegancji. Przykładem ubierania się na co dzień według sprezzatury był
      włoski przemysłowiec Gianni Agnelli.

      == Przypisy ==

      == Literatura ==

      - Zygmunt M. Szweykowski Sprezzatura i gracja – klucz do estetyki liryki wokalnej
      wczesnego baroku, „Muzyka” (1987) nr 1, s. 3–20

      - M. Bukofzer Muzyka w epoce baroku. Od Monteverdiego do Bacha, Warszawa 1970,
      s. 48

      - Przekład fragmentów B.Castilgione dotyczących muzyki: https://web.archive.org/web/20170203134745/http://demusica.pl/?Pismo_Diagonali:Nr_2%2F2013%26nbsp%3B'
    title: Main
  title: Sprezzatura
- sections:
  - content: "Instytut Propagandy Sztuki (IPS) – instytucja kultury działająca w latach\
      \ 1930–1939 w Warszawie, utworzona z inicjatywy artystów i historyków sztuki\
      \ w celu propagowania polskiej sztuki nowoczesnej.\n \n== Historia i profil\
      \ ==\nPierwsza siedziba IPS mieściła się w kamienicy Baryczków na Rynku Starego\
      \ Miasta. W grudniu 1931 otwarto nowo wybudowany pawilon Instytutu przy ul.\
      \ Królewskiej 13.\nInstytut stanowił w momencie powołania opozycję wobec konserwatywnego\
      \ Towarzystwa Zachęty Sztuk Pięknych. Profil IPS zmienił się nieco w drugiej\
      \ połowie lat 30., kiedy obok działalności czysto wystawienniczej (organizacja\
      \ tzw. Salonów IPS) zaczęto prowadzić również prace o charakterze naukowym,\
      \ popularyzatorskim oraz dokumentacyjnym. Współzałożycielami i kolejnymi kierownikami\
      \ Rady IPS byli: Władysław Skoczylas (1930), Wojciech Jastrzębowski (1931),\
      \ Karol Stryjeński (1932), Bohdan Pniewski (1934–1935) i Juliusz Starzyński\
      \ (1935–1939). Współtwórcami IPS byli również historyk sztuki i muzealnik Mieczysław\
      \ Treter oraz popularyzator i krytyk sztuki Jerzy Warchałowski.\nInstytut pełnił\
      \ również w przedwojennej Warszawie funkcję towarzyską. W pawilonie wystawienniczym\
      \ IPS, z inicjatywy Stanisława Rzeckiego, utworzono kawiarnię, która stała się\
      \ z czasem jednym z bardziej popularnych przez artystów – malarzy i poetów –\
      \ lokali warszawskich. Od 1937 IPS wydawał kwartalnik „Nike”, redagowany przez\
      \ Juliusza Starzyńskiego. Opracowanie graficzne czasopisma było dziełem Stanisława\
      \ Ostoi-Chrostowskiego.\nDo tradycji naukowej IPS odwołuje się Instytut Sztuki\
      \ Polskiej Akademii Nauk. Obiema tymi placówkami kierował Juliusz Starzyński.\n\
      == Budynek ==\nObszerny budynek parterowy został zaprojektowany przez Karola\
      \ Stryjeńskiego jako siedziba i pawilon wystawowy dla Instytutu Propagandy Sztuki.\
      \ Do użytku oddano go w grudniu 1931. W gmachu mieściła się także kawiarnia\
      \ oraz redakcja tygodnika „Wiadomości Literackie”. \nW 1935 fragment budynku\
      \ ogarnął pożar. Prawdopodobnie jego skutkiem była rezygnacja z części witryn\
      \ po prawej stronie wejścia głównego i przebudowa ich w przeciętnej wielkości\
      \ okna. W okresie okupacji niemieckiej pawilon pełnił funkcję gospody dla żołnierzy\
      \ wrogich armii. Uniknął zniszczenia w powstaniu warszawskim i podczas późniejszego\
      \ wyburzania Warszawy przez Niemców. Został jedynie nieznacznie uszkodzony przez\
      \ pociski. Ucierpiał także fragment budynku, sąsiadujący z Pałacem Kronenberga.\
      \ Latem 1946 rozpoczął się remont gmachu z przeznaczeniem na Teatr Muzyczny\
      \ Domu Żołnierza. Prace zakończyły się w lutym 1947. W 1955 pawilon stał się\
      \ siedzibą Teatru Żydowskiego, który mieścił się w nim do 1970. Niedługo potem\
      \ zaczęły się prace rozbiórkowe pod najbardziej luksusowy wówczas hotel Warszawy\
      \ – „Victorię”.\n== Przypisy ==\n== Bibliografia ==\n- Instytut Sztuki\n- Agnieszka\
      \ Chmielewska, Otworzyły się nowe możliwości... – Idee środowiska przedwojennej\
      \ ASP w Warszawie wobec propozycji socrealizmu, rcin.org.pl"
