- sections:
  - content: 'Diorama (z gr. dioráō „widzę na przestrzał”) w malarstwie – rodzaj obrazu
      w głębokim obramowaniu, gdzie pewne jego części są nieprzezroczyste, malowane
      na płótnie, a inne przezroczyste są malowane na cienkim materiale techniką laserunkową.
      Oświetlany z dowolnej strony w ciemnym pomieszczeniu, pozwala na uzyskanie efektów
      plastycznych w przestrzeni (przy użyciu ruchomych źródeł światła może dawać
      wrażenie ruchu), czasem uzupełniony sztafażem.

      Twórcą dioramy był Louis Jacques Daguerre. W 1822 otworzył w Paryżu salę widowiskową
      w której ukazywał widok wybuchu Wezuwiusza, sceny biblijnego potopu i inne.

      Dioramą nazywany jest także rodzaj panoramy, obrazu malowanego na przezroczystej
      tkaninie, z obu stron jednocześnie, co przy odpowiednim oświetleniu daje wrażenie
      pełnoplastyczności przedmiotów.

      == Modelarstwo ==

      Nieco inną techniką jest rozpowszechniony w XX wieku rodzaj makiety modelarskiej
      wykonywanej różnymi technikami plastycznymi i modelarskimi, przedstawiającej
      najczęściej wydarzenia historyczne, sceny przyrodnicze lub modele urbanistyczne.
      Ze względu na trójwymiarowość jest atrakcyjnym nośnikiem treści edukacyjnych,
      przez co chętnie wykorzystywana w ekspozycjach muzealnych.

      Niektóre firmy modelarskie oferują zestawy złożone z kilku modeli, akcesoriów
      i plastikowej makiety z odwzorowanymi drogami, ukształtowaniem terenu. Takie
      dioramy najczęściej zawierają kilka figurek, jeden lub dwa pojazdy, a jako akcesoria
      służą beczki, barykady, słupy telegraficzne, drogowskazy, worki z piaskiem itp.

      == Zobacz też ==

      - winieta (modelarstwo)

      == Bibliografia ==

      - Henryk Latoś: 1000 słów o fotografii, Warszawa, Wydawnictwo Ministerstwa Obrony
      Narodowej, 1979 i późniejsze wydania

      - Słownik terminologiczny sztuk pięknych, pod red. Stefana Kozakiewicza, PWN,
      2002'
    title: Main
  title: Diorama
- sections:
  - content: 'Medalion – wypreparowane trofeum łowieckie, rodzaj zwierzęcego popiersia.
      Stanowi go wypreparowana głowa i szyja zwierzęcia, naciągnięta na specjalny,
      naturalistyczny model tych części ciała, umocowany najczęściej na ozdobnej drewnianej
      tarczy.

      Medalion wykonywany jest na potrzeby ekspozycji muzealnych, wystawowych, często
      jest ozdobą izby myśliwskiej, pamiątka z udanych łowów.'
    title: Main
  title: Medalion (łowiectwo)
- sections:
  - content: 'Interaktywność to własność dzieła sztuki, która sprawia, że jego odbiorca
      może podjąć działania, które wpłyną na kształt końcowy dzieła. Stanowi jedną
      z najważniejszych cech współczesnej kultury.

      Interaktywność w sztuce jest dialogiem odbiorcy (interaktora) i dzieła sztuki
      w czasie rzeczywistym, komunikacją w formie wzajemnego oddziaływania. Sprawia,
      że dzieło jest inne w każdym przypadku aktywności odbiorcy (interaktora). Następuje
      zmiana elementów składających się na komunikat artystyczny. Twórczość artysty
      jest tylko kontekstem dzieła, ono samo zaś powstaje w drugim etapie – interakcji
      z odbiorcą.

      Dzieła interaktywne pozostają pod wpływem paradygmatów modernistycznego i postmodernistycznego.
      Wpływają one na kształt końcowy dzieła – w zależności od tego który mocniej
      oddziałuje, powstaje dzieło jest skierowane bardziej w stronę ekspresji artysty
      jako autora, bądź są skierowane na aktywność odbiorcy.

      == Interaktywne dzieła multimedialne ==

      W mediach interaktywnych nastąpiła zmiana lub przemieszanie ról i kompetencji
      artysty i odbiorcy. Artysta jako autor nie jest już jedynym twórcą dzieła i
      jego sensu, lecz tworzy się ono razem z procesem interakcji z odbiorcą. Zadaniem
      artysty jest w tej sytuacji stworzenie dzieła sztuki, czyli wytworu aktywności
      twórczej artysty. W innym rozumieniu dzieło sztuki jest strukturą hipertekstu,
      czyli wielopoziomowej, nielinearnej struktury przeciwnej normalnemu, linearnemu
      tekstowi. Oprócz hipertekstu dzieło sztuki tworzy też stanowiący podłoże jego
      struktury materiał: obrazy, dźwięki, tekst. Dzieło sztuki jest układem-kontekstem,
      w którym odbiorca (interaktor) tworzy przedmiot swojej percepcji i jego sens.
      Struktura stworzonego przedmiotu zależy od aktywności twórczej i wyobraźni odbiorcy,
      jak również znaczenia, jakie ten przedmiot generuje.

      Chodzi tu przede wszystkim o konceptualizm, sztuki performatywne, sztukę instalacji.
      Są one ideowymi poprzednikami intermedialnej sztuki interaktywnej i jej kultury.
      Sztuka intermedialna i interaktywna powstawała równolegle do ich rozwoju. Sztuka
      konceptualna i multimedialna często łączyły się ze sobą pokazując, że są dla
      siebie nieodzowne i tworzyły się dzięki obustronnym oddziaływaniom.

      == Przypisy ==

      == Linki zewnętrzne ==

      - Wydział Filologiczny Uniwersytetu Śląskiego: Piotr Zawojski, O sztuce interaktywnej'
    title: Main
  title: Interaktywność w sztuce
