- sections:
  - content: "Mecenat − opieka wpływowych i bogatych miłośników, amatorów literatury\
      \ i sztuki nad twórcami. Na ogół łączona z finansowym wspieraniem tych osób\
      \ i ich poczynań. \nW potocznym użyciu mecenasem jest nazywany protektor artystów,\
      \ pisarzy i uczonych, osoba dbająca o rozwój sztuki, literatury, naukiSłownik\
      \ wyrazów obcych PWN. Warszawa: Państwowe Wydawnictwo Naukowe, 1991, s. 540..\
      \ Określenie pochodzi od nazwiska Gajusza Cilniusza Mecenasa, opiekuna artystów\
      \ i poetów, przyjaciela i doradcy Oktawiana AugustaSłownik kultury antycznej.\
      \ Grecja – Rzym (red. L. Winniczuk). Warszawa: Wiedza Powszechna, 1988, s. 280..\n\
      Dawny mecenat dworski, królewski, magnacki, kościelny (szczególnie papieski)\
      \ zastąpiły w czasach współczesnych formy opieki sprawowanej przez wyspecjalizowane\
      \ instytucje społeczne, np. fundacje państwowe i prywatne. Wielkim mecenasem\
      \ sztuki w Polsce był Stanisław August Poniatowski. Finansował liczne przedsięwzięcia\
      \ artystyczne, wielokrotnie zaciągając w tym celu pożyczki. Wiele osób zarzucało\
      \ mu (jako panującemu) trwonienie pieniędzy na sztukę, gdy brakowało funduszy\
      \ na wojsko oraz inne potrzeby państwa. W ostatnich czasach mecenasem artystów\
      \ jest zazwyczaj państwo, co wywołuje rozmaite dyskusje na temat obustronnych\
      \ uprawnieńCzy państwo powinno utrzymywać artystę? https://www.youtube.com/watch?v=Z_o3TeieP3Y.\n\
      == Przypisy ==\n== Bibliografia ==\n- Popularna Encyklopedia Powszechna. T.\
      \ 10. Kraków: Oficyna Wydawnicza Fogra, 1995, ("
