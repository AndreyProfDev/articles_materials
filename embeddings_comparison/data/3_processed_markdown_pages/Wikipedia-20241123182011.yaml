- sections:
  - content: 'dr hab. Anna Szyjkowska-Piotrowska - teoretyczka sztuki, filozofka kultury
      i lingwistka, autorka publikacji naukowych i książek o tematyce artystycznej
      i filozoficznej. Jest profesorem uczelni na Akademii Sztuk Pięknych w Warszawie,
      gdzie pracuje w Katedrze Teorii Designu na Wydziale Wzornictwa. Prowadzi także
      badania naukowe jako współpracowniczka Université Paris 1 Panthéon-Sorbonne
      w Instytucie ACTE (Estetyka i Krytyczne Teorie Kultury) oraz jako adiunkt na
      Uniwersytecie Muzycznym Fryderyka Chopina.

      == Praca naukowa ==

      W swojej pracy zajmuje się nowymi wyzwaniami etyki w projektowaniu, tematyką
      tożsamości, jej przemianami oraz ich obrazowaniem. Działa na styku różnych dyscyplin,
      łącząc teorię z praktyką artystyczną.

      == Publikacje ==

      Szyjkowska-Piotrowska jest autorką kilku książek i artykułów, w tym:

      - Po-twarz. Przekraczanie widzialności w sztuce i filozofii

      - Dyrygując falom. Myślenie w wizualno-muzycznych awangardach

      - Czy tworzenie sztuki jest sposobem myślenia?

      Dodatkowo, jest autorką kilku artykułów, w tym:

      - O czym nie możemy mówić, tam musimy malować. Rola języka w sztuce

      - Articulating an Inclusive Artistic Practicehttps://independent.academia.edu/AnnaSzyjkowskaPiotrowska

      - Przekraczanie widzialności: Intermedialność w sztuce współczesnejhttps://independent.academia.edu/AnnaSzyjkowskaPiotrowska

      - Rola pamięci w praktyce artystycznej

      - Post-face: Płynność tożsamości

      Brała również udział w dyskusjach na temat swojej pracy, takich jak:

      - Wykład Anu Põder: Ciało-Obiekt vs Ciało-Przestrzeń

      - Wykład Po-twarz. Przekraczanie widzialności w sztuce i filozofii w Muzeum
      Sztuki Współczesnej w Krakowiehttps://www.youtube.com/watch?v=i59N4yzUJdQ

      - Odcinek podcastu w VOGUE PL, w którym omawia swoje idee.

      == Instytucje ==

      Anna Szyjkowska-Piotrowska pełni funkcję członkini Kapituły Plastycznej Nagrody
      im. Cypriana Kamila Norwida, jest członkinią interdyscyplinarnego centrum badawczego
      nad modernizmem i awangardą MODERNITAS oraz członkinią Maison des Sciences Humaines.

      == Przypisy ==

      __INDEKSUJ__'
