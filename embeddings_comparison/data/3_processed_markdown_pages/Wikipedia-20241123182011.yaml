- sections:
  - content: 'Proporcja − rozumiana jest jako współgranie poszczególnych części w
      całości. Jest to jedno z głównych zagadnień teorii sztuki. Już w starożytności
      był poruszany ten problem. Wówczas powstała teoria pitagorejsko-platońska. Pitagorejczycy
      mówili o współbrzmieniu dwóch strun − efekcie, osiągniętym, gdy wysokości dźwięków
      generowanych przez te dwie struny są od siebie oddalone w stosunku 1:2, 2:3,
      3:4. Natomiast Platon twierdził, że ta harmonia zachodzi wtedy, gdy występuje
      trzeci składnik w postaci proporcji. Wszystko co dobre jest piękne, a skoro
      jest piękne, to jest to efekt proporcji. Proporcje ciała określano przez kanony
      Polikleta i Lizypa. Proporcje architektury przez porządki architektoniczne.

      == Zobacz też ==

      - złota proporcja'
    title: Main
  title: Proporcja (sztuka)
- sections:
  - content: 'Mimetyzm (gr. mimetés ‘naśladowca’) – adaptacyjna zdolność niektórych
      zwierząt (rzadziej roślin) do upodabniania się barwą (homochromia) lub kształtem
      (homomorfia) do otaczającego je środowiska. Pojęcie mimetyzmu należy rozumieć
      w szerszym zakresie niż mimikrę, gdyż obejmuje nie tylko przystosowanie ochronne
      (w celu ukrycia się przed drapieżnikiem lub jego odstraszenia), lecz również
      maskowanie, kamuflowanie drapieżników czatujących na potencjalne ofiary.

      Przykłady mimetyzmu:

      - biały kolor futra niektórych zwierząt klimatu okołobiegunowego;

      - upodabnianie się do liści (żywych lub suchych) – niektóre owady (np. straszyki,
      modliszki, zgarbowate, niektóre świerszcze), niektóre płazy (np. rogatka ozdobna),
      a nawet niektóre ryby;

      - upodabnianie się do gałązek (żywych lub suchych) – patyczaki oraz wiele gąsienic
      motyli (np. paziowate, miernikowcowate);

      - upodabnianie się do ptasich odchodów – gąsienice Papilio menestheus i niektóre
      tropikalne pająki.

      Akustyczną formą mimetyzmu jest także naśladowanie głosów, często spotykane
      u ptaków mimetycznych.

      W literaturze i sztuce mimetyzm to naśladowanie lub kopiowanie rzeczywistości
      w dziele sztuki.

      == Zobacz też ==

      - mimesis

      == Przypisy ==

      <references>

      </references>'
    title: Main
