- sections:
  - content: "Ksoanon (stgr. ξόανον xóanon, lm ξόανα xóana) – najstarszy typ starogreckiego\
      \ posągu kultowego wyciosany z drewna i dekorowany szatamiSłownik kultury antycznej.\
      \ Grecja – Rzym (red. L. Winniczuk)..\nPrymitywnie wykonany z drewna (w postaci\
      \ słupa lub deski) wizerunek bóstwa, przystrajany był szatami bądź skórami,\
      \ rzadziej zbroją. Wyodrębnioną i osobno opracowaną głowę ozdabiano twarzową\
      \ maską ludzką z terakoty, a później z kamieniaGuy Rachet: Słownik cywilizacji\
      \ greckiej.Encyklopedia sztuki starożytnej.. Zaliczane do wczesnoarchaicznych\
      \ przykładów rzeźby greckiej, najwcześniejsze ksoanony były zapewne z grubsza\
      \ obrobionymi klocami drewnianymi mającymi przedstawiać ziemską postać bóstwa,\
      \ które później ozdobnie obijano blachą; z biegiem czasu (od VIII w. p.n.e.)\
      \ nabrały one cech rzeźby przedstawiającej. Utrwalony, charakterystyczny typ\
      \ przedstawienia wyobrażał postać ludzką o złączonych nogach i rękach przywartych\
      \ do tułowia, odziewaną w ściśle przylegającą szatę. Ten typ najpewniej reprezentowały\
      \ też najstarsze (niezachowane) wersje posągów Hery z Samos i Artemidy EfeskiejKrystyna\
      \ Zwolińska, Zasław Malicki: Mały słownik sztuk plastycznych.. Do pojęcia tego\
      \ nie odnosiło się kryterium okazałości i wielkości, gdyż określano tak zarówno\
      \ małe, lekkie statuetki z drewna, jak i duże figuryDer Kleine Pauly. T. 5.\
      \ München: Deutscher Taschenbuchverlag, 1979, kol. 1435.. \n \nUtożsamiany (podobnie\
      \ jak betyl) z samym bóstwem, ksoanon był rytualnie karmiony, myty i ubierany;\
      \ niekiedy wierzono w jego cudowną epifanię i oddawano mu tym większą cześć\
      \ (jak np. ksoanonowi Ateny Polias, który miał spaść z niebios). Do najbardziej\
      \ znanych również należał pochodzący z VII w. p.n.e., wotywny ksoanon Afrodyty\
      \ z Delos. \n \nPrzez Greków uważane za wynalazek mitycznego Dedala i długo\
      \ otaczane czcią, ksoanony znane są dziś jedynie ze źródeł pisanych. Pauzaniasz\
      \ w swych Wędrówkach po Helladzie (II w. n.e.) wymienia ich kilkadziesiąt. O\
      \ niektórych wspomina też Klemens Aleksandryjski (Zachęta Greków 46,3). \n \n\
      Na przestrzeni VII i na początku VI wieku p.n.e. zastępowano je akrolitami jako\
      \ doskonalszym typem sakralnego wyobrażenia bóstwa, w których elementami nie\
      \ drewnianymi były także dłonie i stopy.\n== Zobacz też ==\n- idol\n- palladion\
      \ \n== Przypisy ==\n== Bibliografia ==\n- Guy Rachet: Słownik cywilizacji greckiej.\
      \ Wyd. 2. Katowice: „Książnica”, 2006, s. 209, \n- Słownik kultury antycznej.\
      \ Grecja – Rzym (pod red. L. Winniczuk). Wyd. 5. Warszawa: Wiedza Powszechna,\
      \ 1988, s. 249, \n- Encyklopedia sztuki starożytnej. Europa – Azja – Afryka\
      \ – Ameryka. Warszawa: Wydawnictwa Artystyczne i Filmowe / Wydawnictwo Naukowe\
      \ PWN, 1998, s. 346, \n- Krystyna Zwolińska, Zasław Malicki: Mały słownik sztuk\
      \ plastycznych. Wyd. 4. Warszawa: Wiedza Powszechna, 1993, s. 151, ."
