  - content: 'Nagroda Wolfa – nagroda przyznawana przez Fundację Wolfa w Izraelu za
      wybitne osiągnięcia na rzecz ludzkości i przyjaźni między narodami. Corocznie
      od 1978, komitety złożone z międzynarodowych ekspertów przyznają 5–6 nagród
      w następujących dziedzinach: chemia, fizyka, matematyka, medycyna, rolnictwo
      i sztuka. Nagrody w sztuce są przyznawane na przemian w architekturze, muzyce,
      malarstwie i rzeźbiarstwie. Laureat otrzymuje dyplom i 100 000 USD.

      Do 2021 nagrodę otrzymało 345 naukowców i artystów.

      Nagroda Wolfa jest zaliczana do trzech najbardziej prestiżowych nagród w każdej
      z dziedzin, w których jest przyznawana.

      == Laureaci ==

