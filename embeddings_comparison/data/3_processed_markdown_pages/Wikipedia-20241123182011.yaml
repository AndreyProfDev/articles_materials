- sections:
  - content: 'Alegoria ( allēgoría, od allēgoréo „mówię w przenośni, obrazowo” z ἄλλος
      allos „inny, różny” i ἀγορεύω agoreuo „przemawiać w zgromadzeniu” z ἀγορά agora
      „zgromadzenie”) w literaturze i sztukach plastycznych – obraz plastyczny lub
      słowny przedstawiający pojęcie, ideę, myśl lub wydarzenie np. poprzez personifikację.
      Odczytanie alegorii umożliwiają m.in. atrybuty lub emblematy o konkretnym znaczeniu,
      dlatego, w przeciwieństwie do symbolu, przesłanie alegorii jest zazwyczaj jednoznaczne.

      Alegorią posługiwano się już w starożytności, często stosowano ją w średniowieczu
      (zob. średniowieczny alegoryzm), lecz rozpowszechniła się w okresie renesansu,
      a zwłaszcza baroku. W XVI i XVII w. publikowano specjalne wydawnictwa zawierające
      ilustracje, opis i komentarze poszczególnych przedstawień alegorycznych (m.in.
      Cesarego Ripa Ikonologia pierwsze wydanie w 1593 roku).

      == W literaturze ==

      Alegoria jest składnikiem świata przedstawionego utworu (np. jako motyw, postać,
      fabuła), który poza wyrażonym wprost znaczeniem, przekazuje również treść ogólniejszą,
      nieraz bardziej abstrakcyjną. Szczególnie często sięgano po nią w literaturze
      dydaktycznej i moralizatorskiej (w średniowieczu w moralitecie, poematach romansowo-moralizatorskich),
      dziełach przedstawiających idee polityczne lub historiozoficzne, przypowieściach,
      a zwłaszcza w bajkach.

      == Bibliografia ==

      - Aleksandra Okopień-Sławińska, hasło: alegoria Podręczny słownik terminów literackich,
      pod red. Janusza Sławińskiego, Warszawa, "Open", 1996, s.12.

      - Hasło: alegoria [w:] Słownik terminologiczny sztuk pięknych, pod red. Stefana
      Kozakiewicza, Warszawa, Państwowe Wydawnictwo Naukowe, 1969, s.15.

      == Zobacz też ==

      - alegoreza

      - metafora

      - symbolika'
    title: Main
  title: Alegoria
- sections:
  - content: 'Sztuka polityczna (zwana też w czasach PRL-u zaangażowaną) – szerokie
      pojęcie obejmujące wiele rodzajów działalności artystycznej, które łączy to,
      że intencjonalnie niosą jakieś przesłanie polityczne. Sztuka polityczna może
      być zarówno sposobem kontestacji status quo społecznego i jego przejawów instytucjonalnych,
      jak i wyrazem oficjalnej polityki danego kraju (co z reguły prowadzi do sztuki
      propagandowej). Przykładem ostatniego jest socrealizm w państwach bloku komunistycznego
      czy muralizm w Meksyku. Do odmian sztuki politycznej zalicza się m.in.: activist
      art (ang. "sztuka lewicowa"), radical art (ang. "sztuka radykalna") itp. Najbardziej
      znanymi artystami uprawiającymi sztukę polityczną na Zachodzie są: nieżyjący
      już Joseph Beuys oraz Victor Burgin, Hans Haacke i Krzysztof Wodiczko.

      == Bibliografia ==

      - Marcin Giżycki, Słownik kierunków, ruchów i kluczowych pojęć sztuki drugiej
      połowy XX wieku , Wydawnictwo Słowo/Obraz Terytoria, Gdańsk 2002,'
    title: Main
