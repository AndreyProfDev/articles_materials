  - content: "Remiks – dzieło powstałe w wyniku przerobienia (zremiksowania), polegającego\
      \ na dodawaniu/usuwaniu lub zmianie elementów oryginału. Remiks zachowuje ślady\
      \ dzieła pierwotnego – przyswaja jego rozpoznawalne elementy, by stworzyć nową\
      \ jakość, ale komunikuje swe źródło, np. poprzez tytułyEncyklopedia, remiks,\
      \ Encyklopedia teatru polskiego [dostęp 2020-02-10] (pol.)..\n== Rodzaje remiksów\
      \ ==\nNajczęściej używany w kontekście muzyki, ale remiksem może być zarówno\
      \ utwór muzyczny co obraz, grafika, wideo, wiersz czy fotografia, pojęcie to\
      \ odnosi się do wszystkich rodzajów dzieł i jest uznawane nawet za „paradygmat\
      \ współczesnej, sieciowej kultury”. Można wyróżnić trzy rodzaje remiksu:\n-\
      \ rozszerzony – pierwotnie w muzyce, polegał na dodawaniu partii instrumentalnych\
      \ do utworu muzycznego, które wydłużając go, nie zmieniały jednak jego charakteru;\n\
      - selektywny – dodawanie bądź usuwanie elementów, w efekcie których pozostaje\
      \ tylko ślad, pamięć oryginału;\n- refleksyjny – miksowanie elementów z kilku\
      \ źródeł, których pochodzenie zaciera się, dając zupełnie nową całość\n== Remiks\
      \ w muzyce ==\nPojęcie remiksu z początku było ściśle związane z miksowaniem\
      \ muzyki, z czasem nabrało ono szerszego znaczenia. Remiks w muzyce może oznaczać:\n\
      - przerobienie utworu w celach artystycznych, zaprezentowania go w nowej formie;\n\
      - ulepszenie miksu starego utworu w celu poprawienia jego jakości;\n- przeróbka\
      \ gatunkowa utworu mająca na celu zwiększenie grupy odbiorców;\n- manipulację\
      \ stereo utworu, stworzenie wersji z dźwiękiem przestrzennym;\n- adaptację utworu\
      \ w wersji klubowej;\n- wprowadzenie występów gościnnych do utworu.\nNależy\
      \ pamiętać, że jest to pojęcie o bardzo dużej różnorodności wewnętrznej – opisuje\
      \ cały zespół praktyk dotyczących edycji i manipulacji materiałem dźwiękowym.\n\
      === Historia ===\nJedną z pierwszych osób piszących o remiksowaniu był Michaił\
      \ Kaufman. Mimo że nie używał tego terminu, w swoich notatkach z okresu studiów\
      \ w konserwatorium muzycznym w Białymstoku wspomina \"eksperymenty z nagraniami\
      \ gramofonowymi, gdzie z różnych fragmentów nagrań na płytach powstawała nowa\
      \ kompozycja\". Słowa te można uznać za zapowiedź praktyk remiksowania, pojawiające\
      \ się stosunkowo wcześnie, gdyż Kaufman studiował w latach 1912–1915. \n== Kultura\
      \ remiksu ==\nKultura remiksu (nazywana również kulturą odczytu-zapisu; ang.\
      \ read-write culture) to kultura społeczeństwa, w obrębie którego tworzenie\
      \ dzieł pochodnych jest nie tylko dozwolone, ale i wspierane. Dzieła takie powstają\
      \ poprzez połączenie lub zmianę istniejących prac w celu utworzenia nowych dzieł\
      \ lub produktów. Termin został wprowadzony przez amerykańskiego badacza i prawnika\
      \ Lawrence’a Lessiga. Kultura odczytu-zapisu, której esencją jest remiksowanie,\
      \ jest jego zdaniem przeciwieństwem kultury odczytu (ang. read only), która\
      \ jest świadectwem profesjonalizmu i rozwijana jest wyłącznie przez zawodowców.\n\
      == Remiks w teatrze polskim ==\nW praktyce scenicznej pojęcie zostało spopularyzowane\
      \ dzięki projektowi RE//MIX Komuny//Warszawa, realizowanemu przez cztery lata\
      \ od roku 2010. Kuratorem projektu był Tomasz Plata, a wśród artystów znaleźli\
      \ się m.in. Paweł Passini, Krzysztof Gorbaczewski, Marina Cecko. Powstało trzydzieści\
      \ sześć performansów, odnoszących się twórczo do istniejących dzieł, głównie\
      \ z dziedzin teatru, tańca, literatury i filmu.\nKolejnym wydarzeniem istotnym\
      \ dla popularyzacji remiksów był festiwal „Dziady. Recykling”, zorganizowany\
      \ przez Leszka Kolankiewicza. Artyści stosowali remiks teatralny, będący artystyczną\
      \ konfrontacją z dziełem, biografią artysty, konwencją, formą bądź tematem,\
      \ którą realizowali w formie powtórzenia (w zmienionej formie) dzieła z przeszłości.\n\
      == Remiks w literaturze ==\nGłównym sposobem remiksowania dzieł literackich\
      \ jest technika „cut-up” opracowana przez Briona Gysina'The Paris Review Interview\
      \ with William S. Burroughs’ in A Williams Burroughs Reader, ed. John Calder\
      \ (London: Picador, 1982), p. 263.. Polega ona na dosłownym cięciu wydrukowanych\
      \ słów i układaniu ich w nowe znaczenia. Przykładem może być powieść „The Soft\
      \ Machine” (1961) autorstwa Williama Burroughsa.\n== Remiks w malarstwie ==\n\
      W malarstwie również można znaleźć dzieła wykorzystujące praktykę remiksu. Mogą\
      \ to być nawet jedynie niewielkie zmiany w obrazie źródłowym. Przykładami mogą\
      \ być dzieła pochodne od „Mona Lisy” Leonarda da Vinci. Obrazy takie jak „L.H.O.O.Q.”\
      \ Marcela Duchampa, „Autoportret jako Mona Lisa” Salvadora Dalego czy też „La\
      \ Joconde fumant la pipe” autorstwa Eugène Bataille w oczywisty sposób czerpią\
      \ z dzieła renesansowego twórcy.\n== Zobacz też ==\n- remiks album\n- kultura\
      \ remiksu\n- wariacje – forma muzyczna\n== Przypisy =="
