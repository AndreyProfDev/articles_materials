- sections:
  - content: "Brikolaż () – majsterkowanie i samodzielne, nieprofesjonalne naprawy\
      \ różnego rodzaju przedmiotów użytkowych, łączenie niepowiązanych ze sobą elementów.\
      \ Obecnie występuje jako termin specjalny w wielu różnych dziedzinach wiedzy.\
      \ Do terminologii naukowej pojęcie brikolażu wprowadził francuski antropolog\
      \ Claude Lévi-Strauss, który posłużył się nim w swojej strukturalistycznej analizie\
      \ powstawania mitu, przedstawiając powstawanie mitów właśnie jako formę brikolażu.\
      \ Wprowadzone przez Lévi-Straussa pojęcie przejęło następnie wielu innych uczonych\
      \ i myślicieli reprezentujących różne dziedziny wiedzy, w tym np. filozofowie\
      \ Jacques Derrida, Félix Guattari i Gilles Deleuze, literaturoznawcy Gérard\
      \ Genette i Cary Nelson, badaczka kultury masowej Deena Weinstein.\n== Brikolaż\
      \ u Lévi-Straussa ==\nLévi-Strauss prezentuje pojęcie brikolażu (bricolage,\
      \ a także rzeczownik bricoleur i czasownik bricoler) przede wszystkim w pracy\
      \ Myśl nieoswojonaPrzeł. Andrzej Zajączkowski, Państwowe Wydawnictwo Naukowe\
      \ 1969, s. 30 i nn..\nMitotwórczy charakter bricolage’u przedstawiany przez\
      \ Lévi-Straussa czyni go czymś pośrednim między nauką a sztuką. W myśleniu mitycznym\
      \ przynależące do różnych kontekstów praktycznych i kulturowych, heterogeniczne\
      \ elementy łączone są ze sobą i wykorzystywane na nowo tak, że nadaje im się\
      \ nowy, samodzielny sens. Bricoleur stara się przedstawić kompletny obraz rzeczywistości\
      \ dysponując jedynie ograniczoną gamą środków intelektualnych – posługując się\
      \ jedynie takimi środkami, którymi dysponuje na bieżąco (ponowne uporządkowanie\
      \ treści kultury jest tu wprawdzie warunkowane przez ich oryginalne sensy, ale\
      \ także odrzuca te sensy, zastępuje je nowymi). Tekst Lévi-Straussa zaczyna\
      \ się od omówienia komentarzy innych autorów. Szukali oni wyraźnego kontrastu\
      \ pomiędzy „pierwotnym” bricolage a postawą „cywilizowanego” naukowca i inżyniera,\
      \ którzy używają jedynie środków intelektualnych uznawanych za adekwatne i którzy\
      \ postulują niepoznawalność i niewykonalność pewnych rzeczy za pomocą środków\
      \ bieżących. Według przytaczanych autorów, bricoleur koncentruje się na powierzchni\
      \ zjawisk, podczas gdy nauka poszukuje ich wewnętrznej struktury. Taka różnica\
      \ postaw miała kontrastować myśl cywilizowaną i myśl pierwotną. Według Lévi-Straussa\
      \ nie ma tu jednak ostrej różnicy jakościowej, i nie powinno to prowadzić do\
      \ uznania tych drugich kultur za „prymitywne” – bardziej stosowne jest określenie\
      \ „wczesne”. Każda kultura w istocie stosuje swoje własne formy bricolage i\
      \ myślenia analitycznego – takie, na jakie pozwalają jej aktualne potrzeby,\
      \ środki i ogólna sytuacja. Należy to według Lévi-Straussa postrzegać raczej\
      \ jako odmienne perspektywy. Bricolage wskazuje tak na ograniczenia myślenia\
      \ mitycznego, jak i na jego kreatywność w traktowaniu zastanych treści kulturowych.\n\
      == Znaczenie terminu „brikolaż” w innych dziedzinach wiedzy ==\nOd czasów Lévi-Straussa\
      \ termin pojawia się w bardzo wielu różnych dziedzinach wiedzy, w tym w antropologii,\
      \ językoznawstwie, kulturoznawstwie, naukach o sztuce, naukach społecznych,\
      \ muzykologii, w badaniach nad kulturą masową. W odniesieniu do analiz kultury\
      \ współczesnej nabiera odmiennego i bardziej ogólnego niż u Lévi-Straussa znaczenia,\
      \ oznaczając najczęściej montaż nowych stylów i mód poprzez (swobodne) zestawianie\
      \ elementów zastanego materiału kulturowego. Repetycja, wariacja i rekontekstualizacja\
      \ zastanych elementów kulturowych prowadzi do powstawania nowych, indywidualnych,\
      \ osobnych form stylowych i kulturowych. Prócz analiz kultury konsumpcyjnej\
      \ i popularnej pojęcie brikolażu występuje często także w naukach o sztuce.\
      \ Punktem wyjścia analiz, w których występuje, jest często sztuka surrealistyczna\
      \ i dadaistyczna, w tym np. praca Marcela Duchampa Fontanna, w formie porcelanowego\
      \ pisuaru. W odniesieniu do kubizmu, surrealizmu czy dadaizmu ma się na myśli\
      \ użycie szerokiego spektrum nietradycyjnych materiałów, od lat 60., zwłaszcza\
      \ w związku działalnością włoskiego ruchu artystycznego arte povera, termin\
      \ wiąże się jednak także z kontestacją komercjalizacji świata sztuki, dokonywaną\
      \ np. poprzez konstruowanie rzeźb ze śmieci. Praktyka taka służy dewaluacji\
      \ dzieła sztuki i ewaluacji pozaartystycznej zwyczajności, codziennościArt Term.\
      \ Bricolage, http://www.tate.org.uk/art/art-terms/b/bricolage (dostęp 11 czerwca\
      \ 2017). \nTermin „brikolaż” obecny jest zwłaszcza w analizach kultury konsumpcyjnej\
      \ występujących w myśli postmodernistycznej. Kładzie się w nich nacisk na badanie\
      \ zbitek pojęciowych i zestawień różnorodnych przekazów symbolicznych, których\
      \ eksplorowanie postrzegane jest jako źródło kreatywności, indywidualizmu i\
      \ niezależności od konsumpcjonizmu. Pojęcie spotyka się jednak z szeroką krytyką,\
      \ w tym o charakterze teoretycznym – pomimo że stało się symbolem i kluczowym\
      \ hasłem postmodernistycznego konsumpcjonizmu kulturowego, pozostaje ono w istocie\
      \ pojęciem typowo strukturalistycznym. Pod wpływem idei poststrukturalistycznych\
      \ wychodzi ono z mody; zastępuje je zbliżone znaczeniowo pojęcie assemblage.\n\
      == Zobacz też ==\n- polistylizm\n- kolaż, decollage, asamblaż\n== Przypisy ==\n\
      == Bibliografia ==\n- Martyn Hammersley, Bricolage and Bricoleur, artykuł w:\
      \ Lisa M. Given (red.), The Sage Encyclopedia of Qualitative Research Methods,\
      \ Sage 2008.\n- Rebeca Leach, Bricolage, artykuł w: Dale Sotherton (red.), Encyclopedia\
      \ of Consumer Culture, Sage 2011.\n- William Ramp, Bricolage, artykuł w: Austin\
      \ Harrington, Barbara L. Marshall, Hans-Peter Müller (red.), Encyclopedia of\
      \ Social Theory, Routledge 2012."
    title: Main
