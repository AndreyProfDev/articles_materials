- sections:
  - content: 'Model (mężczyzna), modelka (kobieta) − osoba zawodowo zajmująca się
      pozowaniem artyście (fotografowi, malarzowi, rzeźbiarzowi) lub demonstrowaniem
      strojów podczas pokazów mody.

      == Terminy związane z zawodem modela ==

      - Fotomodeling polega na pozowaniu modela bądź modelki celem ich sfotografowania.
      Pozowanie może odbywać się w różnych zakresach. Zakresy pozowania (w branży
      zwane również „dyspozycyjnością”) to m.in.:

      - Portret – fotografia, której głównym tematem jest osoba fotografowana. Portret
      nie musi ograniczać się wyłącznie do twarzy, może to być także zdjęcie całej
      sylwetki.

      - Fashion – fotografia mody – sednem jest tu przedstawienie odzieży, obuwia
      lub dodatków. Fotografie modowe stały się częścią fotografii artystycznej. W
      fotografii mody nie obowiązują kanony, twórcy mają swobodę w kreacji i realizacji
      swoich wizji.

      - Bielizna, kostium kąpielowy – wykonywane są portrety modelki w bieliźnie lub
      samej bielizny jako tematu głównego.

      - Beauty – fotografie typowe m.in. dla reklam kosmetyków i biżuterii, w których
      tematem jest uroda, zdrowy wygląd, makijaż i fryzura.

      - Glamour – gatunek fotografii, w którym osoby pozujące, zwykle kobiety, są
      przedstawiane w atrakcyjny seksualnie sposób. Pozowanie odbywa się w zakresie
      od pełnego ubrania do nagości, przy czym sutki i srom są zakryte lub w inny
      sposób odwraca się od nich uwagę widza. Fotografia Glamour jest zazwyczaj mniej
      dosadna niż pornografia i erotyka, choć termin ten bywa również używany jako
      eufemizm dla fotografii erotycznej. Zdjęcia glamour prezentują np. czasopisma
      dla mężczyzn jak „Playboy”, „Maxim” czy „CKM”.

      - Topless – Jest to kategoria pomocnicza, pomagająca ustalić szczegóły sesji,
      wstępnie informując, że modelka będzie pozowała z odkrytymi piersiami.

      - Akt – przedstawienie ludzkiego ciała nago, bez zakrycia. Akt jest jednym z
      najważniejszych tematów malarskich i fotograficznych w historii sztuki. Trudno
      jednoznacznie określić, że akt jest fotografią modelki pozującej nago, gdyż
      często zdjęcie na którym modelka pokazująca tylko nagie plecy również zaliczane
      jest do aktu. Do aktu możemy zaliczyć również pozowanie topless. Należy podkreślić,
      że akt to nie są zdjęcia erotyczne ani pornograficzne, chociaż zdarza się, że
      pokazane są intymne części ciała.

      - Nagość zakryta – taki rodzaj aktów, na których modele lub modelki występują
      nago, ale szczegóły anatomiczne są ukryte w cieniu bądź zakryte np. tkaniną,
      rekwizytami czy dłońmi.

      == Niektóre rodzaje modelingu ==

      === Modelki i modele magazynów ===

      Zawód modelki i modela obejmuje również pozowanie w magazynach o modzie. W szczególności
      w Japonii istnieją różne rodzaje modelek i modeli magazynów mody. Występują
      tam tak zwane ekskluzywne modelki (専属モデル, senzoku moderu), to modelki, które
      pojawiają się regularnie w jednym magazynie i pracują wyłącznie dla niego. Z
      drugiej strony są także modelki uliczne (読者モデル, dokusha moderu, w skrócie „dokumo”),
      to modelki amatorki, które pracują w niepełnym wymiarze godzin dla magazynów
      mody w połączeniu ze szkołą bądź pracą. W przeciwieństwie do modelek profesjonalnych
      modelki uliczne mają przedstawiać wygląd przeciętnego człowieka, tak więc nie
      pojawiają się na wybiegach i nie są kontraktowane na wyłączność z magazynem
      mody. Natomiast jeżeli modelka uliczna jest wystarczająco popularna, to niekiedy
      staje się ekskluzywną modelką. Wiele ikon mody i muzyków w Japonii zaczynało
      swoją karierę jako modelki uliczne, w tym Kaela Kimura czy Kyary Pamyu Pamyu.

      === Gravure idol ===

      Gravure idol (グラビアイドル, gurabia aidoru; wklęsły idol), nazwa często skracana
      do gradol (グラドル, guradoru), to modelka, która pracują głównie dla magazynów
      dla mężczyzn i często pojawiają się w fotoksiążkach i na płytach DVD. Modelki
      te są uważane za część ogólnego przemysłu idoli w Japonii.

      == Zobacz też ==

      - Model (sztuka)

      - Modelka dużych rozmiarów

      - Hostessa

      == Przypisy =='
    title: Main
  title: Model (zawód)
- sections:
  - content: 'Plastykoterapia – terapia za pomocą sztuki wykorzystująca techniki plastyczne
      oraz kolory.

      Plastyka jest najczęściej wykorzystywana w procesie arteterapii. Korzysta z
      najróżniejszych, niekonwencjonalnych technik plastycznych. Pełni wiele funkcji,
      z których najważniejszą zdaje się być możliwość formułowania swojej wypowiedzi
      w sposób niewerbalny, a tym samym bezpieczny dla zainteresowanego. Często jednak
      dzieło artystyczne staje się pretekstem do rozmów i dyskusji wokół tematu, który
      dana praca wyłania.

      Obserwacja osób z niepełnosprawnością fizyczną podczas zajęć z plastykoterapii
      pozwala terapeucie zajęciowemu określić sprawność manualną pacjentów.

      == Bibliografia ==

      - Karolak W., Sztuka jako zabawa, zabawa jako sztuka, Wydawnictwa CODN, Łódź
      1998.'
    title: Main
  title: Plastykoterapia
- sections:
  - content: "Parerga (liczba mnoga, jako taka częściej występująca, od słowa parergon\
      \ grec. πάρεργον) – określenie dzieł ubocznych, mało znanych, pozostających\
      \ poza głównym nurtem twórczej działalności artysty, pisarza, kartografa, itd.\
      \ Często bywają to dzieła uzupełniające cudzą twórczość lub świadczące o własnych\
      \ talentach w innej dziedzinie (dziś nazwalibyśmy to wielozawodowością).\n==\
      \ Parerga Nigrinusa ==\nZ przykładem parergi mamy do czynienia w przypadku twórczości\
      \ Jonasa Nigrinusa. W 1724 roku wydał on w Cieszynie mapę Księstwa Cieszyńskiego\
      \ i przyległych mu ziem. Nigrinus na mapie przypisał Węgrom tereny sporne z\
      \ Austrią, co tak oburzyło władze austriackie, że mapę skonfiskowały i zniszczyły,\
      \ zaś autora zamknięto w więzieniu. Korzystając z jego matrycy, przedruku dokonał\
      \ Ludwik Andrae, jednak i jego kopię spotkał ten sam los. W 1740 roku Mateusz\
      \ Seutter wydał w Augsburgu kartograficzne dzieło Nigrinusa. Podpisał je jako\
      \ własne, chociaż swoje zmiany ograniczył jedynie do pogrubienia kreski, wymiany\
      \ kartusza i paru charakterystycznych ozdobników mapy Nigrinusa. Mapa aż do\
      \ XX wieku, nigdy szerzej nie była znana a i o jej węgierskim twórcy mało kto\
      \ wiedział. \nWśród kolekcjonerów i znawców folkloru beskidzkiego od dawna były\
      \ cenione i kolekcjonowane rysunki (miedzioryty) przedstawiające różne obiekty\
      \ regionalne, między innymi szałas beskidzki (koliba). Fragmenty na brzegach\
      \ wskazywały, że to fragment jakieś mapy. Rozpatrywano je jednak jako świadectwo\
      \ beskidzkiego folkloru. Dopiero poznanie autora i całej mapy postawiło sprawę\
      \ w należytym świetle. Najstarsze rysunki folklorystyczne okazały się parergą\
      \ trudniącego się kartografią Nigrinusa. W Czechach wszelkie ozdobniki map,\
      \ niejako automatycznie, określane są jako parergon (zwykle nie używają słowa\
      \ parerga).\n== Inne zastosowanie słowa parerga ==\nCzasami słowo parerga lub\
      \ parergon bywa używane jako element tytułu np. Richard Strauss napisał Parergon\
      \ zur Sinfonia Domestica Op. 73 na fortepian i orkiestrę. Nazwa może też pełnić\
      \ funkcję pseudonimu lub nazwiska; Sophia Loren w filmie Milionerka grała bohaterkę\
      \ o imieniu Epifania Parerga. W Berlinie istnieje oficyna wydawnicza o nazwie\
      \ Parerga. Najczęściej jednak tytuł parerga otrzymują dzieła pośmiertne autora\
      \ w sytuacji, gdy ten staje się sławny. Wówczas jego życie i twórczość poddawane\
      \ są wnikliwym badaniom, podczas których odkrywane są nieznane szczegóły dotyczące\
      \ biografii i działalności twórczej.\n== Zobacz też ==\n- Paralipomena\n- Leonard\
      \ Pełka\n- Waldemar Osterloff\n- Jan Michał Rozwadowski\n- Władysław Tatarkiewicz\n\
      == Bibliografia =="
    title: Main
