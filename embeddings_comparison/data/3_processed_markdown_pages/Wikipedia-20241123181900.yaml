- sections:
  - content: "Twórczość chorych psychicznie – pojęcie określające całokształt dzieł\
      \ tworzonych przez osoby zdradzające trwałe lub przejściowe zaburzenia psychicznie,\
      \ przede wszystkim pacjentów ze schizofrenią. Twórczość ta jest przedmiotem\
      \ zainteresowania lekarzy psychiatrów i psychologów, traktujących ją jako cenne\
      \ uzupełnienie dokumentacji stanu psychopatologicznego pacjenta, a także historyków\
      \ sztuki i artystów, doszukujących się w niej wartości artystycznych i nowych\
      \ form ekspresji artystycznej. Inne określenia tej sztuki to „sztuka schizofreniczna”,\
      \ „sztuka psychopatologiczna”, ang. artistic self-expression, niem. schizophrenische\
      \ Bildnerei (Prinzhorn), zustandsgebundene Kunst (Navratil). Antoni Kępiński\
      \ proponował stosowanie szerokiego, niewartościującego określenia „schizofreniczna\
      \ ekspresja plastyczna”, obejmującego różnorodne formy ekspresji pacjentów,\
      \ w tym zarówno te bezwartościowe jak i cenne pod względem wartości artystycznych.\n\
      Zainteresowanie sztuką chorych psychicznie rozpoczęło się równolegle z powstaniem\
      \ nowoczesnej psychiatrii, w pierwszych latach XX wieku. Ernst Kretschmer pisał,\
      \ że chcąc poznać „pełnię wewnętrznego życia w schizofrenii, należy studiować\
      \ nie żywoty wieśniaków, lecz poetów i królów cierpiących na tę chorobę”E. Kretschmer:\
      \ Psychologia lekarska. PZWL, Warszawa 1958. Cytat za: Kępiński. Kępiński pisze\
      \ o schizofrenii artystycznej, określając tym pojęciem obraz choroby u osób\
      \ w okresie przedchorobowym wyróżniających się wybitną inteligencją, wyobraźnią\
      \ i uzdolnieniami artystycznymi. \nCenną kolekcję dzieł pacjentów hospitalizowanych\
      \ w szpitalach psychiatrycznych Europy i Japonii zebrał Hans Prinzhorn. Kolekcję\
      \ Prinzhorna odkrył po II wojnie światowej Jean Dubuffet, który stworzył pojęcie\
      \ Art Brut. W 2002 roku w Heidelbergu powstało Muzeum Prinzhorna.\nW kazuistyce\
      \ psychiatrycznej przywołuje się zarówno dzieła nieznanych pacjentów, czasem\
      \ odkrytych po ich śmierci, jak większość z wystawianych w Muzeum Prinzhorna\
      \ dzieł; z drugiej strony, analizuje się dzieła wybitnych artystów, u których\
      \ stwierdzono lub podejrzewano zaburzenia psychiczne. Przykładem może być twórczość\
      \ Vincenta van Gogha, w której Karl Jaspers doszukiwał się cech zdradzających\
      \ objawy schizofrenii. Odrębnym zagadnieniem jest twórczość niespontaniczna,\
      \ powstająca w ośrodkach opieki zdrowotnej w ramach terapii zajęciowej. Rzadko\
      \ jest ona wysoko oceniana w kategoriach sztuki, natomiast odgrywa dużą rolę\
      \ w leczeniu pacjentów i pomaga im powrócić do funkcjonowania w społeczeństwie.\n\
      == Artyści ==\n- Adolf Wölfli\n- Anton Heinrich Müller\n- Louis Wain\n- Bryan\
      \ Chamley\n- Oswald Tschirtner\n- August Walla\n- Edmund Monsiel\n- Emma Hauck\n\
      == Przypisy ==\n== Bibliografia ==\n- Pałuba M. 5.3.2. Twórczość chorych psychicznie.\
      \ [w:] : Bilikiewicz A, Pużyński S, Rybakowski J, Wciórka J (red.) Psychiatria.\
      \ Tom III. Terapia. Zagadnienia etyczne, prawne, organizacyjne i społeczne.\
      \ Wydawnictwo Medyczne Urban & Partner Wrocław 2002 . s. 567–569\n- Martin Stefan,\
      \ Mike Travis, Robin M. Murray: An Atlas of Schizophrenia. The Parthenon Publishing\
      \ Group 2002 \n== Linki zewnętrzne ==\n- Archives and Museum Bethlem Royal Hospital\
      \ Dzieła Gilberta Price'a na stronie Bethlem Royal Hospital w Beckenham, Kent"
    title: Main
  title: Twórczość chorych psychicznie
