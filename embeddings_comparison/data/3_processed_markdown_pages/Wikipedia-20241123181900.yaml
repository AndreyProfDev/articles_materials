  - content: "Kultura (z , 'uprawa, dbać, pielęgnować, kształcenie’) – wieloznaczny\
      \ termin pochodzący od ( „uprawa roli”), interpretowany w wieloraki sposób przez\
      \ przedstawicieli różnych nauk. Najczęściej jest rozumiana jako całokształt\
      \ duchowego i materialnego dorobku społeczeństwa. Kulturę można określić jako\
      \ ogół wytworów ludzi, zarówno materialnych, jak i niematerialnych: duchowych,\
      \ symbolicznych, takich jak wzory myślenia i zachowania.\nBywa utożsamiana z\
      \ cywilizacją i z wzorami postępowania charakterystycznymi dla danego społeczeństwa;\
      \ także z tym, co w zachowaniu ludzkim jest wyuczone, w odróżnieniu od tego,\
      \ co jest biologicznie odziedziczone.\nCałością wiedzy na temat kultury zajmuje\
      \ się dziedzina nauki, jaką jest kulturoznawstwo, jednak w różnych aspektach\
      \ kultury badania są też realizowane przez: filozofię kultury, historię kultury\
      \ materialnej, antropologię kulturową, socjologię kultury, etnografię i memetykę.\n\
      W kontekście naukowym termin kultura nie przyjmuje charakteru wartościującego.\n\
      == Główne dziedziny kultury ==\n- kultura materialna: wytwory człowieka, technika\
      \ i umiejętności praktyczne.\n- kultura duchowa: wierzenia, wiedza, literatura\
      \ i wszelkiego rodzaju piśmiennictwo, sztuka, w tym: sztuki plastyczne, teatr,\
      \ muzyka, film, moda, a także wszystko co należy do wytworów umysłu, na przykład\
      \ filozofia;\n- kultura społeczna: normy moralne, ideologia, uczestnictwo w\
      \ życiu kulturalnym, normy społeczne i kulturowe;\n- kultura języka / kultura\
      \ słowa: umiejętność sprawnego posługiwania się językiem i operowania nim zgodnie\
      \ z normami obowiązującymi w danej społeczności i wymaganiami danej sytuacji\
      \ komunikacyjnej;\n- kultura polityczna: systemy wartości i wzorce zachowań\
      \ (polityków, partii) biorących udział w wykonywaniu władzy państwowej lub aspirujących\
      \ do tej roli;\n== Różnorodność pojmowania kultury ==\nPierwotnie termin cultura\
      \ wiązał się z uprawą roli, bądź hodowlą zwierząt i oznaczał przekształcanie\
      \ naturalnego stanu zjawisk przyrody w stan bardziej użyteczny i przydatny człowiekowi.\
      \ Obecnie w języku agronomii używa się wyrażeń takich jak: kultura rolna, kultura\
      \ bakterii, bądź monokultura, co wiąże się bezpośrednio z pierwotnym znaczeniem\
      \ tego słowa. Pierwszy raz w nowym znaczeniu termin został użyty przez Cycerona,\
      \ który w dziele Disputationes Tusculanae użył sformułowania cultura animi (uprawa\
      \ umysłu) w celu określenia pierwszej w literaturze koncepcji filozofii:\nOd\
      \ tamtego czasu termin „kultura” zaczęto wiązać z czynnościami ludzkimi, które\
      \ miały na celu doskonalenie, pielęgnowanie czy kształcenie. Po raz pierwszy\
      \ nowoczesne zastosowanie pojęcia „kultura” pojawiło się w 1688 roku, użyte\
      \ przez Samuela von Pufendorfa w pracy De iure naturae et gentium, gdzie zamieścił\
      \ słowa takie jak: cultura czy cultura animi na oznaczenie wszelkich wynalazków\
      \ wprowadzonych przez człowieka (takich jak instytucje społeczne, ubranie, język,\
      \ moralność kierowaną przez rozum i obyczaje).\nW ciągu wieków słowo to było\
      \ coraz częściej używane przez filozofów, a potem i uczonych zajmujących się\
      \ naukami społecznymi. Rezultatem tego oto procesu stała się jego wieloznaczność.\
      \ Zasadnicze różnice pojawiają się, po przyjrzeniu się co oznacza termin „kultura”\
      \ dla reprezentantów różnych nauk:\n- dla archeologa – „zbiór rzeczy materialnych\
      \ znalezionych na miejscu wykopalisk, wykonanych z kamienia, metalu, kości bądź\
      \ drewna”,\n- dla etnografa – „nie tylko przedmioty materialne, lecz również\
      \ zachowania ludzkie, takie jak pieśni, przysłowia, baśnie, mity, legendy, mody,\
      \ obyczaje, zwyczaje czy obrzędy, występujące w danym regionie”,\n- dla antropologa\
      \ – „sfera przedmiotów materialnych, zachowań ludzkich, a także instytucje,\
      \ działalność gospodarczą, zabawę, język i religię”,\n- dla psychologa – „zbiór,\
      \ do którego wchodzą przede wszystkim zachowania jednostki, jej myśli, uczucia\
      \ i reakcje; kultura przejawia się poprzez zbiór reguł i motywów postępowania,\
      \ form ekspresji, nakazów i zakazów, ocen i sądów” (np. kultura indywidualistyczna,\
      \ kultura kolektywistyczna),\n- dla socjologa – „wydzielony obszar życia i działalności\
      \ grup ludzkich”,\n- dla kulturoznawcy – „respektowane przez daną zbiorowość\
      \ przekonania normatywne i przekonania dyrektywalne, które w trybie subiektywno-racjonalnym\
      \ regulują praktykę społeczną” (definicja według Jerzego Kmity). Bądź „sposób\
      \ życia podług wartości” (definicja Stanisława Pietraszki). Bądź sztuka i działalność\
      \ artystyczna, czyli dzieła będące efektem działań intelektualnych, więc muzyka,\
      \ literatura, malarstwo, rzeźba, teatr i film (Raymond Williams) lub proces\
      \ rozwojowy rozumiany jako proces społeczno-historyczny lub pielęgnowane cechy\
      \ określonego sposobu życia związane z tworzeniem i używaniem symboli.\n== Sposoby\
      \ badania zjawiska kultury ==\n=== Pierwszy sposób ===\nSposoby badania kultury\
      \ dzieli się na dwie zasadniczo odmienne grupy i wiążące się z nimi dwa różne\
      \ sposoby badania zjawiska kultury. W pierwszym wypadku pojmuje się kulturę\
      \ jako pewną własność ludzkich zbiorowości. Obejmuje ona cechy odróżniające\
      \ ludzi od innych organizmów, które nie są społecznie ukształtowane.\nStanisław\
      \ Ossowski wyróżnił dwie warstwy zjawisk kulturowych:\n- kulturę we właściwym\
      \ sensie tego słowa, obejmującą jedynie wzory zachowania i myślenia,\n- przedmioty\
      \ materialne, powiązane z tymi wzorami, jako warstwę skorelowaną z kulturą,\
      \ będącą jej namacalnym odpowiednikiem (korelatem kultury).\nWard Goodenough\
      \ również wyróżnił dwa poziomy kultury, jednak rozumiał je inaczej:\n- poziom\
      \ zjawiskowy w kulturze, w obrębie którego mieszczą się instytucje oraz zewnętrzne\
      \ cechy charakteryzujące zbiorowości ludzkie,\n- poziom ideacyjny, na który\
      \ składają się reguły działania i wyuczone elementy wiedzy. \nClaude Lévi-Strauss\
      \ uważał z kolei, że w kulturze najważniejsze są struktury, a nie to co wiąże\
      \ się ze sferą psychologiczną kultury. Istotna dla kultury płaszczyzna zjawisk\
      \ kulturowych znajduje się na poziomie ładu czy porządku nieuświadomionego.\
      \ Inni uczeni (Stefan Czarnowski, Jan Szczepański) włączali do kultury nie tylko\
      \ wzory myślenia i zachowania, ale także przedmioty materialne związane z tymi\
      \ wzorami systemem grupowych znaczeń. Egzemplarz książki Władca Pierścieni,\
      \ samochód marki Polski Fiat 126p czy komputer Odra będzie więc dla jednych\
      \ uczonych elementem kultury (Czarnowski, Szczepański), a dla innych jedynie\
      \ korelatem pewnych ludzkich dyspozycji (Ossowski).\n=== Drugi sposób ===\n\
      W tym wypadku badacze kultury interesują się przede wszystkim treścią kultury,\
      \ nie jej „ludzkim podłożem”. Badacz Kodeksu Napoleona interesuje się w tym\
      \ przypadku stosunkami logicznymi występującymi między normami w nim zawartymi\
      \ (normy w tym wypadku oznaczają wypowiedź o określonej treści, a nie pożądany\
      \ wzorzec zachowania). Nie interesuje go ani stopień skuteczności tego kodeksu,\
      \ ani to jaka była jego ocena w oczach jego użytkowników.\nInny badacz, w którego\
      \ centrum zainteresowania znajdzie się Palestyński Islamski Dżihad, będzie analizował\
      \ ugrupowania wchodzące w jego skład i opisywał stosunki między nimi, a nie\
      \ zajmował się zasadnością powstania tej organizacji czy rozważaniem słuszności\
      \ metod przez nią stosowanych (badaniem moralności zajmuje się etyka).\n== Definicje\
      \ kultury ==\n=== Problem nieokreśloności ===\nIstnieje wiele definicji kultury,\
      \ często rozbieżnych, a nawet sprzecznych. Znaczące są więc słowa niemieckiego\
      \ filozofa Johanna Herdera, który już w XVIII wieku napisał w przedmowie do\
      \ Myśli o filozofii dziejów:\nBadacze kultury tworzyli nowe definicje, za każdym\
      \ razem uwzględniając jakiś wycinkowy, konkretny punkt widzenia na kulturę.\
      \ Antropolog kultury, Ralph Linton, tak podsumował te starania:\nOn sam definiuje\
      \ ją w ten sposób: „Kultura to konfiguracja wyuczonych zachowań i ich rezultatów,\
      \ których elementy składowe są podzielane i przekazywane przez członków danego\
      \ społeczeństwa”.\n=== Sposoby definiowania ===\nRóżne sposoby definiowania\
      \ kultury zawarte są w pracy A. Kroebera i C. Kluckhohna Culture. A Critical\
      \ Review of Concepts and Definitions. Autorzy w swojej analizie pojęcia kultura\
      \ wyróżnili 164 pseudodefinicje na podstawie korpusu tekstowego liczącego ok.\
      \ 300 pozycji. Korpus ten obejmował zasadniczo pozycje anglojęzyczne.\nPolskie\
      \ opracowania definicji kultury, na podstawie systematyki Kroebera-Kluckhohna\
      \ przedstawili: Antonina Kłoskowska w książce pt. Kultura masowa. Krytyka i\
      \ obrona (1964) oraz Robert Boroch w książce pt. Kultura w systematyce Alfreda\
      \ L. Kroebera i Clyde’a Kluckhohna.\nGrupy definicyjne:\n; Grupa A: Definicje\
      \ opisowe\n: Zamieszczone zostały tu definicje prezentujące klasyczną postać\
      \ wczesnych definicji etnologicznych. Najbardziej znaną z nich, jest popularna\
      \ i użyteczna definicja Edwarda Tylora: „Kultura, czyli cywilizacja, jest to\
      \ złożona całość, która obejmuje wiedzę, wierzenia, sztukę, moralność, prawa,\
      \ obyczaje oraz inne zdolności i nawyki nabyte przez ludzi jako członków społeczeństwa”.\
      \ Tylor traktował zamiennie pojęcia „kultura” i „cywilizacja”. Inni badacze,\
      \ którzy zajmowali się kulturą (szczególnie archeologowie, etnografowie i antropologowie\
      \ kultury) chętnie się odwoływali do tej definicji, bądź ją modyfikowali. Ruth\
      \ Benedict określiła ją jako: „Kultura jest to złożona całość zawierająca nawyki\
      \ nabyte przez człowieka jako członka społeczeństwa”. Definicja antropologa\
      \ Bronisława Malinowskiego: „Kultura jest integralną całością składającą się\
      \ z narzędzi i dóbr konsumpcyjnych, twórczych zasad różnych grup społecznych,\
      \ ludzkich idei i umiejętności, wierzeń i obyczajów”.\n; Grupa B: Definicje\
      \ historyczne\n: Definicje tu umieszczone kładą nacisk na czynnik tradycji jako\
      \ mechanizm przekazywania dziedzictwa kulturowego. Definicja Stefana Czarnowskiego:\
      \ „Kultura jest dobrem zbiorowym i zbiorowym dorobkiem, owocem twórczego i przetwórczego\
      \ wysiłku niezliczonych pokoleń. [...] Jest nią całokształt zobiektywizowanych\
      \ elementów dorobku społecznego, wspólnych szeregowi grup i z racji swej obiektywności\
      \ ustalonych i zdolnych rozszerzać się przestrzennie”.\n; Grupa C: Definicje\
      \ normatywne\n: Definicje te akcentują podporządkowanie się zachowań ludzi normom,\
      \ wzorom, wartościom i modelom. Temu typowi definicji odpowiada ujęcie kultury,\
      \ zaproponowane przez Alfreda Kroebera i Talcotta Parsonsa: „Kultura to przekazane\
      \ i wytworzone treści i wzory wartości, idei i innych symbolicznie znaczących\
      \ systemów, będące czynnikami kształtującymi ludzkie zachowania oraz wytwory\
      \ stanowiące produkt zachowania”. Również w tym duchu kulturę definiuje Ralph\
      \ Linton: „konfiguracja wyuczonych zachowań i ich rezultatów, których elementy\
      \ składowe są podzielane i przekazywane przez członków danego społeczeństwa”.\n\
      ; Grupa D: Definicje psychologiczne\n: Definicje psychologiczne skupiają uwagę\
      \ na psychicznych mechanizmach kształtowania się kultury. Analizują one mechanizmy\
      \ uczenia się, formowania nawyków kulturowych, internalizacji norm obowiązujących\
      \ w danej zbiorowości i wartości uznawanych przez tę zbiorowość, jak również\
      \ wpływ kultury na kształtowanie osobowości jednostek. Główny nacisk kładziony\
      \ jest na uczenie się i naśladownictwo jako procesy przyswajania kultury. Definicje\
      \ dla tego typu sformułował Stanisław Ossowski: „Kultura jest pewnym zespołem\
      \ dyspozycji psychicznych przekazywanych w łonie danej zbiorowości przez kontakt\
      \ społeczny i uzależniony od całego systemu stosunków międzyludzkich”.\n; Grupa\
      \ E: Definicje strukturalne\n: Definicje zebrane dla tego typu interesują się\
      \ głównie strukturą konkretnej kultury, a więc jej zasadniczymi elementami oraz\
      \ ich wewnętrznymi powiązaniami. Wyróżnia się cztery kategorie elementów kultury:\
      \ materialno-techniczne, społeczne, ideologiczne oraz psychiczne (dotyczące\
      \ uczuć i postaw).\n; Grupa F: Definicje genetyczne\n: Definicje te skupiają\
      \ się na problemie genezy kultury, wyjaśniają jej pochodzenie. Definicje te\
      \ dzieli się na dwie grupy: dotyczące wewnętrznego rozwoju kultury, wyłaniania\
      \ się jednych (wyższych) form z form innych wcześniejszych (uważanych za niższe)\
      \ oraz dotyczące problemu wyłaniania się kultury z natury oraz związków, różnic\
      \ i przeciwieństw między tymi definicjami.\nGrupa G: Definicje niekompletne\n\
      Do grupy tej zaliczono definicje niepasujące do w/w.\nNotacja szczegółowa Systematyki\
      \ Kroebera-Kluckhohna:\nGrupa A: Definicje opisowe\nGłówne kryteria klasyfikacyjne:\
      \ w definicjach grupy A znajdują się sformułowania: „całość”, „suma”, „wszystko”.\n\
      a) kultura jako „złożona całość”;\nb) wyliczenie cech kultury.\nGrupa B: Definicje\
      \ historyczne\nGłówne kryteria klasyfikacyjne grupy B:\na) dziedzictwo społeczne;\n\
      b) tradycja społeczna.\nGrupa C: Definicje normatywne\nPodgrupa C1: Nacisk na\
      \ reguły:\na) powszechne (lub współdzielone) i utrwalone sposoby wykonywania\
      \ czegoś;\nb) sankcje grożące za odstępstwa od reguł;\nc) maniery, czyli sposób\
      \ zachowania się w konkretnej sytuacji;\nd) „społeczny algorytm” określający,\
      \ co i w jaki sposób może być osiągnięte oraz jakie może to przynieść korzyści\
      \ lub ich braki.\nPodgrupa C2: Nacisk na wartości i idee plus zachowanie\nKryterium\
      \ klasyfikujące do podgrupy C2 to komplementarne odnoszenie się kultury do:\
      \ zachowania, jawnych działań, idei oraz wartości.\nGrupa D: Definicje psychologiczne\n\
      Podgrupa D1: nacisk na modyfikację kultury jako „urządzenia” rozwiązującego\
      \ problemy.\nPodgrupa D2: nacisk na uczenie się.\nPodgrupa D3: nacisk na przyzwyczajenia.\n\
      Podgrupa D4: definicje w pełni psychologiczne.\nGrupa E: Definicje strukturalne\n\
      Grupa F: Definicje genetyczne\nElementem porządkującym w grupie F jest:\na)\
      \ co kulturą się staje;\nb) jakie czynniki powodują, że kultura jest w ogóle\
      \ możliwa;\nc) jakie elementy składają się na kulturę.\nPodgrupa F1: nacisk\
      \ na kulturę jako produkt albo artefakt.\nPodgrupa F2: nacisk na idee.\nPodgrupa\
      \ F3: nacisk na symbole.\nPodgrupa F4: pozostałe definicje genetyczne, które\
      \ koncentrują się na pochodzeniu kultury i wyliczaniu, czym jest kultura.\n\
      Grupa G: Definicje niekompletne\nGrupa G zawiera definicje, które ze względu\
      \ na metaforyczne ujmowanie problemu są trudne do sklasyfikowania według przyjętej\
      \ w Systematyce Kroebera-Kluckhohna metodologii.\n== Podstawowe pojęcia związane\
      \ z kulturą ==\nKulturę można opisywać w rozumieniu wartościującym albo opisowym.\
      \ To pierwsze rozumienie odwołuje się do kultur „lepszych” i „gorszych”, „wyższych”\
      \ i „niższych”, bardziej lub mniej „cywilizowanych”, drugie zaś nie wartościuje\
      \ zjawisk i tym samym nie używa tych pojęć.\nZ powyższymi dwoma rodzajami rozumienia\
      \ kultury związane są dwa przymiotniki: kulturalny (odwołujące się do pierwszego\
      \ rozumienia) i kulturowy (odwołujące się do drugiego). Różnicę pomiędzy nimi\
      \ można wyjaśnić na przykładzie ulicznego graffiti. Zachowanie młodych grafficiarzy,\
      \ malujących na murach czy wagonach kolejowych, trudno nazwać zachowaniem kulturalnym\
      \ (często określa się je jako akt wandalizmu), lecz na pewno jest ono zjawiskiem\
      \ kulturowym. Nie zawsze pojęcia te są ze sobą sprzeczne, np. o obrazach Vincenta\
      \ van Gogha powiemy, że są zarówno zjawiskiem kulturalnym, jak i kulturowym.\n\
      Według atrybutywnego rozumienia kultury jest ona cechą stałą i atrybutem ludzkości\
      \ jako całości (ujęcie globalne) lub poszczególnego człowieka jako przedstawiciela\
      \ gatunku homo sapiens (ujęcie jednostkowe). Można mówić o kulturze tylko w\
      \ liczbie pojedynczej, nigdy w liczbie mnogiej (o kulturach). Według dystrybutywnego\
      \ rozumienia kultury jest ona rozumiana jako zbiór cech kultury określonej zbiorowości,\
      \ np.: Polaków, rowerzystów, uczniów gimnazjum czy górników. W tym wypadku można\
      \ używać pojęcia „kultury”, gdyż jest ich wiele, podobnie jak wiele jest różnych\
      \ zbiorowości.\n== Kultura a natura ==\nGatunek ludzki jako jedyny gatunek na\
      \ Ziemi wytworzył kulturę (zależnie od definicji wskazuje się też na kulturopodobne\
      \ zachowania niektórych ssaków, ptaków i owadów). W tym sensie kultura nie jest\
      \ przeciwieństwem natury, lecz stanowi jej rozwinięcie. Dzięki rozwojowi na\
      \ drodze ewolucji homo sapiens jest w stanie w sposób świadomy przeobrażać świat\
      \ rzeczywisty znajdujący się wokół niego. Dlatego nazywa się często człowieka\
      \ „zwierzęciem tworzącym kulturę”.\nIzolowana jednostka ludzka nie jest w stanie\
      \ samodzielnie wytworzyć kultury. Potrzeba do tego zbiorowości ludzkiej, przekazującej\
      \ swe doświadczenia z pokolenia na pokolenie. Nawet najbardziej inteligentny\
      \ człowiek pozbawiony kontaktów ze skumulowanym na drodze przekazu pokoleniowego\
      \ dziedzictwem nie będzie w stanie wytworzyć jakiejkolwiek złożonej „całości\
      \ kulturowej” jedynie w oparciu o swe umiejętności i dostępne mu zasoby naturalne.\n\
      W klasycznych definicjach kultury uznawano, że kultura wynika z natury (w sensie\
      \ filogenetycznym), lecz jest przeciwstawna naturze (w sensie ontogenetycznym).\n\
      Na temat związku kultury z naturą powstało wiele różnorodnych teorii, przy czym\
      \ wiele z nich podchodzi do tego zagadnienia w odmienny sposób. Odległe od siebie\
      \ pojęciowo rozróżnienia proponują na przykład funkcjonalizm Bronisława Malinowskiego\
      \ oraz pierwotna wersja psychoanalizy Zygmunta Freuda.\nBronisław Malinowski\
      \ traktował kulturę jako formę zaspokajania ludzkich potrzeb, jest ona „środkiem\
      \ do celu”. Zygmunt Freud również sądził, że kultura jest odpowiedzią na ludzkie\
      \ potrzeby (zwłaszcza formą radzenia sobie z popędem seksualnym). Jednak uznał,\
      \ że potrzeby te są represjonowane poprzez system kontroli moralnej i prawnej\
      \ oraz dostarczanie:\nSocjobiolog Edward Osborne Wilson natomiast przeciwstawiając\
      \ się podejściu Freuda przyjmuje tezę, że kultura nie przeciwstawia się naturze,\
      \ lecz sprzyja ona adaptatywnym wzorcom, jak chociażby unikanie chowu wsobnego,\
      \ co byłoby niekorzystne dla gatunku. Kazirodztwo w jego ujęciu, przeciwstawnym\
      \ wobec Freuda, nie jest więc hamowanym przez kulturę instynktem, lecz poprzez\
      \ to, że kultura we wszystkich społeczeństwach sprzeciwia się kazirodztwu, argumentuje\
      \ że jest to genetycznie wdrukowany wzorzec, na bazie którego powstało wiele\
      \ motywów rozwijających kulturę.\nDekonstrukcja binarnego i opozycyjnego podziału\
      \ na naturę i kulturę, zasygnalizowana wcześniej przez ruch New Age i teorie\
      \ krytyczne, została w ostatnich latach podjęta przez nurty filozoficzne określające\
      \ się jako posthumanistyczne. Wypowiadali się na ten temat zwłaszcza Bruno Latour,\
      \ Donna Haraway, Rosi Braidotii, a w Polsce m.in. Monika Bakke.\nWedług Jana\
      \ Pawła II kultura to „uszlachetniająca afirmacja tego co ludzkie”. Analiza\
      \ kultury tego autora jest częścią jego antropologii adekwatnej, to znaczy takiej,\
      \ która ukazuje jednoznaczną różnicę między człowiekiem jako osobą, a światem\
      \ zwierzęcym („animalia”) – czyli „wy-osobnienie się” człowieka ze świata, jego\
      \ personalizacja.\n== Kultura a cywilizacja ==\nCzęść badaczy, np. Edward Tylor\
      \ stosuje te pojęcia zamiennie. Inni zaś podają różnice pomiędzy nimi. Według\
      \ Alfreda Webera cywilizacja to efekt dążenia do racjonalizacji życia ludzkiego\
      \ i adaptacji do zewnętrznych warunków (elementami cywilizacji są wszelkie wynalazki\
      \ i udoskonalenia techniczne), podczas gdy:\nLewis Morgan określał jako cywilizację\
      \ najwyższe stadium rozwoju ogólnie rozumianej kultury (stadium to następowało\
      \ po etapie dzikości i barbarzyństwa).\n== Różnorodność kultur ==\nMimo że kultura\
      \ jest atrybutem człowieka i co za tym idzie wszystkich społeczności tworzonych\
      \ przez gatunek homo sapiens nie jest ona jednolita i w różnych okresach historycznych,\
      \ jak również w różnych obszarach geograficznych wytwory ludzkie, systemy norm\
      \ i wartości były i są od siebie odbiegające w dużym stopniu. Przedstawiciele\
      \ nauk społecznych starają się klasyfikować pewne typy kultur, czy też opisywać\
      \ szczególne przypadki istniejących obecnie lub w przeszłości, nadając im nazwy\
      \ specyficzne ze względu na miejsce, czas bądź ogólny typ opisywanej kultury.\n\
      === Wybrane ogólne typy kultur ===\n- kultura darów\n- kultura duchowa\n- kultura\
      \ języka\n- kultura ludowa\n- kultura masowa\n- kultura materialna\n- kultura\
      \ narodowa\n- kultura polityczna\n- kultura elitarna\n- kultura oficjalna\n\
      - kultura regionalna\n- kultura lokalna\n- kultura organizacyjna\n=== Systemy\
      \ kultury ===\n- kultura oralna i piśmienna\n- kultura elektroniczna\n- kultura\
      \ druku\n=== Niektóre szczególne typy kultur ===\n- kultura aszelska\n- kultura\
      \ badaryjska\n- kultura cykladzka\n- kultura esperanta\n- kultura halsztacka\n\
      - kultura hawajska\n- kultura Islandii\n- kultura Kanady\n- kultura łużycka\n\
      - kultura magdaleńska\n- kultura minojska\n- kultura mustierska\n- kultura mykeńska\n\
      - kultura Olduvai\n- kultura Olmeków\n- kultura świderska\n- kultura azylska\n\
      == Istotne cechy kultury i płaszczyzny zjawisk kulturowych ==\nKultura związana\
      \ jest z człowiekiem. Jest zjawiskiem społecznym i powtarzalnym (naukowiec,\
      \ który nie ujawni swego wynalazku szerszemu gronu, nie włączy go tym samym\
      \ do elementów kultury, lecz po jakimś czasie zrobić to może inny uczony, który\
      \ niezależnie od niego doszedł do tych samych wniosków). Kultura jest zbiorem\
      \ zjawisk wyuczonych (czyli przekazywanych nie za pośrednictwem genów, lecz\
      \ na drodze wychowania i uczenia się).\nKultura ma charakter czasowy i przestrzenny.\
      \ Kultura jest systemem, a więc dana kultura ma własną wewnętrzną logikę. Kultura\
      \ jest też mechanizmem adaptacyjnym człowieka, jest pośrednikiem między człowiekiem\
      \ a środowiskiem, które on zamieszkuje.\n=== Płaszczyzny zjawisk kulturowych\
      \ ===\n- materialna – każde zjawisko kulturowe ma jakiś wymiar materialny;\n\
      - behawioralna – zjawiska kulturalne są związane nierozerwalnie z zachowaniami\
      \ motorycznymi (zewnętrznymi, czyli czynnościami związanymi z tworzeniem i odbiorem\
      \ dzieła kulturowego lub wewnętrznymi, czyli przeżyciami, odczuciami, bądź wypowiedziami);\n\
      - psychologiczna – dla niektórych badaczy ważne są: wartościowanie, oceny, postawy,\
      \ motywy i znaczenia nadawane przez człowieka przedmiotom materialnym i zachowaniom;\n\
      - aksjonormatywna – w kulturze można też wyróżnić normy i wartości.\n=== Inne\
      \ ważne pojęcia związane z kulturą ===\n- dobra kultury – wartości kultury –\
      \ relatywizm kulturowy – wzór kulturowy (kod kulturowy)\n- dziedzictwo kulturowe\
      \ – lista światowego dziedzictwa kulturalnego i przyrodniczego UNESCO\n- finansowanie\
      \ kultury – mecenat – sponsoring\n- subkultura – kontrkultura – kultura alternatywna\n\
      - zderzenie kultur – szok kulturowy – asymilacja kulturowa\n- komunikacja międzykulturowa\
      \ – bariera kulturowa – dostęp do kultury\n- akulturacja – kontrakulturacja\
      \ – transkulturacja – rekulturacja – synkretyzm\n== Zobacz też ==\n- krajobraz\
      \ kulturowy\n- kulinaria\n- pluralizm kulturowy\n- protokultura\n- sztuka\n\
      - dobra kultury\n- subkultura\n- wolna kultura\n- wspakultura\n- agronomia\n\
      - geografia kultury\n== Przypisy ==\n== Bibliografia ==\n== Linki zewnętrzne\
      \ =="
