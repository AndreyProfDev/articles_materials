- sections:
  - content: "Twórczość – wieloaspektowe zjawisko związane z powstawaniem nowych i\
      \ wartościowych wytworów. Zgodnie ze Słownikiem Języka Polskiego PWN jest to\
      \ pojęcie oznaczające zarówno proces tworzenia czegoś, jak też ogół dzieł stworzonych\
      \ przez kogoś. W tym pierwszym znaczeniu używa się pojęcia procesu twórczego,\
      \ a więc swoistego procesu psychicznego prowadzącego do powstania twórczego\
      \ dziełaE. Nęcka, Twórczość. [W:] J. Strelau (red. nauk.), Psychologia. Podręcznik\
      \ akademicki. Tom 2. Psychologia ogólna, Gdańskie Wydawnictwo Psychologiczne,\
      \ Gdańsk 2000, s. 789. np. dzieła sztuki czy dzieła literackiego. Tego typu\
      \ zjawiska są badane i opisywane w ramach psychologii twórczości. W tym drugim\
      \ znaczeniu pojęcie twórczości odnoszone jest do dorobku poszczególnych twórców\
      \ kultury np. artystów, naukowców, pisarzy, architektów, projektantów etc. W\
      \ tym kontekście można mówić przykładowo o twórczości malarskiej Leonarda da\
      \ Vinci czy o twórczości literackiej Williama Shakespeare'a. \nZrozumienie zjawiska\
      \ twórczości, jak twierdzi Edward Nęcka, wymaga ujęcia interdyscyplinarnego,\
      \ gdyż jest ono przedmiotem badań wielu przedstawicieli nauk społecznych i humanistycznych,E.\
      \ Nęcka, Twórczość. [W:] J. Strelau (red. nauk.), Psychologia. Podręcznik akademicki.\
      \ Tom 2. Psychologia ogólna, Gdańskie Wydawnictwo Psychologiczne, Gdańsk 2000,\
      \ s. 783. w tym między innymi psychologów, antropologów, filozofów, pedagogów,\
      \ socjologów, historyków czy historyków sztuki.\n== Psychologiczne koncepcje\
      \ twórczości ==\nW psychologii twórczości wyróżnia się ogólne koncepcje procesu\
      \ twórczego oraz systemowe koncepcje twórczości. Do tej pierwszej kategorii\
      \ należą klasyczne i współczesne teorie procesu twórczego, koncepcja Roberta\
      \ Weisberga (nazywana teorią stopniowego przyrostu), koncepcja interakcji twórczej\
      \ Edwarda Nęcki oraz model genploracji (ang. geneplore model) opracowany przez\
      \ Ronalda Finkego, Thomasa Warda i Stevena Smitha. Z kolei do systemowych koncepcji\
      \ twórczości należą inwestycyjna koncepcja twórczości Roberta Sternberga i Todda\
      \ Lubarta, koncepcja transgresji Józefa Kozieleckiego oraz koncepcja, którą\
      \ zaproponował Mihaly Csikszentmihalyi.E. Nęcka, Twórczość. [W:] J. Strelau\
      \ (red. nauk.), Psychologia. Podręcznik akademicki. Tom 2. Psychologia ogólna,\
      \ Gdańskie Wydawnictwo Psychologiczne, Gdańsk 2000, s. 786-792.\nJedną z pierwszych\
      \ psychologicznych koncepcji twórczości, uznawaną za klasyczną teorię procesu\
      \ twórczego, przedstawił Graham Wallas. Zgodnie z jego koncepcją proces twórczy\
      \ składa się z czterech etapów: 1) preparacji, 2) inkubacji, 3) iluminacji oraz\
      \ 4) weryfikacji.\nCechą charakterystyczną systemowych koncepcji twórczości\
      \ jest to, że wyróżniają one wiele składników twórczości, w tym nie tylko składniki\
      \ psychiczne, ale również społeczne oraz kulturowe. W ramach tych koncepcji\
      \ zakłada się, że twórczość jest dynamicznym systemem, zaś poszczególne składniki\
      \ wzajemnie oraz nieustannie oddziałują na siebie. Efekt końcowy jest czymś\
      \ więcej niż prostą sumą działania jego poszczególnych składników, a więc zachodzi\
      \ proces synergii.E. Nęcka, Twórczość. [W:] J. Strelau (red. nauk.), Psychologia.\
      \ Podręcznik akademicki. Tom 2. Psychologia ogólna, Gdańskie Wydawnictwo Psychologiczne,\
      \ Gdańsk 2000, s. 786.\n== Zobacz też ==\n- Aktywność twórcza\n- Dzieło sztuki\n\
      - Kreatywność\n- Utwór\n== Bibliografia ==\n- https://sjp.pwn.pl/sjp/tworczosc;2531502.html\n\
      - E. Nęcka, Twórczość. [W:] J. Strelau (red. nauk.), Psychologia. Podręcznik\
      \ akademicki. Tom 2. Psychologia ogólna, Gdańskie Wydawnictwo Psychologiczne,\
      \ Gdańsk 2000, s. 783-792.\n== Przypisy =="
    title: Main
  title: Twórczość
- sections:
  - content: "Światowy Dzień Różnorodności Kulturowej, właśc. Światowy Dzień Różnorodności\
      \ Kulturowej dla Dialogu i Rozwoju (ang. World Day for Cultural Diversity for\
      \ Dialogue and Development) – święto obchodzone corocznie 21 maja, ustanowione\
      \ przez Zgromadzenie Ogólne ONZ rezolucją 57/249 z 22 grudnia 2002 w myśl Powszechnej\
      \ Deklaracji o Różnorodności Kulturowej uchwalonej na 31 Sesji Konferencji Generalnej\
      \ UNESCO w dniu 2 listopada 2001 roku.\nRezolucja odnosi się do zasady „tolerancji\
      \ i poszanowania dla różnorodności kulturowej oraz promocji i ochrony praw człowieka,\
      \ w tym prawa do rozwoju”.\nCelem obchodów jest promocja kultury, różnorodności\
      \ kulturowej, dziedzictwa kulturowego – zarówno materialnego, jak i niematerialnego,\
      \ produktów przemysłu artystycznego, dóbr oraz usług związanych z kulturą.\n\
      To również okazja, jak podkreśla UNESCO, do uświadomienia rządów, polityków,\
      \ instytucji kultury i uczestników życia społecznego, o konieczności szczególnej\
      \ ochrony kultury krajów rozwijających się, w których zasadnicze znaczenie ma\
      \ kształtowanie właściwej polityki kulturalnej i wypracowanie mechanizmów strukturalnych\
      \ ochrony lokalnych kultur, w tym ich szczególnie istotnego elementu – języka.\n\
      == Zobacz też ==\n- Lista światowego dziedzictwa UNESCO\n- Międzynarodowe Dni\
      \ i Tygodnie ONZ\n- Światowy Dzień Informacji na temat Rozwoju\n== Przypisy\
      \ ==\n== Bibliografia ==\n== Linki zewnętrzne ==\n- Polski Komitet ds. UNESCO:\
      \ Różnorodność kulturowa, www.unesco.pl \n- Konwencja UNESCO w sprawie ochrony\
      \ i promowania różnorodności form wyrazu kulturowego, sporządzona w Paryżu dnia\
      \ 20 października 2005 r. ()"
