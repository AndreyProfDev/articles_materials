      - Marcello Sorce Keller, “Why is Music so Ideological, Why Do Totalitarian States
      Take It So Seriously: A Personal View from History, and the Social Sciences”,
      Journal of Musicological Research, XXVI(2007), no. 2-3, s. 91-122.

      - Mario d’Angelo, Cultural Policies in Europe: Local Issues, Council of Europe
      Publishing, Strasbourg, 2001.'
