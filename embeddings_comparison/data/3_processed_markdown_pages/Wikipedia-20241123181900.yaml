  - content: 'Kultura w polskojęzycznej Wikipedii

      W tym portalu, mimo, że do kultury materialnej można zaliczyć także technikę,
      a w szerszym ujęciu cały dorobek ludzkości, zdecydowaliśmy się na prezentację
      zagadnień związanych głównie z kulturą symboliczną. Niektóre obszary wiedzy
      (np. dotyczącej teatru) są jeszcze w Wikipedii ubogie, z tego względu zachęcamy
      do ich rozwijania. W tej chwili są tu wyeksponowane te dziedziny, które najbardziej
      zostały rozwinięte przez internautów. Jeżeli uważasz, że brakuje jakiejś dziedziny
      wiedzy, albo chciałbyś pomóc w opiece nad którymś z portali, zapraszamy na stronę
      dyskusji.

      Po prawej stronie znajdują się kategorie poszczególnych dziedzin wiedzy. Zaprezentowane
      zostały też wyróżnione, głównie ze względu na jakość, artykuły oraz ilustracje.

      Będziemy wdzięczni za Twoją pomoc, szanowny czytelniku, w rozwijaniu haseł związanych
      z poniżej przedstawionymi naukami. Przy każdej z nich zamieściliśmy odpowiednie
      strony odnoszące się do współpracy. Zapraszamy także do wikiprojektów.'
