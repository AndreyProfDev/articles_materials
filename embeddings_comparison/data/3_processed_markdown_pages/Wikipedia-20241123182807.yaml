- sections:
  - content: 'Historia naturalna – termin dwuznaczny:

      - zmiany zachodzące w przyrodzie;

      - nauki przyrodnicze, badające zarówno przyrodę ożywioną, jak i nieożywioną
      (np. skały, minerały).

      W polszczyźnie XXI wieku określenie to jest rzadziej używane niż przyrodoznawstwo.

      ==Historia==

      W przeszłości do dziedzin historii naturalnej włączano także obserwacje fizyczne,
      chemiczne i astronomiczne. Współcześnie termin ten stosuje się najczęściej do
      określania prac o przyrodzie ożywionej. Jednakże obecnie traktowany jest on
      w świecie nauki jako archaiczny, zbyt ogólny i rzadko stosowany w pracach naukowychNatural
      History WordNet Search, princeton.edu..

      Termin „historia naturalna” był już stosowany przez Arystotelesa i innych starożytnych
      filozofów greckich, które określali tak swoje badania nad światem przyrody.
      Pliniusz Starszy nazwał tak swoje główne dzieło. Średniowieczni chrześcijańscy
      filozofowie stosowali go głównie do określenia studiów nad scala naturae (wielki
      łańcuch Bytu), natomiast nurt arystotelesowski kontynuowali niektórzy badacze
      arabscy.

      Przyrodniczy aspekt terminu powrócił do nauk w Europie w czasie renesansu. W
      Polsce w XVII wieku zagadnienie to popularyzował Jan Jonston przyrodoznawca
      i autor wielu prac wydawanych w Niemczech, Anglii i Niderlandach. Jednak upowszechnienie
      przyrodniczego sensu terminu było zasługą Linneusza. Od tej pory w XVIII i XIX
      w. często używano w literaturze naukowej terminu „historia naturalna” na określenie
      wszelkich badań przyrodniczych. Również muzea gromadzące zbiory przyrodnicze
      przyjmowały wtedy często nazwę muzeum historii naturalnej, utrzymaną przeważnie
      do dziś (np. Muzeum Historii Naturalnej w Londynie, Muzeum Historii Naturalnej
      w Paryżu).

      W drugiej połowie XIX w. miała miejsce debata, której celem miało być wytyczenie
      pojęciowej granicy między historią naturalną jako całokształtem zmian zachodzących
      w przyrodzie a dziejami, czyli całokształtem zmian zachodzących w kulturze.
      Znaczącym uczestnikiem tej debaty był Thomas Henry Huxley (1825 – 1895), który
      najpierw uważał, że badając historię naturalną zdobywamy także wiedzę na temat
      społeczeństwa i kultury (ujęcie ewolucjonizmu społecznego), lecz od opublikowania
      pracy Evolution and Ethics (1893) wskazywał na odmienność praw obowiązujących
      w przyrodzie i w historii człowiekaWiktor Werner, Historyczność kultury. W poszukiwaniu
      myślowego fundamentu współczesnej historiografii, Wydawnictwo Naukowe UAM, Poznań
      2009, s. 163 – 174.

      Przykładem niedostrzegania różnicy między historią naturalną a historią człowieka
      jest stanowisko krytyka teorii ewolucji i kreacjonisty Charlesa Hodge''a, który
      bronił idei celowości (teleologii) zmian zachodzących w przyrodzieWiktor Werner,
      Historyczność kultury..., s. 174–190.

      Od przełomu XIX/XX w. w związku z rozwojem nauk i ich specjalizacją, termin
      „historia naturalna”, odnoszony do wszystkich zmian zachodzących w Naturze,
      zaczął być zbyt ogólnikowy. Utrzymał się on jednak wówczas w takich dziedzinach
      jak ekologia, etologia i biologia ewolucyjna

      W XX wieku termin jest nieostry i bywa używany na określenie zmian zachodzących
      w przyrodzie (w sensie filogenetycznym i ontogenetycznym), jak również na określenie
      nauki.

      == Zobacz też ==

      - Historia Naturalna Polski

      == Przypisy ==

      == Bibliografia ==

      - Stephen G. Herman: Wildlife biology and natural history: time for a reunion.
      Journal of Wildlife Management (2002) 66(4):933–946

      - Robert E. Kohler: Landscapes and Labscapes: Exploring the Lab-Field Border
      in Biology. University of Chicago Press: Chicago, 2002.

      - Ernst Mayr: The Growth of Biological Thought: Diversity, Evolution, and Inheritance.
      The Belknap Press of Harvard University Press: Cambridge, Massachusetts, 1982.

      - Ronald Rainger; Keith R. Benson; Jane Maienschein (red.): The American Development
      of Biology. University of Pennsylvania Press: Philadelphia, 1988.'
    title: Main
  title: Historia naturalna
- sections:
  - content: 'Przyroda, in. natura ( ‘przyroda’, [physis] ‘natura’) – w najszerszym
      znaczeniu wszechświat, rzeczywistość. Termin ten obejmuje także zjawiska fizyczne
      oraz życie – bez uwzględnienia wytworów i oddziaływania ludzi.

      == Wszechświat ==

      Wszechświat w kosmologii to nazwa oznaczająca czasoprzestrzeń, która zawiera
      wszystkie obiekty materialne i energię, dostępne do obserwacji metodami bezpośrednimi
      lub pośrednimi poprzez teleskopy i inne przyrządy obserwacyjne. Według stanu
      wiedzy na 2008 słowo wszechświat jest dla naukowców dwuznaczne. Zgodnie z ogólnie
      przyjętą teorią względności i opartej na niej teorii Wielkiego Wybuchu wiek
      Wszechświata szacuje się na 13,7 mld lat. Dla niektórych kosmologów obserwacyjnych,
      jest to sfera o promieniu około 4 × 10<sup>26</sup> m (50 mld lat świetlnych),
      z nami w centrum, a pojęcie ogólnej czasoprzestrzeni nie ma sensu. Dla niektórych
      fizyków teoretycznych, Wszechświat jest czasoprzestrzenią według modelu Wielkiego
      Wybuchu w małej skali (8 × 10<sup>26</sup> m). Obecne pomiary jednorodności
      promieniowania tła wskazują, że Wszechświat jest prawdopodobnie płaski i będzie
      rozprzestrzeniał się w nieskończoność.

      Powszechnie dziś przyjętym modelem powstania i ewolucji Wszechświata jest model
      Wielkiego Wybuchu.

      == Ziemia ==

      Ziemia – trzecia w kolejności, licząc od Słońca, piąta co do wielkości planeta
      Układu Słonecznego. Jest największą z planet skalistych w Układzie Słonecznym,
      a także jak dotychczas jedynym znanym miejscem występowania życia. Wokół Ziemi
      krąży jeden naturalny satelita – Księżyc oraz prawdopodobnie dwa księżyce pyłowe
      (księżyce Kordylewskiego) i znaczna liczba sztucznych satelitów. Stałą, stabilną
      orbitę posiada także planetoida (3753) Cruithne, która pozostając w rezonansie
      z orbitą Ziemi przez niektórych jest uważana za drugi księżyc Ziemi.

      Ziemia posiada masę i grawitację odpowiednią dla utrzymania atmosfery, chroniącej
      przed promieniowaniem jonizującym oraz własne pole magnetyczne chroniące przed
      wiatrem słonecznym. Oddalenie od Słońca jest właściwe dla utrzymania odpowiedniej
      temperatury. Uważa się, że czynniki te sprzyjały powstaniu życia na ziemi.

      == Zobacz też ==

      - filozofia przyrody

      - nauki przyrodnicze

      == Przypisy =='
