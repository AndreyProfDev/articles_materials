  - content: "Nauki matematyczno-przyrodnicze – grupa nauk, do której zalicza się\
      \ nauki przyrodnicze (lub w węższym zakresie definiowania silnie zmatematyzowane\
      \ ich elementy) oraz matematykę i nauki w stosunku do niej pokrewne.\nNauki\
      \ matematyczno-przyrodnicze:\n- matematyka\n- fizyka\n- astronomia\n- chemia\n\
      - biologia\n- geologia\n- geografia\nDo nauk matematyczno-przyrodniczych zalicza\
      \ się również bardziej szczegółowe dyscypliny nauki wchodzące w skład wyżej\
      \ wymienionych oraz nauki leżące na pograniczu tych dziedzin jak np:\n- geofizyka\n\
      - biofizyka\n- astrochemia \n- oceanologia\n- paleontologia"
