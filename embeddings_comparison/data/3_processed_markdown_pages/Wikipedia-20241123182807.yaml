- sections:
  - content: '"Nauka i naukoznawstwo" ("Science and Science of Science", "Наука та
      наукознавство") - międzynarodowe czasopismo, który wydaje z 1993 roku Centrum
      badań naukowo-technicznego potencjału i historii nauki im. G.M. Dobrowa NAN
      Ukrainy.

      Czasopismo jest stworzone na zapleczu republikańskiego międzyresortowego naukowego
      zbioru "Naukoznawstwo i informatyka" ("Наукознавство та інформатика"). Ten zbiór
      Centrum wydawało od 1970 do 1992.

      W redakcyjne kolegium czasopisma wchodzą fachowcy z Ukrainy, Rosji, Wielkiej
      Brytanii, Chin, USA i Węgier.

      Artykuły mogą ukazywać się na trzech językach: ukraińskim, rosyjskim i angielskim.

      Cel czasopisma - przybliżenie rozwoju nauki i naukoznawstwa w historycznych,
      współczesnych i perspektywicznych aspektach, ujawnienie wpływu nauki na gospodarkę,
      kulturę, edukację i inne dziedziny życia, analiza socjalnych, ekologicznych,
      wojskowych i innych aspektów naukowych badań, opracowanie problemów państwowej
      naukowo-technicznej i innowacyjnej polityki, inicjowanie dyskusji w naukowym
      i społecznym środowisku względem stanu nauki i jej możliwości rozwiązywania
      aktualnych problemów.

      Czasopismo orientuje się na różne grupy odbiorców, jak specjalistów z badania
      nauki (naukoznawców, organizatorów nauki, filozofów, historyków nauki), jak
      i szerokiego grona czytelników.

      == Główne przedmiotowe pole publikacji czasopisma ==

      - nauka w życiu ludzi i społeczeństw;

      - wyniki badań naukoznawczych;

      - wyniki badań w obwodzie historii i filozofii nauki.

      == Stałe rubryki czasopisma ==

      - nauka, technologie i innowacje we współczesnym świecie;

      - problemu rozwoju naukowo-technicznego potencjału i jego współdziałania z gospodarką,
      systemem edukacji i kulturą;

      - horyzonty rozwoju nauki (z przeszłości, przez teraźniejszość do przyszłości);

      - praca naukoznawcy i historyka nauki (główne naukowe prace, dysertacje badania,
      recenzje, przegląd profilowych naukowych czasopism;

      - z historii wynalazków i odkryć;

      - Ukraina w światowym kontekście, chronologia głównych wydarzeń w naukowo-organizacyjnym
      życiu ukraińskiej nauki.

      Adres redakcji: Kijów, bulwar Tarasa Szewczenki 60.

      Strona internetowa wydawcy : http://stepscenter.at.ua.

      Archiwa numerów :

      http://www.nbuv.gov.ua/portal/natural/nnz/texts.html,

      https://web.archive.org/web/20111231045525/http://stepscenter.ho.ua/works.htm.'
    title: Main
  title: Nauka i naukoznawstwo
- sections:
  - content: "Antropologia (gr. ἄνθρωπος anthropos „człowiek”, λόγος logos „nauka”)\
      \ – interdyscyplinarna dziedzina nauki na pograniczu nauk humanistycznych, społecznych\
      \ i przyrodniczych. Zajmuje się badaniem człowieka jako jednostki w społeczeństwie\
      \ w kontekście historycznej zmienności, biorąc pod uwagę warunki socjalno-ekonomiczne\
      \ oraz kulturowe; poszukuje zrozumienia roli kultury i struktur władzy w życiu\
      \ człowieka. Ma dwa podstawowe nurty:\n- antropologię fizyczną zajmującą się\
      \ zmiennością biologiczną i fizjologiczną człowieka;\n- antropologię kulturową\
      \ (antropologia społeczna) zajmującą się człowiekiem w społeczności (zbliżony\
      \ do socjologii).\nIstnieją też inne podziały antropologii, np. w USA jest rozpowszechniony\
      \ podział nauk antropologicznych na cztery nurty:\n- antropologia fizyczna\n\
      - antropologia historyczna, czyli archeologia\n- antropologia lingwistyczna\n\
      - antropologia kulturowa lub społeczna.\nPoza tak rozumianym podziałem pozostają\
      \ następujące nauki czy dziedziny wiedzy mające w nazwie słowo \"antropologia\"\
      :\n- antropologia filozoficzna\n- antropologia religijna (nie mylić z antropologią\
      \ religii).\n== Działy antropologii ==\nZ uwagi na pole zastosowań lub zasadniczy\
      \ przedmiot uwagi wyróżnia się między innymi następujące działy antropologii:\n\
      - antropolingwistyka\n-- antropologia słowa\n- antropologia religii (nie mylić\
      \ z antropologią religijną)\n- antropologia ciała\n- antropologia polityczna\n\
      - antropologia organizacji\n- antropologia sportu\n- antropologia tańca\n- antropologia\
      \ edukacji\n- antropologia jedzenia\n- antropologia płci i seksualności \n-\
      \ antropologia sztuki\n-- antropologia wizualności\n-- antropologia widowisk\n\
      == Przypisy ==\n== Linki zewnętrzne =="
