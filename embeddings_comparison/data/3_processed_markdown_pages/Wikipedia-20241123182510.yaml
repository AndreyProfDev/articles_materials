  - content: "Polityka historyczna () lub polityka pamięci – kształtowanie świadomości\
      \ historycznej oraz wzmocnienie publicznego dyskursu o przeszłości.\n== Geneza\
      \ pojęcia ==\nPolityka historyczna wynika z potrzeby mitologizacji przeszłości\
      \ w celu tworzenia dziedzictwa kulturowego danego narodu. Pojęcie polityki historycznej\
      \ wywodzi się z Niemiec, gdzie pojawiło się w latach 1980. i zajmowało się wpływem\
      \ historii na politykę tego kraju. Wraz z początkiem lat 1990. debata publiczna\
      \ na temat wydarzeń z historii zaczęła mieć coraz większe znaczenie: \nWraz\
      \ ze zjednoczeniem Niemiec stary podział na zachodnioniemiecką i wschodnioniemiecką\
      \ politykę historyczną stracił rację bytu (…) w kontekście niemieckim pojęcie\
      \ to nie ma – w przeciwieństwie do dyskursu politycznego polskiego – konotacji\
      \ konserwatywnychRed. Magdalena Saryusz-Wolska, Pamięć zbiorowa i kulturowa.\
      \ Współczesna perspektywa niemiecka, UNIVERSITAS, Kraków 2009..\n== Narzędzia\
      \ polityki historycznej ==\nNarzędziami polityki historycznej są finansowane\
      \ przez państwo: badania naukowe, edukacja i wychowanie, instytucje wyspecjalizowane\
      \ (jak muzea, izby pamięci, instytuty lub centra), organizacja czasu (kalendarz\
      \ świąt państwowych), topografia pamięci, wykorzystanie mediów masowych i wymiar\
      \ sprawiedliwości, szczególnie podczas tranzycji politycznej, etykietowanie\
      \ bohaterów oraz wykorzystywanie narratorów o odmiennym autorytecie (np. naukowców\
      \ i świadków wydarzeń) w artykułach historycznychLaleh Khalili: Heroes and Martyrs\
      \ of Palestine. The Politics of National Commemoration. Oxford – New York: Oxford\
      \ University Press, 2007; Jan Rydel, Polityka historyczna w Republice Federalnej\
      \ Niemiec. Zaszłości, Idee, Praktyka. Kraków: Wydawnictwo Naukowe Uniwersytetu\
      \ Pedagogicznego, 2011; Patryk Wawrzyński, Sharing the Past: Specialized Institutions\
      \ as an instrument of Politics of Memory in the 21st Century, w: Ralph Schattkowsky\
      \ i Milos Reznik, „Society and Nation in Transnational Processes in Europe”.\
      \ Newcastle: Cambridge Scholar Publishing 2014..\nPolityka historyczna wpływa\
      \ na naturę i nazwy pomników i muzeów, ulic, placów, miast i całych krajów,\
      \ patronów placówek oświatowych i innych instytucji publicznych, osoby odznaczone\
      \ orderami i medalami za zasługiPor. na ten temat: red. Stanisław Kowolik, O\
      \ polską politykę historyczną, IX Sympozjum Tarnogórskie, Tarnowskie Góry 2010.,\
      \ instytucje świadomości historycznej wspólnoty, a także wspierane przez państwo\
      \ i samorządy badania naukowe, działania kulturalne i edukacyjno-wychowawcze.\n\
      == Zagadnienie polityki historycznej w Polsce ==\nTakże po okresie PRL, kiedy\
      \ to wdrażano stosowną historiografię, pojęcie polityki historycznej niejednokrotnie\
      \ wzbudza w Polsce negatywne ocenyPor. na ten temat: red. Bartosz Korzeniewski,\
      \ Narodowe i europejskie aspekty polityki historycznej, Instytut Zachodni, Poznań\
      \ 2008. Wątpliwości dotyczące obiektywizmu badań historycznych i ich prezentacji\
      \ wyrażał również Dariusz Baliszewski pisząc w 2009: Czy na tym właśnie, na\
      \ wiecznym pudrowaniu prawdy, polega nasza polityka historyczna, tak by w lustrze\
      \ dziejów po prostu wyglądać ładnie? - zob. . Politykę historyczną oskarża się\
      \ bowiem o manipulację i wybiórcze traktowanie faktów historycznych.\nOd 1999\
      \ roku funkcjonuje Instytut Pamięci Narodowej, oraz Ministerstwo Kultury i Dziedzictwa\
      \ Narodowego, zaś od 2020 Instytut Dziedzictwa Myśli Narodowej im. Romana Dmowskiego\
      \ i Ignacego Jana Paderewskiego, których celem jest między innymi „realizacja\
      \ polityki pamięci w zakresie historii i dziedzictwa Polski”.\nDefinicje polskiej\
      \ polityki historycznej często uwzględniają ideologię:\n- „Posługiwanie się\
      \ przez demokratyczne (ale nie tylko) społeczeństwa własnymi interpretacjami\
      \ wydarzeń z przeszłości do osiągania m.in. bieżących celów politycznych”Wypowiedź\
      \ Dariusza Gawina w dyskusji w „Gazecie Wyborczej”: Po co nam polityka historyczna?,\
      \ „Gazeta Wyborcza” z 30 września 2005..\n- „Świadome działanie klasy politycznej\
      \ mające na celu kształtowanie zakresu i charakteru zbiorowej pamięci historycznej”Anna\
      \ Wolff-Powęska Polskie spory o historię i pamięć. Polityka historyczna, „Przegląd\
      \ Zachodni” 1-2007..\n- „Interpretacja tożsamości wspólnoty politycznej – w\
      \ jej toku obywatele podejmują decyzje co do tego, jakie tradycje chcą kontynuować,\
      \ a jakich nie”Wypowiedź Zbigniewa Krasnodębskiego, Polityka historyczna. Historycy\
      \ – politycy – prasa. Konferencja pod honorowym patronatem Jana Nowaka-Jeziorańskiego,\
      \ Pałac Raczyńskich w Warszawie, 15 grudnia 2004, Muzeum Powstania Warszawskiego,\
      \ Warszawa 2005..\n- Wzmocnienie publicznego dyskursu o przeszłości poprzez\
      \ różne formy instytucjonalizacji (instytucje centralne, państwowe, lokalne\
      \ – samorządowe oraz regionalne)Por. wypowiedź Marka Cichockiego podczas rozmowy\
      \ w redakcji „Mówią wieki” z dnia 17 sierpnia 2006..\nW 2015 roku ogłoszono\
      \ rozpoczęcie prac nad Strategią Polskiej Polityki Historycznej, a prezydent\
      \ RP Andrzej Duda stwierdził, że „prowadzenie polityki historycznej to jedno\
      \ z najważniejszych działań prezydenta”.\n== Polityka historyczna na świecie\
      \ ==\n=== Gwatemala ===\nUchwalono tam ustawę i wdrożono projekt z Komisją Gwatemalskiego\
      \ Oświecenia Historycznego (), która chroni pamięć masakr ​​w latach 1960-1996,\
      \ gdy zamordowano około 200 000 osób a zaginęło 45 000 osób.\nRównolegle w 1995\
      \ roku rozpoczęto wspierany przez KRK niezależny Projekt Odzyskiwania Pamięci\
      \ Historycznej (REMHI, ), który zgromadził prawie 6000 zeznań o okrucieństwach\
      \ popełnionych podczas ponad trzech dekad wojny domowej.\nDwa dni po ogłoszeniu\
      \ w kwietniu 1998 roku raportu REMHI o takim odzyskaniu narodowej pamięci historycznej:\
      \ \"Nigdy więcej w Gwatemali!\" () o ofiarach tej wojny domowej, w którym w\
      \ 80 procentach zbrodnie te przypisano Armii Gwatemalskiej i nazywając ją też\
      \ holokaustem (), jej współautor biskup został zaatakowany w garażu i pobity\
      \ na śmierć przez trzech oficerów Armii Gwatemalskiej.\n=== Hiszpania ===\n\
      === Niemcy ===\n=== Rosja ===\nZakaz Rehabilitacji Nazizmu to rosyjska ustawa\
      \ o pamięci historycznej z 2014 roku, znana również jako Prawo Jarowej, od nazwiska\
      \ rosyjskiej polityk Iriny Anatolijewnej Jarowej (Ири́на Анато́льевна Ярова́я),\
      \ która odegrała kluczową rolę w jej uchwaleniu.\n=== Turcja ===\nArtykuł 301\
      \ tureckiego kodeksu karnego zakazuje obrażania Turcji, narodu tureckiego, tureckich\
      \ instytucji rządowych lub tureckich bohaterów narodowych, takich jak Mustafa\
      \ Kemal Atatürk.\n=== Ukraina ===\n=== Węgry ===\nPo 1989 roku Węgrzy też stworzyli\
      \ własną historiografię o zbiorowym cierpieniu podczas i po II wojnie światowej.\
      \ Od lat 2000. w wielu węgierskich wsiach na Zakarpaciu znajdują się pomniki\
      \ ofiar powojennych represji, często przerobione z tryumfalnych pomników postawionych\
      \ w okresie Węgierskiej Republiki Ludowej (1949–1989).\n== Zobacz też ==\n-\
      \ Dziedzictwo kulturowe\n- Historia polityczna\n- Historiografia\n- Pamięć kolektywna\n\
      - Pedagogika wstydu\n- Propaganda sukcesu\n== Linki zewnętrzne ==\n-Narracje\
      \ pamięci. Między polityka a historią.\n== Przypisy =="
