  - content: "Kultura pamięci (niem. Erinnerungskultur) – całokształt sposobów obchodzenia\
      \ się z przeszłością i historią przez grupy i jednostki. Obejmuje wszelkie formy\
      \ reprezentacji przeszłości i pamięci, w tym przedstawienia zdarzeń w pamięci\
      \ zbiorowej, upamiętnianie ich, wkomponowywanie w przestrzeń publiczną i teksty\
      \ kultury. Kulturę pamięci cechują i stymulują subiektywizm, brak dystansu oraz\
      \ postrzeganie przeszłości ze współczesnej perspektywy. Naukowo-obiektywny stosunek\
      \ do historii ma tu natomiast znaczenie drugorzędne. Termin ten jest bardzo\
      \ popularny w niemieckim dyskursie naukowym. Angielskiego pojęcia memory culture\
      \ używa się sporadycznie i przeważnie w znaczeniu przenośnym lub jako tłumaczenie\
      \ niemieckiego terminu. W polskim języku naukowym określenie „kultura pamięci”\
      \ popularyzuje się od około 2010 roku. W 2014 roku ukazał się interdyscyplinarny\
      \ leksykon terminów kultury pamięci „Modi Memorandi”, będący przejawem wzrostu\
      \ zainteresowania tą tematyką.\nTermin „kultura pamięci” bywa krytykowany jako\
      \ zbyt szeroki i rozmyty. Jednocześnie właśnie dzięki swojej pojemności znajduje\
      \ on szerokie zastosowanie, gdyż daje się dookreślać przez zestawienie z pojęciami\
      \ bliskoznacznymi, takimi jak pamięć zbiorowa, polityka historyczna czy kultura\
      \ historyczna.\n== Definicje pojęcia ==\nProgramową definicję kultury pamięci\
      \ przedstawił Christoph Cornelißen, uznając ją za:\nPojęcie to używane jest\
      \ również w węższym znaczeniu: dotyczy wówczas ekspansji praktyk upamiętniania\
      \ pod koniec XX i na początku XXI w., dotyczących przede wszystkim spuścizny\
      \ II wojny światowej, w szczególności zaś Holokaustu. W tym znaczeniu stosuje\
      \ je przede wszystkim Aleida Assmann.\nDefinicje Cornelißena i Assmann łączą\
      \ się ze sobą, bowiem konieczność przepracowania przeszłości i traum związanych\
      \ z historią XX wieku przyczyniła się do naukowego zainteresowania tematyką\
      \ pamięci i stworzenia pojęcia opisującego sposoby obchodzenia się z przeszłością.\
      \ Choć w ramach studiów nad pamięcią (memory studies) centralne miejsce wciąż\
      \ zajmuje Holokaust i II wojna światowa, coraz częściej pojawiają się prace\
      \ nawiązujące do szerszego ujęcia kultury pamięci.\n== Rodzaje kultur pamięci\
      \ ==\nPojęcie „kultura pamięci” odsyła do uniwersalnych, kulturowych mechanizmów\
      \ pamięci, możliwe jest jednak również mówienie o kulturach pamięci (w liczbie\
      \ mnogiej) w odniesieniu do poszczególnych zbiorowości. Kultura pamięci rozumiana\
      \ jest wtedy jako element łączący jednostki we wspólnotę, a uwagę zwraca się\
      \ na cechy ogólne pamięci pewnej grupy, akcentując te elementy, które odróżniają\
      \ daną grupę od innych. W konsekwencji można wyróżnić narodowe kultury pamięci\
      \ np. polską, niemiecką, etniczne np. śląską, płciowe, religijne, lokalne itp.\
      \ Kultury pamięci mogą też obejmować wspólnoty ponadnarodowe, czemu sprzyja\
      \ realizacja projektów dwustronnych (takich jak badania polsko-niemieckich miejsc\
      \ pamięci czy próby stworzenia wspólnego polsko-niemieckiego podręcznika do\
      \ historii). Jeszcze szerszy zakres mają europejska czy globalna kultura pamięci,\
      \ jakkolwiek istnieją wątpliwości co do zasadności ich wyodrębniania. \n== Kultura\
      \ pamięci a pamięć zbiorowa ==\nZe ścisłego połączenia terminów „kultura pamięci”\
      \ i „pamięć zbiorowa” wynika „kariera” tego pierwszego w dyskursie naukowym\
      \ związanym z rozwojem badań nad pamięcią. Wraz ze wzrostem zainteresowania\
      \ przeszłością w Europie od końca lat 70. XX wieku i upowszechnieniem się pojęcia\
      \ „pamięć zbiorowa” w naukach humanistycznych, ten socjologiczny termin uległ\
      \ zatarciu i rozmyciu. Szukając alternatywnych koncepcji, naukowcy stworzyli\
      \ pojęcia takie jak: kulturowe pamiętanie, pamięć społeczna, pamięć kulturowa,\
      \ kultura historyczna, a także: kultura pamięci.\n== Kultura pamięci a kultura\
      \ historyczna ==\nTermin „kultura pamięci” należy traktować jako bliskoznaczny\
      \ z terminem „kultura historyczna”. Ten drugi jest bardziej rozpowszechniony\
      \ w polskim dyskursie naukowym. Pisali na jego temat m.in. Stanisław Zakrzewski\
      \ i Brygida Kürbisówa, współcześnie używa go Andrzej Szpociński.\nKultura pamięci\
      \ silniej akcentuje jednak wykorzystywanie przeszłości w teraźniejszości np.\
      \ do wspierania określonych tożsamości, jak również podkreśla kwestie związane\
      \ z dyskursywnymi i artystycznymi przedstawieniami historii. \n== Kultura pamięci\
      \ a polityka historyczna ==\nTerminy te łączą się ze sobą, nie są jednak tożsame.\
      \ Polityka historyczna jest związana z działaniem państwa i instytucjonalizacją\
      \ pamięci. Do jej przejawów należy m.in. stawianie pomników, tworzenie muzeów\
      \ i organizowanie oficjalnych uroczystości. Kulturę pamięci można rozumieć szerzej:\
      \ jako strukturalne, społeczne i kulturowe ramy, w których uprawiana jest polityka\
      \ historyczna oraz tworzone są reprezentacje historii. Tak więc kultura pamięci\
      \ pewnej grupy istnieje również w sytuacji, gdy owa grupa nie dysponuje własnymi\
      \ organami państwowymi, lub gdy te istniejące nie reprezentują jej sposobu postrzegania\
      \ przeszłości.\n== Europejska kultura pamięci ==\nW wielu krajach Europy Zachodniej\
      \ kultura pamięci stała się niemal synonimem pamięci o Holokauście i ofiarach\
      \ II wojny światowej. Na tej podstawie próbowano ufundować wspólną europejską\
      \ kulturę pamięci. Momentem przełomowym była Międzynarodowa Konferencja w Sztokholmie\
      \ w 2000 roku poświęcona Holokaustowi, gdzie wskutek wspólnych wysiłków wielu\
      \ rządów Zagładę Żydów uznano za negatywne, lecz wspólne dziedzictwo europejskie.\
      \ Dzień 27 stycznia, rocznicę wyzwolenia obozu w Auschwitz, ogłoszono w wielu\
      \ krajach Unii Europejskiej oficjalnym Międzynarodowym Dniem Pamięci o Ofiarach\
      \ Holokaustu.\nJednocześnie państwa byłego bloku wschodniego domagają się upamiętnienia\
      \ na równych prawach własnych ofiar poniesionych w walce zarówno z narodowym\
      \ socjalizmem, jak i komunizmem. Opór budzi akcentowanie okrucieństwa tylko\
      \ jednego z systemów totalitarnych i przyznawania szczególnej roli ofiar wyłącznie\
      \ Żydom. Przykładem owego rozdźwięku pomiędzy wschodem i zachodem Europy może\
      \ być tu przemówienie łotewskiej minister spraw zagranicznych Sandry Kalniete\
      \ z 24 marca 2004 roku, w którym postulowała uznanie, że systemy nazistowski\
      \ i komunistyczny były równie zbrodnicze. Spotkało się ono z silną krytyką w\
      \ niemieckich mediach – aż do ryczałtowego oskarżenia państw Europy Środkowo-Wschodniej\
      \ o antysemityzm. Po rozszerzeniu Unii Europejskiej o Polskę, Czechy, Słowację,\
      \ Węgry, Słowenię i państwa bałtyckie dyskusja była kontynuowana i podejmowano\
      \ próby zintegrowania odmiennych kultur pamięci. Krokiem w tym kierunku było\
      \ chociażby ustanowienie przez Parlament Europejski Europejskiego Dnia Pamięci\
      \ Ofiar Stalinizmu i Nazizmu, który przypada 23 sierpnia – w rocznicę podpisania\
      \ paktu Ribbentrop-Mołotow. Claus Leggewie postulował w 2009 roku stworzenie\
      \ europejskiej kultury pamięci opartej na 7 kręgach: Holocaust jako negatywny\
      \ mit założycielski, sowiecki komunizm, wypędzenia, kwestia ormiańska, peryferia\
      \ Europy, Europa jako kontynent migracji, europejska historia sukcesu po 1945\
      \ roku. Pomysł oparcia się na wspólnym doświadczeniu wysiedleń jest reakcją\
      \ na ich polityczne wykorzystywanie przez niemieckich wypędzonych i reprezentującą\
      \ ich Erikę Steinbach. Na tej glebie wyrosła idea stworzenia międzynarodowej\
      \ inicjatywy Europejskiej Sieci Pamięć i Solidarność, powołanej do badanie,\
      \ dokumentowania oraz upowszechnienia wiedzy na temat historii Europy XX wieku\
      \ i sposobów jej upamiętniania.\n== Zobacz też ==\n- Pamięć zbiorowa, Świadomość\
      \ historyczna, Polityka historyczna\n== Przypisy ==\n== Bibliografia ==\n- A\
      \ European Memory? Contested Histories and Politics of Rememberance, red. Małgorzata\
      \ Pakier, Bo Stråth, New York, Oxford: Berghahn Books 2010.\n- Assmann Aleida:\
      \ Między pamięcią a historią. Antologia, red. Magdalena Saryusz-Wolska, Warszawa:\
      \ Wydawnictwa Uniwersytetu Warszawskiego 2013.\n- Cornelißen Christoph: Co to\
      \ znaczy kultura pamięci? Pojęcie – metody – perspektywy, tłum. Ewa Bagłajewska-Miglus\
      \ (maszynopis) (na podstawie: Christoph Cornelißen: „Was heißt Erinnerungskultur?\
      \ Begriff – Methoden – Perspektiven”, Geschichte in Wissenschaft und Unterricht\
      \ 54 [2003], s. 548–563).\n- Cornelißen Christoph: Erinnerungskulturen, Version:\
      \ 2.0, [w:]: Docupedia-Zeitgeschichte, 22.10.2012, http://docupedia.de/zg/Erinnerungskulturen_Version_2.0_Christoph_Corneli.C3.9Fen?oldid=84892.\n\
      - Erll Astrid: Kollektives Gedächtnis und Erinnerungskulturen: Eine Einführung,\
      \ Stuttgart: J. B. Metzler 2005.\n- Leggewie Claus: Wielkie narracje, „Dziennik:\
      \ Europa”, 6-7.06.2009, s. 10–12.\n- Geschichtspolitik in Europa seit 1989.\
      \ Deutschland, Frankreich und Polen im internationalen Vergleich, red. Etienne\
      \ François, Kornelia Kończal, Robert Traba, Stefan Troebst, Göttingen: Wallstein\
      \ Verlag 2013.\n- Łuczewski Michał, Bednarz-Łuczewska Paulina: Memory cultures\
      \ and politics of history. A plea for Polish-Russian cooperation, „Inter”, 2011/\
      \ 6, s. 7–13.\n- Modi Memorandi. Leksykon kultury pamięci, red. Magdalena Saryusz-Wolska,\
      \ Robert Traba, współpraca: Joanna Kalicka, Warszawa: Scholar 2014.\n- Kalniete\
      \ Sandra: Altes Europa, Neues Europa. Rede zur Eröffnung der Leipziger Buchmesse\
      \ am 24. März 2004, http://www.die-union.de/reden/altes_neues_europa.htm\n-\
      \ Troebst Stefan: Postkommunistische Erinnerungskulturen im östlichen Europa:\
      \ Bestandaufnahme, Kategorisierung, Periodisierung = Postkomunistyczne kultury\
      \ pamięci w Europie Wschodniej: stan, kategoryzacja, periodyzacja, tłum. Piotr\
      \ Buras, Wrocław: Wydawnictwo Uniwersytetu Wrocławskiego 2005."
