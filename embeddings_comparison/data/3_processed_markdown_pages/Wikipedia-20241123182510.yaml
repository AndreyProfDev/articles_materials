  - content: 'Psychohistoria – szczegółowa dziedzina z pogranicza historii i psychologii,
      odwołująca się do orientacji psychodynamicznej w psychologii, w szczególności
      do psychoanalizy. Termin ten może również oznaczać zainteresowanie przebiegiem
      osobniczego rozwoju jednostki historycznie zlokalizowanej.

      Psychohistorię tworzyli i tworzą głównie profesjonalni psychoanalitycy z zainteresowaniami
      historycznymi (wzorem może być tu sam Zygmunt Freud, jego kontynuator Erik Erikson,
      kulturalista Erich Fromm), zdecydowanie rzadziej profesjonalni historycy po
      treningu psychoanalitycznymWiktor Werner, Psychologiczne Inspiracje w badaniach
      regionalnych, Perspektywy i możliwości. [w:] Maksymilian Grzegorz [red.] Historiograficzna
      prognoza 2000, Bydgoszcz 2000, s. 193 – 207.

      Psychohistoria rozwijała się intensywnie w USA w latach 60. i 70. XX w., obecnie
      ma niewielu zwolenników. Większość prac psychohistorycznych to psychobiografie,
      np. Eine Kindheitserinnerung des Leonardo da Vinci (Leonarda da Vinci wspomnienie
      z dzieciństwa) Zygmunta Freuda (1910), Young Man Luther (Młody Luter) Erika
      Eriksona (1958). Krytycy psychohistorii zwracają uwagę na ahistoryczność podstawowych
      kategorii stosowanych do badania postaci i zdarzeń historycznych, a zatem na
      logiczną i metodologiczną niespójność tego rodzaju badańWiktor Werner, Historyczność
      kultury. W poszukiwaniu myślowego fundamentu współczesnej historiografii, Wydawnictwo
      Naukowe UAM, Poznań 2009, s. 15.

      Na żadnej uczelni nie ma katedr psychohistorii, chociaż niektóre katedry historii
      prowadzą w tym zakresie zajęcia. Psychohistoria pozostaje kontrowersyjną dziedziną
      nauki, spotykającą się z krytyką w środowisku akademickim, przy czym krytycy
      nazywają ją pseudonaukąEysenck, Hans: Zmierzch i upadek imperium Freuda, Kraków:
      WiR Partner 2002, ss. 195.

      == Przypisy ==

      == Bibliografia ==

      - Tomasz Pawelec, Dzieje i nieświadomość. Założenia teoretyczne i praktyka badawcza
      psychohistorii, Katowice 2004

      - Wiktor Werner, Psychologiczne Inspiracje w badaniach regionalnych, Perspektywy
      i możliwości. [w:] Maksymilian Grzegorz [red.] Historiograficzna prognoza 2000,
      Bydgoszcz 2000, s. 193 – 207.

      - Wiktor Werner, Refleksja nad możliwością zastosowania kategorii nieświadomości
      w historiografii. [w:] Alina Motycka, Wojciech Wrzosek [red.] „Nieświadomość
      jako kategoria filozoficzna.” Warszawa 2000, s. 288 – 294'
