  - content: 'Discovery Historia (dawniej Discovery TVN Historia) – telewizyjny kanał
      tematyczny o tematyce historycznej. Powstał przy współpracy programowej Discovery
      i TVN, do których także należał do 30 maja 2009 roku. 30 maja 2009 roku prawdopodobnie
      z powodu światowego kryzysu finansowego TVN, który był udziałowcem Discovery
      Historia, zdecydował się wycofać z inwestycji. Nie podano oficjalnego powodu
      odsprzedania udziałów, w komunikatach poinformowano jedynie o chęci włączenia
      kanału do portfolio Discovery Networks. Discovery Historia była kolejnym obok
      TVN Med i TVN Lingua kanałem, z którego w 2009 roku wycofał się TVN, wcześniej
      zrezygnowano z emisji TVN Gra. Stacją kieruje Barbara Bilińska-Kępa.

      == Oferta programowa ==

      Ramówkę wypełniają produkcje dokumentalne dotyczące historii Polski i świata,
      takie jak:

      === produkcje i koprodukcje TVNInformacje za bazą witryny https://filmpolski.pl/fp/index.php,
      chyba że podano inaczej. ===

      - Wrzesień 1939 (2007)

      - Było, nie było (2007-2008)

      - Młodość Jana Pawła IIW bazie Filmpolski ten dwuczęściowy dokument został wpisany
      jako dwie osobne produkcje: „Lolek” oraz „Przyniósł nam światło prawdziwe” (reż.
      Joanna Maro). (2007, 2008)

      - Wkoło Wisły (2007-2008)

      - Zwarte szeregi, czyli z archiwum Czołówki (2007-2008)

      - Bitwy żołnierza polskiego (2008-?)

      - Córki przestworzy (2008)

      - Historie lotnicze (2008)

      - Go west (2008)

      - Początki polskiej awiacji (2008)

      - Socjalistyczna Filmoteka Powiatowa (2008)

      - Wielka wojna na wschodzie (2008)

      - W imieniu Polski Ludowej (2008)

      - Listy z płonącej Warszawy (2009)

      Emitowane są też popremierowo produkcje dla Canal+ Dokument.

      === produkcje zagraniczne ===

      - Pola Bitew

      - Nieznane oblicza wielkich polityków

