- sections:
  - content: "Społeczeństwo – podstawowe pojęcie socjologiczne, jednakże niejednoznacznie\
      \ definiowane. Terminem tym tradycyjnie ujmuje się dużą zbiorowość społeczną,\
      \ zamieszkującą dane terytorium, posiadające wspólną kulturę, wspólną tożsamość\
      \ oraz sieć wzajemnych stosunków społecznych. Społeczeństwo ponadto posiada\
      \ własne instytucje pozwalające mu na funkcjonowanie oraz formę organizacyjną\
      \ w postaci państwa, narodu lub plemienia.\nTermin ten w mowie potocznej często\
      \ stosuje się dość swobodnie określając różne kategorie czy warstwy społeczne\
      \ np. „społeczeństwo górników”, „społeczeństwo nauczycieli”. Używa się go też\
      \ na określenie całej żyjącej ludzkości, wówczas używa się określenia społeczeństwo\
      \ globalne.\n== Typologia społeczeństw ==\nZe względu na duże różnice pomiędzy\
      \ współczesnymi i historycznymi społeczeństwami wyróżnia się ze względu na stopień\
      \ rozwoju społeczeństwa:\n- tradycyjne \n- przemysłowe \n- poprzemysłowe\nW\
      \ przypadku społeczeństw tradycyjnych, terminem tym określa się formy społeczeństw\
      \ przedindustrialnych i wyróżnia się różne formy ich rozwoju:\n- społeczeństwo\
      \ acefaliczne\n- społeczeństwo zbieracko-myśliwskie\n- społeczeństwo rolnicze\n\
      - społeczeństwo pierwotne.\nKarol Marks wyróżniał dla tego okresu trzy następujące\
      \ po sobie formacje społeczne: formację wspólnoty pierwotnej, formację niewolniczą\
      \ (formacja antyczna i azjatycka) oraz formację feudalną.\nW okresie formowania\
      \ się społeczeństw przemysłowych powstawały takie jego określenia jak:\n- społeczeństwo\
      \ masowe\n- społeczeństwo obywatelskie\n- społeczeństwo otwarte\n- społeczeństwo\
      \ nowoczesne i ponowoczesne\n- społeczeństwo pluralistyczne\n- społeczeństwo\
      \ wielokulturowe\n- społeczeństwo demokratyczne\n- społeczeństwo komunistyczne\n\
      - społeczeństwo totalitarne\n- społeczeństwo klasowe\n- społeczeństwo kapitalistyczne\n\
      - społeczeństwo produkcyjne\n- społeczeństwo miejskie\n- społeczeństwo wiejskie.\n\
      W przypadku społeczeństwa poprzemysłowego, które powstawać zaczęło w drugiej\
      \ połowie XX wieku, używa się też alternatywnych pojęć: \n- globalna wioska\
      \ \n- społeczeństwo informacyjne \n- społeczeństwo wiedzy\n- społeczeństwo mądrości\n\
      - społeczeństwo innowacyjne\n- społeczeństwo transgresyjne\n- społeczeństwo\
      \ ponowoczesne\n- społeczeństwo konsumpcyjne\n- społeczeństwo permisywne\n-\
      \ społeczeństwo ryzyka\n- społeczeństwo sieciowe.\nW literaturze pojawia się\
      \ również określenie społeczeństwa zwierzęcego na odróżnienie uspołecznionych\
      \ zbiorowości ludzkich od nieuspołecznionych zbiorowości tworzonych przez inne\
      \ gatunki w ujęciu biologicznym.\n== Społeczeństwo a technika ==\nIstnieją trzy\
      \ sposoby pojmowania stosunków techniki ze społeczeństwem. Pierwszy sposób polega\
      \ na ukazaniu życia społecznego jako odbicia techniki lub nawet mieszania mechanizmów\
      \ instrumentalnych i ludzkości. Drugi sposób jest rozwiązaniem idealizmu lub\
      \ spirytualizmu, czyli totalnego oderwania ducha od materii. Technika jawi się\
      \ jako byt autonomiczny i złowróżbny lub jako zwykła siła w służbie człowieka.\
      \ Trzeci sposób polega na uznaniu stopnia zależności lub obojętności świata\
      \ ludzkiego względem techniki. Rozwiązanie to otwiera drogę do nauk społecznych.\
      \ Technika jawi się tutaj jako sposób bycia, tryb istnienia.\n== Zobacz też\
      \ ==\n- grupa społeczna\n- społeczność\n== Przypisy ==\n== Bibliografia ==\n\
      == Linki zewnętrzne =="
