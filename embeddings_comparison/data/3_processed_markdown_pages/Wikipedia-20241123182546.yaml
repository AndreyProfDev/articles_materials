- sections:
  - content: "Koszty społeczne – koszt ponoszony przez całe społeczeństwo. Termin\
      \ ten jest różnie interpretowany przez samych zajmujących się tym tematem. W\
      \ literaturze z obszaru rachunkowości używa się różnych terminów na opisanie\
      \ kosztów o charakterze społecznym i środowiskowym: koszty zewnętrzne, negatywne\
      \ efekty zewnętrzne, negatywne społeczne efekty zewnętrzne lub po prostu koszty\
      \ społeczne. Inna definicja opisuje je jako szkody bądź negatywne efekty wynikające\
      \ z działań bądź podejmowanych decyzji jednostki gospodarczej ponoszone przez\
      \ jednostki z tym niezwiązane. Według definicji termin \"'koszty społeczne odnosi\
      \ się do wszystkich szkodliwych następstw i uszczerbków, które ponoszą osoby\
      \ trzecie lub społeczeństwo w rezultacie procesów produkcji i za które nie jest\
      \ łatwo obarczyć odpowiedzialnością poszczególne podmioty prawna i fizyczne”.\
      \ \nZalicza się do nich: degradację środowiska, hałas i skutki estetyczne, resztkowe\
      \ emisje do powietrza i wody, długoterminowe usuwanie odpadów, za które firmy\
      \ nie ponoszą odpowiedzialności prawnej, oraz niekorzystny wpływ na ludzi, ich\
      \ własność i dobrobyt, nieskompensowane skutki zdrowotne, zmianę lokalnej jakości\
      \ życia, którą nie zawsze można zrównoważyć za pomocą systemów prawnych. \n\
      Określenie w ekonomii obejmuje wszystkie bezpośrednie i pośrednie straty poniesione\
      \ przez osoby trzecie lub całe społeczeństwo w rezultacie działalności ekonomicznej\
      \ poszczególnych przedsiębiorstw.\n== Przykład kosztów społecznych ==\n=== Społeczne\
      \ koszty stosowania kary pozbawienia wolności ===\nDo społecznych kosztów stosowania\
      \ wobec przestępców kary pozbawienia wolności należą:\n- bezpośrednie koszty\
      \ budowy oraz utrzymania więzienia,\n- koszty personelu,\n- koszty alternatywy\
      \ utraconej wydajności uwięzionych ludzi.\n=== Społeczne koszty wstrzymania\
      \ budowy obwodnicy Augustrowa ===\nPoliczono także koszty społeczne, a więc\
      \ te, które poniesie określona grupa ludzi, głównie użytkowników tych dróg oraz\
      \ mieszkańców Wasilkowa i Augustowa. Liczono je jako utratę korzyści związanych\
      \ z korzystaniem z obwodnicy, wynikających ze zmniejszenia kosztów eksploatacji\
      \ pojazdów, czasu przejazdu, emisji zanieczyszczeń i hałasu na terenie zabudowanym,\
      \ wypadków drogowych i ofiar, a także z obniżenia wartości nieruchomości. Tak\
      \ rozumiane koszty społeczne wstrzymania na jeden rok budowy obwodnicy Wasilkowa\
      \ wynoszą co najmniej 48 mln zł, zaś obwodnicy Augustowa – 98 mln zł. Koszty\
      \ społeczne związane ze zmianą przebiegu drogi – opracowanie dokumentacji, wywłaszczenie\
      \ i budowa drogi – szacowane dla obwodnicy Wasilkowa, przy pięciu latach opóźnienia,\
      \ wyniosą 188,5 mln zł, a dla obwodnicy Augustowa, przy siedmiu latach opóźnienia\
      \ (inna skala wywłaszczeń) – 2208 mln zł. Tyle społeczeństwo kosztuje wąskie,\
      \ obiektowo-konserwatorskie, a nie procesowe podejście do ochrony środowiska.\n\
      === Koszty społeczne nadużywania alkoholu w Polsce ===\nPaństwowa Agencja Rozwiązywania\
      \ Problemów Alkoholowych wyceniła koszty społeczno-ekonomiczne wynikające z\
      \ nadużycia alkoholu przez Polaków aż na 30,9 mln zł rocznie. przedwczesna śmiertelność.\
      \ Według PARPA, tylko w tym wypadku koszty wynoszą 25,8 mld zł. Dla żadnej innej\
      \ kategorii skutków nie przekraczają one 1 mld zł.\n=== Społeczny koszt węgla\
      \ ===\nSpołeczny koszt węgla (SCC) to krańcowy koszt skutków spowodowanych emisją\
      \ jednej dodatkowej tony gazu cieplarnianego (ekwiwalent dwutlenku węgla) w\
      \ dowolnym momencie, obejmujący \"nierynkowe\" skutki dla środowiska i zdrowia\
      \ ludzkiego. Celem ustalenia ceny za tonę emitowanego CO2 jest pomoc decydentom\
      \ lub innym ustawodawcom w ocenie, czy polityka mająca na celu ograniczenie\
      \ zmian klimatu jest uzasadniona. Społeczny koszt emisji dwutlenku węgla to\
      \ kalkulacja skoncentrowana na podejmowaniu działań naprawczych w zakresie zmian\
      \ klimatu, które można uznać za formę zawodności rynku. Najnowsze badania szacują\
      \ koszty ponad 300 USD za tonę CO 2 (/tCO2). Międzyrządowy Zespół ds. Zmian\
      \ Klimatu zasugerował, że cena emisji dwutlenku węgla ze 135 USD do 5 500 USD\
      \ / tCO2 w 2030 r. i z 245 USD do 13 000 USD w 2050 r. (2010 USD) byłaby potrzebna,\
      \ aby doprowadzić do emisji dwutlenku węgla, aby utrzymać się poniżej limitu\
      \ 1,5 ° C. \n== Przypisy ==\n== Zobacz także ==\n- Efekty zewnętrzne\n- Problem\
      \ kosztów społecznych"
    title: Main
  title: Koszty społeczne
