  - content: 'Społeczeństwo w polskojęzycznej Wikipedii

      W tym portalu prezentujemy wybrane zagadnienia dotyczące społeczeństwa. Niektóre
      obszary wiedzy (np. dotyczące organizacji czy ruchów społecznych) nie zostały
      zaprezentowane w postaci zbiorczych portali, ale można je znaleźć w ogólnej
      kategorii dotyczącej społeczeństwa. Jeżeli uważasz, że brakuje jakiejś dziedziny
      wiedzy, albo chciałbyś pomóc w opiece nad którymś z portali, zapraszamy na stronę
      dyskusji.

      Po prawej stronie znajdują się kategorie poszczególnych dziedzin wiedzy. Zaprezentowane
      zostały też wyróżnione, głównie ze względu na jakość, artykuły oraz ilustracje.

      Będziemy wdzięczni za Twoją pomoc, szanowny czytelniku, w rozwijaniu artykułów
      związanych z poniżej przedstawionymi naukami. Przy każdej z nich zamieściliśmy
      odpowiednie strony odnoszące się do współpracy. Zapraszamy także do wikiprojektów.'
