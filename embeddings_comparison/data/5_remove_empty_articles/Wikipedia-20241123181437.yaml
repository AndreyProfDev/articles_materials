  title: Niewolnictwo Słowian
- sections:
  - content: Pełny proces chrystianizacji w państwie Bułgarskim rozpoczął się przyjęciem
      chrztu przez cara Borysa I Michała, natomiast najwcześniejsze wspólnoty chrześcijańskie
      pojawiły się na tych terenach już w pierwszych wiekach po Chrystusie. Nie istnieje
      jedna dokładna data czasu i miejsca tego wydarzenia, natomiast według większości
      historyków stało się to w 864/865 roku. Zdaniem tradycyjnej historiografii bułgarskiej
      chrzest datuje się go na noc 25 maja 866 roku w Plisce, gdzie car Borys I przyjął
      imię Michał na cześć swojego ojca chrzestnego Michała III.
    title: Main
  - content: 'Trudno wskazać jednoznaczne przyczyny, które skłoniły cara Borysa I
      do rozpoczęcia procesów chrystianizacyjnych Bułgarii. Warto jednak wymienić
      takie jak:

      - Czynnik państwowy: pogaństwo, które było obecne w Bułgarii, nie miało takiej
      siły przebicia jak chrześcijaństwo- trudno było scentralizować ludzi różnych
      kultów

      - Chęć wzmocnienia autorytetu władcy: idea władcy jako pomazańca Bożego stanowiła
      przeciwwagę dla rozwijających się tendencji odśrodkowych środowisk bojarskich

      - Polepszenie funkcjonowania państwa: chrześcijaństwo krzewiło w społeczeństwie
      dobre postawy takie jak umiejętność czytania i pisania, które w konsekwencji
      doprowadzą do postępu kulturalnego

      - Osobiste względy: istnieje źródło mówiące o wielkim głodzie, jaki panował
      w Bułgarii, który został zakończony z racji modlitwy Borysa do Boga chrześcijan
      (rzekomo samego chana modlitwy nauczył grecki niewolnik Teodor Cupharas)

      - Główną przyczyną był kapitulacja Borysa wobec potęgi bizantyjskiej cesarza
      Michała III i podpisanie wieczystego aktu pokoju pomiędzy Bizancjum a Bułgarią
      w 864 roku. Cesarz zażądał także zerwania stosunków związanych z przyjęciem
      chrześcijaństwa od Franków.'
    title: Geneza przyjęcia chrztu
  - content: 'Pierwsze wspólnoty chrześcijańskie pojawiły się na terenie obecnej Bułgarii
      już w pierwszych wiekach naszej ery. Zjednoczone państwo Bułgarii zostało założone
      w VII z połączenia napływowych grup Słowian oraz koczowniczych plemion Protobułgarów
      znad Wołgi. Terenami tymi interesował się od początku kościół bizantyjski chcący
      rozszerzyć tam swoją strefę wpływów- stąd też zostały zawarte układy Bizancjum
      z Bułgarią, których konsekwencją było zaproszenie przez Cesarza Michała III
      w ramach podpisanego aktu pokoju posłów Bułgarskich, którzy zostali ochrzczeni
      w Konstantynopolu, a następnie wysłani z powrotem do kraju wraz z duchownymi
      bizantyjskimi, którzy mieli przygotować cara Borysa I oraz pogan do chrztu.

      Kiedy jednak Cesarz i patriarcha Konstantynopola Focjusz nie zgodzili się na
      utworzenie niezależnego Kościoła Bułgarskiego, chan Borys zwrócił się do papiestwa
      z prośbą o przysłanie duchowieństwa łacińskiego. Po drugich pertraktacjach i
      walkach pomiędzy papieżem Mikołajem I a Patriarchą Focjuszem Borys I zawarł
      ugodę z Bizancjum na synodzie kościelnym ma mocy której zrzekł się pretensji
      do własnego patriarchatu bułgarskiego, uznał zwierzchnią władzę Konstantynopola
      i zadowolił się uzyskaniem szerokiej autonomii kościelnej dla Bułgarii. Arcybiskup
      Bułgarski stał się zależny bezpośrednio od synodu kościoła greckiego, a sam
      Borys I zdobył tytuł króla.

      Oficjalny akt chrystianizacji nie oznaczał jednak natychmiastowego przyjęcia
      chrześcijaństwa przez ogół społeczeństwa, a jedynie początek długotrwałego procesu
      zastępowania dawnych wierzeń pogańskich jedną religią.'
    title: Proces chrystianizacji
  - content: 'Nowo powstała bułgarska prowincja kościelna obejmowała biskupstwa: ochrydzkie
      w zachodniej i bregalnickie we wschodniej części Macedonii, morawskie w dolinie
      Południowej Morawy i kilka innych położonych w głównych grodach bułgarskich.
      Według niektórych źródeł sam chan Borys wzniósł w ramach chrystianizacji siedem
      cerkwi katedralnych, w tym jedną zbudowaną na wzór bazyliki Św. Piotra i Pawła
      w Rzymie znajdującą się w Plisce, której długość wynosiła około 99m a szerokość
      prawie 30m.

      Początkowo Kościół bułgarski uzależniony był od duchowieństwa greckiego i kultury
      bizantyjskiej, a rozwój jego struktur nastąpił około 866 roku, kiedy to na terytorium
      Bułgarii przybyli uczniowie św. Metodego: Klemens i Naum, którzy objęli godności
      kościelne w Pisce i Presławiu (stara i nowa stolica Bułgarii). Rozpoczęli oni
      misję chrystianizacyjną, w której opierali się na przywiezionych ze sobą księgach
      liturgicznych spisanych alfabetem głagolickim i cyrylicą. To właśnie dzięki
      nim spisano żywot świętych Cyryla i Metodego, stworzono ochrydzką szkołę piśmiennictwa
      słowiańskiego, która szerzyła wpływy kultury słowiańskiej i kościoła bułgarskiego
      na pograniczu Macedonii i Albanii Północnej, czy upowszechniono literaturę słowiańską
      przez ośrodki klasztorne.

      W 889 roku król Borys I ogłosił swoją abdykację, pozostawiając tron swojemu
      najstarszemu synowi Włodzimierzowi, sam natomiast osiadł prawdopodobnie w klasztorze
      świętego Pantalejmona pod Piresławiem.'
    title: Powstanie nowych prowincji kościelnych
  - content: 'Książę Włodzimierz okazał się zdecydowanym przeciwnikiem rządów prowadzonych
      przez swojego ojca, rozpoczynając tym samym własną, antychrześcijańską politykę
      popartą przez starą opozycję wielkobojarską żyjącą nadal według wierzeń i tradycji
      pogańskich. Rozpoczęły się prześladowania chrześcijan zakończone powrotem Borysa
      I, który w 893 roku zdetronizował, oślepił i wtrącił do więzienia Włodzimierza,
      a następnie osadził na tronie swojego młodszego syna Symeona podczas zjazdu
      dostojników świeckich i kościelnych w Presławiu (do którego przeniesiono stolicę
      z kojarzącej się z pogańskimi tradycjami Pliski).

      W 894 roku zakończono przekład ksiąg liturgicznych na język słowiański, co doprowadziło
      do tego, iż język słowiański zaczął być powszechnie używanym zarówno w kościele,
      jak i państwie bułgarskim.'
    title: Reakcja pogańska 889 roku
  - content: '- Umocnienie pozycji Bułgarii na arenie międzynarodowej oraz jej ewolucja
      jako państwa od chanatu do królestwa

      - Utworzenie niezależnego Kościoła bułgarskiego

      - Rozpowszechnienie pisma słowiańskiego (cyrylicy i głagolicy)

      - Wprowadzenie Chrześcijaństwa pociągnęło za sobą rewizję poglądów Bułgarów
      oraz stopniowe przejmowanie nowych zasad i wierzeń'
    title: Skutki chrystianizacji
  - content: '- T. Wasilewski, Historia Bułgarii, Wrocław 1988

      - R.G. Roberson, The Eastern Christian Churches, Roma 1990

      - S. Waklinow, Kultura Starobułgarska, 1984'
    title: Bibliografia
  title: Chrystianizacja Bułgarii
- sections:
  - content: Iroszkoci – współczesna nazwa wczesnośredniowiecznych celtyckich wyznawców
      Kościoła iroszkockiego zamieszkujących Irlandię oraz Szkocję.
    title: Main
  - content: 'We wczesnym średniowieczu Irlandia określana była w łacińskich źródłach
      jako "Szkocja" lub Hibernia, a jej mieszkańcy byli nazywani Szkotami (Scotti).
      Dzisiejsza Szkocja nazywana była wtedy Kaledonią lub Albanią, a zamieszkiwali
      ją Piktowie. Szkoci z Irlandii stopniowo jednak zasiedlali obszar Kaledonii,
      dokonując tam także ekspansji politycznej i religijnej. W konsekwencji zaczęto
      ten region nazywać Scotia minor (Szkocja mniejsza), a w końcu po prostu Szkocja.

      Nazwa "Iroszkoci" jest używana przez współczesnych historyków w niektórych krajach
      (np. w Polsce czy w Niemczech) na oznaczenie tego iryjskiego wczesnośredniowiecznego
      ludu, cechującego się odrębną kulturą i własną formą chrześcijaństwa.'
    title: Nazwa
  - content: "Marginalne położenie Irlandii zapewniło jej względne bezpieczeństwo\
      \ i umożliwiło rozkwit bogatej kultury artystycznej i intelektualnej. Dzięki\
      \ temu Iroszkoci zajęli szczególnie istotne miejsce w rozwoju kultury i religijności\
      \ wczesnego średniowiecza i mieli duże znaczenie w utrwaleniu kultury antycznej\
      \ w średniowieczu. W V i VI w. założyli wiele klasztorów, które w VII i VIII\
      \ w. stały się centrum akcji misyjnej sięgającej Saksonii, Bawarii, Austrii,\
      \ Italii, Skandynawii. Chrześcijaństwo iroszkockie konkurowało w VI-VII w. z\
      \ innymi formami chrześcijaństwa (kościołem rzymskim i starobrytyjskim). \n\
      Iroszkoci mieli też duży wpływ na renesans karoliński.\nKoniec kulturze iroszkockiej\
      \ położyły najazdy Normanów w VIII i IX w."
    title: Kultura iroszkocka
  - content: '- św. Patryk

      - Finian z Clonard

      - Dwunastu apostołów Irlandii, m.in. św. Kolumba

      - Brendan Żeglarz

      - Seduliusz Szkot

      - Marcin Iryjczyk

      - Jan Szkot Eriugena'
    title: Znaczący Iroszkoci
  title: Iroszkoci
- sections:
  - content: Rozdrobnienie feudalne – proces polityczny występujący w państwach o
      ustroju feudalnym, polegający na spadku znaczenia władzy centralnej kosztem
      jednostek władzy lokalnej, prowadzący do usamodzielnienia się tych jednostek
      i de facto rozbicia państwa na mniejsze organizmy polityczne. Proces rozdrobnienia
      feudalnego rzadko jednak prowadził do rozpadu państwa na gruncie de iure, co
      sprzyjało rozwijaniu się idei zjednoczeniowych nawet po kilkusetletnich okresach
      rozbicia.
    title: Main
  - content: 'Po kryzysie i upadku Cesarstwa Rzymskiego doszło w Europie do znaczącego
      regresu cywilizacyjnego, którego jednym z przejawów był upadek znaczenia miast
      i obrotu pieniężnego w gospodarce. Zjawisko to wytworzyło problem ze sposobem
      opłacania żołnierzy przez władców królestw powstałych na gruzach dawnego cesarstwa,
      który pogłębił się wraz ze spadkiem liczby i intensywności konfliktów zbrojnych
      w następnych wiekach, a co za tym idzie, zmniejszeniem ilości zdobywanych łupów
      wojennych.

      W takich warunkach zaczął się kształtować system feudalny, w którym władcy w
      zamian za służbę wojskową nadawali członkom swojej drużyny ziemię wraz ze zobowiązaną
      do świadczenia na niej pracy ludnością, tak aby wojowie mogli samodzielnie utrzymywać
      się z czerpanych w ten sposób pożytków. Powstali w ten sposób wasale, często
      rozdzielali przyznaną im ziemię na mniejsze części innym lennikom w zamian za
      ich służbę wojskową wobec siebie samych. W ten sposób ukształtowała się charakterystyczna
      dla społeczeństwa średniowiecznego hierarchia nazywana drabiną feudalną. Wasalowie
      władcy na zarządzanych przez siebie terenach posiadali dużą autonomię, w ramach
      której często mogli tworzyć i egzekwować lokalne prawa.

      Powstały w ten sposób system, charakteryzował się bardzo silną pozycją lokalnych
      ośrodków władzy, natomiast spoistość państw utrzymywała się często głównie dzięki
      autorytetowi i sile militarnej panującego władcy. W sytuacjach, gdy czynnik
      ten z jakichś powodów (np. zewnętrznej inwazji lub konfliktu dynastycznego)
      ulegał osłabieniu lub zniknięciu, feudałowie wykorzystywali sytuację do poszerzenia
      przysługującej im władzy. Z czasem w ten sposób udawało się lokalnym władcom
      uzyskać pełną lub niemal pełną suwerenność nad zarządzanym przez siebie terytorium
      i prowadzić politykę niezależną od władzy centralnej.'
    title: Przyczyny
  - content: 'Przebieg rozdrobnienia feudalnego mógł przyjąć formę zarówno długotrwałego
      i stopniowego procesu osłabiania się władzy centralnej kosztem ośrodków władzy
      lokalnej, jak i stanowić skutek stosunkowo nagłego załamania się władzy monarchy
      całego państwa. W przypadku rozdrobnienia postępującego stopniowo, trend umacniania
      się wpływów lokalnych feudałów czy komun miejskich mógł trwać nawet wiele stuleci
      i odbywać się poprzez przyznawane przez władcę przywileje, konflikty zbrojne
      czy kształtowanie się praw zwyczajowych. W przypadku takiego procesu, okresowo
      mogły zdarzać się także okresy umacniania się władzy monarszej. Najczęściej
      jednak nie prowadziły one do zatrzymania czy wręcz odwrócenia rozdrobnienia
      feudalnego państwa. Przykładem stopniowego procesu rozdrobnienia feudalnego
      może być Święte Cesarstwo Rzymskie.

      Upadek znaczenia władzy centralnej mógł również przyjąć formę zdarzenia nagłego,
      chociaż zawsze musiał być poprzedzony silną pozycją lokalnych zarządców. Takim
      zdarzeniem inicjującym proces rozdrobnienia feudalnego mógł być np. spór dynastyczny
      czy zewnętrzna inwazja, zakończona porażką władzy centralnej. Przykładami takich
      zdarzeń może być zabójstwo np. Leszka Białego, które spowodowało upadek zasady
      senioratu w Polsce lub zdobycie Konstantynopola przez krzyżowców w 1204 roku,
      skutkujące rozpadem władzy centralnej w Bizancjum.

      Nawet państwa w fazie bardzo zaawansowanego i trwającego wiele stuleci procesu
      rozdrobnienia feudalnego potrafiły zachować wspólnotę kulturową i poczucie wspólnej
      tożsamości, czego przykładem mogą być Włochy, w których pomimo istniejącego
      1400 lat rozbicia, przez cały ten okres pojawiały się idee unifikacyjne, które
      ostatecznie ziściły się w XIX wieku w konsekwencji włoskiego odrodzenia narodowego.'
    title: Przebieg
  - content: 'Zjawisko rozdrobnienia feudalnego przyczyniało się do osłabienia siły
      militarnej znajdujących się pod wpływem tego procesu państw. W konsekwencji
      takie państwa często ulegały agresji ze strony swoich sąsiadów, w wyniku czego
      mogły popaść w obcą zależność, jak Ruś po inwazji mongolskiej lub utracić część
      terytorium, jak Polska w wyniku ekspansji Czech i Zakonu Krzyżackiego. W skrajnych
      przypadkach, jak np. Bizancjum w XV wieku, osłabienie spowodowane rozdrobnieniem
      feudalnym mogło przyczynić się nawet do podboju państwa przez zewnętrznego agresora.

      Rozpad władzy centralnej sprzyjał także powstawaniu konfliktów wewnętrznych
      pomiędzy lokalnymi władcami. Konflikty takie potrafiły przyjmować formę długotrwałych
      i krwawych wojen, jak wojna trzydziestoletnia w Rzeszy Niemieckiej, która doprowadziła
      do znaczącego spustoszenia i wyludnienia wielu obszarów tego państwa.

      Rozdrobnienie feudalne często niosło za sobą również pozytywne konsekwencje.
      Okoliczność ograniczonego obszaru władania przez lokalnych feudałów sprzyjała
      prowadzeniu przez nich polityki wspierającej rozwój gospodarczy podległym im
      ziem, jako najlepszego środka do zwiększenia posiadanej potęgi i wpływów. W
      przypadku polski okres rozbicia dzielnicowego stanowił okres znaczącego wzrostu
      demograficznego i modernizacji gospodarczej, będący skutkiem prowadzonej przez
      lokalnych książąt polityki kolonizacji na prawie niemieckim. Rywalizacja pomiędzy
      poszczególnymi władztwami sprzyjała także rozwojowi gospodarczemu i kulturalnemu.
      Na przykład we Włoszech mecenat rywalizujących ze sobą na polu sztuki książąt,
      miał ogromny wpływ na rozwój tamtejszego renesansu. Rozdrobnienie feudalne pozwoliło
      także na wykształcenie się wyjątkowego dla Europy fenomenu komun miejskich,
      który miał niebagatelny wpływ na rozwój cywilizacyjny tej części świata i jej
      późniejszy sukces.'
    title: Skutki
  - content: 'Zjawisko rozdrobnienia feudalnego jest uważane z jedną cech charakterystycznych
      dla Europy w wiekach średnich. Do rozdrobnienia feudalnego doszło m.in. w poniższych
      państwach:

      - Niemcy w okresie określanym jako Kleinstaaterei, który trwał od upadku dynastii
      Hohenstaufów w XIII wieku do zjednoczenia państw niemieckich w Cesarstwo Niemieckie
      w 1871 roku;

      - Włochy w okresie od najazdu Longobardów w 568 roku aż do zjednoczenia Włoch
      w latach 1859-1870;

      - Ruś w okresie rozbicia dzielnicowego trwającego od śmierci Jarosława Mądrego
      w 1054 roku do ustanowienia Carstwa Rosyjskiego w 1547 roku;

      - Polska w okresie rozbicia dzielnicowego od śmierci Bolesława Krzywoustego
      w 1138 roku do zjednoczenia państwa przez Władysława Łokietka w 1320 roku;

      - Francja w okresie wojny stuletniej od utraty Akwitanii w 1152 roku do odzyskania
      kontroli nad Burgundią w 1477 roku;

      - Anglia w okresie określanym jako Heptarchia od VI do IX wieku;

      - Hiszpania w okresie od upadku Wizygotów w 711 roku do zjednoczenia Kastylii
      i Aragonii w 1479 roku;

      - Bizancjum w okresie od IV wyprawy krzyżowej w 1204 roku do zdobycia Trapezuntu
      przez Turków Osmańskich w 1461 roku;

      - Węgry w okresie bezkrólewia od 1301 do 1323 roku;

      - Norwegia w okresie od VIII wieku do zjednoczenia państwa przez Haralda Pięknowłosego
      w 872 roku;

      - Serbia w okresie od 1371 do 1395 roku;

      - Bułgaria w okresie od 1371 do 1396 roku.'
    title: Europa
  - content: 'Niektórzy badacze, jak np. Samir Amin uważają, że rozdrobnienie feudalne
      było zjawiskiem wyjątkowym i charakterystycznym jedynie dla kręgu kultury europejskiej.
      Inni naukowcy wskazują jednak na istnienie analogicznych zjawisk także innych
      regionach świata, czego przykładami mogą być:

      - Japonia w okresie Sengoku w latach od 1467 do 1590 roku;

      - Chiny w okresie Walczących Królestw w latach od 480 do 221 roku p.n.e. i w
      innych okresach upadku władzy centralnej;

      - Korea w okresie Trzech Królestw w latach od 57 roku p.n.e. do 668 roku n.e.

      - Sułtanat Rumu w okresie od najazdu Mongołów w 1308 roku do zjednoczenia Anatolii
      przez Imperium Osmańskie w XVI wieku;

      - Al-Andalus w okresie od upadku Kalifatu Kordoby w 1031 roku do zdobycia Grenady
      w 1492 roku.

      - Abisynia w okresie określanym jako Zemene mesafynt od 1769 do 1855 roku.'
    title: Inne kontynenty
  title: Rozdrobnienie feudalne
- sections:
  - content: Historia Sany w średniowieczu – dzieje miasta Sana, jednego z głównych
      ośrodków na terytorium współczesnego Jemenu, obejmujące okres od przyjęcia islamu
      w VII wieku, do podboju osmańskiego w XVI wieku.
    title: Main
  - content: 'Ostatni perski zarządca Sany, , przyjął islam około roku 628. Formalnie
      oznaczało to włączenie Jemenu w obręb kalifatu, jednak o trwającym jeszcze wiele
      lat oporze przed islamem na tym terenie świadczy m.in. rebelia . Prawdopodobnie
      za panowania kalifa Usmana zburzono leżący w Sanie . Być może jeszcze za życia
      Mahometa rozpoczęła się budowa , do czego posłużyły częściowo materiały pozyskane
      z Gumdanu.

      W trakcie tereny te znalazły się pod przejściowym panowaniem antykalifa Abd
      Allaha Ibn az-Zubajra. Podczas jego rządów Sana musiała zapłacić okup charydżyckiemu
      władcy . Podczas buntu ibadytów w latach 747–748 Sana została zdobyta przez
      buntowników, którymi dowodził . Kalifat zdołał stłumić powstanie i odzyskać
      kontrolę nad Jemenem.

      Na przełomie VIII i IX wieku, już za panowania Abbasydów, namiestnikiem Jemenu
      był , członek dynastii Barmakidów. Jego rządy były korzystnymi czasami rozwoju
      dla Sany.

      W trakcie IX wieku rósł wpływ na władzę lokalnych jemeńskich klanów i dynastii,
      a zależność od Abbasydów stawała się fikcyjna. W 898 roku powstał imamat zajdycki,
      organizm państwowy obejmujący swoim zasięgiem cały Jemen. Sana była jednym z
      jego głównych ośrodków.

      Od początku X wieku trwały walki między zajdyckimi władcami, a opozycją wspieraną
      przez Fatymidów. Wedle niektórych źródeł, w latach 901–913 Sana miała zostać
      zdobyta 20-krotnie, nie licząc poddań w wyniku negocjacji. W wyniku walk wiele
      jemeńskich rodów zostało osłabionych. Od 992 do 1138 roku dynastia Sulayhidów
      zarządzała znacznym obszarem Jemenu jako wasale Fatymidów.

      W 1173 roku Saladyn wysłał ekspedycję do Jemenu, która podbiła prowincję. Przez
      kolejne 35 lat władza tamże należała do Ajjubidów. Pod ich rządami Sana utraciła
      status stolicy regionu na rzecz Ta’izzu i Adenu.

      W 1229 roku ostatni Ajjubidzi rządzący Jemenem przekazali władzę dynastii Rasulidów.
      Utrzymali oni drugorzędny status Sany wobec zapewniającego wysokie zyski z handlu
      Adenu. W 1259 roku w Sanie miało miejsce trzęsienie ziemi.

      W latach 1454–1517 Rasulidów zastąpili Tahirydzi. W 1538 roku rozpoczął się
      pierwszy osmański podbój Jemenu, a w 1547 najeźdźcy zdobyli Sanę.'
    title: Historia
  - content: 'W pewnym momencie w Sanie narodził się chór wywodzący się od dwudziestu
      dwóch nawołujących do modlitwy (funkcja charakterystyczna dla regionu). Stanowił
      on muzyczne rozszerzenie liturgii i polegał na melorecytacji Koranu. W pobliżu
      miasta wydobywano także cenione w arabskim świecie rubiny, używane do produkcji
      maści czy wyrobu kielichów.

      Praktyką charakterystyczną dla południowej Arabii, obecną w pobliżu Sany, było
      budowanie sadd – zapór z otworem u dołu. Poza tym w mieście znajdowała się cytadela
      zbudowana w miejscu zamku Gumdan, wiele meczetów, łaźnie, karawanseraj oraz
      minarety.

      W 893 roku w Sanie urodził się Al-Hasan al-Hamadani, wybitny historyk, uczony
      i pisarz. W latach 1330–1331 Ibn Battuta odwiedził Sanę.'
    title: Społeczeństwo i gospodarka
