- sections:
  - content: 'Starzenie moralne – związany z szybkimi zmianami technologicznymi proces
      (zwłaszcza w elektronice i informatyce), w wyniku którego w pełni sprawny wedle
      specyfikacji sprzęt lub oprogramowanie nie spełnia już bieżących standardów
      użytkowania.

      Przykładem starzenia moralnego jest system operacyjny DOS, zastąpiony obecnie
      na rynku przez MS Windows. Innym przykładem jest magnetofon szpulowy, wyparty
      najpierw przez magnetofon kasetowy, a współcześnie przez techniki nagrywania
      na nośnikach cyfrowych, np. na dyskach optycznych, również zastępowanych przez
      odtwarzacze wykorzystujące pamięć flash.

      W przypadku budynków mówimy o zużyciu moralnym lub funkcjonalnym.'
    title: Main
  title: Starzenie moralne
- sections:
  - content: "Technika (, technē „sztuka, rzemiosło, kunszt, umiejętność”) – wytwarzanie\
      \ zjawisk i przedmiotów niewystępujących naturalnie w przyrodzie. Pojęcie techniki\
      \ bywa potocznie utożsamiane z technologią, czyli wiedzą o wytwarzaniu za pomocą\
      \ środków technicznych.\nSłowo „technika” określa też same urządzenia techniczne,\
      \ a także sposób wykonywania określonych czynności (na przykład technika gry\
      \ na skrzypcach, technika malowania obrazów, technika walki zapaśniczej). \n\
      Działalnością badawczą w dziedzinie techniki zajmują się nauki techniczne i\
      \ inżynieria. Tak zdefiniowana technika stanowi zasadniczy składnik cywilizacji.\n\
      Niektóre nauki i działalności w dziedzinie techniki:\n- akustyka\n- architektura\
      \ i urbanistyka\n- automatyka i robotyka\n- biocybernetyka i inżynieria biomedyczna\n\
      - budownictwo\n- elektronika\n- elektrotechnika\n- energetyka, w tym energetyka\
      \ jądrowa\n- geodezja i kartografia\n- informatyka\n- inżynieria materiałowa\n\
      - inżynieria procesowa\n- inżynieria środowiska\n- maszynoznawstwo\n- materiałoznawstwo\n\
      - mechanika\n- metalurgia\n- okrętownictwo\n- poligrafia\n- pożarnictwo\n- telekomunikacja\n\
      - transport"
    title: Main
