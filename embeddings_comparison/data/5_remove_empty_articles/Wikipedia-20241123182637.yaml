- sections:
  - content: 'Kanibalizacja – w technice proces polegający na pozyskiwaniu części
      zamiennych z uszkodzonych lub nieużytkowanych maszyn, stosowany w celu naprawy
      nieprodukowanych już urządzeń lub utylizacji rozbitych samochodów lub samolotów
      (np. w czasie wojny). Jest zaliczana do procesów odzyskuM. Plewa, Model systemu
      wsparcia logistycznego procesu zagospodarowania obiektów wycofanych z eksploatacji.
      Występuje w polskim lotnictwie wojskowymZbigniew Krzysztof Uchman Metoda analizy
      i oceny gotowosci technicznej wojskowych statków powietrznych, s.80, gdzie części
      pobiera się z niesprawnych statków powietrznych. MON rozważało w 2019 kanibalizację
      czołgów T-72MON zmodernizuje mniej czołgów, niż obiecał. A wyjdzie drożej. Turecka
      armia kanibalizuje czołgi Leopard 2A4Seryjna modernizacja tureckich Leopardów
      2A4.

      Kanibalizacja bywa także stosowana w okrętownictwie. Jako przykład można tutaj
      podać okręty podwodne typu Kobben, z których Polska Marynarka Wojenna nabyła
      cztery okręty jako jednostki bojowe, a piątą jako magazyn części. Podobnie postąpiła
      , która zakupiła szwedzkie okręty podwodne typu A-11B, z czego cztery zostały
      nabyte jako jednostki bojowe, a piąta („Sjöbjornen”) w celu kanibalizacjiMaciej
      S. Sobański, Marynarka Wojenna Singapuru, Okręty Wojenne, Vol. XIV, Nr 63 (1/2004),
      s. 76, przypis trzeci. W Royal Navy HMS „Eagle” był magazynem części zamiennych
      dla HMS „Ark Royal” – „Eagle” wycofano ze służby, ale pozostawał w rezerwie
      jako magazyn części dla pozostającego w służbie „Ark Royal”.'
    title: Main
  title: Kanibalizacja (technika)
- sections:
  - content: Ocena technologii (ang. Technology assessment, TA) – analiza konsekwencji
      rozwijania i stosowania określonych technologii, która jako narzędzie dostarczania
      wiedzy wspiera procesy decyzyjne, a tym samym pomaga w podejmowaniu decyzji
      politycznych.
    title: Main
  - content: "Ocena technologii ma być systematyczną i wieloaspektową ewaluacją technik\
      \ już istniejących, jak również tych planowanych czy postulowanych oraz ich\
      \ skutków bezpośrednich i kumulatywnych w różnych obszarach życia – od środowiska\
      \ przyrodniczego do struktur społecznych i politycznych. Wychodzi ona z założenia,\
      \ że technika stanowi współcześnie kluczowy składnik naturalnego środowiska\
      \ ludzkiego życia i działania. Wdrożenie określonego elementu techniki ułatwia\
      \ lub utrudnia pewne działania, wzmacnia lub zmniejsza ich skutki, umożliwia\
      \ działania dotąd niemożliwe, przekształca stosunki społeczne i wyznacza relacje\
      \ władzy, buduje ramy odniesienia dla rozumienia rzeczywistości i współdeterminuje\
      \ znaczenie rozmaitych pojęć. W konsekwencji współczesna technika oddziałuje\
      \ na różne sfery codziennego życia, kształtując zachowania indywidualne i relacje\
      \ interpersonalne. Zatem rozwijanie nowych technologii ma skutki zarówno techniczne,\
      \ jak i ekonomiczne, polityczne i moralne, a odpowiedzialność za nie ciąży nie\
      \ tylko na jej użytkownikach, ale także na projektantach, producentach, sprzedawcach\
      \ i popularyzatorach. \nPoczątki oceny technologii sięgają lat 70. XX w., gdy\
      \ przy Kongresie Stanów Zjednoczonych powstało Biuro Oceny Technologii, które\
      \ stało się pierwowzorem dla podobnych instytucji w Europie. Miało ono dokonywać\
      \ możliwie wszechstronnej oceny skutków stosowania lub rozwijania określonych\
      \ technologii (bądź też powstrzymania się od ich wykorzystywania), a wiedza\
      \ ta miała umożliwiać decydentom politycznym podejmowanie odpowiednich decyzji.\
      \ Była to odpowiedź na pojawiające się w II poł. XX w. technologie uznawane\
      \ za ryzykowne lub wręcz niebezpieczne (m.in. technologie jądrowe, biotechnologie,\
      \ nanotechnologie). Okazało się, że innowacje technologiczne obarczone są ryzykiem\
      \ występowania skutków ubocznych oraz trudnych do przewidzenia konsekwencji,\
      \ prowadząc do konfliktów społecznych wokół takich rozwiązań, jak: genetycznie\
      \ modyfikowana żywność, budowa masztów telefonii komórkowej czy budowa elektrowni\
      \ jądrowych. W zamierzeniu TA ma pełnić przede wszystkim rolę „systemu wczesnego\
      \ ostrzegania” i rozpoznawać z wyprzedzeniem szanse i ryzyko związane z daną\
      \ technologią, tak by można było zawczasu ocenić zasadność jej wdrażania."
    title: Założenia
  - content: "Nie istnieją ani specyficzne metody dla oceny technologii, ani jednolite\
      \ wzorce ekspertyz z tego obszaru. Dobór metod zależy w dużej mierze od konkretnego\
      \ przedmiotu badania i jego zakresu. Prowizoryczną typologię metod i procedur\
      \ nadających się do wykorzystania w projektach z zakresu oceny technologii można\
      \ sformułować następująco:\n- pod względem przeznaczenia metody można podzielić\
      \ na: \n-- strukturalizujące (m.in. teoria systemów i analiza systemowa, analiza\
      \ ryzyka, analiza przepływów, analiza oddziaływań, ekobilans, analiza wejście-wyjście,\
      \ analizy łańcuchów procesowych), \n-- pozyskiwania danych (m.in. metody oparte\
      \ na danych pierwotnych oraz metody oparte na danych wtórnych, takie jak kwerendy,\
      \ analizy dokumentów, wywiady z ekspertami, systemy bazodanowe), \n-- heurystyczne\
      \ (m.in. burza mózgów i sesje pomysłowości, matryce morfologiczne, metody synektyczne,\
      \ wywiady z ekspertami, metody delfickie, metody wpływów krzyżowych),\n-- prognostyczne\
      \ (m.in. metody ekstrapolacyjne, modelowanie i metody symulacyjne, metody analogiczne\
      \ oraz metody scenariuszowe),\n-- ewaluacyjne (m.in. wartościowanie socjoetyczne\
      \ i rachunek utylitarystyczny, analiza użyteczności, analiza kosztów i korzyści,\
      \ analiza opłacalności, analiza istotności, analiza drzewa wartości, analiza\
      \ i rekonstrukcja dyskursu, procedury partycypacyjne);\n- ze względu na rodowód\
      \ można wyróżnić: \n-- metody zorientowane technologicznie (m.in. szacowanie\
      \ ryzyka i metoda wartości granicznych, metoda rekonstrukcji preferencji ujawnionych,\
      \ metoda analizy preferencji wyrażonych),\n-- metody wywodzące się z ekonomii\
      \ (m.in. teorie dobrobytu, teoria wyboru publicznego, analiza marginalna, metody\
      \ wskaźnikowe wykorzystujące wskaźniki społeczne), \n-- metody zorientowane\
      \ politycznie (m.in. teorie wyboru, procedury plebiscytowe, procedury partycypacyjne,\
      \ takie jak mediacje, publiforum, jury obywatelskie, panel laików, konferencja\
      \ uzgodnieniowa (konsensualna), publifocus, komórka planowania, warsztaty przyszłości,\
      \ dyskurs kooperacyjny, metoda borykania się, metoda skanowania mieszanego),\
      \ \n-- systematyczne metody bilansowe (m.in. analiza kosztów-korzyści, analiza\
      \ korzyści i ryzyka, metody wieloatrybutowego podejmowania decyzji), \n-- modele\
      \ planistyczne (np. PPBS, Planning, Programming, and Budgeting System),\n--\
      \ metody wywodzące się z teorii systemów i analizy systemowej (m.in. metody\
      \ scenariuszowe, analiza współzależności, koncepcje potrzeb podstawowych)."
