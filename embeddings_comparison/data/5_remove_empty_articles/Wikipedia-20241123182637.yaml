- sections:
  - content: "Awaria techniczna – zgodnie z Ustawą o stanie klęski żywiołowej jest\
      \ to gwałtowne, nieprzewidziane uszkodzenie lub zniszczenie obiektu budowlanego,\
      \ urządzenia technicznego lub systemu urządzeń technicznych powodujące przerwę\
      \ w ich używaniu lub utratę ich właściwościArt. 3 ust. 1 pkt. 3 Ustawy z dnia\
      \ 18 kwietnia 2002 r. o stanie klęski żywiołowej ().. Awaria techniczna zawiera\
      \ się w szerszym pojęciu jakim jest klęska żywiołowa.\nPodstawowe awarie techniczne:\n\
      -Awarie sieci energetycznych mogą być spowodowane wyładowaniami atmosferycznymi\
      \ np. podczas burzy, czego efektem będą skoki napięcia w sieci elektrycznej.\
      \ Również mokry śnieg i łamiące się pod jego naporem gałęzie mogą uszkadzać\
      \ wiszące przewody. W przypadku, gdy piorun uderzy w dom lub mieszkanie, może\
      \ zdarzyć się, że wszystkie urządzenia elektryczne ulegną uszkodzeniu. Nie tylko\
      \ niesprzyjające warunki pogodowe mogą być przyczyną przerwy w dostawach prądu,\
      \ mogą powodować je również nieumiejętnie prowadzone prace remontowe. \n-Awarie\
      \ sieci wodociągowej mogą występować na skutek jednorazowych zdarzeń losowych,\
      \ ingerencji człowieka, ale najczęstszą przyczyną awarii występującą w sieciach\
      \ wodociągowych są m.in. pęknięcia rur wodociągowych. Bardzo często zdarza się,\
      \ że są to rury stare, wykonane z żeliwa, a wyeksploatowanie tego materiału\
      \ doprowadza do awarii. \n-Awarie instalacji gazowej mogą być powodem wypadków.\
      \ Ulatniający się gaz gromadzi się w pomieszczeniu, w przypadku nagromadzenia\
      \ się dużej ilości gazu iskra może spowodować wybuch.\n-Awarie telekomunikacyjne\
      \ są związane z częściową lub całkowitą blokadą sieci przesyłowej, spowodowaną\
      \ najczęściej za sprawą katastrofy naturalnej lub awarią infrastruktury telekomunikacyjnej.\n\
      - Katastrofą budowlaną jest niezamierzone, gwałtowne zniszczenie obiektu budowlanego\
      \ lub jego części, a także konstrukcyjnych elementów rusztowań, elementów urządzeń\
      \ formujących, ścianek szczelnych i obudowy wykopówArt. 73 ust. 1 Ustawy o Prawie\
      \ budowlanym z 7 lipca 1994 r.."
    title: Main
