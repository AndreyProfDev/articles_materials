- sections:
  - content: 'Obiekt techniczny – przedmiot wykonany przez człowieka w celu spełnienia
      jego potrzeb.

      Każdy obiekt techniczny jest wytwarzany po to, aby go eksploatować, a wskutek
      eksploatacji podlega zużyciu.

      Przyjmuje się, że istnienie obiektu technicznego dzieli się na fazy:

      - produkcji

      - eksploatacji

      - likwidacji'
    title: Main
  title: Obiekt techniczny
- sections:
  - content: 'Wysoka technika (, ) – dziedziny i wyroby charakteryzujące się wysoką
      intensywnością B+R.

      Cechami charakterystycznymi dla branż wysokich technologii są takżePerspektywy
      rozwoju małych i średnich przedsiębiorstw wysokich technologii w Polsce do 2020
      roku, s. 6.:

      - wysoki poziom zatrudnienia personelu naukowo-technicznego,

      - technologie zawarte w patentach i licencjach,

      - strategiczna współpraca z innymi firmami wysoko technologicznymi i ośrodkami
      naukowymi,

      - wysoki poziom rotacji wyposażenia technicznego, konieczność dużych nakładów
      kapitałowych.

      Przykłady dziedzin techniki, w których stosowane są nowe technologie:

      - astronautyka

      - biotechnologia

      - farmacja

      - fizyka jądrowa

      - informatyka

      - inżynieria kwantowa (np. spintronika, komputer kwantowy)

      - inżynieria materiałowa (nanomateriały, nanotechnologia)

      - lotnictwo

      - medycyna

      - robotyka

      - telekomunikacja'
    title: Main
