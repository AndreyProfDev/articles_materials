  - content: 'To największy dział Kanonu, zawiera łącznie 763 artykuły biograficzne:
      aktorów i tancerzy, reżyserów i scenarzystów, socjologów, etnografów, artystów,
      architektów, pisarzy, dramaturgów, poetów, publicystów, tłumaczy, osób zw. z
      literaturą, historyków, archeologów, krytyków sztuki, kompozytorów i muzyków,
      odkrywców, wynalazców i naukowców, filozofów, ekonomistów, myślicieli, polityków,
      wojskowych, osób zw. z religią, prawników i kodyfikatorów prawa, przywódców
      Polski, aktywistów i działaczy społecznych, postaci zw. ze sportem oraz lekarzy.'
    title: Biografie
  - content: Dział historyczny to 70 artykułów opisujących okoliczności powstania
      państwa polskiego oraz ważne wydarzenia, które miały miejsce na przestrzeni
      wieków w dziejach Polski.
    title: Historia
  - content: Kanon artykułów związanych z Polską zawiera 61 artykułów geograficznych
      dotyczących podziału terytorialnego, krain, miast, rzek, zbiorników wodnych
