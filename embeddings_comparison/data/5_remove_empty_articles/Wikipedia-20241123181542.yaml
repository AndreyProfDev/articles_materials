      nazwa_udziału_sieciowego\\nazwa_katalogu\\nazwa_pliku.roz\nprzykłady:\n:\\\\\
      serwer1\\uzytkownicy\\kowalski\\dokument1.doc \n:\\\\192.168.1.17\\dokumeny\\\
      start.rtf\nen:Path (computing)#Uniform Naming Convention"
