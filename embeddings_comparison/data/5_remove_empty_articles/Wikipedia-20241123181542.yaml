- sections:
  - content: 'Extensible resource identifier (XRI) – system identyfikatorów, kompatybilny
      z URI. Został stworzony w ramach organizacji OASIS. Jest to także protokół określający
      sposób pobierania tych identyfikatorów.

      Identyfikatory XRI dopuszczają stosowanie pełnego Unicode.

      Jednym z najważniejszych z punktu widzenia Identity 2.0 zastosowań XRI są i-names.

      XRI towarzyszy także inny protokół, XDI, służący do wymiany danych.'
    title: Main
  - content: '- Informacje o XRI'
    title: Linki zewnętrzne
  title: Extensible resource identifier
- sections:
  - content: 'Program Brite (ang. Basic Resarch in Information Technologies for Europe)
      - Badania Podstawowe w Zakresie Technologii Informatycznych dla Europy - program
      Unii Europejskiej zainicjowany w 1985 r. celem wspierania badań naukowych w
      zakresie nowych technologii i ich wspierania. Został zaplanowany na 4 lata i
      zakończył się w 1989 r. Miał on stymulować współpracę pomiędzy różnymi gałęziami
      przemysłu w państwach Wspólnot Europejskich. Brite to akronim od pełnej angielskiej
      nazwy programu.

      Program łączył przedsiębiorstwa, szkoły wyższe oraz instytuty badawcze i podejmował
      współpracę w następujących dziedzinach nowych technologii:

      - polimery,

      - technologia laserowa,

      - modele matematyczne,

      - nowe surowca,

      - katalizatory,

      - technologie membranowe.

      Jako pierwsze z tego programu skorzystały małe i średnie przedsiębiorstwa. Program
      obejmował 12 krajów członkowskich Unii Europejskiej: Belgia, Dania, Francja,
      Grecja, Hiszpania, Holandia, Irlandia, Luksemburg, Niemcy, Portugalia, Włochy,
      Wielka Brytania i kraje EFTA: Islandia, Liechtenstein, Norwegia.'
    title: Main
  - content: '- Dzienniki Urzędowe Unii Europejskiej'
    title: Bibliografia
  title: BRITE
- sections:
  - content: 'Informatyka przemysłowa (z ang. industrial computing), także informatyka
      procesowa (z niem. prozessinformatik) – dziedzina wiedzy znajdująca się na pograniczu
      nauk informatycznych oraz nauk o technologiach przemysłowych. Koncentruje się
      na zastosowaniu komputerów i oprogramowania w przemyśle. Do jej głównych zainteresowań
      należą informatyczne aspekty w następujących zastosowaniach:

      - komputerowe monitorowanie i sterowanie produkcją;

      - komputerowe modelowanie, symulacja i optymalizacja procesów technologicznych;

      - eksploracja i analiza danych przemysłowych;

      - projektowanie przemysłowych systemów informatycznych, m.in. systemy czasu
      rzeczywistego, systemy wbudowane;

      - zastosowanie sztucznej inteligencji w przemyśle, m.in. systemy ekspertowe;

      - projektowanie urządzeń wykorzystywanych w przemyśle, m.in. oprogramowanie
      sprzętowe.'
    title: Main
  title: Informatyka przemysłowa
- sections:
  - content: 'ModuloEtym. w moduł. – operacja wyznaczania reszty z dzielenia jednego
      typu liczbowego przez drugi. W dalszym ciągu napis <math>a\ \bmod\ d = r</math>
      będzie oznaczał, iż <math>r</math> jest resztą z dzielenia <math>a</math> przez
      <math>d.</math>

      Są różne sposoby określania reszty, a komputery i kalkulatory mają różne sposoby
      przechowywania i reprezentowania liczb, więc wynik operacji modulo zależy od
      języka programowania i/lub sprzętu.

      W niemal każdym systemie komputerowym współczynnik wynikający z dzielenia jest
      ograniczany do zbioru liczb całkowitych, a reszta <math>r</math> jest zwykle
      ograniczona przez <math>0 \leqslant r < |d|</math> albo <math>-|d| < r \leqslant
      0.</math> Wybór między dwiema możliwymi resztami zależy od znaku <math>a</math>
      lub <math>d</math> oraz użytego języka programowania. Niektóre języki programowania,
      jak na przykład C89, nawet nie definiują wyniku jeśli zarówno <math>d,</math>
      jak i <math>a</math> jest ujemne – patrz tabela.

      <math>a</math> modulo 0 jest nieokreślone w większości systemów, choć niektóre
      określają je jako <math>a.</math> Jeśli definicja jest spójna z algorytmem dzielenia,
      wtedy <math>d = 0</math> implikuje <math>0 \leqslant r < 0,</math> co jest sprzeczne
      (tzn. zwykła reszta w tym wypadku nie istnieje).

      Reszta może być wyznaczana równaniami, które korzystają z innych funkcji. Jednym
      z takich użytecznych równań wyznaczania reszty <math>r</math> jest

      : <math>r = a - d \left\lfloor\frac{a}{d}\right\rfloor,</math>

      gdzie <math>\lfloor x\rfloor</math> oznacza zaokrąglenie w dół liczby <math>x.</math>

      Dzielenie modulo jest powszechnie używane przy obliczaniu cyfry kontrolnej w
      identyfikatorach. W algorytmie Luhna, numerach PESEL, REGON, NIP, numerach dowodów
      osobistych, paszportów, numerach towarów EAN, numerach banknotów EURO, numerach
      kont bankowych IBAN, numerach substancji chemicznych CAS, ISBN, ISMN, ISSN,
      ISTC, EVN-UIC, numerach recept, prawa wykonywania zawodu lekarza, numerach kontenera
      i wielu innych. Podstawowym celem użycia cyfry lub znaku kontrolnego jest wykrywanie
      pomyłek przy ręcznym wprowadzaniu numeru do systemu informatycznego. Wszystkie
      te metody zapewniają wykrycie zamiany pojedynczego znaku oraz w znacznej większości
      zamiany sąsiednich znaków, tzw. czeskiego błędu.'
    title: Main
