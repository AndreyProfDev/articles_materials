- sections:
  - content: 'Technologie finansowe określane jako Fintech lub FinTech () – wszelkiego
      typu innowacje technologiczne w sektorze finansów. Tego samego określenia używa
      się również jako nazwy firm, które oferują rozwiązania innowacyjne dla sektora
      finansowego dotyczące instrumentów finansowych oraz usług.

      Użycie analogicznego określenia angielskiego InsurTech dla opisu innowacyjnych
      rozwiązań dla sektora ubezpieczeniowego nie przyjęło się jeszcze w języku polskim.
      W tym obszarze używa się opisowego określenia typu: „innowacyjne technologie
      w branży ubezpieczeniowej” lub podobne. Podobne określenia powstały dla rozwiązań
      innowacyjnych w innych branżach, jak WealthTech z dziedziny zarządzania aktywami
      czy PayTech dla płatności.

      Firmy FinTech działające na rynku finansowym postrzegane są jako szczególna
      kategoria parabanków.'
    title: Main
  - content: Polska jest jednym z krajów, w których w ostatnich latach odnotowano
      najwyższe przyrosty w zakresie rozwoju i wzrostu gospodarczego. Co prawda zastosowanie
      innowacyjności, jak i tempo wdrażania nowoczesnych technologicznie rozwiązań
      różni się w zależności od sektora to branża finansowa charakteryzuje się raczej
      wysokim jej poziomem. Innowacyjność w tym zakresie nabrała dużego rozpędu a
      segment rynku nazywany powszechnie Fintech bez wątpienia ma ogromną szansę zaistnieć.
      Przewiduje się, że w kolejnych latach sektor ten zajmie ważne miejsce w gospodarce
      jako całości, przyczyniając się tym samym do jej zrównoważonego rozwoju.
    title: Miejsce Fintech w gospodarce
  - content: '<references>

      Nowe technologie a sektor finansowy. FinTech jako szansa i zagrożenie, bankier.pl.

      FinTechs – Finanztechnologie Unternehmen, bundesbank.de.

      Innowacyjne technologie w branży ubezpieczeniowej, equinum.pl.

      What the heck is PayTech, planetcompliance.com.

      What is wealthtech?, bbva.com.

      </references>'
