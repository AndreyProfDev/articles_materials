  - content: 'Bioinformatyka jest interdyscyplinarną dziedziną naukową zajmującą się
      badaniami naukowymi i wdrażaniem w praktycznych zastosowaniach informatycznych
      metod do rozwiązywania różnorodnych zagadnień w naukach biologicznych.

      Głównym hasłem w tej kategorii jest bioinformatyka.'
