- sections:
  - content: 'Informatyka zajmuje się teoretycznymi podstawami informacji, algorytmami
      i architekturami układów ją przetwarzających oraz praktycznymi technikami ich
      stosowania.

      Informatyka (, ) – nauka ścisła oraz techniczna zajmująca się przetwarzaniem
      informacji, w tym również technologiami przetwarzania informacji oraz technologiami
      wytwarzania systemów przetwarzających informacje. Zajmuje się rozwiązywaniem
      problemów obliczeniowych, opisem procesów algorytmicznych oraz tworzeniem programów
      komputerowych i częściowo sprzętu komputerowego (z wyłączeniem zagadnień materialnych
      i energetycznych). Informatyka początkowo stanowiła część matematyki, z czasem
      wyodrębniła się do oddzielnej dyscypliny. W języku polskim termin „informatyka”
      zaproponował w październiku 1968 r. Romuald Marczyński (w Zakopanem, na ogólnopolskiej
      konferencji podczas wykładu zatytułowanego „Informatyka, czyli maszyny matematyczne
      i przetwarzanie informacji”), na wzór francuskiego informatique i niemieckiego
      Informatik.'
    title: Main
  - content: 'Termin informatics nie mógł zostać wprowadzony do słownictwa amerykańskiego
      z uwagi na problemy prawne – istniało tam przedsiębiorstwo o nazwie , co zablokowało
      chęć zmiany nazwy ACM na Society for Informatics. Wówczas popularny był już
      tam termin computer science – dosłownie: „nauka o komputerze” – co może być
      mylące, stąd spotykał się często z krytyką środowisk akademickich. Proponowano
      wiele alternatywnych nazw, m.in. Computer Studies, Computics, Computing Science,
      Computation Science, Information engineering, Information Technology. Association
      for Computing Machinery będące najważniejszą organizacją branżową przyjął termin
      computing na nazwę ogólnej dyscypliny. Częściowo powrócono jednak później do
      computer science ze względu na to, że termin ten się silnie zakorzenił. Współcześnie
      określenie computing odnosi się do całej dyscypliny, a computer science to jej
      część w której obowiązuje rygor naukowy, podczas gdy informatyka techniczna
      skupia się na aspektach praktycznych i traktowana jest jako nauka inżynierska.
      W informatyce technicznej można wyróżnić szereg specjalności, takich jak inżynieria
      komputerowa (computer engineering, technische Informatik) związana z tworzeniem
      sprzętu komputerowego i oprogramowania wbudowanego, technologia informacyjna
      (information technology), współcześnie najczęściej spotykana w tworzeniu oprogramowania
      dla zastosowań biznesowych, inżynieria oprogramowania (software engineering),
      odnosząca się ogólnie do programowania, lecz ściśle związana z zarządzaniem
      procesem wytwarzania oprogramowania. SE i IT są czasem na wzór niemiecki zbiorczo
      nazywane informatyką praktyczną (niem. praktische Informatik).

      Przetwarzanie informacji jest różnie interpretowane, przez co istnieją różne
      definicje informatyki. Uniwersytet Edynburski definiuje ją jako naukę o systemach
      obliczeniowych, w której centralną notacją jest transformacja informacji. Według
      Petera J. Denninga podstawowym pytaniem leżącym u podstaw informatyki jest:
      „Co można zautomatyzować?”. Według teorii Stuarta C. Shapiro, informatyka jest
      nauką przyrodniczą, która bada procedury. Adam Olszewski wyróżnił pięć rodzajów
      obiektów, które są przedmiotem zainteresowania informatyki: funkcje efektywnie
      obliczalne, algorytmy, programy komputerowe, realizacje i maszyny. W roku 2005,
      w ACM Computing Curricula przedstawiono następujący opis:'
    title: Etymologia
  - content: 'Jako dyscyplina informatyka obejmuje szereg tematów, od teoretycznych
      badań nad algorytmami i teorią obliczalności po praktyczne zagadnienia związane
      z implementowaniem systemów obliczeniowych zarówno w warstwie sprzętowej, jak
      i oprogramowaniu. CSAB, dawniej zwana Computing Sciences Accreditation Board
      – w skład której wchodzą przedstawiciele Association for Computing Machinery
      (ACM) oraz IEEE Computer Society (IEEE CS) – identyfikuje cztery obszary, które
      uważa za kluczowe dla informatyki: teoria obliczeń, algorytmy i struktury danych,
      języki i metodologia programowania oraz budowa i architektura komputerów. Oprócz
      tych czterech podstawowych obszarów, CSAB identyfikuje również takie dziedziny,
      jak inżynieria oprogramowania, sztuczna inteligencja, sieci komputerowe i komunikacja,
      systemy baz danych, obliczenia równoległe, obliczenia rozproszone, interakcja
      człowiek–komputer, grafika komputerowa, systemy operacyjne oraz metody numeryczne
      i symboliczne jako będące ważnymi dziedzinami informatyki.

      Początkowo towarzystwa ACM i IEEE CS publikowały własne oddzielne zalecenia
      dotyczące programów studiów. Z czasem postanowiono utworzyć wspólną dyscyplinę
      oraz wspólne zalecenia dotyczące programów kształcenia. W pracach nad ujednoliceniem
      programów studiów uczestniczyły organizacje: ACM, IEEE Computer Society, Association
      for Information Systems, ACM SIG Information Technology Education, British Computer
      Society, International Federation for Information Processing, ABET and CSAB.
      Wyróżniono 5 głównych specjalizacji: inżynieria komputerowa (ang. computer engineering,
      CE), informatyka naukowa (ang. computer science, CS), systemy informacyjne (ang.
      information systems, IS), technologia informacji (ang. information technology,
      IT), inżynieria oprogramowania (ang. software engineering, SE). W 2020 podobna
      grupa organizacji przygotowała programy studiów dla kolejnych 2 specjalizacji:
      cyberbezpieczeństwo (ang. cybersecurity) oraz danologię (ang. data Science).
      W Niemczech zwyczajowo dzieli się natomiast na informatykę teoretyczną, techniczną,
      praktyczną oraz realizacje i stosowaną.

      Peter J. Denning z kolei w swoim artykule o informatyce pogrupował treści w
      następujące działy: algorytmy i struktury danych, języki oprogramowania, architektura
      komputerów i oprogramowania, systemy operacyjne i sieci, inżynieria oprogramowania,
      bazy danych i wyszukiwanie informacji, sztuczna inteligencja i robotyka, grafika
      komputerowa, interakcja człowiek–komputer, symulacje komputerowe i obliczenia
      numeryczne, informatyka ekonomiczna, bioinformatyka.

      Jednocześnie dla każdego z tych obszarów zaproponował podział na trzy podejścia
      dotyczące strony teoretycznej, abstrakcyjnej oraz twórczej.'
    title: Przegląd dyscyplin informatycznych
  - content: Teoretyczna informatyka (ang. theoretical computer science) ma ducha
      matematycznego i abstrakcyjnego, ale motywację czerpie z praktycznych i codziennych
      obliczeń. Jej celem jest zrozumienie natury obliczeń, w konsekwencji czego wprowadza
      ich coraz bardziej efektywne metody. Jest ona częścią matematyki i informatyki,
      która grupuje matematyczne podstawy informatyki. Jej najważniejsze obszary to
      teoria obliczeń, teoria informacji oraz algorytmika. Informatyka teoretyczna
      stara się odpowiedzieć na fundamentalne pytania w informatyce np. P versus NP
      problem i stanowi trzon dla bardziej praktycznych dziedzin.
    title: Informatyka teoretyczna
  - content: Algorytmika zajmuje się projektowaniem i analizą algorytmów i struktur
      danych. Jest najstarszą i jedną z najważniejszych dziedzin informatyki. Wśród
      jej podstawowych obszarów można wymienić projektowanie i analizę algorytmów,
      geometrię obliczeniową, optymalizację kombinatoryczną oraz logikę algorytmiczną.
      Historycznie podstawowymi zagadnieniami są algorytmy sortowania, kompresji,
      przeszukiwania czy szyfrowania oraz metody numeryczne. Algorytmy podlegają klasyfikacji,
      wyróżniając np. algorytmy zachłanne jak algorytm Dijkstry czy algorytm Kruskala,
      metody generowania liczb losowych, metody optymalizacji itd. Do podstawowych
      struktur danych należą rekord, tablica, stos, lista, kolejka, drzewa czy grafy.
      Próbą połączenia idei struktur danych i algorytmów jest paradygmat programowania
      obiektowego.
    title: Algorytmika. Algorytmy i struktury danych
  - content: "Teoria obliczeń dzieli się na trzy główne części: teorię automatów,\
      \ teorię obliczalności oraz teorię złożoności. Teoria automatów zajmuje się\
      \ definicjami i własnościami modeli obliczeń, matematycznymi modelami maszyn\
      \ liczących. W uproszczeniu zajmuje się ona odpowiedzią na pytanie czym jest\
      \ komputer, teoria obliczalności zajmuje się odpowiedzią na pytanie, które problemy\
      \ dają się rozwiązać przy pomocy komputera, a teoria złożoności – odpowiedzią\
      \ na pytanie jak szybko da się to zrobić. Przykładowymi zagadnieniami są Maszyna\
      \ Turinga czy Hipoteza Churcha-Turinga. Języki formalne stanowią podstawę badań\
      \ nad językami komputerowymi, jak i naturalnymi w lingwistyce. Systemy formalne\
      \ są tworzone i badane zarówno jako samodzielne abstrakcyjne twory, jak i systemy\
      \ opisu rzeczywistości.\n{| style=\"border:1px solid #ccc; text-align:center;\
      \ margin:auto;\" cellspacing=\"15\"\n|-\n| \n| \n| <math>M= \\{ X : X \\notin\
      \ X \\}</math>\n| \n| \n|-\n| Teoria automatów\n| Język formalny\n| Teoria obliczalności\n\
      | Teoria złożoności obliczeniowej\n| Automat komórkowy\n|}"
    title: Teoria obliczeń. Języki, automaty, złożoność
  - content: Matematyczna teoria informacji zajmuje się problematyką informacji, w
      tym podstawami teoretycznymi dla przetwarzania i przesyłania informacji, np.
      w celu ich transmisji lub kompresji. Przykładowo wprowadza takie pojęcia jak
      komunikat, entropia, ciało skończone czy bit będący podstawową jednostką w informatyce.
      Teoria kodowania zajmuje się tworzeniem i analizą reprezentacji danych w komputerze.
      Wyróżnia się m.in. kodowanie znaków czy kodowanie transportowe, do których należą
      np. kod stałopozycyjny.
    title: Teoria informacji i kodowania
  - content: Informatyka kwantowa to gałąź informatyki łącząca ją z mechaniką kwantową,
      w której do przetwarzania informacji wykorzystywane są własności układów kwantowych.
      Elementarnym nośnikiem informacji kwantowej jest kubit, kwantowy odpowiednik
      bitu. Stan kubitu opisany jest przez dowolną kombinację liniową stanów bazowych.
      W najbardziej popularnym modelu kwantowego przetwarzania informacji, operacje
      na kubitach są reprezentowane za pomocą bramek kwantowych. Najbardziej spektakularny
      sukces informatyki kwantowej to kwantowa kryptografia. Natomiast najbardziej
      obiecującym kierunkiem badań są prace dotyczące idei kwantowego komputera. Dynamiczny
      rozwój technologii w ostatnich latach spowodował, że gałąź ta wyłamuje się poza
      czysto-teoryczne rozważania. Stworzono pewne realizacje bramek kwantowych, a
      na targach CES w 2018 roku amerykańskie przedsiębiorstwo informatyczne IBM zaprezentowała
      swój działający, 50-kubitowy komputer kwantowy.
    title: Informatyka kwantowa
  - content: Teoria języków programowania (ang. Programming language theory, PLT)
      to dziedzina informatyki zajmująca się projektowaniem, wdrażaniem, analizą,
      charakteryzacją i klasyfikacją języków programowania oraz ich indywidualnymi
      cechami. Przykładowymi obszarami PLT są semantyki formalne (ang. formal semantics),
      teoria typów (ang. type theory) czy metaprogramowanie. Na języki programowania
      składa się składnia, semantyka i biblioteki standardowe, zazwyczaj posiadają
      co najmniej obsługę wejścia-wyjścia, obsługę plików, obsługę wielowątkowości,
      zarządzanie pamięcią operacyjną, podstawowe typy danych, funkcje do zarządzania
      nimi np. operacje na ciągach znaków. Ważnym obszarem PLT jest też teoria kompilacji,
      na której proces składa się wykonanie poleceń preprocesora, analiza leksykalna,
      analiza składniowa, analiza semantyczna, optymalizacja kodu wynikowego i generacja
      kodu. Języki klasyfikuje się według poziomu abstrakcji na którym operują na
      języki niskiego poziomu oraz języki wysokiego poziomu, wyróżnia się także wiele
      paradygmatów programowania.
    title: Teoria języków programowania, typów, kompilacji
  - content: Inżynieria komputerowa (ang. computer engineering, niem. Technishe Informatik)
      – zajmuje się tworzeniem systemów komputerowych. Do jej zadań należy projektowanie,
      wytwarzanie, integracja i eksploatacja sprzętu cyfrowego, w tym urządzeń sieciowych.
      Początkowo zajmowała się głównie tworzeniem procesorów, a współcześnie ważną
      jej rolę stanowi także tworzenie sprzętu i sterowników dla systemów wbudowanych,
      które wraz z pojawieniem się koncepcji IoT mają coraz większe znaczenie. Do
      jej zagadnień należy architekturą i organizacją systemów komputerowych na poziomie
      sprzętowym oraz oprogramowania sprzętowego.
    title: Inżynieria komputerowa
  - content: Technika cyfrowa zajmuje się projektowaniem i analizą układów cyfrowych.
      Do jej elementarnych zagadnień należą bramki logiczne, rejestry, układy sekwencyjne
      i układy kombinacyjne. Obejmuje syntezę logiczną i odwzorowanie technologiczne.
      Współcześnie jej zagadnienia są kształtowane z jednej strony przez języki opisu
      sprzętu, a z drugiej przez bezpośrednio programowalne macierze bramek. Układy
      logiczne początkowo implementowano jako układy mechaniczne, następnie jako elektromechaniczne
      i dominujące współcześnie układy elektroniczne.
    title: Logika obliczeniowa i technika cyfrowa
  - content: Architektura komputerów (AK) to główny obszar inżynierii komputerowej
      zajmujący się projektowaniem i podstawową strukturą systemów komputerowych oraz
      budową i organizacją ich podzespołów. Główny obszar AK stanowi architektura
      procesorów na którą składa się model programowy procesora oraz mikroarchitektura
      procesora. Procesory są głównym elementem systemów komputerowych. Szczególna
      uwaga jest poświęcona na sposobie, w jaki procesor wykonuje instrukcje i uzyskuje
      dostęp do adresów w pamięci. Przykładowe zagadnienia to DMA czy kontroler. Ważnymi
      obszarami AK są także magistrale oraz pamięci komputerowe. Pamięcią komputerową
      nazywa się różnego rodzaju urządzenia i bloki funkcjonalne komputera, służące
      do przechowywania danych i programów (systemu operacyjnego oraz aplikacji).
      Istnieje jej wiele rodzajów, m.in. rejestry procesora, pamięć podręczna procesora,
      pamięć RAM, dyski półprzewodnikowe (SSD), dyski twarde (HDD). Wyróżnia się pamięci
      zewnętrzne i wewnętrzne. Magistralę komunikacyjną (ang. bus) definiuje się jako
      zespół linii przenoszących sygnały oraz układy wejścia-wyjścia służące do przesyłania
      sygnałów między połączonymi urządzeniami w systemach mikroprocesorowych.
    title: Architektura i organizacja komputerów
  - content: 'Obliczenia równoległe to obszar badający możliwość obliczeń, w której
      wiele instrukcji jest wykonywanych jednocześnie. Taka forma przetwarzania danych
      była wykorzystywana przez wiele lat, głównie przy wykorzystaniu superkomputerów,
      a szczególne zainteresowanie zyskała w ostatnich latach, z uwagi na fizyczne
      ograniczenia uniemożliwiające dalsze zwiększanie częstotliwości taktowania procesorów.
      Obliczenia równoległe stały się dominującym wzorcem w architekturze komputerowej,
      głównie za sprawą upowszechnienia procesorów wielordzeniowych. Ze względu na
      skalę można wyróżnić obliczenia równoległe na poziomie: bitów, instrukcji, danych
      i zadań. Współbieżność jest właściwością systemów, w których obliczenia wykonuje
      się jednocześnie i potencjalnie korzystają ze wspólnych zasobów i/lub wchodzą
      w interakcje ze sobą. Opracowano wiele modeli obliczeń równoległych, w tym sieci
      Petriego, rachunek procesowy (ang. process calculus) i model maszyny dostępu
      równoległego (ang. parallel random-access machine, PRAM). Kiedy wiele komputerów
      jest podłączonych do sieci podczas korzystania ze współbieżności, jest to nazywane
      systemem rozproszonym. w którym to komputery mają własną pamięć, a informacje
      są wymieniane, by osiągnąć wspólne cele.'
    title: Przetwarzanie równoległe i rozproszone
  - content: Oprogramowanie niskopoziomowe pisze się w językach niskiego poziomu.
      Są to głównie języki asemblera, stanowią symboliczny zapis instrukcji procesora
      i danych, który w prosty sposób odpowiada zapisowi binarnemu. Języki asemblerowe
      wprowadzone w celu czytelnej dla człowieka reprezentacji języków maszynowych
      komputerów. W przeciwieństwie do języków wysokiego poziomu, typowe języki asemblerowe
      charakteryzują się strukturą liniową (wierszową). Każdy wiersz tekstu może zawierać
      pojedynczą instrukcję procesora lub dyrektywę asemblera.
    title: Programowanie niskopoziomowe
  - content: Sieci komputerowe to gałąź informatyki mająca na celu tworzenie sieci
      między komputerami nazywanych węzłami, umożliwiając im współdzielenie zasobów.
      W sieciach komputerowych urządzenia komputerowe wymieniają się danymi za pomocą
      warstw sieciowych. W modelu OSI wyróżnia się warstwę aplikacji, prezentacji,
      sesji, transportową, sieciową, łącza danych i fizyczną, a w modelu TCP/IP –
      będącym podstawą struktury internetu – wyróżnia się warstwy aplikacji, transportową,
      internetową i dostępu do sieci. Te łącza danych są ustanawiane za pomocą mediów
      kablowych, takich jak skrętka lub kable światłowodowe, oraz mediów bezprzewodowych,
      takich jak np. Wi-Fi. Jednymi z podstawowych zagadnień sieci są protokoły oraz
      urządzenia sieciowe. Do najpopularniejszych urządzeń sieciowych należy karta
      sieciowa, router, koncentrator, przełącznik, punkt dostępowy, most, ekspander
      zasięgu Wi-Fi (repeater Wi-Fi), adaptery PowerLine, serwery wydruku, kamery
      IP, bramki VoIP orazy telefony IP. Protokołem komunikacyjnym nazywa się zbiór
      ścisłych reguł i kroków postępowania, które są automatycznie wykonywane przez
      urządzenia sieciowe w celu nawiązania łączności i wymiany danych. Definiują
      one syntaksę, semantykę, synchronizację komunikacji oraz możliwe metody naprawiania
      błędów. Protokoły te mogą zostać wdrożone za pomocą hardware'u, oprogramowania
      lub obu jednocześnie.
    title: Sieci komputerowe
  - content: Systemy operacyjny pełnią szczególną rolę w informatyce. Jest to oprogramowanie
      zarządzające systemem komputerowym, tworzące środowisko do uruchamiania i kontroli
      zadań. Najważniejszym elementem systemu operacyjnych jest jego jądro wykonujące
      i kontrolujące zadania m.in. planisty czasu procesora, ustalającego które zadanie
      i jak długo będzie wykonywane czy przełącznika zadań, odpowiedzialnego za przełączanie
      pomiędzy uruchomionymi zadaniami. System operacyjny posiada także swoją powłokę,
      czyli specjalny program komunikujący użytkownika z systemem operacyjnym oraz
      system plików – sposób ustrukturyzowanego zapisu danych na nośniku. Osoby administrujące
      systemami nazwa się administratorami (pot. adminami). Współcześnie najważniejszą
      rodziną systemów operacyjnych jest GNU/Linux oraz Windows.
    title: Systemy operacyjne
  - content: 'Programowanie komputerów to proces projektowania, tworzenia, testowania
      i utrzymywania kodu źródłowego programów komputerowych w tym dla urządzeń mikroprocesorowych
      (mikrokontrolery). Programowanie pod różnymi postaciami jest obecne w większości
      działów informatyki. Kod źródłowy jest napisany w języku programowania, z użyciem
      określonych reguł, może on być modyfikacją istniejącego programu lub czymś zupełnie
      nowym. Programowanie wymaga wiedzy i doświadczenia w wielu dziedzinach, jak
      projektowanie aplikacji, algorytmika, struktury danych, języki programowania
      i narzędzia programistyczne, kompilatory, czy sposób działania podzespołów komputera.
      Między programistami trwają debaty, czy programowanie komputerów jest sztuką,
      rzemiosłem czy procesem inżynieryjnym. Bezpośrednią formą sztuki w tej dziedzinie
      jest demoscena. Programowanie komputerów integruje ze sobą większość gałęzi
      informatyki. Istnieje wiele gałęzi rozwoju technik programowania, jednak wszystkie
      z nich bazują na wspólnych podstawach. Niezależnie czy to będzie aplikacja webowa
      w Javascript, gra komputerowa w C++ czy program mikrokontrolera w C, używają
      one podstawowych konstrukcji programistycznych. Podstawymi pojęciami od których
      zaczyna się naukę programowania są między innymi zmienne, tablice, instrukcje
      warunkowe, pętle, wskaźniki, łańcuchy, funkcje, debugowanie, biblioteki oraz
      zarządzanie pamięcią. Języki dzieli się na generacje: 2GL, 3GL, 4GL, 5GL. Wyróżnia
      się między innymi języki akcji, języki algorytmiczne, języki dziedzinowe, języki
      interpretowane, języki kompilowane, języki mnemoniczne, języki nieproceduralne,
      języki niezależne komputerowo, języki niskiego poziomu, języki opisu zadań,
      , języki proceduralne, języki symulacyjne, języki uniwersalne i języki wysokiego
      poziomu. Do najpopularniejszych języków programowania zalicza się: Java, C,
      Python, C++, Visual Basic .NET, C#, JavaScript, PHP, SQL, Język Asemblera, Swift,
      Objective-C, Ruby, Groovy, Go, Perl, MATLAB, Visual Basic, Object Pascal.'
    title: Informatyka praktyczna
  - content: Grafika komputerowa to dział informatyki zajmujący się cyfrową syntezą
      i manipulacją treści wizualnych. Ze względu na reprezentację danych dzieli się
      na grafikę rastrową i wektorową, a ze względu na charakter danych na grafikę
      dwuwymiarową, trójwymiarową i ruchomą. Obejmuje także obecnie szybko rozwijające
      się przetwarzenie obrazów. Grafikę komputerową można także podzielić na teoretyczną
      skupiającą się algorytmach graficznych i praktyczną, skupiającą się manipulacji
      obrazem czy modelowaniu 3D np. w programie Blender. Grafika komputerowa stanowi
      podstawę współczesnych gier, animacji, symulacji czy wizualizacji komputerowych.
      Renderowanie polega na analizie stworzonego wcześniej modelu danej sceny oraz
      utworzenie na jej podstawie dwuwymiarowego obrazu wyjściowego w formie statycznej
      lub animacji. Podczas renderowania rozpatrywane są m.in. odbicia, cienie, załamania
      światła, wpływy atmosfery (w tym mgła), efekty wolumetryczne itp.
    title: Grafika komputerowa
  - content: 'Inżynieria oprogramowania, także inżynieria systemów informatycznych
      – zajmuje się procesem i metodykami tworzenia systemów informatycznych: od analizy
      i określenia wymagań, przez projektowanie i wdrożenie, aż do ewolucji gotowego
      oprogramowania. Termin inżynieria oprogramowania po raz pierwszy został użyty
      w przełomie lat 1950/60 (ale oficjalnie za narodziny tej dyscypliny podaje się
      lata 1968 i 1969, w których miały miejsce dwie konferencje sponsorowane przez
      NATO, odpowiednio w Garmisch i Rzymie). Wyróżnia fazy produkcji oprogramwania:
      specyfikacji, projektowania, implementacji, integracji i ewoluacji, a także
      dostarcza systematycznych metodyk jego tworzenia, jak m.in. model kaskadowy,
      prototypowy czy zwinny, w tym scrum. Wprowadza takie pojęcia jak np. cykl życia
      programu czy metryka oprogramowania. Wyróżnia się także jej specjalizacje np.
      inżynieria systemów mobilnych, inżynieria systemów baz danych, inżynieria systemów
      wbudowanych czy inżynieria gier komputerowych. Wzorcem projektowym (ang. design
      pattern) nazywa się uniwersalne, sprawdzone w praktyce rozwiązanie często pojawiających
      się, powtarzalnych problemów projektowych. Pokazuje powiązania i zależności
      pomiędzy klasami oraz obiektami i ułatwia tworzenie, modyfikację oraz utrzymanie
      kodu źródłowego. Jest opisem rozwiązania, a nie jego implementacją. Architekturą
      oprogramowania nazwywa podstawową organizację systemu wraz z jego komponentami,
      wzajemnymi powiązaniami, środowiskiem pracy i regułami ustanawiającymi sposób
      jego budowy i rozwoju. Metody formalne – tworzenie specyfikacji, projektowania
      i weryfikacji oprogramowania lub systemów informatycznych w języku formalnym.
      Metody formalne najlepiej opisać jako zastosowanie dość szerokiej gamy podstaw
      teoretycznych informatyki, w szczególności rachunku logicznego, języków formalnych,
      teorii automatów, systemu dynamiki zdarzeń dyskretnych i semantyki programów,
      a także systemów typów i typów danych algebraicznych do specyfikacji i weryfikacji
      problemów w oprogramowaniu i sprzęcie.'
    title: Inżynieria oprogramowania
  - content: Kryptologia dzieli się na kryptografię, czyli gałąź wiedzy o utajnianiu
      wiadomości oraz kryptoanalizę, czyli gałąź wiedzy o przełamywaniu zabezpieczeń
      oraz o deszyfrowaniu wiadomości przy braku klucza lub innego wymaganego elementu
      schematu szyfrowania (szyfru). Przykładowe metody to atak brute force czy kryptoanaliza
      liniowa. Bezpieczeństwo komputerowe (ang. computer security', pot. cybersecurity,
      hacking) zajmuje się zapewnianiem poufności i bezpieczeństwa danych. Osoby posiadające
      szeroką i zaawansowaną wiedzę informatyczną, lecz nieetycznie z niej korzystający
      nazywani są cracker. Ich szczególnym zainteresowaniem jest wyszukiwanie luk
      (dziur) w systemach operacyjnych, programach, sieciach komputerowych czy urządzeniach
      do niej podłączonych w celu przejęcia nad nimi zdalnej kontroli. Wyróżnia się
      wiele klasycznych ataków komputerowych takich jak na przykład DDoS, HTTP Flood,
      UDP flood, smurf attack, session hijacking, a także wiele rodzajów wirusów komputerowych,
      trojanów, snifferów czy rootkitów. W odpowiedzi powstało wiele technik obrony
      systemów informatycznych, np. obrona w głąb, security through obscurity czy
      głębokie ukrycie.
    title: Cyberbezpieczeństwo i kryptologia
  - content: Danologia (ang. Data science) wykorzystuje metody naukowe, procesy, algorytmy,
      narzędzia i systemy informatyczne do wydobywania wiedzy i spostrzeżeń z wielu
      danych strukturalnych i nieustrukturyzowanych, tzw. Big data. Eksploracją danych
      (ang. data mining) nazywa się jeden z procesów uzyskiwania wiedzy z baz danych.
      Idea eksploracji danych polega na wykorzystaniu szybkości komputera do znajdowania
      ukrytych dla człowieka (właśnie z uwagi na ograniczone możliwości czasowe) prawidłowości
      w danych zgromadzonych w hurtowniach danych. Big data to termin odnoszący się
      do dużych, zmiennych i różnorodnych zbiorów danych, których przetwarzanie i
      analiza jest trudna, ale jednocześnie wartościowa. Obecne użycie terminu big
      data zwykle odnosi się do użycia analizy predykcyjnej, analizy zachowania użytkownika
      lub niektórych innych zaawansowanych metod analizy danych, które wydobywają
      wartość z danych, a rzadko do określonego rozmiaru zestawu danych. Baza danych
      to zorganizowany zbiór danych, ogólnie przechowywanych i dostępnych z systemu
      komputerowego. Tam, gdzie bazy danych są bardziej złożone, często są opracowywane
      przy użyciu formalnych technik projektowania i modelowania. System zarządzania
      bazą danych (DBMS) to oprogramowanie, które współdziała z użytkownikami końcowymi,
      aplikacjami i samą bazą danych w celu przechwytywania i analizy danych. Oprogramowanie
      DBMS obejmuje dodatkowo podstawowe narzędzia do zarządzania bazą danych.
    title: Bazy danych, eksploracja danych, danologia
  - content: Systemy informatyczne (ang. information processing systems) może opisać
      jako zbiór powiązanych ze sobą elementów, które przetwarzają informacje, najczęściej
      z wykorzystaniem sprzętu i oprogramowania komputerowego.
    title: Systemy i technologie komputerowe
  - content: 'Sztuczna inteligencja (SI, ang. Artificial intelligence, AI) to obszar
      informatyki zajmujący się komputerowym symulowaniem inteligencji – tworzeniem
      modeli zachowań inteligentnych oraz systemów komputerowych symulujących te zachowania.
      Szczególnym zainteresowaniem darzy się problemy które nie są bezpośrednio algorytmizowalne,
      jak rozpoznawanie obrazów, tłumaczenie maszynowe czy rozpoznawanie mowy. Sztuczna
      inteligencja jest związana z logiką rozmytą, algorytmami ewolucyjnymi, sieciami
      neuronowymi, robotyką i sztucznym życiem. SI bywa nazywane także inteligencją
      obliczeniową (ang. Computational Intelligence, CI). Uczeniem maszynowym (ang.
      Machine learning, ML) nazwa się analizę procesów uczenia się oraz tworzeniem
      systemów, które doskonalą swoje działanie na podstawie doświadczeń z przeszłości.
      Jedną z wiodących technologii jest TensorFlow. Systemy te posiadają zdolność
      do samouczenia się i nazywa się je systemami samouczącymi. Podstawowymi metodami
      ML są symboliczne uczenie się (nazywane także indukcyjnym, ang. symbolic/inductive
      learning) oraz sztuczne sieci neuronowe (ang. artificial neural networks). Nazywa
      się tak połączone grupy węzłów, podobne do rozległej sieci neuronów w ludzkim
      mózgu. Głębokie sieci neuronowe (także głębokie uczenie maszynowe, ang. deep
      learning lub differential programming) to podkategoria uczenia maszynowego –
      nazywa się tak metody oparte na sztucznych sieciach neuronowych z uczeniem reprezentatywnym
      (ang. feature learning lub representation learning). Uczenie się może być nadzorowane,
      częściowo nadzorowane lub nienadzorowane. Sztuczne życie (ang. artificial life,
      AL, niem. Künstliches Leben, KL) to kierunek badań, zorientowany na zrozumienie
      i wykorzystanie istoty życia. Pomysłodawcą i ojcem chrzestnym tego podejścia
      był amerykański matematyk i informatyk Christopher Langton, który zaproponował
      je w 1986 roku. Dziedzina obejmuje między innymi: tworzenie różnorodnych modeli
      życia oraz prowadzenie symulacji w środowisku programowym, sprzętowym i biochemicznym,
      symulacje ewolucji biologicznej oraz innych procesów biologicznych za pomocą
      metod informatycznych, badania i symulacje układów niebiologicznych, zachowujących
      się podobnie jak układy biologiczne (np. automatów komórkowych), algorytmy ewolucyjne
      i ewolucję programów komputerowych.'
    title: Sztuczna inteligencja
  - content: Systemy wbudowane to systemy komputerowe specjalnego przeznaczenia, który
      staje się integralną częścią obsługiwanego przez niego sprzętu komputerowego
      (hardware). System wbudowany musi spełniać określone wymagania ściśle zdefiniowane
      pod kątem zadań, które ma wykonywać. Każdy system wbudowany oparty jest na mikroprocesorze
      (lub mikrokontrolerze) zaprogramowanym do wykonywania ograniczonej liczby zadań
      lub nawet wyłącznie do jednego zadania. W systemach wbudowanych najpopularniejszymi
      modelami programowymi procesorów są RISC oparte na zasadach architektury harvardzkiej
      lub ARM. W systemach czasu rzeczywistego wynik i efekt działania jest zależny
      od chwili wypracowania tego wyniku. Systemy wbudowane współcześnie znajdują
      zastosowania np. w autonomicznych pojazdach, w internecie rzeczy czy w urządzeniach
      rozrywkowych.
    title: Systemy wbudowane i obliczenia czasu rzeczywistego
  - content: Rozpoznawanie wzorców (ang. pattern recognition) to pole badawcze w obrębie
      uczenia maszynowego. Może być definiowane jako działanie polegające na pobieraniu
      surowych danych i podejmowaniu dalszych czynności zależnych od kategorii do
      której należą te dane. W rozpoznawaniu wzorców dąży się do klasyfikacji danych
      (wzorców) w oparciu o wiedzę aprioryczną lub o informacje uzyskane na drodze
      statystycznej analizy danych służącej wydobywaniu cech obiektów. Klasyfikowane
      wzorce to zazwyczaj grupy wyników pomiaru lub obserwacji definiujące położenie
      odpowiadających im punktów w wielowymiarowej przestrzeni cech.
    title: Widzenie komputerowe i rozpoznawanie wzorców
  - content: Sygnały cyfrowe to strumienie bitów informacji, ich przetwarzanie polega
      na wykonaniu na nich pewnych operacji oraz ich interpretacja. Do głównych zastosowań
      należy przetwarzanie dźwięku, kompresja dźwięku, segmentacja obrazów, kodowanie
      wideo, przetwarzanie mowy, rozpoznawanie mowy oraz telekomunikacja cyfrowa.
    title: Przetwarzanie obrazów i mowy
  - content: Gry komputerowe to rodzaj oprogramowania komputerowego przeznaczonego
      do celów rozrywkowych lub edukacyjnych, wymagające od użytkownika (gracza) rozwiązywania
      zadań logicznych lub zręcznościowych. Gry komputerowe mogą być uruchamiane na
      komputerach osobistych, specjalnych automatach, konsolach do gry, telewizorach,
      telefonach komórkowych oraz innych urządzeniach mobilnych. Gry, podobnie jak
      symulacje komputerowe mają wirtualizować pewien fragment rzeczywistości. Zaawansowane
      gry i symulacje są pisane w czystych językach programowania, najczęściej obiektowych
      – jak Simula czy C++ lub są oparte na silnikach jak Unity. Dla mniej wymagających
      symulacji powstały także uniwersalne programy.
    title: Gry komputerowe i symulatory
  - content: Interakcją człowiek–komputer nazywa się wzajemne oddziaływanie między
      człowiekiem a komputerem zachodzące poprzez interfejs użytkownika, czyli część
      sprzętu i oprogramowania zajmującą się obsługą urządzeń wejścia-wyjścia przeznaczonych
      dla interakcji z użytkownikiem. Istnieje wiele rodzajów interfejsów, są to m.in.
      wiersz poleceń, interfejs tekstowy czy interfejs graficzny. Obecnie prowadzone
      są intensywne badania nad wirtualną rzeczywistością, a także interfejsami mózg-komputer.
    title: Interfejsy i interakcje człowiek-komputer
  - content: Aplikacja internetowa (ang. web application), zwana również aplikacją
      webową – program komputerowy, który pracuje na serwerze i komunikuje się poprzez
      sieć komputerową z hostem użytkownika komputera z wykorzystaniem przeglądarki
      internetowej użytkownika, będącego w takim przypadku interaktywnym klientem
      aplikacji internetowej. Od komputerów mobilnych (np. smartfony, tablety) oczekuje
      się, że mogą być swobodnie transportowane podczas normalnego użytkowania, oraz
      pozwalają na przesyłanie danych, głosu i wideo. System mobilny, także przetwarzanie
      mobilne (ang. mobile computing) obejmuje komunikację mobilną oraz sprzęt i oprogramowanie
      mobilne. Kwestie komunikacyjne obejmują sieci ad hoc, infrastrukturę sieci,
      a także właściwości komunikacyjne, protokoły, formaty danych i konkretne technologie.
      Typowy sprzęt mobilny zawiera często różne sensory, np. akcelerometry, które
      są w stanie wykrywać i odbierać sygnały. Najważniejsze mobilne systemy operacyjne
      to iOS oraz Android Linux, gdzie dominują języki Java i Kotlin.
    title: Technologie webowe, mobilne i multimedia
  - content: '- Geoinformatyka – zajmuje się numerycznym przetwarzaniem i analizowaniem
      informacji geograficznej (geoinformacji). Geoinformatyka jest opisywana jako
      nauka i technika zajmująca się strukturą i charakterem danych geograficznych,
      ich przechwytywaniem, klasyfikacją, przetwarzaniem i wizualizacją. Do zastosowań
      geoinformatyki zalicza się kartografię, geodezję, GPS, fotogrametrię, teledetekcję,
      analizę danych przestrzennych, mapowanie i nawigację.

      - Astroinformatyka – zastosowania informatyki w astronomii.'
    title: Informatyka w inżynierii kosmicznej i satelitarnej, astronomii, nawigacji,
      geodezji i geografii
  - content: '- Bioinformatyka (z niem. Bioinformatik) – interdyscyplinarna dziedzina
      obejmujmująca rozwój metod obliczeniowych służących do badania struktury, funkcji
      i ewolucji genów, genomów i białek. Ponadto odpowiada za rozwój metod wykorzystywanych
      do zarządzania i analizy informacji biologicznej gromadzonej w toku badań genomicznych
      oraz badań prowadzonych z zastosowaniem wysokoprzepustowych technik eksperymentalnych.

      - Chemioinformatyka (z niem. Chemoinformatik), także informatyka chemiczna to
      nauka zajmująca się wykorzystaniem informatyki do rozwiązywania różnorodnych
      problemów chemicznych jak np. teoria grafów chemicznych czy badania przestrzeni
      chemicznej. Te techniki, nazywane często metodami in silico, wykorzystywane
      są do przeprowadzania obliczeń w blisko związanej z nią chemii obliczeniowej
      oraz w chemii kwantowej i procesie projektowania leków. Nauka ta znajduje zastosowanie
      w wielu gałęziach przemysłu chemicznego do analizy i przetwarzania danych chemicznych.

      - Informatyka medyczna – zajmuje się zbieraniem, przetwarzaniem, przechowywaniem,
      udostępnianiem i przesyłaniem danych medycznych oraz metodami tworzenia urządzeń
      i systemów informatycznych wykorzystywanych w medycynie. Informatyka medyczna
      znajduje zastosowania między innymi w systemach wspomagania diagnostyki (np.
      IBM Watson for Oncology), oprogramowaniu robotów medycznych, systemach rejestracji,
      przetwarzania i analizy sygnałów i obrazów medycznych oraz systemach teleinformatycznych
      dla telemedycyny.

      - Neuroinformatyka (z niem. Neuroinformatik) znajduje zastosowania w kognitywistyce,
      przy badaniu przetwarzania informacji przez systemy nerwowe w celu zastosowania
      ich w systemach technicznych, m.in. w tworzeniu modeli obliczeniowych, narzędzi
      analitycznych i baz danych do udostępniania, integracji i analizy danych eksperymentalnych
      oraz rozwoju teorii na temat funkcji układu nerwowego. W kontekście INCF neuroinformatyka
      odnosi się do informacji naukowych na temat podstawowych danych eksperymentalnych,
      ontologii, metadanych, narzędzi analitycznych i modeli obliczeniowych układu
      nerwowego. Informatyka kognitywna także odnosi się do zastosowań w kognitywistyce.
      Jednym z najbardziej znanych specjalistów kognitywstyki w Polsce jest Włodzisław
      Duch. Kolejnym powiązanym obszarem jest informatyka afektywna.'
    title: Informatyka w biologii, chemii, medycynie i kognitywistyce
  - content: '- Informatyka przemysłowa – zastosowania informatyki w przemyśle.

      - Informatyka mechaniczna, także mechainformatyka (z niem. Maschinenbauinformatik)
      – zastosowania informatyki w mechanice. Zajmuje się m.in. informatycznymi aspektami
      druku 3D, programowania CNC, mechaniki komputerowej, oraz oprogramowaniem do
      projektowania CAD.

      - Informatyka materiałowa – zastosowania informatyki w materiałoznawstwie i
      inżynierii materiałowej.'
    title: Informatyka w przemyśle, mechanice i inżynierii materiałowej
  - content: '- Informatyka społeczna odnosi się do szeroko rozumianego związku pomiędzy
      technologiami informatycznymi i światem społecznym. Obejmuje między innymi web
      mining, reality mining, symulacje społeczeństw i boty społeczne. Przedmiotem
      zainteresowania badaczy jest także z jednej strony wpływ informatycznych technologii
      komunikacyjnych na zmiany społeczne i psychologiczne wśród osób, które z nich
      korzystają. Z drugiej strony badany jest wpływ zjawisk społecznych na systemy
      informatyczne, między innymi komunikatory, serwisy społecznościowe.

      - Informatyka śledcza – dostarcza cyfrowych środków dowodowych dotyczących przestępstw
      popełnionych cyfrowo lub przy użyciu systemów teleinformatycznych. Jej zadaniami
      są: zbieranie, odzyskiwanie, analiza i prezentacja cyfrowych danych, znajdujących
      się na różnego rodzaju nośnikach (dyski twarde komputerów, dyskietki, płyty
      CD, pamięci przenośne, serwery, telefony komórkowe itp.), oraz w coraz popularniejszych
      ostatnio systemach i serwisach zdalnego gromadzenia, przechowywania i przetwarzania
      danych, takich jak serwisy społecznościowe, przestrzeń dyskowa w chmurze czy
      wyszukiwarki internetowe.

      -Informatyka ekonomiczna (czasem określana również jako informatyka gospodarcza
      lub informatyka zarządcza) – jej przedmiotem zainteresowania są systemy informatyczne
      w organizacjach (szczególnie w przedsiębiorstwach).'
    title: Dalsze zastosowania
  - content: W ramach I etapu edukacji (klasy I-III) uczniowie mają zajęcia z edukacji
      informatycznej w ramach edukacji wczesnoszkolnej. Klasy IV-VIII (II etap edukacyjny)
      realizują przedmiot informatyka. Najważniejszym celem kształcenia informatycznego
      uczniów jest rozwój umiejętności myślenia obliczeniowego (z ang. computational
      thinking), skupionego na kreatywnym rozwiązywaniu problemów z różnych dziedzin
      ze świadomym i bezpiecznym wykorzystaniem przy tym metod i narzędzi wywodzących
      się z informatyki. Takie podejście, rozpoczęte w szkole podstawowej, jest kontynuowane
      w liceum ogólnokształcącym i technikum zarówno w zakresie podstawowym, jak i
      rozszerzonym. Przedmiot informatyka jest realizowany przez wszystkich uczniów
      w każdej klasie, począwszy od klasy I szkoły podstawowej i jest kontynuowany
      w liceum ogólnokształcącym i technikum.
    title: Szkoła podstawowa, liceum i technikum
  - content: Informatyka jest wykładana na uniwersytetach oraz na politechnikach.
      Na politechnikach programy studiów są nastawione na zagadnienia inżynierskie,
      a na uniwersytetach na zagadnienia naukowe. Istnieją także programy studiów
      nastawione na praktyczne zastosowania. Z uwagi na ograniczoną liczbę miejsc
      oraz fakt że informatyka jest chętnie wybieranym kierunkiem studiów, obowiązują
      na nią stosunkowo wysokie progi punktowe. W roku akademickim 2018/2019 zgłosiło
      się 42759 chętnych. W najlepszych uczelniach w kraju w pierwszej kolejności
      są przyjmowani finaliści Olimpiady Informatycznej. Spośród najlepszych jest
      wyłaniana reprezentacja Polski na różne międzynarodowe konkursy informatyczne
      np. Akademickie mistrzostwa świata w programowaniu zespołowym.
    title: Studia wyższe
