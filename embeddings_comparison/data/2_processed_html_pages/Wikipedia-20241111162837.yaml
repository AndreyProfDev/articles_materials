  - content: "'''ASInfo''' – pierwsza w Polsce, sportowa [[Agencja prasowa|agencja\
      \ informacyjna]]. Założona w marcu 2007 roku przez Andrzeja Łukaszewicza. \n\
      Agencja dostarcza sportowy kontent – informacje, zdjęcia, dźwięki mp3, wideo,\
      \ a także wyniki na żywo do polskich i zagranicznych mediów. \nZ usług ASInfo\
      \ korzysta radio [[RMF FM]] oraz portale [[Onet.pl]] i [[Interia.pl]], [[Super\
      \ Express]] a także serwisy internetowe [[Piłka Nożna (tygodnik)]], Futbol.pl,\
      \ Sport24.pl, MagazynPilkarski.pl i Futbolnet.pl. \nWśród klientów agencji jest\
      \ również Radio Chicago, a także kilka polskich rozgłośni lokalnych. Z usług\
      \ ASInfo korzystają również gazety ogólnopolskie oraz lokalne. Agencja dostarcza\
      \ także treści do oficjalnej strony internetowej [[Polski Związek Piłki Nożnej|Polskiego\
      \ Związku Piłki Nożnej]]. ASInfo współpracuje z organizatorem Pucharu Polski,\
      \ firmą Remes. Agencja prowadzi stronę oficjalną rozgrywek [[Puchar Polski w\
      \ piłce nożnej|Remes Pucharu Polski]], dzięki której media korzystają z materiałów\
      \ prasowych.\nW lutym 2008 roku ASInfo rozpoczęło sprzedaż relacji na żywo minuta\
      \ po minucie ze spotkań [[I liga polska w piłce nożnej|Ekstraklasy]], a w lipcu\
      \ [[II liga polska w piłce nożnej|nowej 1. ligi]].\nPodczas Euro 2008, ASInfo\
      \ dostarczało treści i zdjęcia do serwisu internetowego telewizji [[Polsat]].\n\
      Sekretarzem redakcji jest Jarosław Kowal. \n== Linki zewnętrzne ==\n* {{cytuj\
      \ stronę| url = http://www.asinfo.pl| tytuł = Strona agencji ASInfo| data dostępu\
      \ = | autor = | język = pl}}\n[[Kategoria:Agencje prasowe]]\n[[Kategoria:Sport]]"
