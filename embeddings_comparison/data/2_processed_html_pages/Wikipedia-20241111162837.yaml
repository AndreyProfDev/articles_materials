- sections:
  - content: "{{Inne znaczenia|formy aktywności człowieka|[[Sport (ujednoznacznienie)|inne\
      \ znaczenia]]}}\n[[Plik:All sports drawing.svg|mały|Symbole związane ze sportem]]\n\
      [[Plik:Sweden Vaxholm sport 1938.jpg|mały|Sport w 1938 w Szwecji]]\n{{Siostrzane\
      \ projekty\n |commons = Category:Sports\n |słownik = sport\n |źródła = Kategoria:Sport\n\
      \ |cytaty = Sport\n |news =\n |books =\n |podróże =\n |species =\n |wikiwerek\
      \ =\n |meta =\n}}\n'''Sport''' – wszelkie formy aktywności fizycznej, które\
      \ przez uczestnictwo doraźne lub zorganizowane wpływają na wypracowanie lub\
      \ poprawienie kondycji fizycznej i psychicznej, rozwój stosunków społecznych\
      \ lub osiągnięcie wyników sportowych na wszelkich poziomach{{Cytuj |tytuł =\
      \ AltroSport |opublikowany = Sport News |url = https://www.altrosport.net/ |język\
      \ = it-IT}}{{Cytuj |tytuł = Art. 2. – Ustawowe pojęcie sportu – Ustawa z dnia\
      \ 25 czerwca 2010 r. o sporcie |data dostępu = 2019-07-13 |opublikowany = www.arslege.pl\
      \ |url = https://www.arslege.pl/ustawowe-pojecie-sportu/k543/a44341/ |język\
      \ = pl}}.\nZa sport uważa się również współzawodnictwo oparte na aktywności\
      \ intelektualnej, którego celem jest osiągnięcie wyniku sportowego.\nRodzaje\
      \ sportu:\n* sport amatorski – aktywność fizyczna podejmowana dla wypoczynku,\
      \ rozrywki i rekreacji – odnowy sił psychofizycznych,\n* sport wyczynowy – forma\
      \ działalności człowieka, podejmowana dobrowolnie w drodze rywalizacji dla uzyskania\
      \ maksymalnych wyników sportowych,\n* sport profesjonalny – rodzaj sportu wyczynowego\
      \ uprawianego w celach zarobkowych\n* [[sport motorowy|motorsport]] - sport\
      \ rozumiany jako [[rywalizacja]] zawodników na [[pojazd silnikowy|pojazdach\
      \ silnikowych]].\nW ramach [[rekreacja|rekreacji]], rozumianej tu jako odrębne\
      \ pojęcie, brak jest elementu rywalizacji. Różne realizowane w jej ramach czynności,\
      \ poza pracą czy nauką, są wykonywane w miejscu zamieszkania czy pobytu, co\
      \ różni ją z kolei od [[turystyka|turystyki]] – podróży w celu poznawania świata\
      \ i ludzi.\nW niektórych ujęciach sport to również [[kultura fizyczna]], dbanie\
      \ o własne ciało, podziwianie piękna [[zawodnik]]ów uprawiających dane [[Dyscyplina\
      \ sportu|dyscypliny sportu]].\n== Przypisy ==\n{{Przypisy}}\n{{Kontrola autorytatywna}}\n\
      [[Kategoria:Sport| ]]\n[[Kategoria:Gry| ]]"
