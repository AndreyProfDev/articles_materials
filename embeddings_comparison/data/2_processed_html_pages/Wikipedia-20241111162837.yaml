- sections:
  - content: '''''''Teoria sportu'''''' – [[nauka]], która w sposób systemowy zajmuje
      się badaniem człowieka uprawiającego [[sport]] oraz zjawisk działalności sportowej
      w celu poznania i doskonalenia mechanizmów warunkujących skuteczne zachowanie
      człowieka we współzawodnictwie sportowym. Bada ona zjawiska, formułuje prawa,
      uogólnia doświadczenia, kieruje praktyką sportową oraz wyznacza kierunki rozwoju
      sportu{{odn|Ambroży|2007|s=7}}.

      == Działy teorii sportu ==

      Wyróżnia się sześć podstawowych działów teorii sportu{{odn|Ambroży|2007|s=7-8}}:

      * teoria [[Trening|treningu sportowego]] – dotyczy rozpoznania reakcji człowieka
      na bodźce treningowe i pozatreningowe, a także badania efektywności metod, form,
      zasad i środków treningowych.

      * teoria [[Planowanie|planowania]] – polega na wyznaczeniu celów głównych i
      etapowych szkolenia sportowego na podstawie przewidywań efektów pracy.

      * [[prognozowanie]] i selekcja – dotyczy wybrania osobników, których talent
      oraz poziom wybranych cech rokuje w przyszłości osiągnięcie wysokiego poziomu
      sportowego.

      * kontrola pracy treningowej – zespół działań służących ocenie bieżącego stanu
      organizmu zawodnika oraz jego reakcji na stosowane bodźce treningowe.

      * teoria [[Walka|walki sportowej]] – docelowy i centralny punkt szkolenia sportowego,
      obejmujący analizę rywalizacji sportowej.

      * skutki działalności sportowej – dotyczy analizy skutków działalności sportowej,
      od fizjologicznych po psychologiczne.

      == Przypisy ==

      {{Przypisy}}

      == Bibliografia ==

      * {{Cytuj książkę |autor = Tadeusz Ambroży |tytuł = Wprowadzenie do teorii sportu.
      Poradnik metodyczny dla studentów |wydawca = Wydawnictwo „Dla szkoły” |rok =
      2007 |isbn = 978-83-883-9664-9 |odn={{odn/id|Ambroży|2007}}}}

