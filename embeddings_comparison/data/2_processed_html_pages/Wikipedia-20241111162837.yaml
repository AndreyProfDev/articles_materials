      ''''''Wychowanie fizyczne'''''' (''''''wf'''''', ''''''WF'''''') – zamierzone
      i świadome działanie ukierunkowane na kształtowanie [[Postawa prosomatycznych|postaw
      prosomatycznych]] (tj. stosunku do ciała i fizycznego funkcjonowania) oraz [[postaw]]
      prospołecznych (tj. stosunku do życia i innych ludzi, przekonań i wartości moralnych),
      a równocześnie na wspieranie rozwoju fizycznego i zdrowia oraz kształtowanie
      trwałego obyczaju aktywności fizycznej i troskę o wydolność fizyczną, sprawność
      motoryczną i prawidłową postawę ciała.

      == Historia wychowania fizycznego ==

      Świadome wychowanie fizyczne było znane już w czasach starożytnych ([[spartańskie
      wychowanie]]) i traktowane na równi z wychowaniem sportowym i wojskowym; nowożytne
      podstawy wychowania fizycznego powstały w epoce odrodzenia i oświecenia; w XIX
      w. ukształtowały się niezależne systemy wychowania fizycznego: oparty na gimnastyce
      bez elementów sportowych oraz (głównie w USA) oparty na grach i zabawach sportowych;
      po II wojnie światowej do wychowania fizycznego w coraz szerszym stopniu wprowadzano
      zajęcia typowo sportowe.

      == Rozwój myśli o wychowaniu fizycznym w Polsce ==

      Polska myśl wychowania fizycznego sięga tradycjami odrodzenia (m.in. [[Wojciech
      Oczko]] i [[Sebastian Petrycy]]). Pierwszym podręcznikiem metodycznym dla nauczycieli,
      napisanym w języku polskim, były Powinności nauczyciela (I wydanie – 1787) autorstwa
      [[Grzegorz Piramowicz|Grzegorza Piramowicza]]. W pracy tej przedstawiono także
      myśli w zakresie „wychowania co do ciała, to co do zdrowia i sił”. W Ustawach
      [[Komisja Edukacji Narodowej|Komisji Edukacji Narodowej]] (1773–1794) podkreślano
      ścisły związek edukacji fizycznej z edukacją umysłową i moralną. Pierwszy raz
      [[nauczyciel]]a wychowania fizycznego zatrudniono w [[Liceum Krzemienieckie|liceum
      w Krzemieńcu]] na [[Wołyń|Wołyniu]] kierowanym przez [[Tadeusz Czacki|Tadeusza
      Czackiego]]. Cykl wykładów o [[higiena|higienie]] i zdrowiu w tymże liceum prowadził
      dr [[Karol Kaczkowski]]. Na początku XIX wieku dzieło [[Jędrzej Śniadecki|Jędrzeja
      Śniadeckiego]] Uwagi o fizycznym wychowaniu dzieci drukowane było w „[[Dziennik
      Wileński|Dzienniku Wileńskim]]” (1805 r.). Praca ukazała się drukiem dopiero
      w 1840 roku pod tytułem „O fizycznym wychowaniu dzieci”. Wśród później żyjących
      osób, które przysłużyły się rozwojowi wychowania fizycznego w Polsce należy
      wymienić [[Ludwik Bierkowski|Ludwika Bierkowskiego]] (1801–1860), [[Bronisław
      Ferdynand Trentowski|Bronisława Trentowskiego]] (1808–1869), [[Henryk Jordan|Henryka
      Jordana]] (1842–1907), [[Wenanty Piasecki|Wenantego Piaseckiego]] (1832–1903),
      [[Władysław Ryszard Kozłowski|Władysława Ryszarda Kozłowskiego]] (1866–1915),
      [[Eugeniusza Piaseckiego|Eugeniusz Piasecki]] (1872–1947), [[Walerian Sikorowski|Waleriana
      Sikorskiego]] (1876–1940), [[Florian Znaniecki|Floriana Znanieckiego]] (1882–1956),
      [[Władysław Osmolski|Władysława Osmolskiego]] (1883–1935), [[Zygmunt Gilewicz|Zygmunta
      Gilewicza]] (1880–1960). Na kształt i rozwój współczesnej teorii wychowania
      fizycznego największy wpływ wywierają takie osoby, jak: [[Roman Trześniowski]],
      [[Ryszard Przewęda]], [[Maciej Demel]], [[Henryk Grabowski (sportowiec)|Henryk
      Grabowski]], [[Andrzej Pawłucki]], [[Krzysztof Zuchora]], [[Marian Bukowiec]],
      [[Wiesław Osiński]].

      Pionierską organizacją wychowania fizycznego i [[sport]]u w Polsce było [[Polskie
      Towarzystwo Gimnastyczne „Sokół”]], którego pierwsze gniazdo zostało założone
      7 lutego 1867 we [[Lwów|Lwowie]]130 lat Sokolstwa Polskiego. Międzynarodowa
      Konferencja Naukowa Kraków – Lwów 21.06-30.06.1997, red. Andrzej Łopata, Kraków
      1997.. Członkowie towarzystwa rozpoczęli po raz pierwszy w Polsce systematyczne
      lekcje gimnastyczne od 1 maja 1867 roku pod kierunkiem dra Wenantego [[Walenty
      piasecki|Piaseckiego]] – lekarza oraz absolwenta kursów gimnastycznych w [[Praga|Pradze]]
      i [[Drezno|Dreźnie]]{{Cytuj |autor = [[Andrzej Bogusz (historyk sportu)|Andrzej
      Bogusz]] |tytuł = Sokolstwo łódzkie 1905–1995 |data = 1995 |isbn = 83-901851-5-6
      |miejsce = Łódź |wydawca = [Muzeum Historii Miasta Łodzi] |s = 3 |oclc = 749533307}}.

      == Cele wychowania fizycznego ==

      Współczesne cele wychowania fizycznego ukierunkowane są na wspieranie rozwoju
      społecznego, fizycznego i poznawczego. Pate i Hohn (1994) za misję wychowania
      fizycznego uznali „przygotowanie dzieci i młodzieży do fizycznie aktywnej dorosłości”.
      Wyróżnili następujące cele wychowania fizycznego:

      # Wspieranie osiągnięć w zakresie umiejętności ruchowych.

      # Promocja poprawy sprawności fizycznej.

      # Wspieranie poznawczego uczenia.

      # Wspieranie rozwoju społecznego.

      # Wspieranie świadomości kulturowej i kulturalnej.

      # Wspieranie osiągnięć szkolnych.

      # Wspieranie i przygotowanie do całożyciowej aktywności fizycznej i utrzymanie
      sprawności.

      Natomiast wg Osińskiego (2011) cele wychowania fizycznego dotyczą następujących
      aspektów:

      # Postawy i motywacje – prosomatyczne i prospołeczne

      # Wiedza i zrozumienie.

      # Umiejętności doskonalenia i władania ciałem.

      # Sprawność i kondycja fizyczna.

      == Wychowanie fizyczne w polskiej szkole ==

      Lekcje wychowania fizycznego w szkole realizowane są w następującym wymiarze
      (tygodniowo):

      # I etap edukacyjny (klasy I-III szkoły podstawowej) — 3 godziny lekcyjne

      # II etap edukacyjny (klasy IV-VI szkoły podstawowej) — 4 godziny lekcyjne

      # III etap edukacyjny (klasy VII-VIII) — 4 godziny lekcyjne

      # IV etap edukacyjny (szkoła ponadpodstawowa) — 3 godziny lekcyjne

      Od drugiego etapu edukacyjnego dzieci i młodzież mogą realizować wychowanie
      fizyczne w ramach zajęć klasowo-lekcyjnych i zajęć do wyboru. Zajęcia do wyboru
      (maksymalnie na 2 lekcjach wychowania fizycznego w tygodniu) są dla uczniów
      możliwością realizacji swoich zainteresowań daną formą aktywności fizycznej.
      Z zaproponowanej oferty przez szkołę (po diagnozie zainteresowań wśród uczniów)
      dzieci i młodzież mogą wybrać zajęcia o charakterze sportowym, tanecznym, aktywnej
      turystyki lub sprawnościowo-zdrowotnym.

      Podczas zajęć klasowo-lekcyjnych uczniowie i nauczyciele realizują tzw. podstawę
      programową, czyli wymagania (jako treści) które należy osiągnąć podczas lekcji
      wychowania fizycznego na danym etapie edukacyjnym. Treści te dotyczą takich
      zagadnień, jak (istnieją różnice w zależności od etapu edukacyjnego):

      # Diagnoza sprawności fizycznej i rozwoju fizycznego

      # Trening zdrowotny

      # Sporty całego życia i wypoczynek

      # Bezpieczna aktywność fizyczna i higiena osobista

      # Sport

      # Taniec

      # Edukacja zdrowotna

      Wychowanie fizyczne przygotowuje do całożyciowej troski o swoje ciało poprzez
      aktywność fizyczną, dbałość o swoją sprawność fizyczną i zdrowie. Podczas lekcji
      wychowania fizycznego uczeń winien pogłębiać wiedzę, nabywać umiejętności i
      rozwijać pożądane postawy (prosomatyczne, prozdrowotne i prospołeczne). Wychowanie
      fizyczne ma kierunek prozdrowotny.

      Sport w wychowaniu fizycznym jest jedynie środkiem do osiągania celów wychowania
      fizycznego. Osiągnięcia sportowe nie stanowią natomiast nadrzędnego celu w wychowaniu
      fizycznym.

