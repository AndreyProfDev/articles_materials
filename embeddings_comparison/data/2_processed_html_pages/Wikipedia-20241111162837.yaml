- sections:
  - content: "[[Plik:20080831 przebrania the human race 10k.jpg|thumb|200px|The Human\
      \ Race [[2008]] w [[Warszawa|Warszawie]]]]\n[[Plik:Ultimate frisbee 10.jpg|thumb|200px|[[Frisbee]]]]\n\
      [[Plik:Skitouring.jpg|thumb|200px|[[skituring]]]]\n'''Sport rekreacyjny, masowy'''\
      \ – stanowi formę czynnego [[Rekreacja|wypoczynku]] z zachowaniem współzawodnictwa\
      \ jako czynnika [[motywacja|motywującego]]{{Cytuj|tytuł = Wielka Encyklopedia\
      \ PWN |data = 2004 |isbn = 83-01-14193-X 83-01-13357-0 |wolumin = 25 |inni =\
      \ Jan Wojnowski (red.) |miejsce = Warszawa |wydawca = Wydawnictwo Naukowe PWN\
      \ |s = 455 |oclc = 830629358 }}.\nJego zadaniem jest m.in. odprężenie po [[Zatrudnienie|pracy]],\
      \ regeneracja sił, utrzymanie sprawności fizycznej oraz dobrego stanu zdrowia.\
      \ Powoduje m.in. wzrost tolerancji wysiłku fizycznego oraz zwiększenie siły\
      \ mięśniowej stabilizującej stawy. Jest jednym z czynników przyczyniających\
      \ się do zapobiegania [[choroby cywilizacyjne|chorobom cywilizacyjnym]]. \n\
      Zalecany jest m.in. przy [[Profilaktyka zdrowotna|profilaktyce]], [[leczenie|leczeniu]]\
      \ i [[Rehabilitacja medyczna|rehabilitacji]] chorób [[Układ krwionośny człowieka|układu\
      \ krążenia]] i [[narząd ruchu|narządu ruchu]]. Jako rodzaj rehabilitacji można\
      \ tu wymienić [[Sporty niepełnosprawnych|sport niepełnosprawnych]]. Znaczenie\
      \ ma także sport dzieci i młodzieży, który stanowi element [[wychowanie|wychowania]]\
      \ oraz zapobiega [[choroba|chorobom]].\nDo dyscyplin tego sportu można zaliczyć\
      \ m.in.: \n* gimnastykę rekreacyjną (m.in. różne formy gimnastyczno-taneczne,\
      \ [[gimnastyka aerobowa]]);\n* [[Pływanie (sport)|pływanie]] (m.in. [[nurkowanie]]\
      \ rekreacyjne);\n* bieg i chód kondycyjny;\n* sporty indywidualne i zespołowe\
      \ (m.in. [[tenis]], [[tenis stołowy]], [[softball]], [[korfball]], [[Ringo (sport)|ringo]],\
      \ [[frisbee]], [[badminton]], [[golf]], [[kręgle]], [[unihokej]], wspinaczka\
      \ sportowa); \n* zespołowe gry sportowe (m.in. [[piłka siatkowa|siatkówka]],\
      \ [[koszykówka]], [[piłka nożna]]);\n* sporty wodne (m.in. [[żeglarstwo]], sporty\
      \ motorowodne, [[kajakarstwo]], [[surfing]], [[windsurfing]])\n* sporty zimowe\
      \ (m.in. [[narciarstwo|narciarstwo zjazdowe]] i [[Biegi narciarskie|biegowe]],\
      \ [[saneczkarstwo]], [[łyżwiarstwo]], [[curling]]);\n* [[lekkoatletyka|lekkoatletykę]]\
      \ (biegi, skoki, rzuty); \n* sporty walki ([[judo]], [[jujutsu]], [[karate]],\
      \ [[taekwondo]], [[aikido]], [[kendo]]); \n* [[aerobik]], [[aqua-aerobic]],\
      \ [[body ballet]], [[callanetics]], [[fitness]], [[joga]], [[taijiquan]];\n\
      * [[Jeździectwo|jazdę konną]];\n* [[gry terenowe]] i [[Wieloboje lekkoatletyczne|wieloboje]].\n\
      == Przypisy ==\n{{Przypisy}}\n==Zobacz też==\n* [[sport widowiskowy]]\n== Bibliografia\
      \ ==\n* ''Sport dla wszystkich. Wybrane dyscypliny'', PTNKF, [[Warszawa]] [[1997]],\
      \ {{ISBN|83-86622-32-6}}\n[[Kategoria:Sport]]\n[[Kategoria:Rekreacja]]\n[[Kategoria:Medycyna\
      \ sportowa]]"
