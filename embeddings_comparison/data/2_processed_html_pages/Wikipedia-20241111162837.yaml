  - content: '{{Dopracować|źródła=2010-08|styl}}

      ''''''Psychologia sportu'''''' – zajmuje się wykorzystaniem teorii, zasad i
      technik zaczerpniętych z [[psychologia|psychologii]], w celu poprawy osiągnięć
      oraz rozwoju osobistego osób uprawiających ćwiczenia fizyczne i [[sport]](Williams,
      Straub, 1993)..

      == Zadania psychologii sportu ==

      * obserwacja zjawisk i procesów psychologicznych zachodzących w sporcie

      * opis tych zjawisk i procesów

      * wyjaśnianie czynników, które wpływają na te zjawiska i procesy

      * przewidywanie rozwoju tych [[zjawisko|zjawisk]] i procesów

      * kontrola oraz modelowanie zjawisk i procesów

      == Zadania psychologa sportu ==

      * badaniami – czyli studiowaniem wszelkich psychologicznych aspektów sportu

      * edukacją – czyli nauczaniem [[student]]ów, działaczy, [[trener]]ów, sportowców
      psychologii sportu

      * zastosowaniem – czyli diagnozowaniem i interweniowaniem w zakresie problemów
      psychologicznych wynikających z uprawiania sportu

      == Zobacz też ==

      * [[kinezjologia]]

      * [[trening mentalny]]

      * [[twórcza wizualizacja]]

      * [[trener personalny]]

