- sections:
  - content: "'''Porównawcze badanie efektywności''' ([[język angielski|ang.]] Comparative\
      \ Effectiveness Research, CER) – metoda mająca za zadanie stwierdzić skuteczność\
      \ stosowanych leków i procedur medycznych.\nMetoda polega na porównaniu różnych\
      \ stosowanych w terapii leków i procedur medycznych ze względu na ich skuteczność\
      \ i koszt{{r|fors}}.\nTradycyjnie wykorzystuje się do tego celu badania [[Randomizacja|randomizowane]].\
      \ Są one jednak drogie i mało przekonujące dla lekarzy (ze względu na wyidealizowaną\
      \ sytuacje badawczą). Komputerowa analiza medycznych [[Baza danych|baz danych]]\
      \ (przechowujących informacje o przebiegu leczenia konkretnych pacjentów) pozwala\
      \ analizować większe grupy pacjentów przy mniejszych kosztach.\n== Przypisy\
      \ ==\n{{Przypisy|\n{{Cytuj | autor =Laura P Forsythe, Lori B Frank, Thomas A\
      \ Workman, Tandrea Hilliard, Daniel Harwell, Lauren Fayish| tytuł =Patient,\
      \ caregiver and clinician views on engagement in comparative effectiveness research|\
      \ czasopismo =J Comp Eff Res| wydanie =6(3)| data=2017| doi =10.2217/cer-2016-0062|\
      \ s =231-244}} \n}}\n<!-- {{Uwagi}} -->\n== Bibliografia ==\n* {{cytuj pismo|nazwisko=Begley|imię=Sharon|tytuł=Najlepsze\
      \ lekarstwo|czasopismo=Świat Nauki|wydawca=Prószyński Media|wolumin=nr. 8 (240)|issn=0867-6380|data=sierpień\
      \ 2011|strony=38-43}}\n[[Kategoria:Metodologia nauki]]\n[[Kategoria:Medycyna]]"
