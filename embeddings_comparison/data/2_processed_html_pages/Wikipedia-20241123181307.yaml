      \ = ringieraxelspringer.pl |url = https://ringieraxelspringer.pl/press_room/medonet.pl-z-miedzynarodowym-i-uznanym-na-swiecie-certyfikatem-trust-od-aaci-america}}.\n\
      == Akcje społeczne i profilaktyczne Medonetu ==\nHasło przewodnie serwisu to\
      \ „Zdrowie w Twoich rękach”. Portal regularnie przeprowadza największe w polskim\
      \ internecie badanie zwiększające świadomość na temat stanu zdrowia Polaków\
      \ – Narodowy Test Zdrowia Polaków. Wyniki badań Medonetu publikowane są międzynarodowych\
      \ punktowanych czasopismach, takich jak \"Vaccines\", \"Nutrients\" i \"International\
      \ Journal of Environmental Research and Public Health\".\nW 2022 i 2023 zorganizował\
      \ także Narodowy Test Żywienia Polaków{{Cytuj | url=https://narodowytestzywienia.medonet.pl/\
      \ | tytuł=Onet - Narodowy Test Żywienia<!-- Tytuł wygenerowany przez bota -->\
