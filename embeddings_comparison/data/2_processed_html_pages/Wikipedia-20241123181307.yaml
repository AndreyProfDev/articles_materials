- sections:
  - content: "'''Hospicjum perinatalne''' (od [[język grecki|gr.]] ''peri'' „wokół”\
      \ i {{łac.|nascor}} „rodzić”, {{k|la|natalis}} „urodzony”) – rodzaj [[hospicjum]],\
      \ będący miejscem medycznego, psychologicznego i duchowego wsparcia dla rodziców,\
      \ spodziewających się dzieci ze [[Badania prenatalne|zdiagnozowanymi prenatalnie]]\
      \ określonymi wadami lub zespołami [[Wady wrodzone|wad wrodzonych]], które według\
      \ obowiązującej wiedzy medycznej prowadzą do śmierci podczas [[Poród u człowieka|porodu]]\
      \ lub w niedługim czasie po nim{{Cytuj |tytuł = opiekunrodzinny.pl - Hospicjum\
      \ perinatalne |data dostępu = 2021-02-08 |opublikowany = www.hospicja.pl |url\
      \ = https://www.hospicja.pl/hospicjum-dzieciece/hospicjum-perinatalne#faqnoanchor\
      \ |archiwum = https://web.archive.org/web/20210214203438/https://www.hospicja.pl/hospicjum-dzieciece/hospicjum-perinatalne#faqnoanchor\
      \ |zarchiwizowano = 2021-02-14 }}.\n== Idea hospicjów perinatalnych ==\nHospicja\
      \ perinatalne stanowić mogą alternatywę dla [[aborcja|aborcji]] ze wskazań embriopatologicznychElżbieta\
      \ Lachman, ''Hospicjum perinatalne − o co chodzi?'', w: ''Głos dla Życia'',\
      \ nr 3(152)/2018, s.22-23, ISSN 1231-207X. Hospicjum perinatalne może też oznaczać\
      \ odmiejscowioną formę opieki psychologicznej i lekarskiej nad [[Rodzina (socjologia)|rodziną]]\
      \ oczekującą dziecka, u którego zdiagnozowano ciężką chorobę bądź upośledzenie{{Cytuj\
      \ stronę |url=http://www.hospicjum-podkarpackie.pl/projekt/aktualnosci/czym-jest-hospicjum-perinataln.html\
      \ |tytuł=Hospicjum Podkarpackie, ''Czym jest hospicjum perinatalne?'' |data\
      \ dostępu=2018-07-25 |archiwum=https://web.archive.org/web/20180725230530/http://www.hospicjum-podkarpackie.pl/projekt/aktualnosci/czym-jest-hospicjum-perinataln.html\
      \ |zarchiwizowano=2018-07-25 }}, a nawet koncepcję objęcia [[holizm|holistyczną]]\
      \ opieką rodzin, które otrzymują informację, że ich jeszcze nienarodzone dziecko\
      \ żyć będzie krócej od nich samych[http://perinatalne.pl/ Warszawskie Hospicjum\
      \ Perinatalne]. Ideę rozwinął jako pierwszy Whitfield ze współpracownikami w\
      \ roku 1982, określając ją [[Skrótowiec|skrótowcem]] PPC (''perinatal palliative\
      \ care'' – „okołoporodowa [[Medycyna paliatywna|opieka paliatywna]]”){{Cytuj\
      \ |autor = Aleksandra Korzeniewska-Eksterowicz, Maria Respondek-Liberska, Łukasz\
      \ Przysło, Wojciech Fendler, Wojciech Młynarski |tytuł = Perinatal Palliative\
      \ Care: Barriers and Attitudes of Neonatologists and Nurses in Poland |czasopismo\
      \ = The Scientific World Journal |data = 2013-10-28 |data dostępu = 2021-02-01\
      \ |issn = 2356-6140 |wolumin = 2013 |doi = 10.1155/2013/168060 |pmid = 24288459\
      \ |pmc =PMC3830873}}. Według stanu na rok 2019 sieć hospicjów perinatalnych\
      \ jest dobrze rozbudowana w [[Stany Zjednoczone|Stanach Zjednoczonych]] i [[Kanada|Kanadzie]],\
      \ w [[Europa|Europie]] natomiast ich koncepcja pozostaje stosunkowo mało znana{{Cytuj\
      \ |autor = Franziska Flaig, Julia D Lotz, Kathrin Knochel, Gian Domenico Borasio,\
      \ Monika Führer |tytuł = Perinatal Palliative Care: A qualitative study evaluating\
      \ the perspectives of pregnancy counselors |czasopismo = Palliative Medicine\
      \ |data = 2019-6 |data dostępu = 2021-02-01 |issn = 0269-2163 |wolumin = 33\
      \ |numer = 6 |s = 704–711 |doi = 10.1177/0269216319834225 |pmid = 30843464 |pmc\
      \ =PMC6535800}}.\nZaobserwowano, że ciężarne kobiety (jak również ich partnerzy)\
      \ pod wpływem wykrycia u płodu choroby niekompatybilnej z przeżyciem doznają\
      \ przeważnie ciężkiego szoku [[Emocja|emocjonalnego]] powiązanego z uczuciami\
      \ rozpaczy i bezradności, który uniemożliwia im adekwatne wyrażenie swoich obaw.\
      \ Z tego powodu za dobrą praktykę w procesie doradztwa medycznego uznaje się\
      \ szczegółowe powiadomienie ciężarnej zarówno o możliwości przerwania ciąży,\
      \ jak i jej kontynuowania ze wsparciem hospicjum perinatalnego, o ile obydwa\
      \ warianty są dostępne prawnie i faktycznie. Badanie przeprowadzone w szpitalach\
      \ okolic [[Łódź|Łodzi]] wykazało, że z takim podejściem zgadza się ponad 75%\
      \ lekarzy oraz 65% pielęgniarek. Wówczas na donoszenie ciąży decyduje się, w\
      \ zależności od konkretnych uwarunkowań, około 40–85% kobiet, a ponad 90% z\
      \ nich nie żałuje później tej decyzji. Niektórzy publicyści zwracają jednak\
      \ uwagę na to, że kiedy ciężarnej nie pozostawia się możliwości wyboru, automatycznie\
      \ kierując ją do hospicjum perinatalnego, może ono być postrzegane wbrew swoim\
      \ założeniom jako miejsce [[Opresja społeczna|opresyjne]]{{Cytuj |autor = Sebastian\
      \ Łupak |tytuł = Jacek Hołub: \"Hospicja perinatalne? To wskazanie kobiecie\
      \ miejsca jej tortur\" |data = 2021-01-29 |data dostępu = 2021-02-01 |opublikowany\
      \ = ksiazki.wp.pl |url = https://ksiazki.wp.pl/jacek-holub-hospicja-perinatalne-to-wskazanie-kobiecie-miejsca-jej-tortur-6602429566691872a\
      \ |język = pl}}.\n== Zasady funkcjonowania ==\nCo do zasady, hospicjum perinatalne\
      \ pełni rolę miejsca wsparcia poprzez okazanie zrozumienia, psychologiczne przygotowanie\
      \ do narodzin chorego dziecka, naukę opieki nad nim, jak również pomaga w przeżywaniu\
      \ [[żałoba|żałoby]] po nieuchronnej utracie. Działalność hospicjów perinatalnych\
      \ opiera się najczęściej na zespołach rodzinnych tworzonych przez lekarzy specjalistów:\
      \ [[pediatria|pediatrów]], [[neonatologia|neonatologów]], [[ginekologia|ginekologów]],\
      \ [[położnictwo|położników]], [[pielęgniarstwo|pielęgniarki]], [[psychologia|psychologów]],\
      \ [[Rehabilitacja medyczna|rehabilitantów]] i personel pomocniczy. Specjaliści\
      \ ci, uwzględniając indywidualność poszczególnych przypadków, nauczają odpowiednich\
      \ zachowań, zabiegów stosownych do schorzeń, jak również akceptacji zaistniałej\
      \ sytuacji. W chwili utraty dziecka udzielają psychologicznego wsparcia w procesie\
      \ przeżywania żałoby. Za zgodą zainteresowanych dochodzić może do powstawania\
      \ [[grupa wsparcia|grup wsparcia]] i kontaktów pomiędzy rodzinami o podobnych\
      \ problemach. Zależnie od lokalnej specyfiki może być udzielane wsparcie w zakresie\
      \ duchowym i religijnym, często w postaci pomocy w [[chrzest|ochrzczeniu]] dziecka.\n\
      Hospicja perinatalne udzielają pomocy matkom, u których wykryto [[Mutacja letalna|wadę\
      \ letalną]] [[płód|płodu]], a także ich rodzinom. Jako przykładowe wady tego\
      \ rodzaju często bywają wymieniane niektóre [[Trisomia|trisomie]] [[Autosomy|autosomalne]]\
      \ ([[zespół Pataua]], [[zespół Edwardsa]]). Pacjenci spotykają się w hospicjum,\
      \ gdzie przygotowywani są do porodu, odbywają go, a potem pozostają na oddziale\
      \ neonatologicznym. W przypadkach, gdy dziecko może udać się do domu, pracownicy\
      \ hospicjum pomagają przygotować mieszkanie na przyjęcie dziecka i zaopatrują\
      \ je w niezbędny sprzęt. Skierowania do hospicjum perinatalnego wystawiają w\
      \ Polsce lekarze prowadzący [[ciąża|ciążę]] lub inni lekarze, np. [[genetyka|genetycy]].\
      \ \n== Formy pomocy ==\nW Polsce korzystanie z pomocy hospicjum perinatalnego,\
      \ warunkowane jest skierowaniem na jednego z rodziców dziecka wydanym przez\
      \ lekarza mającego podpisany kontrakt z [[Narodowy Fundusz Zdrowia|Narodowym\
      \ Funduszem Zdrowia]]. W skierowaniu tym określone musi zostać rozpoznanie (wada\
      \ płodu). Opieka hospicjum perinatalnego jest bezpłatna, są one utrzymywane\
      \ głównie z darowizn{{Cytuj |tytuł = opiekunrodzinny.pl - Hospicjum perinatalne\
      \ |data dostępu = 2021-02-08 |opublikowany = www.hospicja.pl |url = https://www.hospicja.pl/hospicjum-dzieciece/hospicjum-perinatalne\
      \ |archiwum = https://web.archive.org/web/20201128142652/https://www.opiekunrodzinny.pl/hospicjum-dzieciece/hospicjum-perinatalne}}.\
      \ W ramach hospicjów można uzyskać następujące formy pomocy: wyjaśnienie specyfiki\
      \ choroby dziecka i rokowania oraz możliwych scenariuszy postępowania; zapewnienie\
      \ profesjonalnej pomocy psychologicznej; omówienie zasad opieki hospicyjnej;\
      \ przygotowanie pomieszczeń mieszkalnych i wyposażenia w sprzęt niezbędny do\
      \ opieki nad chorym noworodkiem; zapewnienie pomocy socjalnej i duchowej oraz\
      \ umożliwienie kontaktu z innymi rodzicami dziecka dotkniętego wadą letalną.\
      \ Rodzinom, u których rozpoznano lub postawiono podejrzenie wady letalnej płodu,\
      \ proponuje się różnego rodzaju konsultacje ekspertów: lekarzy pediatrów, psychologów,\
      \ genetyków oraz ginekologów położników{{Cytuj |autor = anim8.eu |tytuł = Hospicjum\
      \ perinatalne w Łodzi |data dostępu = 2021-02-08 |opublikowany = Fundacja Gajusz\
      \ Łódź |url = https://gajusz.org.pl/dla-potrzebujacych/hospicjum-perinatalne/\
      \ |język = pl}}.\n== Lista hospicjów perinatalnych w Polsce ==\nPoniżej przykładowa\
      \ lista hospicjów perinatalnych w Polsce wraz ze wskazaniem miast, w których\
      \ się znajdują{{Cytuj |autor = Anna Sierant |tytuł = Na czym polega działalność\
      \ hospicjum perinatalnego? |data = 2020-10-30 |data dostępu = 2021-02-08 |opublikowany\
      \ = Zdrowie i medycyna Wprost |url = https://zdrowie.wprost.pl/dziecko/10382744/na-czym-polega-dzialalnosc-hospicjum-perinatalnego.html\
      \ |język = pl}} \n* Białystok – Fundacja „Pomóż Im” na rzecz Dzieci z Chorobami\
      \ Nowotworowymi i Hospicjum dla Dzieci \n* Bydgoszcz – Centrum Opieki Perinatalnej\
      \ św. Łazarza w Bydgoszczy (jedyne polskie hospicjum perinatalne, które nie\
      \ działa przy innym hospicjum, a jest osobną jednostką)\n* Gdańsk – Hospicjum\
      \ im. ks. Eugeniusza Dutkiewicza SAC GDAŃSK\n* Gdańsk – Hospicjum Perinatalne\
      \ Tulipani prowadzone przez Fundację Hospicjum Pomorze Dzieciom\n* Katowice\
      \ – Stowarzyszenie „Śląskie Hospicjum Perinatalne”\n* Kraków – Alma Spei Hospicjum\
      \ dla Dzieci Kraków\n* Kraków – Krakowskie Hospicjum dla Dzieci im. ks. Józefa\
      \ Tischnera\n* Kraków – Małopolskie Hospicjum dla Dzieci w Krakowie\n* Lublin\
      \ – Lubelskie Hospicjum dla Dzieci im. Małego Księcia\n* Łódź – Fundacja Gajusz\n\
      * Opole – Fundacja Domowe Hospicjum dla Dzieci w Opolu\n* Poznań – Wielkopolskie\
      \ Hospicjum Perinatalne RAZEM\n* Rzeszów – Podkarpackie Hospicjum dla Dzieci\n\
      * Tychy – Fundacja Śląskie Hospicjum dla Dzieci „Świetlikowo”\n* Warszawa –\
      \ Warszawskie Hospicjum dla Dzieci\n* Wrocław – Stowarzyszenie Medyczne Hospicjum\
      \ dla Dzieci Dolnego Śląska „Formuła Dobra”\n== Przypisy ==\n{{wikisłownik|hospicjum}}\n\
      {{Przypisy}}\n{{zastrzeżenia|medycyna}}\n[[Kategoria:Hospicjum|perinatalne]]\n\
      [[Kategoria:Ruch pro-life]]\n[[Kategoria:Medycyna]]\n[[Kategoria:Ciąża]]"
