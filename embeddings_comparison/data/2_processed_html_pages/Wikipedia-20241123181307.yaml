  title: Głodówka lecznicza
- sections:
  - content: '''''''Prehabilitacja'''''' – szerokie pojęcie oznaczające wcześniejsze
      przygotowanie [[Organizm|organizmu]] do ciężkiego wysiłku, związanego z dużym
      obciążeniem fizycznym i energetycznym. To działanie [[Profilaktyka zdrowotna|profilaktyczne]],
      mające na celu stworzenie rezerwy czynnościowej i metabolicznej celem lepszej
      tolerancji spodziewanego wysiłku i obciążenia. W ostatnich latach pojęcie to
      staje się coraz bardziej popularne w [[Medycyna|medycynie]] i oznacza optymalne,
      wielokierunkowe przygotowanie [[pacjent]]a do [[Leczenie|leczenia]], najczęściej
      [[Operacja (medycyna)|operacyjnego]] dla poprawy jego stanu ogólnego dla lepszego
      przebiegu pooperacyjnego. Działanie takie ma na celu zmniejszenie ryzyka [[Powikłanie|powikłań]],
      skrócenie czasu [[Hospitalizacja|hospitalizacji]], osiągnięcia w jak najkrótszym
      czasie jak najwyższej jakości życiahttp://www.prehabilitacja.pl..

      == Historia prehabilitacji ==

      Określenie to w literaturze medycznej pojawiło się po raz pierwszy w roku 1946
      i dotyczyło poprawy wyników odzyskiwania [[Sprawność ruchowa|sprawności]] przez
      żołnierzyPREHABILITATION, rehabilitation, and revocation in the Army. Br Med
      J. 1946 Jun 29;1:192-7.. Koncepcja prehabilitacji w dzisiejszym rozumieniu tego
      pojęcia pojawiło się w połowie lat 80. i dotyczyły przygotowania sportowców
      celem minimalizacji ryzyka [[Uraz (medycyna)|urazów]] i ich następstwSpain J:
      Prehabilitation. Clin Sports Med. 1985 Jul;4(3):575-85.. Pierwszy artykuł, w
      którym pojęcie prehabilitacji dotyczy pacjentów, dokładnie zaś ćwiczeń przygotowujących
      do zabiegów operacyjnych i pobycie na oddziałach [[Intensywna terapia|intensywnej
      terapii]] ukazał się w roku 2002Topp R, Ditmyer M, King K, Doherty K, Hornyak
      J 3rd: The effect of bed rest and potential of prehabilitation on patients in
      the intensive care unit. AACN Clin Issues. 2002 May;13(2):263-76.. W chwili
      obecnej pojęcie to staje się coraz bardziej popularne. Liczba artykułów na portalu
      PubMed dotyczących prehabilitacji lub z nią związanych przekracza obecnie 500
      i szybko rośnie w ostatnich latach.

      == Podstawowe elementy prehabilitacji ==

      Prehabilitacja to działanie kompleksowe, obejmujące cztery podstawowe elementy:
      przygotowanie żywieniowe, [[ćwiczenia fizyczne]], wsparcie [[Psychologia|psychologiczne]]
      oraz rezygnację z [[Uzależnienie|nałogów]]Carli F, Gillis C, Scheede-Bergdahl
      C: Promoting a culture of prehabilitation for the surgical cancer patient. Acta
      Oncol. 2017 Feb;56(2):128-133. doi: 10.1080/0284186X.2016.1266081. Epub 2017
      Jan 9..

      === Przygotowanie żywieniowe ===

      Stosowanie odpowiednio dobranej [[Dieta|diety]], w tym preparatów żywieniowych
      i [[Suplement diety|suplementów]], celem wyrównania niedoborów żywieniowych,
      zwłaszcza u pacjentów [[Niedożywienie|niedożywionych]] i [[Wyniszczenie|wyniszczonych]]Gillis
      C, Wischmeyer PE: Pre-operative nutrition and the elective surgical patient:
      why, how and what? Anaesthesia. 2019 Jan;74 Suppl 1:27-35. doi: 10.1111/anae.14506..
      Działanie takie jest również uzasadnione u osób bez cech niedożywienia i polega
      na stosowaniu żywienia immunomodulującego, na przykład u pacjentów poddanych
      zabiegom operacyjnym w obrębie [[Przewód pokarmowy|przewodu pokarmowego]]Adiamah
      A, Skořepa P, Weimann A, Lobo DN: The Impact of Preoperative Immune Modulating
      Nutrition on Outcomes in Patients Undergoing Surgery for Gastrointestinal Cancer:
      A Systematic Review and Meta-analysis. Ann Surg. 2019 Aug;270(2):247-256. doi:
      10.1097/SLA.0000000000003256..

      === Ćwiczenia fizyczne ===

      Ćwiczenia mają na celu poprawę [[Wydolność fizyczna|wydolności fizycznej]],
      ale też opanowanie podstawowych elementów usprawniania po zabiegu, jak odpowiedni
      tor oddechowy czy wstawanie z łóżka. Ten element jest bardzo istotny u pacjentów
      poddawanych zabiegom [[Ortopedia|ortopedycznym]], [[Torakochirurgia|torakochirurgicznym]]
      czy rozległych zabiegów brzusznychGonçalves CG, Groth AK: Prehabilitation: how
      to prepare our patients for elective major abdominal surgeries? Rev Col Bras
      Cir. 2019 Nov 25;46(5):e20192267. doi: 10.1590/0100-6991e-20192267. eCollection
      2019..

      === Wsparcie psychologiczne ===

      Jego główną rolą jest ograniczenie lęku pacjenta, co nie tylko poprawia jego
      komfort, ale jest też wymiernym elementem ułatwiającym przeprowadzenie samego
      zabiegu operacyjnego, jak również zmniejszenie ryzyka powikłań pooperacyjnychLevett
      DZH, Grimmett C: Psychological factors, prehabilitation and surgical outcomes:
      evidence and future directions. Anaesthesia. 2019 Jan;74 Suppl 1:36-42. doi:
      10.1111/anae.14507..

      === Rezygnacja z nałogów ===

      Bardzo istotna jest również rezygnacja z nałogów, szczególnie palenia [[papieros]]ów,
      które stanowią jeden z najistotniejszych czynników ryzyka powikłań pooperacyjnych,
      zarówno bezpośrednich ([[zapalenie płuc]], zakażenie miejsca operowanego), jak
      i pośrednich (dłuższe pobyty szpitalne, większe ryzyko nieszczelności zespoleń
      w obrębie przewodu pokarmowego). Pacjenci przed zabiegiem, zwłaszcza planowym,
      powinni być dokładnie poinstruowani o konieczności zaprzestania palenia i otrzymać
      odpowiednie wsparcieVarga JT: Smoking and pulmonary complications: respiratory
      prehabilitation. J Thorac Dis. 2019 Apr;11(Suppl 5):S639-S644. doi: 10.21037/jtd.2018.12.11..

      == Prehabilitacja na świecie ==

      Prehabilitacja w krajach Europy Zachodniej i w Ameryce Północnej (i wybranych
      innych krajach o wysokim poziomie opieki zdrowotnej, jak Tajwan czy Japonia)
      jest stosowana coraz powszechniej przez oddziały o specjalnościach zabiegowych.
      Od roku 2018 działa Międzynarodowe Towarzystwo Prehabilitacji (International
      Prehabilitation Society{{Cytuj |url=https://prehabsociety.com/communication/
      |tytuł=Communication – International Prehabilitation Society<!-- Tytuł wygenerowany
      przez bota --> |opublikowany=prehabsociety.com |język=en |data dostępu=2020-02-09}})
      zajmujące się edukacją w zakresie prehabilitacji, badaniami naukowymi i wypracowaniem
      optymalnych standardów. Co roku odbywają się światowe konferencje poświęcone
      prehabilitacji, dotychczasowe miały miejsce w roku 2017 Montréal, Kanada, 2018
      Eindhoven, Niderlandy, 2019 London, Wielka Brytania, kolejna konferencja planowana
      jest w roku 2020 w Barcelonie, Hiszpania. Wiele szpitali posiada własne programy
      prehabilitacyjne, pozwalające pacjentowi na przygotowanie przed zabiegiem w
      miejscu i asyście personelu, w którym czeka go zabieg. Przykładem może być program
      prehabilitacyjny Kliniki w Cleveland (Cleveland Clinic){{Cytuj |url=https://www.martinhealth.org/what-is-prehabilitation
      |tytuł=What is prehabilitation?<!-- Tytuł wygenerowany przez bota --> |opublikowany=www.martinhealth.org
      |język=en |data dostępu=2020-02-09}}, czy holenderski program fit4surgery{{Cytuj
      |url=http://www.fit4surgery.nl/ |tytuł=Fit4Surgery on Strikingly<!-- Tytuł wygenerowany
      przez bota --> |opublikowany=www.fit4surgery.nl |data dostępu=2020-02-09}} (w
      wolnym tłumaczeniu „zdrowy i gotowy do leczenia chirurgicznego”) przygotowany
      przez profesora Gerrita Slootera, jednego z pionierów prehabilitacji.

      == Prehabilitacja w Polsce ==

      Pojęcie prehabilitacji w Polsce jest wciąż bardzo mało popularne. Brak jest
      praktycznie kompleksowej opieki przedoperacyjnej, nie ma w tym zakresie ani
      odpowiednich programów czy poradni ani wystarczającej świadomości zarówno wśród
      pacjentów, jak i personelu medycznego. Istniejące zalecenia dotyczące przygotowania
      do zabiegu operacyjnego dotyczą przede wszystkim postępowania żywieniowegoKłęk
      ST, Jarosz J, Jassem J, Kapała A, Krawczyk J, Krzakowski M, Misiak M, Szczepanek
      K: Polskie Rekomendacje Żywienia Dojelitowego i Pozajelitowego w Onkologii –
      część II: żywienie drogą przewodu pokarmowego (żywienie dojelitowe). Onkologia
      w Praktyce Klinicznej 2013, tom 9, nr 6, 209–215.. Elementy przygotowania prehabilitacyjnego,
      takie jak poprawa stanu ogólnego pacjenta przed zabiegiem, immunomodulacja czy
      profilaktyka wczesna zakażenia miejsca operowanego omawiane były na konferencjach
      organizowanych przez Polskie Towarzystwa Żywienia Pozajelitowego, Dojelitowego
      i Metabolizmu{{Cytuj |url=https://polspen.pl/ |tytuł=Strona Główna – Polspen<!--
      Tytuł wygenerowany przez bota --> |opublikowany=polspen.pl |język=pl |data dostępu=2020-02-09}},
      Polskie Towarzystwo Żywienia Klinicznego{{Cytuj |url=http://xn--ptk-42a.pl/
      |tytuł=Polskie Towarzystwo Żywienia Klinicznego<!-- Tytuł wygenerowany przez
      bota --> |opublikowany=xn--ptk-42a.pl |język=pl |data dostępu=2020-02-09}} czy
      na serii konferencji poświęconych Terapii Podciśnieniowej Ran{{Cytuj |url=https://www.termedia.pl/Konferencja-Terapia-Podcisnieniowa-Przekraczamy-Granice-Intro,1137,8127.html
      |tytuł=Terapia Podciśnieniowa – Przekraczamy Granice – Intro<!-- Tytuł wygenerowany
      przez bota --> |opublikowany=www.termedia.pl |data dostępu=2020-02-09}}. W opracowaniu
      dotyczącym kompleksowej opieki okołooperacyjnej według protokołu ERAS u chorych
      poddanych chirurgicznemu leczeniu otyłości z roku 2015{{Cytuj |url=https://www.mp.pl/eras/wytyczne/115494,protokol-kompleksowej-opieki-okolooperacyjnej-dla-poprawy-wynikow-leczenia-zastosowanie-eras-w-chirurgii-bariatrycznej
      |tytuł=Protokół kompleksowej opieki okołooperacyjnej dla poprawy wyników leczenia.
      Zastosowanie ERAS w chirurgii bariatrycznej – Wytyczne – Medycyna Praktyczna
      – ERAS<!-- Tytuł wygenerowany przez bota --> |opublikowany=www.mp.pl |język=pl
      |data dostępu=2020-02-09}} obecne były ważne elementy prehabilitacji, jak: przedoperacyjne
      konsultacje i informacja dla chorego, zaprzestanie palenia [[Tytoń (produkt)|tytoniu]]
      na minimum 6 tygodni przed operacją, zaprzestanie spożywania [[Napój alkoholowy|alkoholu]],
      przedoperacyjne zwiększenie aktywności fizycznej chorego, brak przedłużonego
      głodzenia przed operacją poprzez podanie wysokowęglowodanowego napoju na 2 godziny
      przed planowaną interwencją chirurgiczną. W Polsce jedne z pierwszych działań
      prehabilitacyjnych rozpoczęto w 2018 roku w Uniwersyteckim Centrum Klinicznym
      w [[Trójmiasto|Trójmieście]]{{Cytuj |url=https://zdrowie.trojmiasto.pl/Jak-sie-przygotowac-do-operacji-n128499.html
      |tytuł=Jak się przygotować do operacji?<!-- Tytuł wygenerowany przez bota -->
      |opublikowany=zdrowie.trojmiasto.pl |język=pl |data dostępu=2020-02-09}}. W
      roku 2020 uruchomiony został w Klinice Chirurgii Ogólnej, Endokrynologicznej
      i Onkologii Gastroenterologicznej [[Uniwersytet Medyczny im. Karola Marcinkowskiego
      w Poznaniu|Uniwersytetu Medycznego w Poznaniu]] (Kierownik Kliniki Prof. dr
      hab. n. med. Tomasz Banasiewicz) kompleksowy projekt prehabilitacji, mający
      na celu opracowanie odpowiednich standardów i umożliwienie pacjentom skorzystania
      z odpowiedniego przygotowania do zabiegu operacyjnego. [[Klinika]] posiada wieloletnie
      doświadczenie w poradnictwie przedoperacyjnym, na przykład dla pacjentów u których
      planowane jest wyłonienie stomii czy dla pacjentów z dziedzicznymi chorobami
      dolnego odcinka przewodu pokarmowego. Projekt powstaje we współpracy z Fundacją
      Medigent, założeniem projektu jest stworzenie interaktywnej platformy prehabilitacja.pl
      ułatwiającej indywidualne przygotowanie do zabiegu operacyjnego, docelowo zaś
      stworzenie sieci poradni pozwalających na jak najlepsze przygotowanie się do
      zabiegu operacyjnego.

