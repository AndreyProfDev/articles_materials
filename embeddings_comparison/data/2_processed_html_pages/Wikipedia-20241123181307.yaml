- sections:
  - content: "'''Technologia medyczna''' – w ujęciu szerokim to dowolny rodzaj wiedzy\
      \ zaangażowanej w realizację zadań i osiąganie określonych rezultatów systemu\
      \ [[opieka zdrowotna|opieki zdrowotnej]]. W ujęciu wąskim technologie medyczne\
      \ to środki niematerialne (wiedza, umiejętności, procedury, rozwiązania organizacyjne)\
      \ i materialne ([[lek]]i, urządzenia) związane bezpośrednio lub pośrednio z\
      \ udzielanymi świadczeniami [[opieka zdrowotna|opieki zdrowotnej]] i konkretnymi\
      \ interwencjami (leczniczymi, diagnostycznymi, rehabilitacyjnymi bądź prewencyjnymi).\n\
      W polskim [[system zdrowotny|systemie zdrowotnym]] dostęp obywateli do technologii\
      \ medycznych (leków, wyrobów medycznych, procedur medycznych i systemów organizacyjnych)\
      \ jest regulowany przez ubezpieczyciela – [[Narodowy Fundusz Zdrowia]] – w oparciu\
      \ o przeprowadzoną ocenę technologii.\nOcena technologii medycznych (HTA, [[język\
      \ angielski|ang.]] ''health technology assessment'') składa się z analizy efektywności\
      \ klinicznej (wykonywanej zgodnie z zasadami [[Medycyna oparta na faktach|EBM]]),\
      \ analiz ekonomicznych (wykonywanych zgodnie z zasadami [[farmakoekonomika|farmakoekonomiki]])\
      \ oraz analizy wpływu refundacji danej technologii na budżet płatnika (w polskim\
      \ systemie zdrowotnym – na budżet Narodowego Funduszu Zdrowia). HTA ma rosnące\
      \ znaczenie dla podejmowania decyzji o refundacji technologii medycznych, stanowiąc\
      \ racjonalną podstawę tych decyzji. \nJedną z pierwszych instytucji państwowych\
      \ regulujących ocenę technologii medycznych udostępnianych ubezpieczonym obywatelom\
      \ w ramach państwowej opieki zdrowotnej był brytyjski instytut [[NICE]].\nW\
      \ Polsce ocenę technologii medycznych, zgodnie z odpowiednimi wytycznymi[http://www.aotm.gov.pl/index.php?id=13\
      \ \"Wytyczne przeprowadzania oceny technologii medycznych\"], przeprowadza [[Agencja\
      \ Oceny Technologii Medycznych]].\n== Przypisy ==\n{{Przypisy}}\n== Linki zewnętrzne\
      \ ==\n* http://aotm.gov.pl Agencja Oceny Technologii Medycznych\n* http://www.htai.org\
      \ Health Technology Assessment International\n{{Zastrzeżenia|Medycyna}}\n{{Kontrola\
      \ autorytatywna}}\n[[Kategoria:Medycyna]]"
