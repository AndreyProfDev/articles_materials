      \ |url = https://www.wirtualnemedia.pl/artykul/medonet-pl-nowa-odslon-dwustopniowy-system-weryfikacji-tresci-anna-zimny-zajac-redaktorem-naczelnym\
      \ |język = pl}} nowy layout i narzędzia \n'''2019'''\n* Wprowadzono nową politykę\
      \ redakcyjną oraz formaty treści, za które odpowiada oddzielna redakcja. 1 grudnia\
      \ 2019 r. redaktorką naczelną została dr Anna Zimny-Zając.\n'''2015'''\n* Medonet.pl\
      \ dostępny w wersji responsywnej w mobile (RWD), cały serwis gruntownie przebudowany.\n\
      '''2012'''\n* rusza interaktywny program Medonetu „Gorący dyżur”. Będzie on\
      \ nadawany dwa razy w miesiącu na żywo.\n'''2010'''\n12 lutego 2010 Grupa Onet.pl\
      \ uruchomiła serwis medyczny MedOnet.pl\n== Krytyka ==\nPomimo misji szerzenia\
      \ „obiektywnych i godnych zaufania treści” z zakresu medycyny{{Cytuj |autor\
      \ = Redakcja Medonet |tytuł = Polityka redakcyjna |data = 27-07-2020 |data dostępu\
      \ = 2021-07-15 |opublikowany = medonet.pl |url = https://www.medonet.pl/polityka-redakcyjna,artykul,97848017.html}},\
      \ portal publikuje również artykuły, w których opisywane są metody [[Pseudonauka|pseudonaukowe]]\
      \ lub których efektywność jest słabo udokumentowana. Przykładem wspomnianych\
      \ metod jest [[chiropraktyka]]{{Cytuj |autor = Redakcja Medonet; Aleksandra\
      \ Witkowska |tytuł = Chiropraktyka - historia, zastosowanie, przeciwwskazania\
      \ |data = 06-12-2018 |data dostępu = 2021-07-15 |opublikowany = medonet.pl |url\
      \ = https://www.medonet.pl/zdrowie,chiropraktyka---historia--zastosowanie--przeciwwskazania,artykul,1729438.html}},\
      \ która w rzeczywistości badana była głównie w kontekście terapii przewlekłego\
      \ lub ostrego bólu krzyża. Wyniki badań nie pozwoliły na wyciągnięcie jasnych\
      \ wniosków na temat skuteczności techniki – w najlepszym razie jest efektywna\
      \ w podobnym lub mniejszym stopniu jak inne metody{{Cytuj |autor = Sidney M.\
      \ Rubinstein, Marienke van Middelkoop, Willem Jj Assendelft, Michiel R. de Boer,\
      \ Maurits W. van Tulder |tytuł = Spinal manipulative therapy for chronic low-back\
      \ pain |czasopismo = The Cochrane Database of Systematic Reviews |data = 2011-02-16\
      \ |issn = 1469-493X |numer = 2 |s = CD008112 |doi = 10.1002/14651858.CD008112.pub2\
      \ |pmid = 21328304 |dostęp = z}}{{Cytuj |autor = Sidney M. Rubinstein, Caroline\
      \ B. Terwee, Willem J.J. Assendelft, Michiel R. de Boer, Maurits W. van Tulder\
      \ |tytuł = Spinal manipulative therapy for acute low back pain: an update of\
      \ the cochrane review |czasopismo = Spine |data = 2013-2 |issn = 0362-2436 |wolumin\
      \ = 38 |numer = 3 |s = E158–E177 |doi = 10.1097/BRS.0b013e31827dd89d |dostęp\
      \ = z}}{{Cytuj |autor = J. Michael Menke |tytuł = Do manual therapies help low\
      \ back pain? A comparative effectiveness meta-analysis |czasopismo = Spine |data\
      \ = 2014-4 |issn = 0362-2436 |wolumin = 39 |numer = 7 |s = E463–E472 |doi =\
      \ 10.1097/BRS.0000000000000230 |dostęp = z}}{{Cytuj |autor = Neil M. Paige,\
      \ Isomi M. Miake-Lye, Marika Suttorp Booth, Jessica M. Beroes, Aram S. Mardian\
      \ |tytuł = Association of spinal manipulative therapy with clinical benefit\
      \ and harm for acute low back pain |czasopismo = JAMA |data = 2017-04-11 |issn\
      \ = 0098-7484 |wolumin = 317 |numer = 14 |s = 1451–1460 |doi = 10.1001/jama.2017.3086\
      \ |pmid = 28399251 |pmc = 5470352}}, a być może za obserwowany efekt leczniczy\
      \ odpowiada głównie działanie [[placebo]], naturalna [[remisja]] lub zmniejszenie\
      \ wrażliwości na ból{{Cytuj |autor = Rogelio A Coronado, Charles W. Gay, Joel\
      \ E. Bialosky, Giselle D. Carnaby, Mark D. Bishop |tytuł = Changes in pain sensitivity\
      \ following spinal manipulation: a systematic review and meta-analysis |czasopismo\
      \ = Journal of electromyography and kinesiology: official journal of the International\
      \ Society of Electrophysiological Kinesiology |data = 2012-10 |issn = 1050-6411\
      \ |wolumin = 22 |numer = 5 |s = 752–767 |doi = 10.1016/j.jelekin.2011.12.013\
      \ |pmid = 22296867 |pmc = 3349049}}. W wypadku innych dolegliwości, nie ma wystarczającej\
      \ ilości badań, by określić czy chiropraktyka jest efektywna{{Cytuj |autor =\
      \ Edzard Ernst |tytuł = Chiropractic spinal manipulation for neck pain: a systematic\
      \ review |czasopismo = The Journal of Pain |data = 2003-10 |wolumin = 4 |numer\
      \ = 8 |s = 417–421 |doi = 10.1067/S1526-5900(03)00735-1 |dostęp = z}}{{Cytuj\
      \ |autor = E Ernst, P H Canter |tytuł = A systematic review of systematic reviews\
      \ of spinal manipulation |czasopismo = Journal of the Royal Society of Medicine\
      \ |data = 2006-4 |issn = 0141-0768 |wolumin = 99 |numer = 4 |s = 192–196 |doi\
      \ = 10.1177/014107680609900418 |pmc = PMC1420782 |url = https://journals.sagepub.com/doi/pdf/10.1177/014107680609900418\
      \ |dostęp = o}}{{Cytuj |autor = Stephen Barrett |tytuł = A close look at chiropractic\
      \ wrongdoing |data = 2019-03-21 |opublikowany = quackwatch.org/ |url = https://quackwatch.org/chiropractic/general/}}.\
      \ Należy odnotować, że wskazany artykuł oznaczony został przez redakcję Medonet\
      \ jako „sprawdzona treść” – a więc „zgodny z aktualną wiedzą medyczną”. W ten\
      \ sam sposób oznaczony jest artykuł o [[Klawiterapia|klawiterapii]]{{Cytuj |autor\
      \ = Redakcja Medonet; Aleksandra Witkowska |tytuł = Klawiterapia - opis, przebieg\
      \ zabiegu, opinie |data = 06.01.2019 |data dostępu = 2021-07-15 |opublikowany\
      \ = medonet.pl |url = https://www.medonet.pl/zdrowie,klawiterapia---opis--przebieg-zabiegu--opinie,artykul,1729951.html}}\
      \ (metoda przypominająca bezinwazyjną [[Akupunktura|akupunkturę]]), nad którą\
      \ nie przeprowadzono niemal żadnych badańSzukane frazy: „clavitherapy” lub „clavicle\
      \ therapy” w [[Google Scholar|GoogleScholar]] i [[Medline|MEDLINE]] (stan na\
      \ 15.07.2021)..\nNa portalu znajduje się więcej artykułów, które w niemal bezkrytyczny\
      \ sposób opisują [[Medycyna niekonwencjonalna|niepotwierdzone naukowo metody]]\
      \ (choć nie zawsze z oznaczeniem „sprawdzona treść”), jak [[irydologia]]{{Cytuj\
      \ |autor = Redakcja Medonet |tytuł = Irydologia - powstanie nauki, badania irydologiczne\
      \ |data = 08.09.2018 |data dostępu = 2021-07-15 |opublikowany = medonet.pl |url\
      \ = https://www.medonet.pl/zdrowie,irydologia---powstanie-nauki--badania-irydologiczne,artykul,1727050.html}}{{Cytuj\
      \ |autor = E. Ernst |tytuł = Iridology: not useful and potentially harmful |czasopismo\
      \ = Archives of Ophthalmology |data = 2000-01 |issn = 0003-9950 |wolumin = 118\
      \ |numer = 1 |s = 120–121 |doi = 10.1001/archopht.118.1.120 |pmid = 10636425\
