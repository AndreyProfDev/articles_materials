      == Ewolucja mechanizmów obronnych ==

      W procesie ewolucji powstało wiele skutecznych mechanizmów obronnych, które
      pomagają ograniczać i leczyć dany organizm z wszelakich infekcji. Mechanizmy
      naprawcze umożliwiają ponadto gojenie się ran, urazów i umożliwiają rekonwalescencję
      po wypadkach{{Cytuj pismo |doi=10.1111/j.1749-6632.2001.tb03472.x |autor=[[Randolph
      Nesse|Nesse RM]] |tytuł=The smoke detector principle. Natural selection and
      the regulation of defensive responses |czasopismo=Ann N Y Acad Sci. |wolumin=935
      |strony=75–85 |rok=2001 |miesiąc=May |pmid=11411177 |url=http://www3.interscience.wiley.com/resolve/openurl?genre=article&sid=nlm:pubmed&issn=0077-8923&date=2001&wolumin=935&spage=75}}.
      Przykłady:

      {{Układ wielokolumnowy |szerokość=28em <!-- od 10 do 55 --> |liczba=3 |

      * [[Niepokój (psychologia)|Niepokój]] – uświadamia osobnikowi pewien problem
      z funkcjonowaniem organizmu i zmusza do poszukiwania pomocy

      * [[Gorączka]] – zwiększa możliwości obronne układu immunologicznego i podnosi
      przemianę materii

      * [[Nadwrażliwość na ból|Hiperalgezja]] – umożliwia ochronę uszkodzonych części
      ciała

      * Swędzenie – zwraca uwagę na potencjalnie niebezpieczne podrażnienie powłok
      ciała

      * [[Letarg]] – minimalizuje straty energii i umożliwia przetrwanie tkanki mózgowej

      * Depresja – ograniczenie wysiłku i kontaktów z otoczeniem, jednocześnie zmniejszając
      narażenie na choroby zakaźne{{cytuj pismo| autor= Hagen, E.H. | rok= 2002 |
      tytuł= Depression as bargaining The case postpartum | czasopismo= Evolution
      and Human Behavior | wolumin= 23 | wydanie= 5 | strony= 323–336 | url= https://www.sciencedirect.com/science/article/abs/pii/S1090513801001027
      | data dostępu= 2008-02-28 | doi= 10.1016/S1090-5138(01)00102-7}}

      * Wymioty poranne ciężarnych – mechanizm chroniący rozwijający się płód przed
      toksynami

      * Nudności – ograniczenie przyjmowania pokarmów

      * Ból – ukierunkowuje uwagę osobnika na uraz, ucisk, zbyt niską lub wysoką temperaturę,
      i inne

      * Zmęczenie, znużenie i senność – skłaniają organizm do poszukiwania miejsca
      do odpoczynku

      }}

      * Pozostałe: [[Kichanie]], [[Kaszel]], [[Wymioty]], [[Biegunka]] – umożliwiają
      pozbycia się drobnoustrojów lub trucizn z organizmu

      ; Kontrola mechanizmów obronnych

      Użycie mechanizmów obronnych przez organizm ma swoje konsekwencje. Po pierwsze
      zwiększa zużycie energii i substancji odżywczych przez organizm (np.: gorączka
      podnosi podstawową przemianę materii o 10–15% na każdy stopień podniesionej
      temperatury; biegunka powoduje utratę wody i elektrolitów itp.; wymioty prowadzą
      do odwodnienia i mogą także uszkodzić płuca w wyniku aspiracji). Dlatego istnieje
      mechanizm uruchamiający poszczególne mechanizmy obronne tylko wtedy, kiedy zalety
      jego zastosowania przewyższają potencjalne ryzyko i związane z tym koszty).
      Mechanizm ten kontrolowany jest kilku poziomach – od regulacji procesów biomolekularnych
      na poziomie komórek (np. cytokiny, mediatory reakcji zapalnych) po zaangażowanie
      wyższych układów (do kory mózgowej włącznie){{Cytuj książkę |autor=Humphrey,
      Nicholas |rozdział=19. Great Expectations: The Evolutionary Psychology of Faith-Healing
      and the Placebo Effect |tytuł=The mind made flesh: essays from the frontiers
      of psychology and evolution |wydawca=Oxford University Press |miejsce=Oxford
      [Oxfordshire] |rok=2002 |strony=255–85 |isbn=0-19-280227-5 |adres rozdziału=http://www.humphrey.org.uk/papers/2002GreatExpectations.pdf}}.

      == Choroby cywilizacyjne ==

      Setki tysięcy lat ewolucji rodzaju ludzkiego nie zdążyło przygotować organizmów
      do zupełnie nowego stylu życia współczesnego społeczeństwa. Rozwój chorób cywilizacyjnych
      (nowotwory, cukrzyca, nadciśnienie, choroby serca) wynika z faktu, że obecne
      warunki życia zmieniają się szybciej, niż następują zmiany ewolucyjne. Konsekwencją
      jest wrażliwość organizmów ludzi na liczne problemy zdrowotne określane jako
      „choroby cywilizacyjne”{{Cytuj | tytuł = Stone agers in the fast lane: chronic
      degenerative diseases in evolutionary perspective | autor = S. Boyd Eaton, M
      Konner, M Shostak | czasopismo = American Journal of Medicine | data = April
      1988 | pmid = 3135745 | wolumin = 84 | numer = 4 | s = 739–749 | doi = 10.1016/0002-9343(88)90113-1
      | url = http://www.sciencedirect.com/science?_ob=ArticleURL&_udi=B6TDC-4CHHJPV-JS&_user=10&_coverDate=04%2F30%2F1988&_rdoc=1&_fmt=high&_orig=search&_sort=d&_docanchor=&view=c&_searchStrId=1373610246&_rerunOrigin=scholar.google&_acct=C000050221&_version=1&_urlVersion=0&_userid=10&md5=3be6f571c1695ec3b31e7a198aecba87
      | data dostępu = 2010-06-18 | archiwum = https://archive.is/20130104184449/http://www.sciencedirect.com/science?_ob=ArticleURL&_udi=B6TDC-4CHHJPV-JS&_user=10&_coverDate=04/30/1988&_rdoc=1&_fmt=high&_orig=search&_sort=d&_docanchor=&view=c&_searchStrId=1373610246&_rerunOrigin=scholar.google&_acct=C000050221&_version=1&_urlVersion=0&_userid=10&md5=3be6f571c1695ec3b31e7a198aecba87
      | zarchiwizowano = 2013-01-04}}{{Cytuj pismo | tytuł = Diabetes incidence and
      prevalence in Pima Indians: a 19-fold greater incidence than in Rochester, Minnesota
      | czasopismo= American Journal of Epidemiology | data= 1978 | autor=William
