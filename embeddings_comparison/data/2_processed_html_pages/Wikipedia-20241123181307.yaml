      \ zaufania treści.\n* Medonet uruchamia nowy serwis Medonet Dziecko \n* Z początkiem\
      \ roku każdy użytkownik może założyć darmowe konto “Mój Medonet”, które po zalogowaniu\
      \ pozwala m.in. stworzyć swój indywidualny profil zdrowia{{Cytuj |tytuł = Na\
