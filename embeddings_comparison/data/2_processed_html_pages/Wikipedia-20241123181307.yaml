      \ doi =10.1182/blood-2017-03-735654| pmid =28600341}}\n{{Cytuj stronę | url\
      \ = http://naukawpolsce.pap.pl/aktualnosci/news,363278,prof-gaciong-terapia-personalizowana-to-wieksze-bezpieczenstwo-dla-chorych-i-oszczednosci-dla.html\
