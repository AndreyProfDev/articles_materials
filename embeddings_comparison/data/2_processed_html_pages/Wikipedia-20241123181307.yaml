      \ = Academy of Medical Sciences, University of Southampton| autor link = | data\
      \ = | rok = 2015| praca = | opublikowany = | oznaczenie = | strony = | język\
      \ = | data dostępu = 2017-02-01| archiwum = https://web.archive.org/web/20170713111337/https://www.acmedsci.ac.uk/download?f=file&i=32644|\
      \ zarchiwizowano = 2017-07-13}}\n{{Cytuj | autor =Mark A. Jensen, Vincent Ferretti,\
      \ Robert L. Grossman, and Louis M. Staudt| tytuł =The NCI Genomic Data Commons\
