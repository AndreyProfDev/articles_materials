- sections:
  - content: '''''''Pompa limfatyczna'''''' — wymuszony uciskiem przepływ limfy w
      kierunku [[Serce człowieka|serca]]. [[Aktywność fizyczna]] zwiększa przepływ
      [[Limfa|limfy]] od 4 do 15 razy, zaś [[Siedzący tryb życia|bezruch]] wybitnie
      spowalnia przepływ limfy{{Cytuj |autor = Stanisław Konturek, Tomasz Brzozowski
      |tytuł = Fizjologia człowieka. T. 1: Fizjologia ogólna, krew i mięśnie |data
      = 2003 |data dostępu = 2024-03-18 |isbn = 978-83-233-1628-2 |wydanie = Wyd.
      7 rozsz. i popr |miejsce = Kraków |wydawca = Wydaw. UJ |s = 260}}.

      [[Naczynia limfatyczne]], podobnie jak [[Żyła|żyły]], wyposażone są w zastawki
      zapobiegające cofaniu się chłonki. Każdy ucisk na tkanki, [[Skurcz mięśnia|praca
      mięśni]], zmiana położenia narządów względem siebie powoduje chwilowe zwiększenie
      ciśnienia [[Płyn tkankowy|płynu tkankowego]] i przesunięcie limfy w kierunku
      [[Układ krążenia|układu krążenia]].

