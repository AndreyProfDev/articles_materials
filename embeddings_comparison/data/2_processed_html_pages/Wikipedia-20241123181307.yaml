      |pmid=11076340 |doi=10.3109/01674820009075626 |url=http://www.informaworld.com/smpp/content~content=a791323828}}

      * Wpływ układu MHC na dobór partnerów{{Cytuj pismo |autor=Wedekind C, Seebeck
