  - content: '''''''Medycyna holistyczna''''''Pojęcie bywa mylone z „[[medycyna niekonwencjonalna]]”
      lub „medycyna alternatywna”. – [[medycyna]] zgodna z [[holizm|holistycznym]]
      poglądem, że człowiek—[[pacjent]] jest „układem całościowym”; należy leczyć
      cały organizm – człowieka-[[Osoba#Myśl nowożytna|osobę]], nie ograniczając się
      do określonej [[choroba|choroby]] lub chorego [[narząd]]u{{r|encPWN}}. Niezbędna
      jest troska o stan jego ciała, umysłu, ducha, które wzajemnie wpływają na siebie{{r|encPWN}}.

      Redaktorzy monografii „Holistyczny wymiar współczesnej medycyny” wskazują, że
      poza podstawowym procesem profesjonalnego leczenia zespół terapeutyczny musi
      pamiętać o poszanowaniu godności i niezależności każdego pacjenta oraz o jego
      komforcie bio-psycho-społecznym{{r|Holistyczny-wymiar-T1|Holistyczny-wymiar-T2}}.

