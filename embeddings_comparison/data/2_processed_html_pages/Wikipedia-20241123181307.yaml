      === Wysiłek fizyczny ===

      Współczesny świat sprzyja też osiadłemu trybowi życia, a ludzie wykonują coraz
      mniej czynności wymagających wysiłku fizycznego{{Cytuj pismo |autor=Abuissa
      H, O’Keefe JH, Cordain, L |tytuł=Realigning our 21st century diet and lifestyle
      with our hunter-gatherer genetic identity |czasopismo=Directions Psych |wolumin=25
      | strony=SR1–SR10 |rok=2005 |url= http://www.thepaleodiet.com/articles/Dir%20Psych%202005.pdf}}{{Cytuj
      książkę |autor=S. Boyd Eaton, Cordain, Loren; & Sebastian, Anthony |inni=Aird,
      William C. (editor) |tytuł=Endothelial Biomedicine |rok=2007 |wydawca=Cambridge
      University Press |isbn=0521853761 |strony=129–34 |rozdział=The Ancestral Biomedical
      Environment |adres rozdziału= http://www.thepaleodiet.com/articles/Ancestral%20Biomedical%20Environment%20Final.pdf}}{{Cytuj
      pismo |autor=Eaton SB, Eaton SB |tytuł=An evolutionary perspective on human
      physical activity: implications for health |czasopismo=Comp Biochem Physiol
      a Mol Integr Physiol. |wolumin=136 |wydanie=1 |strony=153–9 |rok=2003 Sep |pmid=14527637
      |doi=10.1016/S1095-6433(03)00208-3 |url=}}{{Cytuj pismo |autor=Cordain, L.,
      Gotshall, R.W. and Eaton, S.B. |tytuł=Physical activity, energy expenditure
      and fitness: an evolutionary perspective |czasopismo=Int J Sports Med |wolumin=19
      |wydanie=5 |strony=328–35 |data=1998 Jul |pmid=9721056 |url= http://www.thepaleodiet.com/articles/Int%20J%20Sport%20Article.pdf
      |doi=10.1055/s-2007-971926}}{{Cytuj pismo |autor=Cordain, L., Gotshall, R.W.,
      Eaton, S.B. |tytuł=Evolutionary aspects of exercise |czasopismo=World Rev Nutr
      Diet |wolumin=81 |strony=49–60 |rok=1997 |pmid=9287503 |url= http://www.thepaleodiet.com/articles/Exercise%20&%20Evolution.pdf
      |doi=10.1159/000059601}}. Tłumaczy się to obecnie w ten sposób, że w przeszłości
      ludzie pozostawali w spoczynku jedynie w trakcie choroby lub po urazach – konsekwencją
      braku wysiłku fizycznego ma więc być przestawienie się organizmu na metabolizm
      oszczędzający energię i uruchomienie mechanizmów obronnych (np. stanu zapalnego),
