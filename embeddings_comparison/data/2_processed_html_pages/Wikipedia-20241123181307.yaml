      \ = 2024-04-08 |opublikowany = www.wirtualnemedia.pl |url = https://www.wirtualnemedia.pl/artykul/medonet-narzedzie-ocena-ryzyka-chorob-serca-i-ukladu-krazenia\
      \ |język = pl}}.\n* Medonet i Helfio uruchamiają pierwszą w Polsce aplikację\
      \ mobilną, która łączy w sobie dane o stanie zdrowia oraz styl życia, Helfio{{Cytuj\
      \ |tytuł = Helfio nową aplikacją zdrowotną, partnerem Medonet |data dostępu\
      \ = 2024-04-08 |opublikowany = www.wirtualnemedia.pl |url = https://www.wirtualnemedia.pl/artykul/helfio-aplikacja-zdrowotna-medonet\
      \ |język = pl}}.\n* Medonet i Onet wraz z UN Global Compact Network Poland 14\
      \ lutego zainicjowały kampanię społeczną „Kochaj siebie. Dla zdrowia.”{{Cytuj\
      \ |tytuł = Co ma wspólnego miłość własna z twoim zdrowiem? Dołącz do #KOCHAJSIEBIE\
      \ |data = 2022-02-13 |data dostępu = 2024-04-08 |opublikowany = medonet.pl |url\
