- sections:
  - content: "'''Medycyna pastoralna''' – nauka pomocnicza praktycznej [[teologia|teologii]].\
      \ Swe zasady czerpie z wiedzy lekarskiej. Jest to zbiór przepisów i wskazówek\
      \ medycznych, których znajomość jest niezbędna duchownemu.\nNajstarsze polskie\
      \ podręczniki medycyny pastoralnej to:\n* wydana we Lwowie w r. 1900 książka\
      \ „[https://www.kbc.krosno.pl/dlibra/publication/edition/1495?id=1495 Medycyna\
      \ pasterska]” [[Józef_Sebastian_Pelczar|Józefa Sebastiana Pelczara]], polskiego\
      \ świętego, w pierwszym wydaniu podpisana pseudonimem „Stary Duszpasterz”, \n\
      * wydana w 1905 r. w Gnieźnie „Medycyna pastoralna” dr. Juliana Czarneckiego,\
      \ która m.in. polecała ''chrzczenie'' [[Wewnątrzmaciczne obumarcie płodu|obumierających\
      \ płodów]] przez wstrzykiwanie [[woda święcona|wody święconej]] do [[macica|macicy]]\
      \ kobietyJulian Czarnecki „Medycyna pastoralna”, s. 236: ''Za pomocą strzykawki\
      \ możemy zawsze przez mały otwór, sztucznie zrobiony w błonach płodowych, polać\
      \ wodą część ciała dziecka. Przy tej sposobności zaleca się wprowadzenie strzykawki\
      \ przy pomocy palca, ażeby się tym sposobem przekonać, czy doprowadzona woda\
      \ rzeczywiście w bezpośrednią styczność przychodzi z odnośną częścią ciała dziecięcego.''\
      \ oraz tłumaczyła [[schizma|schizmy]] kościelne i pozachrześcijańskie nurty\
      \ [[filozofia|filozoficzne]] chorobami umysłowymiibidem, s. 370: ''W pierwszych\
      \ dwóch wiekach chrześciaństwa panowały wzburzenia umysłowe, których skutkiem\
      \ tworzyły sią rozmaite sekty tak religijne jak filozoficzne, n.p. sekty Manicheuszów,\
      \ Gnostyków, nowej szkoły Platona itp.''.\n== Linki zewnętrzne ==\n* [http://digital.fides.org.pl/dlibra/docmetadata?id=549&from=&dirids=1&ver_id=15417&lp=1&QI=!92BFEC568CECA49D64EA4CFF798FC07D-1\
      \ S. Luft. ''Medycyna pastoralna'' – podręcznik dostępny on-line] \n* [https://www.kbc.krosno.pl/dlibra/publication/edition/1495?id=1495\
      \ Stary Duszpasterz, ''Medycyna pasterska czyli wiadomości potrzebne kapłanom\
      \ z zakresu hygieny, fizyologii i patologii'' Lwów 1900 (książka dostępna online)]\n\
      * [http://books.google.com/books/about/Medycyna_pasterska_czyli_wiadomosci_potr.html?id=cdlJAQAAIAAJ\
      \ Józef Sebastian Pelczar, ''Medycyna pasterska czyli wiadomosci potrzebne kapłanom\
      \ z zakresu samotologii, hygieny, fizyologii i patologii'' Lwów 1908]\n== Przypisy\
      \ ==\n{{Przypisy}}\n[[Kategoria:Teologia]]\n[[Kategoria:Medycyna]]\n[[Kategoria:Pseudonauka]]"
