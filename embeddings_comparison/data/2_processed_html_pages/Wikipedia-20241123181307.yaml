      |język = en-US}}.

      == Legalny handel narządami ==

      === Iran ===

      [[Plik:Sign "Kidney on sale" in Iran.jpg|mały|Znak w Iranie z napisem „Oddam
      nerkę, grupa krwi A+” w [[Język perski|języku perskim]] wraz z numerem telefonu
      (zamazanym)]]

      [[Iran]] jest jedynym krajem, który {{Link-interwiki|Handel nerkami w Iranie|Q=Q6404833|tekst=zezwala
      na kupno i sprzedaż narządów}} za pieniądze. Ze względu na brak infrastruktury
      do utrzymania skutecznego systemu przeszczepów narządów we wczesnych latach
      80., Iran zalegalizował pobieranie nerek od żywych niespokrewnionych dawców
      ({{Ang.|living non-related donation}}, LNRD) w 1988 roku{{Cytuj |autor = Rupert
      W. L. Major |tytuł = Paying kidney donors: time to follow Iran? |czasopismo
      = McGill journal of medicine: MJM: an international forum for the advancement
      of medical sciences by students |data = 2008-01 |data dostępu = 2023-05-26 |issn
      = 1201-026X |wolumin = 11 |numer = 1 |s = 67–69 |pmid = 18523518 |pmc = 2322914}}.
      Charity Association for the Support of Kidney Patients (CASKP) i {{Link-interwiki|Charity
      Foundation for Special Diseases|Q=Q17991499}} (CFSD) sprawują kontrolę nad handlem
      organami we współpracy z rządem. Te [[Organizacja non-profit|organizacje non-profit]]
      dobierają dawców do biorców, przeprowadzając testy w celu zapewnienia zgodności.
      Dawcy otrzymują od rządu rekompensatę w postaci ulgi podatkowej, bezpłatnego
      ubezpieczenia zdrowotnego i często bezpośrednią zapłatę od biorcy, przy czym
      przeciętny dawca otrzymuje wynagrodzenie w wysokości 1200 dolarów. Niektórym
      dawcom oferuje się również możliwość zatrudnienia. Organizacje charytatywne
      wspierają biorców, których nie stać na zakup narządu{{Cytuj |autor = Alex Tabarrok
      |tytuł = Tackling the Organ Shortage |czasopismo = Wall Street Journal |data
      = 2010-01-08 |data dostępu = 2023-05-26 |issn = 0099-9660 |url = https://www.wsj.com/articles/SB10001424052748703481004574646233272990474
      |język = en-US}}.

      Iran nakłada ograniczenia na komercyjny handel narządami, próbując ograniczyć
      turystykę transplantacyjną. Rynek jest zamknięty w obrębie kraju, co oznacza,
      że obcokrajowcy nie mogą kupować narządów obywateli Iranu. Co więcej, organy
      mogą być przeszczepiane tylko między osobami tej samej narodowości, a więc na
      przykład Irańczyk nie może kupić nerki od uchodźcy z innego kraju{{Cytuj |autor
      = Griffin A |tytuł = Kidneys on demand |czasopismo = BMJ (Clinical research
      ed.) |data = 2007-03-10 |data dostępu = 2023-05-26 |issn = 1756-1833 |wolumin
      = 334 |numer = 7592 |doi = 10.1136/bmj.39141.493148.94 |pmid = 17347232 |język
      = en}}.

      Niektórzy krytycy twierdzą, że irański system jest w pewnym sensie oparty na
      przymusie, ponieważ ponad 70% dawców to osoby ubogie{{Cytuj |autor = Organ Sales
      and Moral Travails: Lessons from the Living Kidney Vendor Program in Iran |tytuł
      = Organ Sales and Moral Travails: Lessons from the Living Kidney Vendor Program
      in Iran |data = 2008-03-08 |data dostępu = 2023-05-26 |opublikowany = www.cato.org
      |url = https://www.cato.org/policy-analysis/organ-sales-moral-travails-lessons-living-kidney-vendor-program-iran}}.

      === Rządowe świadczenia dla dawców ===

      [[Australia]] i [[Singapur]] zalegalizowały rekompensaty pieniężne dla żywych
      dawców narządów. Zwolennicy takich inicjatyw twierdzą, że rozwiązania te nie
      polegają na płaceniu ludziom za ich narządy, a jedynie na rekompensowaniu dawcom
      kosztów związanych z pobraniem narządów{{Cytuj |autor = F.L. Delmonico, D. Martin,
      B. Domínguez-Gil, E. Muller, V. Jha, A. Levin, G.M. Danovitch, A.M. Capron |tytuł
      = Living and Deceased Organ Donation Should Be Financially Neutral Acts |czasopismo
      = American Journal of Transplantation |data = 2015-05 |data dostępu = 2023-05-26
      |wolumin = 15 |numer = 5 |s = 1187–1191 |doi = 10.1111/ajt.13232 |url = https://www.amjtransplant.org/article/S1600-6135(22)00208-8/fulltext
      |język = en}}. Australijscy dawcy otrzymują 9 tygodni płatnego urlopu w wysokości
      odpowiadającej krajowej [[Płaca minimalna|płacy minimalnej]]{{Cytuj |tytuł =
      Supporting Living Organ Donors Program |data = 2021-07-29 |data dostępu = 2023-05-26
      |opublikowany = Australian Government Department of Health |url = https://www.health.gov.au/our-work/supporting-living-organ-donors-program}}.

      == Nielegalny handel narządami ==

      Według [[Światowa Organizacja Zdrowia|Światowej Organizacji Zdrowia]] (WHO)
      nielegalny handel organami ma miejsce, gdy narządy są usuwane z ciała w celu
      przeprowadzenia transakcji handlowych{{Cytuj |autor = Tazeen H. Jafar |tytuł
      = Organ Trafficking: Global Solutions for a Global Problem |czasopismo = American
      Journal of Kidney Diseases |data = 2009-12 |data dostępu = 2023-05-26 |wolumin
      = 54 |numer = 6 |s = 1145–1157 |doi = 10.1053/j.ajkd.2009.08.014 |url = https://www.ajkd.org/article/S0272-6386%2809%2901177-9/fulltext
      |język = en}}. Pomimo przepisów zakazujących sprzedaży narządów, nadal utrzymuje
      się taki proceder, a badania szacują, że od 5% do 42% przeszczepianych narządów
      pochodzi z nielegalnego handlu{{Cytuj |autor = Yosuke Shimazono |tytuł = The
      state of the international organ trade: a provisional picture based on integration
      of available information |czasopismo = Bulletin of the World Health Organization
      |data = 2007-12-01 |data dostępu = 2023-05-26 |wolumin = 85 |numer = 12 |s =
      955–962 |doi = 10.2471/BLT.06.039370 |pmid = 18278256 |pmc = PMC2636295}}{{Cytuj
      |autor = Francis L Delmonico |tytuł = The implications of Istanbul Declaration
      on organ trafficking and transplant tourism |czasopismo = Current Opinion in
      Organ Transplantation |data = 2009-04 |data dostępu = 2023-05-26 |issn = 1087-2418
      |wolumin = 14 |numer = 2 |s = 116–119 |doi = 10.1097/MOT.0b013e32832917c9 |url
      = https://journals.lww.com/00075200-200904000-00003 |język = en}}{{Cytuj |autor
      = Silke Meyer |tytuł = Trafficking in Human Organs in Europe: A Myth or an Actual
      Threat? |czasopismo = European Journal of Crime, Criminal Law and Criminal Justice
      |data = 2006 |data dostępu = 2023-05-26 |issn = 0928-9569 |wolumin = 14 |numer
      = 2 |s = 208–229 |doi = 10.1163/157181706777978739 |url = https://brill.com/view/journals/eccl/14/2/article-p208_4.xml}}.

      Środowiska przestępcze coraz częściej angażują się w [[Porwanie (przestępstwo)|porwania]],
      zwłaszcza dzieci i nastolatków, które są następnie przewożone do miejsc wyposażonych
      w sprzęt medyczny. Tam są mordowane, a ich organy przeznaczane do sprzedaży{{Cytuj
      |tytuł = La policía detiene a Manuel Plancarte, sobrino de un líder ''templario''
      |data = 2014-03-17 |data dostępu = 2023-05-26 |opublikowany = Expansión |url
      = https://expansion.mx/nacional/2014/03/17/la-policia-detiene-a-manuel-plancarte-sobrino-de-un-lider-templario
      |język = es}}. [[Bieda|Ubóstwo]] i luki prawne również przyczyniają się do nielegalnego
      handlu narządami{{Cytuj |autor = Mohammed I. Khalili |tytuł = Organ trading
      in Jordan: Bad news, good news |czasopismo = Politics and the Life Sciences
      |data = 2007-03 |data dostępu = 2023-05-26 |issn = 0730-9384 |wolumin = 26 |numer
      = 1 |s = 12–14 |doi = 10.2990/26_1_12 |url = https://www.cambridge.org/core/product/identifier/S073093840000808X/type/journal_article
      |język = en}}.

