  - content: '{{inne znaczenia|fizjologii|[[pompa mięśniowa (sport)]]}}

      [[Plik:2114 Skeletal Muscle Vein Pump.jpg|mały|Działanie pompy mięśniowej]]

      ''''''Pompa mięśniowa'''''' — zespół [[Mięśnie szkieletowe|mięśni szkieletowych]]
      wspomaganych [[Serce człowieka|serce]] w [[Krążenie krwi|krążeniu krwi]]. Znaczenie
      pompy mięśniowej rośnie z wiekiem. Rytmiczne skurcze mięśni, wspomagające przepływ
      krwi i [[Limfa|limfy]] w kierunku serca zapobiegają zaleganiu krwi i limfy w
      kończynach. Pompa mięśniowa zwiększając przepływ krwi przez pracujące mięśnie
      kończyn dolnych nawet o 60% w stosunku do maksymalnego przepływu wywołanego
      przekrwieniem naczyniowym{{Cytuj |redaktor = Andrzej Godlewski, Władysław Zygmunt
      Traczyk, Andrzej Trzebski |tytuł = Fizjologia człowieka z elementami fizjologii
      stosowanej i klinicznej |data = 2001 |data dostępu = 2024-03-18 |isbn = 978-83-200-2364-0
      |wydanie = Wyd. 3 zm. i uzup |miejsce = Warszawa |wydawca = Wydaw. Lekarskie
      PZWL |s = 549-550}}.

      W kończynach żyły są otoczone mięśniami, podczas [[Aktywność fizyczna|aktywności
      fizycznej]] mięśnie uciskają żyły, jak wiadomo, żyły są wyposażone w [[zastawki]]
      zapobiegające przepływowi wstecznemu, więc krew jest zawsze wyciskana w stronę
      serca. Pompa mięśniowa odgrywa szczególnie ważną rolę w krążeniu żylnym [[Kończyna
      dolna|kończyn dolnych]], podczas dynamicznej pracy mięśni w pozycji pionowej
      (marsz, bieg, jazda na rowerze) w naczyniach kończyn dolnych powstaje bardzo
      duży rytmiczny [[gradient ciśnienia]] tętniczo-żylnego, poprawiający przepływ
      krwi przez pracujące mięśnie{{Cytuj |autor = William F. Ganong, Jack and DeLoris
      Lange |tytuł = Fizjologia |data = 2007 |isbn = 978-83-200-3326-7 |wydanie =
      I |miejsce = Warszawa |wydawca = Wydawnictwo Lekarskie PZWL |s = 575}}.

      == Wpływ na zdrowie ==

      W praktyce klinicznej obserwuje się zmniejszenie bólu wywołanego niedokrwieniem
      u chorych z zaawansowaną [[Miażdżyca|miażdżycą]] kończyn dolnych ([[choroba
      Bürgera]]) po przyjęciu pozycji pionowej lub tylko po opuszczeniu nóg z łóżka,
      jeśli wykonają skurcze mięśni chorej kończyny.

      U osób z żylakami kończyn dolnych, gdzie występuje niewydolność zastawek żylnych
      i dochodzi do zastoju żylnego i opuchnięcia kostek tzw. pompa mięśniowa jest
      w stanie wymusić ruch krwi w kierunku serca.

      Długotrwałe przebywanie [[Siedzący tryb życia|bez ruchu]] w pozycji stojącej
      lub siedzącej na skutek nadmiernego rozszerzenia się żył zwiększonym [[Ciśnienie
      transmuralne|ciśnieniem transmuralnym]] prowadzi do niedomykalności zastawek
      żylnych, w takim przypadku, jeśli nie domykają się zastawki pomiędzy żyłami
      głębokimi a żyłami powierzchniowymi kończyn dolnych to pompa mięśniowa, wyciska
      krew z żył głębokich w stronę żył powierzchniowych, tworząc dogodne warunki
      do rozwoju [[Żylaki goleni|żylaków goleni]].

