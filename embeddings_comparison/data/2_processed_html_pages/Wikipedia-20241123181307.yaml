  title: Medycyna stylu życia
- sections:
  - content: '''''''Głodówka, głodówka lecznicza'''''' – metoda stosowana w [[Medycyna
      niekonwencjonalna|medycynie alternatywnej]] polegająca na okresowym całkowitym
      zaprzestaniu spożywania pokarmów (przyjmuje się tylko płyny). Termin głodówka
      jest stosowany zamiennie z [[post]]em lub ''''''leczniczym postem''''''.

      Idea głodówek leczniczych prawdopodobnie pochodzi z XIX wieku, choć jej propagatorzy
      często powołują się na faktyczne zwyczaje żywieniowe z czasów antycznych{{Cytuj
      |autor = Ralph Mathisen, Danuta Shanzer |tytuł = Society and Culture in Late
      Antique Gaul: Revisiting the Sources |data = 2017-07-05 |data dostępu = 2020-05-27
      |isbn = 978-1-351-89921-5 |wydawca = Taylor & Francis |url = https://books.google.pl/books?id=kEErDwAAQBAJ&pg=PA231&lpg=PA231&dq=fasting+in+antique&source=bl&ots=ms31aKvOIS&sig=ACfU3U3GjxbZ-8wt61a_0HsPE93KtUNLpw&hl=pl&sa=X&ved=2ahUKEwiJ3_SL7tTpAhW6wcQBHTUHAX0Q6AEwE3oECAkQAQ#v=onepage&q=fasting%20in%20antique&f=false
      |język = en}} czy przykłady postów zamieszczonych w Biblii{{Cytuj |autor = Daniel
      W. Evans |tytuł = Your guide to 40 days of prayer & fasting. |data = 2009 |data
      dostępu = 2020-05-27 |isbn = 1-60799-091-1 |miejsce = [Place of publication
      not identified] |wydawca = Tate Pub & Enterprises Ll |oclc = 946198772}}. Pojawianie
      się zwiększonej zapadalności na niektóre choroby u osób przejadających się zostało
      zaobserwowane w Stanach Zjednoczonych w pierwszej połowie XIX wieku{{Cytuj |autor
      = Michael Iacobbo |tytuł = Vegetarian America. A history |data = 2004 |data
      dostępu = 2020-05-27 |isbn = 0-275-97519-3 |miejsce = Westport, Conn. |wydawca
      = Praeger |oclc = 53970674}}. Twórcą idei, według której rozwiązaniem tego problemu
      – czyli odnotowanego wzrostu zachorowań np. na nowotwór żołądka – jest okresowe
      głodowanie, był lekarz Henry S. Tanner. Opublikował on swoją propozycję w 1877
      roku, jednak nie zyskała ona początkowo rozgłosu, aż do momentu gdy Tanner odbył
      publiczny 40-dniowy post w wynajętym teatrze Calderon Hall w Nowym Jorku{{Cytuj
      |tytuł = Clarendon Hall NYC |data dostępu = 2020-05-27 |opublikowany = Ephemeral
      New York |url = https://ephemeralnewyork.wordpress.com/tag/clarendon-hall-nyc/
      |język = en}}{{Cytuj |tytuł = Linda Hazzard: The “Starvation Doctor” |data =
      2014-04-08 |data dostępu = 2020-05-27 |opublikowany = Medical Bag |url = https://www.medicalbag.com/home/features/despicable-doctors/linda-hazzard-the-starvation-doctor/
      |język = en}}{{Cytuj |tytuł = The Long Fast Finished; a Meal That Amazed Dr.
      Tanner’s Attendants. Milk, Watermelon, and Half a Pound of Beefsteak--No Disastrous
      Effects of the Mixture as yet--Closing Moments of the Forty Days’ Fast--Its
      History Briefly Reviewed. |czasopismo = The New York Times |data = 1880-08-08
      |data dostępu = 2020-05-27 |issn = 0362-4331 |url = https://www.nytimes.com/1880/08/08/archives/the-long-fast-finished-a-meal-that-amazed-dr-tanners-attendants.html
      |język = en}}. Kolejnym propagatorem idei postów leczniczych był Edward H. Dewey,
      który w wydanych w latach 1895–1904 (do śmierci autora) zalecał umiarkowanie
      w jedzeniu i spożywaniu alkoholu, rezygnację ze śniadań i okresowe długotrwałe
      głodowanie{{Cytuj |autor = James C. Whorton |tytuł = Crusaders for fitness.
      |data = 2016 |data dostępu = 2020-05-27 |isbn = 0-691-64189-7 |miejsce = [Place
      of publication not identified] |wydawca = Princeton University Pres |oclc =
      938371484}}{{Cytuj |autor = R. Marie Griffith |tytuł = Apostles of Abstinence:
      Fasting and Masculinity during the Progressive Era |czasopismo = American Quarterly
      |data = 2000 |data dostępu = 2020-05-27 |issn = 0003-0678 |wolumin = 52 |numer
      = 4 |s = 599–638 |jstor=30042198}}. Idea prozdrowotnego wpływu głodzenia na
      organizm ludzki była kwestionowana od 1910 roku{{Cytuj |tytuł = Food And Feeding
      on JSTOR |data dostępu = 2020-05-27 |czasopismo = The British Medical Journal
      |wolumin = 1 |numer = 2563 |data = Feb. 12, 1910 |s = 388–390 |jstor=25289583
      |język = en}}. Dopiero jednak działania [[Linda Hazzard|Lindy Hazzard]], naturoterapeutki,
      która zagłodziła wielu swoich pacjentów na śmierć, doprowadziły do całkowitego
      odrzucenia głodówek leczniczych jako praktyki medycznej i funkcjonowania tej
      metody jedynie w nurcie pseudo-medycyny{{Cytuj |autor = Kenneth V. Iserson |tytuł
      = Demon doctors. Physicians as serial killers |data = 2002 |data dostępu = 2020-05-27
      |isbn = 1-883620-29-5 |miejsce = Tucson, Ariz. |wydawca = Galen Press |oclc
      = 49618599}}.

      Głodówka w medycynie jest rozumiana inaczej, bo nie jako całkowite zaprzestanie
      spożywania pokarmu, a jako zastosowanie diety skrajnie ubogiej energetycznie.
      Była dawnej stosowana w medycynie jako element leczenia skutków otyłości lub
      element przygotowania osób otyłych do operacji{{Cytuj |autor = Sobotka, Luboš
      (1952-), Allison, Simon P., Korta, Teresa., Kłęk, Stanisław., Łyszkowska, Małgorzata
      (pediatria) |tytuł = Podstawy żywienia klinicznego. Edycja czwarta |data = 2013
      |data dostępu = 2019-09-29 |isbn = 9788393652716 |wydanie = 2. pol., tł. z wyd.
      4. oryg |miejsce = Kraków |wydawca = Krakowskie Wydawnictwo Scientifica |oclc
      = 852983832}}{{Cytuj |autor = Rajesh Aggarwal |tytuł = Setting Up an Enhanced
      Recovery Program Pathway for Bariatric Surgery: Current Evidence into Practice
      |data = 2015 |data dostępu = 2019-09-28 |isbn = 9783319203638 |miejsce = Cham
      |wydawca = Springer International Publishing |s = 293–299 |doi = 10.1007/978-3-319-20364-5_24}}.
      Przyjmuje się, że wartością graniczną czasu stosowania tego rodzaju diety jest
      168 dni (24 tygodnie){{Cytuj |autor = University of Minnesota. Laboratory of
      Physiological Hygiene. |tytuł = The biology of human starvation. Volume I |data
      dostępu = 2019-10-06 |isbn = 9781452937984 |miejsce = Minneapolis |oclc = 1079363282}},
      jednak opisany został przypadek jej zastosowania przez 382 dni{{Cytuj |autor
      = W. K. Stewart, L. W. Fleming |tytuł = Features of a successful therapeutic
      fast of 382 days’ duration |czasopismo = Postgraduate Medical Journal |data
      = 1973-03 |data dostępu = 2019-09-29 |issn = 0032-5473 |wolumin = 49 |numer
      = 569 |s = 203–209 |doi = 10.1136/pgmj.49.569.203 |pmid = 4803438 |pmc = 2495396}}.
      Pojęciem szerszym, w którym zawiera się zarówno całkowite zaprzestanie przyjmowania
      pokarmów, jak i zastosowanie diety skrajnie ubogiej energetycznie, jest [[głodzenie]],
      definiowane jako proces, w którym ilość dostarczanych składników odżywczych
      nie zaspokaja zapotrzebowania organizmu.

      Współcześnie (od 2011) nie zaleca się stosowania głodówek przed operacjami.
      Zaleca się jedynie zastosowanie dopasowanej diety (w dłuższym okresie przed
      operacją) oraz niespożywanie pokarmów stałych w ciągu 6 godzin poprzedzających
      operację{{Cytuj |autor = Ian Smith, Peter Kranke, Isabelle Murat, Andrew Smith,
      Geraldine OʼSullivan |tytuł = Perioperative fasting in adults and children:
      guidelines from the European Society of Anaesthesiology |czasopismo = European
      Journal of Anaesthesiology |data = 2011-08 |data dostępu = 2019-09-29 |issn
      = 0265-0215 |wolumin = 28 |numer = 8 |s = 556–569 |doi = 10.1097/EJA.0b013e3283495ba1
      |url = http://content.wkhealth.com/linkback/openurl?sid=WKPTLP:landingpage&an=00003643-201108000-00004
      |język = en}}.

      Organizm ludzki jest fizjologicznie przystosowany do okresowego przyjmowania
      posiłków i odstępy pomiędzy kolejnymi posiłkami wynoszące do około jednej doby
      (24 godziny) są zwykle uznawane za normę. Prawidłowo funkcjonujący organizm
      nie odczuwa ich skutków, choć jeśli wynika z tego redukcja ilości dostarczanych
      kalorii, może to przyczyniać się do zmniejszenia nadwagi, co przekłada się na
      redukcję ryzyka [[Choroba niedokrwienna serca|choroby wieńcowej serca]]{{Cytuj
      |autor = Monica C Klempel, Cynthia M Kroeger, Surabhi Bhutani, John F Trepanowski,
      Krista A Varady |tytuł = Intermittent fasting combined with calorie restriction
      is effective for weight loss and cardio-protection in obese women |czasopismo
      = Nutrition Journal |data = 2012-12 |data dostępu = 2019-07-04 |issn = 1475-2891
      |wolumin = 11 |numer = 1 |doi = 10.1186/1475-2891-11-98 |url = http://nutritionj.biomedcentral.com/articles/10.1186/1475-2891-11-98
      |język = en}}.

      == Zaprzestanie spożywania posiłków na 24 godziny i więcej ==

      Zaprzestanie spożywania posiłków przez okres dłuższy niż ten, do którego organizm
      jest fizjologicznie przystosowany, uruchamia mechanizm adaptacyjny, który działa
      przez okres od dwóch do trzech tygodni. Działanie mechanizmu rozpoczyna się
      po czasie nie krótszym niż 16 godzin i nie dłuższym niż 3 dni od przyjęcia ostatniego
      posiłku (w zależności od budowy ciała, warunków środowiskowych i składu ostatniego
      posiłku; czas ten nie zależy od masy tkanki tłuszczowej). Po tym czasie zachodzące
      procesy, zwłaszcza pozyskiwanie przez organizm [[Glukoza|glukozy]] z [[Białka|białek]],
      powodują nieodwracalne lub trudno odwracalne zmiany, a także powstaje ryzyko
      niewłaściwej reakcji organizmu na posiłek w momencie zakończenia głodówki{{Cytuj
      |autor = Olszewska, Joanna (tłumacz). |tytuł = Lecznicza głodówka |data = [1999]
      |data dostępu = 2019-07-04 |isbn = 8391433439 |miejsce = Warszawa |wydawca =
      Wyd. ABA |oclc = 751538122}}{{Cytuj |autor = M N Harvie, M Pegington, M P Mattson,
      J Frystyk, B Dillon |tytuł = The effects of intermittent or continuous energy
      restriction on weight loss and metabolic disease risk markers: a randomized
      trial in young overweight women |czasopismo = International Journal of Obesity
      |data = 2011-05 |data dostępu = 2019-07-04 |issn = 0307-0565 |wolumin = 35 |numer
      = 5 |s = 714–727 |doi = 10.1038/ijo.2010.171 |url = http://www.nature.com/articles/ijo2010171
      |język = en}}. Analogiczna odpowiedź organizmu następuje w czasie drastycznego
      zmniejszenia podaży energetycznej, to jest wówczas, gdy z posiłkami dostarczanie
      jest mniej niż do 500 do 600 kcal w ciągu doby (wartość zależna od płci i budowy
      ciała){{Cytuj |tytuł = Lecznicze posty. Na co uważać? |data dostępu = 2019-07-13
      |opublikowany = www.focus.pl |url = https://www.focus.pl/artykul/wielki-maly-post-lecznicze-glodowki
      |język = pl}}.

      W potocznym znaczeniu lub w znaczeniu medycyny niekonwencjonalnej głodówka zaczyna
      się po ostatnim posiłku, natomiast w znaczeniu medycznym głodówka zaczyna się
      po wyczerpaniu zapasu [[glikogen]]u w [[wątroba|wątrobie]] i mięśniach (zapas
      wynosi od 400 do 450 gram, czyli na ok. 16 godzin). Następnie spalaniu ulegają
      [[białka]]. Organizm rozpoczyna syntezę glukozy na drodze [[glukoneogeneza|glukoneogenezy]],
      w której wykorzystywane są zgromadzone w organizmie [[aminokwasy]]. Na skutek
      przedłużającej się głodówki zwiększa się spalanie [[Aminokwasy białkowe|aminokwasów]]
      pochodzących z rozkładu [[Białka|białek]] [[krew|krwi]] i [[Mięsień|tkanki mięśniowej]].
      Zwiększa się znacznie ryzyko wystąpienia [[hipoglikemia|hipoglikemii]], na którą
      szczególnie wrażliwa jest [[tkanka nerwowa]].

      Zwiększone spalanie tłuszczów nie jest bezpośrednim następstwem krótkotrwałej
      głodówki (szacunkowo do 2 tygodni), jednak w momencie zwiększonego wysiłku fizycznego
      lub konieczności utrzymania właściwej [[Termoregulacja|temperatury ciała]] równolegle
      do spalania białek następuje wykorzystanie zasobów energetycznych zmagazynowanych
      w tkance tłuszczowej. Tłuszcze ulegają procesowi spalaniu w procesie [[Beta-oksydacja|β-oksydacji]].
      Zwiększony rozpad [[Triacyloglicerole|triacylogliceroli]], wzrost stężenia wolnych
      [[Kwasy tłuszczowe|kwasów tłuszczowych]] we [[Krew|krwi]] oraz nasilona ketogeneza
      prowadzą do wzrostu stężenia [[Ciała ketonowe|ciał ketonowych]], konsekwencją
      czego może być [[kwasica ketonowa]]. Opisany mechanizm czerpania zasobów energetycznych
      z tłuszczów zostaje uruchomiony po czasie 2 tygodni do 3 tygodni od ostatniego
      posiłku, przy czym wartość ta jest szacunkowa, określona na podstawie badań
      wykonanych w czasie [[II wojna światowa|II wojny światowej]] zarówno w badaniach
      na głodujących ochotnikach, jak i badając osoby, które głodują na skutek działań
      wojennych{{Cytuj |autor = Emil Apfelbaum |tytuł = Choroba głodowa: Badania kliniczne
      nad głodem wykonane w getcie warszawskim z roku 1942 |data = 1946 |wydanie =
      1 |miejsce = Warszawa |wydawca = American Joint Distribution Committee.}}.

      Eksperymenty wykorzystujące głodówki i głodzenie nie są akceptowalne we współczesnej
      nauce. Obecnie uznaje się, że poziom ryzyka takich badań jest zbyt wysoki. Podstawą
      takiego podejścia była analiza następstw tak zwanej [[Głodowa zima|głodowej
      zimy]], która miała miejsce w latach 1944–1945{{Cytuj |autor = Nicky Hart |tytuł
      = Famine, Maternal Nutrition and Infant Mortality: A Re-Examination of the Dutch
      Hunger Winter |czasopismo = Population Studies |data = 1993 |data dostępu =
      2018-09-13 |wolumin = 47 |numer = 1 |s = 27–46 |jstor=2175224}}. Eksperymenty
      tego rodzaju zakazane są w Europie na podstawie ''''[[Konwencja o prawach człowieka
      i biomedycynie|Konwencji O Ochronie Praw Człowieka i Godności Istoty Ludzkiej
      w Kontekście Zastosowań Biologii i Medycyny: Konwencja o Prawach Człowieka i
      Biomedycynie]]''''{{Cytuj |autor = Leszek Karski |tytuł = Eksperyment medyczny
      przeprowadzany na organizmie ludzkim. Aspekty prawa międzynarodowego, europejskiego
      i krajowego |czasopismo = Studia Ecologiae et Bioethicae |data = 2013 |wolumin
      = 11 |numer = 1 |s = 65–87}}.

      == Szkodliwość stosowania głodówki jako metody terapeutycznej ==

      Mimo że współczesna medycyna wyklucza stosowanie głodówki ze względu na ryzyko
      wystąpienia gwałtownego pogorszenia stanu zdrowia{{Cytuj |autor = Irene Strychar
      |tytuł = Diet in the management of weight loss |czasopismo = CMAJ: Canadian
      Medical Association journal = journal de l’Association medicale canadienne |data
      = 2006-01-03 |data dostępu = 2018-09-05 |issn = 1488-2329 |wolumin = 174 |numer
      = 1 |s = 56–63 |doi = 10.1503/cmaj.045037 |pmid = 16389240 |pmc = PMC1319349}},
      jej rzekome zalety są opisywane w publikacjach niemedycznych. Zaprzestanie spożywania
      posiłków na czas dłuższy niż okres, do którego człowiek jest przystosowany,
      stanowi [[Stan nagłego zagrożenia zdrowotnego|zagrożenie dla zdrowia, a nawet
      życia]] głodującego, ponieważ prowadzi do zachwiania [[Gospodarka wodno-elektrolitowa|równowagi
      elektrolitycznej]], spadku [[Tkanka mięśniowa|masy mięśniowej]] i może zwiększać
      ryzyko występowania [[Dna moczanowa|dny moczanowej]]. Zgodnie z obecną wiedzą,
      groźnym powikłaniem po odbyciu głodówki jest zaburzenie [[perystaltyka|perystaltyki]]
      jelit oraz zmiana pH środowiska układu pokarmowego (zaburzenie wydzielania żołądkowego),
      która prowadzi do [[Zespół rozrostu bakteryjnego jelita cienkiego|dysbakteriozy
      przewodu pokarmowego]]. W efekcie tego możliwy jest częściowy zanik [[Kosmki
      jelitowe|kosmków jelitowych]]{{Cytuj |autor = Wei-Long Hao, Yuan-Kun Lee |tytuł
      = Microflora of the Gastrointestinal Tract: A Review |data = 2004-06-01 |data
      dostępu = 2019-10-06 |isbn = 9781592597666 |wolumin = 268 |miejsce = New Jersey
      |wydawca = Humana Press |s = 491–502 |doi = 10.1385/1-59259-766-1:491 |url =
      http://link.springer.com/10.1385/1-59259-766-1:491 |język = en}}{{Cytuj |autor
      = R. Snepar, G. A. Poporad, J. M. Romano, W. D. Kobasa, D. Kaye |tytuł = Effect
      of cimetidine and antacid on gastric microbial flora |czasopismo = Infection
      and Immunity |data = 1982-05 |data dostępu = 2019-10-06 |issn = 0019-9567 |wolumin
      = 36 |numer = 2 |s = 518–524 |pmid = 7085070 |pmc = PMC351258}}. Częste lub
      długotrwałe stosowanie głodówek i diet głodowych doprowadzić może do [[Awitaminoza|awitaminozy]],
      a w następstwie niedoboru [[Witamina B12|witaminy B<sub>12</sub>]] do [[Niedokrwistość|anemii]]{{Cytuj
      |tytuł = Jakie są pierwsze objawy awitaminozy i jak ją leczyć? |data = 2019-01-17
      |data dostępu = 2019-10-06 |opublikowany = HelloZdrowie |url = https://www.hellozdrowie.pl/awitaminoza-na-czym-polega-i-jak-ja-leczyc-kiedy-dochodzi-do-groznego-niedoboru-witamin/
      |język = pl}}.

      Zwolennicy alternatywnych metod leczenia sugerują, niezgodnie z wiedzą o fizjologii
      człowieka, natychmiastowe rozpoczęcie procesu trawienia tłuszczów po rozpoczęciu
      głodówki{{Cytuj |autor = Chomik, Anna., Wydawnictwo Vital. |tytuł = Lecznicze
      głodówki dla każdego. Jak poprzez post pozbyć się chorób |data = 2016 |data
      dostępu = 2019-10-06 |isbn = 9788365404015 |miejsce = Białystok |wydawca = Vital
      |oclc = 946321976}} lub natychmiastowe rozpoczęcie innych procesów mających
      rzekomy korzystny wpływ na zdrowie człowieka. W rzeczywistości w początkowym
      okresie adaptacji do stanu zmniejszonej podaży składników energetycznych spalanie
      tłuszczów jest związane ze zwiększonym wysiłkiem fizycznym{{Cytuj |autor = P.
      L. Greenhaff, M. Gleeson, R. J. Maughan |tytuł = The effects of diet on muscle
      pH and metabolism during high intensity exercise |czasopismo = European Journal
      of Applied Physiology and Occupational Physiology |data = 1988 |data dostępu
      = 2019-10-06 |issn = 0301-5548 |wolumin = 57 |numer = 5 |s = 531–539 |doi =
      10.1007/bf00418458 |pmid = 3396568}}.

      Na podstawie badania organizmów morskich uznaje się, że w tkance tłuszczowej
      [[Bioakumulacja|magazynowane]] są także toksyny jak [[metylortęć]]{{Cytuj |autor
      = Donna Mergler, Henry A. Anderson, Laurie Hing Man Chan, Kathryn R. Mahaffey,
      Michael Murray |tytuł = Methylmercury Exposure and Health Effects in Humans:
      A Worldwide Concern |czasopismo = AMBIO: A Journal of the Human Environment
      |data = 2007-02 |data dostępu = 2019-10-06 |issn = 0044-7447 |wolumin = 36 |numer
      = 1 |s = 3–11 |doi = 10.1579/0044-7447(2007)36[3:MEAHEI]2.0.CO;2 |url = http://www.bioone.org/doi/abs/10.1579/0044-7447%282007%2936%5B3%3AMEAHEI%5D2.0.CO%3B2
      |język = en}}, pestycydy{{Cytuj |tytuł = Pesticides found to accumulate in fat
      tissue |data dostępu = 2019-10-06 |opublikowany = phys.org |url = https://phys.org/news/2018-03-pesticides-accumulate-fat-tissue.html
      |język = en}} lub [[Bisfenol A]] (BPA){{Cytuj |autor = Tanya Tillett |tytuł
      = Bisphenol A, Chapter 2: New Data Shed Light on Exposure, Potential Bioaccumulation
      |czasopismo = Environmental Health Perspectives |data = 2009-05 |data dostępu
      = 2019-10-07 |issn = 0091-6765 |wolumin = 117 |numer = 5 |s = b |doi = 10.1289/ehp.117-a210b
      |pmid = 19478989 |pmc = PMC2685869 |url = https://ehp.niehs.nih.gov/doi/10.1289/ehp.117-a210b
      |język = en}}. Istnieje podejrzenie, że objawy długotrwałej głodówki, m.in.
      [[nudności]], [[zawroty głowy]], [[gorączka]], a także zwiększone ryzyko [[Choroby
      układu krążenia|chorób układu krążenia]], są spowodowane uwalnianiem tych substancji
      z redukowanej tkanki tłuszczowej{{Cytuj |autor = Philippe Grandjean, Hiroshi
      Satoh, Katsuyuki Murata, Komyo Eto |tytuł = Adverse Effects of Methylmercury:
      Environmental Health Research Implications |czasopismo = Environmental Health
      Perspectives |data = 2010-08 |data dostępu = 2019-10-06 |issn = 0091-6765 |wolumin
      = 118 |numer = 8 |s = 1137–1145 |doi = 10.1289/ehp.0901757 |pmid = 20529764
      |pmc = PMC2920086 |url = https://ehp.niehs.nih.gov/doi/10.1289/ehp.0901757 |język
      = en}}.

      Wbrew wiedzy o fizjologii człowieka, której proces adaptacyjny do stanu głodowego
      zmniejsza wydalanie wszelkich substancji, propagatorzy głodówki leczniczej sugerują,
      że prowadzi do pewnego rodzaju oczyszczenia organizmu, nazywanego detoksykacją{{Cytuj
      |autor = Dąbrowska, Ewa |tytuł = Dieta warzywno-owocowa dr Ewy Dąbrowskiej.
      Przepisy |data dostępu = 2019-10-06 |isbn = 9788327715180 |miejsce = Kraków
      |oclc = 1023628116}}. Detoksykacja ma być rzekomo spowodowana tym, że następuje
      [[autofagia]], w wyniku której rozłożeniu ulegają komórki zawierające toksyny
      i same toksyny{{Cytuj |tytuł = Forget Juice Cleanses. Autophagy Is the Real
      Way to Detox Your Body |data = 2018-01-18 |data dostępu = 2019-10-06 |opublikowany
      = Bulletproof |url = https://www.bulletproof.com/diet/intermittent-fasting/autophagy-for-longevity-detoxification/
      |język = en}}. W rzeczywistości proces ten zachodzi stale w organizmie człowieka
      i może być nasilany m.in. przez niedobór substancji odżywczych, jednak nie prowadzi
      od ich wydalenia z organizmu, ponieważ produkty autofagii są zużywane do budowy
      nowych komórek{{Cytuj |autor = Petro Starokadomskyy, Kostyantyn V. Dmytruk |tytuł
      = A bird’s-eye view of autophagy |czasopismo = Autophagy |data = 2013-07-11
      |data dostępu = 2019-10-06 |issn = 1554-8627 |wolumin = 9 |numer = 7 |s = 1121–1126
      |doi = 10.4161/auto.24544 |pmid = 23615436 |pmc = PMC3722328 |url = http://www.tandfonline.com/doi/abs/10.4161/auto.24544
      |język = en}}.

