- sections:
  - content: "'''Medycyna personalizowana''' (ang. personalised healthcare, personalised\
      \ medicine) – koncepcja, która opiera się na zrozumieniu różnic między pacjentami\
      \ chorującymi na tę samą [[choroba|chorobę]] i na jednoczesnym poznawaniu złożoności\
      \ chorób{{r|forum}}. Dzięki tej wiedzy możliwe jest dobieranie odpowiednich\
      \ [[Leczenie|terapii]] do konkretnych grup pacjentów. Medycyna personalizowana\
      \ pozwala przewidzieć czy określona terapia okaże się skuteczna dla danego pacjenta.\
      \ Podstawą medycyny personalizowanej są badania nad ludzkim [[genom]]em i wykorzystanie\
      \ wiedzy z zakresu dziedzin [[genetyka|genetyki]], [[genomika|genomiki]] i [[proteomika|proteomiki]].\
      \ \n\"Terapię personalizowaną można w skrócie określić jako dopasowywanie [[lek]]u\
      \ do pacjenta, a nie do danej choroby. Jest to zerwanie z tradycyjnym podejściem,\
      \ że u wszystkich osób z jednym [[choroba|schorzeniem]] stosuje się tę samą\
      \ metodę leczenia. Ludzie różnią się od siebie i dlatego nie ma jednej, uniwersalnej\
      \ metody terapii. U jednych, dany lek może poskutkować, u innych nie przynieść\
      \ efektów, albo wręcz wywołać groźne skutki uboczne.\"{{r|gaciong}}\nMedycyna\
      \ personalizowana oznacza ścisłe współdziałanie [[Diagnostyka (medycyna)|diagnostyki]]\
      \ i [[Leczenie|terapii]], ponieważ to właśnie precyzyjne metody diagnostyczne\
      \ pomagają ustalić różnice między chorującymi na tę samą chorobę pacjentami\
      \ a następnie dopasowywać leczenie do konkretnych grup pacjentów. Diagnozowanie\
      \ choroby na poziomie molekularnym pozwala na tworzenie leków bezpieczniejszych\
      \ i w długim okresie bardziej opłacalnych. \n\"Personalizowana [[farmakoterapia]]\
      \ jest szansą na przełamanie stagnacji w leczeniu wielu chorób. Jest też szansą\
      \ na rozwój nowatorskiego przemysłu farmaceutycznego i [[biotechnologia|biotechnologii]].\
      \ Chociaż od dawna wiadomo, że reakcja na leki jest osobno zróżnicowana, to\
      \ w praktyce obowiązywała zasada, że lek ma być dla wszystkich.(...) W ostatnim\
      \ okresie nastąpił jednak zdecydowany wzrost zainteresowania lekarzy, instytucji\
      \ odpowiedzialnych za organizację systemów ochrony zdrowia, a przede wszystkim\
      \ producentów leków i wytwórców testów genetycznych i farmakogenomicznych, farmakoterapią\
      \ indywidualnie dostosowaną dla poszczególnych pacjentów, czyli medycyną personalizowaną.\
      \ Zwycięża zasada \"właściwy lek dla właściwego pacjenta we właściwej dawce\"\
      R. Kaliszan, J. Długokęcka; \"Biofarmaceutyki - podstawowe narzędzie nowoczesnej\
      \ farmakoterapii; w: \"Biotechnologia. Monografia\"; 5 '2009. \nNajlepszym przykładem\
      \ personalizacji leczenia jest oznaczanie [[Białka receptorowe|receptora]] HER2\
      \ u pacjentek z [[Rak sutka|rakiem piersi]]. Nadmierna ilość tego receptora\
      \ na powierzchni guza świadczy o szczególnie złośliwej postaci choroby i dotyczy\
      \ około 20-30% pacjentów. Od kilku lat możliwe jest skuteczne blokowanie tego\
      \ receptora, poprzez podanie chorym odpowiedniego leku ([[Herceptyna]]). Efekty\
      \ takiej terapii to przedłużenie życia, zmniejszenie ryzyka [[Nawrót choroby|nawrotów]]\
      \ i [[Przerzut nowotworowy|przerzutów]].\n\"Koncepcja medycyny personalizowanej\
      \ staje się coraz bardziej powszechna na całym świecie. W marcu 2007 roku ówczesny\
      \ senator ze stanu [[Illinois]] – [[Barack Obama]] złożył w Kongresie USA projekt\
      \ nowej ustawy, która ma zapewnić dostęp do personalizowanej medycyny wszystkim\
      \ Amerykanom. Celem nowej ustawy jest rozszerzenie i przyspieszenie badań nad\
      \ genomem w celu udoskonalenia metod rozpoznawania chorób, zwiększenia bezpieczeństwa\
      \ leków i znalezienia nowych sposobów terapii\"[http://www.rynekzdrowia.pl/Badania-i-rozwoj/Prof-Zbigniew-Gaciong-terapia-personalizowana-to-przyszlosc-medycyny,8539,11.html\
      \ \"Prof. Zbigniew Gaciong: terapia personalizowana, to przyszłość medycyny\"\
      ; Rynek Zdrowia; 2 lipca 2009]. Tworzone są duże systemy informatyczne pozwalające\
      \ na gromadzenie, analizę i wykorzystanie genetycznych i klinicznych danych\
      \ o pacjentach chorujących na nowotwory{{r|gdc}}.\n== Przypisy ==\n{{Przypisy|\n\
      {{Cytuj stronę| url = http://acmedsci.ac.uk/download?f=file&i=32644| tytuł =\
