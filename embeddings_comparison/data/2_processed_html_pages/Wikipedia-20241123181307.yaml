- sections:
  - content: '{{inne znaczenia|rodzaju urządzenia|[[Wirówka (szaradziarstwo)|Wirówka]]
      - rodzaj diagramu}}

      [[Plik:Tabletop centrifuge.jpg|thumb|Wirówka]]

      [[Plik:Krew Frakcjonowana.jpg|thumb|Krew ludzka frakcjonowana przez wirowanie.
      Widoczne osocze (warstwa górna), warstwa leukocytarno-płytkowa (cienka, biało
      zabarwiona warstwa środkowa) oraz warstwa erytrocytarna (na dole).]]

      {{ISG|Wirówka|Wirówka}}

      ''''''Wirówka, separator, centryfuga'''''' (łac. ''''centrifuge'''') – urządzenie
      do rozdzielania [[zawiesina|zawiesin]] i [[emulsja|emulsji]], przez wprawienie
      w szybki [[ruch obrotowy]], którego stałe [[przyspieszenie]] znacznie przekracza
      [[przyspieszenie ziemskie]], wielokrotnie zwiększając szybkość [[sedymentacja|sedymentacji]]{{Cytuj
      |tytuł = Wirówka (centryfuga) {{!}} Mleczarnie Online |data dostępu = 2022-02-13
      |opublikowany = mleczarnieonline.pl |url = https://mleczarnieonline.pl/slownik/1201316-wirowka-centryfuga}}.

      Pierwszą wirówkę skonstruował w 1864 Niemiec Antoni Prandtl. W 1876 Wilhelm
      Lefeldt zbudował wirówkę do mleka a w 1878 Szwed [[Gustaf de Laval]] wykonał
      separator działający w sposób ciągły{{Cytuj |tytuł = Wirówka - Wynalazki i odkrycia
      |data dostępu = 2022-02-13 |opublikowany = wynalazki.andrej.edu.pl |url = https://wynalazki.andrej.edu.pl/wynalazki/38-w/655-wirowka}}.
      W 1886 w Szwecji i Niemczech{{Cytuj |tytuł = Eksponat tygodnia – centryfuga
      (wirówka) |data dostępu = 2022-02-13 |opublikowany = Muzeum Ziemiaństwa w Dąbrowie
      |url = http://muzeumdabrowa.pl/2020/08/eksponat-tygodnia-centryfuga-wirowka/
      |język = pl-PL}} uruchomiono produkcję ręcznych wirówek na skalę przemysłową.

      Wirówki elektryczne, początkowo osiągały prędkość 20 tys. obrotów na minutę
      (1923). Współcześnie produkuje się mikrowirówki, które osiągają nawet do 1 mln
      obrotów na minutę. Przy takiej szybkości obrotowej, przyspieszenie działające
      na próbkę jest ok. 5 mln razy wyższe od [[przyspieszenie ziemskie|przyspieszenia
      ziemskiego]].

      W zależności od struktury technicznej i zastosowania, wirówki można podzielić
      na wirówki talerzowe (separatory){{Cytuj |tytuł = Zasada działania separatora
      |data dostępu = 2022-02-13 |opublikowany = www.flottweg.com |url = https://www.flottweg.com/pl/wiki/technologia-oddzielania/zasada-dzialania-separatora/
      |język = pl}} i wirówki dekantacyjne{{Cytuj |tytuł = Sposób działania dekantera
      {{!}} Jak działa dekanter? |data dostępu = 2022-02-13 |opublikowany = www.flottweg.com
      |url = https://www.flottweg.com/pl/linie-produktow/wirowki/technika-wirowek-dekantacyjnych/}}.

      Najczęściej spotykanym tego rodzaju urządzeniem przemysłowym jest wirówka filtracyjna,
      w której rozdzielane cząstki są zatrzymywane na tkaninie filtracyjnej w obrotowym
      bębnie, natomiast ciecz jest wypychana przez otwory w jego bocznych ściankach.
      Do tego typu wirówek należą powszechnie występujące wirówki bębnowe w pralkach
      lub służące do oczyszczania ścieków przemysłowych{{Cytuj |tytuł = Centryfuga
      – urządzenie do oczyszczania ścieków przemysłowych – Młodzi przedsiębiorczy
      |data dostępu = 2022-02-13 |url = https://mlodziprzedsiebiorczy.pl/centryfuga-urzadzenie-do-oczyszczania-sciekow-przemyslowych/
      |język = pl-PL}}.

      Najpopularniejsze typy wirówek:

      # [[wirówka mleczarska|wirówki mleczarskie]] – wykorzystywane do oddzielania
      tłuszczu z mleka pełnego a także do oczyszczania mleka z zanieczyszczeń mechanicznych
      i [[Mikroorganizm|drobnoustrojów]];

      # [[Wirowanie frakcjonujące|wirówki frakcjonujące]] – stosowane głównie w laboratoriach,
      służą do odwirowywania osadów i rozdzielania emulsji; przykładem wirówek tego
      typu jest [[wirówka wzbogacająca]] do [[rozdzielanie izotopów|rozdzielania izotopów]]
      [[Uran (pierwiastek)|uranu]] w czasie procesu jego [[wzbogacanie uranu|wzbogacania]];
      innym rodzajem wirówek laboratoryjnych są [[ultrawirówka|ultrawirówki]] o bardzo
      wysokich szybkościach obrotowych (powyżej 20 tys. obrotów na minutę), które
      służą m.in. do odseparowywania ciężkich krwinek od [[Surowica (hematologia)|serum]]
      lub [[plazma (krew)|plazmy]]; w ten sam sposób oddziela się cięższe i lżejsze
      bakterie bez zabijania ich{{Cytuj |autor = Krzysztof Wołowiec |tytuł = ABC wirówek
      laboratoryjnych — rodzaje, zasada działania i zastosowanie |data dostępu = 2022-02-13
      |opublikowany = Laboratoryjnie.pl - Laboratoryjny portal informacyjny |url =
      https://laboratoryjnie.pl/2022/02/07/abc-wirowek-laboratoryjnych-rodzaje-zasada-dzialania-i-zastosowanie/
      |język = pl-PL}};

      # wirówki znajdujące zastosowanie w gospodarstwie domowym i w pralniach jako
      osobne urządzenia, lub wbudowane w konstrukcję współczesnych [[pralka|pralek]]
      automatycznych; służą do odwirowania z wypranej odzieży nadmiaru wody, czym
      znacznie skracają czas potrzebny do jej wyschnięcia (w tym zastosowaniu wirówki
      praktycznie wyparły stosowane dawniej do tego celu [[wyżymaczka|wyżymaczki]]);

      # wirówki do oddzielania [[sok]]ów od [[owoc]]ów i [[warzywa|warzyw]] – tzw.
      [[sokowirówka|sokowirówki]];

      # [[wirówka przeciążeniowa|wirówki przeciążeniowe]] - symulatory lotnicze, wykorzystywane
      do intensywnego szkolenia manewru przeciwprzeciążeniowego{{Cytuj |tytuł = Wirówka
      przeciążeniowa - symulator szkoleniowy {{!}} Wojskowy Instytut Medycyny Lotniczej
      |data dostępu = 2022-02-13 |opublikowany = www.wiml.waw.pl |url = http://www.wiml.waw.pl/pl/Symulator}}.

