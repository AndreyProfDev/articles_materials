- sections:
  - content: "'''Turystyka medyczna''' – [[turystyka]] połączona z leczeniem; rozumiana\
      \ jest jako świadoma działalność człowieka, w której podróżny (turysta medyczny)\
      \ ma na celu uzyskanie szeroko pojmowanej opieki zdrowotnej – zarówno we własnym\
      \ kraju, jak i za granicą – polegającej przede wszystkim na zachowaniu (pozyskaniu\
      \ lepszego) stanu zdrowia, i/lub estetycznego wyglądu własnego ciała, połączonego\
      \ z wypoczynkiem, regeneracją sił fizycznych i psychicznych, zwiedzaniem atrakcji\
      \ i walorów turystycznych oraz rozrywkąLubowiecki-Vikuk AP. Turystyka medyczna\
      \ jako produkt eksportowy polskiej gospodarki. Ekonomiczne Problemy Usług 2011;79:125-36.Lubowiecki-Vikuk\
      \ AP. Turystyka medyczna przejawem współczesnych trendów i tendencji w turystyce.\
      \ Ekonomiczne Problemy Usług 2012;84:553-68..\nTurystyka medyczna tuż obok turystyki\
      \ uzdrowiskowej i turystyki spa i [[wellness]] jest elementem [[turystyka zdrowotna|turystyki\
      \ zdrowotnej]]. Do Polski przyjeżdżają pacjenci z krajów wysoko rozwiniętych\
      \ gospodarczo [[Europa|Europy]], szczególnie [[Wielka Brytania|Wielkiej Brytanii]],\
      \ [[Niemcy|Niemiec]], [[Szwecja|Szwecji]], [[Dania|Danii]] oraz [[Norwegia|Norwegii]]Lubowiecki-Vikuk\
      \ AP, Rab-Przybyłowicz J. Wybrane aspekty funkcjonowania rynku turystyki medycznej\
      \ w Polsce. Folia Turistica 2015;34..\n== Główne determinanty zjawiska ==\n\
      Głównymi determinantami uczestnictwa w turystyce medycznej są:\n* brak ubezpieczenia\
      \ pokrywającego koszty leczenia we własnym kraju,\n* chęć zaoszczędzenia pieniędzy\
      \ – dzięki skorzystaniu z identycznej, tańszej usługi medycznej w innym kraju,\n\
      * większą dostępność informacji (Internet),\n* naśladowanie innych [[Grupa społeczna|grup\
      \ społecznych]] (rodziny, przyjaciół),\n* wykreowanie przez media, mody na poprawianie\
      \ własnej urody, które wychodząc naprzeciw społecznemu zapotrzebowaniu na tego\
      \ rodzaju tematykę za­częły dostarczać coraz więcej informacji z tej dziedziny,\n\
      * rekomendacja znajomych,\n* potrzeba zmiany wizerunku połączona z potrzebą\
      \ intymności (niechęć do dzielenia się informacją o zabiegu czy operacji z innymi;\
      \ osoba publiczna, powszechnie znana chce uniknąć rozgłosu),\n* brak legalizacji\
      \ niektórych zabiegów medycznych we własnym kraju (aborcja, In vitro).\n== Pozostałe\
      \ ==\nPoza granicami kraju zamieszkania konsumenci poszukują głównie opieki\
      \ specjalistycznej: onkologicznej, skomplikowanych schorzeń sercowo naczyniowych,\
      \ wegetatywnych oraz chorób rzadkich i genetycznych. Jednak dla większości turystów\
      \ medycznych faktycznym powodem podjęcia tego rodzaju decyzji jest różnica w\
      \ kosztach usług medycznych między państwem, w którym danym konsument zamieszkuje\
      \ a kosztem zabiegu w państwie, do którego konsument się udaje.J. Rab-Przybyłowicz,\
      \ 2012, Determinanty popytowe wpływające na rozwój turystyki medycznej, Zeszyty\
      \ Naukowe Uniwersytetu Szczecińskiego nr 698, „Ekonomiczne Problemy Usług” 2012,\
      \ nr 83: 207-221.J. Rab-Przybyłowicz, 2010, Tworzenie produktu dla turystyki\
      \ medycznej w Szczecinie, Zeszyty Naukowe Uniwersytetu Szczecińskiego nr 591,\
      \ „Ekonomiczne Problemy Usług” 2010, nr 53: 695-706.. \n[[Indie]] i [[Tajlandia]]\
      \ przodują w światowej turystyce medycznej.\n== Leczenie uzdrowiskowe ==\nPrekursorem\
      \ współczesnej turystyki medycznej było leczenie uzdrowiskowe, stosowane już\
      \ w starożytnej Grecji przez [[Hipokrates]]a.\n== Przypisy ==\n{{Przypisy}}\n\
      == Linki zewnętrzne ==\n* {{cytuj stronę | url = https://clinichunter.com/2019/11/18/most-proactive-clinics-on-the-polish-medical-tourism-market/\
      \ | tytuł = \nMost Proactive Clinics on the Polish Medical Tourism Market |\
      \ opublikowany = ClinicHunter | data = 2019-11-18}} Raport: Najaktywniejsze\
      \ kliniki na polskim rynku turystyki medycznej\n{{Kontrola autorytatywna}}\n\
      [[Kategoria:Medycyna]]\n[[Kategoria:Turystyka]]"
