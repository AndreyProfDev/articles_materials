  - content: '[[Plik:Annie Darwin.jpg|thumb|182px| Córka [[Charles Darwin|Karola Darwina]]
      [[Anne Darwin|Anna]], zmarła w wieku 10 lat na gruźlicę.]]

      [[Plik:TB Culture.jpg|thumb|182px|Bakteria wywołująca gruźlicę ''''[[Prątek
      gruźlicy|Mycobacterium tuberculosis]]'''' doprowadziła do jej śmierci, ponieważ
      patogen ten ewoluował w kierunku unikania mechanizmów obronnych jej układu immunologicznego.]]

      ''''''Medycyna ewolucyjna'''''' – opiera się na zastosowaniu teorii ewolucji
      ([[Charles Darwin|Karol Darwin]]) w celu wyjaśnieniu zjawisk towarzyszących
      chorobie oraz stosowaniu odpowiednich terapii z naciskiem na usunięcie przyczyn
      choroby, a nie tylko zwalczania ich objawów. Drugim obszarem jest nowoczesna
      edukacja medyczna. Naukowcy zajmujący się medycyną ewolucyjną uważają, że biologia
      ewolucyjna nie powinna być tylko uzupełniającym tematem zajęć w szkołach medycznych,
      ale powinna być nauczana jako podstawowy model wszystkich nauk medycznych (w
      oparciu o nowoczesną wiedzę z zakresu biochemii, biologii, biofizyki, ewolucji,
      psychologii){{Cytuj |url= http://www.pnas.org/content/early/2009/11/12/0906224106
      |data=2009 |wydawca=PNAS |doi=10.1073/pnas.0906224106 |pmid=19918069 |autor=RM
      Nesse, CT Bergstrom, PT Ellison, JS Flier, P Gluckman, DR Govindaraju, D Niethammer,
      GS Omenn, RL Perlman |tytuł=Evolution in health and medicine Sackler colloquium:
      Making evolutionary biology a basic science for medicine. |wolumin=107 Suppl
      1 |s=1800–1807 |pmc=2868284 |czasopismo=[[Proceedings of the National Academy
      of Sciences of the United States of America]]}}.

      Główne kierunki medycyny ewolucyjnej skupiają się na takich obszarach jak:

      * Ewolucja patogenów (w tym wirulencja, odporność na antybiotyki, zmienność,
      genetyka) oraz ich wpływ na odpowiedź immunologiczną organizmu.

      * Kompromisy i konflikty zdrowotne wynikające z mechanizmów ewolucji.

      * Reakcja organizmu na zakażenia i infekcje. Zdolności organizmu do zabezpieczania
      się przed infekcjami, leczenia z infekcji, rekonwalescencji po zakażeniach i
      urazach. Rola układu odpornościowego, reakcji obronnych organizmu, gorączki
      i przebiegu jednostek chorobowych. Nabywanie odporności.

      * Wpływ procesu adaptacji rodzaju ludzkiego na przestrzeni tysiącleci do otaczającego
      środowiska i jej wpływ na organizm człowieka.

      * Skupienie uwagi pacjentów i lekarzy nie tylko na reagowaniu na chorobę, ale
      na procesach pozwalających długo utrzymać dobry stan zdrowia (odpowiednia dieta,
      prawidłowa masa ciała, regularny wysiłek fizyczny, właściwa higiena)

      * Minimalizacji używania środków farmaceutycznych (naturalnych i chemicznych);
      stosowaniu tylko sprawdzonych, skutecznych, naukowo przebadanych substancji
      w leczeniu ostrych i przewlekłych chorób; próba dostosowania stylu życia (dieta,
      używki, wysiłek fizyczny, sen, kontrola stresu) w celu minimalizacji dawek leków
      przyjmowanych w chorobach przewlekłych.

      * Nie rozgraniczaniu zdrowia fizycznego od psychicznego. Wzajemny wpływ stanu
      psychicznego i fizycznego na organizm.

      Do najbardziej znanych badaczy zajmujących się medycyną ewolucyjną należą przede
      wszystkim: [[Randolph Nesse|Randolph M. Nesse]], [[George C. Williams]], [[Paul
      W. Ewald]], James McKenna i Rainer H. Straub. W Polsce pierwszym i najbardziej
      znanym lekarzem propagującym medycynę ewolucyjną jest dr [[Maciej D. Zatoński]]
      z [[Akademii Medycznej we Wrocławiu]].

      == Historia ==

      [[Charles Darwin|Karol Darwin]] nie zajmował się rozważaniami nad wpływem swojej
      teorii na medycynę. W stosunkowo krótkim czasie środowisko biologów doceniło
      wartość prac Darwina. Jego teoria miała przełomowy wpływ w zrozumieniu mechanizmów
      działania różnych patogenów na organizm człowieka oraz na potrzebę i zdolność
      organizmów do obrony przed nimi. Dziś teorię ewolucji stosuje się nie tylko
      w naukach biologicznych, ale także w zarządzaniu, psychologii, nauce, a nawet
      w nowoczesnych technologiach produkcji.

      <blockquote>Ewolucja była dość długo ignorowana w środowiskach medycznych. Zamiast
      tego opierano się (tak jak w wielu naukach ścisłych) wyłącznie na tzw. koncepcji
      mechanicznej (ang. proximate mechanical causes). Medycyna rozwijała się w oparciu
      o model oparty na mechanice klasycznej, wywodzący się z prac Galileusza, Newtona
      czy Kartezjusza. Efektem tego było powstanie modelu mechanistycznego, materialistycznego
      i deterministycznego (możliwość dokładnego prognozowania) modelu praktykowania
      i nauczania medycyny w krajach zachodnich. Model ten promował wyjaśnianie mechanizmów
      i przyczyn chorób poprzez obserwację i modyfikację ich objawów. Przyjęto prosty
      – przyczynowy i materialistyczny model – oparty o anatomiczne lub strukturalne
      (np. geny i ich produkty) elementy organizmu człowieka. Zmiany zachodzące w
      organizmach podczas choroby do dziś tłumaczone są w liniowy, bezpośredni sposób
      (np.: chorobę wywołuje jakiś czynnik infekcyjny, toksyczny, fizyczny, uraz itp.).
      Problem pojawia się jednak, gdy po stosownej analizie literatury medycznej dochodzimy
      do wniosku, że znaczna większość współczesnych jednostek chorobowych nie ma
      ustalonej jednoznacznie etiologii{{Cytuj pismo |autor=Weiner H |tytuł=Notes
      on an evolutionary medicine |czasopismo=Psychosom Med |wolumin=60 |wydanie=4
      |strony=510–20 |pmid=9710299 |url=http://www.psychosomaticmedicine.org/cgi/pmidlookup?view=long&pmid=9710299
      |data = 1 July 1998}}. <sup>p. 510</sup> ] O ile współczesna medycyna dokładnie
      potrafi opisać mechanizm i konsekwencje różnych patologii (np. nadciśnienia
      tętniczego, cukrzycy, nowotworów), to poza wąską grupą przypadków, z reguły
      nie wiadomo, co jest ich przyczyną. Znane są zwykle czynniki ryzyka i predyspozycje
      (badania często są tu sprzeczne) – ale przyczyna pozostaje nieuchwytna. Medycyna
      ewolucyjna nie tylko skutecznie wyjaśnia mechanizmy i przyczyny wszystkich chorób:
      w ostatnich latach pojawia się coraz więcej doniesień o możliwości zapobiegania,
      ograniczania, a nawet leczenia chorób cywilizacyjnych poprzez odpowiednią zmianę
      stylu życia [literatura]. </blockquote>

      Pierwsze{{fakt|data=2022-02}} próby zastosowania teorii ewolucji w medycynie
      pojawiły się dopiero w połowie XX wieku ([[George C. Williams]]{{Cytuj pismo
      |autor=Williams GC |tytuł=Pleiotropy, Natural Selection, and the Evolution of
      Senescence |czasopismo=Evolution |wolumin=11 |wydanie= 4|strony=398–411 |rok=1957
      |doi= 10.2307/2406060 |url=http://grad.bio.uci.edu/ecoevo/crauser/pdf_files/Williams%201957.pdf
      |jstor=10.2307/2406060 |wydawca=Society for the Study of Evolution}} [https://web.archive.org/web/20110604151443/http://sageke.sciencemag.org/cgi/content/abstract/sageke;2001/1/cp13
      abstract], [[John Bowlby]], Nikolaas Tinbergen{{Cytuj pismo|autor=Tinbergen
      N|tytuł=On Aims and Methods in Ethology|url=http://www.rockefeller.edu/bard/pdf/week_02_tinbergen_on_aims_and_methods_of_ethology_zft_1963.pdf|archiwum=http://web.archive.org/web/20170417074125/http://www.rockefeller.edu/bard/pdf/week_02_tinbergen_on_aims_and_methods_of_ethology_zft_1963.pdf|czasopismo=Zeitschrift
      für Tierpsychologie|wolumin=20|strony=410–433|rok=1963}}).

      R. Nesse tak podsumowuje koncepcję medycyny ewolucyjnej: <blockquote> “…wszystkie
      biologiczne aspekty funkcjonowania organizmu potrzebują do pełnego opisu obu
      podejść do medycyny: mechanistycznego i ewolucyjnego. Ten pierwszy opisuje i
      tłumaczy chorobę i spowodowane przez nią zaburzenia w funkcjonowaniu organizmu
      u danego pacjenta. Model ewolucyjny tłumaczy, dlaczego wszyscy jesteśmy podobni
      i reagujemy w ten sam sposób na czynniki wywołujące choroby; dlaczego mamy zęby
      mądrości, wyrostek robaczkowy, albo po co nam komórki, które dzielą się bez
      kontroli?”{{Cytuj pismo |autor=Nesse RM |tytuł=Evolution: medicine’s most basic
      science |czasopismo=Lancet |wolumin=372 |wydanie=Suppl 1 |strony=S21–7 |miesiąc=December
      |rok=2008 |doi=10.1016/S0140-6736(08)61877-2}}</blockquote>

      Do przełomowych publikacji należą prace: Paula Ewalda z 1980, “Evolutionary
      Biology and the Treatment of Signs and Symptoms of Infectious Disease”{{Cytuj
      pismo |autor=Ewald PW |tytuł=Evolutionary biology and the treatment of signs
      and symptoms of infectious disease |czasopismo=J. Theor. Biol. |wolumin=86 |wydanie=1
      |strony=169–76 |rok=1980 |miesiąc=September |pmid=7464170 |url=https://www.sciencedirect.com/science/article/abs/pii/0022519380900739
      |doi=10.1016/0022-5193(80)90073-9}}, oraz publikacje Williamsa i Nesse''go z
      1991, “The Dawn of Darwinian Medicine”{{Cytuj pismo |autor=Williams GC, Nesse
      RM |tytuł=The dawn of Darwinian medicine |czasopismo=Q Rev Biol |wolumin=66
      |wydanie=1 |strony=1–22 |rok=1991 |miesiąc=March |pmid=2052670 |doi=10.1086/417048}}.
      Ten ostatni uzyskał bardzo dobre recenzje i spotkał się z gorącym przyjęciem
      w środowisku naukowców zajmujących się naukami medycznymi{{Cytuj książkę|autor=Williams,
      George; Nesse, Randolph M.|tytuł=Why we get sick: the new science of Darwinian
      medicine|wydawca=Vintage Books|miejsce=New York|rok=1996|isbn=0-679-74674-9|strony=x}}
      powstała także książka pt. ''''Why We Get Sick'''' (opublikowana także pt ''''Evolution
      and healing'''' w Wielkiej Brytanii). Od 2008 roku ukazuje się także czasopismo
      poświęcone medycynie ewolucyjnej: [http://evmedreview.com Evolution and Medicine
      Review].

      == Patogeny ==

      Adaptacja i ewolucja bakterii, wirusów i innych drobnoustrojów (w tym także
      pasożytów) odgrywa centralną rolę w medycynie. Proces ten jest niezbędny do
      zrozumienia takich zagadnień, jak oporność na antybiotyki{{Cytuj pismo |autor=Stearns
      SC, Ebert D |tytuł=Evolution in health and disease: work in progress |czasopismo=Q
      Rev Biol |wolumin=76 |wydanie=4 |strony=417–32 |rok=2001 |miesiąc=December |pmid=11783396
      |doi=10.1086/420539}}, wirulencja{{Cytuj pismo |autor=Wickham ME, Brown NF,
      Boyle EC, Coombes BK, Finlay BB |tytuł=Virulence is positively selected by transmission
      success between mammalian hosts |czasopismo=Curr. Biol. |wolumin=17 |wydanie=9
      |strony=783–8 |rok=2007 |miesiąc=May |pmid=17442572 |doi=10.1016/j.cub.2007.03.067}},
      czy wpływ patogenów na modyfikację pracy układu odpornościowego{{Cytuj pismo
      |autor=Finlay BB, McFadden G |tytuł=Anti-immunology: evasion of the host immune
      system by bacterial and viral pathogens |czasopismo=Cell |wolumin=124 |wydanie=4
      |strony=767–82 |rok=2006 |miesiąc=February |pmid=16497587 |doi=10.1016/j.cell.2006.01.034}}.

      == Adaptacja organizmów ==

      Adaptacja organizmu ludzkiego do zmian w otoczeniu odbywa się w pewnych ramach
      określonych przez ewolucję. Wynika z tego wiele ograniczeń i kompromisów (opisywanych
      w kontekście różnych form współzawodnictwa){{Cytuj pismo |autor=Stearns SC |tytuł=Issues
      in evolutionary medicine |czasopismo=Am. J. Hum. Biol. |wolumin=17 |wydanie=2
      |strony=131–40 |rok=2005 |pmid=15736177 |doi=10.1002/ajhb.20105}}.

      === Ograniczenia ===

      Adaptacja w procesie ewolucji zachodzi tylko wtedy, kiedy zapewnia organizmowi
      jakąś korzyść i jednocześnie możliwe jest przekazanie tej cechy kolejnym pokoleniom.
      Z tego powodu niektóre zmiany adaptacyjne nie mogą powstać lub nie mogą zostać
      utrwalone w populacji. Na przykład:

      * [[Kwas deoksyrybonukleinowy|DNA]] nie może być całkowicie zabezpieczone przed
      „błędami” w procesie replikacji (podstawa ewolucji gatunków). Tym samym prawdopodobnie
      nigdy nie będzie możliwe całkowite wyeliminowanie chorób nowotworowych (efekt
      uboczny mutacji somatycznych) w procesie naturalnej selekcji.

      * b. Ludzie nie potrafią syntetyzować np. witaminy C – stąd narażeni są na wystąpienie
      szkorbutu. [[Szkorbut]] to choroba związana z niedoborem witaminy C w diecie).

      * c. Ewolucja gałki ocznej spowodowała, że II nerw czaszkowy wychodzi z gałki
      ocznej poprzez siatkówkę (tzw. plamka ślepa). Konsekwencją jest to, że pewna
      część pola widzenia jest martwa (mózg daje złudzenie pełnego obrazu, podczas
      gdy w rzeczywistości tak nie jest). Bardziej istotne jest jednak to, że poprzez
      ewolucję oka wzrok stał się wrażliwy na zwiększenie ciśnienia w gałce ocznej
      (ucisk może doprowadzić do uszkodzenia nerwu, a w rezultacie do utraty wzroku).

      === Kompromisy i konflikty ===

      Wiele zmian adaptacyjnych może ze sobą kolidować – powstaje wtedy potrzeba kompromisu
      między nimi w celu zapewnienia najkorzystniejszego dla danego organizmu wskaźnika
      kosztów do zysków. Na przykład:

      * Możliwość szybkiego biegania u kobiet koliduje z budową miednicy i optymalnym
      rozmiarem kanału rodnego{{Cytuj książkę |autor=Sagan, Dorion; Skoyles, John
      R. |tytuł=Up from dragons: the evolution of human intelligence |wydawca=McGraw-Hill
      |miejsce=New York |rok=2002 |strony=240–1 |isbn=0-07-137825-1}}

      * Pigmentacja skóry jako zabezpieczenie przed promieniowaniem UV koliduje ze
      zdolnością skóry do syntezy [[witaminy D]] dzięki działaniu wywieranemu przez
      promieniowanie UV.

      * Obniżenie krtani w pierwszym etapie życia umożliwia rozwój mowy. Jednocześnie
      większe jest zagrożenie zadławieniem się w trakcie przyjmowania pokarmów{{Cytuj
      pismo |autor=Lieberman P |tytuł=The Evolution of Human Speech: Its Anatomical
      and Neural Bases |czasopismo=Current Anthropology |wolumin=48 |wydanie= |strony=39–66
      |rok=2007 |url= http://www.cog.brown.edu/people/lieberman/pdfFiles/Lieberman%20P.%202007.%20The%20evolution%20of%20human%20speech,%20Its%20anatom.pdf
      |doi=10.1086/509092}}.

      * [[Niedokrwistość sierpowatokrwinkowa|Anemia sierpowata]] – schorzenie rzadkie
      w Europie, ale znacznie rozpowszechnione np. wśród czarnoskórych mieszkańców
      Afryki – zabezpiecza chorego przed zachorowaniem na malarię.

      * Sposób rozmnażania ludzi zwiększa możliwość zapadnięcia na wiele chorób{{Cytuj
      pismo |autor=Howard RS, Lively CM |tytuł=Good vs complementary genes for parasite
      resistance and the evolution of mate choice |czasopismo=BMC Evol Biol. |wolumin=4
      |wydanie=1 |strony=48 |rok=2004 |miesiąc=November |pmid=15555062 |pmc=543473
      |doi=10.1186/1471-2148-4-48}}

      * Niezgodność genetyczna między matką a płodem zwiększa możliwość powikłania
      przebiegu ciąży{{Cytuj pismo |autor=Haig D |tytuł=Genetic conflicts in human
      pregnancy |czasopismo=Q Rev Biol |wolumin=68 |wydanie=4 |strony=495–532 |rok=1993
