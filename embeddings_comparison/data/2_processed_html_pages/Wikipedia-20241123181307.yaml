- sections:
  - content: "{{Strona WWW infobox\n |nazwa = Medonet\n |nazwa oryginalna = \n |grafika\
      \ = Medonet logo RGB.png\n |opis grafiki = \n |typ strony = portal\n |komercyjna\
      \ = \n |data powstania = 2010\n |data zamknięcia = \n |autor = \n |właściciel\
      \ = [[Ringier Axel Springer Polska]]\n |rejestracja = \n |wersje językowe =\
      \ \n |commons = \n |www = https://www.medonet.pl\n}}\n'''Medonet''' – ogólnopolski\
      \ portal poświęcony zdrowiu, medycynie i zdrowemu stylowi życia{{Cytuj |tytuł\
      \ = Onet.pl ma serwis medyczny |data dostępu = 2020-11-09 |opublikowany = Press.pl\
      \ |url = https://www.press.pl/tresc/20311,onet_pl-ma-serwis-medyczny |język\
      \ = pl}}, którego założeniem jest edukowanie czytelników w kwestiach zdrowotnych\
      \ w oparciu o [[Medycyna oparta na faktach|badania naukowe]] i wypowiedzi lekarzy\
      \ oraz ekspertów{{Cytuj |tytuł = Polityka redakcyjna Medonet |data = 2024-03-04\
      \ |data dostępu = 2024-04-08 |opublikowany = medonet.pl |url = https://www.medonet.pl/polityka-redakcyjna-medonet,artykul,97848017.html\
      \ |język = pl}} \nNajpopularniejszy serwis w Polsce w kategorii „Zdrowie i medycyna”\
      \ – w lutym 2023 serwis odwiedziło prawie 11 mln realnych użytkowników{{Cytuj\
      \ |tytuł = Ringier Axel Springer Polska |data dostępu = 2024-04-08 |opublikowany\
      \ = Medonet Dziecko – nowy serwis na Medonet.pl |url = https://ringieraxelspringer.pl/press_room/medonet-dziecko-nowy-serwis-na-medonet.pl}}\
      \ Należy do największych na świecie komercyjnych serwisów zdrowotnych{{Cytuj\
      \ |tytuł = Top Health Websites in the world |data dostępu = 2020-11-09 |opublikowany\
      \ = similarweb.com |url = http://web.archive.org/web/20170602214921/https://www.similarweb.com/top-websites/category/health}}.\
      \ Najbardziej opiniotwórczy portal wśród mediów o tematyce zdrowotnej w Polsce\
      \ według raportu [[Instytut Monitorowania Mediów|Instytutu Monitorowania Mediów]]{{Cytuj\
      \ |tytuł = Medonet jednym z najbardziej opiniotwórczych mediów o tematyce zdrowotnej\
      \ |data dostępu = 2024-04-08 |opublikowany = ringieraxelspringer.pl |url = https://ringieraxelspringer.pl/press_room/medonet-jednym-z-najbardziej-opiniotworczych-mediow-o-tematyce-zdrowotnej-wedlug-raportu-instytutu-monitorowania-mediow}}.\n\
      Redakcja portalu promuje zdrowy styl życia i profilaktykę medyczną, inicjując\
      \ i włączając się w akcje społeczne. Flagowym projektem serwisu jest Narodowy\
      \ Test Zdrowia Polaków{{Cytuj | url=https://narodowytestzdrowia.medonet.pl/\
      \ | tytuł=Onet - Narodowy Test Zdrowia<!-- Tytuł wygenerowany przez bota -->\
      \ | opublikowany=medonet.pl | język=pl | data dostępu=2024-04-24}}, realizowany\
      \ od 2020, którego głównym elementem jest badanie mające na celu sprawdzić,\
      \ jak bardzo Polacy dbają o swoje zdrowie.\nRedaktorką naczelną portalu jest\
      \ dr Anna Zimny Zając{{Cytuj |tytuł = Dziennikarstwo wyjaśniające doskonale\
      \ sprawdza się w relacjonowaniu pandemii |data dostępu = 2020-11-09 |opublikowany\
      \ = Press.pl |url = https://www.press.pl/tresc/63352,dziennikarstwo-wyjasniajace-doskonale-sprawdza-sie-w-relacjonowaniu-pandemii\
      \ |język = pl}}{{Cytuj |tytuł = Anna Zimny-Zając - medonet.pl |data dostępu\
      \ = 2024-04-08 |opublikowany = www.medonet.pl |url = https://www.medonet.pl/anna-zimny-zajac,autor,,1.html}}.\
      \ Właścicielem portalu jest [[Ringier Axel Springer Polska]]{{Cytuj |tytuł =\
      \ Polityka redakcyjna |data dostępu = 2020-11-09 |opublikowany = medonet.pl\
      \ |url = https://www.medonet.pl/polityka-redakcyjna,artykul,97848017.html |język\
      \ = pl}}. Serwis korzysta z e-platformy wydawniczej Ring Publishing. \n== Misja\
      \ Medonetu ==\nMisją redakcji jest wspieranie długiego i zdrowego życia Polaków\
      \ poprzez szerzenie wiedzy opartej na badaniach naukowych i dostarczanie najświeższych\
      \ informacji z zakresu medycyny i szeroko pojętego zdrowego stylu życia. W tym\
      \ celu portal: prezentuje porady od lekarzy i wiarygodnych ekspertów zdrowia,\
      \ opisuje największe współczesne problemy zdrowotne, uświadamia, jak ważna jest\
      \ profilaktyka zachorowań oraz daje rozwiązania technologiczne pozwalające na\
      \ monitorowanie swojego stanu zdrowia i ułatwiające dostęp do lekarzy i placówek\
      \ medycznych. Treści przygotowywane są przez dziennikarzy medycznych z długoletnim\
      \ doświadczeniem (zrzeszonych w Stowarzyszeniu Dziennikarze dla Zdrowia), lekarzy\
      \ oraz ekspertów medycznych. Serwis współpracuje z Polskimi Towarzystwami Medycznymi,\
      \ fundacjami oraz organizacjami pacjenckimi. \nZgodnie ze swoją misją dostarczania\
      \ treści najwyższej jakości, portal wprowadził oznaczenie „Sprawdzona treść”,\
      \ które wskazuje, że dany artykuł został napisany przez dziennikarza medycznego\
      \ i zweryfikowany przez lekarza lub napisany bezpośrednio przez lekarza{{Cytuj\
      \ |tytuł = O nas |data dostępu = 2024-04-08 |opublikowany = www.medonet.pl |url\
      \ = https://www.medonet.pl/o-nas}}. Stowarzyszenie Dziennikarze dla Zdrowia\
      \ nagrodziło za te działania redakcję portalu honorowym tytułem Wielkiego Edukatora.\n\
      == Zawartość serwisu ==\nPortal przedstawia informacje dotyczące chorób, ich\
      \ profilaktyki, leczenia, porad lekarzy, bazy placówek medycznych, uzależnień{{Cytuj\
      \ |tytuł = Polacy a używki i fast-foody w 2020 roku. Wiemy, po co sięga się\
      \ najczęściej |data = 2020-05-18 |data dostępu = 2020-11-09 |opublikowany =\
      \ Noizz |url = https://noizz.pl/spoleczenstwo/jakie-uzywki-i-fast-foody-najbardziej-lubia-polacy-narodowy-test-zdrowia-polakow-2020/ld51x3b\
      \ |język = pl}}, kalkulatory oraz leksykony chorób{{Cytuj |tytuł = Zwierzętom\
      \ domowym też udziela się stres. #wiem z Medonet |data dostępu = 2020-11-09\
      \ |opublikowany = Newsweek.pl |url = https://www.newsweek.pl/wiedza/psychologia/zwierzetom-domowym-tez-udziela-sie-stres-wiem-z-medonet/xmxcpf0\
      \ |język = pl}}, badań i leków{{Cytuj |tytuł = Ruszył Medonet.pl – serwis medyczny\
      \ Onet.pl |data dostępu = 2020-11-09 |opublikowany = wirtualnemedia.pl |url\
      \ = https://www.wirtualnemedia.pl/artykul/ruszyl-medonet-pl-serwis-medyczny-onet-pl\
      \ |język = pl}}.\nMedonet współpracuje na wyłączność z serwisem telemedycznym\
      \ haloDoctor.pl{{Cytuj |tytuł = Usługi z haloDoctor.pl w serwisach Ringier Axel\
      \ Springer Polska |data dostępu = 2020-11-09 |opublikowany = wirtualnemedia.pl\
      \ |url = https://www.wirtualnemedia.pl/artykul/uslugi-z-halodoctor-pl-w-serwisach-ringier-axel-springer-polska\
      \ |język = pl}}, który pozwala uzyskać konsultację lekarską, otrzymać e-receptę\
      \ lub zwolnienie lekarskie{{Cytuj |tytuł = Platforma telemedyczna haloDoctor.pl\
      \ i strategiczne partnerstwo Ringier Axel Springer Polska |data dostępu = 2020-11-09\
      \ |opublikowany = Forbes.pl |url = https://www.forbes.pl/technologie/halodoctorpl-rasp-partnerem-strategicznym/j00f78s\
      \ |język = pl}}, serwisem Kliniki.pl, dzięki któremu znajdziemy dostępny termin\
      \ i umówimy się na zabieg lub operację{{Cytuj |tytuł = Medonet z ofertą bazy\
      \ Kliniki.pl |data dostępu = 2021-07-14 |opublikowany = wirtualnemedia.pl |url\
      \ = https://www.wirtualnemedia.pl/artykul/medonet-baza-kliniki-pl |język = pl}}.\
      \ W portalu znajdziemy także narzędzia takie jak \"S''ymptom Checker\"'', który\
      \ służy do wstępnego rozpoznawania dolegliwości{{Cytuj |tytuł = Medonet z narzędziem\
      \ do wstępnego rozpoznawania dolegliwości |data dostępu = 2021-07-14 |opublikowany\
      \ = wirtualnemedia.pl |url = https://www.wirtualnemedia.pl/artykul/medonet-symptom-checker-narzedzie-do-wstepnego-rozpoznawania-dolegliwosci\
      \ |język = pl}}. \nSerwis opiera swoje artykuły na zasadzie Explanatory journalism{{Cytuj\
      \ |tytuł = Anna Zimny-Zając: „To złoty okres dla rozwoju branży biotechnologicznej\
      \ i z pewnością korzyści będą długofalowe” – Artykuły – Biotechnologia.pl |data\
      \ dostępu = 2020-11-09 |opublikowany = biotechnologia.pl |url = https://biotechnologia.pl/biotechnologia/anna-zimny-zajac-to-zloty-okres-dla-rozwoju-branzy-biotechnologicznej-i-z-pewnoscia-korzysci-beda-dlugofalowe,20244#fbr\
      \ |język = pl}}. Ponadto organizuje akcje prozdrowotne:{{Cytuj |autor = Business\
      \ Insider Polska, 18:18 11 Lut, 1 307 |tytuł = Narodowy Test Zdrowia Polaków.\
      \ Akcja Medonet |data = 2020-02-11 |data dostępu = 2020-11-09 |opublikowany\
      \ = Business Insider |url = https://businessinsider.com.pl/wiadomosci/narodowy-test-zdrowia-polakow-medonet/twpq23y\
      \ |język = pl}} Narodowy Test Zdrowia Polaków 2020{{Cytuj |tytuł = Narodowy\
      \ Test Zdrowia Polaków |data dostępu = 2020-11-09 |opublikowany = medonet.pl\
      \ |url = https://www.medonet.pl/narodowy-test-zdrowia-polakow,kategoria.html\
      \ |język = pl}}, Narodowy Test Zdrowia Polaków 2021{{Cytuj |tytuł = Narodowy\
      \ Test Zdrowia Polaków 2021 serwisu Medonet. Wiemy, jak zmieniło się podejście\
      \ Polaków do zdrowia w czasie pandemii [RAPORT] |data = 2021-05-20 |data dostępu\
      \ = 2021-07-14 |opublikowany = reklama.medonet.pl |url = http://www.reklama.medonet.pl/narodowy-test-zdrowia-polakow-2021-serwisu-medonet-wiemy-jak-zmienio-sie-podejscie-polakow-do-zdrowia-w-czasie-pandemii\
      \ |język = pl}}, Uwaga! Cichy złodziej kości{{Cytuj |tytuł = Uwaga! Cichy złodziej\
      \ kości |data dostępu = 2020-11-09 |opublikowany = medonet.pl |url = https://www.medonet.pl/uwaga-cichy-zlodziej-kosci,kategoria.html\
      \ |język = pl}} czy Podziel się życiem{{Cytuj |tytuł = Podziel się życiem |data\
      \ dostępu = 2020-11-09 |opublikowany = medonet.pl |url = https://www.medonet.pl/podziel-sie-zyciem,kategoria.html\
      \ |język = pl}}. Testy zamieszczone w Medonecie dotyczą między innymi depresji\
      \ i nerwicy. W dziale wideo znajdują się programy: ''Sprawdzam''{{Cytuj |autor\
      \ = Anna Zimny-Zając |tytuł = Sprawdzam – serce i układ sercowo-naczyniowy |data\
      \ = 31.10.2020}}, ''Gość Medonetu'', ''Czas na zdrowie'', ''Gorący dyżur'' oraz\
      \ we współpracy z [[Onet.pl|Onet]] – ''Zdrowie Rano''{{Cytuj |tytuł = 'Zdrowie\
      \ Rano' - nowy format zdrowotny Onetu |data dostępu = 2021-07-14 |opublikowany\
      \ = wirtualnemedia.pl |url = https://www.wirtualnemedia.pl/artykul/zdrowie-rano-onet-iwona-kutyna\
      \ |język = pl}}. Od lipca 2021 r. redakcja Medonet.pl współpracuje przy wydawaniu\
      \ kwartalnika \"[[Newsweek Polska|Newsweek]] Zdrowie\"{{Cytuj |tytuł = „Newsweek\
      \ Zdrowie” po raz pierwszy we współpracy z Medonet.pl |data dostępu = 2021-07-14\
      \ |opublikowany = wirtualnemedia.pl |url = https://www.wirtualnemedia.pl/artykul/newsweek-zdrowie-medonet-pl\
      \ |język = pl}}.\n== Partnerzy portalu ==\nRedakcja dba o to, aby jak największa\
      \ liczba treści była tworzona lub weryfikowana przez osoby o wykształceniu medycznym\
      \ lub specjalistów z dziedziny zdrowia. Proces tworzenia treści opiera się na\
      \ Evidence Based Medicine oraz wytycznych towarzystw medycznych i naukowych.\
      \ Wśród partnerów portalu znajdują się m.in.: [[Collegium Medicum Uniwersytetu\
      \ Jagiellońskiego|Collegium Medicum]] [[Uniwersytet Jagielloński|Uniwersytetu\
      \ Jagiellońskiego]], [[Polskie Towarzystwo Kardiologiczne]], [[Polskie Towarzystwo\
      \ Diabetologiczne]], Polskie Towarzystwo Onkologiczne, Polskie Towarzystwo Stomatologiczne\
      \ oraz [[Polskie Towarzystwo Ginekologów i Położników]]{{Cytuj |tytuł = Nowa\
      \ odsłona serwisu Medonet.pl |data dostępu = 2020-11-09 |opublikowany = wirtualnemedia.pl\
      \ |url = https://www.wirtualnemedia.pl/artykul/nowa-odslona-serwisu-medonet-pl-jaka-umowic-sie-na-lekarska-konsultacje\
      \ |język = pl}}. Serwis otrzymał certyfikat HONcode{{Fakt|data=2021-07}}. Jest\
      \ on przyznawany przez organizację Health On the Net dla serwisów zdrowotnych\
      \ na całym świecie, które przekazują sprawdzone i wiarygodne informacje.\nWysoką\
      \ jakość publikowanych w portalu treści oraz obiektywną i transparentną informację\
      \ medyczną dla użytkowników Internetu potwierdza certyfikat @TRUST, który został\
      \ przyznany Medonet w 2023 przez American Accreditation Commission International\
      \ (AACI), jedną z najbardziej doświadczonych na świecie organizacji w zakresie\
      \ świadczenia usług akredytacji organizacji opieki zdrowotnej i certyfikacji\
