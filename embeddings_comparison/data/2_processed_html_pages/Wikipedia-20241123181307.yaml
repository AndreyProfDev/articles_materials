- sections:
  - content: '''''''The Wake Forest Institute for Regenerative Medicine (WFIRM)''''''
      – instytut badawczy powiązany z [[Wake Forest School of Medicine]], znajdującym
      się w [[Winston-Salem]], w [[Karolina Północna|Karolinie Północnej]], w [[Stany
      Zjednoczone|Stanach Zjednoczonych]].

      Celem WFIRM jest zastosowanie zasad [[Medycyna regeneracyjna|medycyny regeneracyjnej]]
      do naprawy lub wymiany chorych tkanek i narządów. Naukowcy WFIRM poszukują m.in.
      sposobów tworzenia w laboratorium komórek produkujących [[Insulina|insulinę]],
      konstruowania naczyń krwionośnych do operacji [[Pomostowanie aortalno-wieńcowe|pomostowania
      aortalno-wieńcowego]] oraz stosowania technologii medycyny regeneracyjnej w
      przypadku obrażeń odniesionych na polu walki, przy czym ta ostatnia prowadzona
      jest przez federalną inicjatywę [[Departament Obrony Stanów Zjednoczonych|Departamentu
      Obrony USA]] o wartości 75 milionów [[Dolar amerykański|dolarów]]. Dyrektorem
      instytutu jest [[Anthony Atala]]; został on zatrudniony przez Wake Forest Baptist
      Medical Center w 2004 roku i sprowadził wielu członków swojego zespołu z Laboratorium
      Inżynierii Tkanek i Terapii Komórkowej w Szpitalu Dziecięcym w [[Boston|Bostonie]]
      i [[Harvard Medical School]]. Osiągnięciami ogłoszonymi w WFIRM był pierwszy
      laboratoryjnie wyhodowany organ, [[pęcherz moczowy]], sztuczny pęcherz moczowy
      z możliwością wszczepienia człowiekowi{{Cytuj |tytuł = Lab-grown bladders ''a
      milestone'' |data = 2006-04-03 |data dostępu = 2020-04-04 |url = http://news.bbc.co.uk/2/hi/health/4871540.stm
      |język = en-GB}}{{Cytuj |autor = Anthony Atala, Stuart B Bauer, Shay Soker,
      James J Yoo, Alan B Retik |tytuł = Tissue-engineered autologous bladders for
      patients needing cystoplasty |czasopismo = The Lancet |data = 2006-04 |data
      dostępu = 2020-04-04 |wolumin = 367 |numer = 9518 |s = 1241–1246 |doi = 10.1016/S0140-6736(06)68438-9
      |url = https://linkinghub.elsevier.com/retrieve/pii/S0140673606684389 |język
      = en}} oraz [[komórki macierzyste]] pobrane z [[Wody płodowe|wód płodowych]]
      ciężarnych kobiet. Te komórki macierzyste są [[Pluripotencja|pluripotentne]],
      co oznacza, że można nimi manipulować w celu różnicowania w różne rodzaje dojrzałych
      komórek tworzących tkanki nerwowe, mięśniowe, kostne i inne, unikając jednocześnie
      problemów związanych z powstawaniem nowotworów i obaw etycznych związanych z
      embrionalnymi komórkami macierzystymi{{Cytuj |tytuł = Scientists See Potential
      In Amniotic Stem Cells - washingtonpost.com |data = 2010-11-22 |data dostępu
      = 2020-04-04 |opublikowany = web.archive.org |url = https://web.archive.org/web/20101122190308/https://www.washingtonpost.com/wp-dyn/content/article/2007/01/07/AR2007010700674.html}}.

      W 2019 roku federalny Departament Zdrowia i Usług Społecznych Stanów Zjednoczonych
      ([[Język angielski|ang.]] ''''United States Department of Health and Human Services''''
      (HHS)) wsparł technologię WFIRM, która może pozwolić lekarzom na lepsze zrozumienie
      uszkodzeń ciała spowodowanych wdychaniem [[Chlor|chloru]]. Technologia ta nosi
      nazwę "lung-on-a-chip" i jest częścią "zminiaturyzowanego układu narządów ludzkich"
      opracowanego przez WFIRM, który może pozwolić naukowcom na stworzenie modeli
      reakcji organizmu na czynniki szkodliwe{{Cytuj |autor = Friday, October 11,
      2019 |tytuł = HHS gives grant to study impact of chlorine gas on lungs |data
      = 2019-10-11 |data dostępu = 2020-04-04 |opublikowany = Homeland Preparedness
      News |url = https://homelandprepnews.com/stories/37891-hhs-gives-grant-to-study-impact-of-chlorine-gas-on-lungs/}}.

