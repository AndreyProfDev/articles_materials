- sections:
  - content: '[[Plik:Humanstemcell.JPG|mały|Kolonia ludzkich embrionalnych komórek
      macierzystych]]

      ''''''Medycyna regeneracyjna'''''' (od. {{łac.|regeneratio}} „regeneracja”)
      – [[Interdyscyplinarność|interdyscyplinarna]] dziedzina medycyny łącząca wiedzę
      m.in. z [[Inżynieria tkankowa|inżynierii tkankowej]] i [[Biologia molekularna|biologii
      molekularnej]], która ma na celu wspomaganie procesu [[Rana#Gojenie rany|gojenia]],
      [[regeneracja (biologia)|regeneracji]] i naprawy uszkodzonych [[Tkanka|tkanek]],
      komórek i narządów przy użyciu [[Przeszczepianie narządów|przeszczepów]], [[Terapia
      genowa|terapii genowej]] i [[Czynnik wzrostu|czynników wzrostu]]{{Cytuj|autor=Angelius
      Provita|tytuł=Czym jest medycyna regeneracyjna|data dostępu=2017-02-06|opublikowany=angelius.pl|url=https://angelius.pl/czym-jest-medycyna-regeneracyjna.html|język=pl|archiwum=https://web.archive.org/web/20170206185213/https://angelius.pl/czym-jest-medycyna-regeneracyjna.html|zarchiwizowano=2017-02-06}}.
      Medycyna regeneracyjna obejmuje również hodowlę tkanek i narządów w laboratorium
      i wszczepiania ich, gdy organizm nie jest w stanie sam się wyleczyć. Jeżeli
      [[komórki macierzyste]], z których będzie można hodować narządy będą pochodzić
      od pacjenta to mogłoby to rozwiązać problem niedoborów organów dostępnych od
      dawców oraz wyeliminowałoby problem odrzucenia przeszczepu przez organizm biorcy{{Cytuj|tytuł=Regenerative
      Medicine|data=2010|wydawca=National Institutes of Health|url=https://report.nih.gov/nihfactsheets/Pdfs/RegenerativeMedicine(NIBIB).pdf|data
      dostępu=2017-02-06|archiwum=https://web.archive.org/web/20111026103127/http://report.nih.gov/NIHfactsheets/Pdfs/RegenerativeMedicine(NIBIB).pdf|zarchiwizowano=2011-10-26}}{{Cytuj|autor=Chris
      Mason, Peter Dunnill|tytuł=A brief definition of regenerative medicine|czasopismo=Regenerative
      Medicine|data=2007-12-21|data dostępu=2017-02-06|issn=1746-0751|wolumin=3|numer=1|s=1–5|doi=10.2217/17460751.3.1.1|url=http://www.futuremedicine.com/doi/10.2217/17460751.3.1.1}}.
      Metody te mają na celu zwalczenie nie tylko [[Objaw kliniczny|symptomów]] chorób,
      ale również ich przyczyn, najczęściej mających podłoże [[genetyka|genetyczne]].
      Należą do nich błędy w [[materiał genetyczny|materiale genetycznym]] [[organizm]]u
      mające źródła [[Dziedziczność|dziedziczne]] lub powstające w wyniku [[mutacja|mutacji]].

      == Zobacz też ==

      {{Literatura}}

      * [[regeneracja (biologia)|regeneracja]] – odtwarzanie przez rośliny i zwierzęta
      utraconych lub uszkodzonych części ciała, narządów, tkanek lub komórek

      * [[przedłużanie życia]]

      * [[biomedycyna]]

      * [[polifiodontyzm]]

      * [[terapia komórkowa]]

