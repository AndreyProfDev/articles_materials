      | pmid=20498671}}.

      === Czystość i higiena ===

      Według tych teorii także nadmiar czystości, leków antybakteryjnych, preparatów
      sanitarnych, częstego prania ubrań i mycia ciała w znacznej mierze wyeliminowało
      obecność w codziennym życiu wielu bakterii i pasożytów (zwłaszcza jelitowych).
      Może to powodować problemy w prawidłowej pracy układu odpornościowego i kierowanie
      jego działań przeciwko własnym komórkom i organom (choroby alergiczne, autoimmunologiczne).

