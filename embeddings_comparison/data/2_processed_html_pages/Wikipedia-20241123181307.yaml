      \ |język = pl}} by wspólnie namówić Polaków do dbania o siebie i to, co najcenniejsze,\
      \ czyli swoje zdrowie. Twarzami akcji: Katarzyna Zielińska, Vienio i Michał\
      \ Figurski.\n* Nowy podcast Medonetu - “Reset” - o tym, jak wspomóc i zadbać\
      \ o sprawność psychosomatyczną.\n'''2021'''\n* od 1 sierpnia Diana Żochowska\
