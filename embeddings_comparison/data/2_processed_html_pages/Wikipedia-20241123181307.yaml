- sections:
  - content: "[[Plik:Medycyna stylu życia.jpg|thumb|200px|6 obszarów medycyny stylu\
      \ życia]]\n'''Medycyna stylu życia''' – dziedzina [[Medycyna|medycyny]], która\
      \ w [[Evidence-based medicine|oparciu o dowody naukowe]] wykorzystuje kompleksowe\
      \ zmiany codziennych [[zachowanie|zachowań]] w celu [[Profilaktyka zdrowotna|zapobiegania]]\
      \ chorobom, [[Rehabilitacja medyczna|odwracania]] ich skutków oraz wspierania\
      \ procesu [[Leczenie|leczenia]]. Zmiany zachowań koncentrują się głównie w sześciu\
      \ obszarach, do których należą: [[palenie tytoniu]] (i inne używki), [[Żywienie\
      \ człowieka|odżywianie]], aktywność fizyczna, radzenie sobie ze [[stres]]em,\
      \ [[sen]] i [[wsparcie społeczne]]{{Cytuj |autor = Anna Sayburn |tytuł = Lifestyle\
      \ medicine: a new medical specialty? |czasopismo = [[The BMJ|British Medical\
      \ Journal]] |data = 2018-10-25 |data dostępu = 2019-09-24 |issn = 0959-8138\
      \ |wolumin = 363 |s = k4442 |doi = 10.1136/bmj.k4442 |pmid = 30361414 |język\
      \ = en}}{{Cytuj |autor = M. Sagner, D. Katz, G. Egger, L. Lianov, K.-H. Schulz\
      \ |tytuł = Lifestyle medicine potential for reversing a world of chronic disease\
      \ epidemics: from cell to community |czasopismo = International Journal of Clinical\
      \ Practice |data = 2014 |data dostępu = 2019-09-24 |issn = 1742-1241 |wolumin\
      \ = 68 |numer = 11 |s = 1289–1292 |doi = 10.1111/ijcp.12509 |url = https://onlinelibrary.wiley.com/doi/abs/10.1111/ijcp.12509\
      \ |język = en}}{{Cytuj |tytuł = Lifestyle Medicine |data = 2016-04-19 |data\
      \ dostępu = 2019-09-24 |opublikowany = Lifestyle Medicine Global Alliance |url\
      \ = https://lifestylemedicineglobal.org/lifestyle-medicine/ |język = en}}{{Cytuj\
      \ |autor = [[Wojciech Stefan Zgliczyński]] |tytuł = Medycyna stylu życia |czasopismo\
      \ = INFOS |data = 2024-09-02 |issn = 2082-0666 |miejsce = Warszawa |opublikowany\
      \ = Kancelaria Sejmu RP |url = https://orka.sejm.gov.pl/WydBAS.nsf/0/A02FD9C8F5C1BEBAC1258B86003385BE?OpenDocument}}.\n\
      == Rozwój medycyny stylu życia na świecie ==\nWspółcześnie w [[Kraje rozwinięte|państwach\
      \ rozwiniętych]] największy wpływ na ryzyko [[Śmierć|zgonu]] i [[Niepełnosprawność|niepełnosprawności]]\
      \ mają czynniki [[zachowanie|behawioralne]] oraz czynniki [[Metabolizm|metaboliczne]].\
      \ Wśród czynników behawioralnych, jako najbardziej istotne wskazuje się niewłaściwą\
      \ dietę, palenie tytoniu (w tym [[Bierne palenie tytoniu|bierne]]), spożywanie\
      \ [[Napój alkoholowy|alkoholu]] oraz niską aktywność fizyczną. Z kolei wśród\
      \ czynników metabolicznych wskazywane są [[nadwaga]] i [[otyłość]], [[nadciśnienie\
      \ tętnicze]], zaburzenia [[Lipidy|lipidowe]], wysoki poziom [[glukoza|glukozy]]\
      \ we [[krew|krwi]]{{Cytuj |autor = Mohammad H. Forouzanfar, Ashkan Afshin, Lily\
      \ T. Alexander, H. Ross Anderson, Zulfiqar A. Bhutta |tytuł = Global, regional,\
      \ and national comparative risk assessment of 79 behavioural, environmental\
      \ and occupational, and metabolic risks or clusters of risks, 1990–2015: a systematic\
      \ analysis for the Global Burden of Disease Study 2015 |czasopismo = The Lancet\
      \ |data = 2016-10-08 |data dostępu = 2019-09-27 |issn = 0140-6736 |wolumin =\
      \ 388 |numer = 10053 |s = 1659–1724 |doi = 10.1016/S0140-6736(16)31679-8 |pmid\
      \ = 27733284 |pmc = PMC5388856 |url = https://www.thelancet.com/journals/lancet/article/PIIS0140-6736(16)31679-8/abstract\
      \ |język = en}}{{Cytuj |tytuł = GBD Compare {{!}} IHME Viz Hub |data dostępu\
      \ = 2019-09-27 |opublikowany = vizhub.healthdata.org |url = http://vizhub.healthdata.org/gbd-compare}}.\
      \ Ryzyko zgonu i niepełnosprawności może zostać w istotnym stopniu ograniczone\
      \ poprzez kompleksowe zmiany codziennych zachowań. Skuteczne wprowadzenie takich\
      \ zmian wymaga jednak odpowiedniej wiedzy i kompetencji, które może zaoferować\
      \ medycyna stylu życia.\nPojęcie medycyna stylu życia (ang. ''lifestyle medicine'')\
      \ w kontekście medycyny zostało po raz pierwszy użyte w tytule sympozjum, które\
      \ odbyło się w 1989. W tytule artykułu naukowego termin medycyna stylu życia\
      \ po raz pierwszy został użyty w 1990{{Cytuj |autor = Byung-Il Yeh, In Deok\
      \ Kong |tytuł = The Advent of Lifestyle Medicine |czasopismo = Journal of Lifestyle\
      \ Medicine |data = 2013-3 |data dostępu = 2019-09-25 |issn = 2234-8549 |wolumin\
      \ = 3 |numer = 1 |s = 1–8 |pmid = 26064831 |pmc = 4390753}}. Pierwszy podręcznik\
      \ medycyny stylu życia został wydany w 1999{{Cytuj |autor = James M. Rippe |tytuł\
      \ = Lifestyle medicine |data = 1999 |isbn = 1439845425 |wydanie = 1 |wydawca\
      \ = Blackwell Science}}. W kolejnych latach na całym świecie zaczęły powstawać\
      \ towarzystwa naukowe zajmujące się medycyną stylu życia, w tym m.in. American\
      \ College of Lifestyle Medicine (ACLM){{Cytuj |tytuł = Home |data dostępu =\
      \ 2019-09-25 |opublikowany = www.lifestylemedicine.org |url = https://www.lifestylemedicine.org/\
      \ |archiwum = https://web.archive.org/web/20190827110122/https://www.lifestylemedicine.org/\
      \ |zarchiwizowano = 2019-08-27 }} oraz The European Lifestyle Medicine Organization\
      \ (ELMO){{Cytuj |tytuł = The European Lifestyle Medicine Organization |data\
      \ dostępu = 2019-09-25 |opublikowany = eulm.org |url = https://eulm.org/ |język\
      \ = el}}. Organizacje krajowe aktywnie ze sobą współpracują m.in. w ramach Lifestyle\
      \ Medicine Global Alliance{{Cytuj |tytuł = Lifestyle Medicine Global Alliance\
