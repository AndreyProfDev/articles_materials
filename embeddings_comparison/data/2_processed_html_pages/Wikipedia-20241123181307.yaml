      \ Global Compact Network Poland) kampanię społeczną „Kochaj siebie. Dla zdrowia”,\
      \ w której zachęca Polaków do zdrowych nawyków{{Cytuj | url=https://www.medonet.pl/zdrowie/zdrowie-dla-kazdego,co-ma-wspolnego-milosc-wlasna-z-twoim-zdrowiem--dolacz-do--kochasiebie,artykul,40293815.html\
