      inne niż [[choroby przewlekłe|przewlekłe]] przewidziane w procesie autoryzacji
      rynkowejHyman WA. [http://journals.lww.com/jcejournal/Citation/2000/25050/Off_Label_Use.10.aspx
      Off-Label Use]. Journal of Clinical Engineering 25, 5, ss. 277-279 (2000). Sytuacja
      dotyczy często leków stosowanych w [[Psychiatria|psychiatrii]], [[Onkologia|onkologii]]
      i [[Pediatria|pediatrii]][http://www.termedia.pl/magazine.php?magazine_id=3&article_id=4116&magazine_subpage=ABSTRACT
      Pozarejestracyjne stosowanie leków w onkologii i hematologii w różnych grupach
      wiekowych]. Współ Onkol (2005) vol. 9; 9 (404-407). Przykładem zastosowania
      tej praktyki jest m.in. zapisywanie leków z grupy [[Selektywne inhibitory zwrotnego
      wychwytu serotoniny|SSRI]] (stosowanych głównie w leczeniu [[Zaburzenia depresyjne|zaburzeń
      depresyjnych]]) w celu leczenia [[Wytrysk przedwczesny|przedwczesnego wytrysku]]{{Cytuj
      stronę | tytuł = Premature Ejaculation: Treatment & Medication – eMedicine Urology
      | url = http://emedicine.medscape.com/article/435884-treatment | opublikowany
      = emedicine.medscape.com | data dostępu = 2010-04-20}}. Pozarejestracyjne stosowanie
      leków ma istotne implikacje ekonomiczne, etyczne i prawne{{Cytuj|autor=A. Tolle,
      W. Meyer-Sabellek|tytuł=Off-Label-Use. Möglichkeiten und Grenzen aus der Sicht
      der pharmazeutischen Entwicklung|czasopismo=Bundesgesundheitsblatt – Gesundheitsforschung
      – Gesundheitsschutz|data=2003-06-01|issn=1436-9990|wolumin=46|numer=6|s=504–507|doi=10.1007/s00103-003-0616-3|język=de}}.

      W [[prawo w Polsce|prawie polskim]] nie ma zapisanego obowiązku ordynowania
      leków wyłącznie zgodnie ze wskazaniami i charakterystyką produktu leczniczego{{Cytuj|autor=Oskar
      Luty|tytuł=Zaniechanie zlecenia produktu leczniczego poza zarejestrowanymi wskazaniami
      a odpowiedzialność cywilnoprawna lekarza. Cz. II. Obowiązek zlecenia leku off
      label i konsekwencje jego niewykonania.|czasopismo=Prawo i Medycyna|data=2014|wolumin=2|s=132-150}}.
      Zagadnienia dotyczące pozarejestracyjnego stosowania leków regulowane są przez
      trzy ustawy (o zawodach lekarza i [[dentysta|lekarza dentysty]]Ustawa z dnia
      5 grudnia 1996 r. o zawodach lekarza i lekarza dentysty, [[Prawo farmaceutyczne]]Ustawa
      z dnia 6 września 2001 r. Prawo farmaceutyczne i o refundacji leków, środków
      spożywczych specjalnego przeznaczenia żywieniowego oraz wyrobów medycznychUstawa
      z dnia 12 maja 2011 roku o refundacji leków, środków spożywczych specjalnego
      przeznaczenia żywieniowego oraz wyrobów medycznych).

      Zgodnie z art. 4. Ustawy o zawodzie lekarza ma on obowiązek praktykować zgodnie
      z najnowszą wiedzą medyczną, przy użyciu dostępnych mu metod i środków zapobiegania,
      rozpoznawania i [[leczenie|leczenia]] chorób, zgodnie z zasadami [[Etyka zawodowa|etyki
      zawodowej]] oraz z [[Należyta staranność|należytą starannością]]. Dlatego stawia
      się tezę, że lekarz może zaordynować pacjentowi lek poza wskazaniami, jeśli
      jest to zgodne z aktualną wiedzą medyczną. Stanowisko to potwierdził [[Sąd Najwyższy
      (Polska)|Sąd Najwyższy]] w wyroku z dnia 10 lutego 2010 r. Artykuł 6 [[Kodeks
      Etyki Lekarskiej|Kodeksu Etyki Lekarskiej]] stanowi, że [[lekarz]] ma swobodę
      wyboru w zakresie metod postępowania, które uzna za najskuteczniejsze. Warunkiem
      jest to, aby czynności medyczne ograniczone zostały wyłącznie do rzeczywiście
      niezbędnych. Oznacza to, że ordynowanie leków [[chory|choremu]] w trybie pozarejestracyjnym
      musi być poprzedzone udzieleniem pacjentowi lub jego przedstawicielowi przystępnej
      informacji o stanie [[zdrowie|zdrowia]] i szansach leczenia oraz uzyskaniem
      świadomej zgody.

