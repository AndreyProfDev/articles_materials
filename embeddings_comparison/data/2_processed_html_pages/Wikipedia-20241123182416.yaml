- sections:
  - content: "{{Książka infobox\n |tytuł = John Barleycorn, czyli wspomnienia alkoholika\n\
      \ |tytuł oryginalny = John Barleycorn\n |grafika = \n |opis grafiki = \n |alt\
      \ grafiki = \n |autor = Jack London\n |tematyka = alkoholizm\n |typ utworu =\
      \ autobiografia\n |data powstania = 1913\n |miejsce wydania = Stany Zjednoczone\n\
      \ |język = angielski\n |data wydania = \n |wydawca = \n |poprzednia = \n |następna\
      \ = \n |commons = \n |wikiźródła = \n |wikicytaty = \n}}\n'''John Barleycorn,\
      \ czyli wspomnienia alkoholika''' (ang. ''John Barleycorn'') – autobiograficzna\
      \ powieść [[Jack London|Jacka Londona]], w której opisano zarówno przyjemności,\
      \ jak i dramatyczne zmagania autora z [[Alkoholizm|alkoholizmem]]. Opublikowana\
      \ w 1913 roku, tytuł nawiązuje do [[Wielka Brytania|brytyjskiej]] piosenki ludowej\
      \ ''[[John Barleycorn]]'', będącej personifikacją alkoholu.\n== Tematyka ==\n\
      Powieść porusza tematy męskości i męskiej przyjaźni, ukazując alkohol jako element\
      \ scalający społeczne relacje i rytuały, ale także jako niebezpieczne uzależnienie.\
      \ London wspomina o różnych etapach życia, w których alkohol odgrywał istotną\
      \ rolę: od młodości, gdy pracował jako marynarz, po lata dojrzałości, kiedy\
      \ stał się bogatym, uznanym pisarzem. Autor ukazuje, jak alkohol wpływał na\
      \ niego na różne sposoby – od dodawania odwagi i poczucia przynależności do\
      \ grupy po stwarzanie zagrożenia i komplikacji zdrowotnych.\n== Rola alkoholu\
      \ ==\nAlkohol stanowi tutaj nie tylko część codziennego życia, ale też czynnik,\
      \ który pozwala Londowi badać granice swojej osobowości i zdolności twórcze.\
      \ Autor opisuje, jak alkohol pomagał mu zyskać pewność siebie, ale również jak\
      \ jego uzależniająca natura ograniczała go i odbierała mu zdrowie. Powieść ukazuje\
      \ ambiwalencję: London opisuje alkohol jako inspirację dla swojej twórczości,\
      \ lecz także jako niebezpieczny element życia. ''John Barleycorn'' jest więc\
      \ zarówno refleksją nad czasami i kulturą Londona, jak i przestrogą przed zgubnym\
      \ wpływem alkoholu.\n== Biała Logika ==\nW książce pojawia się motyw „Białej\
      \ Logiki” – mrocznej, nihilistycznej wizji świata, którą London utożsamia z\
      \ oślepiającą jasnością alkoholu{{Cytuj |tytuł = Jack London, John Barleycorn,\
      \ czyli wspomnienia alkoholika – CM Klasyka |data = 2019-11-14 |data dostępu\
      \ = 2024-11-14 |url = https://www.cmklasyka.pl/jack-london-john-barleycorn-czyli-wspomnienia-alkoholika/\
      \ |język = pl}}. Autor sugeruje, że pod wpływem alkoholu pojawia się „białe\
      \ światło”, które odsłania przed nim prawdę o życiu i jego ulotności. Dopiero\
      \ w ostatnich rozdziałach powieści London konfrontuje tę „większą prawdę” z\
      \ „mniejszą prawdą” codziennego życia, dzięki której możliwe jest przetrwanie.\n\
      == Widzenie „różowych słoni” ==\nPowieść ''John Barleycorn, czyli wspomnienia\
      \ alkoholika'' jest też jednym z pierwszych tekstów, w którym pojawia się opis\
      \ różowych słoni jako stereotypowych halucynacji alkoholowych{{Cytuj |autor\
      \ = Jack London |tytuł = John Barleycorn, czyli wspomnienia alkoholika |data\
      \ = 2019 |isbn = 9788366022775 |miejsce = Warszawa |wydawca = Wydawnictwo CM}}.\
      \ London opisuje typ pijanego człowieka, który zatacza się niepewnie i widzi\
      \ różowe słonie czy niebieskie myszy – karykaturę skrajnego upojenia alkoholowego.\
      \ Kontrastuje to z bardziej introspektywnym rodzajem „upicia”, który cechuje\
      \ narratora – tutaj alkohol staje się nie tyle fizycznym, co mentalnym doświadczeniem,\
      \ odsłaniającym przed nim wizje życia pozbawionego sensu i celu.\n== Tłumaczenia\
      \ na język polski i wydania ==\nKsiążkę na język polski przełożyła [[Antonina\
