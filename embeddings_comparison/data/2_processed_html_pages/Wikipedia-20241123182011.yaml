  title: Victor Manuel Contreras
- sections:
  - content: "[[Plik:2018 Bonnefantenmuseum, SRAL restauratie corpus Jan v Steffeswert\
      \ 3.jpg|mały|Konserwator-restaurator [[Stichting Restauratie Atelier Limburg]]\
      \ pracujący przy późnogotyckiej rzeźbie [[Jan van Steffeswert|Jana van Steffeswert]]\
      \ w [[Bonnefantenmuseum]] w [[Maastricht]], 2018]]\n'''Konserwacja i restauracja\
      \ dzieł sztuki''' ([[Łacina|łac.]] ''conservatio'' – zachowywanie, utrzymywanie,\
      \ ochrona{{Cytuj |autor = |tytuł = konserwacja |data dostępu = 2024-08-23 |opublikowany\
      \ = Wielki słownik języka polskiego PAN |url = https://wsjp.pl/haslo/podglad/36113/konserwacja\
      \ |język = pl}}; ''restauratio'' – odnowienie{{Cytuj |autor = |tytuł = restauracja\
      \ |data dostępu = 2024-08-23 |opublikowany = Wielki słownik języka polskiego\
      \ PAN |url = https://wsjp.pl/haslo/podglad/7940/restauracja/1805529/renowacja\
      \ |język = pl}}) – [[dyscyplina naukowa]], której celem jest zrozumienie [[Dzieło\
      \ sztuki|dzieła sztuki]], poznanie jego historii i znaczenia oraz zapewnienie\
      \ mu ochrony, rozumianej przede wszystkim jako utrzymanie autentyzmu wszystkich\
      \ budujących je wartości, a także ewentualnie jego restauracja i rewaloryzacja.\n\
      Jej przedmiotem są dawne i współczesne dobra kultury będące dziełami [[Sztuki\
      \ wizualne|sztuk wizualnych]], składające się ze sfery materialnej i/lub niematerialnej,\
      \ wliczając w to dzieła sztuki oddziałujące pozawzrokowo. Ich istotnym wyróżnikiem\
      \ jest obecność wartości artystycznych. Poddawane konserwacji dzieła sztuki\
      \ najczęściej są również [[Zabytek|zabytkami]], jednak nie zawsze nimi muszą\
      \ być, jak ma to miejsce w przypadku konserwacji sztuki współczesnej. Zgodnie\
      \ z ustawą o ochronie zabytków, dyplomowani konserwatorzy-restauratorzy dzieł\
      \ sztuki kierują pracami konserwatorskimi, restauratorskimi i badaniami konserwatorskimi\
      \ przy zabytkach wpisanych do [[Rejestr zabytków (Polska)|rejestru zabytków]].\
      \ W praktyce, konserwatorzy-restauratorzy dzieł sztuki zajmują się również zabytkami\
      \ pozbawionymi wartości artystycznych.\nKonserwacja i restauracja dzieł sztuki\
      \ jest interdyscyplinarnym działem nauki, włączając w swój warsztat badawczy\
      \ metody nauk humanistycznych, przyrodniczych i technicznych, a także rozbudowaną\
      \ [[Deontologia|deontologię]] i [[Etyka zawodowa|etykę zawodową]].\nPo ograniczeniu\
      \ liczby dyscyplin naukowych w 2018 r., razem ze [[Sztuki plastyczne|sztukami\
      \ plastycznymi]] tworzy dyscyplinę „sztuki plastyczne i konserwacja dzieł sztuki”,\
      \ należącą do dziedziny sztuki. Powiązana jest z dyscypliną „[[Konserwacja i\
      \ restauracja zabytków|ochrona dziedzictwa i konserwacja zabytków]]”, należącą\
      \ do dziedziny nauk inżynieryjno-technicznych, a także ochroną dóbr kultury,\
      \ wliczaną do nauk o sztuce, dzieląc z nimi dużą część założeń teoretycznych\
      \ i etycznych, w tym wiele dokumentów doktrynalnych.\nW Polsce studia w zakresie\
      \ konserwacji i restauracji dzieł sztuki prowadzone są na [[Wydział Konserwacji\
      \ i Restauracji Dzieł Sztuki Akademii Sztuk Pięknych im. Jana Matejki w Krakowie|Wydziale\
      \ Konserwacji i Restauracji Dzieł Sztuki Akademii Sztuk Pięknych im. Jana Matejki\
      \ w Krakowie]], [[Wydział Konserwacji i Restauracji Dzieł Sztuki Akademii Sztuk\
      \ Pięknych w Warszawie|Wydziale Konserwacji i Restauracji Dzieł Sztuki Akademii\
      \ Sztuk Pięknych w Warszawie]], [[Wydział Sztuk Pięknych Uniwersytetu Mikołaja\
      \ Kopernika w Toruniu|Wydziale Sztuk Pięknych Uniwersytetu Mikołaja Kopernika\
      \ w Toruniu]] oraz [[Wydział Ceramiki i Szkła Akademii Sztuk Pięknych im. Eugeniusza\
      \ Gepperta we Wrocławiu|Wydziale Ceramiki i Szkła Akademii Sztuk Pięknych im.\
      \ Eugeniusza Gepperta we Wrocławiu]].\nTerminem tym określa się również zespół\
      \ czynności prowadzących do ochrony dzieła sztuki.\n== Terminologia ==\nZbiorczy\
      \ termin „konserwacja i restauracja dzieł sztuki” powstał z konieczności określenia\
      \ zespołu zróżnicowanych praktyk o różnych celach, w sytuacji funkcjonowania\
      \ odmiennych definicji w poszczególnych środowiskach badawczych oraz różnic\
      \ językowych. W językach łacińskich, ogół działań konserwatorsko-restauratorskich\
      \ określany jest terminami ''restauro'' (włoski), ''restauration'' (francuski),\
      \ ''restauración'' (hiszpański), podczas gdy w języku angielskim stosowany jest\
      \ ogólny termin ''conservation'', łączący konserwację (ang. ''preservation'')\
      \ i restaurację{{Cytuj |autor = Salvador Muñoz Viñas |tytuł = Contemporary theory\
      \ of conservation |data = 2011 |data dostępu = 2024-08-22 |isbn = 978-0-7506-6224-6\
      \ |miejsce = New York |wydawca = Routledge |s = 1–28 |język = en}}.\n=== Różnice\
      \ między konserwacją a restauracją dzieł sztuki ===\n[[Plik:IMG 6171 - MI -\
      \ Sant'Eustorgio - Sottocoro - Restauratrice - Foto Giovanni Dall'Orto - 1-Mar-2007.jpg|mały|Uzupełnianie\
      \ ubytków warstwy malarskiej malowidła ściennego w krypcie [[Bazylika św. Eustorgiusza\
      \ w Mediolanie|bazyliki św. Eustorgiusza w Mediolanie]]]]\nW ujęciu teoretycznym\
      \ różnice między konserwacją i restauracją najczęściej definiuje się na podstawie\
      \ celu, jaki mają spełniać. W rzeczywistości jednak kryterium celu często nie\
      \ umożliwia precyzyjnego określenia, czy dana czynność jest konserwacją, czy\
      \ restauracją. Przyczynia się do tego złożoność zabiegów konserwatorskich oraz\
      \ długofalowość i wieloaspektowość ich skutków. Praktycznym kryterium ułatwiającym\
      \ rozróżnienie jest zauważalność efektów danego działania w postaci zmian zachodzących\
      \ w obiekcie. Z punktu widzenia nieprofesjonalnego obserwatora, obiekty poddane\
      \ konserwacji wyglądają tak jak wyglądały wcześniej, a obiekty poddane restauracji\
      \ – odmiennie.\n==== Konserwacja ====\nW szerokim ujęciu konserwacja, zgodnie\
      \ z definicją zawartą w [[Karta Krakowska 2000|Karcie Krakowskiej 2000]], stanowi\
      \ zespół postaw społeczeństwa, które przyczyniają się do trwałości dziedzictwa{{Cytuj\
      \ |tytuł = Karta Krakowska 2000 |czasopismo = Spotkania z Zabytkami |data =\
      \ 2014 |data dostępu = 2024-08-22 |issn = 0137-222X |wolumin = 2014 |numer =\
      \ 7–8 |wydawca = Fundacja Hereditas, Narodowy Instytut Dziedzictwa |s = 12 |url\
      \ = https://zabytki.online/archiwum_szz/szz20140708.pdf |język = pl}}. W węższym\
      \ ujęciu jest zespołem praktyk mających na celu zachowanie integralności dzieła\
      \ sztuki, utrzymanie jego postrzegalnych cech w stanie obecnym oraz przedłużenie\
      \ jego trwania bez wprowadzania w nie widocznych zmian, przede wszystkim przez\
      \ ustabilizowanie jego stanu i opóźnienie degradacji{{Cytuj |tytuł = E.C.C.O.\
      \ Professional Guidelines (I). The Profession |data = 2002-03-01 |data dostępu\
      \ = 2024-08-22 |opublikowany = European Confederation of Conservator-Restorers‘\
      \ Organisations |url = https://www.ecco-eu.org/wp-content/uploads/2021/03/ECCO_professional_guidelines_I.pdf\
      \ |język = en}}.\nPraktyki te kategoryzowane są ze względu na stopień ich ingerencji\
      \ w materialną strukturę obiektu: od konserwacji zapobiegawczej, prewencyjnej\
      \ (ang. ''preventive preservation'', ''preventive conservation''), zapobiegającej\
      \ powstawaniu zniszczeń przez wyeliminowanie ich przyczyn zewnętrznych, po konserwację\
      \ czynną, aktywną{{Cytuj |autor = Iwona Szmelter |tytuł = Elementy nowej teorii\
      \ konserwacji dziedzictwa sztuki wizualnej. Ratunek dla ochrony dawnej sztuki\
      \ nietypowej i sztuki współczesnej |czasopismo = Sztuka i Dokumentacja |data\
      \ = 2017 |data dostępu = 2024-08-22 |issn = 2080-413X |wolumin = 17 |wydawca\
      \ = Akademia Sztuk Pięknych w Gdańsku |s = 155–180 |url = https://www.journal.doc.art.pl/pdf17/Art_and_Documentation_17_szmelter_elementy.pdf\
      \ |język = pl}} (ang. ''direct preservation'', ''conservation''), modyfikującą\
      \ niepostrzegalne lub mniej postrzegalne cechy dzieła sztuki. Praktyki te określane\
      \ są zbiorczym terminem „konserwacja” (ang. ''preservation''{{Cytuj |tytuł =\
      \ Definition of the profession (1984) |data = 1984 |data dostępu = 2024-08-22\
      \ |opublikowany = ICOM-CC International council of museums – comittee for conservation\
      \ |url = https://www.icom-cc.org/en/definition-of-the-profession-1984 |archiwum\
      \ = https://web.archive.org/web/20240302034647/https://www.icom-cc.org/en/definition-of-the-profession-1984\
      \ |zarchiwizowano = 2024-03-02 |język = en}}).\n==== Restauracja ====\n[[Plik:Fortezza\
      \ lab.jpg|mały|Pracownia konserwatorska [[Opificio delle Pietre Dure]] we [[Florencja|Florencji]]\
      \ w 2006 r., w prawym dolnym rogu widoczny poddawany konserwacji krucyfiks autorstwa\
      \ [[Giotto di Bondone]], pochodzący z [[Kościół Wszystkich Świętych we Florencji|kościoła\
      \ Wszystkich Świętych we Florencji]]]]\nRestauracja dąży do przywrócenia wcześniejszego\
      \ – lepszego i znanego – stanu dzieła sztuki, niekoniecznie „pierwotnego”. Obejmuje\
      \ bezpośrednie działania przeprowadzane na uszkodzonym lub zdegradowanym dziele\
      \ sztuki, zwiększające jego czytelność oraz ułatwiające jego doświadczenie i\
      \ zrozumienie, przy maksymalnym respektowaniu jego właściwości estetycznych,\
      \ historycznych i fizycznych. Wydobywa, przywraca lub odtwarza wartości artystyczne\
      \ i estetyczne{{Cytuj |autor r = Bogumiła J. Rouba |redaktor = Józef Flik |rozdział\
      \ = Proces ochrony dóbr kultury. Pojęcia, terminologia |tytuł = Ars longa –\
      \ vita brevis. Tradycyjne i nowoczesne metody badania dzieł sztuki |data = 2003\
      \ |miejsce = Toruń |wydawca = Wydawnictwo Uniwersytetu Mikołaja Kopernika |s\
      \ = 349–365 |język = pl}} przez modyfikację postrzegalnych cech dzieła sztuki.\n\
      W praktyce, konserwacja i restauracja występują najczęściej równocześnie, jako\
      \ konsekwencje jednej i tej samej technicznej czynności. Wiele zabiegów mających\
      \ przedłużyć istnienie obiektu przyczynia się równocześnie do jego restauracji\
      \ (np. kąpiel papieru mająca na celu wzmocnienie jego struktury i usunięcie\
      \ szkodliwych produktów degradacji często prowadzi do uzyskania jaśniejszej\
      \ powierzchni, bliższej stanowi pierwotnemu). Rozróżnienie konserwacji i restauracji\
      \ jest jednak niezwykle ważne ze względu na występujące między nimi różnice,\
      \ a także uwarunkowania etyczne, będące wynikiem XIX-wiecznych zbyt dalekich\
      \ ingerencji w istotę i estetykę dzieła sztuki (czego przykładem może być działalność\
      \ [[Eugène Viollet-le-Duc]]a).\nW zakres konserwacji i restauracji wliczane\
      \ są także działania dokumentacyjne i badawcze, mające na celu wytworzenie informacji\
      \ i zapisów, które następnie mogą umożliwiać odbiorcy doświadczanie dzieła niebezpośrednio\
      \ lub wirtualnie, także w przypadku unicestwienia samego dzieła sztuki – m.in.\
      \ [[Digitalizacja|cyfryzacja]], konserwacja przez dokumentację, wykonywanie\
      \ replik i reprodukcji. Salvador Muñoz Viñas określa te działania mianem konserwacji\
      \ informacyjnej (ang. ''informational preservation'').\n=== Różnice między zabytkiem,\
      \ dobrem kultury i dziedzictwem a dziełem sztuki ===\n[[Plik:Holy Trinity Column\
      \ 2006 conservation 3.jpg|mały|Konserwacja [[Kolumna Trójcy Świętej w Ołomuńcu|Kolumny\
      \ Trójcy Świętej w Ołomuńcu]], 2006]]\nJednoznaczne rozgraniczenie działów nauki\
      \ poświęconych ochronie materialnego i niematerialnego dorobku kultury, m.in.:\
      \ konserwacji i restauracji dzieł sztuki, [[Konserwacja i restauracja zabytków|ochrony\
      \ i konserwacji zabytków]], ochrony dóbr kultury (wliczanej do nauk o sztuce{{Cytuj\
      \ |tytuł = Ochrona dóbr kultury – Oferta dydaktyczna UJ |data dostępu = 2024-08-25\
      \ |opublikowany = Uniwersytet Jagielloński |url = https://studia.uj.edu.pl/kierunki/whist/ochron.dobr.kult\
      \ |język = pl}}), a także instytucji, organów administracji państwowej i innych\
      \ przejawów działalności człowieka, jest utrudnione przez różne, choć częściowo\
      \ pokrywające się zakresy znaczeniowe pojęć: [[dzieło sztuki]], [[zabytek]],\
      \ [[Dziedzictwo kulturowe|dziedzictwo kultury]] i [[Dobra kultury|dobro kultury]].\
      \ Fakt ten pociąga za sobą liczne podobieństwa i wspólnych obszary (np. w postaci\
      \ wielu dokumentów doktrynalnych), a także ich mylenie w języku potocznym. Różnice\
      \ między nimi mają jednak istotne znaczenie dla teorii i praktyki.\n==== Zabytek\
      \ ====\nZabytek definiowany jest najczęściej jako powstały w przeszłości materialny\
      \ wytwór człowieka, chroniony ze względu na zawarte w nim wartości.\n[[Alois\
      \ Riegl]] zabytek definiował jako dzieło ludzkich rąk, które zostało wytworzone\
      \ w celu zachowania czynów ludzkich lub wydarzeń w świadomości przyszłych pokoleń{{Cytuj\
      \ |autor = Bogusław Krasnowolski |tytuł = Ochrona zabytków: historia, doktryny,\
      \ systemy prawne |data = 2023 |data dostępu = 2024-08-23 |isbn = 978-83-66564-75-6\
      \ |miejsce = Kraków |wydawca = Wydawnictwo Akademii Sztuk Pięknych im. Jana\
      \ Matejki w Krakowie |s = 12–21 |język = pl}}. Wyróżnił trzy wartości zabytkowe\
      \ (niem. ''Denkmalswert''): historyczną, artystyczną i dawności{{Cytuj |autor\
      \ = Bogusław Krasnowolski |tytuł = Ochrona zabytków: historia, doktryny, systemy\
      \ prawne |data = 2023 |data dostępu = 2024-08-23 |isbn = 978-83-66564-75-6 |miejsce\
      \ = Kraków |wydawca = Wydawnictwo Akademii Sztuk Pięknych im. Jana Matejki w\
      \ Krakowie |s = 132–144 |język = pl}}. [[Hanna Jędrzejewska]] terminem „zabytek”\
      \ określała każde materialne świadectwo dawnej ludzkiej twórczości, niezależnie\
      \ od jego wieku, rodzaju i znaczenia, będące autentycznym dokumentem przeszłości,\
      \ niosącym informację o kulturze czasów minionych{{Cytuj |autor = Hanna Jędrzejewska\
      \ |tytuł = Zagadnienia metodologiczne w dziedzinie rekonstrukcji zabytków |czasopismo\
      \ = Ochrona Zabytków |data = 1979 |data dostępu = 2024-08-23 |issn = 0029-8247\
      \ |wolumin = 32 |numer = 4 |s = 287–288 |url = https://bazhum.muzhp.pl/media/files/Ochrona_Zabytkow/Ochrona_Zabytkow-r1979-t32-n4_(127)/Ochrona_Zabytkow-r1979-t32-n4_(127)-s287-295/Ochrona_Zabytkow-r1979-t32-n4_(127)-s287-295.pdf\
      \ |język = pl}}. Podobnie pojęcie to definiuje ustawa o ochronie zabytków: „nieruchomość\
      \ lub rzecz ruchoma, ich części lub zespoły, będące dziełem człowieka lub związane\
      \ z jego działalnością i stanowiące świadectwo minionej epoki bądź zdarzenia,\
      \ których zachowanie leży w interesie społecznym ze względu na posiadaną wartość\
      \ historyczną, artystyczną lub naukową”Art. 3. ustawy o ochronie zabytków i\
      \ opiece nad zabytkami ({{Dziennik Ustaw|2003|162|1568}}).. Niektórzy badacze,\
      \ jak np. [[Bogumiła Rouba|Bogumiła J. Rouba]], określają zabytki szerzej, jako\
      \ „dawne materialne i niematerialne dobra kultury”.\nKażdy zabytek jest dokumentem\
      \ historii, ale nie każdy jest dziełem sztuki, więc termin ten nie obejmuje\
      \ wszystkiego, czego ochroną zajmują się konserwatorzy-restauratorzy dzieł sztuki.\n\
      ==== Dobro kultury ====\n[[Plik:Diagram relacja dzieło sztuki zabytek dobro\
      \ kultury.png|alt=Diagram przedstawiający relację terminów: największy okręg\
      \ z napisem „dobro kultury” i zawierające się w nim dwa okręgi – średni z napisem\
      \ „zabytek” oraz najmniejszy z napisem „dzieło sztuki”, mający część wspólną\
      \ ze średnim okręgiem z napisem „zabytek”. |mały|Diagram przedstawiający relację\
      \ terminów „dzieło sztuki”, „zabytek” oraz „dobro kultury”]]\nDobro kultury\
      \ jest pojęciem najszerszym, obejmującym dawne i współczesne, materialne i niematerialne\
      \ wytwory będące dziełem człowieka, a także natury, jeśli posiadają one nadane\
      \ przez człowieka wartości duchowe{{Cytuj |autor = Zbigniew Kobyliński |tytuł\
      \ = Czym jest, komu jest potrzebne i do kogo należy dziedzictwo kulturowe? |czasopismo\
      \ = MAZOWSZE Studia Regionalne |data = 2011 |data dostępu = 2024-08-25 |issn\
      \ = 1689-4774 |wolumin = 7 |wydawca = Mazowieckie Biuro Planowania Regionalnego\
      \ w Warszawie |s = 21–47 |url = https://cejsh.icm.edu.pl/cejsh/element/bwmeta1.element.desklight-64b949dd-bc56-4ca4-ab26-05aef7137dac\
      \ |język = pl}}. Obok dóbr materialnych, w zakres tego pojęcia wchodzą dzieła\
      \ niematerialne, takie jak np. utwory muzyczne czy teatralne, ale także tradycje\
      \ i obrzędy.\n==== Dziedzictwo kultury ====\nDziedzictwo kultury jest terminem\
      \ bliskoznacznym „dobru kultury”, oznaczającym tę część powstałych w przeszłości\
      \ dóbr kultury, które zostały uznane za wartościowe przez następne pokolenia\
      \ i przetrwały do czasów dzisiejszych. Według [[Andrzej Tomaszewski (architekt)|Andrzeja\
      \ Tomaszewskiego]] różnica polega na tym, że „dobro kultury” jest terminem „apolitycznym\
      \ i aideologicznym”, obejmującym cały kulturalny dorobek ludzkości, „dziedzictwo”\
      \ jest natomiast wybraną według pozaestetycznych kryteriów częścią spuścizny\
      \ minionych pokoleń, którą „chcemy przejąć na własność i wziąć za to odpowiedzialność”{{Cytuj\
      \ |autor = Andrzej Tomaszewski |autor r = Andrzej Tomaszewski |rozdział = Tożsamość\
      \ i różnorodność kulturowa jednoczącej się Europy |tytuł = Ku nowej filozofii\
      \ dziedzictwa |data = 2022 |isbn = 9788366419346 |miejsce = Kraków |wydawca\
      \ = Międzynarodowe Centrum Kultury |s = 58–59 |język = pl}}. W związku z tym\
      \ dziedzictwo kultury składa się z wytworów dawnych, jest jednak konstruktem\
      \ współczesnego społeczeństwa, podlegającym nieustannym przemianom i poszerzaniu.\n\
      ==== Dzieło sztuki ====\n[[Plik:2018 Bonnefantenmuseum, SRAL restauratie Stephen\
      \ Balkenhol.jpg|mały|Konserwacja i restauracja współczesnej rzeźby [[Stephen\
      \ Balkenhol|Stephena Balkenhola]] przeprowadzana przez [[Stichting Restauratie\
      \ Atelier Limburg]] w [[Bonnefantenmuseum]] w [[Maastricht]]]]\nDzieło sztuki,\
      \ jak i sama sztuka, jest pojęciem otwartym, niemożliwym do zdefiniowania pomimo\
      \ licznych historycznych prób (def. nominatywna, instytucjonalna, tautologiczna){{Cytuj\
      \ |autor = Grzegorz Dziamski |tytuł = Szkice o nowej sztuce |data = 1984 |data\
      \ dostępu = 2024-08-25 |isbn = 978-83-203-1766-4 |miejsce = Warszawa |wydawca\
      \ = Młodzieżowa Agencja Wydawnicza |s = 27–54 |język = pl}}. Jak pisze [[Jerzy\
      \ Hanusek]], każda prawidłowa definicja – odwołująca się do definiowalnych pojęć\
      \ – będzie jednocześnie zbyt wąska i zbyt szeroka, ponieważ zawsze będą istnieć\
      \ przykłady dzieł sztuki przekraczające daną definicję, a także przedmioty spełniające\
      \ definicję, ale niebędące sztuką{{Cytuj |autor = Jerzy Hanusek |autor r = Jerzy\
      \ Hanusek |rozdział = Pojęcie sztuki – ćwiczenie belferskie |tytuł = Robak w\
      \ sztuce |data = 2001 |data dostępu = 2024-08-25 |isbn = 978-83-911769-7-9 |miejsce\
      \ = Kraków |wydawca = Stowarzyszenie Artystyczne „Otwarta Pracownia” |s = 59–61\
      \ |język = pl}}.\nDzieło sztuki, w kontekście konserwacji i restauracji dzieł\
      \ sztuki, określane jest jako dawny lub współczesny wytwór ludzkiej działalności\
      \ (dobro kultury) posiadający wartości artystyczne, składający się ze sfery\
      \ materialnej i/lub niematerialnej. [[Grażyna Korpal]], powołując się na [[Maria\
      \ Gołaszewska|Marię Gołaszewską]], określa dzieło sztuki jako „zapis poznania,\
      \ przeżycia oraz działania artysty”, podkreślając wagę i konieczność ochrony\
      \ jego aspektów niematerialnych{{Cytuj |autor = Grazyna Korpal |redaktor = Maria\
      \ Ostaszewska |tytuł = Autor – Dzieło sztuki – Konserwator – Odbiorca |data\
      \ = 2004 |data dostępu = 2024-08-23 |isbn = 9788387651787 |miejsce = Kraków\
      \ |wydawca = Akademia Sztuk Pięknych w Krakowie |s = 19–23 |seria = Studia i\
      \ materiały Wydziału Konserwacji Dzieł Sztuki Akademii Sztuk Pie̜knych w Krakowie\
      \ |język = pl}}. [[Iwona Szmelter]] podkreśla, że do elementów budujących dzieło\
      \ sztuki i jego autentyzm, obok wartości materialnych i niematerialnych (idei,\
      \ znaczeń) wprowadzonych przez artystę, należy także kontekst społeczny, kulturalny,\
      \ polityczny.\nRozróżniając dzieło sztuki od zabytku, [[Jan Białostocki]] wskazywał,\
      \ że dla dzieła sztuki najważniejsze są wartości artystyczne i estetyczne, a\
      \ wartość dawności stoi na dalszym planie, podczas gdy dla zabytku, będącego\
      \ reliktem przeszłości i przekazem epoki już zamkniętej, wartości artystyczne\
      \ i estetyczne nie są pierwszorzędne. Kolejno, zabytek może być wytworem anonimowym,\
      \ nie ujawniającym osobowości twórcy, podczas gdy dzieło sztuki nosi znamię\
      \ artysty. Białostocki wskazywał również, że zabytek jest reliktem przede wszystkim\
      \ materialnym, podczas gdy sfera materialna dzieła sztuki pośredniczy w doznawaniu\
      \ „«wartości wyższego rzędu», uważanych za przynależne do kultury duchowej”{{Cytuj\
      \ |autor = Jan Białostocki |redaktor = Krzysztof Nowiński |rozdział = Dzieło\
      \ sztuki i zabytek |tytuł = Dzieło sztuki i zabytek: materiały z XXV sesji Stowarzyszenia\
      \ Historyków Sztuki |data = 1976 |wolumin = 43 |miejsce = Warszawa |wydawca\
      \ = Ministerstwo Kultury i Sztuki, Generalny Konserwator Zabytków |s = 8–12\
      \ |seria = Biblioteka Muzealnictwa i Ochrony Zabytków. Seria B |język = pl}}.\n\
      ==== Obiekt ====\nNa skutek trudności definicyjnych i potrzeb praktycznych,\
      \ w terminologii konserwatorskiej powstało również pojęcie „obiektu”. Posiada\
      \ ono szerszy zakres znaczeniowy niż „dzieło sztuki” i nie odnosi się wyłącznie\
      \ do sztuki. Obejmuje materialną strukturę jednego dzieła lub zabytku, jego\
      \ wydzielonej części lub zespołu dzieł powiązanych ze sobą{{Cytuj |autor = Roman\
      \ Jacek Kieferling |redaktor = Maria Ostaszewska |tytuł = Konserwacja dzieł\
      \ niezachowanych |data = 2012 |data dostępu = 2024-08-23 |isbn = 978-83-62321-97-1\
      \ |wolumin = 22 |miejsce = Kraków |wydawca = Wydawnictwo Akademii Sztuk Pięknych\
      \ im. Jana Matejki |s = 30–39 |seria = Studia i Materiały Wydziału Konserwacji\
      \ i Restauracji Dzieł Sztuki Akademii Sztuk Pięknych w Krakowie |język = pl}}.\n\
      == Konserwacja i restauracja dzieł sztuki jako dyscyplina naukowa ==\n[[Plik:Restauration\
      \ en cours.jpg|mały|Zabiegi konserwatorskie przeprowadzane przy pomocy [[Przyżeganie\
      \ (medycyna)|kautera]] na licu obrazu [[Isaac van Ostade|Isaaca van Ostade]]\
      \ „Łyżwiarze” z 1641]]\n=== Konserwacja i restauracja dzieł sztuki w klasyfikacji\
      \ dziedzin i dyscyplin naukowych ===\nKonserwacja i restauracja dzieł sztuki\
      \ jest [[Dyscyplina naukowa|dyscypliną naukową]] o określonym celu i przedmiocie\
      \ procesu poznania, funkcjonującą w [[klasyfikacja dziedzin i dyscyplin naukowych\
      \ w Polsce|klasyfikacji dziedzin i dyscyplin naukowych w Polsce]].\nW latach\
      \ 2009–2011 „konserwacja i restauracja dzieł sztuki” stanowiła odrębną dyscyplinę\
      \ w dziedzinie „sztuki plastyczne”Uchwała Centralnej Komisji do Spraw Stopni\
      \ i Tytułów z dnia 10 grudnia 2008 r. zmieniająca uchwałę w sprawie określenia\
      \ dziedzin nauki i dziedzin sztuki oraz dyscyplin naukowych i artystycznych\
      \ ({{Monitor Polski|rok=2008|pozycja=843}})., w latach 2011–2018 odrębną dyscyplinę\
      \ w dziedzinie sztuk plastycznych, w obszarze sztukiRozporządzenie Ministra\
      \ Nauki i Szkolnictwa Wyższego z dnia 8 sierpnia 2011 r. w sprawie obszarów\
      \ wiedzy, dziedzin nauki i sztuki oraz dyscyplin naukowych i artystycznych ({{Dziennik\
      \ Ustaw|2011|179|1065}}).. Od 2018 r., na mocy Rozporządzenia Ministra Edukacji\
      \ i Nauki, razem ze [[Sztuki plastyczne|sztukami plastycznymi]] tworzy dyscyplinę\
      \ „sztuki plastyczne i konserwacja dzieł sztuki”, należącą do dziedziny sztukiRozporządzenie\
      \ Ministra Nauki i Szkolnictwa Wyższego z dnia 20 września 2018 r. w sprawie\
      \ dziedzin nauki i dyscyplin naukowych oraz dyscyplin artystycznych ({{Dziennik\
      \ Ustaw|rok=2018|pozycja=1818}})..\nTa klasyfikacja została utrzymana w Rozporządzeniu\
      \ Ministra Edukacji i Nauki z dnia 11 października 2022 r., które wprowadziło\
      \ dodatkowo odrębną dyscyplinę „ochrona dziedzictwa i [[Konserwacja i restauracja\
      \ zabytków|konserwacja zabytków]]”, należącą do dziedziny nauk inżynieryjno-technicznychRozporządzenie\
      \ Ministra Edukacji i Nauki z dnia 11 października 2022 r. w sprawie dziedzin\
      \ nauki i dyscyplin naukowych oraz dyscyplin artystycznych ({{Dziennik Ustaw|rok=2022|pozycja=2202}})..\n\
      === Cel konserwacji i restauracji dzieł sztuki ===\n[[Plik:2023 Maastricht,\
      \ Bonnefantenmuseum, SRAL atelier (4).jpg|mały|Konserwacja i restauracja gipsowego\
      \ odlewu XII-wiecznego [[kapitel]]a z [[Bazylika Najświętszej Marii Panny Gwiazdy\
      \ Morza w Maastricht|Bazyliko Najświętszej Marii Panny Gwiazdy Morza w Maastricht]],\
      \ przeprowadzana przez [[Stichting Restauratie Atelier Limburg]]]]\nZgodnie\
      \ z [[Karta Wenecka|Kartą Wenecką]], celem konserwacji i restauracji jest zachowanie\
      \ każdego dzieła sztuki, jak też świadectwa historii{{Cytuj |tytuł = Międzynarodowa\
      \ karta konserwacji i restauracji zabytków i miejsc zabytkowych (Karta Wenecka\
      \ 1964) |data = 1964 |data dostępu = 2024-08-22 |opublikowany = ICOMOS Open\
      \ Archive |url = https://openarchive.icomos.org/id/eprint/3284/ |język = pl}}.\
      \ W obecnym rozwinięciu idei zawartych w Karcie Weneckiej, zgodnie z [[Dokument\
      \ z Nara o autentyzmie|Dokumentem z Nara o autentyzmie]], celem konserwacji\
      \ i restauracji jest „zrozumienie dzieła, poznanie jego historii i znaczenia,\
      \ zapewnienie jego materialnej ochrony i ewentualnie jego restauracji i rewaloryzacji”{{Cytuj\
      \ |autor = Bogusław Szmygin (oprac.) |rozdział = Dokument z Nara o Autentyzmie.\
      \ Konferencja na temat autentyzmu, Nara 1994 |tytuł = Vademecum Konserwatora\
      \ Zabytków. Międzynarodowe Normy Ochrony Dziedzictwa Kultury |data = 2015 |data\
      \ dostępu = 2024-08-22 |wydawca = Polski Komitet Narodowy ICOMOS |s = 111–113\
      \ |url = https://bc.pollub.pl/dlibra/publication/13044/edition/12727?language=pl\
      \ |język = pl}}. Konserwacja i restauracja dąży do zachowania dzieła sztuki\
      \ wraz z jego kontekstem i znaczeniem w takim sposób, by nie stało się ono nieczytelne\
      \ lub niezrozumiałe dla kolejnych pokoleń, kładąc szczególny nacisk na autentyzm\
      \ zarówno jego sfery materialnej, jak i niematerialnej.\n=== Przedmiot konserwacji\
      \ i restauracji dzieł sztuki ===\nZgodnie z nazwą główny obszar zainteresowania\
      \ konserwacji i restauracji stanowią [[Dzieło sztuki|dzieła sztuki]].\nPoczątkowo\
      \ przedmiotem konserwacji były historyczne dzieła należące do tradycyjnych dziedzin\
      \ [[Sztuki plastyczne|sztuk plastycznych]], takie jak [[malarstwo]], [[Rzeźbiarstwo|rzeźba]],\
      \ [[architektura]] czy [[grafika]]. Dzieła te najczęściej były również zabytkami,\
      \ przez co w mowie potocznej występuje wymienne stosowanie obu pojęć. Z czasem\
      \ zakres przedmiotu konserwacji i restauracji dzieł sztuki coraz bardziej rozszerzał\
      \ się także na obiekty nie będące zabytkami. Proces ten postępował wraz z uznawaniem\
      \ za sztukę istniejących dziedzin twórczości (jak miało to miejsce w przypadku\
      \ [[Fotografika|fotografiki]]), powstawaniem nowych dziedzin twórczości artystycznej\
      \ ([[Instalacja (sztuka)|instalacja]], [[sztuka wideo]]), a także włączaniem\
      \ ich wytworów do kolekcji muzealnych i powstawaniem potrzeby ich ochrony. Obecnie\
      \ obserwuje się dynamiczny rozwój konserwacji i restauracji dzieł sztuki efemerycznej\
      \ i cyfrowej, m.in. [[Performance|performansu]]{{Cytuj |autor = Elżbieta Wysocka\
      \ |tytuł = Re-enactment, czyli niekonserwatywna konserwacja sztuki performance\
      \ |czasopismo = Sztuka i Dokumentacja |data = 2010 |data dostępu = 2024-08-22\
      \ |issn = 2080-413X |wolumin = 3 |s = 17–25 |opublikowany = Stowarzyszenie Sztuka\
      \ i Dokumentacja (SiD) |url = https://www.journal.doc.art.pl/pdf3/sid3.pdf |język\
      \ = pl}}, [[Sztuka Internetu|sztuki internetu]]{{Cytuj |autor = Elżbieta Wysocka\
      \ |tytuł = Wirtualne ciało sztuki: ochrona i udostępnianie dzieł audiowizualnych\
      \ |data = 2013 |data dostępu = 2024-08-23 |isbn = 978-83-63631-51-2 |miejsce\
      \ = Warszawa |wydawca = Narodowe Centrum Kultury |s = 333–364 |język = pl}}\
      \ czy [[Gra komputerowa|gier wideo]]{{Cytuj |autor = Alexander Habgood |tytuł\
      \ = Click to Respawn? Accepting video games as cultural heritage |czasopismo\
      \ = Icar: international journal of young conservators and restorers of works\
      \ of art |data = 2017 |data dostępu = 2024-08-22 |issn = 2544-0357 |wolumin\
      \ = 1 |wydawca = Akademia Sztuk Pięknych w Warszawie |s = 123–129 |język = en}}.\
      \ [[Plik:Nitrate film restoration (18000576702).jpg|mały|Konserwacja i restauracja\
      \ błon filmowych z [[Nitroceluloza|azotanu celulozy]].]]\nW obecnym rozumieniu\
      \ przedmiotem konserwacji i restauracji są dobra kultury będące dziełami [[Sztuki\
      \ wizualne|sztuk wizualnych]]{{Cytuj |autor = Iwona Szmelter |tytuł = O fenomenie\
      \ sztuk wizualnych i meandrach ich ochrony: filozofia i elementy nowej teorii\
      \ i praktyki konserwacji |data = 2020 |data dostępu = 2024-08-22 |isbn = 978-83-01-21526-2\
      \ |wydanie = Wydanie I |miejsce = Warszawa |wydawca = Wydawnictwo Naukowe PWN\
      \ SA |s = 14–17 |oclc = 1236064614 |język = pl}}, do których wlicza się również\
      \ dzieła sztuki oddziałujące pozawzrokowo, np. haptycznie, akustycznie czy olfaktorycznie{{Cytuj\
      \ |autor = Iwona Szmelter |tytuł = Sztuka totalna czy dychotomia? Klasyczna\
      \ i nowoczesna sztuka w dokumentacji i opiece |czasopismo = Sztuka i Dokumentacja\
      \ |data = 2011 |data dostępu = 2024-08-22 |issn = 2080-413X |wolumin = 5 |wydawca\
      \ = Stowarzyszenie Sztuka i Dokumentacja (SiD) |s = 16–20 |url = https://www.doc.art.pl/pdf_archive/sid_vol_05_szmelter.pdf\
      \ |język = pl}}, składające się ze sfery materialnej (ang. ''tangible'') i/lub\
      \ niematerialnej (ang. ''intangible)''. Przedmiot konserwacji i restauracji\
      \ obejmuje zarówno dzieła autograficzne (w których materiał i forma realizacji\
      \ są tożsame, np. malarstwo czy rzeźba) oraz dzieła zmienne i allograficzne{{Cytuj\
      \ |autor = Pip Laurenson |tytuł = Authenticity, Change and Loss in the Conservation\
      \ of Time-Based Media Installations |czasopismo = Tate Papers |data = 2006 |data\
      \ dostępu = 2024-08-23 |issn = 1753-9854 |wolumin = 6 |opublikowany = Tate |url\
      \ = https://www.tate.org.uk/research/tate-papers/06/authenticity-change-and-loss-conservation-of-time-based-media-installations\
      \ |język = en}} (odtwarzane każdym razem na nowo według instrukcji, zawierające\
      \ element improwizacji itd., np. sztuka ''time-based media'', niektóre instalacje,\
      \ performans).\nDyplomowani konserwatorzy-restauratorzy pracują również z obiektami\
      \ nie będącymi dziełami sztuki, np. należącymi do dziedzictwa historycznego\
      \ i martyrologicznego{{Cytuj |autor = Karolina Sulej |tytuł = Rzeczy osobiste:\
      \ opowieści o ubraniach w obozach koncentracyjnych i zagłady |data = 2020 |data\
      \ dostępu = 2024-08-22 |isbn = 978-83-66219-38-0 |miejsce = Warszawa |wydawca\
      \ = Wydawca Czerwone i Czarne |s = 377–421 |oclc = on1243856735 |url = https://www.worldcat.org/title/on1243856735}},\
      \ wykorzystując wiedzę na temat materialnej sfery dzieł sztuki. Znajduje to\
      \ potwierdzenie w [[Ustawa o ochronie zabytków i opiece nad zabytkami|ustawie\
      \ o ochronie zabytków]], zgodnie z którą „pracami konserwatorskimi, pracami\
      \ restauratorskimi lub badaniami konserwatorskimi, prowadzonymi przy zabytkach\
      \ wpisanych do rejestru kieruje osoba, która ukończyła studia drugiego stopnia\
      \ lub jednolite studia magisterskie, w zakresie konserwacji i restauracji dzieł\
      \ sztuki lub konserwacji zabytków”Art. 37b. ust. 1. ustawy z dnia 23 lipca 2003\
      \ r. o ochronie zabytków i opiece nad zabytkami ({{Dziennik Ustaw|2003|162|1568}})..\n\
      == Konserwacja i restauracja dzieł sztuki jako zespół czynności praktycznych\
      \ ==\n[[Plik:Frescos (15).jpg|mały|Konserwacja sklepienia kaplicy Mare de Déu\
      \ w [[Alcoy]] w Hiszpanii.]]\nDziałalność konserwatorów i restauratorów może\
      \ być podzielona na kilka obszarów, cechujących się odmiennymi warunkami pracy\
      \ oraz towarzyszących jej wyzwań i wymogów.\n=== Konserwacja i restauracja in\
      \ situ ===\n[[Plik:Frescos (5).jpg|mały|Uzupełnianie ubytków warstwy malarskiej\
      \ na sklepieniu kaplicy Mare de Déu w [[Alcoy]] w Hiszpanii]]\nKonserwacja i\
      \ restauracja ''in situ'', charakterystyczna przede wszystkim dla konserwacji\
      \ i restauracji dzieł związanych z architekturą – malowideł ściennych, rzeźby\
      \ kamiennej oraz detalu architektonicznego – wiąże się najczęściej z działalnością\
      \ wyjazdową i prowadzaniem prac w obiektach gdzie się te obiekty znajdują. Działania\
      \ takie prowadzone są zazwyczaj w większych zespołach i wymagają odpowiedniej\
      \ logistyki i organizacji pracy, w tym zapewnienia właściwych [[Rusztowanie|rusztowań]]{{Cytuj\
      \ |autor = |autor r = Edward Kosakowski |rozdział = Specyfika Katedry Konserwacji\
      \ i Restauracji Malowideł Ściennych |tytuł = Sprawozdania Pierwszej Katedry\
      \ WKiRDS |data = 2012 |data dostępu = 2024-08-22 |wolumin = 1 |s = 4–6 |opublikowany\
      \ = Akademia Sztuk Pięknych im. Jana Matejki w Krakowie |url = https://wk.asp.krakow.pl/wp-content/uploads/2016/01/Sprawozdania-Pierwszej-Katedry-2012.compressed.pdf\
      \ |język = pl}}. Zazwyczaj dotyczą obiektów zabytkowych wpisanych do [[Rejestr\
      \ zabytków (Polska)|rejestru]] lub [[Gminna ewidencja zabytków|gminnej ewidencja\
      \ zabytków]], przez co wymagają uzyskania wcześniej odpowiednich zezwoleń. Prace\
      \ konserwatorskie mają nierzadko charakter ratunkowy{{Cytuj |autor r = Władysław\
      \ Zalewski |redaktor = Maria Ostaszewska |rozdział = Nauczanie konserwacji malowideł\
      \ ściennych na Wydziale Konserwacji w Akademii Sztuk Pięknych w Krakowie |tytuł\
      \ = Krakowska szkoła konserwacji w programie TEMPUS |data = 1996 |isbn = 8390502526\
      \ |wolumin = 4 |miejsce = Kraków |wydawca = Akademia Sztuk Pięknych |s = 13–17\
      \ |seria = Studia i Materiały Wydziału Konserwacji i Restauracji Dzieł Sztuki\
      \ Akademii Sztuk Pięknych w Krakowie |język = pl}}.\n=== Konserwacja i restauracja\
      \ obiektów ruchomych ===\nKonserwacja i konserwacja ruchomych dzieł sztuki odbywa\
      \ się najczęściej w pracowni konserwatorskiej. Dotyczyć może m.in. malarstwa\
      \ sztalugowego i rzeźby{{Cytuj |tytuł = Katedra Konserwacji-Restauracji Malarstwa\
      \ i Rzeźby Polichromowanej |data dostępu = 2024-08-23 |opublikowany = Wydział\
      \ Sztuk Pięknych, Uniwersytet Mikołaja Kopernika w Toruniu |url = https://art.umk.pl/dspikds/o-instytucie/katedra-konserwacji-restauracji-malarstwa-i-rzezby-polichromowanej/\
      \ |język = pl}}, obiektów papierowych{{Cytuj |tytuł = Katedra Konserwacji-Restauracji\
      \ Papieru i Skóry |data dostępu = 2024-08-23 |opublikowany = Wydział Sztuk Pięknych,\
      \ Uniwersytet Mikołaja Kopernika w Toruniu |url = https://art.umk.pl/katedra-konserwacji-restauracji-dziedzictwa-kulturowego-na-papierze-skorze-tkaninie/\
      \ |język = pl}}, mebli. Konserwatorzy działają w mniejszych zespołach lub na\
      \ zasadzie [[Przedsiębiorca będący osobą fizyczną|jednoosobowej działalności\
      \ gospodarczej]].\n=== Konserwacja i restauracja muzealna ===\n[[Plik:The Lunder\
      \ Conservation Center Laboratory.jpg|mały|Pracownia konserwatorska Lunder Conservation\
      \ Center w [[Smithsonian American Art Museum and the Renwick Gallery]], umożliwiająca\
      \ zwiedzającym oglądanie na bieżąco pracy konserwatorów-restauratorów dzieł\
      \ sztuki]]\nTrzecim obszarem jest konserwacja muzealna. W strukturach wszystkich\
      \ [[Muzeum Narodowe|Muzeów Narodowych]] w Polsce oraz wielu muzeów samorządowych\
      \ i innych znajdują się działy i pracownie konserwacji{{Cytuj |tytuł = Baza\
      \ pracowni konserwatorskich w muzeach |data dostępu = 2024-08-23 |opublikowany\
      \ = Narodowy Instytut Muzeów |url = https://nim.gov.pl/baza-wiedzy/bazy-danych/baza-pracowni-konserwatorskich-w-muzeach\
      \ |język = pl}}. Zgodnie z ustawą, jednym z celów muzeów jest gromadzenie i\
      \ trwała ochrona dóbr kulturowego dziedzictwa ludzkości o charakterze materialnym\
      \ i niematerialnym. Cel ten jest realizowany m.in. przez zabezpieczanie i konserwację\
      \ zbiorówArt. 1, art. 2 ustawy o muzeach ({{Dziennik Ustaw|1997|5|24}}).. Na\
      \ stanowisku asystenta konserwatorskiego, starszego asystenta konserwatorskiego,\
      \ adiunkta konserwatorskiego, konserwatora oraz starszego konserwatora może\
      \ być zatrudniona wyłącznie osoba posiadająca dyplom ukończenia studiów drugiego\
      \ stopnia (w przypadku asystentów i adiunkta – pierwszego) lub jednolitych studiów\
      \ magisterskich odpowiadających danej specjalizacji oraz określony w ustawie\
      \ staż pracyArt. 32c. ustawy o muzeach ({{Dziennik Ustaw|1997|5|24}})..\nKonserwacja\
      \ i restauracja muzealna najczęściej zajmuje się ruchomymi dziełami sztuki,\
      \ jednak zakres zadań konserwatora jest szerszy. W jego zakres wchodzi m.in.\
      \ konserwatorska obsługa wystaw stałych i czasowych, przeprowadzanie okresowych\
      \ kontroli i sporządzanie raportów stanu zachowania dzieł sztuki, konserwacja\
      \ prewencyjna i monitorowanie mikroklimatu, uzupełnianie i gromadzenie dokumentacji\
      \ kolekcji (w trym wywiadów konserwatorskich{{Cytuj |autor r = Agata Małodobry,\
      \ Anna Kłosowska |redaktor = Jarosław Adamowicz, Joanna Daranowska-Łukaszewska\
      \ |rozdział = XX+XXI. Rzeźba: wystawa jako pole dialogu kuratorko-konserwatorskiego.\
      \ Dylematy, odkrycia, inspiracje |tytuł = O współpracy konserwatorów i historyków\
      \ sztuki: studia z historii sztuki i konserwacji |data = 2023 |data dostępu\
      \ = 2024-08-23 |isbn = 978-83-66564-99-2 |miejsce = Warszawa, Kraków |wydawca\
      \ = Stowarzyszenie Historyków Sztuki, Wydawnictwo Akademii Sztuk Pięknych w\
      \ Krakowie im. Jana Matejki |s = 105–114 |język = pl}}), uczestniczenie w procesach\
      \ [[Akwizycja (muzeum)|akwizycji]]{{Cytuj |autor r = Kinga Olesiejuk |redaktor\
      \ = Jarosław Adamowicz, Joanna Daranowska-Łukaszewska |rozdział = Współpraca\
      \ konserwatorów i historyków sztuki w procesie akwizycji dzieł współczesnych\
      \ |tytuł = O współpracy konserwatorów i historyków sztuki: studia z historii\
      \ sztuki i konserwacji |data = 2023 |data dostępu = 2024-08-23 |isbn = 978-83-66564-99-2\
      \ |miejsce = Warszawa, Kraków |wydawca = Stowarzyszenie Historyków Sztuki, Wydawnictwo\
      \ Akademii Sztuk Pięknych w Krakowie im. Jana Matejki |s = 95–104 |język = pl}},\
      \ współpraca przy projektach edukacyjnych, nadzorowanie pakowania i transportu\
      \ obiektów oraz pełnienie funkcji kuriera{{Cytuj |autor r = Janusz Czop |redaktor\
      \ = Anna Biedrzycka |rozdział = Instrukcja kurierska |tytuł = Opieka nad obiektami\
      \ muzealnymi |data = 2016 |data dostępu = 2024-08-23 |isbn = 978-83-648889-19-6\
      \ |wolumin = 5 |miejsce = Warszawa, Kraków |wydawca = Narodowy Instytut Muzealnictwa\
      \ i Ochrony Zbiorów; Muzeum Narodowe w Krakowie |s = 50–58 |seria = Ochrona\
      \ Zbiorów |język = pl}}.\n=== Konserwacja prewencyjna ===\nCelem konserwacji\
      \ prewencyjnej (zapobiegawczej, profilaktycznej) jest uniknięcie zaistnienia\
      \ możliwości powstawania zniszczeń lub ich minimalizowanie przez wyeliminowanie\
      \ ich przyczyn, połączone z wdrażaniem i propagowaniem dobrych praktyk i standardów\
      \ bezpieczeństwa{{Cytuj |autor r = Janusz Czop |rozdział = Konserwatorska ochrona\
      \ zbiorów muzealnych |tytuł = Zarządzanie bezpieczeństwem muzeum |data = 2018\
      \ |data dostępu = 2024-08-22 |isbn = 978-83-64889-28-8 |s = 113–137 |opublikowany\
      \ = Narodowy Instytut Muzeów |seria = Biblioteka Narodowego Instytutu Muzealnictwa\
      \ i Ochrony Zbiorów |url = https://nim.gov.pl/files/publications/44/Zarz%C4%85dzanie%20bezpiecze%C5%84stwem%20lekki.pdf\
      \ |język = pl}}, określających właściwe warunki przechowywania, eksponowania,\
      \ pakowania i transportu{{Cytuj |autor r = Joanna Czernichowska |redaktor =\
      \ Małogrzata Bogdańska-Krzyżanek, Joanna Egit-Pużyńska |rozdział = Strategie\
      \ konserwacji prewencyjnej |tytuł = O opiece nad kolekcją |data = 2008 |data\
      \ dostępu = 2024-08-22 |isbn = 9788360713259 |miejsce = Warszawa |s = 53–62\
      \ |opublikowany = Zachęta Narodowa Galeria Sztuki |url = https://zacheta.art.pl/magazyn/wp-content/uploads/2021/04/Opieka-nad-kolekcja.pdf\
      \ |język = pl}}.\n=== Badania konserwatorskie ===\n[[Plik:IMA Conservation Science\
      \ XRF 2.jpg|mały|Badanie składu pierwiastkowego malowidła za pomocą fluorescencyjnej\
      \ spektrometrii rentgenowskiej (XRF) w pracowni konserwatorskiej [[Indianapolis\
      \ Museum of Art]]]]\nBadania konserwatorskie są wszechstronnym, pełnym i interdyscyplinarnym\
      \ rozpoznaniem i poznaniem dobra kultury, stanowiącym podstawę do postawienia\
      \ poprawnej diagnozy i podjęcia właściwych decyzji konserwatorskich. Do zebrania\
      \ pełnej wiedzy o obiekcie wykorzystują warsztat badawczy nauk humanistycznych,\
      \ przyrodniczych, technicznych oraz specjalistycznych metod konserwatorskich,\
      \ z preferencją dla metod nieniszczących{{Cytuj |autor = Bogumiła Rouba |tytuł\
      \ = Projektowanie konserwatorskie |czasopismo = Ochrona Zabytków |data = 2008\
      \ |data dostępu = 2024-08-25 |issn = 0029-8247 |wolumin = 56 |numer = 1 |s =\
      \ 57–78 |url = https://bazhum.muzhp.pl/media/files/Ochrona_Zabytkow/Ochrona_Zabytkow-r2008-t56-n1_(240)/Ochrona_Zabytkow-r2008-t56-n1_(240)-s57-78/Ochrona_Zabytkow-r2008-t56-n1_(240)-s57-78.pdf\
      \ |język = pl}}. Do badań konserwatorskich należy zaliczyć również badania sfery\
      \ niematerialnej dzieła sztuki przy wykorzystaniu takich narzędzi, jak częściowo\
      \ [[Wywiad ustrukturyzowany|ustrukturyzowany]] wywiad konserwatorski{{Cytuj\
      \ |autor = Monika Jadzińska |tytuł = Rola dokumentacji w procesie zachowania\
      \ i konserwacji sztuki współczesnej |czasopismo = Sztuka i Dokumentacja |data\
      \ = 2011 |data dostępu = 2024-08-25 |issn = 2080-413X |wolumin = 4 |wydawca\
      \ = Stowarzyszenie Sztuka i Dokumentacja (SiD) |s = 71–79 |url = https://www.journal.doc.art.pl/pdf4/sid_vol_04_jadzinska.pdf\
      \ |język = pl}}.\nCelem badań konserwatorskich jest identyfikacja obiektu, ustalenie\
      \ jego historii, funkcji, przeprowadzenie analizy formalnej i stylistycznej,\
      \ rozpoznanie symboliki, znaczenia i wartości (przeszłych i obecnych), rozpoznanie\
      \ i udokumentowanie budowy technicznej, użytych materiałów i zastosowanych technologii,\
      \ ewentualnych przekształceń i nawarstwień, określenie stanu zachowania i sformułowanie\
      \ diagnozy konserwatorskiej.\n[[Plik:Koliště 43, Brno - 36.jpg|mały|Sonda stratygraficzna\
      \ pokazująca układ warstw konserwowanego obiektu, budynek Zakładu Ubezpieczeń\
      \ Wypadkowych Pracowników Moraw i Śląska w [[Brno|Brnie]]]]\nCzęścią badań konserwatorskich\
      \ zajmuje się chemia i fizyka konserwatorska. W zakres jej zadań wliczyć można\
      \ m.in.: rozpoznanie składu i budowy nawarstwień chronologicznych, identyfikacja\
      \ spoiw i pigmentów oraz technik i technologii, datowanie na podstawie wyników\
      \ badań. Stosuje metody m.in. takie jak: [[Mikroskop optyczny|mikroskopia optyczna]],\
      \ [[Skaningowy mikroskop elektronowy|skaningowa mikroskopia elektronowa]], fotografia\
      \ w światłach analitycznych ([[Ultrafiolet|UV]], [[Podczerwień|IR]], [[Lampa\
      \ sodowa|sodowe]]), [[Spektroskopia w podczerwieni|spektroskopia fourierowska\
      \ w podczerwieni]], [[spektroskopia Ramana]], spektrometria [[Absorpcja rentgenowska|fluorescencji\
      \ rentgenowskiej]], makrofluorescencja rentgenowska, [[Zdjęcie rentgenowskie|rentgenografia]],\
      \ mikrofedometria, [[spektrofotometria]] UV-VIS, [[chromatografia gazowa]].\
      \ Bada [[mikroklimat]] i czynniki wpływające na dzieła sztuki oraz wspomaga\
      \ rozwój nowych metod konserwacji{{Cytuj |tytuł = E-RIHS.PL – Polskie Konsorcjum\
      \ dla Badań nad Dziedzictwem Kulturowym |data dostępu = 2024-08-22 |url = http://www.e-rihs.pl/index.php/nasza-oferta/\
      \ |język = pl}}.\n=== Projektowanie konserwatorskie ===\nProjektowanie konserwatorskie\
      \ jest opracowaniem programu i projektu konserwatorskiego na podstawie wyników\
      \ badań konserwatorskich, analizy wartościującej i diagnozy konserwatorskiej.\
      \ Program i projekt konserwatorski wyznaczają podstawowe założenia, cel i zakres\
      \ niezbędnych działań, harmonogram zadań (postępowanie konserwatorskie) ułożonych\
      \ we właściwej kolejności wraz z propozycjami metod i materiałów, określają\
      \ planowany efekt końcowy. Projektowanie konserwatorskie podporządkowane jest\
      \ dobru obiektu, przebiega według zasad etyki konserwatorskiej i dobrej praktyki.\n\
      W przypadków złożonych projektów, zwłaszcza w kontekście instytucjonalnym, projektowanie\
      \ konserwatorskie i nadzór nad przebiegiem prac badawczych i konserwatorskich\
      \ ułatwiają ustandaryzowane modele podejmowania decyzji{{Cytuj |redaktor = Ijsbrand\
      \ Hummelen, Dionne Sillé |rozdział = The Decision-making Model for the Conservation\
      \ and Restoration of Modern and Contemporary Art |tytuł = Modern Art – Who Cares?\
      \ |data = 2005 |data dostępu = 2024-08-25 |isbn = 978-1904982029 |miejsce =\
      \ Londyn |wydawca = Archetype Publications |s = 164–172 |język = en}}. Konserwator-restaurator\
      \ dzieł sztuki, posiadający pełną wiedzę na temat materialnych i niematerialnych\
      \ aspektów dzieła i mając na celu przede wszystkich ochronę jego autentyzmu,\
      \ staje się organizatorem wszystkich etapów ochrony dzieła sztuki{{Cytuj |autor\
      \ r = Iwona Szmelter |redaktor = Iwona Szmelter |rozdział = O sztuce w procesie\
      \ / syntezie sztuk – od paleolitu do dzisiaj. Ochrona, dokumentacja, konserwacja-restauracja,\
      \ rekonstrukcja |tytuł = Sztuka w procesie – proces w sztuce: ku nowej filozofii\
      \ ochrony dziedzictwa kultury |data = 2016 |data dostępu = 2024-08-25 |isbn\
      \ = 978-83-65455-22-2 |miejsce = Warszawa |wydawca = Akademia Sztuk Pięknych\
      \ |s = 12–33 |język = pl}}. Współpracuje w tym zakresie z [[Kurator sztuki|kuratorem]]\
      \ i sam ma doświadczenie oraz wiedzę kuratorską{{Cytuj |autor = Monika Jadzińska\
      \ |tytuł = „Duże dzieło sztuki”: sztuka instalacji, autentyzm, zachowanie, konserwacja\
      \ |data = 2012 |data dostępu = 2024-08-25 |isbn = 978-83-242-1693-2 |miejsce\
      \ = Kraków |wydawca = Towarzystwo Autorów i Wydawców Prac Naukowych Universitas\
      \ |s = 226–229 |język = pl}}.\nProjektowanie konserwatorskie regulowane jest\
      \ wytycznymi zawartymi w „Kodeksie etyki konserwatorskiej”, a sam projekt konserwatorski\
      \ chroniony jest prawem autorskim.\n=== Dokumentacja konserwatorska ===\n[[Plik:Rentoilage\
      \ d'un tableau.jpeg|mały|Zabieg [[Dublowanie|dublażu]] malowidła sztalugowego\
      \ na płótnie]]\nDokumentacja konserwatorska zajmuje się rejestrowaniem i prezentowaniem\
      \ przebiegu konserwacji oraz dokumentowaniem samych dzieł sztuki, za pomocą\
      \ narzędzi takich jak: pisemna dokumentacja konserwatorska, dokumentacja rysunkowo-pomiarowa,\
      \ rejestry i raporty stanu zachowania, fotografia dokumentacyjna, inwentaryzacja\
      \ [[Fotogrametria|fotogrametryczna]], [[Fotogrametryczne skanowanie i obrazowanie\
      \ 3D|skanowanie 3D]], częściowo [[Wywiad ustrukturyzowany|ustrukturyzowany]]\
      \ [[Wywiad (metoda badawcza)|wywiad]] konserwatorski czy baza próbek materiałowych\
      \ danego artysty (ang. ''artist’s box'').\n=== Typowe zabiegi przy obiekcie\
      \ ===\nDo typowych czynności i zabiegów konserwatorsko-restauratorskich oddziałujących\
      \ na sam obiekt należą: oczyszczanie powierzchni, usuwanie werniksu i przemalowań,\
      \ odsalanie, odkwaszanie, [[dezynfekcja]] i [[dezynsekcja]], [[impregnacja]]\
      \ i konsolidacja, sklejanie, licowanie, [[dublowanie]], podklejanie warstw i\
      \ pęcherzy, wykonywanie zastrzyków, uzupełnianie ubytków warstw obiektu (w tym\
      \ warstwy malarskiej – retuszowanie, [[punktowanie]]){{Cytuj |tytuł = Przewodnik\
      \ po Kategoriach – Twój konserwator |data = 2024-06-05 |data dostępu = 2024-08-23\
      \ |opublikowany = Narodowy Instytut Dziedzictwa |url = https://znany-konserwator.pl/przewodnik-po-kategoriach/\
      \ |język = pl}}{{Cytuj |tytuł = IMD – Interdyscyplinarny Słownik Wielojęzyczny\
      \ z zakresu konserwacji, restauracji i dyscyplin powiązanych |data dostępu =\
      \ 2024-08-23 |opublikowany = Politechnika Krakowska im. Tadeusza Kościuszki\
      \ |url = http://www.imd.pk.edu.pl/?page=slownik}}.\n== Etyka i zasady konserwacji\
      \ i restauracji dzieł sztuki ==\n[[Plik:Rekonstrukce Staroměstské radnice 1AAK2327.jpg|mały|Usuwanie\
      \ nawarstwień na rzeźbie drewnianej, polichromowanej podczas prac konserwatorskich\
      \ w [[Ratusz staromiejski w Pradze|ratuszu staromiejskim w Pradze]], 2017-2018]]\n\
      Początki formułowania zasad etycznych związanych z ochroną zabytków i dzieł\
      \ sztuki sięgają XVIII wieku i działalności [[Johann Joachim Winckelmann|Johanna\
      \ Joachima Winckelmanna]], który dążąc do ochrony autentyzmu konserwowanych\
      \ obiektów wprowadził zasadę odróżniania partii uzupełnionych od pierwotnych\
      \ tak, by nie wprowadzać w błąd odbiorcy. Współczesna teoria i etyka konserwatorska\
      \ wyrosła na doświadczeniach ostatnich 200 lat, poprzedzonych krytycznie ocenianą\
      \ ze względu na prymat rekonstrukcji i usuwania późniejszych nawarstwień epoką\
      \ puryzmu, której przedstawicielem był [[Eugène Viollet-le-Duc]]. Na przełomie\
      \ wieku XIX i XX podstawy współczesnej myśli konserwatorskiej stworzyli [[Alois\
      \ Riegl]], [[Max Dvořák]] i [[Georg Dehio]], w XX wieku temat rozwijali [[Cesare\
      \ Brandi]], [[Walter Frodl]], [[Umberto Baldini]]. W Polsce tematem etyki i\
      \ zasad konserwacji restauracji zajmowali się m.in. [[Bohdan Marconi]], [[Hanna\
      \ Jędrzejewska]], [[Wojciech Kurpik]], [[Andrzej Tomaszewski (architekt)|Andrzej\
      \ Tomaszewski]], [[Bogumiła Rouba|Bogumiła J. Rouba]], [[Józef Furdyna]].\n\
      Obecnie funkcjonują różnorodne polskie i zagraniczne opracowania i kodeksy etyki,\
      \ wśród których należy wyróżnić „Kodeks etyki konserwatora-restauratora dzieł\
      \ sztuki”{{Cytuj |tytuł = Kodeks etyki konserwatora-restauratora dzieł sztuki\
      \ |data dostępu = 2024-08-05 |opublikowany = Ogólnopolska Rada Konserwatorów\
      \ Dzieł Sztuki przy Zarządzie Głównym Związku Polskich Artystów Plastyków |url\
      \ = https://zpap-orkds.pl/kodeks-etyki-konserwatora-restauratora-dziel-sztuki/\
      \ |archiwum = https://web.archive.org/web/20240805081824/https://zpap-orkds.pl/kodeks-etyki-konserwatora-restauratora-dziel-sztuki/\
      \ |zarchiwizowano = 2024-08-05 |język = pl}} powstały w 2016 r. pod redakcją\
      \ [[Mieczysław Stec|Mieczysława Steca]] na wniosek Ogólnopolskiej Rady Konserwatorów\
      \ Dzieł Sztuki ZPAP, „E. C. C. O Professional Guidelines (II) Code of Ethics”{{Cytuj\
      \ |tytuł = E.C.C.O. Professional Guidelines (II). Code of Ethics |data = 2003-03-07\
      \ |data dostępu = 2024-08-23 |opublikowany = European Confederation of Conservator-Restorer’s\
      \ Organisations |url = https://www.ecco-eu.org/wp-content/uploads/2021/03/ECCO_professional_guidelines_II.pdf\
      \ |język = en}}, a także opracowania Bogumiły J. Rouby oraz Iwony Szmelter.\n\
      Powszechnie podkreśla się konieczność posiadania przez konserwatora-restauratora\
      \ specjalistycznych kwalifikacji, uzyskanych w procesie kształcenia artystycznego\
      \ i naukowego na poziomie akademickim lub uniwersyteckim, konieczność zachowania\
      \ bezstronności wobec walorów i treści dzieła sztuki oraz kierowania się szacunkiem\
      \ wobec autentyku, konieczność stosowania jak najbardziej odwracalnych zabiegów\
      \ oraz właściwego dokumentowania swojej pracy.\n[[Bogumiła Rouba|Bogumiła J.\
      \ Rouba]] wyróżniła siedem podstawowych zasad traktowania dóbr kultury:\n# „zasada\
      \ PRIMUM NON NOCERE (łac. „przede wszystkim nie szkodzić”),\n# zasada maksymalnego\
      \ poszanowania oryginalnej substancji zabytku i wszystkich jego wartości (materialnych\
      \ i niematerialnych),\n# zasada minimalnej niezbędnej ingerencji (powstrzymywania\
      \ się od działań niekoniecznych),\n# zasada, zgodnie z którą usuwać należy to\
      \ (i tylko to), co na oryginał działa niszcząco,\n# zasada czytelności i odróżnialności\
      \ ingerencji oraz ich estetycznego podporządkowania oryginałowi (niekonkurencyjności),\n\
      # zasada odwracalności metod i materiałów,\n# zasada wykonywania wszelkich prac\
      \ zgodnie z najlepszą wiedzą i na najwyższym poziomie, wraz z pełną dokumentacją\
      \ wyników badań oraz przebiegu kolejnych działań”{{Cytuj |autor = Bogumiła J.\
      \ Rouba |tytuł = Zasady konserwatorskie i zasady adaptacji |data dostępu = 2024-08-23\
      \ |opublikowany = Ogólnopolska Rada Konserwatorów Dzieł Sztuki |url = https://zpap-orkds.pl/zasady-konserwatorskie-i-zasady-adaptacji-opr-b-j-rouba/\
      \ |język = pl}}.\nW praktyce, postulowana w punkcie nr 6. odwracalność, najczęściej\
      \ nie jest w pełni możliwa do spełnienia. Każde działanie w jakiś sposób wpływa\
      \ na dzieło sztuki i nie jest możliwe całkowite usunięcie zmian przez nie wprowadzonych.\
      \ W związku z tym proponuje się zastąpienie „odwracalności” (ang. ''reversible'')\
      \ i „usuwalnością” (ang. ''removable''){{Cytuj |autor = Iwona Szmelter |tytuł\
      \ = Etyka w ochronie i konserwacji dziedzictwa sztuk wizualnych |czasopismo\
      \ = Ochrona Zabytków |data = 2022 |data dostępu = 2024-08-23 |issn = 0029-8247\
      \ |wolumin = 2 |s = 7–37 |url = https://bibliotekanauki.pl/articles/21151091\
      \ |język = pl}}. \n[[Plik:Dreikronenbanner - Kölner Stadtbanner - Restaurierung-2851.jpg|mały|Konserwacja\
      \ i restauracja sztandaru miasta [[Kolonia (Niemcy)|Kolonii]] w pracowni konserwatorskiej\
      \ [[Museum Schnütgen]], 2011]]\n[[Iwona Szmelter]] zaproponowała rozszerzony\
      \ zestaw 10 zasad odpowiadających na poszerzanie się pola sztuki i wraz z nią\
      \ przedmiotu konserwacji:\n# „po pierwsze «przede wszystkim nie szkodzić» –\
      \ postępowanie według naczelnej zasady etycznej, zgodnej z maksymą hipokratejską;\n\
      # maksymalne poszanowanie dla oryginalnej substancji lub wirtualnego ciała sztuki\
      \ i wszystkich ich wartości;\n# prowadzenie badań identyfikacyjnych i wielodyscyplinarnych\
      \ studiów przed diagnozą oraz sformułowaniem projektu konserwatorskiego, wszystkie\
      \ zagadnienia powinny być udokumentowane przed podjęciem decyzji;\n# rozszerzona\
      \ rola dokumentacji w projekcie konserwatorskim: wykorzystująca nowe metody\
      \ rejestracji i archiwizacji, argumentująca właściwe rozpoznanie dzieła (wyjściowe\
      \ elementy ochrony), jego konserwację-restaurację, ewentualnie rekonstrukcję;\n\
      # zachowanie minimalnej niezbędnej ingerencji, realizowane jednak nie w postaci\
      \ sztywnej zasady, ale dostosowane do specyfiki utworu/dzieła/obiektu, oparte\
      \ na odpowiednim paradygmacie teorii konserwatorskiej;\n# postępowanie dla zachowania\
      \ potencjalnej jedności utworu/dzieła/obiektu i jego integralności;\n# możliwa\
      \ odwracalność/usuwalność metod i materiałów (jednak nie zawsze jest to realne);\n\
      # czytelność i odróżnialność ingerencji, jeśli nie przez znak konserwatorski,\
      \ to w dokumentacji oraz w komunikacie dla odbiorców;\n# wykonywanie i dokumentowanie\
      \ prac zgodnie z najlepszą wiedzą i na najwyższym poziomie, co wymaga rozszerzenia\
      \ i aktualizacji profesjonalnej wiedzy konserwatorskiej – nie ma tu miejsca\
      \ na amatorstwo, a przystępując do badań, nie możemy kierować się rutyną lub\
      \ powtarzalnością zagadnień;\n# partycypacja społeczna na etapach identyfikacji\
      \ dzieła i jego stanu zachowania, diagnozy i projektu konserwatorskiego, niezbędne\
      \ jest upowszechnienie informacji, by obiekt był zrozumiały dla odbiorcy”.\n\
      W kontekście sztuki nowoczesnej i współczesnej, bardzo ważnym czynnikiem wpływającym\
      \ na działalność konserwatora-restauratora jest [[prawo autorskie]], a zwłaszcza\
      \ należące do niezbywalnych i nieograniczonych w czasie autorskich praw osobistych{{Cytuj\
      \ |autor = Piotr Ślęzak |tytuł = Utwór konserwatorski w polskim prawie autorskim\
      \ |data = 2024 |data dostępu = 2024-08-23 |isbn = 9788382066234 |opis = Biblioteka\
      \ Prawa Ochrony Zabytków |miejsce = Gdańsk |wydawca = Wydawnictwo Uniwersytetu\
      \ Gdańskiego |s = 142–149 |język = pl}}: „prawo do nienaruszalności treści i\
      \ formy utworu oraz jego rzetelnego wykonania” (art. 16. pkt 3) oraz „prawo\
      \ nad sposobem korzystania z utworu” (art. 16. pkt 5)Ustawa z dnia 4 lutego\
      \ 1994 r. o prawie autorskim i prawach pokrewnych ({{Dziennik Ustaw|1994|24|83}})..\n\
      == Twórczy i artystyczny aspekt konserwacji i restauracji dzieł sztuki ==\n\
      Istotnym aspektem konserwacji i restauracji dzieł sztuki jest aspekt twórczy\
      \ i artystyczny, mający przełożenie na jej uwarunkowania teoretyczne, praktyczne\
      \ oraz prawne.\nW zachodnioeuropejskiej teorii i praktyce konserwatorskiej drugiej\
      \ połowy XX w. popularność zyskała tzw. „konserwacja naukowa” (ang. ''scientific\
      \ conservation''), za prymat biorąca materialny element dzieła sztuki, chronionego\
      \ dzięki zapewniającym obiektywność metodom nauk ścisłych{{Cytuj |autor = Salvador\
      \ Muñoz Viñas |tytuł = Contemporary theory of conservation |data = 2011 |data\
      \ dostępu = 2024-08-22 |isbn = 978-0-7506-6224-6 |miejsce = New York |wydawca\
      \ = Routledge |s = 89–113 |język = en}}. Odrzucała subiektywne odczucia, pomijając\
      \ wartości artystyczne dzieła sztuki i twórczy charakter ich konserwacji i restauracji.\n\
      Możliwość obiektywnego, czysto naukowego podejścia została zakwestionowana zarówno\
      \ przez klasycznych teoretyków, takich jak [[Cesare Brandi]], [[Umberto Baldini]],\
      \ [[Paul Philippot]], jak i współczesnych badaczy zajmujących się ochroną dziedzictwa\
      \ i dzieł sztuki, jak [[Salvador Muñoz Viñas]] i [[David Lowenthal]]. Subiektywność\
      \ decyzji podejmowanych przez konserwatora-restauratora wynika z obecności w\
      \ dziele sztuki wartości estetycznych i artystycznych oraz jego często złożonej\
      \ struktury i historii. Ze względu na to, że wybór kierunku konserwacji-restauracji\
      \ i przebieg poszczególnych zabiegów zależy od poglądów danej osoby, konsensusu\
      \ panującego w konkretnym środowisku lub czasach, nieograniczona subiektywność\
      \ może prowadzić do efektów sprzecznych z celem konserwacji i restauracji dzieł\
      \ sztuki. W jej miejsce postulowana jest intersubiektywność{{Cytuj |autor =\
      \ Salvador Muñoz Viñas |tytuł = Contemporary theory of conservation |data =\
      \ 2011 |data dostępu = 2024-08-22 |isbn = 978-0-7506-6224-6 |miejsce = New York\
      \ |wydawca = Routledge |s = 150–153 |język = en}}.\nPolska szkoła konserwacji\
      \ i restauracji dzieł sztuki kładzie nacisk na obecność w dyscyplinie aspektu\
      \ twórczego, pociągającego za sobą konieczność akademickiego kształcenia zarówno\
      \ w obszarze naukowym, jak i artystycznym. Konserwacja i restauracja jest jednocześnie\
      \ dziedziną nauki i sztuki, w przypadku tej drugiej postępującą odmiennie od\
      \ innych form twórczości – całkowicie podporządkowującą akt własnej kreacji\
      \ intencjom twórcy konserwowanego dzieła{{Cytuj |autor = Bogumiła Rouba |tytuł\
      \ = Zasady postępowania estetycznego w ochronie dóbr kultury |czasopismo = Biuletyn\
      \ informacyjny konserwatorów dzieł sztuki |data = 2000 |data dostępu = 2024-08-27\
      \ |issn = 1234-5210 |wolumin = 11 |numer = 2 |s = 24-25 |język = pl}}.\n===\
      \ Twórczy charakter konserwacji i restauracji dzieł sztuki a prawo autorskie\
      \ ===\nTwórczy aspekt konserwacji pociąga za sobą ważne konsekwencje prawne.\
      \ W większości przypadków efekt prac konserwatorskich – dzieło konserwatorskie,\
      \ w tym projekt i program prac konserwatorskich, jest utworem w rozumieniu prawa\
      \ autorskiego i jako takie jest prawnie chronione. Jest rezultatem działalności\
      \ intelektualnej człowieka, stanowi przejaw działalności twórczej i zostało\
      \ utrwalone w jakiejkolwiek postaci. Utworem nie są jedynie efekty działań czysto\
      \ technicznych, pozbawionych twórczego charakteru[https://orzeczenia.nsa.gov.pl/doc/CADEA3B542\
      \ Wyrok Naczelnego Sądu Administracyjnego z dnia 31 stycznia 2018 r., sygn.\
      \ I FSK 588/16].\nWśród przejawów twórczego charakteru działalności konserwatora-restauratora\
      \ dzieł sztuki wyróżnia się m.in.: dokonywanie wyboru jednej z możliwych postaci\
      \ dzieła sztuki w celu przekazania odbiorcy jego wartości zgodnych z intencją\
      \ artysty; dokonywanie rekonstrukcji procesu twórczego artysty na podstawie\
      \ „dialogu” z artystą, opartego na wrażliwości estetycznej, talencie artystycznym\
      \ i wiedzy konserwatorskiej; tworzenie nowych jakości estetycznych w konserwowanym\
      \ dziele przez odsłanianie, dodawanie lub usuwanie jego elementów (np. wpływających\
      \ na wygląd obiektu środków konsolidujących lub werniksów).\nDzieło konserwatorskie\
      \ jako utwór spełnia kryterium oryginalności i indywidualności przez fakt interpretacji\
      \ i uporządkowania przez konserwatora-restauratora zastanej sytuacji dzieła\
      \ sztuki za pomocą środków wyrazu artystycznego, własnej pomysłowości i indywidualnego\
      \ ujęcia, a także kryterium nowości, przez fakt odmienności dzieła od stanu\
      \ przed konserwacją oraz odmienności od stanu pierwotnego (przez dodanie elementów\
      \ lub wartości będących wytworem procesów świadomości konserwatora){{Cytuj |autor\
      \ = Piotr Ślęzak |tytuł = Utwór konserwatorski w polskim prawie autorskim |data\
      \ = 2024 |data dostępu = 2024-08-23 |isbn = 9788382066234 |opis = Biblioteka\
      \ Prawa Ochrony Zabytków |miejsce = Gdańsk |wydawca = Wydawnictwo Uniwersytetu\
      \ Gdańskiego |s = 47–52 |język = pl}}.\n== Działy konserwacji i restauracji\
      \ dzieł sztuki ==\n[[Plik:Rekonstrukce Staroměstské radnice 1AAK4254.jpg|mały|Pracownia\
      \ konserwacji witrażu w trakcie prac konserwatorsko-restauratorskich w [[Ratusz\
      \ staromiejski w Pradze|ratuszu staromiejskim w Pradze]], 2017-2018]]\nNie istnieje\
      \ jeden oficjalny podział dyscypliny na działy, w strukturach muzeów{{Cytuj\
      \ |tytuł = Konserwacja |data dostępu = 2024-08-23 |opublikowany = Muzeum Narodowe\
      \ w Krakowie |url = https://mnk.pl/konserwacja |język = pl}}{{Cytuj |tytuł =\
      \ Konserwacja |data dostępu = 2024-08-23 |opublikowany = Muzeum Narodowe we\
      \ Wrocławiu |url = https://mnwr.pl/kontakt/konserwacja/ |język = pl}}{{Cytuj\
      \ |tytuł = Działy / Struktura MNW |data dostępu = 2024-08-23 |opublikowany =\
      \ Muzeum Narodowe w Warszawie |url = https://www.mnw.art.pl/o-muzeum/struktura-mnw/dzialy/}}\
      \ oraz wydziałów uczelni wyższych{{Cytuj |tytuł = Struktura Wydziału |data dostępu\
      \ = 2024-08-23 |opublikowany = Wydział Konserwacji i Restauracji Dzieł Sztuki,\
      \ Akademia Sztuk Pięknych w Warszawie |url = https://wkirds.asp.waw.pl/struktura-wydzialu/\
      \ |język = pl}}{{Cytuj |tytuł = Struktura organizacyjna |data dostępu = 2024-08-23\
      \ |opublikowany = Wydział Konserwacji i Restauracji Dzieł Sztuki, Akademia Sztuk\
      \ Pięknych w Krakowie |url = https://wk.asp.krakow.pl/struktura-organizacyjna/\
      \ |język = pl}}{{Cytuj |tytuł = Katedry Wydziału |data dostępu = 2024-08-23\
      \ |opublikowany = Wydział Sztuk Pięknych, Uniwersytet Mikołaja Kopernika w Toruniu\
      \ |url = https://art.umk.pl/wydzial/katedry-wydzialu-2/}}{{Cytuj |tytuł = Wydział\
      \ Ceramiki i Szkła |data = 2024-07-22 |data dostępu = 2024-08-23 |opublikowany\
      \ = Akademia Sztuk Pięknych im. Eugeniusza Gepperta we Wrocławiu |url = https://www.asp.wroc.pl/pl/uczelnia/struktura-uczelni/wydzialy-i-jednostki/wydzial-ceramiki-i-szkla\
      \ |język = pl}} zaobserwować można powtarzający się zwyczajowy podział przyjmujący\
      \ za kryterium właściwości i charakterystyczne problemy niesione przez materię\
      \ poszczególnych grup dzieła sztuki. Wyjątek stanowią: konserwacja dzieł sztuki\
      \ [[Modernizm (sztuka)|nowoczesnej]] i [[Sztuka współczesna|współczesnej]],\
      \ [[Design|wzornictwa i dziedzictwa technicznego]] oraz [[Sztuka ludowa|sztuki\
      \ ludowej]] i dziedzictwa etnograficznego, wyodrębnione przede wszystkim przez\
      \ zestawienie właściwości i charakterystycznych problemów sfery niematerialnej\
      \ dzieła sztuki.\nObok działów poświęcone stricte ochronie poszczególnych grup\
      \ dzieł sztuki, wyróżnić można działy związane z ich badaniem i dokumentacją\
      \ oraz działy historyczno-teoretyczne.\nW zależności od specyfiki i historii\
      \ danego ośrodka badawczego można zaobserwować różnice w szczegółach, jednak\
      \ w swojej najbardziej ogólnej formie podział dyscypliny na działy przedstawia\
      \ się następująco:\n[[Plik:Rekonstrukce Staroměstské radnice 1AAK2313.jpg|mały|Konserwacja\
      \ i restauracja rzeźby drewnianej, polichromowanej podczas prac konserwatorskich\
      \ w [[Ratusz staromiejski w Pradze|ratuszu staromiejskim w Pradze]], 2017-2018]]\n\
