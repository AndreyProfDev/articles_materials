  - content: '[[Plik:Eugène Delacroix - La liberté guidant le peuple.jpg|thumb|240px|[[Eugène
      Delacroix]], ''''[[Wolność wiodąca lud na barykady]]'''' (1830), [[Luwr]]]]

      [[Plik:Alegoria Umarlej Polski.jpg|thumb|240px|[[Włodzimierz Tetmajer]], alegoria
      Polski umarłej (1909), [[katedra św. Mikołaja Biskupa w Kaliszu]]]]

      [[Plik:2014 Cenzura.jpg|thumb|180px|Alegoria cenzury w krajach komunistycznych]]

      ''''''Alegoria'''''' ({{greka|ἀλληγορία}} ''''allēgoría'''', od {{grc|ἀλληγορέω}}
      ''''allēgoréo'''' „mówię w przenośni, obrazowo” z ἄλλος ''''allos'''' „inny,
      różny” i ἀγορεύω ''''agoreuo'''' „przemawiać w zgromadzeniu” z ἀγορά ''''[[agora]]''''
      „zgromadzenie”) w [[literatura|literaturze]] i [[sztuka|sztukach plastycznych]]
      – obraz plastyczny lub słowny przedstawiający pojęcie, ideę, myśl lub wydarzenie
      np. poprzez [[personifikacja|personifikację]]. Odczytanie alegorii umożliwiają
      m.in. [[Atrybut (sztuka)|atrybuty]] lub [[emblemat]]y o konkretnym znaczeniu,
      dlatego, w przeciwieństwie do [[symbol]]u, przesłanie alegorii jest zazwyczaj
      jednoznaczne.

      Alegorią posługiwano się już w starożytności, często stosowano ją w średniowieczu
      (zob. [[średniowieczny alegoryzm]]), lecz rozpowszechniła się w okresie [[renesans]]u,
      a zwłaszcza [[barok]]u. W XVI i XVII w. publikowano specjalne wydawnictwa zawierające
      ilustracje, opis i komentarze poszczególnych przedstawień alegorycznych (m.in.
      [[Cesare Ripa|Cesarego Ripa]] ''''Ikonologia'''' pierwsze wydanie w 1593 roku).

      == W literaturze ==

      Alegoria jest składnikiem świata przedstawionego utworu (np. jako motyw, postać,
      fabuła), który poza wyrażonym wprost znaczeniem, przekazuje również treść ogólniejszą,
      nieraz bardziej abstrakcyjną. Szczególnie często sięgano po nią w literaturze
      dydaktycznej i moralizatorskiej (w średniowieczu w [[moralitet|moralitecie]],
      poematach romansowo-moralizatorskich), dziełach przedstawiających idee polityczne
      lub historiozoficzne, przypowieściach, a zwłaszcza w [[bajka]]ch.

      == Bibliografia ==

      * Aleksandra Okopień-Sławińska, hasło: ''''alegoria'''' ''''Podręczny słownik
      terminów literackich'''', pod red. [[Janusz Sławiński (filolog)|Janusza Sławińskiego]],
      Warszawa, "Open", 1996, s.12.

      * Hasło: ''''alegoria'''' [w:] ''''Słownik terminologiczny sztuk pięknych'''',
      pod red. [[Stefan Kozakiewicz|Stefana Kozakiewicza]], Warszawa, Państwowe Wydawnictwo
      Naukowe, 1969, s.15.

      == Zobacz też ==

