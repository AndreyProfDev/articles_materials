  - content: '[[Plik:Nambe Lake cliche.jpg|thumb|Wykorzystanie elementów natury jak
      gałąź drzewa, aby „obramować” scenę z krajobrazem może być uznawane za ''''cliché''''{{Cytuj|autor
      = Michael Freeman |tytuł = Nature and Landscape Photography |data = 2004 |isbn
      = 1-57990-545-5 |miejsce = Nowy Jork|język=en |wydawca = Lark Books |s = 36
      |oclc = 53954259 }}]]

      ''''''Cliché'''''' – komunał lub [[stereotyp]] myślowy{{cytuj stronę|url=https://sjp.pwn.pl/sjp/cliche;2553653.html|opublikowany=Słownik
      PWN|tytuł=Cliché|data dostępu=2020-01-23}}, wyrażenie, pomysł lub element [[sztuka|pracy
      artystycznej]], który jest używany tak często, że traci swoje oryginalne znaczenie
      lub efekt, szczególnie jeśli wcześniej uznawany był za nowy i znaczący. W [[kultura
      masowa|kulturze masowej]] termin jest używany do opisywania czynności, wydarzeń
      lub pomysłów, które są przewidywalne. Niektóre ''''cliché'''' są po prostu stereotypami,
      inne mogą być [[truizm]]ami{{cytuj stronę|url=http://www.thefreedictionary.com/Cliche|tytuł=Cliché|opublikowany=The
      Free Dictionary|język=en|data dostępu=2012-08-08}}.

      Wyraz został zaczerpnięty z [[język francuski|języka francuskiego]], gdzie określa
      się nim płyty wykorzystywane przez [[Zecerstwo|zecerów]] przy druku tradycyjnym
      (por. [[klisza]]). Dla często używanych wyrazów przygotowywano specjalne płyty,
      na których znajdował się cały wyraz gotowy do powielenia{{cytuj stronę|url=http://www.museumofprinting.org/Collection.html|opublikowany=The
      Museum of Printing|tytuł=Collection|język=en|data dostępu=2012-08-08}}.

