      [[Plik:1920 Disrobed.jpg|thumb|Erotyczna fotografia z lat 20. XX wieku.]]

      ''''''Erotyka w sztuce'''''' (z {{gr.|eros}} „[[miłość]]”) – jest jednym z przejawów
      [[sensualizm]]u, chociaż często jest też postrzegana jako nacechowana [[seks]]ualnością,
      [[pożądanie]]m, wulgarnością oraz uwielbieniem ciała i mylona z [[Pornografia|pornografią]].
      Reprezentatywnym wyrazem erotyki są szeroko pojęte [[dzieło sztuki|dzieła sztuki]]
      ([[literatura|utwory literackie]], [[fotografia|fotografie]], [[film]]y, [[rzeźbiarstwo|rzeźby]]
      i [[malarstwo|obrazy]]) dotyczące [[zmysł]]owości i [[miłość|miłości]]. W odróżnieniu
      od [[pornografia|pornografii]] dzieła erotyczne przedstawiają [[seksualność]]
      człowieka bez dosłowności [[anatomia|anatomicznych]] aktu seksualnego, choć
      granice bywają tu płynne i nie zawsze wyraźne. W twórczości niektórych artystów
      następuje często świadoma akcja zacierania tych granic estetyczno formalnych,
      np. u [[Tom of Finland|Toma z Finlandii]] czy [[Robert Mapplethorpe|Roberta
      Mapplethorpego]]{{Cytuj |tytuł = O sztuce miłości |data dostępu = 2021-02-11
      |opublikowany = pl.bluerock.es |url = https://pl.bluerock.es/3080067/1/o-sztuce-milosci.html
      |język = pl}}.

      == Erotyka w starożytności ==

      Jedną z najstarszych znanych autorek sztuki o tematyce erotycznej jest grecka
      poetka [[Safona]], która komponowała poezję do muzyki granej na lirze. [[Historia|Historycy]]
      przypisywali jej trzy wynalazki związane z muzyką (''''plektron'''' – narzędzie
      do trzymania liry, ''''pektis'''' – rodzaj liry albo harfy, przeznaczonej dla
      kobiety, oraz [[Skala miksolidyjska kościelna|skalę miksolidyjską]]){{Cytuj
      |autor = Anne Carson |tytuł = If Not, Winter: Fragments of Sappho |data = 2003
      |isbn = 0-375-72451-6 |miejsce = Nowy Jork |wydawca = Vintage Books}}, co wskazuje
      że była nie tylko poetką, ale także muzykiem, chociaż zapisy jej utworów muzycznych
      nie zachowały się. Nie wiadomo czy Safona była piśmienna. Jej utwory o charakterze
      erotycznym poruszają temat miłości, tęsknoty, zazdrości, samotności; niektóre
      noszą ślady różnych starożytnych [[rytuał]]ów. Pojawiają się w nich mężczyźni,
      kobiety, bogowie i boginie. Postacią, która często uważana jest za wskazującą
      na homo- lub biseksualizm autorki, jest m.in. ''''Atthis''''{{Cytuj |autor =
      Jane Montgomery Griffiths |tytuł = Sappho... in 9 Fragments |data = 2010 |isbn
      = 9780868198866 |miejsce = Sydney |wydawca = Currency Press}}, młoda kobieta
      (na pewno młodsza od Safony) pojawiająca się w kilku wierszach, z których żaden
      nie zachował się w całości. Większość tłumaczy Safony jest jednak zdania, że
      przy interpretacji wszystkich wątków z zachowanej twórczości poetki musi być
      brana pod uwagę ''''[[Licentia poetica|licencia poetica]]'''' – tym bardziej,
      że nie jest znany ich dokładny kontekst. [[Anne Carson]], autorka współczesnego
      tłumaczenia poezji Safony z oryginału (z dialektu [[Języki helleńskie|eolskiego]]),
      w swojej własnej poezji również podejmuje czasem tematykę miłosną. W książce
      pt. ''''[[Eros the Bittersweet]]'''' (1986) prześledziła koncepcję „erosa” w
      starożytnej Grecji poprzez jego reprezentacje w poezji z tamtych czasów{{Cytuj
      |autor = Anne Carson |tytuł = Eros the Bittersweet |data = 1998 |isbn = 1564781887
      |wydawca = Dalkey Archive Press}}.

      == Erotyka współcześnie ==

      W literaturze znaną autorką nawiązującą do tematyki erotycznej i feministycznej
      jest [[Virginie Despentes]], która zarazem kontestuje tradycyjną estetykę sztuki
      erotycznej. Jak sama zadeklarowała: „Piszę w imieniu brzydkich i dla brzydkich,
      starych, schłopiałych, oziębłych, niedorżniętych, pasztetowatych, histerycznych,
      steranych; dla wszystkich, które nie kwalifikują się na rynek super lasek.”{{Cytuj
      |autor = Virginie Despentes |tytuł = Teoria King Konga |data = 2015 |isbn =
      978-83-62206-13-1 |wydawca = Wydawnictwo Feminoteki}} Despentes porusza też
      problem traktowania [[gwałt]]u zarówno w kulturze, jak i w sztuce. Jej wypowiedzią
      na ten temat jest m.in. film pt. „Gwałt” (2000) na podstawie jej powieści pt.
      ''''Baise-moi'''' (1994). Główne role w filmie grały aktorki porno Raffaela
      Anderson i Karen Bach. Tak komentuje swoją wypowiedź artystyczną na ten temat:
      „Upieramy się traktować gwałt tak, jakby był on czymś niezwykłym i rzadkim,
      jakby wykraczał poza seksualną normę, jakby dało się go uniknąć. [...] Tymczasem
      jest całkiem odwrotnie, gwałt znajduje się w samym środku, w samym sercu naszej
      seksualności. Jest to najważniejszy rytuał ofiarniczy, wszechobecny w sztuce
      od czasów starożytnych, pojawiający się w literaturze, na pomnikach i obrazach,
      towarzyszący nam przez wieki. W ogrodach Paryża i w muzeach widzimy przedstawienia
      mężczyzn dopuszczających się gwałtu na kobietach.” W filmie [[King Kong (film
      1933)|King Kong]] (1933) Despentes dostrzega ilustrację erotyki i zmysłowości
      istniejącej poza [[Heteronormatywność|heteronormatywną]] strukturą społeczeństwa,
      rozróżnieniem [[Gender|płci kulturowych]] oraz binarnym podziałem na męskość
      i kobiecość.

      Tematykę zmysłowości, erotyki oraz relacji męsko-damskich i innych podejmuje
      także czeski fotograf [[Jan Saudek]]{{Cytuj |autor = Taschen Publishing; Jan
      Saudek |tytuł = Jan Saudek |data = 2000 |isbn = 83-87112-05-4}}. Saudek wpisuje
      się w nurt [[Fotografia inscenizowana|fotografii inscenizowanej]], gdzie nawiązuje
      się do technik stosowanych w filmie, malarstwie, a przede wszystkim w teatrze{{encyklopedia
      PWN|id = 3902218|tytuł=fotografia inscenizowana|data dostępu=2017-12-27}}. Jak
      pisze Christiane Fricke we wstępie do albumu tego artysty: „Zamiast obserwować
      zachowanie danej osoby i w odpowiednim momencie odsłonić migawkę, Saudek wymyślał
      scenę, a potem zaczynał inscenizować ją przed obiektywem aparatu fotograficznego.
      Saudek na swój sposób kontynuował tradycję „tableau vivant” i „pose plastique”,
      które korzeniami tkwiły w rozrywkach osiemnastowiecznej arystokracji. Przejawy
      tej tradycji są zauważalne na dziewiętnastowiecznych oficjalnych fotografiach
      dzieci królowej Wiktorii”. Na jego fotografiach pojawiają się kobiety i mężczyźni
      w różnym wieku, o różnej budowie ciała; zazwyczaj nago albo półnago, z różnymi
      rekwizytami; fotografowani w suterenie artysty, przy świetle dziennym padającym
      z okna.

      Innym artystą tworzącym głównie [[Fotografia|fotografię]] erotyczną jest Alva
      Bernardine, brytyjski fotograf pochodzący z Grenady. Oprócz fotografii (często
      znacznie przekształcanej w procesie cyfrowej postprodukcji) zajmuje się także
      sztuką wideo. Jego fotografie często podejmują temat uprzedmiotowienia kobiety,
      szczególnie we współczesnej kulturze popularnej; na przykład w cyklu „Forniphilia
      (Human furniture)”, gdzie modelki (rzadziej jest to model płci męskiej) pozują
      w charakterze mebli{{Cytuj |autor = Alva Bernardine |tytuł = Bernardinism |data
      dostępu = 2017-12-27 |url = http://www.bernadinism.com/}}. W podobnej estetyce
      są dzieła [[Annie Sprinkle]]; amerykańskiej artystki, feministki i performerki.
      Podobnie jak Alva Bernardine, nie ma ona akademickiego wykształcenia w dziedzinie
      sztuki{{Cytuj |autor = Annie Sprinkle |tytuł = Annie Sprinkle |data dostępu
      = 2017-12-27 |url = https://web.archive.org/web/20171119110123/http://anniesprinkle.org/}}.

