- sections:
  - content: "[[Plik:Zalipie Chałupa zdobnictwo ludowe.jpg|thumb|[[Zalipie (województwo\
      \ małopolskie)|Zalipie]]. Ściany zewnętrzne [[Chata|chałupy]] ozdobione wzorami\
      \ opartymi na sztuce ludowej.]]\n[[Plik:Skansen w Tokarni. Wnętrze chałupy chłopskiej.jpg|thumb|[[Muzeum\
      \ Wsi Kieleckiej w Kielcach|Skansen w Tokarni]]. Wnętrze chałupy chłopskiej.]]\n\
      [[Plik:Zalipie. Żyrandol w domu malarek.jpg|thumb|Użytkowa sztuka ludowa.]]\n\
      [[Plik:Garncarstwo. Sztuka Ludowa.jpg|thumb|Sztuka ludowa w garncarstwie.]]\n\
      [[Plik:2015 Grupa ukrzyżowania w Bierkowicach.JPG|thumb|Rzeźba o cechach sztuki\
      \ ludowej]]\n[[Plik:Ceramics of Daniel Les.JPG|mały|Ceramika ludowa – Rumunia]]\n\
      '''Sztuka ludowa''' – całokształt działalności artystycznej [[społeczność lokalna|społeczności\
      \ lokalnej]], na ogół [[wieś|wiejskiej]]. Obok twórczości, którą nazywa się\
      \ [[sztuki plastyczne|plastyką]] do sztuki ludowej zalicza się też [[muzyka|muzykę]],\
      \ [[taniec ludowy|tańce]], [[legenda|legendy]], [[bajka|bajki]], [[poezja|poezję]]\
      \ ludową oraz całą artystyczną stronę zwyczajów i [[obrzędy|obrzędów]] ludowych.\
      \ Wszystkie te zjawiska były nierozerwalnie związane ze sobą oraz z życiem wsi\
      \ i tworzyły [[kultura ludowa|kulturę ludową]].\nWytwory sztuki ludowej nie\
      \ są samodzielnymi [[dzieło sztuki|dziełami sztuki]], lecz zawsze pełnią określoną\
      \ funkcję w życiu wsi, a ich wartość artystyczna idzie w parze ze znaczeniem\
      \ użytkowym. Sztuka ludowa zaspokajała istotne potrzeby wsi, a [[chłopi]] w\
      \ ramach gospodarki samowystarczalnej, zdani byli na własną wytwórczość we wszystkich\
      \ dziedzinach życia. Podstawowymi wyrobami [[Rękodzieło|rękodzieła]] ludowego\
      \ są tkaniny, hafty i koronki, [[strój ludowy|stroje ludowe]], wyroby kaletnicze,\
      \ kowalskie i odlewnicze, wyploty ze słomy, wikliny i korzeni, galanteria drewniana,\
      \ meble oraz wyroby garncarskie i ceramiczne.\nOd połowy XIX wieku teoretycy\
      \ sztuki podejmowali problem zanikania rękodzieła w warunkach industrializacji.\
      \ W [[Anglia|Anglii]] byli to [[John Ruskin]] i [[William Morris]], w Niemczech\
      \ [[Walter Gropius]] (idea sztuki życia codziennego).\n== Sztuka ludowa w Polsce\
      \ ==\nWskutek odchodzenia polskiej wsi od własnych upodobań i przejmowania wzorców\
      \ miejskich polska sztuka ludowa zanika. Podejmowane są jednak działania dla\
      \ jej ocalenia, gdyż jako wytwór wielu pokoleń stanowi ona wartość szczególną,\
      \ polską. W przeszłości w obronie polskiej sztuki ludowej stawał [[Cyprian Kamil\
      \ Norwid|Cyprian Norwid]], głoszący konieczność podniesienia sztuki ludowej\
      \ do rangi sztuki [[Naród|narodowej]]. [[Stanisław Witkiewicz]] chciał stworzyć\
      \ sztukę narodową opartą na [[Styl zakopiański|stylu zakopiańskim]], [[Stanisław\
      \ Wyspiański]] sięgał do wątków [[Piastowie|piastowskich]].\nW okresie [[Polska\
      \ Ludowa|Polski Ludowej]] nastąpił rozkwit i moda na sztukę ludową, a dla [[Władza\
      \ ludowa|władzy ludowej]] stała się ona sztuką priorytetową i została otoczona\
      \ szczególną opieką. Na sztuce ludowej opierało się wzornictwo powstałego w\
      \ 1950 r. [[Instytut Wzornictwa Przemysłowego|Instytutu Wzornictwa Przemysłowego]]Praca\
      \ zbiorowa, ''Polska Ludowa. Słownik encyklopedyczny'', Wiedza Powszechna Warszawa\
      \ 1965, s. 370..\nNa pograniczu sztuki ludowej tworzyli malarze prymitywiści.\
      \ Wśród nich najbardziej znani to [[Nikifor Krynicki]], [[Teofil Ociepka]] i\
      \ [[Dorota Lampart]].\nDawniej{{doprecyzuj|data=2015-12|kiedy?}} sztuka ludowa\
      \ zaspokajała niemal wszystkie potrzeby ludności wiejskiej – od kultu i religii\
      \ zaczynając, na codziennych sprzętach i stroju kończąc. Obecnie rozwija się\
      \ najbardziej rzeźba w drewnie, [[malarstwo na szkle]] oraz [[tkanina dekoracyjna]].\
      \ \n== Zobacz też ==\n* [[folklor]]\n* [[sztuka]]\n* [[styl narodowy]]\n* [[Stowarzyszenie\
      \ Twórców Ludowych]]\n* [[Cepelia (CPLiA)|Cepelia]]\n== Przypisy ==\n{{Przypisy}}\n\
      == Bibliografia ==\n* Tadeusz Więckowski, ''Ginące piękno. Artystyczne rękodzieło\
      \ ludowe w Polsce'', Wydawnictwo Spółdzielcze, Warszawa 1987, {{ISBN|83-209-0374-2}}.\n\
      * {{Cytuj książkę |autor = Praca zbiorowa |tytuł = Polska Ludowa. Słownik encyklopedyczny\
      \ |miejsce = Wiedza Powszechna, Warszawa |rok = 1965 |strony = |odn = {{odn/id|Praca\
      \ zbiorowa|1965}}}}\n== Linki zewnętrzne ==\n* [http://www.kurpie.com.pl Kurpiowska\
      \ sztuka ludowa]\n* {{Cytuj stronę | url = http://lowicz.low.pl/lowicz_lowicka_sztuka_ludowa.php3\
      \ | tytuł = Łowicka sztuka ludowa | opublikowany = lowicz.low.pl | archiwum\
      \ = https://web.archive.org/web/20180830025209/http://lowicz.low.pl/lowicz_lowicka_sztuka_ludowa.php3\
      \ | zarchiwizowano = 2018-08-30}}\n* [http://kulturaludowa.pl KulturaLudowa.pl]\
      \ – sztuka, folklor, literatura ludowa w Polsce. Aktualności, relacje, wydarzenia,\
      \ kalendarz imprez\n{{Kontrola autorytatywna}}\n[[Kategoria:Sztuka]]\n[[Kategoria:Folklor]]\n\
      [[Kategoria:Historia chłopów]]"
