- sections:
  - content: "[[Plik:Brassau.jpg|thumb|[[Pierre Brassau]]]]\n[[Plik:Boronali's donkey\
      \ painting a picture.jpg|thumb|[[Sprawa Boronaliego]]]]\n[[Plik:Pockets painting\
      \ art for Martin Gore 1.jpg|thumb|[[Kapucynka (rodzaj)|Kapucynka]] malująca\
      \ obraz]]\n[[Plik:Adler. Utrish Dolphinarium 2.jpg|thumb|[[Białucha arktyczna]]\
      \ malująca obraz]]\n[[Plik:Archer the wine painting horse.png|thumb|[[Koń domowy|Koń]]\
      \ malujący obraz]]\n[[Plik:ThajskySlin.JPG|thumb|[[Słoniowate|Słoń]] malujący\
      \ obraz]]\n[[Plik:Bini and his art.jpg|thumb|[[Królik domowy]] i jego dzieła]]\n\
      [[Plik:Chimpanzee congo painting.jpg|thumb|Obraz namalowany przez [[szympans]]a]]\n\
      [[Plik:UnicornTapestry.jpg|thumb|Obraz namalowany przez [[Pies domowy|psa]]]]\n\
      [[Plik:DGJ 4229 (3728952621).jpg|thumb|Obrazy namalowane przez słonie]]\n[[Plik:Macaca\
      \ nigra self-portrait large.jpg|thumb|„[[Małpie selfie]]” w wykonaniu [[Makak\
      \ czubaty|makaka czubatego]]]]\n'''Sztuka tworzona przez zwierzęta''' – dzieło\
      \ o cechach plastycznych lub rzadziej, dźwiękowych, stworzone przez [[zwierzęta]],\
      \ takie jak [[Małpokształtne|małpy]], [[Słoniowate|słonie]], [[szczur]]y, [[delfin]]y,\
      \ [[ptaki]] i inne, zakwalifikowane jako [[sztuka]] przez człowieka. W ostatnich\
      \ dziesięcioleciach dzieła stworzone przez zwierzęta mnożyły się i dały początek\
      \ międzynarodowemu rynkowi, jednak ich uznanie jako „sztuki” jest ograniczone\
      \ i bardzo kontrowersyjne. Zjawisko to ma konsekwencje prawne, etyczne i moralne,\
      \ które nie są jeszcze dobrze poznane, i powoduje wykorzystywanie i znęcanie\
      \ się nad zwierzętami.\n== Historia ==\nOd [[Starożytność|starożytności]] szereg\
      \ myślicieli przyznawało, że twórczość zwierzęca poprzedza twórczość ludzką\
      \ i że mogą one posiadać poczucie piękna i formy oraz predyspozycje do tworzenia\
      \ dzieł. [[Demokryt]] posunął się nawet do stwierdzenia, że ludzkość uczyła\
      \ się umiejętności naśladując zwierzęta, takich jak śpiew ptaków i tkanie sieci\
      \ przez [[pająki]]{{Cytuj stronę | url = https://revistas.uma.es/index.php/boletin-de-arte/article/view/6126\
      \ | tytuł = Animal Artistic Agency in Performative Interspecies Art in the Twenty-First\
      \ Century | nazwisko = | imię = | autor = Jessica Ullrich | autor link = | data\
      \ = | rok = | miesiąc = | praca = | opublikowany = Boletín de Arte | oznaczenie\
      \ = | strony = | język = en | archiwum = | zarchiwizowano = | id = | cytat =\
      \ | data dostępu = 2024-03-05}}, a za twórcę [[Estetyka ewolucyjna|estetyki\
      \ ewolucyjnej]] uznawany jest [[Charles Darwin]], postulujący, że zwierzęta\
      \ mają poczucie piękna i kojarzenia z sukcesem w [[Dobór płciowy|doborze płciowym]]{{Cytuj\
      \ stronę | url = https://digitalcommons.risd.edu/cgi/viewcontent.cgi?article=1026&context=liberalarts_contempaesthetics\
      \ | tytuł = Animal Aesthetics | nazwisko = | imię = | autor = Wolfgang Welsch\
      \ | autor link = | data = | rok = | miesiąc = | praca = | opublikowany = Contemporary\
      \ Aesthetics (Journal Archive) | oznaczenie = | strony = | język = en | archiwum\
      \ = | zarchiwizowano = | id = | cytat = | data dostępu = 2024-03-05}}. W latach\
      \ dwudziestych XX wieku [[Nadieżda Ładygina-Kots]] badała percepcję kolorów\
      \ i kształtów u [[szympans]]ów, zwracając uwagę na entuzjazm, z jakim rysowały\
      \ ołówkiem i papierem. W latach czterdziestych [[Paul Schiller]] eksperymentował\
      \ z szympansami, namawiając je do uzupełniania wzorów drukowanych na papierze\
      \ i zaobserwował, że wyniki wykazały symetrię i zdolność kontrolowania kompozycji.\
      \ To właśnie badania [[Desmond Morris|Desmonda Morrisa]] z malującym szympansem\
      \ Kongiem, zainaugurowały debatę na ten temat{{Cytuj stronę | url = https://www.eurosa.org/wp-content/uploads/ESA-Proc-10-2018-Luty-2018.pdf\
      \ | tytuł = Do Animals Make Art or the Evolutionary Continuity of Species |\
      \ nazwisko = | imię = | autor = Jerzy Luty | autor link = | data = | rok = |\
      \ miesiąc = | praca = | opublikowany = European Society for Aesthetics | oznaczenie\
      \ = | strony = | język = en | archiwum = | zarchiwizowano = | id = | cytat =\
      \ | data dostępu = 2024-03-05}}. Po opublikowaniu książki ''Biologia sztuki''\
      \ (1962), podsumowującej jego doświadczenia, temat zyskał szeroki rozgłos, a\
      \ Kongo stał się gwiazdą, tworząc około 400 prac. Według Morrisa twórczość szympansa\
      \ charakteryzowała się spójnym wzorem linii, symetrią i doborem kolorów, i że\
      \ podobnie jak ludzie, małpy również mają potrzebę wyrażania siebie estetycznie.\
      \ Morris stwierdził, że wielkie małpy człekokształtne mogłyby, jeśli zostaną\
      \ przeszkolone, tworzyć dzieła, które spełniałyby ważne kryteria sztuki konwencjonalnej,\
      \ takie jak radość z działania, poczucie równowagi kompozycyjnej, kontrola nad\
      \ techniką, zmienność kaligraficzna i tematyczna oraz optymalna [[heterogeniczność]]\
      \ wewnętrzna. Na wolności nie udokumentowano zachowań artystycznych żadnego\
      \ rodzaju małp{{Cytuj książkę | nazwisko = Hansell | imię = Mike | autor link\
      \ = | tytuł = Built by Animals: The natural history of animal architecture |\
      \ wydawca = OUP Oxford | miejsce = | rok = 2007 | strony = 280 | isbn = 978-0-19-157860-1}},\
      \ dlatego Kongo był przypadkiem pod każdym względem niezwykłym, a jego wyjątkowość\
      \ nie miała sobie równych w żadnym innym przypadku malującego zwierzęcia. Za\
      \ tworzenie dzieł nie otrzymywał nagród, nabrał znacznej pewności siebie i zaradności\
      \ technicznej, jasno dawał znać o zakończeniu pracy i odmawiał kontynuowania\
      \ jej nawet za zachętą, wyrażał wielką dezaprobatę, gdy praca została usunięta\
      \ przed ukończeniem, wydając krzyki i agresywnie gestykulując, a jego twórczość\
      \ wykazuje pewną ewolucję stylistyczną na przestrzeni czasu.\nMniej więcej w\
      \ tym samym czasie [[Julian Huxley]] wysłał komunikat do magazynu ''[[Nature]]'',\
      \ w którym opisał aktywność [[goryl]]a w [[London Zoo]], który co najmniej trzykrotnie\
      \ kreślił na ziemi zarys własnego cienia. W tamtym czasie Huxley spekulował,\
      \ że może to dać wskazówki dotyczące pochodzenia ludzkiej sztuki. W tym samym\
      \ czasie niektórzy artyści zaczęli włączać zwierzęta do spektakli, twierdząc,\
      \ że udział zwierząt podnosi jakość przedstawienia, wprowadzając do dyskusji\
      \ koncepcję sztuki jako interakcji społecznej, która niekoniecznie opiera się\
      \ na szczególnej kreatywności, ale na prostych relacje między dwoma lub większą\
      \ liczbą osób. Ta otwartość przyczyniła się do zakwestionowania niektórych tradycyjnych\
      \ wymagań stawianych twórczości artystycznej. W latach 70. ekolog [[Jim Nollman]]\
      \ stworzył piosenki z udziałem [[Indyk zwyczajny|indyków]] i [[wieloryb]]ów.\
      \ W latach 80. wiele ogrodów zoologicznych i instytucji zajmujących się ochroną\
      \ przyrody znajdujących się w trudnej sytuacji finansowej zaangażowało się w\
      \ kampanie mające na celu przekształcenie swoich zwierząt w artystów w celu\
      \ gromadzenia funduszy poprzez reklamę{{Cytuj stronę | url = https://www.cbc.ca/news/entertainment/animal-art-explored-in-ottawa-exhibit-1.827510\
      \ | tytuł = Animal art explored in Ottawa exhibit | nazwisko = | imię = | autor\
      \ = | autor link = | data = | rok = | miesiąc = | praca = | opublikowany = CBC\
      \ News | oznaczenie = | strony = | język = en | archiwum = | zarchiwizowano\
      \ = | id = | cytat = | data dostępu = 2024-03-05}}.\nOd tego czasu liczba artystów\
      \ zajmujących się zwierzętami znacznie wzrosła. Pomimo bardzo słabych dowodów\
      \ naukowych potwierdzających jej konceptualne poparcie oraz braku kontekstu\
      \ historycznego i kulturowego{{Cytuj stronę | url = https://web.english.upenn.edu/~cavitch/pdf-library/Desmond_Animating.pdf\
      \ | tytuł = Displaying Death and Animating Life | nazwisko = | imię = | autor\
      \ = Jane C. Desmond | autor link = | data = | rok = | miesiąc = | praca = |\
      \ opublikowany = University of Chicago Press | oznaczenie = | strony = 173-199\
      \ | język = en | archiwum = | zarchiwizowano = | id = | cytat = | data dostępu\
      \ = 2024-03-05}} począwszy od XXI wieku, legitymizacja sztuki tworzonej przez\
      \ zwierzęta wzrosła i choć pozostaje to kontrowersyjne, niektóre środowiska\
      \ artystyczne domagają się sformułowania estetyki nieantropocentrycznej, otwierają\
      \ nowe obszary badań, wzmacniają związki estetyki z nauką i stawiają nowe pytania\
      \ o funkcje sztuki i doświadczenia artystycznego. Autorzy tacy jak [[Winfried\
      \ Menninghaus]] i [[Wolfgang Welsch]] wnieśli istotny wkład w estetykę ewolucyjną,\
      \ znacznie poszerzając podstawy pozostawione przez Darwina{{Cytuj stronę | url\
      \ = https://lexicon.mimesisjournals.com/international_lexicon_of_aesthetics_item_detail.php?item_id=49\
      \ | tytuł = Non-Human Aesthetics | nazwisko = | imię = | autor = Micaela Latini\
      \ | autor link = | data = | rok = | miesiąc = | praca = | opublikowany = International\
      \ Lexicon of Aesthetics | oznaczenie = | strony = | język = en | archiwum =\
      \ | zarchiwizowano = | id = | cytat = | data dostępu = 2024-03-05}}. Niektóre\
      \ wystawy tych dzieł w szanowanych muzeach i galeriach w różnych krajach również\
      \ podważają długo zakorzenione koncepcje, argumentując, że przynajmniej niektóre\
      \ gatunki zwierząt mają pewne wewnętrzne cechy, które można wyrazić w sztuce\
      \ i są obdarzone szczególnymi umiejętnościami, które należy wziąć pod uwagę.\n\
      Przykładem może być wystawa zorganizowana w 2012 roku przez [[Grant Museum of\
      \ Zoology and Comparative Anatomy]] w [[Londyn]]ie, prezentująca prace różnych\
      \ zwierząt z ogrodów zoologicznych w [[Stany Zjednoczone|Stanach Zjednoczonych]]\
      \ i [[Tajlandia|Tajlandii]]. Propozycja miała zachęcić zwiedzających do zadania\
      \ pytania: „Czy sztuka zwierzęca jest sztuką? Innymi słowy, czy zwierzęta mogą\
      \ być kreatywne?” Dla Jacka Ashby’ego, kustosza muzeum: „Zasadnicze pytanie\
      \ to, czy to naprawdę sztuka. Podczas gdy słonie są szkolone do malowania w\
      \ kółko tego samego, dzieła tworzone przez małpy są znacznie bardziej kreatywne\
      \ i prawie nie do odróżnienia od abstrakcyjnej sztuki ludzi którzy używają podobnych\
      \ technik. Sztukę małp często porównuje się do sztuki dwu-, trzyletnich dzieci”.\
      \ Kurator Mike Tuck powiedział, że „chociaż jest całkiem jasne, że wszelkie\
      \ pojęcie sztuki stworzonej przez zwierzęta jest pojęciem zasadniczo antropomorficznym,\
      \ zaczyna ono rodzić bardzo interesujące pytania dotyczące natury sztuki ludzkiej”{{Cytuj\
      \ stronę | url = https://www.belfasttelegraph.co.uk/news/animal-artists-given-own-exhibition/28708547.html\
      \ | tytuł = Animal artists given own exhibition | nazwisko = | imię = | autor\
      \ = | autor link = | data = | rok = | miesiąc = | praca = | opublikowany = Belfast\
      \ Telegraph | oznaczenie = | strony = | język = en | archiwum = | zarchiwizowano\
      \ = | id = | cytat = | data dostępu = 2024-03-05}}. Jednak Stefan St-Laurent,\
      \ kurator innej wystawy, która odbyła się w [[Ottawa|Ottawie]] w 2009 roku,\
      \ powiedział, że „dla mnie to ta sama stara historia. Właśnie znaleźliśmy nowy\
      \ sposób wykorzystywania zwierząt, ukrywając to pod szlachetną sprawą” i dodał,\
      \ że w pierwszej dekadzie XXI wieku międzynarodowy rynek sztuki zwierzęcej był\
      \ wart około stu milionów [[Dolar amerykański|dolarów]]. Niektóre dzieła zostały\
      \ sprzedane po około 20 tysięcy dolarów za egzemplarz.\nWraz z obchodami 200.\
      \ rocznicy urodzin Charlesa Darwina w 2009 roku i 150. rocznicą publikacji jego\
      \ dzieła ''[[O powstawaniu gatunków]]'' (1859), wystawy i publikacje poświęcone\
      \ sztuce zwierzęcej zaczęły gwałtownie się mnożyć. Prace autorstwa zwierząt\
      \ zasilają obecnie rozwijający się rynek międzynarodowy.\n== Metody tworzenia\
      \ ==\nSztuka tworzona przez zwierzęta jest zawsze efektem współpracy zwierzęcia\
      \ z jego opiekunem lub właścicielem. Ludzki współpracownik porządkuje materiały\
      \ i zapewnia stymulację oraz sprzyjające środowisko. Niektóre zwierzęta przechodzą\
      \ szkolenie w zakresie posługiwania się [[Ołówek|ołówkami]], [[Pędzel|pędzlami]]\
      \ i [[farba]]mi. Innym razem farby nakłada się na [[papier]] lub [[płótno]],\
      \ a zwierzę rozprowadza [[Substancje barwiące|pigment]] ciałem lub kończynami.\
      \ Części jego ciała można zanurzyć w farbie, po czym zachęca się je do zaznaczenia\
      \ podłoża. Ogólnie rzecz biorąc, człowiek interweniuje, dodając więcej farb,\
      \ manipulując podłożem lub wywołując ruchy zwierzęcia w pożądanych kierunkach,\
      \ aby uzyskać różne efekty wizualne. Niektóre zwierzęta z wieloletnią praktyką,\
      \ po zaopatrzeniu w niezbędne materiały, potrafią przeprowadzić cały proces\
      \ bez pomocy. Praca może być wykonana w ramach jednej lub kilku sesji ćwiczeń.\
      \ 99% sztuki tworzonej przez zwierzęta to [[Abstrakcja (sztuka)|abstrakcja]],\
      \ ale niektóre słonie zostały wyszkolone do tworzenia prostych [[Rysunek|rysunków]]\
      \ i [[obraz]]ów, oraz do tworzenia „muzyki” za pomocą [[ksylofon]]ów i [[Bęben\
      \ (muzyka)|bębnów]]{{Cytuj stronę | url = https://www.the-scientist.com/when-i-see-an-elephantpaint-46396\
      \ | tytuł = When I See An Elephant...Paint? | nazwisko = | imię = | autor =\
      \ Graciela Flores | autor link = | data = | rok = | miesiąc = | praca = | opublikowany\
      \ = The Scientist Magazine | oznaczenie = | strony = | język = en | archiwum\
      \ = | zarchiwizowano = | id = | cytat = | data dostępu = 2024-03-05}}.\n== Kontrowersje\
      \ ==\nOprócz silnej [[Antropocentryzm|antropocentrycznej]] tradycji [[Konceptualizacja|konceptualizacji]]\
      \ artystycznej, problemy związane z akceptacją sztuki zwierzęcej są skomplikowane,\
      \ ponieważ zwierzęta zawsze w jakiś sposób zależą od ludzi w zakresie tworzenia\
      \ swoich dzieł, czy to poprzez dostarczanie materiałów, zachętę lub specjalne\
      \ szkolenie. Dla wielu krytyków sztuka zwierzęca jest niczym innym jak efektem\
      \ ukierunkowanego treningu i sprowadza się do mechanicznego zapisu aktywności\
      \ ruchowej bez żadnego związku ze świadomością, wrażliwością, intencją czy właściwie\
      \ wyobrażeniem artystycznym, a jeśli czasem wygląda jak dzieło ludzkich artystów,\
      \ to przez przypadek{{Cytuj książkę | nazwisko = Avital | imię = Tsion | autor\
      \ link = | tytuł = The Confusion between Art and Design: Brain-tools versus\
      \ Body-tools | wydawca = Vernon Press | miejsce = | rok = 2020 | strony = 196-203\
      \ | isbn = 978-1-62273-977-6}}. Zdaniem jednego z tych krytyków, [[Denis Dutton|Denisa\
      \ Duttona]], autora klasycznego dzieła ''The Art Instinct'' (2009), nazywanie\
      \ sztuki zwierzęcej „sztuką czy proto-sztuką to niedopowiedzenie i brak zrozumienia,\
      \ czym sztuka ludzka jest”{{Cytuj książkę | nazwisko = Dutton | imię = Denis\
      \ | autor link = | tytuł = The Art Instinct: Beauty, Pleasure, & Human Evolution\
      \ | wydawca = Oxford University Press | miejsce = | rok = 2009 | strony = 43-56\
      \ | isbn = 978-0-19-953942-0}}. Historyk [[Thierry Lenain]] powiedział, że sztuka\
      \ zwierzęca jest „ludzkim wynalazkiem” i chociaż dzieła zwierząt i ludzi mogą\
      \ pozornie być prawie identyczne, „nigdy nie były i nie mogą być tym samym”{{Cytuj\
      \ stronę | url = https://www.academia.edu/7471785/Anna_Ma%C5%82ecka_Limits_of_the_non_human_in_contemporary_art_PK_XIV_2_2012_English\
      \ | tytuł = Limits of the (non)human in contemporary art | nazwisko = | imię\
      \ = | autor = Anna Małecka | autor link = | data = | rok = | miesiąc = | praca\
      \ = | opublikowany = Academia | oznaczenie = | strony = | język = en | archiwum\
      \ = | zarchiwizowano = | id = | cytat = | data dostępu = 2024-03-05}}.\nObserwuje\
      \ się także, że artyści-zwierzęta są na ogół pozbawieni wolności, mimowolnie\
      \ przemieniają się w artystów, poddawani są surowemu szkoleniu i maltretowaniu,\
      \ aby sprostać oczekiwaniom swoich właścicieli, bardzo rzadko to oni decydują\
      \ o ukończeniu dzieła. Ponadto nigdy nie decydują, czy produkt jest wystarczający\
      \ lub nadaje się do handlu lub wystawy, a ich prace zawsze ostatecznie trafiają\
      \ do ludzkiego systemu sztuki oraz rynku i służą ludzkim celom, ujawniając znacznie\
      \ więcej ludzkich koncepcji i zainteresowań niż wewnętrzne życie zwierząt, dla\
      \ którego sztuka nie miałaby sensu i celu{{Cytuj książkę | nazwisko = Malamud\
      \ | imię = Randy | autor link = | tytuł = Poetic Animals and Animal Souls |\
      \ wydawca = Springer | miejsce = | rok = 2016 | strony = 19-27 | isbn = 978-1-137-06349-6}},\
      \ poza być może zabawowym aspektem tego procesu. Wydaje się, że niektóre zwierzęta\
      \ lubią tę aktywność.\nPonieważ zwierzęta nigdy nie rozpoczynają produkcji bez\
      \ zewnętrznego bodźca lub przymusu, zawsze ma miejsce pewien stopień znęcania\
      \ się lub wykorzystywania zwierzęcia. Istnieją doniesienia, że wiele zwierząt\
      \ zmuszano do wielogodzinnych ćwiczeń dziennie. Obecnie w Tajlandii i [[Indonezja|Indonezji]]\
      \ istnieją prawdziwe „akademie” słoni, które na skalę przemysłową produkują\
      \ dziesiątki tysięcy dzieł rocznie. Najstarszy, Maesa Elephant Camp w Tajlandii,\
      \ działa od 2000 roku. Według informacji z obozu, słonie są trenowane delikatnie\
      \ i uczą się w krótkim czasie, jednak zostało to zakwestionowane przez ekologiczną\
      \ organizację pozarządową [[Born Free Foundation]], która stwierdziła, że zwierzęta\
      \ cierpią przez miesiące znęcania się, łącznie z pozbawieniem pożywienia i karami\
      \ fizycznymi, dopóki nie nauczyły się malować. Sesje malarskie dokumentował\
      \ przyrodnik Desmond Morris, który widział jak [[Tresura|treser]] sprawuje nad\
      \ zwierzęciem całkowitą kontrolę, kierując całą produkcją dzieła poprzez ciągnięcie\
      \ słonia za ucho{{Cytuj stronę | url = https://www.onegreenplanet.org/animalsandnature/why-making-an-elephant-paint-is-cruel-not-cute/\
      \ | tytuł = Painting Elephants? Here’s Why Making an Elephant Paint For Entertainment\
      \ is Cruel, Not Cute | nazwisko = | imię = | autor = Kate Good | autor link\
      \ = | data = | rok = | miesiąc = | praca = | opublikowany = One Green Planet\
      \ | oznaczenie = | strony = | język = en | archiwum = | zarchiwizowano = | id\
      \ = | cytat = | data dostępu = 2024-03-05}}.\nIstnieje szereg aspektów etycznych,\
      \ moralnych i prawnych związanych z tworzeniem, wystawianiem i komercjalizacją\
      \ [[Dzieło sztuki|dzieł sztuki]] wykonanych przez zwierzęta, które nie zostały\
      \ jeszcze dobrze zbadane, obejmujących [[prawa zwierząt]], formy leczenia, znęcanie\
      \ się i cierpienie, prawa autorskie i inne{{Cytuj książkę | nazwisko = Kelch\
      \ | imię = Thomas G. | autor link = | tytuł = Globalization and Animal Law:\
      \ Comparative Law, International Law and International Trade | wydawca = Kluwer\
      \ Law International B.V. | miejsce = | rok = 2017 | strony = 696 | isbn = 978-90-411-5876-5}}.\
      \ Dla [[Randy Malamud|Randy’ego Malamuda]] przekształcanie zwierząt w [[Artysta|artystów]]\
      \ to po prostu kolejny sposób, jaki ludzie odkryli na ich wykorzystywanie i\
      \ oczernianie, odmawiając im nawet statusu zwierząt i niszcząc zrozumienie ich\
      \ prawdziwej natury. Taka sztuka jest jedynie zamaskowanym sposobem szukania\
      \ odkupienia za barbarzyńskie traktowanie zwierząt przez ludzi w ogóle. Wielu\
      \ artystów wykorzystujących zwierzęta w swoich pracach wyraziło obawy, że często\
      \ nawet najlepsze intencje nie wystarczą, aby zapobiec traktowaniu zwierząt\
      \ jako zwykłych narzędzi.\nZ kolei dla Jerzego Lutego i Micaeli Latini podstawowym\
      \ pytaniem współczesnej estetyki jest to, czy da się „sztukę” zredefiniować\
      \ tak, aby pojęcie porzuciło absolutny prymat standardu ludzkiego i mogło wchłonąć\
      \ pracę zwierząt. Wymagałoby to porzucenia wielu przekonań, kategorii estetycznych\
      \ i systemów wartości. Zdaniem Anny Małeckiej, „wśród dziedzin intelektualnej\
      \ aktywności człowieka sztuka ma najdłuższą i najbardziej zaawansowaną tradycję\
      \ przekraczania barier ustanowionych przez antropocentryzm filozoficzny, naukowy\
      \ i religijny”. Zdaniem Kim Hendrickx cała kwestia ustalenia, czy to, co robią\
      \ zwierzęta, jest naprawdę sztuką, jest błędnie ukierunkowana, a ponieważ zwierzęta\
      \ zawsze potrzebują pomocy przy produkcji, dochodzenie powinno skierować się\
      \ w stronę zbadania, w jaki sposób relacja między człowiekiem a zwierzęciem\
      \ może rozwinąć się w nowe aspekty, oraz jaką może to skutkować przemianą dla\
      \ obu stron, wskazując, że gdy zwierzęta są traktowane jako istoty inteligentne,\
      \ badania dają inne wyniki niż wtedy, gdy nie są traktowane w ten sposób{{Cytuj\
      \ stronę | url = https://www.academia.edu/37482206/Speculation | tytuł = Speculation\
      \ | nazwisko = | imię = | autor = Kim Hendrickx | autor link = | data = | rok\
      \ = | miesiąc = | praca = | opublikowany = Academia | oznaczenie = | strony\
      \ = | język = en | archiwum = | zarchiwizowano = | id = | cytat = | data dostępu\
      \ = 2024-03-05}}.\nW przypadku zwierząt trzymanych w [[Ogród zoologiczny|ogrodach\
      \ zoologicznych]] praktykę artystyczną często postrzega się jako sposób na złagodzenie\
      \ stresu związanego z zamknięciem oraz zapewnienie im aktywności i szczęścia{{Cytuj\
      \ stronę | url = https://www.ucl.ac.uk/culture/projects/art-animals | tytuł\
      \ = Art by Animals | nazwisko = | imię = | autor = | autor link = | data = |\
      \ rok = | miesiąc = | praca = | opublikowany = University College London | oznaczenie\
      \ = | strony = | język = en | archiwum = | zarchiwizowano = | id = | cytat =\
      \ | data dostępu = 2024-03-05}}. Docenienie sztuki zwierzęcej, jak zauważyła\
      \ Jessica Ullrich, może prowadzić do uznania, że interakcje między ludźmi i\
      \ zwierzętami rzeczywiście mają potencjał estetyczny, do uznania na szeroką\
      \ skalę etycznych podstaw tych interakcji, a tym samym potencjalnie ulepszonego\
      \ leczenia jakie zwierzęta na ogół otrzymują od ludzi, a także stworzenie narzędzia\
      \ kwestionującego pychę związaną z ludzką wyższością. Dla Jane Desmond inną\
      \ atrakcją dla konsumentów sztuki zwierzęcej jest możliwość nawiązania nieco\
      \ bliskiego kontaktu ze zwierzętami, który w innym przypadku nie byłby możliwy,\
      \ a także może być sposobem na przyczynienie się do projektów [[Ochrona środowiska|ochrony\
      \ środowiska]], ponieważ produkcja dzieł tworzonych przez zwierzęta, ma na celu\
      \ finansowanie celów [[Ekologia|ekologicznych]].\n== Prawa autorskie ==\nW 2011\
      \ roku fotograf przyrody David Slater udał się do Indonezji, aby zrobić zdjęcia\
      \ [[Makak czubaty|makakom czubatym]]. Podczas przygotowań małpa uciekła z aparatem\
      \ i zrobiła kilka zdjęć. Większość zdjęć nie nadawała się do użytku, chociaż\
      \ niektóre były wyraźnymi zdjęciami małpy, które Slater później rozpowszechnił\
      \ jako „[[małpie selfie]]”. Slater przesłał zdjęcia agencji [[Caters News Agency]],\
      \ zakładając, że jest autorem zdjęcia; Slater argumentował, że to jego praca\
      \ i to on wpadł na pomysł, aby pozwolić makakowi bawić się kamerą. „Wiedziałem,\
      \ że małpy najprawdopodobniej to zrobią, i przewidziałem to. Wiedziałem, że\
      \ istnieje ryzyko, że małpy zrobią zdjęcie”. Zdjęcia trafiły do prasy i odbiły\
      \ się szerokim echem. Jego roszczenie dotyczące [[Prawo autorskie|praw autorskich]]\
      \ zostało zakwestionowane przez blog [[Techdirt]], w którym argumentowano, że\
      \ zdjęcie znajduje się w [[Domena publiczna|domenie publicznej]], ponieważ małpa\
      \ nie jest osobą zdolną do posiadania praw autorskich, a Slater nie był w stanie\
      \ zagwarantować sobie praw jako autor zdjęć, ponieważ nie uczestniczył w ich\
      \ tworzeniu{{Cytuj stronę | url = https://www.telegraph.co.uk/technology/news/11015672/Wikipedia-refuses-to-delete-photo-as-monkey-owns-it.html\
      \ | tytuł = Wikipedia refuses to delete photo as „monkey owns it” | nazwisko\
      \ = | imię = | autor = Matthew Sparkes | autor link = | data = | rok = | miesiąc\
      \ = | praca = | opublikowany = The Daily Telegraph | oznaczenie = | strony =\
      \ | język = en | archiwum = | zarchiwizowano = | id = | cytat = | data dostępu\
      \ = 2024-03-05}}.\nZdjęcia zostały także przesłane na witrynę [[Wikimedia Commons]],\
      \ która akceptuje wyłącznie materiały objęte licencją na podstawie licencji\
      \ wolnych treści, a ponieważ zdjęcia wykonało zwierzę, trafiły one do domeny\
      \ publicznej. Slater złożył pozew, twierdząc, że zdjęcia są jego, i zażądał\
      \ ich usunięcia, powołując się na brak pozwolenia, ale [[Wikimedia Foundation]]\
      \ odmówiła usunięcia zdjęć. Mike Masnick opublikował na blogu Techdirt, że absurdem\
      \ było żądanie przez Slatera usunięcia obrazów, biorąc pod uwagę [[fair use]]\
      \ z amerykańskiego prawa autorskiego i że niezależnie od tego, kto je stworzył,\
      \ nie posiada on praw{{Cytuj stronę | url = https://www.techdirt.com/2011/07/12/monkeys-dont-do-fair-use-news-agency-tells-techdirt-to-remove-photos/\
      \ | tytuł = Monkeys Don’t Do Fair Use; News Agency Tells Techdirt To Remove\
      \ Photos | nazwisko = | imię = | autor = Mike Masnick | autor link = | data\
      \ = | rok = | miesiąc = | praca = | opublikowany = Techdirt | oznaczenie = |\
      \ strony = | język = en | archiwum = | zarchiwizowano = | id = | cytat = | data\
      \ dostępu = 2024-03-05}}.\nAutor utworu artystycznego jest technicznie właścicielem\
      \ wykonanego utworu. Analitycy własności intelektualnej Mary M. Luria i Charles\
      \ Swan argumentują, że ani człowiek dostarczający sprzęt używany do stworzenia\
      \ dzieła, ani człowiek będący właścicielem zwierzęcia (w stosownych przypadkach)\
      \ nie może rościć sobie praw autorskich do dzieła zwierzęcia, ponieważ nie jest\
      \ wytworem intelektualnym człowieka i prawa autorskie mogą uzyskać wyłącznie\
      \ ludzie{{Cytuj stronę | url = https://time.com/3393645/monkey-selfie-lands-photographer-in-legal-quagmire/\
      \ | tytuł = Monkey Selfie Lands Photographer in Legal Quagmire | nazwisko =\
      \ | imię = | autor = Olivier Laurent | autor link = | data = | rok = | miesiąc\
      \ = | praca = | opublikowany = Time | oznaczenie = | strony = | język = en |\
      \ archiwum = | zarchiwizowano = | id = | cytat = | data dostępu = 2024-03-05}}.\n\
