- sections:
  - content: '{{przekierowanie|artes liberales|[[artes liberales (ujednoznacznienie)]]}}

      {{Inne znaczenia|systemu edukacji|[[sztuki wyzwolone (film)|''''Sztuki wyzwolone'''']]
      – amerykański film z 2012 roku}}

      [[Plik:Septem-artes-liberales Herrad-von-Landsberg Hortus-deliciarum 1180.jpg|thumb|Siedem
      sztuk wyzwolonych z ''''[[Hortus deliciarum]]'''' [[Herrada z Landsbergu|Herrady
      z Landsbergu]] (ok. 1180)]]

      ''''''Sztuki wyzwolone'''''' ({{greka|ἐγκύκλιος παιδεία}}, {{łac.|artes liberales,
      studia liberalia, disciplinae liberales, artes saeculares, saeculares litterae,
      artes magnae}}) lub ''''''siedem sztuk wyzwolonych'''''' ({{łac.|septem artes
      liberales}}) – system podstawowej, ogólnej i uniwersalnej [[Edukacja|edukacji]]
      ukształtowany w IV wieku przed Chrystusem, powszechnie stosowany w [[Starożytność|starożytnych]]
      [[Starożytna Grecja|Grecji]] i [[Starożytny Rzym|Rzymie]], obejmujący nauczanie
      [[Literatura|literatury]] i [[Matematyka|matematyki]].

      W V i VI wieku sztuki ujednolicono w ten sposób, że na poziomie niższym (''''trivium'''')
      nauczano przedmiotów literackich (gramatyki, [[retoryka|retoryki]] i [[dialektyka|dialektyki]]),
      natomiast na poziomie wyższym (''''quadrivium'''') przedmiotów matematycznych
      (arytmetyki, geometrii, astronomii oraz muzyki). Nazwy tych przedmiotów nie
      odpowiadają poszczególnym naukom w znaczeniu nowożytnym.

      System artes stał się podstawą [[Kształcenie|kształcenia]] w [[Średniowiecze|średniowiecznej]]
      [[Europa|Europie]]. Przeniósł on do kultury [[Chrześcijaństwo|chrześcijańskiego]]
      Zachodu antyczną tradycję naukową i edukacyjną. Między XVII a XIX wiekiem zastąpiono
      go innymi systemami edukacji, lecz przetrwał, w {{link-interwiki|liberal arts
      college|tekst=unowocześnionej formie|Q=Q1377182}}, w szkolnictwie [[Stany Zjednoczone|amerykańskim]].
      Nie był systemem edukacji teoretycznej lub praktycznej, ale systemem edukacji
      [[twórczość|twórczej]]. Jego fundamentalne założenie, że podstawą wykształcenia
      jest zdobycie wiedzy na temat literatury i matematyki, okazało się trwałe i
      jest nadal stosowane w nowożytnym szkolnictwie.

      == Znaczenie terminu ==

      W traktacie ''''{{link-interwiki|O mówcy|Q=Q246289}}'''' [[Cyceron]] wywiódł
      etymologię terminu ''''artes liberales'''' z łacińskiego przymiotnika ''''liber''''
      (wolny){{odn|Gondek|2001|s=1}}. Przeciwstawił sztuki wyzwolone ''''sztukom,
      które nie są godne wolnego człowieka''''{{odn|Gondek|2001|s=1}}. Pomysł ten
      zaczerpnął Cyceron z siódmej księgi ''''[[Polityka (Arystoteles)|Polityki]]''''
      [[Arystoteles]]a{{odn|Abelson|2010|s=10}}. [[Seneka Młodszy|Seneka]], w swoim
      88. {{link-interwiki|Epistulae morales|tekst=liście|Q=Q720535}}, powołując się
      na [[Posejdonios z Rodos|Posejdoniosa]], objaśnił, że ''''studia liberalia''''
      są to takie studia, które ludzie uprawiają dla innych celów niż zdobycie pieniędzy{{odn|Lausberg|2002|s=26}}.
      Nazywane są one wolnymi, bo są ''''godne człowieka wolnego''''{{odn|Curtius|1997|s=43}}.
      Dlatego – twierdził Seneka – do sztuk wyzwolonych nie należą malarstwo, architektura
      i inne sztuki manualne (''''artes mechanicae''''), podczas gdy należy do nich
      muzyka, jako związana z matematyką{{odn|Curtius|1997|s=43}}. Sztuki są nazywane
      wolnymi także dlatego, że prowadzą człowieka do mądrości, która jedyna zapewnia
      prawdziwą wolność{{odn|Lausberg|2002|s=28}}. ''''Zresztą'''' – podsumował swój
      wywód Seneka – ''''jedna jest tylko sztuka naprawdę wyzwolona, która czyni człowieka
      wolnym. To nauka mądrości, wzniosła, nieustraszona, wielkoduszna. Inne są mało
      znaczące i dziecięce''''{{odn|Lausberg|2002|s=28}}. Późniejsi teoretycy [[Pedagogika|pedagogiki]]
      interpretowali twierdzenia Cycerona i Seneki w ten sposób, że nazwa ''''artes
      liberales'''' wskazuje na społeczny kierunek, ku któremu zmierza oparte na nich
      wykształcenie – są one podstawą nauczania i programów edukacyjnych wolnych społeczeństw{{odn|Lausberg|2002|s=27}}.

      Pisarze rzymscy ''''artes liberales'''' przeciwstawiali niekiedy ''''artes serviles''''
      (sztukom niewolniczym) lub ''''artes vulgares'''' (sztukom pospolitym){{odn|Gondek|2001|s=1}}.
      Te poglądy mają swoje źródło w kulturze greckiej, gdzie sztuki wyzwolone uważano
      za niewymagające wysiłku fizycznego, czyli wolne od pracy mięśni{{odn|Gondek|2001|s=1}}.
      Natomiast [[Kasjodor]] uważał, że przymiotnik ''''liberalis'''' wskazuje na
      książkę, z której odczytuje się wiedzę, bowiem łacińskie ''''liber'''' to [[kora]],
      służąca jako materiał do pisania{{odn|Gondek|2001|s=1}}. Używanie terminu ''''artes
      liberales'''' krytykowało wielu [[Filozofia|filozofów]] [[Platonizm|platońskich]]
      i [[Neoplatonizm|neoplatońskich]]. Rozumieli oni artes jako propedeutykę filozofii,
      odpowiednią jedynie dla kształcenia dzieci. Odmawiali sztukom wyzwolonym kwalifikacji
      „wolnościowej”, ponieważ uważali, że przysługuje ona jedynie samej filozofii.
      Dlatego niektórzy starożytni pisarze stosowali termin ''''artes pueriles'''',
      czyli ''''sztuki chłopięce''''{{odn|Lausberg|2002|s=28}}.

      Łacińskie ''''ars'''' wywodzi się z greckiego απο της ’αρετης, oznaczającego
      dobrą znajomość jakiegoś przedmiotu. Sztuki wyzwolone Grecy określali również
      encyklicznymi (εγκυκλος, tworzącymi krąg), czyli zwyczajnymi, gdyż ich opanowanie
      miało zapewniać podstawową wiedzę{{odn|Gondek|2001|s=1}}. ''''Ars'''' nie występuje
      w terminie ''''artes liberales'''' w znaczeniu ''''sztuki'''', tak jak jest
      ona rozumiana w czasach nowożytnych. Oznacza przedmiot nauczania, dyscyplinę
      wiedzy. W starożytnych rozważaniach [[Etymologia|etymologicznych]] łączono rzeczownik
      ''''ars'''' z przymiotnikiem ''''artus'''' (ścisły), gdyż artes miały zamykać
      wiedzę w ścisłych regułach. Późniejsza zmiana znaczenia pojęcia ''''sztuka''''
      wiązana jest z dążeniami XV-wiecznych włoskich malarzy i rzeźbiarzy, którzy
      nie chcieli być dłużej uważani za rzemieślników (''''mechanici''''), ale osoby
      wykształcone w ''''artes''''{{odn|Curtius|1997|s=43–44}}. W roku 1677 przed
      hiszpańskim sądem stanęli malarze, którzy nie chcieli płacić podatków od działalności
      rzemieślniczej, lecz żądali niższych, które przysługiwały osobom wykonującym
      zawody związane z artes liberales. Sąd zwrócił się o opinię do rzeczoznawcy,
      na którego wyznaczono [[Pedro Calderón de la Barca|Calderona]]. Jego wydana
      drukiem opinia, ''''Traktat o obronie szlachetności malarstwa'''', głosiła,
      że ''''artes mechanicae'''' są także sztukami wyzwolonymi, co utrwaliło się
      w późniejszej tradycji europejskiej{{odn|Curtius|1997|s=593}}.

      Łacińskie ''''artes liberales'''' zostały przetłumaczone na język polski – jako
      ''''sztuki wyzwolone'''' – już w średniowieczu i to tłumaczenie jest nadal tradycyjnie
      używane w badaniach naukowych{{odn|Curtius|1997|s=43–44}}.

      == Historia ==

      === Starożytność ===

      ==== Starożytna Grecja ====

      Według [[Źródła historyczne|źródeł]] sprzed IV wieku przed Chrystusem, greckich
      chłopców nauczano [[Wychowanie fizyczne|gimnastyki]] i gry na [[Instrument muzyczny|instrumentach
      muzycznych]]{{odn|Abelson|2010|s=1}}. Autorzy [[Starożytność|starożytni]] twierdzili,
      że twórcą systemu sztuk wyzwolonych był [[Sofiści|sofista]] [[Hippiasz (sofista)|Hippiasz]],
      który żył współcześnie z [[Sokrates]]em. Dodał on do ćwiczeń gimnastycznych
      oraz muzycznych naukę [[Gramatyka|gramatyki]]. Po [[Język grecki klasyczny|grecku]]
      system ten nazwano ἐγκύκλιος παιδεία, co oznaczało ''''zwyczajne wykształcenie''''.
      [[Edukacja]] gramatyczna opierała się w nim na lekturze i analizie [[Utwór literacki|utworów
      literackich]], przede wszystkim dzieł [[Homer]]a{{odn|Curtius|1997|s=42–43}}.
      Grecy nie posiadali [[Święte księgi|ksiąg świętych]] ani odrębnej [[Warstwa
      społeczna|warstwy]] [[Kapłan|kapłańskiej]]. Tradycyjne [[wykształcenie]] związane
      było – w ich pojęciu – z [[Literatura|literaturą]]. Literatura, jako podstawowy
      przedmiot nauczania stała się trwałym elementem artes. W Rzymie Homera zastąpiono
      [[Wergiliusz]]em, w średniowieczu podczas nauki czytano dzieła klasycznych ''''auctores''''{{odn|Curtius|1997|s=42}}.

      Przeciwnikiem oparcia podstawowego wykształcenia na literaturze był [[Platon]].
      Jego zdaniem narzędziem [[Edukacja|edukacji]] dzieci i młodzieży powinny być
      wyłącznie dzieła [[Nauka|naukowe]], a nie literatura. Platon nie tylko zwalczał
      czytanie [[Poezja|poetów]] i [[proza]]ików, ale odrzucał cały model ''''zwyczajnego
      wykształcenia''''. Uważał, że literatura deprawuje uczniów{{odn|Curtius|1997|s=42–43}}.

      Współczesny Platonowi [[Izokrates]] włączył się do sporu między zwolennikami
      kształcenia naukowego a zwolennikami kształcenia literackiego, uznając wagę
      obu tych dziedzin edukacji. Uporządkował je hierarchicznie – studia literackie
      miały być w jego koncepcji przygotowaniem do studiów naukowych. Pomimo tego,
      że niektórzy późniejsi autorzy starożytni zgłaszali zastrzeżenia do koncepcji
      Izokratesa, została ona powszechnie przyjęta i obowiązywała do końca starożytności
      oraz w średniowieczu{{odn|Curtius|1997|s=42–43}}.

      Koncepcja Platona nie została odrzucona całkowicie. Zgodnie z postulatem Izokratesa,
      nie włączono czytania dzieł naukowych do ''''zwyczajnego wykształcenia''''.
      Uznano jednak, że obok literatury niezbędne w edukacji jest nauczanie podstaw
      arytmetyki. Sam Hippiasz był, między innymi, matematykiem i odkrywcą krzywej
      zwanej [[Kwadratrysa|kwadratrysą]]. Zdaniem pisarzy starożytnych, to właśnie
      Hippiasz zmienił tradycyjne ćwiczenia muzyczne w kurs elementarnej arytmetyki.
      Traktował on bowiem muzykę jako dział matematyki omawiający relacje między dźwiękami{{odn|Heath|1981|s=24}}.

      Na podstawie koncepcji edukacji literackiej i matematycznej, w IV wieku, ukształtował
      się klasyczny model podstawowego wykształcenia. Jest on tradycyjnie przypisywany
      Hippiaszowi, chociaż poza wzmiankami u pisarzy starożytnych, nie ma taką tezę
      przekonujących dowodów. Model ten okazał się trwały. Jego fundamentalne założenie,
      zgodnie z którym edukacja powinna być oparta na kursie literatury i matematyki,
      jest nadal stosowane w nowożytnym, europejskim szkolnictwie{{odn|Curtius|1997|s=42}}.

      Późniejsi autorzy greccy twierdzili, że twórcą podziału edukacji na siedem dyscyplin
      był [[Arystoteles]]. Nie ma jednak dowodu potwierdzającego tę tezę. W ''''[[Polityka
      (Arystoteles)|Polityce]]'''' Arystoteles wspomniał jedynie o modelu, zgodnie
      z którym podstawowa edukacja składała się z gramatyki, gimnastyki i muzyki{{odn|Abelson|2010|s=2}}.
      Dodawanie kolejnych przedmiotów do podstawowej edukacji było najprawdopodobniej
      dziełem różnych szkół [[Filozofia|filozoficznych]] i [[Sofiści|sofistycznych]].
      Zachował się spis dyscyplin studiowanych w jednej ze szkół sofistycznych w III
      wieku przed Chrystusem. Były to gimnastyka, gramatyka, muzyka, rysunek, arytmetyka
      i geometria. [[Filon z Aleksandrii]] w swoich dziełach, pisanych na przełomie
      er, wymienił sztuki, których uczono w jego mieście – gramatykę, retorykę, dialektykę,
      muzykę, arytmetykę i geometrię. Na tej podstawie uważa się, że w [[Epoka hellenistyczna|okresie
      hellenistycznym]] zaprzestano ćwiczenia gimnastyki w szkołach{{odn|Abelson|2010|s=3–4}}.
      Teoretycy artes krytykowali przykładanie wagi w edukacji do gimnastyki czy zawodów
      sportowych, gdyż uważali je za dyscypliny nietwórcze. Na przykład [[Seneka Starszy|Seneka]]
      zauważył, że obdarza się zaszczytami państwowymi zawodników igrzysk, lecz nie
      tych, którzy tworzą dzieła sztuk, chociaż wartość tych drugich dla społeczeństwa
      jest nieporównywalnie większa{{odn|Curtius|1997|s=579}}.

      Najstarszy znany zapis wymieniający siedem sztuk wyzwolonych odnaleziono w dziele
      ''''{{link-interwiki|Sztuka gramatyki|Q=Q845904}}'''' [[Dionysios Trak|Dionizego
      Traka]], napisanym na przełomie II i I wieku przed Chrystusem. Dionizy wyliczył
      trzy szkolne przedmioty literackie (gramatykę, retorykę i dialektykę) oraz cztery
      przedmioty matematyczne (geometrię, arytmetykę, astronomię i muzykę){{odn|Gondek|2001|s=1}}.

      ==== Starożytny Rzym ====

      Po [[II wojna punicka|drugiej wojnie punickiej]], na przełomie III i II wieku
      przed Chrystusem, rozpoczął się proces wprowadzania w Rzymie greckiego modelu
      edukacji. W II wieku rzymska młodzież była nauczana w języku greckim przez [[pedagog]]ów
      przybywających do Rzymu z południowej [[Italia (kraina historyczna)|Italii]],
      Grecji i [[Azja Mniejsza|Azji Mniejszej]]. W tym okresie stopniowo tłumaczono
      literaturę i podręczniki greckie na łacinę. W I wieku przechodzono w szkołach
      na [[język ojczysty]] a nauczycielami byli już często rodowici Rzymianie{{odn|Abelson|2010|s=4}}.
      [[Horacy (poeta)|Horacy]] wspominał, że w połowie I wieku uczył się sztuk przez
      lekturę ''''[[Iliada|Iliady]]'''' [[Homer]]a w oryginale, natomiast ''''[[Odyseja|Odyseję]]''''
      przerabiał czytając jej łaciński przekład. Nauczycielem Horacego był nie Grek,
      ale „chętny do bicia” [[Lucjusz Orbiliusz Pupillus]] – [[Ekwici|ekwita]] rodem
      z [[Benewent]]u{{odn|Jurewicz|1986|s=12}}.

      Najstarszym znanym, łacińskim podręcznikiem sztuk, było dzieło [[Marek Terencjusz
      Warron|Marka Warrona]] ''''Disciplinarum libri novem'''', napisane około połowy
      I wieku przed Chrystusem, współcześnie zaginione. Celem, jaki postawił przed
      sobą Warron, było zbudowanie rzymskiego systemu szkolnego, wzorowanego na greckim,
      w którym literaturę grecką – jako podstawę edukacji – zastąpiłaby literatura
      łacińska. Każda z dziewięciu ksiąg dzieła poświęcona była jednemu z przedmiotów
      nauczania. Warron dołączył do greckich siedmiu sztuk dwie nowe – [[architektura|architekturę]]
      oraz [[Medycyna|medycynę]] – i poświęcił im osobne księgi. Innowacja ta nie
      przyjęła się, ale jeszcze [[Cyceron]] i [[Seneka Młodszy|Seneka]] uważali, że
      liczba siedmiu dyscyplin nie jest zamknięta i proponowali jej rozszerzenie{{odn|Abelson|2010|s=4–5}}.

      Ostateczna latynizacja sztuk była dziełem [[Kwintylian]]a{{odn|Abelson|2010|s=5}},
      któremu cesarz [[Wespazjan]] zlecił około roku 75 odnowienie – po okresie upadku
      za [[Neron]]a – rzymskiego szkolnictwa{{odn|Kennedy|2002|s=486}}. Kwintylian
      oparł program nauczania na dziełach Cycerona i [[Wergiliusz]]a. Ich prace miały
      się stać – w koncepcji Kwintyliana – źródłem wiedzy dla uczniów{{odn|Curtius|1997|s=210}}.
      W swoim dziele pedagogicznym, ''''Kształceniu mówcy'''', położył nacisk na gramatykę,
      retorykę i dialektykę, natomiast marginalnie potraktował geometrię, arytmetykę
      i astronomię, o muzyce zaledwie wspominał. To ukształtowało specyfikę rzymskich
      artes okresu [[Cesarstwo Rzymskie|cesarstwa]], w których przedmioty matematyczne
      uważane były za drugorzędne{{odn|Abelson|2010|s=4–5}}. Praktyczni Rzymianie
      uważali, że przydatne w życiu obywatela są gramatyka i retoryka, natomiast matematyka,
      jako nauka teoretyczna, została zredukowana do podstawowych obliczeń arytmetycznych{{odn|Abelson|2010|s=6}}.
      W następnych wiekach, w łacińskich szkołach, poezja Wergiliusza czy mowy Cycerona
      były uznawane za źródło wiedzy na każdy temat, nawet astronomii czy geometrii{{odn|Curtius|1997|s=210–212}}.
      Kurs siedmiu sztuk zwano po łacinie ''''curriculum''''{{odn|Abelson|2010|s=10}}.

      W III wieku rozpoczął się kryzys rzymskiego szkolnictwa. Model ukształtowany
      przez Kwintyliana podporządkowywano bieżącym potrzebom politycznym i społecznym.
      Kryzys dotyczył szczególnie [[Italia (kraina historyczna)|Italii]]. Wiele szkół
      w [[Galia|Galii]], [[Hispania Tarraconensis|Hiszpanii]] czy [[Africa Proconsularis|Afryce]]
      jeszcze w IV wieku zachowywało wysoki poziom kształcenia. W najlepszych szkołach
      tych prowincji nadal nauczano wszystkich siedmiu sztuk, podczas gdy w samym
      Rzymie często ograniczano kształcenie do podstawowej wiedzy gramatycznej{{odn|Abelson|2010|s=6}}.
      Język, którym posługiwano się w połowie IV wieku, był już tak odległy od łaciny
      Wergiliusza i Cycerona, że zaczęto objaśniać dzieła tych pisarzy za pomocą podręczników
      gramatycznych, z których do powszechnego użycia weszły ''''[[Ars minor]]''''
      i ''''[[Ars maior]]'''' [[Eliusz Donat|Donata]]. Pozwoliło to nauczać w klasycznej
      łacinie, gdy język ten zaczął ulegać daleko idącym zmianom{{odn|Leonhardt|2013|s=156}}.

      Reforma rzymskiego systemu edukacji wyszła, w początkach V wieku, ze szkół prowincjonalnych.
      Opierała się na powrocie do równowagi siedmiu sztuk w ujęciu greckim. Dziełem
      programowym tej reformy było ''''{{link-interwiki|O zaślubinach Filologii z
      Merkurym|Q=Q4328829}}'''' [[Marcjanus Kapella|Marcjana Kapelli]]{{odn|Abelson|2010|s=6}}.
      Kapella był Afrykaninem, niechrześcijaninem, który tworzył pomiędzy rokiem 410
      a 439. Jego dzieło było jednym z najpopularniejszych utworów literackich późnej
      starożytności i wywarło wielki wpływ na późniejszą kulturę europejską. Miało
      formę długiego [[Romans (historyczny gatunek literacki)|romansu]], w którym
      autor przeplatał [[Proza|prozę]] z [[Poezja|poezją]]{{odn|Curtius|1997|s=44–45}}.
      Składało się z dziewięciu ksiąg{{odn|Abelson|2010|s=7}}. Romans rozpoczyna się
      od opisów podbojów miłosnych [[Merkury (mitologia)|Merkurego]]. Znużony kawalerskim
      życiem Merkury prosi o radę [[Apollo|Apollina]]. Apollo nakłania Merkurego do
      ożenku z Filologią, która może utemperować jego charakter, gdyż jest śmiertelniczką
      nie tylko olśniewającej urody, ale i wielkiej mądrości. Zgromadzenie bogów na
      [[Parnas]]ie zgadza się na ślub i postanawia uczynić Filologię boginią. Dziewczyna
      zostaje porwana i uniesiona w lektyce do nieba, gdzie jako prezent ślubny otrzymuje
      od [[Junona|Junony]] Siedem Sztuk Wyzwolonych. To siedem kobiet, które miały
      odtąd służyć nowej bogini. Zostały one szczegółowo opisane. Na przykład Gramatyka
      to posługująca się magią staruszka, potomkini [[Ozyrys]]a; natomiast Retoryka
      to piękna, młoda kobieta z bronią w rękach, umiejętnie rażąca wrogów{{odn|Curtius|1997|s=44–45}}.
      W akcję romansu, a zwłaszcza w opis poszczególnych Sztuk, Marcjan wplótł wykład
      szkolny, kończąc go na nocy poślubnej młodej pary, gdy po wielu perypetiach,
      młodzi zakochali się już w sobie{{odn|Stahl|1991|s=227}}.

      Wśród badaczy tej problematyki trwa dyskusja na temat źródeł, na których oparł
      Kapella swój kurs siedmiu sztuk. Pominął Kwintyliana, prawdopodobnym punktem
      wyjścia było dla niego zaginione dzieło Warrona. Uzupełnił je o wiele informacji
      wziętych z dzieł pisarzy greckich{{odn|Stahl|1991|s=41–42}}. Na przykład kurs
      geometrii oparł na ''''[[Elementy Euklidesa|Elementach]]'''' [[Euklides]]a,
      stosując terminologię wcześniej nieużywaną w literaturze łacińskiej. Terminologia
      ta była jego autorstwa lub pochodziła z nieznanego współcześnie przekładu i
      stała się podstawą późniejszej, nowożytnej terminologii matematycznej{{odn|Stahl|1991|s=45}}.
      W astronomii jako pierwszy pisarz łaciński wykazał, że [[Merkury]] i [[Wenus]]
      krążą wokół [[Słońce|Słońca]], a nie [[Ziemia|Ziemi]], przekazując podstawy
      [[heliocentryzm|teorii heliocentrycznej]], którą poznał zapewne z dzieł astronomów
      [[Aleksandria|aleksandryjskich]]{{odn|Stahl|1991|s=236–237}}. Obok dzieła Kapelli,
      w V wieku, powstawało wiele innych prac reformujących sztuki w tym duchu. Inny
      Afrykanin, [[Augustyn z Hippony]], przygotowując się do chrztu napisał podręcznik
      przystosowujący podstawowy kurs do wymogów chrześcijaństwa. Zachowało się z
      niego ''''De grammatica'''' i fragmenty ''''De musica'''', reszta zaginęła{{odn|Stahl|1991|s
      = 7}}. Kolejny Afrykanin, [[Pryscjan]], zbiegł przed [[Wandalowie|Wandalami]]
      do [[Konstantynopol]]a, gdzie kierował szkołą łacińską i napisał szereg podręczników,
      przede wszystkim ''''[[Institutiones grammaticae]]''''{{odn|Curtius|1997|s=458}}.

      Kapella był pierwszym autorem łacińskim, który rozdzielił wyraźnie trzy sztuki
      literackie od czterech sztuk matematycznych, kładąc nacisk na te ostatnie, chociaż
      nie stosował jeszcze późniejszej terminologii podziału na trivium i quadrivium.
      Przedmioty literackie nazywał kursem podstawowym, przygotowującym do zdobycia
      wyższej wiedzy, matematyczno–fizycznej{{odn|Stahl|1991|s=25–26}}. Jego dzieło,
      a także prace innych reformatorów, były używane w szkolnictwie V wieku w Afryce,
      Italii, Galii i Hiszpanii. Zachowało się ponad dwadzieścia rękopisów ''''O zaślubinach''''
      powstałych w tym okresie{{odn|Stahl|1991|s=55–56}}.

      === Średniowiecze ===

      ==== Wczesne średniowiecze ====

      W średniowiecznej Europie sztuki wyzwolone stały się podstawowym modelem edukacji{{odn|Curtius|1997|s=48}}.
      Nazwę ''''septem artes liberales'''' jako pierwszy – w znaczeniu systemu szkolnego
      – użył Kasjodor w ''''De artibus ac disciplinis liberalium litterarum'''', pracy
      która była uzupełnieniem jego wcześniejszych ''''De Institutiones'''', przywołując
      tekst z ''''[[Księga Przysłów|Księgi Przysłów]]'''' (9,1): ''''Mądrość zbudowała
      sobie dom i wyciosała siedem kolumn''''{{odn|Abelson|2010|s=9}}.

      W ówczesnej teorii pedagogiki występowały dwie koncepcje artes: patrystyczna
      i świecko–szkolna{{odn|Curtius|1997|s=45}}. W koncepcji patrystycznej, wywodzącej
      się od [[Hieronim ze Strydonu|Hieronima ze Strydonu]] i [[Augustyn z Hippony|Augustyna
      z Hippony]], erudycja wyniesiona ze szkoły była podstawą dla zrozumienia [[Biblia|Biblii]],
      czytania literatury kościelnej czy np. układania kalendarza. [[Kasjodor]] twierdził,
      że nasiona artes leżały już u początków czasu w Piśmie Świętym i stamtąd przejęli
      je greccy uczeni{{odn|Curtius|1997|s=46–47}}. W koncepcji świecko–szkolnej,
      wywodzącej się od [[Marcjanus Kapella|Marcjana Kappelli]] i [[Anicius Manlius
      Severinus Boethius|Boecjusza]], która nie była jednolita i rozwijała się równolegle
      do patrystycznej, sztuki wynalazł [[Jowisz (mitologia)|Jowisz]] ({{link-interwiki|Gotfryd
      z Viterbo|Q=Q614256}}), Egipcjanie ({{link-interwiki|Bernard Silvestris|Q=Q523113}})
      czy Chaldejczycy ({{link-interwiki|Alexander Neckam|tekst=Neckam|Q=Q1974885}}).
      [[Jan z Salisbury]] upatrywał źródła artes w Naturze. Szkoły prowadzone według
      tej koncepcji kontynuowały starożytny, świecki charakter nauczania{{odn|Curtius|1997|s=47–48}}.
      Podczas edukacji w koncepcji patrystycznej akcent kładziono na nauczanie trivium,
      natomiast w koncepcji świecko–szkolnej na nauczanie quadrivium{{odn|Curtius|1997|s=46–47}}.
      W koncepcji patrystycznej, za Kasjadorem, sztuki wyzwolone traktowano jako przygotowanie
      do studiów [[Teologia|teologii]]{{odn|Abelson|2010|s=9}}, podczas gdy w koncepcji
      świecko–szkolnej, za Boecjuszem, przygotowywano do studiów [[Filozofia|filozofii]]{{odn|Gilson|1987|s=92}}.

      Sztywny podział na kurs podstawowy, obejmujący przedmioty literackie, oraz kurs
      wyższy, obejmujący przedmioty matematyczne – wzorowany na modelu Marcjana Kapelli
      – uwypuklił Boecjusz. Wprowadził on terminy ''''trivium'''' (dla trzech sztuk
      literackich) oraz ''''quadruvium'''' (dla czterech sztuk matematycznych){{odn|Curtius|1997|s=43–44}}.
      ''''Quadruvium'''' zmieniło się w następnych wiekach w ''''quadrivium'''', taką
      nomenklaturę zastosował [[Izydor z Sewilli]], po nim [[Alkuin]] czy [[Hraban
      Maur]]{{odn|Abelson|2010|s=9}}. Termin ''''trivium'''' upowszechnił się w IX
      wieku{{odn|Curtius|1997|s=43}}. Boecjusz wyjaśnił w swoim [[Komentarz (gatunek
      literacki)|komentarzu]] do ''''De interpretatione'''' Arystotelesa, że quadruvium,
      czyli ''''poczwórna mądrość'''', obejmuje badanie natury – ''''jest drogą do
      mądrości, a kto jej nie zna, nie może twierdzić, że kocha mądrość''''. Pozostałe
      trzy dyscypliny, ''''potrójna mądrość'''', są przygotowaniem do właściwego zdobywania
      wiedzy{{odn|Gilson|1987|s=92}}.

      Podstawą średniowiecznego kształcenia artes były podręczniki Marcjana Kapelli,
      Boecjusza, Kasjodora i Izydora z Sewilli. Boecjusz napisał traktaty poświęcone
      każdemu przedmiotowi quadrivium. Oparł je na greckich podręcznikach, współcześnie
      zaginionych{{odn|Curtius|1997|s=55}}. Kasjodor napisał o Boecjuszu: ''''dzięki
      niemu przemówili w języku łacińskim muzyk [[Pitagoras]], astronom [[Klaudiusz
      Ptolemeusz|Ptolemeusz]], arytmetyk [[Nikomachos z Gerazy|Nikomach]], geometra
      [[Euklides]], teolog [[Platon]], logik [[Arystoteles]], mechanik [[Archimedes]]{{odn|Sandys|2011|s=237–238}}''''.
      Kasjodor i Izydor stworzyli dzieła poświęcone wszystkim siedmiu sztukom, opierając
      się autorach łacińskich, głównie [[Cyceron]]ie, [[Kwintylian]]ie i [[Augustyn
      z Hippony|Augustynie z Hippony]]{{odn|Stahl|1991|s=56}}. W ramach kursu literatury
      czytano dzieła autorów klasycznych (''''auctores''''). Około roku 975, w szkole
      do której uczęszczał {{link-interwiki|Walter ze Spiry|Q=Q106642}}, podczas przerabiania
      programu czytano [[Wergiliusz]]a, [[Homer]]a (w łacińskim streszczeniu), Marcjana
      Kapellę, [[Horacy (poeta)|Horacego]], [[Persjusz]]a, Boecjusza, [[Juwenalis|Juwenala]],
      [[Publiusz Papiniusz Stacjusz|Stacjusza]], [[Lukan]]a i [[Terencjusz]]a{{odn|Curtius|1997|s=55}}.

      ==== Późne średniowiecze ====

      [[Plik:Zeven-vrije-kunsten-b.jpg|thumb|Siedem sztuk wyzwolonych, [[Tapiseria|gobelin]],
      ok. 1675]]

      Od końca XI wieku europejskim centrum szkolnictwa stała się Francja{{odn|Curtius|1997|s=62}}.
      Rosnący napływ uczniów do szkół [[Paryż|paryskich]] stworzył potrzeby, z których
      wyrósł tamtejszy [[Uniwersytet Paryski|uniwersytet]]{{odn|Curtius|1997|s=60}}.
      W XIII wieku w paryskim ''''studium generale'''' położono nacisk na nauczanie
      [[Filozofia|filozofii]] oraz [[Teologia|teologii]]. Siedem sztuk zaczęto traktować
      jako wprowadzenie do właściwej nauki. Próbowano ich kosztem znaleźć miejsce
      w programie szkolnym np. dla nauk przyrodniczych, które wówczas wprowadzono
      do programu studiów. Chociaż paryski model nauczania uniwersyteckiego stopniowo
      przyjmował się w wielu miejscach Europy, część szkół wyższych – na przykład
      uczelnie w [[Chartres]] czy [[Oksford]]zie – pozostała przy tradycyjnie rozumianych
      artes liberales{{odn|Curtius|1997|s=62}}. [[Teodoryk z Chartres]] uważał, że
      całe niezbędne wykształcenie można zawrzeć w sztukach wyzwolonych{{odn|Curtius|1997|s=63}}.

      Prymat artes liberales w systemie nauczania podważył [[Tomasz z Akwinu]], który
      uważał je za nieodpowiednie przygotowanie do studiów. Podobne stanowisko przyjęła
      większość [[Tomizm|tomistów]]. Wielu francuskich pisarzy z XV i XVI wieku krytykowało
      artes. [[François Rabelais]] kpił z systemu nauczania, w którym ani jedna godzina
      dnia nie upływa bez wykładów, czytania lub ćwiczeń – kiedy [[Gargantua i Pantagruel|Pantagruel]]
      kończy posiłek, dyskutuje nad właściwościami pokarmów na podstawie dzieł [[Pliniusz
      Starszy|Pliniusza]], [[Arystoteles]]a, czy [[Polibiusz]]a; kiedy spaceruje,
      rozprawia o roślinach cytując [[Teofrast z Eresos|Teofrasta]] lub [[Nikander
      (poeta)|Nikandra]]{{odn|Curtius|1997|s=64}}. W obronie artes stanęło wielu uczonych
      i pisarzy spoza Francji. Wartości sztuk bronił [[Dante Alighieri|Dante]] w ''''[[Boska
      komedia|Boskiej Komedii]]''''{{odn|Curtius|1997|s=606}}. Anglik {{link-interwiki|Jan
      z Garlandii|Q=Q1229700}}, który studiował wpierw w Oksfordzie, a potem w Paryżu,
      twierdził, że szkoły francuskie mają niski poziom nauczania, bo zaniedbują tradycyjne
      metody, zwłaszcza lekceważy się w nich czytanie literatury{{odn|Curtius|1997|s=62}}.

      ==== W Polsce ====

      Najstarsze polskie szkoły sztuk wyzwolonych powstawały przy katedrach biskupich.
      Istnienie krakowskiej [[szkoła katedralna krakowska|szkoły katedralnej]] poświadczone
      jest dla połowy XII wieku, gdy [[scholastyk]]iem był bliżej nieznany Amileusz,
      prawdopodobnie pochodzący z [[Italia (kraina historyczna)|Italii]]. Program
      nauczania obejmował trivium i podstawy quadrivium. Młody [[Wincenty Kadłubek]]
      w ramach trivium uczył się [[Łacina|języka łacińskiego]], [[Retoryka|retoryki]]
      oraz [[Dialektyka|dialektyki]] – kształcił się m.in. w sztuce pisania listów
      oraz dokumentów. Podczas kursu quadrivium nauczano w ówczesnej szkole krakowskiej
      układania kalendarza, wykładano fundamentalne zasady prawne, a także podstawy
      geometrii i muzyki. Zasady [[Arytmetyka|arytmetyki]] poznał Kadłubek – jak wspominał
      później – na podstawie tak zwanej [[tabliczka Pitagorasa|tabliczki Pitagorasa]],
      która pozwalała na obliczanie wyników czterech podstawowych działań{{odn|Stabińska|1973|s=18–19}}.
      Od XIV wieku na [[Uniwersytet Jagielloński|Akademii Krakowskiej]], obok wydziałów
      prawa i medycyny, kontynuowano nauczanie na fakultecie sztuk wyzwolonych. Były
      to studia przygotowujące do dalszego kształcenia, na które absolwenci najczęściej
      wyjeżdżali na uczelnie zagraniczne{{odn|Iwanicki|2016|s=108}}.

      === Nowożytność ===

      [[Plik:A Westerly View of the Colledges in Cambridge New England by Paul Revere.jpeg|thumb|Budynki
      pierwszej szkoły artes liberales w Ameryce, [[Uniwersytet Harvarda|Harvard College]]
      w [[Cambridge (Massachusetts)]]. Grafika [[Paul Revere|Paula Revere]] z 1767
      roku]]

      Sztuki wyzwolone w czasach nowożytnych stały się wzorcem swobody intelektualnej
      podczas zdobywania wiedzy, a także skutecznego kształcenia tradycyjnych cnót
      intelektualnych{{odn|Iwanicki|2016|s=104}}. Wpływ na taki ich wizerunek miały
      idee [[Humanizm|humanistyczne]], [[Liberalizm|liberalne]] i [[Oświecenie (epoka)|oświeceniowe]]
      oraz odmienna ścieżka rozwoju szkolnictwa [[Stany Zjednoczone|amerykańskiego]],
      gdzie artes liberales przybrały nową formę{{odn|Iwanicki|2016|s=106}}. [[Erazm
      z Rotterdamu]] stwierdził: ''''Studium nauk wyzwolonych, oczywiście skromne
      i właściwe, przysparza prawdzie godnej umiłowania wielbicieli bardziej zagorzałych,
      bardziej wytrwałych i stałych, tak że z jeszcze większym zapałem do niej dążą,
      z jeszcze większą uporczywością jej szukają, a na koniec znajdują jeszcze większą
      słodycz w wytrwaniu przy niej''''{{odn|Iwanicki|2016|s=104}}.

      Od XVII wieku sztuki były krytykowane za skostniały, mało twórczy, oderwany
      od rozwijającej się rzeczywistości, a przede wszystkim anachroniczny w świetle
      nowożytnego [[empiryzm]]u, model kształcenia. Między XVII a XIX wiekiem stopniowo
      rezygnowano w krajach europejskich z tego modelu edukacji, zastępując go nowożytnymi
      systemami{{odn|Iwanicki|2016|s=107}}. We Francji nauczanie sztuk przetrwało
      do [[Rewolucja francuska|rewolucji]]{{odn|Gondek|2001|s=3}}. Poszczególne przedmioty
      zostały rozparcelowane i znalazły się w programach nauczania innych dziedzin
      wiedzy pod różnymi nazwami – sztuk pięknych, techniki, czy nauk przyrodniczych{{odn|Gondek|2001|s=4}}.
      Jednak gdy w Europie zaczęto odchodzić od sztuk wyzwolonych, w [[Wielka Brytania|brytyjskich]]
      [[Trzynaście kolonii|koloniach północnoamerykańskich]] zaczęto zakładać w XVII
      wieku ''''{{link-interwiki|liberal arts college|tekst=liberal arts colleges|Q=Q1377182}}'''',
      nawiązujące do modelu nauczania starożytnego i średniowiecznego{{odn|Iwanicki|2016|s=106}}.

      Pierwszą instytucją artes liberales w Ameryce była szkoła, z której rozwinął
      się [[Uniwersytet Harvarda]]. [[John Harvard]] ukończył fakultet sztuk wyzwolonych
      na [[University of Cambridge|Uniwersytecie w Cambridge]], zanim wyemigrował
      do [[Nowa Anglia|Nowej Anglii]], gdzie w tamtejszym [[Cambridge (Massachusetts)|Cambridge]]
      założono college, który miał być później zwany jako [[Uniwersytet Harvarda|Harvard
      College]]. W 2016 roku 239 amerykańskich szkół zostało sklasyfikowanych jako
      „Liberal Arts”. W rankingu za ten sam rok najwyższe pozycje zajęły {{link-interwiki|Berea
      College|Q=Q846859}} (założony w 1855 roku), {{link-interwiki|Harvey Mudd College|Q=Q12236173}}
      (założony w 1955 roku), {{link-interwiki|Amherst College|Q=Q49165}} (założony
      w 1821 roku), {{link-interwiki|Williams College|Q=Q49166}} (założony w 1793
      roku) i {{link-interwiki|Haverford College|Q=Q579611}} (założony w 1833 roku){{odn|Iwanicki|2016|s=106}}.
      W modelu amerykańskim podczas kursu artes stosuje się nauki humanistyczne i
      matematyczno–przyrodnicze w sposób interdyscyplinarny. W Williams College na
      początku XXI wieku nauczano trzech przedmiotów: „Languages and the Arts”, „Social
      Studies” i „Science and Mathematics”. Model ten połączył studia klasyczne z
      nowożytną nauką, np. łacinę z nowoczesną lingwistyką. Na ''''liberal arts colleges''''
      uczy się relatywnie niewielka liczba osób, objętych system opieki naukowej (''''tutoring'''').
      Tutor nadzoruje postęp ucznia, inspiruje do dalszego rozwoju intelektualnego
      poprzez konsultacje, eseje i udział w wydarzeniach naukowych. System ten wzorowano
      na starożytnej i średniowiecznej relacji mistrz–uczeń. Tak rozumiane sztuki
      dają wykształcenie ogólne, przygotowujące do podjęcia studiów specjalistycznych
      w dowolnej dziedzinie wiedzy{{odn|Iwanicki|2016|s=107}}.

      Próby odbudowy artes liberales w Polsce – których ostatnie instytucje rozwiązano
      podczas [[Ziemie Rzeczypospolitej pod zaborami|zaborów]] – rozpoczęły się na
      przełomie XX i XXI wieku, gdy powstały Międzywydziałowe Indywidualne Studia
      Humanistyczne – w 1993 roku na [[Uniwersytet Warszawski|Uniwersytecie Warszawskim]],
      w 2000 roku na [[Uniwersytet Jagielloński|Uniwersytecie Jagiellońskim]], w 2002
      roku na [[Uniwersytet im. Adama Mickiewicza w Poznaniu|Uniwersytecie im. Adama
      Mickiewicza]]{{odn|Iwanicki|2016|s=108}}. Formułę tę rozszerzono wraz z powstaniem
      ''''Akademii „Artes Liberales”'''' w 1999 roku. Założycielami Akademii było
      pięć uniwersytetów – Uniwersytet Warszawski, Jagielloński, [[Uniwersytet Wrocławski|Wrocławski]],
      [[Katolicki Uniwersytet Lubelski Jana Pawła II|Katolicki Uniwersytet Lubelski]]
      oraz Uniwersytet im. Adama Mickiewicza. W roku 2000 do programu dołączyły [[Uniwersytet
      Mikołaja Kopernika w Toruniu|Uniwersytet Mikołaja Kopernika]] oraz [[Uniwersytet
      Śląski w Katowicach|Uniwersytet Śląski]], a w 2003 [[Uniwersytet Marii Curie-Skłodowskiej|Uniwersytet
      Marie Curie-Skłodowskiej]]{{odn|Iwanicki|2016|s=109}}. Na tradycję sztuk wyzwolonych
      – starożytnych, średniowiecznych i amerykańskich – powołuje się Wydział „Artes
      Liberales” na Uniwersytecie Warszawskim, powstały w 2012 roku. W 2016 roku kształciło
      się na nim 170 studentów i 90 doktorantów a pracowało 40 osób{{odn|Iwanicki|2016|s=111}}.

      Model amerykański oraz próby wprowadzenia tego modelu w Europie, wiążą się z
      dążeniem do ocalenia tradycyjnie rozumianego wykształcenia – opartego interdycyplinarnie
      na naukach humanistycznych i matematycznych – poprzez powiązanie systemu edukacji
      z dziedzictwem siedmiu artes{{odn|Curtius|1997|s=606}}. Naukowcy postulujący
      przywrócenie sztuk wyzwolonych jako systemu uniwersalnej i podstawowej edukacji,
      są zazwyczaj zwolennikami nurtu w teorii [[Pedagogika|pedagogiki]] zwanego {{link-interwiki|perenializm|tekst=perenializmem|Q=Q847040}},
      zgodnie z którym podstawowe, sprawdzone modele edukacyjne powinny być uniwersalne
      i niezmienne, ponieważ niezmienna jest natura ludzka. Uważają oni powrót do
      artes liberales za realny środek zaradczy na upadający poziom, ciągle reformowanej,
      nowożytnej edukacji{{odn|Gondek|2001|s=4}}.

      == Zasady pedagogiczne sztuk wyzwolonych ==

      Teoretycy artes liberales posługiwali się [[arystoteles]]owskim podziałem nauk
      na teoretyczne, praktyczne i pojetyczne. Artes uważano za nauki pojetyczne,
      czyli wytwórcze. Celem kształcenia w każdej ze sztuk było opanowanie umiejętności
      tworzenia nowych [[byt]]ów{{odn|Gondek|2001|s=1}} – dzieł ludzkiego rozumu,
      które uzupełniały naturę lub naśladowały ją{{odn|Gondek|2001|s=2}}. Byt taki
      nazywano wytworem sztuk, czyli artefaktem (''''artificium''''). Sztuki nie były
      więc systemem [[Edukacja|edukacji]] teoretycznej lub praktycznej, ale systemem
      edukacji twórczej{{odn|Lausberg|2002|s=19}}.

      Wiedzy i umiejętności niezbędnych dla tworzenia dzieł ludzkiego rozumu uczono
      pod kierunkiem nauczyciela, nazywanego mistrzem (''''magister'''') lub scholastykiem
      (''''scholasticus''''). Mistrz przyjmował ucznia po sprawdzaniu jego uzdolnień
      (''''physis'''') – sztuki wymagały odpowiednich możliwości intelektualnych u
      kandydata, zwanych naturalną dyspozycją (''''ingenio''''). Mistrz nauczał każdego
      w sposób zindywidualizowany (''''curriculum''''), chociaż większość zajęć prowadził
      dla całej, niewielkiej grupy swoich uczniów (''''schola''''){{odn|Lausberg|2002|s=19–20}}.

      Za właściwie nauczaną sztukę uważano celowe działanie, w ramach którego uczeń
      postępował zgodnie z podręcznikowymi regułami (''''praecepta'''') podanymi przez
      mistrza. Działanie błędne, podczas którego nie postępowano według reguł, zwano
      ''''licentia''''. Tego typu działanie mogło doprowadzić do celu jedynie przez
      przypadek, chociaż dopuszczano je – w pewnych okolicznościach – przy tworzeniu
      dzieła [[Poezja|poetyckiego]]. Uczeń wytwarzał swoje szkolne dzieło (''''opus'''')
      uzupełniając naturę (''''scientia'''') lub naśladując naturę (''''imitatio'''')
      poprzez naukę (''''disciplina'''') sposobu działania (''''regula''''). Po opanowaniu
      materiału wszystkich sztuk i wykształceniu odpowiednich umiejętności (''''usus''''),
      absolwent (''''artifex'''') zdobywał ''''facultas'''', czyli stałą dyspozycję
      – możliwość tworzenia dzieł ludzkiego rozumu zawsze i w dowolnych okolicznościach{{odn|Lausberg|2002|s=21–22}}.

      Porządek nauczania (''''cursus'''') przedstawiono w średniowiecznym wierszu
      [[mnemotechnika|mnemotechnicznym]], zmieniając kolejność sztuk dla zachowania
      [[Metrum (poetyka)|metrum]]{{odn|Curtius|1997|s=43}}.

      {{Tekst utworu

      | język 1 = la

      | tekst 1 =

      ''''Gram. loquitur; Dia. vera docet; Rhe. verba ministrat;''''

      ''''Mus. canit; Ar. numerat; Geo. ponderat; as. colit astra{{odn|Curtius|1997|s=43}}.''''

      | język 2 = pl

      | tekst 2 =

      ''''Gramatyka mówi, dialektyka uczy prawdy; retoryka stosuje słowa:''''

      ''''Muzyka śpiewa, arytmetyka liczy, geometria waży, astronomia czci gwiazdy{{odn|Curtius|1997|s=43}}.''''

      }}

      == Kurs sztuk wyzwolonych ==

      [[Plik:Tuebinger Hausbuch Freie Kuenste.jpg|thumb|Siedem sztuk wyzwolonych i
      odpowiadające im planety (''''Tübinger Hausbuch'''', XV w.)]]

      === Trivium ===

      ==== Gramatyka ====

      Gramatyka (''''grammatica'''') była fundamentem sztuk trywialnych oraz pozostałych
      artes. Jej celem było wykształcenie biegłości w posługiwaniu się uniwersalnym
      [[Język literacki|językiem literackim]], który był językiem nauki, państwa i
      religii{{odn|Abelson|2010|s=11–12}}. [[Dante Alighieri|Dante]] określił ją jako
      ''''la prima arte'''' – pierwszą ze sztuk. Nazwa wywodziła się od [[Język grecki
      klasyczny|greckiego]] ''''γράμμα'''', oznaczającego [[pismo]]. Rzymianie używali
      niekiedy – jako [[Łacina|łacińskiego]] przekładu z greki – terminu ''''litteratura'''',
      wyprowadzonego od słowa ''''littera''''. Oba terminy, grecki i łaciński, nie
      dotyczyły w sztukach wyzwolonych gramatyki i literatury w znaczeniu nowożytnym.
      Określenie ''''litteratus'''' (literat) oznaczało człowieka biegłego w sztuce
      gramatyki{{odn|Curtius|1997|s=48}}.

      Dla [[Dionysios Trak|Dionizego Traka]] gramatyka to wiedza wyprowadzona z dzieł
      poetów, wyjaśniająca w jaki sposób należy posługiwać się językiem. [[Diomedes
      Grammaticus|Diomedes]] definiował gramatykę jako racjonalny sposób posługiwania
      się językiem w mowie i piśmie na podstawie reguł pozostawionych w dziełach dawnych
      pisarzy. [[Kasjodor]] twierdził, że celem gramatyki jest zdobycie doświadczenia
      w pięknym mówieniu na podstawie dzieł najznamienitszych poetów. [[Izydor z Sewilli]]
      definiował gramatykę jako sztukę pięknego mówienia. Zdaniem [[Hraban Maur|Hrabana
      Maura]] gramatyka to sztuka interpretacji poetów, a także poprawnego pisania
      i mówienia{{odn|Abelson|2010|s=11–12}}. W XIII wieku [[Roger Bacon]] zauważył,
      że każdy język rodził problemy właściwe dla niego oraz dzielił część tych problemów
      z innymi językami. Drugi rodzaj problemów mógł być badany w sposób naukowy,
      ze względu na ich ogólność. Od czasów Bacona stopniowo kształtowała się [[Gramatyka|gramatyka
      spekulatywna]], która miała za przedmiot właściwe [[intelekt]]owi sposoby [[signifikacja|signifikacji]]
      [[Język (mowa)|mowy]]. Nie była ona jednak częścią sztuk, ale stała się odrębną
      dziedziną wiedzy{{odn|Gilson|1987|s=284–285}}.

      W starożytnych Grecji i Rzymie gramatyka zawierała prawie wyłącznie studium
      [[Literatura|literatury]]. Od III wieku, gdy [[styl potoczny|język]], którym
      mówiono, zaczął się znacznie różnić od klasycznej [[Łacina|łaciny]], kurs literatury
      zaczęto poprzedzać nauką poprawnego posługiwania się językiem. W średniowieczu
      gramatyka składała się z dwóch elementów – nauki mówienia i pisania po łacinie
      oraz studium literatury, połączonego z nauką płynnego czytania tekstów. O ile
      w starożytności kurs gramatyki trwał zazwyczaj rok lub dwa, to w średniowieczu
      przynajmniej trzy albo cztery lata{{odn|Abelson|2010|s=11–12}}.

      Pisania i języka uczono przez zapamiętywanie wpierw [[Litera|liter]], potem
      [[Sylaba|sylab]], a na koniec [[część mowy|części mowy]]{{odn|Curtius|1997|s=50}}.
      Od końca IV wieku kształtował się standard, stosowany później w większości szkół
      średniowiecznych, w ramach którego początkujący uczeń, po opanowaniu liter,
      musiał nauczyć się na pamięć ''''[[Ars minor]]'''' [[Eliusz Donat|Donata]].
      To krótkie dzieło przekazywało informacje na temat łacińskich części mowy w
      formie pytań i odpowiedzi{{odn|Curtius|1997|s=49}}. Podstawowego słownictwa
      łacińskiego nauczano poprzez podawanie [[Analogia|analogii]], [[synonim]]ów
      czy [[Etymologia|etymologii]], np. człowiek to ''''homo'''', ponieważ uczyniony
      został z ''''humus'''', czyli ziemi{{odn|Curtius|1997|s=50}}.

      Po opanowaniu zasad pisowni i języka oraz podstawowego słownictwa, przystępowano
      do nauki czytania. W tym celu nie stosowano w artes specjalnych podręczników,
      ale dzieł poetów. Praca nad utworem poetyckim zazwyczaj składała się z czterech
      etapów: poprawnego technicznie przeczytania wyznaczonego fragmentu (''''emendatio''''),
      przeczytania ze zrozumieniem, czyli z objaśnieniem znaczenia poszczególnych
      słów i [[Rozbiór gramatyczny|rozbiorem zdań]] (''''lectio''''), interpretacji
      całego fragmentu, czyli wyjaśnieniem znaczenia jego treści (''''enarratio'''')
      oraz krytyki tekstu, czyli oceny [[Środki stylistyczne|środków stylistycznych]]
      zastosowanych przez autora (''''iudicium''''){{odn|Abelson|2010|s=11}}. W napisanym
      około 1200 roku wierszu {{link-interwiki|Stefan z Tournai|tekst=Stefana z Tournai|Q=Q1215304}},
      młodego ucznia w poezję wprowadza gramatyka{{odn|Curtius|1997|s=51}}:

      {{Tekst utworu

      | język 1 = la

      | tekst 1 =

      ''''Venit ad Grammatice Poesis hortatum''''

      ''''Ut, quem primum fecerat illa litteratum,''''

      ''''Hec, novem Pyeridum trahens comitatum''''

      ''''Prosa, rhitmo, versibus faciat ornatuum{{odn|Curtius|1997|s=51}}.''''

      | język 2 = pl

      | tekst 2 =

      ''''Na wezwanie Gramatyki przychodzi Poezja,''''

      ''''aby tego, kogo tamta nauczyła sztuki pisania,''''

      ''''ta, prowadząc ze sobą orszak dziewięciu [[Pierydy|Pieryd]],''''

      ''''wyposażyła w umiejętność prozy, rytmu i wiersza{{odn|Curtius|1997|s=51}}.''''

      }}

      [[Środki stylistyczne]], analizowane podczas czytania poezji, zwano w gramatyce
      pozami (''''schemata''''), [[Trop (retoryka)|tropami]] (''''tropi'''') lub [[Figura
      retoryczna|figurami]] (''''figurae''''). Ich znaczenie tłumaczono na przykładzie
      ludzkiego ciała, które wyprostowane posiada mało wdzięku, natomiast różne jego
      pozycje podnoszą wrażenia estetyczne. Figury dzielono na [[figury mowy]] (np.
      [[Anafora (środek stylistyczny)|anafora]]) oraz [[figury myśli]] (np. [[alegoria]]).
      Nauka o środkach stylistycznych była nieco odmienna w różnych okresach i krajach,
      stąd nie ustalono obowiązującej terminologii – w nieco inny sposób wyliczano
      oraz definiowano figury w poszczególnych szkołach{{odn|Curtius|1997|s=50–51}}.

      Podczas kursu gramatyki uczono także podstaw {{link-interwiki|metryka (łacina)|tekst=metryki|Q=Q16153809}}.
      Zaliczenie kursu gramatyki najczęściej wiązało się z napisaniem przez ucznia
      własnego, poprawnie skonstruowanego wiersza. Stąd w literaturze starożytnej
      i średniowiecznej, autorzy piszący prozą często wplatali w swoje dzieła wierszowane
      przerywniki, wykazując się umiejętnościami nabytymi podczas nauki sztuk{{odn|Curtius|1997|s=51}}.
      Wyróżniano trzy rodzaje błędów, które popełniał uczeń piszący poezję: [[barbaryzm]]y
      (używanie słownictwa pochodzącego z innych języków), [[solecyzm]]y (błędy w
      konstrukcji [[Zdanie|zdań]]) oraz {{link-interwiki|metaplazm|tekst=metaplazmy|Q=Q1079559}}
      (odchylenia od normy [[Ortografia|ortograficznej]] lub gramatycznej){{odn|Curtius|1997|s=50}}.

      ==== Retoryka ====

      {{Osobny artykuł|Retoryka}}

      Celem kursu retoryki (''''rhetorica'''') było wykształcenie umiejętności pisania
      i wygłaszania przez ucznia własnych [[Wypowiedź|wypowiedzi]]{{odn|Korolko|1990|s=16}}.
      O ile ukończenie gramatyki wiązało się ze stworzeniem dzieła poetyckiego, to
      retorykę zaliczano na podstawie [[Mowa (retoryka)|mowy]], którą uczeń wygłaszał
      [[Proza|prozą]] – zazwyczaj publicznie{{odn|Curtius|1997|s=50}}. Stąd też podstawowym
      elementem kursu retoryki była nauka jasnego, stosownego i ozdobnego wyrażania
      myśli prozą. Drugim elementem było formowanie postawy religijnej, moralnej,
      społecznej czy politycznej ucznia{{odn|Korolko|1990|s=16}}.

      W większości szkół nauczano retoryki na podstawie analizy dzieł [[Cyceron]]a.
      Uczono się na pamięć mów tego autora, aby potem w praktyce stosować jego sposób
      wysławiania się, [[Argumentacja|argumentację]] czy [[Figura retoryczna|figury
      retoryczne]]. Z jego prac czerpano sposoby umożliwiające przekonanie słuchaczy
      do własnych racji. Poza samymi mowami Cycerona, jako podręczników używano jego
      ''''[[O inwencji]]'''' oraz przypisywaną mu ''''[[Retoryka dla Herenniusza|Retorykę
      dla Herenniusza]]''''{{odn|Curtius|1997|s=68nn}}. Podstawowym podręcznikiem
      w wielu szkołach było też często ''''{{link-interwiki|Kształcenie mówcy|Q=Q3010439}}''''
      [[Kwintylian]]a, bowiem w tym dziele teoria retoryki została zebrana w spójną
      całość, usystematyzowania i jasno wyłożona{{odn|Ziomek|1990|s=83}}.

      Poprawnie sformułowana wypowiedź powinna składać się z pięciu części: [[wstęp]]u
      (''''exordium''''), [[Narracja (retoryka)|narracji]] (''''narratio''''), [[Argumentacja|argumentacji]]
      (''''probatio''''), [[refutacja|refutacji]] (''''refutatio'''') i [[zakończenie|zakończenia]]
      (''''conclusio''''). Uczeń układał swoją wypowiedź w tej właśnie formie{{odn|Korolko|1990|s=79}}.
      Dalej kształcono umiejętność konstruowania poprawnej wypowiedzi w trzech rodzajach
      – uzasadniającym (''''genus deliberativum''''), osądzającym (''''genus iudiciale'''')
      i oceniającym (''''genus demonstrativum''''). Wyjaśniano, że rodzaje te odpowiadają
      ludzkiej skłonności do radzenia lub odradzania, oskarżania lub obrony, a także
      chwalenia lub ganienia. Prawidłowo napisana wypowiedź uzasadniająca dotyczyła
      czasu przyszłego, wypowiedź osądzająca czasu przeszłego, natomiast wypowiedź
      oceniająca czasu teraźniejszego{{odn|Korolko|1990|s=47}}.

      Po opanowaniu przez ucznia części i rodzajów wypowiedzi, nauczano pisania i
      wygłaszania wypowiedzi w trzech stylach – niskim (''''modus humilis''''), średnim
      (''''modus medius'''') lub wysokim (''''modus gravis''''). Wypowiedź należała
      do jednego z tych trzech stylów w zależności od stopnia ozdobności w zakresie
      [[Słownictwo|słownictwa]] i [[Szyk wyrazów|szyku zdań]], nasycenia środkami
      służącymi oddziaływaniu [[Emocja|emocjonalnemu]] (takimi jak [[Figura retoryczna|figury
      retoryczne]] czy [[Metafora|metafory]]) oraz sposobu [[Cursus|rytmizacji tekstu]]{{odn|Korolko|1990|s=49}}.

      ==== Dialektyka ====

      {{Osobny artykuł|Dialektyka}}

      Zadaniem dialektyki (''''dialectica'''') było opanowanie sztuki [[Dyskusja|dyskutowania]]
      na dowolny temat. Dlatego we wstępnej części kursu wykładano zasady poprawnego
      rozumowania, służącego do analizy [[Argument (retoryka)|argumentów]] potwierdzających
      lub kwestionujących udowadnianą w czasie dyskusji [[Teza|tezę]]{{odn|Ziomek|1990|s=96}}.
      Następnie, w formie praktycznego ćwiczenia, prowadzono [[Debata|debaty]], podczas
      których jeden z uczniów starał się [[Argumentacja|udowodnić]] dowolną tezę,
      a drugi ją obalić{{odn|Spranzi|2011|s=1}}. Jako podręcznika używano najczęściej
      IV księgi ''''{{link-interwiki|O zaślubinach Filologii z Merkurym|Q=Q4328829}}''''
      [[Marcjanus Kapella|Marcjana Kapelli]]{{odn|Ziomek|1990|s=96}}, rzadziej ''''[[De
      topicis differentiis]]'''' [[Anicius Manlius Severinus Boethius|Boecjusza]]{{odn|Spranzi|2011|s=47}}.

      Podczas szkolnych debat rozstrzygano problemy zadawane przez nauczyciela. Dzielono
      je na moralne (''''Czy powinno się być posłusznym rodzicom, gdy żądają czynu
      sprzecznego z prawem?)''''{{odn|Rubinelli|2009|s = 5}}, teoretyczne (''''Czy
      historia jest nauczycielką życia?'''') oraz fizyczne (''''Czy świat jest wieczny?''''){{odn|Rubinelli|2009|s
      = 5}}. Problemy formułowano w ten sposób, aby uczeń mógł na nie odpowiedzieć
      „tak” lub „nie”{{odn|Rubinelli|2009|s = 5}}. Debatę rozpoczynał pytający, który
      na podstawie problemu wyznaczonego przez nauczyciela, formułował prostą [[Kwestia
      (dialektyka)|kwestię]]. Odpowiadający wyraża swoje zdanie („tak” lub „nie“)
      – stawiał tezę, a następnie ją uzasadniał. W zależności od tego, którą alternatywę
      wybierał odpowiadający, pytający przyjmował zdanie przeciwne i starał się obalić
      tezę odpowiadającego. W tym celu, pod koniec swojej wypowiedzi, pytający zadawał
      odpowiadającemu kolejne pytanie, w formie wymagającej odpowiedzi „tak” lub „nie”.
      Zależnie od odpowiedzi, pytający kończył, udowadniając sprzeczną naturę tezy
      odpowiadającego{{odn|Rubinelli|2009|s = 5}}.

      Jeżeli odpowiadający odpowiadał „tak” na zadaną kwestię, przedstawiając uzasadnienie
      tezy <math>p,</math> to pytający miał za zadania obalić <math>p.</math> Aby
      to zrobić, musiał znaleźć tezę <math>q,</math> która z jednej strony jest [[konkluzja|wnioskiem]]
      wynikającym z <math>p,</math> ale z drugiej strony jej treść była nie do przyjęcia
      dla odpowiadającego. W tym przypadku odrzucenie <math>q</math> prowadziło do
      obalenia <math>p.</math> Jeżeli natomiast odpowiadający mówił „nie” i uzasadniał
      tezę ¬<math>p,</math> pytający musiał uzasadnić <math>p.</math> Aby to zrobić,
      musiał znaleźć [[twierdzenie]] <math>q,</math> które z jednej strony była niezbędną
      [[Przesłanka|przesłanką]] dla <math>p,</math> a z drugiej którego treść odpowiadający
      powinien zaakceptować. W tym przypadku akceptacja <math>q</math> prowadziła
      do przyjęcia <math>p</math>{{odn|Rubinelli|2009|s = 5}}.

      Debata szkolna była ograniczona czasowo. Pytający przegrywał, gdy nie był w
      stanie obalić tezy w ustalonym czasie, natomiast wygrywał, gdy zdołał szybko
      wyprowadzić poprawne wnioski lub przesłanki z twierdzenia oponenta. Zaliczenie
      kursu dialektyki wiązało się zazwyczaj z wygraniem odpowiedniej liczby debat,
      często o charakterze publicznym{{odn|Rubinelli|2009|s = 6}}.

      === Quadrivium ===

      ==== Arytmetyka ====

      [[Plik:Alciun - computus.jpg|thumb|Obliczenia arytmetyczne [[Alkuin]]a z pracy
      ''''[[De cursu et saltu Lunae ac bissexto]]'''', VIII wiek. Za ''''[[Patrologia
      Latina]]'''', ed. [[Jacques Paul Migne]] 1863, vol. CI, col. 799]]

      Arytmetyka (''''arithmetic'''') była sztuką uczącą przeprowadzania obliczeń,
      stąd zwano ją też liczeniem (''''computus''''){{odn|Abelson|2010|s=94}}. Jej
      nauka składała się z dwóch elementów – arytmetyki teoretycznej i arytmetyki
      praktycznej{{odn|Abelson|2010|s=94}}. W części szkół pomijano wykłady teoretyczne,
      ograniczając naukę do wykształcenia u ucznia umiejętności przeprowadzenia podstawowych
      obliczeń{{odn|Abelson|2010|s=95}}. Większość szkół nauczała arytmetyki na bardzo
      wysokim poziomie{{odn|Abelson|2010|s=93}}. W VII i VIII wieku na synodach [[Anglosasi|anglosaskich]]
      i [[Państwo frankijskie|frankijskich]] wydawano zarządzenia, w myśl których
      nie można było wyświęcić na kapłana osoby, która nie zaliczyła kursu arytmetyki{{odn|Abelson|2010|s=91}}.
      [[Dante Alighieri|Dante]] twierdził, że arytmetyka jest najtrudniejszą, ale
      i najjaśniejszą ze sztuk, gdyż ''''podobnie do Słońca oświetlającego Ziemię,
      daje ona światło wszystkie innym naukom – jak oczy człowieka oślepia blask Słońca,
      tak jego inteligencja jest zbita z tropu nieskończonością liczb''''{{odn|Lewis|1995|s=182}}.

      Źródłem wiedzy [[Matematyka|matematycznej]] w starożytnym Rzymie i średniowieczu
      było dzieło [[Nikomachos z Gerazy|Nikomacha]] ''''Wstęp do arytmetyki'''', napisane
      najprawdopodobniej pod koniec I wieku, w którym podsumowane zostały ustalenia
      greckich uczonych{{odn|Abelson|2010|s=93}}. Praca Nikomacha była podstawą, na
      której swoje podręczniki napisali później [[Marcjanus Kapella|Marcjana Kapella]],
      [[Anicius Manlius Severinus Boethius|Boecjusz]], [[Kasjodor]] czy [[Izydor z
      Sewilli]]{{odn|Abelson|2010|s=95–97}}.

      W przeciwieństwie do sztuk literackich, kurs arytmetyki uległ w średniowieczu
      daleko idącym – w stosunku do starożytności – zmianom{{odn|Abelson|2010|s=94}}.
      Doszło do dwóch zasadniczych przełomów w nauczaniu arytmetyki{{odn|Abelson|2010|s=94}}.
      W X wieku [[Sylwester II|Gerbert z Aurillac]] wprowadził do artes udoskonalony
      [[Abakus (liczydło)|abakus]] oraz nauczanie przeprowadzania [[Dzielenie|dzielenia]]
      w słupkach, pozwalające na obliczenie [[Twierdzenie o dzieleniu z resztą|reszty]].
      W XIII wieku zastąpiono [[Rzymski system zapisywania liczb|cyfry rzymskie]]
      [[Cyfry arabskie|cyframi arabskimi]] oraz wprowadzono cyfrę [[0|zero]]. Te zmiany
      powszechnie się przyjęły i zrewolucjonizowały, w późnym średniowieczu, kurs
      arytmetyki. Dlatego w badaniach nad sztukami wyzwolonymi wyróżnia się trzy okresy
      w nauczaniu arytmetyki: do X wieku, między X a XIII wiekiem oraz po XIII wieku{{odn|Abelson|2010|s=94}}.

      Przez ponad tysiąc lat kurs arytmetyki teoretycznej oparty był na dwutomowym
      ''''[[De institutione artithmetica]]'''' Boecjusza. Znane są liczne przeróbki
      i skróty tej pracy, zachowały się [[Komentarz (gatunek literacki)|komentarze]]
      do niej, napisane przez najwybitniejszych uczonych. Dzieło to było drukowane
      jeszcze w końcu XVI wieku. Było używane jako standardowy wstęp do matematyki,
      nawet po wprowadzeniu cyfr arabskich. Nie miało charakteru podręcznika dla początkujących,
      gdyż nie wyjaśniało technicznych reguł liczenia. Było zbiorem twierdzeń dotyczących
      klasyfikacji i właściwości [[Liczba|liczb]] oraz zasad przeprowadzanie poszczególnych
      operacji matematycznych. Swój wykład zilustrował Boecjusz ponad stu diagramami{{odn|Abelson|2010|s=96}}.

      Wśród podręczników objaśniających techniczne zasady przeprowadzania obliczeń,
      najbardziej obszernym i bardzo często używanym w różnych szkołach było ''''{{link-interwiki|De
      computo|Q=Q1180600}}'''' [[Hraban Maur|Hrabana Maura]], napisane w pierwszej
      połowie IX wieku. Na przykładzie obliczania daty [[Wielkanoc]]y, Hraban w 96
      rozdziałach omówił między innymi [[Grecki system liczbowy|grecką notację arytmetyczną]],
      sposoby przeprowadzenia wszystkich [[Arytmetyka elementarna|czterech działań]]
      na [[Liczby całkowite|liczbach całkowitych]], czy różne metody zapisu tych działań
      za pomocą [[Rzymski system zapisywania liczb|cyfr rzymskich]]. Same obliczenia
      uczeń miał przeprowadzać „w głowie”, posiłkując się odpowiednimi technikami
      używania [[Palec ręki|palców]] lub [[Abakus (liczydło)|abakusa]]{{odn|Abelson|2010|s=97–98}}.
      Różne sposoby liczenia oraz rozwiązywania zadań tekstowych omówił [[Alkuin]]
      w popularnej pracy szkolnej ''''{{link-interwiki|Propositiones ad acuendos iuvenes|Q=Q1741561}}'''',
      napisanej dla najmłodszych adeptów sztuk{{odn|Abelson|2010|s=99}}.

      Pierwszy przełom w nauczaniu arytmetyki związany był z działalnością [[Sylwester
      II|Gerberta z Aurillac]], który w latach 972–982 nauczał w [[Reims]]. Wśród
      jego dzieł charakter podręczników szkolnych miały ''''[[Regulae de abaci numerorum
      rationibus]]'''' oraz ''''[[De numerorum abaci rationibus]]''''. Ze względu
      na prosty i użyteczny sposób wykładu, podręczniki te stosowano przez wiele stuleci.
      Gerbert przedstawił w nich sposoby przeprowadzania [[Dodawanie|dodawania]],
      [[Odejmowanie|odejmowania]] i [[Mnożenie|mnożenia]] za pomocą [[Abakus (liczydło)|abakusa]],
      ulepszające starożytne metody. Zaproponowany przez Gerberta sposób wykonywania
      [[Dzielenie|dzielenia]] w słupkach był nowatorski, pozwalał na obliczenie [[Twierdzenie
      o dzieleniu z resztą|reszty]]. Metoda Gerberta była jednak nadal bardzo skomplikowana
      i w szkołach zalecano zastępowanie dzielenia przez odnalezienie odpowiedniego
      mnożenia{{odn|Abelson|2010|s=101}}.

      Zmienione przez Gerberta zasady liczenia oparte były na zmodernizowanym przez
      niego abakusie. Klasyczny abakus oparty był na [[Dziesiętny system liczbowy|systemie
      dziesiętnym]]. Składał się z kolumn, z których każda odpowiadała kolejnym dziesiątkom.
      W kolumny te wkładano kamyki. Osobna kolumna służyła do odkładania kamieni.
      Do klasycznego abakusa dodał Gerbert linię poziomą, zwaną ''''apices'''', położoną
      nad kolumnami. Linia ta była szczególnie użyteczna podczas wyliczania reszty
      z dzielenia lub działaniach na dużych liczbach. Nowy typ abakusa szybko został
      przyjęty w większości szkół, chociaż operacje na nim były trudniejsze, niż na
      abakusie klasycznym{{odn|Abelson|2010|s=100}}. Powszechne stosowanie ulepszonego
      abakusa w szkolnictwie między X a XIII wiekiem spowodowało, że okres ten zwany
      jest w literaturze naukowej abakusowym{{odn|Abelson|2010|s=101}}.

      W XII wieku w szkołach europejskich toczył się ostry spór między zwolennikami
      [[Cyfry arabskie|arabskiego sposobu liczenia i zapisywania cyfr]] – zwanych
      [[algebraiści|algebraistami]] – a [[abacyści|abacystami]], zwolennikami [[Rzymski
      system zapisywania liczb|tradycyjnych rzymskich cyfr]] i stosowania [[Abakus
      (liczydło)|abakusa]]{{odn|Stabińska|1973|s=24}}. Po ponad stu latach doprowadził
      on do drugiego przełomu w nauczaniu artes. Algebraiści wprowadzili hindusko–arabski
      system notacji, [[Zmienna lokalna|wartość lokalną]], [[0|cyfrę zero]] oraz [[Wyrażenie
      algebraiczne|kombinowane stosowanie cyfr i liter]] przy rozwiązywaniu problemów
      arytmetycznych. Większość szkół przyjęła nowy system obliczeń w XIII wieku.
      Jednak do końca XVI wieku część nauczycieli odrzucała zmiany, nadal zalecając
      notację rzymską i stosowanie abakusa{{odn|Abelson|2010|s=103}}.

      Najstarsze elementy nowego systemu znane są z prac [[Adelard z Bath|Adelarda
      z Bath]], powstałych w początkach XII wieku. Około roku 1140 {{link-interwiki|Jan
      z Sewilli|Q=Q1382696}} napisał podręcznik arytmetyki, który zatytułował ''''[[Algorismus]]''''.
      Podręcznik ten był w następnych dziesięcioleciach wykorzystywany przez algebraistów
      w różnych szkołach europejskich przy wprowadzaniu nowego sposobu liczenia. Podobnie
      zatytułowany podręcznik napisał kilkadziesiąt lat później [[Gerard z Cremony]]{{odn|Abelson|2010|s=104}}.
      Rzadko czytano w szkołach, fundamentalne dla dalszego rozwoju matematyki, dzieło
      [[Fibonacci]]ego ''''[[Liber abaci]]'''' z 1202 roku. Natomiast status podstawowych
      podręczników w następnych stuleciach uzyskały, napisane w pierwszej połowie
      XIII wieku, podręczniki {{link-interwiki|Jordanus Nemorarius|tekst=Jordanusa
      Nemorariusa|Q=Q1232954}}: ''''[[Alghoritmus demonstratus]]'''' (objaśniający
      sposób przeprowadzania obliczeń za pomocą cyfr arabskich) oraz ''''[[Arithmetica
      demonstrata]]'''' (poświęcony arytmetyce teoretycznej){{odn|Abelson|2010|s=105}}.
      Na podstawie dzieł Nemorariusa w późnym średniowieczu ustaliła się nowa terminologia
      szkolna, zgodnie z którą termin arytmetyka odnosił się do arytmetyki teoretycznej,
      zaś obliczenia zwano [[algorytm]]em{{odn|Abelson|2010|s=107}}.

      ==== Geometria ====

      [[Plik:Macrobius DK nks218 4o fol 38v.jpg|thumb|Rysunek kulistej Ziemi na podstawie
      ''''[[Sen Scypiona|Snu Scypiona]]''''. Ilustracja do [[Komentarz (gatunek literacki)|komentarza]]
      [[Ambrozjusz Teodozjusz Makrobiusz|Makrobiusza]] w rękopisie z XII wieku. Kopenhaga,
      Det Kongelige Bibliotek, ms. NKS 218 4°, fol. 38v.]]

      Kurs geometrii (''''geometria'''') w ramach artes był zbliżony do późniejszego
      nauczania [[Geodezja|geodezji]]. Składał się z dwóch części – nauczania [[Geografia|geografii]]
      oraz właściwej [[Geometria|geometrii]]. W niektórych szkołach rozszerzano go,
      na przykład o podstawy [[Biologia|biologii]] czy [[Historiografia|historii]]{{odn|Abelson|2010|s=113}}.
      Większość tekstu podręcznika [[Marcjanus Kapella|Marcjana Kapelli]] zajmowały
      opisy krain, historycznych miejsc i związanych z nimi faktów. Dopiero w ostatnich
      akapitach omówione zostały definicje [[Prosta|linii]], [[trójkąt]]a, [[kwadrat]]u,
      [[Okrąg|okręgu]], [[ostrosłup]]a i [[Stożek (bryła)|stożka]]{{odn|Abelson|2010|s=114}}.
      Natomiast w podręczniku [[Anicius Manlius Severinus Boethius|Boecjusza]] proporcje
      były odwrotne{{odn|Abelson|2010|s=115}}.

      Chociaż w starożytności i średniowieczu niektórzy autorzy byli przeciwnikami
      nauki o kulistości Ziemi, podręczniki jednoznacznie opisywały to zjawisko. Twierdzenie,
      że Ziemia jest kulą, znalazło się między innymi w pracach [[Marcjanus Kapella|Marcjana
      Kapelli]], [[Anicius Manlius Severinus Boethius|Boecjusza]], czy [[Kasjodor]]a.
      Jedynie [[Izydor z Sewilli]], w jednym z miejsc swojego dzieła, opisał ją jako
      okrąg. Szczegóły nauki o kulistości Ziemi opierano przede wszystkim na [[Komentarz
      (gatunek literacki)|komentarzu]] [[Ambrozjusz Teodozjusz Makrobiusz|Makrobiusza]]
      do ''''[[Sen Scypiona|Snu Scypiona]]'''' [[Cyceron]]a{{odn|Lewis|1995|s=141}}.

      Na kuli ziemskiej wyróżniano pięć stref, z których dwie – arktyczna i antarktyczna
      – nie są zamieszkałe z powodu zimna{{odn|Lewis|1995|s=41}}. Między dwiema nadającymi
      się do zamieszkania strefami umiarkowanymi, rozciąga się strefa gorąca, nie
      zamieszkana wskutek żaru{{odn|Strzelczyk|1972|s=155}}. Antypodzi, którzy mieszkają
      w południowej strefie umiarkowanej, nie maja nic wspólnego z mieszkańcami [[Półkula
      północna|półkuli północnej]]. Cały znany i zamieszkały świat umieszczony został
      w tej koncepcji w jednej strefie – północnej umiarkowanej (''''temperata habitabilis''''){{odn|Lewis|1995|s=41}}.
      W niektórych szkołach nauczano nie o pięciu, ale siedmiu strefach, gdy strefę
      gorącą przedzielono rzeką zwaną Oceanem i traktowano jako trzy odrębne strefy{{odn|Strzelczyk|1972|s=155}}.

      Z twierdzeniem o kulistości Ziemi wiązała się nauka o [[Grawitacja|grawitacji]],
      którą nazywano najczęściej ''''przyrodzoną skłonnością Ziemi''''. [[Wincenty
      z Beauvais]] w swoim podręczniku sztuk, napisanym w pierwszej połowie XII wieku,
      analizując grawitację starał się wyjaśnić, co by się zdarzyło, gdyby wywiercić
      dziurę na wylot przez kulę ziemską i wrzucić tam kamień. Jego zdaniem, siła
      grawitacji spowoduje, że kamień zatrzyma się w jądrze Ziemi. W innym średniowiecznym
      podręczniku wyjaśniono: ''''Z każdej części Ziemi, gdziekolwiek mieszkają ludzie,
      czy to na górze, czy to na dole, zawsze się im wydaje, że chodzą bardziej prosto
      niż wszyscy inni. I właśnie tak, jak nam się wydaje, że są pod nami, im wydaje
      się, że my jesteśmy nad nimi''''{{odn|Lewis|1995|s=140}}.

      Źródłem wiedzy [[Geometria|geometrycznej]] w starożytnym Rzymie i średniowieczu
      było dzieło [[Euklides]]a ''''[[Elementy Euklidesa|Elementy]]'''', napisane
      najprawdopodobniej w IV wieku przed Chrystusem. W średniowieczu znano je dzięki,
      opartym na redakcji [[Teon z Aleksandrii|Teona z Aleksandrii]], podręcznikom
      [[Marcjanus Kapella|Marcjana Kapella]], [[Anicius Manlius Severinus Boethius|Boecjusza]]
      i [[Kasjodor]]a. Kurs geometrii prowadzono zazwyczaj posługując się ''''[[De
      institutione geometrica]]'''' Boecjusza. Prawdopodobnie druga księga tego dzieła,
      w wersji znanej współcześnie, została przeredagowana w X wieku, w czasach [[Sylwester
      II|Gerberta z Aurillac]], gdyż zawiera fragmenty, w których wyjaśniono zasady
      stosowania zmodernizowanego [[Abakus (liczydło)|abakusa]] do obliczeń geometrycznych.
      W szkołach uczono definicji różnych [[Figura geometryczna|figur geometrycznych]]
      oraz obliczania [[Pole powierzchni|powierzchni]] [[trójkąt]]ów, [[prostokąt]]ów,
      [[wielokąt]]ów oraz [[Okrąg|okręgów]]. Typowym zadaniem z podręcznika Boecjusza
      było wykreślenie [[Trójkąt równoboczny|trójkąta równobocznego]] z [[Prosta|linii]]
      o określonej długości i obliczenie powierzchni nowej figury{{odn|Abelson|2010|s=115}}.

      W roku 1120 [[Adelard z Bath]] przetłumaczył z [[Język arabski|arabskiego]]
      na łacinę wszystkie księgi ''''[[Elementy Euklidesa|Elementów]]'''', w roku
      1188 niezależnego tłumaczenia dokonał [[Gerard z Cremony]], co w XIII wieku
      doprowadziło do przełomu w nauczaniu geometrii{{odn|Abelson|2010|s=116}}. W
      najlepszych szkołach podczas kursu stosowano ''''[[Practica geometriae]]''''
      [[Fibonacci]]ego z 1222 roku, ''''[[De traingulis]]'''' {{link-interwiki|Jordanus
      Nemorarius|tekst=Jordanusa Nemorariusa|Q=Q1232954}} z około 1237 roku czy ''''[[De
      geometria speculativa]]'''' [[Thomas Bradwardine|Thomasa Bradwardine]] z około
      1327 roku{{odn|Abelson|2010|s=118}}. Podręczniki te wprowadziły do artes między
      innymi [[układ współrzędnych]] czy naukę o [[Perspektywa|perspektywie]]{{odn|Abelson|2010|s=117}}.

      ==== Astronomia ====

      [[Plik:Martianus Capella, Cosmography.jpg|thumb|Rysunki [[Model kosmologiczny|modelu]]
      [[wszechświat]]a w ''''Rękopisie florenckim'''' ''''{{link-interwiki|O zaślubinach
      Filologii z Merkurym|Q=Q4328829}}'''' [[Marcjanus Kapella|Marcjana Kapelli]],
      najprawdopodobniej z początku XI wieku. [[Florencja]], [[Biblioteka Laurenziana|Biblioteca
      Medicea Laurenziana]], San Marco 190, fol. 102 r.]]

      Kurs astronomii (''''astronomia'''') obejmował nauczanie matematycznych sposobów
      mierzenia i obliczania [[czas]]u ([[Komputystyka|komputystykę]]), wyjaśnienie
      struktury [[wszechświat]]a ([[Kosmologia|kosmografię]]) oraz [[Obserwacja (metoda
      badawcza)|obserwację]] [[Sfera niebieska|nieba]] widzianego z Ziemi{{odn|Stahl|1991|s=172}}.

      W większości szkół do zaliczenia astronomii wystarczało zdobycie umiejętności
      układania [[kalendarz]]a{{odn|Abelson|2010|s=122}}. Podstawowym podręcznikiem,
      który wykorzystywano, było ''''{{link-interwiki|De temporum ratione|Q=Q720948}}''''
      [[Beda Czcigodny|Bedy]] z 725 roku{{odn|Abelson|2010|s=97}}. Współczesny kalendarz
      został w zasadzie wypracowany na potrzeby kursu sztuk. Uczniowie układali go
      na tak zwanych [[Tablica paschalna|tablicach paschalnych]]{{odn|Szymański|1983|s=130}}.
      Wpierw ustalano dzień [[Wielkanoc]]y na podstawie [[cykl księżycowy|cyklu księżycowego]]
      (235 [[Miesiąc synodyczny|miesięcy księżycowych]]), na który składało się 19
      [[Rok zwrotnikowy|lat słonecznych]]. Po wykonaniu odpowiednich obliczeń, przez
      kombinację {{link-interwiki|Cykl słoneczny (kalendarz)|tekst=cyklu słonecznego|Q=Q676397}}
      (28 lat) z cyklem księżycowym uczeń wyliczał [[cykl paschalny]] (532 lata),
      po upływie którego [[Faza Księżyca|fazy Księżyca]] przypadają na te same dni
      roku i tygodnia. Kolejny zabieg dotyczył ustalenia {{link-interwiki|Epakta|tekst=epakty|Q=Q376317}}
      dla [[Równonoc wiosenna|równonocy wiosennej]]. Data Wielkanocy regulowała układ
      konkretnego roku, który należało – wychodząc od niej – podzielić na [[tydzień|tygodnie]].
      Obliczenia te były skomplikowane astronomicznie i arytmetycznie{{odn|Szymański|1983|s=131–132}}.

      Szczegóły [[Teoria geocentryczna|teorii]] [[Klaudiusz Ptolemeusz|Ptolemeusza]]
      wykładano przede wszystkim na podstawie VIII księgi ''''{{link-interwiki|O zaślubinach
      Filologii z Merkurym|Q=Q4328829}}'''' [[Marcjanus Kapella|Marcjana Kapelli]].
      Na ten podręcznik powoływał się jeszcze [[Mikołaj Kopernik|Kopernik]] w XVI
      wieku{{odn|Stahl|1991|s=175}}. W lepszych szkołach używano [[Astrolabium|przyrządów
      astronomicznych]] do prowadzenia własnych pomiarów{{odn|Abelson|2010|s=124}}.
      Starożytna i średniowieczna astronomia oparta była na obliczeniach [[Matematyka|matematycznych]]{{odn|Lewis|1995|s=103}}.
      Jak twierdził [[Tomasz z Akwinu]], podczas kursu astronomii ''''daje się opis
      kół ekscentrycznych i epicyklów na tej podstawie, że jeżeli się robi założenie
      ich istnienia, dostrzegalne zmysłami pozory dotyczące ruchów niebieskich mogą
      zostać zachowane. Ale nie jest to ścisły dowód, ponieważ być może dałyby się
      one również zachować przy odmiennym założeniu''''. Stąd w części szkół średniowiecznych
      nigdy nie odrzucono całkowicie [[Heliocentryzm|modelu heliocentrycznego]]. Teoria
      Kopernika nie wywołała w sztukach sprzeciwu, gdyż traktowano ją jako uzasadnioną
      matematycznie [[Hipoteza|hipotezę]]. Sprzeciw wywołał dopiero [[Galileusz]],
      który nalegał, aby hipotezę Kopernika traktować jako jedyny prawdziwy opis wszechświata{{odn|Lewis|1995|s=30}}.

      Zgodnie z dominującym [[Model kosmologiczny|modelem]] nauczano, że [[wszechświat]]
      jest kulisty. Jedynie Ziemia, znajdująca się w jego centrum, pozostaje nieruchoma.
      Wszystkie inne części wszechświata znajdują się w ciągłym [[Ruch (fizyka)|ruchu]]{{odn|Stahl|1991|s=176}}.
      Ziemia jest otoczona grupą obracających się [[Kula|kul]], obejmujących jedna
      drugą. Kule te nazywano {{link-interwiki|Sfery niebieskie|tekst=sferami|Q=Q4119786}}
      (''''sphaerae''''), niebiosami (''''coela''''), elementami (''''elementa'''')
      lub kręgami niebieskimi (''''orbes celestes''''){{odn|Lewis|1995|s=97}}. Każda
      z tych sfer ma swoje [[Biegun niebieski|bieguny]] oraz [[oś obrotu]]{{odn|Stahl|1991|s=177}}.
      Sfery wypełnia [[Eter (filozofia)|pustka]] (''''eter''''). W każdej z pierwszych
      siedmiu sfer znajduje się jedno [[Planeta|świecące ciało niebieskie]] (''''planeta'''').
      W kolejności są to [[Księżyc]], [[Merkury]], [[Wenus]], [[Słońce]], [[Mars]],
      [[Jowisz]] i [[Saturn]]. Sferę Saturna obejmuje kolejna kula, sfera [[Gwiazdy
      stałe|gwiazd stałych]] (''''stellatum''''), w której znajdują się wszystkie
      gwiazdy. Ostatnią jest {{link-interwiki|sfera pierwszego ruchu|Q=Q387258}} (''''primum
      mobile''''). Nie zawiera ona żadnego świecącego ciała niebieskiego, a o jej
      istnieniu wnioskowano z ruch pozostałych sfer – ruch ten bez hipotezy dodatkowej
      sfery nie miałby swojej przyczyny{{odn|Lewis|1995|s=97}}.

      We wszechświecie wyróżniano dwie strefy, {{link-interwiki|Sfera podksiężycowa|tekst=podksiężycową|Q=Q3359073}}
      i [[Sfera pozaksiężycowa|pozaksiężycową]]. Granicą między nimi jest [[Księżyc]].
      W podręcznikach wyjaśniano, że w każdej z tych stref obowiązują inne [[Prawa
      fizyki|prawa]]. W świecie podksiężycowym występuje [[atmosfera]], a [[byt]]ami
      [[byt ożywiony|ożywionymi]] i [[byt nieożywiony|nieożywionymi]] rządzi [[grawitacja]],
      [[Indeterminizm|przypadkowość]] i zmienność. Natomiast w świecie pozaksiężycowym
      występuje [[próżnia]], a istniejące tam byty podlegają {{link-interwiki|Wieczny
      ruch|tekst=wiecznemu ruchowi|Q=Q7169553}}, [[Determinizm|konieczności]] oraz
      [[Niezmienność nieba|niezmienności]]{{odn|Lewis|1995|s=109}}.

      Wszechświat nie jest [[Nieskończoność|nieskończony]]. Za [[Arystoteles]]em i
      [[Marcjanus Kapella|Marcjanem Kapellą]] nauczano, że za ostatnią sferą ''''
      nie ma ani miejsca, ani pustki, ani czasu. Dlatego cokolwiek tam jest, jest
      takiego rodzaju, że nie zajmuje przestrzeni, ani nie podlega czasowi''''. Poza
      granicą wszechświata załamuje się [[Czasoprzestrzeń|czasoprzestrzenny]] sposób
      myślenia człowieka. Gdy [[Dante Alighieri|Dante]] przekracza tę granicę, [[Beatrice
      Portinari|Beatrycze]] mówi mu: ''''Duch nasz promienisto z najwyższych światów
      sfery, w ono wnika niebo, co jeno jest światłością czystą, światłością myśli
      pełną ukochania''''{{odn|Lewis|1995|s=97}}.

      ==== Muzyka ====

      Muzyka (''''musica'''') była sztuką nauczaną prawie wyłącznie teoretycznie,
      uważaną za rozszerzenie arytmetyki{{odn|Abelson|2010|s=128}}. W ramach kursu
      muzyki wprowadzano różne nowe pojęcia matematyczne, na przykład [[Ułamek|ułamki]]{{odn|Stahl|1991|s=214}}.
      Sztukę tę określano niekiedy zgodnością (''''harmonia''''), gdyż jej celem było
      wykazanie harmonii świata opisanego liczbami. Taka koncepcja wywodziła się z
      filozofii [[Platonizm|platońskiej]] i [[Neoplatonizm|neoplatońskiej]]{{odn|Stahl|1991|s=204–205}}.
      Często w tym kontekście cytowano w średniowieczu [[Chalcydiusz]]a, który w [[Komentarz
      (gatunek literacki)|komentarzu]] do ''''[[Timajos (dialog)|Timajosa]]'''' [[Platon]]a,
      stwierdził, że nauka ''''nie dotyczy tej muzyki, która cieszy plebejuszy, ale
      owej boskiej muzyki, która nigdy nie odstępuje od rozumienia i rozumu''''{{odn|Lewis|1995|s=61}}.
      Nie kształcono więc podczas kursu muzyki umiejętności śpiewu czy gry na instrumencie.
      Wyjątkiem były niektóre średniowieczne [[szkoła klasztorna|szkoły klasztorne]]
      lub [[szkoła katedralna|katedralne]], w których przysposabiano uczniów do uczestnictwa
      w [[Liturgia godzin|officium]]. Terminy muzyka i muzyk, we współczesnym znaczeniu,
      ukształtowały się dopiero w XVI wieku{{odn|Abelson|2010|s=128}}.

      Pierwsza część kursu poświęcona była historii i znaczeniu muzyki, przedstawianej
      jako uniwersalny język ludzkości i całego wszechświata{{odn|Abelson|2010|s=133}}.
      Wszechświat, zgodnie z tą koncepcją, opisywano jako przestrzeń ogromną, ale
      nie milczącą – tworzącą poprzez swoją matematyczną harmonię dźwięk (''''tonus''''){{odn|Lewis|1995|s=113}}.
      Następnie, wyjaśniając zjawisko harmonii, wprowadzano pojęcie matematycznej
      [[Proporcja (arytmetyka)|proporcji]] (''''ratio, analogia'''') oraz wynikające
      z niej zjawiska [[dysonans]]u (''''asymphonia'''') i [[konsonans]]u (''''symphonia'''').
      Zjawiska te tłumaczono nie tylko na przykładzie muzyki, ale także literatury,
      astronomii, czy geometrii. W drugiej części kursu z twierdzeń o proporcjach
      wyprowadzano pojęcie ułamka (''''fractio''''). Uczono działań na ułamkach, skupiając
      się przede wszystkim na dzieleniu. Notacja stosowana podczas nauki była odmienna
      w różnych epokach i krajach, opierała się jednak zawsze na literach greckich
      lub łacińskich{{odn|Abelson|2010|s=133}}.

