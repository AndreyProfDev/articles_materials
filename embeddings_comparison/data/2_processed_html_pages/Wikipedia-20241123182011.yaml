- sections:
  - content: "[[Plik:Maenads Dancing about a xoanon of Dionysos, drawing after exterior\
      \ of an Attic red-figure kylix (8270482470).jpg|thumb|[[Menady]] tańczące wokół\
      \ ksoanonu [[Dionizos]]a (przerys z [[kyliks|czary]] attyckiej)]]\n[[Plik:Artemis,\
      \ bronze sheet, 7th c BC, Museum Brauron, Bram10.jpg|thumb|200px|Okładzina ksoanonu\
      \ wykonana z blachy brązowej (VII w. p.n.e.)]] \n'''Ksoanon''' ([[język starogrecki|stgr.]]\
      \ ξόανον xóanon, [[liczba mnoga|lm]] ξόανα xóana) – najstarszy typ [[starożytna\
      \ Grecja|starogreckiego]] posągu kultowego wyciosany z drewna i dekorowany szatami''Słownik\
      \ kultury antycznej. Grecja – Rzym'' (red. [[Lidia Winniczuk|L. Winniczuk]])..\n\
      Prymitywnie wykonany z drewna (w postaci słupa lub deski) wizerunek bóstwa,\
      \ przystrajany był szatami bądź skórami, rzadziej zbroją. Wyodrębnioną i osobno\
      \ opracowaną głowę ozdabiano twarzową maską ludzką z [[terakota|terakoty]],\
      \ a później z kamieniaGuy Rachet: ''Słownik cywilizacji greckiej''.''Encyklopedia\
      \ sztuki starożytnej''.. Zaliczane do [[sztuka grecka w okresie archaicznym|wczesnoarchaicznych]]\
      \ przykładów rzeźby greckiej, najwcześniejsze ksoanony były zapewne z grubsza\
      \ obrobionymi klocami drewnianymi mającymi przedstawiać ziemską postać bóstwa,\
      \ które później ozdobnie obijano blachą; z biegiem czasu (od VIII w. p.n.e.)\
      \ nabrały one cech rzeźby przedstawiającej. Utrwalony, charakterystyczny typ\
      \ przedstawienia wyobrażał postać ludzką o złączonych nogach i rękach przywartych\
      \ do tułowia, odziewaną w ściśle przylegającą szatę. Ten typ najpewniej reprezentowały\
      \ też najstarsze (niezachowane) wersje posągów [[Hera z Samos|Hery z Samos]]\
      \ i [[świątynia Artemidy w Efezie|Artemidy Efeskiej]]Krystyna Zwolińska, [[Zasław\
      \ Malicki]]: ''Mały słownik sztuk plastycznych''.. Do pojęcia tego nie odnosiło\
      \ się kryterium okazałości i wielkości, gdyż określano tak zarówno małe, lekkie\
      \ statuetki z drewna, jak i duże figury''Der Kleine Pauly''. T. 5. München:\
      \ Deutscher Taschenbuchverlag, 1979, kol. 1435.. \n \nUtożsamiany (podobnie\
      \ jak [[betyl]]) z samym bóstwem, ksoanon był rytualnie karmiony, myty i ubierany;\
      \ niekiedy wierzono w jego cudowną [[teofania|epifanię]] i oddawano mu tym większą\
      \ cześć (jak np. ksoanonowi [[Atena|Ateny Polias]], który miał spaść z niebios).\
      \ Do najbardziej znanych również należał pochodzący z VII w. p.n.e., wotywny\
      \ ksoanon [[Afrodyta|Afrodyty]] z [[Delos]]. \n \nPrzez Greków uważane za wynalazek\
      \ mitycznego [[Dedal]]a i długo otaczane czcią, ksoanony znane są dziś jedynie\
      \ ze źródeł pisanych. [[Pauzaniasz (geograf)|Pauzaniasz]] w swych ''Wędrówkach\
      \ po Helladzie'' (II w. n.e.) wymienia ich kilkadziesiąt. O niektórych wspomina\
      \ też [[Klemens Aleksandryjski]] (''Zachęta Greków'' 46,3). \n \nNa przestrzeni\
      \ VII i na początku VI wieku p.n.e. zastępowano je [[akrolit]]ami jako doskonalszym\
      \ typem sakralnego wyobrażenia bóstwa, w których elementami nie drewnianymi\
      \ były także dłonie i stopy.\n== Zobacz też ==\n* [[idol (wyobrażenie)|idol]]\n\
      * [[palladion]] \n== Przypisy ==\n{{Przypisy}}\n== Bibliografia ==\n* Guy Rachet:\
      \ ''Słownik cywilizacji greckiej''. Wyd. 2. Katowice: „Książnica”, 2006, s.\
      \ 209, {{ISBN|83-7132-919-9}} \n* ''Słownik kultury antycznej. Grecja – Rzym''\
      \ (pod red. [[Lidia Winniczuk|L. Winniczuk]]). Wyd. 5. Warszawa: Wiedza Powszechna,\
      \ 1988, s. 249, {{ISBN|83-214-0406-5}}\n* ''Encyklopedia sztuki starożytnej.\
      \ Europa – Azja – Afryka – Ameryka''. Warszawa: Wydawnictwa Artystyczne i Filmowe\
      \ / Wydawnictwo Naukowe PWN, 1998, s. 346, {{ISBN|83-221-0684-X}} \n* Krystyna\
      \ Zwolińska, [[Zasław Malicki]]: ''Mały słownik sztuk plastycznych''. Wyd. 4.\
      \ Warszawa: Wiedza Powszechna, 1993, s. 151, {{ISBN|83-214-0590-8}}.\n{{Kontrola\
      \ autorytatywna}}\n[[Kategoria:Rzeźba]]\n[[Kategoria:Sztuka]]\n[[Kategoria:Religia\
      \ starożytnej Grecji]]"
