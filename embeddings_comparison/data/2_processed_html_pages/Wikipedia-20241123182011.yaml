- sections:
  - content: "[[Plik:Altar of Veit Stoss, St. Mary's Church, Krakow, Poland.jpg|mały|[[Ołtarz\
      \ Wita Stwosza w Krakowie]], opus magnum artysty]]\n'''Opus magnum''', '''magnum\
      \ opus''' ([[łacina|łac.]] „wielkie dzieło”) – fraza oznaczająca najwybitniejsze,\
      \ najbardziej znaczące [[dzieło sztuki|dzieło]] w dorobku [[artysta|artysty]]{{Cytuj\
      \ stronę | url = https://sjp.pwn.pl/slowniki/magnum%20opus.html| tytuł =Magnum\
      \ opus | praca =Słownik języka polskiego PWN | opublikowany = PWN| data dostępu\
      \ = 2020-04-08}}. \nWyrażenie to przeniesiono do [[alchemia|alchemii]] jako\
      \ określenie procesu alchemicznego mającego doprowadzić do uzyskania [[kamień\
      \ filozoficzny|kamienia filozoficznego]].\n== Przypisy ==\n{{Przypisy}}\n{{Kontrola\
      \ autorytatywna}}\n[[Kategoria:Alchemia]]\n[[Kategoria:Sztuka]]\n[[Kategoria:Zwroty\
      \ łacińskie]]"
    title: Main
  title: Opus magnum
- sections:
  - content: '''''''Symultanizm'''''' (od [[łacina|łac.]] ''''simultaneus'''' = jednoczesny)
      – zagadnienie z zakresu [[teatrologia|teatrologii]], [[literatura|literatury]]
      i [[sztuka|sztuki]] [[abstrakcjonizm|abstrakcyjnej]]. Polega na przedstawieniu
      kilku obrazów, zdarzeń rozgrywających się w tym samym [[czas]]ie, a w różnych
      miejscach. W sztuce teatralnej konieczna jest odpowiednia dekoracja pozwalająca
      na taką akcję. Metoda popularna w [[średniowiecze|średniowiecznych]] [[Misterium|misteriach]]Tomasz
      Miłkowski: ''''Szkolny słownik teatralny'''', s. 134. Warszawa 2000, Oficyna
      Wydawnicza "Delta W-Z", {{ISBN|83-7175-040-4}}.

      W sztukach plastycznych, głównie w [[Średniowiecze|średniowieczu]], symultanizm
      polegał na przedstawianiu w jednej kompozycji szeregu wydarzeń, które miały
      miejsce w różnym czasie{{encyklopedia PWN|id=3982034|tytuł=symultanizm|data
      dostępu=2021-11-02}}. W malarstwie abstrakcyjnym symultanizm to dopełnianie
      się barw.

      == Zobacz też ==

