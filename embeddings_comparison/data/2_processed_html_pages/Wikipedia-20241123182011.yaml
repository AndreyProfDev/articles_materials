      \ „konserwacja i restauracji rzeźby”{{Cytuj |tytuł = Konserwacja i Restauracja\
      \ Dzieł Sztuki |data dostępu = 2024-08-04 |opublikowany = Akademia Sztuk Pięknych\
      \ w Krakowie |url = https://www.asp.krakow.pl/konserwacja-i-restauracja-dziel-sztuki/\
      \ |archiwum = https://web.archive.org/web/20240804100824/https://www.asp.krakow.pl/konserwacja-i-restauracja-dziel-sztuki/\
      \ |zarchiwizowano = 2024-08-04 |język = pl}}.\n[[Wydział Konserwacji i Restauracji\
      \ Dzieł Sztuki Akademii Sztuk Pięknych w Warszawie]]\n* kierunek „konserwacja\
