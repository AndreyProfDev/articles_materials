      [[Plik:Goya-El sueño de la razón.jpg|thumb|Goya – [[Gdy rozum śpi, budzą się
      demony]]|alt=Rycina Francisca Goi, przedstawia autoportret artysty. Jego głowa
      spoczywa na biurku, na którym leżą porzucona kartka i pióro. Jest on atakowany
      przez upiory (m.in. nietoperze i sowy).]]

      ''''''Arteterapia'''''' lub też artterapia (''''arte'''' z [[Łacina|łac.]] ''''ars''''
      sztuka i ''''[[Leczenie|terapia]]'''') – [[leczenie]] przez [[sztuka|sztukę]].

      Termin „arteterapia” składa się z dwóch części (bardziej widoczne jest to w
      języku angielskim: ''''art therapy''''), co sugeruje, że jest to działanie bazujące
      na dwóch równoważnych elementach: sztuce (twórczości) i terapii. Uważa się,
      że osobą, która po raz pierwszy użyła terminu „arteterapia” w celu określenia
      działania polegającego na zastosowaniu twórczości w terapii był pracujący w
      [[Wielka Brytania|Wielkiej Brytanii]] artysta [[Adrian Hill]]David B. Edwards:
      Art therapy. London: SAGE, 2004.. W podobnym czasie [[Margaret Naumburg]] –
      psycholog o orientacji [[psychoanaliza|psychoanalitycznej]], stosowała termin
      arteterapia do opisu swojej pracy z pacjentami w [[Stany Zjednoczone|Stanach
      Zjednoczonych]].

      Zgodnie z definicją [[Brytyjskie Stowarzyszenie Arteterapeutów|Brytyjskiego
      Stowarzyszenia Arteterapeutów]] (''''The British Association of Art Therapists''''
      (BAAT) arteterapia jest formą psychoterapii – ''''art psychotherapy''''), która
      traktuje media artystyczne jako podstawowy sposób komunikacji. We wspierającym
      środowisku, któremu sprzyja [[Przymierze terapeutyczne|relacja terapeutyczna]],
      uczestnik arteterapii może tworzyć obrazy i obiekty, w celu ich eksploracji
      oraz dzielenia się znaczeniami, które mogą być z nich odczytane. Dzięki temu
      osoba może lepiej zrozumieć siebie oraz naturę swoich problemów i trudności.
      To z kolei może prowadzić do pozytywnej trwałej zmiany w jego postrzeganiu siebie,
      w aktualnych relacjach oraz ogólnie rozumianej jakości życia.

      Uczestnicy sesji arteterapii nie muszą posiadać zdolności artystycznych ani
      wcześniejszych doświadczeń. Terapeuta nie koncentruje się bowiem w pierwszym
      rzędzie ani na wartościach estetycznych wytworzonych obiektów, ani na ich [[diagnoza
      (psychologia)|aspekcie diagnostycznym]]. Kontekst psychoterapeutyczny, z właściwymi
      mu czynnikami leczącymi, stanowi podstawową różnicę pomiędzy arteterapią a zajęciami
      plastycznymi czy terapią zajęciową. Głównym celem arteterapii jest umożliwienie
      klientowi dokonania zmiany, wzrostu, rozwoju osobistego poprzez stosowanie materiałów
      artystycznych w bezpiecznych i sprzyjających temu warunkach. Kluczową rolę w
      arteterapii odgrywa relacja terapeutyczna, która różni się od relacji w tradycyjnych
      formach psychoterapii, ponieważ zachodzi między pacjentem, osobą uczestniczącą
      (klientem/ pacjentem) i dziełem. Ta forma terapii może być szczególnie użyteczna
      dla osób, które mają trudności z wyrażeniem swoich myśli i uczuć drogą werbalną.

      [[Amerykańskie Stowarzyszenie Arteterapii]] (''''The American Art Therapy Association'''')
      podkreśla, że arteterapia jest profesją (zawodem), który wykorzystuje proces
      tworzenia do podniesienie poziomu fizycznego, umysłowego i emocjonalnego dobrostanu
      osób w każdym wieku. Arteterapia opiera się na założeniu, że proces twórczy
      służący autoekspresji pomaga ludziom rozwiązywać problemy i konflikty, rozwijać
      umiejętności interpersonalne, kierować własnym zachowaniem, redukować stres,
      podnosić samoocenę i [[samoświadomość]] oraz osiągać wgląd. Arteterapia w takim
      rozumieniu integruje różne pola ludzkiego rozwoju; łączy sztuki wizualne (rysunek,
      malarstwo, rzeźba i inne formy wizualne)i wiedzę o procesie twórczym z modelami
      [[Zasoby ludzkie|doradztwa personalnego]] i [[psychoterapia|psychoterapią]]American
      Art Therapy Association, ze strony: https://archive.is/20120717234329/http://www.arttherapy.org/aata-aboutus.html.

      == Zawód arteterapeuty ==

      W Stanach Zjednoczonych programy arteterapeutyczne stosowane są w licznych,
      zróżnicowanych środowiskach takich jak: szpitale, kliniki, placówki publiczne
      i społecznościowe, centra odnowy biologicznej, instytucje edukacyjne oraz w
      prywatna praktyka terapeutyczna. Arteterapeuci są profesjonalistami o stopniu
      magistra, posiadającym wykształcenie w arteterapii lub pokrewnej dziedzinie.
      Wymagania dotyczące edukacji arteterapeuty obejmują: znajomość teorii arteterapii,
      doradztwa personalnego i psychoterapii; świadomość problemów etycznych i standardów
      postępowania w praktyce terapeutycznej; umiejętność oceny i ewaluacji terapii;
      znajomość technik pracy indywidualnej, grupowej i rodzinnej; wiedza o twórczym
      rozwoju osobistym i samorealizacji; wiedza na temat wielokulturowości; znajomość
      metod badawczych; praktyczne doświadczenie w środowisku klinicznym, społecznościowym
      lub innym. Arteterapeuci posiadają umiejętność stosowania technik pochodzących
      z wielu różnorodnych form twórczości plastycznej (rysunek, malarstwo, rzeźba,
      i inne środki wyrazu).

      W Europie (UE) jedynie w dwóch krajach arteterapeuci, a właściwie Arts therapist
      in the health service posiadają status zawodu regulowanego. W Polsce arteterapii
      nie regulują zapisy prawa. Liczne warsztaty i kursy podyplomowe kierowane są
      zarówno do osób wykorzystujących tę formę terapii w edukacji oraz rehabilitacji
      fizycznej i psychicznejRojewska-Nowak A. (2012), Arteterapia w opinii społecznej
      – doniesienie z badań, [w:] Stefańska A. (red.) Arteterapia w wymiarze kreacji...
      poszukiwania, drogowskazy, refleksje, UAM, Poznań-Kalisz 2012..

      Arteterapeuta w [[Klasyfikacja zawodów i specjalności dla potrzeb rynku pracy|Klasyfikacji
      zawodów i specjalności dla potrzeb rynku pracy]] ma symbol 323013{{Cytuj |tytuł
      = INFOdoradca+ Informacje o zawodach |url = https://psz.praca.gov.pl/rynek-pracy/bazy-danych/infodoradca//-/InfoDoradcaPlus/zawod/323013}}.

      Kompetencje arteterapeutów mogą potwierdzić stowarzyszenia zrzeszające specjalistów
      określonych dziedzin, jak np. Polskie Stowarzyszenie Choreoterapii – PTT w Poznaniu,
      które potwierdza kompetencje zawodowe choreoterapeutów, czy też Stowarzyszenie
      Arteteraputów Polskich „KAJROS”, w którym można się ubiegać o Certyfikat Arteterapeuty
      Szkolnego lub Certyfikat Edukatora Arteterapii (między innymi na podstawie świadectwa
      ukończenia określonych studiów z zakresu arteterapii oraz udokumentowanego doświadczenia
      zawodowego)Karolak W. (2012) Studia Podyplomowe ARTETERAPII – program i standardy,
      ze strony: http://arteterapia.pl/.. SAP „Kajros” wydaje certyfikaty potwierdzające
      kompetencje arteterapeuty w poszczególnych dziedzinach: arteterapia wizualna,
      muzykoterapia, choreoterapia, terapia ruchem, biblioterapia, drama – zależnie
      od tego, jaki rodzaj działań jest dla określonego arteterapeuty reprezentatywnySAP
      „Kajros” (2012) Certyfikaty, ze strony: https://web.archive.org/web/20120530033206/http://www.kajros.pl/certyfikaty.html..
      Dzięki Stowarzyszeniu Arteterapeutów Polskich Kajros można się znaleźć na europejskiej
      liście arteterapeutów.

      Od 2012 roku ruszyła certyfikacja muzykoterapeutów prowadzona przez powołane
      w tym celu Polskie Stowarzyszenie Muzykoterapeutów (PSMT){{Cytuj | url=http://arteterapia.pl/polskie-stowarzyszenie-muzykoterapeutow/
      | tytuł=Polskie Stowarzyszenie Muzykoterapeutów » Arteterapia.pl<!-- Tytuł wygenerowany
      przez bota --> | opublikowany=arteterapia.pl | archiwum=https://archive.is/20130503153940/http://arteterapia.pl/polskie-stowarzyszenie-muzykoterapeutow/
      | zarchiwizowano=2013-05-03 | data dostępu=2024-04-22}}. Proces certyfikacji
      opracowany i kierowany przez Polskie Stowarzyszenie Muzykoterapeutów przy wsparciu
      Komisji Edukacji i Szkolenia Muzykoterapeutów Światowej Federacji Muzykoterapii
      (''''Commission on Education and Training'''', WFMT) ma na celu wyłonienie i
      rekomendowanie instytucjom państwowym, prywatnym, placówkom terapeutycznym,
      leczniczym, edukacyjnym muzykoterapeutów dobrze wykonujących swoją pracę. W
      skład Komisji Certyfikacyjnej wchodzą uznani specjaliści z zakresu muzykoterapii
      z Polski i zagranicy{{Cytuj |tytuł = Regulamin certyfikacji |data dostępu =
      2023-02-14 |opublikowany = arteterapia.pl |url = https://arteterapia.pl/regulamin-certyfikacji/
      |język = pl}}.

      == Zastosowanie arteterapii ==

      Arteterapia stosowana jest nie tylko jako terapia, której zadaniem jest terapia
      lecznicza (wspomagająca proces leczenia), często jest stosowana także jako metoda
      rozwoju osobistegoRojewska-Nowak A. (2012), Arteterapia w opinii społecznej
      – doniesienie z badań, [w:] Stefańska A. (red.) Arteterapia w wymiarze kreacji...
      poszukiwania, drogowskazy, refleksje, Uniwersytet im. Adama Mickiewicza w Poznaniu,
      Poznań-Kalisz 2012..

      Stosowana jest między innymi w pomocy dzieciom, osobom dorastającym, dorosłym
      i osobom w okresie późnej dorosłości, grupom społecznym i rodzinom, w leczeniu:
      [[lęk]]ów, [[Zaburzenia depresyjne|depresji]], innych [[zaburzenia afektywne|zaburzeń
      afektywnych]], [[zaburzenia nerwicowe|nerwic]], [[uzależnienie|uzależnień]],
      problemów w relacjach rodzinnych, w przypadkach [[wykorzystywanie seksualne
      dzieci|nadużycia seksualnego]] i [[przemoc domowa|przemocy domowej]], w trudnościach
      społecznych i emocjonalnych związanych z niepełnosprawnością i chorobą, w [[trauma]]ch
      i przeżyciach straty, przy problemach fizycznych, poznawczych i neurologicznych,
      oraz trudnościach psychospołecznych związanych z [[Choroba#Klasyfikacja chorób|chorobami
      somatycznymi]] (np. chorobami nowotworowymi). Coraz częściej wykorzystywana
      jest również w profilaktyce społecznej, w tym w pracy z osobami zagrożonymi
      wykluczeniem społecznymRojewska-Nowak A. (2012), Arteterapia w procesie aktywizacji
      osób zagrożonych wykluczeniem społecznym, Czasopismo: socjologia.pl, Wydawnictwo
      PROMOTOR, Warszawa, nr 4/2012..

      == Przebieg sesji ==

      [[Plik:Fortier DAKAR art therapy 30dec11 300.jpg|thumb|Dakar – sesja terapeutyczna]]

      [[Cathy Malchiodi]] (2006) ukazuje specyfikę udziału w sesji arteterapeutycznej
      i czym różni się w tym od typowej lekcji plastyki. ''''„W większości sesji arteterapeutycznych,
      nacisk kładziony jest na wewnętrzne doświadczenie – sposób odczuwania i postrzegania
      świata oraz wyobraźnię”''''. Podczas arteterapii może występować nauczanie nowych
      umiejętności i technik plastycznych, jednak skierowana jest ona raczej na rozwijanie
      i wydobywanie obrazów pochodzących z wnętrza osoby, niż na odtwarzanie obrazów
      i obiektów odbieranych przez osobę ze świata zewnętrznego. Tak jak podczas tradycyjnej
      lekcji plastyki zadaniem jest odtwarzanie rzeczywistych obiektów lub ich wyobrażeń
      poprzez rysowanie lub malowanie, tak w arteterapii wewnętrzny świat obrazów,
      wizji, odczuć, myśli i pomysłów jest ważniejszy niż rzeczywiste doświadczenie.

      Słowo „terapia” pochodzi od greckiego słowa ''''therapeia'''', oznaczającego
      troszczenie się, pomoc, obserwowanie i zajmowanie się czymś. To określenie uwypukla
      dwie strony procesu arteterapeutycznego. W większości przypadków wygląda on
      tak, że wykształcony profesjonalista opiekuje się jednostką, która tworzy własne
      dzieło. Pomoc profesjonalisty i jego przewodnictwo są w tym działaniu kluczowe
      dla procesu terapeutycznego. Wspierająca relacja jest potrzebna, by przeprowadzić
      osobę przez proces twórczy, pomagając jej znaleźć i odkryć jego indywidualne
      znaczenie na każdym etapie. Drugim ważnym aspektem jest dbałość samej jednostki
      o proces twórczy i nadawanie mu osobistego znaczenia, np. poprzez tworzenie
      historii o tym dziele, jego opis, subiektywną interpretację jego znaczenia.
      Niewiele form terapii w tak dużym stopniu zależy od aktywnego uczestnictwa osoby
      (s.24). „W arteterapii terapeuta wspomaga i ułatwia eksplorację zarówno różnych
      materiałów, jak i treści narracji na temat dzieła stworzonego podczas sesji”.

      Arteterapia w szerokim rozumieniu wykorzystuje do celów terapeutycznych formy
      plastyczne, [[muzyka|muzyczne]], [[literatura|literackie]] i [[teatr]]alne.
      Daje możliwość symbolicznego wyrazu trudnych przeżyć, doświadczeń i emocji w
      bezpiecznych warunkach, bez mówienia „wprost”, pomaga nazwać problem i obniżyć
      napięcie.

      == Metody i techniki szeroko rozumianej arteterapii (terapii przez sztukę) ==

      * [[Rysunek]]:

      Rysowanie kredkami ołówkowymi, świecowymi, pastelami, ołówkiem, kredą lub węglem.

      * [[Malarstwo]]:

      Malowanie farbami plakatowymi, akwarelą, witrażowymi, olejnymi, farbami do szkła,
      farbami window collors lub tuszem kreślarskim.

      * [[Grafika]]:

      Wykonuj się [[gipsoryt]], [[linoryt]], [[drzeworyt]], [[monotypia]] lub druk
      strukturalny.

      * [[Rzeźbiarstwo|Rzeźba]]:

      Wykonujemy prace z masy plastycznej np. [[masa solna]], [[glina]], [[modelina]],
      [[plastelina]], masa papierowa, [[Woski|wosk]] itp. lub rzeźbimy w drewnie i
      innych twardych materiałach. Stosujemy papiero-plastykę, [[origami]] – motywy
      postaci, przedmiotów, kwiatów lub laurki.

      * [[Sztuki użytkowe]]:

      [[Witraż]] – na okna, drzwi, butelki itp., [[fotografia]], [[plakat]], projekty
      okładek, opakowania, ulotki reklamowe. [[Kolaż|Collage]] – wycinanie, wyklejanie,
      wydzieranie z papieru i tworzenie pracy łączonej różnymi technikami plastycznymi.

      * [[Zdobnictwo]] i [[dekoratorstwo]]:

      [[Ikebana]] – układanie kompozycji z suszonych i żywych kwiatów, roślin, owoców
      oraz darów natury, np. kory drzewa, szyszek, mchu, muszli, drewna, piór itp.,
      kompozycje w wazonie, w ramach obrazów, koszykach. Dekoracje okolicznościowe,
      świąteczne, np. stroiki Wielkanocne, Bożonarodzeniowe, wycinane ozdoby z papieru
      z okazji świąt i uroczystości. Zdobienie różnych przedmiotów, np. ramek.

      * [[Muzykoterapia]]:

      Stosujemy muzykoterapię bierną – muzyka aktywizująca, relaksacyjna, trening
      relaksacyjny Schultza lub muzykoterapia czynna – muzykowanie pacjentów ([[Carl
      Orff|instrumenty Orffa]], gitara i inne), nauka śpiewania nowych piosenek, śpiewanie
      utworów znanych i lubianych, popularnych ludowych czy biesiadnych.

      * [[Biblioterapia]]:

      Czytanie głośne fragmentów lub całości książki (dla bajek [[Bajkoterapia]])
      (tekstu) przez pacjentów i rozmowa po przeczytaniu. Słuchanie tekstów biblioterapeutycznych
      (aktywizujących bądź relaksacyjnych), oraz poradnictwo biblioteczne – propozycje
      do samodzielnego czytania i rozmowa po przeczytaniu w formie np. wieczorów poezji.

      * Filmoterapia:

      Projekcja filmów i dyskusja po niej. Nagrywanie filmów

      * [[Teatroterapia]]:

      Stosujemy [[psychodrama|psychodramę]], [[Drama (pedagogika)|drama]], [[pantomima]]
      (scenki pantomimiczne) i oglądanie spektakli.

      * [[Terapia tańcem|Choreoterapia]]:

      Stosujemy [[taniec]], ćwiczenia muzyczno-ruchowe i improwizacje ruchowe przy
      muzyce.

      == Krytyka ==

      Efektywność arteterapii rzadko sprawdzana jest w [[Randomizowane kontrolowane
      badania kliniczne|randomizowanych i kontrolowanych eksperymentach]]. Istniejące
      badania dają mieszane wyniki i postuluje się o zwiększenie ich ilości i jakości{{Cytuj
      |autor = Dafna Regev, Liat Cohen-Yatziv |tytuł = Effectiveness of art therapy
      with adult clients in 2018 – what progress has been made? |czasopismo = Frontiers
      in Psychology |data = 2018-08-29 |issn = 1664-1078 |wolumin = 9 |s = 1531 |doi
      = 10.3389/fpsyg.2018.01531 |pmid = 30210388 |pmc = PMC6124538 |url = https://www.frontiersin.org/article/10.3389/fpsyg.2018.01531/full}}.
      Najwięcej badań dotyczy pacjentek zmagających się z [[Rak sutka|rakiem piersi]]
      i w ich wypadku ustalenia wskazują na potencjalnie pozytywny wpływ terapii na
      objawy [[lęk]]u, [[Zaburzenia depresyjne|depresji]] i zmęczenia{{Cytuj |autor
      = Yong Tang, Fang Fu, Hua Gao, Li Shen, Iris Chi |tytuł = Art therapy for anxiety,
      depression, and fatigue in females with breast cancer: a systematic review |czasopismo
      = Journal of Psychosocial Oncology |data = 2019-01-02 |issn = 0734-7332 |wolumin
      = 37 |numer = 1 |s = 79–95 |doi = 10.1080/07347332.2018.1506855 |dostęp = z}}.
      Badania z udziałem pacjentów z różnymi typami raka również powiązują arteterapię
      z lepszym funkcjonowaniem psychicznym, ale dowody te są niższej jakości{{Cytuj
      |autor = Xiao-Han Jiang, Xi-Jie Chen, Qin-Qin Xie, Yong-Shen Feng, Shi Chen
      |tytuł = Effects of art therapy in cancer care: a systematic review and meta-analysis
      |czasopismo = European Journal of Cancer Care |data = 2020-09 |issn = 0961-5423
      |wolumin = 29 |numer = 5 |doi = 10.1111/ecc.13277 |dostęp = z}}. Inne populacje
      pacjentów medycznych prawie nie są badane. Brakuje również wystarczającej ilości,
      dobrych jakościowo i jednoznacznych dowodów na efektywność w wypadku [[Zaburzenia
      lękowe|zaburzeń lękowych]], depresji czy [[Schizofrenia|schizofrenii]]{{Cytuj
      |autor = Annemarie Abbing, Anne Ponstein, Susan van Hooren, Leo de Sonneville,
      Hanna Swaab |tytuł = The effectiveness of art therapy for anxiety in adults:
      a systematic review of randomised and non-randomised controlled trials |czasopismo
      = PLOS ONE |data = 2018-12-17 |issn = 1932-6203 |wolumin = 13 |numer = 12 |s
      = e0208716 |doi = 10.1371/journal.pone.0208716 |pmid = 30557381 |pmc = PMC6296656
      |url = https://dx.plos.org/10.1371/journal.pone.0208716}}{{Cytuj |autor = Theresa
      Van Lith |tytuł = Art therapy in mental health: a systematic review of approaches
      and practices |czasopismo = The Arts in Psychotherapy |data = 2016-02 |wolumin
      = 47 |s = 9–22 |doi = 10.1016/j.aip.2015.09.003 |dostęp = z}}. Istnieją ograniczone
      dowody na pozytywny wpływ na funkcjonowanie emocjonalne i [[Procesy poznawcze|poznawcze]]
      osób starszych, również zmagających się z depresją{{Cytuj |autor = Golden M.
      Masika, Doris S. F. Yu, Polly W. C. Li |tytuł = Visual art therapy as a treatment
      option for cognitive decline among older adults. a systematic review and meta-analysis
      |czasopismo = Journal of Advanced Nursing |data = 2020-04-20 |issn = 0309-2402
      |s = jan.14362 |doi = 10.1111/jan.14362 |dostęp = z}}{{Cytuj |autor = Kim Dunphy,
      Felicity A. Baker, Ella Dumaresq, Katrina Carroll-Haskins, Jasmin Eickholt |tytuł
      = Creative arts interventions to address depression in older adults: a systematic
      review of outcomes, processes, and mechanisms |czasopismo = Frontiers in Psychology
      |data = 2019 |issn = 1664-1078 |wolumin = 9 |doi = 10.3389/fpsyg.2018.02655
      |pmid = 30671000 |pmc = PMC6331422 |url = https://www.frontiersin.org/articles/10.3389/fpsyg.2018.02655/full
      |dostęp = o}}. Niejednoznaczne są dowody na efektywność arteterapii stosowanej
      wśród dzieci{{Cytuj |autor = Laura A. Clapp, Emily P. Taylor, Simona Di Folco,
      Victoria L. Mackinnon |tytuł = Effectiveness of art therapy with pediatric populations
      affected by medical health conditions: a systematic review |czasopismo = Arts
      & Health |data = 2019-09-02 |issn = 1753-3015 |wolumin = 11 |numer = 3 |s =
      183–201 |doi = 10.1080/17533015.2018.1443952 |pmid = 31038441 |dostęp = z}}{{Cytuj
      |autor = Zoe Moula, Supritha Aithal, Vicky Karkou, Joanne Powell |tytuł = A
      systematic review of child-focused outcomes and assessments of arts therapies
