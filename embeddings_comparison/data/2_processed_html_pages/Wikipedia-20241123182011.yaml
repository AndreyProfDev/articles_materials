  - content: "{{DISPLAYTITLE:Anna Szyjkowska-Piotrowska}}\n{{Biogram infobox\n |imię\
      \ i nazwisko = Anna Szyjkowska-Piotrowska\n |grafika =\n |opis grafiki = Anna\
      \ Szyjkowska-Piotrowska\n |alt grafiki = \n |data urodzenia = 1981\n |miejsce\
      \ urodzenia = \n |data śmierci = \n |miejsce śmierci = \n |zawód = teoretyczka\
      \ sztuki, filozofka kultury, lingwistka\n |odznaczenia = Członkini Kapituły\
      \ Plastycznej Nagrody im. Cypriana Kamila Norwida\n |commons = \n}}\n'''dr hab.\
      \ Anna Szyjkowska-Piotrowska''' - teoretyczka sztuki, filozofka kultury i lingwistka,\
      \ autorka publikacji naukowych i książek o tematyce artystycznej i filozoficznej.\
      \ Jest profesorem uczelni na [[Akademia Sztuk Pięknych w Warszawie|Akademii\
      \ Sztuk Pięknych w Warszawie]]{{Cytuj |tytuł = dr hab. Anna Szyjkowska-Piotrowska,\
      \ prof. uczelni |data dostępu = 2024-09-24 |opublikowany = Wydział Wzornictwa\
      \ |url = https://ww.asp.waw.pl/zespol/dr-anna-szyjkowska-piotrowska/ |język\
      \ = pl-PL}}, gdzie pracuje w Katedrze Teorii Designu na Wydziale Wzornictwa.\
      \ Prowadzi także badania naukowe jako współpracowniczka Université Paris 1 Panthéon-Sorbonne\
      \ w Instytucie ACTE (Estetyka i Krytyczne Teorie Kultury) oraz jako adiunkt\
      \ na [[Uniwersytet Muzyczny Fryderyka Chopina|Uniwersytecie Muzycznym Fryderyka\
      \ Chopina]]{{Cytuj |tytuł = Uniwersytet Muzyczny Fryderyka Chopina |data dostępu\
      \ = 2024-09-24 |opublikowany = Uniwersytet Muzyczny Fryderyka Chopina |url =\
      \ https://chopin.edu.pl/pracownicy/208_anna-szyjkowska-piotrowska |język = pl}}.\n\
      == Praca naukowa ==\nW swojej pracy zajmuje się nowymi wyzwaniami etyki w projektowaniu,\
      \ tematyką tożsamości, jej przemianami oraz ich obrazowaniem. Działa na styku\
      \ różnych dyscyplin, łącząc teorię z praktyką artystyczną.\n== Publikacje ==\n\
      Szyjkowska-Piotrowska jest autorką kilku książek i artykułów, w tym:\n* ''Po-twarz.\
      \ Przekraczanie widzialności w sztuce i filozofii''{{Cytuj książkę|nazwisko=Szyjkowska|imię=Anna|tytuł=Po-twarz:\
      \ przekraczanie widzialności w sztuce i filozofii|wydawca=Słowo/Obraz Terytoria|rok=2015|isbn=978-83-7908-043-4|strony=1-274}}\n\
      * ''Dyrygując falom. Myślenie w wizualno-muzycznych awangardach''{{Cytuj książkę|nazwisko=Szyjkowska-Piotrowska|imię=Anna|tytuł=Dyrygując\
      \ falom. Myślenie w wizualno-muzycznych awangardach|wydawca=Słowo/Obraz Terytoria|rok=2019|strony=1-232}}\n\
      * ''Czy tworzenie sztuki jest sposobem myślenia?''{{Cytuj |autor = Anna Szyjkowska-Piotrowska\
      \ |tytuł = Is Making Art a Way of Thinking? |czasopismo = Art Inquiry |data\
      \ = 2023-12-13 |data dostępu = 2024-10-03 |issn = 2451-0327 |wolumin = 25 |s\
      \ = 41–60 |doi = 10.26485/AI/2023/25/3 |url = https://journals.ltn.lodz.pl/Art-Inquiry/article/view/2216\
      \ |język = en}}\nDodatkowo, jest autorką kilku artykułów, w tym:\n* ''O czym\
      \ nie możemy mówić, tam musimy malować. Rola języka w sztuce''{{Cytuj |autor\
      \ = Anna Szyjkowska-Piotrowska |tytuł = Whereof We Cannot Speak, There Must\
      \ We Paint |data = 2010 |opublikowany = PhilPaper |url = https://philpapers.org/rec/SZYWWC-2\
      \ |język = en}}\n* ''Articulating an Inclusive Artistic Practice''https://independent.academia.edu/AnnaSzyjkowskaPiotrowska\n\
      * ''Przekraczanie widzialności: Intermedialność w sztuce współczesnej''https://independent.academia.edu/AnnaSzyjkowskaPiotrowska\n\
      * ''Rola pamięci w praktyce artystycznej''{{Cytuj |tytuł = Anna Szyjkowska-Piotrowska\
      \ - Academia.edu |data dostępu = 2024-10-03 |opublikowany = independent.academia.edu\
      \ |url = https://independent.academia.edu/AnnaSzyjkowskaPiotrowska}}\n* ''Post-face:\
      \ Płynność tożsamości''{{Cytuj |tytuł = Anna Szyjkowska-Piotrowska - Academia.edu\
      \ |data dostępu = 2024-10-03 |opublikowany = independent.academia.edu |url =\
      \ https://independent.academia.edu/AnnaSzyjkowskaPiotrowska}}\nBrała również\
      \ udział w dyskusjach na temat swojej pracy, takich jak:\n* Wykład ''Anu Põder:\
      \ Ciało-Obiekt vs Ciało-Przestrzeń''{{Cytuj odcinek|tytuł=Lecture: Anna Szyjkowska-Piotrowska\
      \ 'Anu Põder: Body-Object vs Body-Space'|url=https://www.youtube.com/watch?v=uB7q7rxPddA|autorzy=Muzeum\
      \ Susch / ASF CH|data dostępu=2024-10-03|emisja=2024-04-02}}\n* Wykład ''Po-twarz.\
      \ Przekraczanie widzialności w sztuce i filozofii'' w Muzeum Sztuki Współczesnej\
      \ w Krakowiehttps://www.youtube.com/watch?v=i59N4yzUJdQ\n* Odcinek podcastu\
      \ w VOGUE PL, w którym omawia swoje idee{{Cytuj |autor = Vogue Polska |tytuł\
