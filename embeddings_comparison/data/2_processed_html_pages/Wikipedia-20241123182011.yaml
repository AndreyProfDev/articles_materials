- sections:
  - content: "{{Biogram infobox\n |imię i nazwisko = Victor Manuel Contreras\n |grafika\
      \ = Victor Manuel Contreras.jpg\n |opis grafiki = Victor Manuel Contreras w\
      \ Treas Bambus, Cuernavaca (2022)\n |alt grafiki = \n |data urodzenia = 6 sierpnia\
      \ 1941\n |miejsce urodzenia = Atoyac\n |data śmierci = 25 maja 2023\n |miejsce\
      \ śmierci = Cuernavaca\n |miejsce spoczynku = Cuernavaca\n |zawód = Rzeźbiarz\n\
      \ |narodowość = Meksyk\n |partnerka = Tamara Łempicka\n |odznaczenia = {{order|LH}}{{order|OSiL|K}}\n\
      \ |commons = \n}}\n'''Victor Manuel Contreras''' (ur. 6 sierpnia 1941 w [[Atoyac]],\
      \ w stanie [[Jalisco]] w [[Meksyk]]u{{Cytuj stronę |url = https://collections.stormking.org/Detail/objects/409\
      \ |tytuł = » Victor Contreras |opublikowany = stormking.org |data dostępu =\
      \ 2019-01-04}}, zm. 25 maja 2023 w [[Cuernavaca]], [[Morelos]], Meksyk){{Cytuj\
      \ stronę |url = https://www.elsoldecuernavaca.com.mx/cultura/victor-manuel-contreras-y-su-obra-en-guerrero-10119349.html\
      \ |tytuł = Víctor Manuel Contreras y su obra en Guerrero |nazwisko = Cuernavaca\
      \ |imię = El Sol de |język = es |opublikowany = El Sol de Cuernavaca {{!}} Noticias\
      \ Locales, Policiacas, sobre México, Morelos y el Mundo |data dostępu = 2023-09-08}}\
      \ – meksykański [[Rzeźbiarstwo|rzeźbiarz]] i [[malarz]] znany z wielu dzieł\
      \ wystawianych w miejscach publicznych, muzeach oraz kolekcjach prywatnych w\
      \ Meksyku, Stanach Zjednoczonych i Europie{{Cytuj książkę |imię = |autor = Neil\
      \ Wilczek, Paul Jouveau De Breuil|tytuł = Victor Manuel Contreras: Sculptures,\
      \ 1970-2009 |url = https://books.google.tn/books?id=mzDcXwAACAAJ |wydanie =\
      \ International Art Promotion |rok = 2010 |isbn =}}. Contreras jest uznawany\
      \ za wybitnego artystę znanego przede wszystkim ze swoich monumentalnych rzeźb\
      \ z brązu. Jego dorobek artystyczny obejmuje 74 dzieł, które są publiczne prezentowane\
      \ w 34 krajach na całym świecie{{Cytuj |autor = Alissa de Carbonnel |tytuł =\
      \ Secrets of an Exiled Prince |data = 2007-05-25 |data dostępu = 2024-07-08\
      \ |opublikowany = The Moscow Times |url = https://www.themoscowtimes.com/archive/secrets-of-an-exiled-prince-363440\
      \ |język = en}}. Jednym z ważnych aspektów życia Contrerasa była jego bliska\
      \ przyjaźń z polską malarką [[Tamara Łempicka|Tamarą Łempicką]], jedną z czołowych\
      \ postaci światowego [[Art déco|art deco]]{{Cytuj |tytuł = Gra w domino o siódmej\
      \ rano – Dwójka – polskieradio.pl |data dostępu = 2024-07-08 |opublikowany =\
      \ polskieradio.pl |url = https://polskieradio.pl/8/2576/artykul/3023001,gra-w-domino-o-siodmej-rano\
      \ |język = pl}}.\n== Życiorys i twórczosć ==\nW 1956 roku rozpoczął naukę malarstwa\
      \ i rzeźby w {{link-interwiki|Academy of San Carlos|Q=Q337267|tekst=Akademii\
      \ San Carlos w Meksyku}}. Następnie studiował w [[Museum of Modern Art|Instytucie\
      \ Sztuki Nowoczesnej w Nowym Jorku]], a w latach 1958–1964 kontynuował edukację\
      \ w Europie, w [[Akademie der Künste|Der Kunst Academy]] w Monachium, a następnie\
      \ w [[École nationale supérieure des beaux-arts|École Nationale supérieure des\
      \ beaux-arts]] w [[Paryż]]u ([[Francja]]).\nOd tego czasu zaczął projektować\
      \ rzeźby w drewnie, terakocie i brązie. Za jedną z nich, zatytułowaną ''The\
      \ Worker'', zdobył w 1963 roku pierwszą nagrodę rzeźbiarską w Państwowej Szkole\
      \ Sztuk Pięknych w Paryżu (Francja), pod czujnym okiem swego mistrza [https://www.artprice.com/artist/54930/olivier-picard\
      \ Oliviera Picarda] (1897-1974). Podczas pobytu w Paryżu poznał [[Feliks Jusupow|księcia\
      \ Feliksa Jussoupowa]], słynnego rosyjskiego arystokratę i zabójcę [[Grigorij\
      \ Rasputin|Rasputina]]{{Cytuj stronę |url = http://old.themoscowtimes.com/arts_n_ideas/article/tmt/356535.html\
      \ |tytuł = Secrets of an Exiled Prince {{!}} Arts and Ideas |opublikowany =\
      \ The Moscow Times |data dostępu = 2019-01-04}}{{Cytuj |tytuł = From Mexico,\
      \ with love: Russian art and Rasputin |data dostępu = 2024-07-22 |opublikowany\
      \ = www.ft.com |url = https://www.ft.com/content/0377f0c4-86e9-11e0-92df-00144feabdc0}}\
      \ oraz zbliżył się do słynnej polskiej artystki [[Tamara Łempicka|Tamary Łempickiej]]{{Cytuj\
      \ książkę |nazwisko = Bade |imię = Patrick |tytuł = Lempicka |url = https://books.google.tn/books?id=UHulCgAAQBAJ&pg=PT157&dq=victor+contreras+sculpture\
      \ |wydanie = Parkstone International |data = 2015-09-15 |strony = 248 |isbn\
      \ = 978-1-78310-834-3}}. Wcześniej stworzył pracę ''„Włóczęga”'' (1961) oraz\
      \ płaskorzeźbę ''„Rodzina”'' (1962).\nOd 1964 regularnie organizował wystawy\
      \ zbiorowe w Rotterdamie, Amsterdamie, Mediolanie i Paryżu. W latach 1965–1972\
      \ był dyrektorem ds. działalności kulturalnej na {{link-interwiki|Universidad\
      \ Autónoma del Estado de Morelos|Q=Q6156367|tekst=Uniwersytecie Autonomicznym\
      \ w Morelos}} (Meksyk). Następnie w ramach {{link-interwiki|Autonomous University\
      \ of Guerrero|Q=Q6156359|tekst=Autonomicznego Uniwersytetu Guerrero}} (Meksyk)\
      \ założył niezależne Muzeum Sztuki Współczesnej, które zaraz po {{link-interwiki|Museo\
      \ de Arte Moderno|Q=Q3032842}} stało się najważniejszym w kraju. W ramach programu\
      \ muzeum zorganizował siedem znaczących wydarzeń kulturalnych, które odbyły\
      \ się w Cuernavaca, Chilpancingo, Taxco i Acapulco. Wydarzenia te miały międzynarodowy\
      \ charakter, przyciągając uczestników ze Stanów Zjednoczonych, Meksyku, Francji,\
      \ Belgii, Włoch, Danii, ZSRR, Chin, Japonii oraz innych krajów Ameryki Łacińskiej.\
      \ Jednocześnie objął stanowisko dyrektora artystycznego czasopisma wydawanego\
      \ przez uczelnię, a następnie wykładał historię sztuki i cywilizację francuską\
      \ studentom prawa i nauk społecznych na tej samej uczelni.\nW tym okresie Victor\
      \ Manuel Contreras zaprezentował swoje prace na swojej pierwszej indywidualnej\
      \ wystawie w Maison de l’Amérique Latine w Paryżu, a następnie w Instytucie\
      \ Włosko-Latynoamerykańskim w Rzymie, gdzie wystawił obrazy olejne, akwarele\
      \ i rysunki. W 1971 roku zorganizował wraz z innymi współczesnymi artystami\
      \ wystawę zbiorową w Londynie, a następnie w Brukseli.\nRok 1972 przyniósł stworzenie\
      \ jego pierwszego monumentalnego dzieła z kutego żelaza, które zdobi fasadę\
      \ pałacu rządowego w Chilpancingo, stolicy stanu Guerrero w Meksyku. Ta płaskorzeźba\
      \ ma dwadzieścia metrów wysokości i cztery metry szerokości, symbolizując ''„projekcję\
      \ człowieka ku przyszłości poprzez jego dzieło”''. W następnym roku, na prośbę\
      \ rządu meksykańskiego, wykonał w tym samym miejscu {{link-interwiki|Escudo\
      \ de Guerrero|Q=Q2281945|tekst=herb stanu Guerrero}}.\nW latach 1974–1979 Contreras\
      \ stworzył wiele znaczących dzieł. Wśród nich znajduje się ''„Chrystus na krzyżu”'',\
      \ wystawiany w Waszyngtonie, oraz ''„Pochodzenie”'', które zdobyło pierwszą\
      \ nagrodę w kategorii dzieł monumentalnych w Nowym Jorku. Kolejnym ważnym dziełem\
      \ jest ''„Good and Evil”'', które zostało zamówione przez rząd USA z okazji\
      \ obchodów niepodległości Stanów Zjednoczonych dla siedziby {{link-interwiki|Hamilton\
      \ County Courthouse|Q=Q55613324}} w Chattanooga, Tennessee. Następnie artysta\
      \ stworzył ''„Łódź czasu”'', ''„Narodziny Meksyku”'', ''„Ręce Boga”'' dla {{link-interwiki|University\
      \ of Tennessee|Q=Q1150105|tekst=Uniwersytetu Tennessee}}, ''„Alegorię przedhiszpańską”''\
      \ dla [https://thegouldcollection.com/ The Gould Collection] w Stanach Zjednoczonych\
      \ oraz ''[https://cuernavaca.gob.mx/?ova_por=paloma-de-la-paz „Ptak pokoju”]'',\
      \ odsłoniętą osobiście przez prezydenta Meksyku [[José López Portillo|José Lópeza\
      \ Portillo]], przy północnym wjeździe do miasta Cuernavaca, Morelos. Wszystkie\
      \ te monumentalne dzieła zostały ręcznie wykonane i patynowane przez artystę\
      \ w brązie lub kutym żelazie. Ważnym dziełem Contrerasa jest rzeźba [https://www.un.org/ungifts/la-unidad-humana-human-unity\
      \ „Ludzka Jedność”], która została uroczyście odsłonięta w siedzibie [[Organizacja\
      \ Narodów Zjednoczonych|Organizacji Narodów Zjednoczonych]] w Nowym Jorku{{Cytuj\
      \ |tytuł = A La Unidad Humana (Human Unity) {{!}} United Nations Gifts |data\
      \ dostępu = 2024-06-28 |opublikowany = www.un.org |url = https://www.un.org/ungifts/la-unidad-humana-human-unity}}.\n\
      W 1980 roku zaprezentował publicznie swoje nowe dzieło zatytułowane ''„Infinite\
      \ Energy”'', które umieszczono w Center for the Performing Arts w Denver, Kolorado,\
      \ USA. Artysta w 2000 roku ujawnił odniesienia wizualne i narracyjne, zauważając:\
      \ „Inspiracją dla tej rzeźby były dwa białe \"mariposa\" (motyle) w locie, które\
      \ według starożytnych indiańsko-meksykańskich legend są duszami powracającymi,\
      \ aby pocieszyć ukochaną osobę”{{Cytuj |tytuł = Infinite Energy in Denver, CO\
      \ |data dostępu = 2024-06-28 |opublikowany = Public Art Archive |url = https://publicartarchive.org/art/Infinite-Energy/a8b839fd\
      \ |język = en}}{{Cytuj |tytuł = Infinite Energy - Denver Public Art |data dostępu\
      \ = 2024-07-22 |opublikowany = denverpublicart.org |url = https://denverpublicart.org/public-arts/infinite-energy/}}{{Cytuj\
      \ |tytuł = Victor Manuel Contreras - Biography |data dostępu = 2024-07-22 |opublikowany\
      \ = www.askart.com |url = https://www.askart.com/artist/Victor_Manuel_Contreras/11296950/Victor_Manuel_Contreras.aspx}}.\n\
      18 marca 1980 roku, w Cuernavace, zmarła jego bliska przyjaciółka, [[Tamara\
      \ Łempicka]]. Victor Manuel Contreras wypełnił jej ostatnią wolę rozsypując\
      \ jej prochy nad wulkanem Popocatepetl{{Cytuj |tytuł = Obraz pełen tajemnic:\
      \ Autoportret w zielonym bugatti |data dostępu = 2024-07-22 |opublikowany =\
      \ Rzeczpospolita |url = https://historia.rp.pl/historia/art971011-obraz-pelen-tajemnic-autoportret-w-zielonym-bugatti\
      \ |język = pl}}{{Cytuj |tytuł = Kobieta jest silniejsza niż wojna |data = 2022-04-08\
      \ |data dostępu = 2024-07-22 |opublikowany = Korrespondent Warszawski |url =\
      \ https://www.korrespondent.pl/kobieta-jest-silniejsza-niz-wojna/ |język = pl}}.\
      \ Contreras został jednym ze spadkobierców artystki, otrzymując część jej dzieł{{Cytuj\
      \ |tytuł = Tamara Łempicka wraca do Lublina. Tym razem na stałe |data dostępu\
      \ = 2024-07-22 |opublikowany = www.rmf24.pl |url = https://www.rmf24.pl/regiony/lublin/news-tamara-lempicka-wraca-do-lublina-tym-razem-na-stale,nId,6857347\
      \ |język = pl}}.\nPonadto stworzył monumentalną, mającą 25-metrów wysokości,\
      \ rzeźbę z brązu o wyglądzie pioruna, zatytułowaną „{{link-interwiki|Inmolación\
      \ de Quetzalcóatl|Q=Q109631678|tekst=Spalenie Quetzalcoatla}}”. Praca znajduje\
      \ się w centralnym punkcie {{link-interwiki|Plaza Tapatía|Q=Q109631605|tekst=placu\
      \ Tapatia}} w [[Guadalajara|Guadalajarze]]. Inspiracją dla dzieła była legenda\
      \ o ostatecznym spopieleniu [[Quetzalcoatl]]a, który miał zejść do piekła, aby\
      \ przynieść ogień słońcu. Główną rzeźbę otaczają cztery mniejsze, symbolizujące\
      \ cztery strony świata. Całą kompozycję zdobi fontanna w kształcie kwiatu, która\
      \ sprawia, że rzeźba wygląda, jakby była w locie. Jest ona uznawana za najwyższą\
      \ ręcznie kutą rzeźbę na świecie, z centralną postacią mierzącą dwadzieścia\
      \ pięć metrów wysokości oraz czterema alegoriami, z których każda ma ponad osiem\
      \ metrów wysokości{{Cytuj |tytuł = Plaza Tapatia (Tapatia Square) in Guadalajara,\
      \ Mexico |data dostępu = 2024-06-28 |opublikowany = GPSmyCity |url = https://www.gpsmycity.com/attractions/plaza-tapatia-(tapatia-square)-49599.html\
      \ |język = en}}.\nW latach 1982–1989 Contreras stworzył kilka znaczących rzeźb,\
      \ które znalazły swoje miejsce w prestiżowych kolekcjach i publicznych przestrzeniach.\
      \ Jednym z tych dzieł jest ''„La dualité infinie”'', które zostało wykonane\
      \ dla [https://vmfa.museum/learn/resources/art-in-depth-worsham-rockefeller/\
      \ kolekcji Arabelli Worsham Huntington] w Nowym Jorku. Kolejne ważne dzieło,\
      \ ''„Ptaki Wolności”'', przedstawia cztery orły w locie i zostało umieszczone\
      \ w SASA Center w San Antonio w Teksasie. Rzeźba ''„Infinite Flight”'' została\
      \ stworzona specjalnie dla miasta Nowy York. Natomiast „''The Creation of Man''”\
      \ trafiła do prywatnej kolekcji w Paryżu, we Francji.\nW 1998 roku, w uznaniu\
      \ jego zasług dla międzynarodowej sceny artystycznej, Contreras został mianowany\
      \ [[Order Świętego Jana Jerozolimskiego|Kawalerem Orderu Świętego Jana Jerozolimskiego\
      \ w Sankt Petersburgu]]. W tym samym roku stworzył pomnik ku czci słynnego meksykańskiego\
      \ dziennikarza i poety {{link-interwiki|Mauricio González de la Garza|Q=Q9030683|tekst=Mauricio\
      \ Gonzaleza de la Garza}} (1923-1995) oraz dzieło zadedykowane Soni de la Rozière,\
      \ autorce francuskiego pochodzenia, zmarłej w Cuernavaca w 1997 roku{{Cytuj\
      \ |tytuł = Paid Notice: Deaths DE LA ROZIERE, SONIA NEE RAOULDUVAL |czasopismo\
      \ = The New York Times |data = 1997-09-07 |data dostępu = 2024-06-28 |issn =\
      \ 0362-4331 |url = https://www.nytimes.com/1997/09/07/classified/paid-notice-deaths-de-la-roziere-sonia-nee-raoulduval.html\
      \ |język = en}}. Również w 1998 roku [https://www.uaem.mx/ Uniwersytet Stanowy\
      \ w Morelos] uhonorował go za jego zaangażowanie w promowanie kultury i sztuki\
      \ meksykańskiej, składając mu hołd za jego wyjątkowy wkład w dziedzinę sztuki.\n\
      W 1999 r. założył [https://alianzafrancesacuernavaca.mx/ Alliance Française\
      \ de Cuernavaca], którego był przewodniczącym. W następnym roku brał udział\
      \ w tworzeniu [[Fundacja Guggenheima|Fundacji Guggenheima]] w Meksyku i Guadalajarze.\n\
      Dwa lata później stworzył ''„Vol Infini”'', dzieło wykonane z brązu, które trafiło\
      \ do {{link-interwiki|Storm King Art Center|Q=Q2528439}}. Dzięki temu osiągnięciu\
      \ Contreras stał się pierwszym artystą z Ameryki Łacińskiej reprezentowanym\
      \ w tym prestiżowym muzeum rzeźby, które jest uważane za jedno z najważniejszych\
      \ na świecie. Jego praca nie tylko wzbogaciła kolekcję, ale także podkreśliła\
      \ znaczenie twórczości artystów latynoamerykańskich na międzynarodowej scenie\
      \ artystycznej{{Cytuj |tytuł = Storm King: SK Artwork: Infinite Flight [2000.6]\
      \ |data dostępu = 2024-06-28 |opublikowany = collections.stormking.org |url\
      \ = https://collections.stormking.org/Detail/objects/409}}.\nW 2008 roku w Cuernavace\
      \ Contreras odsłonił swoje najnowsze monumentalne dzieła zatytułowane ''„Statek\
      \ czasu”'' i ''„Pochodzenie ludzkości”''. Uroczystość ta odbyła się w obecności\
      \ doktora [[James Watson|Jamesa Watsona]], laureata [[Nagroda Nobla|Nagrody\
      \ Nobla]] w dziedzinie nauk ścisłych z 1962 roku. W tym samym roku Contreras\
      \ ręcznie stworzył ''„Ptaki w locie”'', a w 2010 roku rozpoczął prace nad szkicem\
      \ nowego monumentalnego dzieła zatytułowanego ''„La Terre”'', które ukończył\
      \ w 2012 roku. Jego prace kontynuują eksplorację głębokich tematów związanych\
      \ z ludzkością i jej przyszłością, łącząc w sobie artystyczną wizję z filozoficzną\
      \ refleksją.\nRok 2017 okazał się kluczowym momentem w karierze artysty. W tym\
      \ roku Victor Manuel Contreras został uhonorowany przez [[UNESCO]] specjalnym\
      \ wyróżnieniem za jego znaczący wkład w sztukę oraz osiągnięcia zawodowe. Prezydent\
      \ UNESCO–WFUCA, podczas uroczystości 7 lipca, ogłosił, że monumentalne dzieło\
      \ Contrerasa zatytułowane „L’immolation de Quetzacoatl” stanowi bezcenne dziedzictwo\
      \ kulturowe i artystyczne dla całej ludzkości. Ta prestiżowa nagroda nie tylko\
      \ podkreśliła wartość jego twórczości, ale także potwierdziła jego pozycję jako\
      \ jednego z najważniejszych współczesnych artystów{{Cytuj |tytuł = Recibe reconocimiento\
      \ ‘patrimonial’ sin aval |data = 2017-07-07 |data dostępu = 2024-06-28 |opublikowany\
      \ = El Informador :: Noticias de Jalisco, México, Deportes & Entretenimiento\
      \ |url = https://www.informador.mx/Cultura/Recibe-reconocimiento-patrimonial-sin-aval-20170708-0109.html\
      \ |język = es}}.\nVictor Manuel Contreras zmarł 25 maja 2023 w [[Cuernavaca]],\
      \ a o jego śmierci poinformował m.in. Prezydent Miasta Cuernavaca, José Luis\
      \ Urióstegui{{Cytuj |autor = Editorial Demos, Rubicela Morelos Cruz corresponsal\
      \ |tytuł = La Jornada - Fallece el escultor Víctor Manuel Contreras, creador\
      \ de la Paloma de la Paz |data dostępu = 2024-07-22 |opublikowany = www.jornada.com.mx\
      \ |url = https://www.jornada.com.mx/notas/2023/05/25/cultura/fallece-el-escultor-victor-manuel-contreras-creador-de-la-paloma-de-la-paz/\
      \ |język = es}}.\n== Wyróżnienia i poglądy ==\nVictor Manuel Contreras wielokrotnie\
      \ otrzymywał prestiżowe wyróżnienia i nagrody za swoją twórczość oraz działalność\
      \ kulturalną. W trakcie swojej kariery zdobył najważniejsze odznaczenia w Meksyku,\
      \ Francji i Stanach Zjednoczonych. Wśród nich znajduje się Nagroda Tlacaelela\
      \ przyznana przez Uniwersytet Słońca w Cuernavaca, Morelos oraz Złoty Laur hiszpańsko-meksykański,\
      \ przyznany za wyjątkową jakość jego pracy i osiągnięcia artystyczne.\nJego\
      \ wkład w świat sztuki został doceniony przez Romantyków z Guadalajary, co zaowocowało\
      \ mianowaniem go kawalerem Orderu Sztuki i Literatury oraz kawalerem [[Legia\
      \ Honorowa|Legii Honorowej we Francji]]. W Meksyku rząd stanu Jalisco uhonorował\
      \ go Grand Prix Jalisco i Nagrodą Sarquis. W 2009 roku rząd stanu Morelos, Uniwersytet\
      \ Morelos, miasto Cuernavaca oraz Sociedad Benemerita de Geografia y Estadistica\
      \ de Mexico przyznały mu tytuł ''Venera de Cuernavaca''.\nDzięki swojemu abstrakcyjnemu\
      \ podejściu i ekspresji rzeźbiarskiej, Victor Manuel Contreras wniósł nową estetykę\
      \ do świata sztuki, celebrując ideały wolności i sprawiedliwości. Jego prace\
      \ nie tylko wzbogaciły międzynarodowe kolekcje, ale także pozostawiły trwały\
      \ ślad w kulturze i historii sztuki.\n== Sprowadzenie dzieł Tamary Łempickiej\
      \ do Polski ==\nW maju 2023 roku, tuż przed śmiercią Contrerasa, [[Muzeum Narodowe\
      \ w Lublinie]] wzbogaciło swoje zbiory o 18 dzieł [[Tamara Łempicka|Tamary Łempickiej]],\
      \ pochodzących z jego kolekcji. Wśród nabytków, które są obecnie jedyną stałą\
      \ ekspozycją prac artystki na świecie, znalazły się zarówno obrazy olejne, jak\
      \ i prace na papierze, obejmujące różne etapy jej twórczości od lat 20. do 70.\
      \ XX wieku. Kolekcję stanowią m.in. obrazy Łempickiej: ''„Cytryna”'' z 1947\
      \ r., ''„Kobieta w turbanie III”'' z 1954 r., ''„Madonna II”'' z 1957 r., ''„Akt\
      \ z dzbankiem I”'' z 1951 r. oraz ''„Macierzyństwo”'' z 1930 r. Dzieła zostały\
      \ zakupione z rezerwy [[Prezes Rady Ministrów|Prezesa Rady Ministrów]], przy\
      \ udziale [[Ministerstwo Kultury i Dziedzictwa Narodowego|Ministerstwa Kultury\
      \ i Dziedzictwa Narodowego]]{{Cytuj |tytuł = „Łempicka wróciła do ojczyzny”.\
      \ Prace malarki trafiły do Lublina |data = 2023-06-03 |data dostępu = 2024-07-19\
      \ |opublikowany = TVN24 |url = https://tvn24.pl/bialystok/lublin-18-prac-tamary-lempickiej-z-meksyku-trafilo-do-muzeum-narodowego-w-lublinie-st7158987\
      \ |język = pl}}{{Cytuj |tytuł = Tamara Łempicka: Z Meksyku do Lublina |data\
      \ dostępu = 2024-07-19 |opublikowany = Rzeczpospolita |url = https://www.rp.pl/malarstwo/art38653331-tamara-lempicka-z-meksyku-do-lublina\
      \ |język = pl}}{{Cytuj |tytuł = Tamara Łempicka wraca do Lublina. Tym razem\
      \ na stałe |data dostępu = 2024-07-19 |opublikowany = www.rmf24.pl |url = https://www.rmf24.pl/regiony/lublin/news-tamara-lempicka-wraca-do-lublina-tym-razem-na-stale,nId,6857347\
      \ |język = pl}}{{Cytuj |tytuł = Dzieła Tamary Łempickiej z Meksyku - nowe nabytki\
      \ Muzeum Narodowego w Lublinie - Ministerstwo Kultury i Dziedzictwa Narodowego\
      \ - Portal Gov.pl |data dostępu = 2024-07-22 |opublikowany = Ministerstwo Kultury\
      \ i Dziedzictwa Narodowego |url = https://www.gov.pl/web/kultura/dziela-tamary-lempickiej-z-meksyku---nowe-nabytki-muzeum-narodowego-w-lublinie\
      \ |język = pl}}.\nW listopadzie 2023 roku, już po śmierci Victora Contrerasa,\
      \ Ministerstwo Kultury i Dziedzictwa Narodowego dokonało kolejnego zakupu trzech\
      \ obrazów, których Contreras nie chciał sprzedać w maju 2023. Spadkobiercy postanowili\
      \ jednak zrealizować pewną ideę, którą Contreras dzielił z Łempicką, polegającą\
      \ na spełnieniu jej woli, aby „posiadała coś w Polsce”{{Cytuj |data dostępu\
      \ = 2024-07-19 |opublikowany = www.pap.pl |url = https://www.pap.pl/aktualnosci/kolejne-prace-tamary-lempickiej-juz-w-polsce-trafily-do-muzeum-w-lublinie}}{{Cytuj\
      \ |tytuł = Nowa odsłona wystawy „Tamara Łempicka – ponad granicami” |data dostępu\
      \ = 2024-07-19 |opublikowany = www.rmf24.pl |url = https://www.rmf24.pl/regiony/lublin/news-nowa-odslona-wystawy-tamara-lempicka-ponad-granicami,nId,7181414\
      \ |język = pl}}.\n== Nagrody ==\n* Wyróżnienie miasta [[Los Angeles]] za jego\
      \ twórczość artystyczną i pracę (19 lutego 1988)\n* Kawaler Orderu Prawosławnego\
      \ i Szpitalnego Świętego Jana Jerozolimskiego (5 września 1998)\n* Nagroda „''Tlacaelel”''\
      \ Uniwersytetu Słońca w [[Cuernavaca]], [[Morelos]] (1999)\n* Złoty Laur Hispano-Meksykański\
      \ (1999)\n* Założyciel i prezydent Alliance Française w [[Cuernavaca]] (21 maja\
      \ 2000)\n* Kawaler [[Order Sztuki i Literatury|Orderu Sztuki i Literatury]]\
      \ przyznany w imieniu Ministra Jacques’a Lange (21 czerwca 2001)\n* Nagroda\
      \ Jalisco przyznana przez rząd stanu [[Jalisco]] (2003)\n* Nagroda Sarquisa\
      \ przyznana przez rząd [[Guadalajara|Guadalajary]] (2005)\n* Kawaler Orderu\
      \ [[Legia Honorowa|Legii Honorowej]] nadany w imieniu Prezydenta [[Jacques Chirac|Jacques’a\
      \ Chiraca]] (25 lipca 2005)\n* Wyróżnienie od Rządu Cuernavaca za ''„Szacunek\
      \ i honor''” (16 sierpnia 2006)\n* Medal Zasługi „[[Benito Juárez|Benito Juarez]]”\
      \ (23 kwietnia 2009)\n* Nagroda [[Vicente Guerrero|Vincente Guerrero]] przyznana\
      \ przez stan Guerrero (20 marca 2009)\n* Kawaler Orderu Caballero Aguila (Wrzesień\
      \ 2010)\n* Kawaler Legii Honorowej Meksyku (10 września 2014)\n* Nominacja przez\
      \ Międzynarodowy Uniwersytet (UNINTER) „Doktor Honoris Causa” (25 kwietnia 2015)\n\
      * Wyróżnienie Meksykańskiego Instytutu Nauk o Człowieku (13 lutego 2016)\n*\
      \ Wyróżnienie za wkład artystyczny przez Prezydenta [[UNESCO]] WFUCA (7 lipca\
      \ 2017){{Cytuj |tytuł = Recibe reconocimiento ‘patrimonial’ sin aval |data =\
      \ 2017-07-07 |data dostępu = 2024-07-19 |opublikowany = El Informador :: Noticias\
      \ de Jalisco, México, Deportes & Entretenimiento |url = https://www.informador.mx/Cultura/Recibe-reconocimiento-patrimonial-sin-aval-20170708-0109.html\
      \ |język = es}}.\n== Przypisy ==\n{{Przypisy}}\n{{Kontrola autorytatywna}}\n\
      {{SORTUJ:Contreras, Victor Manuel}}\n[[Kategoria:Meksykańscy malarze]]\n[[Kategoria:Urodzeni\
      \ w 1941]]\n[[Kategoria:Zmarli w 2023]]\n[[Kategoria:Rzeźbiarze]]\n[[Kategoria:Meksyk]]\n\
      [[Kategoria:Sztuka]]"
