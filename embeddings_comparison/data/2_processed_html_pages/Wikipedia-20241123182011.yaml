  title: Krytyka artystyczna
- sections:
  - content: '''''''Remiks'''''' – dzieło powstałe w wyniku przerobienia (zremiksowania),
      polegającego na dodawaniu/usuwaniu lub zmianie elementów oryginału. Remiks zachowuje
      ślady dzieła pierwotnego – przyswaja jego rozpoznawalne elementy, by stworzyć
      nową jakość, ale komunikuje swe źródło, np. poprzez tytułyEncyklopedia, remiks,
      Encyklopedia teatru polskiego [dostęp 2020-02-10] (pol.)..

      == Rodzaje remiksów ==

      Najczęściej używany w kontekście muzyki, ale remiksem może być zarówno utwór
      muzyczny co obraz, grafika, wideo, wiersz czy fotografia, pojęcie to odnosi
      się do wszystkich rodzajów dzieł i jest uznawane nawet za „paradygmat współczesnej,
      sieciowej kultury”{{Cytuj |autor = Ewa Wójtowicz |tytuł = Sztuka w kulturze
      postmedialnej |miejsce = Gdańsk |s = 214 |data = 2016}}. Można wyróżnić trzy
      rodzaje remiksu:

      # rozszerzony – pierwotnie w muzyce, polegał na dodawaniu partii instrumentalnych
      do utworu muzycznego, które wydłużając go, nie zmieniały jednak jego charakteru;

      # selektywny – dodawanie bądź usuwanie elementów, w efekcie których pozostaje
      tylko ślad, pamięć oryginału;

      # refleksyjny – miksowanie elementów z kilku źródeł, których pochodzenie zaciera
      się, dając zupełnie nową całość{{Cytuj |autor = Eduardo Navas |tytuł = Remix
      Theory |data = 2012 |data dostępu = 2020-02-10 |doi = 10.1007/978-3-7091-1263-2}}

      == Remiks w muzyce ==

      Pojęcie remiksu z początku było ściśle związane z [[Miksowanie|miksowaniem muzyki]],
      z czasem nabrało ono szerszego znaczenia. Remiks w muzyce może oznaczać:

      * przerobienie utworu w celach artystycznych, zaprezentowania go w nowej formie;

      * ulepszenie miksu starego utworu w celu poprawienia jego jakości;

      * przeróbka gatunkowa utworu mająca na celu zwiększenie grupy odbiorców;

      * manipulację stereo utworu, stworzenie wersji z dźwiękiem przestrzennym;

      * adaptację utworu w wersji klubowej;

      * wprowadzenie występów gościnnych do utworu.

      Należy pamiętać, że jest to pojęcie o bardzo dużej różnorodności wewnętrznej
      – opisuje cały zespół praktyk dotyczących edycji i manipulacji materiałem dźwiękowym{{Cytuj
      |autor = Anna Nacher |tytuł = Remiks i mashup. O niełatwym współbrzmieniu dwóch
      cyberkulturowych metafor |data = 2011 |data dostępu = 2020-02-13 |oclc = 912780899}}.

      === Historia ===

      Jedną z pierwszych osób piszących o remiksowaniu był Michaił Kaufman. Mimo że
      nie używał tego terminu, w swoich notatkach z okresu studiów w konserwatorium
      muzycznym w Białymstoku wspomina "eksperymenty z nagraniami gramofonowymi, gdzie
      z różnych fragmentów nagrań na płytach powstawała nowa kompozycja". Słowa te
      można uznać za zapowiedź praktyk remiksowania, pojawiające się stosunkowo wcześnie,
      gdyż Kaufman studiował w latach 1912–1915. [[Plik:Lawrence Lessig in beijing.JPG|mały|Twórca
      pojęcia kultury remiksu, Lawrence Lessig, na konferencji w Pekinie]]

      == Kultura remiksu ==

      Kultura remiksu (nazywana również kulturą odczytu-zapisu; ang. ''''read-write
      culture'''') to kultura społeczeństwa, w obrębie którego tworzenie dzieł pochodnych
      jest nie tylko dozwolone, ale i wspierane. Dzieła takie powstają poprzez połączenie
      lub zmianę istniejących prac w celu utworzenia nowych dzieł lub produktów. Termin
      został wprowadzony przez amerykańskiego badacza i prawnika [[Lawrence Lessig|Lawrence’a
      Lessiga]]. Kultura odczytu-zapisu, której esencją jest remiksowanie, jest jego
      zdaniem przeciwieństwem kultury odczytu (ang. ''''read only''''), która jest
      świadectwem profesjonalizmu i rozwijana jest wyłącznie przez zawodowców{{Cytuj
      |autor = Lawrence Lessig |tytuł = Remiks. Aby sztuka i biznes rozkwitały w hybrydowej
      gospodarce, tłum. Rafał Próchniak |miejsce = Warszawa |data = 2009}}.

      == Remiks w teatrze polskim ==

      W praktyce scenicznej pojęcie zostało spopularyzowane dzięki projektowi RE//MIX
      [[Komuna Warszawa|Komuny//Warszawa]], realizowanemu przez cztery lata od roku
      2010. Kuratorem projektu był Tomasz Plata, a wśród artystów znaleźli się m.in.
      [[Paweł Passini]], [[Krzysztof Garbaczewski|Krzysztof Gorbaczewski]], [[Marina
      Cecko]]. Powstało trzydzieści sześć [[Performance|performansów]], odnoszących
      się twórczo do istniejących dzieł, głównie z dziedzin teatru, tańca, literatury
      i filmu{{Cytuj |autor = Tomasz Plata |redaktor = Dorota Sajewska |tytuł = Re//mix:
      performans i dokumentacja |miejsce = Warszawa |data = 2014}}.

      Kolejnym wydarzeniem istotnym dla popularyzacji remiksów był festiwal „Dziady.
      Recykling”, zorganizowany przez [[Leszek Kolankiewicz|Leszka Kolankiewicza]].
      Artyści stosowali remiks teatralny, będący artystyczną konfrontacją z dziełem,
      biografią artysty, konwencją, formą bądź tematem, którą realizowali w formie
      powtórzenia (w zmienionej formie) dzieła z przeszłości.

      [[Plik:Sapeck-La Joconde fumant la pipe.jpg|mały|Eugène Bataille, ''''La Joconde
      fumant la pipe'''', 1887]]

      == Remiks w literaturze ==

      Głównym sposobem remiksowania dzieł literackich jest technika „[[cut-up]]” opracowana
      przez [[Brion Gysin|Briona Gysina]]''The Paris Review Interview with William
      S. Burroughs’ in A Williams Burroughs Reader, ed. John Calder (London: Picador,
      1982), p. 263.. Polega ona na dosłownym cięciu wydrukowanych słów i układaniu
      ich w nowe znaczenia. Przykładem może być powieść „The Soft Machine” (1961)
      autorstwa [[William S. Burroughs|Williama Burroughsa]].

      == Remiks w malarstwie ==

      W malarstwie również można znaleźć dzieła wykorzystujące praktykę remiksu. Mogą
      to być nawet jedynie niewielkie zmiany w obrazie źródłowym. Przykładami mogą
      być dzieła pochodne od „Mona Lisy” [[Leonardo da Vinci|Leonarda da Vinci]].
      Obrazy takie jak „[[L.H.O.O.Q.]]” [[Marcel Duchamp|Marcela Duchampa]], „[[Autoportret
      jako Mona Lisa]]” [[Salvador Dalí|Salvadora Dalego]] czy też „La Joconde fumant
      la pipe” autorstwa [[Eugène Bataille]] w oczywisty sposób czerpią z dzieła renesansowego
      twórcy.

