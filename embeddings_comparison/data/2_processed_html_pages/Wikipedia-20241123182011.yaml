- sections:
  - content: "{{Inne znaczenia|2=[[forma|inne rozumienia słowa „forma”]]}}\n'''Forma'''\
      \ w dziedzinie [[sztuka|sztuki]] oznacza te jej właściwości, które związane\
      \ są z kształtem (np. [[Rzeźbiarstwo|rzeźba]], [[architektura]]), konstrukcją\
      \ (układem) zapisu (np. [[poezja]], [[powieść]], [[muzyka]]). Nie mając bezpośrednio\
      \ wpływu na treść dzieła sztuki, decyduje jednak o wyborze sposobu w jaki dzieło\
      \ sztuki jest rejestrowane i przekazywane [[Odbiorca|odbiorcy]].\nZe względu\
      \ na fakt, że na przestrzeni dziejów zmieniały się sposoby widzenia i kategoryzacji\
      \ tego, co dziś określa się mianem sztuki oraz różne jej interpretacje (np.\
      \ [[sztuka użytkowa]]) definicja powyższa nie jest jednoznaczna.\nW [[Historia\
      \ sztuki|historii sztuki]] znaczenie, opis i systematyzacja formy w sztuce ujmowane\
      \ były na różne sposoby, w tym jako układ i kształt. \n== Forma jako układ ==\n\
      [[Plik:Stoa in Athens.jpg|right|300px|thumb|Układ kolumn w Stoii Attalosa w\
      \ Atenach]]\nForma jako układ części, elementów, składników dzieła, np. forma\
      \ [[portyk]]u jest układem [[kolumna (architektura)|kolumn]], a melodia jest\
      \ układem dźwięków. Definicja ta zrodziła się w czasach starożytnych u Greków.\
      \ [[Arystoteles]] uważał, iż jej autorami byli [[Pitagoras|pitagorejczycy]].\
      \ Miała ona charakter normatywny – była próbą odkrycia praw rządzących sztuką\
      \ i narzucenia ich dziełom. Zakładała, że piękno jest obiektywne i da się je\
      \ jasno określić. Zatem piękne było według Greków tym, co harmonijne, symetryczne,\
      \ tworzące ład, proporcjonalne. Te cechy były ważniejsze niż charakter elementów\
      \ użytych do stworzenia dzieła, np. rzeźba kobiety była estetyczna dzięki idealnym\
      \ proporcjom, a nie wyszukanej fryzurze, biżuterii czy draperii szaty.\n== Forma\
      \ jako kształt ==\nMiędzy XV a XVIII stuleciem powstało kolejne pojęcie formy\
      \ – jako [[kontur]], [[rysunek]], zarys kształtu przedmiotu, będący przeciwieństwem\
      \ [[Barwa|barwy]]. W tych czasach dochodziło do radykalnych posunięć w postrzeganiu,\
      \ co jest w sztukach plastycznych istotne – [[barok]] sprzeciwiał się renesansowemu\
      \ ignorowaniu znaczenia kolorów tworząc kolorystyczny nurt malarstwa, z kolei\
      \ w oświeceniu najważniejszy był rysunek akademicki. [[Immanuel Kant|Kant]]\
      \ pisał, że momentem istotnym jest rysunek, barwy zaś są jedynie „rzeczą powabu”\
      \ i nie mogą przedmiotu„ uczynić godnym oglądania ani pięknym”.\n[[Rudolf Arnheim]]\
      \ pisał: ''Postrzegając kształt, zawsze świadomie lub nieświadomie przyjmujemy,\
      \ że kształt ten coś przedstawia, a wobec tego, że jest formą jakiejś treści''R.\
      \ Arnheim: ''Sztuka i percepcja wzrokowa''. Zatem według drugiej definicji formą\
      \ nazywa się to, co jest bezpośrednio dane zmysłom – formę widzimy lub słyszymy\
      \ i dzięki niej odczytujemy sens dzieła. Przykładowo w [[Poezja|poezji]] brzmienie\
      \ słów jest formą, natomiast ich znaczenie – treścią. I właśnie w dziedzinie\
      \ sztuki słowa po raz pierwszy wyodrębnili tę definicję formy [[sofiści]]. Średniowieczni\
      \ [[Scholastyka (filozofia)|scholastycy]] starali się jak najprecyzyjniej oddzielać\
      \ formę od treści, podobnie problem ten badano w [[renesans|Odrodzeniu]] i kolejnych\
      \ epokach. Z czasem definicja ta przestała dotyczyć tylko poezji, objęła też\
      \ [[Sztuka|sztuki piękne]] i [[Muzyka|muzykę]]. W niektórych okresach muzykę\
      \ postrzegano wręcz tylko jako formę, nie niosącą w sobie żadnej treści. Takie\
      \ formalistyczne stanowisko zyskiwało z biegiem lat coraz szerszą sławę, aż\
      \ do utworzenia nurtu formalistycznego w sztuce w XIX wieku.\n== Zarys historii\
      \ pojęcia formy w sztuce ==\n[[Arystoteles]] sprzeciwił się platońskiej teorii\
      \ świata idei, doszedł do wniosku, że to w świadomości ludzkiej, podczas stykania\
      \ się z przedmiotami, powstają ich idealne wzorce. Pomimo że człowiek widzi\
      \ np. kilka koni, które różnią się od siebie wielkością, umaszczeniem czy innymi\
      \ indywidualnymi cechami, to jednak potrafi wyciągnąć z tych obserwacji pewną\
      \ część wspólną, czyli takie cechy, które sprawiają, że koń jest koniem – jego\
      \ istotę. To właśnie Arystoteles uważał za formę. Oczekiwał od artystów obserwacji\
      \ przyrody, aby byli w stanie pomijając cechy przypadkowe docierać do istoty\
      \ rzeczy i przedstawiać je w dziełach. Dotyczyło to sztuki mimetycznej, która\
      \ była dla Greków ideałem. Do tej definicji powrócił np. [[Piet Mondrian]].\
      \ Zaczynał on swoją twórczość od bardzo dokładnego odtwarzania rzeczywistości,\
      \ badał ją i stopniowo eliminował cechy przypadkowe. W końcu sprowadził cały\
      \ otaczający go świat do układów linii prostych i podstawowych kolorów, analizował\
      \ ich wzajemne zależności i oddziaływania – one zdaniem Mondriana okazały się\
      \ być istotą rzeczywistości i dzięki nim osiągał na swych obrazach harmonię\
      \ uniwersalną, którą określał jako piękno kosmiczne.\n[[Immanuel Kant|Kant]]\
      \ forsował definicję formy jako aprioryczną, czyli jak wskazuje określenie –\
      \ przyjętą z góry, opartą i uzasadnioną nie na doświadczeniu lecz na rozumowaniu.\
      \ W ''[[Krytyka czystego rozumu|Krytyce czystego rozumu]]'' Kant wymienia aprioryczne\
      \ formy poznania: przestrzeń, czas, substancję, przyczynowość - są to stałe\
      \ umysłu i za ich pomocą możliwe jest wszelkie poznanie. Jednakże w ''Krytyce\
      \ władzy sądzenia'', w której podjął się krytyki piękna, stwierdził, że wobec\
      \ sztuki, twórczości, te aprioryczne formy nie obowiązują – o pięknie nie decydują\
      \ stałe umysłu, lecz wyjątkowe jednorazowe uzdolnienia twórców. Dopiero następcy\
      \ Kanta zbliżyli jego definicję formy do sztuki – przede wszystkim Konrad Fiedler\
      \ i [[Heinrich Wölfflin|Heinrich Wolfflin]]. Według pierwszego z nich nie tylko\
      \ umysł, ale i nasze widzenie ma zakorzenioną formę powszechną, kieruje się\
      \ pewnymi prawami. To, jak postrzegane jest dane dzieło zależy tylko od odbiorcy,\
      \ który jest podmiotem i poddaje sztukę analizie poprzez swoje właściwości umysłu.\
      \ To prowadzi do wniosku, iż nie istnieje jedna uniwersalna forma widzenia,\
      \ lecz, że jest ich tyle, ile podmiotów, ilu odbiorców sztuki. Formy te nie\
      \ są ponadczasowe, stałe, tylko zmieniają się, wiążą z daną epoką. To właśnie\
      \ zauważył Wolfflin, który stworzył teorię alternatywnych form klasycznych i\
      \ barokowych.\n[[Johann Joachim Winckelmann|Winckelmann]], ojciec współczesnej\
      \ historii sztuki, pisał, że: „''dokładność oka w obserwacji prawdziwej formy\
      \ i wielkości tematów obrazów i ich formy dotyczy w równej mierze koloru, jak\
      \ i kształtu''”''Winckelmann - Writings On Art'' wyd. Phaidon, 1972, {{ISBN|071481508X}}\
      \ str.93. Jego teoretyczne prace na temat sztuki i jej historii dały podstawy\
      \ prądu [[Neoklasycyzm|neoklasycystycznego]], gdzie forma naśladowana z okresu\
      \ hellenistycznego i jego elementów w klasyce rzymskiej, traktowana była, jako\
      \ próba nałożenia harmonii w dziełach artystycznych, co z kolei miało mieć bezpośredni\
      \ wpływ na osiągnięcie piękna sztuki''Essay on the Beautiful in Art'', J.J.\
      \ Winckelmann, 1763.\n== Współczesność ==\nPozorny brak formy lub jej wyraźne\
      \ ograniczenie jest charakterystycznym rysem wielu współczesnych prądów w sztuce.\
      \ Daje się to szczególnie łatwo zaobserwować w formach poetyckich. O ile klasyczna\
      \ i klasycyzująca poezja podporządkowana była rygorystycznym zasadom formy (np.\
      \ [[sonet]], [[elegia]], [[aleksandryn]]), o tyle współczesna poezja buntując\
      \ się wobec ograniczeń formalnych często odrzuca formę zastaną lub do tej pory\
      \ obowiązującą (np. [[wiersz wolny]]){{Cytuj|tytuł = Podręczny słownik terminów\
      \ literackich |data = 2002 |isbn = 8385254730 |wydanie = Wyd. nowe, popr. |inni\
      \ = Michał Głowiński; Janusz Sławiński |miejsce = Warszawa |wydawca = Wyd. Open\
      \ |oclc = 749597596}}. Trudno jednak powiedzieć, że odrzucenie zastanych form\
      \ jest brakiem formy. Każdy zapis twórczości w sztuce musi opierać się na jakiejś\
      \ formie, gdyż jest ona materialną manifestacją idei artystycznej. Zmieniające\
      \ się na przestrzeni dziejów pojęcia i rozumienia formy wynikały z nowych potrzeb\
      \ kulturowych i rozwoju lub upadku społeczeństw. Jak dwie strony tej samej monety,\
      \ można powiedzieć, że brak lub odrzucenie formy jest rewersem istniejącej formy-dewizy.\
      \ We wstępie do polskiego tłumaczenia ''[[Fajdros (dialog)|Fajdrosa]]'' Platona,\
      \ [[Władysław Witwicki]] opisywał zmiany w formie sztuki starożytnej w Grecji''Fajdros'',\
      \ Platon, Warszawa, wyd. PWN, 1958,. Sztuka grecka czasów Platona, będąca w\
      \ rozkwicie hellenizmu, różniła się w sposób zasadniczy od surowej estetyki\
      \ i formy antycznej sztuki greckiej. Z opisu Witwickiego wnioskować można, że\
      \ już wówczas zmiany te były nie mniej rewolucyjne od tych, zachodzących w rozumieniu\
      \ i stosowaniu formy w sztuce współczesnej.\n== Forma w architekturze ==\nW\
      \ okresie [[Starożytność|starożytności]] forma w architekturze miała nie tylko\
      \ wpływ na treść ale i sama była treścią. Przykładem tego były [[Piramida|piramidy]]\
      \ w cywilizacjach starożytnych. Użytkowość tak widzianej funkcji formy miesza\
      \ się tu z jej funkcją samowytwarzania treści abstrakcyjnej (powaga, majestatyczność,\
      \ nieśmiertelność). Podobne zastosowanie formy w architekturze znajdujemy później\
      \ w budownictwie sakralnym od wieków średnich poczynając aż po czasy współczesne,\
      \ gdzie forma użytkowa mieszała się z przekazem abstrakcyjnym (strzelistość\
      \ wież symbolizujących [[wniebowstąpienie]], kształt konstrukcji naw głównych\
      \ i bocznych w formie krzyża).\n== Zobacz też ==\n* [[Kognitywizm estetyczny]]\n\
      * [[Estetyka]]\n== Przypisy ==\n{{Przypisy}}\n[[Kategoria:Sztuka]]"
