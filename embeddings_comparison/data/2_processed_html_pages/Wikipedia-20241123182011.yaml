      Po I wojnie światowej poeta [[Guillaume Apollinaire]] w zbiorze ''''Kaligramy''''
      (1918) śmiało traktował tekst jak swobodną kompozycję [[Grafika|graficzną]],
      nadając całości charakter [[Poezja konkretna|poezji wizualnej]] (np. w utworze
      ''''Mandolina, goździk i bambus'''')[[Guillaume Apollinaire]]: ''''Wybór poezji''''.
      Oprac. Jerzy Kwiatkowski. Wrocław, Ossolineum, 1976, [[Biblioteka Narodowa (seria)|BN]],
      brak numeru ISBN.. Także [[futuryzm]] często [[eksperyment]]ował, próbując syntezy
      sztuk.

      Nową pochwałę [[Wyobraźnia|wyobraźni]] dał [[surrealizm]], niejako programowo
      otwarty na swobodne pole skojarzeń i zespolenie tworzywa różnych sztuk. Teoretyk
      kierunku, [[André Breton]], dał w ''''[[Manifest surrealizmu|Manifeście surrealizmu]]''''
      (1924) program sztuki wyzwolonej i fantasmagorycznej''''Surrealizm. Teoria i
      praktyka literacka''''. Oprac. Adam Ważyk. Warszawa, Czytelnik, 1973, brak numeru
      ISBN.. Skromniej wypadły ówczesne realizacje artystyczne tych założeń. Wyjątkiem
      był niemy film [[Luis Buñuel|Luisa Buñuela]] ''''[[Pies andaluzyjski]]'''' z
      1928 roku – [[Halucynacje|halucynacyjny]] splot drastycznych obrazów (słynna
      scena przecinania oka brzytwą) o niejasnym znaczeniu [[symbol]]icznym, zwłaszcza
      erotycznym; było to jednak przede wszystkim studium podświadomości. Wielkie
      jest natomiast znaczenie idei surrealizmu jako inspiracji dla sztuki późniejszej
      – oto przyzwolenie (z ducha [[barok]]u i [[romantyzm]]u) na kreacyjną swobodę
      artysty.

      W [[Historia Polski (1918–1939)|dwudziestoleciu międzywojennym]] [[Futuryzm|futurystyczny]]
      poeta i malarz [[Tytus Czyżewski]] ujmował swe utwory na sposób bliski [[Poezja
      konkretna|poezji wizualnej]] – to wiersze ''''Poznanie'''' i ''''Dom'''', poemat
      ''''Elektryczne wizje''''''''Antologia polskiego futuryzmu i Nowej Sztuki''''.
      Oprac. Zbigniew Jarosiński i Helena Zaworska. Wrocław, Ossolineum, 1978, [[Biblioteka
      Narodowa (seria)|BN]], brak numeru ISBN.. Tom Czyżewskiego ''''Pastorałki''''
      efekt syntezy sztuk uzyskuje, łącząc tekst poetycki i [[Stylizacja|stylizowane]]
      na dawną [[Grafika|grafikę]] [[Ilustracja|ilustracje]] [[Tadeusz Makowski|Tadeusza
      Makowskiego]]. Bliscy syntezy sztuk są dwaj wszechstronni artyści: [[Stanisław
      Ignacy Witkiewicz|Witkacy]] i [[Bruno Schulz]], tak w zakresie rozległości działań
      twórczych, jak ukształtowania tworzywa dzieł. [[Stanisław Ignacy Witkiewicz|Witkacowska]]
      [[teoria czystej formy]] była także projektem sztuki ujętej synkretycznie, która
      wyraża (jak pisał) „uczucia metafizyczne”, łącząc wymiar [[Estetyka|estetyczny]]
      i [[egzystencja]]lny, a stanowiąc oczyszczającą ''''[[Katharsis (literatura)|katharsis]]''''.
      Witkiewicz nadawał swym obrazom olejnym z okresu [[formizm]]u wymiar literacko-wizyjny
      (''''Kuszenie świętego Antoniego''''), z kolei w dramatach kształtował pełne
      napięcia obrazy, wyrafinowane kompozycyjnie, ujęte malarsko i „filmowo” (''''Kurka
      Wodna'''', ''''Matka'''', ''''Sonata Belzebuba''''). Schulz tworzył osnute wokół
      erotycznej fabuły [[Grafika|grafiki]] (''''Xięga bałwochwalcza''''), a prozę
      ujmował jako [[Ekspresjonizm (literatura)|ekspresjonistycznie]] budowane bogate
      plastycznie obrazy.

      == Ponowoczesność ==

      Literatura nowsza nawiązuje do idei syntezy sztuk często przy okazji podejmowanego
      [[eksperyment]]u. [[Jan Lechoń]], poeta zawsze wrażliwy na malarstwo i muzykę,
      wiersz ''''Sarabanda dla Wandy Landowskiej'''' (ze swego ostatniego tomu ''''Marmur
      i róża'''', 1954) ujął jako niemal muzyczną, wedle tytułu, [[Sarabanda|sarabandę]],
      której rytm przypomina miniaturę [[klawesyn]]ową. [[Jarosław Iwaszkiewicz]]
      jeszcze w okresie międzywojennym w dedykowanym Witkacemu utworze ''''Wieczór
      u Abdona'''' (1922) budował nastrojową opowieść fabularną jak senną wizję, znamienną
      muzycznym rytmem i malarską wyrazistością nawarstwiających się obrazów{{Cytuj
      |autor = [[Jarosław Iwaszkiewicz]]; |tytuł = Proza poetycka |data = 1980 |isbn
      = 83-07-00204-4 83-07-00159-5 |miejsce = Warszawa |wydawca = Czytelnik |oclc
      = 830254471}}. Po latach podobnie – jak syntezę [[Narracja|narracji]] [[Psychologia|psychologicznej]],
      malarsko ujętych obrazów i prowadzonych jak [[leitmotiv]] wątków muzycznych
      (sięgając stosującego taką technikę kompozycji Wagnera) – zbudował opowiadanie
      ''''Sny'''' z tomu ''''Sny. Ogrody. Sérénité'''' (1974). W późnym tomie poezji
      i prozy ''''Album tatrzańskie'''' (1975) zamieścił zaś pisany zrytmizowaną prozą
      poetycką utwór ''''Niebo'''', opatrzony na wstępie autorskim komentarzem, iż
      jest to „usiłowanie możliwie ścisłe oddania w słowie formy sonatowej”Jarosław
      Iwaszkiewicz: ''''Album tatrzańskie''''. Kraków, Wyd. Literackie, 1975, brak
      numeru ISBN, s. 9. – utwór jest więc literacką [[Transpozycja (muzyka)|transpozycją]]
      muzycznej formy [[Sonata|sonaty]].

      W kulturze współczesnej programowo syntezę sztuk kształtował kompozytor [[Olivier
      Messiaen]] (obdarzony wyobraźnią synkretyczną, „barwnym słyszeniem”, kojarzący
      kolory i dźwiękiTadeusz Kaczyński: ''''Messiaen''''. Kraków, PWM, 1986, {{ISBN|83-224-0248-1}}.),
      zwłaszcza w operze ''''Święty Franciszek z Asyżu'''' i [[Muzyka elektroniczna|muzyce
      elektronicznej]] wykorzystującej [[fale Martenota]]. Rozmaite tworzywa łączył
      też w dziełach [[Opera|operowych]] [[Krzysztof Penderecki]], najpełniej w ''''sacra
      rappresentazione'''' (to odmiana gatunkowa opery) ''''Raj utracony'''', sięgającym
      wprost do barokowo-romantycznej tradycji stylistycznej.

      Indywidualność szczególną stanowił wszechstronny [[Roland Topor]], z tradycji
      [[barok]]u i, zwłaszcza [[surrealizm]]u (znał osobiście [[André Breton|Bretona]])
      wywodzący swą twórczość [[Rysunek|rysownik]], [[Grafika|grafik]], dramaturg
      i autor opowiadań, współpracujący też z [[film]]em ([[Latarnia czarnoksięska|latarnia
      magiczna]] dla ''''[[Casanova (film 1976)|Casanovy]]'''' [[Federico Fellini|Felliniego]]).

      Powstały w okresie [[Modernizm (sztuka)|modernizmu]] [[film]] jako technika
      rejestrowania i unaoczniania ruchu, a z czasem i sztuka, mógł budować synkretyczną
      wizję z chwilą uzyskania technicznej dojrzałości przekazu w obrębie precyzji
      dźwięku i barwy. Stało się to w latach 50.–60. XX wieku. Najpełniej i z barokowym
      rozmachem budował wielkie wizje filmowe [[Federico Fellini]] – reżyser o wyobraźni
      malarza (i uzdolnieniach plastycznych), wrażliwy też muzycznie. Tworzył syntezę
      sztuk w obrębie całego dzieła, z kulminacją w wybranych sekwencjach – tak w
      filmach ''''Giulietta i duchy'''' (zmysłowe i [[orgia]]styczne epizody w domu
      Suzy, sąsiadki głównej bohaterki), ''''Satyricon'''' (wędrówka [[Homoseksualizm|homoseksualnych]]
      kochanków przez dom publiczny), ''''Rzym'''' (pokaz mody kościelnej), ''''[[Casanova
      (film 1976)|Casanova]]'''' ([[Latarnia czarnoksięska|latarnia magiczna]] projektu
      [[Roland Topor|Topora]], brzmiący chóralnie muzyką Wagnera epizod niemiecki),
      ''''Miasto kobiet'''' (żona bohatera, śpiewająca w domu Snaporaza [[Aria|arię]]
      z [[Giuseppe Verdi|Verdiowskiej]] ''''[[Traviata|Traviaty]]''''), ''''A statek
      płynie'''' (muzyka Verdiego w scenie rozsypania prochów śpiewaczki na morzu
      oraz tonięcia okrętu).

      Podobny styl ujawniał [[Luchino Visconti]] (który cenił zresztą operę i reżyserował
      spektakle operowe) w filmach ''''[[Lampart plamisty|Lampart]]'''' i ''''[[Zmierzch
      bogów (film)|Zmierzch bogów]]'''', ale zwłaszcza w przesyconym muzyką Wagnera
      ''''Ludwigu'''' (którego bohaterem był obłąkany protektor kompozytora – król
      Ludwik Bawarski). Syntezę sztuk podejmuje [[Ken Russell]], przesycając swe filmy
      muzyką portretowanych kompozytorów, wykorzystywaną też w scenach ściśle wizyjnych
      (''''Kochankowie muzyki'''' – o [[Piotr Czajkowski|Czajkowskim]]; ''''Mahler''''),
      a w ''''Diabłach'''' dając brutalną i steatralizowaną wizję epoki baroku. Russell
      zrealizował w 1975 film ''''[[Tommy (film)|Tommy]]'''', stanowiący barokowo
      bujną plastycznie adaptację ''''[[musical]]u'''' – synteza sztuk wkroczyła tak
      w krąg [[Kultura popularna|kultury masowej]]. Z kolei w filmach [[Andriej Tarkowski|Andrieja
      Tarkowskiego]] (''''[[Andriej Rublow (film)|Andriej Rublow]]'''', ''''[[Zwierciadło
      (film)|Zwierciadło]]'''', ''''[[Ofiarowanie (film)|Ofiarowanie]]'''') syntezę
      sztuk tworzą bezpośrednie [[cytat]]y z dzieł malarstwa, powiązane z muzyką wielkich
      mistrzów. Podobną syntezę uzyskiwał [[Werner Herzog]], wiążąc „malarsko” filmowany
      [[pejzaż]] i dźwięk (''''[[Szklane serce]]'''' – z [[Rock psychodeliczny|psychodeliczną]]
      muzyką [[rock]]ową, ''''[[Fitzcarraldo]]'''' – z muzyką [[Opera|operową]]).

      Spośród polskich reżyserów [[Andrzej Wajda]] świadomie [[Imitacja|imituje]]
      obrazy [[Malarstwo|malarskie]] w filmach ''''[[Wesele (film 1972)|Wesele]]''''
      (odwołując się do [[pastel]]i [[Stanisław Wyspiański|Wyspiańskiego]]) i ''''[[Brzezina
      (film)|Brzezina]]'''' ([[Stylizacja|stylizując]] [[kadr]]y na [[Kompozycja (sztuki
      wizualne)|kompozycje]] [[Symbolizm|symboliczne]] [[Jacek Malczewski|Jacka Malczewskiego]]),
      nadaje też znaczenie dramatyczne [[Barwa|barwie]]. [[Wojciech Jerzy Has|Wojciech
      Has]] w filmie ''''[[Sanatorium pod Klepsydrą (film)|Sanatorium pod Klepsydrą]]'''',
      wizjonersko przetwarzającym prozę [[Bruno Schulz|Schulza]], zyskał efekt syntezy
      sztuk dzięki malarskiej kompozycji kadrów i [[barok]]owo oraz [[Secesja (sztuka)|secesyjnie]]
      ujętej [[Scenografia|scenografii]] [[Jerzy Skarżyński|Jerzego Skarżyńskiego]].
      [[Andrzej Żuławski]] w ujętym jak [[Metafizyka klasyczna|metafizyczny]] ''''[[Dreszczowiec|thriller]]''''
      [[Historia|historyczny]] ''''[[Diabeł (film 1972)|Diable]]'''' efekt wizjonerskiej
      syntezy uzyskał, łącząc wysmakowane malarsko kadry (bliskie [[pejzaż]]y [[Caspar
      David Friedrich|Friedricha]]) z brzmiącą [[rock]]owo muzyką [[Andrzej Korzyński|Andrzeja
      Korzyńskiego]]. Współcześnie [[Lech Majewski (reżyser)|Lech Majewski]] zrealizował
      [[Opera|operowo]] ujęty film ''''Pokój saren'''' (w całości śpiewany), wykorzystywał
      też w kadrach [[malarstwo]] (''''[[Angelus (film)|Angelus]]'''' – sięgający
      do [[Sztuka naiwna|malarza naiwnego]] [[Teofil Ociepka|Teofila Ociepki]], ''''[[Ogród
      rozkoszy ziemskich]]'''' – do obrazu [[Hieronim Bosch|Boscha]]).

      [[Plik:Installation performance Cryogene.jpg|thumb|Najnowsze dzieła z dziedziny
      performance czerpią środki wyrazu z plastycznych [[Instalacja (sztuka)|instalacji]]
      i [[Sztuka wideo|video-artu]] wmontowując w nie teatralne działanie artysty
      stającego się częścią dzieła, które sam tworzy. Na równi z widowiskowością czy
      [[Kompozycja (sztuki wizualne)|kompozycją]], artysta stawia pewne przesłanie
      lub literacki [[Przekaz pisemny|przekaz]]. Tutaj na fotografii performance pt.
      ''''Cryogène'''', Awinion 2008]]

      Miejsce osobne zajmuje film operowy, stanowiący adaptację opery, jednak tylko
      wówczas, kiedy reżyser nie zmierza w stronę realizmu, ale wysnuwa konsekwencje
      artystyczne ze spotkania wielu sztuk w obrębie jednego dzieła. Tak uczynili
      [[Ingmar Bergman]] (''''[[Czarodziejski flet (film 1975)|Czarodziejski flet]]''''
      według [[Wolfgang Amadeus Mozart|Mozarta]]) i [[Andrzej Żuławski]] (''''[[Borys
      Godunow (film 1989)|Borys Godunow]]'''' według [[Modest Musorgski|Musorgskiego]]).
      Bliski jest temu europejski [[film muzyczny]], który odchodzi od tradycji realistycznie
      kształtowanego ''''[[musical]]u'''' – to Jacques Demy i ''''[[Parasolki z Cherbourga]]''''
      z [[Catherine Deneuve]] w roli głównej i muzyką [[Michel Legrand|Legranda]],
      film w całości śpiewany, ale też pełen wysmakowanych [[Barwa|kolorystycznie]]
      [[kadr]]ów.

      W obrębie [[Malarstwo|malarstwa]] oraz [[Rzeźbiarstwo|rzeźby]] po II wojnie
      światowej synteza sztuk ujawniała się, zresztą często, poprzez [[synkretyzm]]
      formy, a w końcu odejście od gotowego, ukończonego przez artystę, dzieła na
      rzecz ukazywania procesu twórczego przy wykorzystaniu tworzywa różnych sztuk.
      Tak [[sztuka konceptualna]] jak, pokrewny jej,''''[[performance]]'''' improwizując,
      ukazując sztukę jako proces – wykorzystują najrozmaitsze tworzywo: malarskie,
      literackie, ale zwłaszcza [[Multimedia|technikę multimedialną]] (szczególnie
      [[Magnetowid|wideo]]). Tak, przy wykorzystaniu urządzeń [[Elektronika|elektronicznych]]
      oraz [[Technika cyfrowa|techniki cyfrowej]], urzeczywistnia się dawna, wielowiekowa,
      idea syntezy sztuk.

      [[Plik:Performance.jpg|thumb|left|270px|Produktem [[happening]]u będącego publiczną
      manifestacją sztuki z pogranicza teatru, plastyki i tańca są najczęściej formy
      ulotne, tak jak w tym przypadku. Bywają jednak trwałe i wysublimowane, jak monumentalne
      dzieła [[Franciszek Starowieyski|Franciszka Starowieyskiego]] powstałe w jego
      „teatrze rysowania”]]

      W obrębie [[Kultura popularna|kultury masowej]] zjawiskiem wysnutym z, najprostszej,
      syntezy tworzywa w obrębie [[Percepcja|percepcji]] jest [[komiks]]. Ciekawszy,
      a często wyrafinowany stylowo i wybitny artystycznie, praktyczny przejaw syntezy
      sztuk to [[Teledysk|wideoklip]] – zjawisko powszechne w obrębie popularnej kultury
      muzycznej, a oparte na kojarzeniu obrazu i dźwięku. [[Interpretacja utworu literackiego|Interpretując]],
      a raczej unaoczniając, [[Piosenka|piosenkę]] teledysk osnuwa wokół niej zarys
      [[Fabuła|fabuły]], stawia przed wykonawcą zadania aktorskie, nadaje znaczenie
      [[Scenografia|scenografii]], kostiumom, czy nawet [[makijaż]]owi postaci. Osobne
      znaczenie ma tu [[Montaż filmowy|montaż]] (zwykle szybki jego rytm), także specjalne
      efekty plastyczne uzyskiwane [[komputer]]owo. Powstająca z tego całość to synteza
      sztuk. Pionierskie dokonania w tej mierze miał zespół [[Queen]] (w teledysku
      do piosenki „[[Save Me]]” wykorzystano po raz pierwszy [[Film animowany|animację]]).
      Oryginalne teledyski nagrała [[Madonna (piosenkarka)|Madonna]] („[[Music (singel)|Music]]”,
      także „[[Hung Up]]” oraz „[[Sorry]]” – z albumu ''''[[Confessions on a Dance
      Floor]]''''). Mistrzem tej formy był [[Michael Jackson]], którego teledysk do
      tytułowej piosenki albumu ''''[[Thriller (album)|Thriller]]'''' uchodzi za arcydzieło.

      Cenionym przez publiczność przejawem syntezy sztuk w obrębie kultury popularnej
      są [[plener]]owe widowiska nazywane ''''son et lumière'''' ([[Język francuski|fr.]]
      dosł. ''''dźwięk i światło''''), w Polsce określane jako [[światło i dźwięk]]
      – nocne spektakle wykorzystujące muzykę i grę barw.

      W Polsce rozwijała się [[poezja konkretna]] (zwana też „poezją wizualną”), której
      przedstawicielami byli [[Stanisław Dróżdż (poeta)|Stanisław Dróżdż]] i – uchodząca
      za największą indywidualność – [[Marianna Bocian]].

      Nawiązaniem do tradycji stała się powstała w roku 1980 „[[Correspondance des
      Arts]]” – grupa [[Łódź|łódzkich]] artystów, którą tworzyli: Andrzej Graczykowski
      (grafik i malarz), [[Zbigniew Janeczek]] (grafik), [[Zdzisław Jaskuła]] (poeta)
      i Janusz Paweł Tryzno (grafik i fotograf); w latach 1981–1985 grupa wydała siedem
      unikatowych [[Bibliofilstwo|bibliofilskich]] książek ilustrowanych oryginalnymi
      grafikami. Po roku 1990 tradycje grupy przejęła fundacja Correspondance des
      Arts i [[Muzea w Łodzi#Muzeum Książki Artystycznej – Book Art Museum|Muzeum
      Książki Artystycznej]] w Łodzi.

