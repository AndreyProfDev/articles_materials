  title: Nagroda Wolfa
- sections:
  - content: '''''''Krytyka artystyczna, krytyka sztuki'''''' – działalność intelektualna
      polegająca na dyskusji, ocenianiu i interpretacji dzieł sztuki (dawn. dzieł
      sztuk plastycznych). Teksty krytyczne mogą mieć charakter publicystyczny, informacyjny,
      naukowy lub literacki. Najczęściej dotyczą twórczości osób współczesnych osobie
      piszącej – [[Krytyk (zawód)|krytyczce lub krytykowi sztuki]]{{encyklopedia PWN|id
      = 3928067|tytuł=krytyka artystyczna|data dostępu=2020-01-16}}.

      == Historia ==

      [[Plik:Denis Diderot - Alix - Vanloo.png|mały|[[Pierre-Marie Alix]], portret
      [[Denis Diderot|Denisa Diderot]]]]

      W swym słynnym eseju pt. ''''Przeciw interpretacji'''' z 1966 r. [[Susan Sontag]]
      miała zauważyć, że „nawyk interpretacji dzieł sztuki sięga klasycznej Grecji,
      choć ten rodzaj komentarza, wynikający z ówczesnej potrzeby objaśniania mitów,
      był z czasem systematycznie przytłaczany filozoficznym „rozjaśnianiem” tejże
      kwestii”Andrzej Saj, ''''Krytyka twórcza – między teorią sztuki a literaturą
      (wstęp do problemu)'''', w: ''''Krytyka sztuki. Filozofia, praktyka, dydaktyka'''',
      red. Łukasz Guzek, Gdańsk 2013, s. 15–25..

      Krytyka artystyczna, jako wyspecjalizowana i odrębna od filozofii praktyka komentowania
      sztuki, zrodziła się w XVIII w. we Francji. Na jej wyodrębnienie z piśmiennictwa
      o sztuce wpływ miały dwa kluczowe czynniki: powstawanie w XVII i XVIII w. nowych
      instytucji sztuki – [[Akademia sztuk pięknych|akademii sztuk pięknych]] oraz
      zmiana roli i sposobu rozumienia [[Wystawiennictwo|wystawy]], która z pokazu
      służącego celom religijnym czy politycznym stała się prezentacją dzieł służących
      przeżyciom estetycznym i refleksji intelektualnej. Poszukując odrębności i specyficznego
      dla krytyki sztuki języka wzorowano się na ówczesnej [[Krytyka teatralna|krytyce
      teatralnej]].

      Miejscem dyskutowania i ustalania hierarchii artystycznych oraz decydowania
      o wartości dzieł sztuki w XVIII i XIX w. był cyklicznie odbywający się w Paryżu
      [[Salon (wystawa)|Salon]], stanowiący centrum ówczesnego świata sztuki. [[Denis
      Diderot]], autor „utrzymanych w formie esejów, przeplatanych dialogami i dygresjami,
      sprawozdań z salonowych wystaw” uznawany jest za prekursorskiego krytyka sztuki.

      Znaczenie krytyków wzrosło wraz z upowszechnieniem się tej formuły prezentacji
      twórczości artystycznej i organizacją salonów w innych miejscach. Decentralizacja
      systemu oznaczania wartości sztuki zaowocowała m.in. powstawaniem galerii komercyjnych
      w drugiej połowie XIX w., a krytyka stanowiła kluczowe ogniwo w mechanizmie
      kształtowania jego wewnętrznych hierarchii.

      Za pierwszych krytyków uważa się osoby niezwiązane z paryską [[Królewska Akademia
      Malarstwa i Rzeźby|Akademią]] i w związku z tym tradycyjnie przyjmuje się, że
      krytyka artystyczna jest praktyką pozaakademicką. Współcześnie, „zwłaszcza w
      obszarze anglosaskim – jak zauważa [[Piotr Juszkiewicz]], – zaciera się granica
      między działalnością naukową, zajmującą się twórczością artystów XX w., a działalnością
      określaną jako krytyka artystyczna; linia podziału biegnie raczej między publicystyką
      a tekstami odznaczającymi się wyższym poziomem intelektualnym, wiedzą historyczną
      i teoretyczną”.

      W 1950 r. pod patronatem [[UNESCO]] powstało w [[Paryż]]u [[Międzynarodowe Stowarzyszenie
      Krytyków Sztuki|Międzynarodowe Stowarzyszenie Krytyków Sztuki AICA]], skupiające
      obecnie około 4200 krytyczek i krytyków z 62 krajów. W sekcji polskiej, działającej
      od 2009 r., skupione są obecnie 133 osoby{{Cytuj |tytuł = AICA {{!}} SEKCJA
      POLSKA MIEDZYNARODOWEGO STOWARZYSZENIA KRYTYKI ARTYSTYCZNEJ |data dostępu =
      2020-01-17 |url = http://aica.sztuka.edu.pl/ |język = pl}}.

      == Krytyka sztuki na świecie ==

      {{Kategoria główna|Krytycy sztuki według narodowości}}

      === Francja ===

      [[Plik:Étienne Carjat, Portrait of Charles Baudelaire, circa 1862.jpg|mały|189x189px|[[Étienne
      Carjat]], portret [[Charles Baudelaire|Charlesa Baudelaire’a]], ok. 1862]]

      Wśród piszących o sztuce w XIX w. byli głównie autorzy francuscy – poeci i pisarze
      tacy jak: [[Charles Baudelaire]], [[Théophile Gautier|Theophile Gautier]], [[Stendhal]],
      [[Émile Zola]], [[Joris-Karl Huysmans|Huysmans]], [[Jules Champfleury]] czy
      [[Albert Aurier]], dziennikarze: [[Étienne Joseph Théophile Thoré]] (William
      Bürger), [[Félix Fénéon]] oraz sami artyści, jak choćby [[Eugène Fromentin]].

      Na początku XX w. krytyką parali się szczególnie poeci i pisarze z kręgów [[Awangarda
      (sztuka)|awangardowych]] – zaprzyjaźnieni z kubistami [[Guillaume Apollinaire]]
      i [[André Salmon]] czy związanie z surrealizmem [[André Breton]], [[Paul Éluard]]
      czy [[Louis Aragon]] oraz sami artyści, jak np. [[Michel Seuphor]]Tomasz Gryglewicz,
      ''''Parę uwag na temat krytyki artystycznej dawniej i dzisiaj. Poświęcone pamięci
      prof. Mieczysława Porębskiego, ostatniego krytyka w dawnym (dobrym) stylu'''',
      w: ''''[https://pbc.gda.pl/Content/42837/Krytyka%20Sztuki.pdf Krytyka sztuki
      – filozofia, praktyka, dydaktyka]'''', red. Łukasz Guzek, Akademia Sztuk Pięknych
      w Gdańsku, Międzywydziałowy Instytut Nauk o Sztuce, Gdańsk 2013, s. 9–13.. Po
      [[II wojna światowa|II wojnie światowej]] najbardziej rozpoznawalnymi krytykami
      byli [[Michel Tapié]] (twórca pojęcia [[informel]]) czy [[Pierre Restany]] (twórca
      koncepcji [[Nowy realizm|nowego realizmu]]). Krytycznym pisaniem o sztuce zajmował
      się także [[André Malraux]].

      === Wielka Brytania ===

      [[Plik:Pollock 2018 (cropped).jpg|mały|lewo|186x186px|[[Montserrat Boix]], portret
      [[Griselda Pollock|Griseldy Pollock]], 2018]]

      Do najważniejszych krytyków anglosaskich należą [[John Ruskin]] (autor tekstów
      o malarstwie [[William Turner|Williama Turnera]] i o sztuce włoskiej), [[Walter
      Pater]], [[Roger Fry]] i [[Clive Bell]] (członkowie [[Grupa Bloomsbury|Grupy
      Bloomsbury]], twórcy krytyki formalistycznej), [[Herbert Read]] oraz [[Griselda
      Pollock]].

      === Stany Zjednoczone ===

      [[Plik:Hilla von Rebay by László Moholy-Nagy, 1924.jpg|mały|213x213px|[[László
      Moholy-Nagy]], portret [[Hilla von Rebay|Hilli von Rebay]], 1924]]

      Wśród krytyków amerykańskich kluczowymi osobami są m.in. uchodzący za jednego
      z pierwszych profesjonalnych krytyków [[Clement Greenberg]], znany głównie z
      powojennych tekstów na temat [[Malarstwo abstrakcyjne|malarstwa abstrakcyjnego]]
      lat 40., 50. i 60. XX w., oraz [[Harold Rosenberg]] (twórca określenia [[action
      painting]]).

      Ważnym czynnikiem wpływającym na pojawienie się wyspecjalizowanych w sztuce
      krytyków było powstawanie w USA w latach 30. [[Kolekcja sztuki|kolekcji]] i
      [[Muzeum|muzeów]] [[modernizm (sztuka)|sztuki nowoczesnej]], z którymi związani
      byli m.in. [[Alfred H. Barr|Alfred H. Barr Jr.]] (pierwszy dyrektor [[Museum
      of Modern Art]] w [[Nowy Jork|Nowym Jorku]]) czy [[Hilla von Rebay|Hilla Rebay]]
      związana z rodziną [[Fundacja Solomona R. Guggenheima|Guggenheimów]].

      == Krytyka sztuki w Polsce ==

      [[Plik:Portret Marii Konopnickiej.jpg|mały|lewo|240x240px|[[Maria Dulębianka]],
      portret [[Maria Konopnicka|Marii Konopnickiej]]]]

      {{Kategoria główna|Polscy krytycy sztuki}}Początkowo uprawianie krytyki artystycznej
      wiązało się z praktyką pisemnej refleksji nad szerzej rozumianą sztuką i łączyło
      się nierzadko z [[Krytyka literacka|krytyką literacką]] czy [[Krytyka muzyczna|muzyczną]].
      W twórczości polskich pisarzy, filozofek, tłumaczy i publicystek odnaleźć można
      fragmenty i całe teksty poświęcone zagadnieniom plastycznym, zwłaszcza malarstwu
      i malarzom, np. wśród pism [[Eleonora Ziemięcka|Eleonory Ziemięckiej]], [[Paulina
      Krakowowa|Pauliny Kraków (Krakowowej)]], [[Zofia Węgierska|Zofii Węgierskiej]],
      [[Józefa Dobieszewska|Józefy Śmigielskiej]], [[Gabriela Puzynina|Gabrieli Puzyniny]]
      czy [[Seweryna Duchińska|Seweryny Duchińskiej]]Zob. ''''Pionierki. Krytyka artystyczna
      kobiet 1839-1879. Antologia'''', red. Joanna Sosnowska, Instytut Sztuki PAN,
      Warszawa 2016.

      W latach 1979–1914 krytyczne pisarstwo o sztuce uprawiały m.in. [[Waleria Marrené-Morzkowska|Waleria
      Marrené]], [[Maria Loevy]] (Maria Szeliga), [[Natalia Krzyżanowska]], [[Stefania
      Chłędowska]], [[Maria Konopnicka]], [[Gabriela Zapolska]], [[Maria Dulębianka]],
      [[Cecylia Walewska]], [[Ewa Łuskina]], [[Helena d’Abancourt de Franqueville]],
      [[Zofia Seidlerowa]], [[Lucyna Kotarbińska]], [[Wacława Kiślańska]] czy [[Maria
      Sławińska]]Zob. ''''Emancypantki i modernistki. Teksty kobiet o sztuce 1879–1914.
      Antologia'''', wstęp Joanna M. Sosnowska, wybór i oprac. Magdalena Kasa, Joanna
      M. Sosnowska, współpr. Beata Łazarz, Wiktoria Szczupacka, Instytut Sztuki PAN,
      Warszawa 2019..

      [[Plik:Adam Wazyk Polish poet.jpg|mały|220x220px|[[Benedykt Jerzy Dorys]], portret
      [[Adam Ważyk|Adama Ważyka]], 1957]]

      W okresie [[Historia Polski (1918–1939)|międzywojennym]] krytyką sztuki zajmowali
      się w Polsce głównie [[Pisarz|literaci]] i [[Poezja|poeci]]. Czołowymi postaciami
      krytyki byli [[pisarz]]e: [[Karol Irzykowski]], [[Emil Zegadłowicz]], [[Tadeusz
      Peiper]], [[Jan Brzękowski]], [[Julian Przyboś]] czy [[Adam Ważyk]], z których
      wielu związanych było z formacją [[Awangarda (sztuka)|awangardową]]. Pisanie
      recenzji było też jednym z obszarów aktywności artysty [[Stanisław Ignacy Witkiewicz|Stanisława
      Ignacego Witkiewicza]]. W tym czasie pojawili się także pierwsi krytycy profesjonalni,
      wśród których [[Tomasz Gryglewicz]] wyróżnia [[Stefania Zahorska|Stefanię Zahorską]]Autor
      błędnie podaje imię Helena, zob. Tomasz Gryglewicz, ''''Parę uwag na temat krytyki
      artystycznej dawniej i dzisiaj. Poświecone pamięci prof. Mieczysława Porębskiego,
      ostatniego krytyka w dawnym (dobrym) stylu'''', w: ''''[https://pbc.gda.pl/Content/42837/Krytyka%20Sztuki.pdf
      Krytyka sztuki – filozofia, praktyka, dydaktyka]'''', red. Łukasz Guzek, Akademia
      Sztuk Pięknych w Gdańsku, Międzywydziałowy Instytut Nauk o Sztuce, Gdańsk 2013,
      s. 11..

      [[Plik:Jacek Wozniakowski.JPG|mały|lewo|200x200px|[[Jacek Woźniakowski]] (1920-2012)]]

      [[Plik:Ewa Mikina.jpg|mały|218x218px|[[Ewa Mikina]] (1951-2012)]]

      Po [[II wojna światowa|II wojnie światowej]] wszystkie instytucje sztuki zostały
      upaństwowione, a publikacje były kontrolowane przez [[Główny Urząd Kontroli
      Prasy, Publikacji i Widowisk]]. Mimo [[Cenzura|cenzury]] krytyka artystyczna
      rozwijała się nadal dzięki poetom – publikującemu już przed wojną [[Julian Przyboś|Julianowi
      Przybosiowi]] oraz nowemu pokoleniu literatów: [[Zbigniew Herbert|Zbigniewowi
      Herbertowi]], [[Tadeusz Różewicz|Tadeuszowi Różewiczowi]], [[Adam Zagajewski|Adamowi
      Zagajewskiemu]] czy [[Tadeusz Nyczek|Tadeuszowi Nyczkowi]]. Do pisarzy dołączyli
      w tym czasie również historycy sztuki, którzy wkrótce zdominowali pole powojennej
      polskiej krytyki sztuki: przede wszystkim [[Mieczysław Porębski]] oraz m.in.
      [[Janusz Bogucki (historyk sztuki)|Janusz Bogucki]], [[Aleksander Wojciechowski
      (historyk sztuki)|Aleksander Wojciechowski]] czy [[Jacek Woźniakowski]] oraz
      z tzw. pokolenia [[Ogólnopolska Wystawa Młodej Plastyki „Przeciw wojnie – przeciw
      faszyzmowi”|Arsenału]]: [[Andrzej Osęka]], [[Maciej Gutowski (historyk sztuki)|Maciej
      Gutowski]], [[Elżbieta Grabska-Wallis|Elżbieta Grabska]] i [[Joanna Guze]].
      Pisaniem tekstów krytycznych zajmowali się też organizatorzy życia artystycznego:
      pracownicy [[Galeria sztuki|galerii]] i [[Muzeum|muzeów]] czy [[Kurator sztuki|komisarze
      wystaw]], np. [[Ryszard Stanisławski]], w latach 1966–1990 dyrektor [[Muzeum
      Sztuki w Łodzi]], „lansujący” w kraju i za granicą polski [[Konstruktywizm (sztuka)|konstruktywizm]]
      oraz [[Neoawangarda|sztukę neoawangardową]] lat 60. i 70. czy [[Sztuka konceptualna|konceptualizm]].
      Dla coraz większej liczby osób działalność krytyczna była jednak pracą zawodową,
      a nie towarzyszącym innym obowiązkom zajęciem dodatkowym.

      Po 1989 r. rynek prasowy uległ znacznym zmianom: przestała istnieć [[Cenzura
      w Polskiej Rzeczypospolitej Ludowej|cenzura]], pojawiły się nowe technologie
      edytorskie, a publikacje przestały być uzależnione od władzy. Z jednej strony
      zmniejszyła się obecność omówień sztuki w prasie codziennej, a rolę [[recenzent]]ów
      przejęli zawodowi [[dziennikarz]]e, poświęcający wystawom zaledwie krótkie noty
      i omówienia. Z drugiej natomiast zaczęły pojawiać się coraz liczniejsze i bardziej
      zróżnicowane periodyki o kulturze i sztuce oraz dające przestrzeń wypowiedziom
      krytycznym serwisy i portale internetowe. Na początku XXI w. kluczową rolę odegrały
      osobiste [[blog]]i, za sprawą których krytyka artystyczna z eksperckiej stała
      się bardziej egalitarna: „Nie sposób wymienić wszystkich blogów, piszą bowiem:
      krytycy, kuratorzy, kolekcjonerzy, właściciele galerii, artyści, naukowcy, muzealnicy,
      odbiorcy...”, jak podsumowuje Justyna RyczekJustyna Ryczek, ''''Blogi o sztuce
      – wpływ internetu na krytykę artystyczną. Wstęp do dyskusji'''', w: ''''[https://pbc.gda.pl/Content/42837/Krytyka%20Sztuki.pdf
      Krytyka sztuki. Filozofia, praktyka, dydaktyka]'''', red. Łukasz Guzek, Gdańsk
      2013, s. 51–57.. Obecnie forum krytycznego piśmiennictwa są również media społecznościowe
      jak [[Facebook]], [[Twitter]] czy [[Instagram]].

      Od 1992 r. osobom zajmującym się w Polsce działalnością krytycznoartystczną
      przyznawana jest [[Nagroda Krytyki Artystycznej im. Jerzego Stajudy]], a wśród
      jej laureatek i laureatów znaleźć można m.in. [[Piotr Piotrowski|Piotra Piotrowskiego]],
      [[Ewa Mikina|Ewę Mikinę]], [[Mieczysław Porębski|Mieczysława Porębskiego]],
      [[Aneta Szyłak|Anetę Szyłak]] czy [[Karolina Plinta|Karolinę Plintę]].

      === Czasopisma o sztuce ===

      [[Plik:Ilustrowany Kuryer Codzienny, winieta, 1913.jpg|mały|lewo|301x301px|[[Ilustrowany
      Kurier Codzienny|Ilustrowany Kuryer Codzienny]], winieta, 1913]]

      {{Kategoria główna|Pisma o sztuce}}{{Kategoria główna|Polskie czasopisma o historii
      sztuki}}{{Kategoria główna|Polskie czasopisma o fotografii}}

      Przed [[II wojna światowa|II wojną światową]] recenzje i eseje o sztuce ukazywały
      się w prasie codziennej, np. w [[Ilustrowany Kurier Codzienny|Ilustrowanym Kurierze
      Codziennym]], oraz w pismach literacko-artystycznych, jak [[Wiadomości Literackie]]
      czy [[Zwrotnica (czasopismo)|Zwrotnica]]. Teksty krytyczne zamieszczały w swoich
      periodykach grupy awangardowe takie jak [[Blok (ugrupowanie)|Blok]] czy [[Praesens]].

      [[Plik:Paryska Kultura1984.jpg|mały|210x210px|Przedruk paryskiej [[Kultura (miesięcznik)|Kultury]]
      z 1984 r.]]

      W czasach [[Polska Rzeczpospolita Ludowa|PRL]] teksty o sztuce nadal publikowano
      w dziennikach oraz w licznych w tym czasie periodykach kulturalnych, jak [[Twórczość]],
      [[Współczesność]], [[Kultura (miesięcznik)|Kultura]], [[Życie Literackie (1951–1991)|Życie
      Literackie]], [[Przekrój (czasopismo)|Przekrój]] czy [[Odra (czasopismo)|Odra]],
      i przeznaczonych dla młodzieży, takich jak [[Po prostu (czasopismo)|Po prostu]],
      [[Student (czasopismo)|Student]] czy [[Nowy Wyraz]]. Ukazywały się też pisma
      fachowe, poświęcone wyłącznie plastyce: [[Przegląd Artystyczny]] (1946-1973),
      a potem [[Sztuka (czasopismo)|Sztuka]] czy [[Projekt (czasopismo)|Projekt]]
      (1956-1997{{Cytuj |data dostępu = 2020-01-17 |opublikowany = katalogi.bn.org.pl
      |tytuł =WIELE WYDAŃ Projekt / red. nacz. Jerzy Hryniewiecki. Hryniewiecki, Jerzy
      (1908-1988) |url = https://katalogi.bn.org.pl/discovery/fulldisplay?docid=alma991034178799705066&context=L&vid=48OMNIS_NLOP:48OMNIS_NLOP&lang=pl&search_scope=NLOP_IZ_NZ&adaptor=Local%20Search%20Engine&tab=LibraryCatalog&query=any,contains,projekt&sortby=date_d&facet=frbrgroupid,include,43401279401676992&offset=0}}).
      Poza cenzurą recenzje ukazywały się w prasie emigracyjnej, a także w prasie
      [[wydawnictwo podziemne|drugiego obiegu]] w latach 80.

      Po 1989 r. pojawiło się jednak wiele nowych czasopism o charakterze kulturalnym
      oraz dotyczących sztuki periodyków fachowych, jak np. kwartalnik [[EXIT (czasopismo)|EXIT]]
      (1990-2014{{Cytuj |tytuł = EXIT nowa sztuka w Polsce: o nas |data dostępu =
      2020-01-17 |opublikowany = exit.art.pl |url = http://exit.art.pl/o-nas/ |archiwum
      = https://web.archive.org/web/20210507124134/http://exit.art.pl/o-nas/ |zarchiwizowano
      = 2021-05-07}}), [[Magazyn Sztuki (czasopismo)|Magazyn Sztuki]] (od 1993{{Cytuj
      |tytuł = Magazyn Sztuki |data dostępu = 2020-01-17 |opublikowany = Katalog.Czasopism.pl
      |url = http://katalog.czasopism.pl/index.php/Magazyn_Sztuki |język = pl}}),
      dotyczących sztuki lub wręcz jej poszczególnych dyscyplin – szczególnie [[Design|projektowania]],
      np. [[2+3D (czasopismo)|2+3D]] (2001-2016{{Cytuj |tytuł = O kwartalniku {{!}}
      2+3D grafika plus produkt – Kwartalnik projektowy {{!}} Polish Design Quarterly
      |data dostępu = 2020-01-17 |opublikowany = www.2plus3d.pl |url = http://www.2plus3d.pl/o-kwartalniku}}),
      czy fotografii, jak [[Kwartalnik Fotografia]] (2000-2012) – oraz rynku sztuki,
      jak [[Art & Business]] (od 1989{{Cytuj |tytuł = Art & Business. Sztuka Polska
      i Antyki |data dostępu = 2020-01-17 |opublikowany = Katalog.Czasopism.pl |url
      = http://katalog.czasopism.pl/index.php/Art_%26_Business._Sztuka_Polska_i_Antyki
      |język = pl}}). Wiele z nich nie przetrwało jednak szeroko rozumianego [[Transformacja
      systemowa w Polsce|okresu transformacji]] – część w wyniku uzależnienia od dotacji
      państwowych i grantów, a część nie poradziła sobie w realiach [[Wolny rynek|wolnego
      rynku]].

      Czasopisma wydawane są także lub wspierane przez instytucje sztuki: muzea i
      galerie, np. [[Kwartalnik Rzeźby Orońsko]] (od 1990{{Cytuj |tytuł = Orońsko
      |data dostępu = 2020-01-17 |opublikowany = Katalog.Czasopism.pl |url = http://katalog.czasopism.pl/index.php/Oro%C5%84sko
      |język = pl}}), [[Opcje (czasopismo)|Opcje]] (od 1993{{Cytuj |tytuł = Opcje
      |data dostępu = 2020-01-17 |opublikowany = Katalog.Czasopism.pl |url = http://katalog.czasopism.pl/index.php/Opcje
      |język = pl}}), [[BIURO (czasopismo)|BIURO]] (od 2009{{Cytuj |tytuł = BIURO
      |data dostępu = 2020-01-17 |opublikowany = Katalog.Czasopism.pl |url = http://katalog.czasopism.pl/index.php/BIURO
      |język = pl}}), [[Artpunkt (czasopismo)|Artpunkt]] (2009-2015{{Cytuj |autor
      = CG2 |tytuł = Poznaj nas / Czasopismo Artpunkt / |data dostępu = 2020-01-17
      |opublikowany = galeriaopole.pl |url = https://galeriaopole.pl/poznaj-nas/czasopismo-artpunkt.html
      |język = pl |archiwum = https://web.archive.org/web/20200222225002/https://galeriaopole.pl/poznaj-nas/czasopismo-artpunkt.html
      |zarchiwizowano = 2020-02-22}}), [[MOCAK Forum]] (od 2011{{Cytuj |tytuł = MOCAK
      Forum |data dostępu = 2020-01-17 |opublikowany = Katalog.Czasopism.pl |url =
      http://katalog.czasopism.pl/index.php/MOCAK_Forum |język = pl}}), [[CoCAin (czasopismo)|CoCAin]]
      (2012-2015) lub wspomniany już [[Obieg (czasopismo)|Obieg]] (od 1990 r. wydawcą
      jest [[Centrum Sztuki Współczesnej Zamek Ujazdowski|CSW]]{{Cytuj |tytuł = historia
      Obieg – Magazyn Centrum Sztuki Współczesnej |data dostępu = 2020-01-17 |opublikowany
      = Obieg – Magazyn Centrum Sztuki Współczesnej |url = https://obieg.u-jazdowski.pl/historia}}),
      oraz uczelnie artystyczne – przy nich ukazują się m.in.: [[Zeszyty Artystyczne]]
      (od 1983{{Cytuj |tytuł = Zeszyty Artystyczne |data dostępu = 2020-01-17 |url
      = http://za.uap.edu.pl/?page_id=520 |język = pl}}), [[Wiadomości ASP]] (od 1996{{Cytuj
      |tytuł = Wiadomości ASP {{!}} Kwartalnik o sztuce |data dostępu = 2020-01-17
      |url = http://www.wiadomosciasp.pl/dla-autorow/ |język = pl |archiwum = https://web.archive.org/web/20200812171421/http://www.wiadomosciasp.pl/dla-autorow/
      |zarchiwizowano = 2020-08-12 }}), [[Format (czasopismo)|Format]] (od 1990{{Cytuj
      |tytuł = FORMAT NET – Magazyn o Sztuce – Nasza historia |data dostępu = 2020-01-17
      |opublikowany = www.format-net.pl |url = http://www.format-net.pl/pl/kwartalnik/historia.html
      |język = pl}}) czy [[Aspiracje (czasopismo)|Aspiracje]] (od 2006{{Cytuj |tytuł
      = Aspiracje (online) ISSN 2450-7555 – Wydawnictwo |data dostępu = 2020-01-17
      |opublikowany = wydawnictwo.asp.waw.pl |url = https://wydawnictwo.asp.waw.pl/aspiracje-online-issn-2450-7555/}}).
      Krytyczne teksty o sztuce można znaleźć również na łamach pisma [[Ha!art]] (od
      1999{{Cytuj |tytuł = Ha!art |data dostępu = 2020-01-17 |opublikowany = Katalog.Czasopism.pl
      |url = http://katalog.czasopism.pl/index.php/Ha!art |język = pl}}) czy na łamach
      pisma [[Sztuka i Dokumentacja]] (od 2009{{Cytuj |tytuł = ASP wydawcą czasopisma
      Sztuka i DOKUMENTACJA |data dostępu = 2020-01-17 |opublikowany = Zbrojownia
      Sztuki |url = http://zbrojowniasztuki.pl/publikacje/czasopisma/sztuka-i-dokumentacja/asp-wydawca-czasopisma-sztuka-i-dokumentacja,796
      |język = pl}}) oraz podobnych mu pism naukowych – wrocławskiego kwartalnika
      [[Quart (czasopismo)|Quart]] (od 2006{{Cytuj |tytuł = QUART Kwartalnik Instytutu
      Historii Sztuki Uniwersytetu Wrocławskiego |data dostępu = 2020-01-17 |opublikowany
      = quart.uni.wroc.pl |url = http://quart.uni.wroc.pl/profil.html |archiwum =
      https://web.archive.org/web/20181102231854/http://quart.uni.wroc.pl/profil.html
      |zarchiwizowano = 2018-11-02}}) i [[Dyskurs (czasopismo)|Dyskursu]] (od 2005{{Cytuj
      |tytuł = Akademia Sztuk Pięknych we Wrocławiu |data dostępu = 2020-01-17 |opublikowany
      = www.asp.wroc.pl |url = https://www.asp.wroc.pl/?module=StaticContent&controller=Main&id=55&__seoName=Dyskurs+Online}}),
      krakowskiego [[Modus (czasopismo)|Modusu]] (od 1999) czy warszawskiego [[Miejsce
      (czasopismo)|Miejsca]] (od 2015{{Cytuj |tytuł = ARIANTA – NAUKOWE I BRANŻOWE
      POLSKIE CZASOPISMA ELEKTRONICZNE |data dostępu = 2020-01-17 |opublikowany =
      www1.ciniba.edu.pl |url = http://www1.ciniba.edu.pl/czasopisma/czasop_full.asp?id=5019}}).

      [[Plik:Logo-fragile.png|mały|lewo|199x199px|Logo czasopisma [[Fragile (czasopismo)|Fragile]]]]

      Wraz z końcem 2019 r. zawieszona została publikacja [[Arteon]]u, jednego z najpoczytniejszych
      papierowych magazynów o sztuce{{Cytuj |tytuł = Dom Wydawniczy „Kruszona” zawiesza
      działalność „Arteonu” |data = 2019-11-22 |data dostępu = 2020-01-17 |opublikowany
      = SZUM |url = https://magazynszum.pl/dom-wydawniczy-kruszona-zawiesza-dzialalnosc-arteonu/
      |język = pl}}. Wśród kontynuowanych pism papierowych znajdują się obecnie m.in.
      [[Szum (czasopismo)|Szum]] (od 2013), [[Artluk (czasopismo)|Artluk]] (od 2006{{Cytuj
      |tytuł = artluk |data dostępu = 2020-01-17 |opublikowany = www.artluk.com |url
      = http://www.artluk.com/onas.php}}), [[Notes.na.6.tygodni]] (od 2003{{Cytuj
      |tytuł = Notes.na.6.tygodni |data dostępu = 2020-01-17 |opublikowany = Katalog.Czasopism.pl
      |url = http://katalog.czasopism.pl/index.php/Notes.na.6.tygodni |język = pl}})
      oraz ogólnokulturalne [[Fragile (czasopismo)|Fragile]] (od 2008{{Cytuj |tytuł
      = Fragile |data dostępu = 2020-01-17 |opublikowany = Katalog.Czasopism.pl |url
      = http://katalog.czasopism.pl/index.php/Fragile |język = pl}}) czy też nowe
      propozycje, jak [[Powidoki (czasopismo)|Powidoki]] (od 2019{{Cytuj |tytuł =
      O nas |data dostępu = 2020-01-17 |opublikowany = powidoki.asp.lodz.pl |url =
      https://powidoki.asp.lodz.pl/o-nas}}) czy [[ArsForum (czasopismo)|ArsForum]]
      (od 2017{{Cytuj |tytuł = ArsForum – Nowe czasopismo o sztuce! » Niezła sztuka
      |data = 2017-09-18 |data dostępu = 2020-01-17 |opublikowany = Niezła sztuka
      |url = https://niezlasztuka.net/aktualnosci/arsforum-nowe-czasopismo-o-sztuce/
      |język = pl |archiwum = https://web.archive.org/web/20181018055655/http://niezlasztuka.net/aktualnosci/arsforum-nowe-czasopismo-o-sztuce/
      |zarchiwizowano = 2018-10-18}}).

      W 2013 r. zaczął ukazywać się miesięcznik [[Contemporary Lynx]] – pierwsze pismo
      o sztuce polskiej w j. angielskim{{Cytuj |tytuł = Contemporary Lynx – print
      and online magazine on art & visual culture {{!}} |data = 2012-11-01 |data dostępu
      = 2020-01-17 |opublikowany = Contemporary Lynx |url = https://contemporarylynx.co.uk/about-contemporarylynx
      |język = en |archiwum = https://web.archive.org/web/20200606171017/https://contemporarylynx.co.uk/about-contemporarylynx
      |zarchiwizowano = 2020-06-06 }}{{Cytuj |tytuł = Wyborcza.pl |data dostępu =
      2020-01-17 |opublikowany = www.wysokieobcasy.pl |url = https://www.wysokieobcasy.pl/wysokie-obcasy/1,80530,18379238,contemporary-lynx-pierwszy-magazyn-o-polskiej-sztuce-wydawany.html?disableRedirects=true}}.

      === Krytyka w internecie ===

      {{Kategoria główna|Polskie czasopisma internetowe}}

      Na przełomie XX i XXI w. coraz więcej czasopism przenosi się do [[internet]]u:
      m.in. od 1998 r. działa tam [[Magazyn Sztuki]]{{Cytuj |autor = redakcja |tytuł
      = Magazyn Sztuki |data dostępu = 2020-01-17 |opublikowany = magazynsztuki.eu
      |url = http://magazynsztuki.eu/m-s/magazyn-sztuki/ |język = pl}}, w 2000 r.
      pojawia się internetowy [[Galeria Raster|Raster]]{{Cytuj |tytuł = Raster, czyli
      historia pewnej epoki {{!}} obieg.pl |data dostępu = 2020-01-17 |opublikowany
      = archiwum-obieg.u-jazdowski.pl |url = https://archiwum-obieg.u-jazdowski.pl/prezentacje/16281}},
      a w 2004 r. przenoszą się do sieci m.in. [[Obieg (czasopismo)|Obieg]] czy [[SEKCJA
      (czasopismo)|SEKCJA]]{{Cytuj |tytuł = Sekcja |data dostępu = 2020-01-17 |opublikowany
      = Katalog.Czasopism.pl |url = http://katalog.czasopism.pl/index.php/Sekcja |język
      = pl}}. Powstają też stricte sieciowe serwisy i portale, zazwyczaj o tematyce
      ogólnokulturalnej – w 1998 powstaje platforma [[O.pl Polski Portal Kultury]]{{Cytuj
      |tytuł = O.pl Polski Portal Kultury |data dostępu = 2020-01-17 |opublikowany
      = Katalog.Czasopism.pl |url = http://katalog.czasopism.pl/index.php/O.pl_Polski_Portal_Kultury
      |język = pl}}{{Cytuj |autor = |tytuł = info.o.pl |data = |data dostępu = 2020-01-17
      |url = http://info.o.pl/ |język = pl}}, od roku 2000 działa informator [[Sztukpuk]]{{Cytuj
      |tytuł = Sztukpuk |data dostępu = 2020-01-17 |opublikowany = Katalog.Czasopism.pl
      |url = http://katalog.czasopism.pl/index.php/Sztukpuk |język = pl}}, w 2002
      zaczyna działać [[Spam.art.pl]]{{Cytuj |tytuł = Spam.art.pl |data dostępu =
      2020-01-17 |opublikowany = Katalog.Czasopism.pl |url = http://katalog.czasopism.pl/index.php/Spam.art.pl
      |język = pl}}, a w 2003 r. [[ArtPapier|ArtPAPIER]]{{Cytuj |tytuł = ARIANTA –
      NAUKOWE I BRANŻOWE POLSKIE CZASOPISMA ELEKTRONICZNE |data dostępu = 2020-01-17
      |opublikowany = www1.ciniba.edu.pl |url = http://www1.ciniba.edu.pl/czasopisma/czasop_full.asp?id=1772}}.
      Od 2006 r. zaczyna działać magazyn [[G-punkt]]{{Cytuj |tytuł = G-punkt |data
      dostępu = 2020-01-17 |opublikowany = Katalog.Czasopism.pl |url = http://katalog.czasopism.pl/index.php/G-punkt
      |język = pl}}, w 2009 r. ukazuje się pierwszy [[Dwutygodnik (czasopismo)|Dwutygodnik]]{{Cytuj
      |tytuł = Dwutygodnik |data dostępu = 2020-01-17 |opublikowany = Katalog.Czasopism.pl
      |url = http://katalog.czasopism.pl/index.php/Dwutygodnik |język = pl}}, a rok
      później [[E-splot|E-SPLOT]]{{Cytuj |tytuł = E-SPLOT |data dostępu = 2020-01-17
      |opublikowany = Katalog.Czasopism.pl |url = http://katalog.czasopism.pl/index.php/E-SPLOT
      |język = pl}}.

      [[Plik:Magdalena Ujma.jpg|mały|150x150px|[[Magdalena Ujma (kuratorka)|Magdalena
      Ujma]]]]

      Justyna Ryczek zwraca uwagę na szczególną rolę blogów o sztuce: <blockquote>Rok
      2006 to wysyp blogów, pojawiły się: Straszna sztuka [[Izabela Kowalczyk|Izabeli
      Kowalczyk]], Krytyk na skraju załamania nerwowego [[Magdalena Ujma (kuratorka)|Magdaleny
      Ujmy]], Flaneriaa! [[Agata Araszkiewicz|Agaty Araszkiewicz]], Pink not dead!
      [[Maurycy Gomulicki|Maurycego Gomulickiego]], Art Bazaar [[Krzysztof Masiewicz|Krzysztofa
      Masiewicza]] i [[Piotr Bazylko|Piotra Bazylko]], później powstał Krytykant [[Jakub
      Banasiak|Kuby Banasiaka]], Notes krytyczny [[Piotr Bernatowicz|Piotra Bernatowicza]].
      Hiperrealizm [[Wojciech Wilczyk|Wojciecha Wilczyka]] z 2009 roku wpisuje się
      w „drugą falę”, w której prym wiodą blogi literackie.</blockquote>Natomiast
      [[Patryk Chilewicz]] w rankingu z 2012 r. wymienia ponadto m.in. Blog o sztuce
      [[Dawid Radziszewski|Dawida Radziszewskiego]], blog [[The Krasnals]], serwis
      [[Vlep(v)net|vlep[v]net]] czy art bla-bla [[Agata Ubysz|Agaty Ubysz]] i zauważa,
      że blogi te łączy „fatalna strona graficzna. To dziwne, biorąc pod uwagę, że
      treści tam prezentowane są w dużej mierze treściami o sztukach wizualnych i
      plastycznych. Szablony blogów, mnogość licznych kolumn, okien i obrazków może
      przyprawić o ból głowy, a z innowacyjną estetyką ma bardzo niewiele wspólnego”{{Cytuj
      |tytuł = Top 10 polskich blogów o sztuce |data dostępu = 2020-01-17 |opublikowany
      = naTemat.pl |url = https://natemat.pl/29807,top-10-polskich-blogow-o-sztuce
      |język = pl}}.

      [[Plik:2012 11 01 Adam Szymczyk 2012 11 01 in Zürich by Haemmerli.jpg|mały|273x273px|[[Adam
      Szymczyk]]]]

      W 2001 r. na łamach [[Raster (czasopismo)|Rastra]] ukazał się „Ranking krytyków
      2000/2001” [[Władysław Kaźmierczak|Władysława Kaźmierczaka]], który w ironiczny
      sposób diagnozował:<blockquote>Krytyka jest potrzebna społeczeństwu, artystom,
      galeriom, kuratorom i samym krytykom. Potrzebna jest sztuce. Potrzebna jest
      władzy i sponsorom. Nieistniejący rynek sztuki też chciałby mieć krytyków. Jeszcze
      8 lat temu prawie nikt nie pisał o sztuce. Nie było pism a sztuka była wyłącznie
      stara. Nieliczni krytycy, powiedzmy piszący o sztuce, byli dość mocno oderwani
      od rzeczywistości. Od sztuki też. Dzisiaj, kiełkująca polska krytyka doznaje
      szoku zbliżenia ze światem{{Cytuj |tytuł = RANKING KRYTYKÓW – RASTER |data dostępu
      = 2020-01-17 |opublikowany = www.raster.art.pl |url = http://www.raster.art.pl/prezentacje/krytycy/krytycy.htm#ranking}}.</blockquote>
      Następnie podał dwie listy: „jastrzębi” i „pingwinów” polskiej krytyki artystycznej.
      W pierwszej grupie znaleźli się: [[Łukasz Gorczyca (krytyk sztuki)|Łukasz Gorczyca]],
      [[Łukasz Guzek]], [[Sebastian Wisłocki]], [[Adam Szymczyk]], [[Grzegorz Borkowski]],
      [[Stach Szabłowski]], [[Maria Anna Potocka|Masza Potocka]], [[Andrzej Kostołowski]],
      [[Anna Begier]] („Anonimy z Poznania”) i [[Andrzej Przywara]]. „Pingwiny” zostały
      przedstawione za pomocą inicjałów: J. M., [[Andrzej Osęka|A. O.]], T. N., [[Andrzej
      Matynia (dziennikarz)|A. M.]], [[Jerzy Duda-Gracz|J. D. G.]], F. S., [[Mirosław
      Ratajczak|M. R.]], [[Dorota Jarecka|D. J.]], [[Monika Małkowska|M. M.]], [[Piotr
      Sarzyński|P. S.]]

      Wśród czasopism internetowych znaleźć można obecnie m.in. naukowy [[Widok (czasopismo)|Widok]]
      (od 2013{{Cytuj |autor = Widok Teorie i Praktyki Kultury Wizualnej |tytuł =
      Pismo |data dostępu = 2020-01-17 |opublikowany = Widok. Teorie i Praktyki Kultury
      Wizualnej |url = http://www.pismowidok.org/pl/o-nas/profil-pisma |język = pl}})
      czy portal [[Niezlasztuka.net (czasopismo)|Niezlasztuka.net]]{{Cytuj |tytuł
      = O Fundacji » Niezła sztuka |data dostępu = 2020-01-17 |opublikowany = Niezła
      sztuka |url = https://niezlasztuka.net/fundacja/ |język = pl}}.

