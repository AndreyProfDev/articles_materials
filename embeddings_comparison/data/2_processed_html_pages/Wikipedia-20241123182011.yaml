  - content: "{{inne znaczenia|dziedziny działalności ludzkiej|[[Sztuka (ujednoznacznienie)|inne\
      \ znaczenia tego słowa]]}}\n[[Plik:Mehoffer Strange garden.jpg|mały|Józef Mehoffer:\
      \ ''Dziwny ogród'', 1903, olej na płótnie]]\n[[Plik:Potala Palace, August 2009.jpg|mały|[[Pałac\
      \ Potala]] w [[Tybet (region)|tybetańskim]] mieście [[Lhasa]] – przykład sztuki\
      \ [[Architektura|architektonicznej]]]]\n[[Plik:Sachertorte DSC03027.JPG|mały|[[Tort\
      \ Sachera]] – przykład sztuki [[Cukiernictwo|cukierniczej]]]]\n[[Plik:W Parafii\
      \ NMP z Lourdes, 1 czerwca 2019 r., dyr. Marcin Miotelka.png|mały|[[Chór]] –\
      \ przykładowy sposób wykonywania [[Muzyka|muzyki]]]]\n'''Sztuka''' – różnie\
      \ definiowany element [[Kultura|kultury]], przejawiający się [[Utwór|utworami]],\
      \ w tym [[Dzieło sztuki|dziełami sztuki]]. Zdaniem niektórych pojęcie sztuki\
      \ jest niemożliwe do kompletnego określenia, bo jej granice są ciągle redefiniowane\
      \ i w każdej chwili może pojawić się dzieło, które w arbitralnie przyjętej,\
      \ domkniętej definicji się nie mieści[[Ernst Gombrich]] wygłosił nawet tezę,\
      \ że w ogóle nie ma czegoś takiego jak „sztuka” – są tylko dzieła i artyści,\
      \ a reszta to nasza konstrukcja, wynik potrzeby porządkowania i wyszukiwania\
      \ punktów orientacyjnych.. Sztuka spełnia rozmaite funkcje, m.in. estetyczne,\
      \ społeczne, dydaktyczne, terapeutyczne, jednak nie stanowią one o jej istocieZałożenie,\
      \ że sztuka posiada w ogóle jakąś istotę (naturę), którą można odkryć, pociąga\
      \ za sobą stwierdzenie że praktyka artystyczna jest egzemplifikacją ponadczasowej\
      \ natury sztuki, założenie to zostało poddane bardzo ostrej krytyce m.in. przez\
      \ [[Morris Weitz|Morrisa Weitza]], [[Gerge Dickie|George’a Dickiego]], [[Arthur\
      \ Danto|Arthura Danto]] i [[Maurice Mandelbaum|Maurice’a Mandelbauma]]. Krytyka\
      \ ta wpisuje się w szerszy nurt [[Antyesencjalizm|antyesencjalizmu]].. Nie ma\
      \ powszechnie uznanych kryteriów oddzielających sztukę od [[Rzemiosło|rzemiosła]],\
      \ [[Technika|techniki]], [[sport]]u, [[Nauka|nauki]] i [[Polityka|polityki]];\
      \ przykładowo za formy sztuki uznaje się [[lutnictwo]], [[Gimnastyka artystyczna|gimnastykę\
      \ artystyczną]], [[Esej|eseistykę]], tworzenie [[reportaż]]y i [[Sztuka wojenna|sztukę\
      \ wojenną]]; każda z tych działalności łączy się z innymi, nieartystycznymi\
      \ obszarami kultury.\nMimo płynności i umowności pojęcia sztuki wyróżnia się\
      \ w niej różne obszary definiowane metodą twórczości:\n* [[sztuka kulinarna]];\n\
      * [[sztuki wizualne]], np. [[sztuki plastyczne]];\n* [[sztuki muzyczne]];\n\
      * [[teatr]];\n* [[literatura piękna]];\n* [[Język artystyczny|językotwórstwo\
      \ artystyczne]];\n* [[film artystyczny]].\nTypy sztuki wyróżnia się też na podstawie\
      \ celu lub tematu – przykłady takich kategorii to [[sztuka użytkowa]] i [[sztuka\
      \ sakralna]].\nSztuka istnieje od czasów [[Prehistoria|prehistorycznych]], konkretniej\
      \ [[paleolit]]u. Rozwój kolejnych [[Technologia|technologii]] umożliwił stworzenie\
      \ jej nowych obszarów; przykładowo [[rewolucja neolityczna]] doprowadziła do\
      \ osiadłego trybu życia, rozwoju [[Budownictwo|budownictwa]] i przez to początków\
      \ [[Architektura|architektury]]. Kończący prehistorię wynalazek [[Pismo|pisma]]\
      \ otworzył:\n* ściśle rozumianą [[Literatura|literaturę]] – [[Utwór literacki|utwory\
      \ literackie]] w formie trwałej, niezależnej od [[Tradycja oralna|przekazu ustnego]];\n\
      * [[Kaligrafia|kaligrafię]];\n* projektowanie pism w celach [[Rozrywka|rozrywkowo]]-estetycznych;\
      \ przykładem jest alfabet [[tengwar]].\n[[Nowożytność]] to pojawienie się [[Fotografia|fotografii]],\
      \ [[film]]u i [[Gra komputerowa|gier komputerowych]].\n[[Osoba]] uprawiająca\
      \ sztukę to [[artysta]] lub artystka. Sztuka jest jednym z przedmiotów badań\
      \ [[Nauki humanistyczne|humanistyki]], np. [[Historia sztuki|historii sztuki]]\
      \ i [[Estetyka|estetyki]].\n== Dzieje pojęcia sztuki ==\n=== Starożytność ===\n\
      Wyraz sztuka ([[łacina|łac.]] ''ars'', [[gr.]] ''techne'') w [[starożytność|starożytności]]\
      \ i [[średniowiecze|średniowieczu]] oznaczał tyle, co znajomość ściśle określonych\
      \ reguł i postępowanie zgodnie z nimi, czyli tyle, co [[rzemiosło]]. I w istocie,\
      \ w poczet sztuk zaliczano, oprócz [[malarstwo|malarstwa]] i [[rzeźba|rzeźby]],\
      \ wiele rzemiosł, jak [[garncarstwo]], czy [[krawiectwo]], ale także np. [[retoryka|retorykę]],\
      \ czy [[strategia organizacji|strategię]]. Robienie czegoś bez reguł było przeciwieństwem\
      \ sztuki, np. we wczesnym okresie Grecy sądzili, że [[Liryka|poezja]] powstaje\
      \ pod natchnieniem [[muzy|muz]] i nie włączali jej w poczet sztuk.\n=== Średniowiecze:\
      \ sztuki „pospolite” i „wyzwolone” ===\nTo, co łączy sztuki z rzemiosłem i częścią\
      \ nauk było dla myślicieli starożytności i średniowiecza daleko bardziej widoczne\
      \ niż to, co je odróżnia. Nie powstał podział na sztuki rzemieślnicze i artystyczne,\
      \ dzielono natomiast je ze względu na to, czy angażują tylko umysł, czy też\
      \ wymagają także wysiłku fizycznego. Te pierwsze nazywano sztukami wyzwolonymi\
      \ (''artes liberales'') a ostatnie pospolitymi (''artes vulgares''), w średniowieczu\
      \ zaś pospolite przemianowano na mechaniczne. Sztuki wyzwolone były uważane\
      \ za o wiele wyższe niż mechaniczne. Sztuk wyzwolonych wymieniano siedem: [[gramatyka]],\
      \ [[retoryka]], [[logika]], [[arytmetyka]], [[geometria]], [[astronomia]] i\
      \ [[muzyka]]. W średniowieczu sztuki mechaniczne (wśród których były również\
      \ rzeźba, malarstwo, czy [[architektura]]) usiłowano, dla zachowania symetrii\
      \ sprowadzić również do siedmiu, a że było ich znacznie więcej, wymieniano te\
      \ uznane za najważniejsze, czyli mające wymiar utylitarny (sztuki nazywane dziś\
      \ pięknymi nie mieściły się więc na wykazach sztuk).\n=== Renesansowa definicja\
      \ sztuki ===\nW [[renesans|Odrodzeniu]] pozycja społeczna artystów rośnie, zaczęli\
      \ oni dążyć do podniesienia statusu swej profesji i oddzielenia od rzemiosła,\
      \ toteż aspirują do miana uczonych, podnosząc rzeźbę, architekturę i malarstwo\
      \ do rangi nauki, tym bardziej że współgrało to z ich dążeniami, by obliczyć\
      \ swe dzieła z matematyczną dokładnością. Dopiero później pojawił się sprzeciw\
      \ wobec tej ścisłej koncepcji, sztuka oddzieliła się także od nauk. Pomimo że\
      \ miano świadomość, że sztuki są czymś różnym od nauk i rzemiosł, nie było pomysłu,\
      \ co łączy to, co dziś nazywamy sztukami pięknymi.\nPoczątkowo uważano, że jest\
      \ to rysunek, i mówiono o sztukach ''rysunkowych'', nie wiedziano jednak, na\
      \ jakiej podstawie dołączyć do tego muzykę, [[taniec]] i [[teatr]]. Próbowano\
      \ wyróżnić też sztuki ''umysłowe'', ''muzyczne'', ''pamięciowe'', ''obrazowe''.\n\
      === Sztuki piękne ===\nW XVII i XVIII wieku trwały spory na temat nazewnictwa\
      \ w dziedzinie sztuki. Dopiero w połowie XVIII wieku francuski [[filozofia|filozof]]\
      \ [[Oświecenie (epoka)|oświeceniowy]], [[Charles Batteux]], wprowadził termin\
      \ „sztuki piękne” (''beaux-arts''), zaliczając do nich malarstwo, rzeźbę, architekturę,\
      \ muzykę, [[Retoryka|wymowę]], [[Liryka|poezję]], [[taniec]] i [[teatr]]W r.\
      \ 1746 Charles Batteux wydał dzieło „Les Beaux-Arts réduits à un même principe”\
      \ („Sztuki piękne sprowadzone do jednej wspólnej zasady”)..\nSztuka począwszy\
      \ od XIX wieku uniezależnia się od rzemiosła i wiąże ściślej z pojęciami twórczości,\
      \ oryginalności, indywidualizmu i nowatorstwa. Materią sztuki są [[Dzieło sztuki|dzieła\
      \ sztuki]], a ich autorzy (według idealnego modelu) stają się artystami motywowanymi\
      \ wewnętrznym przymusem tworzenia, czy też potrzebą wyrażenia uczuć, rozwiązania\
      \ problemów własnych lub ogólnoludzkich, niedającymi się ograniczyć wyłącznie\
      \ do funkcji dostarczyciela wrażeń estetycznych.\n=== Współczesne definicje\
      \ sztuki ===\nSztuka dzisiejsza, począwszy od [[dadaizm]]u i [[surrealizm]]u,\
      \ nie odpowiada już takiej definicji, piękno w procesie estetyzacji rzeczywistości\
      \ wyszło poza sztukę, a dla niej samej nie jest już nie tylko wartością wyróżniającą,\
      \ ale nawet nie jest niezbędne. W ciągu swej długiej historii pojęcie ''sztuka''\
      \ z bardzo szerokiego, o precyzyjnie wytyczonych granicach znacznie zawęziło\
      \ swój obszar, ale też jego granice wyraźnie się zatarły.\nW społeczeństwach\
      \ współczesnych, w dużej części zawłaszczona przez [[przemysł rozrywkowy]],\
      \ sztuka stała się też w pewnej mierze kolejną gałęzią przemysłu.\nPisarze,\
      \ jak [[Witold Gombrowicz]], [[Stanisław Lem]], [[Milan Kundera]], [[Hermann\
      \ Broch]], zgodni byli, że sztuka musi mieć element poznawczy, by się nazywać\
      \ sztuką{{Cytuj |autor = Gombrowicz, Witold, (1904-1969) |tytuł = Diary |data\
      \ = cop. 2012 |data dostępu = 2019-07-29 |isbn = 9780300118063 |wydawca = Yale\
      \ University Press |oclc = 812582077}}{{Cytuj |autor = Kundera, Milan (1929-\
      \ ). |tytuł = Sztuka powieści : esej |data = 2015 |data dostępu = 2019-07-29\
      \ |isbn = 9788328015791 |wydawca = Wydawnictwo W.A.B. - Grupa Wydawnicza Foksal\
      \ |oclc = 909111372}}{{Cytuj |autor = Hermann Broch |tytuł = Kilka uwag o kiczu\
      \ i inne eseje |data = 1998}}{{Cytuj |autor = Lem, Stanisław, 1921-2006 Verfasser.\
      \ |tytuł = Diabeł i arcydzieło : teksty przełomowe |data dostępu = 2019-07-29\
      \ |isbn = 9788308068090 |oclc = 1083274342}}.\n==== Rezygnacja z definicji ====\n\
      W XX wieku zaliczono sztukę do grupy pojęć otwartych (termin stworzony przez\
      \ [[Ludwig Wittgenstein|Ludwiga Wittgensteina]]), czyli takich, które grupują\
      \ w sposób luźny przedmioty niemające wyraźnych cech wspólnych, jedynie coś,\
      \ co Wittgenstein określił jako „podobieństwo rodzinne”, a więc taki, że nie\
      \ sposób podać dla takiej grupy cech koniecznych i wystarczających. To ujęcie\
      \ spotkało się z krytyką, ze względu na to, iż na jej mocy w poczet sztuki można\
      \ było zaliczyć wszystkoPodział ten (cztery pierwsze kategorie) podano za: Grzegorz\
      \ Dziamski, ''Postmodernizm wobec kryzysu estetyki współczesnej''..\n==== Definicja\
      \ alternatywna ====\nOpierająca się na formule alternatywnej „bądź-bądź”\nSztuka\
      \ jest odtwarzaniem rzeczy, bądź konstruowaniem form, bądź wyrażaniem przeżyć\
      \ – jeśli wytwór tego odtwarzania, konstruowania, wyrażania jest zdolny zachwycać,\
      \ bądź wzruszać, bądź wstrząsać\nTatarkiewicz, W.,'' Dzieje sześciu pojęć'',\
      \ Warszawa, PWN, 1988, s. 52\n==== Nominatywna definicja sztuki ====\nCechą\
      \ łączną dla wszystkich dzieł sztuki ma być intencja, z jaką dzieło zostało\
      \ powołane do życia. Jeśli twórca wytwarza je z intencją stworzenia dzieła,\
      \ to dany wytwór dziełem bezwzględnie jest. Koresponduje to z powiedzeniem [[Donald\
      \ Judd|Donalda Judda]], że ''sztuką jest to, co się za sztukę uważa''. Taka\
      \ definicja z kolei uniemożliwia wartościowanie wytworów, podobnie jak w poprzednim\
      \ przypadku, wszystko, co autor uzna za sztukę, musi nią zostać, bez względu\
      \ na poziom, jaki reprezentuje.\n==== Definicja kontekstualna ====\nTo czy przedmiot,\
      \ bądź wydarzenie stanie się dziełem sztuki zależy od tego, czy ogół ludzi sztuki,\
      \ tzw. ''artworld''Termin stworzony przez [[Arthur Coleman Danto|Arthura C.\
      \ Danto]]. to za sztukę uzna na mocy [[intersubiektywizm|intersubiektywnych]]\
      \ opinii. Ważny tu jest [[kontekst]] aktualnego stanu teorii sztuki, a także\
      \ miejsca i czasu, nie wszystko bowiem jest możliwe w każdym miejscu i czasie.\
      \ Taki punkt widzenia zdecydowanie oddziela sztukę od [[wartość estetyczna|wartości\
      \ estetycznych]]. Pojęcie sztuki kontekstualnej wprowadził w Polsce [[Jan Świdziński]].\n\
      ==== Instytucjonalna definicja sztuki ====\nUjęcie bardzo podobne do powyższego,\
      \ tylko, że ''artworld'' jest tu rozumiany jako zajmujące się sztuką instytucje\
      \ społeczne w szerokim tego słowa znaczeniu. Zaznaczyć trzeba, że tak rozumiany\
      \ ''artworld'' nie posiada ściśle sformalizowanej struktury, uznanie danego\
      \ przedmiotu za dzieło sztuki nie ma kształtu formalnego, urzędowego nadania.\
      \ To rozumienie sztuki równie mocno jak poprzednie odrywa sztukę od wartości\
      \ estetycznych.\n==== Modele działania w sztuce AtkinsonaPodaję za: Grzegorz\
      \ Dziamski ''Konceptualizm'' (patrz Bibliografia). ====\n[[Terry Atkinson]]\
      \ wyróżnia cztery modele działania w sztuce:\n* Konstruowanie przedmiotów, których\
      \ forma ma wszystkie cechy niezbędne do tego, aby dany przedmiot uznać za dzieło\
      \ sztuki. (np. malowanie obrazu)\n* Dodawanie nowych cech do tych, które już\
      \ zostały ustalone jako właściwe dziełu sztuki. (np. [[Magdalena Abakanowicz]]\
      \ tworząc po raz pierwszy przestrzenną kompozycję z tkaniny artystycznej)\n\
      * Uznawanie dowolnych przedmiotów za dzieła sztuki, jeśli tylko zostaną umieszczone\
      \ w kontekście sytuującym je jako takie. (np. [[Marcel Duchamp]] ''Fontanna'')\n\
      * Tworzenie teoretycznych obiektów o cechach tautologicznych, będących wypowiedzią\
      \ sztuki o sztuce. ([[sztuka konceptualna|konceptualizm]], metasztuka)\n== Postmodernistyczny\
      \ ogląd sztuki ==\nZ chwilą gdy wszelkie całościowe, modernistyczne systemy,\
      \ wyznaczające właściwe cele sztuki, odróżniające sztukę od niesztuki upadły,\
      \ nastąpiła utrata „obiektywnego”, „zewnętrznego” punktu oparcia dla sądów o\
      \ sztuce, nie ma już dla nich ostatecznego, teoretycznego uzasadnienia. Sam\
      \ podział na sztukę i niesztukę jednak pozostał, tworzący się na bieżąco w nieustającym\
      \ dyskursie o sztuce, nie posiada, i jak się okazuje, też nie potrzebuje już\
      \ żadnego głębszego zakorzenienia w jakiejkolwiek [[metanarracja|metanarracji]].\n\
      == Sztuka a estetyka ==\nW nowożytnych koncepcjach sztuki pogląd o estetycznej\
      \ jej naturze podawany był w wątpliwość od romantyzmu (przez takie kierunki\
      \ jak [[naturalizm (sztuka)|naturalizm]], [[Ekspresjonizm (sztuka)|ekspresjonizm]]).\
      \ Zjawiska te były przez myśl estetyczną długo marginalizowane, przełom nastąpił\
      \ dopiero dzięki [[Awangarda (sztuka)|awangardzie]], sam zmysłowy ogląd przestał\
      \ stanowić podstawę nie tylko do wartościowania, ale nawet rozpoznania dzieła\
      \ sztuki (dadaizm, surrealizm, [[kubizm]]). [[Neoawangarda]] lat 60. (np. [[sztuka\
      \ konceptualna|konceptualizm]]) odrzuciła wszystkie estetyczne wyróżniki sztukiA\
      \ przynajmniej chciała odrzucić. Estetyczność jest przypisana każdemu fizycznie\
      \ istniejącemu obiektowi, [[sztuka konceptualna|konceptualizm]] odrzucił materializację\
      \ dzieła sztuki, aby zlikwidować wartości estetyczne w dziełach, jednak funkcję\
      \ niematerialnego dzieła przejęła jak najbardziej materialna dokumentacja (zdjęcia,\
      \ wykresy, opisy), sprzedawana, kupowana i wystawiana w galeriach.. Zdaniem\
      \ [[Hermann Broch|Hermanna Brocha]] estetyka jest skutkiem ubocznym działania\
      \ etycznego, które jest niezbędnym elementem sztuki. Dla Hermanna Brocha sztuka\
      \ wyłącznie estetyczna jest kiczowata.\n== Funkcje sztuki ==\n{{Dopracować|sekcja|twórczość\
      \ własna}}\n[[Plik:Igor Mitoraj Rynek.jpg|mały|Rzeźba \"Eros Bendato\" [[Igor\
      \ Mitoraj|Igora Mitoraja]] w [[Kraków|Krakowie]] na Rynku Głównym]]\nSztuce\
      \ przypisuje się pełnienie w życiu jednostki i społeczeństwa szeregu funkcji.\
      \ Poniższa ich lista nie jest ani kompletna, ani obiektywna:\n* komunikacyjna\
      \ – artysta przez swe dzieło porozumiewa się z odbiorcą,\n* estetyczna – sztuka\
      \ miałaby wywołać u odbiorcy swoiste przeżycia estetyczne, np. odwołując się\
      \ do idei [[piękno|piękna]],\n* poznawcza – odbiorca poznaje nie tylko dzieło,\
      \ ale też historię przodków, poprzez dzieła może się „przenieść” do świata ówczesnego{{fakt|data=2010-06}},\n\
      * etyczna, propagandowa, wychowawcza – sztuka miałaby wychowywać, uczyć, nakłaniać\
      \ do refleksji, uwidacznia pewne wzorce postępowania lub normy,\n* metafizyczna\
      \ (religijna) – dzieła sztuki powstają z motywacji metafizycznej (religijnej)\
      \ i mają za zadanie pobudzanie uczuć; muzyka, obrazy, rzeźby, architektura służą\
      \ życiu duchowemu lub religii, ale też czerpią z niej tematykę swoich dzieł;\
      \ Bogu, mitologii greckiej były poświęcone liczne dzieła: ''Dawid'' Michała\
      \ Anioła, freski z Kaplicy Sykstyńskiej, ''Ostatnia wieczerza'' – Leonarda da\
      \ Vinci i wiele innych;\n* emocjonalna – objawia się głównie w tańcu i muzyce{{fakt|data=2010-06}},\n\
      * terapeutyczna – zakłada się, że sztuka może leczyć; katharsis – oczyszczenie\
      \ psychiki ([[muzykoterapia]], [[poezjoterapia]], [[wideoterapia]], [[biblioterapia]],\
      \ [[filmoterapia]]{{Cytuj |autor = Jerzy Rottermund; Janusz Nowotny |tytuł =\
      \ Terapia zajęciowa w rehabilitacji medycznej. Podręcznik dla studentów i terapeutów.\
      \ |data = 2020 |s = 99 |język = pl}}, [[chromatoterapia]], [[dramoterapia]],\
      \ [[ludoterapia]]{{Cytuj |autor = Jerzy Rottermund; Janusz Nowotny |tytuł =\
      \ Terapia zajęciowa w rehabilitacji medycznej. Podręcznik dla studentów i terapeutów.\
      \ |data = 2020 |s = 102 |język = pl}}, [[Terapia tańcem|choreoterapia]]),\n\
      * ludyczna (zabawowa) – pozwala się odprężyć i odstresować poprzez czynne uczestnictwo\
      \ lub odbiór w charakterze widza w takich dziedzinach jak taniec, muzyka, komedia,\
      \ satyra;\n* identyfikacyjna i integracyjna – sztuka integruje i wykazuje przynależność\
      \ do pewnej grupy społecznej (np. lekarze, harcerze, muzycy, Polacy); pomaga\
      \ zachować tożsamość kulturową społecznościom lokalnym i narodom;\n* użytkowa\
      \ – jest to sztuka usługowa, np. rzemiosło artystyczne, przedmioty codziennego\
      \ użytku ([[wzornictwo przemysłowe]]), architektura, ale także satyra, muzyka\
      \ taneczna.\n== Dziedziny sztuki ==\nTerminu ''dziedzina sztuki'' nie należy\
      \ mylić z terminem ''kierunek'' czy ''nurt artystyczny'', który może obejmować\
      \ wiele ''dziedzin sztuki''. Jako przykład można podać [[Minimalizm (sztuki\
      \ plastyczne)|sztukę minimalną]]. Jest to ''kierunek'', który obejmuje ''dziedziny''\
      \ [[malarstwo]], [[Rzeźba|rzeźbę]] i [[Architektura|architekturę]].\n* [[film]]\n\
      * [[kabaret]]\n* [[komiks]]\n* [[literatura]]\n* [[muzyka]]\n* [[taniec]]\n\
      * [[Gra|gry]]\n* [[reklama]][http://www.independent.co.uk/arts-entertainment/is-advertising-art-1593252.html\
      \ Is advertising art?]\n* [[teatr]]\n** [[fluxus]]\n** [[happening]]\n** [[performance]]\n\
      ** [[balet]]\n** [[opera]]\n*** [[opera seria]] \n*** [[opera buffa]]\n*** [[opera\
      \ semiseria]]\n** [[teatr podziemny]]\n** [[teatr absurdu]]\n** [[teatr polityczny]]:\
      \ [[agit-prop]]\n** [[Teatr ludowy (amatorski)|teatr ludowy]]\n** [[teatr tańca]]\n\
      === [[Sztuki plastyczne]] ===\n* [[malarstwo]]\n* [[rysunek]]\n* [[grafika]]\n\
      * [[kaligrafia]]\n* [[fotografika]]\n* [[architektura]]\n* [[rzeźba]]\n* [[ceramika]]\n\
      * [[instalacja (sztuka)|instalacja]]\n* [[scenografia]]\n* [[wzornictwo przemysłowe]]\n\
      * [[witraż]]\n* [[graffiti]]\n== Periodyzacja sztuki ==\n{{Osobny artykuł|periodyzacja\
      \ sztuki}}\n* [[sztuka prehistoryczna]] (pradziejowa)\n* [[sztuka starożytna]]\n\
      * [[sztuka średniowieczna]]\n* [[sztuka nowożytna]]\n** [[Modernizm (sztuka)|sztuka\
      \ nowoczesna]]\n** [[sztuka współczesna]]\n== Zobacz też ==\n{{Siostrzane projekty\n\
      \ |commons = Art\n |słownik = sztuka\n |źródła =\n |cytaty = Sztuka\n |news\
      \ =\n |books =\n |species =\n}}\n* [[Erotyka (sztuka)|sztuka erotyczna]]\n==\
      \ Uwagi ==\n{{Uwagi}}\n== Przypisy ==\n{{Przypisy}}\n== Bibliografia ==\n* {{Cytuj|autor\
      \ = [[Władysław Tatarkiewicz]] |tytuł = Dzieje sześciu pojęć |data = 2005 |isbn\
      \ = 83-01-14369-X |miejsce = Warszawa |wydawca = Wydawnictwo Naukowe PWN |oclc\
      \ = 830652572}}\n* {{Cytuj|autor = [[Grzegorz Dziamski]] |tytuł = Postmodernizm\
      \ wobec kryzysu estetyki współczesnej |data = 1996 |isbn = 83-232-0766-6 |miejsce\
      \ = Poznań |wydawca = Wydawnictwo Naukowe UAM |oclc = 830112976}}\n* Grzegorz\
      \ Dziamski, ''Konceptualizm'' w: Grzegorz Dziamski (red.) ''Od awangardy do\
      \ postmodernizmu, Encyklopedia kultury polskiej XX wieku.'' 1996, {{ISBN|83-85323-21-X}}.\n\
      * {{Cytuj|tytuł = Awangarda w perspektywie postmodernizmu |data = 1996 |isbn\
