  - content: '[[Plik:Призрак большевизма.jpg|mały|Nazistowski antyradziecki plakat
      propagandowy]]

      ''''''Sztuka polityczna'''''' (zwana też w czasach [[Polska Rzeczpospolita Ludowa|PRL-u]]
      ''''''zaangażowaną'''''') – szerokie pojęcie obejmujące wiele rodzajów działalności
      artystycznej, które łączy to, że intencjonalnie niosą jakieś przesłanie polityczne.
      Sztuka polityczna może być zarówno sposobem [[kontestacja|kontestacji]] status
      quo społecznego i jego przejawów instytucjonalnych, jak i wyrazem oficjalnej
      polityki danego kraju (co z reguły prowadzi do sztuki [[Propaganda#Przykłady
      propagandy|propagandowej]]). Przykładem ostatniego jest [[socrealizm]] w państwach
      bloku komunistycznego czy [[mural]]izm w Meksyku. Do odmian sztuki politycznej
      zalicza się m.in.: activist art (ang. "sztuka lewicowa"), radical art (ang.
      "sztuka radykalna") itp. Najbardziej znanymi artystami uprawiającymi sztukę
      polityczną na Zachodzie są: nieżyjący już [[Joseph Beuys]] oraz Victor Burgin,
      Hans Haacke i [[Krzysztof Wodiczko]].

      == Bibliografia ==

      * Marcin Giżycki, ''''Słownik kierunków, ruchów i kluczowych pojęć sztuki drugiej
      połowy XX wieku'''' , Wydawnictwo Słowo/Obraz Terytoria, Gdańsk 2002, {{ISBN|8388560549}}

      [[Kategoria:Sztuka]]'
