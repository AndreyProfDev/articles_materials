- sections:
  - content: "'''Antropologia sztuki''' – jeden z działów [[Antropologia kulturowa|antropologii\
      \ kulturowej]], poświęcony badaniu [[Sztuka|sztuki]] w różnych kontekstach kulturowych.\
      \ Antropologia sztuki koncentruje się na wymiarach historycznych, ekonomicznych\
      \ i estetycznych w niezachodnich formach sztuki, głównie w społeczeństwach potocznie\
      \ nazywanych „pierwotnymi” bądź „niepiśmiennymi”. Przez większą część swej niedługiej\
      \ historii, antropologia sztuki pozostawała na marginesie głównego nurtu. Paradoksalnie,\
      \ pozwoliło to na przenikanie się idei różnych dziedzin oraz jej interdyscyplinarny\
      \ charakter, choć występują trudności z konkretnym jej zdefiniowaniem. Od pokrewnych\
      \ jej socjologii sztuki i historii sztuki odróżnia ją inny obszar badań. Zamiast\
      \ na formie i funkcji (w ujęciu politycznym, ekonomicznym i estetycznym), antropolodzy\
      \ sztuki starają się zrozumieć znaczenie dzieła w ujęciu danej społeczności{{Cytuj\
      \ |autor = |autor r = Jeanne Cannizzo |redaktor = Alan Bernard |tytuł = Encyclopedia\
      \ of Social And Cultural Anthropology |data = 2002 |isbn = 0-203-25684-0}}.\n\
      [[Plik:Masque_eharo_MHNT_ETH_AC_NB9.jpg|mały|Maska eharo, Kultura Elema, Papua-Nowa\
      \ Gwinea |235x235px]]\n== Historia ==\n=== Antropologia i sztuka w końcu XIX\
      \ i pierwszej połowie XX wieku ===\nPierwszych oznak na wykształcanie się antropologii\
      \ sztuki można doszukiwać się już w końcu XIX wieku. W 1895 roku brytyjski antropolog\
      \ [[Alfred Cort Haddon]] wydał książkę ''Evolution in Art'', będącą podsumowaniem\
      \ jego badań nad sztuką na obszarze Brytyjskiej Nowej Gwinei.\nW początkach\
      \ XX wieku [[Franz Boas]], jeden z pionierów współczesnej [[Antropologia|antropologii]],\
      \ przeprowadził wiele badań terenowych dotyczących sztuki, co pozwoliło stworzyć\
      \ podstawy dla tej dziedziny. Napisana przez niego książka ''Primitive Art''\
      \ (1927), zbiera jego najważniejsze spostrzeżenia na temat tak zwanych „prymitywnych”\
      \ form sztuki, ze szczegółowym studium przypadku na temat sztuki mieszkańców\
      \ północno-zachodniego wybrzeża PacyfikuFranz Boas. (1927) ''Primitive art''..\
      \ Antropolog [[Claude Lévi-Strauss]] rozwinął analizy Boasa w swojej książce\
      \ ''Drogi Masek'' (1982), w której prześledził zmiany w plastycznej formie masek\
      \ północno-zachodniego wybrzeża Ameryki Północnej do wzorców interakcji międzykulturowych\
      \ wśród rdzennych mieszkańców wybrzeżaClaude Lévi-Strauss. (1982) ''Drogi Maski''..\n\
      Pod wpływem porównawczej nauki o społeczeństwie [[Alfred Radcliffe-Brown|Alfreda\
      \ Radcliffe-Browna]] antropologia w Wielkiej Brytanii przeszła duże zmiany.\
      \ Próbując stworzyć dla niej niszę, która odróżniałaby antropologię od innych\
      \ dziedzin nauki, przekształcił ją w dziedzinę skupiającą się na organizacji\
      \ i strukturze społecznej, mocno powiązaną ze [[Funkcjonalizm strukturalny|funkcjonalizmem\
      \ strukturalnym]]. Tamtejsza antropologia w dużej mierze zdystansowała się od\
      \ historii, psychologii a także kultury, co wpłynęło na wzrost zainteresowania\
      \ grupą i zachowaniem, z niekorzyścią dla jednostki i emocji. Teoretycy kształtujący\
      \ antropologię uważali, że badania nad sztuką i kulturą materialną nie były\
      \ w większości przypadków kluczowe dla rozwoju całości dziedziny. Tym samym\
      \ kultura materialna i sztuka zostały odcięte od głównego nurtu brytyjskich\
      \ badań etnologicznych. Zebrane artefakty nie były poddawane szerszym badaniom\
      \ tylko deponowane w muzealnych magazynach. Ta sytuacja utrzymywała się do lat\
      \ 60. XX wieku, kiedy sztuka ponownie stała się ważnym zagadnieniem w pracach\
      \ badawczych. Podobny proces zachodził też w innych krajach Europy (na przykład\
      \ we Francji i Holandii), które rozwinęły podobne tradycje pracy w terenie{{Cytuj\
      \ |autor = Howard Morphy & Morgan Perkins. |tytuł = The Anthropology of Art:\
      \ A Reader. |data = 2006}}.\nW Stanach Zjednoczonych stan badań nad sztuką z\
      \ perspektywy antropologicznej prezentował się znacznie lepiej, choć charakteryzował\
      \ się podobnym okresem zaniedbań co w antropologii europejskiej. Antropologia\
      \ w tym kraju rozwijała się bardziej [[Holizm|holistycznie]], a podział badań\
      \ na cztery główne obszary (antropologia społeczno-kulturowa, antropologia biologiczna,\
      \ archeologia i lingwistyka) pozwolił na dalszą pracę nad kulturą materialną.\
      \ Mimo to w pierwszej połowie XX wieku przeprowadzano relatywnie niewiele badań\
      \ nad sztuką.\nZdystansowanie się antropologii muzealnej od etnologów pracujących\
      \ w terenie poskutkowało zmniejszeniem możliwości przyporządkowania przedmiotów\
      \ posiadanych w kolekcjach ze społecznościami, które je wytworzyły. Obiekty\
      \ oznaczane jako „sztuka” były odcięte od swego kontekstu kulturowego i oceniane\
      \ zgodnie z zachodnimi kryteriami i kategoriami oraz traktowane jako stadium\
      \ poprzedzające tradycyjnie wytworzone przez świat zachodu rodzaje sztuki. Rozpatrywanie\
      \ przedmiotów kultury materialnej odbywało się w stosunku do zachodnich wzorców,\
      \ które zazwyczaj nie miały zastosowania w innych społecznościach.\n=== Antropologia\
      \ sztuki współcześnie ===\nPonowne zainteresowanie sztuką wśród antropologów\
      \ nastąpiło w latach 60. XX wieku. Czynnikami, które to spowodowały były zmiany\
      \ w programie badań antropologicznych oraz dążenie zachodniej teorii sztuki\
      \ w stronę myślenia antropologicznego. Po II wojnie światowej antropologia dynamicznie\
      \ się rozwijała, co sprzyjało powstaniu kolejnych jej specjalizacji. W Wielkiej\
      \ Brytanii przejawiło się to odejściem od badań relacji społecznych na rzecz\
      \ zaciekawienia religią, mitem i rytuałami. Rosło także zainteresowanie [[Antropologia\
      \ wizualna|antropologią wizualną]], kulturą materialną i antropologią archeologiczną.\
      \ Wzrost zainteresowania wpłynął zwłaszcza na badania nad symboliką (w systematyce,\
      \ semiotyce i języku) oraz nad wymianą i związanymi z nią rytuałami. Teoria\
      \ wymiany i antropologia symboliczna wpłynęły na dyskurs nad charakterem osób\
      \ i rzeczy, w kontekście ich wzajemnych powiązań. Stało się to głównym tematem\
      \ antropologii w latach 80. i 90. XX wieku.\nOd lat 70. XX wieku zwiększano\
      \ nacisk na badania takich tematów jak emocje, płeć, ciało, przestrzeń i czas,\
      \ a szeroko pojęta sztuka stanowiła ich główne źródło informacji, gdyż każda\
      \ forma sztuki przekazywała sobą konkretne informacje o danej społeczności.\
      \ \n== Problem antropologii sztuki i jej definicja ==\n[[Plik:GHOOMAR.jpg|mały|262x262px|Taniec\
      \ Ghoomar w Radżastanie]]\nJeden z głównych problemów antropologii sztuki dotyczy\
      \ uniwersalności „sztuki” jako zjawiska kulturowego. Antropolodzy zauważyli,\
      \ że zachodni podział na kategorie takie jak „malarstwo”, „rzeźba” czy „literatura”,\
      \ nie istnieje lub istnieje w znacznie innej formie w większości niezachodnich\
      \ kontekstówRobert Layton. (1981) ''The Anthropology of Art''.. Sztuka zazwyczaj\
      \ występuje jako pojęcie bliskie kulturze w obu jej znaczeniach: kulturze pojmowanej\
      \ jako określony sposób życia i powłoka, w której można urzeczywistnić idee\
      \ i wiedzę grupy, oraz kulturze w znaczeniu metafizycznej esencji danej społeczności,\
      \ zgodnie z której standardami oceniane są później te fizyczne produkty. Taki\
      \ rozdział doprowadzał do wielu niejasności i utrudniał wypracowanie konsensusu\
      \ w sprawie jednej, międzykulturowej definicji „sztuki” w antropologiiG. Angioni,\
      \ ''Fare dire sentire: l’identico e il diverso nelle culture'', Nuoro, il Maestrale,\
      \ 2011.Howard Morphy & Morgan Perkins. (2006) Introduction, in ''The Anthropology\
      \ of Art: A Reader''.. Dużym wyzwaniem w dalszym ciągu pozostaje traktowanie\
      \ sztuki w oderwaniu od eurocentrycznego poglądu na nią. Według tej definicji,\
      \ sztuka jest rozumiana jako oderwana od społeczności i determinowana przez\
      \ swoją rolę w strukturze klasowej zachodniego kapitalistycznego społeczeństwa.\
      \ Zgodnie z tym poglądem, sztuka służy jedynie do bycia symbolicznym znacznikiem\
      \ kapitału, w który klasa rządząca inwestuje aby jeszcze bardziej móc podkreślić\
      \ swój status. Ciężko jednak zastosować tę definicję w przypadku większości\
      \ poza zachodnich społeczności{{Cytuj |autor = Howard Morphy & Morgan Perkins\
      \ |tytuł = The Anthropology of Art: A Reader. |data = (2006)}}{{Cytuj |autor\
      \ = Pierre Bourdieu |tytuł = Distinction: A Social Critique of the Judgement\
      \ of Taste |data = 1984}}. \nAby przezwyciężyć trudności ze zdefiniowaniem kluczowego\
      \ dla dziedziny pojęcia, antropolodzy sztuki skupili się na formalnych cechach\
      \ przedmiotów, które nie będąc wyłącznie „artystycznymi”, mają pewne wyraźne\
      \ cechy „estetyczne”. ''Primitive Art'' Franza Boasa, ''Drogi Maski'' Claude\
      \ Lévi-Straussa czy ''Art as Cultural System'' (1983) Clifforda Geertza to kilka\
      \ przykładów tego trendu przekształcania antropologii „sztuki” w antropologię\
      \ specyficzno-kulturowej „estetyki”. W 1998 roku w swojej książce ''Art and\
      \ Agency'' [[Alfred Gell]] zaproponował nową definicję „sztuki” jako złożonego\
      \ systemu intencjonalności, w którym artyści wytwarzają przedmioty artystyczne,\
      \ aby wywoływać zmiany w świecie, w tym (ale nie wyłącznie) zmiany w postrzeganiu\
      \ estetyki przez odbiorców sztukiAlfred Gell. (1998) ''Art and Agency''.. Około\
      \ 2000 roku pomysły Gella wzbudziły wiele kontrowersji w antropologii sztukiRoss\
      \ Bowden. (2004) A Critique of Alfred Gell on Art and Agency. ''Oceania'', 74:\
      \ 309-325.Robert H. Layton. (2003) Art and Agency: A reassessment. ''Journal\
      \ of the Royal Anthropological Institute'', 9: 447-464.Howard Morphy. (2009).\
      \ Art as a Mode of Action: Some Problems with Gell’s Art and Agency. ''Journal\
      \ of Material Culture'', 14 (1): 5-27..\nInną definicję sztuki stworzył Howard\
      \ Morphy. Zgodnie z nią, sztuką są obiekty posiadające atrybuty estetyczne i/lub\
      \ semantyczne (w większości przypadków oba na raz), które są wykorzystywane\
      \ do celów reprezentacyjnych lub prezentacyjnych{{Cytuj |autor = Howard Morphy\
      \ |redaktor = Tom Ingold |rozdział = Anthropology of Art |tytuł = Companion\
      \ Encyclopedia of Anthropology |data = 1994}}. W swojej późniejszej pracy, ''The\
      \ Anthropology of Art'' twierdził on ponadto, że zrozumienie pracy wymaga umieszczenia\
      \ jej w najszerszym możliwym kontekście. Znaczenie i wpływ dzieła na otoczenie\
      \ nie są zrozumiałe dla antropologa, który nie weźmie pod uwagę historycznego,\
      \ społecznego i kulturowego podłoża jego stworzenia. W ten sposób obiekty sztuki\
      \ łączą wydarzenia z procesami i zbliżają do siebie doświadczenia rozdzielone\
      \ w czasie.\n== Przypisy ==\n{{Przypisy}}\n== Bibliografia ==\n* Boas, Franz.\
      \ (1927) ''Primitive Art''. New York: Dover\n* Coote, Jeremy and Anthony Shelton,\
