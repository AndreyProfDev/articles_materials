- sections:
  - content: '''''''Decollage'''''' lub ''''''dekolaż'''''' (z [[język francuski|fr.]]
      ''''décollage'''') – przeciwieństwo [[kolaż]]u; sztuka polegająca na odklejaniu,
      zrywaniu kolejnych warstw, odkryta przez Lea Maleta w [[1934]] r. Jest uprawiana
      intensywnie od 50 lat., m.in. przez [[Jacques Villeglé|Jacques''a de la Villeglé]],
      [[François Dufrene|François Dufrene''a]] i [[Mimmo Rotella|Mimma Rotellę]].
      W następnej dekadzie terminu tego zaczął używać [[Wolf Vostell]] w stosunku
      do swoich akcji, w trakcie których dokonywał destrukcji atrybutów społeczeństwa
      konsumpcyjnego (np. [[telewizor]]a).

      == Zobacz też ==

