      \ podróżnego w stylu vintage w [[Marché Dauphine]] w Paryżu]]\n'''Antyk''' ({{lang|la}}\
      \ ''antiquus'') – potoczne określenie zabytkowego przedmiotu sztuki dawnej,\
      \ mającego wartość [[Zabytek|zabytkową]], historyczną, [[Estetyka|estetyczną]]\
      \ lub materialną. Najczęściej antykami określa się meble, ale również mogą być\
      \ to lampy, zegary, obrazy (ikony), książki i [[rękopis|manuskrypty]], [[porcelana]]\
      \ i sztućce oraz inne przedmioty użytkowe. Sklep handlujący antykami to [[antykwariat]].\n\
      Minimalny wiek pozwalający na określenie przedmiotu antykiem, podobnie jak w\
      \ przypadku [[zabytek|zabytków]], zależy od rodzaju przedmiotu oraz prawodawstwa\
      \ w danym kraju, gdyż wiąże się z pewnymi ograniczeniami w handlu międzynarodowym.\
      \ W [[Stany Zjednoczone|Stanach Zjednoczonych]] w przypadku wielu produktów,\
      \ np. mebli, najczęściej jest to okres 100 lat, ale np. samochodów już 75 lat\
      \ i mniej{{cytuj stronę|url=http://www.cbp.gov/xp/cgov/home.xml|tytuł=US Customs\
      \ and Border Protections|data dostępu=2012-11-19|język=en|archiwum=https://web.archive.org/web/20121211234452/http://www.cbp.gov/xp/cgov/home.xml|zarchiwizowano=11\
      \ grudnia 2012}}. \nO losach poszukiwaczy antyków opowiada m.in. produkcja ''[[Łowcy\
      \ staroci]]''.\n{{commonscat|Antiques}}\n== Przypisy ==\n{{Przypisy}}\n== Bibliografia\
      \ ==\n* {{cytuj książkę|tytuł=Słownik terminów artystycznych i architektonicznych|wydawca=Wydawnictwo\
      \ Naukowe PWN|data=2011|seria=Historia Sztuki. Biblioteka Gazety Wyborczej|strony=16|isbn=9788362095599}}\n\
      * {{cytuj książkę|tytuł=Encyklopedia Gazety Wyborczej|wydawca=Wydawnictwo Naukowe\
      \ PWN|data=2008|tom=1|isbn = 83-89651-35-1}}\n{{Kontrola autorytatywna}}\n[[Kategoria:Sztuka]]\n\
      [[Kategoria:Nostalgia]]"
