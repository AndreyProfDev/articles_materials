- sections:
  - content: "{{Inne znaczenia|2=[[Mecenas sztuki]]}}\n[[Plik:Lawrence Alma-Tadema\
      \ A Sculpture Gallery in Rome at the Time of Agrippa.jpg|thumb|Galeria rzeźby\
      \ w Rzymie czasów [[Oktawian August|Augusta]] (mal. [[Lawrence Alma-Tadema|L.\
      \ Alma-Tadema]], 1867)]]\n'''Mecenat''' − opieka wpływowych i bogatych miłośników,\
      \ amatorów literatury i sztuki nad twórcami. Na ogół łączona z finansowym wspieraniem\
      \ tych osób i ich poczynań. \nW potocznym użyciu mecenasem jest nazywany protektor\
      \ artystów, pisarzy i uczonych, osoba dbająca o rozwój sztuki, literatury, nauki''Słownik\
      \ wyrazów obcych PWN''. Warszawa: Państwowe Wydawnictwo Naukowe, 1991, s. 540..\
      \ Określenie pochodzi od nazwiska [[Gajusz Cilniusz Mecenas|Gajusza Cilniusza\
      \ Mecenasa]], opiekuna artystów i poetów, przyjaciela i doradcy [[Oktawian August|Oktawiana\
      \ Augusta]]''Słownik kultury antycznej. Grecja – Rzym'' (red. [[Lidia Winniczuk|L.\
      \ Winniczuk]]). Warszawa: Wiedza Powszechna, 1988, s. 280..\nDawny mecenat dworski,\
      \ królewski, magnacki, kościelny (szczególnie papieski) zastąpiły w czasach\
      \ współczesnych formy opieki sprawowanej przez wyspecjalizowane instytucje społeczne,\
      \ np. fundacje państwowe i prywatne. Wielkim mecenasem sztuki w [[Polska|Polsce]]\
      \ był [[Stanisław August Poniatowski]]. Finansował liczne przedsięwzięcia artystyczne,\
      \ wielokrotnie zaciągając w tym celu pożyczki. Wiele osób zarzucało mu (jako\
      \ panującemu) trwonienie pieniędzy na sztukę, gdy brakowało funduszy na wojsko\
      \ oraz inne potrzeby państwa. W ostatnich czasach mecenasem artystów jest zazwyczaj\
      \ państwo, co wywołuje rozmaite dyskusje na temat obustronnych uprawnieńCzy\
      \ państwo powinno utrzymywać artystę? https://www.youtube.com/watch?v=Z_o3TeieP3Y.\n\
      == Przypisy ==\n{{Przypisy}}\n{{wikisłownik|mecenas}}\n== Bibliografia ==\n\
      * ''Popularna Encyklopedia Powszechna''. T. 10. Kraków: Oficyna Wydawnicza Fogra,\
      \ 1995, ({{ISBN|83-85719-20-2}}\n{{Kontrola autorytatywna}}\n[[Kategoria:Literaturoznawstwo]]\n\
      [[Kategoria:Sztuka]]"
