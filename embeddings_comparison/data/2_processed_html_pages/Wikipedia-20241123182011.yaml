- sections:
  - content: "[[Plik:Mandala of Desires Mandali Mendrilla China Art Museum.jpg|mały|''Mandala\
      \ pragnień'', instalacja Mandaliego Mendrilli, China Art Museum w Szanghaju.\
      \ Odwiedzający byli zachęcani do zawieszania swoich karteczek na dziele]]\n\
      '''Interaktywność''' to własność [[dzieło sztuki|dzieła sztuki]], która sprawia,\
      \ że jego odbiorca może podjąć działania, które wpłyną na kształt końcowy dzieła.\
      \ Stanowi jedną z najważniejszych cech współczesnej kultury{{Cytuj |autor =\
      \ Ryszard Waldemar Kluszczyński |tytuł = Film-Wideo-Multimedia. Sztuka ruchomego\
      \ obrazu w erze elektronicznej. |data = 1999 |isbn = 83-85323-85-6 |miejsce\
      \ = Warszawa |wydawca = Instytut Kultury Warszawa |oclc = 830257044}}.\nInteraktywność\
      \ w [[sztuka|sztuce]] jest dialogiem odbiorcy (interaktora) i [[Dzieło sztuki\
      \ (sztuka)|dzieła sztuki]] w czasie rzeczywistym, [[Komunikacja interpersonalna|komunikacją]]\
      \ w formie wzajemnego oddziaływania. Sprawia, że dzieło jest inne w każdym przypadku\
      \ aktywności odbiorcy (interaktora). Następuje zmiana elementów składających\
      \ się na [[komunikat artystyczny]]. Twórczość [[artysta|artysty]] jest tylko\
      \ kontekstem dzieła, ono samo zaś powstaje w drugim etapie – interakcji z odbiorcą.\n\
      Dzieła interaktywne pozostają pod wpływem [[paradygmat]]ów [[modernizm (sztuka)|modernistycznego]]\
      \ i [[Postmodernizm (sztuka)|postmodernistycznego]]. Wpływają one na kształt\
      \ końcowy dzieła – w zależności od tego który mocniej oddziałuje, powstaje dzieło\
      \ jest skierowane bardziej w stronę ekspresji artysty jako autora, bądź są skierowane\
      \ na aktywność odbiorcy.\n{{Cytat\n |treść = Interaktywność jest podstawową\
      \ właściwością ogólnego procesu, poprzez który ulega przeobrażeniom zarówno\
      \ substancjalny, jak i semantyczny status sztuki. Proces ten odbywa się między\
      \ innymi, poprzez oddzielenie dzieła od artefaktu, jak też i dzięki przybraniu\
      \ przez ten ostatni charakteru [[hipertekst]]u.\n |autor = \n |źródło = Ryszard\
      \ W. Kluszczyński\n}}\n== Interaktywne dzieła multimedialne ==\nW mediach interaktywnych\
      \ nastąpiła zmiana lub przemieszanie ról i kompetencji artysty i odbiorcy. Artysta\
      \ jako autor nie jest już jedynym twórcą dzieła i jego sensu, lecz tworzy się\
      \ ono razem z procesem interakcji z odbiorcą. Zadaniem artysty jest w tej sytuacji\
      \ stworzenie dzieła sztuki, czyli wytworu aktywności twórczej artysty. W innym\
      \ rozumieniu dzieło sztuki jest strukturą hipertekstu, czyli wielopoziomowej,\
      \ nielinearnej struktury przeciwnej normalnemu, linearnemu tekstowi. Oprócz\
      \ hipertekstu dzieło sztuki tworzy też stanowiący podłoże jego struktury materiał:\
      \ obrazy, dźwięki, tekst. Dzieło sztuki jest układem-kontekstem, w którym odbiorca\
      \ (interaktor) tworzy przedmiot swojej percepcji i jego sens. Struktura stworzonego\
      \ przedmiotu zależy od aktywności twórczej i wyobraźni [[Odbiorca|odbiorcy]],\
      \ jak również znaczenia, jakie ten przedmiot generuje.\n{{Cytat\n |treść = Sztuka\
      \ interaktywnych multimediów posiada swoje uwarunkowania nie tylko w rozwoju\
      \ technologii informacyjno-komunikacyjnych, lecz posiada również oparcie w tendencjach\
      \ artystycznych, które rodziły się na przełomie [[lata 50. XX wieku|lat pięćdziesiątych]]\
      \ i [[lata 60. XX wieku|sześćdziesiątych]], aby dojrzeć wraz ze [[sztuka konceptualna|sztuką\
      \ konceptualną]]; które rozwijały się następnie i przeformułowały w czasie dwóch\
      \ kolejnych dekad, aby ostatecznie, około połowy [[lata 90. XX wieku|lat dziewięćdziesiątych]],\
      \ osiągnąć kształt posiadany współcześnie.\n |autor = \n |źródło = Ryszard W.\
      \ Kluszczyński\n}}\nChodzi tu przede wszystkim o konceptualizm, sztuki performatywne,\
      \ sztukę [[instalacja (sztuka)|instalacji]]. Są one ideowymi poprzednikami intermedialnej\
      \ sztuki interaktywnej i jej kultury. Sztuka intermedialna i interaktywna powstawała\
      \ równolegle do ich rozwoju. Sztuka konceptualna i [[multimedia]]lna często\
      \ łączyły się ze sobą pokazując, że są dla siebie nieodzowne i tworzyły się\
      \ dzięki obustronnym oddziaływaniom.\n== Przypisy ==\n{{Przypisy}}\n== Linki\
      \ zewnętrzne ==\n* Wydział Filologiczny [[Uniwersytet Śląski w Katowicach|Uniwersytetu\
      \ Śląskiego]]: [https://web.archive.org/web/20100304141450/http://www.fil.us.edu.pl/film-i-media/zawoj/PZsztint.html\
      \ Piotr Zawojski, ''O sztuce interaktywnej'']\n[[Kategoria:Sztuka]]"
    title: Main
  title: Interaktywność w sztuce
- sections:
  - content: '{{Commonscat|Critics}}

      [[Kategoria:Sztuka]]

      [[Kategoria:Krytycy|Sztuka]]'
    title: Main
  title: Kategoria:Krytycy sztuki
- sections:
  - content: '''''''Synteza sztuk'''''' – idea i praktyka syntezy sztuk, rozumianej
      jako ich wspólnota mimo rozmaitości tworzywa. Związana z poszukiwaniem [[Uniwersalizm|uniwersalnego]]
      języka sztuki. Od okresu [[romantyzm]]u określana jako ''''correspondance des
      arts'''' (z [[Język francuski|fr.]] ''''wspólnota sztuk'''').

      == Antyczna tradycja ==

      [[Plik:Versailles Demi-Lune Apollon lyre.jpg|thumb|Dla starożytnych Greków to
      instrument muzyczny – [[lira]] – był symbolem poezji i atrybutem [[Apollo|Apollina]]
      oraz muzy [[Erato (muza)|Erato]]]]

      Tradycje takiego myślenia i postawy [[Epistemologia|teoriopoznawczej]] sięgają
      [[Starożytność|antyku]], przejawiając się w rozmaitych [[Symbol|językach symbolicznych]]
      (badacze wskazują np. egipskie [[hieroglify]]). Już wówczas ujawniało się powiązanie
      słowa i obrazu – w [[piktogram]]ach, będących zalążkiem nowożytnej [[Poezja
      konkretna|literatury wizualnej]] jako integralne połączenie różnorodnego tworzywa
      i wspólnych znaczeń.

      W kulturze [[Starożytna Grecja|greckiej]] znamienne było powiązanie [[Liryka|liryki]]
      oraz [[Muzyka|muzyki]] i traktowanie tekstu jako [[Wiersz meliczny|wiersza melicznego]],
      który zawsze winien być kojarzony z [[Melodia|melodią]] i wyśpiewywany. Tak
      np. wszystkie dochowane wiersze [[Safona|Safony]] mają charakter meliczny (gr.
      ''''melos'''' znaczy tyle co ''''melodia'''').

      W kulturze [[Starożytny Rzym|rzymskiej]] poeta [[Horacy (poeta)|Horacy]] w swym
      ''''Liście do Pizonów'''' (znanym jako ''''[[List do Pizonów|Sztuka poetycka]]'''')
      zawarł słynny zwrot ''''ut pictura poesis'''' (łac. ''''poezja ''''[jest]''''
      jak malarstwo''''), wykorzystany jako inspiracja w [[Estetyka|estetyce]] [[renesans]]owej,
      np. przez [[Leonardo da Vinci|Leonarda da Vinci]] jako autora ''''[[Traktat
      o malarstwie|Traktatu o malarstwie]]''''.

      == W średniowieczu i renesansie ==

      [[Plik:Ars Magna de Ramon Llull.jpg|thumb|left|Bliskie [[komiks]]owej konwencji
      ujęcie w średniowiecznej iluminacji w ''''Ars Magna'''' [[Rajmund Llull|Rajmunda
      Lulla]], łączy sprawnie literacki tekst filozoficzny z pla­stycz­ną jego formą
      i oprawą]]

      Swoistą, poza inspiracją antyczną, wrażliwość na wspólnotę sztuk ujawniało [[średniowiecze]],
      zwłaszcza jego ''''[[ars moriendi]]'''' (łac. ''''sztuka umierania'''') jako
      temat w sztukach plastycznych (ujmowany na sposób [[Fabuła|fabularny]] i „literacki”){{Cytuj
      |autor = Maciej Włodarski |tytuł = Obraz i słowo. O powiązaniach w sztuce i
      literaturze XV–XVI wieku na przykładzie „ars moriendi” |data = 1991 |isbn =
      83-7052-001-4 |miejsce = Kraków |wydawca = Universitas |oclc = 830068682}}.

      Innym obszarem wzajemnego przenikania się sztuk była w średniowieczu [[książka]]
      rękopiśmienna. Rozkwitające w epoce, najpierw w klasztorach [[Benedyktyni|benedyktynów]]
      (za sprawą [[Benedykt z Nursji|św. Benedykta]] i jego ''''[[Reguła św. Benedykta|Reguły]]'''',
      inspirującej [[Kultura|kulturę]] [[Intelektualizm|intelektualną]]), zamiłowanie
      do książki (na razie pisanej ręcznie na [[pergamin]]ie) przejawiało się w zakładaniu
      przy [[klasztor]]ach [[Biblioteka|bibliotek]], w których istniało ''''[[Skryptorium|scriptorium]]'''',
      gdzie [[Zakon mniszy|mnisi]] – kopista (skryba, czyli ''''scriptor'''' – łac.
      ''''pisarz'''') i malarz – wykonywali wspólnie ozdobną księgę rękopiśmienną
      ([[Kopia (sztuka)|kopiując]] dzieło już istniejące lub pisząc nowe). Z czasem
      ta kultura książki ogarnęła inne zakony (np. [[Dominikanie|dominikanów]]) oraz
      dwory świeckie{{Cytuj |autor = Edward Potkowski |tytuł = Książka rękopiśmienna
      w kulturze Polski średniowiecznej |data = 1984 |isbn = 83-205-3468-2 |miejsce
      = Warszawa |wydawca = LSW |oclc = 830251017}}. W książce takiej tekst spisany
      był [[Kaligrafia|kaligraficznie]], [[Ilustracja|ilustrowały]] zaś go małe, a
      czasem ogarniające całą stronę, [[Iluminacja książki|iluminacje]] sporządzone
      jako barwny [[rysunek]] lub wykonany [[Akwarela|akwarelą]] [[Miniatura (malarstwo)|malunek]].
      Odbiorca równocześnie czytał i „widział” dzieło – tak się działo w toku [[Percepcja|percepcji]]
      ''''[[Biblia|Biblii]]'''' (zwykle ''''[[Wulgata|Wulgaty]]'''') z obficie ilustrowanych
      ksiąg określanych jako ''''[[Biblia Pauperum|Biblia pauperum]]''''. W Polsce
      arcydziełem w tej mierze są późnośredniowieczne (z 1532) ''''[[Rozmyślania dominikańskie]]'''',
      [[Doloryzm|dolorystyczna]] proza [[Pasja|pasyjna]], której [[Naturalizm (sztuka)|naturalistycznie]]
      ujęte ilustracje ukazują krwawe cierpienia [[Jezus Chrystus|Chrystusa]]. Księgi
      takie, niezależnie od ich tematu i jakości artystycznej, zapowiadają strukturalnie
      [[Estetyka|estetykę]] [[komiks]]u.

      Pojawił się też w epoce średniowiecza artysta wszechstronny, ogarniający i zespalający
      [[Wyobraźnia|wyobraźnią]] wiele sztuk – to kobieta, [[Benedyktynki|benedyktynka]]
      i [[Mistycyzm|mistyczka]] [[Hildegarda z Bingen]]: [[Poezja|poetka]], [[Malarstwo|malarka]],
      [[Kompozycja (muzyka)|kompozytorka]], także teolożka (kobieta-[[Teologia|teolog]])
      i filozofka (oraz lekarka-[[Ziołolecznictwo|fitoterapeuta]] uprawiająca [[Medycyna
      niekonwencjonalna|medycynę naturalną]] i [[Kucharz|kucharka]], ceniąca to, co
      wiek XX nazwał [[żywność ekologiczna|żywnością ekologiczną]])Sabina Flanagan:
      ''''Hildegarda z Bingen. Żywot wizjonerki''''. Tłum. Robert Sudół. Warszawa,
      PIW, 2002, {{ISBN|83-0602-89-45}}; Błażej Matusiak: ''''Hildegarda z Bingen
      – teologia muzyki''''. Kraków, Homini, 2003, {{ISBN|83-8959-80-86}}; Małgorzata
      Kowalewska: ''''Bóg – człowiek – kosmos w twórczości Hildegardy z Bingen''''.
      Lublin, Wyd. UMCS, 2007, {{ISBN|9788322727447}}..

      [[Renesans]] zainteresowany był [[Wyobraźnia|wyobraźnią]], którą traktował jako
      fantazjowanie, lecz i poznanieAgnieszka Fulińska: ''''Naśladowanie i twórczość.
      Renesansowe teorie imitacji, emulacji i przekładu''''. Wrocław, Leopoldinum,
      2000, {{ISBN|83-8522-09-68}}.. Podstawy teoretyczne syntezy sztuk (do czego
      nawiązał [[romantyzm]]) dała [[filozofia]] i [[estetyka]] [[Platonizm renesansowy|neoplatonizmu
      florenckiego]], zwłaszcza [[Marsilio Ficino]] w obszernych [[komentarz (gatunek
      literacki)|komentarzach]] do ''''Uczty'''' [[Platon]]a i w traktacie ''''Teologia
      platońska''''. Przedmiotem uwagi odrodzenia był też [[symbol]]. Gian Francesco
      Pico della MirandolaOkoło 1470–1533. Znany filozof [[Platonizm renesansowy|neoplatonik]]
      [[Giovanni Pico della Mirandola]] to inna osoba; Gian Francesco był jego bratankiem.
      w [[esej]]u ''''O wyobraźni'''' wskazywał obrazy symboliczne jako piękne i pomocne
      w wychowaniu młodzieży. W tym duchu publikowano liczne [[leksykon]]y symboli.

      Dzięki wynalazkowi [[druk]]u [[Książka|książki]] były już drukowane, a zyskiwały
      często (przez wzgląd na średniowieczną tradycję ksiąg rękopiśmiennych) bogatą
      oprawę [[Typografia|typograficzną]], z wykorzystaniem [[Grafika|grafik]] (zwykle
      [[drzeworyt]]ów), co wymagało od czytelnika [[Percepcja|percepcji]] w duchu
      syntezy sztuk. Taki charakter miał np. ''''Źwierzyniec'''' [[Mikołaj Rej|Mikołaja
      Reja]], zawierający [[Rycina|ryciny]], jako swoista książka [[emblemat]]yczna.
      Upowszechniały się też tomy, w których tekst traktowany był jako osobne tworzywo
      [[Grafika|graficzne]]; stanowiły one zalążek [[Poezja konkretna|literatury wizualnej]].

      Poszukiwania ściśle pojętej syntezy artystycznej hamował jednak [[klasycyzm]]
      renesansowy, akcentujący raczej autonomię każdej ze sztuk.

      == Barok epoką syntezy sztuk ==

      [[Plik:Estasi di Santa Teresa.jpg|thumb|Barokowe ''''[[theatrum sacrum]]'''',
      plastyczna reprezentacja chrześcijańskiej historii zbawienia, z jego teatralnymi
      efektami połączenia malarstwa, rzeźby i światła w otoczeniu muzyki – wszystko
      to miało wzbudzić u widza silne emocje.

      Tu ''''[[Ekstaza świętej Teresy|Ekstaza św. Teresy]]'''' [[Giovanni Lorenzo
      Bernini|Berniniego]]]]

      W pełni rozwijała myślenie o wspólnocie dopiero epoka [[barok]]u, poszukująca
      wiedzy uniwersalnej oraz duchowej i formalnej jedności wszystkich sztuk. Barokowe
      słowniki symboli otwierały na rozumienie [[byt]]u jako jedności wszelkich jego
      duchowych i materialnych przejawów – jedności „pochwyconej” przez symbol{{Cytuj
      |autor = Jacek Sokolski |tytuł = Barokowa księga natury. O europejskiej symbolografii
      wieku siedemnastego |data = 1992 |isbn = 83-229-0785-0 |miejsce = Wrocław |wydawca
      = Wyd. Uniwersytetu Wrocławskiego |oclc = 30020975}}. Znaczenie szczególne miał
      Cesare Ripa i jego ''''Ikonologia''''Około 1560, przed 1625. Zob.: Cezare Ripa:
      ''''Ikonologia''''. Tłum. Ireneusz Kania. Kraków, Universitas, 1998, {{ISBN|83-7052-901-1}}.
      – obszerny, ilustrowany [[drzeworyt]]ami, słownik pojęć, ujętych na sposób [[emblemat]]yczny:
      jako wizerunek symboliczny i komentarz [[dyskurs]]ywny do niego. W wieku XX
      nawiązał m.in. do niego [[Erwin Panofsky]], budując własną koncepcje [[Ikonologia|ikonologii]]
      ([[Ikonografia|ikonografii]]) jako nauki o treściach symbolicznych dzieła sztuki.
      Ukazywano też w epoce baroku współzależność natury i kultury. Miało to wpływ
      na [[Estetyka|estetykę]] barokową.

      Polak [[Maciej Kazimierz Sarbiewski|Sarbiewski]] w [[esej]]u ''''O zaletach
      i wadach elegii''''Tekst powstał po łacinie. Przedruk: Maciej Kazimierz Sarbiewski:
      ''''Wykłady poetyki''''. Tłum. Stanisław Skimina. Wrocław, Ossolineum, 1958,
      brak numeru ISBN. w duchu rozpoznania jednolitości [[Percepcja|percepcji]] analizował
      [[Emocja|emocyjny]] wymiar samogłosek, a w obszernym [[Traktat (nauka)|traktacie]]
      ''''Dii gentium [Bogowie pogan]'''' dał słownik [[mit]]ów kultury, łączący tradycję
      antyczną i chrześcijańskąTekst pisany po łacinie. Maciej Kazimierz Sarbiewski:
      ''''Dii gentium. Bogowie pogan''''. tłum. Krystyna Stawecka. Wrocław, Ossolineum,
      1972, brak numeru ISBN..

      W obrębie sztuki barokowej spełnieniem syntezy sztuk stał się [[emblemat]] jako
      gatunek z pogranicza literatury i sztuk plastycznych. Częste były też dzieła
      i [[Książka|książki]] traktowane [[eksperyment]]alnie jako całość z pogranicza
      literatury i sztuk plastycznych, z fantazyjnym [[Skład tekstu|składem tekstu]],
      traktowanego od strony [[Typografia|typograficznej]] na sposób „malarski”. Tekst
      przybierał kształt berła, drzewa, szklanicy itd. Barok jest w tej mierze okresem
      bujnego rozkwitu [[Poezja konkretna|literatury wizualnej]]. W Polsce formy takie
      częste były w [[Literatura stosowana|literaturze okolicznościowej]], a przykładem
      są teksty w kształcie krzyża, berła, gwiazdy, obelisku czy pomnika nagrobnegoPiotr
      Rypson: ''''Obraz słowa. Historia poezji wizualnej''''. Warszawa, Akademia Ruchu,
      1989, rozdział: ''''Poezja wizualna w Polsce XVI–XVIII wieku'''', brak numeru
      ISBN..

      Najpełniej jednak marzenie o wspólnocie sztuk urzeczywistnia [[opera]], gatunek
      powstały w epoce [[barok]]u, właśnie na gruncie poszukiwania syntezy, tutaj
      łączącej [[Muzyka|muzykę]] ([[Kompozycja (muzyka)|kompozycja]], tworząca fundament
      dźwiękowy), [[Literatura|literaturę]] (wyśpiewywane [[libretto]]), [[teatr]]
      ([[Inscenizacja|inscenizację]]) i [[malarstwo]] (z którego czerpie [[scenografia]]).
      Opera ukształtowała się w kręgu [[Camerata florencka|Cameraty florenckiej]]
      (podłoże teoretyczne nowemu myśleniu [[Estetyka|estetycznemu]] dał [[renesans]]owy
      jeszcze [[Vincenzo Galilei]] w przełomowym traktacie ''''Dialogo della musica
      antica e moderna''''), rozwinęła w Wenecji, a pierwsze jej arcydzieła dał [[Claudio
      Monteverdi]] (premiera w 1607 jego [[Orfeusz (opera)|Orfeusza]] uchodzi za początek
      trwania gatunku){{Cytuj |autor = Ewa Obniska |tytuł = Claudio Monteverdi |data
      = 1993 |isbn = 83-85111-64-6 |miejsce = Gdańsk |wydawca = Stella Maris |oclc
      = 749380529}}.

      Barokowe wizjonerstwo, łączące rozmaite tworzywa i obszary [[Percepcja|percepcji]]
      pozwalało praktycznie spełniać koncepcję syntezy sztuk – tak pisali [[William
      Shakespeare|Shakespeare]]Jadwiga Sokołowska ''''Spory o barok. W poszukiwaniu
      modelu epoki''''. Warszawa, PIW, 1971, brak numeru ISBN, rozdział na temat Shakespeare’a.,
      [[Pedro Calderón de la Barca|Calderon]] (w swoich [[Auto sacramental|autos sacramentales]]),
      [[Giambattista Marino|Marino]] (w poemacie ''''L’Adone''''), a w Polsce [[Samuel
      Twardowski]].

      == Rygoryzm oświecenia ==

      W okresie [[Oświecenie (epoka)|oświecenia]] akcentowano, w duchu [[Estetyka|estetyki]]
      [[klasycyzm]]u, raczej odrębność poszczególnych sztuk ([[Gotthold Ephraim Lessing|Lessing]]
      w eseju ''''Laokoon'''', 1766, rozpatrujący różnice między malarstwem a literaturą).

      Wyjątek stanowiła [[opera]], nie cała (często ograniczana wówczas do samego
      popisu wokalnego), ale ta, którą tworzył [[Wolfgang Amadeus Mozart]]. Dwa jego
      najpełniejsze dzieła operowe – ''''[[Don Giovanni]]'''' oraz ''''[[Czarodziejski
      flet (KV 620)|Czarodziejski flet]]'''' – tworzą idealnie harmonijne zespolenie
      muzyki, tekstu, [[Fabuła|fabuły]] i gry [[Wyobraźnia|wyobraźni]].

      == Romantyzm i wspólnota sztuk ==

      Okresem odnowienia dawnych marzeń i nowej fascynacji syntezą sztuk stał się,
      ponawiający w tej mierze dawne myślenie, a sięgający też do mistrzów [[barok]]u
      (jak [[William Shakespeare|Shakespeare]]), [[romantyzm]]. Inspirację dał też
      w swych wykładach z [[Estetyka|estetyki]] [[Georg Wilhelm Friedrich Hegel|Hegel]],
      który traktował sztukę jako przejaw absolutu w postaci zmysłowej, obszerne rozważania
      poświęcając [[Symbol|formom symbolicznym]] w sztuce, „romantycznej formie sztuki”
      i poszczególnym rodzajom sztukGeorg Friedrich Hegel: ''''Wykłady o estetyce''''.
      Tłum. Janusz Grabowski i Adam Landman. Warszawa, PWN, 1964–1967, brak numeru
      ISBN, t. I-III..

      Myśl [[Filozofia|filozoficzna]] i [[Estetyka|estetyczna]] [[romantyzm]]u często
      skupiała się wokół duchowej jedności człowieka i natury, także kultury i natury,
      oraz bliskości osoby ludzkiej i Boga, wysnuwając z tego projekt sztuki, która
      na sposób [[symbol]]iczny te powinowactwa ukaże: pisali o tym [[Jean Paul|Jean
      Paul Richter]], [[Friedrich Schleiermacher]], malarz [[Philipp Otto Runge|Otto
      Runge]] (zaprzyjaźniony z symbolicznie przedstawiającym [[pejzaż]] malarzem
      [[Caspar David Friedrich|Friedrichem]]), także myśliciel Karl Trahndorff (1782–1863),
      który najmocniej rozwijał koncepcję ''''Gesamtkunstwerk'''' (dzieła sztuki uniwersalnego
      lub raczej „totalnego” – pojmowanego jako spójne zespolenie różnych sztuk: poezji,
      muzyki, malarstwa, tańca)Georges Gusdorf: ''''L’Homme romantique''''. Paris,
      Payot, 1984. {{ISBN|2-228-13580-1}}, s. 70–76 – książka w jęz. francuskim..
      Wszędzie tu sztuka pojmowana jest jako jednorodny mimo rozmaitości tworzywa
      język odsłaniający [[byt]] – „dzieło totalne” (''''Gesamtkunstwerk'''').

      Spełnienie syntezy sztuk dali autorzy z pogranicza [[Oświecenie (epoka)|oświecenia]]
      i [[romantyzm]]u: [[Johann Wolfgang von Goethe|Johann Wolfgang Goethe]] (w [[Tragedia|tragedii]]
      ''''[[Faust (dramat Johanna Wolfganga von Goethego)|Faust]]'''') i, zwłaszcza
      wszechstronny [[William Blake]] ([[Mistycyzm|mistyk]], poeta, malarz i [[Grafika|grafik]],
      łączący harmonijnie różne obszary swej twórczości w jedną wizję artystyczną).

      W dojrzałym romantyzmie koncepcję wspólnoty wyobraźni i tworzywa głosili i spełniali,
      otwierając swą twórczość na inspirację innych sztuk: malarz [[Eugène Delacroix]]
      i polski kompozytor [[Fryderyk Chopin]]. Także inni polscy romantycy kształtują
      syntezę sztuk: [[Juliusz Słowacki]] (zwłaszcza w utworach późnych dający wizyjną
      jedność poezji oraz malarskich i muzycznych efektów) i [[Cyprian Kamil Norwid|Cyprian
      Norwid]] (jako artysta wszechstronny: poeta, malarz i rysownik – „sztukmistrz”,
      jak sam siebie nazywał{{Cytuj |autor = Aleksandra Melbechowska-Luty |tytuł =
      Sztukmistrz. Twórczość artystyczna i myśl o sztuce Cypriana Norwida |data =
      2001 |isbn = 83-86842-97-0 |miejsce = Warszawa |wydawca = Neriton |oclc = 297665071}}).

      [[Rodzaj literacki|Rodzajem]] obfitującym w tej epoce w wielkie wizje w duchu
      syntezy sztuk był [[dramat]], a ściślej [[Gatunek literacki|gatunek]] dla epoki
      [[idiom]]atyczny – [[dramat romantyczny]]. Wielką rolę w jego ukształtowaniu
      miała romantyczna recepcja [[barok]]u (jeszcze nie nazywano go tak jako epoki),
      w tym [[Pedro Calderón de la Barca|Calderona]], a zwłaszcza [[William Shakespeare|Shakespeare’a]],
      czytanego jako wizjoner, który uczy wolności artystycznej, a łączy rozmaite
      [[Styl artystyczny|style]] i tworzywa sztuk. Teoretyczne podstawy dramatu romantycznego
      sformułował [[Victor Hugo]][[Stefania Skwarczyńska]]: ''''Victor Hugo jako teoretyk
      dramatu''''. W: ''''Studia i szkice literackie''''. Warszawa, PAX, 1953, brak
      numeru ISBN.. [[Synkretyzm|Synkretyczną]] wizję i spełnienie syntezy sztuk dał
      [[Johann Wolfgang von Goethe|Goetheański]] ''''[[Faust (dramat Johanna Wolfganga
      von Goethego)|Faust]]'''', pełen efektów muzycznych i, szczególnie w części
      II, nieomal „filmowych”. Jeszcze w romantyzmie te jego cechy uwypukliły [[Adaptacja
      (sztuka)|adaptacje]] [[Opera|operowe]], które dali [[Charles Gounod]] (''''[[Faust
      (opera Charles’a Gounoda)|Faust]]'''') i [[Hector Berlioz]] (''''[[Potępienie
      Fausta]]''''). W obrębie polskiego dramatu romantycznego synkretyczne wizje
      dają [[Adam Mickiewicz]] w ''''[[Dziady (dramat)|Dziadach]]'''' (zwłaszcza w
      [[Dziady część II|części II]]Ryszard Przybylski: ''''Słowo i milczenie bohatera
      Polaków. Studium o „Dziadach”''''. Warszawa, IBL, 1993, {{ISBN|83-8560-524-X}}.)
      i [[Juliusz Słowacki]] w dramatach (najpełniej w ostatnim – ''''Samuelu Zborowskim''''Juliusz
      Kleiner: ''''Słowacki''''. Wrocław, Ossolineum, 1972, brak numeru ISBN.).

      Opera romantyczna ponawiała pierwotną, ukształtowaną w baroku, tradycję gatunku
      jako formy synkretycznej ([[Gaetano Donizetti]] i ''''[[Łucja z Lammermooru]]'''',
      [[Modest Musorgski]] i sięgający rosyjskiej tradycji muzycznej ''''[[Borys Godunow
      (opera)|Borys Godunow]]'''', wspomniani Gounod i Berlioz, przede wszystkim zaś
      [[Giuseppe Verdi]] i oparte na [[tragedia]]ch [[William Shakespeare|Shakespeare’a]]
      opery ''''[[Makbet (opera)|Makbet]]'''' oraz ''''[[Otello (opera Giuseppe Verdiego)|Otello]]'''').
      We Francji odmianą gatunku, bezwiednie (bez takiej świadomości estetycznej)
      nawiązującą do baroku, stała się ''''[[grand opéra]]'''', której przedstawicielem
      był [[Giacomo Meyerbeer]]. Często jednak opera romantyczna skupiała się nazbyt
      wokół popisowych partii wokalnych, zatracając istotę gatunku.

      Znaczenie szczególne miał więc późnoromantyczny kompozytor [[Richard Wagner]],
      formułujący w pismach teretycznych koncepcję [[Dramat muzyczny|dramatu muzycznego]]
      (odróżnianego od [[Opera|opery]])[[Richard Wagner]]: ''''Opera i dramat''''.
      W antologii: ''''O dramacie''''. Tom II: ''''Od Hugo do Witkiewicza''''. Warszawa,
      Fundacja Astronomii Polskiej, 1993, {{ISBN|83-85962-00-X}}.. Wysnute z tych
      założeń jego dzieła (jak ''''[[Tristan i Izolda (dramat muzyczny)|Tristan i
      Izolda]]'''', [[tetralogia]] ''''[[Pierścień Nibelunga]]'''') były nowym spełnieniem
      barokowo-romantycznej koncepcji spójności tworzywa różnych sztuk w obrębie jednego
      kreacyjnego dzieła wizyjnego. Wagner urzeczywistniał postulowane przez wcześniejszych
      [[Teoria|teoretyków]] „dzieło totalne” – ''''Gesamtkunstwerk''''. Sam też pisał
      poetyckie [[Libretto|libretta]] do swych dziełZdzisław Jachimecki: ''''Ryszard
      Wagner''''. Kraków, Gebethner i Wolff, 1922, brak numeru ISBN – [[monografia]]
      wciąż aktualna..

      == Od symbolizmu do modernizmu ==

      [[Plik:Robert-le-diable.jpg|thumb|left|Przedstawienie opery [[Giacomo Meyerbeer]]a
      ''''Robert diabeł'''' na obrazie [[Edgar Degas|Degasa]]. Wystawiana z przepychem
      francuska ''''[[grand opéra]]'''' z założenia była sztuką integralną, która
      miała łączyć malarstwo, scenografię, architekturę itd. Bogactwo instrumentacji
      i wielość środków muzycznych, [[recytatyw]]y, a także partie [[balet]]owe, wartka
      akcja pełna zwrotów – schlebiały ówczesnym gustom mieszczańskiego Paryża.]]

      Pod wrażeniem wizji „totalnego” dzieła sztuki Richarda Wagnera, [[Charles Baudelaire]]
      uznał muzykę za wzór dla poezji wyrażającej najbardziej osobiste i nieuchwytne
      przeżycia oraz wrażenia. Takiego znaczenia nabrała dla symbolistów muzyka, bo
      to właśnie ona – skuteczniej niż słowo, a nawet obraz (wtedy jeszcze realistyczny)
      – pobudzała uczucia i wyzwalała intuicję[[Danuta Gwizdalanka]] ''''Przemiany
      kultury muzycznej XX wieku''''. PWM Kraków 2011, s. 43.. Słynny [[sonet]] Baudelaire
      ''''Correspondances'''' (w polskich przekładach oddawano to ''''Odpowiedniki''''
      lub ''''Oddźwięki'''', choć tytuł znaczy po prostu ''''Korespondencje'''', w
      sensie „wzajemne oddziaływania”) z tomu ''''[[Kwiaty zła]]'''' (1857) stał się
      wkrótce cząstką zwrotu ''''corespondances des arts'''' jako terminu z zakresu
      [[Estetyka|estetyki]]. Baudelaire przedstawiał w tym sonecie duchowe powinowactwo
      człowieka i natury, nazwanej „lasem symboli”. Z tej romantycznej wizji przyrody
      poeta wysnuł nową koncepcję [[symbol]]u, jako nie tyle cząstki pewnego rozpoznawalnego
      [[leksykon]]u znaczeń, ile głęboko osobistej i niepojmowalnej wizji. Baudelaire
      zainspirował tak [[symbolizm]] jako [[Estetyka|estetykę]] i kierunek artystyczny,
      który otwierał się na powinowactwa sztuk i zmierzał w stronę wielkiej [[Synkretyzm|synkretycznej]]
      wizji. Tak pisał [[Arthur Rimbaud]], co wyraża jego poezja i proza poetycka,
      a programowo sonet ''''Samogłoski'''' (odsłaniający powinowactwa między dźwiękiem
      a obrazem).

      Z inspiracji nowego symbolizmu [[Modernizm (sztuka)|modernizm]] jako epoka w
      literaturze i sztuce sięgał po syntezę sztuk często. Rozwijali to twórczo kompozytorzy
      [[Gustav Mahler]] (w swych, bogatych w treści [[Filozofia|filozoficzne]] [[symfonia]]ch)
      i [[Aleksandr Skriabin]] (łączący dźwięk i kolor w obrębie wykonania – słynna
      koncepcja „fortepianu świetlnego”)Bohdan Pociej: ''''Szkice z późnego romantyzmu''''.
      Kraków, PWM, 1978, brak numeru ISBN.. Spośród artystów [[Młoda Polska|Młodej
      Polski]] najwszechstronniej urzeczywistnia wspólnotę sztuk [[Stanisław Wyspiański]],
      poeta, malarz i rysownik – zwłaszcza w dramatach ''''Noc listopadowa'''', ''''Wesele''''
      i wizjonerskim ''''Akropolis''''Ewa Miodońska-Brookes: ''''Wawel – „Akropolis”.
      Studium o dramacie Stanisława Wyspiańskiego''''. Kraków, WL, 1980.. Syntezę
      sztuk realizuje też [[Tadeusz Miciński]] w – ujętej z malarskim i niemal „filmowym”
      rozmachem – [[Tragedia|tragedii]] ''''Bazylissa Teofanu''''

      Określenia synteza sztuk i korespondencja sztuk często używane są zamiennie,
      tymczasem różnią się celami i dziedzinami sztuki, w których się głównie przejawiały.

      {| class="wikitable"

      ! korespondencja sztuk

      ! synteza sztuk

      |-

      | cel: poszerzenie źródeł inspiracji, umuzycznienie poezji i malarstwa

      | cel:pogłębienie przeżycia, wzmocnienie siły oddziaływania uczuciowego

      |-

