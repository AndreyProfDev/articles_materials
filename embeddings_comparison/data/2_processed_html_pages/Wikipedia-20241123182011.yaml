- sections:
  - content: "{{Inne znaczenia}}\n'''Autor''', '''twórca''' ({{w języku|la|auctor}}\
      \ - sprawca, twórca) – osoba, która tworzyła{{Cytuj |tytuł = Słownik terminologiczny\
      \ informacji naukowej |data = 1979 |inni = Maria Dembowska (red. nacz.) |miejsce\
      \ = Wrocław–Warszawa–Kraków–Gdańsk |wydawca = Zakład Narodowy imienia Ossolińskich\
      \ |s = 27}} lub współtworzyła dzieło ([[utwór]] w rozumieniu [[prawo autorskie|prawa\
      \ autorskiego]]).\n== Twórca utworu zależnego == \t\nTypowym przykładem takiego\
      \ twórcy jest [[tłumacz]]. Nie jest autorem tłumaczonego tekstu, ale w rozumieniu\
      \ prawa autorskiego jest twórcą tłumaczenia - autorem tłumaczenia{{Cytuj|url\
      \ = https://booklips.pl/newsy/dziela-georgea-orwella-edgara-ricea-burroughsa-georgea-bernarda-shawa-i-innych-pisarzy-od-2021-roku-w-domenie-publicznej/|tytuł\
      \ = Dzieła George’a Orwella, Edgara Rice’a Burroughsa, George’a Bernarda Shawa\
      \ i innych pisarzy od 2021 roku w domenie publicznej|data dostępu = 2021-01-25}}.\n\
      == Koncepcje autorstwa ==\nPojęcie autorstwa nie jest jednoznaczne i podlegało\
      \ znacznej ewolucji. W [[Średniowiecze|średniowiecznej]] Europie nie przykładano\
      \ wagi do autorstwa i teksty były rozpowszechniane jako [[anonim]]owe, a w klasycznej\
      \ literaturze Wschodu uznaniem cieszyły się utwory składające się z [[cytat]]ów\
      \ zaczerpniętych z innych dzieł.\nWspółcześnie prawo autorskie jest jednym z\
      \ najważniejszych zagadnień w udostępnianiu twórczości, w tym również w tych\
      \ dziedzinach życia, w których dzieło jest zwykle wynikiem pracy wielu osób\
      \ (np. [[kod źródłowy]] [[Oprogramowanie|programu]] w informatyce lub formy\
      \ współpracy przez [[Internet]] takie jak [[Wikipedia]]; przykładem wspólnym\
      \ dla obu zjawisk jest chociażby [[Linux]]).\n== Polskie prawo autorskie ==\
      \ \nAutorem jest osoba fizyczna, która wniosła twórczy wkład do utworu. Jest\
      \ to kwestia faktu (a nie prawa), innymi słowy – istnienia więzi osoby z utworem.\
      \ Więź tę chroni prawo do [[Autorstwo|autorstwa]], jedno z [[Autorskie prawa\
      \ osobiste|autorskich praw osobistych]]{{Odn|Jankowska|2011}}. Prawa te powstają\
      \ na rzecz autora, tak więc nie można zrzec się statusu autora ani przenieść\
      \ go na inną osobę. Co do zasady na rzecz autora powstają też [[Autorskie prawa\
      \ majątkowe|majątkowe prawa autorskie]], które podlegają [[Obrót (prawo)|obrotowi]]{{Odn|Barta|Markiewicz|2010|s\
      \ = 70}}.\nNa oznaczenie autora w ustawie o prawie autorskim i prawach pokrewnychUstawa\
      \ z dnia 4 lutego 1994 r. o prawie autorskim i prawach pokrewnych ({{Dziennik\
      \ Ustaw|2021|1062}}), dalej pr. aut. ustawodawca posługuje się także (niekonsekwentnie)\
      \ pojęciem „twórca”{{Odn|Barta|Markiewicz|2010|s = 70}}. Status [[współautor]]ów\
      \ mają osoby, które w procesie tworzenia utworu (jako całości) współpracowały\
      \ ze sobą, a ich twórcze wkłady są możliwe do oznaczenia{{Odn|Barta|Markiewicz|2010|s\
      \ = 72}}.\nW zależności od kategorii dzieła różne osoby są odpowiedzialne za\
      \ nadanie mu cech utworu. Twórcami utworów zależnych są [[tłumacz]]e, autorzy\
      \ opracowań edytorskich, aktorzy i wykonawcy muzyczni. W wypadku przedstawień\
      \ autorem jest osoba odpowiadająca za nadanie dziełu wyrazu artystycznego i\
      \ szczególnego charakteru. Współautorami utworu audiowizualnego są w szczególności:\
      \ reżyser, operator obrazu, twórca adaptacji utworu literackiego, twórca tworzonych\
      \ dla utworu audiowizualnego utworów muzycznych lub słowno-muzycznych oraz twórca\
      \ scenariuszaArt. 69 pr. aut., zob. {{Cytuj stronę |url = http://www.lexpressive.pl/status-rezysera-wczoraj-i-dzis/\
      \ |tytuł = Status reżysera wczoraj i dziś |język = pl |data dostępu = 2015-12-01\
      \ |archiwum = https://web.archive.org/web/20151208121346/http://www.lexpressive.pl/status-rezysera-wczoraj-i-dzis/\
      \ |zarchiwizowano = 2015-12-08 }}.\n== Zobacz też ==\n{{Wikicytaty|dopełniacz=o\
      \ autorze}}\n* [[atrybucja (sztuka)|atrybucja]]\n* [[ghostwriter]]\n* [[dzieło\
      \ osierocone]]\n* [[autor nazwy (zoologia)]], [[autor nazwy (botanika)]]\n==\
      \ Przypisy ==\n{{Przypisy}}\n== Bibliografia ==\n* {{cytuj pismo | nazwisko\
      \ = Nasiłowska | imię = Anna | autor link = Anna Nasiłowska | tytuł = Wstęp.\
      \ Kim jest Twórca? | czasopismo = Teksty Drugie | wolumin = 1/2 2012 | wydanie\
      \ = pierwsze | strony = 6-10 | data = 2012 | wydawca = IBL PAN | miejsce = Warszawa\
      \ | issn = 0867-0633}}\n* {{Cytuj książkę |imię = Janusz | nazwisko =Barta |imię2\
      \ =Ryszard | nazwisko2 =Markiewicz |tytuł = Prawo autorskie |data = 2010 |wydawca\
      \ = Wolters Kluwer | miejsce = Warszawa |isbn = 978-83-264-0671-3 |odn = tak}}\n\
      * {{Cytuj książkę |imię = Marlena | nazwisko =Jankowska |tytuł = Autor i prawo\
      \ do autorstwa |data = 2011 |wydawca = Wolters Kluwer |miejsce = Warszawa |isbn\
      \ = 978-83-264-1345-2 |odn = tak}}\n{{Prawa autorskie}}\n{{Książka}}\n{{Kontrola\
      \ autorytatywna}}\n[[Kategoria:Prawo autorskie]]\n[[Kategoria:Sztuka]]"
