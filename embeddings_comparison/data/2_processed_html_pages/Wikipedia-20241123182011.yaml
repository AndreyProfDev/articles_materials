- sections:
  - content: "[[Plik:Artisanat de tranchée poilus au travail guerre de 1914-18.jpg|thumb|Francuscy\
      \ ''[[poilu]]'' tworzący dzieła sztuki okopowej z [[Łuska (nabój)|łusek]] po\
      \ pociskach]]\n'''Sztuka okopowa{{Cytuj | autor = Wiktor Szymborski | tytuł\
      \ = Sztuka okopowa a jej wykorzystanie w dydaktyce historii | czasopismo = Perspektywy\
      \ Kultury | wolumin = 36 | numer = 1 | data = 2022 | s = 209-230 | doi = 10.35765/pk.2022.3601.14}}'''\
      \ – [[Dzieło sztuki|dzieła sztuki]] wykonywane przez [[żołnierz]]y, [[Jeniec\
      \ wojenny|jeńców wojennych]] i [[cywil]]ów podczas konfliktów zbrojnych lub\
      \ w ich następstwie, powstające z materiałów używanych przez wojsko (np. z elementów\
      \ [[broń|broni]] lub [[amunicja|amunicji]]) lub też z innych dostępnych materiałów{{Cytuj\
      \ stronę | url = https://www.armymuseum.co.nz/whats-on/world-war-one-centenary/personal-treasures-wwi-trench-art/\
      \ | tytuł = Personal Treasures: WWI Trench Art | nazwisko = | imię = | autor\
      \ = | autor link = | data = | rok = | miesiąc = | praca = | opublikowany = National\
      \ Army Museum Te Mata Toa | oznaczenie = | strony = | język = en | archiwum\
      \ = | zarchiwizowano = | id = | cytat = | data dostępu = 2022-08-28}}.\n== Opis\
      \ ==\nDzieła [[Sztuka|sztuki]] okopowej wykonywano z najróżniejszych, dostępnych\
      \ materiałów. Obejmowały one wojenny [[Złom (metalurgia)|złom]], taki jak [[Łuska\
      \ (nabój)|łuski]] po nabojach i pociskach, [[szrapnel]]e oraz fragmenty zniszczonych\
      \ budynków lub zestrzelonych [[samolot]]ów. Materiały takie były dostępne w\
      \ strefach działań wojennych. Szczególnie przydatne były łuski po nabojach i\
      \ pociskach, wykorzystywane do tworzenia, między innymi, [[Wieczne pióro|wiecznych\
      \ piór]], [[Ołówek|ołówków]], [[wazon]]ów, [[krucyfiks]]ów i otwieraczy do listów.\
      \ Przedmioty te dodatkowo dekorowano napisami lub grafikami. \nDzieła sztuki\
      \ okopowej tworzono dla zabicia czasu, rozrywki lub jako pamiątki dla żołnierzy\
      \ w zapamiętaniu miejsc stacjonowania lub bitew. Niektóre dzieła powstawały\
      \ na pierwszej linii frontu w przerwach między potyczkami, ale zdecydowana większość\
      \ dzieł wykonanych przez żołnierzy została zaprojektowana i stworzona daleko\
      \ za liniami frontu, w czym pomocny był specjalistyczny sprzęt dostępny w warsztatach\
      \ [[Kowalstwo|kowalskich]] i [[Inżynieria wojskowa|inżynieryjnych]]. Jeńcy wojenni\
      \ tworzyli przedmioty nie tylko dla zabicia czasu, ale także po to, by wymieniać\
      \ je na żywność lub papierosy. \nOsobną kategorię sztuki okopowej tworzyła ludność\
      \ cywilna na zniszczonych wojną obszarach, gdzie pozostałości po bitwach dostarczały\
      \ przydatnych surowców, dzięki czemu rozwinęło się chałupnictwo, produkujące\
      \ pamiątki z okopów dla żołnierzy, co trwało przez cały okres międzywojenny.\
      \ Co istotne czasami trudno jest odróżnić sztukę okopową wytworzoną przez żołnierzy,\
      \ jeńców wojennych i cywilów od produkowanej komercyjnie. Niektóre pamiątki\
      \ komercyjne łączyły materiały wojenne, takie jak łuski po nabojach, z elementami\
      \ fabrycznie nowymi.\n== Galeria (wybór) ==\n== Przypisy ==\n{{Przypisy}}\n\
      == Linki zewnętrzne ==\n{{Commonscat|Trench art}}\n* {{Cytuj stronę | url =\
      \ http://www.trenchart.co.uk/Types/typesindex.html | tytuł = Katalog sztuki\
      \ okopowej | nazwisko = | imię = | autor = | autor link = | data = | rok = |\
      \ miesiąc = | praca = | opublikowany = The UK Trench Art Site | oznaczenie =\
      \ | strony = | język = en | archiwum = | zarchiwizowano = | id = | cytat = |\
      \ data dostępu = 2022-08-28}}\n[[Kategoria:Sztuka]]"
