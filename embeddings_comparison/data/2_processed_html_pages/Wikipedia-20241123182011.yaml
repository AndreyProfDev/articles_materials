  - content: '{{Inne znaczenia|dziedziny sztuki|[[Generowanie obrazów przez AI]]}}

      ''''''Sztuka generatywna'''''' – zastosowanie [[algorytm]]ów oraz innych [[System
      autonomiczny (cybernetyka)|autonomicznych systemów]] do tworzenia [[Dzieło sztuki|dzieł
      sztuki]]. Głównym wyróżnikiem sztuki generatywnej są elementy losowości, proceduralności
      oraz kreatywna autonomia systemu. Nazywana czasami sztuką kodu{{Cytuj pismo
      |nazwisko = Bomba |imię = Radosław |autor link = |tytuł = Sztuka algorytmów.
      Algorytmy w sztuce |url = https://www.nck.pl/upload/2021/12/11_kw_1-2019-sztuka-algorytmow.pdf
      |czasopismo = Kultura Współczesna. Teoria. Interpretacje. Praktyka |wolumin
      = 104 |wydanie = 1 |strony = 154–158 |rok = 2019 |issn = 2300-1704 |doi = 10.26112/KW.2019.104.11}}.

      Często sztuka generatywna powstaje poprzez [[eksperyment]]owanie z [[Kod źródłowy|kodem]]
      lub algorytmem w celu uzyskania [[Estetyka|estetycznego]] efektu. Sztukę generatywną
      można podzielić na dwie kategorie tzw. słabą oraz silną. Pierwsza kategoria
      obejmuje dzieła, w których artysta w większym stopniu realizuje swoją wizję.
      W drugiej program komputerowy ma większą [[Autonomia|autonomię]], wtedy rola
      artysty kończy się na napisaniu programu{{Cytuj pismo |autor = Paulina Tarara
      |tytuł = Sztuka tworząca sztukę: Kreatywne maszyny? |czasopismo = inAW Journal
      – Multidisciplinary Academic Magazine |data = 2020-12-05 |data dostępu = 2024-05-02
      |issn = 2719-7816 |wolumin = 1 |numer = 1 |doi = 10.52652/inaw.25 |url = https://systeminawjournal.asp.krakow.pl/index.php/inaw/article/view/25
      |strony=5}}.

      Pierwsza wystawa sztuki generatywnej miała miejsce w [[1965]] roku na [[Uniwersytet
      w Stuttgarcie|Uniwersytecie w Stuttgarcie]]. Jednak przez wiele lat rozwijała
      się ona na marginesie głównego nurtu [[Sztuka współczesna|współczesnego życia
      artystycznego]]. Obecnie sztuka generatywna zyskuje coraz bardziej na znaczeniu,
      głównie dzięki coraz większemu znaczeniu [[Technologia|technologii]] i jej wpływu
      na naszą [[Kultura|kulturę]].

      == Zobacz też ==

