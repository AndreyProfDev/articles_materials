      \ |pierwsze rozdanie = [[1978]]\n |ostatnie rozdanie = \n |commons = \n |www\
      \ = \n}}\n'''Nagroda Wolfa''' – nagroda przyznawana przez [[Fundacja Wolfa|Fundację\
      \ Wolfa]] w [[Izrael]]u za ''wybitne osiągnięcia na rzecz ludzkości i przyjaźni\
      \ między narodami''. Corocznie od 1978, komitety złożone z międzynarodowych\
      \ ekspertów przyznają 5–6 nagród w następujących dziedzinach: [[chemia]], [[fizyka]],\
      \ [[matematyka]], [[medycyna]], [[rolnictwo]] i [[sztuka]]. Nagrody w ''sztuce''\
      \ są przyznawane na przemian w [[Architektura|architekturze]], [[Muzyka|muzyce]],\
      \ [[Malarstwo|malarstwie]] i [[Rzeźbiarstwo|rzeźbiarstwie]]. Laureat otrzymuje\
      \ dyplom i 100 000 [[Dolar amerykański|USD]].\nDo 2021 nagrodę otrzymało 345\
      \ naukowców i artystów{{Cytuj |tytuł = The Wolf Prize |data dostępu = 2021-06-18\
      \ |opublikowany = Wolf Foundation |url = https://wolffund.org.il/the-wolf-prize/\
      \ |język = en-US}}.\nNagroda Wolfa jest zaliczana do trzech najbardziej prestiżowych\
      \ nagród w każdej z dziedzin, w których jest przyznawana{{fakt|data=2012-01}}.\n\
