- sections:
  - content: '[[Plik:Scorpion fish.jpg|thumb|300px|Ryba [[skorpenokształtne|skorpenokształtna]]
      – przykład mimetyzmu]]

      {{Wikisłownik|mimetyzm}}

      ''''''Mimetyzm'''''' ([[język grecki|gr.]] ''''mimetés'''' ‘naśladowca’) – [[Adaptacja
      (biologia)|adaptacyjna]] zdolność niektórych [[Zwierzęta|zwierząt]] (rzadziej
      [[Rośliny|roślin]]) do upodabniania się barwą ([[homochromia]]) lub kształtem
      ([[homomorfia]]) do otaczającego je środowiska. Pojęcie mimetyzmu należy rozumieć
      w szerszym zakresie niż [[mimikra|mimikrę]], gdyż obejmuje nie tylko przystosowanie
      ochronne (w celu ukrycia się przed [[Drapieżnictwo|drapieżnikiem]] lub jego
      odstraszenia), lecz również maskowanie, [[Kamuflaż|kamuflowanie]] drapieżników
      czatujących na potencjalne ofiary.

      Przykłady mimetyzmu:

      * biały kolor [[Futro|futra]] niektórych zwierząt [[Klimat subpolarny|klimatu
      okołobiegunowego]];

      * upodabnianie się do [[Liść|liści]] (żywych lub suchych) – niektóre owady (np.
      [[straszyki]], [[modliszki]], [[zgarbowate]], niektóre [[świerszcze]]), niektóre
      płazy (np. [[rogatka ozdobna]]), a nawet niektóre [[ryby]];

      * upodabnianie się do [[Gałąź|gałązek]] (żywych lub suchych) – [[patyczaki]]
      oraz wiele [[Gąsienica (larwa)|gąsienic]] motyli (np. [[paziowate]], [[miernikowcowate]]);

      * upodabnianie się do [[Ptaki|ptasich]] [[Kał|odchodów]] – gąsienice ''''[[Papilio
      menestheus]]'''' i niektóre [[Klimat równikowy|tropikalne]] [[pająki]].

      Akustyczną formą mimetyzmu jest także naśladowanie głosów, często spotykane
      u [[Ptaki mimetyczne|ptaków mimetycznych]].

      W literaturze i sztuce ''''mimetyzm'''' to naśladowanie lub kopiowanie rzeczywistości
      w dziele sztuki.

