      [[Plik:Vincent Van Gogh 0016.jpg|thumb|[[Vincent van Gogh]]: [[Cyprysy (obrazy
      Vincenta van Gogha)|Cyprysy]], 1889]]

      [[Plik:April 2004 Beeld Scheveningen.JPG|thumb|[[Igor Mitoraj]]: Beeld Scheveningen,
      2004]]

      ''''''Idiom'''''' – zespół cech charakterystycznych dla danej dziedziny sztuki,
      okresu artystycznego lub artysty{{r|Cambridge|Webster|Oxford}}.

      Cechami wyróżniającymi jest zwykle gatunek, rodzaj, forma i tematyka twórczości
      artystycznej, a także stosowane przez twórcę medium artystyczne lub instrument
      oraz sposób jego użycia. Wszystkie te elementy składają się na specyfikę środków
      wyrazu typowych dla danej epoki, kierunku, ruchu artystycznego czy stylu indywidualnego
      artysty{{r|Cambridge|Webster}}.

      Przykładowe użycie określenia „idiom” w sensie artystycznym: „idiom tańca”{{r|idiom
      tańca}}, „idiom religijny”{{r|idiom religijny}}, „idiom malarski”{{r|idiom malarski}},
      „idiom muzyki antycznej”{{r|idiom antyczny}}, „twórczość w idiomie klasycznym”{{r|DM}},
      „w idiomie muzyki jazzowej”{{r|idiom jazzu}}, „własny idiom [[Henri de Toulouse-Lautrec|Toulouse-Lautreca]]”{{r|idiom
      T-L}}, „idiom melodyki [[Fryderyk Chopin|Chopina]]”{{r|idiom Chopina}} itd.

