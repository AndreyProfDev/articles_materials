- sections:
  - content: "[[Plik:Homann Schlaraffenland.jpg|250px|thumb|Parergon na starej mapie\
      \ – ozdobny kartusz]]\n[[Plik:Nigrinus Ducatus Teschinensis Koliba.jpg|thumb|250px|Koliba\
      \ beskidzka – fragment mapy Nigrinusa]]\n[[Plik:Jonas Nigrinus, Ducatus Teschinensis.jpg|thumb|250px|Mapa\
      \ Nigrinusa z beskidzką kolibą (na dole, pośrodku)]]\n[[Plik:Mattheus Seuter,\
      \ Ducatus Teschenensis.jpg|thumb|250px|Mapa Seutera]]\n'''Parerga''' (liczba\
      \ mnoga, jako taka częściej występująca, od słowa '''parergon''' [[język grecki|grec.]]\
      \ πάρεργον) – określenie dzieł ubocznych, mało znanych, pozostających poza głównym\
      \ nurtem twórczej działalności artysty, pisarza, [[kartografia|kartografa]],\
      \ itd. Często bywają to dzieła uzupełniające cudzą twórczość lub świadczące\
      \ o własnych talentach w innej dziedzinie (dziś nazwalibyśmy to wielozawodowością).\n\
      == Parerga Nigrinusa ==\nZ przykładem parergi mamy do czynienia w przypadku\
      \ twórczości [[Jonas Nigrinus|Jonasa Nigrinusa]]. W 1724 roku wydał on w [[Cieszyn]]ie\
      \ mapę [[Księstwo Cieszyńskie|Księstwa Cieszyńskiego]] i przyległych mu ziem.\
      \ Nigrinus na mapie przypisał [[Węgry|Węgrom]] tereny sporne z [[Austria|Austrią]],\
      \ co tak oburzyło władze austriackie, że mapę skonfiskowały i zniszczyły, zaś\
      \ autora zamknięto w więzieniu. Korzystając z jego matrycy, przedruku dokonał\
      \ Ludwik Andrae, jednak i jego kopię spotkał ten sam los. W 1740 roku Mateusz\
      \ Seutter wydał w [[Augsburg]]u kartograficzne dzieło Nigrinusa. Podpisał je\
      \ jako własne, chociaż swoje zmiany ograniczył jedynie do pogrubienia kreski,\
      \ wymiany [[Kartusz (ozdoba)|kartusza]] i paru charakterystycznych ozdobników\
      \ mapy Nigrinusa. Mapa aż do XX wieku, nigdy szerzej nie była znana a i o jej\
      \ węgierskim twórcy mało kto wiedział. \nWśród kolekcjonerów i znawców folkloru\
      \ beskidzkiego od dawna były cenione i kolekcjonowane rysunki ([[miedzioryt]]y)\
      \ przedstawiające różne obiekty regionalne, między innymi szałas beskidzki ([[Koleba|koliba]]).\
      \ Fragmenty na brzegach wskazywały, że to fragment jakieś mapy. Rozpatrywano\
      \ je jednak jako świadectwo beskidzkiego [[folklor]]u. Dopiero poznanie autora\
      \ i całej mapy postawiło sprawę w należytym świetle. Najstarsze rysunki folklorystyczne\
      \ okazały się parergą trudniącego się kartografią Nigrinusa. W [[Czechy|Czechach]]\
      \ wszelkie ozdobniki map, niejako automatycznie, określane są jako parergon\
      \ (zwykle nie używają słowa parerga).\n== Inne zastosowanie słowa parerga ==\n\
      Czasami słowo parerga lub parergon bywa używane jako element tytułu np. [[Richard\
      \ Strauss]] napisał ''Parergon zur Sinfonia Domestica'' Op. 73 na [[fortepian]]\
      \ i orkiestrę. Nazwa może też pełnić funkcję pseudonimu lub nazwiska; [[Sophia\
      \ Loren]] w filmie ''[[Milionerka]]'' grała bohaterkę o imieniu Epifania Parerga.\
      \ W [[Berlin]]ie istnieje oficyna wydawnicza o nazwie Parerga. Najczęściej jednak\
      \ tytuł parerga otrzymują dzieła pośmiertne autora w sytuacji, gdy ten staje\
      \ się sławny. Wówczas jego życie i twórczość poddawane są wnikliwym badaniom,\
      \ podczas których odkrywane są nieznane szczegóły dotyczące biografii i działalności\
      \ twórczej.\n== Zobacz też ==\n* [[Paralipomena]]\n* [[Leonard Pełka]]\n* [[Waldemar\
      \ Osterloff]]\n* [[Jan Michał Rozwadowski]]\n* [[Władysław Tatarkiewicz]]\n\
      == Bibliografia ==\n* {{cytuj pismo |nazwisko = Karger| imię = Wiktor| czasopismo\
