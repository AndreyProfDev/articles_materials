      \ |język = pl}});\n* konserwacja i restauracja rzeźby: drewnianej, polichromowanej\
      \ (niekiedy łączonej z konserwacją malarstwa na podłożach ruchomych{{Cytuj |tytuł\
      \ = Katedra Konserwacji i Restauracji Malarstwa na Podłożach Ruchomych i Rzeźby\
      \ Drewnianej Polichromowanej |data dostępu = 2024-08-22 |opublikowany = Wydział\
      \ Konserwacji i Restauracji Dzieł Sztuki |url = https://wkirds.asp.waw.pl/katedra-konserwacji-i-restauracji-malarstwa-na-podlozach-ruchomych-i-rzezby-drewnianej-polichromowanej/\
      \ |język = pl}}); kamiennej, stiuku i ceramiki (niekiedy obejmującej elementy\
      \ architektury{{Cytuj |tytuł = Katedra Konserwacji i Restauracji Rzeźby i Elementów\
      \ Architektury |data dostępu = 2024-08-22 |opublikowany = Wydział Konserwacji\
      \ i Restauracji Dzieł Sztuki |url = https://wkirds.asp.waw.pl/katedra-konserwacji-i-restauracji-rzezby-i-elementow-architektury/\
      \ |język = pl}});\n* konserwacja i restauracja papieru i skóry: grafiki, starych\
      \ druków, książki;\n* konserwacja i restauracja szkła: witrażu i obiektów szklanych\
      \ (niekiedy łączona z konserwacją ceramiki{{Cytuj |tytuł = Katedra Konserwacji\
      \ i Restauracji Ceramiki i Szkła |data dostępu = 2024-08-22 |opublikowany =\
      \ Akademia Sztuk Pięknych im. Eugeniusza Gepperta we Wrocławiu |url = https://www.asp.wroc.pl/pl/uczelnia/struktura-uczelni/wydzialy-i-jednostki/wydzial-ceramiki-i-szkla/katedra-konserwacji-i\
      \ |język = pl}});\n* konserwacja i restauracja tkanin i ubiorów;\n* konserwacja\
      \ i restauracja rzemiosła artystycznego i sztuki użytkowej;\n* konserwacja i\
      \ restauracja zabytków archeologicznych;\n* konserwacja i restauracja fotografii;\n\
      * konserwacja i restauracja mebla i ram;\n* konserwacja i restauracja metalu;\n\
      * konserwacja i restauracja sztuki nowoczesnej i współczesnej, w tym zajmująca\
      \ się ochroną sztuki efemerycznej{{Cytuj |tytuł = Nie taki konserwator konserwatywny\
      \ – z Zofią Kerneder rozmawia Katarzyna Wincenciak |czasopismo = MOCAK Forum\
      \ |data = 2011 |data dostępu = 2024-08-23 |wolumin = 2 |opublikowany = Muzeum\
      \ Sztuki Współczesnej w Krakowie MOCAK |url = https://www.mocak.pl/nie-taki-konserwator-konserwatywny-z-zofia-kerneder-rozmawia-katarzyna-wincenciak\
      \ |język = pl}}, procesualnej, interaktywnej, cyfrowej, ''time-based media''{{Cytuj\
      \ |autor = Monika Jadzińska |tytuł = Po nas choćby potop”? Zachowanie sztuki\
      \ naszych czasów |czasopismo = Sztuka i Dokumentacja |data = 2011 |data dostępu\
      \ = 2024-08-22 |issn = 2080-413X |wolumin = 5 |wydawca = Stowarzyszenie Sztuka\
      \ i Dokumentacja (SiD) |s = 21–28 |url = https://www.doc.art.pl/pdf_archive/sid_vol_05_jadzinska.pdf\
      \ |język = pl}};\n* konserwacja i restauracja wzornictwa, designu i dziedzictwa\
      \ technicznego;\n* konserwacja i restauracja sztuki ludowej i dziedzictwa etnograficznego;\n\
      * konserwacja prewencyjna (zapobiegawcza, profilaktyczna).\n[[Plik:Restauration\
      \ du patrimoine spécialité mobilier.jpg|mały|Konserwacja mebla przeprowadzana\
      \ w ramach zajęć dydaktycznych [[Narodowy Instytut Dziedzictwa we Francji|Narodowego\
      \ Instytutu Dziedzictwa we Francji]]]]\n=== Działy związane z badaniem i dokumentacją\
      \ dzieł sztuki ===\n* technologia i techniki dzieł sztuki, zajmująca się teoretycznym\
      \ i praktycznym badaniem m.in. technologii i technik malarskich mineralnych\
      \ i organicznych, rzeźbiarskich, szklarskich, fotograficznych;\n* dokumentacja\
      \ konserwatorska;\n* projektowanie konserwatorskie;\n* chemia i fizyka konserwatorska;\n\
      * [[materiałoznawstwo]]{{Cytuj |tytuł = Zakład Materiałoznawstwa oraz Historii\
      \ Technik Dzieł Sztuki |data dostępu = 2024-08-23 |opublikowany = Wydział Konserwacji\
      \ i Restauracji Dzieł Sztuki, Akademia Sztuk Pięknych w Krakowie |url = https://wk.asp.krakow.pl/struktura-organizacyjna/katedra-technologii-i-technik-dziel-sztuki/zaklad-materialoznawstwa-oraz-historii-technik-dziel-sztuki/\
      \ |język = pl}}.\n=== Działy historyczno-teoretyczne ===\n* teoria konserwacji{{Cytuj\
      \ |tytuł = Zakład Historii Sztuki i Teorii Konserwacji |data dostępu = 2024-08-23\
      \ |opublikowany = Wydział Konserwacji i Restauracji Dzieł Sztuki, Akademia Sztuk\
      \ Pięknych w Krakowie |url = https://wk.asp.krakow.pl/struktura-organizacyjna/zaklad-historii-sztuki-i-teorii-konserwacji/\
      \ |język = pl}};\n* etyka konserwatorska;\n* historia doktryn konserwatorskich.\n\
      == Nauczanie konserwacji i restauracji dzieł sztuki na polskich uczelniach państwowych\
      \ ==\nKompleksowe i profesjonalne nauczanie w zakresie konserwacji i restauracji\
      \ dzieł sztuki, łączące zagadnienia teoretyczne i praktyczne, rozpoczęło się\
      \ niedługo po [[II wojna światowa|II wojnie światowej]] w trzech ośrodkach,\
      \ kolejno: [[Kraków|Krakowie]], [[Warszawa|Warszawie]] i [[Toruń|Toruniu]]{{Cytuj\
      \ |autor = Bogusław Krasnowolski |redaktor = Marta Lempart-Geratowska |tytuł\
      \ = Wydział Konserwacji i Restauracji Dzieł Sztuki Akademii Sztuk Pięknych im.\
      \ Jana Matejki w Krakowie 1950-2020: geneza, historia, znaczenie dla ochrony\
      \ dziedzictwa |data = 2021 |data dostępu = 2024-08-04 |isbn = 978-83-66564-26-8\
      \ |miejsce = Kraków |wydawca = Wydawnictwo Akademii Sztuk Pięknych im. Jana\
      \ Matejki w Krakowie |s = 22–33 |język = pl}}{{Cytuj |autor = Maria Dayczak-Domanasiewicz\
      \ |tytuł = Krótki zarys dziejów Wydziału Konserwacji Dzieł Sztuki Akademii Sztuk\
      \ Pięknych w Krakowie (1950-1990) |czasopismo = Ochrona Zabytków |data = 1990\
      \ |data dostępu = 2024-08-04 |issn = 0029-8247 |wolumin = 43 |numer = 4 |s =\
      \ 174–189 |url = https://cejsh.icm.edu.pl/cejsh/element/bwmeta1.element.desklight-f384c32c-cc9b-4f60-8ddd-88197839d60b\
      \ |język = pl}}. W 2023 r. do tej listy dołączył [[Wrocław]].\n=== Kraków ===\n\
      [[Plik:Faculty of Conservation and Restoration of Works of Art, 27-29 Lea street,\
      \ Krakow, Poland, 24-03-07 3.jpg|alt=Główny budynek Wydziału Konserwacji i Restauracji\
      \ Dzieł Sztuki Akademii Sztuk Pięknych im. Jana Matejki w Krakowie, ul. J. Lea\
      \ 27-29.|mały|Główny budynek Wydziału Konserwacji i Restauracji Dzieł Sztuki\
      \ Akademii Sztuk Pięknych im. Jana Matejki w Krakowie, ul. J. Lea 27-29]]\n\
      14 września 1947 r. w [[Państwowa Wyższa Szkoła Sztuk Plastycznych w Krakowie|Państwowej\
      \ Wyższej Szkole Sztuk Plastycznych w Krakowie]] utworzono Studium Konserwacji\
      \ Malarstwa i Rzeźby, które w 1949 r. przekształcono w Wydział Konserwacji Malarstwa\
      \ i Rzeźby{{Cytuj |autor = Władysław Ślesiński |tytuł = Szkolnictwo konserwatorskie\
      \ w Polsce: dorobek, stan obecny, kierunki rozwoju |czasopismo = Ochrona Zabytków\
      \ |data = 1982 |data dostępu = 2024-08-04 |issn = 0029-8247 |wolumin = 35 |numer\
      \ = 3–4 |s = 163–169 |url = https://bazhum.muzhp.pl/media//files/Ochrona_Zabytkow/Ochrona_Zabytkow-r1982-t35-n3_4_(138_139)/Ochrona_Zabytkow-r1982-t35-n3_4_(138_139)-s163-169/Ochrona_Zabytkow-r1982-t35-n3_4_(138_139)-s163-169.pdf}}.\
      \ 1 września 1950 r. połączono [[Państwowej Wyższej Szkoły Sztuk Plastycznych|Państwową\
      \ Wyższą Szkołę Sztuk Plastycznych w Krakowie]] i Akademię Sztuk Pięknych w\
      \ Krakowie pod nazwą [[Akademia Sztuk Pięknych im. Jana Matejki w Krakowie|Akademia\
      \ Sztuk Pięknych w Krakowie]]Rozporządzenie Rady Ministrów z dnia 11 sierpnia\
      \ 1950 r. w sprawie utworzenia Akademii Sztuk Plastycznych w Krakowie ({{Dziennik\
      \ Ustaw|1950|39|355}}).. Z połączenia Wydziału Konserwacji Malarstwa i Rzeźby\
      \ PWSSP oraz Katedry Technologii i Technik Malarskich ASP (utworzonej w 1948\
      \ r. z Zakładu Technologii i Technik Malarskich powołanego w 1935 r.) powstał\
      \ Wydział Konserwacji. Jednostka ta w latach 1957–1965 funkcjonowała jako samodzielne\
      \ Studium Konserwacji Dzieł Sztuki, później stanowiące część Wydziału Malarstwa\
      \ i Grafiki (1965–1969) i Wydziału Malarstwa (1969–1971). W 1972 r., decyzją\
      \ Ministerstwa Kultury i Sztuki jednostka ponownie uzyskała status wydziału\
      \ (Konserwacji Dzieł Sztuki), a od 23 marca 1993 nosi nazwę [[Wydział Konserwacji\
      \ i Restauracji Dzieł Sztuki Akademii Sztuk Pięknych im. Jana Matejki w Krakowie|Wydziału\
      \ Konserwacji i Restauracji Dzieł Sztuki]]{{Cytuj |autor = Bogusław Krasnowolski\
      \ |redaktor = Marta Lempart-Geratowska |tytuł = Wydział Konserwacji i Restauracji\
      \ Dzieł Sztuki Akademii Sztuk Pięknych im. Jana Matejki w Krakowie 1950-2020:\
      \ geneza, historia, znaczenie dla ochrony dziedzictwa |data = 2021 |data dostępu\
      \ = 2024-08-04 |isbn = 978-83-66564-26-8 |miejsce = Kraków |wydawca = Wydawnictwo\
      \ Akademii Sztuk Pięknych im. Jana Matejki w Krakowie |s = 209 |język = pl}}.\n\
      === Warszawa ===\n4 października 1947 r. na [[Akademia Sztuk Pięknych w Warszawie|Akademii\
      \ Sztuk Pięknych w Warszawie]] utworzono Studium Konserwacji Malarstwa, które\
      \ 1 września 1950 r., po połączeniu z [[Państwowej Wyższej Szkoły Sztuk Plastycznych\
      \ w Warszawie|Państwową Wyższą Szkołą Sztuk Plastycznych w Warszawie]], przekształcono\
      \ w Wydział Konserwacji. Od 1952 r. jednostka funkcjonowała jako Studium Konserwatorskie\
      \ przy Wydziale Malarstwa, by w 1964 r. stała się Katedrą Konserwacji na tymże\
      \ Wydziale. W 1972 r. na mocy decyzji Ministerstwa Kultury i Sztuki powołano\
      \ Wydział Konserwacji Dzieł Sztuki.\n=== Toruń ===\nW 1945 r. na Wydziale Sztuk\
      \ Pięknych [[Uniwersytet Mikołaja Kopernika w Toruniu|Uniwersytetu Mikołaja\
      \ Kopernika w Toruniu]] utworzono Katedrę Zabytkoznawstwa i Konserwatorstwa,\
      \ zajmującą się opieką nad zabytkami wyłącznie w ujęciu teoretycznym. W 1947\
      \ r. w ramach Studium Zabytkoznawstwa i Konserwatorstwa powołano Pracownię,\
      \ a w 1952 r. Katedrę Technologii i Technik Malarskich. 6 sierpnia 1969 r. na\
      \ Wydziale Sztuk Pięknych powstał [[Instytut]] Zabytkoznawstwa i Konserwatorstwa.\
      \ Od 2019 r. struktura Wydziału Sztuk Pięknych oparta jest na [[Katedra (jednostka\
      \ organizacyjna)|katedrach]], w tym zajmujących się konserwacją i restauracją\
      \ dzieł sztuki{{Cytuj |tytuł = O Wydziale |data dostępu = 2024-08-04 |opublikowany\
      \ = Wydział Sztuk Pięknych – Uniwersytet Mikołaja Kopernika w Toruniu |url =\
      \ https://art.umk.pl/wydzial/o-nas/ |archiwum = https://web.archive.org/web/20240304112946/https://art.umk.pl/wydzial/o-nas/\
      \ |zarchiwizowano = 2024-08-04 |język = pl}}.\n=== Wrocław ===\nW 2023 r. na\
      \ [[Wydział Ceramiki i Szkła Akademii Sztuk Pięknych im. Eugeniusza Gepperta\
      \ we Wrocławiu|Wydziale Ceramiki i Szkła]] [[Akademia Sztuk Pięknych im. Eugeniusza\
      \ Gepperta we Wrocławiu|Akademii Sztuk Pięknych im. Eugeniusza Gepperta we Wrocławiu]]\
      \ otwarto kierunek „konserwacja i restauracja dzieł sztuki” w zakresie specjalizacji\
      \ „konserwacja i restauracja ceramiki i szkła”{{Cytuj |tytuł = Katedra Konserwacji\
      \ i Restauracji Ceramiki i Szkła |data dostępu = 2024-08-04 |opublikowany =\
      \ Akademia Sztuk Pięknych im. Eugeniusza Gepperta we Wrocławiu |url = https://www.asp.wroc.pl/pl/uczelnia/struktura-uczelni/wydzialy-i-jednostki/wydzial-ceramiki-i-szkla/katedra-konserwacji-i\
      \ |język = pl}}.\n=== Wydziały polskich uczelni państwowych prowadzące studia\
      \ w zakresie konserwacji i restauracji dzieł sztuki ===\n[[Wydział Konserwacji\
      \ i Restauracji Dzieł Sztuki Akademii Sztuk Pięknych im. Jana Matejki w Krakowie]]\n\
      * kierunek „konserwacja i restauracja dzieł sztuki”, studia jednolite magisterskie\
