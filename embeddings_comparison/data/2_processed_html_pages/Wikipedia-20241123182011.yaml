  - content: "{{Stowarzyszenie infobox\n |nazwa = Instytut Propagandy Sztuki\nIPS\n\
      \ |nazwa oryginalna = \n |grafika = Instytut Propagandy Sztuki - wejście główne\
      \ (1933).jpg\n |opis grafiki = Gmach Instytutu Propagandy Sztuki w czasie Międzynarodowej\
      \ Wystawy Drzeworytu (1933)\n |motto =\n |państwo = Polska\n |siedziba = [[Warszawa]]\n\
      \ |data założenia = 1930\n |zakończenie działalności = 1939 \n |rodzaj stowarzyszenia\
      \ = [[instytucja kultury]]\n |status = historyczny\n |profil działalności =\
      \ \n |zasięg = [[II Rzeczpospolita|Rzeczpospolita Polska]]\n |stanowisko zarządzającego\
      \ = Prezes Rady IPS\n |zarządzający = \n |członkowie =\n |numer rejestru =\n\
      \ |data rejestracji =\n |powiązania =\n |współrzędne = \n |commons = Category:Instytut\
      \ Propagandy Sztuki\n |www =\n |wariant flagi = \n |kod mapy = \n |wariant mapy\
      \ = \n |opis miejsca = \n}}\n'''Instytut Propagandy Sztuki''' (IPS) – [[instytucja\
      \ kultury]] działająca w latach 1930–1939 w Warszawie, utworzona z inicjatywy\
      \ artystów i historyków sztuki w celu propagowania polskiej [[sztuka nowoczesna|sztuki\
      \ nowoczesnej]].\n \n== Historia i profil ==\nPierwsza siedziba IPS mieściła\
      \ się w [[Kamienica Baryczkowska w Warszawie|kamienicy Baryczków]] na [[Rynek\
      \ Starego Miasta w Warszawie|Rynku Starego Miasta]]{{Cytuj książkę | nazwisko\
      \ = Drozdowski | imię = Marek Marian | tytuł = Warszawiacy i ich miasto w latach\
      \ Drugiej Rzeczypospolitej | wydawca = Państwowe Wydawnictwo „Wiedza Powszechna”\
      \ | miejsce = Warszawa | data = 1973 | strony = 226}}. W grudniu 1931 otwarto\
      \ nowo wybudowany pawilon Instytutu przy ul. [[Ulica Królewska w Warszawie|Królewskiej]]\
      \ 13.\nInstytut stanowił w momencie powołania opozycję wobec konserwatywnego\
      \ [[Towarzystwo Zachęty Sztuk Pięknych|Towarzystwa Zachęty Sztuk Pięknych]].\
      \ Profil IPS zmienił się nieco w drugiej połowie [[Lata 30. XX wieku|lat 30.]],\
      \ kiedy obok działalności czysto wystawienniczej (organizacja tzw. Salonów IPS)\
      \ zaczęto prowadzić również prace o charakterze naukowym, popularyzatorskim\
      \ oraz dokumentacyjnym. Współzałożycielami i kolejnymi kierownikami Rady IPS\
      \ byli: [[Władysław Skoczylas]] (1930), [[Wojciech Jastrzębowski (artysta)|Wojciech\
      \ Jastrzębowski]] (1931), [[Karol Stryjeński]] (1932), [[Bohdan Pniewski]] (1934–1935)\
      \ i [[Juliusz Starzyński]] (1935–1939){{Cytuj stronę |url = https://rcin.org.pl/Content/59589/WA303_79191_B155-Polska-T-4-1999_Chmielewska.pdf\
      \ |tytuł = Idee środowiska przedwojennej ASP w Warszawie wobec propozycji socrealizmu\
      \ |opublikowany = rcin.org.pl |język = pl |data dostępu = 2024-04-07}}. Współtwórcami\
      \ IPS byli również historyk sztuki i muzealnik [[Mieczysław Treter]] oraz popularyzator\
      \ i krytyk sztuki [[Jerzy Warchałowski (architekt)|Jerzy Warchałowski]].\n[[Plik:Kawiarnia\
      \ IPS w Warszawie.jpg|mały|left|Grupa malarzy w kawiarni IPS, 1933. Od lewej:\
      \ [[Alfred Terlecki]], [[Ludomir Janowski]], [[Henryk Nowina-Czerny|Henryk-Nowina\
      \ Czerny]], [[Edward Czerwiński]], [[Aleksander Rafałowski]] i [[Maciej Nehring]]]]\n\
      [[Plik:Nike - vol. 1 (1939).jpg|thumb|240px|Okładka kwartalnika „Nike” (nr 1/1939)\
      \ wydawanego przez IPS]]\nInstytut pełnił również w przedwojennej Warszawie\
      \ funkcję towarzyską. W pawilonie wystawienniczym IPS, z inicjatywy [[Stanisław\
      \ Rzecki|Stanisława Rzeckiego]], utworzono kawiarnię, która stała się z czasem\
      \ jednym z bardziej popularnych przez artystów – malarzy i poetów – lokali warszawskich.\
      \ Od 1937 IPS wydawał kwartalnik „Nike”, redagowany przez Juliusza Starzyńskiego.\
      \ Opracowanie graficzne czasopisma było dziełem [[Stanisław Ostoja-Chrostowski|Stanisława\
      \ Ostoi-Chrostowskiego]].\nDo tradycji naukowej IPS odwołuje się [[Instytut\
      \ Sztuki Polskiej Akademii Nauk]]. Obiema tymi placówkami kierował Juliusz Starzyński.\n\
      == Budynek ==\nObszerny budynek parterowy został zaprojektowany przez Karola\
      \ Stryjeńskiego{{Cytuj stronę |url = https://www.warszawa1939.pl/obiekt/krolewska-13\
      \ |tytuł = Instytut Propagandy Sztuki |opublikowany = warszawa1939.pl |język\
      \ = pl |data dostępu = 2024-02-28}} jako siedziba i pawilon wystawowy dla Instytutu\
      \ Propagandy Sztuki. Do użytku oddano go w grudniu 1931. W gmachu mieściła się\
      \ także kawiarnia oraz redakcja tygodnika „[[Wiadomości Literackie]]”. \nW 1935\
      \ fragment budynku ogarnął pożar{{r|wa}}. Prawdopodobnie jego skutkiem była\
      \ rezygnacja z części witryn po prawej stronie wejścia głównego i przebudowa\
      \ ich w przeciętnej wielkości okna. W okresie [[Okupacja niemiecka ziem polskich\
      \ (1939–1945)|okupacji niemieckiej]] pawilon pełnił funkcję gospody dla żołnierzy\
      \ wrogich armii{{r|wa}}. Uniknął zniszczenia w [[Powstanie warszawskie|powstaniu\
      \ warszawskim]] i podczas późniejszego wyburzania Warszawy przez Niemców. Został\
      \ jedynie nieznacznie uszkodzony przez pociski. Ucierpiał także fragment budynku,\
      \ sąsiadujący z [[Pałac Kronenberga w Warszawie|Pałacem Kronenberga]]. Latem\
      \ 1946 rozpoczął się remont gmachu z przeznaczeniem na Teatr Muzyczny Domu Żołnierza.\
      \ Prace zakończyły się w lutym 1947. W 1955 pawilon stał się siedzibą [[Teatr\
      \ Żydowski w Warszawie|Teatru Żydowskiego]], który mieścił się w nim do 1970.\
      \ Niedługo potem zaczęły się prace rozbiórkowe pod najbardziej luksusowy wówczas\
      \ hotel Warszawy – „[[Sofitel Warsaw Victoria|Victorię]]”.\n== Przypisy ==\n\
      {{Przypisy}}\n== Bibliografia ==\n* {{Cytuj stronę | url = http://www.warszawawelecka.pl/instytucje/show/id/1\
      \ | tytuł = Informacja na stronie Warszawa Welecka | opublikowany = warszawawelecka.pl\
      \ | archiwum = https://web.archive.org/web/20131102034119/http://www.warszawawelecka.pl/instytucje/show/id/1\
      \ | zarchiwizowano = 2013-11-02}}\n* [http://www.ispan.pl/pl/biblioteka/informacje-ogolne\
      \ Instytut Sztuki]\n* [https://rcin.org.pl/Content/59589/WA303_79191_B155-Polska-T-4-1999_Chmielewska.pdf\
      \ Agnieszka Chmielewska, ''Otworzyły się nowe możliwości... – Idee środowiska\
      \ przedwojennej ASP w Warszawie wobec propozycji socrealizmu''], rcin.org.pl\n\
      {{Kontrola autorytatywna}}\n[[Kategoria:Historia Warszawy (II Rzeczpospolita)]]\n\
      [[Kategoria:Kawiarnie w Warszawie]]\n[[Kategoria:Kultura w Warszawie]]\n[[Kategoria:Organizacje\
      \ społeczne II Rzeczypospolitej]]\n[[Kategoria:Polskie instytucje kultury]]\n\
