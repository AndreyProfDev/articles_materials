      ''''''Dekadencja'''''' (''''decadence'''' – [[Język francuski|fr.]] z [[Łacina|łac.]]
      ''''decadentia'''' – odpadnięcie, odstąpienie, zmarnienie) – rozkład wartości
      kulturowych, społecznych; chylenie się ku upadkowi; kryzys lub schyłek (literatury,
      sztuki itp.)''''Słownik wyrazów obcych PWN'''', Warszawa 1980, s. 138..

      == Dekadencja w literaturze ==

      Pojęcie dekadencji jest używane jako synonim [[dekadentyzm]]u. Był to kierunek
      w literaturze francuskiej, którego nazwa pochodziła od tytułu czasopisma ''''Decadent'''',
      ukazującego się w 1886 roku. Pierwotnie słowo „dekadencja” było stosowane przez
      krytyków jako negatywna ocena czyjegoś dorobku pisarskiego. Użył go [[Désiré
      Nisard]] do opisu literatury rzymskiej w swoim zbiorze ''''Études de moeurs
      et de critique sur les poètes latins de la décadence'''' (1834)H. Markiewicz,
      A. Romanowski, „Skrzydlate słowa”, Warszawa 1990, s. 753.. Podchwycili ten termin
      literaci francuscy z przełomu XIX i XX w., a rozpropagowali go [[Théophile Gautier]],
      [[Jules Laforgue]] oraz [[Charles Baudelaire]].

      Podkreślano tym samym przekonanie o kryzysie i upadku cywilizacji europejskiej,
      poczucie pesymizmu, zwracając się ku indywidualizmowi oraz estetyzmowi. Za typową
      powieść „dekadencji” traktuje się ''''[[Na wspak]]'''' (''''A rebours'''') [[Joris-Karl
      Huysmans|Huysmansa]]. Historycznie sytuuje się dekadentyzm między [[romantyzm]]em
      a [[modernizm (literatura)|modernizmem]]{{Cytuj |url = http://mloda-polska.klp.pl/a-8453.html
      |tytuł = Dekadentyzm<!-- Tytuł wygenerowany przez bota --> |opublikowany = mloda-polska.klp.pl
      |data dostępu = 2017-11-22}}.

      == Znaczenie w [[leninizm]]ie ==

      [[Włodzimierz Lenin]] kontynuował i rozszerzył znaczenie określenia ''''dekadencja''''
      w swej teorii [[imperializm]]u jako ekonomiczna motywacja poczynań politycznych.

      Według Lenina, [[kapitalizm]] znajduje się w swej schyłkowej fazie i nie jest
      już więcej w stanie przyczynić się do dalszego rozwoju społeczeństwa. Ponieważ
      społeczeństwo na zachodzie dojrzało do [[rewolucja|rewolucji]] socjalistycznej,
      oczekiwał on upadku impetu w aktywności gospodarczej i nasilenia niezdrowych
      zjawisk ekonomicznych. Według Lenina, [[I wojna światowa]] miała stanowić dowód
      politycznej dekadencji rozwiniętych państw kapitalistycznych, w której zamiast
      rozwijać się niweczą one owoce własnych osiągnięć.

      [[Trockizm|Trockiści]] byli podzieleni co do zasadności tez Lenina w obliczu
      propagowanej przez nich tezy o nieustannej rewolucji. Natomiast [[stalinizm|staliniści]]
      w zasadzie bronili tezy teorii imperializmu Lenina o ''''dekadencji'''' w dyskursie
      z trockistami. Trockiści zwykle podkreślają, że kapitalizm na zachodzie nadal
      jest postępowy i maszeruje w kierunku rozwoju technicznego, akumulując wciąż
      coraz więcej dóbr. Natomiast zwolennicy Lenina, między innymi [[Józef Stalin|Stalin]]
      i [[Mao Zedong|Mao]], twierdzili, że nic więcej już nie pozostało [[imperializm]]owi
      jak tylko wymrzeć, albowiem nie jest on już więcej w stanie wnieść niczego postępowego.

