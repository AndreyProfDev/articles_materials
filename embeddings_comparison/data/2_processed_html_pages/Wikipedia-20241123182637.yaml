- sections:
  - content: "'''Ocena technologii''' ([[Język angielski|ang.]] ''Technology assessment'',\
      \ TA) – analiza konsekwencji rozwijania i stosowania określonych [[Technologia|technologii]],\
      \ która jako narzędzie dostarczania wiedzy wspiera procesy decyzyjne, a tym\
      \ samym pomaga w podejmowaniu decyzji politycznych{{Cytuj pismo | autor = Gwiazdowicz\
      \ M, Stankiewicz P, (red.) | tytuł = Problematyka oceny technologii | czasopismo\
      \ = Studia BAS | strony = 5 | issn = 2082-0658 | url = http://orka.sejm.gov.pl/WydBAS.nsf/0/28D630A33D4B3409C1257F0000442B87/$file/Studia_BAS_43.pdf}}.\n\
      ==Założenia==\nOcena technologii ma być systematyczną i wieloaspektową ewaluacją\
      \ [[Technika|technik]] już istniejących, jak również tych planowanych czy postulowanych\
      \ oraz ich skutków bezpośrednich i kumulatywnych w różnych obszarach życia –\
      \ od środowiska przyrodniczego do struktur społecznych i politycznych. Wychodzi\
      \ ona z założenia, że technika stanowi współcześnie kluczowy składnik naturalnego\
      \ środowiska ludzkiego życia i działania. Wdrożenie określonego elementu techniki\
      \ ułatwia lub utrudnia pewne działania, wzmacnia lub zmniejsza ich skutki, umożliwia\
      \ działania dotąd niemożliwe, przekształca [[Stosunek społeczny|stosunki społeczne]]\
      \ i wyznacza relacje [[Władza|władzy]], buduje ramy odniesienia dla rozumienia\
      \ rzeczywistości i współdeterminuje znaczenie rozmaitych pojęć. W konsekwencji\
      \ współczesna technika oddziałuje na różne sfery codziennego życia, kształtując\
      \ zachowania indywidualne i [[relacje interpersonalne]]. Zatem rozwijanie nowych\
      \ technologii ma skutki zarówno techniczne, jak i [[Ekonomia|ekonomiczne]],\
      \ [[Polityka|polityczne]] i [[Moralność|moralne]], a odpowiedzialność za nie\
      \ ciąży nie tylko na jej użytkownikach, ale także na projektantach, producentach,\
      \ sprzedawcach i popularyzatorach{{Cytuj stronę | url = http://ptot.pl/#assesment\
      \ | tytuł = Polskie Towarzystwo Oceny Technologii - Deklaracja ideowa | data\
      \ dostępu = 2018-10-24}}. \nPoczątki oceny technologii sięgają lat 70. XX w.,\
      \ gdy przy [[Kongres Stanów Zjednoczonych|Kongresie Stanów Zjednoczonych]] powstało\
      \ Biuro Oceny Technologii, które stało się pierwowzorem dla podobnych instytucji\
      \ w [[Europa|Europie]]. Miało ono dokonywać możliwie wszechstronnej oceny skutków\
      \ stosowania lub rozwijania określonych technologii (bądź też powstrzymania\
      \ się od ich wykorzystywania), a wiedza ta miała umożliwiać [[decydent]]om politycznym\
      \ podejmowanie odpowiednich decyzji. Była to odpowiedź na pojawiające się w\
      \ II poł. XX w. technologie uznawane za ryzykowne lub wręcz niebezpieczne (m.in.\
      \ [[Energetyka jądrowa|technologie jądrowe]], [[Biotechnologia|biotechnologie]],\
      \ [[Nanotechnologia|nanotechnologie]]). Okazało się, że innowacje technologiczne\
      \ obarczone są ryzykiem występowania skutków ubocznych oraz trudnych do przewidzenia\
      \ konsekwencji, prowadząc do [[Konflikt społeczny|konfliktów społecznych]] wokół\
      \ takich rozwiązań, jak: [[Organizm zmodyfikowany genetycznie|genetycznie modyfikowana\
      \ żywność]], budowa masztów [[Telefonia komórkowa|telefonii komórkowej]] czy\
      \ budowa [[Elektrownia jądrowa|elektrowni jądrowych]]. W zamierzeniu TA ma pełnić\
      \ przede wszystkim rolę „systemu wczesnego ostrzegania” i rozpoznawać z wyprzedzeniem\
      \ szanse i ryzyko związane z daną technologią, tak by można było zawczasu ocenić\
      \ zasadność jej wdrażania{{Cytuj pismo | nazwisko = Stankiewicz | imię = Piotr\
      \ | tytuł = Teoria i praktyka oceny technologii | czasopismo = [[Infos]] | wolumin\
      \ = 22(92) | data = 14 grudnia 2010 | url = http://orka.sejm.gov.pl/WydBAS.nsf/0/AB4C0592F1010EE2C12578DC00310B38/$file/Infos_92.pdf}}.\n\
      ==Metodologia==\nNie istnieją ani specyficzne metody dla oceny technologii,\
      \ ani jednolite wzorce ekspertyz z tego obszaru. Dobór metod zależy w dużej\
      \ mierze od konkretnego przedmiotu badania i jego zakresu. Prowizoryczną typologię\
      \ metod i procedur nadających się do wykorzystania w projektach z zakresu oceny\
      \ technologii można sformułować następująco:\n* pod względem przeznaczenia metody\
      \ można podzielić na: \n** strukturalizujące (m.in. [[teoria systemów]] i [[analiza\
      \ systemowa]], [[analiza ryzyka]], [[Przepływy międzygałęziowe|analiza przepływów]],\
      \ analiza oddziaływań, ekobilans, analiza wejście-wyjście, analizy łańcuchów\
      \ procesowych), \n** pozyskiwania [[Dane|danych]] (m.in. metody oparte na danych\
      \ pierwotnych oraz metody oparte na danych wtórnych, takie jak [[Kwerenda|kwerendy]],\
      \ analizy dokumentów, wywiady z ekspertami, [[Baza danych|systemy bazodanowe]]),\
      \ \n** [[Heurystyka (zarządzanie)|heurystyczne]] (m.in. [[burza mózgów]] i sesje\
      \ pomysłowości, matryce morfologiczne, [[Proces twórczy w projektowaniu|metody\
      \ synektyczne]], [[Wywiad (metoda badawcza)|wywiady]] z ekspertami, [[Metoda\
      \ delficka|metody delfickie]], metody wpływów krzyżowych),\n** [[Futurologia|prognostyczne]]\
      \ (m.in. metody ekstrapolacyjne, modelowanie i metody symulacyjne, metody analogiczne\
      \ oraz [[Metoda scenariuszowa|metody scenariuszowe]]),\n** [[Ewaluacja|ewaluacyjne]]\
      \ (m.in. wartościowanie socjoetyczne i rachunek [[Utylitaryzm|utylitarystyczny]],\
      \ analiza [[Użyteczność (ekonomia)|użyteczności]], [[analiza kosztów i korzyści]],\
      \ analiza opłacalności, analiza istotności, [[Drzewo decyzyjne|analiza drzewa\
      \ wartości]], analiza i rekonstrukcja dyskursu, procedury partycypacyjne);\n\
      * ze względu na rodowód można wyróżnić: \n** metody zorientowane technologicznie\
      \ (m.in. szacowanie ryzyka i metoda [[Wartość graniczna|wartości granicznych]],\
      \ metoda rekonstrukcji preferencji ujawnionych, metoda analizy preferencji wyrażonych),\n\
      ** metody wywodzące się z ekonomii (m.in. [[Ekonomia dobrobytu|teorie dobrobytu]],\
      \ [[teoria wyboru publicznego]], [[Użyteczność krańcowa|analiza marginalna]],\
      \ metody wskaźnikowe wykorzystujące wskaźniki społeczne), \n** metody zorientowane\
      \ politycznie (m.in. teorie wyboru, procedury [[Referendum|plebiscytowe]], [[Partycypacja|procedury\
      \ partycypacyjne]], takie jak [[mediacje]], publiforum, jury obywatelskie, [[Dyskusja\
      \ panelowa|panel laików]], [[Konferencja naukowa|konferencja uzgodnieniowa (konsensualna)]],\
      \ publifocus, komórka planowania, warsztaty przyszłości, dyskurs kooperacyjny,\
      \ metoda borykania się, metoda skanowania mieszanego), \n** systematyczne metody\
      \ bilansowe (m.in. analiza kosztów-korzyści, analiza korzyści i [[Analiza ryzyka|ryzyka]],\
      \ metody wieloatrybutowego podejmowania decyzji), \n** modele planistyczne (np.\
      \ PPBS, ''Planning, Programming, and Budgeting System''),\n** metody wywodzące\
      \ się z [[Teoria systemów|teorii systemów]] i analizy systemowej (m.in. metody\
      \ scenariuszowe, analiza współzależności, koncepcje [[Hierarchia potrzeb|potrzeb\
      \ podstawowych]]){{Cytuj pismo | nazwisko = Michalski | imię = Krzysztof | tytuł\
      \ = Problemy metodologiczne w zarządzaniu projektami z zakresu oceny technologii\
      \ | czasopismo = Modern Management Review | wydanie = 22 (3/2015) | wolumin\
      \ = XX | strony = 113-131 | data = July-September 2015}}.\n==Przykładowe instytucje\
      \ oceny technologii w świecie==\n* European Parliamentary Technology Assessment\
      \ (EPTA){{Cytuj stronę | url = https://eptanetwork.org/ | tytuł = Strona internetowa\
      \ EPTA | język = en | data dostępu = 2018-11-16}} – [[Unia Europejska]]\n* Parliamentary\
      \ Office of Science and Technology (POST){{Cytuj stronę | url = https://www.parliament.uk/mps-lords-and-offices/offices/bicameral/post/\
      \ | tytuł = POST na stronach Parlamentu Wielkiej Brytanii | język = en | data\
      \ dostępu = 2018-11-16}} – [[Wielka Brytania]]\n* Institute for Technology Assessment\
      \ and Systems Analysis (ITAS){{Cytuj stronę | url = http://www.itas.kit.edu/english/\
      \ | tytuł = Strona interentowa ITAS | język = en | data dostępu = 2018-11-16}}\
      \ – [[Niemcy]]\n* Centre for Technology Assessment (TA-SWISS){{Cytuj stronę\
      \ | url = https://www.ta-swiss.ch/en/ | tytuł = Strona internetowa TA-SWISS\
      \ | język = en | data dostępu = 2018-11-16}} – [[Szwajcaria]]\n== Przypisy ==\n\
      {{Przypisy}}\n==Linki zewnętrzne==\n* [http://www.eptanetwork.org/ Strona EPTA\
      \ (ang)]\n* [http://ptot.pl/ Strona Polskiego Towarzystwa Oceny Technologii]\n\
      * [http://orka.sejm.gov.pl/WydBAS.nsf/0/28D630A33D4B3409C1257F0000442B87/$file/Studia_BAS_43.pdf\
      \ ''Technology Assessment. Problematyka oceny technologii''], „[[Studia BAS]]“,\
      \ nr 3(43) 2015\n{{Kontrola autorytatywna}}\n[[Kategoria:Teoria decyzji]]\n\
      [[Kategoria:Technika]]"
