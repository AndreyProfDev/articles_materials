  - content: '''''''Starzenie moralne'''''' – związany z szybkimi zmianami [[technologia|technologicznymi]]
      proces (zwłaszcza w [[elektronika|elektronice]] i [[Informatyka|informatyce]]),
      w wyniku którego w pełni sprawny wedle specyfikacji sprzęt lub [[oprogramowanie]]
      nie spełnia już bieżących [[standard|standardów]] użytkowania{{Cytuj |autor
      = Stanisław Legutko |tytuł = Podstawy eksploatacji maszyn i urządzeń |data =
      2004 |data dostępu = 2020-11-24 |isbn = 83-02-08998-2 |miejsce = Warszawa |wydawca
      = WSiP |s = 10 |oclc = 749256149}}.

      Przykładem starzenia moralnego jest [[system operacyjny]] [[DOS]], zastąpiony
      obecnie na rynku przez [[Microsoft Windows|MS Windows]]. Innym przykładem jest
      [[magnetofon szpulowy]], wyparty najpierw przez [[magnetofon kasetowy]], a współcześnie
      przez techniki nagrywania na nośnikach cyfrowych, np. na [[dysk optyczny|dyskach
      optycznych]], również zastępowanych przez odtwarzacze wykorzystujące [[pamięć
      flash]]{{Cytuj |autor = Michalina Halik |tytuł = Procesy starzenia się w informatyce
      |data = |data dostępu = 2020-11-24 |url = http://logic.amu.edu.pl/images/a/a7/Inf8a.pdf}}.

      W przypadku budynków mówimy o [[Zużycie funkcjonalne budynków|zużyciu moralnym
      lub funkcjonalnym]]{{Cytuj |autor = Beata Nowogońska |tytuł = Trwałość techniczna
      a trwałość moralna obiektów budowlanych |data = |data dostępu = 2020-11-24 |url
      = https://repozytorium.biblos.pk.edu.pl/redo/resources/32418/file/suwFiles/NowogonskaB_TrwaloscTechniczna.pdf}}.

