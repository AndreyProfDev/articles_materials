- sections:
  - content: "{{dopracować|źródła=2021-04}}\n[[Plik:Technologie.jpg|mały|Wynalazki\
      \ techniczne (od góry): po lewej mikrometr i kolej magnetyczna Maglev, po prawej\
      \ turbina parowa i ramię pedału rowerowego]]\n'''Technika''' ({{greka|τέχνη}},\
      \ ''technē'' „sztuka, rzemiosło, kunszt, umiejętność”) – wytwarzanie zjawisk\
      \ i przedmiotów niewystępujących naturalnie w przyrodzie{{Encyklopedia PWN |\
      \ id = 3985955 | tytuł = technika | data dostępu = 2023-03-19 }}. Pojęcie techniki\
      \ bywa potocznie utożsamiane z [[technologia|technologią]], czyli wiedzą o wytwarzaniu\
      \ za pomocą środków technicznych.\nSłowo „technika” określa też same urządzenia\
      \ techniczne, a także sposób wykonywania określonych czynności (na przykład\
      \ technika gry na skrzypcach, technika malowania obrazów, technika walki zapaśniczej).\
      \ \nDziałalnością badawczą w dziedzinie techniki zajmują się [[nauki techniczne]]\
      \ i [[inżynieria]]. Tak zdefiniowana technika stanowi zasadniczy składnik cywilizacji.\n\
      Niektóre nauki i działalności w dziedzinie techniki:\n* [[akustyka]]\n* [[architektura]]\
      \ i [[urbanistyka]]\n* [[automatyka]] i [[robotyka]]\n* [[biocybernetyka]] i\
      \ [[inżynieria biomedyczna]]\n* [[budownictwo]]\n* [[elektronika]]\n* [[elektrotechnika]]\n\
      * [[energetyka]], w tym [[energetyka jądrowa]]\n* [[geodezja]] i [[kartografia]]\n\
      * [[informatyka]]\n* [[inżynieria materiałowa]]\n* [[technologia chemiczna i\
      \ inżynieria procesowa|inżynieria procesowa]]\n* [[inżynieria środowiska]]\n\
      * [[maszynoznawstwo]]\n* [[materiałoznawstwo]]\n* [[mechanika]]\n* [[metalurgia]]\n\
      * [[okrętownictwo]]\n* [[poligrafia]]\n* [[pożarnictwo]]\n* [[telekomunikacja]]\n\
      * [[transport]]\n== Zobacz też ==\n{{Wikicytaty|o technice}}\n{{Wikisłownik|technika}}\n\
      * [[historia techniki]]\n== Przypisy ==\n{{Przypisy}}\n{{Kontrola autorytatywna}}\n\
