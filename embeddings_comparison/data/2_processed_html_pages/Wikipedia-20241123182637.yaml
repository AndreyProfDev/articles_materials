      ''''''Infrastruktura techniczna'''''' – urządzenia, sieci przesyłowe i związane
      z nimi obiekty świadczące niezbędne usługi dla danej jednostki przestrzenno-gospodarczej
      (osiedla, dzielnicy, miasta, zakładu przemysłowego) w zakresie [[energetyka|energetyki]],
      dostarczania ciepła, wody, usuwania ścieków i odpadów, transportu, [[teletechnika|teletechniki]]
      i tym podobnych.

