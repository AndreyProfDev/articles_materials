- sections:
  - content: '[[Plik:Arthur Rothstein, Boy building a model airplane as girl watches,
      FSA camp, Robstown, Texas, 1942.jpg|thumb|Chłopiec pracujący nad domowej roboty
      modelem samolotu, 1942 rok]]

      ''''''Zrób to sam'''''' ({{ang.|do it yourself}} {{IPA|''du: ıt jə’self|nawiasy=kwadratowy}},
      w skrócie ''''''DIY'''''') – określenie idei związanej z samodzielnym, niekomercyjnym
      wykonywaniem zwykle na własne potrzeby różnych prac bez pomocy profesjonalistów.
      Anglojęzyczny termin DIY pojawił się na początku XX wieku, a do powszechnego
      użytku wszedł po [[II wojna światowa|II wojnie światowej]]. DIY może być także
      niezależnym artystą, który pisze, nagrywa i produkuje własne piosenki, zwykle
      we własnym domu. Wraz z rozwojem programów [[Cyfrowa stacja robocza|DAW]] (Digital
      Audio Workstations) czy takich jak Logic Pro X firmy Apple, [[Ableton Live]]
      i [[FL Studio]]. Wielu artystów na świecie tworzy tak własną muzykę i wydaje
      ją własnym sumptem na portalach streamingowych bez udziału dużych wytwórni płytowych{{Cytuj
      |autor = Broken Stereo |tytuł = Bedroom Pop and the Rise of the DIY Artist |data
      = 2020-01-14 |data dostępu = 2020-06-20 |opublikowany = Medium |url = https://medium.com/@brokenstereo/bedroom-pop-and-the-rise-of-the-diy-artist-1946e83bc7e0
      |język = en}}.

      == Subkultura ==

      Określenie to dotyczy wywodzącej się z [[subkultura|subkultury]] [[Ruch hippisowski|hippie]]
      i [[punk]] (choć do niej się nieograniczającej) idei samodzielnego wytwarzania
      m.in. tworzenia [[zin]]ów, ręcznego malowania naszywek i koszulek, wydawania
      utworów muzycznych nagranych własnym sumptem, organizowania koncertów bez pomocy
      sponsorów.

      == Idea ==

      Idea jest rozpowszechniana także przez [[Haker (slang komputerowy)|hakerów]],
      miłośników technologii, elektroników hobbystów, którzy udostępniają na swoich
      stronach i forach dyskusyjnych filmy i inne pliki z instruktażami np. montażu
      gniazda do ładowarki samochodowej w komputerze, instalacji [[MacOS|OS X]] na
      [[Komputer osobisty|PC]], zasilenia [[router]]a przez gniazdo [[ethernet]]owe,
      budowy [[zegar]]a cyfrowego, budowy zestawu [[głośnik]]ów do kina domowego,
      nawet własnego odtwarzacza [[MP3|mp3]] i wiele innych.

      Może to służyć wielu celom – od promocji danego ruchu, zespołu lub idei do pozyskiwania
      pieniędzy na różne cele.

      == Muzycy ==

      Przykładowi polscy muzycy posiadający główne cechy DIY tj. nagrywający i wydający
      muzykę w swoich własnych wydawnictwach.

      * [[DJ 600V]]

      * [[Tede]]

      * [[Sokół (raper)]]

      * [[Jacek Sienkiewicz (producent muzyczny)|Jacek Sienkiewicz]]

      * [[Modfunk]]

      * [[Gromee]]

      * [[P.A.F.F.]]

      == Majsterkowanie ==

      Obecnie DIY funkcjonuje w państwach anglojęzycznych także jako nazwa sklepu
      z przyborami, narzędziami oraz materiałami dla majsterkowiczów. Idea ta rozprzestrzeniła
      się na kraje europejskie w postaci komercyjnej; wielu producentów we wszystkich
      dziedzinach technicznych, od budownictwa, poprzez wykańczanie wnętrz na elektronice
      skończywszy, oferuje zestawy do samodzielnego wykorzystania.

      Od lat 90. ruch Zrób to Sam coraz zaczęło rozwijać się w skali globalnej dzięki
      rozwojowi [[World Wide Web|sieci WWW.]] W efekcie zaczęły powstawać [[blog]]i
      i [[Wideoblog|vlogi]] oferujące [[tutorial]]e{{Cytuj |tytuł = Alfabet majsterkowicza.
      Co to jest DIY, upcycling i tutorial? Majsterki.pl |data = 2015-01-27 |data
      dostępu = 2016-07-12 |url = http://majsterki.pl/blog/alfabet-majsterkowania-co-to-jest-diy
      |język = pl}} krok po kroku pokazujące jak samodzielnie wykonać konkretne przedmioty,
      elementy remontu czy domowych napraw. Obecnie zasięg tego ruchu jest już na
      tyle masowy, że według badania z czerwca 2016 r. ''''Zrób to sam. Jak Polacy
      łączą przyjemne z pożytecznym?'''' 84% Polaków nie tylko samodzielne wykonuje
      różne czynności w domu czy ogrodzie, ale też 73% robi to z przyjemnością{{Cytuj
      |tytuł = Raport o "zrób to sam”, czyli jak Polacy łączą przyjemne z pożytecznym
      |data = 2016-06-16 |data dostępu = 2022-01-23 |opublikowany = gazetaprawna.pl
      |url = https://www.gazetaprawna.pl/wiadomosci/artykuly/952425,raport-o-zrob-to-sam-polacy-zdolni-i-aktywni.html
      |język = pl}}{{Cytuj |tytuł = DIY: „Zrób to sam” w Polsce – raport |data = 17
      czerwca 2016 |data dostępu = 2022-01-23 |opublikowany = majsterki.pl |typ nośnika
      = pdf |url = https://majsterki.pl/diy/wydarzenia/raport-o-zrob-sam-w-polsce}}.

