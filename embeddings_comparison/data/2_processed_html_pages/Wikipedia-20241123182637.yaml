- sections:
  - content: '{{Inne znaczenia|2=[[kanibalizacja|inne znaczenia słowa „kanibalizacja”]]}}

      ''''''Kanibalizacja'''''' – w technice proces polegający na pozyskiwaniu części
      zamiennych z uszkodzonych lub nieużytkowanych [[maszyna|maszyn]], stosowany
      w celu naprawy nieprodukowanych już urządzeń lub [[utylizacja|utylizacji]] rozbitych
      [[samochód|samochodów]] lub samolotów (np. w czasie wojny). Jest zaliczana do
      procesów [[odzysk]]u[https://data.e-science.pl/1491/Model%20systemu%20wsparcia%20logistycznego%20procesu%20zagospodarowania%20obiekt%C3%B3w%20wycofanych%20z%20eksploatacji.pdf
      M. Plewa, Model systemu wsparcia logistycznego procesu zagospodarowania obiektów
      wycofanych z eksploatacji]. Występuje w polskim lotnictwie wojskowym[https://sin.put.poznan.pl/files/download/4624
      Zbigniew Krzysztof Uchman Metoda analizy i oceny gotowosci technicznej wojskowych
      statków powietrznych], s.80, gdzie części pobiera się z niesprawnych statków
      powietrznych. MON rozważało w 2019 kanibalizację czołgów [[T-72]][https://www.polityka.pl/tygodnikpolityka/kraj/1922962,1,mon-zmodernizuje-mniej-czolgow-niz-obiecal-a-wyjdzie-drozej.read
      MON zmodernizuje mniej czołgów, niż obiecał. A wyjdzie drożej]. Turecka armia
      kanibalizuje czołgi [[Leopard 2]]A4[https://milmag.pl/seryjna-modernizacja-tureckich-leopardow-2a4/
      Seryjna modernizacja tureckich Leopardów 2A4].

      Kanibalizacja bywa także stosowana w okrętownictwie. Jako przykład można tutaj
      podać [[Okręty podwodne typu 207|okręty podwodne typu ''''Kobben'''']], z których
      [[Polska Marynarka Wojenna]] nabyła cztery okręty jako jednostki bojowe, a piątą
      jako magazyn części. Podobnie postąpiła {{link-interwiki|Marynarka Wojenna Singapuru|Q=Q2531890}},
      która zakupiła szwedzkie [[okręty podwodne typu A-11B]], z czego cztery zostały
      nabyte jako jednostki bojowe, a piąta („Sjöbjornen”) w celu kanibalizacjiMaciej
      S. Sobański, ''''Marynarka Wojenna Singapuru'''', Okręty Wojenne, Vol. XIV,
      Nr 63 (1/2004), s. 76, przypis trzeci. W [[Royal Navy]] [[HMS Eagle (1946)|HMS
      „Eagle”]] był magazynem części zamiennych dla [[HMS Ark Royal (1950)|HMS „Ark
      Royal”]] – „Eagle” wycofano ze służby, ale pozostawał w rezerwie jako magazyn
      części dla pozostającego w służbie „Ark Royal”.

