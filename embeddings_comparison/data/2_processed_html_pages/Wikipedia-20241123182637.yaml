- sections:
  - content: '''''''Wysoka technika'''''' ({{ang.|high technology}}, {{K|en|high-tech}}{{Cytuj
      książkę |nazwisko = Matusiak |imię = Krzysztof B. |tytuł = Innowacje i transfer
      technologii. Słownik pojęć |url = https://www.parp.gov.pl/files/74/81/469/12812.pdf
      |wydawca = [[Polska Agencja Rozwoju Przedsiębiorczości]] |miejsce = Warszawa
      |rok = 2011 |rozdział = WYSOKA TECHNIKA [High Technology, High-Tech] |isbn =
      978-83-7633-164-5 |język = pl |strony = 328–331}}) – dziedziny i wyroby charakteryzujące
      się wysoką intensywnością [[Prace badawczo-rozwojowe|B+R]]{{Cytuj stronę |url
      = https://stat.gov.pl/metainformacje/slownik-pojec/pojecia-stosowane-w-statystyce-publicznej/773,pojecie.html
      |tytuł = Pojęcia stosowane w statystyce publicznej: Wysoka technika |opublikowany
      = [[Główny Urząd Statystyczny]] |data = |data dostępu = 2019-04-03}}.

      Cechami charakterystycznymi dla branż wysokich [[Technologia|technologii]] są
      także[https://www.parp.gov.pl/files/74/75/76/perspektywy_rozwoju_msp.pdf Perspektywy
      rozwoju małych i średnich przedsiębiorstw wysokich technologii w Polsce do 2020
      roku], s. 6.:

      * wysoki poziom zatrudnienia personelu naukowo-technicznego,

      * technologie zawarte w [[patent]]ach i [[Licencja (prawo)|licencjach]],

      * strategiczna współpraca z innymi firmami wysoko technologicznymi i ośrodkami
      naukowymi,

      * wysoki poziom rotacji wyposażenia technicznego, konieczność dużych nakładów
      kapitałowych.

      Przykłady dziedzin [[Technika|techniki]], w których stosowane są nowe technologie:

      * [[astronautyka]]

      * [[biotechnologia]]

      * [[farmacja]]

      * [[fizyka jądrowa]]

      * [[informatyka]]

      * [[inżynieria kwantowa]] (np. [[spintronika]], [[komputer kwantowy]])

      * [[inżynieria materiałowa]] ([[nanomateriały]], [[nanotechnologia]])

      * [[lotnictwo]]

      * [[medycyna]]

      * [[robotyka]]

      * [[telekomunikacja]]

