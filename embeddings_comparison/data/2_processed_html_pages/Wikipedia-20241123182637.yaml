  - content: '[[Plik:Continental AG tire factory Mittellandkanal Stoecken Hannover
      Germany 02.jpg|mały|Budynek fabryki opon jako przykład obiektu technicznego]]

      ''''''Obiekt techniczny'''''' – [[przedmiot]] wykonany przez [[Człowiek rozumny|człowieka]]
      w celu spełnienia jego [[potrzeba|potrzeb]]{{r|Sobczak|BNauki}}.

      Każdy obiekt techniczny jest wytwarzany po to, aby go [[eksploatacja|eksploatować]]{{odn|Słowiński|2014|s=17}},
      a wskutek eksploatacji podlega [[Zużywanie|zużyciu]]{{odn|Słowiński|2014|s=43}}.

      Przyjmuje się, że istnienie obiektu technicznego dzieli się na fazy:

      * [[produkcja|produkcji]]

      * [[eksploatacja|eksploatacji]]

      * [[likwidacja|likwidacji]]{{r|businessinsider}}

