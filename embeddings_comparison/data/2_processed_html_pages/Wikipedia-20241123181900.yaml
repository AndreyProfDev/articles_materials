- sections:
  - content: "'''Typowość''' – [[cecha]] oznaczająca realizację jakiegoś wzoru, normy,\
      \ modelu utrwalonego w serii podobnych [[zachowanie|zachowań]], postaw, zdarzeń.\n\
      Wiąże się ona z uogólnieniem, wskazaniem na to, co reprezentatywne, charakterystyczne\
      \ dla danego [[czas]]u, miejsca, [[środowisko|środowiska]].\nW odniesieniu do\
      \ tekstów [[kultura|kultury]] typowość może dotyczyć struktury tekstu (np. typowa\
      \ [[fabuła]], typowy [[narrator]], bohater), norm gatunkowych (oznacza wówczas\
      \ klasykę, [[western]], [[bajka|bajkę]]), norm wyznaczonych przez tendencje\
      \ artystyczne czy [[filozofia|filozoficzne]] danych czasów (np. typowy [[bohater]]\
      \ romantyczny, dramat modernistyczny, tematyka pozytywistyczna) oraz stworzonych\
      \ przez [[autor]]a (np.typowy bohater szekspirowski). \nTypowość jest cechą\
      \ [[literatura|literatury]] realistycznej. Pojawia się w tekstach mających zdefiniowana,\
      \ wyrazistą i zamkniętą strukturę gatunkową (np. typowa [[dobro|dobra]] lub\
      \ [[zło|zła]] postać [[komiks]]owa, typowy [[film]] [[hollywood]]zki.\n== Bibliografia\
      \ ==\n* red. Ewa Szczęsna, ''Słownik pojęć i tekstów kultury'', Warszawa 2002.\n\
      [[Kategoria:Kultura]]"
