- sections:
  - content: "{{dopracować|źródła=2021-11}}\n'''Retro''' – termin używany do określania\
      \ elementów współczesnej kultury, które pochodzą lub są świadomą imitacją trendów\
      \ w modzie, światopoglądzie, zachowaniu z niedalekiej przeszłości, a które są\
      \ obecnie uznawane za niemodne{{Cytuj |tytuł = retro – Słownik języka polskiego\
      \ PWN |data dostępu = 2022-04-24 |opublikowany = sjp.pwn.pl |url = https://sjp.pwn.pl/sjp/retro;2574143.html\
      \ |język = pl}}.\n{{Wikicytaty|na temat kultury retro}}\n== Pochodzenie ==\n\
      Słowo ''retro'' pochodzi od [[łacina|łacińskiego]] [[Przedrostek|przedrostka]]\
      \ retro-, który dosłownie oznacza ''wstecz'' lub ''w przeszłości'', zwłaszcza\
      \ w takich słowach jak ''retrospektywny''{{Cytuj |tytuł = retrospekcja – Słownik\
      \ języka polskiego PWN |data dostępu = 2022-04-24 |opublikowany = sjp.pwn.pl\
      \ |url = https://sjp.pwn.pl/sjp/retrospekcja;2574149.html |język = pl}}, czyli\
      \ odnoszący się do nostalgicznego lub krytycznego spojrzenia w przeszłość.\n\
      W okresie powojennym słowo to nabrało nowego znaczenia z chwilą pojawienia się\
      \ określenia ''[[retrorocket]]'' oznaczającego rakietę hamującą (skrót od ''retrograde\
      \ rocket'', czyli rakiety, która jest wystrzeliwana w kierunku przeciwnym do\
      \ ruchu [[Statek kosmiczny|statku kosmicznego]]), używaną w latach 60. XX wieku\
      \ w [[Stany Zjednoczone|amerykańskim]] programie kosmicznym. We [[Francja|Francji]]\
      \ słowo ''rétro'', to skrót od francuskiego ''rétrospectif'', weszło do obiegu\
      \ i osiągnęło popularność, gdy zaczęto powtórnie oceniać postać [[Charles de\
      \ Gaulle|Charles'a de Gaulle’a]] i rolę Francji w [[II wojna światowa|II wojnie\
      \ światowej]]. Francuska [[Moda (styl)|moda]] retro z lat 70. XX wieku w filmach\
      \ i opowiadaniach poddała ocenie postępowanie francuskich cywili w czasie okupacji\
      \ hitlerowskiej. Wkrótce potem terminu retro zaczęto używać w odniesieniu do\
      \ francuskiej mody, która odwoływała się do tego okresu.\nZaraz potem termin\
      \ ten został wprowadzony do [[Język angielski|języka angielskiego]] za pośrednictwem\
      \ mody i kultury popularnej, gdzie kojarzy się raczej z cynicznym powrotem starszych\
      \ trendów. (Elizabeth E. Guffey, ''Retro: The Culture of Revival'', s. 9-22).\
      \ [[Jean Baudrillard]], francuski myśliciel, w swojej książce ''Symulakry i\
      \ symulacja'' określa słowo ''retro'' jako demitologizację [[Przeszłość|przeszłości]],\
      \ oddalanie [[Teraźniejszość|teraźniejszości]] od istotnych poglądów, które\
      \ kierowały erą nowożytną (Jean Baudrillard, ''Symulakry i symulacja'', s. 43.).\n\
      == Użycie słowa ==\nSłowo ''retro'' używane jest często w znaczeniu pozytywnym,\
      \ w odniesieniu do: \n* współczesnego światopoglądu np. [[konserwatyzm]]u społecznego,\
      \ stosunku do nauczania domowego, podziału ról między [[Kobieta|kobietą]] i\
      \ [[Mężczyzna|mężczyzną]], czy też ''campowej'' estetyki, która reprezentuje\
      \ ironiczne podejście do rzeczywistości przejawiające się otwartym i celowym\
      \ wprowadzaniem przestarzałych elementów zarówno do stylu ubierania, jak i sposobu\
      \ bycia;\n* współczesnych przedmiotów cechujących się [[design]]em lub [[Funkcjonalność|funkcjonalnością]],\
      \ która bezpośrednio odnosi się do przedmiotów produkowanych dawniej, a także\
      \ niektóre nurty w sztuce, np. muzyka retro, moda retro.\nSłowo ''retro'' często\
      \ używane jest błędnie w odniesieniu do oryginalnych, starszych przedmiotów\
      \ (np. ubiorów), które same w sobie nie są przedmiotami ''retro'', choć aktywność\
      \ związana z korzystaniem z nich obecnie jest ''retro-aktywnością''. W szczególności\
      \ błędnym jest używanie słowa ''retro'' jako synonimu słowa ''stary'', ''klasyczny'',\
      \ ''antyczny'' czy ''[[vintage]]''. \nWyjątkowe umiłowanie do stylu retro jest\
      \ nazywane ''retrofilią''. \n== Odmiany Retro ==\n[[Plik:Retro Jokers Melodka\
      \ 2.jpg|mały|Grupa Retro Jockers, stylizowana na The Beatles]]\n=== Muzyka retro\
      \ ===\nW latach 80. XX wieku, retro odnosiło się do nowego gatunku muzyki, a\
      \ w szczególności do muzyki [[dance]], popularnej w owym czasie w [[Stany Zjednoczone|Stanach\
      \ Zjednoczonych]]. Początkowo określano ją mianem [[Nowa fala (muzyka)|nowej\
      \ fali]], która częściowo wywodziła się z gatunku [[punk rock]]a z późnych lat\
      \ 70. i wczesnych lat 80. XX wieku oraz gatunku psychedelic trance z późnych\
      \ lat 60. i 70. Wiele spośród piosenek oraz albumów określanych w tamtym czasie\
      \ mianem retro pojawiło się przy okazji wielkiego postępu w rozwoju elektronicznego\
      \ tworzenia muzyki, czyli za pomocą komputera, sprzętu elektronicznego bądź\
      \ za pomocą instrumentów elektromechanicznych. Poglądy na to, jak obszerna jest\
      \ kategoria muzyki retro, są zróżnicowane. Jednak ani cała muzyka, ani nawet\
      \ cała muzyka dance z lat 80., nie była uważana za muzykę retro. Obecnie era\
      \ retro jest umieszczana w ramach czasowych pomiędzy rokiem 1966, kiedy to [[The\
      \ Beatles]] wydali piosenki ''Rain'' oraz ''Tomorrow Never Knows'', i 1997,\
      \ kiedy to [[Kalifornia]] jako ostatni stan zdelegalizowała [[Dietyloamid kwasu\
      \ lizergowego|LSD]].\nPo 2000 roku zaczęły powstawać gatunki stylizowane na\
      \ retro, tj.:\n* retro-metal, kiedy to wzrosła popularność muzyki [[Hard rock|hardrockowej]]\
      \ łączącej w sobie elementy muzyki poważnej, psychedelia trance, [[heavy metal]]u\
      \ oraz nowoczesnego hard rocka. Zyskały szczególny rozgłos wśród pokoleń X i\
      \ Y (osób, które urodziły się między 1965 a 1995 rokiem). Najważniejszymi zespołami\
      \ tworzącymi w tym nurcie są Wolfmother, The Sword, Jet i Buckcherry, które\
      \ osiągnęły sukces, stosując styl i metody dawnych zespołów, takich jak Led\
      \ Zeppelin, Black Sabbath, The Jimi Hendrix Experience, [[The Beatles]] oraz\
      \ [[Pink Floyd]]. Podczas gdy siła tego ''nurtu'' była podważana przez niektórych\
      \ krytyków muzycznych, ''retro''- lub ''heritage metal'' stało się powszechnym\
      \ terminem na określenie modnego [[hard rock]]a. ''Retro'' to również siódmy\
      \ album duńskiego zespołu [[Death metal|deathmetalowego]] [[Illdisposed]], wydany\
      \ w [[2000 w muzyce|2000]] roku. Zawiera 11 utworów, wszystkie są [[cover]]ami.\
      \ Zespół wykonuje tu piosenki takich zespołów jak [[AC/DC]], [[Motörhead|Motorhead]],\
      \ [[Death (zespół deathmetalowy)|Death]] i innych;\n* [[synthwave]], który czerpie\
      \ inspirację z muzyki elektronicznej, oraz muzyki z gier i filmów lat 80.;\n\
      * psychedelic trance;\n* vaporwave.\n[[Plik:Gramofon 2 ubt.jpeg|mały|Gramofon]]\n\
      ''Retro'' w muzyce obejmuje również używanie starego [[Sygnał analogowy|analogowego]]\
      \ oraz [[Sygnał cyfrowy|cyfrowego]] sprzętu audio, tj. [[gramofon]]y, [[Magnetofon\
      \ szpulowy|magnetofony szpulowe]] i [[Magnetofon kasetowy|kasetowe]], [[Odtwarzacz\
      \ CD|odtwarzacze CD]] oraz przestarzałych nośników dźwięku, np. [[Płyta gramofonowa|płyt\
      \ winylowych]], [[Taśma magnetyczna|taśm]] i [[Kaseta magnetofonowa|kaset magnetofonowych]],\
      \ [[Płyta kompaktowa|płyt CD]]. Przyczyn powrotu do dawnych metod odtwarzania\
      \ dźwięku upatruje się w [[Wydawnictwo muzyczne|wytwórniach płytowych]], walczących\
      \ z [[Piractwo medialne|piractwem w Internecie]]. Wydawanie [[Album (wydawnictwo\
      \ muzyczne)|albumów]] na przestarzałych nośnikach, głównie na płytach winylowych,\
      \ ma za zadanie utrudnić nieautoryzowanie kopiowanie zawartych na nich treści.\
      \ Inną przyczyną może być chęć osiągnięcia najlepszej jakości dźwięku, tzw.\
      \ ''[[Hi-fi|high fidelity]]''; która to wraz z popularyzacją serwisów streamingowych,\
      \ tj. [[Spotify]] lub [[iTunes]], przestała być priorytetem dla firm udostępniających\
      \ muzykę w Internecie{{Cytuj odcinek|tytuł=Loudness Wars - Odc.24 [Reduktor\
      \ Szumu]|url=https://www.youtube.com/watch?v=ydg-ajN1u9o|data dostępu=2022-04-24}}.\n\
      === Retrogaming ===\n[[Plik:NCM Konsole mit Controller.jpg|mały|220x220px|Konsola\
      \ [[NES Mini Classic]]]]\nTo [[hobby]], które staje się coraz bardziej popularne\
      \ i polega na graniu w stare gry video{{Cytuj odcinek|tytuł=Mój RetroPC (Voodoo3,\
      \ 256MB RAM, Celeron 1,7Ghz)|url=https://www.youtube.com/watch?v=B2zRTA4V7OQ|data\
      \ dostępu=2022-04-24}}, naprawianiu starszych sprzętów do grania oraz tworzenie\
      \ i udostępnianie programów wykorzystujących 100% możliwości danej platformy.\
      \ Wydawanie nowych gier, nawiązujących oprawą graficzną ([[sprite]], [[Pixel\
      \ art|pixel-art]]), muzyczną i dźwiękową ([[chiptune]], AdLib, [[MIDI]], [[CD-Audio|CD\
      \ Audio]]) wraz z mechanikami ze starych gier z lat 80. i 90. Przykładowe retro-gry\
      \ to: Shovel Knight, Attack of PETSCII Robots, Super Phantom Cat, seria [[Hotline\
      \ Miami]], Xeno Crisis, itp. \nMożna wyróżnić kilka typów sprzętu, jaki do tego\
      \ celu jest wykorzystywany: \n* stare komputery (np. [[ZX Spectrum]], [[Commodore\
      \ 64]], [[Amiga 600|Amiga]], [[MS-DOS|PC MS-DOS]], [[Microsoft Windows|PC Windows\
      \ 95/98]]) oraz stare konsole do gier (np. [[Atari 2600]], [[Nintendo Entertainment\
      \ System|NES]], [[Super Nintendo Entertainment System|SNES]], [[Nintendo 64|N64]],\
      \ [[Sega Mega Drive]], [[PlayStation|PSX]]). Mówimy wtedy też o '''retrocomputingu''';\n\
      * [[emulator]]y instalowane na współczesnym sprzęcie (np. [[WinUAE]], [[DOSBox]],\
      \ PC-Em, Vice);\n* retro-komputery i retro-konsole, które są nowoczesną rewizją\
      \ starszych sprzętów, odsługujące aktualne standardy, często umieszczane w mniejszych\
      \ obudowach, stylem przypominające te oryginalne. Mogą przy tym opierać się\
      \ na uniwersalnych współczesnych procesorach (np. [[ARM (architektura)|ARM]]),\
      \ mikrokontrolerach (np. [[STM32]]), używać [[Emulacja|emulacji]] sprzętowej\
      \ (np. w oparciu o układy [[FPGA]]) lub programowej (RetroArch) lub czasami\
      \ wykorzystywać oryginalne, stare podzespoły elektroniczne. Przykładowymi retro-komputerami\
      \ są: C64 Maxi, MiSTer FPGA, Commander X16, [[Raspberry Pi]] z oprogramowaniem\
      \ Amibian; natomiast retro-konsolami są np.: A500 Mini, Atari VCS, [[NES Mini\
      \ Classic]], C64 Mini, SEGA Genesis Mini, [[Raspberry Pi]] z oprogramowaniem\
      \ RetroPie.\nOdnogą retrogamingu jest [[speedrun]], czyli przechodzenie starszych\
      \ gier w jak najkrótszym czasie, nierzadko wykorzystując błędy (ang. glitch)\
      \ tj. przechodzenie przez ściany, bardzo długie skoki, moment ładowania kolejnego\
      \ etapu. Do takich gier można zaliczyć: [[Doom (gra komputerowa 1993)|Doom]],\
      \ [[Quake]], [[Duke Nukem 3D]], [[Half-Life]], [[Super Mario Bros.]], starsze\
      \ odsłony [[The Legend of Zelda (seria)|The Legend of Zelda]], [[GoldenEye 007]],\
      \ Time Splitters. Organizowane są turnieje oraz [[Live streaming|livestreamy]],\
      \ podczas których najlepsi gracze rywalizują o uzyskanie jak najkrótszych czasów\
      \ ukończenia danego tytułu{{Cytuj odcinek|tytuł=Running A Tightrope: DOOM's\
      \ Most Precarious Speedrun|url=https://www.youtube.com/watch?v=xMX0uQpDsYU|data\
      \ dostępu=2021-05-04}}.\n=== Moda retro ===\n[[Plik:Fernando Rosa - BAIXO.jpg|mały|Nowoczesny\
      \ styl ''retro'', nawiązujący do lat 70.]]Moda retro to styl ubierania polegający\
      \ na noszeniu ubrań z minionych lat, głównie z lat 50., 60. i 70. Ten sposób\
      \ ubierania się często zawiera odzież i dodatki charakterystyczne dla mody z\
      \ danego okresu. Wielu projektantów wykorzystuje takie elementy w sposób przesadzony.\
      \ Określenie ''elegancja w stylu retro'' odnosić się może do: \n* spodnie ''dzwony'',\
      \ kurtki, bluzy i buty w stylu funky, chociażby z linii [[Adidas]] Classics;\n\
      * popularne w USA tzw. ''poodle skirts'' (spódnice z motywem pudla) z lat 50.,\
      \ spódnice ''bananówy'' modne w Polsce w latach 70.;\n* duże okulary przeciwsłoneczne,\
      \ tzw. ''muchy'';\n* jaskrawe hawajskie koszule, cienkie krawaty lub ręcznie\
      \ farbowane koszule rodem z lat 60.;\n* skórzane torebki i plecaki.\n=== Retro\
      \ Sport ===\nOdzież sportowa stylizowana na lata 70. i 80. XX wieku jest charakterystycznym\
      \ i wyraźnym przykładem tego trendu. Dużą popularnością cieszą się kurtki piłkarskie,\
      \ koszulki i T-shirty z emblematami kiedyś istniejących klubów [[Piłka nożna|piłki\
      \ nożnej]]. Zazwyczaj ubrania te przypominają swoim wyglądem dawne czasy dzięki\
      \ zastosowaniu linii po bokach oraz połączeniu kolorów typowych dla tamtego\
      \ okresu. Charakterystycznym przykładem są [[Mistrzostwa świata w piłce nożnej|Mistrzostwa\
      \ Świata w Piłce Nożnej]] z 1970 roku, które odbyły się w [[Meksyk]]u. Logo\
      \ oraz typ czcionki z tego okresu są stosowane na różnego rodzaju strojach typu\
      \ retro sport. Ponadto takie marki jak [[Adidas]], [[Puma SE|Puma]] czy [[Nike\
      \ (przedsiębiorstwo)|Nike]] mają własne działy, które specjalizują się w produktach\
      \ typu ''retro''. Również niektóre kluby [[Piłka nożna|piłki nożnej]], [[baseball]]a\
      \ i [[Koszykówka|koszykówki]] ponownie wypuściły swoje dawne stroje sportowe,\
      \ aby zwiększyć ich sprzedaż.\n=== Samochody retro ===\nSamochody retro to nowo\
      \ zaprojektowane pojazdy, których stylistyka jest oparta na samochodach z dawnych\
      \ epok, jednak nie zostały w nich wykorzystane żadne elementy oryginalnych konstrukcji,\
