      [[Plik:Bocicoel 2009.JPG|mały|Karpaty na południu Rumunii z widocznymi płotami
      i słupami stworzonymi przez człowieka]]

      ''''''Krajobraz kulturowy'''''' – przestrzeń historycznie ukształtowana w wyniku
      działalności człowieka, zawierająca wytwory cywilizacji oraz elementy [[środowisko
      przyrodnicze|przyrodnicze]]{{Cytuj książkę |nazwisko = Janowicz |imię = Rafał
      |tytuł = Komunikacja marketingowa w architekturze |wydawca = [[Narodowe Centrum
      Kultury]] |miejsce = Warszawa |data = 2012 |strony = 151}}Ustawa z dnia 23 lipca
      2003 r. o ochronie zabytków i opiece nad zabytkami ({{Dziennik Ustaw|2022|840}})..

      [[Krajobraz]] kulturowy jest wynikiem przekształcania [[krajobraz naturalny|krajobrazu
      naturalnego]] przez grupę lub kilka grup kulturowych i nakładania elementów
      kulturowych różnego wieku.

      [[Krajobraz]] kulturowy to przestrzeń przyrodnicza, która znajduje się w sferze
      oddziaływań człowieka przyjmuje formę kulturową, wyrażoną w postaci krajobrazu
      kulturowego. Krajobraz ten można rozumieć jako [[Antropopresja|antropogenicznie]]
      ukształtowany fragment [[przestrzeń geograficzna|przestrzeni geograficznej]],
      powstały w wyniku zespolenia oddziaływań [[środowisko]]wych i kulturowych, tworzących
      specyficzną strukturę, objawiającą się regionalną odrębnością, postrzeganą jako
      swoistą fizjonomię.

      == Krajobraz kulturowy w badaniach geograficznych ==

      Podstawowym aspektem [[Badania naukowe|badawczym]] w ramach krajobrazu kulturowego
      są analizy [[ewolucja|ewolucji]] [[krajobraz]]u w ujęciu systemowym, strukturalno-dynamicznym
      i funkcjonalnym oraz historyczno-genetycznym, a także zagadnienia [[prognozowanie|prognozowania]]
      zmian w krajobrazie zachodzących pod wpływem działalności człowieka. Dotyczy
      to m.in. problematyki kulturowych przeobrażeń przestrzeni, ewolucji krajobrazu
      w ujęciu regionalnym, kulturowych podstaw [[geografia turyzmu|geografii turyzmu]],
      problematyki [[waloryzacja|waloryzacji]] oraz metod [[ochrona krajobrazowa|ochrony
      krajobrazów]] poprzemysłowych i poeksploatacyjnych i wiele innych. Krajobraz
      kulturowy jest ważnym polem badawczych w obrębie teoretycznych podstaw [[turystyka|turystyki]]
      i [[ochrona środowiska|ochrony środowiska naturalnego.]]

