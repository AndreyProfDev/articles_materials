- sections:
  - content: "{{Wygaszony portal}}\n__NOTOC__\n{{Wikipedia:Portal/nawigacja}}\nKultura\
      \ w polskojęzycznej Wikipedii\n[[Plik:Adam Mickiewicz monument art p.png|100px|right]]\n\
      W tym portalu, mimo, że do kultury materialnej można zaliczyć także technikę,\
      \ a w szerszym ujęciu cały dorobek ludzkości, zdecydowaliśmy się na prezentację\
      \ zagadnień związanych głównie z kulturą symboliczną. Niektóre obszary wiedzy\
      \ (np. dotyczącej teatru) są jeszcze w Wikipedii ubogie, z tego względu zachęcamy\
      \ do ich rozwijania. W tej chwili są tu wyeksponowane te dziedziny, które najbardziej\
      \ zostały rozwinięte przez internautów. Jeżeli uważasz, że brakuje jakiejś dziedziny\
      \ wiedzy, albo chciałbyś pomóc w opiece nad którymś z portali, zapraszamy na\
      \ stronę dyskusji.\nPo prawej stronie znajdują się kategorie poszczególnych\
      \ dziedzin wiedzy. Zaprezentowane zostały też wyróżnione, głównie ze względu\
      \ na jakość, artykuły oraz ilustracje.\n''Będziemy wdzięczni za Twoją pomoc,\
      \ szanowny czytelniku, w rozwijaniu haseł związanych z poniżej przedstawionymi\
      \ naukami. Przy każdej z nich zamieściliśmy odpowiednie strony odnoszące się\
      \ do współpracy. Zapraszamy także do [[Wikipedia:Wikiprojekt#Kultura|wikiprojektów]].''\n\
