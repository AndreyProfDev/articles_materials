- sections:
  - content: "{{Inne znaczenia|2=[[Twórczość (miesięcznik)]] oraz [[Twórczość Ludowa\
      \ (kwartalnik)]]}}\n'''Twórczość''' – wieloaspektowe zjawisko związane z powstawaniem\
      \ nowych i wartościowych wytworów. Zgodnie ze Słownikiem Języka Polskiego [[Wydawnictwo\
      \ Naukowe PWN|PWN]] jest to pojęcie oznaczające zarówno ''proces tworzenia czegoś'',\
      \ jak też ''ogół dzieł stworzonych przez kogoś''.{{Cytuj | url=https://sjp.pwn.pl/sjp/tworczosc;2531502.html\
      \ | tytuł=twórczość – Słownik języka polskiego PWN<!-- Tytuł wygenerowany przez\
      \ bota --> | opublikowany=sjp.pwn.pl | język=pl | data dostępu=2019-12-29}}\
      \ W tym pierwszym znaczeniu używa się pojęcia [[Proces twórczy|procesu twórczego]],\
      \ a więc swoistego procesu psychicznego prowadzącego do powstania twórczego\
      \ dzieła[[Edward Nęcka|E. Nęcka]], ''Twórczość''. [W:] [[Jan Strelau|J. Strelau]]\
      \ (red. nauk.), Psychologia. Podręcznik akademicki. Tom 2. Psychologia ogólna,\
      \ Gdańskie Wydawnictwo Psychologiczne, Gdańsk 2000, s. 789. np. [[Dzieło sztuki|dzieła\
      \ sztuki]] czy [[Utwór literacki|dzieła literackiego]]. Tego typu zjawiska są\
      \ badane i opisywane w ramach psychologii twórczości. W tym drugim znaczeniu\
      \ pojęcie twórczości odnoszone jest do dorobku poszczególnych twórców kultury\
      \ np. artystów, naukowców, pisarzy, architektów, projektantów etc. W tym kontekście\
      \ można mówić przykładowo o [[Twórczość malarska Leonarda da Vinci|twórczości\
      \ malarskiej Leonarda da Vinci]] czy o [[Twórczość Williama Shakespeare'a|twórczości\
      \ literackiej Williama Shakespeare'a]]. \nZrozumienie zjawiska twórczości, jak\
      \ twierdzi [[Edward Nęcka]], wymaga ujęcia interdyscyplinarnego, gdyż jest ono\
      \ przedmiotem badań wielu przedstawicieli nauk społecznych i humanistycznych,[[Edward\
      \ Nęcka|E. Nęcka]], ''Twórczość''. [W:] [[Jan Strelau|J. Strelau]] (red. nauk.),\
      \ Psychologia. Podręcznik akademicki. Tom 2. Psychologia ogólna, Gdańskie Wydawnictwo\
      \ Psychologiczne, Gdańsk 2000, s. 783. w tym między innymi [[Psychologia|psychologów]],\
      \ [[Antropologia|antropologów]], [[Filozofia|filozofów]], [[Pedagogika|pedagogów]],\
      \ [[Socjologia|socjologów]], [[Historia|historyków]] czy [[Historia sztuki|historyków\
      \ sztuki]].\n== Psychologiczne koncepcje twórczości ==\nW psychologii twórczości\
      \ wyróżnia się ogólne koncepcje procesu twórczego oraz systemowe koncepcje twórczości.\
      \ Do tej pierwszej kategorii należą klasyczne i współczesne teorie procesu twórczego,\
      \ koncepcja [[Robert Weisberg|Roberta Weisberga]] (nazywana teorią stopniowego\
      \ przyrostu), koncepcja interakcji twórczej [[Edward Nęcka|Edwarda Nęcki]] oraz\
      \ [[model genploracji]] (ang. ''geneplore model'') opracowany przez [[Ronald\
      \ Finke|Ronalda Finkego]], [[Thomas Ward (psycholog)|Thomasa Warda]] i [[Steven\
      \ Smith (psycholog)|Stevena Smitha]]. Z kolei do systemowych koncepcji twórczości\
      \ należą [[inwestycyjna koncepcja twórczości]] [[Robert Sternberg|Roberta Sternberga]]\
      \ i Todda Lubarta, koncepcja [[Transgresja (psychologia)|transgresji]] [[Józef\
      \ Kozielecki|Józefa Kozieleckiego]] oraz koncepcja, którą zaproponował [[Mihaly\
      \ Csikszentmihalyi]].[[Edward Nęcka|E. Nęcka]], ''Twórczość''. [W:] [[Jan Strelau|J.\
      \ Strelau]] (red. nauk.), Psychologia. Podręcznik akademicki. Tom 2. Psychologia\
      \ ogólna, Gdańskie Wydawnictwo Psychologiczne, Gdańsk 2000, s. 786-792.\nJedną\
      \ z pierwszych psychologicznych koncepcji twórczości, uznawaną za klasyczną\
      \ teorię [[Proces twórczy|procesu twórczego]], przedstawił [[Graham Wallas]].\
      \ Zgodnie z jego koncepcją proces twórczy składa się z czterech etapów: 1) preparacji,\
      \ 2) inkubacji, 3) iluminacji oraz 4) weryfikacji.\nCechą charakterystyczną\
      \ systemowych koncepcji twórczości jest to, że wyróżniają one wiele składników\
      \ twórczości, w tym nie tylko składniki psychiczne, ale również społeczne oraz\
      \ kulturowe. W ramach tych koncepcji zakłada się, że twórczość jest dynamicznym\
      \ systemem, zaś poszczególne składniki wzajemnie oraz nieustannie oddziałują\
      \ na siebie. Efekt końcowy jest czymś więcej niż prostą sumą działania jego\
      \ poszczególnych składników, a więc zachodzi proces [[Synergia|synergii]].[[Edward\
      \ Nęcka|E. Nęcka]], ''Twórczość''. [W:] [[Jan Strelau|J. Strelau]] (red. nauk.),\
      \ Psychologia. Podręcznik akademicki. Tom 2. Psychologia ogólna, Gdańskie Wydawnictwo\
      \ Psychologiczne, Gdańsk 2000, s. 786.\n== Zobacz też ==\n{{Wikicytaty|dopełniacz=o\
      \ twórczości}}\n* [[Aktywność twórcza]]\n* [[Dzieło sztuki]]\n* [[Kreatywność]]\n\
      * [[Utwór]]\n== Bibliografia ==\n* https://sjp.pwn.pl/sjp/tworczosc;2531502.html\n\
      * [[Edward Nęcka|E. Nęcka]], ''Twórczość''. [W:] [[Jan Strelau|J. Strelau]]\
      \ (red. nauk.), Psychologia. Podręcznik akademicki. Tom 2. Psychologia ogólna,\
      \ Gdańskie Wydawnictwo Psychologiczne, Gdańsk 2000, s. 783-792.\n== Przypisy\
      \ ==\n{{Przypisy}}\n{{Kontrola autorytatywna}}\n{{SORTUJ:Twórczość}}\n[[Kategoria:Kultura]]\n\
      [[Kategoria:Psychologia]]"
