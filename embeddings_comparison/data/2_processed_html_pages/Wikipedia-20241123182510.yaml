- sections:
  - content: "{{Przekierowanie|historyk|[[Historyk (ujednoznacznienie)|jego inne znaczenia]]}}\n\
      [[Plik:Gyzis 006 (Ηistoria).jpeg|thumb|280px|Alegoria historii na obrazie [[Nikolaos\
      \ Jizis|Nikolaosa Gyzisa]] pochodzącym z 1892 r.]]\n'''Historia''', dawniej:\
      \ '''dziejoznawstwo'''{{otwarty dostęp}} ''[https://sjp.pwn.pl/doroszewski/dziejoznawstwo;5424673.html\
      \ dziejoznawstwo]'' [w:] Słownik języka polskiego pod red. [[Witold Doroszewski|W.\
      \ Doroszewskiego]], sjp.pwn.pl [dostęp 2022-12-19]. – nauka [[nauki humanistyczne|humanistyczna]]\
      \ i [[nauki społeczne|społeczna]], która zajmuje się badaniem przeszłości, a\
      \ w znaczeniu ścisłym badaniem działań i wytworów ludzkich, aż do najstarszych\
      \ poświadczonych pismem świadectw, w odróżnieniu od [[prehistoria|prehistorii]],\
      \ [[archeologia|archeologii]], [[Antropologia|antropologii]] lub [[historia\
      \ naturalna|historii naturalnej]]. Wynikiem badań historycznych jest opis dziejów\
      \ ([[historiografia]]).\nMetoda pracy historyka polega na badaniu zjawisk minionych\
      \ poprzez krytyczną interpretację ich pozostałości i świadectw ([[Źródła historyczne|źródeł]]),\
      \ w celu dotarcia do pewnych [[fakt]]ów, które ułożone chronologicznie przedstawiane\
      \ są w postaci [[Narracja|narracji]].\n== Pojęcie, zakres i miejsce wśród innych\
      \ nauk ==\nHistoria jest najczęściej pojmowana w dwóch odrębnych znaczeniach:\
      \ jako dzieje, przeszłe zdarzenia oraz jako wszelkie relacje o tej przeszłości\
      \ (w tym [[historiografia]]).\nWyraz „historia” pochodzi od [[język grecki|greckiego]]\
      \ słowa {{grc|ἱστορία}} (''historía''), pierwotnie znaczącego „badanie, dochodzenie\
      \ do wiedzy” oraz „wiedza zdobyta poprzez badanie”. [[Herodot]] użył tego słowa\
      \ do określenia charakteru swojej pracy rozpoczynającej się słowami „Oto przedstawienie\
      \ badań ({{w języku|grc|ἱστορίης ἀπόδεξις}} ''historíēs apódexis'') Herodota\
      \ z Halikarnasu”. Od tego sformułowania bierze swój początek nazwa całej [[nauka|nauki]],\
      \ mimo że popularny tytuł nadawany jego dziełu – {{grc|Ἱστορίαι}} (''Historíai'')\
      \ – po polsku tłumaczony jest zazwyczaj jako ''[[Dzieje (Herodot)|Dzieje]]''.\n\
      Tradycyjnie za okres podlegający badaniom historycznym uważa się dzieje od powstania\
      \ cywilizacji opartej na przekazie pisemnym, dla wcześniejszych dziejów rezerwując\
      \ termin [[prehistoria]]. Z takiego podejścia wynika chronologiczna rozbieżność\
      \ początków historii na różnych obszarach świata i w różnych cywilizacjach.\
      \ W ostatnich stuleciach przedmiot badań się jednak nieustannie poszerzał i\
      \ pogłębiał, obejmując wszystkie kontynenty świata, również wiele kultur niepiśmiennych\
      \ oraz nowe zagadnienia [[Antropologia fizyczna|antropologiczne]]. Metodologię\
      \ historyczną cechuje poszukiwanie logicznej konstrukcji przyczynowo-skutkowej\
      \ przy krytycznym podejściu do źródeł historycznych.\nStarożytni Grecy uważali\
      \ historię za jedną ze sztuk. Historia nie jest łatwa do zaklasyfikowania wśród\
      \ nauk. Na ogół jest klasyfikowana jako [[nauki humanistyczne|nauka humanistyczna]].\
      \ Jeśli jednak przyjąć jej cel czysto [[faktografia|faktograficzny]], polegający\
      \ na ustaleniu biegu zdarzeń i wyjaśnieniu stosunku przyczynowo-skutkowego,\
      \ staje się ona nauką nieomalże ścisłą (zobacz: [[Historiografia]]). Jednak\
      \ widząc w niej naukę, która zajmuje się jednorazowymi wydarzeniami, a nie prawidłami\
      \ – jej charakter ściśle naukowy staje się niejednoznaczny. Jeśli przyjąć jej\
      \ umiejętność wskazywania na stosunek biegu zdarzeń do ewolucji cywilizacji,\
      \ zauważymy, że ociera się ona o aspekty [[etyka|etyczno]]-społeczne, co zbliża\
      \ ją do [[filozofia|filozofii]] lub [[socjologia|socjologii]] (zobacz: [[filozofia\
      \ historii]]).\n== Specjalizacje ==\nZ zasadniczej odmienności źródeł dotyczących\
      \ różnych epok i dziedzin ludzkiej działalności, a co za tym idzie wymagających\
      \ odmiennego warsztatu, historia dzieli się na szereg specjalizacji.\n=== Epoki\
      \ historyczne ===\n{{Osobny artykuł|Periodyzacja}}\nPodstawowy podział odpowiada\
      \ w zasadzie klasycznemu podziałowi na epoki historyczne. Z tych samych założeń\
      \ metodologicznych wyłącza się z zakresu badania historii czasy sprzed wynalezienia\
      \ pisma ([[prehistoria|prehistorię]]). Klasyczny podział epok dla historii Europy\
      \ wyróżnia:\n* [[starożytność]] – czasy do roku [[476]], czyli upadku [[Cesarstwo\
      \ Rzymskie|Imperium Rzymskiego]]. Odróżnia się w niej przede wszystkim badania\
      \ nad starożytnym [[Egipt]]em, nad kulturami [[Bliski Wschód|Bliskiego Wschodu]],\
      \ nad starożytną [[Grecja|Grecją]] i nad [[Cesarstwo Rzymskie|Imperium Rzymskim]].\n\
      * [[średniowiecze]] – czasy od starożytności do przełomu [[XIV wiek|XIV]] i\
      \ [[XV wiek|XV]] wieku, czyli wynalezienia [[druk]]u przez [[Johannes Gutenberg|Gutenberga]]\
      \ ([[1450]]) i odkrycia [[Ameryka|Ameryki]] ([[1492]]) dla zachodniej części\
      \ Europy, a dla wschodniej części kontynentu – zdobycia [[Konstantynopol]]a\
      \ przez [[Turcy|Turków]] [[1453]]. Średniowiecze dzieli się na wczesne średniowiecze\
      \ (do [[V wiek|V]]–[[XII wiek|XII]] wieku), klasyczne ([[XII wiek|XII]]–[[XIV\
      \ wiek|XIV]] wiek) i późne (wieki [[XIV wiek|XIV]]–[[XV wiek|XV]]). Istnieje\
      \ pogląd głównie wśród niektórych historyków francuskich, że podział ten jest\
      \ cywilizacyjnie sztuczny i należałoby okres średniowiecza rozciągnąć aż do\
      \ [[Oświecenie (epoka)|oświecenia]].\n* [[Nowożytność|wczesna nowożytność]]\
      \ – czasy od średniowiecza do przełomu [[XVIII wiek|XVIII]]–[[XIX wiek|XIX]]\
      \ wieku, czyli do [[rewolucja francuska|rewolucji francuskiej]] ([[1789]]) lub\
      \ do końca [[kongres wiedeński|kongresu wiedeńskiego]] ([[1815]]). W Polsce\
      \ przyjęło się liczyć do trzeciego rozbioru Rzeczypospolitej ([[1795]]) lub\
      \ do [[Wiosna Ludów|Wiosny Ludów]] ([[1848]]).\n* tzw. „długi wiek XIX” – jest\
      \ to okres od rewolucji francuskiej do wybuchu [[I wojna światowa|I wojny światowej]]\n\
      * [[historia najnowsza]] – od 1914 roku do dziś.\n[[Periodyzacja]] od lat należy\
      \ do grupy ważnych problemów badawczych i [[metodologia historii|metodologicznych]]\
      \ historii. Problem momentów początku i końca poszczególnych epok ma bogatą\
      \ literaturę. Istnieją również koncepcję odrzucające klasyczny podział na epoki\
      \ – m.in. koncepcja „[[długie trwanie|długiego trwania]]” [[Fernand Braudel|Fernanda\
      \ Braudela]] i „[[długie średniowiecze|długiego średniowiecza]]” [[Jacques Le\
      \ Goff|Jacques’a Le Goffa]]Kamil Janicki, ''[http://histmag.org/?id=1917 Bolączki\
      \ periodyzacji]'', „[[Histmag]]”, 2.08.2008..\n=== Obszar badań ===\nKlasyczny\
      \ podział na epoki, okazuje się nieprzydatny, gdy obiektem poznania historycznego\
      \ staje się zjawisko o dłuższym trwaniu, którego zbadanie wymaga podejścia głęboko\
      \ [[Językoznawstwo diachroniczne|diachronicznego]], na przestrzeni wielu epok.\
      \ Pod tym względem wyróżnia się:\n{| width=\"60%\"\n|----- valign=\"top\"\n\
      |\n* [[antropologia historyczna]]\n* [[archiwistyka]]\n* [[mikrohistoria]]\n\
