- sections:
  - content: '''''''Pseudohistoria'''''' – termin najczęściej określający zamieszczane
      w pewnych książkach tezy o podłożu [[historia|historycznym]], ale odbiegające
      od standardów [[metody historyczne|metod historycznych]] w taki sposób, by przedstawić
      ich wnioski w złym świetle. Prace, które przedstawiają kontrowersyjne wnioski
      dotyczące nowych, przypuszczalnych lub spornych dowodów historycznych, w szczególności
      dotyczące polityki, wojska czy religii, są często określane mianem pseudohistorii.

      == Cechy ==

      * Praca najczęściej ma podłoże polityczne, religijne itp.

      * Informacje o pracy nie są zamieszczone w [[czasopismo naukowe|czasopismach
      naukowych]] lub praca taka nie ma odpowiedniej [[recenzja naukowa|recenzji]]

      * Kluczowe dowody wspierające tezy postawione w książce są (musi być spełniona
      chociaż jedna cecha z poniższych):

      ** przypuszczalne

      ** kontrowersyjne

      ** niepoprawne

      ** źle uźródłowione

      ** zinterpretowane w nieuzasadnionym świetle

      ** wyolbrzymione

      ** wyrwane z kontekstu

      ** wypaczone, nieuczciwe

      * W pracy są przedstawione „nowe” interpretacje i wyjaśnienia wyników badań
      historycznych, które można uznać za pewne.

      * Praca odrzuca lub ignoruje zrecenzowane i dobrze udokumentowane konkurencyjne
      (i możliwie prostsze) wytłumaczenia lub interpretecje tych samych faktów, przykładowo
      opierając się na jednej lub wielu [[teorie spiskowe|teoriach spiskowych]]Robert
      Todd Carroll, [http://www.skepdic.com/pseudohs.html The skeptic’s dictionary].
      Hoboken: John Wiley & Sons (2003), s. 305..

      == Przykłady ==

      * ''''[[Światy w kolizji]]'''' ([[Immanuel Velikovsky]])

      * ''''[[Nowa chronologia (Fomienko)|Nowa chronologia]]'''' ([[Anatolij Fomienko]])

      * ''''[[Hipoteza czasu widmowego]]'''' ([[Heribert Illig]]);

      * ''''[[1421 - rok, w którym Chińczycy odkryli Amerykę i opłynęli świat]]''''
      ([[Gavin Menzies]])

      * ''''[[Dwa Babilony]]'''' ([[Alexander Hislop]])

      * [[Kłamstwo oświęcimskie]]

      * [[Kłamstwo kołymskie]] (teorie negujące fakt istnienia [[Gułag|łagrów]] w
      Związku Sowieckim albo pomniejszające liczbę ofiar tychże obozów)

      * [[Protokoły mędrców Syjonu]]

      * [[Lemuria (fikcyjna kraina)|Teorie o Lemurii]]

      * Teorie [[Erich von Däniken|Ericha von Dänikena]] ([[paleoastronautyka]])

      * [[Towarzystwo Vril]]

      * [[Wincenty Kadłubek]]

      * [[Wywód jedynowłasnego państwa świata]] z 1633 roku

      * [[Zakon Syjonu]]

      * [[Zermatyzm]]

      * [[Turbosłowianie|Turbosłowiaństwo]] (znane też jako turbolechictwo)

      * [[Mit narodowy|Mity narodowe]]

      * [[Mit Przegranej Sprawy]]

