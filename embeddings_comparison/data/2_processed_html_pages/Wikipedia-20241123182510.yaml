      \ ([[Muzea Watykańskie]])\n |tytuł = bogini [[muzy|muza]] historii\n |inne imiona\
      \ = \n |występowanie = [[mitologia grecka]]\n |przydomek = \n |atrybut = zwój\n\
      \ |wcielenie zwierzęce = \n |siedziba = [[Parnas]]\n |teren kultu = \n |szczególne\
      \ miejsce kultu = \n |nazwa święta = \n |odpowiednik = \n |ojciec = [[Zeus]]\n\
      \ |matka = [[Mnemosyne (mitologia)|Mnemosyne]]\n |mąż = \n |żona = \n |rodzeństwo\
      \ = [[Erato (muza)|Erato]],\n[[Euterpe (mitologia)|Euterpe]],\n[[Kalliope (mitologia)|Kalliope]],\n\
      [[Melpomene (mitologia)|Melpomene]],\n[[Polihymnia]],\n[[Talia (muza)|Talia]],\n\
      [[Terpsychora (muza)|Terpsychora]],\n[[Urania (muza)|Urania]]\n |dzieci = \n\
      \ |commons = Category:Clio\n |wikisłownik = Klio\n}}\n'''Klio''' („Głosząca\
      \ sławę”, „Sławiąca”; [[język grecki|gr.]] {{grc|Κλειώ}} Kleiṓ, od gr. ''kléos''\
      \ ‘sława’, ''kleíein'' ‘wsławiać’, [[łacina|łac.]] Clio) – w [[mitologia grecka|mitologii\
      \ greckiej]] [[muzy|muza]] [[historia|historii]]{{r|Z. Kubiak}}.\nUchodziła\
      \ za córkę boga [[Zeus]]a i [[tytani]]dy [[Mnemosyne (mitologia)|Mnemosyne]]\
      \ oraz za siostrę: [[Erato (muza)|Erato]], [[Euterpe (mitologia)|Euterpe]],\
      \ [[Kalliope (mitologia)|Kalliope]], [[Melpomene (mitologia)|Melpomene]], [[Polihymnia|Polihymnii]],\
      \ [[Talia (muza)|Talii]], [[Terpsychora (muza)|Terpsychory]] i [[Urania (muza)|Uranii]]{{r|Z.\
      \ Kubiak|P. Grimal|V. Zamarovský}}. Według niektórych źródeł miała synów [[Hiacynt\
      \ (syn Amyklasa)|Hiacynta]] (z [[Pieros (syn Magnesa)|Pierosem]]) i [[Hymen\
      \ (mitologia)|Hymena]]{{r|P. Grimal 2}}.\nByła jedną spośród dziewięciu muz\
      \ olimpijskich (przebywały na [[Olimp]]ie), które należały do orszaku [[Apollo|Apollina]]\
      \ (Apollon Musagetes), ich przewodnika{{r|P. Grimal|M. Pietrzykowski|ancientlibrary.com}}.\
      \ Wraz ze swoimi siostrami uświetniała śpiewem biesiady bosko-ludzkie (m.in.\
      \ zaślubiny [[Tetyda (nereida)|Tetydy]] i [[Peleus]]a oraz [[Harmonia (mitologia)|Harmonii]]\
      \ i [[Kadmos]]a), a także uczty olimpijskie samych bogów{{r|Z. Kubiak|P. Grimal}}.\n\
      W sztuce przedstawiana jest zwykle jako kobieta ze [[zwój|zwojem]] [[papirus]]u\
      \ (lub [[pergamin]]u) – atrybutem symbolizującym dziedzinę nauki, której patronowała{{r|Z.\
      \ Kubiak|J. Parandowski|V. Zamarovský 2}}.\nImieniem muzy nazwano jedną z planetoid\
      \ – [[(84) Klio]] oraz nagrodę udzielaną każdego roku polskim autorom popularyzującym\
      \ historię{{r|pwkh.pl}}.\n== Zobacz też ==\n* [[kameny]]\n* [[Pierydy]]\n==\
      \ Uwagi ==\n{{Uwagi|\nZadanie (rola) jakie Klio wyznaczono ostatecznie w późnym\
      \ okresie [[starożytność|starożytności]].\n}}\n== Przypisy ==\n{{Przypisy|\n\
