- sections:
  - content: '{{Inne znaczenia|nauki humanistycznej|[[psychohistoria (fantastyka naukowa)|psychohistoria]]
      – fantastyczna koncepcja naukowa wymyślona przez Isaaca Asimova}}

      ''''''Psychohistoria'''''' – szczegółowa dziedzina z pogranicza [[Historia|historii]]
      i [[Psychologia|psychologii]], odwołująca się do orientacji [[Psychologia psychodynamiczna|psychodynamicznej]]
      w psychologii, w szczególności do [[Psychoanaliza|psychoanalizy]]. Termin ten
      może również oznaczać zainteresowanie przebiegiem osobniczego rozwoju jednostki
      historycznie zlokalizowanej{{Cytuj książkę |nazwisko = Dymkowski |imię = Maciej
      |autor link = Maciej Dymkowski |tytuł = Między psychologią a historią. O roli
      złudzeń w dziejach. |wydawca = Wydawnictwo Naukowe SCHOLAR |miejsce = Warszawa
      |rok = 2000 |strony = 169 |isbn = 83-88495-01-1}}{{odn|Dymkowski|2003|s=12}}.

      Psychohistorię tworzyli i tworzą głównie profesjonalni psychoanalitycy z zainteresowaniami
      historycznymi (wzorem może być tu sam [[Sigmund Freud|Zygmunt Freud]], jego
      kontynuator [[Erik Erikson]], kulturalista [[Erich Fromm]]){{odn|Dymkowski|2003|s=17–18,
      108}}, zdecydowanie rzadziej profesjonalni historycy po treningu psychoanalitycznymWiktor
      Werner, ''''Psychologiczne Inspiracje w badaniach regionalnych, Perspektywy
      i możliwości''''. [w:] Maksymilian Grzegorz [red.] Historiograficzna prognoza
      2000, Bydgoszcz 2000, s. 193 – 207.

      Psychohistoria rozwijała się intensywnie w [[Stany Zjednoczone|USA]] w latach
      60. i 70. [[XX wiek|XX w.]], obecnie ma niewielu zwolenników{{Cytuj książkę
      |nazwisko r = Dymkowski |imię r = Maciej |rozdział = Koneksje i dylematy psychologii
      historycznej a perspektywa jej zbliżenia do głównego nurtu |nazwisko = Rzepa
      |imię = Teresa |autor link = Teresa Rzepa |nazwisko2 = Domański (red.) |imię2
      = Cezary W. |tytuł = Na drogach i bezdrożach historii psychologii |tom = 1 |miejsce
      = Lublin |wydawca = Wydawnictwo Uniwersytetu Marii Curie-Skłodowskiej |rok =
      2011 |strony = 13 |isbn = 978-83-7784-065-8}}. Większość prac psychohistorycznych
      to [[Psychobiografia|psychobiografie]], np. ''''Eine Kindheitserinnerung des
      Leonardo da Vinci'''' (''''[[Leonarda da Vinci wspomnienie z dzieciństwa]]'''')
      Zygmunta Freuda (1910){{odn|Dymkowski|2003|s=20}}, ''''Young Man Luther''''
      (''''Młody [[Marcin Luter|Luter]]'''') Erika Eriksona (1958){{odn|Dymkowski|2003|s=18}}.
      Krytycy psychohistorii zwracają uwagę na [[ahistoryczność]] podstawowych kategorii
      stosowanych do badania postaci i zdarzeń historycznych, a zatem na logiczną
      i metodologiczną niespójność tego rodzaju badańWiktor Werner, Historyczność
      kultury. W poszukiwaniu myślowego fundamentu współczesnej historiografii, Wydawnictwo
      Naukowe UAM, Poznań 2009, s. 15.

      Na żadnej uczelni nie ma katedr psychohistorii, chociaż niektóre katedry historii
      prowadzą w tym zakresie zajęcia. Psychohistoria pozostaje kontrowersyjną dziedziną
      nauki, spotykającą się z krytyką w środowisku akademickim{{cytuj pismo |nazwisko=deMause
      |imię=Lloyd |tytuł=On Writing Childhood History |czasopismo=Journal of Psychohistory
      |wolumin=2 |wydanie=16 |rok=1988 |url=http://www.psychohistory.com/childhood/writech1.htm
      |archiwum=https://web.archive.org/web/20110514115629/https://www.psychohistory.com/childhood/writech1.htm
      |język=en}}{{cytuj książkę |autor=Stannard, David E. |tytuł=Shrinking History:
      On Freud and the Failure of Psychohistory |wydawca=Oxford University Press,
      USA |rok=1982 |isbn=0-19-503044-3 |język=en}}{{cytuj pismo |nazwisko=Pomper
      |imię=Philip |rok=1973 |tytuł=Problems of a Naturalistic Psychohistory |czasopismo=History
      and Theory |wolumin=4 |wydanie=12 |strony=367–388 |doi=10.2307/2504699|jstor=2504699
      |język=en}}{{cytuj pismo |nazwisko=Paul |imię=Robert A. |tytuł=Review of Lloyd
      deMause''s Foundations of Psychohistory |czasopismo=Journal of Psychoanalytic
      Anthropology |wolumin=5 |strony=469 |rok=1982 |język=en}}, przy czym krytycy
      nazywają ją [[Pseudonauka|pseudonauką]][[Hans Eysenck|Eysenck, Hans]]: ''''Zmierzch
      i upadek imperium Freuda'''', Kraków: WiR Partner 2002, ss. 195{{cytuj książkę
      |nazwisko=Hunt |imię=Lynn |inni=Lloyd S. Kramer, Sarah C. Maza |tytuł=A Companion
      to Western Historical Thought |rok=2002 |wydawca=Blackwell Publishing |isbn=0-631-21714-2
      |strony=337–357 |rozdział=Psychology, Pschoanalysis and Historical Thought –
      The Misfortunes of Psychohistory |język=en}}.

