      }}\n'''Discovery Historia''' (dawniej '''Discovery TVN Historia''') – telewizyjny\
      \ kanał tematyczny o tematyce [[Historia|historycznej]]. Powstał przy współpracy\
      \ programowej [[Discovery Communications|Discovery]] i [[TVN]], do których także\
      \ należał do 30 maja 2009 roku. 30 maja 2009 roku prawdopodobnie z powodu [[Kryzys\
      \ finansowy (2007–2009)|światowego kryzysu finansowego]] TVN, który był udziałowcem\
      \ Discovery Historia, zdecydował się wycofać z inwestycji. Nie podano oficjalnego\
      \ powodu odsprzedania udziałów, w komunikatach poinformowano jedynie o chęci\
      \ włączenia kanału do portfolio Discovery Networks. Discovery Historia była\
      \ kolejnym obok [[TVN Med]] i [[TVN Lingua]] kanałem, z którego w 2009 roku\
      \ wycofał się [[TVN]], wcześniej zrezygnowano z emisji [[TVN Gra]]. Stacją kieruje\
      \ [[Barbara Bilińska-Kępa]].\n== Oferta programowa ==\nRamówkę wypełniają produkcje\
      \ dokumentalne dotyczące historii Polski i świata, takie jak:\n=== produkcje\
