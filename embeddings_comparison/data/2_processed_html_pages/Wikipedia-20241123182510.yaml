- sections:
  - content: '''''''Ekologia kulturowa'''''' - nauka o [[Adaptacja (biologia)|adaptacji]]
      człowieka do [[Środowisko społeczne|środowiska społecznego]] i fizycznego. Adaptacja
      człowieka odnosi się zarówno do procesów biologicznych, jak i kulturowych, które
      umożliwiają ludności przeżycie i [[Rozmnażanie|rozmnażanie się]] w danym lub
      zmieniającym się [[Środowisko|środowisku]]{{Cytuj |autor =Donald Joralemon |tytuł
      = Exploring medical anthropology |data = 2010 |data dostępu = 2019-11-26 |isbn
      = 978-0-205-69351-1 |wydanie = 3rd ed |miejsce = Upper Saddle River, NJ |wydawca
      = Prentice Hall |oclc = 277205447}}. Można badać ją w [[Podejście diachroniczne|ujęciu
      diachronicznym]] (badanie bytów istniejących w różnych epokach) lub [[Podejście
      synchroniczne|synchronicznym]] (badanie obecnego systemu i jego elementów).
      Głównym argumentem jest to, że środowisko naturalne, w społeczeństwach lokalnych
      lub opierających się na [[Handel wymienny|handlu wymiennym]], częściowo od niego
      zależnych, w znacznym stopniu przyczynia się do rozwoju organizacji społecznej
      i innych [[Instytucja (socjologia)|instytucji]]. W sferze akademickiej, w połączeniu
      z badaniem [[Ekonomia polityczna|ekonomii politycznej]] oraz badaniem [[Ekonomia|ekonomii]]
      jako ustroju, staje się ona [[Ekologia polityczna|ekologią polityczną]], kolejną
      subdziedziną akademicką. Jest przydatna również w analizie wydarzeń historycznych,
      takich jak [[Historia Wyspy Wielkanocnej|Syndrom Wyspy Wielkanocnej]].

      == Historia ==

      Termin „ekologia kulturowa” został wprowadzony przez antropologa kulturowego
      [[Julian Steward|Juliana Stewarda]], który przedstawił go jako [[Metodologia|metodologię]]
      pozwalającą na badanie, w jaki sposób ludzkość dostosowuje się do różnorodnych
      środowisk. W ''''Theory of Culture Change: The Methodology of Multilinear Evolution''''{{Cytuj
      |autor = Julian H. Steward |tytuł = The theory of culture change ; the methodology
      of multilinear evolution |data = 1963 |data dostępu = 2020-01-20 |wydawca =
      Univ. Press |oclc = 637635103}}. Steward opisuje ekologię kulturową jako „sposoby,
      w jakie zmiana kulturowa jest wywoływana poprzez dostosowywanie się do środowiska”.
      Kluczową kwestią jest to, że każda konkretna adaptacja człowieka jest częściowo
      odziedziczona historycznie i obejmuje technologie, praktyki i wiedzę, które
      pozwalają ludziom żyć w danym środowisku. Oznacza to, że pomimo wpływu, jaki
      środowisko wywiera na sposób ludzkiej adaptacji, nie jest ono jedynym determinującym
      ją czynnikiem. W ten sposób Steward wprowadza rozróżnienie pomiędzy [[Zmienna
      środowiskowa|zmiennymi środowiskowymi]] a wewnętrznym dostosowaniem [[Kultura|kultury]]
      rozwijającej się w danym środowisku. W perspektywie długoterminowej oznacza
      to, że środowisko i kultura są w pewnym sensie osobnymi ścieżkami ewolucyjnymi,
      a zdolność jednego z tych czynników do wywierania wpływu na drugi zależy od
      wewnętrznej struktury każdego z nich. To twierdzenie, że środowisko fizyczne
      i biologiczne wpływa na kulturę - okazało się kontrowersyjne, ponieważ implikuje
      element [[Determinizm środowiskowy|determinizmu środowiskowego]] wobec ludzkich
      działań, co niektórzy badacze nauk społecznych, w szczególności osoby piszące
      z perspektywy [[Marksizm|marksistowskiej]], uważają za problematyczne. Ekologia
      kulturowa uznaje, że uwarunkowania ekologiczne odgrywają znaczącą rolę w kształtowaniu
      kultur danego regionu.

      === Metodologia zaproponowana przez Stewarda ===

      Zastosowana przez Stewarda metodologia polegała na:

      # Dokumentacji technologii i metod wykorzystywanych do eksploatacji środowiska
      w celu utrzymywania się z jego zasobów.

      # Obserwacji wzorców ludzkich zachowań / kultury związanych z korzystaniem ze
      środowiska.

      # Ocenie, w jaki sposób te wzorce zachowań wpłynęły na inne aspekty kultury
      (np. w jaki sposób, w regionie podatnym na suszę, duże zaniepokojenie związane
      z wzorcami opadów spowodowało, że stały się one jednym z podstawowych aspektów
      życia codziennego, i doprowadziło do rozwoju systemu wierzeń, w którym opady
      deszczu i woda zajmowały kluczową pozycję. Taki system przekonań może nie pojawić
      się w społeczeństwie, w którym obfite opady deszczu, wystarczające dla rozwoju
      roślinności, można uznać za coś oczywistego lub w którym praktykowano nawadnianie).

      === Wpływ na naukę ===

      Koncepcja ekologii kulturowej wypracowana przez Stewarda stała się popularna
      wśród antropologów i archeologów w połowie XX wieku, choć później spotkali się
      oni z krytyką ze względu na swój [[determinizm środowiskowy]]. Ekologia kulturowa
      była jednym z głównych założeń i czynników napędzających rozwój [[Archeologia
      procesualna|archeologii procesualnej]] w latach 60. XX wieku, ponieważ archeolodzy
      pojmowali zmianę kulturową w ramach technologii i wpływu wywieranego przez nią
      na adaptację środowiskową.

      == W antropologii ==

      Ekologia kulturowa w formie opracowanej przez Stewarda jest jedną z głównych
      subdyscyplin antropologii. Wywodzi się z prac [[Franz Boas|Franza Boasa]] i
      rozszerzyła się na wiele aspektów ludzkiego społeczeństwa, w szczególności podział
      bogactwa i władzy w społeczeństwie oraz to, jak wpływ wywiera na takie zachowania
      jak [[gromadzenie]] lub [[obdarowywanie]] (np. tradycja [[Potlacz|poltacz]]
      na północno-zachodnim wybrzeżu Ameryki Północnej).

      == Jako projekt interdyscyplinarny ==

      Jedna z koncepcji ekologii kulturowej powstałych w latach dwutysięcznych jest
      ogólną teorią, która traktuje [[Ekologia|ekologię]] jako [[paradygmat]] nie
      tylko dla [[Nauki przyrodnicze|nauk przyrodniczych]] i [[Antropologia|antropologicznych]],
      ale także dla [[Kulturoznawstwo|kulturoznawstwa]]. W ''''Die Ökologie des Wissens''''
      [[Peter Finke]] wyjaśnia, że teoria ta łączy różne kultury wiedzy, które wyewoluowały
      w historii i które zostały podzielone na coraz bardziej wyspecjalizowane dyscypliny
      i subdyscypliny w ewolucji współczesnej nauki{{Cytuj |autor = Peter Finke |tytuł
      = Die Ökologie des Wissens. Exkursionen in eine gefährdete Landschaft |data
      = 2005}}. W tym ujęciu ekologia kulturowa uznaje sferę kultury ludzkiej nie
      za odrębną, lecz współzależną i przekształcaną przez procesy ekologiczne i naturalne
      cykle energetyczne. Jednocześnie uznaje względną niezależność i autorefleksyjną
      dynamikę procesów kulturowych. Ze względu na to, że koncepcja zależności kultury
      od przyrody i uwzględnienie nieuniknionej obecności przyrody w kulturze zyskuje
      [[Interdyscyplinarność|interdyscyplinarne]] znaczenie, różnica między ewolucją
      kultury a ewolucją naturalną jest coraz bardziej zauważana przez ekologów kulturowych.
      W miejsce praw genetycznych, informacje i komunikacja stały się głównymi siłami
      napędowymi ewolucji kulturowej{{Cytuj |autor = Peter Finke |tytuł = Die Evolutionäre
      Kulturökologie: Hintergründe, Prinzipien und Perspektiven einer neuen Theorie
      der Kultur |czasopismo = Anglia - Zeitschrift für englische Philologie |data
      = 2006-01-07 |data dostępu = 2019-11-26 |issn = 0340-5222 |wolumin = 124 |numer
      = 1 |doi = 10.1515/angl.2006.175}}. Przyczynowe deterministyczne prawa nie mają
      zatem zastosowania do kultury w ścisłym tego słowa znaczeniu, istnieją jednak
      wartościowe analogie, które można znaleźć pomiędzy procesami ekologicznymi i
      kulturowymi.

      [[Gregory Bateson]] jako pierwszy nakreślił takie analogie w ''''Steps to an
      Ecology of Mind'''', opierając je na ogólnych zasadach złożonych dynamicznych
      procesów życiowych, np. koncepcja pętli [[Sprzężenie zwrotne|sprzężenia zwrotnego]],
      która, w jego opinii, funkcjonowała zarówno pomiędzy umysłem i światem, jak
      i wewnątrz samego umysłu{{Cytuj |autor = Daniel Foxman, Gregory Bateson |tytuł
      = Steps to an Ecology of Mind |czasopismo = The Western Political Quarterly
      |data = 1973-06 |data dostępu = 2019-11-26 |issn = 0043-4078 |wolumin = 26 |numer
      = 2 |s = 345 |doi = 10.2307/446833}}. Bateson nie postrzega umysłu ani jako
      autonomicznej, metafizycznej siły, ani jako zwykłej neurologicznej funkcji mózgu,
      lecz jako „odhierarchizowaną koncepcję wzajemnej zależności między (ludzkim)
      organizmem a jego (naturalnym) środowiskiem, podmiotem i przedmiotem, kulturą
      i przyrodą”, a zatem jako „synonim [[Cybernetyka|cybernetycznego]] systemu obwodów
      informacyjnych, które są istotne dla przetrwania gatunku”{{Cytuj |autor = Christa
      Grewe-Volpp |tytuł = Natur – Kultur – Text: Beiträge zu Ökologie und Literaturwissenschaft,
      ed. Catrin Gersdorf & Sylvia Mayer |czasopismo = Anglia - Zeitschrift für englische
      Philologie |data = 2007-01 |data dostępu = 2019-11-26 |issn = 0340-5222 |wolumin
      = 125 |numer = 1 |doi = 10.1515/angl.2007.160}}.

      Finke łączy te pomysły z koncepcjami z [[Teoria systemów|teorii systemów]].
      Opisuje różne sekcje i podsystemy społeczeństwa jako „[[Ekosystem kulturowy|ekosystemy
      kulturowe]]” z własnymi procesami produkcji, konsumpcji i redukcji energii (zarówno
      fizycznej, jak i psychicznej). Dotyczy to także kulturowych ekosystemów sztuki
      i literatury, które podążają za swoimi wewnętrznymi siłami selekcji i samoodnawiania,
      ale pełnią także ważną funkcję w całym systemie kulturowym{{Cytuj |autor = Peter
      Finke |redaktor = Darrel P. Arnold |tytuł = A Brief Outline of Evolutionary
      Cultural Ecology |data = 2014 |miejsce = New York |wydawca = Routledge |praca
      = Traditions of Systems Theory}}.

      == W literaturoznawstwie ==

      Wzajemne powiązania pomiędzy kulturą a [[Przyroda|przyrodą]] były szczególnym
      przedmiotem kultury literackiej, aż od jej archaicznych początków, pojawiając
      się w [[mit]]ach, [[rytuał]]ach, ustnie przekazywanych historiach, [[legenda]]ch
      i [[Baśń|baśniach]], w gatunkach [[Literatura pasterska|literatury pasterskiej]]
      oraz [[Poezja natury|poezji natury]]. Ważne teksty tej tradycji obejmują historie
      wzajemnych przemian między życiem ludzkim i nieludzkim, których najsłynniejszym
      zbiorem są ''''Metamorfozy'''' [[Owidiusz]]a, jeden z istotniejszych tekstów
      w całej historii literatury, oddziałujący na różne kultury{{Cytuj |autor = Ovidius
      Naso, Publius, (43 a. C.-ca. 17) |tytuł = Metamorfozy. |data = cop. 2004 |data
      dostępu = 2020-01-20 |isbn = 83-04-04736-5 |wydawca = Zakład Narodowy im. Ossolińskich
      |oclc = 749448730}}. Ta uwaga poświęcana interakcjom między kulturą, a naturą
      stała się szczególnie widoczna w epoce [[romantyzm]]u, pozostając charakterystyczną
      dla literackich inscenizacji ludzkich doświadczeń aż do chwili obecnej.

      Wzajemna otwartość i symboliczne połączenie kultury i natury, umysłu i ciała,
      życia ludzkiego i nieludzkiego w sposób [[Holizm|holistyczny]], a jednocześnie
      radykalnie [[Pluralizm kulturowy|pluralistyczny]] wydaje się być jednym z istotnych
      sposobów funkcjonowania literatury i tworzenia wiedzy literackiej. Z tej perspektywy
      literaturę można opisać jako symboliczne medium szczególnie potężnej formy „ekologii
      kulturowej”{{Cytuj |autor = Hubert Zapf |tytuł = Literatur als kulturelle Ökologie
      |data = 2002-01-31 |data dostępu = 2019-11-26 |isbn = 978-3-11-094673-4 |miejsce
      = Berlin, Boston |wydawca = De Gruyter | doi=10.1515/9783110946734}}. Teksty
      literackie przedstawiały i badały, w coraz nowszych scenariuszach, złożone sprzężenie
      zwrotne pomiędzy dominującymi systemami kulturowymi, a potrzebami i przejawami
      ludzkiej i nieludzkiej „natury”. Z tego paradoksalnego aktu regresji twórczej
      czerpały one swoistą moc innowacji i kulturowego samoodnawiania.

      == W geografii ==

      W geografii ekologia kulturowa rozwinęła się w odpowiedzi na podejście [[Carla
      O. Sauer]]a do „[[Morfologia krajobrazu|morfologii krajobrazu]]”. Szkoła Sauera
      została skrytykowana za nienaukowość, a później za utrzymywanie „[[Reifikacja|reifikowanej]]”
      lub „[[Superorganizm|superorganicznej]]” koncepcji kultury{{Cytuj |autor = Duncan,
      James S.; Johnson, Nuala Christina; Schein, Richard H. |tytuł = A companion
      to cultural geography |data = 2004 |data dostępu = 2019-11-26 |isbn = 1-4051-2888-7
      |miejsce = Malden, MA |wydawca = Blackwell Pub |oclc = 55771220}}. W ekologii
      kulturowej zastosowano pomysły z ekologii i teorii systemów, aby zrozumieć proces
      dostosowywania się ludzi do środowiska. Ci ekolodzy kulturowi skupili się na
      przepływach energii i materiałów, badając, w jaki sposób przekonania i instytucje
      istniejące w kulturze regulują wymiany pomiędzy nią, a otaczającą ją ekologią
      naturalną. Według tej perspektywy ludzie stanowią taką samą część ekologii,
      jak każdy inny organizm. Ważnymi praktykami tej formy ekologii kulturowej są
      [[Karl Butzer]] i [[David Stoddart]].

      Druga forma ekologii kulturowej wprowadziła [[Teoria decyzji|teorię decyzji]]
      z ekonomiki rolnictwa, szczególnie zainspirowaną twórczością [[Aleksander Chayanov|Aleksandra
      Chayanova]] i [[Ester Boserup]]. Przedmiotem badań tych ekologów kulturowych
      był sposób, w jaki grupy ludzkie podejmują decyzje o tym, jak mają wykorzystywać
      swoje środowisko naturalne. Byli szczególnie zainteresowani kwestią intensyfikacji
      rolnictwa, udoskonalając konkurencyjne modele [[Thomas Malthus|Thomasa Malthusa]]
      i Boserup. Znani ekolodzy kulturowi w tej drugiej tradycji to [[Harold Brookfield]]
      i [[Billie Lee Turner II]]{{Cytuj |autor = Harold Brookfield |tytuł = Intensification,
      and Alternative Approaches to Agricultural Change |czasopismo = Asia Pacific
      Viewpoint |data = 2001-08 |data dostępu = 2020-01-20 |issn = 1360-7456 |wolumin
      = 42 |numer = 2‐3 |s = 181–192 |doi = 10.1111/1467-8373.00143}}. Począwszy od
      lat 80. ekologia kulturowa stała się przedmiotem krytyki ze strony [[Ekologia
      polityczna|ekologii politycznej]]. Politolodzy zarzucili, że ekologia kulturowa
      zignorowała związki między badanymi przez siebie systemami lokalnymi a globalną
      ekonomią polityczną. Dziś niewielu geografów określa się jako ekolodzy kulturowi,
      ale pomysły z ekologii kulturowej zostały przyjęte i rozwinięte przez ekologię
      polityczną, [[Nauka o zmianach gruntów|naukę o zmianach gruntów]] i [[Nauka
      o zrównoważonym rozwoju|naukę o zrównoważonym rozwoju]].

      == Koncepcje ekologii kulturowej ==

      === Gatunek ludzki ===

      Książki o kulturze i ekologii zaczęły pojawiać się w latach 50. i 60. XX wieku.
      Jedną z pierwszych opublikowanych w Wielkiej Brytanii był ''''Gatunek Homo sapiens''''
      zoologa [[Anthony Barnett|Anthony''ego Barnetta]], która ukazał się w 1950 r.
      z podtytułem ''''Biologia człowieka'''', jednakże dotyczyła znacznie węższego
      podzbioru tematów{{Cytuj |autor = S. A. (Samuel Anthony) Barnett |tytuł = The
      human species, a biology of man. |data = 1950 |data dostępu = 2020-01-20 |wydawca
      = MacGibbon & Kee |oclc = 2431432}}. Książka obejmowała problematykę kulturowego
      wpływu niektórych wyróżniających się obszarów wiedzy o środowisku w zakresie
      zdrowia i chorób, żywności, wielkości i jakości populacji człowieka oraz różnorodności
      typów jednostek ludzkich i ich umiejętności. Barnett był zdania, że wybrane
      przez niego obszary informacji „są tematami, na które wiedza jest nie tylko
      pożądana, ale także potrzebna dorosłej osobie w XX wieku”. Następnie zwrócił
      uwagę na niektóre koncepcje leżące u podstaw ekologii człowieka w odniesieniu
      do problemów społecznych, przed którymi stoją jego czytelnicy w latach 50. XX
      wieku, a także na twierdzenie, że natura ludzka nie może się zmienić, co to
      twierdzenie może oznaczać i czy jest prawdziwe. Trzeci rozdział omawia bardziej
      szczegółowo niektóre aspekty genetyki człowieka.

      Potem następuje pięć rozdziałów o ewolucji człowieka i różnicach między grupami
      ludności (lub rasami) oraz między poszczególnymi mężczyznami i kobietami w czasach
      współczesnych, w odniesieniu do wzrostu populacji (temat „różnorodności ludzkiej”).
      Ostatnie rozdziały dotyczą różnych aspektów ludzkiej populacji (temat „życia
      i śmierci”). Tak jak w przypadku innych zwierząt, dla przetrwania człowieka
      konieczne jest przezwyciężenie niebezpieczeństw głodu i infekcji, jak również
      pozostanie [[Płodność|płodnym]]. Cztery końcowe rozdziały dotyczą zatem żywności,
      chorób oraz wzrostu i spadku populacji ludzkiej.

      Barnett spodziewał się, że jego koncepcja może zostać skrytykowana, ponieważ
      pomija opis cech człowieka, które wyraźnie odróżniają ludzkość od innych zwierząt.
      Może to spowodować wysunięcie kontrargumentu, że specyfika ludzkiego zachowania
      została zignorowana, bądź też, że pomijana jest psychologia człowieka lub że
      nie bierze się pod uwagę sposobu funkcjonowania ludzkiego umysłu. Uzasadniał
      swój ograniczony pogląd, nie tym, że przywiązano niewielką wagę do pominiętych
      tematów, lecz tym, że były one tak ważne, że by opisać, lub nawet streścić każdy
      z nich potrzebna by była osobna książka o podobnej objętości. Innymi słowy,
      autor został zaklasyfikowany do grona specjalistów akademickich i z tego powodu
      obawiał się przyjęcia częściowego, konceptualnego i specyficznego poglądu na
      zoologię człowieka.

      === Ekologia ===

      W Ameryce Północnej rozpoczęły się również prace nad opracowaniem sposobów na
      dostosowanie kultury ludzkiej do realiów ekologicznych. W swoim wykładzie, zatytułowanym
      „[[Ekologia człowieka]]”, wygłoszonym w Londynie w 1957 r. na Uniwersytecie
      w Oregonie, [[Paul Sears]] zalecił „zwrócenie szczególnej uwagi na ekologię
      człowieka” i postulował „jej umiejętne zastosowanie w sprawach człowieka”. Sears
      był jednym z nielicznych znaczących ekologów, który z powodzeniem popularyzował
      wiedzę w tej dziedzinie. Badacz dokumentuje błędy, które popełnili amerykańscy
      rolnicy, tworząc warunki, które doprowadziły do katastrofalnego w skutkach [[Dust
      Bowl]]. Ta książka przyczyniła się do rozwoju ruchu ochrony gleb w Stanach Zjednoczonych{{Cytuj
      |autor = Paul B. (Paul Bigelow) Sears |tytuł = Deserts on the march |data =
      1988 |data dostępu = 2020-01-20 |isbn = 0-933280-46-7 |wydanie = Island Press
      ed |miejsce = Washington, D.C. |wydawca = Island Press |oclc = 18415426}}.

      === Wpływ na przyrodę ===

      W tym samym czasie [[J.A. Lauwerys]] opublikował ''''Man''s Impact on Nature'''',
      jako część serii ''''Interdependence in Nature'''' wydanej w 1969 roku{{Cytuj
      |autor = Joseph A. Lauwerys |tytuł = Man''s impact on nature |data = 1969 |data
      dostępu = 2019-12-17 |wydawca = Aldus Books |oclc = 644543107}}. Zarówno książka
      Lauwery''a, jak i publikacja Rusella{{Cytuj |autor = W.M.S Russel |tytuł = Man
      Nature and History |data = 1967 |miejsce = London |wydawca = Aldus Books}} dotyczyły
      ekologii kulturowej, choć nie używały tego określenia. Nawet ''''Beginnings
      and Blunders'''', wydane w 1970 roku przez [[Polihistor|wszechstronnego badacza]],
      w tym zoologa, [[Lancelot Hogben|Lancelota Hogbena]], z podtytułem ''''Before
      Science Begun'''', używały antropologii jako tradycyjnego punktu odniesienia{{Cytuj
      |autor = Lancelot Hogben |tytuł = Beginnings and Blunders |data = 1970 |miejsce
      = London |wydawca = Heinemann}}. Jednakże zaprezentowane tam poglądy wskazują
      na to, że bardziej trafnym tytułem, odzwierciedlającym to, jak Hogben przedstawił,
      w jaki sposób wczesne społeczeństwa dostosowały się do środowiska za pomocą
      narzędzi, technologii i [[Grupa społeczna|grup społecznych]], byłaby „ekologia
      kulturowa”. W 1973 roku fizyk Jacob Bronowski opublikował książkę ''''The Ascent
      of Man'''', stanowiącą podsumowanie trzynastoczęściowego serialu telewizyjnego
      BBC opisującego w szeroki sposób wpływ człowieka na ukształtowanie Ziemi i jej
      przyszłość{{Cytuj |autor = Jacob Bronowski |tytuł = The Ascent of Man |data
      = 1973 |miejsce = London |wydawca = BBC Publications}}.

      === Zmienianie Ziemi ===

      W latach 80. XX wieku dominowała koncepcja [[Funkcjonalna ekologia człowieka|funkcjonalnej
      ekologii człowieka]]. Stał się konwencjonalnym sposobem przedstawiania koncepcji
      naukowych w perspektywie ekologicznej dominacji człowieka jako gatunku w przeludnionym
      świecie, stawiając sobie za praktyczny cel stworzenie bardziej ekologicznej
      („zielonej”) kultury. Przykładem jest książka Iana Simmonsa ''''Changing the
      Face of the Earth,'''' wydana w 1989 roku{{Cytuj |autor = I. G. (Ian Gordon)
      Simmons |tytuł = Changing the face of the earth : culture, environment, history
      |data = 1996 |data dostępu = 2020-01-20 |isbn = 0-631-19924-1 |wydawca = Blackwell
      |oclc = 1083063212}}. Simmons był geografem, a jego książka była hołdem dla
      wpływu, który wywarło wielotomowe dzieło pod redakcją W. L.Thomasa ''''Man''s
      role in ''Changing the Face of the Earth''''{{Cytuj |autor = William Leroy Thomas
      |tytuł = Man''s role in changing the face of the earth. |data = [1956] |data
      dostępu = 2020-01-20 |isbn = 0-226-79604-3 |miejsce = Chicago, |wydawca = Published
      for the Wenner-Gren Foundation for Anthropological Research and the National
      Science Foundation by the University of Chicago Press |oclc = 276231}}.

      Książka Simmonsa była jedną z wielu interdyscyplinarnych publikacji o kulturze
      i środowisku w latach 70. i 80. XX wieku, które wywołały kryzys w klasycznej
      metodologii geografii w zakresie przedmiotu badań, subdziedzin akademickich
      i zakresu całej dziedziny. Problem ten rozwiązano poprzez oficjalne przyjęcie
      ram koncepcyjnych jako podejścia ułatwiającego organizację badań i nauczania,
      które zmieniają tradycyjne podziały tematyczne. Ekologia kulturowa jest w rzeczywistości
      szerokim obszarem pojęciowym który w ciągu ostatnich sześćdziesięciu lat pozwolił
      socjologom, fizykom, zoologom i geografom wejść na wspólną płaszczyznę intelektualną,
      wychodząc poza granice swoich specjalistycznych dziedzin.

      === XXI wiek ===

      W pierwszej dekadzie XXI wieku pojawiają się publikacje dotyczące sposobów,
      dzięki którym ludzie mogliby rozwijać bardziej akceptowalne relacje kulturowe
      ze środowiskiem. Przykładem jest sacred ecology („[[uświęcona ekologia]]”),
      jeden z tematów, poruszanych w ramach ekologii kulturowej, wprowadzona przez
      Fikreta Berkesa w 1999 r.{{Cytuj |autor = Peter J. Usher |tytuł = Sacred Ecology,
      Traditional Ecological Knowledge and Resource Management, by Fikret Berkes |czasopismo
      = ARCTIC |data = 2000-01-01 |data dostępu = 2019-12-17 |issn = 1923-1245 |wolumin
      = 53 |numer = 2 |doi = 10.14430/arctic887}}. Proponuje ona korzystanie z doświadczeń
      mieszkańców Północnej Kanady i ich tradycyjnych sposobów życia w kształtowaniu
      nowego postrzegania środowiska przez mieszkańców miast. Ta szczególna koncepcja
      zależności ludzi i środowiska wywodzi się z różnych kulturowych poziomów lokalnej
      wiedzy na temat gatunków, miejsc oraz systemów zarządzania zasobami z wykorzystaniem
      lokalnych doświadczeń, instytucji społecznych z ich regułami i kodeksami zachowania
      oraz poglądów na świat ukształtowanych religię, etykę i szeroko pojęte systemy
      przekonań .

      Pomimo różnic w koncepcjach informacyjnych, wszystkie te publikacje niosą przesłanie,
      że kultura jest poszukiwaniem równowagi pomiędzy sposobem myślenia opartym na
      eksploatacji zasobów naturalnych a tym, który dąży do ich ochrony i zachowania.
      Jednym z wyrazistszych przykładów działania ekologii kulturowej są nieudane
      próby wprowadzenia europejskich praktyk rolniczych na niedostosowanych do tego
      glebach, w miejsce tradycyjnych dla danego regionu metod uprawy ziemi. Istnieje
      sacred ecology, związana ze świadomością ekologiczną, a zadaniem ekologii kulturowej
      jest inspirowanie mieszkańców miast do rozwijania bardziej akceptowalnych trwałych
      relacji kulturowych ze środowiskiem, w którym funkcjonują i które ich zaopatruje.

