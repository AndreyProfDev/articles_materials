      === Turcja ===

      Artykuł 301 tureckiego kodeksu karnego zakazuje obrażania Turcji, narodu tureckiego,
      tureckich instytucji rządowych lub tureckich bohaterów narodowych, takich jak
      [[Mustafa Kemal Atatürk]].

      === Ukraina ===

      {{Główny artykuł|Ukraińska polityka historyczna}}

      === Węgry ===

      Po 1989 roku Węgrzy też stworzyli własną historiografię o zbiorowym cierpieniu
      podczas i po [[II wojna światowa|II wojnie światowej]]. Od lat 2000. w wielu
      węgierskich wsiach na Zakarpaciu znajdują się pomniki ofiar powojennych represji,
      często przerobione z tryumfalnych pomników postawionych w okresie [[Węgierska
      Republika Ludowa (1949–1989)|Węgierskiej Republiki Ludowej (1949–1989)]]{{Cytuj
      |tytuł = Heroes into victims: The Second World War in post-Soviet memory politics
      |data dostępu = 2021-12-14 |opublikowany = eurozine.com |url = https://www.eurozine.com/heroes-into-victims/}}.

