- sections:
  - content: "{{inne znaczenia|historii gatunku ludzkiego|[[Historia Ziemi]]}}\n{{Spis\
      \ treści}}\n'''Historia świata''' zwyczajowo utożsamiana jest z [[Historia|historią]]\
      \ gatunku ludzkiego, liczoną od momentu pojawienia się na świecie pierwszych\
      \ ''[[człowiek rozumny|Homo sapiens]]'' do czasów dzisiejszych. Historia rodzaju\
      \ ludzkiego znaczona jest stopniowym rozwojem [[wynalazek|wynalazczości]] i\
      \ [[Kalendarium historii nauki|odkrywczości]], jak też wydarzeniami mającymi\
      \ gwałtowną naturę – [[rewolucja]]mi - definiującymi [[Periodyzacja|epoki]]\
      \ w rozwoju [[materiał|materialnym]] i [[duchowość|duchowym]] ludzkości.\nW\
      \ przeszłości ustalano początek ''historii rodzaju ludzkiego'' w odróżnieniu\
      \ od ''[[prehistoria|prehistorii]]'', w momencie niezależnego wynalezienia w\
      \ kilku miejscach [[Ziemia|Ziemi]] [[pismo|pisma]], które dało początek swoistej\
      \ [[infrastruktura|infrastrukturze]] umożliwiającej uwiecznianie i przekazywanie\
      \ kolejnym pokoleniom pamięci rodzaju ludzkiego, a przez to rozprzestrzenianie\
      \ i wzrost [[wiedza|wiedzy]]Według ''[[Encyclopedia Americana]]'' z roku 1986,\
      \ tom 29, s. 558: „Writing gives permanence to men's knowledge and enables them\
      \ to communicate over great distances.... The complex society of a higher civilization\
      \ would be impossible without the art of writing”.. Pismo z kolei stało się\
      \ niezbędnym wskutek rewolucji agrarnej z epoki [[neolit]]u, (tzw. [[rewolucja\
      \ neolityczna]]) która spowodowała wyłonienie [[Cywilizacja|cywilizowanych]],\
      \ osiedlonych w stałych siedzibach społeczeństw, co umożliwiało opracowanie\
      \ systemu społecznego [[podział pracy|podziału pracy]].\nRozproszone społeczności,\
      \ najczęściej zlokalizowane w pobliżu niezbędnej dla życia [[woda|wody]] (rzek\
      \ i jezior) z czasem przeistaczały się w coraz większe jednostki, co szło w\
      \ parze z opracowywaniem coraz efektywniejszych [[środek transportu|środków\
      \ transportu]]. Spajanie społeczności, przerywane chwilowymi [[wojna|konfliktami]]\
      \ i rywalizacją pomiędzy przyległymi grupkami osadniczymi przez [[tysiąclecie|milenia]]\
      \ doprowadziło do powstania jeszcze większych jednostek społecznych – [[państwo|państw]]\
      \ – a nawet [[imperium|imperiów]]. Upadek europejskiego [[Cesarstwo Rzymskie|Imperium\
      \ Rzymskiego]], który dokonał się pod koniec ery [[starożytność|starożytnej]],\
      \ oznaczał początki [[średniowiecze|średniowiecza]].\nW połowie XV wieku [[Johannes\
      \ Gutenberg]] wynalazł [[druk]] bazujący na ruchomych czcionkach, co doprowadziło\
      \ do zupełnego przeorganizowania sposobów komunikacji między ludźmi. Druk odegrał\
      \ ważną rolę w zamknięciu historii średniowiecznej i przeniesienia historii\
      \ do czasów [[Nowożytność|nowożytnych]], podczas których nastąpiła między innymi\
      \ epoka [[Renesans]]u, czy [[rewolucja przemysłowa]].\nDo XVIII wieku gromadzenie\
      \ wiedzy i zdobycze technologiczne, szczególnie w [[Europa|Europie]], spowodowało\
      \ powstanie pewnej „[[masa krytyczna|masy krytycznej]]”, która zainicjowała\
      \ [[rewolucja przemysłowa|rewolucję przemysłową]]. Przez ostatnie 250 lat, od\
      \ czasów owej rewolucji, postęp wiedzy, technologii, handlu i - w nieunikniony\
      \ sposób - sztuki wojennej można wyrażać [[ciąg geometryczny|wykładniczo]],\
      \ sprawiając, że dzisiejszy świat i ludzie żyjący na planecie o skończonej ilości\
      \ zasobów stają zarówno w obliczu szans, jak i zagrożeń.\n== Paleolit ==\n{{osobny\
      \ artykuł|Paleolit}}\n[[Plik:World map of prehistoric human migrations.jpg|mały|350px|Mapa\
      \ migracji wczesnych ludzi opracowana w oparciu o dane genetyczne. Liczby oznaczają\
      \ milenia wstecz. (prawidłowość mapy została podważona)]]\n\"Paleolit\" to inaczej\
      \ wczesna epoka kamienia.\nDowody naukowe oparte na badaniach genetycznych i\
      \ [[paleontologia|paleontologii]] umiejscawiają pierwszych przedstawicieli gatunku\
      \ ''[[człowiek rozumny|Homo sapiens]]'' w [[Afryka|Afryce]]{{cytuj stronę |url=http://www.actionbioscience.org/evolution/johanson.html\
      \ |tytuł=Origins of Modern Humans: Multiregional or Out of Africa? |nazwisko=Johanson\
      \ |imię=Donald |data dostępu=2007-04-12 |archiwum=https://www.webcitation.org/5uQpZnojk?url=http://www.actionbioscience.org/evolution/johanson.html\
      \ |zarchiwizowano=22 listopada 2010 }}. Pojawili się oni około dwustu tysięcy\
      \ lat temu w epoce [[paleolit]]u, co stanowiło zwieńczenie długiego okresu [[ewolucja|ewolucji]]\
      \ rodzaju ''homo''. Przodkowie 'ludzi rozumnych', gatunki pokroju ''[[Homo erectus]]'',\
      \ korzystały z prostych narzędzi od około miliona lat, a z biegiem czasu narzędzia\
      \ te stawały się coraz bardziej wyrafinowane i skomplikowane. Ludzkość paleolityczna\
      \ wykształciła również [[język (mowa)|język]], jak też repertuar obrządków,\
      \ który przewidywał między innymi ceremonię [[pogrzeb|pochówku zmarłych]]. [Oznaczało\
      \ to, że ludzie paleolitu charakteryzowali się przywiązaniem do wspomnień, nie\
      \ chcąc oglądać gnijących ciał.]{{fakt|data=2017-11}} Ludzie paleolitu żyli\
      \ z łowiectwa i zbieractwa, prowadząc zwykle wędrowny tryb życia. W okresie\
      \ tym pojawiły się też pierwsze oznaki [[Sztuka prehistoryczna|prehistorycznej\
      \ sztuki]].\nKontrowersyjna [[Katastrofa wulkanu Toba|teoria katastrofy jeziora\
      \ Toba]] sugeruje, że ostatnia [[Superwulkan|erupcja superwulkanu]] [[Toba (jezioro)|Toba]],\
      \ która wydarzyła się ok. 75 tys. lat temu, mogła mieć [[glob]]alne skutki,\
      \ zabijając większość przedstawicieli gatunku ludzkiego.\nWspółczesny gatunek\
      \ ludzki rozprzestrzeniał się szybko po całej powierzchni kuli ziemskiej, od\
      \ [[Afryka|Afryki]], poprzez wolne od zlodowacenia obszary [[Europa|Europy]],\
      \ aż do [[Azja|Azji]]. Szczyt ekspansji ludności na terenach [[Ameryka Północna|Ameryki\
      \ Północnej]] i [[Oceania|Oceanii]] nastąpił podczas ostatniego [[zlodowacenie|zlodowacenia]]\
      \ – wtedy tereny objęte klimatem umiarkowanym nie nadawały się do zasiedlenia.\
      \ Mimo niedogodności, pod koniec ostatniego zlodowacenia, czyli około 12 tysięcy\
      \ lat temu, ludzkość zdołała skolonizować prawie wszystkie wolne od lodu części\
      \ planety.\nSpołeczeństwa pozyskujące żywność ze zbieractwa i myślistwa zwykle\
      \ były niezbyt liczne, choć istnieją wśród pierwszych skupisk ludzi przypadki\
      \ rozbudowanego systemu społecznego. Możliwa również była komunikacja między\
      \ społecznościami podzielonymi dużą odległością, czego przykładem są „autostrady”\
      \ [[Aborygeni australijscy|Aborygenów]].\nWiększość wędrujących grup polujących\
      \ i zbierających żywność została albo przekształcona w większe społeczeństwa\
      \ rolnicze, albo przez takie społeczeństwa wchłonięta. Pozostałe grupki ludności\
      \ albo wyginęły, albo pozostały w izolacji. Takie skupiska ludności spotykane\
      \ są jeszcze dziś w oddalonych od cywilizacji regionach.\n== Mezolit ==\n{{osobny\
      \ artykuł|Mezolit}}\n[[Plik:Canoe.jpg|mały|230px|[[dłubanka|Łódź dłubanka]]]]\n\
      Mezolit, czyli średnia epoka kamienia (z [[język grecki|języka greckiego]] „''mezos''”\
      \ - „środkowy”, „''lithos''” - „kamień”) to okres rozwoju technicznego ludzkości\
      \ - etap przejścia z paleolitu do neolitu.\nMezolit rozpoczął się pod koniec\
      \ [[plejstocen]]u, około 10 tysięcy lat temu, zakończył się zaś wraz z wprowadzeniem\
      \ [[rolnictwo|rolnictwa]]. Zamknięcie epoki mezolitycznej datuje się różnie\
      \ w różnych częściach świata. Dla przykładu, na [[Bliski Wschód|Bliskim Wschodzie]]\
      \ rolnictwo istniało już pod koniec [[plejstocen]]u, więc epoka mezolityczna\
      \ na tych obszarach jest krótka i skąpo opisana. W odniesieniu do obszarów,\
      \ gdzie zlodowacenie było najwyżej częściowe, zamiast określenia „mezolit” spotyka\
      \ się czasami słowo [[mezolit|epipaleolit]].\nW regionach, gdzie zmiany klimatyczne\
      \ po ostatnim zlodowaceniu były poważniejsze, era mezolityczna utrzymywała się\
      \ dłużej, czasami nawet całe milenia. Społeczności zamieszkujące Europę Północną\
      \ były w stanie utrzymać się przy życiu dzięki bagnistym obszarom, których istnieniu\
      \ sprzyjało ocieplenie klimatu. Warunki klimatyczne znalazły odzwierciedlenie\
      \ w zachowaniu zamieszkujących określone obszary społeczności, co widać w zachowanych\
      \ śladach [[Kultura maglemoska|kultury maglemoskiej]] i [[Kultura azylska|azylskiej]].\
      \ Kwestie środowiskowe dodatkowo opóźniły nastanie neolitu w północnej Europie\
      \ do około 4000 roku p.n.e.\nPozostałości z epoki mezolitycznej są rzadkością\
      \ i najczęściej ograniczają się do odpadków z domostw. W obszarach zalesionych\
      \ znaleźć można pozostałości wyrębu drzew z tego właśnie okresu, choć szerzej\
      \ zakrojona wycinka lasów nastąpiła dopiero w [[neolit|neolicie]], wraz z rosnącym\
      \ zapotrzebowaniem na ziemię pod uprawy.\nZ epoki mezolitu w większości obszarów\
      \ pozostały małe złożone narzędzia krzemienne – [[mikrolit]]y i [[mikroburin]]y.\
      \ Gdzieniegdzie znaleziono również osprzęt wędkarski, topory ciesielskie i obiekty\
      \ drewniane - łodzie i łuki. Przykłady nowszych technologii pojawiły się najwcześniej\
      \ w [[Afryka|Afryce]], co należy skojarzyć z kulturą azylską, po czym przeniknęły\
      \ do [[Europa|Europy]] dzięki wczesnym plemionom <!--Ibero - Maurusian-->zamieszkującym\
      \ obszary dzisiejszej [[Hiszpania|Hiszpanii]] i [[Portugalia|Portugalii]] oraz\
      \ plemionom <!--Kebaran--> zamieszkującym [[Palestyna|Palestynę]]. Niewykluczone\
      \ jest, że bardziej zaawansowane narzędzia pojawiły się w kilku miejscach równocześnie,\
      \ za sprawą wzajemnie niezależnego postępu cywilizacyjnego.\n== Neolit ==\n\
      {{osobny artykuł|Neolit}}\nSłowo „Neolit” oznacza „nową epokę kamienia”. Był\
      \ to okres rozwoju prymitywnych technologii i społeczeństw, zamykający epokę\
      \ kamienia. Początek epoki datuje się na 10 tysięcy lat p.n.e., zaś osiągnięcia\
      \ epoki obejmują osiedlanie się ludzi we [[wieś|wsiach]], rozwój [[rolnictwo|rolnictwa]],\
      \ udomowienie zwierząt i rozwój [[narzędzie|narzędzi]].\n=== Rozwój rolnictwa\
      \ ===\n{{osobny artykuł|Rolnictwo}}\n[[Plik:Maler der Grabkammer des Sennudem\
      \ 001.jpg|mały|lewo|240px|[[Krowa]] i [[pług]] – namalowana w [[Starożytny Egipt|Starożytnym\
      \ Egipcie]], około 1200 roku p.n.e]]\nWażną zmianą, która zaszła w neolicie,\
      \ według historyka [[Vere Gordon Childe]] określaną jako „rewolucja agrarna”\
      \ jest przestawienie się społeczności na pozyskiwanie żywności z rolnictwa około\
      \ 10 tysięcy lat p.n.e. Około 9500 roku p.n.e. uprawę roli podjęli mieszkańcy\
      \ [[Żyzny Półksiężyc|Żyznego Półksiężyca]]. Do roku 7000 p.n.e. rolnictwo zakorzeniło\
      \ się w [[Indie|Indiach]], a do roku 6000 p.n.e. w [[Egipt|Egipcie]]. Około\
      \ 5 tysięcy lat p.n.e. ziemię uprawiali [[Chińska Republika Ludowa|Chińczycy]],\
      \ a ślady działalności rolniczej w [[Ameryka Środkowa|Ameryce Środkowej]] datuje\
      \ się na około 2700 lat p.n.e.\nMimo że odkrycia archeologów z epoki neolitu\
      \ pochodzą raczej z [[Żyzny Półksiężyc|Żyznego Półksiężyca]] na [[Bliski Wschód|Bliskim\
      \ Wschodzie]], ślady z kontynentu [[ameryka]]ńskiego oraz wschodniej i południowo-wschodniej\
      \ [[Azja|Azji]] pokazują, że rolnictwo wykorzystujące różne rośliny uprawne\
      \ i zwierzęta hodowlane mogło się rozwinąć w tych miejscach w tym samym czasie,\
      \ co na Środkowym Wschodzie.\nDalszy rozwój rolnictwa na Środkowym Wschodzie\
      \ nastąpił w wyniku opracowania przez Sumerów około 5500 lat p.n.e. zorganizowanego\
      \ [[irygacja (rolnictwo)|nawadniania pól uprawnych]] i wykorzystania na polach\
      \ specjalizowanej siły roboczej. Kamień został wyparty przez brąz i żelazo -\
      \ zarówno w uprawie roli, jak i w sztuce wojennej. Do tego czasu siedliska rolnicze\
      \ były w zupełności zależne od zapasów kamienia. W Eurazji narzędzia, broń i\
      \ ozdoby z [[miedź|miedzi]] i [[brązy|brązu]] pojawiły się około 3 tysięcy lat\
      \ p.n.e. Na wschodzie rejonu śródziemnomorskiego, [[Bliski Wschód|Bliskim Wschodzie]]\
      \ i w [[Chińska Republika Ludowa|Chinach]] w późniejszych latach pojawiły się\
      \ broń i narzędzia z żelaza.\nMieszkańcy Ameryki prawdopodobnie nie wykształcili\
      \ metod produkcji narzędzi z metalu do roku 900 p.n.e. (czasy [[kultura Chavín|kultury\
      \ Chavin]]). Przedstawiciele [[kultura Mochica|kultury Mochica]] korzystali\
      \ jednak z metalowych zbroi, noży i zastawy stołowej. Nawet [[Państwo Inków|Inkowie]],\
      \ nieposiadający dostępu do bogatych złóż metali, posiadali pługi zakończone\
      \ metalowymi lemieszami, przynajmniej od czasu podboju ludu [[Chimú]]. Niewiele\
      \ jak do tej pory wiadomo o rdzennych mieszkańcach dzisiejszego [[Peru]], a\
      \ [[kipu]] (forma zapisu informacji wykorzystywana przez Inków) spłonęły podczas\
      \ podboju Peru przez Hiszpanów. Nawet w roku [[2004]] archeolodzy odnajdywali\
      \ na terenie Peru starożytne miasta. Niektóre z wykopalisk sugerują jednak,\
      \ że [[stal]] mogła być wykorzystywana w Ameryce jeszcze zanim pojawiła się\
      \ w Europie.\nOśrodki, gdzie skupiała się ludność neolitu leżały w pobliżu [[rzeka|rzek]]\
      \ i [[kotlina|kotlin]] – przykłady to dolina [[Huang He|Żółtej Rzeki]] w Chinach,\
      \ [[Nil]]u w [[Egipt|Egipcie]], czy [[Indus]]u na [[subkontynent indyjski|subkontynencie\
      \ indyjskim]]. Niektóre plemiona prowadzące wędrowny tryb życia, jak na przykład\
      \ rdzenni Australijczycy i [[Buszmeni]] z południowej Afryki, nie przestawiły\
      \ się na produkcję rolną do względnie późnych lat.\nDo 1800 roku nie wszystkie\
      \ skupiska ludności były jeszcze upaństwowione. Naukowcy nie są zgodni co do\
      \ tego, czy takie grupy można już nazwać [[plemię|plemionami]]. Czynnikiem przyspieszającym\
      \ transformację struktur plemiennych w państwa europejskie i pozaeuropejskie\
      \ było zagrożenie lub innego rodzaju wpływ upaństwowionych społeczeństw. Przykładami\
      \ mogą być [[Markomanowie]], plemiona [[Polska|polskie]] i [[Litwa|litewskie]].\
      \ Niektóre plemiona, takie jak [[Kasyci]] czy [[Mandżurowie]] podbijali inne\
      \ państwa, po czym byli przez nie wchłaniani.\nRolnictwo umożliwiło powstanie\
      \ złożonych społeczeństw – [[cywilizacja|cywilizacji]]. Pojawiały się państwa\
      \ i handel. Rozwój technologiczny dawał ludziom możliwość wpływania na [[Natura|przyrodę]]\
      \ i rozwoju [[transport]]u oraz [[Wikisłownik|komunikacji]].\n=== Rozwój religii\
      \ ===\nWłaśnie w epoce neolitu większość historyków dopatruje się początków\
      \ złożonych [[religia|religii]]. Wierzenia religijne tego okresu najczęściej\
      \ ograniczały się do kultu bogini-matki, ojca-nieba oraz [[Słońce|Słońca]] i\
      \ [[Księżyc]]a w roli bóstw (''zobacz też [[Bóstwa solarne|bóstwo solarne]]'').\
      \ Powstawały [[kapliczka|kapliczki]], po pewnym czasie przemieniane w [[świątynia|świątynie]],\
      \ które niosły ze sobą czasami skomplikowany system funkcji, w tym [[kapłan]]ów\
      \ i kapłanek. Typowym zachowaniem ludzi neolitu był kult bóstw [[Antropomorfizacja|antropomorficznych]].\n\
      == Początki cywilizacji ==\n=== Państwowość ===\n{{osobny artykuł|Państwo|Cywilizacja}}\n\
      [[Rewolucja neolityczna]] wprowadziła szereg zmian. Pozwoliła na koncentrację\
      \ zaludnienia, co z czasem doprowadziło do uformowania się pierwszych państw.\
      \ Istnieje kilka definicji słowa „państwo”. [[Max Weber]] i [[Norbert Elias]]\
      \ zasugerowali, by państwem nazywać taką organizację ludności, która ma monopol\
      \ na uzasadnione wykorzystanie siły w określonym obszarze geograficznym.\n[[Plik:Greatwall-SA3.jpg|mały|lewo|280px|Granice\
      \ definiują kształt państwa - typowym przykładem jest chiński [[Wielki Mur Chiński|Wielki\
      \ Mur]], rozciągający się na długości 6700 kilometrów. Pierwsze jego fragmenty\
      \ powstały w III wieku p.n.e., mając chronić państwo chińskie przed wędrownymi\
      \ najeźdźcami. Kilkanaście razy mur był rozbudowywany i naprawiany.]]\nPierwsze\
      \ struktury państwowe powstały w [[Mezopotamia|Mezopotamii]], [[Starożytny Egipt|starożytnym\
      \ Egipcie]] i [[Starożytne Indie|starożytnych Indiach]] pod koniec czwartego\
      \ i na początku trzeciego tysiąclecia przed naszą erą. W [[Mezopotamia|Mezopotamii]]\
      \ istniała pewna liczba [[Miasto-państwo|wolnych miast]]. Starożytny Egipt powstał\
      \ jako państwo bez miast, lecz wykształcił je w niedługim czasie.\nPaństwo z\
      \ zasady potrzebuje do egzystencji [[Siły zbrojne|armii]], by móc spełnić kryteria\
      \ przytoczonej powyżej definicji. Armia z kolei do skutecznego działania wymaga\
      \ [[biurokracja|biurokracji]]. Jedynym odstępstwem od tej reguły wydaje się\
      \ [[cywilizacja doliny Indusu]], w której przypadku nie udało się znaleźć śladów\
      \ wojska.\nPaństwa pojawiły się na obszarze Chin w późnym III lub wczesnym II\
      \ tysiącleciu przed naszą erą.\nNa [[Bliski Wschód|Bliskim Wschodzie]] pomiędzy\
      \ poszczególnymi państwami dochodziło do częstych konfliktów. Około roku 1275\
      \ p.n.e. [[Hetyci]] i starożytni Egipcjanie podpisali pokój w [[Kadesz nad Orontesem|Kadeszu]],\
      \ który był pierwszym opisanym przez historię traktatem pokojowym.\nPowstały\
      \ [[imperium|imperia]], podbijające obszary zamieszkiwane przez kolejne plemiona,\
      \ jak miało to miejsce w [[Iran|Persji]] w VI wieku p.n.e., [[Dynastia Maurjów|imperium\
      \ Maurjów]] w IV wieku p.n.e., [[Chińska Republika Ludowa|Chinach]] w III wieku\
      \ p.n.e. i [[Cesarstwo Rzymskie|cesarstwie rzymskim]] w I wieku p.n.e.\nWystępowały\
      \ również sytuacje konfliktowe między imperiami - na przykład w [[VIII wiek]]u,\
      \ kiedy to [[Półwysep Arabski|arabski]] kalifat islamski, którego rządy rozciągały\
      \ się od [[Hiszpania|Hiszpanii]] do [[Iran]]u i [[Chińska Republika Ludowa|chińska]]\
      \ dynastia Tang, której strefy wpływów obejmowały obszar od regionu [[Sinciang]]\
      \ do [[Korea|Korei]] przez dekady toczyły walki o kontrolę nad środkową Azją.\n\
      Największym imperium położonym na ciągłym obszarze było XIII-wieczne [[imperium\
      \ mongolskie]]. W tym samym czasie większość ludności zamieszkującej Europę,\
      \ Azję i Afrykę Północną należała do jakiegoś państwa. Dodatkowo państwa istniały\
      \ również na terenie [[Meksyk]]u i zachodnich obszarach [[Ameryka Południowa|Ameryki\
      \ Południowej]]. Państwa sprawowały kontrolę nad rosnącą częścią lądu i ludności;\
      \ ostatni „pusty” obszar Ziemi (nie wliczając w to niezamieszkanej [[Antarktyda|Antarktydy]]),\
      \ został podzielony pomiędzy istniejące państwa na mocy [[Traktat berliński\
      \ (1878)|traktatu berlińskiego]] z 1878 roku.<!-- Cytat? Berlin Conference/Scramble\
      \ for Africa 1884-5?-->\n=== Miasta i handel ===\n{{osobny artykuł|Miasto|Handel}}\n\
      [[Plik:Vascodagama.JPG|mały|180px|[[Vasco da Gama]] popłynął pod koniec XV i\
      \ w początkach XVI wieku do [[Indie|Indii]], aby przywieźć [[przyprawa|przyprawy]]\
      \ i uniknąć ceł za transport lądowy]]\n[[Rolnictwo]] powodowało powstawanie\
      \ nadwyżek żywności i wymuszało opracowanie metod na ich przechowywanie oraz\
      \ udostępnianie tej części populacji, która nie była bezpośrednio zaangażowana\
      \ w produkcję żywności. Rozwój rolnictwa pozwolił na powstanie pierwszych [[miasto|miast]].\
      \ Były one centrami [[handel|handlu]], [[rzemiosło|rzemiosła]] i władzy administracyjnej,\
      \ nie posiadając praktycznie infrastruktury rolniczej. Miasta istniały w stosunku\
      \ [[symbioza|symbiozy]] z otaczającymi je ośrodkami rolniczymi, przejmując nadwyżki\
      \ żywności, a w zamian oferując wyroby pozarolnicze i ochronę wojska.\nRozwój\
      \ miast nadążał za rozwojem ogólnym cywilizacji: pierwsza cywilizacja [[Sumerowie|sumeryjska]]\
      \ w dolnej [[Mezopotamia|Mezopotamii]] rozwinęła się około 3500 lat p.n.e.,\
      \ później zaś nad [[Nil]]em pojawiła się cywilizacja [[Starożytny Egipt|starożytnego\
      \ Egiptu]] (3300 p.n.e.) i [[cywilizacja doliny Indusu]] nad rzeką [[Indus]]\
      \ (również 3300 p.n.e.) Pojawiały się miasta o coraz bardziej skomplikowanej\
      \ strukturze, również w sferach społecznych i ekonomicznych. Każda z cywilizacji\
      \ była do tego stopnia odmienna od pozostałych, że prawie z całą pewnością można\
      \ mówić o ich niezależnym powstaniu. Właśnie na potrzeby rozwijających się miast\
      \ opracowane zostało [[pismo]] i złożony model [[handel|handlu]].\nW Chinach\
      \ wczesnomiejskie społeczeństwo mogło uformować się około 2500 lat p.n.e., lecz\
      \ pierwszą zdefiniowaną przez archeologów dynastią była [[dynastia Shang]].\n\
      W drugim tysiącleciu przed naszą erą powstała cywilizacja [[Kreta|kreteńska]],\
      \ [[Grecja|grecka]] (na stałym lądzie) oraz [[Turcja|turecka]].\nNa kontynentach\
      \ [[ameryka]]ńskich, a ściślej w [[Ameryka Środkowa|Ameryce Środkowej]] i na\
      \ terenach [[Peru]], cywilizacje [[Majowie|Majów]], [[Kultura Mochica|Mochica]]\
      \ i [[Kultura Nazca|Nazca]] pojawiły się pod koniec pierwszego tysiąclecia p.n.e.\n\
      Pierwszy system [[moneta]]rny wprowadzono około roku 625 p.n.e. w [[Lidia (kraina)|Lidii]],\
      \ w [[Anatolia|Anatolii]], w zachodniej [[Turcja|Turcji]]{{cytuj stronę|url=http://web.archive.org/web/20040814032824/http://rg.ancients.info/lion/article.html\
      \ |tytuł=The World’s First Coin: The Lydian Lion|data dostępu=2007-04-15|imię=Reid\
      \ |nazwisko=Goldsborough|data=2007}}.\nSzlaki handlowe pojawiły się w zachodniej\
      \ części obszaru [[Morze Śródziemne|śródziemnomorskiego]] w IV tysiącleciu p.n.e.\
      \ Dalekosiężne szlaki handlowe powstawały od III tysiąclecia p.n.e., gdy zamieszkujący\
      \ [[Mezopotamia|Mezopotamię]] [[Sumerowie]] handlowali z przedstawicielami [[Cywilizacja\
      \ doliny Indusu|cywilizacji doliny Indusu]]. [[Jedwabny Szlak]] biegł od [[Chiny|Chin]]\
      \ do [[Syria|Syrii]] w [[II wiek p.n.e.|II wieku p.n.e.]] Miasta w centralnej\
      \ [[Azja|Azji]] i [[Iran|Persji]] stanowiły ważne skrzyżowania tych dróg handlowych.\
      \ [[Fenicja]]nie i starożytna cywilizacja [[Grecja|grecka]] ustanowiły swoje\
      \ oparte na handlu imperia w obszarze Morza Śródziemnego w pierwszym tysiącleciu\
      \ p.n.e.\nPod koniec I i w początkach II tysiąclecia naszej ery nad szlakami\
      \ handlowymi dominowali [[Arabowie]] pochodzący z rejonu [[Ocean Indyjski|Oceanu\
      \ Indyjskiego]], wschodniej Azji i [[Sahara|Sahary]]. Pod koniec I tysiąclecia\
      \ handel w rejonie [[Morze Śródziemne|Morza Śródziemnego]] zdominowali [[Żydzi]].\
      \ W początkach II tysiąclecia dominację nad handlem przejęli [[Włochy|Włosi]],\
      \ a centrami handlowymi północnej Europy były miasta [[Niemcy|niemieckie]] i\
      \ [[Flamandowie|flamandzkie]]. We wszystkich obszarach ówczesnego cywilizowanego\
      \ świata większe miasta powstawały u styku szlaków handlowych.\n=== Religia\
      \ i filozofia ===\n{{osobny artykuł|Historia filozofii|Religia}}\n[[Plik:Angkor\
      \ wat temple.jpg|mały|200px|Świątynia [[Angkor Wat]], Kambodża, początek XII\
      \ wieku.]]\nPierwotnymi formami religii były [[animizm]] i [[politeizm]]. Religie\
      \ te miały charakter plemienny. Z czasem zarówno na wschodzie, jak i zachodzie\
      \ pojawiły się nowe doktryny [[filozofia|filozoficzne]] i [[religia|religijne]].\
      \ Nasilenie obserwuje się od VI wieku p.n.e. Wówczas powstało wiele nowych religii,\
      \ z czego największe to [[hinduizm]] i [[buddyzm]], które powstały na terenie\
      \ [[Indie|Indii]], oraz [[Zaratusztrianizm|zoroastryzm]] pochodzący z [[Iran|Persji]].\
      \ Korzenie [[religie abrahamowe|religii abrahamowych]], pochodzących z [[Starożytny\
      \ Bliski Wschód|Bliskiego Wschodu]] sięgają [[judaizm]]u i datowane są na początki\
      \ II tysiąclecia p.n.e.{{encyklopedia PWN|id=3918448|tytuł=judaizm|data dostępu=2023-02-04}}\n\
      W Chinach do czasów obecnych dominowały trzy nurty myślenia: [[taoizm]], [[legizm]]\
      \ i [[konfucjanizm]]. Szkoła konfucjanizmu w późniejszych czasach uzyskała dominującą\
      \ pozycję. Konfucjanizm opierał się na moralności politycznej oraz mocy i znaczeniu\
      \ tradycji, nie zaś na sile prawa. W Ameryce i Afryce religie plemienne utrzymały\
      \ się do kolonizacji europejskiej.\nPatrząc na cywilizację Zachodu, można dostrzec\
      \ rozprzestrzenianie się myśli filozoficznej [[Starożytna Grecja|Greków]], szczególnie\
      \ [[Platon]]a i [[Arystoteles]]a. Ich nauki przeniknęły również do Azji, po\
      \ podbojach [[Aleksander Macedoński|Aleksandra Macedońskiego]].\n== Ważniejsze\
      \ cywilizacje i regiony ==\n{{osobny artykuł|Cywilizacja}}\nDo ostatnich wieków\
      \ przed naszą erą, w rejonach [[Morze Śródziemne|Morza Śródziemnego]], rzeki\
      \ [[Ganges]] i [[Huang He|Żółtej Rzeki]] powstały imperia, które były wzorem\
      \ do naśladowania dla późniejszych władców. [[Dynastia Maurjów|Imperium Maurjów]]\
      \ rozciągało swe wpływy na obszarze większości Azji Południowej, zaś [[Królestwo\
      \ Pandja]] w południowych Indiach. Chińskie dynastie [[Dynastia Qin|Qin]] i\
      \ [[Dynastia Han|Han]] poszerzały swe strefy wpływów dzięki jedności politycznej,\
      \ sprawnej komunikacji i ustanowieniu przez cesarza [[Han Wudi|Wudi]] monopolu\
      \ państwowego.\nStarożytni Grecy zbudowali cywilizację uważaną przez historyków\
      \ za kulturowy fundament ludzkości Zachodu. W trzecim wieku przed naszą erą\
      \ rozszerzanie swoich wpływów podjęli starożytni Rzymianie, stosując podboje\
      \ i kolonizację kolejnych obszarów. Pod rządami cesarza [[Oktawian August|Oktawiana\
      \ Augusta]] pod koniec pierwszego wieku p.n.e. cesarstwo rzymskie sprawowało\
      \ kontrolę nad wszystkimi terenami otaczającymi Morze Śródziemne.\nWielkie mocarstwa\
      \ pokładały ufność w [[Siły zbrojne|armii]], [[aneksja|aneksji]] terytoriów\
      \ i tworzeniu warownych siedlisk - centrów produkcji rolnej. Względny pokój,\
      \ który zapewniały, zachęcał do prowadzenia handlu zagranicznego, czego dobrym\
      \ przykładem jest rozległa sieć szlaków handlowych w rejonie [[Morze Śródziemne|Morza\
      \ Śródziemnego]], rozwinięta w [[Epoka hellenistyczna|epoce hellenistycznej]],\
      \ czy [[Jedwabny Szlak|jedwabny szlak]].\nTypowa bolączka imperiów to kłopoty\
      \ z utrzymaniem relatywnie dużych sił zbrojnych oraz centralnej biurokracji.\
      \ Koszty utrzymania państwa najdotkliwiej odczuwali [[chłopi]] – posiadający\
      \ na własność ziemię [[magnat|magnaci]] coraz lepiej radzili sobie ze scentralizowanym\
      \ nadzorem i kosztami. Zagrożenie z zewnątrz w postaci plemion [[barbarzyńca|barbarzyńskich]]\
      \ pustoszących obszary przygraniczne powodowało czasami wewnętrzne rozłamy w\
      \ państwie. [[Chińska Republika Ludowa|Chiny]] za czasów panowania [[dynastia\
      \ Han|dynastii Han]] popadły w stan [[wojna domowa|wojny domowej]] (ok. 220\
      \ p.n.e.), a [[Cesarstwo Rzymskie|Cesarstwo rzymskie]] w tym samym czasie popadało\
      \ w coraz dalej posuniętą decentralizację i podziały. Imperia powstawały i upadały\
      \ na całej europejskiej, azjatyckiej i amerykańskiej rozciągłości pasa klimatu\
      \ umiarkowanego.\nStopniowy rozkład [[Cesarstwo Rzymskie|Imperium Rzymskiego]],\
      \ postępujący w okresie kilkuset lat od II wieku n.e. zbiegł się w czasie z\
      \ uzyskiwaniem przez [[chrześcijaństwo]] coraz silniejszej roli i rozprzestrzenianiem\
      \ się go na zachód z terytoriów [[Bliski Wschód|Bliskiego Wschodu]]. Zachodnia\
      \ cześć Cesarstwa rzymskiego znalazła się pod panowaniem [[Germanie|plemion\
      \ germańskich]] w V wieku n.e., które ewoluowały stopniowo do formy wojowniczych\
      \ państw, z których każde w jakiś sposób związane było z [[Kościół łaciński|kościołem\
      \ rzymskokatolickim]]. Pozostała na wschodzie obszaru śródziemnomorskiego część\
      \ Cesarstwa rzymskiego stała się [[Cesarstwo Bizantyńskie|cesarstwem bizantyjskim]].\
      \ Wieki później, częściowe przywrócenie jedności w Europie odbyło się za sprawą\
      \ ustanowienia [[Święte Cesarstwo Rzymskie|Świętego Cesarstwa Rzymskiego]],\
      \ w którego skład weszły narody zamieszkujące dzisiejsze [[Włochy]] i [[Niemcy]].\n\
      Podobne wzloty i upadki dynastii da się zauważyć w [[Chińska Republika Ludowa|Chinach]].\
      \ Po upadku [[dynastia Han|dynastii Han]] i [[Epoka Trzech Królestw|Epoce Trzech\
      \ Królestw]], [[Koczownik|koczownicze]] plemiona zaczęły najeżdżać kraj z północy\
      \ (IV wiek), podbijając północne Chiny i ustanawiając wiele małych państw. Zjednoczenie\
      \ Chin w roku 581 jest dokonaniem [[dynastia Sui|dynastii Sui]]. Pod rządami\
      \ [[dynastia Tang|dynastii Tang]] (618-907) Chiny wkroczyły w „złoty wiek”.\
      \ Jednak i w dynastii Tang nastąpił rozłam, a po trwającym około 50 lat okresie\
      \ zamętu Chiny zjednoczyły się ponownie pod rządami dynastii [[dynastia Song|Song]]\
      \ w roku 982. Zagrożenie ze strony koczowniczych plemion z północy stawało się\
      \ kwestią coraz bardziej kluczową w polityce kraju. Północne obszary Chin zostały\
      \ w roku 1141 utracone na rzecz [[Dżurdżeni|Dżurdzenów]], a całość kraju podbili\
      \ w roku 1279 wraz z większością [[Eurazja|Eurazji]] [[imperium mongolskie|Mongołowie]].\n\
      W ówczesnych latach północne [[Indie]] znajdowały się pod rządami [[Dynastia\
      \ Guptów|dynastii Guptów]]. W południowych Indiach powstały trzy królestwa [[Drawidowie|Drawidów]]:\
      \ [[Chera]], [[Chola]] i [[Pandjas]]. Wynikła z tego stabilność, która przyczyniła\
      \ się do sławienia złotej ery hinduizmu w IV i V wieku.\n[[Plik:Machu-Picchu.jpg|mały|240px|prawo|[[Machu\
      \ Picchu]], „zaginione miasto Inków”, stało się najbardziej rozpoznawalnym symbolem\
      \ cywilizacji [[Państwo Inków|Inków]]]]\nW tym samym czasie również w [[Ameryka\
      \ Środkowa|Ameryce Środkowej]] powstawały złożone społeczności, czego dobitnym\
      \ przykładem są cywilizacje [[Majowie|Majów]] i [[Aztekowie|Azteków]]. W dobie\
      \ stopniowego osłabienia macierzystej [[Kultura Olmeków|kultury Olmeków]], [[Miasto-państwo|wolne\
      \ miasta]] Majów stopniowo zwiększały swoją liczebność i znaczenie, a kultura\
      \ Majów rozprzestrzeniała się po [[Jukatan (stan)|Jukatanie]] i jego okolicach.\
      \ Później powstałe imperium [[Aztekowie|Azteków]] powstało na bazie kulturowej\
      \ okolicznych ludów i podbitych plemion (na przykład [[Toltekowie|Tolteków]]).\n\
      XIV i XV wiek był w [[Ameryka Południowa|Ameryce Południowej]] czasem świetności\
      \ [[Państwo Inków|Inków]], których stolicą było miasto [[Cuzco]]. Zaawansowani\
      \ i rozwojowi Inkowie obejmowali zasięgiem swojego państwa całe [[Andy]], rozwinąwszy\
      \ znakomity system dróg i budownictwo.\nKolejną ze znacznych sił ówczesnego\
      \ świata był [[islam]], który rozwinął się w krajach arabskich w VII wieku.\
      \ Z garstki zwolenników ewoluował on do postaci będącej podstawą wielu imperiów\
      \ Bliskiego Wschodu, Azji Środkowej, Indii i dzisiejszej [[Indonezja|Indonezji]].\n\
      W północno-wschodniej [[Afryka|Afryce]] przy chrześcijaństwie pozostały [[Nubia]]\
      \ i [[Etiopia]] – wszystkie państwa położone na północ od równika przeszły na\
      \ [[islam]]. Nowa wiara przyniosła ze sobą technologie pozwalające po raz pierwszy\
      \ na prowadzenie szlaków handlowych przez [[Sahara|Saharę]]. Podatki pochodzące\
      \ z takiego handlu przynosiły znaczne zyski państwom północnoafrykańskim i doprowadziły\
      \ do powstania między innymi szeregu państw w rejonie [[Sahel]].\nTen okres\
      \ historii świata charakteryzował się powolnym, lecz konsekwentnym rozwojem\
      \ technologicznym, którego ważniejsze osiągnięcia to [[Strzemię (jeździectwo)|strzemię]],\
      \ czy [[pług]], pojawiające się w odstępie kilkuset lat. Niektóre części świata\
      \ były też świadkami gwałtownego rozwoju techniki. Bodajże najważniejszym przypadkiem\
      \ jest rejon [[Morze Śródziemne|śródziemnomorski]] czasu [[epoka hellenistyczna|hellenistycznego]],\
      \ gdzie doszło do opracowania setek rozwiązań technologicznych. Czas wzmożonego\
      \ rozwoju techniki następował przed okresem technologicznego zastoju, jak w\
      \ przypadku [[Cesarstwo Rzymskie|cesarstwa rzymskiego]] i jego upadku we wczesnym\
      \ [[Średniowiecze|średniowieczu]].\n== Rozwój Europy ==\n=== Uwarunkowanie rozwoju\
      \ Europy ===\n[[Plik:Gutenburg bible.jpg|lewo|mały|150px|Wynalezienie około\
      \ roku 1450 [[Maszyna drukarska|prasy drukarskiej]] z ruchomą czcionką zostało\
      \ uznane przez [[LIFE (czasopismo)|czasopismo „LIFE”]] za najważniejszy ze 100\
      \ wynalazków ostatniego tysiąclecia. Według niektórych źródeł w mniej niż 50\
      \ lat po wydaniu drukiem pierwszej [[Biblia|Biblii]] w roku 1455, drukiem ukazało\
      \ się ponad dziewięć milionów pozycji]]\nPrawie wszystkie społeczeństwa rolne\
      \ były ograniczane przez panujące w miejscu ich zamieszkania [[warunki naturalne]].\
      \ Produkcja pozostawała na relatywnie niskim poziomie, a zmiany [[klimat]]yczne\
      \ zachęcały do wysiłków i eksploracji, które nie raz przynosiły już wzloty i\
      \ upadki cywilizacji. Do roku 1500 zmiany w społeczeństwach miały jednak charakter\
      \ głównie jakościowy. Rozwój [[technologia|technologii]] i [[zysk]] pochodzący\
      \ z [[handel|handlu]] stopniowo rozszerzały możliwości ludzi.\nJuż przed XVI\
      \ wiekiem niektóre cywilizacje wykształciły skomplikowany system społeczny.\
      \ W starożytnej [[starożytna Grecja|Grecji]] i [[starożytny Rzym|Rzymie]] powstały\
      \ społeczności, za którymi stał skomplikowany mechanizm [[pieniądz|monetarny]],\
      \ zakładający istnienie rynków finansowych i własności prywatnej. Takie instytucje\
      \ stworzyły warunki dla ciągłej [[akumulacja kapitału|akumulacji kapitału]]\
      \ i zwiększonej produkcji. Według niektórych wyliczeń, przychód na jednego mieszkańca\
      \ rzymskich Włoch (najbardziej rozwiniętego regionu Cesarstwa rzymskiego) porównywalny\
      \ był z przychodami uzyskiwanymi przez statystycznego mieszkańca najbardziej\
      \ rozwiniętych społeczeństw ekonomicznych XVIII wieku{{Cytuj pismo|url = http://www.atypon-link.com/AEAP/doi/abs/10.1257/089533006776526148#search=%22the%20economy%20of%20the%20roman%20empire%20temin%22\
      \ |tytuł = The Economy of the Early Roman Empire|imię=Peter |nazwisko=Temin|oznaczenie=Wiosna\
      \ 2006|wolumin=tom 20, nr 1|strony = 133-151|czasopismo=Journal of Economic\
      \ Perspectives|język=en}}).\nNajbardziej rozwinięte rejony cywilizacji klasycznej\
      \ były raczej zurbanizowane, a tendencja ta utrzymywała się aż do początków\
      \ ery nowożytnej. Cywilizacja klasyczna popadła jednak stopniowo w zapaść, a\
      \ historycy nie są nadal pewni przyczyn tego zjawiska.\nW [[Chińska Republika\
      \ Ludowa|Chinach]] już około roku 1000 opracowano skomplikowany [[pieniądz|system\
      \ monetarny]]. Kraj ten charakteryzował się również wolnością chłopów, których\
      \ produkcja rolna nie tylko wykorzystywana była do utrzymania się przy życiu,\
      \ ale mogła być sprzedawana - dzięki temu chłopi aktywnie uczestniczyli w rynku\
      \ towarów i usług. Produkcja rolna Chin stała na wysokim poziomie, a społeczeństwo\
      \ było wysoce zurbanizowane. Postęp techniczny Chin był tak wielki, że kraj\
      \ ten miał monopol na miechy tłokowe i [[druk]]{{cytuj stronę|url=http://www.nri.org.uk/joseph.html|tytuł=Joseph\
      \ Needham|opublikowany=Needham Research Institute|data dostępu=2007-04-22|język=en}}.\
      \ Po wytępieniu ludu [[Dżurdżeni|Dżurdżenów]] pozostała ludność [[dynastia Song|dynastii\
      \ Song]] została w roku 1279 podbita przez [[Mongołowie|Mongołów]].\n[[Renesans]]\
      \ [[Europa|europejski]], którego początek przypadł na XIV wiek, polegał na ponownym\
      \ odkryciu roli, jaką w rozwoju nauki odegrały cywilizacje klasyczne i na [[ekonomia|ekonomicznym]]\
      \ oraz [[społeczeństwo|społecznym]] wzroście Europy. Renesans spowodował też\
      \ jednak powstanie kultury [[ciekawość|ciekawości]], która dała początek [[humanizm]]owi,\
      \ [[Rewolucja naukowa|rewolucji naukowej]] i wielkiemu przejściu ku [[Rewolucja\
      \ przemysłowa|rewolucji przemysłowej]]. Siedemnastowieczna [[rewolucja naukowa]]\
      \ nie wniosła jednak znacznego wkładu w rozwój techniki: opracowane teorie zaczęto\
      \ wdrażać dopiero w końcach wieku XVIII.\nCechami wyróżniającymi cywilizację\
      \ europejską spośród innych było opracowanie kultury [[Przedsiębiorstwo|przedsiębiorczości]]\
      \ i przychody generowane przez handel szlakami przebiegającymi przez [[Ocean\
      \ Atlantycki]], w tym przez handel [[Niewolnictwo|niewolnikami]] z [[Afryka|Afryki]].\
      \ Niektórzy historycy uważają, że około roku 1750 produkcja w bardziej zurbanizowanych\
      \ częściach [[Chińska Republika Ludowa|Chin]] stała na tym samym poziomie, co\
      \ europejskie państwa czerpiące zyski z handlu przez Atlantyk{{cytuj stronę|url=http://admin.nber.org/people/carol_shiue\
      \ |tytuł=NBER Working Papers by Carol H. Shiue|opublikowany=National Bureau\
      \ of Economic Research|data dostępu=2007-04-22|język=en}}, inni zaś, tak jak\
      \ [[Angus Maddison]] są zdania, że produkcja na jednego mieszkańca [[Europa\
      \ Zachodnia|Europy Zachodniej]] pod koniec [[średniowiecze|średniowiecza]] przekroczyła\
      \ już wskaźniki innych rejonów świata{{cytuj stronę|url=http://www.ggdc.net/maddison/\
      \ |tytuł=Strona domowa Angusa Maddisona|data dostępu=2007-04-22|język=en}}.\n\
      Przyczyny tego, że począwszy od późnego [[Średniowiecze|średniowiecza]], znaczenie\
      \ Europy rosło i która stała się kolebką [[rewolucja przemysłowa|rewolucji przemysłowej]]\
      \ oraz zdominowała świat, jest kilka. [[Max Weber]] argumentował tę sytuację\
      \ etyką pracy [[protestantyzm|protestantów]], która skłaniała mieszkańców Europy\
      \ do dłuższej i cięższej pracy. Inne wyjaśnienia [[Inżynieria społeczna (ogólnie)|socjotechniczne]]\
      \ kierują się w stronę [[demografia|demografii]]: rozwój populacji w Europie\
      \ na tle na przykład Azji był znacznie ograniczony przez [[celibat]] wśród duchownych,\
      \ emigrację do skolonizowanych ziem, powstawaniem ośrodków miejskich o wysokiej\
      \ śmiertelności, ciągłymi działaniami wojennymi i tendencją do zawierania związków\
      \ małżeńskich w późniejszym wieku. Względny niedostatek siły roboczej oznaczał,\
      \ że ewentualne nadwyżki można było inwestować w rozwiązania techniczne powodujące\
      \ spadek zapotrzebowania na pracę. Przykładami osiągnięć, które hamowały wzrost\
      \ populacji, są [[koło wodne|koła wodne]], [[młyn wodny|młyny]], [[przędzenie]],\
      \ [[krosno tkackie]], [[maszyna parowa]] i [[żegluga]].\nPojawiły się również\
      \ głosy, jakoby rozwój Europy powodowany był wyższością europejskich instytucji,\
      \ a [[wolny rynek|ekonomia wolnorynkowa]] była w tej części świata silniejsza\
      \ niż w pozostałych regionach dzięki ideom [[wolność|wolności]] charakterystycznym\
      \ dla kontynentu. Ostatnio naukowcy tacy, jak [[Kenneth Pomeranz]] rzucili takiej\
      \ teorii wyzwanie. Z drugiej strony, również [[rewizjonizm|rewizjonistyczne]]\
      \ postrzeganie historii otrzymało słowa krytyki za notoryczne niedocenianie\
      \ osiągnięć Europejczyków{{Cytuj pismo|imię=Ricardo |nazwisko=Duchesne|tytuł=Asia\
      \ First?|czasopismo=The Journal of the Historical Society|oznaczenie=Marzec\
      \ 2006|wolumin=tom 6, nr 1|strony = 69-91|doi=10.1111/j.1540-5923.2006.00168.x}}.\n\
      Ważną rolę mogło odegrać położenie Europy. [[Bliski Wschód]], [[Indie]] i [[Chińska\
      \ Republika Ludowa|Chiny]] otoczone są pasmami [[Góra|gór]], poza zasięgiem\
      \ których teren jest względnie płaski. Europa jest za to poprzecinana pasmami\
      \ górskimi ([[Alpy]], [[Pireneje]], [[Apeniny]], [[Karpaty]] i inne), a do tego\
      \ [[morze|morzami]]. Taki układ geograficzny dawał Europie pewną ochroną przed\
      \ azjatyckimi najeźdźcami. Przed wynalezieniem [[broń palna|broni palnej]] plemiona\
      \ [[Koczownik|nomadów]] były o wiele silniejsze od rolniczych ludów zamieszkujących\
      \ skraje [[Eurazja|Eurazji]]. Po wkroczeniu na równiny północnych Indii lub\
      \ do dolin w Chinach grupy nomadów były praktycznie nie do zatrzymania. Ich\
      \ działania często kończyły się zniszczeniem całych regionów. Złota epoka Islamu\
      \ została zakończona [[Bitwa pod Bagdadem (1258)|zniszczeniem w roku 1258]]\
      \ [[Bagdad]]u przez [[Mongołowie|Mongołów]]. [[Indie]] i [[Chińska Republika\
      \ Ludowa|Chiny]] były często celami najazdów, a [[Rosja]] przez kilka stuleci\
      \ znajdowała się pod wpływami [[Tatarzy|Tatarów]]. Środkowa i zachodnia Europa,\
      \ oddalone od wpływów środkowoazjatyckich, były o wiele mniej narażone na najazdy.\n\
      Układ [[geografia|geograficzny]] wpłynął również na szereg różnic [[geopolityka|geopolitycznych]].\
      \ Przez większość swoich dziejów Chiny, Indie i Bliski Wschód zjednoczone były\
      \ pod panowaniem jednej władzy, która swoje wpływy rozciągała aż do leżących\
      \ na peryferiach kraju gór i pustyń. W roku 1600 [[Imperium Osmańskie]] sprawowało\
      \ władzę nad prawie całym [[Bliski Wschód|Środkowym Wschodem]], [[dynastia Ming]]\
      \ rządziła [[Chińska Republika Ludowa|Chinami]], a [[Państwo Wielkich Mogołów|Mogołowie]]\
      \ Indiami. Inaczej było w Europie - ta była prawie zawsze podzielona na szereg\
      \ zwalczających się wzajemnie państw. Imperia paneuropejskie, poza [[Cesarstwo\
      \ Rzymskie|cesarstwem rzymskim]] miały tendencję do upadania zaraz po ukonstytuowaniu.\n\
      Często cytowanym przyczynkiem do sukcesu Europy była ostra [[konkurencja (ekonomia)|konkurencja]]\
      \ pomiędzy rywalizującymi ze sobą krajami. Istniały też regiony, gdzie górę\
      \ nad wzrostem wzięły dążenia do [[stabilizacja|stabilizacji]]. Wzrost znaczenia\
      \ [[Chińska Republika Ludowa|Chin]] na morzach został zatrzymany przez ustanowienie\
      \ przez [[dynastia Ming|dynastię Ming]] zakazu ''Han jin'', blokady na handel\
      \ zamorski. W Europie, z racji na polityczne rozbicie, wprowadzenie tak powszechnego\
      \ ograniczenia byłoby niemożliwe, a kraj, który zdecydowałby o wewnętrznym wprowadzeniu\
      \ podobnych ograniczeń, szybko pozostałby w tyle.\nNiewątpliwą przewagą w kwestiach\
      \ geograficznych dawała Europie bliskość [[Morze Śródziemne|Morza Śródziemnego]].\
      \ Przez tysiąclecia funkcjonowało ono jako morska autostrada wspierająca wymianę\
      \ towarów, ludzi, pomysłów i wynalazków.\nOdmiennie, niż w Europie, rozwój [[Strefa\
      \ międzyzwrotnikowa|krajów tropikalnych]] hamowany był przez wszędobylskie [[choroba\
      \ tropikalna|choroby tropikalne]] i [[Pasożytnictwo|pasożyty]], osłabiające\
      \ ludzi, uprawy i zwierzęta hodowlane.\n=== Dominacja handlowa Europy ===\n\
      W XIV wieku w [[Europa|Europie]] rozpoczął się [[renesans]]. Niektórzy współcześni\
      \ naukowcy podają w wątpliwość znaczenie [[sztuka|sztuki]] i [[humanizm]]u dla\
      \ [[nauka|nauki]], ale w tym czasie bez wątpienia nastąpiło połączenie wiedzy\
      \ posiadanej przez Arabów i Europejczyków. Jednym z ważniejszych osiągnięć nauki\
      \ była [[karawela]], która łączyła w sobie arabskie [[ożaglowanie łacińskie]]\
      \ i europejskie [[ożaglowanie rejowe]]. Te dwa typy ożaglowania zastosowane\
      \ razem pozwalały na zbudowanie okrętu, który byłby w stanie przekroczyć [[Ocean\
      \ Atlantycki]]. Dzięki takim statkom oraz postępom w dziedzinie [[nawigacja|nawigacji]],\
      \ [[Krzysztof Kolumb]] podjął podróż przez ocean, co zaowocowało odkryciem kontynentu\
      \ amerykańskiego w roku 1492.\nDla [[Afroeurazja|Afroeurazji]] i [[Ameryka|Ameryki]]\
      \ miało to olbrzymie skutki, głównie w postaci „problemu przybyszów”. Europejczycy\
      \ przywieźli ze sobą [[wirusy]], których ludność kontynentu amerykańskiego nie\
      \ doświadczyła. Konsekwencją tego była śmierć nieznanej liczby mieszkańców Ameryk\
      \ w wyniku [[epidemia|epidemii]]. Europejczycy posiadali także nieznane Amerykanom\
      \ [[koń domowy|konie]], [[stal]], czy [[broń palna|broń palną]], którymi posiłkowali\
      \ się w walce z [[Państwo Inków|Inkami]], [[Aztekowie|Aztekami]] i innymi ludami\
      \ [[Ameryka Północna|Ameryki Północnej]]. Natomiast do [[Afroeurazja|Afroeurazji]]\
      \ przeniesiony został [[Kiła|syfilis]].\nZłoto i towary z kontynentów amerykańskich\
      \ były odbierane ludziom i wywożone do Europy, podczas gdy z Europy do Ameryk\
      \ przybywała coraz większa liczba emigrantów. By sprostać wymaganiom ilościowym\
      \ siły roboczej w koloniach, rozpoczęto przewożenie na nowo zdobyte obszary\
      \ mieszkańców [[Afryka|Afryki]] jako [[niewolnictwo|niewolników]]. W niedługim\
      \ czasie dużą część populacji Ameryk stanowili czarnoskórzy niewolnicy. W Afryce\
      \ Zachodniej doszło w tym czasie do rozwoju krajów leżących na tzw. [[Wybrzeże\
      \ Niewolnicze|Wybrzeżu Niewolniczym]], czerpiąc zyski z wykorzystywania uciśnionych\
      \ narodów Afryki.\n[[Plik:Eertvelt, Santa Maria.jpg|mały|200px|Obraz „''Santa\
      \ Maria na kotwicy''”, pędzla [[Andries van Eertvelt|Andriesa van Ertvelta]]\
      \ z roku 1628, ukazujący [[karaka|karakę]] [[Krzysztof Kolumb|Krzysztofa Kolumba]]]]\n\
      Ekspansja Europy na morzach i oceanach (co nie jest rzeczą zaskakującą, zważywszy\
      \ na geografię kontynentu) była głównie napędzana przez zachodnie państwa leżące\
      \ blisko wybrzeży Atlantyku – [[Portugalia|Portugalię]], [[Hiszpania|Hiszpanię]],\
      \ [[Anglia|Anglię]], [[Francja|Francję]] i [[Holandia|Holandię]]. Przewodnią\
      \ pozycję w początkach podbojów miały imperia kolonialne [[Imperium portugalskie|Portugalii]]\
      \ i Hiszpanii, roztaczając swoje wpływy w nowo odkrytych regionach. W niedługim\
      \ czasie jednak dominację na [[Ocean Atlantycki|Atlantyku]] zdobyły położone\
      \ bardziej na północ [[Francja]], [[Anglia]] i [[Holandia]]. W serii konfliktów\
      \ zbrojnych z XVII i XVIII wieku, których kulminację stanowiły [[wojny napoleońskie]],\
      \ pierwszą pozycję na liście światowych mocarstw wywalczyła sobie [[Anglia]],\
      \ budując imperium rozciągające się na cały świat i kontrolujące w czasach swej\
      \ świetności jedną czwartą jego lądów, stanowiąc „[[imperium, nad którym nigdy\
      \ nie zachodzi słońce]]”.\nW międzyczasie podróże admirała [[Zheng He]] zostały\
      \ zatrzymane przez [[dynastia Ming|dynastię Ming]] rządzącą w latach 1366-1644\
      \ po wypędzeniu [[Mongołowie|Mongołów]]. Rewolucja handlowa w Chinach, czasami\
      \ określana mianem „raczkującego [[kapitalizm]]u”, okazała się nieskuteczna.\
      \ [[Dynastia Ming]] w końcu poddała się [[Mandżurowie|Mandżurom]], którzy ustanowili\
      \ [[Dynastia Qing|dynastię Qing]], początkowo prowadzącą rządy w atmosferze\
      \ spokoju i rozwoju, lecz również stopniowo poddającą się wpływom Zachodu.\n\
      Krótko po opanowaniu Ameryk, Europejczycy wykorzystali swoją przewagę technologiczną\
      \ również w Azji. W początkach XIX wieku Brytyjczycy przejęli kontrolę nad [[subkontynent\
      \ indyjski|subkontynentem indyjskim]], [[Egipt]]em i [[Półwysep Malajski|Półwyspem\
      \ Malajskim]], Francuzi kontrolowali [[Indochiny Francuskie]], a [[Holandia|Holendrzy]]\
      \ okupowali [[Antyle Holenderskie]]. Brytyjczycy przejęli też panowanie w miejscach,\
      \ które zamieszkane były jeszcze przez ludność neolityczną, w tym [[Australia|Australię]],\
      \ [[Nowa Zelandia|Nową Zelandię]] i [[Południowa Afryka|Republikę Południowej\
      \ Afryki]]. Względnie dużą liczba ludności brytyjskiej wyemigrowała do Ameryk\
      \ celem kolonizacji. Pod koniec XIX wieku mocarstwa europejskie dokonały [[Wyścig\
      \ o Afrykę|podziału]] pozostałych poza ich wpływami terenów [[afryka]]ńskich.\n\
      W Europie nastała „era rozumu”, przyczyniając się do [[rewolucja naukowa|rewolucji\
      \ naukowej]], która zmieniła postrzeganie świata przez ludzi i umożliwiła nadejście\
      \ [[rewolucja przemysłowa|rewolucji przemysłowej]] – znacznej transformacji\
      \ ekonomii światowej. Rewolucja przemysłowa zapoczątkowana została w [[Wielka\
      \ Brytania|Wielkiej Brytanii]], umożliwiając podjęcie produkcji zupełnie nowymi\
      \ metodami - w [[fabryka]]ch, wykorzystując zasady [[produkcja masowa|produkcji\
      \ masowej]] i [[mechanizacja|mechanizacji]] – i wytwarzając szeroki wachlarz\
      \ produktów szybciej i przy mniejszych nakładach siły roboczej.\nEra rozumu\
      \ przygotowała też pod koniec XVIII wieku grunt nowoczesnej [[demokracja|demokracji]]\
      \ w postaci [[wojna o niepodległość Stanów Zjednoczonych|rewolucji amerykańskiej]]\
      \ i [[rewolucja francuska|francuskiej]]. Demokracja urosła do postaci, w której\
      \ wywarła znaczący wpływ na wydarzenia światowe i [[wskaźnik jakości życia|jakość\
      \ życia]].\nPodczas [[rewolucja przemysłowa|rewolucji przemysłowej]] gospodarka\
      \ światowa przestawiła się na zasilanie [[Węgle kopalne|węglem]] – wykorzystywały\
      \ go nowoczesne [[transport|środki transportu]], takie, jak [[Transport kolejowy|kolej]]\
      \ i [[parowiec|parowce]], przyczyniając się do względnego kurczenia się cywilizowanego\
      \ świata. Przez zwiększone zapotrzebowanie na paliwa, znacznie wzrosło [[zanieczyszczenie\
      \ środowiska]], które pojawiło się już w momencie odkrycia przez wczesnych ludzi\
      \ [[ogień|ognia]].\n== Od początku XX wieku ==\n{{osobny artykuł|XX wiek}}\n\
      Po zakończeniu [[II wojna światowa|II wojny światowej]], w nadziei na uspokajanie\
      \ konfliktów między narodami i zapobieganie przyszłym wojnom, powołano [[Organizacja\
      \ Narodów Zjednoczonych|Organizację Narodów Zjednoczonych]]. W roku 1991 doszło\
      \ do rozpadu [[Związek Socjalistycznych Republik Radzieckich|ZSRR]], pozostawiając\
      \ w roli jedynej światowej siły [[Stany Zjednoczone]], przez niektórych określane\
      \ jako „[[supermocarstwo]]”.\n[[Plik:WWI.png|mały|280px|[[I wojna światowa]],\
      \ której stronami była [[Ententa]] (kolor zielony) przeciwko [[państwa centralne|państwom\
      \ centralnym]] (kolor pomarańczowy) doprowadziła do upadku [[cesarstwo Niemieckie|Cesarstwa\
      \ Niemieckiego]], [[Imperium Rosyjskie|Cesarstwa Rosyjskiego]], [[Imperium Osmańskie|Imperium\
      \ Osmańskiego]] i [[Austro-Węgry|Monarchii Austro-Węgierskiej]]]]\nXX wiek był\
      \ również okresem powstania mających duży wpływ ideologii świeckich. Pierwszą,\
      \ opracowaną po roku 1917 w [[Związek Socjalistycznych Republik Radzieckich|Związku\
      \ Radzieckim]] był [[komunizm]], który po roku 1945 wpłynął na [[Europa Środkowa|Europę\
      \ Środkową]], [[Jugosławia|Jugosławię]], [[Bułgaria|Bułgarię]], [[Rumunia|Rumunię]],\
      \ [[Albania|Albanię]], [[Wietnam Północny]] i [[Korea Północna|Koreę Północną]].\
      \ W roku 1949 komunizm zakorzenił się w [[Chińska Republika Ludowa|Chinach]],\
      \ a w latach 50. i 60. w krajach [[Trzeci Świat|Trzeciego Świata]]. Lata 20.\
      \ i 30. przyniosły rozwój [[militaryzm|wojskowej]] dyktatury [[faszyzm|faszystowskiej]],\
      \ która przejęła władzę we [[Włochy|Włoszech]], [[Niemcy|Niemczech]], [[Japonia|Japonii]]\
      \ i [[Hiszpania|Hiszpanii]].\nTransformacje te były połączone z [[wojna|konfliktami\
      \ zbrojnymi]] na niespotykaną do tej pory skalę i niosące największe w historii\
      \ zniszczenie. [[I wojna światowa]] zniszczyła wiele dotychczasowych imperiów\
      \ i monarchii Europy, dodatkowo osłabiając [[Francja|Francję]] i [[Wielka Brytania|Wielką\
      \ Brytanię]]. [[II wojna światowa]] stała się przyczynkiem do upadku większości\
      \ dyktatur wojskowych Europy i ekspansji [[komunizm]]u na tereny [[Europa Wschodnia|Europy\
      \ Wschodniej]] i [[Europa Środkowa|Środkowej]] oraz do [[Azja|Azji]].\n[[Plik:Nagasakibomb.jpg|lewo|mały|210px|Użycie\
      \ [[Broń jądrowa#Bomba atomowa|bomby atomowej]] przeciwko [[Japonia|Japonii]]\
      \ w roku 1945 doprowadziło do końca [[II wojna światowa|II wojny światowej]]\
      \ i rozpoczęło jednocześnie [[Zimna wojna|zimną wojnę]]]]\nWydarzenia te stały\
      \ się powodem do rozpoczęcia [[Zimna wojna|zimnej wojny]] – czterdziestoletniego\
      \ okresu napięć między [[Związek Socjalistycznych Republik Radzieckich|Związkiem\
      \ Radzieckim]] i [[Stany Zjednoczone|Stanami Zjednoczonymi]], włączywszy w to\
      \ sojuszników obu stron. Cała ludzkość i wszystkie formy życia stanęły w obliczu\
      \ zagrożenia ze strony posiadanej przez strony konfliktu [[broń jądrowa|broni\
      \ atomowej]]. Posiadające taką broń państwa zrozumiały stanowione przez nią\
      \ zagrożenie szczególnie po [[kryzys kubański|kryzysie kubańskim]], który w\
      \ roku 1962 prawie doprowadził do [[wojna jądrowa|wojny nuklearnej]]. Konflikt\
      \ z użyciem broni atomowej był postrzegany za niepraktyczny, wypowiadano więc\
      \ wojny zastępcze, prowadzone kosztem nieposiadających broni masowego rażenia\
      \ krajów [[Trzeci Świat|Trzeciego Świata]]. Jako odpowiedź na zagrożenie konfliktami\
      \ i wojny, które faktycznie się rozegrały, powstała młodzieżowa [[kontrkultura]]\
      \ lat 60., kwestionująca w kilku krajach ideę wyższości Zachodu oraz zbrojenia\
      \ atomowe, propagowane przez przywódców.\nW roku 1991 świat stał się świadkiem\
      \ rozpadu [[Związek Socjalistycznych Republik Radzieckich|Związku Radzieckiego]].\
      \ Niektóre byłe republiki dołączyły potem do [[Rosja|Rosji]], tworząc [[Wspólnota\
      \ Niepodległych Państw|Wspólnotę Niepodległych Państw]]. Inne republiki wraz\
      \ z kilkoma krajami ościennymi zwróciły się w kierunku Europy Zachodniej i [[Unia\
      \ Europejska|Unii Europejskiej]].\nWiek XX przyniósł też znaczący rozwój technologiczny,\
      \ wzrost średniej długości życia i poprawę warunków bytowania większości mieszkańców\
      \ świata. Gospodarka światowa dokonała zmiany podstawowego paliwa z [[Węgle\
      \ kopalne|węgla]] na paliwa oparte na [[ropa naftowa|ropie naftowej]], a postęp\
      \ w dziedzinie transportu i komunikacji w dalszym stopniu unifikowały świat.\
      \ Opracowane w XX wieku wynalazki przyczyniły się jednak do wzrostu zanieczyszczenia\
      \ [[środowisko przyrodnicze|środowiska naturalnego]], mimo że zanieczyszczenia\
      \ generowane przez [[miasto|miasta]] stoją dziś na niższym poziomie niż za czasów\
      \ dominacji węgla w roli paliwa.\n[[Plik:Apollo 17 Cernan on moon.jpg|mały|220px|Ostatnia\
      \ wyprawa na [[Księżyc]] – [[Apollo 17]], rok 1972]]\nDruga połowa XX wieku\
      \ to nastanie [[era informacji|ery informacji]], ożywienie [[handel|handlu]]\
      \ i stosunków międzykulturowych dzięki [[globalizacja|globalizacji]]. [[Eksploracja\
      \ kosmosu]] pozwoliła ludzkości na poznanie całego [[Układ Słoneczny|Układu\
      \ Słonecznego]]. Odkryto strukturę [[Kwas deoksyrybonukleinowy|DNA]], szablonu,\
      \ według którego powstaje życie, doszło też do ustalenia sekwencji materiału\
      \ genetycznego człowieka, co stanowiło obietnicę zmiany oblicza ludzkich [[choroba|chorób]].\
      \ Liczba publikowanych rocznie prac naukowych znacznie przekroczyła w tym czasie\
      \ całość materiału naukowego zebranego przed rokiem 1900{{cytuj stronę|url=https://archive.is/20120802094052/www.ifi.unicamp.br/~ghtc/sources/articles.htm|praca=Group\
      \ of History and Theory of Science|autor=Roberto de Andrade Martins| data=2003-04-23|tytuł=History\
      \ of Science, Medicine and Technology. Bibliography of Primary Sources: Articles|język=en|opublikowany=[[Wyszukiwarka\
      \ Google]]|data dostępu = 2007-04-28}}, podwajając się co około 15 lat{{cytuj\
      \ książkę |url = http://print.google.com/print?id=TbiVDVY6mRYC&pg=83&lpg=83&sig=jZLZNf0mWtAqSMUiXyVaBBlSJDA\
      \ |tytuł = Our Affair with El Niño|wydawca=Princeton University Press|rok=2004|isbn\
      \ = 0-691-11335-1|nazwisko=Philander|imię=George S|strony = 228}}.\nNadal zmniejszał\
      \ się światowy [[analfabetyzm]] wraz z odsetkiem ludności zajmującej się [[rolnictwo|produkcją\
      \ żywności]] ([[Raymond Kurzweil|Kurzweil]], 1999).\nW tym samym czasie pojawiła\
      \ się jednak wizja rychłego końca dziejów ludzi, do którego przyczynić mogły\
      \ się pozostawione bez większego nadzoru zagrożenia - rozpowszechnienie [[broń\
      \ jądrowa|broni atomowej]], [[efekt cieplarniany]], inne formy degradacji środowiska\
      \ naturalnego w następstwie masowego wykorzystywania paliw nuklearnych i kopalnianych,\
      \ konflikty międzynarodowe wynikające z kurczących się surowców naturalnych,\
      \ szybko rozprzestrzeniające się choroby (np. wywoływany wirusem [[Ludzki wirus\
      \ niedoboru odporności|HIV]] [[zespół nabytego niedoboru odporności]]) i zagrożenie\
      \ przelatującymi blisko Ziemi [[Planetoida|asteroidami]] i [[kometa]]mi.\nRozwój\
      \ państw zawsze powodowany był chęcią osiągnięcia korzyści i strachem przed\
      \ ponoszeniem strat. Poczucie [[tożsamość narodowa|tożsamości narodowej]] było\
      \ podsycane w konfliktach z obcokrajowcami, uważanymi za intruzów. Pod koniec\
      \ XX wieku obserwować można powstanie nowego supermocarstwa – [[Unia Europejska|Unii\
      \ Europejskiej]]. Próby naśladowania struktur Unii Europejskiej podjęto też\
      \ w ograniczonym zakresie przez kraje [[azja]]tyckie, [[afryka]]ńskie i [[Ameryka\
      \ Południowa|południowoamerykańskie]]. W tym samym czasie egzystencja i upadek\
      \ państw o różnej strukturze społecznej i o rozmaitych celach istnienia przebiegał\
      \ przy udziale [[wojna|wojen]] i nieuniknionym spadku liczby ludności, zniszczeniach,\
      \ [[choroba]]ch, [[głód|głodzie]] i aktach [[ludobójstwo|ludobójstwa]].\nNa\
      \ przełomie lat 80. i 90. XX wieku zaistniał [[Internet]] – globalna sieć komputerowa\
      \ pozwalająca na przekaz informacji z ekspresową prędkością, co doprowadziło\
      \ do obecnych przemian w polityce i kulturze.https://ofio.pl/technologia/28540/krotka-historia-internetu/\n\
      W początkach XXI wieku stopniowo jednoczący się świat stanął w obliczu wspólnego\
      \ zagrożenia, które zażegnać można było tylko wspólnie podjętym wysiłkiem. Niektórzy\
      \ naukowcy nazywają to zjawisko „planetarną fazą cywilizacji ludzkiej”. Coraz\
      \ silniejsze było odczucie, że świat albo zakończy swoją egzystencję, albo przeżyje,\
      \ ale tylko jako efekt wspólnego wysiłku. [[Październik 2006#30 października\
      \ 2006|30 października 2006]] zaznaczył to [[raport Sterna]], ostrzegający przed\
      \ [[globalne ocieplenie|globalnym ociepleniem]] i gwałtownymi [[zmiana klimatu|zmianami\
      \ klimatu]]. W toku historycznej eskalacji zagrożeń ludzkości, lokalne i międzynarodowe\
      \ konflikty tracą swoje znaczenie na rzecz uniwersalnych zagrożeń rodzaju ludzkiego\
      \ - swoistego globalnego konfliktu ludzkości ze środowiskiem naturalnym.\nGlobalne\
      \ zagrożenie degradacją środowiska naturalnego i wyczerpywaniem się surowców\
      \ naturalnych oraz źródeł [[energetyka|energii]] nie stanowią pierwszych oznak\
      \ kryzysu materiałowo-energetycznego w historii świata. Wcześniejsze przypadki\
      \ to choćby [[wylesianie]] przeprowadzane przez [[Wielka Brytania|Brytyjczyków]]\
      \ w celu zapewnienia dostaw [[węgiel drzewny|węgla drzewnego]] na potrzeby produkcji\
      \ [[żelazo|żelaza]]. Wtedy sytuacja na rynku materiałów doprowadziła do rozpowszechnienia\
      \ [[koks]]u, który znacznie wsparł osiemnastowieczną [[rewolucja przemysłowa|rewolucję\
      \ przemysłową]] w Anglii. Podobnie, na przełomie XX i XXI wieku, świat stanął\
      \ w obliczu [[efekt wąskiego gardła|efektu wąskiego gardła]], który przerwać\
      \ można innowacjami technicznymi, takimi, jak energia pochodząca z [[Reakcja\
      \ termojądrowa|fuzji jądrowych]] (np. w ramach programu [[ITER]]), czy szersze\
      \ wykorzystanie [[alternatywne źródło energii|odnawialnych źródeł energii]],\
      \ popartych na sile [[wiatr]]u, [[pływy morskie|pływów]], [[elektrownia wodna|wodzie]]\
      \ i [[Energetyka słoneczna|Słońcu]] ([[fotowoltaika]]).\n== Wzrost populacji\
