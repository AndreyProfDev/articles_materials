- sections:
  - content: '''''''Polityka historyczna'''''' ({{Niem.|Geschichtspolitik}}) lub ''''''polityka
      pamięci'''''' – kształtowanie [[Świadomość historyczna|świadomości historycznej]]
      oraz wzmocnienie publicznego dyskursu o przeszłości.

      == Geneza pojęcia ==

      Polityka historyczna wynika z potrzeby mitologizacji przeszłości{{r|Ponczek}}
      w celu tworzenia [[Dziedzictwo kulturowe|dziedzictwa kulturowego]] danego [[Naród|narodu]].
      Pojęcie polityki historycznej wywodzi się z [[Niemcy|Niemiec]], gdzie pojawiło
      się w latach 1980. i zajmowało się wpływem historii na politykę tego kraju{{Cytuj
      |tytuł = "The Armored Train of Memory": The Politics of History in Post-Soviet
      Russia {{!}} Perspectives on History {{!}} AHA |data dostępu = 2021-09-04 |opublikowany
      = historians.org |url = https://www.historians.org/publications-and-directories/perspectives-on-history/january-2011/the-armored-train-of-memory-the-politics-of-history-in-post-soviet-russia#note1}}.
      Wraz z początkiem lat 1990. debata publiczna na temat wydarzeń z historii zaczęła
      mieć coraz większe znaczenie: <blockquote>Wraz ze [[ponowne zjednoczenie Niemiec|zjednoczeniem
      Niemiec]] stary podział na [[Republika Federalna Niemiec (1949–1990)|zachodnioniemiecką]]
      i [[Niemiecka Republika Demokratyczna|wschodnioniemiecką]] politykę historyczną
      stracił rację bytu (…) w kontekście niemieckim pojęcie to nie ma – w przeciwieństwie
      do dyskursu politycznego polskiego – konotacji [[konserwatyzm|konserwatywnych]]Red.
      Magdalena Saryusz-Wolska, ''''Pamięć zbiorowa i kulturowa. Współczesna perspektywa
      niemiecka'''', UNIVERSITAS, Kraków 2009..</blockquote>

      == Narzędzia polityki historycznej ==

      Narzędziami polityki historycznej są finansowane przez państwo: badania naukowe,
      edukacja i wychowanie, instytucje wyspecjalizowane (jak [[Muzeum|muzea]], [[Izba
      pamięci|izby pamięci]], instytuty lub centra), organizacja czasu (kalendarz
      [[Święto państwowe|świąt państwowych]]), topografia pamięci, wykorzystanie mediów
      masowych i wymiar sprawiedliwości, szczególnie podczas [[Tranzycja (politologia)|tranzycji
      politycznej]], etykietowanie bohaterów oraz wykorzystywanie narratorów o odmiennym
      autorytecie (np. naukowców i świadków wydarzeń) w artykułach historycznychLaleh
      Khalili: ''''Heroes and Martyrs of Palestine. The Politics of National Commemoration''''.
      Oxford – New York: Oxford University Press, 2007; Jan Rydel, ''''Polityka historyczna
      w Republice Federalnej Niemiec. Zaszłości, Idee, Praktyka. ''''Kraków: Wydawnictwo
      Naukowe Uniwersytetu Pedagogicznego, 2011; Patryk Wawrzyński, ''''Sharing the
      Past: Specialized Institutions as an instrument of Politics of Memory in the
      21st Century'''', w: Ralph Schattkowsky i Milos Reznik, „Society and Nation
      in Transnational Processes in Europe”. Newcastle: Cambridge Scholar Publishing
      2014..

      Polityka historyczna wpływa na naturę i nazwy [[pomnik|pomników]] i muzeów,
      [[Ulica|ulic]], [[plac]]ów, miast i całych krajów{{Cytuj |autor = Zvinashe Mamvura
      |tytuł = ‘Let us make Zimbabwe in my own name’: Place naming and Mugabeism in
      Zimbabwe |czasopismo = South African Journal of African Languages |data = 2020-01-02
      |data dostępu = 2021-08-09 |issn = 0257-2117 |wolumin = 40 |numer = 1 |s = 32–39
      |doi = 10.1080/02572117.2019.1672343 }}, patronów placówek oświatowych i innych
      instytucji publicznych, osoby odznaczone [[order]]ami i [[medal]]ami za zasługiPor.
      na ten temat: red. Stanisław Kowolik, O polską politykę historyczną, IX Sympozjum
      Tarnogórskie, Tarnowskie Góry 2010., instytucje [[Świadomość historyczna|świadomości
      historycznej]] wspólnoty, a także wspierane przez państwo i samorządy badania
      naukowe, działania kulturalne i edukacyjno-wychowawcze.

      == Zagadnienie polityki historycznej w Polsce ==

      Także po okresie [[Polska Rzeczpospolita Ludowa|PRL]], kiedy to wdrażano [[Historiografia
      PRL|stosowną historiografię]], pojęcie polityki historycznej niejednokrotnie
      wzbudza w Polsce negatywne ocenyPor. na ten temat: red. Bartosz Korzeniewski,
      ''''Narodowe i europejskie aspekty polityki historycznej'''', Instytut Zachodni,
      Poznań 2008. Wątpliwości dotyczące obiektywizmu badań historycznych i ich prezentacji
      wyrażał również [[Dariusz Baliszewski]] pisząc w 2009: ''''Czy na tym właśnie,
      na wiecznym pudrowaniu [[prawda|prawdy]], polega nasza polityka historyczna,
      tak by w lustrze dziejów po prostu wyglądać ładnie?'''' - zob. {{Cytuj | autor
      = [[Dariusz Baliszewski]] | tytuł = Historia nadzwyczajna | miejsce = Wrocław
      | wydawca = Wydawnictwo Dolnośląskie | data = 2009 | s = 61}}. Politykę historyczną
      oskarża się bowiem o manipulację i wybiórcze traktowanie faktów historycznych{{Cytuj
      stronę |url = http://przegladdziennikarski.pl/prof-l-pastusiak-polityka-historyczna-czyli-manipulowanie-historia/
      |tytuł = Polityka historyczna, czyli manipulowanie historią |autor = [[Longin
      Pastusiak]] |data=10 lutego 2016|opublikowany = przegladdziennikarski.pl |data
      dostępu = 2017-05-07}}.

      Od 1999 roku funkcjonuje [[Instytut Pamięci Narodowej]], oraz [[Ministerstwo
      Kultury i Dziedzictwa Narodowego]], zaś od 2020 [[Instytut Dziedzictwa Myśli
      Narodowej im. Romana Dmowskiego i Ignacego Jana Paderewskiego]], których celem
      jest między innymi „realizacja polityki pamięci w zakresie historii i dziedzictwa
      Polski”.

      Definicje polskiej polityki historycznej często uwzględniają ideologię:

      # „Posługiwanie się przez demokratyczne (ale nie tylko) społeczeństwa własnymi
      interpretacjami wydarzeń z przeszłości do osiągania m.in. bieżących celów politycznych”Wypowiedź
      Dariusza Gawina w dyskusji w „Gazecie Wyborczej”: Po co nam polityka historyczna?,
      „Gazeta Wyborcza” z 30 września 2005..

      # „Świadome działanie klasy politycznej mające na celu kształtowanie zakresu
      i charakteru zbiorowej pamięci historycznej”Anna Wolff-Powęska Polskie spory
      o historię i pamięć. Polityka historyczna, „Przegląd Zachodni” 1-2007..

      # „Interpretacja tożsamości wspólnoty politycznej – w jej toku obywatele podejmują
      decyzje co do tego, jakie tradycje chcą kontynuować, a jakich nie”Wypowiedź
      Zbigniewa Krasnodębskiego, Polityka historyczna. Historycy – politycy – prasa.
      Konferencja pod honorowym patronatem Jana Nowaka-Jeziorańskiego, Pałac Raczyńskich
      w Warszawie, 15 grudnia 2004, Muzeum Powstania Warszawskiego, Warszawa 2005..

      # Wzmocnienie publicznego dyskursu o przeszłości poprzez różne formy instytucjonalizacji
      (instytucje centralne, państwowe, lokalne – samorządowe oraz regionalne)Por.
      wypowiedź Marka Cichockiego podczas rozmowy w redakcji „Mówią wieki” z dnia
      17 sierpnia 2006..

      W 2015 roku ogłoszono rozpoczęcie prac nad ''''Strategią Polskiej Polityki Historycznej,
      a'''' [[Prezydent Rzeczypospolitej Polskiej|prezydent RP]] [[Andrzej Duda]]
      stwierdził, że „prowadzenie polityki historycznej to jedno z najważniejszych
      działań prezydenta”{{Cytuj stronę |url = http://www.prezydent.pl/aktualnosci/wydarzenia/art,67,musimy-ksztaltowac-postawy-obywatelskie-i-patriotyczne.html
      |tytuł = Polityka historyczna służy budowaniu potencjału państwa |opublikowany
      = prezydent.pl |data = 17 listopada 2015 |data dostępu = 2015-11-22}}.

      == Polityka historyczna na świecie ==

      === Gwatemala ===

      [[Plik:Exhumation_in_San_Juan_Comalapa_Guatemala_03.jpg|mały|Ekshumacja ofiar
      in San Juan Compalapa, [[Chimaltenango (departament)|Chimaltenango]] w 2005,
      w ramach polityki historycznej]]

      Uchwalono tam ustawę i wdrożono projekt z Komisją Gwatemalskiego Oświecenia
      Historycznego ({{Hiszp.|Comisión para el Esclarecimiento Histórico de Guatemala}}),
      która chroni pamięć [[Wojna domowa w Gwatemali|masakr ​​w latach 1960-1996]],
      gdy zamordowano około 200 000 osób a zaginęło 45 000 osób{{Cytuj |tytuł = El
      documento clave para encontrar la verdad en Guatemala |url = https://centrodememoriahistorica.gov.co/el-documento-clave-para-encontrar-la-verdad-en-guatemala/}}.

      Równolegle w 1995 roku rozpoczęto wspierany przez [[Kościół Rzymsko-Katolicki|KRK]]
      niezależny Projekt Odzyskiwania Pamięci Historycznej (REMHI, {{Hiszp.|Recuperación
      de la Memoria Histórica}}), który zgromadził prawie 6000 zeznań o okrucieństwach
      popełnionych podczas ponad trzech dekad wojny domowej{{Cytuj |autor = United
      Nations High Commissioner for Refugees |tytuł = Refworld {{!}} Guatemala: The
      Commission for the Recovery of National Memories; treatment of those who may
      have spoken with this commission or other similar commissions regarding war-time
      abuses (1996−1999) |data dostępu = 2021-12-15 |opublikowany = Refworld |url
      = https://www.refworld.org/docid/3ae6ad4d58.html |język = en}}.

      Dwa dni po ogłoszeniu w kwietniu 1998 roku raportu REMHI o takim odzyskaniu
      narodowej pamięci historycznej: "Nigdy więcej w Gwatemali!" ({{Hiszp.|Guatemala:
      Nunca Más!}}) o ofiarach tej wojny domowej, w którym w 80 procentach zbrodnie
      te przypisano Armii Gwatemalskiej i nazywając ją też holokaustem ({{Hiszp.|Holocausto
      silencioso}}){{Cytuj |tytuł = GENOCIDE - GUATEMALA |data = 2004-02-03 |data
      dostępu = 2021-12-15 |opublikowany = web.archive.org |url = https://web.archive.org/web/20040203052222/http://www.ppu.org.uk/genocide/g_guatemala1.html}},
      jej współautor biskup {{link-interwiki|Juan José Gerardi Conedera|Q=Q1380832}}
      został zaatakowany w garażu i pobity na śmierć przez trzech oficerów Armii Gwatemalskiej{{Cytuj
      |tytuł = Anniversary of the Assassination of Bishop José Gerardi |data dostępu
      = 2021-12-15 |opublikowany = Education for Justice |url = https://educationforjustice.org/events/anniversary-of-the-assassination-of-bishop-jose-gerardi/
      |język = en}}{{Cytuj |tytuł = The Art of Political Murder: Who killed Bishop
      Gerardi?, by Francisco |data = 2008-03-16 |data dostępu = 2021-12-15 |opublikowany
      = The Independent |url = https://www.independent.co.uk/arts-entertainment/books/reviews/the-art-of-political-murder-who-killed-bishop-gerardi-by-francisco-goldman-795533.html
      |język = en}}.

